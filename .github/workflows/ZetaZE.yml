name: ZetaZE zeros pipeline

on:
  workflow_dispatch:
    inputs:
      zeros_per_run:
        description: "How many new zeta zeros to compute this run"
        required: true
        default: 500
        type: number
      analysis_mode:
        description: "full, zeros_only, or analysis_only"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - zeros_only
          - analysis_only
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: zeta-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Zeta zeros pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check runner resources
        shell: bash
        run: |
          set -euo pipefail
          RAM_MB="$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)"
          DISK_GB="$(df -BG . | awk 'NR==2 {gsub("G","",$4); print $4}')"
          echo "Available RAM: ${RAM_MB} MB"
          echo "Available disk: ${DISK_GB} GB"
          if [ "$RAM_MB" -lt 12000 ]; then
            echo "::error::At least 12 GB RAM required."
            exit 1
          fi
          if [ "$DISK_GB" -lt 20 ]; then
            echo "::error::At least 20 GB free disk required."
            exit 1
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install mpmath numpy requests

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "${OLLAMA_BASE_URL}/api/tags" >/dev/null 2>&1; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama failed to start."
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull available Qwen models
        shell: bash
        run: |
          set -u
          mkdir -p zeta/state

          MODELS=(
            "qwen2.5-coder:1.5b"
            "qwen2.5-coder:3b"
            "qwen2.5-coder:7b"
            "qwen2.5-coder:14b"
          )

          : > zeta/state/available_models.txt

          for model in "${MODELS[@]}"; do
            echo "Pulling ${model}..."
            if ollama pull "${model}"; then
              echo "${model}" >> zeta/state/available_models.txt
              echo "Available: ${model}"
            else
              echo "::warning::Could not pull ${model}; continuing without it."
            fi
          done

          if [ ! -s zeta/state/available_models.txt ]; then
            echo "::error::No Qwen coder model could be loaded."
            exit 1
          fi

          echo "Available cascade:"
          cat zeta/state/available_models.txt

      - name: Warm available models
        shell: bash
        run: |
          set -u
          while IFS= read -r model; do
            [ -z "$model" ] && continue
            echo "Warming ${model}..."
            if ! curl -fsS \
              "${OLLAMA_BASE_URL}/api/generate" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"${model}\",\"prompt\":\"Return only OK.\",\"stream\":false}" \
              >/dev/null; then
              echo "::warning::Warmup failed for ${model}."
            fi
          done < zeta/state/available_models.txt

      - name: Run zeta pipeline
        shell: bash
        env:
          ZEROS_PER_RUN: ${{ inputs.zeros_per_run }}
          ANALYSIS_MODE: ${{ inputs.analysis_mode }}
        run: |
          set -euo pipefail

          cat > zeta/pipeline.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path
          from typing import Any, Dict, List, Optional

          import numpy as np
          import requests
          from mpmath import mp, siegelz, findroot, mpf, zetazero

          mp.dps = 30

          OLLAMA_BASE_URL = os.getenv("OLLAMA_BASE_URL", "http://127.0.0.1:11434")
          OLLAMA = f"{OLLAMA_BASE_URL}/api/generate"

          ROOT = Path(".").resolve()
          ZETA_DIR = ROOT / "zeta"
          STATE_DIR = ZETA_DIR / "state"
          REPORT_DIR = ZETA_DIR / "reports"

          ZEROS_FILE = ZETA_DIR / "zeros.txt"
          MODELS_FILE = STATE_DIR / "available_models.txt"

          REQUEST_TIMEOUT = 600
          MAX_RETRIES = 2

          def now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

          def stamp() -> str:
              return time.strftime("%Y%m%dT%H%M%SZ", time.gmtime())

          def atomic_write_json(path: Path, data: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False),
                  encoding="utf-8",
              )
              tmp.replace(path)

          def load_zeros() -> np.ndarray:
              if not ZEROS_FILE.exists():
                  return np.array([])
              out = []
              with open(ZEROS_FILE) as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          out.append(float(line))
                      except ValueError:
                          continue
              return np.array(out)

          def append_zero(g: float) -> None:
              ZEROS_FILE.parent.mkdir(parents=True, exist_ok=True)
              with open(ZEROS_FILE, "a") as f:
                  f.write(f"{g:.17g}\n")

          def next_zero(gamma_prev: float, k_next: int) -> float:
              if gamma_prev < 14:
                  step = 3.0
              else:
                  step = 2 * np.pi / np.log(gamma_prev / (2 * np.pi))
                  step = max(step, 0.5)

              t0 = mpf(gamma_prev) + mpf("0.5")
              t = t0
              z_prev = siegelz(t0)

              for _ in range(1000):
                  t_next = t + mpf(str(step))
                  z_next = siegelz(t_next)
                  if z_prev * z_next < 0:
                      try:
                          root = findroot(
                              siegelz,
                              (t, t_next),
                              solver="bisect",
                              tol=mpf("1e-25"),
                          )
                          return float(root)
                      except Exception:
                          a, b = t, t_next
                          za = siegelz(a)
                          for _ in range(80):
                              m = (a + b) / 2
                              zm = siegelz(m)
                              if za * zm < 0:
                                  b = m
                              else:
                                  a, za = m, zm
                          return float((a + b) / 2)
                  t = t_next
                  z_prev = z_next

              print(f"    fallback for k = {k_next}")
              return float(zetazero(k_next).imag)

          def extend_zeros(n_new: int) -> np.ndarray:
              gammas = list(load_zeros())

              if len(gammas) == 0:
                  print("No zeros on disk. Seeding from scratch...")
                  g1 = float(zetazero(1).imag)
                  append_zero(g1)
                  gammas = [g1]

              print(f"Starting with {len(gammas)} zeros. Computing {n_new} more...")
              last = gammas[-1]

              for i in range(n_new):
                  k_next = len(gammas) + 1
                  last = next_zero(last, k_next)
                  gammas.append(last)
                  append_zero(last)
                  if (i + 1) % 50 == 0:
                      print(f"  +{i+1}, gamma = {last:.6f}, n = {len(gammas)}")

              return np.array(gammas)

          def ollama_ask_json(
              model: str,
              prompt: str,
              temperature: float = 0.1,
          ) -> Optional[Dict[str, Any]]:
              payload = {
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "format": "json",
                  "options": {"temperature": temperature, "num_ctx": 8192},
              }

              for attempt in range(MAX_RETRIES + 1):
                  try:
                      r = requests.post(
                          OLLAMA,
                          json=payload,
                          timeout=REQUEST_TIMEOUT,
                      )
                      r.raise_for_status()
                      raw = r.json().get("response", "").strip()
                      if not raw:
                          raise ValueError("empty response")

                      raw = re.sub(r"^```(?:json)?\s*", "", raw, flags=re.IGNORECASE)
                      raw = re.sub(r"\s*```$", "", raw)
                      start = raw.find("{")
                      end = raw.rfind("}")
                      if start >= 0 and end > start:
                          raw = raw[start:end + 1]

                      value = json.loads(raw)
                      if isinstance(value, dict):
                          return value
                  except Exception as exc:
                      print(f"  Ollama error [{model}]: {exc}")
                      if attempt < MAX_RETRIES:
                          time.sleep(2 * (attempt + 1))

              return None

          ROLE_SPECS = [
              {"role": "extractor", "ideal_size": "1.5b"},
              {"role": "scanner", "ideal_size": "3b"},
              {"role": "analyst", "ideal_size": "7b"},
              {"role": "synthesizer", "ideal_size": "14b"},
          ]

          def assign_roles(available_models: List[str]) -> Dict[str, Optional[str]]:
              parsed = []
              for name in available_models:
                  m = re.search(r":(\d+(?:\.\d+)?)b", name)
                  size = float(m.group(1)) if m else 0.0
                  parsed.append((size, name))
              parsed.sort()

              assignment: Dict[str, Optional[str]] = {}
              used: set = set()

              for spec in ROLE_SPECS:
                  ideal_val = float(spec["ideal_size"].rstrip("b"))
                  pick = None

                  for size, name in parsed:
                      if name in used:
                          continue
                      if abs(size - ideal_val) < 0.001:
                          pick = name
                          break

                  if pick is None:
                      for size, name in parsed:
                          if name in used:
                              continue
                          if size > ideal_val:
                              pick = name
                              break

                  if pick is None:
                      for size, name in reversed(parsed):
                          if name in used:
                              continue
                          if size < ideal_val:
                              pick = name
                              break

                  if pick is None:
                      for _, name in parsed:
                          if name not in used:
                              pick = name
                              break

                  if pick:
                      used.add(pick)

                  assignment[spec["role"]] = pick

              if not assignment.get("synthesizer") and parsed:
                  assignment["synthesizer"] = parsed[-1][1]

              return assignment

          EXTRACTOR_PROMPT = """
          You are the extraction phase of a mathematical analysis pipeline.

          You structure raw data. You do NOT reason or interpret.

          You have {count} nontrivial zeros of the Riemann zeta function
          on the critical line s = 1/2 + i*gamma.

          Last 40 values:
          {sample}

          Return exactly:

          {{
            "count": {count},
            "first": 0.0,
            "last": 0.0,
            "min_gamma": 0.0,
            "max_gamma": 0.0,
            "mean_spacing_recent_30": 0.0,
            "std_spacing_recent_30": 0.0,
            "largest_gap_recent_30": 0.0,
            "smallest_gap_recent_30": 0.0,
            "spacings_recent_30": [0.0],
            "predicted_mean_spacing": 0.0
          }}

          Rules:
          - Numbers are numbers, not strings.
          - predicted_mean_spacing uses 2*pi / ln(last / (2*pi)).
          - spacings_recent_30 has 30 values from the last 31 gammas.
          - No extra fields. JSON only.
          """

          SCANNER_PROMPT = """
          You are the scanning phase. You detect patterns in structured data.

          Extraction phase output:
          {extraction}

          Look at spacings_recent_30 and the stats. Identify clusters,
          large gaps, periodicity, and anomalies.

          Return exactly:

          {{
            "clusters": [{{"index_range": [0,0], "spacings": [0.0], "why_notable": "text"}}],
            "large_gaps": [{{"index": 0, "gap": 0.0, "relative_to_mean": 0.0}}],
            "periodicity_observed": false,
            "anomalies": ["text"],
            "notes": "one paragraph"
          }}

          Do not claim any RH result. JSON only.
          """

          ANALYST_PROMPT = """
          You are the analysis phase. Compare data to established theory.

          Extraction:
          {extraction}

          Scanning:
          {scanning}

          Reference theory:

          1. Riemann-von Mangoldt local density near height T:
             rho(T) = (1 / (2*pi)) * ln(T / (2*pi))
             Predicted mean spacing = 1 / rho(T) = 2*pi / ln(T / (2*pi))

          2. GUE nearest-neighbor spacing distribution:
             p(s) = (32 / pi^2) * s^2 * exp(-4*s^2 / pi)
             Mean 1, std ~0.422.

          3. GUE repulsion p(s) -> 0 as s -> 0. Poisson would be p(s) = exp(-s).

          Tasks:
          a) density_ratio = observed mean spacing / predicted mean spacing.
          b) Compare observed spacing std to 0.422.
          c) State what the data is and is not consistent with.
          d) State clearly that finite data cannot decide RH.

          Return exactly:

          {{
            "density_ratio": 0.0,
            "density_consistent_with_rvm": false,
            "spacing_std": 0.0,
            "spacing_std_gue_prediction": 0.422,
            "spacing_consistent_with_gue": false,
            "mathematical_observations": ["text"],
            "rh_status": {{
              "is_proven": false,
              "is_disproven": false,
              "can_this_data_decide": false,
              "reasoning": "text"
            }},
            "what_would_be_needed": ["text"],
            "honest_limits": ["text"]
          }}

          Never claim a proof exists. JSON only.
          """

          SYNTHESIZER_PROMPT = """
          You are the synthesis phase. Write the honest report.

          Extraction:
          {extraction}

          Scanning:
          {scanning}

          Analysis:
          {analysis}

          You may speculate on connections between zeta zero patterns,
          coding practice or AI models, and physics. Mark every speculation
          with confidence <= 0.3 and speculative: true.

          Return exactly:

          {{
            "final_status": {{
              "riemann_hypothesis_solved": false,
              "confidence": 0.99,
              "reasoning": "text"
            }},
            "confirmed_findings": [{{"finding": "text", "confidence": 0.0}}],
            "open_questions": ["text"],
            "numerology_speculations": [{{"speculation": "text", "confidence": 0.0, "speculative": true}}],
            "coding_practice_speculations": [{{"speculation": "text", "confidence": 0.0, "speculative": true}}],
            "physics_speculations": [{{"speculation": "text", "confidence": 0.0, "speculative": true}}],
            "honest_summary": "paragraph",
            "next_realistic_steps": ["text"]
          }}

          Never claim RH is solved. Mark every speculation speculative.
          JSON only.
          """

          def run_role(role: str, model: str, prompt: str, out_path: Path):
              print(f"\n  [{role}] using {model}...")
              result = ollama_ask_json(model, prompt)
              if result is None:
                  print(f"    {role} produced no valid JSON.")
                  return None
              result["_meta"] = {
                  "role": role,
                  "model": model,
                  "generated_at": now(),
              }
              atomic_write_json(out_path, result)
              print(f"    {role} complete.")
              return result

          # =========================================================
          # TORRIDITY / MOND CHECK
          # =========================================================

          def torridity_check(gammas: np.ndarray) -> Dict[str, Any]:
              n_exp = np.pi / 3.0
              rho_obs = np.log(gammas / (2 * np.pi)) / (2 * np.pi)

              if len(rho_obs) < 8:
                  return {"error": "not enough zeros"}

              rho_c = float(rho_obs[7])

              z = rho_obs / rho_c
              mu_T = z / (1 + z ** n_exp) ** (1.0 / n_exp)
              rho_N = rho_obs * mu_T

              residual = rho_obs - rho_N
              ratio = rho_obs / np.where(rho_N > 0, rho_N, np.nan)

              return {
                  "n_exp": float(n_exp),
                  "rho_c": rho_c,
                  "rho_c_source": "rho_obs at gamma_8 (8th zero)",
                  "rho_obs_first": float(rho_obs[0]),
                  "rho_obs_last": float(rho_obs[-1]),
                  "rho_N_first": float(rho_N[0]),
                  "rho_N_last": float(rho_N[-1]),
                  "residual_first": float(residual[0]),
                  "residual_last": float(residual[-1]),
                  "residual_mean": float(np.mean(residual)),
                  "residual_std": float(np.std(residual)),
                  "ratio_first": float(ratio[0]),
                  "ratio_last": float(ratio[-1]),
                  "ratio_mean": float(np.nanmean(ratio)),
                  "ratio_std": float(np.nanstd(ratio)),
                  "ratio_max": float(np.nanmax(ratio)),
                  "ratio_min": float(np.nanmin(ratio)),
              }

          # =========================================================
          # RAR FORMAT EXPORT (SPARC alldata.txt style)
          # =========================================================

          def write_rar_format(gammas: np.ndarray, torridity: Dict[str, Any]) -> None:
              n_exp = float(torridity.get("n_exp", np.pi / 3.0))
              rho_c = float(torridity.get("rho_c", 0.0))

              if rho_c <= 0:
                  return

              rho_obs = np.log(gammas / (2 * np.pi)) / (2 * np.pi)
              z = rho_obs / rho_c
              mu = z / (1 + z ** n_exp) ** (1.0 / n_exp)
              rho_N = rho_obs * mu

              with np.errstate(divide="ignore", invalid="ignore"):
                  log_rho_N = np.log10(rho_N)
                  log_rho_obs = np.log10(rho_obs)

              e_log_rho_N = np.zeros_like(log_rho_N)
              e_log_rho_obs = np.zeros_like(log_rho_obs)

              order = np.argsort(log_rho_N)

              out_path = ZETA_DIR / "rar_format.txt"
              with open(out_path, "w", encoding="utf-8") as f:
                  for i in order:
                      f.write(
                          f"{log_rho_N[i]:.2f} {e_log_rho_N[i]:.2f} "
                          f"{log_rho_obs[i]:.2f} {e_log_rho_obs[i]:.2f}\n"
                      )

              print(f"  wrote {out_path} ({len(order)} rows)")

          # =========================================================
          # TABLES2 FORMAT EXPORT (SPARC tables2.txt style)
          # =========================================================
          # Quadratic three-term decomposition:
          #   rho_obs^2 = Vgas^2 + Vdisk^2 + Vbulge^2
          # with Vgas = rho_N, Vdisk = residual, Vbulge = cross term.

          def write_tables2_format(gammas: np.ndarray, torridity: Dict[str, Any]) -> None:
              n_exp = float(torridity.get("n_exp", np.pi / 3.0))
              rho_c = float(torridity.get("rho_c", 0.0))

              if rho_c <= 0:
                  return

              n_total = len(gammas)
              rho_obs = np.log(gammas / (2 * np.pi)) / (2 * np.pi)
              z = rho_obs / rho_c
              mu = z / (1 + z ** n_exp) ** (1.0 / n_exp)
              rho_N = rho_obs * mu
              residual = rho_obs - rho_N

              cross_sq = 2.0 * rho_N * residual
              cross_sq = np.where(cross_sq > 0, cross_sq, 0.0)
              cross = np.sqrt(cross_sq)

              spacings = np.diff(gammas, prepend=gammas[0])
              spacing_std = float(np.std(np.diff(gammas))) if n_total > 1 else 0.0

              out_path = ZETA_DIR / "tables2_format.txt"
              with open(out_path, "w", encoding="utf-8") as f:
                  for i in range(n_total):
                      name = f"Z{i+1:06d}"
                      dist = float(spacings[i])
                      rad = i / max(n_total - 1, 1)
                      vobs = float(rho_obs[i])
                      evobs = spacing_std
                      vgas = float(rho_N[i])
                      vdisk = float(residual[i])
                      vbulge = float(cross[i])
                      sbdisk = float(mu[i])
                      sbbulge = float(z[i])
                      f.write(
                          f"{name:<10s} "
                          f"{dist:>8.6f} "
                          f"{rad:>6.4f} "
                          f"{vobs:>10.8f} "
                          f"{evobs:>8.6f} "
                          f"{vgas:>10.8f} "
                          f"{vdisk:>10.8f} "
                          f"{vbulge:>10.8f} "
                          f"{sbdisk:>10.8f} "
                          f"{sbbulge:>10.8f}\n"
                      )

              print(f"  wrote {out_path} ({n_total} rows)")

          # =========================================================
          # DETAILED REPORT
          # =========================================================

          def write_detailed_report(
              gammas: np.ndarray,
              extraction: Dict[str, Any],
              scanning: Dict[str, Any],
              analysis: Dict[str, Any],
              synthesis: Dict[str, Any],
              torridity: Dict[str, Any],
              roles: Dict[str, Optional[str]],
              run_stamp: str,
              zeros_added: int,
          ) -> str:
              g = gammas
              spacings = np.diff(g)
              n_total = len(g)

              if len(spacings) > 0:
                  mean_sp = float(np.mean(spacings))
                  std_sp = float(np.std(spacings))
                  median_sp = float(np.median(spacings))
                  min_sp = float(np.min(spacings))
                  max_sp = float(np.max(spacings))
                  last30 = spacings[-30:]
                  mean_last30 = float(np.mean(last30))
                  std_last30 = float(np.std(last30))
                  q25 = float(np.quantile(spacings, 0.25))
                  q75 = float(np.quantile(spacings, 0.75))
              else:
                  mean_sp = std_sp = median_sp = min_sp = max_sp = 0.0
                  mean_last30 = std_last30 = 0.0
                  q25 = q75 = 0.0

              last_gamma = float(g[-1])
              first_gamma = float(g[0])
              predicted_last = float(2 * np.pi / np.log(last_gamma / (2 * np.pi)))
              predicted_first = (
                  float(2 * np.pi / np.log(first_gamma / (2 * np.pi)))
                  if first_gamma > 2 * np.pi else 0.0
              )

              n_exp = float(torridity.get("n_exp", np.pi / 3.0))
              rho_c = float(torridity.get("rho_c", 0.0))

              rho_obs_all = np.log(g / (2 * np.pi)) / (2 * np.pi)
              if rho_c > 0:
                  z_all = rho_obs_all / rho_c
                  mu_all = z_all / (1 + z_all ** n_exp) ** (1.0 / n_exp)
                  rho_N_all = rho_obs_all * mu_all
                  resid_all = rho_obs_all - rho_N_all
                  ratio_all = rho_obs_all / np.where(rho_N_all > 0, rho_N_all, np.nan)
              else:
                  z_all = np.zeros_like(rho_obs_all)
                  mu_all = np.zeros_like(rho_obs_all)
                  rho_N_all = np.zeros_like(rho_obs_all)
                  resid_all = np.zeros_like(rho_obs_all)
                  ratio_all = np.full_like(rho_obs_all, np.nan)

              def dump_json_block(obj: Any) -> List[str]:
                  text = json.dumps(obj, indent=2, ensure_ascii=False, default=str)
                  return text.splitlines()

              lines: List[str] = []
              add = lines.append

              add("# ZetaZE Detailed Report")
              add("")
              add(f"**Run stamp:** `{run_stamp}`  ")
              add(f"**Generated:** {now()}  ")
              add(f"**Zeros added this run:** {zeros_added}  ")
              add(f"**Total zeros on disk:** {n_total}  ")
              add("")
              add("---")
              add("")

              add("## 1. Executive summary")
              add("")
