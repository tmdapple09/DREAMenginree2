                  md.append(f"- {f.get('finding', '')} ({f.get('confidence', 0.0)})")
              md.append("")

              md.append("## Numerology (speculative)")
              for s in synthesis.get("numerology_speculations", []):
                  md.append(f"- {s.get('speculation', '')} ({s.get('confidence', 0.0)})")
              md.append("")

              md.append("## Coding practice (speculative)")
              for s in synthesis.get("coding_practice_speculations", []):
                  md.append(f"- {s.get('speculation', '')} ({s.get('confidence', 0.0)})")
              md.append("")

              md.append("## Physics (speculative)")
              for s in synthesis.get("physics_speculations", []):
                  md.append(f"- {s.get('speculation', '')} ({s.get('confidence', 0.0)})")
              md.append("")

              md.append("## Honest summary")
              md.append(synthesis.get("honest_summary", "N/A"))
              md.append("")

              md.append("## Next realistic steps")
              for step in synthesis.get("next_realistic_steps", []):
                  md.append(f"- {step}")

              (ZETA_DIR / "latest.md").write_text("\n".join(md), encoding="utf-8")

              print("\n=== WRITING DETAILED REPORT ===")
              write_detailed_report(
                  gammas=gammas,
                  extraction=extraction,
                  scanning=scanning,
                  analysis=analysis,
                  synthesis=synthesis,
                  torridity=torridity,
                  roles=roles,
                  run_stamp=final_report["run_stamp"],
                  zeros_added=n_new,
              )
              print(f"  wrote {ZETA_DIR / 'DETAILED_REPORT.md'}")

              print("\n=== PIPELINE COMPLETE ===")
              print(f"Zeros total: {len(gammas)}")
              print(f"RH solved: {fs.get('riemann_hypothesis_solved', False)}")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY

          python3 zeta/pipeline.py

      - name: Commit and push results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p zeta/state zeta/reports

          [ -f zeta/zeros.txt ] || touch zeta/zeros.txt
          [ -f zeta/state/skip.txt ] || touch zeta/state/skip.txt

          if [ ! -f zeta/README.md ]; then
            cat > zeta/README.md <<'EOF'
            # Zeta zeros state

            Managed by the Zeta zeros pipeline workflow.

            - `zeros.txt` — append-only, one gamma per line, 17 sig figs.
            - `latest.json` — most recent full report (JSON).
            - `latest.md` — most recent full report (Markdown).
            - `DETAILED_REPORT.md` — full human-readable report.
            - `rar_format.txt` — SPARC alldata.txt-style export.
            - `tables2_format.txt` — SPARC tables2.txt-style export.
            - `reports/` — timestamped history of every run's JSON report.
            - `state/` — pipeline scratch (model list, skip list, per-phase output).

            Do not edit `zeros.txt` by hand. Let the workflow append.
            EOF
          fi

          git config user.name "zeta-pipeline-bot"
          git config user.email "zeta-pipeline-bot@users.noreply.github.com"

          git add zeta/

          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          ZERO_COUNT=0
          if [ -f zeta/zeros.txt ]; then
            ZERO_COUNT=$(wc -l < zeta/zeros.txt)
          fi

          git commit -m "zeta: run ${GITHUB_RUN_NUMBER}, total ${ZERO_COUNT} zeros"

          git pull --rebase --autostash || true
          git push
