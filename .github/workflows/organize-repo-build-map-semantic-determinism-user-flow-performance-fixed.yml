              is_test_file: bool
              is_workflow: bool
              is_component_like: bool
              line_count: int

          def safe_part(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"[^a-z0-9._-]+", "_", value)
              value = re.sub(r"_+", "_", value).strip("_")
              return value or "uncategorized"

          def git_files() -> List[str]:
              try:
                  raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=REPO)
                  files = [p for p in raw.decode("utf-8", errors="replace").split("\0") if p]
              except Exception:
                  files = [
                      str(path.relative_to(REPO)).replace("\\", "/")
                      for path in REPO.rglob("*")
                      if path.is_file()
                  ]
              return [
                  p for p in files
                  if Path(p).name not in GENERATED_NAMES
                  and not any(part in SKIP_SCAN_DIRS for part in Path(p).parts)
              ]

          def is_probably_text_path(path: Path) -> bool:
              suffix = path.suffix.lower()
              if suffix in BINARY_EXTENSIONS:
                  return False
              if suffix in TEXT_EXTENSIONS:
                  return True
              if path.name in {"Dockerfile", "LICENSE", "Makefile", ".gitignore", ".gitleaks.toml", ".cursorrules"}:
                  return True
              return False

          def read_text(path: Path, limit: int = 900_000) -> Tuple[str, bool]:
              if not path.exists() or not path.is_file():
                  return "", False
              if not is_probably_text_path(path):
                  return "", False
              try:
                  data = path.read_bytes()
              except Exception:
                  return "", False
              if len(data) > limit:
                  data = data[:limit]
              return data.decode("utf-8", errors="replace"), True

          def facts_for(rel: str) -> FileFacts:
              path = REPO / rel
              suffix = path.suffix.lower()
              text, is_text = read_text(path)
              path_lower = rel.lower()
              name_lower = path.name.lower()
              lower = text.lower()
              is_ts = suffix in {".ts", ".tsx", ".mts", ".cts"}
              is_tsx = suffix == ".tsx"
              is_jsx = suffix == ".jsx"
              is_route_file = name_lower == "route.ts" or name_lower == "route.js" or "/route." in path_lower
              is_page_file = name_lower in {"page.tsx", "page.ts", "page.jsx", "page.js"} or "/page." in path_lower
              is_layout_file = name_lower in {"layout.tsx", "layout.ts", "layout.jsx", "layout.js"} or "/layout." in path_lower
              is_test_file = (
                  "/tests/" in f"/{path_lower}" or
                  name_lower.endswith(".test.ts") or name_lower.endswith(".test.tsx") or
                  name_lower.endswith(".spec.ts") or name_lower.endswith(".spec.tsx") or
                  "describe(" in lower and "expect(" in lower
              )
              is_workflow = path_lower.startswith(".github/workflows/") or path_lower.startswith(".github/ruleset/")
              is_component_like = (
                  is_tsx or is_jsx or
                  "export default function" in lower and "return (" in lower or
                  "react" in lower and "jsx" in lower
              )
              return FileFacts(
                  rel=rel,
                  path_lower=path_lower,
                  name_lower=name_lower,
                  suffix=suffix,
                  text=text,
                  lower=lower,
                  is_text=is_text,
                  is_binary=not is_text,
                  is_typescript=is_ts,
                  is_tsx=is_tsx,
                  is_jsx=is_jsx,
                  is_markdown=suffix in {".md", ".mdx"},
                  is_sql=suffix == ".sql",
                  is_yaml=suffix in {".yml", ".yaml"},
                  is_json=suffix == ".json",
                  is_css=suffix in {".css", ".scss"},
                  is_page_file=is_page_file,
                  is_layout_file=is_layout_file,
                  is_route_file=is_route_file,
                  is_test_file=is_test_file,
                  is_workflow=is_workflow,
                  is_component_like=is_component_like,
                  line_count=text.count("\n") + (1 if text else 0),
              )

          def contains_any(haystack: str, needles: Iterable[str]) -> bool:
              return any(needle.lower() in haystack for needle in needles)

          def count_any(haystack: str, needles: Iterable[str]) -> int:
              return sum(haystack.count(needle.lower()) for needle in needles)

          def regex_any(patterns: Iterable[str], haystack: str) -> bool:
              return any(re.search(pattern, haystack, flags=re.IGNORECASE | re.MULTILINE) for pattern in patterns)

          SEMANTIC_STOPWORDS = {
              "a", "an", "and", "or", "the", "to", "of", "in", "on", "for", "from", "with", "by", "as",
              "true", "false", "null", "undefined", "return", "const", "let", "var", "function", "class", "export",
              "import", "type", "interface", "props", "state", "data", "item", "items", "value", "values", "result",
              "error", "errors", "response", "request", "default", "async", "await", "new", "set", "get",
          }

          def split_identifier_words(value: str) -> List[str]:
              value = re.sub(r"([a-z0-9])([A-Z])", r"\1 \2", value)
              value = re.sub(r"[^A-Za-z0-9]+", " ", value)
              return [part.lower() for part in value.split() if len(part) >= 3 and part.lower() not in SEMANTIC_STOPWORDS]

          def extract_import_sources(text: str) -> List[str]:
              sources: List[str] = []
              patterns = [
                  r"import\s+(?:type\s+)?(?:[^;]+?)\s+from\s+['\"]([^'\"]+)['\"]",
                  r"import\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",
                  r"require\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, flags=re.MULTILINE):
                      sources.append(match.group(1))
              return sources[:120]

          def extract_exported_symbols(text: str) -> List[str]:
              symbols: List[str] = []
              patterns = [
                  r"export\s+(?:default\s+)?(?:async\s+)?function\s+([A-Za-z0-9_]+)",
                  r"export\s+(?:const|let|var)\s+([A-Za-z0-9_]+)",
                  r"export\s+(?:type|interface|class|enum)\s+([A-Za-z0-9_]+)",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, flags=re.MULTILINE):
                      symbols.append(match.group(1))
              return symbols[:120]

          def extract_jsx_tags(text: str) -> Set[str]:
              tags: Set[str] = set()
              for match in re.finditer(r"<\s*([A-Za-z][A-Za-z0-9_.:-]*)", text):
                  tag = match.group(1).lower()
                  if tag not in {"fragment", "react.fragment"}:
                      tags.add(tag)
              return tags

          def extract_event_handlers(text: str) -> Set[str]:
              handlers: Set[str] = set()
              for match in re.finditer(r"\b(on[A-Z][A-Za-z0-9_]+)\s*=", text):
                  handlers.add(match.group(1).lower())
              for match in re.finditer(r"addEventListener\s*\(\s*['\"]([^'\"]+)['\"]", text):
                  handlers.add(match.group(1).lower())
              return handlers

          def semantic_terms_for(f: FileFacts) -> Set[str]:
              terms: Set[str] = set()
              for part in Path(f.rel).parts:
                  terms.update(split_identifier_words(part))
              for source in extract_import_sources(f.text):
                  terms.update(split_identifier_words(source))
              for symbol in extract_exported_symbols(f.text):
                  terms.update(split_identifier_words(symbol))
              for tag in extract_jsx_tags(f.text):
                  terms.update(split_identifier_words(tag))
              return terms

          def has_function_call(haystack: str, name: str) -> bool:
              return re.search(rf"\b{re.escape(name.lower())}\s*\(", haystack, flags=re.IGNORECASE) is not None

          def semantic_summary_for(f: FileFacts, category: str, subfolder: str, area: str, behavior: str) -> str:
              role = file_role(f)
              p = f.path_lower
              h = f.lower
              if role == "api_route":
                  methods = re.findall(r"export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE)", f.text)
                  method_text = "/".join(methods) if methods else "HTTP"
                  return f"{method_text} API route handling request/response work for {area}."
              if role == "server_action":
                  return f"server-only action logic for {area}."
              if role == "sql_schema":
                  if "create policy" in h or "row level security" in h:
                      return "database schema with security/RLS policy behavior."
                  if "create table" in h:
                      return "database table/schema definition."
                  return "database migration/schema behavior."
              if category == "12_performance":
                  return "performance/rendering/runtime cost file handling frame budget, GPU/render work, latency, memory, caching, or benchmarks."
              if role == "page_screen":
                  if category == "01_define_user_flow":
                      return "user-flow route surface defining an entry, state, access path, recovery path, or user journey step."
                  return f"Next.js screen/route surface for {area}."
              if role == "component_surface":
                  handlers = sorted(extract_event_handlers(f.text))[:5]
                  if handlers:
                      return f"React visible surface/component with interaction handlers: {', '.join(handlers)}."
                  return "React visible surface/component structure."
              if role == "hook":
                  return "React hook managing state, runtime, events, or interactions."
              if role == "engine_runtime":
                  return "core runtime/state/sync/execution code."
              if role == "engin_domain":
                  if "/brain/" in p:
                      return "Engin brain/knowledge/data file; not user-flow behavior."
                  if "ruleset" in p or "ruleset" in h:
                      return "Engin rule-set behavior: constraints, transformations, or parameters."
                  return f"Engin-owned domain behavior for {area}."
              if role == "data_json":
                  return "structured JSON data/config/manifest."
              if role == "env_example":
                  return "environment variable example/configuration for local, deployment, API, auth, service, or feature setup."
              if role == "agent_instruction":
                  return "agent/developer instruction file for DREAMengin work."
              if role == "documentation":
                  return "documentation/instructions/reference content."
              if role in {"asset_binary", "asset_source"}:
                  return "static asset/content file."
              if role == "workflow":
                  return "GitHub Actions workflow/tooling automation."
              if role == "package_manager":
                  return "package/dependency workspace configuration."
              if role == "tool_config":
                  return "tooling/configuration file for TypeScript, lint, tests, styles, build, or automation."
              if role == "script_tooling":
                  return "repository script for build, repair, validation, generation, export, or release support."
              if role == "backend_supabase":
                  return "Supabase/backend configuration or integration behavior."
              if role == "agent_behavior":
                  return "agent/admin/product behavior source file."
              if role == "style":
                  return "style/design-token file."
              if role == "test":
                  return "verification/test coverage file."
              return "source file supporting DREAMengin behavior."

          def behavior_proofs_for(f: FileFacts) -> List[str]:
              """Crayon-test behavior proof: what the file actually does on paper.

              This does not use path names as proof. It looks for structural behavior:
              route exports, SQL operations, JSX elements, event handlers, hooks,
              runtime calls, rule-set shapes, Engin cartridge/asset markers, docs,
              assets, tests, and workflows.
              """
              role = file_role(f)
              h = f.lower
              p = f.path_lower
              proofs: List[str] = []

              def add(proof: str) -> None:
                  if proof and proof not in proofs:
                      proofs.append(proof)

              if role == "api_route":
                  methods = re.findall(r"export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE)", f.text)
                  if methods:
                      add("exports HTTP route handler(s): " + "/".join(methods))
                  if contains_any(h, ["nextresponse.json", "new response("]):
                      add("returns API response objects")
                  if contains_any(h, ["request.json", "req.json"]):
                      add("reads JSON request body")
                  if contains_any(h, ["formdata", "multipart", "upload"]):
                      add("handles upload/form data")
                  if contains_any(h, ["searchparams", "nexturl.searchparams"]):
                      add("reads query/search parameters")
                  if contains_any(h, ["supabase.auth.getuser", "getuser(", "session"]):
                      add("checks auth/session on the server")
                  if contains_any(h, ["supabase.from", ".select(", ".insert(", ".update(", ".delete("]):
                      add("performs database CRUD")
                  if contains_any(h, ["forbidden", "unauthorized", "permission", "role", "admin"]):
                      add("branches on authorization/permission")
                  if contains_any(h, ["catch", "try ", "status:"]):
                      add("handles API errors/status codes")

              elif role == "server_action":
                  add("contains server-only action logic")
                  if contains_any(h, ["supabase", "db.", ".insert(", ".update(", ".delete("]):
                      add("mutates or reads backend data")
                  if contains_any(h, ["redirect(", "revalidatepath", "revalidatetag"]):
                      add("changes route/cache after server action")

              elif role == "sql_schema":
                  if "create table" in h:
                      add("defines database table(s)")
                  if "alter table" in h:
                      add("changes database table schema")
                  if "create index" in h or "using gin" in h:
                      add("defines database index/performance structure")
                  if "create policy" in h or "row level security" in h or "auth.uid()" in h:
                      add("defines RLS/security policy behavior")
                  if "references" in h or "foreign key" in h:
                      add("defines data relationships/foreign keys")
                  if "unique" in h:
                      add("defines uniqueness constraints")

              elif role == "page_screen":
                  if f.is_page_file:
                      add("renders a Next.js route page")
                  if f.is_layout_file:
                      add("renders a Next.js layout shell")
                  if "loading." in p:
                      add("renders route loading state")
                  if "error." in p:
                      add("renders route error state")
                  if "not-found." in p:
                      add("renders route not-found/empty state")
                  if contains_any(h, ["redirect(", "router.push", "router.replace"]):
                      add("navigates or redirects user")
                  if contains_any(h, ["params", "searchparams"]):
                      add("uses route params/search params")
                  tags = extract_jsx_tags(f.text)
                  if tags:
                      add("renders JSX screen structure")

              elif role == "component_surface":
                  if is_actual_performance_file(f):
                      subfolder, reason = performance_subfolder_for_file(f)
                      add(reason)
                  tags = extract_jsx_tags(f.text)
                  handlers = sorted(extract_event_handlers(f.text))
                  if tags:
                      visible_tags = [tag for tag in ["button", "form", "input", "textarea", "select", "canvas", "dialog", "nav", "section", "main", "article"] if tag in tags]
                      if visible_tags:
                          add("renders visible UI element(s): " + ", ".join(visible_tags))
                      else:
                          add("renders React UI surface")
                  if handlers:
                      add("wires interaction handler(s): " + ", ".join(handlers[:8]))
                  if contains_any(h, ["usestate", "usereducer"]):
                      add("manages local component state")
                  if contains_any(h, ["aria-label", "aria-describedby", "role=", "tabindex"]):
                      add("includes accessibility semantics")
                  if contains_any(h, ["draggable", "ondrag", "ondrop", "pointerdown", "touchstart", "pinch", "zoom"]):
                      add("implements direct manipulation/gesture behavior")

              elif role == "hook":
                  add("exports React hook behavior")
                  if contains_any(h, ["usestate", "usereducer", "usememo"]):
                      add("manages or derives runtime state")
                  if contains_any(h, ["useeffect", "addeventlistener", "removeeventlistener"]):
                      add("registers and cleans lifecycle/event behavior")
                  if contains_any(h, ["localstorage", "indexeddb"]):
                      add("persists local state")
                  if contains_any(h, ["pointer", "touch", "drag", "swipe", "pinch", "keyboard"]):
                      add("handles user interaction input")
                  if contains_any(h, ["subscribe", "channel", "broadcast", "sync"]):
                      add("handles subscriptions/sync events")

              elif role == "engine_runtime":
                  if is_actual_performance_file(f):
                      subfolder, reason = performance_subfolder_for_file(f)
                      add(reason)
                  add("operates core runtime/state execution")
                  if contains_any(h + p, ["snapshot", "memory", "queue", "offline"]):
                      add("manages snapshots/memory/offline queue")
                  if contains_any(h + p, ["eventbus", "emit", "subscribe", "channel", "broadcast"]):
                      add("routes events/channels")
                  if contains_any(h + p, ["dualruntime", "bridge", "wasm", "worker"]):
                      add("bridges runtime execution contexts")
                  if contains_any(h + p, ["webgpu", "frame", "render", "fps"]):
                      add("handles rendering/frame performance behavior")

              elif role == "engin_domain":
                  if is_actual_performance_file(f):
                      subfolder, reason = performance_subfolder_for_file(f)
                      add(reason)
                  if "/brain/" in p or "brain/" in p:
                      add("stores Engin brain/knowledge data")
                  elif "ruleset" in p or "ruleset" in h:
                      add("defines swappable Engin rule-set behavior")
                  elif contains_any(h + p, ["cartridge", "gameruntime", "control", "gamepad"]):
                      add("operates GameEngin cartridge/control/runtime behavior")
                  elif contains_any(h + p, ["contentengin", "asset", "glb", "recipe", "rig"]):
                      add("operates ContentEngin asset/recipe/export behavior")
                  elif contains_any(h + p, ["codeengin", "workspace", "editor", "diagnostic"]):
                      add("operates CodeEngin workspace/editor behavior")
                  else:
                      add("operates Engin-owned domain behavior")

              elif role == "data_json":
                  if "/brain/" in p or "brain/" in p:
                      add("stores structured Engin brain data")
                  elif "manifest" in p:
                      add("stores manifest/config data")
                  else:
                      add("stores structured JSON data/config")

              elif role == "env_example":
                  add("declares environment/configuration keys")

              elif role == "agent_instruction":
                  add("defines agent/developer operating instructions")

              elif role == "documentation":
                  add("documents architecture, setup, policy, workflow, or feature behavior")

              elif role == "workflow":
                  add("defines GitHub Actions automation")
                  if contains_any(h, ["pnpm typecheck", "tsc", "next build", "pnpm build"]):
                      add("runs verification/build command(s)")
                  if contains_any(h, ["upload-artifact", "artifact"]):
                      add("publishes workflow artifact(s)")

              elif role == "test":
                  add("tests repository behavior")
                  if contains_any(h, ["expect(", "assert", "describe(", "it("]):
                      add("contains executable assertions")

              elif role in {"asset_binary", "asset_source"}:
                  add("provides static asset/content")

              elif role == "backend_supabase":
                  add("configures Supabase/backend integration")
                  if contains_any(h, ["auth", "session", "getuser"]):
                      add("handles Supabase auth/session")
                  if contains_any(h, ["storage", "bucket"]):
                      add("handles Supabase storage")

              elif role == "agent_behavior":
                  add("operates agent/admin/product behavior")
                  if contains_any(h + p, ["moderation", "policy", "child safety", "boogieman"]):
                      add("handles moderation/policy behavior")
                  if contains_any(h + p, ["prompt", "tool", "handler", "action"]):
                      add("routes agent tool/action behavior")

              elif role == "script_tooling":
                  add("runs repository tooling/script behavior")

              elif role == "package_manager":
                  add("declares package/dependency workspace behavior")

              elif role == "tool_config":
                  add("configures TypeScript, lint, tests, styles, build, or automation")

              elif role == "style":
                  add("defines styling/design tokens")

              if not proofs:
                  add("no stronger behavior predicate matched; placed by safest file-role fallback")
              return proofs[:10]

          def user_flow_subfolder_for_page(f: FileFacts) -> Tuple[str, str]:
              """Classify route/page files as user-flow files when they define a real user path/state."""
              p = f.path_lower
              h = f.lower
              n = f.name_lower
              combined = p + "\n" + h[:220_000]

              if n.startswith("loading"):
                  return "loading_path", "route loading boundary defines the user's waiting path"
              if n.startswith("error"):
                  return "failure_path", "route error boundary defines the user's failure path"
              if n.startswith("not-found"):
                  return "empty_path", "not-found boundary defines the user's missing/empty path"

              if contains_any(combined, ["unauthorized", "forbidden", "access denied", "permission denied", "not allowed"]):
                  return "access_denied", "page handles denied access or missing permission"
              if contains_any(combined, ["login", "log in", "signin", "sign-in", "sign in", "logged out", "unauthenticated"]):
                  return "logged_out_path", "page handles logged-out/login path"
              if contains_any(combined, ["logout", "signout", "sign-out"]):
                  return "logged_out_path", "page handles logout/sign-out path"
              if contains_any(combined, ["getuser", "get user", "session", "authenticated", "account", "profile", "settings"]):
                  return "logged_in_path", "page handles logged-in/session/account path"
              if contains_any(combined, ["onboarding", "welcome", "first time", "first-time", "setup profile"]):
                  return "onboarding_path", "page handles onboarding or first-time user path"
              if contains_any(combined, ["support", "help center", "contact support"]):
                  return "support_path", "page handles support/help path"
              if contains_any(combined, ["admin", "moderator", "moderation"]):
                  if "moderation" in combined or "moderator" in combined:
                      return "moderation_path", "page handles moderation path"
                  return "admin_path", "page handles admin path"
              if contains_any(combined, ["network", "offline", "reconnect", "online"]):
                  if contains_any(combined, ["reconnect", "online"]):
                      return "after_reconnect", "page handles reconnect/online recovery path"
                  return "network_fails", "page handles network/offline path"
              if contains_any(combined, ["retry", "try again"]):
                  return "retry_path", "page handles retry path"
              if contains_any(combined, ["cancel", "abort"]):
                  return "cancel_path", "page handles cancel/abort path"
              if contains_any(combined, ["success", "complete", "completed", "done", "created", "saved"]):
                  return "success_state", "page presents success/completion state"
              if contains_any(combined, ["empty", "no data", "no items", "nothing here", "no posts", "no dreams"]):
                  return "empty_state", "page presents empty state"
              if contains_any(combined, ["searchparams", "params:", "deeplink", "deep link", "share link", "invite"]):
                  if contains_any(combined, ["share", "invite"]):
                      return "share_link_entry_path", "page supports shared/invited entry path"
                  return "deep_link_entry_path", "page supports route params/search/deep-link entry"
              if contains_any(combined, ["mobile", "touch", "iphone", "responsive"]):
                  return "mobile_path", "page defines mobile/touch user path"

              if f.is_page_file:
                  return "entry_point", "Next page file is a concrete user entry point"
              return "entry_point", "route surface participates in the user's path"


          def performance_subfolder_for_file(f: FileFacts) -> Tuple[str, str]:
              """Classify actual performance/rendering implementation files."""
              p = f.path_lower
              h = f.lower
              combined = p + "\n" + h[:240_000]

              if contains_any(combined, ["memory leak", "memoryleak", "heap", "arena", "allocation", "gc pressure"]):
                  return "memory_leaks", "performance file handles memory/allocation pressure"
              if contains_any(combined, ["webgpu", "gpu", "shader", "render", "renderer", "frame", "raf", "requestanimationframe", "adaptivequality", "quality"]):
                  if contains_any(combined, ["mobile", "touch", "fps", "frame budget", "frame-rate", "framerate"]):
                      return "mobile_frame_rate", "performance file handles mobile frame rate or frame budget"
                  return "render_cost", "performance file handles renderer/GPU/shader/frame cost"
              if contains_any(combined, ["latency", "interaction latency", "input delay", "responsiveness"]):
                  return "interaction_latency_budget", "performance file handles interaction/input latency budget"
              if contains_any(combined, ["bundle", "dynamic import", "lazy", "code splitting", "split"]):
                  return "code_splitting", "performance file handles bundle/code splitting/lazy loading"
              if contains_any(combined, ["cache", "memo", "memoize"]):
                  return "caching", "performance file handles caching or memoization"
              if contains_any(combined, ["benchmark", "performance", "perf", "probe", "baseline"]):
                  return "performance_metrics", "performance file measures or proves runtime performance"
              return "render_cost", "performance file handles execution/render cost"

          def is_actual_performance_file(f: FileFacts) -> bool:
              role = file_role(f)
              if role in {"documentation", "workflow", "env_example", "agent_instruction", "asset_binary", "asset_source", "package_manager", "tool_config"}:
                  return False
              p = f.path_lower
              h = f.lower[:240_000]
              combined = p + "\n" + h

              strong_path = contains_any(
                  p,
                  [
                      "performance",
                      "benchmark",
                      "webgpu",
                      "adaptivequality",
                      "quality",
                      "renderengin",
                      "rendering/webgpu",
                      "enginperformanceprobe",
                      "performancebaseline",
                      "hot-path",
                  ],
              )
              strong_code = contains_any(
                  combined,
                  [
                      "requestanimationframe",
                      "performance.now",
                      "webgpu",
                      "gpudevice",
                      "gpuadapter",
                      "shader",
                      "frame budget",
                      "benchmark",
                      "latency",
                      "fps",
                      "render cost",
                      "performance probe",
                      "adaptive quality",
                  ],
              )
              # Route pages can mention WebGPU and still primarily define user entry.
              if role == "page_screen":
                  return False
              return strong_path or strong_code


          def add_deterministic_semantic_scores(
              role: str,
              scores: Dict[Tuple[str, str], int],
              reasons: Dict[Tuple[str, str], List[str]],
              f: FileFacts,
          ) -> None:
              """Deterministic semantic pass: role + syntax + imports + exported symbols.

              This is not an AI call. It is a higher-signal rule layer that treats code shape
              as meaning: route handlers are API behavior, JSX event handlers are interactions,
              SQL policies are security, Engin brain JSON is Engin knowledge/data, etc.
              """
              h = f.lower
              p = f.path_lower
              n = f.name_lower
              imports = "\n".join(extract_import_sources(f.text)).lower()
              exports = "\n".join(extract_exported_symbols(f.text)).lower()
              tags = extract_jsx_tags(f.text)
              handlers = extract_event_handlers(f.text)
              terms = semantic_terms_for(f)
              semantic_blob = " ".join(sorted(terms)) + "\n" + p + "\n" + imports + "\n" + exports

              # Absolute role/domain anchors. These get high scores because they are structural evidence.
              if is_actual_performance_file(f):
                  perf_subfolder, perf_reason = performance_subfolder_for_file(f)
                  add_role_score(role, scores, reasons, "12_performance", perf_subfolder, 1120, "semantic performance: " + perf_reason)
                  if role == "test":
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "performance_checks", 300, "performance test also verifies build/deploy quality")
                  if contains_any(p + h, ["webgpu", "render", "renderer", "shader", "viewport", "renderengin"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "active_runtime", 260, "render/performance file also supports runtime execution")
                  return

              if role == "engin_domain" and ("/brain/" in p or p.endswith("/brain/README.md".lower())):
                  add_role_score(role, scores, reasons, "05_build_runtime_state", "active_engine", 900, "semantic role: Engin brain/knowledge file stays with active engine")
                  add_role_score(role, scores, reasons, "02_build_data_model", "entities", 190, "semantic secondary: structured Engin knowledge/data")
                  return

              if role == "data_json" and ("/brain/" in p or "brain/" in p):
                  add_role_score(role, scores, reasons, "05_build_runtime_state", "active_engine", 850, "semantic role: brain JSON is engine knowledge/data, not user flow")
                  add_role_score(role, scores, reasons, "02_build_data_model", "entities", 160, "semantic secondary: structured JSON knowledge")
                  return

              if role == "env_example":
                  add_role_score(role, scores, reasons, "15_dev_tooling", "env_examples", 950, "semantic env: declares environment/configuration keys")
                  return

              if role == "agent_instruction":
                  add_role_score(role, scores, reasons, "20_documentation", "agent_instructions", 950, "semantic instruction: agent/developer instruction file")
                  return

              if role == "sql_schema":
                  if "enable row level security" in h or "create policy" in h or "auth.uid()" in h:
                      add_role_score(role, scores, reasons, "11_security", "row_level_security", 950, "semantic SQL: RLS/policy/auth.uid is security behavior")
                  elif "create table" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "database_tables", 900, "semantic SQL: CREATE TABLE defines data model")
                  elif "create index" in h or "using gin" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "indexes", 820, "semantic SQL: CREATE INDEX defines data model index")
                      add_role_score(role, scores, reasons, "12_performance", "database_indexes", 240, "semantic secondary: database index affects performance")
                  return

              if role == "api_route":
                  if regex_any([r"export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE)", r"NextResponse\.json", r"new\s+Response\s*\("], f.text):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "route_handlers", 900, "semantic API: exported HTTP handler and Response shape")
                  if contains_any(h, ["request.json", "req.json", "z.object", "safeparse", "parse("]):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "body_validation", 330, "semantic API: body parsing/validation")
                  if contains_any(h, ["searchparams", "nexturl.searchparams"]):
