                  if n.startswith("loading"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "loading_pages", 760, "semantic page: loading boundary")
                  if n.startswith("error"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "error_pages", 760, "semantic page: error boundary")
                  if n.startswith("not-found"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "not_found_pages", 760, "semantic page: not-found boundary")
                  if contains_any(h, ["searchparams", "params:"]):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "deep_link_behavior", 270, "semantic page: route params/deep link behavior")
