name: Organize Repo Into Web App Build Map

on:
  workflow_dispatch:
    inputs:
      organized_repo_artifact_name:
        description: "organized repository ZIP NAME"
        required: true
        default: "dreamengin-organized-repository"
      file_tree_artifact_name:
        description: "Name for file tree .TXT"
        required: true
        default: "dreamengin-file-tree"
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  organize-repository:
    name: Organize repository by deterministic semantic code reading plus DREAMengin behavior
    runs-on: ubuntu-latest

