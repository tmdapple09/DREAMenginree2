          def category_priority(category: str) -> int:
              # This only breaks ties. It prevents generic UI/runtime words from beating exact code responsibility.
              priorities = {
                  "11_security": 20,
                  "04_build_api_layer": 19,
                  "03_build_backend": 18,
                  "02_build_data_model": 17,
                  "09_wire_interactions": 16,
                  "13_accessibility": 15,
                  "12_performance": 14,
                  "14_observability": 13,
                  "07_build_pages_screens": 12,
                  "08_build_ui_components": 11,
                  "05_build_runtime_state": 10,
                  "06_build_application_behavior": 9,
                  "10_verify_build_deploy": 8,
                  "15_dev_tooling": 7,
                  "16_product_operations": 6,
                  "17_compliance_policy": 5,
                  "19_release_management": 4,
                  "20_documentation": 3,
                  "18_content_assets": 2,
                  "01_define_user_flow": 1,
              }
              return priorities.get(category, 0)

          def dreamengin_area(f: FileFacts) -> str:
              p = f.path_lower
              h = f.lower
              role = file_role(f)
              if role in {"env_example", "workflow", "package_manager", "tool_config", "script_tooling"}:
                  return "repo_tooling"
              if role == "agent_instruction":
                  return "docs"
              area_rules = [
                  ("dreamdmbar", ["dreamdmbar", "dreamdm", "DreamSystemContext".lower()]),
                  ("dreamr", ["dreamr", "/feed", "feed/", "profile", "messages", "social"]),
                  ("gameengin", ["gameengin", "games", "cartridge", "madmaxi", "game remote"]),
                  ("contentengin", ["contentengin", "asset", "glb", "recipe", "rigging"]),
                  ("codeengin", ["codeengin", "workspace", "diagnostics", "notebook"]),
                  ("starmakerengin", ["starmaker", "music", "daw", "sequencer", "mixer"]),
                  ("labengin", ["labengin", "/lab", "lab/", "simulation", "quantum"]),
                  ("brandingengin", ["brandingengin", "brand", "campaign", "identity"]),
                  ("forgeengin", ["forgeengin", "forge", "assembly"]),
                  ("dualruntime", ["dualruntime", "dual runtime", "dualRuntimeBridge".lower()]),
                  ("runtime", ["engine/runtime", "engin-runtime", "runtime", "snapshot", "offlinequeue"]),
                  ("dreamspace", ["dreamspace", "dream space", "dreamsurface.dreamspace"]),
                  ("homedream", ["homedream", "home dream"]),
                  ("daydreams", ["daydream", "daydreams"]),
                  ("shared_dreams", ["shared-dream", "shared dream", "sharedDream".lower()]),
                  ("dreams", ["dreams", "dream-windows", "dream window", "dreamregistry"]),
                  ("supabase", ["supabase"]),
                  ("agents_dr_eams", ["agents", "dr-eams", "idari", "boogie", "humanai"]),
                  ("ui_shell", ["components", "styles", "ui-system", "ui/"]),
                  ("docs", ["docs", "readme", "architecture", ".md"]),
                  ("public_assets", ["public", "fonts", "images", "icons", "models", "audio"]),
              ]
              combined = p + "\n" + h[:200_000]
              best_area = None
              best_score = 0
              for area, terms in area_rules:
                  score = 0
                  for term in terms:
                      term_l = term.lower()
                      if term_l in p:
                          score += 12
                      elif term_l in combined:
                          score += 3
                  if score > best_score:
                      best_area = area
                      best_score = score
              if best_area:
                  return best_area
              return safe_part(p.split("/", 1)[0])

          def dreamengin_behavior(f: FileFacts) -> Tuple[str, str]:
              role = file_role(f)
              if role in {"env_example", "workflow", "package_manager", "tool_config", "script_tooling"}:
                  return "repo_ci_release_tooling", "role-gated repo tooling behavior"
              if role == "agent_instruction":
                  return "admin_agent_dr_eams", "role-gated agent/developer instruction behavior"
              combined = f.path_lower + "\n" + f.lower[:500_000]
              best_name = "unclassified_dreamengin_behavior"
              best_score = 0
              best_hits: List[str] = []
              for behavior, terms in DREAMENGIN_BEHAVIORS.items():
                  score = 0
                  hits: List[str] = []
                  for term in terms:
                      term_l = term.lower()
                      if term_l in f.path_lower:
                          score += 12
                          hits.append(term)
                      elif term_l in combined:
                          score += 3
                          hits.append(term)
                  if score > best_score:
                      best_score = score
                      best_name = behavior
                      best_hits = hits[:8]
              if best_score <= 0:
                  area = dreamengin_area(f)
                  area_fallbacks = {
                      "dreamdmbar": "dreamdmbar",
                      "dreamr": "dreamr",
                      "gameengin": "gameengin_behavior",
                      "contentengin": "contentengin_behavior",
                      "codeengin": "codeengin_behavior",
                      "starmakerengin": "starmaker_music_behavior",
                      "labengin": "lab_sim_behavior",
                      "brandingengin": "forge_brand_agent_behavior",
                      "forgeengin": "forge_brand_agent_behavior",
                      "runtime": "runtime",
                      "dualruntime": "dualruntime",
                      "dreamspace": "dreamspace",
                      "homedream": "homedream",
                      "daydreams": "daydreams",
                      "shared_dreams": "shared_dreams",
                      "dreams": "dreams_lifecycle",
                      "agents_dr_eams": "admin_agent_dr_eams",
                      "public_assets": "render_webgpu_visual_runtime",
                  }
                  return area_fallbacks.get(area, "unclassified_dreamengin_behavior"), f"fallback from DREAMengin area `{area}`"
              return best_name, "matched code/path terms: " + ", ".join(best_hits)

          def dreamengin_feature_for(
              f: FileFacts,
              area: str,
              behavior: str,
              category: str,
              subfolder: str,
              proofs: List[str],
          ) -> str:
              """Return the DREAMengin product feature this file actually supports."""
              role = file_role(f)
              h = f.lower
              p = f.path_lower

              def has_any(items: List[str]) -> bool:
                  return contains_any(h, items) or contains_any(p, items)

              def visible_surface() -> bool:
                  if role in {"page_screen", "component_surface"}:
                      return True
                  return contains_any(h, ["return <", "return (", "classname", "<button", "<input", "<form", "canvas", "viewport", "modal", "panel"])

              def visible_modifier() -> str:
                  if not visible_surface():
                      return ""
                  if has_any(["customize", "hide", "remove", "replace", "reorder", "resize", "drag", "drop", "dock", "undock", "layout", "appearance", "override"]):
                      return " It also exposes user-facing Dream pieces that can be customized, moved, hidden, removed, replaced, resized, or rearranged."
                  if area in {"dreamspace", "dreams", "dreamr", "dreamdmbar", "homedream", "daydreams", "ui_shell"} or behavior in {"dreams_lifecycle", "dreams_as_everything"}:
                      return " It renders a user-visible Dream-owned surface instead of a generic fixed UI."
                  return ""

              # Role gates first: a schema, workflow, doc, or asset should not inherit every product word it happens to contain.
              if role == "sql_schema":
                  if has_any(["create policy", "row level security", "auth.uid()", "rls"]):
                      return "protects DREAMengin persisted data with database-level ownership, visibility, or row-security rules"
                  if has_any(["create table", "references", "foreign key"]):
                      return "gives DREAMengin persistent stored relationships for users, Dreams, posts, assets, profiles, permissions, or runtime-backed features"
                  return "updates DREAMengin persistence without pretending to be UI or runtime behavior"

              if role == "workflow":
                  return "automates DREAMengin build, repair, packaging, verification, release, or repo-update work"

              if role == "test":
                  return "verifies DREAMengin behavior so user-facing engine, runtime, surface, or workflow changes do not silently break"

              if role == "env_example":
                  return "supports DREAMengin environment setup by declaring configuration keys without pretending to own app behavior"

              if role == "agent_instruction":
                  return "preserves DREAMengin operating instructions for agents, contributors, or automated coding workflows"

              if role == "documentation":
                  if area == "gameengin" or behavior == "gameengin_behavior":
                      return "documents GameEngin cartridge/runtime behavior for future implementation work"
                  if area == "contentengin" or behavior == "contentengin_behavior":
                      return "documents ContentEngin asset-creation, validation, export, or pipeline behavior"
                  if area == "codeengin" or behavior == "codeengin_behavior":
                      return "documents CodeEngin workspace, IDE, safety, or simulated execution behavior"
                  if area == "dreamr" or behavior == "dreamr":
                      return "documents DreamR feed/profile/social behavior"
                  if area == "dreamdmbar" or behavior == "dreamdmbar":
                      return "documents DreamDMBar messaging, draft, notification, or control-bar behavior"
                  if area in {"runtime", "dualruntime"} or behavior in {"runtime", "dualruntime", "rulesets"}:
                      return "documents DREAMengin runtime, rule-set, sync, memory, or dual-surface behavior"
                  return f"documents {area} / {behavior} behavior for DREAMengin work"

              if role in {"asset_binary", "asset_source"}:
                  if area == "gameengin" or behavior == "gameengin_behavior":
                      return "provides game-ready visual/audio/model material used by GameEngin cartridges"
                  if area == "contentengin" or behavior == "contentengin_behavior":
                      return "provides source or output material for ContentEngin asset creation"
                  return f"provides visual, audio, model, font, or static material used by {area}"

              if role in {"package_manager", "tool_config", "script_tooling"}:
                  return "supports DREAMengin development, verification, packaging, repo organization, or local/build tooling"

              # API routes: state the product action served by the endpoint.
              if category == "12_performance":
                  return "keeps DREAMengin fast enough to feel smooth by controlling render cost, mobile frame rate, latency, memory, caching, or benchmark proof"

              if role == "api_route":
                  if area == "shared_dreams" or behavior == "shared_dreams" or has_any(["shared-dream", "shared dream", "sharedsession", "presence"]):
                      return "serves Shared Dreams live-session, presence, collaboration, or shared-state API behavior"
                  if area == "dreamr" or behavior == "dreamr" or has_any(["feed", "profile", "post", "visibility"]):
                      return "serves DreamR feed, profile, post, visibility, or social-state API behavior"
                  if area == "dreamdmbar" or behavior == "dreamdmbar" or has_any(["conversation", "message", "draft", "notification"]):
                      return "serves DreamDMBar messaging, conversation, draft, or notification API behavior"
                  if area == "gameengin" or behavior == "gameengin_behavior" or has_any(["cartridge", "gameengin", "score", "save state"]):
                      return "serves GameEngin cartridge, score, save-state, runtime, or playable-session API behavior"
                  if area == "contentengin" or behavior == "contentengin_behavior" or has_any(["asset", "glb", "recipe", "upload", "export"]):
                      return "serves ContentEngin asset upload, recipe, validation, export, or GameEngin-ready asset API behavior"
                  if area == "codeengin" or behavior == "codeengin_behavior" or has_any(["workspace", "file", "diagnostic", "notebook"]):
                      return "serves CodeEngin workspace, file, diagnostics, notebook, or safe editor API behavior"
                  if behavior == "auth_profile_account" or has_any(["auth", "session", "profile", "account", "delete-data", "export-data"]):
                      return "serves DREAMengin account, profile, session, export/delete, or permission-protected user actions"
                  if behavior == "dreams_lifecycle" or area == "dreams" or has_any(["dreams", "dream-windows", "transfer"]):
                      return "serves Dream creation, feed, transfer, window, instance, or lifecycle API behavior"
                  return f"serves {area} / {behavior} API behavior for a user-facing DREAMengin action"

              # Strong DREAMengin product/domain behaviors. This picks a primary product feature, not every word match.
              if area == "shared_dreams" or behavior == "shared_dreams":
                  return "lets multiple users share a live Dream session with presence, cursor/control, media, or state sync" + visible_modifier()

              if area == "dreamspace" or behavior == "dreamspace":
                  return "turns visible Dream objects into a spatial workspace the user can arrange, move, resize, and reuse" + visible_modifier()

              if area == "homedream" or behavior == "homedream":
                  return "makes the user's main Dream environment configurable instead of a fixed homepage" + visible_modifier()

              if area == "daydreams" or behavior == "daydreams":
                  return "opens specialized creative surfaces as Dream-owned workspaces instead of isolated pages" + visible_modifier()

              if area == "dreamr" or behavior == "dreamr":
                  return "connects feed, profile, posts, visibility, and social state into one creator-facing Dream social surface" + visible_modifier()

              if area == "dreamdmbar" or behavior == "dreamdmbar":
                  return "keeps messaging, drafts, notifications, and system actions available from the Dream control bar" + visible_modifier()

              if area == "gameengin" or behavior == "gameengin_behavior":
                  if role == "data_json" or "/brain/" in p:
                      return "stores GameEngin cartridge, genre, mechanic, tuning, or brain data used to generate playable game behavior"
                  return "runs playable web-native cartridges with mobile/controller input, save/score state, and crash feedback" + visible_modifier()

              if area == "contentengin" or behavior == "contentengin_behavior":
                  return "creates low-cost procedural game-ready assets with recipes, materials, rigging, validation, and GLB export" + visible_modifier()

              if area == "codeengin" or behavior == "codeengin_behavior":
                  return "gives each user a safe workspace IDE with files, diagnostics, notebook/editing, and simulated execution" + visible_modifier()

              if area == "starmakerengin" or behavior == "starmaker_music_behavior":
                  return "provides browser-native music arrangement, sequencing, mixing, presets, and audio workflow behavior" + visible_modifier()

              if area == "labengin" or behavior == "lab_sim_behavior":
                  return "exposes experiments, simulation, physics, particles, quantum/lab work, and benchmark behavior" + visible_modifier()

              if area in {"brandingengin", "forgeengin"} or behavior == "forge_brand_agent_behavior":
                  if area == "brandingengin" or has_any(["brand", "identity", "campaign", "logo"]):
                      return "turns identity, campaigns, logos, and analytics into an engine-owned brand workspace" + visible_modifier()
                  return "lets DREAMengin assemble working systems from pieces, graphs, components, and build rituals" + visible_modifier()

              if area == "agents_dr_eams" or behavior == "admin_agent_dr_eams":
                  return "gives DREAMengin guided assistance, audit behavior, and product/agent workflows without replacing the app" + visible_modifier()

              if area == "dualruntime" or behavior == "dualruntime":
                  return "runs two coordinated runtime surfaces with dominance swap and shared state transfer"

              if area == "runtime" or behavior == "runtime":
                  return "keeps DREAMengin state synchronized through snapshots, memory, events, channels, offline queues, and runtime registration"

              if behavior == "rulesets":
                  return "changes Engin behavior by swapping constraints, transformations, and parameters instead of rewriting the engine"

              if behavior == "auth_profile_account" or area == "supabase":
                  return "supports authenticated profiles, persisted user state, account controls, export/delete, and safe session handling"

              if behavior == "render_webgpu_visual_runtime":
                  return "powers browser-native rendering, canvas/viewport work, shaders, WebGPU, Babylon, or visual engine output" + visible_modifier()

              if behavior == "repo_ci_release_tooling" or category in {"10_verify_build_deploy", "15_dev_tooling", "19_release_management"}:
                  return "supports DREAMengin build, verification, repo automation, release, or rebase workflow behavior"

              if behavior == "dream_drag_drop_spatial_behavior":
                  return "owns Dream drag/drop, spatial placement, snap, dock, or surface movement behavior" + visible_modifier()

              if behavior == "dream_customization_everywhere":
                  return "owns visible customization behavior: hide, remove, replace, reorder, resize, layout, and user-level overrides" + visible_modifier()

              if behavior in {"dreams_lifecycle", "dreams_as_everything"} or area == "dreams":
                  return "creates, opens, restores, transfers, or renders Dream lifecycle behavior" + visible_modifier()

              if visible_surface():
                  return "renders a user-visible Dream-owned surface with customizable app behavior"

              if proofs:
                  return "supports DREAMengin behavior proven by this file: " + "; ".join(str(item) for item in proofs[:2])

              return f"supports {area} / {behavior} behavior without pretending it owns another product feature"


          def line_is_meaningful(line: str) -> bool:
              stripped = line.strip()
              if not stripped:
                  return False
              if stripped in {"{", "}", "};", ");", "};"}:
                  return False
              return True

          def keyword_bundle(category: str, subfolder: str) -> List[str]:
              words = []
              words.extend(category.split("_")[1:])
              words.extend(subfolder.split("_"))
              words.extend(re.split(r"[_/-]+", category + " " + subfolder))
              return sorted({w.lower() for w in words if len(w) > 2 and w not in {"build", "define", "wire"}})

          def find_line_refs(terms: List[str], scan_files: List[str], max_results: int = 12) -> List[Tuple[str, int, str]]:
              results: List[Tuple[str, int, str]] = []
              seen: Set[Tuple[str, int]] = set()
              lowered_terms = [t.lower() for t in terms if len(t.strip()) >= 3]
              if not lowered_terms:
                  return results

              ordered_files = sorted(
                  scan_files,
                  key=lambda rel: (
                      0 if any(term in rel.lower() for term in lowered_terms) else 1,
                      rel.lower(),
                  ),
              )

              for rel in ordered_files[:500]:
                  text, ok = read_text(REPO / rel)
                  if not ok or not text:
                      continue
                  for index, line in enumerate(text.splitlines(), start=1):
                      lower_line = line.lower()
                      if not line_is_meaningful(line):
                          continue
                      if any(term in lower_line for term in lowered_terms):
                          key = (rel, index)
                          if key in seen:
                              continue
                          seen.add(key)
                          snippet = line.strip()
                          if len(snippet) > 180:
                              snippet = snippet[:177] + "..."
                          results.append((rel, index, snippet))
                          if len(results) >= max_results:
                              return results
              return results

          def inline_tree_evidence(row: Dict[str, object], prefix: str) -> List[str]:
              lines: List[str] = []
              summary = row.get("semantic_summary")
              if isinstance(summary, str) and summary:
                  lines.append(f"{prefix}• does: {summary}")
              lines.append(f"{prefix}• placed: {row['category']}/{row['subfolder']}")
              dreamengin_label = f"{row['dreamengin_area']} / {row['dreamengin_behavior']}"
              dreamengin_feature = row.get("dreamengin_feature")
              if isinstance(dreamengin_feature, str) and dreamengin_feature:
                  lines.append(f"{prefix}• dreamengin: {dreamengin_label} — {dreamengin_feature}")
              else:
                  lines.append(f"{prefix}• dreamengin: {dreamengin_label}")

              proofs = row.get("behavior_proofs", [])
              if isinstance(proofs, list) and proofs:
                  for proof in proofs[:6]:
                      lines.append(f"{prefix}• proves: {proof}")

              reason = row.get("reason")
              if isinstance(reason, str) and reason:
                  lines.append(f"{prefix}• because: {reason}")

              secondary = row.get("secondary_tracks", [])
              if isinstance(secondary, list) and secondary:
                  lines.append(f"{prefix}• also touches: {', '.join(str(item) for item in secondary)}")

              evidence_items = row.get("code_evidence", [])
              if isinstance(evidence_items, list):
                  for ev in evidence_items[:3]:
                      if not isinstance(ev, dict):
                          continue
                      ev_category = ev.get("category", "unknown_category")
                      ev_subfolder = ev.get("subfolder", "unknown_subfolder")
                      ev_reasons = ev.get("reasons", [])
                      if isinstance(ev_reasons, list):
                          reason_text = "; ".join(str(reason) for reason in ev_reasons[:3])
                      else:
                          reason_text = str(ev_reasons)
                      if reason_text:
                          lines.append(f"{prefix}• evidence path: {ev_category}/{ev_subfolder} — {reason_text}")

              return lines

          def tree_lines(root: Path, placement_by_destination: Dict[str, Dict[str, object]]) -> List[str]:
              lines = [root.name + "/"]

              def walk(directory: Path, prefix: str = "") -> None:
                  entries = sorted(directory.iterdir(), key=lambda x: (x.is_file(), x.name.lower()))
                  for index, entry in enumerate(entries):
                      connector = "└── " if index == len(entries) - 1 else "├── "
                      lines.append(prefix + connector + entry.name + ("/" if entry.is_dir() else ""))

                      extension = "    " if index == len(entries) - 1 else "│   "
                      next_prefix = prefix + extension

                      if entry.is_dir():
                          walk(entry, next_prefix)
                          continue

                      rel = entry.relative_to(root).as_posix()
                      row = placement_by_destination.get(rel)
                      if row is not None:
                          lines.extend(inline_tree_evidence(row, next_prefix))

              walk(root)
              return lines

          def zip_with_empty_dirs(source_root: Path, zip_path: Path) -> None:
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
                  for path in sorted(source_root.rglob("*")):
                      arcname = path.relative_to(source_root.parent).as_posix()
                      if path.is_dir():
                          z.writestr(arcname.rstrip("/") + "/", "")
                      elif path.is_symlink():
                          z.writestr(arcname, os.readlink(path))
                      else:
                          z.write(path, arcname)

          if OUT_ROOT.exists():
              shutil.rmtree(OUT_ROOT)
          OUT_ROOT.mkdir(parents=True, exist_ok=True)
          ORGANIZED.mkdir(parents=True, exist_ok=True)

          # Main buckets exist even if no files land there; subfolders are created only by code classification.
          for category in CATEGORIES:
              (ORGANIZED / category).mkdir(parents=True, exist_ok=True)

          files = git_files()
          scan_files = [rel for rel in files if is_probably_text_path(REPO / rel)]

          manifest: List[Dict[str, object]] = []
          counts = Counter()
          subfolder_counts = Counter()
          area_counts = Counter()
          dream_behavior_counts = Counter()
          copied: Set[str] = set()
          corrections: List[str] = []
          cross_links_by_category: Dict[str, List[Dict[str, object]]] = defaultdict(list)
          dream_behavior_files: Dict[str, List[str]] = defaultdict(list)
          populated_subfolders: Dict[str, Set[str]] = defaultdict(set)

          for rel in files:
              src = REPO / rel
              if not src.exists() or not src.is_file():
                  continue

              facts = facts_for(rel)
              role = file_role(facts)
              try:
                  category, subfolder, reason, evidence = classify_by_code(facts)
              except Exception as exc:
                  category, subfolder, fallback_reason = primary_fallback_for_role(role, facts)
                  reason = f"role {role}: {fallback_reason}"
                  evidence = [
                      {
                          "category": category,
                          "subfolder": subfolder,
                          "reasons": [fallback_reason],
                      }
                  ]
                  corrections.append(f"{rel}: classifier exception corrected to {category}/{subfolder}")

              if category not in CATEGORIES or subfolder not in CATEGORIES.get(category, []):
                  fallback_category, fallback_subfolder, fallback_reason = primary_fallback_for_role(role, facts)
                  corrections.append(f"{rel}: invalid placement {category}/{subfolder} corrected to {fallback_category}/{fallback_subfolder}")
                  category, subfolder = fallback_category, fallback_subfolder
                  reason = f"role {role}: {fallback_reason}"
                  evidence = [
                      {
                          "category": category,
                          "subfolder": subfolder,
                          "reasons": [fallback_reason],
                      }
                  ]

              try:
                  area = dreamengin_area(facts)
              except Exception as exc:
                  area = safe_part(rel.split('/', 1)[0])
                  corrections.append(f"{rel}: DREAMengin area corrected after {type(exc).__name__}: {exc}")

              try:
                  dream_behavior_name, dream_behavior_reason = dreamengin_behavior(facts)
              except Exception as exc:
                  dream_behavior_name = "unclassified_dreamengin_behavior"
                  dream_behavior_reason = f"corrected after DREAMengin behavior exception {type(exc).__name__}: {exc}"
                  corrections.append(f"{rel}: DREAMengin behavior corrected after {type(exc).__name__}: {exc}")

              behavior_proofs = behavior_proofs_for(facts)

              secondary_tracks = []
              for ev in evidence[1:]:
                  if not isinstance(ev, dict):
                      continue
                  cat = str(ev.get("category", ""))
                  if cat and cat != category and cat not in secondary_tracks:
                      secondary_tracks.append(cat)

              dest = ORGANIZED / category / subfolder / safe_part(area) / rel
              dest.parent.mkdir(parents=True, exist_ok=True)

              try:
                  if src.is_symlink():
                      target = os.readlink(src)
                      if dest.exists() or dest.is_symlink():
                          dest.unlink()
                      os.symlink(target, dest)
                  else:
                      shutil.copy2(src, dest)
              except Exception as exc:
                  corrections.append(f"{rel}: copy failed after correction attempt: {type(exc).__name__}: {exc}")
                  continue

              copied.add(rel)
              counts[category] += 1
              subfolder_counts[(category, subfolder)] += 1
              populated_subfolders[category].add(subfolder)
              area_counts[area] += 1
              dream_behavior_counts[dream_behavior_name] += 1
              dream_behavior_files[dream_behavior_name].append(rel)

              row: Dict[str, object] = {
                  "source_path": rel,
                  "category": category,
                  "subfolder": subfolder,
                  "dreamengin_area": area,
                  "dreamengin_behavior": dream_behavior_name,
                  "dreamengin_behavior_reason": dream_behavior_reason,
                  "dreamengin_feature": dreamengin_feature_for(
                      facts,
                      area,
                      dream_behavior_name,
                      category,
                      subfolder,
                      behavior_proofs,
                  ),
                  "destination_path": str(dest.relative_to(ORGANIZED)).replace("\\", "/"),
                  "secondary_tracks": secondary_tracks,
                  "reason": reason,
                  "semantic_summary": semantic_summary_for(facts, category, subfolder, area, dream_behavior_name),
                  "behavior_proofs": behavior_proofs,
                  "code_evidence": evidence,
              }
              manifest.append(row)
              if secondary_tracks:
                  cross_links_by_category[category].append(row)

          missing = sorted(set(files) - copied)
          if missing:
              print("WARNING: some tracked file paths were not copied; continuing and reporting them in the file tree.")
              for item in missing[:100]:
                  print(f"WARNING skipped: {item}")

          unused_subfolders: Dict[str, List[str]] = {
              category: [sub for sub in subfolders if sub not in populated_subfolders[category]]
              for category, subfolders in CATEGORIES.items()
          }

          placement_by_destination: Dict[str, Dict[str, object]] = {
              str(row["destination_path"]): row
              for row in manifest
          }
          tree_output: List[str] = tree_lines(ORGANIZED, placement_by_destination)
          TREE_FILE.write_text("\n".join(tree_output) + "\n", encoding="utf-8")

          for category in CATEGORIES:
              (ORGANIZED / category).mkdir(parents=True, exist_ok=True)

          helper_files = list(ORGANIZED.rglob(BEHAVIOR_HELPER_FILENAME))
          for helper in helper_files:
              try:
                  helper.unlink()
              except Exception as exc:
                  corrections.append(f"helper cleanup skipped {helper}: {type(exc).__name__}: {exc}")

          zip_with_empty_dirs(ORGANIZED, ZIP_PATH)

          top = sorted([p.name for p in ORGANIZED.iterdir() if p.is_dir()])

          print("")
          print("organized repository zip:", ZIP_PATH.relative_to(REPO))
          print("organized file tree:", TREE_FILE.relative_to(REPO))
          PY

      - name: Print organized file tree in workflow log
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Organized file tree"
          cat _organized_repo_artifact/organized_file_tree.txt
          echo "::endgroup::"

      - name: Upload organized repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.organized_repo_artifact_name }}
          path: _organized_repo_artifact/dreamengin-organized-repository.zip
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Upload organized file tree TXT
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.file_tree_artifact_name }}
          path: _organized_repo_artifact/organized_file_tree.txt
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
