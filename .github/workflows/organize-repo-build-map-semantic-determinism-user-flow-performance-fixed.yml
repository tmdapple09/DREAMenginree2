                  return

              if role == "page_screen":
                  flow_subfolder, flow_reason = user_flow_subfolder_for_page(f)

                  if f.is_page_file or n.startswith("loading") or n.startswith("error") or n.startswith("not-found"):
                      add_role_score(role, scores, reasons, "01_define_user_flow", flow_subfolder, 1040, "semantic user flow: " + flow_reason)

                  if f.is_page_file:
