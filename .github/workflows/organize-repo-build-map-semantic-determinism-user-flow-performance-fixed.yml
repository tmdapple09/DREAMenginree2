                  if contains_any(h, ["supabase.auth.getuser", "getuser(", "cookies(", "session"]):
                      add_role_score(role, scores, reasons, "03_build_backend", "auth", 380, "semantic backend: server auth/session lookup")
                  if contains_any(h, ["forbidden", "unauthorized", "permission", "role", "admin"]):
                      add_role_score(role, scores, reasons, "11_security", "authorization", 360, "semantic security: authorization/permission branch")
                  if contains_any(h, ["supabase.from", ".select(", ".insert(", ".update(", ".delete("]):
                      add_role_score(role, scores, reasons, "03_build_backend", "database_access", 340, "semantic backend: database CRUD access")
                  if contains_any(h + p, ["webhook", "signature", "x-hub", "stripe-signature"]):
