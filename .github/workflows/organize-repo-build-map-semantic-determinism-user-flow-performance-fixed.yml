              if role == "server_action":
                  add_role_score(role, scores, reasons, "03_build_backend", "server_only_logic", 800, "semantic server action: server-only behavior")
                  if contains_any(h, ["supabase", "from(", ".select(", ".insert(", ".update(", ".delete("]):
