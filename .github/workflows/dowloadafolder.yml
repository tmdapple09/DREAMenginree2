name: Semantic Folder Export

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Folder or file path to export"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      - name: Create semantic exporter
        run: |
          cat > semantic_export.py <<'PY'
          import os
          import re
          import json
          import shutil
          import zipfile
          from pathlib import Path


          TARGET = Path(os.environ["TARGET"])

          if not TARGET.exists():
              raise Exception(f"Cannot find: {TARGET}")


          EXPORT_NAME = TARGET.name.replace("/", "-")

          WORK = Path("export_workspace")
          OUT = WORK / EXPORT_NAME


          def copy_target():

              if TARGET.is_file():

                  OUT.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  shutil.copy2(
                      TARGET,
                      OUT
                  )

              else:

                  shutil.copytree(
                      TARGET,
                      OUT,
                      dirs_exist_ok=True
                  )


          def read(path):

              try:
                  return path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except:
                  return ""


          def load_aliases():

              aliases = {}

              for cfg in [
                  "tsconfig.json",
                  "jsconfig.json"
              ]:

                  p = Path(cfg)

                  if p.exists():

                      try:

                          data = json.loads(
                              read(p)
                          )

                          paths = (
                              data
                              .get("compilerOptions", {})
                              .get("paths", {})
                          )

                          for key, value in paths.items():

                              aliases[
                                  key.replace("/*","")
                              ] = value[0].replace(
                                  "/*",
                                  ""
                              )

                      except:
                          pass

              return aliases


          ALIASES = load_aliases()


          def resolve_import(name):

              original = name

              for alias, target in ALIASES.items():

                  if name.startswith(alias):

                      name = name.replace(
                          alias,
                          target,
                          1
                      )


              candidates = [
                  name,
                  name + ".ts",
                  name + ".tsx",
                  name + ".js",
                  name + "/index.ts",
                  name + "/index.tsx"
              ]


              for root, dirs, files in os.walk("."):

                  for file in files:

                      full = Path(root) / file

                      for candidate in candidates:

                          if str(full).endswith(candidate):

                              return str(full)


              return None


          def get_imports(code):

              found = []

              patterns = [
                  r'import .*? from ["\'](.*?)["\']',
                  r'import ["\'](.*?)["\']',
                  r'require\(["\'](.*?)["\']\)'
              ]

              for pattern in patterns:

                  found.extend(
                      re.findall(
                          pattern,
                          code
                      )
                  )

              return list(set(found))


          def get_symbols(code):

              output = []

              patterns = {

                  "class":
                      r"(?:export\s+)?class\s+(\w+)",

                  "function":
                      r"(?:export\s+)?function\s+(\w+)",

                  "interface":
                      r"(?:export\s+)?interface\s+(\w+)",

                  "type":
                      r"(?:export\s+)?type\s+(\w+)",

                  "component":
                      r"(?:export\s+)?const\s+(\w+)\s*="

              }


              for label, pattern in patterns.items():

                  for match in re.findall(
                      pattern,
                      code
                  ):

                      output.append(
                          f"{label}: `{match}`"
                      )


              return output


          def analyze_file(path):

              ext = path.suffix.lower()

              text = read(path)

              result = []


              if ext == ".md":

                  result.append(
                      "Documentation file.\n\n"
                      +
                      text[:1500]
                  )

                  return result


              if ext in [
                  ".ts",
                  ".tsx",
                  ".js",
                  ".jsx"
              ]:

                  symbols = get_symbols(text)

                  if symbols:

                      result.append(
                          "Structures:\n"
                          +
                          "\n".join(
                              "- " + x
                              for x in symbols
                          )
                      )


                  imports = get_imports(text)


                  if imports:

                      deps = []

                      for item in imports:

                          resolved = resolve_import(
                              item
                          )

                          if resolved:

                              deps.append(
                                  f"- {item} -> {resolved}"
                              )

                          else:

                              deps.append(
                                  f"- {item}"
                              )


                      result.append(
                          "Dependencies:\n"
                          +
                          "\n".join(deps)
                      )


                  if not symbols:

                      result.append(
                          "Contains executable source code."
                      )


              else:

                  result.append(
                      f"File type: {ext}"
                  )


              return result


          def create_report():

              lines = []

              lines.append(
                  "# Semantic Export Report\n"
              )

              lines.append(
                  f"Exported: `{TARGET}`\n"
              )


              for root, dirs, files in os.walk(OUT):

                  folder = Path(root).relative_to(
                      OUT
                  )

                  lines.append(
                      f"\n## Folder `{folder}`\n"
                  )


                  for file in files:

                      path = Path(root) / file

                      lines.append(
                          f"\n### File `{file}`\n"
                      )

                      lines.extend(
                          analyze_file(path)
                      )


              Path(
                  f"{EXPORT_NAME}_semantic.md"
              ).write_text(
                  "\n\n".join(lines),
                  encoding="utf-8"
              )


          def create_zip():

              zip_name = f"{EXPORT_NAME}.zip"

              with zipfile.ZipFile(
                  zip_name,
                  "w",
                  zipfile.ZIP_DEFLATED
              ) as archive:


                  for root, dirs, files in os.walk(OUT):

                      for file in files:

                          path = Path(root) / file

                          archive.write(
                              path,
                              path.relative_to(
                                  OUT.parent
                              )
                          )


                  archive.write(
                      f"{EXPORT_NAME}_semantic.md"
                  )


          copy_target()
          create_report()
          create_zip()

          PY


      - name: Run exporter
        env:
          TARGET: ${{ github.event.inputs.path }}
        run: |
          python semantic_export.py


      - name: Create safe artifact name
        id: artifact
        run: |
          SAFE_NAME="${{ github.event.inputs.path }}"
          SAFE_NAME=$(echo "$SAFE_NAME" | sed 's#[/\\]#-#g')
          SAFE_NAME=$(echo "$SAFE_NAME" | sed 's#[^a-zA-Z0-9._-]#-#g')
          echo "name=semantic-$SAFE_NAME" >> $GITHUB_OUTPUT


      - name: Upload export
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            *.zip
            *_semantic.md
