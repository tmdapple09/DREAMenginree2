name: Download Folder Semantic Explanation

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Folder or file path to export (example: app/ or engines/renderengine)"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create exporter
        run: |
          cat > semantic_export.py <<'PY'
          import os
          import ast
          import json
          import shutil
          import zipfile
          import re
          from pathlib import Path


          TARGET = os.environ["TARGET"]

          EXPORT_ROOT = Path("semantic_export")
          SOURCE_ROOT = Path(TARGET)

          if not SOURCE_ROOT.exists():
              raise Exception(f"Path does not exist: {TARGET}")


          def copy_target():

              destination = EXPORT_ROOT / SOURCE_ROOT.name

              if SOURCE_ROOT.is_file():
                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  shutil.copy2(
                      SOURCE_ROOT,
                      destination
                  )

              else:
                  shutil.copytree(
                      SOURCE_ROOT,
                      destination,
                      dirs_exist_ok=True
                  )


          def read_file(path):

              try:
                  return path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except:
                  return ""


          def find_import_targets(content):

              imports = []

              patterns = [
                  r'import\s+.*?from\s+[\'"](.*?)[\'"]',
                  r'import\s+[\'"](.*?)[\'"]',
                  r'require\([\'"](.*?)[\'"]\)',
                  r'from\s+([\w\.]+)\s+import',
                  r'#include\s+[<"](.*?)[>"]'
              ]

              for p in patterns:
                  imports += re.findall(
                      p,
                      content
                  )

              return list(set(imports))


          def locate_import(name):

              clean = name.replace(
                  ".",
                  "/"
              )

              possibilities = [
                  clean,
                  clean + ".py",
                  clean + ".js",
                  clean + ".ts",
                  clean + ".tsx",
                  clean + ".jsx"
              ]

              for root, dirs, files in os.walk("."):

                  for f in files:

                      full = Path(root) / f

                      for p in possibilities:

                          if str(full).endswith(p):
                              return str(full)

              return None



          def python_analysis(path, content):

              result = []

              try:

                  tree = ast.parse(content)

                  for node in ast.walk(tree):

                      if isinstance(node, ast.ClassDef):
                          result.append(
                              f"class `{node.name}`"
                          )

                      if isinstance(node, ast.FunctionDef):
                          result.append(
                              f"function `{node.name}()`"
                          )

              except:
                  pass

              return result



          def analyze_file(path):

              content = read_file(path)

              info = []

              suffix = path.suffix.lower()


              if suffix == ".py":

                  info += python_analysis(
                      path,
                      content
                  )


              imports = find_import_targets(
                  content
              )

              resolved = []

              for imp in imports:

                  found = locate_import(
                      imp
                  )

                  if found:

                      resolved.append(
                          f"`{imp}` → `{found}`"
                      )


              if imports:

                  info.append(
                      "Imports:\n" +
                      "\n".join(
                          "- " + x
                          for x in imports
                      )
                  )


              if resolved:

                  info.append(
                      "Resolved dependencies:\n" +
                      "\n".join(
                          "- " + x
                          for x in resolved
                      )
                  )


              if not info:

                  lines = content.splitlines()

                  preview = "\n".join(
                      lines[:8]
                  )

                  info.append(
                      "File contains source code. "
                      "Beginning structure:\n"
                      + preview
                  )


              return info



          def explain_tree():

              md = []

              md.append(
                  "# Semantic Export Explanation\n"
              )

              md.append(
                  f"Exported path: `{TARGET}`\n"
              )


              for root, dirs, files in os.walk(
                  EXPORT_ROOT
              ):

                  level = root.replace(
                      str(EXPORT_ROOT),
                      ""
                  ).count(os.sep)

                  indent = "  " * level

                  md.append(
                      f"{indent}## Folder `{Path(root).name}`"
                  )


                  for file in files:

                      fp = Path(root) / file

                      md.append(
                          f"\n{indent}### File `{file}`"
                      )

                      for item in analyze_file(fp):

                          md.append(
                              indent +
                              "\n" +
                              item
                          )


              Path(
                  "SEMANTIC_EXPLANATION.md"
              ).write_text(
                  "\n".join(md),
                  encoding="utf-8"
              )



          def zip_export():

              with zipfile.ZipFile(
                  "semantic_export.zip",
                  "w",
                  zipfile.ZIP_DEFLATED
              ) as z:

                  for root, dirs, files in os.walk(
                      EXPORT_ROOT
                  ):

                      for file in files:

                          fp = Path(root) / file

                          z.write(
                              fp,
                              fp.relative_to(
                                  EXPORT_ROOT
                              )
                          )

                  z.write(
                      "SEMANTIC_EXPLANATION.md"
                  )


          copy_target()
          explain_tree()
          zip_export()

          print(
              "Export complete"
          )

          PY


      - name: Run exporter
        env:
          TARGET: ${{ github.event.inputs.path }}
        run: |
          python semantic_export.py


      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: semantic-export
          path: semantic_export.zip
