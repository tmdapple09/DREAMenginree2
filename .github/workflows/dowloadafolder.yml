name: Semantic Folder Export

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Folder or file path to export"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Create semantic exporter
        run: |
          cat > semantic_export.py <<'PY'
          import os
          import re
          import json
          import shutil
          import zipfile
          from pathlib import Path


          TARGET = Path(os.environ["TARGET"])

          if not TARGET.exists():
              raise Exception(
                  f"Cannot find: {TARGET}"
              )


          EXPORT_NAME = TARGET.name

          WORK = Path(
              "export_workspace"
          )

          OUT = WORK / EXPORT_NAME


          def copy_target():

              if TARGET.is_file():

                  OUT.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  shutil.copy2(
                      TARGET,
                      OUT
                  )

              else:

                  shutil.copytree(
                      TARGET,
                      OUT,
                      dirs_exist_ok=True
                  )



          def read(path):

              try:
                  return path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except:
                  return ""



          def load_aliases():

              aliases = {}

              tsconfigs = [
                  "tsconfig.json",
                  "jsconfig.json"
              ]

              for cfg in tsconfigs:

                  p = Path(cfg)

                  if p.exists():

                      try:

                          data = json.loads(
                              read(p)
                          )

                          paths = data.get(
                              "compilerOptions",
                              {}
                          ).get(
                              "paths",
                              {}
                          )

                          for k,v in paths.items():

                              aliases[k.replace(
                                  "/*",
                                  ""
                              )] = v[0].replace(
                                  "/*",
                                  ""
                              )

                      except:
                          pass

              return aliases



          ALIASES = load_aliases()



          def resolve_import(value):

              original = value

              for alias,target in ALIASES.items():

                  if value.startswith(alias):

                      value = value.replace(
                          alias,
                          target,
                          1
                      )


              candidates = [

                  value,

                  value + ".ts",
                  value + ".tsx",
                  value + ".js",

                  value + "/index.ts",
                  value + "/index.tsx"

              ]


              for root,dirs,files in os.walk("."):

                  for file in files:

                      full = Path(root) / file

                      for c in candidates:

                          if str(full).endswith(c):

                              return str(full)


              return None



          def imports(code):

              found=[]

              patterns=[

                  r'import .*? from ["\'](.*?)["\']',

                  r'import ["\'](.*?)["\']',

                  r'require\(["\'](.*?)["\']\)'

              ]

              for p in patterns:

                  found += re.findall(
                      p,
                      code
                  )

              return list(set(found))



          def symbols(code):

              result=[]

              patterns={

              "classes":
                  r"(?:export\s+)?class\s+(\w+)",

              "functions":
                  r"(?:export\s+)?function\s+(\w+)",

              "interfaces":
                  r"(?:export\s+)?interface\s+(\w+)",

              "types":
                  r"(?:export\s+)?type\s+(\w+)",

              "components":
                  r"(?:export\s+)?const\s+(\w+)\s*="

              }


              for name,pattern in patterns.items():

                  matches=re.findall(
                      pattern,
                      code
                  )

                  for m in matches:

                      result.append(
                          f"{name[:-1]} `{m}`"
                      )


              return result



          def analyze(path):

              ext=path.suffix.lower()

              text=read(path)

              md=[]


              if ext==".md":

                  md.append(
                      "Documentation file.\n\n"
                      +
                      text[:1000]
                  )

                  return md



              if ext in [
                  ".ts",
                  ".tsx",
                  ".js",
                  ".jsx"
              ]:

                  syms=symbols(text)

                  if syms:

                      md.append(
                          "Exports and structures:\n"
                          +
                          "\n".join(
                              "- "+x
                              for x in syms
                          )
                      )


                  imps=imports(text)

                  if imps:

                      lines=[]

                      for i in imps:

                          resolved=resolve_import(
                              i
                          )

                          if resolved:

                              lines.append(
                                  f"- {i} -> {resolved}"
                              )

                          else:

                              lines.append(
                                  f"- {i}"
                              )


                      md.append(
                          "Dependencies:\n"
                          +
                          "\n".join(lines)
                      )


                  if not syms:

                      md.append(
                          "Source file. "
                          "Contains executable logic."
                      )


              else:

                  md.append(
                      "File type: "
                      +
                      ext
                  )


              return md



          def create_report():

              lines=[]

              lines.append(
                  "# Semantic Export Report\n"
              )

              lines.append(
                  f"Exported: `{TARGET}`\n"
              )


              for root,dirs,files in os.walk(OUT):

                  rel=Path(root).relative_to(
                      OUT
                  )

                  lines.append(
                      f"\n## Folder {rel}\n"
                  )


                  for f in files:

                      p=Path(root)/f

                      lines.append(
                          f"\n### {f}\n"
                      )

                      lines.extend(
                          analyze(p)
                      )


              Path(
                  f"{EXPORT_NAME}_semantic.md"
              ).write_text(
                  "\n\n".join(lines),
                  encoding="utf-8"
              )



          def create_zip():

              name=f"{EXPORT_NAME}.zip"

              with zipfile.ZipFile(
                  name,
                  "w",
                  zipfile.ZIP_DEFLATED
              ) as z:


                  for root,dirs,files in os.walk(OUT):

                      for f in files:

                          file=Path(root)/f

                          z.write(
                              file,
                              file.relative_to(
                                  OUT.parent
                              )
                          )


                  z.write(
                      f"{EXPORT_NAME}_semantic.md"
                  )


              print(
                  name
              )



          copy_target()
          create_report()
          create_zip()

          PY



      - name: Run semantic exporter
        env:
          TARGET: ${{ github.event.inputs.path }}
        run: |
          python semantic_export.py



      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: semantic-${{ github.event.inputs.path }}
          path: |
            *.zip
            *_semantic.md
