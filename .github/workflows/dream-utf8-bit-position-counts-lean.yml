name: DREAM UTF-8 Bit Position Counts Lean

on:
  workflow_dispatch:
    inputs:
      code_roots:
        description: "Comma-separated product application code roots"
        required: false
        default: "app,components,coresurfaces,daydreams,dr-eams,dreamdmbar,dreamr,engine,engins,hooks"
      code_extensions:
        description: "Comma-separated source-code extensions"
        required: false
        default: ".ts,.tsx,.js,.jsx,.mjs,.cjs"

permissions:
  contents: read

jobs:
  utf8-bit-position-counts-lean:
    name: Count UTF-8 bit positions only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count UTF-8 binary 1-bit positions without dumping every bit
        shell: bash
        env:
          CODE_ROOTS: ${{ inputs.code_roots || 'app,components,coresurfaces,daydreams,dr-eams,dreamdmbar,dreamr,engine,engins,hooks' }}
          CODE_EXTENSIONS: ${{ inputs.code_extensions || '.ts,.tsx,.js,.jsx,.mjs,.cjs' }}
        run: |
          cat > /tmp/dream_utf8_bit_position_counts_lean.py <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path
          from typing import Iterable, List

          OUT_DIR = Path(".dream-utf8-bit-position-counts-lean")
          ZIP_PATH = Path("dream-utf8-bit-position-counts-lean.zip")

          EXCLUDE_DIRS = {
              ".git",
              ".github",
              ".ci",
              "node_modules",
              ".next",
              "out",
              "dist",
              "build",
              "coverage",
              ".turbo",
              ".vercel",
              ".cache",
              "__pycache__",
              ".pytest_cache",
              ".dream-utf8-bit-position-counts-lean",
          }

          EXCLUDE_FILE_NAMES = {
              "package-lock.json",
              "pnpm-lock.yaml",
              "yarn.lock",
              "bun.lockb",
              "tsconfig.tsbuildinfo",
              "dream-utf8-bit-position-counts-lean.zip",
          }

          MAX_FILE_BYTES = 5_000_000


          def code_roots() -> List[str]:
              raw = os.environ.get("CODE_ROOTS", "app,components,coresurfaces,daydreams,dr-eams,dreamdmbar,dreamr,engine,engins,hooks")
              return [item.strip().strip("/") for item in raw.split(",") if item.strip()]


          def code_extensions() -> set[str]:
              raw = os.environ.get("CODE_EXTENSIONS", ".ts,.tsx,.js,.jsx,.mjs,.cjs")
              return {item.strip().lower() for item in raw.split(",") if item.strip()}


          def should_include(path: Path, repo_root: Path) -> bool:
              if not path.is_file():
                  return False

              rel = path.relative_to(repo_root)

              if any(part in EXCLUDE_DIRS for part in rel.parts):
                  return False

              if path.name in EXCLUDE_FILE_NAMES:
                  return False

              top = rel.as_posix().split("/", 1)[0]
              if top not in code_roots():
                  return False

              if path.suffix.lower() not in code_extensions():
                  return False

              if path.stat().st_size > MAX_FILE_BYTES:
                  return False

              return True


          def iter_code_files(repo_root: Path) -> Iterable[Path]:
              for path in sorted(repo_root.rglob("*")):
                  if should_include(path, repo_root):
                      yield path


          def write_csv(path: Path, fieldnames: List[str], rows: Iterable[dict]) -> int:
              path.parent.mkdir(parents=True, exist_ok=True)
              count = 0
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(row)
                      count += 1
              return count


          def zip_dir(source: Path, destination: Path) -> None:
              if destination.exists():
                  destination.unlink()

              with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(source).as_posix())


          def empty_slots() -> dict[int, dict[str, int]]:
              return {
                  position: {"ones": 0, "zeros": 0}
                  for position in range(1, 9)
              }


          def add_byte_to_slots(byte: int, slots: dict[int, dict[str, int]]) -> None:
              bits = f"{byte:08b}"
              for index, bit in enumerate(bits, start=1):
                  if bit == "1":
                      slots[index]["ones"] += 1
                  else:
                      slots[index]["zeros"] += 1


          def slot_rows(slots: dict[int, dict[str, int]]) -> list[dict]:
              rows = []
              for position in range(1, 9):
                  ones = slots[position]["ones"]
                  zeros = slots[position]["zeros"]
                  total = ones + zeros
                  rows.append({
                      "byteBitPosition": position,
                      "onesCount": ones,
                      "zerosCount": zeros,
                      "totalCount": total,
                      "oneRatio": ones / total if total else 0,
                  })
              return rows


          def main() -> int:
              repo_root = Path(".").resolve()

              if OUT_DIR.exists():
                  shutil.rmtree(OUT_DIR)

              OUT_DIR.mkdir(parents=True)
              (OUT_DIR / ".de").mkdir(parents=True)
              (OUT_DIR / "Counts").mkdir(parents=True)

              global_slots = empty_slots()
              root_slots: dict[str, dict[int, dict[str, int]]] = {}

              file_rows = []
              skipped_non_utf8 = []
              total_bytes = 0

              for file_path in iter_code_files(repo_root):
                  source_path = file_path.relative_to(repo_root).as_posix()
                  root_name = source_path.split("/", 1)[0]

                  try:
                      text = file_path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      skipped_non_utf8.append(source_path)
                      continue

                  data = text.encode("utf-8")
                  total_bytes += len(data)

                  file_slots = empty_slots()
                  root_slots.setdefault(root_name, empty_slots())

                  for byte in data:
                      add_byte_to_slots(byte, global_slots)
                      add_byte_to_slots(byte, file_slots)
                      add_byte_to_slots(byte, root_slots[root_name])

                  file_ones = sum(file_slots[pos]["ones"] for pos in range(1, 9))
                  file_zeros = sum(file_slots[pos]["zeros"] for pos in range(1, 9))
                  file_bits = file_ones + file_zeros

                  file_rows.append({
                      "sourcePath": source_path,
                      "root": root_name,
                      "utf8Bytes": len(data),
                      "bits": file_bits,
                      "onesCount": file_ones,
                      "zerosCount": file_zeros,
                      "oneRatio": file_ones / file_bits if file_bits else 0,
                      "sha256OfUtf8Bytes": hashlib.sha256(data).hexdigest(),
                  })

              global_rows = slot_rows(global_slots)

              write_csv(
                  OUT_DIR / "Counts" / "_BIT_POSITION_COUNTS.csv",
                  ["byteBitPosition", "onesCount", "zerosCount", "totalCount", "oneRatio"],
                  global_rows,
              )

              write_csv(
                  OUT_DIR / "Counts" / "_FILE_COUNTS.csv",
                  ["sourcePath", "root", "utf8Bytes", "bits", "onesCount", "zerosCount", "oneRatio", "sha256OfUtf8Bytes"],
                  file_rows,
              )

              root_rows = []
              for root_name in sorted(root_slots):
                  for row in slot_rows(root_slots[root_name]):
                      root_rows.append({"root": root_name, **row})

              write_csv(
                  OUT_DIR / "Counts" / "_ROOT_BIT_POSITION_COUNTS.csv",
                  ["root", "byteBitPosition", "onesCount", "zerosCount", "totalCount", "oneRatio"],
                  root_rows,
              )

              total_ones = sum(row["onesCount"] for row in global_rows)
              total_zeros = sum(row["zerosCount"] for row in global_rows)
              total_bits = total_ones + total_zeros

              manifest = {
                  "format": "dreamengin.utf8-bit-position-counts-lean.v1",
                  "scope": "product application source code only",
                  "operation": "source text -> UTF-8 bytes -> count 1 bits by position 1..8",
                  "important": "This lean version does not output raw binary strings or one row per 1-bit.",
                  "includedRoots": code_roots(),
                  "includedExtensions": sorted(code_extensions()),
                  "bitPositionModel": {
                      "positions": "12345678",
                      "exampleBits": "00010011",
                      "exampleOnes": ["4=1", "7=1", "8=1"],
                      "graph": "x = byteBitPosition, y = onesCount",
                  },
                  "totals": {
                      "files": len(file_rows),
                      "utf8Bytes": total_bytes,
                      "bits": total_bits,
                      "onesCount": total_ones,
                      "zerosCount": total_zeros,
                      "oneRatio": total_ones / total_bits if total_bits else 0,
                  },
                  "outputs": {
                      "globalBitPositionCounts": "Counts/_BIT_POSITION_COUNTS.csv",
                      "rootBitPositionCounts": "Counts/_ROOT_BIT_POSITION_COUNTS.csv",
                      "fileCounts": "Counts/_FILE_COUNTS.csv",
                  },
                  "globalBitPositionCounts": global_rows,
                  "skippedNonUtf8": skipped_non_utf8,
              }

              (OUT_DIR / ".de" / "utf8-bit-position-counts-lean-map.json").write_text(
                  json.dumps(manifest, indent=2),
                  encoding="utf-8",
              )

              report = [
                  "# DREAM UTF-8 Bit Position Counts Lean",
                  "",
                  "This artifact counts which bit positions are `1` in UTF-8 application code bytes.",
                  "",
                  "It does **not** dump raw binary strings.",
                  "It does **not** write one CSV row per `1` bit.",
                  "",
                  "Example:",
                  "",
                  "```text",
                  "positions: 12345678",
                  "bits:      00010011",
                  "output:    4=1, 7=1, 8=1",
                  "```",
                  "",
                  "## Main graph file",
                  "",
                  "```text",
                  "Counts/_BIT_POSITION_COUNTS.csv",
                  "```",
                  "",
                  "Graph:",
                  "",
                  "```text",
                  "x-axis = byteBitPosition",
                  "y-axis = onesCount",
                  "```",
                  "",
                  "## Other useful counts",
                  "",
                  "```text",
                  "Counts/_ROOT_BIT_POSITION_COUNTS.csv",
                  "Counts/_FILE_COUNTS.csv",
                  ".de/utf8-bit-position-counts-lean-map.json",
                  "```",
                  "",
                  f"- Files transformed: `{len(file_rows)}`",
                  f"- UTF-8 bytes counted: `{total_bytes}`",
                  f"- Total bits counted: `{total_bits}`",
                  f"- Total one-bits counted: `{total_ones}`",
              ]

              (OUT_DIR / "DREAM_UTF8_BIT_POSITION_COUNTS_LEAN.md").write_text(
                  "\n".join(report),
                  encoding="utf-8",
              )

              zip_dir(OUT_DIR, ZIP_PATH)

              print(f"Created {ZIP_PATH}")
              print("Lean mode: no raw binary dump, no per-one-bit rows")
              print(f"Files transformed: {len(file_rows)}")
              print(f"UTF-8 bytes counted: {total_bytes}")
              print(f"Total bits counted: {total_bits}")
              print(f"Total one-bits counted: {total_ones}")
              print("Graph CSV: Counts/_BIT_POSITION_COUNTS.csv")

              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 /tmp/dream_utf8_bit_position_counts_lean.py

      - name: Upload lean UTF-8 bit position counts artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-utf8-bit-position-counts-lean
          path: dream-utf8-bit-position-counts-lean.zip
          if-no-files-found: error
