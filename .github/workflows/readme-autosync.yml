name: README Product Autosync

on:
  workflow_dispatch:

  schedule:
    # Weekly at 6:00 AM Pacific during daylight saving time.
    - cron: "0 13 * * 1"
    # Weekly at 6:00 AM Pacific during standard time.
    - cron: "0 14 * * 1"

permissions:
  contents: write

concurrency:
  group: readme-product-autosync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacific-time-gate:
    name: Allow only Monday 6 AM Pacific or manual runs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check Pacific time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch run allowed."
            exit 0
          fi

          PACIFIC_DAY="$(TZ=America/Los_Angeles date +%u)"
          PACIFIC_HOUR="$(TZ=America/Los_Angeles date +%H)"

          if [ "$PACIFIC_DAY" = "1" ] && [ "$PACIFIC_HOUR" = "06" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run allowed. Current Pacific time is Monday 06:00."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run skipped. Current Pacific day/hour is ${PACIFIC_DAY}/${PACIFIC_HOUR}, not Monday/06."
          fi

  readme-product-autosync:
    name: Regenerate DREAMengin README
    runs-on: ubuntu-latest
    needs: pacific-time-gate
    if: needs.pacific-time-gate.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 25
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate and commit README
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          README_AUTOSYNC_DIR="$RUNNER_TEMP/readme-autosync"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generate_readme() {
            mkdir -p "$README_AUTOSYNC_DIR"

            git ls-files \
              ':!:node_modules/**' \
              ':!:.next/**' \
              ':!:out/**' \
              ':!:dist/**' \
              ':!:coverage/**' \
              ':!:playwright-report/**' \
              ':!:test-results/**' \
              ':!:.turbo/**' \
              ':!:.vercel/**' \
              ':!:*.tsbuildinfo' \
              > "$README_AUTOSYNC_DIR/all-files.txt"

            echo "Tracked files counted:"
            wc -l "$README_AUTOSYNC_DIR/all-files.txt"

            pnpm tsx scripts/readme-autosync.ts \
              --changed-files "$README_AUTOSYNC_DIR/all-files.txt" \
              --sections-file "$README_AUTOSYNC_DIR/product-sections.json" \
              --max-lines 2800

            pnpm tsx scripts/generate-readme.ts \
              --changed-files "$README_AUTOSYNC_DIR/all-files.txt" \
              --sections-file "$README_AUTOSYNC_DIR/product-sections.json" \
              --summary-file "$README_AUTOSYNC_DIR/readme-summary.json" \
              --max-lines 2800
          }

          echo "Syncing with origin/${BRANCH} before README generation..."
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git rebase "origin/$BRANCH"

          generate_readme

          if git diff --quiet -- README.md; then
            echo "README.md did not change."
            exit 0
          fi

          git add README.md
          git commit -m "docs(readme): autosync product README [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."

            if git push origin "HEAD:${BRANCH}"; then
              echo "README.md pushed."
              exit 0
            fi

            echo "Push rejected. Rebasing latest origin/${BRANCH}, regenerating README.md, and retrying..."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"

            generate_readme

            if git diff --quiet -- README.md; then
              echo "README.md no longer differs after rebase."
              exit 0
            fi

            git add README.md

            if git diff --cached --quiet; then
              echo "No staged README.md changes after regeneration."
              exit 0
            fi

            git commit --amend --no-edit
          done

          echo "Failed to push README.md after 3 attempts."
          exit 1

      - name: Upload README autosync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-product-autosync
          path: |
            README.md
            ${{ runner.temp }}/readme-autosync/all-files.txt
            ${{ runner.temp }}/readme-autosync/product-sections.json
            ${{ runner.temp }}/readme-autosync/readme-summary.json
