      - name: Commit README update
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Syncing with origin/${BRANCH} before committing README.md..."
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          echo "Rebuilding tracked-file inventory after rebase..."
          README_AUTOSYNC_DIR="${README_AUTOSYNC_DIR:-$RUNNER_TEMP/readme-autosync}"
          mkdir -p "$README_AUTOSYNC_DIR"

          git ls-files \
            ':!:node_modules/**' \
            ':!:.next/**' \
            ':!:out/**' \
            ':!:dist/**' \
            ':!:coverage/**' \
            ':!:playwright-report/**' \
            ':!:test-results/**' \
            ':!:.turbo/**' \
            ':!:.vercel/**' \
            ':!:*.tsbuildinfo' \
            > "$README_AUTOSYNC_DIR/all-files.txt"

          echo "Regenerating README.md on top of latest origin/${BRANCH}..."
          pnpm tsx scripts/generate-readme.ts \
            --changed-files "$README_AUTOSYNC_DIR/all-files.txt" \
            --summary-file "$README_AUTOSYNC_DIR/readme-summary.json" \
            --max-lines 2800

          if git diff --quiet -- README.md; then
            echo "README.md did not change."
            exit 0
          fi

          git add README.md
          git commit -m "docs(readme): autosync product README [skip ci]"
          git push origin "HEAD:${BRANCH}"
