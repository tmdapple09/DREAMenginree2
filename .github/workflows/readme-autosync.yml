name: README Product Sync

on:
  workflow_dispatch:

  schedule:
    # Weekly at 6:00 AM Pacific during daylight saving time
    - cron: "0 13 * * 1"
    # Weekly at 6:00 AM Pacific during standard time
    - cron: "0 14 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-product-autosync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacific-time-gate:
    name: Allow only Monday 6 AM Pacific or manual runs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check Pacific time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch run allowed."
            exit 0
          fi

          PACIFIC_DAY="$(TZ=America/Los_Angeles date +%u)"
          PACIFIC_HOUR="$(TZ=America/Los_Angeles date +%H)"

          if [ "$PACIFIC_DAY" = "1" ] && [ "$PACIFIC_HOUR" = "06" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run allowed. Current Pacific time is Monday 06:00."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run skipped. Current Pacific day/hour is ${PACIFIC_DAY}/${PACIFIC_HOUR}, not Monday/06."
          fi

  readme-product-autosync:
    name: Regenerate DREAMengin README
    runs-on: ubuntu-latest
    needs: pacific-time-gate
    if: needs.pacific-time-gate.outputs.should_run == 'true'

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 25
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tracked-file inventory
        shell: bash
        run: |
          mkdir -p .readme-autosync

          git ls-files \
            ':!:node_modules/**' \
            ':!:.next/**' \
            ':!:out/**' \
            ':!:dist/**' \
            ':!:coverage/**' \
            ':!:playwright-report/**' \
            ':!:test-results/**' \
            ':!:.turbo/**' \
            ':!:.vercel/**' \
            ':!:*.tsbuildinfo' \
            > .readme-autosync/all-files.txt

          cp .readme-autosync/all-files.txt .readme-autosync/changed-files.txt

          echo "Tracked files counted:"
          wc -l .readme-autosync/all-files.txt

      - name: Verify README autosync scripts exist
        shell: bash
        run: |
          test -f scripts/generate-readme.ts
          test -f scripts/readme-autosync.ts

      - name: Typecheck README autosync scripts
        shell: bash
        run: |
          pnpm exec tsc --noEmit --skipLibCheck \
            scripts/generate-readme.ts \
            scripts/readme-autosync.ts

      - name: Generate README professional front door and product sections
        shell: bash
        run: |
          pnpm tsx scripts/generate-readme.ts \
            --changed-files .readme-autosync/all-files.txt \
            --summary-file .readme-autosync/readme-summary.json \
            --max-lines 2800

      - name: Validate README product sections
        id: validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const readmePath = "README.md";
          const reportPath = ".readme-autosync/readme-coverage-report.md";
          const jsonPath = ".readme-autosync/readme-coverage-report.json";

          if (!fs.existsSync(readmePath)) {
            throw new Error("README.md does not exist after generation.");
          }

          const readme = fs.readFileSync(readmePath, "utf8");
          const lines = readme.split(/\r?\n/g);

          const requiredSections = [
            "1. Project Overview",
            "2. Getting Started",
            "3. Usage, Configuration & Project Notes",
            "4. Tech Stack & Monorepo Layout",
            "5. The Engins and DayDreams",
            "6. Dual Runtimes",
            "7. Shared Dreams",
            "8. DreamR — Human Media",
            "9. The Shop",
            "10. The Marketplace",
            "11. Ads & User Ads",
            "12. The DreamDmBar",
            "13. Messaging",
            "14. HomeDream",
            "15. DreamSpace",
            "16. Dreams / Widgets / Windows / Surfaces",
            "17. User-Facing Modularity",
            "18. Custom Engins",
            "19. Full Website Customizability",
            "20. Backend, System, Core & CoreSurfaces",
          ];

          const failures = [];
          const warnings = [];

          if (!readme.trim()) {
            failures.push("README.md is empty.");
          }

          if (!/^#\s+DREAMengin/m.test(readme)) {
            failures.push("README must start with a DREAMengin project title.");
          }

          for (const section of requiredSections) {
            const escaped = section.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const pattern = new RegExp(`^##\\s+${escaped}\\s*$`, "m");
            if (!pattern.test(readme)) {
              failures.push(`Missing section heading: ${section}`);
            }
          }

          const productSections = requiredSections.slice(3);

          for (const section of productSections) {
            const escaped = section.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const start = readme.search(new RegExp(`^##\\s+${escaped}\\s*$`, "m"));

            if (start === -1) continue;

            const rest = readme.slice(start + section.length);
            const next = rest.search(/^##\s+\d+\.\s+/m);
            const body = next === -1 ? rest : rest.slice(0, next);

            if (!/###\s+Plain English/i.test(body)) {
              failures.push(`${section} is missing a Plain English subsection.`);
            }

            if (!/###\s+Repo Evidence/i.test(body)) {
              failures.push(`${section} is missing a Repo Evidence subsection.`);
            }

            if (!/###\s+Matched Files/i.test(body)) {
              failures.push(`${section} is missing a Matched Files subsection.`);
            }

            if (!/`[^`]+\.(ts|tsx|js|jsx|mjs|cjs|css|sql|md|json|ya?ml)`/i.test(body)) {
              failures.push(`${section} does not list concrete repo files.`);
            }
          }

          if (lines.length > 2900) {
            warnings.push(`README is ${lines.length} lines. Target is around 2800 lines.`);
          }

          if (/@\/lib\//g.test(readme)) {
            failures.push("README still contains stale @/lib/ import references.");
          }

          if (/Files tracked:\s*\*\*0\*\*/g.test(readme)) {
            failures.push("README contains one or more generated sections with Files tracked: **0**.");
          }

          if (/$begin:math:text$no files currently matched$end:math:text$/g.test(readme)) {
            failures.push("README contains '(no files currently matched)'.");
          }

          if (/(…|\.\.\.)\s*$begin:math:text$\\d\+\\s\+more files$end:math:text$/g.test(readme)) {
            failures.push("README contains truncated file listings like '… (N more files)'.");
          }

          const report = [
            "# README Product Autosync Report",
            "",
            `README lines: ${lines.length}`,
            `Required sections checked: ${requiredSections.length}`,
            `Product sections checked: ${productSections.length}`,
            `Warnings: ${warnings.length}`,
            `Failures: ${failures.length}`,
            "",
            "## Failures",
            failures.length ? failures.map((failure) => `- ${failure}`).join("\n") : "- None",
            "",
            "## Warnings",
            warnings.length ? warnings.map((warning) => `- ${warning}`).join("\n") : "- None",
            "",
          ].join("\n");

          fs.writeFileSync(reportPath, report);
          fs.writeFileSync(jsonPath, JSON.stringify({
            readmeLines: lines.length,
            requiredSections,
            productSections,
            warnings,
            failures,
            hasFailures: failures.length > 0,
          }, null, 2));

          console.log(report);

          if (failures.length) {
            process.exit(1);
          }
          NODE

      - name: Detect README autosync changes
        id: autosync
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- README.md scripts/generate-readme.ts scripts/readme-autosync.ts .github/workflows/readme-autosync.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README autosync update
        if: steps.autosync.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md scripts/generate-readme.ts scripts/readme-autosync.ts .github/workflows/readme-autosync.yml
          git commit -m "docs(readme): autosync product README [skip ci]"
          git push

      - name: Upload README autosync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-product-autosync
          path: |
            README.md
            .readme-autosync/all-files.txt
            .readme-autosync/changed-files.txt
            .readme-autosync/readme-summary.json
            .readme-autosync/readme-coverage-report.md
            .readme-autosync/readme-coverage-report.json
