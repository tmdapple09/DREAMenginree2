name: README Autosync

on:
  push:
    branches:
      - main
      - completedream
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolve-readme:
    name: Evolve README From Repository Reality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build repository model
        run: |
          pnpm tsx scripts/generate-readme.ts \
            --readme README.md \
            --file-tree FILE_TREE.md \
            --architecture ARCHITECTURE.md \
            --repo-state REPO_STATE.md \
            --core-glob "CORE*.md" \
            --write

      - name: Detect README changes
        id: readme
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README updates
        if: github.event_name == 'push' && steps.readme.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit \
            -m "docs(readme): evolve repository model [skip ci]"

          git push

      - name: Upload generated README
        if: github.event_name == 'pull_request' && steps.readme.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evolved-readme
          path: README.md

      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const changed =
              "${{ steps.readme.outputs.changed }}" === "true";

            const body = changed
              ? [
                  "<!-- readme-evolution -->",
                  "## 📖 README Evolution Engine",
                  "",
                  "README.md was regenerated from the current repository state.",
                  "",
                  "Inputs:",
                  "- FILE_TREE.md",
                  "- ARCHITECTURE.md",
                  "- CORE*.md",
                  "- REPO_STATE.md",
                  "- Capability metadata",
                  "- Runtime metadata",
                  "- Generated registries",
                  "- Existing README.md",
                  "",
                  "Artifact: `evolved-readme`"
                ].join("\n")
              : [
                  "<!-- readme-evolution -->",
                  "## 📖 README Evolution Engine",
                  "",
                  "README.md already matches the current repository state."
                ].join("\n");

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

            const existing = comments.find(
              c =>
                c.user?.login === "github-actions[bot]" &&
                c.body?.includes("<!-- readme-evolution -->")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Step summary
        if: always()
        run: |
          echo "README Evolution Engine completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source of truth:" >> $GITHUB_STEP_SUMMARY
          echo "- FILE_TREE.md" >> $GITHUB_STEP_SUMMARY
          echo "- ARCHITECTURE.md" >> $GITHUB_STEP_SUMMARY
          echo "- CORE*.md" >> $GITHUB_STEP_SUMMARY
          echo "- REPO_STATE.md" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime registries" >> $GITHUB_STEP_SUMMARY
          echo "- Capability metadata" >> $GITHUB_STEP_SUMMARY
