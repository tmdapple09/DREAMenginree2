name: README Full Coverage Autosync

on:
  workflow_dispatch:

  schedule:
    # 6:00 AM Pacific during daylight saving time
    - cron: "0 13 * * *"
    # 6:00 AM Pacific during standard time
    - cron: "0 14 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-full-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacific-time-gate:
    name: Allow only 6 AM Pacific or manual runs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check Pacific time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch run allowed."
            exit 0
          fi

          PACIFIC_HOUR="$(TZ=America/Los_Angeles date +%H)"

          if [ "$PACIFIC_HOUR" = "06" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run allowed. Current Pacific hour is 06."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run skipped. Current Pacific hour is $PACIFIC_HOUR, not 06."
          fi

  readme-full-coverage:
    name: Regenerate and report full README coverage
    runs-on: ubuntu-latest
    needs: pacific-time-gate
    if: needs.pacific-time-gate.outputs.should_run == 'true'

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 25
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build complete tracked-file inventory
        shell: bash
        run: |
          mkdir -p .readme-autosync

          git ls-files \
            ':!:node_modules/**' \
            ':!:.next/**' \
            ':!:out/**' \
            ':!:dist/**' \
            ':!:coverage/**' \
            ':!:playwright-report/**' \
            ':!:test-results/**' \
            ':!:.turbo/**' \
            ':!:.vercel/**' \
            ':!:*.tsbuildinfo' \
            > .readme-autosync/all-files.txt

          cp .readme-autosync/all-files.txt .readme-autosync/changed-files.txt

          echo "Tracked files counted:"
          wc -l .readme-autosync/all-files.txt

      - name: Regenerate README from entire repository
        shell: bash
        run: |
          if [ ! -f scripts/generate-readme.ts ]; then
            echo "Missing scripts/generate-readme.ts"
            exit 1
          fi

          pnpm tsx scripts/generate-readme.ts \
            --changed-files .readme-autosync/all-files.txt \
            --summary-file .readme-autosync/readme-summary.json

      - name: Report README full coverage
        id: validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const inventoryPath = ".readme-autosync/all-files.txt";
          const readmePath = "README.md";
          const reportPath = ".readme-autosync/readme-coverage-report.md";
          const jsonPath = ".readme-autosync/readme-coverage-report.json";

          const repoFiles = fs.readFileSync(inventoryPath, "utf8")
            .split(/\r?\n/g)
            .map((line) => line.trim())
            .filter(Boolean)
            .map((file) => file.replace(/\\/g, "/"));

          if (!fs.existsSync(readmePath)) {
            throw new Error("README.md does not exist after generation.");
          }

          const readme = fs.readFileSync(readmePath, "utf8");

          const fileSet = new Set(repoFiles);
          const dirSet = new Set(["."]);

          for (const file of repoFiles) {
            const parts = file.split("/");
            let current = "";
            for (let i = 0; i < parts.length - 1; i++) {
              current = current ? `${current}/${parts[i]}` : parts[i];
              dirSet.add(current);
            }
          }

          function normalizeCandidate(raw) {
            return String(raw)
              .trim()
              .replace(/^\.?\//, "")
              .replace(/#.*$/, "")
              .replace(/\?.*$/, "")
              .replace(/[),.;:]+$/g, "")
              .replace(/\\ /g, " ")
              .replace(/\\/g, "/");
          }

          function looksLikeRepoPath(raw) {
            const value = normalizeCandidate(raw);

            if (!value) return false;
            if (value.startsWith("http://")) return false;
            if (value.startsWith("https://")) return false;
            if (value.startsWith("mailto:")) return false;
            if (value.startsWith("#")) return false;
            if (value.includes("*")) return false;
            if (value.includes("{")) return false;
            if (value.includes("}")) return false;
            if (value.includes("$")) return false;
            if (value.includes("\n")) return false;
            if (value.length > 180) return false;

            return (
              value.includes("/") ||
              /^[A-Za-z0-9._-]+\.[A-Za-z0-9]+$/.test(value) ||
              value.startsWith(".github") ||
              value.startsWith(".env")
            );
          }

          function existsInRepo(candidate) {
            const value = normalizeCandidate(candidate);
            return fileSet.has(value) || dirSet.has(value) || fs.existsSync(value);
          }

          const failures = [];
          const warnings = [];

          if (!readme.trim()) {
            failures.push("README.md is empty.");
          }

          if (!/ARCHITECTURE\.md/i.test(readme)) {
            failures.push("README does not mention ARCHITECTURE.md authority.");
          }

          if (/@\/lib\//g.test(readme)) {
            failures.push("README still contains stale @/lib/ import references.");
          }

          if (/Files tracked:\s*\*\*0\*\*/g.test(readme)) {
            failures.push("README contains one or more generated sections with Files tracked: **0**.");
          }

          if (/\(no files currently matched\)/g.test(readme)) {
            failures.push("README contains '(no files currently matched)', which means a section is stale or uncovered.");
          }

          if (/(…|\.\.\.)\s*\(\d+\s+more files\)/g.test(readme)) {
            failures.push("README contains truncated file listings like '… (N more files)'. Full coverage requires every tracked path to be listed.");
          }

          const missingFiles = repoFiles.filter((file) => !readme.includes(file));

          if (missingFiles.length) {
            failures.push(`README is missing ${missingFiles.length} tracked file path(s).`);
          }

          const extractedPaths = new Set();

          const markdownLinkRe = /\[[^\]]+\]\((?!https?:\/\/|mailto:|#)([^)#]+)(?:#[^)]+)?\)/g;
          for (const match of readme.matchAll(markdownLinkRe)) {
            const candidate = normalizeCandidate(match[1]);
            if (looksLikeRepoPath(candidate)) extractedPaths.add(candidate);
          }

          const backtickRe = /`([^`]+)`/g;
          for (const match of readme.matchAll(backtickRe)) {
            const candidate = normalizeCandidate(match[1]);
            if (looksLikeRepoPath(candidate)) extractedPaths.add(candidate);
          }

          const codeFenceRe = /```(?:text|txt)?\n([\s\S]*?)```/g;
          for (const fence of readme.matchAll(codeFenceRe)) {
            const body = fence[1];
            if (!/[├└]──/.test(body)) continue;

            const stack = [];

            for (const rawLine of body.split(/\r?\n/g)) {
              const match = rawLine.match(/^([│\s]*)(?:├──|└──)\s+(.+)$/);
              if (!match) continue;

              const prefix = match[1] || "";
              let name = match[2].trim();

              if (!name || name.startsWith("(")) continue;
              if (/more files/i.test(name)) continue;

              name = name
                .replace(/\s+#.*$/g, "")
                .replace(/\/$/g, "")
                .trim();

              if (!name) continue;

              const depth = Math.floor(prefix.replace(/│/g, " ").length / 4);
              stack[depth] = name;
              stack.length = depth + 1;

              const fullPath = normalizeCandidate(stack.join("/"));
              if (looksLikeRepoPath(fullPath)) extractedPaths.add(fullPath);
            }
          }

          const stalePaths = [...extractedPaths]
            .filter((candidate) => looksLikeRepoPath(candidate))
            .filter((candidate) => !existsInRepo(candidate));

          if (stalePaths.length) {
            failures.push(`README contains ${stalePaths.length} stale or nonexistent repo path(s).`);
          }

          const h2s = [...readme.matchAll(/^##\s+(.+)$/gm)].map((m) => m[1].trim());
          const seenH2 = new Set();
          const duplicateH2 = [];

          for (const heading of h2s) {
            const key = heading.toLowerCase();
            if (seenH2.has(key)) duplicateH2.push(heading);
            seenH2.add(key);
          }

          if (duplicateH2.length) {
            warnings.push(`Duplicate README H2 headings detected: ${duplicateH2.join(", ")}`);
          }

          const appRoutes = repoFiles.filter((file) => /^app\/api\/.+\/route\.tsx?$/.test(file));
          const appPages = repoFiles.filter((file) => /^app\/.+\/page\.tsx?$/.test(file));
          const migrations = repoFiles.filter((file) => /^supabase\/migrations\/.+\.sql$/.test(file));
          const engins = repoFiles.filter((file) => /^engins\/.+\.(ts|tsx|js|jsx|mjs|cjs)$/.test(file));
          const workflows = repoFiles.filter((file) => /^\.github\/workflows\/.+\.ya?ml$/.test(file));

          const requiredGroups = [
            ["API routes", appRoutes],
            ["App pages", appPages],
            ["Supabase migrations", migrations],
            ["Engins", engins],
            ["GitHub workflows", workflows],
          ];

          for (const [name, files] of requiredGroups) {
            const missing = files.filter((file) => !readme.includes(file));
            if (missing.length) {
              failures.push(`README is missing ${missing.length}/${files.length} ${name}.`);
            }
          }

          const report = [
            "# README Full Coverage Report",
            "",
            `Tracked files scanned: ${repoFiles.length}`,
            `Extracted README repo paths: ${extractedPaths.size}`,
            `Missing tracked files: ${missingFiles.length}`,
            `Stale README paths: ${stalePaths.length}`,
            `Warnings: ${warnings.length}`,
            `Failures: ${failures.length}`,
            "",
            "## Failures",
            failures.length ? failures.map((f) => `- ${f}`).join("\n") : "- None",
            "",
            "## Warnings",
            warnings.length ? warnings.map((w) => `- ${w}`).join("\n") : "- None",
            "",
            "## Missing tracked files",
            missingFiles.length ? missingFiles.map((f) => `- \`${f}\``).join("\n") : "- None",
            "",
            "## Stale README paths",
            stalePaths.length ? stalePaths.map((f) => `- \`${f}\``).join("\n") : "- None",
            "",
          ].join("\n");

          const hasCoverageIssues = failures.length > 0;

          fs.writeFileSync(reportPath, report);
          fs.writeFileSync(jsonPath, JSON.stringify({
            trackedFiles: repoFiles.length,
            extractedReadmePaths: extractedPaths.size,
            missingTrackedFiles: missingFiles,
            staleReadmePaths: stalePaths,
            warnings,
            failures,
            hasCoverageIssues,
          }, null, 2));

          console.log(report);

          if (hasCoverageIssues) {
            console.log("README coverage issues found. Marked in report artifact. Not failing workflow.");
          }

          process.exit(0);
          NODE

      - name: Detect README changes
        id: autosync
        if: always()
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "readme_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "readme_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README update
        if: steps.autosync.outputs.readme_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs(readme): full coverage autosync [skip ci]"
          git push

      - name: Upload README coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-full-coverage
          path: |
            README.md
            .readme-autosync/all-files.txt
            .readme-autosync/readme-summary.json
            .readme-autosync/readme-coverage-report.md
            .readme-autosync/readme-coverage-report.json
