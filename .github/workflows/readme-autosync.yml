name: README Autosync

on:
  push:
    branches:
      - main
      - completedream

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-autosync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autosync:
    name: Regenerate README from repository state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changed files
        shell: bash
        run: |
          mkdir -p .readme-autosync

          CHANGED_FILES=".readme-autosync/changed-files.txt"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > "$CHANGED_FILES"

          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git ls-files > "$CHANGED_FILES"
            else
              git diff --name-only "$BEFORE" "$AFTER" > "$CHANGED_FILES"
            fi

          else
            git ls-files > "$CHANGED_FILES"
          fi

          echo "Changed files:"
          cat "$CHANGED_FILES"

      - name: Regenerate README
        run: |
          pnpm tsx scripts/generate-readme.ts --changed-files .readme-autosync/changed-files.txt

      - name: Detect README changes
        id: autosync
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "readme_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "readme_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README update on push
        if: github.event_name == 'push' && steps.autosync.outputs.readme_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs(readme): autosync repository state [skip ci]"
          git push

      - name: Upload README artifact for pull requests
        if: github.event_name == 'pull_request' && steps.autosync.outputs.readme_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme-autosync
          path: README.md

      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- readme-autosync -->';

            const body =
              '${{ steps.autosync.outputs.readme_changed }}' === 'true'
                ? `${marker}

            ## 📖 README Autosync

            README.md was regenerated from the current repository state.

            Sources used:

            - FILE_TREE.md
            - ARCHITECTURE.md
            - CORE*.md
            - REPO_STATE.md
            - Capability metadata
            - Runtime metadata
            - Generated registries

            Updated README is available in the \`readme-autosync\` artifact.`
                : `${marker}

            ## 📖 README Autosync

            README.md already matches the current repository state.`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

            const existing = comments.find(
              comment =>
                comment.user.login === 'github-actions[bot]' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Step summary
        if: always()
        run: |
          echo "README Autosync completed." >> $GITHUB_STEP_SUMMARY
