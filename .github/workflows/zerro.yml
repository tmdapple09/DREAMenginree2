          # =========================================================
          # PIPELINE
          # =========================================================

          def run_role(
              role: str,
              model: str,
              prompt: str,
              output_path: Path,
          ) -> Optional[Dict[str, Any]]:
              print(f"\n  [{role}] using {model}...")
              result = ollama_ask_json(model, prompt)

              if result is None:
                  print(f"    {role} produced no valid JSON.")
                  return None

              result["_meta"] = {
                  "role": role,
                  "model": model,
                  "generated_at": now(),
              }

              atomic_write_json(output_path, result)
              print(f"    {role} complete.")
              return result


          def main() -> int:
              STATE_DIR.mkdir(parents=True, exist_ok=True)
              OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

              models = [
                  line.strip()
                  for line in MODELS_FILE.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

              if not models:
                  print("No models available.")
                  return 1

              mode = os.environ.get("ANALYSIS_MODE", "full")

              try:
                  n_new = int(os.environ.get("ZEROS_PER_RUN", "200"))
              except ValueError:
                  n_new = 200

              print(f"Mode: {mode}")
              print(f"Models available: {models}")

              # -------- PHASE 0: ZEROS --------
              if mode in ("full", "zeros_only"):
                  print("\n=== PHASE 0: COMPUTING ZETA ZEROS ===")
                  gammas = extend_cache(CACHE_FILE, n_new)
                  print(f"Total zeros in cache: {len(gammas)}")

                  zeros_payload = {
                      "computed_at": now(),
                      "count": len(gammas),
                      "zeros": [float(g) for g in gammas],
                      "sha256": sha256_text(
                          ",".join(f"{g:.17g}" for g in gammas)
                      ),
                  }
                  atomic_write_json(
                      STATE_DIR / "zeros.json",
                      zeros_payload,
                  )
              else:
                  zeros_payload = load_json(
                      STATE_DIR / "zeros.json",
                      {"zeros": [], "count": 0},
                  )

              gammas = np.array(zeros_payload.get("zeros", []))
              if len(gammas) == 0:
                  print("No zeros available.")
                  return 1

              if mode == "zeros_only":
                  print("Zeros-only mode. Skipping analysis.")
                  return 0

              # -------- ROLE ASSIGNMENT --------
              roles = assign_roles(models)

              print("\n=== ROLE ASSIGNMENT ===")
              for role_name, model_name in roles.items():
                  print(f"  {role_name:<12} -> {model_name or '(unavailable)'}")

              if not roles.get("extractor"):
                  print("No model available for extraction.")
                  return 1

              # -------- PHASE 1: EXTRACTOR --------
              print("\n=== PHASE 1: EXTRACTION ===")

              sample = gammas[-40:]
              sample_str = ", ".join(f"{z:.6f}" for z in sample)

              prompt = EXTRACTOR_PROMPT.format(
                  count=len(gammas),
                  sample=sample_str,
              )

              extraction = run_role(
                  "extractor",
                  roles["extractor"],
                  prompt,
                  STATE_DIR / "phase1_extraction.json",
              )

              if extraction is None:
                  # Fall back to computing stats ourselves.
                  print("  Extractor failed. Computing stats locally...")
                  recent = gammas[-31:]
                  spacings = np.diff(recent).tolist()
                  extraction = {
                      "count": len(gammas),
                      "first": float(gammas[0]),
                      "last": float(gammas[-1]),
                      "min_gamma": float(np.min(gammas)),
                      "max_gamma": float(np.max(gammas)),
                      "mean_spacing_recent_30": float(np.mean(spacings)),
                      "std_spacing_recent_30": float(np.std(spacings)),
                      "largest_gap_recent_30": float(np.max(spacings)),
                      "smallest_gap_recent_30": float(np.min(spacings)),
                      "spacings_recent_30": [float(s) for s in spacings],
                      "predicted_mean_spacing": float(
                          2 * np.pi / np.log(gammas[-1] / (2 * np.pi))
                      ),
                  }
                  atomic_write_json(
                      STATE_DIR / "phase1_extraction.json",
                      extraction,
                  )

              # -------- PHASE 2: SCANNER --------
              scanning = None

              if roles.get("scanner"):
                  print("\n=== PHASE 2: SCANNING ===")
                  prompt = SCANNER_PROMPT.format(
                      extraction=json.dumps(extraction, indent=2, ensure_ascii=False),
                  )
                  scanning = run_role(
                      "scanner",
                      roles["scanner"],
                      prompt,
                      STATE_DIR / "phase2_scanning.json",
                  )
              else:
                  print("\n=== PHASE 2: SKIPPED (no scanner model) ===")

              if scanning is None:
                  scanning = {
                      "clusters": [],
                      "large_gaps": [],
                      "periodicity_observed": False,
                      "anomalies": [],
                      "notes": "Scanner phase unavailable.",
                  }
                  atomic_write_json(
                      STATE_DIR / "phase2_scanning.json",
                      scanning,
                  )

              # -------- PHASE 3: ANALYST --------
              analysis = None

              if roles.get("analyst"):
                  print("\n=== PHASE 3: ANALYSIS ===")
                  prompt = ANALYST_PROMPT.format(
                      extraction=json.dumps(extraction, indent=2, ensure_ascii=False),
                      scanning=json.dumps(scanning, indent=2, ensure_ascii=False),
                  )
                  analysis = run_role(
                      "analyst",
                      roles["analyst"],
                      prompt,
                      STATE_DIR / "phase3_analysis.json",
                  )
              else:
                  print("\n=== PHASE 3: SKIPPED (no analyst model) ===")

              if analysis is None:
                  analysis = {
                      "density_ratio": None,
                      "density_consistent_with_rvm": None,
                      "spacing_std": None,
                      "spacing_consistent_with_gue": None,
                      "mathematical_observations": [],
                      "rh_status": {
                          "is_proven": False,
                          "is_disproven": False,
                          "can_this_data_decide": False,
                          "reasoning": "Analyst phase unavailable.",
                      },
                      "what_would_be_needed": [],
                      "honest_limits": [],
                  }
                  atomic_write_json(
                      STATE_DIR / "phase3_analysis.json",
                      analysis,
                  )

              # -------- PHASE 4: SYNTHESIZER --------
              print("\n=== PHASE 4: SYNTHESIS ===")

              synthesizer_model = roles.get("synthesizer") or roles.get("analyst") or roles.get("scanner") or roles.get("extractor")

              prompt = SYNTHESIZER_PROMPT.format(
                  extraction=json.dumps(extraction, indent=2, ensure_ascii=False),
                  scanning=json.dumps(scanning, indent=2, ensure_ascii=False),
                  analysis=json.dumps(analysis, indent=2, ensure_ascii=False),
              )

              synthesis = run_role(
                  "synthesizer",
                  synthesizer_model,
                  prompt,
                  STATE_DIR / "phase4_synthesis.json",
              )

              if synthesis is None:
                  synthesis = {
                      "final_status": {
                          "riemann_hypothesis_solved": False,
                          "confidence": 0.99,
                          "reasoning": "Synthesizer failed to produce output.",
                      },
                      "confirmed_findings": [],
                      "open_questions": [],
                      "numerology_speculations": [],
                      "coding_practice_speculations": [],
                      "physics_speculations": [],
                      "honest_summary": "Synthesis failed.",
                      "next_realistic_steps": [],
                  }
                  atomic_write_json(
                      STATE_DIR / "phase4_synthesis.json",
                      synthesis,
                  )

              # -------- FINAL REPORT --------
              final_report = {
                  "generated_at": now(),
                  "zeros_analyzed": len(gammas),
                  "roles": roles,
                  "phase1_extraction": extraction,
                  "phase2_scanning": scanning,
                  "phase3_analysis": analysis,
                  "phase4_synthesis": synthesis,
                  "honest_statement": (
                      "The Riemann Hypothesis remains unproven. "
                      "No model in this pipeline produced a proof. "
                      "Numerology patterns and coding/physics connections "
                      "are explicitly speculative and are not mathematical results. "
                      "Finite samples of zeros cannot decide RH in either direction."
                  ),
              }

              atomic_write_json(
                  OUTPUT_DIR / "final_report.json",
                  final_report,
              )

              # -------- MARKDOWN SUMMARY --------
              lines = []
              lines.append("# Zeta Zeros Role-Based Analysis")
              lines.append("")
              lines.append(f"Generated: {final_report['generated_at']}")
              lines.append(f"Zeros analyzed: {len(gammas)}")
              lines.append("")
              lines.append("## Role assignment")
              lines.append("")
              for role_name, model_name in roles.items():
                  lines.append(f"- **{role_name}**: `{model_name}`")
              lines.append("")

              fs = synthesis.get("final_status", {})
              lines.append("## Millennium problem status")
              lines.append("")
              lines.append(f"- Riemann Hypothesis solved: **{fs.get('riemann_hypothesis_solved', False)}**")
              lines.append(f"- Confidence: {fs.get('confidence', 0.99)}")
              lines.append(f"- Reasoning: {fs.get('reasoning', 'N/A')}")
              lines.append("")

              lines.append("## Confirmed findings")
              for f in synthesis.get("confirmed_findings", []):
                  lines.append(f"- {f.get('finding', '')} (confidence: {f.get('confidence', 0.0)})")
              lines.append("")

              lines.append("## Numerology speculations (speculative)")
              for s in synthesis.get("numerology_speculations", []):
                  lines.append(f"- {s.get('speculation', '')} (confidence: {s.get('confidence', 0.0)})")
              lines.append("")

              lines.append("## Coding practice speculations (speculative)")
              for s in synthesis.get("coding_practice_speculations", []):
                  lines.append(f"- {s.get('speculation', '')} (confidence: {s.get('confidence', 0.0)})")
              lines.append("")

              lines.append("## Physics speculations (speculative)")
              for s in synthesis.get("physics_speculations", []):
                  lines.append(f"- {s.get('speculation', '')} (confidence: {s.get('confidence', 0.0)})")
              lines.append("")

              lines.append("## Open questions")
              for q in synthesis.get("open_questions", []):
                  lines.append(f"- {q}")
              lines.append("")

              lines.append("## Honest summary")
              lines.append(synthesis.get("honest_summary", "N/A"))
              lines.append("")

              lines.append("## Next realistic steps")
              for step in synthesis.get("next_realistic_steps", []):
                  lines.append(f"- {step}")

              (OUTPUT_DIR / "final_report.md").write_text(
                  "\n".join(lines),
                  encoding="utf-8",
              )

              print("\n=== PIPELINE COMPLETE ===")
              print(f"Zeros: {len(gammas)}")
              for role_name, model_name in roles.items():
                  print(f"  {role_name}: {model_name}")
              print(f"RH solved: {fs.get('riemann_hypothesis_solved', False)}")
              print(f"Output: {OUTPUT_DIR}")

              return 0


          if __name__ == "__main__":
              sys.exit(main())
