          import hashlib
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path
          from typing import Any, Dict, List, Optional, Tuple

          import numpy as np
          import requests
          from mpmath import mp, siegelz, findroot, mpf, zetazero

          mp.dps = 30

          OLLAMA = "http://127.0.0.1:11434/api/generate"

          ROOT = Path(".").resolve()
          PIPELINE_DIR = ROOT / "zeta_pipeline"
          STATE_DIR = PIPELINE_DIR / "state"
          OUTPUT_DIR = PIPELINE_DIR / "output"

          CACHE_FILE = STATE_DIR / "zeta_zeros_cache.txt"
          MODELS_FILE = STATE_DIR / "available_models.txt"

          REQUEST_TIMEOUT = 600
          MAX_RETRIES = 2


          def now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def sha256_text(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()


          def atomic_write_json(path: Path, data: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False),
                  encoding="utf-8",
              )
              tmp.replace(path)


          def load_json(path: Path, default: Any) -> Any:
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default


          # =========================================================
          # ZETA ZEROS
          # =========================================================

          def load_cache(path: Path) -> np.ndarray:
              if not path.exists():
                  return np.array([])
              out = []
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          out.append(float(line))
                      except ValueError:
                          continue
              return np.array(out)


          def next_zero(gamma_prev: float, k_next: int) -> float:
              if gamma_prev < 14:
                  step = 3.0
              else:
                  step = 2 * np.pi / np.log(gamma_prev / (2 * np.pi))
                  step = max(step, 0.5)

              t0 = mpf(gamma_prev) + mpf("0.5")
              z0 = siegelz(t0)
              t = t0
              z_prev = z0

              for _ in range(1000):
                  t_next = t + mpf(str(step))
                  z_next = siegelz(t_next)
                  if z_prev * z_next < 0:
                      try:
                          root = findroot(
                              siegelz,
                              (t, t_next),
                              solver="bisect",
                              tol=mpf("1e-25"),
                          )
                          return float(root)
                      except Exception:
                          a, b = t, t_next
                          za = siegelz(a)
                          for _ in range(80):
                              m = (a + b) / 2
                              zm = siegelz(m)
                              if za * zm < 0:
                                  b = m
                              else:
                                  a, za = m, zm
                          return float((a + b) / 2)
                  t = t_next
                  z_prev = z_next

              print(f"    fallback for k = {k_next}")
              return float(zetazero(k_next).imag)


          def extend_cache(path: Path, n_new: int) -> np.ndarray:
              cached = load_cache(path)
              n_have = len(cached)

              if n_have == 0:
                  print("Empty cache. Computing first zero from scratch...")
                  g1 = float(zetazero(1).imag)
                  cached = np.array([g1])
                  with open(path, "w") as f:
                      f.write(f"{g1:.17g}\n")
                  n_have = 1

              print(f"Cache has {n_have} zeros. Computing {n_new} more...")
              gammas = list(cached)
              last = gammas[-1]

              with open(path, "a") as f:
                  for i in range(n_new):
                      k_next = len(gammas) + 1
                      last = next_zero(last, k_next)
                      gammas.append(last)
                      f.write(f"{last:.17g}\n")
                      if (i + 1) % 50 == 0:
                          print(f"  +{i+1}, gamma = {last:.6f}, n = {len(gammas)}")

              return np.array(gammas)


          # =========================================================
          # OLLAMA CLIENT
          # =========================================================

          def ollama_ask(
              model: str,
              prompt: str,
              json_mode: bool = True,
              temperature: float = 0.1,
          ) -> Optional[str]:
              payload = {
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {"temperature": temperature, "num_ctx": 8192},
              }
              if json_mode:
                  payload["format"] = "json"

              for attempt in range(MAX_RETRIES + 1):
                  try:
                      r = requests.post(
                          OLLAMA,
                          json=payload,
                          timeout=REQUEST_TIMEOUT,
                      )
                      r.raise_for_status()
                      text = r.json().get("response", "")
                      if text and text.strip():
                          return text.strip()
                  except Exception as exc:
                      print(f"  Ollama error [{model}]: {exc}")
                      if attempt < MAX_RETRIES:
                          time.sleep(2 * (attempt + 1))

              return None


          def ollama_ask_json(
              model: str,
              prompt: str,
          ) -> Optional[Dict[str, Any]]:
              raw = ollama_ask(model, prompt, json_mode=True)
              if raw is None:
                  return None

              raw = raw.strip()
              raw = re.sub(r"^```(?:json)?\s*", "", raw, flags=re.IGNORECASE)
              raw = re.sub(r"\s*```$", "", raw)
              start = raw.find("{")
              end = raw.rfind("}")
              if start >= 0 and end > start:
                  raw = raw[start:end + 1]

              try:
                  value = json.loads(raw)
                  if isinstance(value, dict):
                      return value
              except json.JSONDecodeError:
                  pass

              return None


          # =========================================================
          # ROLE ASSIGNMENT
          #
          # Each Qwen model has a role it is actually good at.
          # Roles are matched to the best available model for that job.
          # =========================================================

          ROLE_SPECS = [
              {
                  "role": "extractor",
                  "ideal_size": "1.5b",
                  "purpose": "structure and format raw statistics",
              },
              {
                  "role": "scanner",
                  "ideal_size": "3b",
                  "purpose": "detect clusters and anomalies in structured data",
              },
              {
                  "role": "analyst",
                  "ideal_size": "7b",
                  "purpose": "compare to known theory (GUE, Riemann-von Mangoldt)",
              },
              {
                  "role": "synthesizer",
                  "ideal_size": "14b",
                  "purpose": "synthesize, assess honestly, speculate carefully",
              },
          ]


          def assign_roles(available_models: List[str]) -> Dict[str, Optional[str]]:
              """
              Map each role to the best available model for that job.

              Preference order per role:
                1. Exact ideal size.
                2. Next larger size (more capable).
                3. Next smaller size (still adequate).
                4. Any remaining unused model.

              A model is not reused across roles if a distinct one is available.
              If we run out, the strongest model is reused for the top role.
              """
              # Parse sizes from model names like qwen2.5-coder:7b
              parsed = []
              for name in available_models:
                  m = re.search(r":(\d+(?:\.\d+)?)b", name)
                  size = float(m.group(1)) if m else 0.0
                  parsed.append((size, name))

              parsed.sort()  # ascending size

              assignment: Dict[str, Optional[str]] = {}
              used: set = set()

              for spec in ROLE_SPECS:
                  ideal = spec["ideal_size"].rstrip("b")
                  try:
                      ideal_val = float(ideal)
                  except ValueError:
                      ideal_val = 0.0

                  # 1. exact
                  pick = None
                  for size, name in parsed:
                      if name in used:
                          continue
                      if abs(size - ideal_val) < 0.001:
                          pick = name
                          break

                  # 2. next larger
                  if pick is None:
                      for size, name in parsed:
                          if name in used:
                              continue
                          if size > ideal_val:
                              pick = name
                              break

                  # 3. next smaller
                  if pick is None:
                      for size, name in reversed(parsed):
                          if name in used:
                              continue
                          if size < ideal_val:
                              pick = name
                              break

                  # 4. anything left
                  if pick is None:
                      for _, name in parsed:
                          if name not in used:
                              pick = name
                              break

                  if pick:
                      used.add(pick)

                  assignment[spec["role"]] = pick

              # If nothing was available for the synthesizer, reuse the strongest.
              if not assignment.get("synthesizer") and parsed:
                  assignment["synthesizer"] = parsed[-1][1]

              return assignment


          # =========================================================
          # PHASE PROMPTS
          # =========================================================

          EXTRACTOR_PROMPT = """
