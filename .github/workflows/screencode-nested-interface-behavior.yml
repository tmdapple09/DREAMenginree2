name: Build DREAMengin Interface Behavior Codebase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-interface-behavior-codebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install interface compiler tools
        run: |
          node -e "require('node:fs').mkdirSync('__interface_tools__',{recursive:true});require('node:fs').writeFileSync('__interface_tools__/package.json','{\"type\":\"commonjs\"}')"
          npm --prefix __interface_tools__ install @babel/parser@latest --no-package-lock --silent

      - name: Compile source-owned nested interface behavior codebase
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, "__interface_codebase__");
          const FULL_CODEBASE_FILE = path.join(OUT, "000_FULL_CODEBASE.codebase");
          const requireTools = createRequire(path.join(ROOT, "__interface_tools__", "package.json"));
          const parser = requireTools("@babel/parser");

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            ".ci",
            "node_modules",
            ".next",
            "out",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".cache",
            "__interface_tools__",
            "__interface_codebase__"
          ]);

          const TEXT_EXTS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".css",
            ".scss",
            ".sass",
            ".sql",
            ".json",
            ".yml",
            ".yaml",
            ".toml",
            ".md",
            ".mdx"
          ]);

          const PARSE_EXTS = new Set([".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]);
          const JSX_EXTS = new Set([".tsx", ".jsx"]);

          const GENERIC_NAMES = new Set([
            "div",
            "span",
            "main",
            "section",
            "article",
            "header",
            "footer",
            "aside",
            "nav",
            "form",
            "button",
            "input",
            "select",
            "textarea",
            "label",
            "fragment",
            "provider",
            "context",
            "wrapper",
            "container",
            "content",
            "layout",
            "page",
            "default",
            "module",
            "anonymous",
            "children"
          ]);

          const SEMANTIC_TAGS = new Set([
            "main",
            "nav",
            "header",
            "footer",
            "aside",
            "section",
            "article",
            "form",
            "dialog",
            "summary",
            "button",
            "a",
            "input",
            "textarea",
            "select",
            "label",
            "details"
          ]);

          function posix(value) {
            return value.split(path.sep).join("/");
          }

          function ext(rel) {
            return path.posix.extname(rel).toLowerCase();
          }

          function sha16(value) {
            return crypto.createHash("sha256").update(value).digest("hex").slice(0, 16);
          }

          function b64url(value) {
            return Buffer.from(String(value), "utf8").toString("base64url");
          }

          function byteLen(value) {
            return Buffer.byteLength(value, "utf8");
          }

          function byteAt(source, charIndex) {
            return byteLen(source.slice(0, charIndex));
          }

          function cleanWords(value) {
            return String(value ?? "")
              .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
              .replace(/[_./:$(){}[\]!?|&=+*,;'`~<>-]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function titleCase(value) {
            return cleanWords(value).replace(/\b\w/g, (m) => m.toUpperCase());
          }

          function sanitize(value, fallback = "Node") {
            const clean = titleCase(value)
              .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
              .replace(/\.$/, "")
              .slice(0, 96)
              .trim();

            return clean || fallback;
          }

          function usableName(value) {
            const name = sanitize(value, "");
            if (!name) return "";
            if (GENERIC_NAMES.has(name.toLowerCase())) return "";
            if (/^(node|item|component|element|group|region)\s+\d+$/i.test(name)) return "";
            return name;
          }

          function sourceNoun(rel) {
            const base = path.posix.basename(rel || "").replace(/\.(tsx|jsx|ts|js|mjs|cjs|css|scss|sass|sql|json|md|mdx)$/i, "");
            const parent = path.posix.basename(path.posix.dirname(rel || ""));

            if (/^(page|layout|index|route|loading|error|not-found)$/i.test(base)) {
              return sanitize(parent || base);
            }

            return sanitize(base || parent || "Source");
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) walk(full, out);
                continue;
              }

              if (!entry.isFile()) continue;

              const rel = posix(path.relative(ROOT, full));
              if (TEXT_EXTS.has(ext(rel))) out.push(rel);
            }

            return out;
          }

          function parseSource(source) {
            return parser.parse(source, {
              sourceType: "module",
              errorRecovery: true,
              plugins: [
                "jsx",
                "typescript",
                "classProperties",
                "classPrivateProperties",
                "classPrivateMethods",
                "decorators-legacy",
                "objectRestSpread",
                "dynamicImport",
                "optionalChaining",
                "nullishCoalescingOperator",
                "topLevelAwait",
                "importMeta"
              ]
            });
          }

          function childNodes(node) {
            const out = [];
            if (!node || typeof node !== "object") return out;

            for (const key of Object.keys(node)) {
              if (
                key === "loc" ||
                key === "start" ||
                key === "end" ||
                key === "leadingComments" ||
                key === "trailingComments" ||
                key === "innerComments" ||
                key === "extra"
              ) {
                continue;
              }

              const value = node[key];

              if (Array.isArray(value)) {
                for (const child of value) {
                  if (child && typeof child === "object" && child.type) out.push(child);
                }
              } else if (value && typeof value === "object" && value.type) {
                out.push(value);
              }
            }

            return out;
          }

          function jsxName(nameNode) {
            if (!nameNode) return "";

            if (nameNode.type === "JSXIdentifier") return nameNode.name;

            if (nameNode.type === "JSXMemberExpression") {
              const parts = [];
              let cursor = nameNode;

              while (cursor) {
                if (cursor.property?.name) parts.unshift(cursor.property.name);

                if (cursor.object?.name) {
                  parts.unshift(cursor.object.name);
                  break;
                }

                cursor = cursor.object;
              }

              return parts.join(".");
            }

            if (nameNode.type === "JSXNamespacedName") {
              return `${nameNode.namespace?.name || ""}:${nameNode.name?.name || ""}`;
            }

            return "";
          }

          function isDomTag(name) {
            return /^[a-z][a-z0-9:-]*$/.test(name);
          }

          function isComponentTag(name) {
            return /^[A-Z]/.test(String(name || "")) || String(name || "").includes(".");
          }

          function attrName(attr) {
            if (!attr || attr.type !== "JSXAttribute") return "";
            const name = attr.name;
            if (!name) return "";
            if (name.type === "JSXIdentifier") return name.name;
            if (name.type === "JSXNamespacedName") return `${name.namespace?.name || ""}:${name.name?.name || ""}`;
            return "";
          }

          function rawAttrValue(attr, source) {
            if (!attr || attr.type !== "JSXAttribute") return "";
            if (!attr.value) return "true";
            if (attr.value.type === "StringLiteral") return attr.value.value || "";

            if (attr.value.type === "JSXExpressionContainer") {
              const expr = attr.value.expression;
              if (!expr) return "";
              if (expr.type === "StringLiteral") return expr.value || "";
              if (expr.type === "NumericLiteral" || expr.type === "BooleanLiteral") return String(expr.value);
              if (expr.type === "Identifier") return expr.name;
              if (expr.start != null && expr.end != null) return source.slice(expr.start, expr.end);
            }

            return "";
          }

          function textFromJSX(node) {
            const pieces = [];

            function visit(child) {
              if (!child) return;

              if (child.type === "JSXText") {
                const text = child.value.replace(/\s+/g, " ").trim();
                if (text) pieces.push(text);
                return;
              }

              if (child.type === "JSXExpressionContainer") {
                const expr = child.expression;
                if (expr?.type === "StringLiteral") pieces.push(expr.value);
                return;
              }
            }

            for (const child of node.children || []) visit(child);

            return pieces.join(" ").replace(/\s+/g, " ").trim().slice(0, 120);
          }

          function exprText(source, node) {
            if (!node || node.start == null || node.end == null) return "";
            return source.slice(node.start, node.end).replace(/\s+/g, " ").trim();
          }

          function exprLabel(source, node, fallback = "State") {
            const raw = exprText(source, node).slice(0, 80);
            return usableName(raw) || fallback;
          }

          function containsJSX(node) {
            if (!node || typeof node !== "object") return false;
            if (node.type === "JSXElement" || node.type === "JSXFragment") return true;
            for (const child of childNodes(node)) {
              if (containsJSX(child)) return true;
            }
            return false;
          }

          function ownerFrom(node, ancestors) {
            const parent = ancestors[ancestors.length - 1];
            const grand = ancestors[ancestors.length - 2];

            if (node.type === "FunctionDeclaration") {
              const wrapper = parent && ["ExportDefaultDeclaration", "ExportNamedDeclaration"].includes(parent.type) ? parent : node;
              return { name: node.id?.name || "Default", start: wrapper.start, end: wrapper.end };
            }

            if (node.type === "ArrowFunctionExpression" || node.type === "FunctionExpression") {
              if (parent?.type === "VariableDeclarator" && grand?.type === "VariableDeclaration") {
                return { name: parent.id?.name || "Anonymous", start: grand.start, end: grand.end };
              }

              if (parent?.type === "ExportDefaultDeclaration") {
                return { name: "Default", start: parent.start, end: parent.end };
              }

              return { name: node.id?.name || "Anonymous", start: node.start, end: node.end };
            }

            if (node.type === "ClassDeclaration") {
              return { name: node.id?.name || "Class", start: node.start, end: node.end };
            }

            if (node.type === "ClassMethod" || node.type === "ObjectMethod") {
              return { name: node.key?.name || "Method", start: node.start, end: node.end };
            }

            return null;
          }

          function byteRange(source, rel, charStart, charEnd, kind, fileStreamStart) {
            const byteStart = byteAt(source, charStart);
            const byteEnd = byteAt(source, charEnd);
            const slice = source.slice(charStart, charEnd);

            return {
              p: rel,
              k: kind,
              cs: charStart,
              ce: charEnd,
              bs: byteStart,
              be: byteEnd,
              ss: fileStreamStart + byteStart,
              se: fileStreamStart + byteEnd,
              h: sha16(slice)
            };
          }

          function rangeKey(range) {
            return `${range.k}:${range.p}:${range.cs}:${range.ce}:${range.h}`;
          }

          function idsIn(node, out = new Set()) {
            if (!node || typeof node !== "object") return out;
            if (node.type === "Identifier") out.add(node.name);
            if (node.type === "JSXIdentifier") out.add(node.name);
            for (const child of childNodes(node)) idsIn(child, out);
            return out;
          }

          function routeFromAppPage(rel) {
            if (!/^app\/(?:.*\/)?page\.(tsx|jsx|ts|js)$/.test(rel)) return null;

            const inner = rel
              .replace(/^app\//, "")
              .replace(/\/page\.(tsx|jsx|ts|js)$/, "")
              .replace(/^page\.(tsx|jsx|ts|js)$/, "");

            const parts = inner
              .split("/")
              .filter(Boolean)
              .filter((part) => !(part.startsWith("(") && part.endsWith(")")))
              .filter((part) => !part.startsWith("@"));

            if (parts.some((part) => part.startsWith("[") && part.endsWith("]"))) return null;
            return parts.length ? "/" + parts.join("/") : "/";
          }

          function routeFromPagesFile(rel) {
            const match = rel.match(/^(?:pages|src\/pages)\/(.+)\.(tsx|jsx|ts|js)$/);
            if (!match) return null;

            let inner = match[1];

            if (inner === "_app" || inner === "_document" || inner === "_error" || inner.startsWith("api/")) return null;

            inner = inner.replace(/\/index$/, "").replace(/^index$/, "");
            const parts = inner.split("/").filter(Boolean);
            if (parts.some((part) => part.startsWith("[") && part.endsWith("]"))) return null;
            return parts.length ? "/" + parts.join("/") : "/";
          }

          function routeFromFile(rel) {
            return routeFromAppPage(rel) || routeFromPagesFile(rel);
          }

          function collectAttrs(opening, source) {
            const attrs = Object.create(null);
            const handlers = [];

            for (const attr of opening.attributes || []) {
              const name = attrName(attr);
              if (!name) continue;

              attrs[name] = rawAttrValue(attr, source);

              if (/^on[A-Z]/.test(name)) {
                const expr = attr.value?.type === "JSXExpressionContainer" ? attr.value.expression : null;
                handlers.push({ name, expr });
              }
            }

            return { attrs, handlers };
          }

          function behaviorKind(tag, attrs, componentName) {
            const lowerTag = String(tag || "").toLowerCase();
            const lowerComponent = String(componentName || "").toLowerCase();
            const role = String(attrs.role || "").toLowerCase();
            const type = String(attrs.type || "").toLowerCase();
            const hasHandler = Object.keys(attrs).some((name) => /^on[A-Z]/.test(name));
            const hasPopup = attrs["aria-haspopup"] || attrs["aria-controls"];
            const nameText = `${lowerTag} ${lowerComponent} ${role} ${type}`;

            if (/\b(dialog|modal|sheet|drawer|popover|overlay|toast)\b/.test(nameText)) return "Dialog Overlay";
            if (/\b(menu|menubar|menuitem|command|palette|search)\b/.test(nameText) || hasPopup) return "Menu Command";
            if (/\b(tab|tabpanel|tabs|segmented)\b/.test(nameText)) return "Tab Panel";
            if (lowerTag === "button" || role === "button" || /\b(button|action|control|toggle)\b/.test(nameText) || hasHandler) return "Action Control";
            if (lowerTag === "a" || role === "link" || /\b(nav|link|anchor|breadcrumb)\b/.test(nameText) || attrs.href) return "Navigation";
            if (lowerTag === "form" || ["input", "textarea", "select"].includes(lowerTag) || ["textbox", "checkbox", "radio", "switch", "slider", "combobox"].includes(role) || (type && type !== "button")) return "Form Input";
            if (/\b(main|section|article|aside|header|footer|surface|workspace|canvas|viewport|shell|panel|region|widget|window|feed|profile|message|media)\b/.test(nameText)) return "Surface Region";
            if (isComponentTag(tag)) return "Component Surface";
            return "Interface Structure";
          }

          function labelForNode(tag, attrs, text, ownerName, rel) {
            if (isComponentTag(tag)) return usableName(tag) || usableName(ownerName) || sourceNoun(rel);

            return (
              usableName(attrs["aria-label"]) ||
              usableName(attrs.title) ||
              usableName(attrs.placeholder) ||
              usableName(attrs["data-testid"]) ||
              usableName(attrs.id) ||
              usableName(text) ||
              usableName(ownerName) ||
              usableName(tag) ||
              sourceNoun(rel)
            );
          }

          function isImportantNode(tag, attrs, handlers, text) {
            if (isComponentTag(tag)) return true;
            if (SEMANTIC_TAGS.has(String(tag).toLowerCase())) return true;
            if (handlers.length) return true;
            if (attrs.role || attrs.href || attrs["aria-label"] || attrs["aria-haspopup"] || attrs["aria-controls"] || attrs["data-testid"] || attrs.id) return true;
            if (text && text.length > 0 && text.length < 80 && !GENERIC_NAMES.has(sanitize(text).toLowerCase())) return true;
            return false;
          }

          function addPathPart(parts, value) {
            const name = usableName(value);
            if (!name) return;
            if (parts[parts.length - 1] === name) return;
            parts.push(name);
          }

          function ownerPath(ownerStack, rel) {
            const parts = [];

            for (const owner of ownerStack || []) {
              addPathPart(parts, owner.name);
            }

            if (!parts.length) addPathPart(parts, sourceNoun(rel));
            return parts.slice(-8);
          }

          function sliceName(range) {
            return [range.k, b64url(range.p), `C${range.cs}-${range.ce}`, `B${range.bs}-${range.be}`, `S${range.ss}-${range.se}`, `H${range.h}`].join("__") + (path.posix.extname(range.p) || ".slice");
          }

          function sliceText(fullBuffer, range) {
            return fullBuffer.subarray(range.ss, range.se).toString("utf8");
          }

          function writeJson(file, data) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          }

          function writeJsonl(file, rows) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, rows.map((row) => JSON.stringify(row)).join("\n") + (rows.length ? "\n" : ""));
          }

          function writeSlice(fullBuffer, dir, range, writtenSet) {
            if (!range) return;
            const source = sliceText(fullBuffer, range);
            if (!source.trim()) return;
            if (sha16(source) !== range.h) return;

            const key = rangeKey(range);
            if (writtenSet && writtenSet.has(key)) return;
            if (writtenSet) writtenSet.add(key);

            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, sliceName(range)), source);
          }

          function importBase(specifier, fromRel) {
            if (typeof specifier !== "string") return null;
            if (!specifier.startsWith(".") && !specifier.startsWith("@/")) return null;

            return specifier.startsWith("@/")
              ? specifier.slice(2)
              : path.posix.normalize(path.posix.join(path.posix.dirname(fromRel), specifier));
          }

          function resolveImport(filesIndex, fromRel, specifier) {
            const base = importBase(specifier, fromRel);
            if (!base) return null;

            const candidates = [
              base,
              `${base}.ts`,
              `${base}.tsx`,
              `${base}.js`,
              `${base}.jsx`,
              `${base}.mjs`,
              `${base}.cjs`,
              `${base}/index.ts`,
              `${base}/index.tsx`,
              `${base}/index.js`,
              `${base}/index.jsx`
            ];

            return candidates.find((candidate) => filesIndex[candidate]) || null;
          }

          const files = walk(ROOT).sort();
          const streamStarts = Object.create(null);
          const fullParts = [];
          const index = {
            generatedAt: new Date().toISOString(),
            files: Object.create(null),
            routes: [],
            nodes: [],
            owners: [],
            directories: []
          };

          let streamOffset = 0;

          fs.rmSync(OUT, { recursive: true, force: true });
          fs.mkdirSync(OUT, { recursive: true });

          for (const rel of files) {
            const source = fs.readFileSync(path.join(ROOT, rel), "utf8");
            const encodedPath = b64url(rel);
            const open = `\n@@FILE:${encodedPath}@@\n`;
            const close = `\n@@END:${encodedPath}@@\n`;

            streamStarts[rel] = streamOffset + byteLen(open);
            fullParts.push(open, source, close);
            streamOffset += byteLen(open + source + close);

            const route = routeFromFile(rel);
            if (route) index.routes.push({ route, file: rel });

            index.files[rel] = {
              p: rel,
              h: sha16(source),
              bytes: byteLen(source),
              streamStart: streamStarts[rel],
              route,
              defs: Object.create(null),
              imports: Object.create(null)
            };
          }

          fs.writeFileSync(FULL_CODEBASE_FILE, fullParts.join(""));
          const fullBuffer = fs.readFileSync(FULL_CODEBASE_FILE);

          const astCache = new Map();

          function collectDefsAndImports(ast, source, rel, fileStreamStart) {
            const defs = Object.create(null);
            const imports = Object.create(null);

            function recordDef(name, start, end, kind = "DEF") {
              if (!name || start == null || end == null) return;
              defs[name] = byteRange(source, rel, start, end, kind, fileStreamStart);
            }

            function visit(node, ancestors = []) {
              const parent = ancestors[ancestors.length - 1];
              const grand = ancestors[ancestors.length - 2];

              if (node.type === "ImportDeclaration") {
                for (const spec of node.specifiers || []) {
                  if (spec.local?.name) imports[spec.local.name] = node.source?.value || "";
                }
              }

              if (node.type === "FunctionDeclaration" && node.id?.name) {
                const wrapper = parent && ["ExportDefaultDeclaration", "ExportNamedDeclaration"].includes(parent.type) ? parent : node;
                recordDef(node.id.name, wrapper.start, wrapper.end);
              }

              if (parent?.type === "VariableDeclarator" && grand?.type === "VariableDeclaration" && parent.id?.type === "Identifier" && (node.type === "ArrowFunctionExpression" || node.type === "FunctionExpression")) {
                recordDef(parent.id.name, grand.start, grand.end);
              }

              if (node.type === "ClassDeclaration" && node.id?.name) recordDef(node.id.name, node.start, node.end);

              if (parent?.type === "ExportNamedDeclaration" && node.type === "VariableDeclaration") {
                for (const decl of node.declarations || []) {
                  if (decl.id?.type === "Identifier") recordDef(decl.id.name, parent.start, parent.end);
                }
              }

              for (const child of childNodes(node)) visit(child, ancestors.concat(node));
            }

            visit(ast.program, []);
            return { defs, imports };
          }

          for (const rel of files) {
            if (!PARSE_EXTS.has(ext(rel))) continue;
            const source = fs.readFileSync(path.join(ROOT, rel), "utf8");

            try {
              const ast = parseSource(source);
              astCache.set(rel, ast);
              const { defs, imports } = collectDefsAndImports(ast, source, rel, streamStarts[rel]);
              index.files[rel].defs = defs;
              index.files[rel].imports = imports;
            } catch {}
          }

          const ownerWritten = new Set();
          const defWrittenByDir = new Map();
          const nodeDirSeen = new Map();

          function dirWrittenSet(dir) {
            if (!defWrittenByDir.has(dir)) defWrittenByDir.set(dir, new Set());
            return defWrittenByDir.get(dir);
          }

          function uniqueDir(parts, nodeId) {
            const base = parts.map((part) => sanitize(part)).filter(Boolean).filter((part, i, arr) => i === 0 || part !== arr[i - 1]).join("/");
            const count = nodeDirSeen.get(base) || 0;
            nodeDirSeen.set(base, count + 1);
            if (count === 0) return base;
            return `${base} ${nodeId.slice(0, 6)}`;
          }

          function writeDefinitionsForIds(rel, ids, dir) {
            const fileInfo = index.files[rel] || {};
            const defs = fileInfo.defs || Object.create(null);
            const imports = fileInfo.imports || Object.create(null);
            const written = dirWrittenSet(dir);

            for (const id of ids || []) {
              if (Object.hasOwn(defs, id)) {
                writeSlice(fullBuffer, path.join(dir, "Local Definitions"), defs[id], written);
              }

              const specifier = Object.hasOwn(imports, id) ? imports[id] : null;
              const resolved = resolveImport(index.files, rel, specifier);
              const resolvedDefs = resolved ? (index.files[resolved]?.defs || Object.create(null)) : Object.create(null);
              const importedDef = Object.hasOwn(resolvedDefs, id) ? resolvedDefs[id] : null;

              if (importedDef) {
                writeSlice(fullBuffer, path.join(dir, "Imported Definitions"), importedDef, written);
              }
            }
          }

          function writeComponentReference(rel, tag, dir) {
            if (!isComponentTag(tag)) return;

            const fileInfo = index.files[rel] || {};
            const defs = fileInfo.defs || Object.create(null);
            const imports = fileInfo.imports || Object.create(null);
            const rootName = tag.split(".")[0];
            const written = dirWrittenSet(dir);

            if (Object.hasOwn(defs, rootName)) {
              writeSlice(fullBuffer, path.join(dir, "Component Source"), defs[rootName], written);
              return;
            }

            const specifier = Object.hasOwn(imports, rootName) ? imports[rootName] : null;
            const resolved = resolveImport(index.files, rel, specifier);
            const resolvedDefs = resolved ? (index.files[resolved]?.defs || Object.create(null)) : Object.create(null);

            if (Object.hasOwn(resolvedDefs, rootName)) {
              writeSlice(fullBuffer, path.join(dir, "Component Source"), resolvedDefs[rootName], written);
            }
          }

          function writeHandlerSources(rel, source, handlers, dir) {
            const fileInfo = index.files[rel] || {};
            const defs = fileInfo.defs || Object.create(null);
            const imports = fileInfo.imports || Object.create(null);
            const written = dirWrittenSet(dir);

            for (const handler of handlers) {
              const expr = handler.expr;
              if (!expr) continue;

              if (expr.start != null && expr.end != null) {
                const handlerRange = byteRange(source, rel, expr.start, expr.end, "HANDLER_REF", streamStarts[rel]);
                writeSlice(fullBuffer, path.join(dir, "Handlers"), handlerRange, written);
              }

              const ids = Array.from(idsIn(expr)).filter(Boolean);
              writeDefinitionsForIds(rel, ids, path.join(dir, "Handlers"));

              if (expr.type === "Identifier") {
                const ref = expr.name;

                if (Object.hasOwn(defs, ref)) {
                  writeSlice(fullBuffer, path.join(dir, "Handlers"), defs[ref], written);
                }

                const specifier = Object.hasOwn(imports, ref) ? imports[ref] : null;
                const resolved = resolveImport(index.files, rel, specifier);
                const resolvedDefs = resolved ? (index.files[resolved]?.defs || Object.create(null)) : Object.create(null);
                const importedDef = Object.hasOwn(resolvedDefs, ref) ? resolvedDefs[ref] : null;

                if (importedDef) writeSlice(fullBuffer, path.join(dir, "Handlers"), importedDef, written);
              }
            }
          }

          function folderLabelForCondition(source, node, prefix) {
            return `${prefix} ${exprLabel(source, node, "Condition")}`;
          }

          function handleExpression(node, rel, source, ancestors, owners, interfaceStack) {
            if (!node) return;

            if (node.type === "JSXElement" || node.type === "JSXFragment") {
              visit(node, rel, source, ancestors, owners, interfaceStack);
              return;
            }

            if (node.type === "ConditionalExpression" && containsJSX(node)) {
              const whenLabel = folderLabelForCondition(source, node.test, "When");
              const otherwiseLabel = folderLabelForCondition(source, node.test, "Otherwise");
              handleExpression(node.consequent, rel, source, ancestors.concat(node), owners, interfaceStack.concat([whenLabel]));
              handleExpression(node.alternate, rel, source, ancestors.concat(node), owners, interfaceStack.concat([otherwiseLabel]));
              return;
            }

            if (node.type === "LogicalExpression" && containsJSX(node.right)) {
              const whenLabel = folderLabelForCondition(source, node.left, "When");
              handleExpression(node.right, rel, source, ancestors.concat(node), owners, interfaceStack.concat([whenLabel]));
              return;
            }

            if (node.type === "CallExpression" && containsJSX(node)) {
              const calleeText = exprText(source, node.callee);
              const repeatLabel = calleeText.includes(".map") ? `Repeated ${exprLabel(source, node.callee.object || node.callee, "Items")}` : `Generated ${exprLabel(source, node.callee, "Items")}`;

              for (const arg of node.arguments || []) {
                if (containsJSX(arg)) handleExpression(arg.body || arg, rel, source, ancestors.concat(node), owners, interfaceStack.concat([repeatLabel]));
              }
              return;
            }

            for (const child of childNodes(node)) {
              handleExpression(child, rel, source, ancestors.concat(node), owners, interfaceStack);
            }
          }

          function visit(node, rel, source, ancestors = [], owners = [], interfaceStack = []) {
            const owner = ownerFrom(node, ancestors);
            const nextOwners = owner ? owners.concat(owner) : owners;

            if (node.type === "JSXFragment") {
              for (const child of node.children || []) {
                if (child.type === "JSXExpressionContainer") handleExpression(child.expression, rel, source, ancestors.concat(node), nextOwners, interfaceStack);
                else handleExpression(child, rel, source, ancestors.concat(node), nextOwners, interfaceStack);
              }
              return;
            }

            if (node.type === "JSXElement" && node.openingElement) {
              const opening = node.openingElement;
              const tag = jsxName(opening.name);
              const { attrs, handlers } = collectAttrs(opening, source);
              const text = textFromJSX(node);
              const ownerRange = nextOwners[nextOwners.length - 1] || { name: sourceNoun(rel), start: 0, end: source.length };
              const important = isImportantNode(tag, attrs, handlers, text);
              const label = labelForNode(tag, attrs, text, ownerRange.name, rel);
              const behavior = behaviorKind(tag, attrs, ownerRange.name);
              const nodeId = sha16(`${rel}:${node.start}:${node.end}:${ownerRange.start}:${ownerRange.end}:${tag}:${label}`);
              const ownerParts = ownerPath(nextOwners, rel);
              const nextInterfaceStack = important ? interfaceStack.concat([label]) : interfaceStack;

              if (important) {
                const dirRel = uniqueDir(["Interface"].concat(ownerParts, interfaceStack, [label]), nodeId);
                const dir = path.join(OUT, dirRel);
                const viewRange = byteRange(source, rel, node.start, node.end, "VIEW", streamStarts[rel]);
                const ownerRangeObj = byteRange(source, rel, ownerRange.start, ownerRange.end, "OWNER", streamStarts[rel]);
                const attrIds = new Set();

                for (const attr of opening.attributes || []) {
                  if (attr?.value?.type === "JSXExpressionContainer") idsIn(attr.value.expression, attrIds);
                }

                const nodeRecord = {
                  id: nodeId,
                  dir: dirRel,
                  file: rel,
                  tag,
                  label,
                  behavior,
                  text,
                  ownerName: ownerRange.name,
                  ownerPath: ownerParts,
                  interfacePath: interfaceStack,
                  attrs: Object.fromEntries(Object.entries(attrs).filter(([name]) => (
                    name === "role" ||
                    name === "href" ||
                    name === "id" ||
                    name === "data-testid" ||
                    name === "aria-label" ||
                    name === "aria-haspopup" ||
                    name === "aria-controls" ||
                    name === "aria-expanded" ||
                    name === "type" ||
                    /^on[A-Z]/.test(name)
                  ))),
                  handlers: handlers.map((handler) => ({
                    name: handler.name,
                    ref: handler.expr?.type === "Identifier" ? handler.expr.name : "",
                    source: handler.expr ? exprText(source, handler.expr).slice(0, 240) : ""
                  }))
                };

                fs.mkdirSync(dir, { recursive: true });
                writeJson(path.join(dir, "interface.node.json"), nodeRecord);
                writeSlice(fullBuffer, dir, viewRange, null);

                const ownerDir = path.join(OUT, "Interface", ...ownerParts.map(sanitize), "_Owner Source");
                writeSlice(fullBuffer, ownerDir, ownerRangeObj, ownerWritten);

                writeComponentReference(rel, tag, dir);
                writeHandlerSources(rel, source, handlers, dir);
                writeDefinitionsForIds(rel, Array.from(attrIds).filter(Boolean), dir);

                index.nodes.push(nodeRecord);
                index.directories.push({ dir: dirRel, file: rel, owner: ownerRange.name, label, behavior });

                if (!index.owners.some((item) => item.file === rel && item.name === ownerRange.name && item.start === ownerRange.start && item.end === ownerRange.end)) {
                  index.owners.push({
                    name: ownerRange.name,
                    file: rel,
                    start: ownerRange.start,
                    end: ownerRange.end,
                    dir: posix(path.relative(OUT, ownerDir))
                  });
                }
              }

              for (const child of node.children || []) {
                if (child.type === "JSXExpressionContainer") {
                  handleExpression(child.expression, rel, source, ancestors.concat(node), nextOwners, nextInterfaceStack);
                } else {
                  handleExpression(child, rel, source, ancestors.concat(node), nextOwners, nextInterfaceStack);
                }
              }

              return;
            }

            if ((node.type === "ConditionalExpression" || node.type === "LogicalExpression" || node.type === "CallExpression") && containsJSX(node)) {
              handleExpression(node, rel, source, ancestors, nextOwners, interfaceStack);
              return;
            }

            for (const child of childNodes(node)) {
              visit(child, rel, source, ancestors.concat(node), nextOwners, interfaceStack);
            }
          }

          for (const rel of files) {
            if (!JSX_EXTS.has(ext(rel))) continue;
            const ast = astCache.get(rel);
            if (!ast) continue;
            const source = fs.readFileSync(path.join(ROOT, rel), "utf8");
            visit(ast.program, rel, source, [], [], []);
          }

          writeJson(path.join(OUT, "000_INTERFACE_INDEX.json"), index);
          writeJsonl(path.join(OUT, "000_INTERFACE_NODES.jsonl"), index.nodes);
          writeJsonl(path.join(OUT, "000_INTERFACE_DIRECTORIES.jsonl"), index.directories);
          writeJsonl(path.join(OUT, "000_OWNER_INDEX.jsonl"), index.owners);
          writeJsonl(path.join(OUT, "000_ROUTE_TARGETS.jsonl"), index.routes);
          NODE

      - name: Upload interface behavior codebase
        uses: actions/upload-artifact@v4
        with:
          name: dreamengin-interface-behavior-codebase
          path: __interface_codebase__
          include-hidden-files: false
          compression-level: 9
