name: Allowed Vocabulary Application Code Artifact

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Download artifact name."
        required: true
        default: "allowed-vocab-application-code"
        type: string

permissions:
  contents: read

concurrency:
  group: allowed-vocab-application-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-application-code:
    name: Compile application code into allowed vocabulary artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 25
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - name: Compile application code
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$RUNNER_TEMP/allowed-vocab-application-code"
          ZIP_PATH="$RUNNER_TEMP/${{ inputs.artifact_name }}.zip"
          SCRIPT_PATH="$RUNNER_TEMP/allowed-vocab-application-code.mjs"

          cat > "$SCRIPT_PATH" <<'NODE'
          import { execFileSync } from "node:child_process";
          import {
            existsSync,
            mkdirSync,
            readFileSync,
            rmSync,
            statSync,
            writeFileSync,
          } from "node:fs";
          import path from "node:path";

          const WORDS = [
            "the",
            "and",
            "of",
            "to",
            "in",
            "is",
            "for",
            "a",
            "on",
            "with",
            "as",
            "by",
            "at",
            "from",
            "it",
            "this",
            "that",
            "or",
            "be",
            "are",

            "file",
            "path",
            "name",
            "type",
            "role",
            "state",
            "owner",
            "input",
            "output",
            "import",
            "export",
            "route",
            "api",
            "component",
            "function",
            "hook",
            "calls",
            "reads",
            "writes",
            "uses",

            "dreamengin",
            "dreamdmbar",
            "homedream",
            "dreamspace",
            "dreamr",
            "daydream",
            "dream",
            "dreams",
            "engin",
            "engins",
            "coresurface",
            "coresurfaces",
            "surface",
            "surfaces",
            "runtime",
            "bar",
            "seam",
            "particle",
            "codeengin",
            "gameengin",
          ];

          const APPLICATION_ROOTS = new Set([
            "app",
            "assembly",
            "components",
            "coresurfaces",
            "daydreams",
            "dreamdmbar",
            "dreamr",
            "engine",
            "engin",
            "engins",
            "hooks",
            "styles",
            "types",
          ]);

          const APPLICATION_CODE_EXTENSIONS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".css",
            ".scss",
            ".sass",
          ]);

          const EXCLUDED_PATHS = [
            /^node_modules\//,
            /^\.git\//,
            /^\.next\//,
            /^out\//,
            /^dist\//,
            /^coverage\//,
            /^playwright-report\//,
            /^test-results\//,
            /^\.turbo\//,
            /^\.vercel\//,
            /^build-memory\//,
            /\.tsbuildinfo$/,
            /\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$/,
            /(^|\/)__tests__\//,
            /(^|\/)test\//,
            /(^|\/)tests\//,
            /(^|\/)docs?\//,
            /(^|\/)README\.md$/i,
            /\.mdx?$/i,
            /\.ya?ml$/i,
            /\.json$/i,
            /\.(png|jpe?g|gif|webp|svg|ico|mp4|mov|webm|avi|mkv|mp3|wav|ogg|flac|wasm|zip|gz|tar|pdf|ttf|otf|woff2?)$/i,
          ];

          function normalizePath(value) {
            return value.trim().replace(/\\/g, "/").replace(/^\.\//, "");
          }

          function rootOf(filePath) {
            return normalizePath(filePath).split("/")[0] || "";
          }

          function isApplicationRoot(filePath) {
            return APPLICATION_ROOTS.has(rootOf(filePath));
          }

          function isExcluded(filePath) {
            return EXCLUDED_PATHS.some((pattern) => pattern.test(filePath));
          }

          function isApplicationCode(filePath) {
            return APPLICATION_CODE_EXTENSIONS.has(path.extname(filePath).toLowerCase());
          }

          function gitTrackedFiles() {
            const raw = execFileSync("git", ["ls-files", "-z"], { encoding: "buffer" });

            return raw
              .toString("utf8")
              .split("\0")
              .map(normalizePath)
              .filter(Boolean)
              .filter((file) => isApplicationRoot(file))
              .filter((file) => isApplicationCode(file))
              .filter((file) => !isExcluded(file));
          }

          function encodeBuffer(buffer) {
            const out = [];

            for (const byte of buffer) {
              out.push(WORDS[Math.floor(byte / WORDS.length)]);
              out.push(WORDS[byte % WORDS.length]);
            }

            return out.join(" ");
          }

          function encodeText(text) {
            return encodeBuffer(Buffer.from(text, "utf8"));
          }

          function encodePathToAllowedWords(value) {
            return encodeText(value).split(/\s+/g).filter(Boolean);
          }

          function encodedDirectoryPath(originalDirectory) {
            const words = encodePathToAllowedWords(originalDirectory || ".");
            const parts = ["path"];

            for (let index = 0; index < words.length; index += 12) {
              parts.push(words.slice(index, index + 12).join("/"));
            }

            return parts.join("/");
          }

          function ensureCleanDir(dir) {
            rmSync(dir, { recursive: true, force: true });
            mkdirSync(dir, { recursive: true });
          }

          function groupByDirectory(files) {
            const groups = new Map();

            for (const filePath of files) {
              const dir = path.dirname(filePath) === "." ? "." : normalizePath(path.dirname(filePath));
              const list = groups.get(dir) || [];
              list.push(filePath);
              groups.set(dir, list);
            }

            return groups;
          }

          function writeEncodedFile(filePath, text) {
            mkdirSync(path.dirname(filePath), { recursive: true });
            writeFileSync(filePath, `${encodeText(text)}\n`);
          }

          const outDir = process.argv[2];

          ensureCleanDir(outDir);

          const selectedFiles = gitTrackedFiles()
            .filter((filePath) => existsSync(filePath))
            .filter((filePath) => statSync(filePath).isFile())
            .sort((a, b) => a.localeCompare(b));

          const groups = groupByDirectory(selectedFiles);

          for (const [directory, files] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
            const bundleParts = [];
            const encodedDir = encodedDirectoryPath(directory);
            const outputPath = path.join(outDir, encodedDir, "file");

            for (const filePath of files.sort((a, b) => a.localeCompare(b))) {
              const source = readFileSync(filePath, "utf8");

              bundleParts.push("file");
              bundleParts.push(filePath);
              bundleParts.push(source);
              bundleParts.push("file");
              bundleParts.push("");
            }

            writeEncodedFile(outputPath, bundleParts.join("\n"));
          }

          console.log("file");
          NODE

          node "$SCRIPT_PATH" "$OUT_DIR"

          (
            cd "$OUT_DIR"
            zip -qr "$ZIP_PATH" .
          )

          echo "ALLOWED_VOCAB_APPLICATION_CODE_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Upload encoded application code artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.ALLOWED_VOCAB_APPLICATION_CODE_ZIP }}
          if-no-files-found: error
