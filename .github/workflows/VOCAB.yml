name: Strip Human-Readable Repo ZIPs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strip-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install minifier in isolated tool folder
        run: |
          node -e "require('node:fs').mkdirSync('__strip_tools__',{recursive:true});require('node:fs').writeFileSync('__strip_tools__/package.json','{\"type\":\"commonjs\"}')"
          npm --prefix __strip_tools__ install esbuild@0.25.6 --no-package-lock --silent

      - name: Create stripped repo copies
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const FULL_OUT = path.join(ROOT, "__stripped_repo__");
          const APP_OUT = path.join(ROOT, "__app_code_only__");

          const toolRequire = createRequire(path.join(ROOT, "__strip_tools__", "package.json"));
          const esbuild = toolRequire("esbuild");

          const FULL_SKIP_DIRS = new Set([
            ".git",
            "node_modules",
            ".next",
            "out",
            "dist",
            "build",
            "coverage",
            ".turbo",
            "__strip_tools__",
            "__stripped_repo__",
            "__app_code_only__"
          ]);

          const APP_SKIP_DIRS = new Set([
            ".git",
            ".github",
            ".ci",
            "ci",
            ".circleci",
            ".vscode",
            ".idea",
            "node_modules",
            ".next",
            "out",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".cache",
            "playwright-report",
            "test-results",
            "tests",
            "test",
            "__tests__",
            "e2e",
            "cypress",
            ".storybook",
            "storybook-static",
            "__strip_tools__",
            "__stripped_repo__",
            "__app_code_only__"
          ]);

          const CODE_LOADERS = new Map([
            [".js", "js"],
            [".jsx", "jsx"],
            [".mjs", "js"],
            [".cjs", "js"],
            [".ts", "ts"],
            [".tsx", "tsx"],
            [".mts", "ts"],
            [".cts", "ts"]
          ]);

          const APP_CODE_EXTS = new Set([
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".ts",
            ".tsx",
            ".mts",
            ".cts",
            ".css",
            ".scss",
            ".sass",
            ".sql"
          ]);

          const CSS_EXTS = new Set([
            ".css",
            ".scss",
            ".sass"
          ]);

          const TEXT_COMMENT_EXTS = new Set([
            ".yml",
            ".yaml",
            ".toml",
            ".env",
            ".example",
            ".sql",
            ".sh",
            ".bash",
            ".zsh",
            ".py",
            ".rb",
            ".go",
            ".rs",
            ".java",
            ".c",
            ".h",
            ".cpp",
            ".hpp",
            ".cs"
          ]);

          const HUMAN_DOC_FILE = [
            /(^|\/)README(\..*)?\.md$/i,
            /(^|\/)CHANGELOG(\..*)?\.md$/i,
            /(^|\/)CONTRIBUTING(\..*)?\.md$/i,
            /(^|\/)CODE_OF_CONDUCT(\..*)?\.md$/i,
            /(^|\/)SECURITY(\..*)?\.md$/i,
            /(^|\/)REPO_STATE.*\.md$/i,
            /(^|\/)FILE_TREE.*\.md$/i,
            /(^|\/).*SUMMARY.*\.(md|txt)$/i,
            /(^|\/).*REPORT.*\.(md|txt)$/i,
            /(^|\/).*AUDIT.*\.(md|txt)$/i,
            /(^|\/).*NOTES.*\.(md|txt)$/i,
            /(^|\/).*PLAN.*\.(md|txt)$/i
          ];

          const APP_EXCLUDE_FILE = [
            /(^|\/).*\.md$/i,
            /(^|\/).*\.mdx$/i,
            /(^|\/).*\.txt$/i,

            /(^|\/).*\.test\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.spec\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.stories\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.story\.[cm]?[jt]sx?$/i,

            /(^|\/)index\.[cm]?[jt]sx?$/i,
            /(^|\/)index\.css$/i,
            /(^|\/)index\.scss$/i,
            /(^|\/)index\.sass$/i,

            /(^|\/)manifest\..*$/i,
            /(^|\/).*\.manifest\..*$/i,
            /(^|\/)package\.json$/i,
            /(^|\/)package-lock\.json$/i,
            /(^|\/)pnpm-lock\.yaml$/i,
            /(^|\/)yarn\.lock$/i,
            /(^|\/)bun\.lockb$/i,

            /(^|\/)tsconfig.*\.json$/i,
            /(^|\/)jsconfig.*\.json$/i,
            /(^|\/)next\.config\..*$/i,
            /(^|\/)postcss\.config\..*$/i,
            /(^|\/)tailwind\.config\..*$/i,
            /(^|\/)eslint\.config\..*$/i,
            /(^|\/)\.eslintrc.*$/i,
            /(^|\/)\.prettierrc.*$/i,
            /(^|\/)\.gitignore$/i,
            /(^|\/)\.gitattributes$/i,
            /(^|\/)\.npmrc$/i,
            /(^|\/)\.nvmrc$/i,

            /(^|\/).*\.map$/i,
            /(^|\/).*\.snap$/i,
            /(^|\/).*\.log$/i,

            /(^|\/).*\.png$/i,
            /(^|\/).*\.jpg$/i,
            /(^|\/).*\.jpeg$/i,
            /(^|\/).*\.gif$/i,
            /(^|\/).*\.svg$/i,
            /(^|\/).*\.webp$/i,
            /(^|\/).*\.ico$/i,
            /(^|\/).*\.woff2?$/i,
            /(^|\/).*\.ttf$/i,
            /(^|\/).*\.otf$/i
          ];

          function toPosix(value) {
            return value.split(path.sep).join("/");
          }

          function removeIfExists(target) {
            fs.rmSync(target, { recursive: true, force: true });
          }

          function shouldSkipDir(name, skipSet) {
            return skipSet.has(name);
          }

          function isProbablyText(buffer) {
            if (buffer.includes(0)) return false;
            return true;
          }

          function walkFiles(dir, files = []) {
            if (!fs.existsSync(dir)) return files;

            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                walkFiles(full, files);
              } else if (entry.isFile()) {
                files.push(full);
              }
            }

            return files;
          }

          function copyRepo(src, dest, skipSet) {
            const stat = fs.statSync(src);

            if (stat.isDirectory()) {
              const base = path.basename(src);
              if (shouldSkipDir(base, skipSet)) return;

              fs.mkdirSync(dest, { recursive: true });

              for (const entry of fs.readdirSync(src, { withFileTypes: true })) {
                if (entry.isDirectory() && shouldSkipDir(entry.name, skipSet)) continue;
                copyRepo(path.join(src, entry.name), path.join(dest, entry.name), skipSet);
              }

              return;
            }

            if (stat.isFile()) {
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              fs.copyFileSync(src, dest);
            }
          }

          function stripBlockCommentsLoose(text) {
            return text.replace(/\/\*[\s\S]*?\*\//g, "");
          }

          function stripHtmlComments(text) {
            return text.replace(/<!--[\s\S]*?-->/g, "");
          }

          function stripHashLineComments(text) {
            return text
              .split(/\r?\n/)
              .map((line) => line.replace(/\s+$/g, ""))
              .filter((line) => {
                const trimmed = line.trim();
                if (!trimmed) return false;
                if (trimmed.startsWith("#")) return false;
                return true;
              })
              .join("\n");
          }

          function stripSlashLineComments(text) {
            return text
              .split(/\r?\n/)
              .map((line) => line.replace(/\s+$/g, ""))
              .filter((line) => {
                const trimmed = line.trim();
                if (!trimmed) return false;
                if (trimmed.startsWith("//")) return false;
                return true;
              })
              .join("\n");
          }

          function compactDts(text) {
            return stripSlashLineComments(stripBlockCommentsLoose(text))
              .replace(/\s+/g, " ")
              .replace(/\s*([{}()[\];,:<>|&=])\s*/g, "$1")
              .trim();
          }

          function minifyCode(file, ext, text) {
            if (file.endsWith(".d.ts")) return compactDts(text);

            const loader = CODE_LOADERS.get(ext);

            return esbuild.transformSync(text, {
              loader,
              minify: true,
              legalComments: "none",
              jsx: "preserve",
              target: "es2020",
              sourcefile: path.basename(file)
            }).code.trim();
          }

          function minifyCss(text) {
            return esbuild.transformSync(text, {
              loader: "css",
              minify: true,
              legalComments: "none"
            }).code.trim();
          }

          function minifyJson(text) {
            return JSON.stringify(JSON.parse(text));
          }

          function minifyHtml(text) {
            return stripHtmlComments(text)
              .replace(/\s+/g, " ")
              .replace(/>\s+</g, "><")
              .trim();
          }

          function stripHumanReadableFile(file, root) {
            const rel = toPosix(path.relative(root, file));
            const ext = path.extname(file).toLowerCase();

            if (HUMAN_DOC_FILE.some((pattern) => pattern.test(rel))) {
              fs.rmSync(file, { force: true });
              return;
            }

            const raw = fs.readFileSync(file);
            if (!isProbablyText(raw)) return;

            const text = raw.toString("utf8");

            try {
              if (CODE_LOADERS.has(ext)) {
                fs.writeFileSync(file, minifyCode(file, ext, text) + "\n");
                return;
              }

              if (CSS_EXTS.has(ext)) {
                fs.writeFileSync(file, minifyCss(text) + "\n");
                return;
              }

              if (ext === ".json") {
                fs.writeFileSync(file, minifyJson(text) + "\n");
                return;
              }

              if (ext === ".html" || ext === ".htm") {
                fs.writeFileSync(file, minifyHtml(text) + "\n");
                return;
              }

              if (TEXT_COMMENT_EXTS.has(ext)) {
                let stripped = text;

                if ([".yml", ".yaml", ".toml", ".env", ".example", ".sh", ".bash", ".zsh", ".py", ".rb"].includes(ext)) {
                  stripped = stripHashLineComments(stripped);
                } else {
                  stripped = stripSlashLineComments(stripBlockCommentsLoose(stripped));
                }

                fs.writeFileSync(file, stripped.trim() ? stripped.trim() + "\n" : "");
              }
            } catch {
              const fallback = text
                .replace(/\s+$/gm, "")
                .replace(/\n{3,}/g, "\n")
                .trim();

              fs.writeFileSync(file, fallback ? fallback + "\n" : "");
            }
          }

          function shouldRemoveFromAppCodeOnly(file) {
            const rel = toPosix(path.relative(APP_OUT, file));
            const ext = path.extname(file).toLowerCase();

            if (!APP_CODE_EXTS.has(ext)) return true;
            if (APP_EXCLUDE_FILE.some((pattern) => pattern.test(rel))) return true;

            const parts = rel.split("/");
            if (parts.some((part) => APP_SKIP_DIRS.has(part))) return true;
            if (parts.some((part) => part.startsWith("."))) return true;
            if (parts.some((part) => part === "__tests__")) return true;

            return false;
          }

          function pruneEmptyDirs(dir) {
            if (!fs.existsSync(dir)) return true;

            let entries = fs.readdirSync(dir, { withFileTypes: true });

            for (const entry of entries) {
              if (entry.isDirectory()) {
                const full = path.join(dir, entry.name);
                const empty = pruneEmptyDirs(full);
                if (empty) fs.rmdirSync(full);
              }
            }

            entries = fs.readdirSync(dir, { withFileTypes: true });
            return entries.length === 0;
          }

          removeIfExists(FULL_OUT);
          removeIfExists(APP_OUT);

          copyRepo(ROOT, FULL_OUT, FULL_SKIP_DIRS);
          copyRepo(ROOT, APP_OUT, APP_SKIP_DIRS);

          for (const file of walkFiles(FULL_OUT)) {
            stripHumanReadableFile(file, FULL_OUT);
          }

          for (const file of walkFiles(APP_OUT)) {
            if (shouldRemoveFromAppCodeOnly(file)) {
              fs.rmSync(file, { force: true });
              continue;
            }

            stripHumanReadableFile(file, APP_OUT);
          }

          pruneEmptyDirs(APP_OUT);
          NODE

      - name: Upload full stripped repo ZIP
        uses: actions/upload-artifact@v4
        with:
          name: stripped-repo
          path: __stripped_repo__/
          include-hidden-files: true
          compression-level: 9

      - name: Upload application code only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: app-code-only-stripped
          path: __app_code_only__/
          include-hidden-files: false
          compression-level: 9
