name: Generate Supabase Types

on:
  workflow_dispatch:
  # Optional: Uncomment if you want this to run automatically on every push
  # push:
  #   branches:
  #     - main

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate types (via Project Ref)
        run: |
          supabase gen types typescript \
            --project-id "suaiqcynxospjijzdudc" \
            --schema public > types/supabase.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add types/supabase.ts
          git commit -m "chore: regenerate supabase types [skip ci] [skip vercel]" || echo "No changes"
          git push
