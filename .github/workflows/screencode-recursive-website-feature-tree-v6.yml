          function isLinkLike(tag, attrs, sourceText = "") { const base = String(tag || "").split(".").pop().toLowerCase(); const role = String(attrs.role || "").toLowerCase(); return base === "a" || base === "link" || base.endsWith("link") || base === "navlink" || role === "link" || Boolean(attrs.href || attrs.to || attrs.route || attrs.path || attrs.url) || /\b(router\.(push|replace)|navigate\(|redirect\(|location\.href)\b/.test(sourceText); }
          function routeFromFile(rel) {
            const parts = rel.split("/"); const file = parts[parts.length - 1]; const base = file.replace(/\.(tsx|jsx|ts|js|mjs|cjs)$/i, "");
            const appIndex = parts.lastIndexOf("app"); if (appIndex >= 0 && ["page", "route"].includes(base)) { const routeParts = parts.slice(appIndex + 1, -1).filter((part) => part && !part.startsWith("(") && !part.startsWith("@")); return "/" + routeParts.filter(Boolean).join("/"); }
            const pagesIndex = parts.lastIndexOf("pages"); if (pagesIndex >= 0 && parts[pagesIndex + 1] !== "api") { const routeParts = parts.slice(pagesIndex + 1); routeParts[routeParts.length - 1] = base; const clean = routeParts.filter((part) => part !== "index"); return "/" + clean.join("/"); }
