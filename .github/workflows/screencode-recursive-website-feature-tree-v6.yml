          const USER_FEATURE_RE = /(?:^|\b)(dream|dm|bar|menu|panel|drawer|dialog|modal|sheet|popover|tab|feed|profile|message|chat|thread|conversation|composer|comment|post|media|upload|asset|workspace|space|surface|canvas|viewport|shell|window|widget|search|settings|connector|launcher|editor|toolbar|card|engin|game|room|notification|button|link|input|form|select|toggle|switch|slider|list|grid|table|nav|header|footer|sidebar|player|viewer|preview|gallery|timeline|inbox|invite|share|member|identity|avatar|control|action|home|page|route|room|game|tool|asset|profile|settings)(?:\b|$)/i;
          const NON_UI_RE = /(?:^|\b)(provider|context|boundary|errorboundary|suspense|portal|helmet|head|metadata|script|theme|config|registry|adapter|clientprovider|queryclient|hydration|hydrate|analytics|telemetry|observer|guard|gate|authguard|permissionguard|featureflag|devtool|debug|test|mock|fixture|story|stories|schema|model|store|reducer|dispatch|controller|manager|service|factory|mapper|normalizer|serializer|parser)(?:\b|$)/i;
          const NON_ACTION_RE = /(?:^|\b)(error\s*boundary|boundary|provider|context|registry|adapter|telemetry|analytics|debug|mock|story|fixture|schema|reducer|store|manager|service|factory)(?:\b|$)/i;

          function isNoiseActionLabel(value) {
            return NON_ACTION_RE.test(cleanWords(value || ""));
          }

          function targetDisplayLabel(target) {
            if (!target) return "Destination";
            if (target.route) return routeLabel(target.route);
            if (target.kind === "external") return "External Destination";
            if (target.kind === "download") return "Download";
            if (target.kind === "dynamic") return "Dynamic Destination";
            if (target.kind === "anchor") return "Same Page Anchor";
            if (target.kind === "unknown") return "Unknown Destination";
            return sanitize(target.kind || "Destination", "Destination");
          }

          const ACTION_LABEL_RE = /(?:^|\b)(open|close|save|delete|remove|edit|cancel|send|submit|create|add|update|upload|download|share|launch|start|stop|play|pause|toggle|enable|disable|connect|disconnect|invite|join|leave|accept|decline|approve|reject|publish|unpublish|copy|duplicate|clear|reset|search|filter|sort|resize|drag|drop|move|select|choose|switch|next|previous|back|forward|reply|comment|like|follow|unfollow)(?:\b|$)/i;

          function isActionWorthy(tag, attrs, actionLabel, handler) {
