            let route = value.split(/[?#]/)[0]; if (!route) return { kind: "unknown", raw: value, route: "" };
            if (!route.startsWith("/")) { const base = currentRoute && currentRoute !== "/" ? currentRoute : "/"; route = path.posix.normalize(path.posix.join(base, route)); }
