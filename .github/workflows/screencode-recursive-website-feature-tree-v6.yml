            const role = String(attrs.role || "").toLowerCase();
            const type = String(attrs.type || "").toLowerCase();
            const label = cleanWords(actionLabel || "");
            const combined = `${tag || ""} ${role} ${type} ${label} ${handler?.event || ""}`;

            if (!label || isNoiseActionLabel(combined)) return false;
            if (/^(input|label|field|div|span|section|article|header|footer|main|aside|content|wrapper|container)$/i.test(label)) return false;

