            function add(sourceType, plugins) { attempts.push({ sourceType, plugins: Array.from(new Set(plugins)) }); }
            if (lower.endsWith(".tsx")) { add("module", ["jsx", "typescript", ...common]); add("unambiguous", ["jsx", "typescript", ...common]); }
            else if (lower.endsWith(".ts")) { add("module", ["typescript", ...common]); add("unambiguous", ["typescript", ...common]); add("module", ["jsx", "typescript", ...common]); }
            else if (lower.endsWith(".jsx")) { add("module", ["jsx", ...common]); add("unambiguous", ["jsx", ...common]); add("module", ["jsx", "flow", ...common]); add("module", ["jsx", "typescript", ...common]); add("script", ["jsx", ...common]); }
            else { add("module", ["jsx", ...common]); add("unambiguous", ["jsx", ...common]); add("module", [...common]); add("unambiguous", [...common]); add("module", ["jsx", "flow", ...common]); add("module", ["jsx", "typescript", ...common]); add("script", ["jsx", ...common]); }
            let last = null;
