name: Export Recursive Website Feature Tree V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-recursive-website-feature-tree-v6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install source parser
        run: |
          node -e "require('node:fs').mkdirSync('__de_feature_tools__',{recursive:true});require('node:fs').writeFileSync('__de_feature_tools__/package.json','{\"type\":\"commonjs\"}')"
          npm --prefix __de_feature_tools__ install @babel/parser@latest --no-package-lock --silent

      - name: Export recursive website feature tree
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, "__dreamengin_website_feature_tree__");
          const META = path.join(OUT, ".de");
          const requireTools = createRequire(path.join(ROOT, "__de_feature_tools__", "package.json"));
          const parser = requireTools("@babel/parser");

          const SKIP_DIRS = new Set([
            ".git", ".github", ".ci", "node_modules", ".next", "out", "dist", "build", "coverage", ".turbo", ".cache",
            "__de_feature_tools__", "__dreamengin_website_feature_tree__"
