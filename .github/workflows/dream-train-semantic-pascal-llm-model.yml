                  "    x_text = bundle['vectorizer'].transform([query])",
                  "    x_text = bundle['svd'].transform(x_text)",
                  "",
                  "    pascal_dims = bundle['pascalScaler'].mean_.shape[0]",
                  "    x_pascal = np.zeros((1, pascal_dims), dtype=np.float32)",
                  "    x_pascal = bundle['pascalScaler'].transform(x_pascal)",
                  "",
                  "    x = np.hstack([x_text, x_pascal])",
                  "",
                  "    result = {",
                  "        'query': query,",
                  "        'predictedRoot': str(bundle['rootClassifier'].predict(x)[0])",
                  "    }",
                  "",
                  "    if bundle.get('tagClassifier') is not None:",
                  "        tag_pred = bundle['tagClassifier'].predict(x)",
                  "        tags = bundle['tagBinarizer'].inverse_transform(tag_pred)",
                  "        result['predictedTags'] = list(tags[0]) if tags else []",
                  "",
                  "    print(json.dumps(result, indent=2))",
                  "    return 0",
                  "",
                  "if __name__ == '__main__':",
                  "    raise SystemExit(main())",
                  "",
              ]
              inference_script = "\n".join(inference_lines)

              (OUT_DIR / "Model" / "infer_semantic_pascal.py").write_text(inference_script, encoding="utf-8")

              file_index_rows = []
              llm_cards = []
              fine_tune_rows = []

              neighbors_by_file = {}
              for row in neighbor_rows:
