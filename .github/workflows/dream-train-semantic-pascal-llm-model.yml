                                  f"Nearest semantic files: {', '.join(n['neighborPath'] for n in neighbors) or 'none'}."
                              )
                          }
                      ]
                  })

              write_csv(OUT_DIR / "Data" / "semantic_events.csv",
                        ["sourcePath", "root", "kind", "category", "name", "pascalBits", "finalColumn"],
