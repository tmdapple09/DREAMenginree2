                  "rootClassifier": root_classifier,
                  "tagBinarizer": tag_binarizer,
                  "tagClassifier": tag_classifier,
                  "roots": sorted(set(roots.tolist())),
              }
              joblib.dump(bundle, OUT_DIR / "Model" / "semantic_pascal_model.joblib")
              np.save(OUT_DIR / "Model" / "semantic_pascal_embeddings.npy", X)

              inference_lines = [
                  "from __future__ import annotations",
