                  "import json",
                  "import sys",
                  "from pathlib import Path",
                  "",
                  "import joblib",
                  "import numpy as np",
                  "",
                  "MODEL_PATH = Path(__file__).with_name('semantic_pascal_model.joblib')",
                  "",
                  "def main() -> int:",
                  "    if len(sys.argv) < 2:",
                  "        print(\"Usage: python infer_semantic_pascal.py '<query text>'\")",
                  "        return 2",
                  "",
                  "    query = ' '.join(sys.argv[1:])",
                  "    bundle = joblib.load(MODEL_PATH)",
