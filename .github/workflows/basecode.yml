name: DREAMengin Repo Minus Exclusions Zip

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repo-minus-exclusions-zip:
    name: Build repo zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build repo minus exclusions zip
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="artifact/repo-minus-exclusions"
          ZIP_FILE="artifact/Dreamengin.repo-minus-exclusions.zip"

          rm -rf "$OUT_DIR"
          rm -f "$ZIP_FILE"

          mkdir -p "$OUT_DIR"

          find . \
            \( \
              -path './.git' -o \
              -path './.github' -o \
              -path './node_modules' -o \
              -path './artifact' -o \
              -path './.next' -o \
              -path './dist' -o \
              -path './build' -o \
              -path './coverage' -o \
              -path './.turbo' -o \
              -path './.vercel' -o \
              -type d -iname '*test*' -o \
              -type d -iname '*spec*' \
            \) -prune -o \
            -type f \
            ! -iname '*.md' \
            ! -iname '*.mdx' \
            ! -iname 'index.*' \
            ! -iname '*.test.*' \
            ! -iname '*.spec.*' \
            -print0 |
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            mkdir -p "$OUT_DIR/$(dirname "$rel")"
            cp "$file" "$OUT_DIR/$rel"
          done

          cd "$OUT_DIR"
          zip -9qr "../Dreamengin.repo-minus-exclusions.zip" .

      - name: Upload repo zip
        uses: actions/upload-artifact@v6
        with:
          name: Dreamengin-repo-minus-exclusions
          path: artifact/Dreamengin.repo-minus-exclusions.zip
          if-no-files-found: error
          compression-level: 9
