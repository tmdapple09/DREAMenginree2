name: DREAMengin Repo Minus Exclusions Zip

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repo-minus-exclusions-zip:
    name: Build repo zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build repo minus exclusions zip
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifact/repo-minus-exclusions
          rm -f artifact/Dreamengin.repo-minus-exclusions.zip

          mkdir -p artifact/repo-minus-exclusions

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");

          const ROOT = process.cwd();
          const OUT_DIR = path.join(ROOT, "artifact", "repo-minus-exclusions");
          const ZIP_FILE = path.join(ROOT, "artifact", "Dreamengin.repo-minus-exclusions.zip");

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            "node_modules",
            "artifact"
          ]);

          function normalize(value) {
            return String(value || "").replace(/\\/g, "/");
          }

          function relativeFile(file) {
            return normalize(path.relative(ROOT, file));
          }

          function ensureParentDir(file) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
          }

          function isMarkdown(rel) {
            return /\.(md|mdx)$/i.test(rel);
          }

          function isIndexFile(rel) {
            return /^index\.[^.]+$/i.test(path.basename(rel));
          }

          function isTestPath(rel) {
            return (
              rel.startsWith("test/") ||
              rel.startsWith("tests/") ||
              rel.includes("/test/") ||
              rel.includes("/tests/") ||
              rel.includes("/__tests__/") ||
              rel.includes("/__mocks__/") ||
              /\.(test|spec)\.[^.]+$/i.test(rel)
            );
          }

          function shouldExcludeFile(file) {
            const rel = relativeFile(file);

            if (isMarkdown(rel)) return true;
            if (isTestPath(rel)) return true;
            if (isIndexFile(rel)) return true;

            return false;
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) {
                  walk(full, out);
                }
                continue;
              }

              if (!entry.isFile()) continue;
              if (shouldExcludeFile(full)) continue;

              out.push(full);
            }

            return out;
          }

          const files = walk(ROOT).sort((a, b) =>
            relativeFile(a).localeCompare(relativeFile(b))
          );

          for (const file of files) {
            const rel = relativeFile(file);
            const target = path.join(OUT_DIR, rel);

            ensureParentDir(target);
            fs.copyFileSync(file, target);
          }

          execFileSync("zip", ["-9qr", ZIP_FILE, "."], {
            cwd: OUT_DIR,
            stdio: "inherit"
          });

          console.log(`Wrote ${relativeFile(ZIP_FILE)}`);
          NODE

      - name: Upload repo zip
        uses: actions/upload-artifact@v6
        with:
          name: Dreamengin-repo-minus-exclusions
          path: artifact/Dreamengin.repo-minus-exclusions.zip
          if-no-files-found: error
          compression-level: 9
