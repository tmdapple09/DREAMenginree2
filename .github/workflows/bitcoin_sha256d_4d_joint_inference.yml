                      "measure": "user-supplied finite prior volume",
                      "operational": "used directly with no verification gate",
                  },
              ]
              write_csv(MEASURE_AUDIT, measure_rows)
          
              log2_states, log10_states = log_state_space()
              STATE_SPACE.write_text(
                  json.dumps(
                      {
                          "formula": "(16! * (64!)^2 * 96! * 2^45 * 3^15) / (1536 * (8!)^8)",
                          "declared_log2_states": log2_states,
                          "declared_log10_states": log10_states,
                          "formula_verification_gate": False,
                          "interior_header_cells": 16,
                          "surface_constraint_cells": 240,
                          "total_4d_cells": 256,
                          "hard_constraints": [
                              "p0 XOR p1 XOR p2 XOR p3 = 0",
                              "p0 XOR p1 = 0",
                              "product_i O_i = Identity",
                          ],
                          "added_group_law": None,
                          "convergence_mode": CONVERGENCE_MODE,
                          "bit_fallback_width": BIT_FALLBACK_WIDTH,
                          "connected_hidden_bit_graph": (
                              CONVERGENCE_MODE == "hidden_bit_fallback"
                              and BIT_FALLBACK_WIDTH == 0
                          ),
                      },
                      indent=2,
                      sort_keys=True,
                  ),
                  encoding="utf-8",
              )
          
          
          def main() -> None:
              started = time.time()
              write_model_spec()
              status = {
                  "completed": False,
                  "fake_completion": False,
                  "model_revision": MODEL_REVISION,
                  "external_symbolic_solver_used": False,
                  "z3_used": False,
                  "artificial_scramble": False,
                  "physical_rubik_moves_used": False,
                  "nonce_interval_loop": False,
                  "exact_hash_match": False,
                  "exact_original_header_match": False,
                  "convergence_mode": CONVERGENCE_MODE,
                  "bit_fallback_width": BIT_FALLBACK_WIDTH,
                  "max_runtime_seconds": MAX_RUNTIME_SECONDS,
                  "max_expanded_states": MAX_EXPANDED_STATES,
                  "max_frontier_size": MAX_FRONTIER_SIZE,
                  "stagnation_window": STAGNATION_WINDOW,
                  "frontier_pruned": False,
                  "frontier_pruned_states": 0,
                  "termination_reason": None,
              }
          
              best: Optional[Evaluation] = None
              sealed_truth_header = bytes(80)
              observation = bytes(80)
              hidden: set[int] = set()
              block_hash = ""
              trace_rows: List[dict] = []
              exact_models: List[Evaluation] = []
              iteration = 0
              expanded_headers: set[str] = set()
              frontier: List[Tuple[float, int, int, int, int, str, Evaluation]] = []
              accepted_section = "not_started"
              termination_reason: Optional[str] = None
              frontier_pruned = False
              frontier_pruned_states = 0
              last_improvement_iteration = 0
          
              try:
                  metadata: dict = {}
                  block_hash = BLOCK_HASH
                  raw_header_hex = RAW_HEADER_HEX
          
                  if raw_header_hex:
                      if len(raw_header_hex) != 160:
                          raise ValueError("RAW_HEADER_HEX must be exactly 160 hex characters")
                      sealed_truth_header = bytes.fromhex(raw_header_hex)
                      computed = hashlib_displayed_hash(sealed_truth_header)
                      block_hash = EXPECTED_BLOCK_HASH or block_hash or computed
                      if computed != block_hash:
                          raise ValueError("raw header does not match expected block hash")
                  else:
                      if not block_hash:
                          if BLOCK_HEIGHT:
                              block_hash = http_text(f"/block-height/{int(BLOCK_HEIGHT)}")
                          else:
                              block_hash = http_text("/blocks/tip/hash")
                      raw_header_hex = http_text(f"/block/{block_hash}/header").lower()
                      if len(raw_header_hex) != 160:
                          raise RuntimeError("API did not return an 80-byte header")
                      sealed_truth_header = bytes.fromhex(raw_header_hex)
                      metadata = http_json(f"/block/{block_hash}")
                      if hashlib_displayed_hash(sealed_truth_header) != block_hash:
                          raise RuntimeError("fetched header failed independent validation")
          
                  target_raw = bytes.fromhex(block_hash)[::-1]
                  hidden = parse_hidden_bits()
                  observation_mutable = bytearray(sealed_truth_header)
                  for bit in hidden:
                      put_bit(observation_mutable, bit, 0)
                  observation = bytes(observation_mutable)
                  initial_mask = tuple(0 if bit in hidden else 1 for bit in range(640))
          
                  initial_header = canonical_initial_header(
                      target_raw,
                      block_hash,
                      observation,
                      hidden,
                      initial_mask,
                      metadata,
                  )
                  initial_evaluation = evaluate(
                      initial_header,
                      target_raw,
                      block_hash,
                      observation,
                      initial_mask,
                      metadata,
                  )
                  best = initial_evaluation
          
                  connected_graph = (
                      CONVERGENCE_MODE == "hidden_bit_fallback" and BIT_FALLBACK_WIDTH == 0
                  )
                  digest_only_underdetermined = CONTEXT_MODE == "hash_only" and len(hidden) > 256
                  status.update(
                      {
                          "block_hash": block_hash,
                          "hidden_bit_count": len(hidden),
                          "visible_bit_count": 640 - len(hidden),
                          "digest_constraint_bits": 256,
                          "digest_only_underdetermined": digest_only_underdetermined,
                          "historical_identity_identifiable_from_configured_evidence": (
                              not digest_only_underdetermined
                          ),
                          "connected_hidden_bit_graph": connected_graph,
                          "reachability_guaranteed": connected_graph,
                          "observation_noise_requested": ALLOW_OBSERVATION_NOISE,
                          "auto_relax_observation_noise": AUTO_RELAX_OBSERVATION_NOISE,
                          "observation_noise_effective": initial_evaluation.observation_noise_effective,
                      }
                  )
          
                  emit(f"[model] revision={MODEL_REVISION}")
                  emit(f"[bitcoin] block_hash={block_hash}")
                  emit(
                      f"[config] recovery_scope={RECOVERY_SCOPE} context_mode={CONTEXT_MODE} "
                      f"hidden_bits={len(hidden)}"
                  )
                  emit(
                      f"[convergence] mode={CONVERGENCE_MODE} bit_fallback_width={BIT_FALLBACK_WIDTH} "
                      f"reachability_guaranteed={connected_graph}"
                  )
                  emit(
                      f"[observation] requested_noise={ALLOW_OBSERVATION_NOISE} "
                      f"auto_relax={AUTO_RELAX_OBSERVATION_NOISE} "
                      f"effective_noise={initial_evaluation.observation_noise_effective}"
                  )
                  emit(
                      f"[budgets] runtime={MAX_RUNTIME_SECONDS}s expanded={MAX_EXPANDED_STATES} "
                      f"frontier={MAX_FRONTIER_SIZE} stagnation={STAGNATION_WINDOW}"
                  )
                  if digest_only_underdetermined:
                      emit(
                          "[identifiability] hash-only evidence with more than 256 hidden bits "
                          "does not identify the historical 80-byte header"
                      )
                  emit(
                      f"[initial] energy={initial_evaluation.total_energy:.3f} "
                      f"digest_hamming={initial_evaluation.digest_hamming} "
                      f"state_edges={initial_evaluation.compatibility.state_edge_hamming} "
                      f"schedule_edges={initial_evaluation.compatibility.schedule_edge_hamming}"
                  )
          
                  queued_headers = {initial_header.hex()}
                  serial = 0
                  heapq.heappush(
                      frontier,
                      (
                          *priority_key(initial_evaluation, serial),
                          "canonical_backward_pullback",
                          initial_evaluation,
                      ),
                  )
          
                  while True:
                      if requested_model_count_reached(len(exact_models)):
                          termination_reason = "requested_exact_model_count_reached"
                          break
                      elapsed = time.time() - started
                      if MAX_RUNTIME_SECONDS and elapsed >= MAX_RUNTIME_SECONDS:
                          termination_reason = "max_runtime_seconds_reached"
                          break
                      if MAX_EXPANDED_STATES and len(expanded_headers) >= MAX_EXPANDED_STATES:
                          termination_reason = "max_expanded_states_reached"
                          break
                      if not frontier:
                          termination_reason = "frontier_exhausted"
                          break
          
                      (
                          _,
                          _,
                          _,
                          _,
                          _,
                          section_name,
                          current,
                      ) = heapq.heappop(frontier)
                      current_key = current.header.hex()
                      if current_key in expanded_headers:
                          continue
                      expanded_headers.add(current_key)
                      iteration += 1
                      accepted_section = section_name
          
                      if best is None or current.total_energy < best.total_energy:
                          best = current
                          last_improvement_iteration = iteration
          
                      if current.exact_hash_match:
                          independent = hashlib_displayed_hash(current.header)
                          if independent != block_hash:
                              raise RuntimeError("internal exact state failed independent hashlib validation")
                          if all(model.header != current.header for model in exact_models):
                              exact_models.append(current)
                              emit(f"[complete] exact model {len(exact_models)}: {current.header.hex()}")
                          if requested_model_count_reached(len(exact_models)):
                              best = current
                              termination_reason = "requested_exact_model_count_reached"
                              break
          
                      proposals = tesseract_projection_updates(current, observation, hidden)
                      frontier_rows: List[dict] = []
                      for proposal_name, candidate_header in proposals:
                          candidate_key = candidate_header.hex()
                          if candidate_key in queued_headers or candidate_key in expanded_headers:
                              continue
                          candidate = evaluate(
                              candidate_header,
                              target_raw,
                              block_hash,
                              observation,
                              initial_mask,
                              metadata,
                          )
                          serial += 1
                          heapq.heappush(
                              frontier,
                              (
                                  *priority_key(candidate, serial),
                                  proposal_name,
                                  candidate,
                              ),
                          )
                          queued_headers.add(candidate_key)
                          frontier_rows.append(
                              {
                                  "iteration": iteration,
                                  "projection_section": proposal_name,
                                  "total_energy": candidate.total_energy,
                                  "digest_hamming": candidate.digest_hamming,
                                  "E_local": candidate.E_local,
                                  "state_edge_hamming": candidate.compatibility.state_edge_hamming,
                                  "schedule_edge_hamming": candidate.compatibility.schedule_edge_hamming,
                                  "header_hex": candidate.header.hex(),
                              }
                          )
          
                      if MAX_FRONTIER_SIZE and len(frontier) > MAX_FRONTIER_SIZE:
                          before = len(frontier)
                          frontier = heapq.nsmallest(MAX_FRONTIER_SIZE, frontier)
                          heapq.heapify(frontier)
                          removed = before - len(frontier)
                          frontier_pruned = True
                          frontier_pruned_states += removed
          
                      frontier_rows.sort(
                          key=lambda row: (
                              row["total_energy"],
                              row["digest_hamming"],
                              row["state_edge_hamming"],
                              row["schedule_edge_hamming"],
                              row["projection_section"],
                          )
                      )
                      write_csv(
                          FRONTIER,
                          frontier_rows,
                          fieldnames=[
                              "iteration",
                              "projection_section",
                              "total_energy",
                              "digest_hamming",
                              "E_local",
                              "state_edge_hamming",
                              "schedule_edge_hamming",
                              "header_hex",
                          ],
                      )
          
                      trace_rows.append(
                          {
                              "iteration": iteration,
                              "accepted_projection_section": section_name,
                              "frontier_size": len(frontier),
                              "expanded_states": len(expanded_headers),
                              "total_energy": current.total_energy,
                              "transformed_energy": current.transformed_energy,
                              "digest_hamming": current.digest_hamming,
                              "E_observation": current.E_observation,
                              "E_local": current.E_local,
                              "E_global": current.E_global,
                              "C_missing": current.C_missing,
                              "state_edge_hamming": current.compatibility.state_edge_hamming,
                              "schedule_edge_hamming": current.compatibility.schedule_edge_hamming,
                              "observation_noise_effective": current.observation_noise_effective,
                              "frontier_pruned": frontier_pruned,
                              "candidate_header_hex": current.header.hex(),
                              "candidate_displayed_hash": current.displayed_hash,
                          }
                      )
          
                      if iteration == 1 or iteration % CHECKPOINT_EVERY == 0:
                          emit(
                              f"[iteration {iteration}] section={section_name} "
                              f"energy={current.total_energy:.3f} digest_hamming={current.digest_hamming} "
                              f"state_edges={current.compatibility.state_edge_hamming} "
                              f"schedule_edges={current.compatibility.schedule_edge_hamming} "
                              f"frontier={len(frontier)} pruned={frontier_pruned}"
                          )
                          write_csv(SEARCH_TRACE, trace_rows)
                          write_checkpoint(
                              iteration,
                              current,
                              len(frontier),
                              [model.header.hex() for model in exact_models],
                              section_name,
                              started,
                              frontier_pruned=frontier_pruned,
                          )
          
                      if (
                          STAGNATION_WINDOW
                          and iteration - last_improvement_iteration >= STAGNATION_WINDOW
                      ):
                          termination_reason = "stagnation_window_reached"
                          break
          
                  if best is None:
                      raise RuntimeError("solver did not produce an initial evaluation")
          
                  if exact_models:
                      recovered = exact_models[0]
                  else:
                      recovered = best
          
                  exact_hash_match = hashlib_displayed_hash(recovered.header) == block_hash
                  historical_match = recovered.header == sealed_truth_header
          
                  write_header_recovery(recovered, observation, sealed_truth_header, hidden)
                  write_csv(TESSERACT_SLOTS, tesseract_slot_rows())
                  write_csv(SEARCH_TRACE, trace_rows)
                  write_round_and_continuous_exports(recovered)
                  write_common_audits(
                      hidden,
                      exact_models,
                      recovered,
                      sealed_truth_header,
                      exact_hash_match,
                  )
                  write_checkpoint(
                      iteration,
                      recovered,
                      len(frontier),
                      [model.header.hex() for model in exact_models],
                      accepted_section,
                      started,
                      termination_reason=termination_reason,
                      frontier_pruned=frontier_pruned,
                  )
          
                  completed = bool(exact_models) and exact_hash_match
                  status.update(
                      {
                          "completed": completed,
                          "exact_hash_match": exact_hash_match,
                          "exact_original_header_match": historical_match,
                          "iterations": iteration,
                          "expanded_states": len(expanded_headers),
                          "frontier_size": len(frontier),
                          "accepted_projection_section": accepted_section,
                          "E_observation": recovered.E_observation,
                          "E_local": recovered.E_local,
                          "E_local_state_edges": recovered.compatibility.state_edge_hamming,
                          "E_local_schedule_edges": recovered.compatibility.schedule_edge_hamming,
                          "E_global": recovered.E_global,
                          "C_missing": recovered.C_missing,
                          "energy": recovered.total_energy,
                          "transformed_energy_f": recovered.transformed_energy,
                          "candidate_header_hex": recovered.header.hex(),
                          "candidate_display_hash": recovered.displayed_hash,
                          "recovered_header_hex": recovered.header.hex() if completed else None,
                          "recovered_display_hash": recovered.displayed_hash if completed else None,
                          "returned_exact_models": len(exact_models),
                          "termination_reason": termination_reason,
                          "frontier_pruned": frontier_pruned,
                          "frontier_pruned_states": frontier_pruned_states,
                          "reachability_guaranteed_after_pruning": (
                              status["reachability_guaranteed"] and not frontier_pruned
                          ),
                          "observation_noise_effective": recovered.observation_noise_effective,
                          "elapsed_seconds": time.time() - started,
                      }
                  )
                  if not completed:
                      status["error"] = (
                          "no independently validated exact SHA-256d preimage was found before "
                          f"termination: {termination_reason}"
                      )
          
                  STATUS.write_text(
                      json.dumps(status, indent=2, sort_keys=True), encoding="utf-8"
                  )
          
                  title = (
                      "BITCOIN SHA-256d 4D JOINT-INFERENCE RESULT"
                      if completed
                      else "BITCOIN SHA-256d 4D JOINT-INFERENCE — INCOMPLETE"
                  )
                  report_lines = [
                      title,
                      "=" * 72,
                      f"Model revision:                 {MODEL_REVISION}",
                      f"Block hash:                     {block_hash}",
                      f"Recovery scope:                 {RECOVERY_SCOPE}",
                      f"Hidden bits:                    {len(hidden)}",
                      f"Context mode:                   {CONTEXT_MODE}",
                      f"Convergence mode:               {CONVERGENCE_MODE}",
                      f"Reachability guaranteed:        {status['reachability_guaranteed']}",
                      f"Frontier pruned:                 {frontier_pruned}",
                      f"Observation noise effective:    {recovered.observation_noise_effective}",
                      f"Termination reason:             {termination_reason}",
                      f"Expanded states:                {len(expanded_headers)}",
                      f"Iterations:                     {iteration}",
                      f"Exact digest match:             {exact_hash_match}",
                      f"Exact historical header match: {historical_match}",
                      f"E_observation:                  {recovered.E_observation}",
                      f"E_local:                        {recovered.E_local}",
                      f"E_global:                       {recovered.E_global}",
                      f"C(m):                           {recovered.C_missing}",
                      f"Total MAP energy:               {recovered.total_energy}",
                      "External SAT/SMT solver used:    False",
                      "Artificial scramble used:        False",
                      "Physical Rubik moves used:       False",
                      "Nonce interval loop used:        False",
                      "",
                      "Best candidate raw header:",
                      recovered.header.hex(),
                      "",
                      "Historical raw header (post-solve comparison only):",
                      sealed_truth_header.hex(),
                  ]
                  if status.get("digest_only_underdetermined"):
                      report_lines.extend(
                          [
                              "",
                              "IDENTIFIABILITY WARNING",
                              "Hash-only evidence with more than 256 hidden bits does not identify",
                              "the historical 80-byte header. An exact digest preimage would not by",
                              "itself establish historical-header recovery.",
                          ]
                      )
                  if not completed:
                      report_lines.extend(
                          [
                              "",
                              "INCOMPLETE",
                              str(status["error"]),
                              "No recovered-header claim was emitted.",
                          ]
                      )
                  REPORT.write_text("\n".join(report_lines) + "\n", encoding="utf-8")
                  emit(REPORT.read_text(encoding="utf-8"))
          
              except Exception as exc:
                  status.update(
                      {
                          "completed": False,
                          "fake_completion": False,
                          "error": str(exc),
                          "traceback": traceback.format_exc(),
                          "termination_reason": termination_reason or "exception",
                          "iterations": iteration,
                          "expanded_states": len(expanded_headers),
                          "frontier_size": len(frontier),
                          "elapsed_seconds": time.time() - started,
                      }
                  )
                  STATUS.write_text(
                      json.dumps(status, indent=2, sort_keys=True), encoding="utf-8"
                  )
                  REPORT.write_text(
                      "BITCOIN SHA-256d 4D JOINT-INFERENCE — INCOMPLETE\n"
                      + "=" * 72
                      + "\n"
                      + traceback.format_exc(),
                      encoding="utf-8",
                  )
                  emit(REPORT.read_text(encoding="utf-8"))
              finally:
                  ensure_all_outputs_exist()
                  # Exit zero here so the artifact step always runs. The workflow's final status
                  # gate reads STATUS and fails the job after the evidence package is uploaded.
                  sys.exit(0)
          
          
          if __name__ == "__main__":
              main()
          PY

      - name: Publish authoritative status
        if: always()
        shell: bash
        run: |
          if [[ -f bitcoin_sha256d_4d_inverse_status.json ]]; then
            cat bitcoin_sha256d_4d_inverse_status.json
          else
            printf '%s\n' '{"completed":false,"error":"status file not produced"}' \
              | tee bitcoin_sha256d_4d_inverse_status.json
          fi

      - name: Upload the complete mathematical evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-sha256d-4d-joint-${{ github.run_number }}
          path: |
            bitcoin_sha256d_4d_inverse_status.json
            bitcoin_sha256d_4d_inverse_report.txt
            bitcoin_sha256d_mathematical_model.txt
            bitcoin_sha256d_header_recovery.csv
            bitcoin_sha256d_round_states.csv
            bitcoin_sha256d_tesseract_slots.csv
            bitcoin_sha256d_lattice_bits.csv
            bitcoin_sha256d_3d_projections.csv
            bitcoin_sha256d_4d_search_trace.csv
            bitcoin_sha256d_4d_frontier.csv
            bitcoin_sha256d_posterior_models.csv
            bitcoin_sha256d_tolerance_topology.csv
            bitcoin_sha256d_functional_identifiability.csv
            bitcoin_sha256d_measure_audit.csv
            bitcoin_sha256d_frequency_split.csv
            bitcoin_sha256d_gauge_diagnostics.csv
            bitcoin_sha256d_stability.csv
            bitcoin_sha256d_tesseract_state_space.json
            bitcoin_sha256d_4d_checkpoint.json
            bitcoin_sha256d_4d_inverse_console.log
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce authoritative completion status
        if: always()
        shell: bash
        env:
          FAIL_ON_INCOMPLETE: ${{ inputs.fail_on_incomplete }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path("bitcoin_sha256d_4d_inverse_status.json")
          if not path.exists():
              print("::error::Authoritative status file was not produced.")
              sys.exit(1)

          try:
              status = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error::Authoritative status is invalid JSON: {exc}")
              sys.exit(1)

          completed = status.get("completed") is True
          fail_on_incomplete = os.environ.get("FAIL_ON_INCOMPLETE", "true").lower() == "true"

          if completed:
              print("Exact SHA-256d completion was independently validated.")
              sys.exit(0)

          reason = status.get("termination_reason") or status.get("error") or "unknown"
          message = f"Reconstruction is incomplete: {reason}"
          if fail_on_incomplete:
              print(f"::error::{message}")
              sys.exit(1)

          print(f"::warning::{message}")
          PY
