              )
              write_csv(FUNCTIONALS, functional_rows)
          
              measure_rows = [
                  {
                      "component": "compact projection orientation",
                      "measure": "normalized finite C3 counting measure",
                      "operational": "product O_i=Identity enforced by sum O_i=0 mod 3",
                  },
                  {
                      "component": "translation gauge",
                      "measure": "proper prior required",
                      "operational": "removed by weighted centering in projection diagnostics",
                  },
                  {
                      "component": "positive scale",
                      "measure": "log-scale coordinate ds/s",
                      "operational": "removed by RMS normalization",
                  },
                  {
                      "component": "non-rigid deformation phi",
                      "measure": "finite low-frequency basis",
                      "operational": "FFT low-frequency projection component",
                  },
                  {
                      "component": "noise xi",
                      "measure": "high-frequency residual",
                      "operational": "FFT high-frequency projection component",
                  },
                  {
