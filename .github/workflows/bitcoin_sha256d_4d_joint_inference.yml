# Bitcoin SHA-256d 4D tesseract reconstruction using Jose's stated model.
#
# Challenge handling in this revision:
# - Convergence: optional connected single-hidden-bit fallback; reachability is only
#   claimed when every hidden bit is available and the frontier has not been pruned.
# - Observation noise: strict, finite, or automatically relaxed behavior is audited.
# - Computational cost: explicit runtime/state/frontier/stagnation budgets produce an
#   incomplete checkpoint and evidence package, never a recovered-header claim.
# - Failure semantics: artifacts upload first; a final gate then fails incomplete runs.

name: Bitcoin SHA-256d 4D Joint Inference

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string

      block_height:
        description: "Bitcoin block height; tip/current uses the current tip"
        required: false
        default: "953568"
        type: string

      block_hash:
        description: "Displayed block hash; auto derives it from block_height"
        required: false
        default: "auto"
        type: string

      raw_header_hex:
        description: "Exact 80-byte header, or fetch to retrieve it"
        required: false
        default: "fetch"
        type: string

      expected_block_hash:
        description: "Expected displayed hash, or derive"
        required: false
        default: "derive"
        type: string

      recovery_scope:
        description: "Header information hidden from reconstruction"
        required: true
        default: "full_header"
        type: choice
        options:
          - selected_fields
          - selected_bits
          - full_header

      hidden_fields:
        description: "Comma-separated: version,previous_hash,merkle_root,timestamp,bits,nonce"
        required: false
        default: "version,previous_hash,merkle_root,timestamp,bits,nonce"
        type: string

      hidden_bit_ranges:
        description: "Half-open serialized-header bit ranges, or none"
        required: false
        default: "none"
        type: string

      context_mode:
        description: "Evidence used by E_global"
        required: true
        default: "hash_only"
        type: choice
        options:
          - hash_only
          - derived_bitcoin
          - all_public

      infer_mask:
        description: "Infer m instead of fixing the configured visibility mask"
        required: false
        default: false
        type: boolean

      infer_permutation:
        description: "Infer the 16-piece projection permutation pi"
        required: false
        default: false
        type: boolean

      infer_orientation:
        description: "Infer the 16 C3 orientations O_i"
        required: false
        default: false
        type: boolean

      allow_observation_noise:
        description: "Use finite Gaussian energy for surviving observation disagreement"
        required: false
        default: false
        type: boolean

      auto_relax_observation_noise:
        description: "Automatically use finite energy if strict observation would make a candidate infinite"
        required: false
        default: true
        type: boolean

      posterior_models:
        description: "Exact completed models requested; 0 continues until another budget terminates"
        required: false
        default: "1"
        type: string

      convergence_mode:
        description: "Geometric sections only, or add deterministic hidden-bit fallback edges"
        required: true
        default: "hidden_bit_fallback"
        type: choice
        options:
          - geometric_only
          - hidden_bit_fallback

      bit_fallback_width:
        description: "Hidden single-bit flips per expansion; 0 means all hidden bits and a connected graph"
        required: false
        default: "64"
        type: string

      max_runtime_seconds:
        description: "Internal runtime budget; 0 means unlimited"
        required: false
        default: "1800"
        type: string

      max_expanded_states:
        description: "Expanded-state budget; 0 means unlimited"
        required: false
        default: "5000"
        type: string

      max_frontier_size:
        description: "Frontier cap; 0 means unlimited. Pruning is recorded and removes exhaustiveness"
        required: false
        default: "20000"
        type: string

      stagnation_window:
        description: "Stop after this many non-improving expansions; 0 disables"
        required: false
        default: "250"
        type: string

      checkpoint_every:
        description: "Write trace and checkpoint every N accepted states"
        required: false
        default: "10"
        type: string

      fail_on_incomplete:
        description: "Fail the workflow after artifacts upload when no exact model was validated"
        required: false
        default: true
        type: boolean

      sigma:
        description: "Observation-noise scale sigma"
        required: false
        default: "1.0"
        type: string

      lambda_local:
        description: "Weight lambda on exact forward/backward local compatibility"
        required: false
        default: "1.0"
        type: string

      beta_global:
        description: "Weight beta on Bitcoin global coherence"
        required: false
        default: "1.0"
        type: string

      gamma_missing:
        description: "Weight gamma on C(m)"
        required: false
        default: "1.0"
        type: string

      a0:
        description: "a0 in f(x)=a0*x/(1+x^n)^(1/n)"
        required: false
        default: "1.2e-14"
        type: string

      n:
        description: "n in f(x)=a0*x/(1+x^n)^(1/n)"
        required: false
        default: "2.0"
        type: string

      projection_noise_sigma:
        description: "Continuous xi used only in exported 3D projections"
        required: false
        default: "0.0"
        type: string

      emit_lattice_bits:
        description: "Export solved bits across the 4D round/lane lattice"
        required: false
        default: true
        type: boolean

      z3_random_seed:
        description: "Retained input name; deterministic tie-break seed only, no Z3 is used"
        required: false
        default: "0"
        type: string

      api_base:
        description: "Esplora-compatible Bitcoin API base"
        required: false
        default: "https://blockstream.info/api"
        type: string

permissions:
  contents: read

concurrency:
  group: bitcoin-sha256d-4d-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ${{ inputs.runner_label }}

    env:
      BLOCK_HEIGHT: ${{ inputs.block_height }}
      BLOCK_HASH: ${{ inputs.block_hash }}
      RAW_HEADER_HEX: ${{ inputs.raw_header_hex }}
      EXPECTED_BLOCK_HASH: ${{ inputs.expected_block_hash }}
      RECOVERY_SCOPE: ${{ inputs.recovery_scope }}
      HIDDEN_FIELDS: ${{ inputs.hidden_fields }}
      HIDDEN_BIT_RANGES: ${{ inputs.hidden_bit_ranges }}
      CONTEXT_MODE: ${{ inputs.context_mode }}
      INFER_MASK: ${{ inputs.infer_mask }}
      INFER_PERMUTATION: ${{ inputs.infer_permutation }}
      INFER_ORIENTATION: ${{ inputs.infer_orientation }}
      ALLOW_OBSERVATION_NOISE: ${{ inputs.allow_observation_noise }}
      AUTO_RELAX_OBSERVATION_NOISE: ${{ inputs.auto_relax_observation_noise }}
      POSTERIOR_MODELS: ${{ inputs.posterior_models }}
      CONVERGENCE_MODE: ${{ inputs.convergence_mode }}
      BIT_FALLBACK_WIDTH: ${{ inputs.bit_fallback_width }}
      MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds }}
      MAX_EXPANDED_STATES: ${{ inputs.max_expanded_states }}
      MAX_FRONTIER_SIZE: ${{ inputs.max_frontier_size }}
      STAGNATION_WINDOW: ${{ inputs.stagnation_window }}
      CHECKPOINT_EVERY: ${{ inputs.checkpoint_every }}
      SIGMA: ${{ inputs.sigma }}
      LAMBDA_LOCAL: ${{ inputs.lambda_local }}
      BETA_GLOBAL: ${{ inputs.beta_global }}
      GAMMA_MISSING: ${{ inputs.gamma_missing }}
      A0: ${{ inputs.a0 }}
      N_EXPONENT: ${{ inputs.n }}
      PROJECTION_NOISE_SIGMA: ${{ inputs.projection_noise_sigma }}
      EMIT_LATTICE_BITS: ${{ inputs.emit_lattice_bits }}
      DETERMINISTIC_SEED: ${{ inputs.z3_random_seed }}
      API_BASE: ${{ inputs.api_base }}
      MODEL_REVISION: "2026-07-15-user-model-direct-r2-hardened"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numerical projection dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=2,<3"

      - name: Run the direct 4D tesseract reconstruction
        id: solver
        shell: bash
        run: |
          set -o pipefail

          python - <<'PY' 2>&1 | tee bitcoin_sha256d_4d_inverse_console.log
          from __future__ import annotations
          
          import csv
          import hashlib
          import heapq
          import json
          import math
          import os
          import sys
          import time
          import traceback
          import urllib.request
          from dataclasses import dataclass
          from itertools import combinations, product
          from pathlib import Path
          from typing import Dict, Iterable, List, Optional, Sequence, Tuple
          
          import numpy as np
          
          MASK32 = 0xFFFFFFFF
          MASK40 = (1 << 40) - 1
          
          API_BASE = os.environ.get("API_BASE", "https://blockstream.info/api").rstrip("/")
          BLOCK_HEIGHT_RAW = os.environ.get("BLOCK_HEIGHT", "953568").strip()
          BLOCK_HASH_RAW = os.environ.get("BLOCK_HASH", "auto").strip()
          RAW_HEADER_RAW = os.environ.get("RAW_HEADER_HEX", "fetch").strip()
          EXPECTED_HASH_RAW = os.environ.get("EXPECTED_BLOCK_HASH", "derive").strip()
          RECOVERY_SCOPE = os.environ.get("RECOVERY_SCOPE", "full_header").strip()
          HIDDEN_FIELDS = [
              value.strip()
              for value in os.environ.get(
                  "HIDDEN_FIELDS",
                  "version,previous_hash,merkle_root,timestamp,bits,nonce",
              ).split(",")
              if value.strip()
          ]
          HIDDEN_BIT_RANGES_RAW = os.environ.get("HIDDEN_BIT_RANGES", "none").strip()
          CONTEXT_MODE = os.environ.get("CONTEXT_MODE", "hash_only").strip()
          INFER_MASK = os.environ.get("INFER_MASK", "false").lower() == "true"
          INFER_PERMUTATION = os.environ.get("INFER_PERMUTATION", "false").lower() == "true"
          INFER_ORIENTATION = os.environ.get("INFER_ORIENTATION", "false").lower() == "true"
          ALLOW_OBSERVATION_NOISE = (
              os.environ.get("ALLOW_OBSERVATION_NOISE", "false").lower() == "true"
          )
          AUTO_RELAX_OBSERVATION_NOISE = (
              os.environ.get("AUTO_RELAX_OBSERVATION_NOISE", "true").lower() == "true"
          )
          POSTERIOR_MODELS = int(os.environ.get("POSTERIOR_MODELS", "1"))
          SIGMA = float(os.environ.get("SIGMA", "1.0"))
          LAMBDA_LOCAL = float(os.environ.get("LAMBDA_LOCAL", "1.0"))
          BETA_GLOBAL = float(os.environ.get("BETA_GLOBAL", "1.0"))
          GAMMA_MISSING = float(os.environ.get("GAMMA_MISSING", "1.0"))
          A0 = float(os.environ.get("A0", "1.2e-14"))
          N_EXPONENT = float(os.environ.get("N_EXPONENT", "2.0"))
          PROJECTION_NOISE_SIGMA = float(os.environ.get("PROJECTION_NOISE_SIGMA", "0.0"))
          EMIT_LATTICE_BITS = os.environ.get("EMIT_LATTICE_BITS", "true").lower() == "true"
          DETERMINISTIC_SEED = int(os.environ.get("DETERMINISTIC_SEED", "0"))
          MODEL_REVISION = os.environ.get(
              "MODEL_REVISION", "2026-07-15-user-model-direct-r2-hardened"
          )
          
          # Challenge controls. Zero means unlimited/all where documented.
          CONVERGENCE_MODE = os.environ.get(
              "CONVERGENCE_MODE", "hidden_bit_fallback"
          ).strip()
          BIT_FALLBACK_WIDTH = int(os.environ.get("BIT_FALLBACK_WIDTH", "64"))
          MAX_RUNTIME_SECONDS = int(os.environ.get("MAX_RUNTIME_SECONDS", "1800"))
          MAX_EXPANDED_STATES = int(os.environ.get("MAX_EXPANDED_STATES", "5000"))
          MAX_FRONTIER_SIZE = int(os.environ.get("MAX_FRONTIER_SIZE", "20000"))
          STAGNATION_WINDOW = int(os.environ.get("STAGNATION_WINDOW", "250"))
          CHECKPOINT_EVERY = int(os.environ.get("CHECKPOINT_EVERY", "10"))
          
          if POSTERIOR_MODELS < 0:
              raise ValueError("POSTERIOR_MODELS must be zero or positive")
          if SIGMA <= 0:
              raise ValueError("SIGMA must be positive")
          if N_EXPONENT <= 0:
              raise ValueError("N_EXPONENT must be positive")
          if BIT_FALLBACK_WIDTH < 0:
              raise ValueError("BIT_FALLBACK_WIDTH must be zero or positive")
          if MAX_RUNTIME_SECONDS < 0 or MAX_EXPANDED_STATES < 0 or MAX_FRONTIER_SIZE < 0:
              raise ValueError("search budgets must be zero or positive")
          if STAGNATION_WINDOW < 0 or CHECKPOINT_EVERY <= 0:
              raise ValueError("STAGNATION_WINDOW must be non-negative and CHECKPOINT_EVERY positive")
          if CONVERGENCE_MODE not in {"geometric_only", "hidden_bit_fallback"}:
              raise ValueError("CONVERGENCE_MODE must be geometric_only or hidden_bit_fallback")
          
          REPORT = Path("bitcoin_sha256d_4d_inverse_report.txt")
          STATUS = Path("bitcoin_sha256d_4d_inverse_status.json")
          MODEL_SPEC = Path("bitcoin_sha256d_mathematical_model.txt")
          HEADER_RECOVERY = Path("bitcoin_sha256d_header_recovery.csv")
          ROUND_STATES = Path("bitcoin_sha256d_round_states.csv")
          TESSERACT_SLOTS = Path("bitcoin_sha256d_tesseract_slots.csv")
          LATTICE_BITS = Path("bitcoin_sha256d_lattice_bits.csv")
          PROJECTIONS = Path("bitcoin_sha256d_3d_projections.csv")
          SEARCH_TRACE = Path("bitcoin_sha256d_4d_search_trace.csv")
          FRONTIER = Path("bitcoin_sha256d_4d_frontier.csv")
          POSTERIOR = Path("bitcoin_sha256d_posterior_models.csv")
          TOLERANCE = Path("bitcoin_sha256d_tolerance_topology.csv")
          FUNCTIONALS = Path("bitcoin_sha256d_functional_identifiability.csv")
          MEASURE_AUDIT = Path("bitcoin_sha256d_measure_audit.csv")
          FREQUENCY_SPLIT = Path("bitcoin_sha256d_frequency_split.csv")
          GAUGE_DIAGNOSTICS = Path("bitcoin_sha256d_gauge_diagnostics.csv")
          STABILITY = Path("bitcoin_sha256d_stability.csv")
          STATE_SPACE = Path("bitcoin_sha256d_tesseract_state_space.json")
          CHECKPOINT = Path("bitcoin_sha256d_4d_checkpoint.json")
          
          OUTPUT_PATHS = [
              STATUS,
              REPORT,
              MODEL_SPEC,
              HEADER_RECOVERY,
              ROUND_STATES,
              TESSERACT_SLOTS,
              LATTICE_BITS,
              PROJECTIONS,
              SEARCH_TRACE,
              FRONTIER,
              POSTERIOR,
              TOLERANCE,
              FUNCTIONALS,
              MEASURE_AUDIT,
              FREQUENCY_SPLIT,
              GAUGE_DIAGNOSTICS,
              STABILITY,
              STATE_SPACE,
              CHECKPOINT,
          ]
          
          FIELD_RANGES_BYTES = {
              "version": (0, 4),
              "previous_hash": (4, 36),
              "merkle_root": (36, 68),
              "timestamp": (68, 72),
              "bits": (72, 76),
              "nonce": (76, 80),
          }
          
          H0 = [
              0x6A09E667,
              0xBB67AE85,
              0x3C6EF372,
              0xA54FF53A,
              0x510E527F,
              0x9B05688C,
              0x1F83D9AB,
              0x5BE0CD19,
          ]
          
          K = [
              0x428A2F98, 0x71374491, 0xB5C0FBCF, 0xE9B5DBA5,
              0x3956C25B, 0x59F111F1, 0x923F82A4, 0xAB1C5ED5,
              0xD807AA98, 0x12835B01, 0x243185BE, 0x550C7DC3,
              0x72BE5D74, 0x80DEB1FE, 0x9BDC06A7, 0xC19BF174,
              0xE49B69C1, 0xEFBE4786, 0x0FC19DC6, 0x240CA1CC,
              0x2DE92C6F, 0x4A7484AA, 0x5CB0A9DC, 0x76F988DA,
              0x983E5152, 0xA831C66D, 0xB00327C8, 0xBF597FC7,
              0xC6E00BF3, 0xD5A79147, 0x06CA6351, 0x14292967,
              0x27B70A85, 0x2E1B2138, 0x4D2C6DFC, 0x53380D13,
              0x650A7354, 0x766A0ABB, 0x81C2C92E, 0x92722C85,
              0xA2BFE8A1, 0xA81A664B, 0xC24B8B70, 0xC76C51A3,
              0xD192E819, 0xD6990624, 0xF40E3585, 0x106AA070,
              0x19A4C116, 0x1E376C08, 0x2748774C, 0x34B0BCB5,
              0x391C0CB3, 0x4ED8AA4A, 0x5B9CCA4F, 0x682E6FF3,
              0x748F82EE, 0x78A5636F, 0x84C87814, 0x8CC70208,
              0x90BEFFFA, 0xA4506CEB, 0xBEF9A3F7, 0xC67178F2,
          ]
          
          INTERIOR_COORDS = sorted(product((1, 2), repeat=4))
          
          
          def emit(text: str = "") -> None:
              print(text, flush=True)
          
          
          def auto_blank(value: str, sentinels: set[str]) -> str:
              cleaned = value.strip()
              return "" if cleaned.lower() in sentinels else cleaned
          
          
          BLOCK_HEIGHT = auto_blank(BLOCK_HEIGHT_RAW, {"", "tip", "current", "current_tip"})
          BLOCK_HASH = auto_blank(BLOCK_HASH_RAW, {"", "auto", "derive", "from_height"})
          RAW_HEADER_HEX = auto_blank(RAW_HEADER_RAW, {"", "fetch", "auto", "from_api"}).lower()
          EXPECTED_BLOCK_HASH = auto_blank(
              EXPECTED_HASH_RAW, {"", "derive", "auto", "from_block"}
          ).lower()
          HIDDEN_BIT_RANGES = auto_blank(
              HIDDEN_BIT_RANGES_RAW, {"", "none", "auto", "use_hidden_fields"}
          )
          
          
          def http_text(path: str) -> str:
              request = urllib.request.Request(
                  f"{API_BASE}/{path.lstrip('/')}",
                  headers={"User-Agent": "bitcoin-sha256d-4d-direct-model/2.0"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8").strip()
          
          
          def http_json(path: str) -> dict:
              return json.loads(http_text(path))
          
          
          def rotr(x: int, n: int) -> int:
              return ((x >> n) | (x << (32 - n))) & MASK32
          
          
          def small_sigma0(x: int) -> int:
              return rotr(x, 7) ^ rotr(x, 18) ^ (x >> 3)
          
          
          def small_sigma1(x: int) -> int:
              return rotr(x, 17) ^ rotr(x, 19) ^ (x >> 10)
          
          
          def big_sigma0(x: int) -> int:
              return rotr(x, 2) ^ rotr(x, 13) ^ rotr(x, 22)
          
          
          def big_sigma1(x: int) -> int:
              return rotr(x, 6) ^ rotr(x, 11) ^ rotr(x, 25)
          
          
          def choose(x: int, y: int, z: int) -> int:
              return (x & y) ^ ((~x) & z)
          
          
          def majority(x: int, y: int, z: int) -> int:
              return (x & y) ^ (x & z) ^ (y & z)
          
          
          def words_from_bytes(data: bytes) -> List[int]:
              if len(data) % 4:
                  raise ValueError("word conversion requires a multiple of four bytes")
              return [int.from_bytes(data[i : i + 4], "big") for i in range(0, len(data), 4)]
          
          
          def words_to_bytes(words: Sequence[int]) -> bytes:
              return b"".join((word & MASK32).to_bytes(4, "big") for word in words)
          
          
          def expand_schedule(block64: bytes) -> List[int]:
              if len(block64) != 64:
                  raise ValueError("SHA-256 compression block must be 64 bytes")
              schedule = words_from_bytes(block64)
              for t in range(16, 64):
                  schedule.append(
                      (
                          small_sigma1(schedule[t - 2])
                          + schedule[t - 7]
                          + small_sigma0(schedule[t - 15])
                          + schedule[t - 16]
                      )
                      & MASK32
                  )
              return schedule
          
          
          @dataclass(frozen=True)
          class RoundState:
              phase: int
              round_index: int
              w: int
              state_in: Tuple[int, ...]
              t1: int
              t2: int
              state_out: Tuple[int, ...]
          
          
          @dataclass(frozen=True)
          class CompressionTrace:
              phase: int
              initial: Tuple[int, ...]
              schedule: Tuple[int, ...]
              rounds: Tuple[RoundState, ...]
              output: Tuple[int, ...]
          
          
          @dataclass(frozen=True)
          class BackwardCompatibility:
              required_words: Tuple[Tuple[int, ...], Tuple[int, ...], Tuple[int, ...]]
              backward_states: Tuple[Tuple[Tuple[int, ...], ...], ...]
              state_edge_hamming: int
              schedule_edge_hamming: int
              pullback_header: bytes
          
          
          @dataclass(frozen=True)
          class ProjectionState:
              mask: Tuple[int, ...]
              permutation: Tuple[int, ...]
              orientations: Tuple[int, ...]
              p0: int
              p1: int
              p2: int
              p3: int
              observation_hamming: int
              hard_constraints_ok: bool
          
          
          @dataclass(frozen=True)
          class Evaluation:
              header: bytes
              digest_raw: bytes
              displayed_hash: str
              traces: Tuple[CompressionTrace, CompressionTrace, CompressionTrace]
              compatibility: BackwardCompatibility
              projection: ProjectionState
              digest_hamming: int
              E_observation: float
              E_local: float
              E_global: float
              C_missing: int
              total_energy: float
              transformed_energy: float
              exact_hash_match: bool
              observation_noise_effective: bool
          
          
          def compress(initial: Sequence[int], block64: bytes, phase: int) -> CompressionTrace:
              schedule = expand_schedule(block64)
              a, b, c, d, e, f, g, h = [value & MASK32 for value in initial]
              rounds: List[RoundState] = []
              for t in range(64):
                  state_in = (a, b, c, d, e, f, g, h)
                  t1 = (h + big_sigma1(e) + choose(e, f, g) + K[t] + schedule[t]) & MASK32
                  t2 = (big_sigma0(a) + majority(a, b, c)) & MASK32
                  state_out = (
                      (t1 + t2) & MASK32,
                      a,
                      b,
                      c,
                      (d + t1) & MASK32,
                      e,
                      f,
                      g,
                  )
                  rounds.append(RoundState(phase, t, schedule[t], state_in, t1, t2, state_out))
                  a, b, c, d, e, f, g, h = state_out
              output = tuple(
                  (initial[index] + value) & MASK32
                  for index, value in enumerate((a, b, c, d, e, f, g, h))
              )
              return CompressionTrace(phase, tuple(initial), tuple(schedule), tuple(rounds), output)
          
          
          def sha256d_trace(
              header: bytes,
          ) -> Tuple[bytes, Tuple[CompressionTrace, CompressionTrace, CompressionTrace]]:
              if len(header) != 80:
                  raise ValueError("Bitcoin header must be exactly 80 bytes")
              block0 = header[:64]
              block1 = header[64:] + b"\x80" + b"\x00" * 39 + (640).to_bytes(8, "big")
              trace0 = compress(H0, block0, 0)
              trace1 = compress(trace0.output, block1, 1)
              inner = words_to_bytes(trace1.output)
              block2 = inner + b"\x80" + b"\x00" * 23 + (256).to_bytes(8, "big")
              trace2 = compress(H0, block2, 2)
              return words_to_bytes(trace2.output), (trace0, trace1, trace2)
          
          
          def displayed_hash_from_raw(raw_digest: bytes) -> str:
              return raw_digest[::-1].hex()
          
          
          def hashlib_displayed_hash(header: bytes) -> str:
              return hashlib.sha256(hashlib.sha256(header).digest()).digest()[::-1].hex()
          
          
          def hamming_word(left: int, right: int) -> int:
              return ((left ^ right) & MASK32).bit_count()
          
          
          def hamming_bytes(left: bytes, right: bytes) -> int:
              if len(left) != len(right):
                  raise ValueError("hamming_bytes requires equal-length byte strings")
              return sum((a ^ b).bit_count() for a, b in zip(left, right))
          
          
          def hamming_state(left: Sequence[int], right: Sequence[int]) -> int:
              return sum(hamming_word(a, b) for a, b in zip(left, right))
          
          
          def inverse_round(state_out: Sequence[int], w: int, round_index: int) -> Tuple[int, ...]:
              ap, bp, cp, dp, ep, fp, gp, hp = [value & MASK32 for value in state_out]
              a, b, c = bp, cp, dp
              e, f, g = fp, gp, hp
              t2 = (big_sigma0(a) + majority(a, b, c)) & MASK32
              t1 = (ap - t2) & MASK32
              d = (ep - t1) & MASK32
              h = (t1 - big_sigma1(e) - choose(e, f, g) - K[round_index] - w) & MASK32
              return a, b, c, d, e, f, g, h
          
          
          def backward_states(
              trace: CompressionTrace, desired_output_words: Sequence[int]
          ) -> Tuple[Tuple[int, ...], ...]:
              working_end = tuple(
                  (desired_output_words[index] - trace.initial[index]) & MASK32 for index in range(8)
              )
              states: List[Optional[Tuple[int, ...]]] = [None] * 65
              states[64] = working_end
              for t in reversed(range(64)):
                  states[t] = inverse_round(states[t + 1], trace.schedule[t], t)  # type: ignore[arg-type]
              return tuple(tuple(state) for state in states if state is not None)
          
          
          def required_schedule_word(
              forward_state_in: Sequence[int], desired_state_out: Sequence[int], round_index: int
          ) -> int:
              a, b, c, _d, e, f, g, h = [value & MASK32 for value in forward_state_in]
              desired_a_out = desired_state_out[0] & MASK32
              t2 = (big_sigma0(a) + majority(a, b, c)) & MASK32
              required_t1 = (desired_a_out - t2) & MASK32
              return (
                  required_t1 - h - big_sigma1(e) - choose(e, f, g) - K[round_index]
              ) & MASK32
          
          
          def derive_backward_compatibility(
              traces: Tuple[CompressionTrace, CompressionTrace, CompressionTrace], target_raw: bytes
          ) -> BackwardCompatibility:
              trace0, trace1, trace2 = traces
              target_words = words_from_bytes(target_raw)
              backward2 = backward_states(trace2, target_words)
              required2 = tuple(
                  required_schedule_word(trace2.rounds[t].state_in, backward2[t + 1], t)
                  for t in range(64)
              )
              desired_inner_digest = required2[:8]
              backward1 = backward_states(trace1, desired_inner_digest)
              required1 = tuple(
                  required_schedule_word(trace1.rounds[t].state_in, backward1[t + 1], t)
                  for t in range(64)
              )
              desired_phase0_output = backward1[0]
              backward0 = backward_states(trace0, desired_phase0_output)
              required0 = tuple(
                  required_schedule_word(trace0.rounds[t].state_in, backward0[t + 1], t)
                  for t in range(64)
              )
              backward_all = (backward0, backward1, backward2)
              required_all = (required0, required1, required2)
              state_edge_hamming = 0
              schedule_edge_hamming = 0
              for trace, backward, required in zip(traces, backward_all, required_all):
                  forward_boundaries = [trace.rounds[0].state_in] + [row.state_out for row in trace.rounds]
                  state_edge_hamming += sum(
                      hamming_state(forward_state, backward_state)
                      for forward_state, backward_state in zip(forward_boundaries, backward)
                  )
                  schedule_edge_hamming += sum(
                      hamming_word(actual, wanted) for actual, wanted in zip(trace.schedule, required)
                  )
              pullback_header = words_to_bytes(required0[:16]) + words_to_bytes(required1[:4])
              return BackwardCompatibility(
                  required_all,
                  backward_all,
                  state_edge_hamming,
                  schedule_edge_hamming,
                  pullback_header,
              )
          
          
          def parse_hidden_bits() -> set[int]:
              if RECOVERY_SCOPE == "full_header":
                  return set(range(640))
              hidden: set[int] = set()
              if RECOVERY_SCOPE == "selected_fields":
                  for field in HIDDEN_FIELDS:
                      if field not in FIELD_RANGES_BYTES:
                          raise ValueError(f"unknown hidden field: {field}")
                      start, end = FIELD_RANGES_BYTES[field]
                      hidden.update(range(start * 8, end * 8))
              if RECOVERY_SCOPE == "selected_bits" or HIDDEN_BIT_RANGES:
                  if not HIDDEN_BIT_RANGES and RECOVERY_SCOPE == "selected_bits":
                      raise ValueError("selected_bits requires HIDDEN_BIT_RANGES")
                  for token in HIDDEN_BIT_RANGES.split(","):
                      token = token.strip()
                      if not token:
                          continue
                      if ":" in token:
                          left, right = token.split(":", 1)
                          start, end = int(left), int(right)
                          if not 0 <= start <= end <= 640:
                              raise ValueError(f"invalid hidden range: {token}")
                          hidden.update(range(start, end))
                      else:
                          bit = int(token)
                          if not 0 <= bit < 640:
                              raise ValueError(f"invalid hidden bit: {token}")
                          hidden.add(bit)
              return hidden
          
          
          def get_bit(data: bytes, bit: int) -> int:
              byte_index, offset = divmod(bit, 8)
              return (data[byte_index] >> (7 - offset)) & 1
          
          
          def put_bit(data: bytearray, bit: int, value: int) -> None:
              byte_index, offset = divmod(bit, 8)
              mask = 1 << (7 - offset)
              if value:
                  data[byte_index] |= mask
              else:
                  data[byte_index] &= ~mask
          
          
          def clamp_known_bits(candidate: bytes, observation: bytes, hidden: set[int]) -> bytes:
              result = bytearray(candidate)
              for bit in range(640):
                  if bit not in hidden:
                      put_bit(result, bit, get_bit(observation, bit))
              return bytes(result)
          
          
          def chunks40(header: bytes) -> List[int]:
              return [int.from_bytes(header[index * 5 : (index + 1) * 5], "big") for index in range(16)]
          
          
          def header_from_chunks40(chunks: Sequence[int]) -> bytes:
              return b"".join((value & MASK40).to_bytes(5, "big") for value in chunks)
          
          
          def rotate40(value: int, orientation: int) -> int:
              shift = (0, 13, 27)[orientation % 3]
              if shift == 0:
                  return value & MASK40
              return ((value << shift) | (value >> (40 - shift))) & MASK40
          
          
          def permutation_parity(permutation: Sequence[int]) -> int:
              parity = 0
              for i in range(len(permutation)):
                  for j in range(i + 1, len(permutation)):
                      parity ^= int(permutation[i] > permutation[j])
              return parity
          
          
          def project_header(
              header: bytes, permutation: Sequence[int], orientations: Sequence[int]
          ) -> bytes:
              canonical = chunks40(header)
              projected = [
                  rotate40(canonical[permutation[slot]], orientations[slot]) for slot in range(16)
              ]
              return header_from_chunks40(projected)
          
          
          def projection_piece_cost(
              canonical_chunks: Sequence[int],
              observed_chunks: Sequence[int],
              mask: Sequence[int],
              slot: int,
              source: int,
              orientation: int,
          ) -> int:
              value = rotate40(canonical_chunks[source], orientation)
              cost = 0
              for local in range(40):
                  bit = slot * 40 + local
                  if mask[bit]:
                      actual = (value >> (39 - local)) & 1
                      expected = (observed_chunks[slot] >> (39 - local)) & 1
                      cost += int(actual != expected)
              return cost
          
          
          def solve_projection_variables(
              header: bytes, observation: bytes, initial_mask: Sequence[int]
          ) -> ProjectionState:
              canonical_chunks = chunks40(header)
              observed_chunks = chunks40(observation)
              if not INFER_PERMUTATION and not INFER_ORIENTATION:
                  permutation = tuple(range(16))
                  orientations = (0,) * 16
              else:
                  states: Dict[
                      Tuple[int, int], Tuple[int, Tuple[Tuple[int, int], ...]]
                  ] = {(0, 0): (0, tuple())}
                  for slot in range(16):
                      next_states: Dict[
                          Tuple[int, int], Tuple[int, Tuple[Tuple[int, int], ...]]
                      ] = {}
                      for (used, residue), (cost_so_far, assignment) in states.items():
                          sources = range(16) if INFER_PERMUTATION else (slot,)
                          for source in sources:
                              if (used >> source) & 1:
                                  continue
                              choices = range(3) if INFER_ORIENTATION else (0,)
                              for orientation in choices:
                                  new_key = (used | (1 << source), (residue + orientation) % 3)
                                  new_cost = cost_so_far + projection_piece_cost(
                                      canonical_chunks,
                                      observed_chunks,
                                      initial_mask,
                                      slot,
                                      source,
                                      orientation,
                                  )
                                  candidate_assignment = assignment + ((source, orientation),)
                                  previous = next_states.get(new_key)
                                  if (
                                      previous is None
                                      or new_cost < previous[0]
                                      or (
                                          new_cost == previous[0]
                                          and candidate_assignment < previous[1]
                                      )
                                  ):
                                      next_states[new_key] = (new_cost, candidate_assignment)
                      states = next_states
                  final = states.get(((1 << 16) - 1, 0))
                  if final is None:
                      raise RuntimeError("no pi/O assignment satisfies product O_i = Identity")
                  assignment = final[1]
                  permutation = tuple(source for source, _ in assignment)
                  orientations = tuple(orientation for _, orientation in assignment)
              projected = project_header(header, permutation, orientations)
              if INFER_MASK:
                  mismatch_cost = 1.0 / (2.0 * SIGMA * SIGMA)
                  mask = tuple(
                      0
                      if (
                          get_bit(projected, bit) != get_bit(observation, bit)
                          and GAMMA_MISSING < mismatch_cost
                      )
                      else 1
                      for bit in range(640)
                  )
              else:
                  mask = tuple(initial_mask)
              observation_hamming = sum(
                  int(mask[bit])
                  * int(get_bit(projected, bit) != get_bit(observation, bit))
                  for bit in range(640)
              )
              p0 = permutation_parity(permutation)
              p1, p2, p3 = p0, 0, 0
              hard_constraints_ok = (
                  (p0 ^ p1 ^ p2 ^ p3) == 0
                  and (p0 ^ p1) == 0
                  and sum(orientations) % 3 == 0
              )
              return ProjectionState(
                  mask,
                  permutation,
                  orientations,
                  p0,
                  p1,
                  p2,
                  p3,
                  observation_hamming,
                  hard_constraints_ok,
              )
          
          
          def bitcoin_global_energy(header: bytes, metadata: dict) -> float:
              if CONTEXT_MODE == "hash_only" or not metadata:
                  return 0.0
              energy = 0
              previous_display = str(metadata.get("previousblockhash", ""))
              merkle_display = str(metadata.get("merkle_root", ""))
              bits_value = int(metadata.get("bits", 0) or 0)
              timestamp_value = int(metadata.get("timestamp", 0) or 0)
              if previous_display:
                  energy += hamming_bytes(header[4:36], bytes.fromhex(previous_display)[::-1])
              if merkle_display:
                  energy += hamming_bytes(header[36:68], bytes.fromhex(merkle_display)[::-1])
              if bits_value:
                  energy += hamming_bytes(header[72:76], bits_value.to_bytes(4, "little"))
              if timestamp_value:
                  timestamp = int.from_bytes(header[68:72], "little")
                  if CONTEXT_MODE == "all_public":
                      energy += (timestamp ^ timestamp_value).bit_count()
                  else:
                      distance = abs(timestamp - timestamp_value)
                      if distance > 7200:
                          energy += min(32, 1 + int(math.log2(distance - 7199)))
              return float(energy)
          
          
          def f_transform(x: float) -> float:
              if x < 0:
                  return float("nan")
              return A0 * x / ((1.0 + x**N_EXPONENT) ** (1.0 / N_EXPONENT))
          
          
          def evaluate(
              header: bytes,
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              initial_mask: Sequence[int],
              metadata: dict,
          ) -> Evaluation:
              digest_raw, traces = sha256d_trace(header)
              compatibility = derive_backward_compatibility(traces, target_raw)
              projection = solve_projection_variables(header, observation, initial_mask)
              if not projection.hard_constraints_ok:
                  raise RuntimeError("the supplied parity/orientation constraints were violated")
              digest_hamming = hamming_bytes(digest_raw, target_raw)
              E_observation = projection.observation_hamming / (2.0 * SIGMA * SIGMA)
              observation_noise_effective = ALLOW_OBSERVATION_NOISE
              if projection.observation_hamming and not ALLOW_OBSERVATION_NOISE:
                  if AUTO_RELAX_OBSERVATION_NOISE:
                      observation_noise_effective = True
                  else:
                      E_observation = float("inf")
              E_local = float(
                  compatibility.state_edge_hamming
                  + compatibility.schedule_edge_hamming
                  + digest_hamming
              )
              E_global = bitcoin_global_energy(header, metadata)
              C_missing = sum(1 - value for value in projection.mask)
              total_energy = (
                  E_observation
                  + LAMBDA_LOCAL * E_local
                  + BETA_GLOBAL * E_global
                  + GAMMA_MISSING * C_missing
              )
              transformed_energy = (
                  f_transform(total_energy / 640.0)
                  if math.isfinite(total_energy)
                  else float("nan")
              )
              displayed_hash = displayed_hash_from_raw(digest_raw)
              return Evaluation(
                  header,
                  digest_raw,
                  displayed_hash,
                  traces,
                  compatibility,
                  projection,
                  digest_hamming,
                  E_observation,
                  E_local,
                  E_global,
                  C_missing,
                  total_energy,
                  transformed_energy,
                  displayed_hash == target_display,
                  observation_noise_effective,
              )
          
          
          def residual_chunks(current: bytes, pullback: bytes) -> List[int]:
              return [
                  current_chunk ^ pullback_chunk
                  for current_chunk, pullback_chunk in zip(chunks40(current), chunks40(pullback))
              ]
          
          
          def apply_chunk_residual_section(
              current: bytes,
              residual: Sequence[int],
              selected_chunks: Iterable[int],
              observation: bytes,
              hidden: set[int],
          ) -> bytes:
              chunks = chunks40(current)
              for chunk_index in selected_chunks:
                  chunks[chunk_index] ^= residual[chunk_index]
              return clamp_known_bits(header_from_chunks40(chunks), observation, hidden)
          
          
          def tesseract_projection_updates(
              evaluation: Evaluation, observation: bytes, hidden: set[int]
          ) -> List[Tuple[str, bytes]]:
              """Generate exact pullback sections plus an optional connected bit graph."""
              pullback = clamp_known_bits(
                  evaluation.compatibility.pullback_header, observation, hidden
              )
              residual = residual_chunks(evaluation.header, pullback)
              proposals: Dict[bytes, str] = {}
          
              def add(name: str, selected_chunks: Iterable[int]) -> None:
                  selected = tuple(sorted(set(selected_chunks)))
                  if not selected:
                      return
                  candidate = apply_chunk_residual_section(
                      evaluation.header, residual, selected, observation, hidden
                  )
                  if candidate != evaluation.header:
                      proposals.setdefault(candidate, name)
          
              add("all_16_interior_cells", range(16))
              for chunk_index, coord in enumerate(INTERIOR_COORDS):
                  if residual[chunk_index]:
                      add(f"interior_cell_{coord}", [chunk_index])
              for axis in range(4):
                  for coordinate_value in (1, 2):
                      add(
                          f"axis_{axis}_slice_{coordinate_value}",
                          [
                              index
                              for index, coord in enumerate(INTERIOR_COORDS)
                              if coord[axis] == coordinate_value
                          ],
                      )
              for axis_a, axis_b in combinations(range(4), 2):
                  for value_a in (1, 2):
                      for value_b in (1, 2):
                          add(
                              f"face_axes_{axis_a}_{axis_b}_values_{value_a}_{value_b}",
                              [
                                  index
                                  for index, coord in enumerate(INTERIOR_COORDS)
                                  if coord[axis_a] == value_a and coord[axis_b] == value_b
                              ],
                          )
              for left in range(16):
                  for right in range(left + 1, 16):
                      if sum(a != b for a, b in zip(INTERIOR_COORDS[left], INTERIOR_COORDS[right])) == 1:
                          add(f"adjacency_edge_{left}_{right}", [left, right])
          
              # Residual-directed individual bit updates.
              disagreeing_bits = [
                  bit
                  for bit in sorted(hidden)
                  if get_bit(evaluation.header, bit) != get_bit(pullback, bit)
              ]
              for bit in disagreeing_bits:
                  candidate = bytearray(evaluation.header)
                  put_bit(candidate, bit, get_bit(pullback, bit))
                  candidate_bytes = clamp_known_bits(bytes(candidate), observation, hidden)
                  if candidate_bytes != evaluation.header:
                      proposals.setdefault(candidate_bytes, f"local_edge_bit_{bit}")
          
              # The geometric neighbourhood alone is not guaranteed to connect the hidden-bit
              # state space. In hidden_bit_fallback mode, single-bit flips provide a connected
              # graph when BIT_FALLBACK_WIDTH=0. A positive width is an explicitly budgeted,
              # residual-prioritized approximation and is reported as such.
              if CONVERGENCE_MODE == "hidden_bit_fallback":
                  ordered_bits = disagreeing_bits + [
                      bit for bit in sorted(hidden) if bit not in set(disagreeing_bits)
                  ]
                  selected_bits = ordered_bits if BIT_FALLBACK_WIDTH == 0 else ordered_bits[:BIT_FALLBACK_WIDTH]
                  for bit in selected_bits:
                      candidate = bytearray(evaluation.header)
                      put_bit(candidate, bit, 1 - get_bit(candidate, bit))
                      candidate_bytes = clamp_known_bits(bytes(candidate), observation, hidden)
                      if candidate_bytes != evaluation.header:
                          proposals.setdefault(candidate_bytes, f"connected_bit_flip_{bit}")
          
              return [(name, candidate) for candidate, name in proposals.items()]
          
          
          def canonical_initial_header(
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              hidden: set[int],
              initial_mask: Sequence[int],
              metadata: dict,
          ) -> bytes:
              zero_section = clamp_known_bits(bytes(80), observation, hidden)
              zero_eval = evaluate(
                  zero_section, target_raw, target_display, observation, initial_mask, metadata
              )
              return clamp_known_bits(zero_eval.compatibility.pullback_header, observation, hidden)
          
          
          def requested_model_count_reached(count: int) -> bool:
              return POSTERIOR_MODELS > 0 and count >= POSTERIOR_MODELS
          
          
          def priority_key(evaluation: Evaluation, serial: int) -> Tuple[float, int, int, int, int]:
              return (
                  evaluation.total_energy,
                  evaluation.digest_hamming,
                  evaluation.compatibility.state_edge_hamming,
                  evaluation.compatibility.schedule_edge_hamming,
                  serial,
              )
          
          
          def write_csv(path: Path, rows: Sequence[dict], fieldnames: Optional[Sequence[str]] = None) -> None:
              if not rows and not fieldnames:
                  path.write_text("", encoding="utf-8")
                  return
              names = list(fieldnames or rows[0].keys())
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=names)
                  writer.writeheader()
                  writer.writerows(rows)
          
          
          def tesseract_slot_rows() -> List[dict]:
              all_coords = list(product(range(4), repeat=4))
              interior_set = set(INTERIOR_COORDS)
              surface = sorted(coord for coord in all_coords if coord not in interior_set)
              rows: List[dict] = []
              for index, coord in enumerate(INTERIOR_COORDS):
                  rows.append(
                      {
                          "a": coord[0],
                          "b": coord[1],
                          "c": coord[2],
                          "d": coord[3],
                          "region": "interior_header",
                          "slot_index": index,
                          "semantic": f"header_chunk_{index:02d}_bits_{40 * index}:{40 * (index + 1)}",
                      }
                  )
              for index, coord in enumerate(surface):
                  if index < 192:
                      phase, round_index = divmod(index, 64)
                      region, semantic = "surface_sha_round", f"phase_{phase}_round_{round_index}"
                  elif index < 208:
                      region, semantic = "surface_observation", f"mask_pi_orientation_{index - 192}"
                  elif index < 216:
                      region, semantic = "surface_digest", f"digest_word_{index - 208}"
                  elif index < 224:
                      region, semantic = "surface_bitcoin_prior", f"bitcoin_prior_{index - 216}"
                  else:
                      region, semantic = (
                          "surface_posterior_gauge_projection",
                          f"posterior_gauge_projection_{index - 224}",
                      )
                  rows.append(
                      {
                          "a": coord[0],
                          "b": coord[1],
                          "c": coord[2],
                          "d": coord[3],
                          "region": region,
                          "slot_index": index,
                          "semantic": semantic,
                      }
                  )
              return rows
          
          
          def log_state_space() -> Tuple[float, float]:
              log2_value = (
                  math.lgamma(17) / math.log(2)
                  + 2 * math.lgamma(65) / math.log(2)
                  + math.lgamma(97) / math.log(2)
                  + 45
                  + 15 * math.log2(3)
                  - math.log2(1536)
                  - 8 * math.lgamma(9) / math.log(2)
              )
              return log2_value, log2_value * math.log10(2)
          
          
          def connected_components(points: np.ndarray, radius: float) -> int:
              count = len(points)
              if count == 0:
                  return 0
              parent = list(range(count))
          
              def find(index: int) -> int:
                  while parent[index] != index:
                      parent[index] = parent[parent[index]]
                      index = parent[index]
                  return index
          
              def union(left: int, right: int) -> None:
                  root_left, root_right = find(left), find(right)
                  if root_left != root_right:
                      parent[root_right] = root_left
          
              for left in range(count):
                  for right in range(left + 1, count):
                      if np.linalg.norm(points[left] - points[right]) <= radius:
                          union(left, right)
              return len({find(index) for index in range(count)})
          
          
          def quotient_distance(points_a: np.ndarray, points_b: np.ndarray) -> float:
              if points_a.shape != points_b.shape or points_a.size == 0:
                  return float("nan")
              a = points_a - points_a.mean(axis=0, keepdims=True)
              b = points_b - points_b.mean(axis=0, keepdims=True)
              norm_a, norm_b = np.linalg.norm(a), np.linalg.norm(b)
              if norm_a == 0 or norm_b == 0:
                  return float("nan")
              a /= norm_a
              b /= norm_b
              u, _, vt = np.linalg.svd(b.T @ a)
              rotation = u @ vt
              if np.linalg.det(rotation) < 0:
                  u[:, -1] *= -1
                  rotation = u @ vt
              aligned = b @ rotation
              return float(np.sqrt(np.mean(np.sum((a - aligned) ** 2, axis=1))))
          
          
          def write_round_and_continuous_exports(evaluation: Evaluation) -> None:
              round_rows: List[dict] = []
              lattice_rows: List[dict] = []
              feature = np.zeros((4, 4, 4, 4), dtype=float)
              lane_pairs = ((0, 4), (1, 5), (2, 6), (3, 7))
              for trace, required, backward in zip(
                  evaluation.traces,
                  evaluation.compatibility.required_words,
                  evaluation.compatibility.backward_states,
              ):
                  for row in trace.rounds:
                      state_residual = hamming_state(row.state_in, backward[row.round_index])
                      round_rows.append(
                          {
                              "phase": trace.phase,
                              "round": row.round_index,
                              "w_actual": f"{row.w:08x}",
                              "w_required": f"{required[row.round_index]:08x}",
                              "schedule_edge_hamming": hamming_word(
                                  row.w, required[row.round_index]
                              ),
                              "state_edge_hamming": state_residual,
                              "a_in": f"{row.state_in[0]:08x}",
                              "b_in": f"{row.state_in[1]:08x}",
                              "c_in": f"{row.state_in[2]:08x}",
                              "d_in": f"{row.state_in[3]:08x}",
                              "e_in": f"{row.state_in[4]:08x}",
                              "f_in": f"{row.state_in[5]:08x}",
                              "g_in": f"{row.state_in[6]:08x}",
                              "h_in": f"{row.state_in[7]:08x}",
                          }
                      )
                      r = row.round_index
                      a_coord, remainder = divmod(r, 16)
                      b_coord, c_coord = divmod(remainder, 4)
                      for d_coord, pair in enumerate(lane_pairs):
                          values = (row.state_in[pair[0]], row.state_in[pair[1]])
                          value = sum(word.bit_count() for word in values) / 64.0
                          feature[a_coord, b_coord, c_coord, d_coord] += value / 3.0
                          if EMIT_LATTICE_BITS:
                              for lane_index in pair:
                                  lane_value = row.state_in[lane_index]
                                  for bit in range(32):
                                      lattice_rows.append(
                                          {
                                              "phase": trace.phase,
                                              "a": a_coord,
                                              "b": b_coord,
                                              "c": c_coord,
                                              "d": d_coord,
                                              "round": r,
                                              "state_lane": "abcdefgh"[lane_index],
                                              "bit": bit,
                                              "value": (lane_value >> (31 - bit)) & 1,
                                          }
                                      )
              write_csv(ROUND_STATES, round_rows)
              write_csv(
                  LATTICE_BITS,
                  lattice_rows,
                  fieldnames=["phase", "a", "b", "c", "d", "round", "state_lane", "bit", "value"],
              )
          
              projection_rows: List[dict] = []
              clouds: Dict[int, np.ndarray] = {}
              rng = np.random.default_rng(DETERMINISTIC_SEED or 314159)
              for omitted_axis in range(4):
                  reduced = feature.sum(axis=omitted_axis)
                  if PROJECTION_NOISE_SIGMA > 0:
                      reduced = reduced + rng.normal(0, PROJECTION_NOISE_SIGMA, size=reduced.shape)
                  cloud = []
                  for index in np.ndindex(reduced.shape):
                      value = float(reduced[index])
                      cloud.append([float(index[0]), float(index[1]), float(index[2]), value])
                      projection_rows.append(
                          {
                              "omitted_axis": omitted_axis,
                              "u": index[0],
                              "v": index[1],
                              "w": index[2],
                              "projected_feature": value,
                          }
                      )
                  clouds[omitted_axis] = np.asarray(cloud, dtype=float)
              write_csv(PROJECTIONS, projection_rows)
          
              gauge_rows: List[dict] = []
              gauged: Dict[int, np.ndarray] = {}
              for axis, cloud4 in clouds.items():
                  coordinates = cloud4[:, :3].copy()
                  weights = np.abs(cloud4[:, 3]) + 1e-12
                  weights /= weights.sum()
                  centroid = np.sum(coordinates * weights[:, None], axis=0)
                  centered = coordinates - centroid
                  rms = float(
                      np.sqrt(np.sum(weights * np.sum(centered**2, axis=1)))
                  )
                  scaled = centered / rms if rms else centered
                  covariance = (scaled * weights[:, None]).T @ scaled
                  eigenvalues, eigenvectors = np.linalg.eigh(covariance)
                  order = np.argsort(eigenvalues)[::-1]
                  eigenvalues = eigenvalues[order]
                  principal = eigenvectors[:, order[0]]
                  anchor = scaled[np.argmax(np.linalg.norm(scaled, axis=1))]
                  if float(np.dot(principal, anchor)) < 0:
                      principal = -principal
                  gauged[axis] = scaled
                  gauge_rows.append(
                      {
                          "omitted_axis": axis,
                          "centroid_x": float(centroid[0]),
                          "centroid_y": float(centroid[1]),
                          "centroid_z": float(centroid[2]),
                          "rms_scale": rms,
                          "principal_axis_x": float(principal[0]),
                          "principal_axis_y": float(principal[1]),
                          "principal_axis_z": float(principal[2]),
                          "eigenvalue_1": float(eigenvalues[0]),
                          "eigenvalue_2": float(eigenvalues[1]),
                          "eigenvalue_3": float(eigenvalues[2]),
                          "gauge_section": "weighted center=0; RMS=1; principal axis and sign fixed",
                      }
                  )
              write_csv(GAUGE_DIAGNOSTICS, gauge_rows)
          
              stability_rows: List[dict] = []
              base = gauged[0]
              stability_rng = np.random.default_rng((DETERMINISTIC_SEED or 314159) + 1)
              for eta in [0.0001, 0.00025, 0.0005, 0.001, 0.002, 0.005, 0.01]:
                  distances = []
                  for _ in range(24):
                      perturbed = base + stability_rng.normal(0, eta, size=base.shape)
                      distances.append(quotient_distance(base, perturbed))
                  stability_rows.append(
                      {
                          "eta": eta,
                          "mean_quotient_displacement": float(np.nanmean(distances)),
                          "p95_quotient_displacement": float(np.nanpercentile(distances, 95)),
                          "max_quotient_displacement": float(np.nanmax(distances)),
                          "claim": "finite-resolution empirical stability only",
                      }
                  )
              write_csv(STABILITY, stability_rows)
          
              tolerance_rows: List[dict] = []
              base_cloud = clouds[0][:, :3]
              base_feature = clouds[0][:, 3]
              median = np.median(base_feature)
              for delta in [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.25, 0.5, 1.0]:
                  active = base_cloud[np.abs(base_feature - median) <= delta]
                  tolerance_rows.append(
                      {
                          "delta": delta,
                          "active_points": len(active),
                          "connected_components": (
                              connected_components(active, max(delta, 1e-9)) if len(active) else 0
                          ),
                          "posterior_mass_in_ball": float("nan"),
                          "note": "no posterior mass is fabricated without multiple exact models",
                      }
                  )
              write_csv(TOLERANCE, tolerance_rows)
          
              frequency_rows: List[dict] = []
              for axis in range(4):
                  field = clouds[axis][:, 3].reshape(4, 4, 4)
                  spectrum = np.fft.fftn(field)
                  frequencies = np.meshgrid(
                      *[np.fft.fftfreq(4)] * 3,
                      indexing="ij",
                  )
                  radius = np.sqrt(sum(component**2 for component in frequencies))
                  cutoff = 0.35
                  low = np.where(radius <= cutoff, spectrum, 0)
                  high = spectrum - low
                  low_energy = float(np.sum(np.abs(low) ** 2))
                  high_energy = float(np.sum(np.abs(high) ** 2))
                  total_frequency_energy = low_energy + high_energy
                  frequency_rows.append(
                      {
                          "omitted_axis": axis,
                          "cutoff": cutoff,
                          "low_frequency_phi_energy": low_energy,
                          "high_frequency_xi_energy": high_energy,
                          "low_fraction": (
                              low_energy / total_frequency_energy if total_frequency_energy else 0.0
                          ),
                      }
                  )
              write_csv(FREQUENCY_SPLIT, frequency_rows)
          
          
          def write_model_spec() -> None:
              MODEL_SPEC.write_text(
                  """BITCOIN SHA-256d 4D JOINT-INFERENCE MODEL
          =========================================
          
          Forward model
          -------------
          x = H_{m,pi}(y) + xi
          H_{m,pi} = D_m o P_pi
          
          Local energy
          ------------
          E_local(y) = sum_(i,j in A) d(e_i^right, e_j^left)
          
          The adjacency set A contains exact forward/backward SHA-256d round boundaries
          and message-schedule boundaries across all three compression invocations.
          Distances are bit Hamming distances. E_local is computed from residuals.
          
          Global energy
          -------------
          E_global(y) = -log p_prior(y)
          
          Missingness
          -----------
          C(m) = sum_j (1-m_j)
          
          MAP objective
          -------------
          (y_hat,m_hat,pi_hat) = argmin [
              ||x-H_{m,pi}(y)||^2/(2 sigma^2)
              + lambda E_local(y)
              + beta E_global(y)
              + gamma C(m)
          ]
          
          Hard constraints
          ----------------
          p0 XOR p1 XOR p2 XOR p3 = 0
          p0 XOR p1 = 0
          product_(i=1)^16 O_i = Identity
          
          The orientation closure is sum_i O_i = 0 mod 3. The parity completion uses
          p1=p0 and p2=p3=0, satisfying exactly the supplied XOR equations.
          
          4D allocation and reconstruction
          --------------------------------
          The 4x4x4x4 lattice has 256 cells. The sixteen interior cells {1,2}^4 hold
          the sixteen canonical 40-bit header chunks. The 192 SHA compression rounds
          occupy 192 surface cells. Remaining surface cells hold observation, digest,
          prior, posterior, gauge, and projection information.
          
          A candidate is propagated through exact SHA equations. The target digest is
          propagated backward through inverse-round equations using the candidate
          schedule. Required schedule words are derived algebraically. The resulting
          640-bit pullback is projected onto complete-interior, cell, axis-slice, face,
          and 4D adjacency-edge sections. These are residual projections, not physical
          Rubik moves and not a nonce interval loop.
          
          Convergence handling
          --------------------
          Geometric-only updates are not guaranteed to connect the candidate state
          space. CONVERGENCE_MODE=hidden_bit_fallback adds single-hidden-bit edges.
          The graph is connected only when BIT_FALLBACK_WIDTH=0. A positive width is a
          budgeted residual-prioritized approximation. Reachability is reported in the
          status file; it is never asserted when not guaranteed.
          
          Observation-noise handling
          --------------------------
          Strict mode assigns infinite observation energy to visible disagreement.
          AUTO_RELAX_OBSERVATION_NOISE=true changes only such disagreements to the
          finite Gaussian term and records that relaxation. This prevents an accidental
          all-infinite frontier while preserving an explicit audit trail.
          
          Computational-cost handling
          ---------------------------
          MAX_RUNTIME_SECONDS, MAX_EXPANDED_STATES, and MAX_FRONTIER_SIZE are explicit
          resource budgets. Zero means unlimited. Budget exhaustion produces an
          incomplete status, checkpoint, evidence artifacts, and a failing final workflow
          status. Frontier pruning is recorded because it destroys exhaustive best-first
          coverage.
          
          Identifiability
          ---------------
          A 256-bit digest alone does not identify a hidden 640-bit historical header.
          For full_header/hash_only, exact digest completion means an exact preimage, not
          historical-header recovery. Historical equality is always a separate post-solve
          comparison. No fake posterior mass or uniqueness claim is emitted.
          
          State-space prior volume
          ------------------------
          N_states = (16! * (64!)^2 * 96! * 2^45 * 3^15) /
                     (1536 * (8!)^8)
          
          Continuous extension
          --------------------
          x = H_{m,pi}(T_{g,phi} y) + xi
          
          Completion
          ----------
          A candidate is complete only when independent hashlib SHA256d(y_hat) equals
          the target digest. Historical-header equality is separately reported.
          """,
                  encoding="utf-8",
              )
          
          
          def write_checkpoint(
              iteration: int,
              evaluation: Evaluation,
              frontier_size: int,
              exact_models: Sequence[str],
              accepted_section: str,
              started: float,
              termination_reason: Optional[str] = None,
              frontier_pruned: bool = False,
          ) -> None:
              CHECKPOINT.write_text(
                  json.dumps(
                      {
                          "model_revision": MODEL_REVISION,
                          "iteration": iteration,
                          "accepted_section": accepted_section,
                          "frontier_size": frontier_size,
                          "candidate_header_hex": evaluation.header.hex(),
                          "candidate_displayed_hash": evaluation.displayed_hash,
                          "digest_hamming": evaluation.digest_hamming,
                          "E_observation": evaluation.E_observation,
                          "E_local": evaluation.E_local,
                          "E_global": evaluation.E_global,
                          "C_missing": evaluation.C_missing,
                          "total_energy": evaluation.total_energy,
                          "state_edge_hamming": evaluation.compatibility.state_edge_hamming,
                          "schedule_edge_hamming": evaluation.compatibility.schedule_edge_hamming,
                          "permutation": list(evaluation.projection.permutation),
                          "orientations": list(evaluation.projection.orientations),
                          "p": [
                              evaluation.projection.p0,
                              evaluation.projection.p1,
                              evaluation.projection.p2,
                              evaluation.projection.p3,
                          ],
                          "observation_noise_effective": evaluation.observation_noise_effective,
                          "exact_models": list(exact_models),
                          "elapsed_seconds": time.time() - started,
                          "termination_reason": termination_reason,
