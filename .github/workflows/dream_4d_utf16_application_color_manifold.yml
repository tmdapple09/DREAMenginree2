name: DREAM 4D UTF-16 Application Color Manifold
run-name: DREAM 4D UTF-16 Application Color Manifold

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-4d-utf16-application-color-manifold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-color-manifold:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "Pillow>=10,<13"

      - name: Write the manifold renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_utf16_color_manifold.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          import os
          import stat
          import subprocess
          import zlib
          from dataclasses import dataclass
          from pathlib import Path, PurePosixPath

          from PIL import Image, ImageDraw

          WIDTH = 4284
          HEIGHT = 5712
          GRID_COLUMNS = 17
          GRID_ROWS = 23
          BLOCK_TILES = 58
          MODULE_PIXELS = 2
          TILE_PIXELS = MODULE_PIXELS * 2
          BLOCK_PIXELS = BLOCK_TILES * TILE_PIXELS
          PALETTE_UNITS = 16
          HEADER_UNITS = 64
          BLOCK_UNITS = BLOCK_TILES * BLOCK_TILES
          PAYLOAD_UNITS_PER_BLOCK = BLOCK_UNITS - PALETTE_UNITS - HEADER_UNITS

          GOLDEN_ANGLE = math.pi / 5.0
          OMEGA = complex(math.cos(GOLDEN_ANGLE), math.sin(GOLDEN_ANGLE))
          PHI = float((OMEGA + OMEGA.conjugate()).real)
          GOLDEN_N = float((PHI + math.sqrt(PHI * PHI + 4.0)) / 2.0)
          IDENTITY_RESIDUAL = abs(GOLDEN_N - 1.0 / GOLDEN_N - PHI)

          if IDENTITY_RESIDUAL > 1.0e-12:
              raise RuntimeError("golden identity invariant failed")

          # High-contrast 16-color nibble alphabet, ordered 0..F.
          NIBBLE_COLORS = (
              (0, 0, 0),
              (0, 0, 170),
              (0, 170, 0),
              (0, 170, 170),
              (170, 0, 0),
              (170, 0, 170),
              (170, 85, 0),
              (170, 170, 170),
              (85, 85, 85),
              (85, 85, 255),
              (85, 255, 85),
              (85, 255, 255),
              (255, 85, 85),
              (255, 85, 255),
              (255, 255, 85),
              (255, 255, 255),
          )

          APPLICATION_EXTENSIONS = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs",
              ".css", ".scss", ".sass", ".less",
              ".html", ".htm", ".vue", ".svelte", ".astro",
              ".graphql", ".gql", ".prisma",
          }

          EXCLUDED_DIRECTORY_NAMES = {
              ".git", ".github", ".circleci", ".husky", ".vscode", ".idea",
              "ci", "cd", "test", "tests", "__tests__", "spec", "specs",
              "e2e", "cypress", "playwright", "docs", "documentation",
              "examples", "example", "fixtures", "fixture", "mocks", "__mocks__",
              "scripts", "tools", "bench", "benches", "benchmark", "benchmarks",
              "coverage", "dist", "build", "out", ".next", "node_modules", "vendor",
              "generated", "public",
          }

          EXCLUDED_FILE_MARKERS = (
              ".test.", ".spec.", ".stories.", ".story.", ".bench.", ".benchmark.",
              ".config.", ".setup.", ".mock.", ".fixture.",
          )

          EXCLUDED_FILE_NAMES = {
              "next.config.js", "next.config.mjs", "next.config.ts",
              "vite.config.js", "vite.config.ts", "webpack.config.js",
              "babel.config.js", "jest.config.js", "jest.config.ts",
              "vitest.config.js", "vitest.config.ts", "playwright.config.ts",
              "cypress.config.js", "cypress.config.ts", "tailwind.config.js",
              "tailwind.config.ts", "postcss.config.js", "eslint.config.js",
              "eslint.config.mjs",
          }


          @dataclass(frozen=True)
          class Block:
              index: int
              payload: tuple[int, ...]
              digest: bytes
              cell: int
              degree: int
              shell: int
              orientation: int


          def tracked_paths(root: Path) -> list[str]:
              result = subprocess.run(
                  [
                      "git",
                      "-C",
                      str(root),
                      "ls-files",
                      "-z",
                      "--recurse-submodules",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              paths = [
                  item.decode("utf-8", "surrogateescape")
                  for item in result.stdout.split(b"\0")
                  if item
              ]
              paths = sorted(set(paths))
              if not paths:
                  raise RuntimeError("git reported no tracked paths")
              return paths


          def is_application_source(
              relative: PurePosixPath,
              path: Path,
              data: bytes,
          ) -> bool:
              lowered_parts = {
                  part.lower()
                  for part in relative.parts[:-1]
              }
              if lowered_parts & EXCLUDED_DIRECTORY_NAMES:
                  return False

              lowered_name = relative.name.lower()
              if lowered_name in EXCLUDED_FILE_NAMES:
                  return False
              if any(
                  marker in lowered_name
                  for marker in EXCLUDED_FILE_MARKERS
              ):
                  return False

              # Deliberately exclude Python, Markdown, CI/YAML, tests,
              # documentation, build scripts, configuration, and data files.
              if path.suffix.lower() not in APPLICATION_EXTENSIONS:
                  return False
              if b"\x00" in data[:8192]:
                  return False

              try:
                  data.decode("utf-8")
              except UnicodeDecodeError:
                  return False
              return True


          def canonical_archive(root: Path) -> tuple[str, list[dict], list[str]]:
              files: list[dict] = []
              skipped: list[str] = []

              for relative_text in tracked_paths(root):
                  relative = PurePosixPath(relative_text)
                  absolute = root.joinpath(*relative.parts)
                  metadata = os.lstat(absolute)
                  mode = stat.S_IMODE(metadata.st_mode)

                  if stat.S_ISDIR(metadata.st_mode):
                      continue

                  if stat.S_ISLNK(metadata.st_mode):
                      skipped.append(relative.as_posix())
                      continue

                  if not stat.S_ISREG(metadata.st_mode):
                      skipped.append(relative.as_posix())
                      continue

                  raw = absolute.read_bytes()
                  if not is_application_source(
                      relative,
                      absolute,
                      raw,
                  ):
                      skipped.append(relative.as_posix())
                      continue

                  text = raw.decode("utf-8", "surrogateescape")
                  files.append(
                      {
                          "path": relative.as_posix(),
                          "type": "text",
                          "mode": mode,
                          "encoding": "utf-8-surrogateescape",
                          "byteLength": len(raw),
                          "sha256": hashlib.sha256(raw).hexdigest(),
                          "content": text,
                      }
                  )

              archive = {
                  "format": "dream-4d-utf16-color-manifold",
                  "version": 1,
                  "canvas": {
                      "width": WIDTH,
                      "height": HEIGHT,
                      "blockTiles": BLOCK_TILES,
                      "modulePixels": MODULE_PIXELS,
                  },
                  "equation": {
                      "goldenAngle": GOLDEN_ANGLE,
                      "phi": PHI,
                      "n": GOLDEN_N,
                      "identityResidual": IDENTITY_RESIDUAL,
                  },
                  "visualGrammar": {
                      "unit": "UTF-16BE code unit",
                      "unitLayout": "2x2 high-contrast nibble colors, high nibble first",
                      "paletteOrder": "0..F",
                      "paletteCalibration": "first 16 units of every block are 0000,1111,...,FFFF",
                      "blockHeader": "D4B1|index|total|payloadUnits|crc32|archiveSha16",
                      "blockTraversal": "row-major after orientation is corrected",
                  },
                  "fileCount": len(files),
                  "skippedNonApplicationCount": len(skipped),
                  "files": files,
              }

              encoded = json.dumps(
                  archive,
                  ensure_ascii=True,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              return encoded, files, skipped


          def utf16_units(text: str) -> list[int]:
              raw = text.encode("utf-16-be", "surrogatepass")
              return [
                  (raw[index] << 8) | raw[index + 1]
                  for index in range(0, len(raw), 2)
              ]


          def golden_schedule(total: int) -> list[int]:
              schedule: list[int] = []
              previous = 0
              exponent = 0

              while previous < total:
                  value = max(
                      previous + 1,
                      int(math.floor(GOLDEN_N ** exponent)),
                  )
                  schedule.append(value)
                  previous = value
                  exponent += 1

              return schedule


          def walsh16(values: list[int]) -> list[int]:
              transformed = [int(value) for value in values]
              stride = 1

              while stride < 16:
                  for start in range(0, 16, 2 * stride):
                      for offset in range(stride):
                          left = transformed[start + offset]
                          right = transformed[start + offset + stride]
                          transformed[start + offset] = left + right
                          transformed[start + offset + stride] = left - right
                  stride *= 2

              return transformed


          def build_blocks(
              units: list[int],
              archive_sha: bytes,
          ) -> tuple[list[Block], list[tuple[int, int]], list[int]]:
              total_blocks = math.ceil(
                  len(units) / PAYLOAD_UNITS_PER_BLOCK
              )
              maximum_blocks = GRID_COLUMNS * GRID_ROWS

              if total_blocks > maximum_blocks:
                  capacity = maximum_blocks * PAYLOAD_UNITS_PER_BLOCK
                  raise RuntimeError(
                      "source archive is too large for one 4284x5712 image: "
                      f"{len(units)} UTF-16 units required, {capacity} available"
                  )

              raw_payloads: list[tuple[int, ...]] = []
              digests: list[bytes] = []
              cells: list[int] = []

              for block_index in range(total_blocks):
                  start = block_index * PAYLOAD_UNITS_PER_BLOCK
                  payload = tuple(
                      units[start : start + PAYLOAD_UNITS_PER_BLOCK]
                  )
                  payload_bytes = b"".join(
                      unit.to_bytes(2, "big")
                      for unit in payload
                  )
                  digest = hashlib.sha256(
                      archive_sha
                      + block_index.to_bytes(4, "big")
                      + payload_bytes
                  ).digest()
                  raw_payloads.append(payload)
                  digests.append(digest)
                  cells.append(digest[0] & 0x0F)

              edges: set[tuple[int, int]] = set()
              if total_blocks > 1:
                  for index, digest in enumerate(digests):
                      left_hop = 1 + int.from_bytes(
                          digest[1:5],
                          "big",
                      ) % (total_blocks - 1)
                      right_hop = 1 + int.from_bytes(
                          digest[9:13],
                          "big",
                      ) % (total_blocks - 1)

                      for hop in (left_hop, right_hop):
                          partner = (index + hop) % total_blocks
                          if partner != index:
                              edges.add(tuple(sorted((index, partner))))

              degrees = [0] * total_blocks
              for left, right in edges:
                  degrees[left] += 1
                  degrees[right] += 1

              cell_counts = [0] * 16
              for cell in cells:
                  cell_counts[cell] += 1
              walsh = walsh16(cell_counts)

              schedule = golden_schedule(total_blocks)
              blocks: list[Block] = []

              for index, payload in enumerate(raw_payloads):
                  shell = 0
                  while (
                      shell < len(schedule) - 1
                      and index >= schedule[shell]
                  ):
                      shell += 1

                  orientation = (
                      (
                          index * int(PHI * (1 << 36))
                          + cells[index] * int(GOLDEN_N * (1 << 32))
                          + int(GOLDEN_ANGLE * (1 << 40))
                      )
                      >> 11
                  ) & 0x03

                  blocks.append(
                      Block(
                          index=index,
                          payload=payload,
                          digest=digests[index],
                          cell=cells[index],
                          degree=degrees[index],
                          shell=shell,
                          orientation=int(orientation),
                      )
                  )

              return blocks, sorted(edges), walsh


          def target_point(
              block: Block,
              total_blocks: int,
              max_degree: int,
              walsh: list[int],
          ) -> tuple[float, float]:
              t = (block.index + 0.5) / max(1, total_blocks)
              phase_a = 2.0 * math.pi * block.digest[0] / 255.0
              phase_b = 2.0 * math.pi * block.digest[7] / 255.0
              phase_c = 2.0 * math.pi * block.digest[13] / 255.0
              phase_d = 2.0 * math.pi * block.digest[21] / 255.0

              theta = 2.0 * math.pi * t + GOLDEN_ANGLE * block.shell
              cell_bias_scale = max(
                  1,
                  max(abs(value) for value in walsh[1:] or [1]),
              )
              cell_bias = walsh[block.cell] / cell_bias_scale
              degree_bias = block.degree / max(1, max_degree)

              x4 = math.cos(
                  theta * GOLDEN_N + phase_a
              ) * (
                  0.58
                  + 0.25 * math.cos(
                      theta * PHI + phase_c
                  )
              )
              y4 = math.sin(
                  theta * PHI + phase_b
              ) * (
                  0.58
                  + 0.25 * math.sin(
                      theta * GOLDEN_N + phase_d
                  )
              )
              z4 = math.cos(
                  theta * (PHI + GOLDEN_N) + phase_c
              ) * (
                  0.48 + 0.18 * cell_bias
              )
              w4 = math.sin(
                  theta / GOLDEN_N + phase_d
              ) * (
                  0.48 + 0.20 * degree_bias
              )

              denominator_4d = max(
                  0.50,
                  2.25 - w4,
              )
              x3 = (
                  x4 + 0.30 * z4
              ) / denominator_4d
              y3 = (
                  y4 + 0.22 * z4
              ) / denominator_4d
              z3 = z4 / denominator_4d

              denominator_3d = max(
                  0.60,
                  2.35 - z3,
              )
              x2 = x3 / denominator_3d
              y2 = y3 / denominator_3d

              shell_count = max(
                  1,
                  len(golden_schedule(total_blocks)),
              )
              radius = (
                  0.20
                  + 0.75
                  * block.shell
                  / max(1, shell_count - 1)
              )

              return radius * x2, radius * y2


          def slot_centers() -> list[tuple[int, int, int, int]]:
              horizontal_pitch = WIDTH / GRID_COLUMNS
              vertical_margin = 84.0
              vertical_pitch = (
                  HEIGHT - 2.0 * vertical_margin
              ) / GRID_ROWS

              slots: list[tuple[int, int, int, int]] = []

              for row in range(GRID_ROWS):
                  for column in range(GRID_COLUMNS):
                      center_x = int(
                          round(
                              (column + 0.5)
                              * horizontal_pitch
                          )
                      )
                      center_y = int(
                          round(
                              vertical_margin
                              + (row + 0.5)
                              * vertical_pitch
                          )
                      )
                      left = center_x - BLOCK_PIXELS // 2
                      top = center_y - BLOCK_PIXELS // 2
                      slots.append(
                          (
                              center_x,
                              center_y,
                              left,
                              top,
                          )
                      )

              return slots


          def assign_slots(
              blocks: list[Block],
              walsh: list[int],
          ) -> dict[int, tuple[int, int, int, int]]:
              available = slot_centers()
              assigned: dict[int, tuple[int, int, int, int]] = {}
              maximum_degree = max(
                  (block.degree for block in blocks),
                  default=0,
              )

              for block in blocks:
                  target_x, target_y = target_point(
                      block,
                      len(blocks),
                      maximum_degree,
                      walsh,
                  )
                  pixel_x = WIDTH / 2.0 + target_x * WIDTH * 0.82
                  pixel_y = HEIGHT / 2.0 + target_y * HEIGHT * 0.82

                  best_index = min(
                      range(len(available)),
                      key=lambda index: (
                          (
                              available[index][0] - pixel_x
                          ) ** 2
                          + (
                              available[index][1] - pixel_y
                          ) ** 2
                      ),
                  )
                  assigned[block.index] = available.pop(
                      best_index
                  )

              return assigned


          def unit_tile(
              draw: ImageDraw.ImageDraw,
              x: int,
              y: int,
              unit: int,
          ) -> None:
              nibbles = (
                  (unit >> 12) & 0x0F,
                  (unit >> 8) & 0x0F,
                  (unit >> 4) & 0x0F,
                  unit & 0x0F,
              )
              coordinates = (
                  (x, y),
                  (x + MODULE_PIXELS, y),
                  (x, y + MODULE_PIXELS),
                  (
                      x + MODULE_PIXELS,
                      y + MODULE_PIXELS,
                  ),
              )

              for nibble, (left, top) in zip(
                  nibbles,
                  coordinates,
              ):
                  draw.rectangle(
                      (
                          left,
                          top,
                          left + MODULE_PIXELS - 1,
                          top + MODULE_PIXELS - 1,
                      ),
                      fill=NIBBLE_COLORS[nibble],
                  )


          def header_units(
              block: Block,
              total_blocks: int,
              archive_sha: bytes,
          ) -> list[int]:
              payload_bytes = b"".join(
                  unit.to_bytes(2, "big")
                  for unit in block.payload
              )
              crc = zlib.crc32(
                  payload_bytes
              ) & 0xFFFFFFFF
              header = (
                  f"D4B1|{block.index:08X}|"
                  f"{total_blocks:08X}|"
                  f"{len(block.payload):08X}|"
                  f"{crc:08X}|"
                  f"{archive_sha.hex()[:16]}"
              )
              header = header.ljust(
                  HEADER_UNITS,
                  "|",
              )[:HEADER_UNITS]
              return utf16_units(header)


          def filler_unit(
              block: Block,
              tile_index: int,
              archive_sha: bytes,
          ) -> int:
              digest = hashlib.sha256(
                  archive_sha
                  + block.index.to_bytes(4, "big")
                  + tile_index.to_bytes(4, "big")
                  + block.digest
              ).digest()
              return (
                  digest[0] << 8
              ) | digest[1]


          def render_block(
              block: Block,
              total_blocks: int,
              archive_sha: bytes,
          ) -> Image.Image:
              image = Image.new(
                  "RGB",
                  (
                      BLOCK_PIXELS,
                      BLOCK_PIXELS,
                  ),
                  (18, 18, 22),
              )
              draw = ImageDraw.Draw(image)

              units: list[int] = [
                  nibble * 0x1111
                  for nibble in range(16)
              ]
              units.extend(
                  header_units(
                      block,
                      total_blocks,
                      archive_sha,
                  )
              )
              units.extend(block.payload)

              for tile_index in range(BLOCK_UNITS):
                  if tile_index < len(units):
                      unit = units[tile_index]
                  else:
                      unit = filler_unit(
                          block,
                          tile_index,
                          archive_sha,
                      )

                  row = tile_index // BLOCK_TILES
                  column = tile_index % BLOCK_TILES
                  unit_tile(
                      draw,
                      column * TILE_PIXELS,
                      row * TILE_PIXELS,
                      unit,
                  )

              rotations = {
                  0: None,
                  1: Image.Transpose.ROTATE_90,
                  2: Image.Transpose.ROTATE_180,
                  3: Image.Transpose.ROTATE_270,
              }
              transpose = rotations[block.orientation]

              if transpose is not None:
                  image = image.transpose(transpose)

              return image


          def paint_background(
              image: Image.Image,
              archive_sha: bytes,
          ) -> None:
              draw = ImageDraw.Draw(image)
              base_phase = int.from_bytes(
                  archive_sha[:8],
                  "big",
              ) / float(1 << 64)

              for band in range(96, 0, -1):
                  ratio = band / 96.0
                  radius_x = int(
                      WIDTH * 0.48 * ratio
                  )
                  radius_y = int(
                      HEIGHT * 0.42 * ratio
                  )
                  phase = (
                      GOLDEN_ANGLE * band
                      + base_phase * 2.0 * math.pi
                  )
                  center_x = int(
                      WIDTH / 2
                      + math.cos(phase * PHI)
                      * WIDTH
                      * 0.035
                  )
                  center_y = int(
                      HEIGHT / 2
                      + math.sin(phase * GOLDEN_N)
                      * HEIGHT
                      * 0.035
                  )
                  red = int(
                      5 + 20 * (1.0 - ratio)
                  )
                  green = int(
                      8
                      + 22
                      * abs(
                          math.sin(
                              phase + PHI
                          )
                      )
                      * (1.0 - ratio)
                  )
                  blue = int(
                      14 + 42 * (1.0 - ratio)
                  )
                  draw.ellipse(
                      (
                          center_x - radius_x,
                          center_y - radius_y,
                          center_x + radius_x,
                          center_y + radius_y,
                      ),
                      fill=(
                          min(255, red),
                          min(255, green),
                          min(255, blue),
                      ),
                  )


          def draw_graph(
              image: Image.Image,
              blocks: list[Block],
              edges: list[tuple[int, int]],
              slots: dict[int, tuple[int, int, int, int]],
          ) -> None:
              draw = ImageDraw.Draw(
                  image,
                  "RGBA",
              )
              by_index = {
                  block.index: block
                  for block in blocks
              }

              for left_index, right_index in edges:
                  left_block = by_index[left_index]
                  right_block = by_index[right_index]
                  left_x, left_y, _, _ = slots[left_index]
                  right_x, right_y, _, _ = slots[right_index]

                  rgb = (
                      96 + left_block.digest[0] % 160,
                      96 + left_block.digest[7] % 160,
                      96 + left_block.digest[13] % 160,
                      52,
                  )
                  cmy = (
                      255 - rgb[0],
                      255 - rgb[1],
                      255 - rgb[2],
                      42,
                  )

                  draw.line(
                      (
                          left_x,
                          left_y,
                          right_x,
                          right_y,
                      ),
                      fill=rgb,
                      width=5,
                  )
                  draw.line(
                      (
                          left_x + 4,
                          left_y - 4,
                          right_x + 4,
                          right_y - 4,
                      ),
                      fill=cmy,
                      width=3,
                  )


          def build(root: Path, output: Path) -> dict:
              archive_text, files, skipped = canonical_archive(
                  root
              )
              archive_sha = hashlib.sha256(
                  archive_text.encode(
                      "utf-8",
                      "surrogatepass",
                  )
              ).digest()
              units = utf16_units(
                  archive_text
              )
              blocks, edges, walsh = build_blocks(
                  units,
                  archive_sha,
              )
              slots = assign_slots(
                  blocks,
                  walsh,
              )

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  (5, 8, 14),
              )
              paint_background(
                  image,
                  archive_sha,
              )
              draw_graph(
                  image,
                  blocks,
                  edges,
                  slots,
              )

              outline = ImageDraw.Draw(
                  image,
                  "RGBA",
              )

              for block in blocks:
                  _, _, left, top = slots[
                      block.index
                  ]
                  block_image = render_block(
                      block,
                      len(blocks),
                      archive_sha,
                  )
                  image.paste(
                      block_image,
                      (left, top),
                  )

                  rgb = (
                      96 + block.digest[0] % 160,
                      96 + block.digest[7] % 160,
                      96 + block.digest[13] % 160,
                      220,
                  )
                  cmy = (
                      255 - rgb[0],
                      255 - rgb[1],
                      255 - rgb[2],
                      180,
                  )
                  outline.rectangle(
                      (
                          left - 3,
                          top - 3,
                          left + BLOCK_PIXELS + 2,
                          top + BLOCK_PIXELS + 2,
                      ),
                      outline=rgb,
                      width=3,
                  )
                  outline.rectangle(
                      (
                          left - 6,
                          top - 6,
                          left + BLOCK_PIXELS + 5,
                          top + BLOCK_PIXELS + 5,
                      ),
                      outline=cmy,
                      width=2,
                  )

              output.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              image.save(
                  output,
                  "PNG",
                  compress_level=6,
                  optimize=False,
              )

              return {
                  "artifact": str(output),
                  "width": WIDTH,
                  "height": HEIGHT,
                  "megapixels": (
                      WIDTH * HEIGHT / 1_000_000
                  ),
                  "textFiles": len(files),
                  "skippedNonApplicationFiles": len(skipped),
                  "utf16Units": len(units),
                  "blocks": len(blocks),
                  "blockPayloadCapacity": (
                      GRID_COLUMNS
                      * GRID_ROWS
                      * PAYLOAD_UNITS_PER_BLOCK
                  ),
                  "archiveSha256": archive_sha.hex(),
                  "phi": PHI,
                  "n": GOLDEN_N,
                  "goldenAngle": GOLDEN_ANGLE,
                  "identityResidual": IDENTITY_RESIDUAL,
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument(
                  "--root",
                  type=Path,
                  required=True,
              )
              parser.add_argument(
                  "--output",
                  type=Path,
                  required=True,
              )
              args = parser.parse_args()

              result = build(
                  args.root.resolve(),
                  args.output.resolve(),
              )
              print(
                  json.dumps(
                      result,
                      indent=2,
                      sort_keys=True,
                  )
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())

          PY
          python -m py_compile "$RUNNER_TEMP/build_utf16_color_manifold.py"

      - name: Build the 24 MP PNG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/dream-color-manifold-output"
          mkdir -p "$GITHUB_WORKSPACE/dream-color-manifold-output"

          python "$RUNNER_TEMP/build_utf16_color_manifold.py" \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/dream-color-manifold-output/DREAM_4D_UTF16_APPLICATION_COLOR_MANIFOLD.png" \
            | tee "$RUNNER_TEMP/dream-color-manifold-build.json"

      - name: Verify shareable PNG dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_path = Path(
              "dream-color-manifold-output/"
              "DREAM_4D_UTF16_APPLICATION_COLOR_MANIFOLD.png"
          )
          with Image.open(image_path) as image:
              if image.size != (4284, 5712):
                  raise SystemExit(
                      f"unexpected dimensions: {image.size}"
                  )
              image.verify()

          print("PNG_OK 4284x5712")
          PY

      - name: Publish build summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## DREAM 4D UTF-16 Application Color Manifold"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/dream-color-manifold-build.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the PNG
        uses: actions/upload-artifact@v4
        with:
          name: DREAM_4D_UTF16_APPLICATION_COLOR_MANIFOLD
          path: dream-color-manifold-output/DREAM_4D_UTF16_APPLICATION_COLOR_MANIFOLD.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
