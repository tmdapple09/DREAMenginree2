name: DREAM AI-Native 4D RGB-CMY Application Manifold
run-name: DREAM AI-Native 4D RGB-CMY Application Manifold

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-ai-native-4d-rgb-cmy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ai-native-manifold:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "Pillow>=10,<13" \
            "numpy>=2,<3"

      - name: Write the AI-native manifold builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_dream_ai_manifold.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          import os
          import re
          import stat
          import struct
          import subprocess
          import sys
          import zlib
          from dataclasses import dataclass
          from pathlib import Path, PurePosixPath

          import numpy as np
          from PIL import Image, ImageDraw

          WIDTH = 4284
          HEIGHT = 5712
          GRID_COLUMNS = 17
          GRID_ROWS = 23
          PITCH = 248
          BLOCK_SIZE = 240
          LEFT_MARGIN = (WIDTH - GRID_COLUMNS * PITCH) // 2
          TOP_MARGIN = (HEIGHT - GRID_ROWS * PITCH) // 2
          TOTAL_SLOTS = GRID_COLUMNS * GRID_ROWS
          CALIBRATION_SLOTS = (0, GRID_COLUMNS - 1, TOTAL_SLOTS - GRID_COLUMNS, TOTAL_SLOTS - 1)
          DATA_BLOCKS_MAX = TOTAL_SLOTS - len(CALIBRATION_SLOTS)

          HEADER_X = 4
          HEADER_Y = 4
          HEADER_CELL = 4
          HEADER_COLUMNS = 58
          HEADER_ROWS = 6
          HEADER_PAIR_CAPACITY = HEADER_COLUMNS * HEADER_ROWS
          HEADER_BYTE_CAPACITY = HEADER_PAIR_CAPACITY * 2

          P2_DATA_WIDTH = 208
          P2_DATA_HEIGHT = 192
          P2_PHYSICAL_WIDTH = 221
          P2_PHYSICAL_HEIGHT = 204
          P2_X = 9
          P2_Y = 32

          PR_DATA_WIDTH = 232
          PR_DATA_HEIGHT = 192
          PR_PHYSICAL_WIDTH = 232
          PR_PHYSICAL_HEIGHT = 204
          PR_X = 4
          PR_Y = 32

          P0_DATA_WIDTH = 232
          P0_DATA_HEIGHT = 208
          P0_PHYSICAL_WIDTH = 232
          P0_PHYSICAL_HEIGHT = 208
          P0_X = 4
          P0_Y = 30

          PACKET_MAGIC = b"DREAM4D6\n"
          PACKET_PREFIX = struct.Struct(">9sQ")
          AFFINE_MULTIPLIER = 197
          AFFINE_OFFSET = 101
          AFFINE_INVERSE = 13
          PARITY_XOR = 0xA5

          GOLDEN_ANGLE = math.pi / 5.0
          OMEGA = complex(math.cos(GOLDEN_ANGLE), math.sin(GOLDEN_ANGLE))
          PHI = float((OMEGA + OMEGA.conjugate()).real)
          GOLDEN_N = float((PHI + math.sqrt(PHI * PHI + 4.0)) / 2.0)
          IDENTITY_RESIDUAL = abs(GOLDEN_N - 1.0 / GOLDEN_N - PHI)
          if IDENTITY_RESIDUAL > 1.0e-12:
              raise RuntimeError("golden identity invariant failed")

          APPLICATION_EXTENSIONS = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs",
              ".css", ".scss", ".sass", ".less",
              ".html", ".htm", ".vue", ".svelte", ".astro",
              ".graphql", ".gql", ".prisma",
          }

          EXCLUDED_DIRECTORIES = {
              ".git", ".github", ".circleci", ".husky", ".vscode", ".idea",
              "ci", "cd", "docs", "doc", "documentation",
              "test", "tests", "__tests__", "spec", "specs", "e2e",
              "cypress", "playwright", "fixtures", "mocks", "stories", "storybook",
              "coverage", "dist", "build", "out", ".next", "node_modules", "vendor",
              "generated", "public", "scripts", "tools", "bench", "benchmarks",
              "examples", "example", "tmp", "temp", ".cache", "cache",
          }

          EXCLUDED_NAME_PATTERNS = (
              r"\.test\.", r"\.spec\.", r"\.stories?\.", r"\.story\.",
              r"\.mock\.", r"\.fixture\.", r"\.bench(mark)?\.",
              r"\.config\.", r"\.setup\.", r"\.min\.", r"\.bundle\.",
          )
          EXCLUDED_NAME_REGEXES = tuple(re.compile(pattern, re.IGNORECASE) for pattern in EXCLUDED_NAME_PATTERNS)

          IMPORT_PATTERNS = (
              re.compile(r"(?:import|export)\s+(?:[^'\"]+?\s+from\s+)?['\"]([^'\"]+)['\"]"),
              re.compile(r"require\(\s*['\"]([^'\"]+)['\"]\s*\)"),
              re.compile(r"import\(\s*['\"]([^'\"]+)['\"]\s*\)"),
          )

          KEYWORDS = {
              "break", "case", "catch", "class", "const", "continue", "debugger", "default",
              "delete", "do", "else", "export", "extends", "finally", "for", "function",
              "if", "import", "in", "instanceof", "let", "new", "return", "super", "switch",
              "this", "throw", "try", "typeof", "var", "void", "while", "with", "yield",
              "interface", "type", "enum", "implements", "private", "protected", "public",
              "readonly", "abstract", "as", "async", "await", "declare", "namespace", "module",
          }


          @dataclass
          class SourceFile:
              id: int
              path: str
              raw: bytes
              mode: int
              sha256: str
              imports: list[int]
              token_histogram: dict[str, int]
              packet_offset: int = 0


          @dataclass
          class DataBlock:
              index: int
              byte_start: int
              payload: bytes
              digest: bytes
              owner_file: int
              owner_chunk: int
              orientation: int
              target_x: float
              target_y: float
              slot: int = -1


          class ManifoldError(RuntimeError):
              pass


          def sha256_hex(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def tracked_paths(root: Path) -> list[str]:
              result = subprocess.run(
                  ["git", "-C", str(root), "ls-files", "-z", "--recurse-submodules"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              paths = sorted(
                  set(
                      item.decode("utf-8", "surrogateescape")
                      for item in result.stdout.split(b"\0")
                      if item
                  )
              )
              if not paths:
                  raise ManifoldError("git reported no tracked paths")
              return paths


          def should_include(relative: PurePosixPath) -> tuple[bool, str]:
              for part in relative.parts[:-1]:
                  if part.lower() in EXCLUDED_DIRECTORIES:
                      return False, f"excluded-directory:{part}"

              lower_name = relative.name.lower()
              if any(regex.search(lower_name) for regex in EXCLUDED_NAME_REGEXES):
                  return False, f"excluded-name:{relative.name}"

              if relative.suffix.lower() not in APPLICATION_EXTENSIONS:
                  return False, f"excluded-extension:{relative.suffix or '(none)'}"

              return True, "application-source"


          def token_histogram(raw: bytes) -> dict[str, int]:
              text = raw.decode("utf-8", "surrogateescape")
              counts = {
                  "whitespace": 0,
                  "identifier": 0,
                  "keyword": 0,
                  "number": 0,
                  "string": 0,
                  "comment": 0,
                  "operator": 0,
                  "delimiter": 0,
                  "other": 0,
              }

              token_pattern = re.compile(
                  r"//[^\n]*|/\*[\s\S]*?\*/|`(?:\\.|[^`])*`|'(?:\\.|[^'])*'|\"(?:\\.|[^\"])*\"|"
                  r"\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][A-Za-z0-9_$]*\b|\s+|"
                  r"===|!==|=>|==|!=|<=|>=|\+\+|--|&&|\|\||\?\?|\?\.|[+\-*/%=&|^~!<>?:]+|[{}\[\](),.;]"
              )

              for match in token_pattern.finditer(text):
                  token = match.group(0)
                  if token.isspace():
                      counts["whitespace"] += len(token)
                  elif token.startswith("//") or token.startswith("/*"):
                      counts["comment"] += len(token)
                  elif token[0:1] in {"'", '"', "`"}:
                      counts["string"] += len(token)
                  elif re.fullmatch(r"\d+(?:\.\d+)?", token):
                      counts["number"] += len(token)
                  elif re.fullmatch(r"[A-Za-z_$][A-Za-z0-9_$]*", token):
                      counts["keyword" if token in KEYWORDS else "identifier"] += len(token)
                  elif re.fullmatch(r"[{}\[\](),.;]", token):
                      counts["delimiter"] += len(token)
                  elif re.fullmatch(r"[+\-*/%=&|^~!<>?:]+", token):
                      counts["operator"] += len(token)
                  else:
                      counts["other"] += len(token)

              covered = sum(counts.values())
              if covered < len(text):
                  counts["other"] += len(text) - covered
              return counts


          def resolve_imports(files: list[SourceFile]) -> None:
              path_to_id = {file.path: file.id for file in files}
              available = set(path_to_id)

              def candidates(base: PurePosixPath, specifier: str) -> list[str]:
                  if not specifier.startswith("."):
                      return []
                  joined = base.parent.joinpath(PurePosixPath(specifier))
                  normalized_parts: list[str] = []
                  for part in joined.parts:
                      if part in {"", "."}:
                          continue
                      if part == "..":
                          if normalized_parts:
                              normalized_parts.pop()
                          continue
                      normalized_parts.append(part)
                  normalized = PurePosixPath(*normalized_parts)
                  output = [normalized.as_posix()]
                  if normalized.suffix:
                      return output
                  for extension in sorted(APPLICATION_EXTENSIONS):
                      output.append(normalized.with_suffix(extension).as_posix())
                  for extension in sorted(APPLICATION_EXTENSIONS):
                      output.append(normalized.joinpath("index" + extension).as_posix())
                  return output

              for file in files:
                  text = file.raw.decode("utf-8", "surrogateescape")
                  found: set[int] = set()
                  for pattern in IMPORT_PATTERNS:
                      for specifier in pattern.findall(text):
                          for candidate in candidates(PurePosixPath(file.path), specifier):
                              if candidate in available:
                                  found.add(path_to_id[candidate])
                                  break
                  file.imports = sorted(found)


          def collect_sources(root: Path) -> tuple[list[SourceFile], list[dict]]:
              files: list[SourceFile] = []
              skipped: list[dict] = []

              for relative_text in tracked_paths(root):
                  relative = PurePosixPath(relative_text)
                  include, reason = should_include(relative)
                  absolute = root.joinpath(*relative.parts)

                  if not include:
                      skipped.append({"path": relative.as_posix(), "reason": reason})
                      continue

                  metadata = os.lstat(absolute)
                  if not stat.S_ISREG(metadata.st_mode):
                      skipped.append({"path": relative.as_posix(), "reason": "non-regular"})
                      continue

                  raw = absolute.read_bytes()
                  files.append(
                      SourceFile(
                          id=len(files),
                          path=relative.as_posix(),
                          raw=raw,
                          mode=stat.S_IMODE(metadata.st_mode),
                          sha256=sha256_hex(raw),
                          imports=[],
                          token_histogram=token_histogram(raw),
                      )
                  )

              if not files:
                  raise ManifoldError("no application source files matched the filter")

              resolve_imports(files)
              return files, skipped


          def capacity_bytes(mode: str) -> int:
              if mode == "P2":
                  units = P2_DATA_WIDTH * P2_DATA_HEIGHT
              elif mode == "PR":
                  units = PR_DATA_WIDTH * PR_DATA_HEIGHT
              elif mode == "P0":
                  units = P0_DATA_WIDTH * P0_DATA_HEIGHT
              else:
                  raise ValueError(mode)
              return units * 2 * DATA_BLOCKS_MAX


          def build_manifest(files: list[SourceFile], mode: str, packet_offsets: bool) -> bytes:
              manifest = {
                  "format": "dream-4d-ai-native-rgb-cmy-manifold",
                  "version": 6,
                  "purpose": "Self-describing visual application-code archive for native-resolution AI analysis.",
                  "analysisOrder": [
                      "global 4D file topology and dependency rays",
                      "four repeated corner calibration blocks",
                      "repeated medium-scale block headers and orientation signatures",
                      "fine-scale two-byte color pixels with parity",
                      "manifest and exact application files",
                  ],
                  "equation": {
                      "goldenAngle": GOLDEN_ANGLE,
                      "phi": PHI,
                      "n": GOLDEN_N,
                      "identityResidual": IDENTITY_RESIDUAL,
                  },
                  "visualGrammar": {
                      "canvas": [WIDTH, HEIGHT],
                      "slotGrid": [GRID_COLUMNS, GRID_ROWS],
                      "blockPixels": BLOCK_SIZE,
                      "calibrationCorners": list(CALIBRATION_SLOTS),
                      "pairPixel": "one pixel stores two ordered bytes",
                      "map": "A(v)=(197*v+101) mod 256; R=A(first); G=A(second); B=A(first XOR second XOR A5)",
                      "inverse": "v=13*(A(v)-101) mod 256",
                      "headers": "4x4 cells; center color is primary; one-pixel frame is CMY complement; rotate block until D4AI6 or D4CAL6 is readable",
                      "payload": "row-major primary pixels; parity pixels are CMY complements",
                      "modes": {
                          "P2": "16x16 data groups with row, column, and group parity",
                          "PR": "16-row groups with parity rows",
                          "P0": "direct primary pixels without local parity",
                      },
                      "packet": "DREAM4D6 newline, unsigned big-endian 64-bit manifest length, UTF-8 JSON manifest, raw file bytes",
                  },
                  "mode": mode,
                  "capacityBytes": capacity_bytes(mode),
                  "applicationExtensions": sorted(APPLICATION_EXTENSIONS),
                  "excludedDirectories": sorted(EXCLUDED_DIRECTORIES),
                  "excludedNamePatterns": list(EXCLUDED_NAME_PATTERNS),
                  "fileCount": len(files),
                  "files": [
                      {
                          "id": file.id,
                          "path": file.path,
                          "mode": file.mode,
                          "packetOffset": file.packet_offset if packet_offsets else 0,
                          "length": len(file.raw),
                          "sha256": file.sha256,
                          "imports": file.imports,
                          "tokenHistogram": file.token_histogram,
                      }
                      for file in files
                  ],
              }
              return json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8", "surrogatepass")


          def assemble_packet(files: list[SourceFile], mode: str) -> tuple[bytes, dict]:
              provisional = build_manifest(files, mode, packet_offsets=False)
              content_start = PACKET_PREFIX.size + len(provisional)
              cursor = content_start
              for file in files:
                  file.packet_offset = cursor
                  cursor += len(file.raw)

              manifest = build_manifest(files, mode, packet_offsets=True)
              if len(manifest) != len(provisional):
                  content_start = PACKET_PREFIX.size + len(manifest)
                  cursor = content_start
                  for file in files:
                      file.packet_offset = cursor
                      cursor += len(file.raw)
                  manifest = build_manifest(files, mode, packet_offsets=True)

              packet = bytearray(PACKET_PREFIX.pack(PACKET_MAGIC, len(manifest)))
              packet.extend(manifest)
              for file in files:
                  packet.extend(file.raw)

              descriptor = [
                  {
                      "path": file.path,
                      "mode": file.mode,
                      "length": len(file.raw),
                      "sha256": file.sha256,
                  }
                  for file in files
              ]
              application_root = sha256_hex(
                  json.dumps(descriptor, sort_keys=True, separators=(",", ":")).encode("utf-8")
              )
              return bytes(packet), {
                  "manifestBytes": len(manifest),
                  "packetBytes": len(packet),
                  "applicationRoot": application_root,
                  "packetSha256": sha256_hex(packet),
              }


          def choose_mode(files: list[SourceFile]) -> tuple[str, bytes, dict]:
              for mode in ("P2", "PR", "P0"):
                  packet, report = assemble_packet(files, mode)
                  if len(packet) <= capacity_bytes(mode):
                      return mode, packet, report
              packet, report = assemble_packet(files, "P0")
              raise ManifoldError(
                  "application code exceeds the physical one-image capacity: "
                  f"{len(packet)} bytes required; {capacity_bytes('P0')} bytes available"
              )


          def map_byte(values: np.ndarray | int) -> np.ndarray | int:
              return (np.asarray(values, dtype=np.uint16) * AFFINE_MULTIPLIER + AFFINE_OFFSET).astype(np.uint8)


          def unmap_byte(values: np.ndarray | int) -> np.ndarray | int:
              return ((np.asarray(values, dtype=np.int16) - AFFINE_OFFSET) * AFFINE_INVERSE % 256).astype(np.uint8)


          def pair_to_rgb(first: np.ndarray, second: np.ndarray) -> np.ndarray:
              first_u8 = np.asarray(first, dtype=np.uint8)
              second_u8 = np.asarray(second, dtype=np.uint8)
              parity = np.bitwise_xor(np.bitwise_xor(first_u8, second_u8), np.uint8(PARITY_XOR))
              return np.stack((map_byte(first_u8), map_byte(second_u8), map_byte(parity)), axis=-1).astype(np.uint8)


          def rgb_to_pair(rgb: np.ndarray) -> tuple[np.ndarray, np.ndarray, np.ndarray]:
              decoded = unmap_byte(np.asarray(rgb, dtype=np.uint8))
              first = decoded[..., 0]
              second = decoded[..., 1]
              expected = np.bitwise_xor(np.bitwise_xor(first, second), np.uint8(PARITY_XOR))
              valid = expected == decoded[..., 2]
              return first, second, valid


          def mode_dimensions(mode: str) -> tuple[int, int, int, int, int, int]:
              if mode == "P2":
                  return P2_DATA_WIDTH, P2_DATA_HEIGHT, P2_PHYSICAL_WIDTH, P2_PHYSICAL_HEIGHT, P2_X, P2_Y
              if mode == "PR":
                  return PR_DATA_WIDTH, PR_DATA_HEIGHT, PR_PHYSICAL_WIDTH, PR_PHYSICAL_HEIGHT, PR_X, PR_Y
              if mode == "P0":
                  return P0_DATA_WIDTH, P0_DATA_HEIGHT, P0_PHYSICAL_WIDTH, P0_PHYSICAL_HEIGHT, P0_X, P0_Y
              raise ValueError(mode)


          def data_bytes_per_block(mode: str) -> int:
              width, height, *_ = mode_dimensions(mode)
              return width * height * 2


          def owner_for_offset(files: list[SourceFile], byte_offset: int) -> tuple[int, int]:
              for file in files:
                  if file.packet_offset <= byte_offset < file.packet_offset + len(file.raw):
                      return file.id, (byte_offset - file.packet_offset) // max(1, data_bytes_per_block("P2"))
              return -1, byte_offset // max(1, data_bytes_per_block("P2"))


          def project_4d(x4: float, y4: float, z4: float, w4: float) -> tuple[float, float]:
              denominator_4d = max(0.48, 2.28 - w4)
              x3 = (x4 + 0.30 * z4) / denominator_4d
              y3 = (y4 + 0.22 * z4) / denominator_4d
              z3 = z4 / denominator_4d
              denominator_3d = max(0.58, 2.38 - z3)
              return x3 / denominator_3d, y3 / denominator_3d


          def file_anchor(file: SourceFile, total_files: int) -> tuple[float, float]:
              digest = hashlib.sha256(file.path.encode("utf-8", "surrogateescape") + bytes.fromhex(file.sha256)).digest()
              t = (file.id + 1) / max(2, total_files + 1)
              theta = 2.0 * math.pi * t + GOLDEN_ANGLE * (file.id % 16)
              phase = [2.0 * math.pi * digest[index] / 255.0 for index in (0, 7, 13, 21)]
              size_scale = min(1.0, math.log2(max(2, len(file.raw))) / 22.0)
              degree_scale = min(1.0, len(file.imports) / 12.0)
              x4 = math.cos(theta * GOLDEN_N + phase[0]) * (0.58 + 0.20 * size_scale)
              y4 = math.sin(theta * PHI + phase[1]) * (0.58 + 0.20 * degree_scale)
              z4 = math.cos(theta * (PHI + GOLDEN_N) + phase[2]) * (0.46 + 0.18 * degree_scale)
              w4 = math.sin(theta / GOLDEN_N + phase[3]) * (0.46 + 0.18 * size_scale)
              return project_4d(x4, y4, z4, w4)


          def golden_shell(index: int) -> int:
              shell = 0
              boundary = 1
              while boundary <= index:
                  shell += 1
                  boundary = max(boundary + 1, int(math.floor(GOLDEN_N ** shell)))
              return shell


          def make_blocks(packet: bytes, files: list[SourceFile], mode: str, packet_sha: str) -> list[DataBlock]:
              block_bytes = data_bytes_per_block(mode)
              total = math.ceil(len(packet) / block_bytes)
              if total > DATA_BLOCKS_MAX:
                  raise ManifoldError(f"{total} blocks required; {DATA_BLOCKS_MAX} available")

              anchors = {file.id: file_anchor(file, len(files)) for file in files}
              blocks: list[DataBlock] = []
              for index in range(total):
                  start = index * block_bytes
                  payload = packet[start : start + block_bytes]
                  digest = hashlib.sha256(bytes.fromhex(packet_sha) + index.to_bytes(4, "big") + payload).digest()
                  owner, owner_chunk = owner_for_offset(files, start)
                  if owner >= 0:
                      anchor_x, anchor_y = anchors[owner]
                  else:
                      anchor_x, anchor_y = 0.0, 0.0
                  shell = golden_shell(owner_chunk + 1)
                  phase = 2.0 * math.pi * digest[5] / 255.0
                  radial = 0.025 * shell + 0.014 * owner_chunk
                  target_x = anchor_x + radial * math.cos(GOLDEN_ANGLE * (owner_chunk + 1) + phase)
                  target_y = anchor_y + radial * math.sin(GOLDEN_ANGLE * GOLDEN_N * (owner_chunk + 1) + phase)
                  orientation = int(
                      (
                          index * int(PHI * (1 << 36))
                          + (owner + 2) * int(GOLDEN_N * (1 << 32))
                          + int(GOLDEN_ANGLE * (1 << 40))
                      )
                      >> 11
                  ) & 0x03
                  blocks.append(
                      DataBlock(
                          index=index,
                          byte_start=start,
                          payload=payload,
                          digest=digest,
                          owner_file=owner,
                          owner_chunk=owner_chunk,
                          orientation=orientation,
                          target_x=target_x,
                          target_y=target_y,
                      )
                  )
              return blocks


          def slot_geometry(slot: int) -> tuple[int, int, int, int]:
              row, column = divmod(slot, GRID_COLUMNS)
              left = LEFT_MARGIN + column * PITCH + (PITCH - BLOCK_SIZE) // 2
              top = TOP_MARGIN + row * PITCH + (PITCH - BLOCK_SIZE) // 2
              return left + BLOCK_SIZE // 2, top + BLOCK_SIZE // 2, left, top


          def assign_slots(blocks: list[DataBlock]) -> dict[int, tuple[int, int, int, int]]:
              free = [slot for slot in range(TOTAL_SLOTS) if slot not in CALIBRATION_SLOTS]
              placements: dict[int, tuple[int, int, int, int]] = {}

              for block in sorted(blocks, key=lambda item: (math.hypot(item.target_x, item.target_y), item.index)):
                  pixel_x = WIDTH / 2 + block.target_x * WIDTH * 0.82
                  pixel_y = HEIGHT / 2 + block.target_y * HEIGHT * 0.82
                  best_position = min(
                      range(len(free)),
                      key=lambda position: (
                          (slot_geometry(free[position])[0] - pixel_x) ** 2
                          + (slot_geometry(free[position])[1] - pixel_y) ** 2
                      ),
                  )
                  block.slot = free.pop(best_position)
                  placements[block.index] = slot_geometry(block.slot)
              return placements


          def header_bytes(text: str) -> bytes:
              raw = text.encode("ascii")
              calibration = bytes(range(32)) + bytes((255 - index) for index in range(32))
              output = raw + b"\x00" + calibration
              if len(output) > HEADER_BYTE_CAPACITY:
                  raise ManifoldError(f"header too long: {len(output)} > {HEADER_BYTE_CAPACITY}")
              repeats = (HEADER_BYTE_CAPACITY - len(output) + len(calibration) - 1) // len(calibration)
              return (output + calibration * repeats)[:HEADER_BYTE_CAPACITY]


          def render_header(image_array: np.ndarray, text: str) -> None:
              raw = header_bytes(text)
              pairs = np.frombuffer(raw, dtype=np.uint8).reshape(-1, 2)
              colors = pair_to_rgb(pairs[:, 0], pairs[:, 1]).reshape(HEADER_ROWS, HEADER_COLUMNS, 3)
              for row in range(HEADER_ROWS):
                  for column in range(HEADER_COLUMNS):
                      color = colors[row, column]
                      complement = 255 - color
                      left = HEADER_X + column * HEADER_CELL
                      top = HEADER_Y + row * HEADER_CELL
                      image_array[top : top + HEADER_CELL, left : left + HEADER_CELL, :] = complement
                      image_array[top + 1 : top + 3, left + 1 : left + 3, :] = color


          def payload_pairs(payload: bytes, width: int, height: int, seed: bytes) -> np.ndarray:
              required = width * height * 2
              raw = bytearray(payload)
              counter = 0
              while len(raw) < required:
                  raw.extend(hashlib.sha256(seed + counter.to_bytes(4, "big")).digest())
                  counter += 1
              return np.frombuffer(bytes(raw[:required]), dtype=np.uint8).reshape(height, width, 2)


          def render_payload_matrix(pairs: np.ndarray, mode: str) -> np.ndarray:
              data_height, data_width = pairs.shape[:2]
              if mode == "P2":
                  physical = np.zeros((P2_PHYSICAL_HEIGHT, P2_PHYSICAL_WIDTH, 3), dtype=np.uint8)
                  for y in range(data_height):
                      py = y + y // 16
                      for x in range(data_width):
                          px = x + x // 16
                          physical[py, px] = pair_to_rgb(pairs[y, x, 0], pairs[y, x, 1])
                  for group_y in range(data_height // 16):
                      y0 = group_y * 16
                      parity_y = group_y * 17 + 16
                      for x in range(data_width):
                          px = x + x // 16
                          first = np.bitwise_xor.reduce(pairs[y0 : y0 + 16, x, 0])
                          second = np.bitwise_xor.reduce(pairs[y0 : y0 + 16, x, 1])
                          physical[parity_y, px] = 255 - pair_to_rgb(first, second)
                  for group_x in range(data_width // 16):
                      x0 = group_x * 16
                      parity_x = group_x * 17 + 16
                      for y in range(data_height):
                          py = y + y // 16
                          first = np.bitwise_xor.reduce(pairs[y, x0 : x0 + 16, 0])
                          second = np.bitwise_xor.reduce(pairs[y, x0 : x0 + 16, 1])
                          physical[py, parity_x] = 255 - pair_to_rgb(first, second)
                  for group_y in range(data_height // 16):
                      for group_x in range(data_width // 16):
                          block = pairs[group_y * 16 : group_y * 16 + 16, group_x * 16 : group_x * 16 + 16]
                          first = np.bitwise_xor.reduce(block[..., 0].reshape(-1))
                          second = np.bitwise_xor.reduce(block[..., 1].reshape(-1))
                          physical[group_y * 17 + 16, group_x * 17 + 16] = 255 - pair_to_rgb(first, second)
                  return physical

              if mode == "PR":
                  physical = np.zeros((PR_PHYSICAL_HEIGHT, PR_PHYSICAL_WIDTH, 3), dtype=np.uint8)
                  for y in range(data_height):
                      py = y + y // 16
                      physical[py, :, :] = pair_to_rgb(pairs[y, :, 0], pairs[y, :, 1])
                  for group_y in range(data_height // 16):
                      y0 = group_y * 16
                      first = np.bitwise_xor.reduce(pairs[y0 : y0 + 16, :, 0], axis=0)
                      second = np.bitwise_xor.reduce(pairs[y0 : y0 + 16, :, 1], axis=0)
                      physical[group_y * 17 + 16, :, :] = 255 - pair_to_rgb(first, second)
                  return physical

              if mode == "P0":
                  return pair_to_rgb(pairs[:, :, 0], pairs[:, :, 1])

              raise ValueError(mode)


          def anchor_color(first: int, second: int) -> tuple[int, int, int]:
              return tuple(int(value) for value in pair_to_rgb(np.uint8(first), np.uint8(second)))


          def render_block(
              header: str,
              payload: bytes,
              mode: str,
              orientation: int,
              seed: bytes,
          ) -> Image.Image:
              array = np.zeros((BLOCK_SIZE, BLOCK_SIZE, 3), dtype=np.uint8)
              array[:, :, :] = (8, 12, 20)
              render_header(array, header)
              data_width, data_height, physical_width, physical_height, data_x, data_y = mode_dimensions(mode)
              pairs = payload_pairs(payload, data_width, data_height, seed)
              matrix = render_payload_matrix(pairs, mode)
              array[data_y : data_y + physical_height, data_x : data_x + physical_width, :] = matrix

              anchors = (
                  (anchor_color(0x00, 0xFF), 0, 0),
                  (anchor_color(0x55, 0xAA), BLOCK_SIZE - 6, 0),
                  (anchor_color(0x33, 0xCC), 0, BLOCK_SIZE - 6),
                  (anchor_color(0x0F, 0xF0), BLOCK_SIZE - 6, BLOCK_SIZE - 6),
              )
              for color, left, top in anchors:
                  array[top : top + 6, left : left + 6, :] = color

              image = Image.fromarray(array, "RGB")
              if orientation == 1:
                  image = image.transpose(Image.Transpose.ROTATE_90)
              elif orientation == 2:
                  image = image.transpose(Image.Transpose.ROTATE_180)
              elif orientation == 3:
                  image = image.transpose(Image.Transpose.ROTATE_270)
              return image


          def calibration_payload(kind: int, mode: str) -> bytes:
              width, height, *_ = mode_dimensions(mode)
              pairs = np.zeros((height, width, 2), dtype=np.uint8)
              flat = pairs.reshape(-1, 2)
              if kind == 0:
                  for index in range(len(flat)):
                      flat[index] = (index & 0xFF, 0)
              elif kind == 1:
                  for index in range(len(flat)):
                      flat[index] = (0, index & 0xFF)
              elif kind == 2:
                  sequence = b"DREAM4D6\n0123456789ABCDEF\n{}[]()<>+-=*/&|!?:;,.`'\"_$\n"
                  repeated = (sequence * ((len(flat) * 2 + len(sequence) - 1) // len(sequence)))[: len(flat) * 2]
                  return repeated
              else:
                  for y in range(height):
                      for x in range(width):
                          pairs[y, x] = ((x * 17 + y) & 0xFF, (y * 29 + x) & 0xFF)
              return pairs.tobytes()


          def render_calibration_block(kind: int, mode: str, archive_sha: str) -> Image.Image:
              header = (
                  f"D4CAL6|K={kind}|M={mode}|A=197,101,13|X=A5|"
                  f"PAIR=R:first,G:second,B:first^second^A5|S={archive_sha[:16]}|"
              )
              return render_block(
                  header,
                  calibration_payload(kind, mode),
                  mode,
                  kind % 4,
                  bytes.fromhex(archive_sha) + bytes([kind]),
              )


          def block_header(block: DataBlock, total: int, mode: str, packet_length: int, packet_sha: str) -> str:
              crc = zlib.crc32(block.payload) & 0xFFFFFFFF
              return (
                  f"D4AI6|I={block.index:06X}|T={total:06X}|M={mode}|"
                  f"B={block.byte_start:010X}|N={len(block.payload):06X}|"
                  f"F={block.owner_file + 1:06X}|C={block.owner_chunk:06X}|"
                  f"O={block.orientation}|R={crc:08X}|P={packet_length:010X}|S={packet_sha[:16]}|"
              )


          def extension_walsh(files: list[SourceFile]) -> list[int]:
              counts = [0] * 16
              for file in files:
                  bucket = hashlib.sha256(PurePosixPath(file.path).suffix.lower().encode("utf-8")).digest()[0] & 0x0F
                  counts[bucket] += 1
              output = counts[:]
              stride = 1
              while stride < 16:
                  for start in range(0, 16, 2 * stride):
                      for offset in range(stride):
                          a = output[start + offset]
                          b = output[start + offset + stride]
                          output[start + offset] = a + b
                          output[start + offset + stride] = a - b
                  stride *= 2
              return output


          def render_background(files: list[SourceFile], application_root: str) -> Image.Image:
              low_width = WIDTH // 4
              low_height = HEIGHT // 4
              x = np.linspace(-1.0, 1.0, low_width, dtype=np.float32)[None, :]
              y = np.linspace(-1.0, 1.0, low_height, dtype=np.float32)[:, None]
              radius = np.sqrt(x * x + y * y)
              theta = np.arctan2(y, x)
              digest = hashlib.sha256(application_root.encode("ascii")).digest()
              phases = [2.0 * math.pi * digest[index] / 255.0 for index in (0, 7, 13, 21)]
              walsh = extension_walsh(files)
              scale = max(1, max(abs(value) for value in walsh[1:] or [1]))
              sectors = np.mod(np.floor((theta + math.pi) / (2.0 * math.pi / 16.0)).astype(np.int32), 16)
              bias = np.asarray([value / scale for value in walsh], dtype=np.float32)[sectors]

              x4 = np.cos(theta * PHI + phases[0]) * (0.58 + 0.24 * np.cos(theta * GOLDEN_N + phases[2]))
              y4 = np.sin(theta * GOLDEN_N + phases[1]) * (0.58 + 0.24 * np.sin(theta * PHI + phases[3]))
              z4 = np.cos(radius * math.pi * PHI + phases[2]) * (0.46 + 0.18 * bias)
              w4 = np.sin(radius * math.pi * GOLDEN_N + phases[3]) * (0.46 + 0.18 * bias)
              denominator_4d = np.maximum(0.5, 2.25 - w4)
              x3 = (x4 + 0.30 * z4) / denominator_4d
              y3 = (y4 + 0.22 * z4) / denominator_4d
              z3 = z4 / denominator_4d
              denominator_3d = np.maximum(0.6, 2.35 - z3)
              projection = np.sqrt((x3 / denominator_3d) ** 2 + (y3 / denominator_3d) ** 2)
              ray = 0.5 + 0.5 * np.cos(5.0 * theta + phases[0])
              opposite = 0.5 + 0.5 * np.cos(10.0 * theta + phases[1] + radius * math.pi)
              shell = np.exp(-3.6 * radius * radius)
              ribbon = np.exp(-18.0 * np.abs(projection - (0.12 + 0.42 * ray)))
              red = np.clip(5 + 46 * shell + 70 * ribbon + 42 * np.maximum(0.0, bias), 0, 255)
              green = np.clip(8 + 52 * opposite + 48 * shell + 30 * np.maximum(0.0, -bias), 0, 255)
              blue = np.clip(14 + 74 * ray + 68 * ribbon + 32 * np.abs(bias), 0, 255)
              array = np.stack((red, green, blue), axis=2).astype(np.uint8)
              return Image.fromarray(array, "RGB").resize((WIDTH, HEIGHT), Image.Resampling.BICUBIC)


          def draw_global_semantics(
              image: Image.Image,
              files: list[SourceFile],
              blocks: list[DataBlock],
              placements: dict[int, tuple[int, int, int, int]],
          ) -> None:
              draw = ImageDraw.Draw(image, "RGBA")
              first_block_by_file: dict[int, DataBlock] = {}
              for block in blocks:
                  if block.owner_file >= 0 and block.owner_file not in first_block_by_file:
                      first_block_by_file[block.owner_file] = block

              center = (WIDTH // 2, HEIGHT // 2)
              for file in files:
                  block = first_block_by_file.get(file.id)
                  if block is None:
                      continue
                  x, y, _, _ = placements[block.index]
                  digest = hashlib.sha256(file.path.encode("utf-8", "surrogateescape") + bytes.fromhex(file.sha256)).digest()
                  rgb = (80 + digest[0] % 176, 80 + digest[7] % 176, 80 + digest[13] % 176, 72)
                  cmy = (255 - rgb[0], 255 - rgb[1], 255 - rgb[2], 56)
                  draw.line((center[0], center[1], x, y), fill=rgb, width=8)
                  phase_x = int(8 * math.cos(GOLDEN_ANGLE * (file.id + 1)))
                  phase_y = int(8 * math.sin(GOLDEN_ANGLE * (file.id + 1)))
                  draw.line((center[0] + phase_x, center[1] + phase_y, x + phase_x, y + phase_y), fill=cmy, width=4)

              for file in files:
                  source_block = first_block_by_file.get(file.id)
                  if source_block is None:
                      continue
                  source_x, source_y, _, _ = placements[source_block.index]
                  for target_id in file.imports:
                      target_block = first_block_by_file.get(target_id)
                      if target_block is None:
                          continue
                      target_x, target_y, _, _ = placements[target_block.index]
                      digest = hashlib.sha256(f"{file.id}:{target_id}".encode("ascii")).digest()
                      color = (96 + digest[0] % 160, 96 + digest[5] % 160, 96 + digest[11] % 160, 46)
                      draw.line((source_x, source_y, target_x, target_y), fill=color, width=3)


          def border_semantics(image: Image.Image, block: DataBlock, file: SourceFile | None) -> None:
              draw = ImageDraw.Draw(image, "RGBA")
              if file is None:
                  histogram = {key: 1 for key in ("keyword", "identifier", "string", "comment", "operator", "delimiter", "number", "whitespace")}
              else:
                  histogram = file.token_histogram
              categories = ("keyword", "identifier", "string", "comment", "operator", "delimiter", "number", "whitespace")
              palette = (
                  (255, 91, 116, 220), (91, 192, 255, 220), (255, 202, 91, 220), (91, 255, 150, 220),
                  (196, 91, 255, 220), (91, 255, 241, 220), (255, 133, 91, 220), (190, 198, 214, 200),
              )
              total = max(1, sum(histogram.get(category, 0) for category in categories))
              cursor = 6
              usable = BLOCK_SIZE - 12
              for category, color in zip(categories, palette):
                  length = max(1, int(round(usable * histogram.get(category, 0) / total)))
                  draw.line((cursor, BLOCK_SIZE - 2, min(BLOCK_SIZE - 6, cursor + length), BLOCK_SIZE - 2), fill=color, width=3)
                  cursor += length
                  if cursor >= BLOCK_SIZE - 6:
                      break


          def build_image(root: Path, output: Path, audit_path: Path | None) -> dict:
              files, skipped = collect_sources(root)
              mode, packet, packet_report = choose_mode(files)
              blocks = make_blocks(packet, files, mode, packet_report["packetSha256"])
              placements = assign_slots(blocks)
              image = render_background(files, packet_report["applicationRoot"])
              draw_global_semantics(image, files, blocks, placements)

              for kind, slot in enumerate(CALIBRATION_SLOTS):
                  _, _, left, top = slot_geometry(slot)
                  image.paste(render_calibration_block(kind, mode, packet_report["packetSha256"]), (left, top))

              files_by_id = {file.id: file for file in files}
              for block in blocks:
                  _, _, left, top = placements[block.index]
                  rendered = render_block(
                      block_header(block, len(blocks), mode, len(packet), packet_report["packetSha256"]),
                      block.payload,
                      mode,
                      block.orientation,
                      block.digest,
                  )
                  border_semantics(rendered, block, files_by_id.get(block.owner_file))
                  image.paste(rendered, (left, top))

              output.parent.mkdir(parents=True, exist_ok=True)
              image.save(output, "PNG", compress_level=6, optimize=False)

              result = {
                  "artifact": str(output),
                  "width": WIDTH,
                  "height": HEIGHT,
                  "megapixels": WIDTH * HEIGHT / 1_000_000,
                  "mode": mode,
                  "includedApplicationFiles": len(files),
                  "excludedTrackedFiles": len(skipped),
                  "packetBytes": len(packet),
                  "capacityBytes": capacity_bytes(mode),
                  "dataBlocks": len(blocks),
                  "calibrationBlocks": len(CALIBRATION_SLOTS),
                  "applicationRoot": packet_report["applicationRoot"],
                  "packetSha256": packet_report["packetSha256"],
                  "phi": PHI,
                  "n": GOLDEN_N,
                  "goldenAngle": GOLDEN_ANGLE,
                  "identityResidual": IDENTITY_RESIDUAL,
              }
              if audit_path is not None:
                  audit = {
                      **result,
                      "included": [file.path for file in files],
                      "excluded": skipped,
                  }
                  audit_path.parent.mkdir(parents=True, exist_ok=True)
                  audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True), encoding="utf-8")
              return result


          def decode_header_from_block(block: Image.Image) -> str | None:
              array = np.asarray(block.convert("RGB"), dtype=np.uint8)
              pairs = []
              for row in range(HEADER_ROWS):
                  for column in range(HEADER_COLUMNS):
                      x = HEADER_X + column * HEADER_CELL + 2
                      y = HEADER_Y + row * HEADER_CELL + 2
                      first, second, valid = rgb_to_pair(array[y, x])
                      if not bool(valid):
                          return None
                      pairs.extend((int(first), int(second)))
              raw = bytes(pairs)
              return raw.split(b"\x00", 1)[0].decode("ascii", "ignore")


          def parse_header(text: str) -> dict[str, str]:
              parts = text.split("|")
              output = {"magic": parts[0] if parts else ""}
              for part in parts[1:]:
                  if "=" in part:
                      key, value = part.split("=", 1)
                      output[key] = value
              return output


          def canonical_block_and_header(block: Image.Image) -> tuple[Image.Image, dict[str, str]] | None:
              candidates = [
                  block,
                  block.transpose(Image.Transpose.ROTATE_90),
                  block.transpose(Image.Transpose.ROTATE_180),
                  block.transpose(Image.Transpose.ROTATE_270),
              ]
              for candidate in candidates:
                  text = decode_header_from_block(candidate)
                  if text and (text.startswith("D4AI6|") or text.startswith("D4CAL6|")):
                      return candidate, parse_header(text)
              return None


          def decode_payload_matrix(block: Image.Image, mode: str, byte_count: int) -> bytes:
              array = np.asarray(block.convert("RGB"), dtype=np.uint8)
              data_width, data_height, _, _, data_x, data_y = mode_dimensions(mode)
              pairs = np.empty((data_height, data_width, 2), dtype=np.uint8)
              for y in range(data_height):
                  if mode in {"P2", "PR"}:
                      py = data_y + y + y // 16
                  else:
                      py = data_y + y
                  for x in range(data_width):
                      if mode == "P2":
                          px = data_x + x + x // 16
                      else:
                          px = data_x + x
                      first, second, valid = rgb_to_pair(array[py, px])
                      if not bool(valid):
                          raise ManifoldError(f"payload pixel parity failed at {x},{y}")
                      pairs[y, x] = (first, second)
              return pairs.tobytes()[:byte_count]


          def verify_image(image_path: Path) -> dict:
              with Image.open(image_path) as source:
                  if source.size != (WIDTH, HEIGHT):
                      raise ManifoldError(f"unexpected image size: {source.size}")
                  image = source.convert("RGB")

              decoded_blocks: dict[int, bytes] = {}
              packet_length = None
              total_blocks = None
              packet_sha_prefix = None
              mode = None
              calibration_found = 0

              for slot in range(TOTAL_SLOTS):
                  _, _, left, top = slot_geometry(slot)
                  crop = image.crop((left, top, left + BLOCK_SIZE, top + BLOCK_SIZE))
                  decoded = canonical_block_and_header(crop)
                  if decoded is None:
                      continue
                  canonical, header = decoded
                  if header["magic"] == "D4CAL6":
                      calibration_found += 1
                      continue
                  if header["magic"] != "D4AI6":
                      continue
                  index = int(header["I"], 16)
                  total = int(header["T"], 16)
                  current_mode = header["M"]
                  count = int(header["N"], 16)
                  current_packet_length = int(header["P"], 16)
                  payload = decode_payload_matrix(canonical, current_mode, count)
                  crc = zlib.crc32(payload) & 0xFFFFFFFF
                  if crc != int(header["R"], 16):
                      raise ManifoldError(f"CRC mismatch in block {index}")
                  decoded_blocks[index] = payload
                  total_blocks = total if total_blocks is None else total_blocks
                  packet_length = current_packet_length if packet_length is None else packet_length
                  packet_sha_prefix = header["S"] if packet_sha_prefix is None else packet_sha_prefix
                  mode = current_mode if mode is None else mode

              if calibration_found != len(CALIBRATION_SLOTS):
                  raise ManifoldError(f"expected {len(CALIBRATION_SLOTS)} calibration blocks, found {calibration_found}")
              if total_blocks is None or len(decoded_blocks) != total_blocks:
                  raise ManifoldError(f"decoded {len(decoded_blocks)} of {total_blocks} data blocks")

              packet = b"".join(decoded_blocks[index] for index in range(total_blocks))[:packet_length]
              if sha256_hex(packet)[:16] != packet_sha_prefix:
                  raise ManifoldError("packet SHA-256 prefix mismatch")
              if len(packet) < PACKET_PREFIX.size:
                  raise ManifoldError("packet is truncated")
              magic, manifest_length = PACKET_PREFIX.unpack(packet[: PACKET_PREFIX.size])
              if magic != PACKET_MAGIC:
                  raise ManifoldError("packet magic mismatch")
              manifest_start = PACKET_PREFIX.size
              manifest_end = manifest_start + manifest_length
              manifest = json.loads(packet[manifest_start:manifest_end].decode("utf-8", "surrogatepass"))
              for entry in manifest["files"]:
                  start = int(entry["packetOffset"])
                  end = start + int(entry["length"])
                  if sha256_hex(packet[start:end]) != entry["sha256"]:
                      raise ManifoldError(f"file hash mismatch: {entry['path']}")

              return {
                  "valid": True,
                  "mode": mode,
                  "calibrationBlocks": calibration_found,
                  "dataBlocks": total_blocks,
                  "packetBytes": len(packet),
                  "fileCount": len(manifest["files"]),
                  "packetSha256": sha256_hex(packet),
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              commands = parser.add_subparsers(dest="command", required=True)

              build_parser = commands.add_parser("build")
              build_parser.add_argument("--root", type=Path, required=True)
              build_parser.add_argument("--output", type=Path, required=True)
              build_parser.add_argument("--audit", type=Path)

              verify_parser = commands.add_parser("verify")
              verify_parser.add_argument("--image", type=Path, required=True)

              args = parser.parse_args()
              if args.command == "build":
                  result = build_image(args.root.resolve(), args.output.resolve(), args.audit.resolve() if args.audit else None)
              else:
                  result = verify_image(args.image.resolve())
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (ManifoldError, OSError, ValueError, KeyError, json.JSONDecodeError) as error:
                  print(f"DREAM manifold failed: {error}", file=sys.stderr)
                  raise SystemExit(2)

          PY
          python -m py_compile "$RUNNER_TEMP/build_dream_ai_manifold.py"

      - name: Build the 24 MP manifold PNG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/dream-ai-manifold-output"
          mkdir -p "$GITHUB_WORKSPACE/dream-ai-manifold-output"

          python "$RUNNER_TEMP/build_dream_ai_manifold.py" build \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/dream-ai-manifold-output/DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD.png" \
            --audit "$RUNNER_TEMP/dream-ai-manifold-audit.json" \
            | tee "$RUNNER_TEMP/dream-ai-manifold-build.json"

      - name: Prove image-only reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/build_dream_ai_manifold.py" verify \
            --image "$GITHUB_WORKSPACE/dream-ai-manifold-output/DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD.png" \
            | tee "$RUNNER_TEMP/dream-ai-manifold-verify.json"

      - name: Publish rigorous build summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## DREAM AI-Native 4D RGB/CMY Application Manifold"
            echo
            echo "### Build"
            echo '```json'
            cat "$RUNNER_TEMP/dream-ai-manifold-build.json"
            echo '```'
            echo
            echo "### Image-only verification"
            echo '```json'
            cat "$RUNNER_TEMP/dream-ai-manifold-verify.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the one-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD
          path: dream-ai-manifold-output/DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
