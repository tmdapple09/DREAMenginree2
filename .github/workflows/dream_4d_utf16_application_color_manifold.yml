name: DREAM Self-Describing 4D RGB-CMY Application Manifold
run-name: DREAM Self-Describing 4D RGB-CMY Application Manifold

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-self-describing-4d-rgb-cmy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer runtime
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "Pillow>=10,<13" \
            "numpy>=2,<3"

      - name: Build the 24 MP self-describing manifold
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/dream-self-describing-output"

          cat > "$RUNNER_TEMP/build_manifold.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import re
          import stat
          import subprocess
          import zlib
          from pathlib import Path, PurePosixPath

          import numpy as np
          from PIL import Image, ImageDraw


          W, H = 4284, 5712

          COLS = 16
          ROWS = 22
          PITCH = 256
          BLOCK = 252

          PAIR_COLS = BLOCK // 2
          PAIR_CAP = PAIR_COLS * BLOCK

          HEAD = 96
          PAY = PAIR_CAP - HEAD

          LEGENDS = 3
          SLOTS = COLS * ROWS
          MAX_BLOCKS = SLOTS - LEGENDS

          LEFT = (W - COLS * PITCH) // 2
          TOP = (H - ROWS * PITCH) // 2


          GOLDEN_ANGLE = math.pi / 5.0

          OMEGA = complex(
              math.cos(GOLDEN_ANGLE),
              math.sin(GOLDEN_ANGLE),
          )

          PHI = float(
              (OMEGA + OMEGA.conjugate()).real
          )

          GOLDEN_N = float(
              (
                  PHI
                  + math.sqrt(
                      PHI * PHI + 4.0
                  )
              )
              / 2.0
          )

          IDENTITY_RESIDUAL = abs(
              GOLDEN_N
              - 1.0 / GOLDEN_N
              - PHI
          )

          if IDENTITY_RESIDUAL > 1.0e-12:
              raise RuntimeError(
                  "golden identity invariant failed"
              )


          APPLICATION_EXTENSIONS = {
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
              ".mjs",
              ".cjs",
              ".css",
              ".scss",
              ".sass",
              ".less",
              ".html",
              ".htm",
              ".vue",
              ".svelte",
              ".astro",
              ".graphql",
              ".gql",
              ".prisma",
          }


          EXCLUDED_DIRECTORIES = {
              ".git",
              ".github",
              ".circleci",
              ".husky",
              ".vscode",
              ".idea",
              "ci",
              "cd",
              "docs",
              "doc",
              "documentation",
              "test",
              "tests",
              "__tests__",
              "spec",
              "specs",
              "e2e",
              "cypress",
              "playwright",
              "fixtures",
              "mocks",
              "stories",
              "storybook",
              "coverage",
              "dist",
              "build",
              "out",
              ".next",
              "node_modules",
              "vendor",
              "generated",
              "public",
              "scripts",
              "tools",
              "bench",
              "benchmarks",
          }


          EXCLUDED_NAMES = tuple(
              re.compile(
                  pattern,
                  re.IGNORECASE,
              )
              for pattern in (
                  r"\.test\.",
                  r"\.spec\.",
                  r"\.stories?\.",
                  r"\.story\.",
                  r"\.mock\.",
                  r"\.fixture\.",
                  r"\.bench(mark)?\.",
                  r"\.config\.",
                  r"\.setup\.",
              )
          )


          CHANNEL_PERMUTATIONS = (
              (0, 1, 2),
              (0, 2, 1),
              (1, 0, 2),
              (1, 2, 0),
              (2, 0, 1),
              (2, 1, 0),
          )


          def git_paths(
              root: Path,
          ) -> list[str]:
              result = subprocess.run(
                  [
                      "git",
                      "-C",
                      str(root),
                      "ls-files",
                      "-z",
                      "--recurse-submodules",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              )

              paths = sorted(
                  set(
                      item.decode(
                          "utf-8",
                          "surrogateescape",
                      )
                      for item
                      in result.stdout.split(b"\0")
                      if item
                  )
              )

              if not paths:
                  raise RuntimeError(
                      "git reported no tracked paths"
                  )

              return paths


          def allowed(
              path: PurePosixPath,
          ) -> tuple[bool, str]:
              for part in path.parts[:-1]:
                  if (
                      part.lower()
                      in EXCLUDED_DIRECTORIES
                  ):
                      return (
                          False,
                          f"directory:{part}",
                      )

              if any(
                  regex.search(
                      path.name.lower()
                  )
                  for regex in EXCLUDED_NAMES
              ):
                  return (
                      False,
                      f"filename:{path.name}",
                  )

              if (
                  path.suffix.lower()
                  not in APPLICATION_EXTENSIONS
              ):
                  return (
                      False,
                      "extension:"
                      f"{path.suffix or '(none)'}",
                  )

              return (
                  True,
                  "application-source",
              )


          def utf16_units(
              text: str,
          ) -> np.ndarray:
              encoded = text.encode(
                  "utf-16-be",
                  "surrogatepass",
              )

              return np.frombuffer(
                  encoded,
                  dtype=">u2",
              ).astype(
                  np.uint16,
                  copy=False,
              )


          def collect_sources(
              root: Path,
          ) -> tuple[list[dict], list[dict]]:
              files: list[dict] = []
              skipped: list[dict] = []

              for name in git_paths(root):
                  relative = PurePosixPath(name)
                  include, reason = allowed(
                      relative
                  )
                  absolute = root.joinpath(
                      *relative.parts
                  )

                  if not include:
                      skipped.append(
                          {
                              "path": (
                                  relative.as_posix()
                              ),
                              "reason": reason,
                          }
                      )
                      continue

                  metadata = os.lstat(
                      absolute
                  )

                  if not stat.S_ISREG(
                      metadata.st_mode
                  ):
                      skipped.append(
                          {
                              "path": (
                                  relative.as_posix()
                              ),
                              "reason": (
                                  "non-regular"
                              ),
                          }
                      )
                      continue

                  raw = absolute.read_bytes()

                  text = raw.decode(
                      "utf-8",
                      "surrogateescape",
                  )

                  files.append(
                      {
                          "path": (
                              relative.as_posix()
                          ),
                          "mode": stat.S_IMODE(
                              metadata.st_mode
                          ),
                          "raw": raw,
                          "text": text,
                          "units": len(
                              text.encode(
                                  "utf-16-be",
                                  "surrogatepass",
                              )
                          )
                          // 2,
                          "sha256": (
                              hashlib.sha256(
                                  raw
                              ).hexdigest()
                          ),
                      }
                  )

              if not files:
                  raise RuntimeError(
                      "no application source "
                      "files matched"
                  )

              return files, skipped


          def build_archive(
              files: list[dict],
          ) -> tuple[
              np.ndarray,
              dict,
              bytes,
          ]:
              offset = 0
              entries: list[dict] = []
              contents: list[str] = []

              for source in files:
                  entries.append(
                      {
                          "path": source["path"],
                          "mode": source["mode"],
                          "encoding": (
                              "utf-8-surrogateescape"
                          ),
                          "byteLength": len(
                              source["raw"]
                          ),
                          "utf16Offset": offset,
                          "utf16Length": (
                              source["units"]
                          ),
                          "sha256": (
                              source["sha256"]
                          ),
                      }
                  )

                  contents.append(
                      source["text"]
                  )

                  offset += source["units"]

              descriptor = json.dumps(
                  [
                      {
                          "path": entry["path"],
                          "mode": entry["mode"],
                          "byteLength": (
                              entry["byteLength"]
                          ),
                          "sha256": (
                              entry["sha256"]
                          ),
                      }
                      for entry in entries
                  ],
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode(
                  "utf-8",
                  "surrogatepass",
              )

              application_root = (
                  hashlib.sha256(
                      descriptor
                  ).hexdigest()
              )

              manifest = {
                  "format": (
                      "dream-4d-self-describing-"
                      "rgb-cmy-utf16-manifold"
                  ),
                  "version": 3,
                  "equation": {
                      "goldenAngle": (
                          GOLDEN_ANGLE
                      ),
                      "phi": PHI,
                      "n": GOLDEN_N,
                      "identityResidual": (
                          IDENTITY_RESIDUAL
                      ),
                  },
                  "grammar": {
                      "legend": (
                          "three fixed upper-left "
                          "blocks enumerate UTF-16 "
                          "0000 through FFFF"
                      ),
                      "symbol": (
                          "one UTF-16 unit per "
                          "adjacent RGB/CMY pair"
                      ),
                      "canonicalRGB": (
                          "R=highByte,"
                          "G=lowByte,"
                          "B=highByte XOR lowByte"
                      ),
                      "canonicalCMY": (
                          "255-R,255-G,255-B"
                      ),
                      "blockHeader": (
                          "first 96 canonical "
                          "pairs; rotate until "
                          "D4B3 is readable"
                      ),
                      "payloadTransform": (
                          "undo header channel "
                          "permutation and XOR mask"
                      ),
                      "blockOrder": (
                          "I field in each header"
                      ),
                      "archivePrefix": (
                          "DREAM4D3 newline, "
                          "16 hexadecimal manifest "
                          "unit count, newline"
                      ),
                      "fileRecovery": (
                          "decode UTF-16 using "
                          "surrogatepass, then "
                          "encode each file using "
                          "UTF-8 surrogateescape"
                      ),
                  },
                  "canvas": {
                      "width": W,
                      "height": H,
                      "columns": COLS,
                      "rows": ROWS,
                      "pitch": PITCH,
                      "blockPixels": BLOCK,
                      "payloadUnits": PAY,
                  },
                  "extensions": sorted(
                      APPLICATION_EXTENSIONS
                  ),
                  "excludedDirectories": sorted(
                      EXCLUDED_DIRECTORIES
                  ),
                  "fileCount": len(entries),
                  "applicationRoot": (
                      application_root
                  ),
                  "contentUtf16Units": offset,
                  "files": entries,
              }

              manifest_text = json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

              prefix = (
                  "DREAM4D3\n"
                  f"{len(utf16_units(manifest_text)):016X}"
                  "\n"
              )

              archive_text = (
                  prefix
                  + manifest_text
                  + "".join(contents)
              )

              units = utf16_units(
                  archive_text
              )

              archive_sha = hashlib.sha256(
                  units.astype(
                      ">u2",
                      copy=False,
                  ).tobytes()
              ).digest()

              return (
                  units,
                  manifest,
                  archive_sha,
              )


          def walsh16(
              values: list[int],
          ) -> list[int]:
              output = list(
                  map(int, values)
              )
              stride = 1

              while stride < 16:
                  for start in range(
                      0,
                      16,
                      2 * stride,
                  ):
                      for offset in range(
                          stride
                      ):
                          left = output[
                              start + offset
                          ]
                          right = output[
                              start
                              + offset
                              + stride
                          ]

                          output[
                              start + offset
                          ] = left + right

                          output[
                              start
                              + offset
                              + stride
                          ] = left - right

                  stride *= 2

              return output


          def golden_schedule(
              total: int,
          ) -> list[int]:
              output: list[int] = []
              previous = 0
              exponent = 0

              while previous < total:
                  previous = max(
                      previous + 1,
                      int(
                          math.floor(
                              GOLDEN_N
                              ** exponent
                          )
                      ),
                  )

                  output.append(
                      previous
                  )
                  exponent += 1

              return output


          def make_blocks(
              units: np.ndarray,
              archive_sha: bytes,
          ):
              total = math.ceil(
                  len(units) / PAY
              )

              if total > MAX_BLOCKS:
                  raise RuntimeError(
                      "application source too large: "
                      f"{len(units)} UTF-16 units "
                      "required, "
                      f"{MAX_BLOCKS * PAY} "
                      "available"
                  )

              blocks: list[dict] = []

              for index in range(total):
                  part = units[
                      index * PAY:
                      (index + 1) * PAY
                  ].copy()

                  digest = hashlib.sha256(
                      archive_sha
                      + index.to_bytes(
                          4,
                          "big",
                      )
                      + part.astype(
                          ">u2",
                          copy=False,
                      ).tobytes()
                  ).digest()

                  blocks.append(
                      {
                          "index": index,
                          "units": part,
                          "digest": digest,
                          "cell": digest[0] & 15,
                          "degree": 0,
                      }
                  )

              edges: set[
                  tuple[int, int]
              ] = set()

              if total > 1:
                  for block in blocks:
                      for position in (
                          1,
                          9,
                      ):
                          hop = (
                              1
                              + int.from_bytes(
                                  block["digest"][
                                      position:
                                      position + 4
                                  ],
                                  "big",
                              )
                              % (total - 1)
                          )

                          partner = (
                              block["index"]
                              + hop
                          ) % total

                          if (
                              partner
                              != block["index"]
                          ):
                              edges.add(
                                  tuple(
                                      sorted(
                                          (
                                              block[
                                                  "index"
                                              ],
                                              partner,
                                          )
                                      )
                                  )
                              )

              for left, right in edges:
                  blocks[left]["degree"] += 1
                  blocks[right]["degree"] += 1

              cell_counts = [0] * 16

              for block in blocks:
                  cell_counts[
                      block["cell"]
                  ] += 1

              walsh = walsh16(
                  cell_counts
              )

              walsh_scale = max(
                  1,
                  max(
                      abs(value)
                      for value
                      in walsh[1:]
                  ),
              )

              maximum_degree = max(
                  [
                      block["degree"]
                      for block in blocks
                  ]
                  or [1]
              )

              schedule = golden_schedule(
                  total
              )

              for block in blocks:
                  shell = 0

                  while (
                      shell
                      < len(schedule) - 1
                      and block["index"]
                      >= schedule[shell]
                  ):
                      shell += 1

                  t = (
                      block["index"] + 0.5
                  ) / max(1, total)

                  theta = (
                      2.0 * math.pi * t
                      + shell
                      * GOLDEN_ANGLE
                  )

                  digest = block["digest"]

                  phase_a = (
                      2.0
                      * math.pi
                      * digest[0]
                      / 255.0
                  )

                  phase_b = (
                      2.0
                      * math.pi
                      * digest[7]
                      / 255.0
                  )

                  phase_c = (
                      2.0
                      * math.pi
                      * digest[13]
                      / 255.0
                  )

                  phase_d = (
                      2.0
                      * math.pi
                      * digest[21]
                      / 255.0
                  )

                  cell_bias = (
                      walsh[block["cell"]]
                      / walsh_scale
                  )

                  degree_bias = (
                      block["degree"]
                      / max(
                          1,
                          maximum_degree,
                      )
                  )

                  x4 = math.cos(
                      theta
                      * GOLDEN_N
                      + phase_a
                  ) * (
                      0.58
                      + 0.25
                      * math.cos(
                          theta
                          * PHI
                          + phase_c
                      )
                  )

                  y4 = math.sin(
                      theta
                      * PHI
                      + phase_b
                  ) * (
                      0.58
                      + 0.25
                      * math.sin(
                          theta
                          * GOLDEN_N
                          + phase_d
                      )
                  )

                  z4 = math.cos(
                      theta
                      * (
                          PHI
                          + GOLDEN_N
                      )
                      + phase_c
                  ) * (
                      0.46
                      + 0.18
                      * cell_bias
                  )

                  w4 = math.sin(
                      theta
                      / GOLDEN_N
                      + phase_d
                  ) * (
                      0.46
                      + 0.18
                      * degree_bias
                  )

                  denominator_4d = max(
                      0.5,
                      2.25 - w4,
                  )

                  x3 = (
                      x4
                      + 0.30 * z4
                  ) / denominator_4d

                  y3 = (
                      y4
                      + 0.22 * z4
                  ) / denominator_4d

                  z3 = (
                      z4
                      / denominator_4d
                  )

                  denominator_3d = max(
                      0.6,
                      2.35 - z3,
                  )

                  radius = (
                      0.18
                      + 0.77
                      * shell
                      / max(
                          1,
                          len(schedule) - 1,
                      )
                  )

                  block["x"] = (
                      radius
                      * x3
                      / denominator_3d
                  )

                  block["y"] = (
                      radius
                      * y3
                      / denominator_3d
                  )

                  block["orientation"] = (
                      int(
                          (
                              block["index"]
                              * int(
                                  PHI
                                  * (
                                      1 << 34
                                  )
                              )
                              + block["cell"]
                              * int(
                                  GOLDEN_N
                                  * (
                                      1 << 30
                                  )
                              )
                              + int(
                                  GOLDEN_ANGLE
                                  * (
                                      1 << 38
                                  )
                              )
                          )
                          >> 9
                      )
                      & 3
                  )

                  block["permutation"] = (
                      digest[2]
                      + block["cell"]
                      + shell
                      + int(PHI * 10)
                  ) % 6

                  block["mask"] = tuple(
                      value & 255
                      for value in (
                          digest[3]
                          ^ int(
                              (
                                  block["x"]
                                  + 1.0
                              )
                              * 127.5
                          ),
                          digest[11]
                          ^ int(
                              (
                                  block["y"]
                                  + 1.0
                              )
                              * 127.5
                          ),
                          digest[19]
                          ^ int(
                              (
                                  cell_bias
                                  + 1.0
                              )
                              * 127.5
                          ),
                      )
                  )

              return (
                  blocks,
                  sorted(edges),
                  walsh,
              )


          def slot_geometry(
              slot: int,
          ):
              row, column = divmod(
                  slot,
                  COLS,
              )

              left = (
                  LEFT
                  + column * PITCH
                  + (
                      PITCH - BLOCK
                  )
                  // 2
              )

              top = (
                  TOP
                  + row * PITCH
                  + (
                      PITCH - BLOCK
                  )
                  // 2
              )

              return (
                  left + BLOCK // 2,
                  top + BLOCK // 2,
                  left,
                  top,
              )


          def place_blocks(
              blocks: list[dict],
          ):
              free = list(
                  range(
                      LEGENDS,
                      SLOTS,
                  )
              )

              output = {}

              for block in sorted(
                  blocks,
                  key=lambda item: (
                      abs(item["x"])
                      + abs(item["y"]),
                      item["index"],
                  ),
              ):
                  target_x = (
                      W / 2
                      + block["x"]
                      * W
                      * 0.82
                  )

                  target_y = (
                      H / 2
                      + block["y"]
                      * H
                      * 0.82
                  )

                  selected = min(
                      range(len(free)),
                      key=lambda position: (
                          (
                              slot_geometry(
                                  free[position]
                              )[0]
                              - target_x
                          )
                          ** 2
                          + (
                              slot_geometry(
                                  free[position]
                              )[1]
                              - target_y
                          )
                          ** 2
                      ),
                  )

                  block["slot"] = free.pop(
                      selected
                  )

                  output[
                      block["index"]
                  ] = slot_geometry(
                      block["slot"]
                  )

              return output


          def fixed_header(
              text: str,
          ) -> np.ndarray:
              encoded = utf16_units(text)

              if len(encoded) > HEAD:
                  raise RuntimeError(
                      "header too long: "
                      + text
                  )

              output = np.full(
                  HEAD,
                  ord("|"),
                  dtype=np.uint16,
              )

              output[:len(encoded)] = encoded
              return output


          def canonical_rgb(
              units: np.ndarray,
          ) -> np.ndarray:
              high = (
                  units >> 8
              ).astype(np.uint8)

              low = (
                  units & 255
              ).astype(np.uint8)

              checksum = np.bitwise_xor(
                  high,
                  low,
              )

              return np.stack(
                  (
                      high,
                      low,
                      checksum,
                  ),
                  axis=1,
              )


          def render_block(
              header: np.ndarray,
              payload: np.ndarray,
              permutation: int,
              mask: tuple[int, int, int],
              seed: bytes,
              orientation: int = 0,
          ) -> Image.Image:
              units = np.empty(
                  PAIR_CAP,
                  dtype=np.uint16,
              )

              units[:HEAD] = header

              payload_end = (
                  HEAD
                  + len(payload)
              )

              units[
                  HEAD:payload_end
              ] = payload

              remaining = (
                  PAIR_CAP
                  - payload_end
              )

              position = payload_end
              counter = 0

              while remaining:
                  words = np.frombuffer(
                      hashlib.sha256(
                          seed
                          + counter.to_bytes(
                              4,
                              "big",
                          )
                      ).digest(),
                      dtype=">u2",
                  ).astype(np.uint16)

                  amount = min(
                      remaining,
                      len(words),
                  )

                  units[
                      position:
                      position + amount
                  ] = words[:amount]

                  position += amount
                  remaining -= amount
                  counter += 1

              colors = canonical_rgb(
                  units
              )

              colors[HEAD:] = (
                  np.bitwise_xor(
                      colors[
                          HEAD:,
                          CHANNEL_PERMUTATIONS[
                              permutation
                          ],
                      ],
                      np.array(
                          mask,
                          dtype=np.uint8,
                      )[None, :],
                  )
              )

              complements = (
                  255 - colors
              )

              pixels = np.empty(
                  (
                      BLOCK,
                      BLOCK,
                      3,
                  ),
                  dtype=np.uint8,
              )

              pixels[
                  :,
                  0::2,
                  :,
              ] = colors.reshape(
                  BLOCK,
                  PAIR_COLS,
                  3,
              )

              pixels[
                  :,
                  1::2,
                  :,
              ] = complements.reshape(
                  BLOCK,
                  PAIR_COLS,
                  3,
              )

              image = Image.fromarray(
                  pixels,
                  "RGB",
              )

              if orientation == 1:
                  image = image.transpose(
                      Image.Transpose.ROTATE_90
                  )
              elif orientation == 2:
                  image = image.transpose(
                      Image.Transpose.ROTATE_180
                  )
              elif orientation == 3:
                  image = image.transpose(
                      Image.Transpose.ROTATE_270
                  )

              return image


          def legend_block(
              part: int,
              archive_sha: bytes,
          ) -> Image.Image:
              start = part * PAY
              stop = min(
                  65536,
                  start + PAY,
              )

              data = np.arange(
                  start,
                  stop,
                  dtype=np.uint32,
              ).astype(np.uint16)

              header = fixed_header(
                  f"D4LEG|"
                  f"PART={part}|"
                  f"TOTAL={LEGENDS}|"
                  f"START={start:04X}|"
                  f"COUNT={len(data):05X}|"
                  "PAIR=RGB+CMY|"
                  "RGB=HI,LO,HI^LO|"
                  f"S={archive_sha.hex()[:12]}|"
              )

              return render_block(
                  header,
                  data,
                  0,
                  (0, 0, 0),
                  archive_sha
                  + bytes([part]),
              )


          def payload_block(
              block: dict,
              total: int,
              archive_sha: bytes,
          ) -> Image.Image:
              crc = zlib.crc32(
                  block["units"].astype(
                      ">u2",
                      copy=False,
                  ).tobytes()
              ) & 0xFFFFFFFF

              mask = "".join(
                  f"{value:02X}"
                  for value
                  in block["mask"]
              )

              header = fixed_header(
                  "D4B3|"
                  f"I={block['index']:06X}|"
                  f"T={total:06X}|"
                  f"N={len(block['units']):06X}|"
                  f"O={block['orientation']}|"
                  f"P={block['permutation']}|"
                  f"M={mask}|"
                  f"C={crc:08X}|"
                  f"S={archive_sha.hex()[:16]}|"
              )

              return render_block(
                  header,
                  block["units"],
                  block["permutation"],
                  block["mask"],
                  archive_sha
                  + block["index"].to_bytes(
                      4,
                      "big",
                  ),
                  block["orientation"],
              )


          def render_background(
              archive_sha: bytes,
              walsh: list[int],
          ) -> Image.Image:
              low_width = math.ceil(
                  W / 4
              )

              low_height = math.ceil(
                  H / 4
              )

              x = np.linspace(
                  -1.0,
                  1.0,
                  low_width,
                  dtype=np.float32,
              )[None, :]

              y = np.linspace(
                  -1.0,
                  1.0,
                  low_height,
                  dtype=np.float32,
              )[:, None]

              radius = np.sqrt(
                  x * x + y * y
              )

              theta = np.arctan2(
                  y,
                  x,
              )

              phases = [
                  2.0
                  * math.pi
                  * archive_sha[index]
                  / 255.0
                  for index in (
                      0,
                      7,
                      13,
                      21,
                  )
              ]

              sectors = np.mod(
                  np.floor(
                      (
                          theta + math.pi
                      )
                      / (
                          2.0
                          * math.pi
                          / 16.0
                      )
                  ).astype(np.int32),
                  16,
              )

              scale = max(
                  1,
                  max(
                      abs(value)
                      for value
                      in walsh[1:]
                  ),
              )

              bias = np.array(
                  [
                      value / scale
                      for value in walsh
                  ],
                  dtype=np.float32,
              )[sectors]

              x4 = np.cos(
                  theta
                  * PHI
                  + phases[0]
              ) * (
                  0.58
                  + 0.24
                  * np.cos(
                      theta
                      * GOLDEN_N
                      + phases[2]
                  )
              )

              y4 = np.sin(
                  theta
                  * GOLDEN_N
                  + phases[1]
              ) * (
                  0.58
                  + 0.24
                  * np.sin(
                      theta
                      * PHI
                      + phases[3]
                  )
              )

              z4 = np.cos(
                  radius
                  * math.pi
                  * PHI
                  + phases[2]
              ) * (
                  0.46
                  + 0.18
                  * bias
              )

              w4 = np.sin(
                  radius
                  * math.pi
                  * GOLDEN_N
                  + phases[3]
              ) * (
                  0.46
                  + 0.18
                  * bias
              )

              denominator_4d = np.maximum(
                  0.5,
                  2.25 - w4,
              )

              x3 = (
                  x4 + 0.30 * z4
              ) / denominator_4d

              y3 = (
                  y4 + 0.22 * z4
              ) / denominator_4d

              z3 = (
                  z4
                  / denominator_4d
              )

              denominator_3d = np.maximum(
                  0.6,
                  2.35 - z3,
              )

              projection = np.sqrt(
                  (
                      x3
                      / denominator_3d
                  )
                  ** 2
                  + (
                      y3
                      / denominator_3d
                  )
                  ** 2
              )

              ray = (
                  0.5
                  + 0.5
                  * np.cos(
                      5.0
                      * theta
                      + phases[0]
                  )
              )

              opposite_ray = (
                  0.5
                  + 0.5
                  * np.cos(
                      10.0
                      * theta
                      + phases[1]
                      + radius
                      * math.pi
                  )
              )

              shell = np.exp(
                  -3.6
                  * radius
                  * radius
              )

              ribbon = np.exp(
                  -18.0
                  * np.abs(
                      projection
                      - (
                          0.12
                          + 0.42
                          * ray
                      )
                  )
              )

              red = np.clip(
                  5
                  + 46 * shell
                  + 70 * ribbon
                  + 42
                  * np.maximum(
                      0.0,
                      bias,
                  ),
                  0,
                  255,
              )

              green = np.clip(
                  8
                  + 52 * opposite_ray
                  + 48 * shell
                  + 30
                  * np.maximum(
                      0.0,
                      -bias,
                  ),
                  0,
                  255,
              )

              blue = np.clip(
                  14
                  + 74 * ray
                  + 68 * ribbon
                  + 32
                  * np.abs(bias),
                  0,
                  255,
              )

              array = np.stack(
                  (
                      red,
                      green,
                      blue,
                  ),
                  axis=2,
              ).astype(np.uint8)

              return Image.fromarray(
                  array,
                  "RGB",
              ).resize(
                  (W, H),
                  Image.Resampling.BICUBIC,
              )


          def main() -> None:
              root = Path(
                  os.environ[
                      "GITHUB_WORKSPACE"
                  ]
              ).resolve()

              output = (
                  root
                  / "dream-self-describing-output"
                  / (
                      "DREAM_SELF_DESCRIBING_"
                      "4D_RGB_CMY_APPLICATION_"
                      "MANIFOLD.png"
                  )
              )

              output.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              files, skipped = (
                  collect_sources(root)
              )

              (
                  units,
                  manifest,
                  archive_sha,
              ) = build_archive(files)

              (
                  blocks,
                  edges,
                  walsh,
              ) = make_blocks(
                  units,
                  archive_sha,
              )

              slots = place_blocks(
                  blocks
              )

              image = render_background(
                  archive_sha,
                  walsh,
              )

              draw = ImageDraw.Draw(
                  image,
                  "RGBA",
              )

              block_by_index = {
                  block["index"]: block
                  for block in blocks
              }

              for left, right in edges:
                  (
                      left_x,
                      left_y,
                      _,
                      _,
                  ) = slots[left]

                  (
                      right_x,
                      right_y,
                      _,
                      _,
                  ) = slots[right]

                  digest = (
                      block_by_index[
                          left
                      ]["digest"]
                  )

                  color = (
                      80
                      + digest[0] % 176,
                      80
                      + digest[7] % 176,
                      80
                      + digest[13] % 176,
                      72,
                  )

                  complement = (
                      255 - color[0],
                      255 - color[1],
                      255 - color[2],
                      58,
                  )

                  draw.line(
                      (
                          left_x,
                          left_y,
                          right_x,
                          right_y,
                      ),
                      fill=color,
                      width=7,
                  )

                  draw.line(
                      (
                          left_x + 3,
                          left_y - 3,
                          right_x + 3,
                          right_y - 3,
                      ),
                      fill=complement,
                      width=3,
                  )

              for part, slot in enumerate(
                  (
                      0,
                      1,
                      2,
                  )
              ):
                  (
                      _,
                      _,
                      left,
                      top,
                  ) = slot_geometry(slot)

                  image.paste(
                      legend_block(
                          part,
                          archive_sha,
                      ),
                      (
                          left,
                          top,
                      ),
                  )

              for block in blocks:
                  (
                      _,
                      _,
                      left,
                      top,
                  ) = slots[
                      block["index"]
                  ]

                  image.paste(
                      payload_block(
                          block,
                          len(blocks),
                          archive_sha,
                      ),
                      (
                          left,
                          top,
                      ),
                  )

              image.save(
                  output,
                  "PNG",
                  compress_level=6,
                  optimize=False,
              )

              print(
                  json.dumps(
                      {
                          "artifact": str(
                              output
                          ),
                          "width": W,
                          "height": H,
                          "megapixels": (
                              W * H / 1_000_000
                          ),
                          "includedApplicationFiles": (
                              len(files)
                          ),
                          "excludedTrackedFiles": (
                              len(skipped)
                          ),
                          "archiveUtf16Units": (
                              len(units)
                          ),
                          "capacityUtf16Units": (
                              MAX_BLOCKS * PAY
                          ),
                          "payloadBlocks": (
                              len(blocks)
                          ),
                          "applicationRoot": (
                              manifest[
                                  "applicationRoot"
                              ]
                          ),
                          "archiveSha256": (
                              archive_sha.hex()
                          ),
                          "includedPaths": [
                              source["path"]
                              for source in files
                          ],
                          "excluded": skipped,
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )


          if __name__ == "__main__":
              main()
          PY

          python -m py_compile \
            "$RUNNER_TEMP/build_manifold.py"

          python \
            "$RUNNER_TEMP/build_manifold.py" \
            | tee "$RUNNER_TEMP/build.json"

      - name: Verify PNG
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image

          path = (
              "dream-self-describing-output/"
              "DREAM_SELF_DESCRIBING_"
              "4D_RGB_CMY_APPLICATION_"
              "MANIFOLD.png"
          )

          with Image.open(path) as image:
              assert image.size == (
                  4284,
                  5712,
              ), image.size

              image.verify()

          print("PNG_OK 4284x5712")
          PY

      - name: Publish build report
        shell: bash
        run: |
          {
            echo \
              "## DREAM self-describing 4D RGB/CMY manifold"

            echo '```json'
            cat "$RUNNER_TEMP/build.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: DREAM_SELF_DESCRIBING_4D_RGB_CMY_APPLICATION_MANIFOLD
          path: dream-self-describing-output/DREAM_SELF_DESCRIBING_4D_RGB_CMY_APPLICATION_MANIFOLD.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
