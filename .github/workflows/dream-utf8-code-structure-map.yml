name: DREAM UTF-8 Code Structure Map

on:
  workflow_dispatch:
    inputs:
      code_roots:
        description: "Comma-separated product application code roots, in map order"
        required: false
        default: "app,components,coresurfaces,daydreams,dr-eams,dreamdmbar,dreamr,engine,engins,hooks"
      code_extensions:
        description: "Comma-separated source-code extensions"
        required: false
        default: ".ts,.tsx,.js,.jsx,.mjs,.cjs"
      triangle_rows:
        description: "Triangle rows. 512 is phone-readable; 768 is sharper."
        required: false
        default: "512"

permissions:
  contents: read

jobs:
  utf8-code-structure-map:
    name: Build CODE_STRUCTURE_MAP.png
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image renderer
        run: python3 -m pip install --user pillow

      - name: Build labeled code structure map
        shell: bash
        env:
          CODE_ROOTS: ${{ inputs.code_roots || 'app,components,coresurfaces,daydreams,dr-eams,dreamdmbar,dreamr,engine,engins,hooks' }}
          CODE_EXTENSIONS: ${{ inputs.code_extensions || '.ts,.tsx,.js,.jsx,.mjs,.cjs' }}
          TRIANGLE_ROWS: ${{ inputs.triangle_rows || '512' }}
        run: |
          cat > /tmp/dream_utf8_code_structure_map.py <<'PY'
          from __future__ import annotations

          import csv
          import json
          import math
          import os
          import shutil
          import zipfile
          from pathlib import Path
          from typing import Iterable, List

          from PIL import Image, ImageDraw, ImageFont

          OUT_DIR = Path(".dream-utf8-code-structure-map")
          ZIP_PATH = Path("dream-utf8-code-structure-map.zip")

          EXCLUDE_DIRS = {
              ".git",
              ".github",
              ".ci",
              "node_modules",
              ".next",
              "out",
              "dist",
              "build",
              "coverage",
              ".turbo",
              ".vercel",
              ".cache",
              "__pycache__",
              ".pytest_cache",
              ".dream-utf8-code-structure-map",
          }

          EXCLUDE_FILE_NAMES = {
              "package-lock.json",
              "pnpm-lock.yaml",
              "yarn.lock",
              "bun.lockb",
              "tsconfig.tsbuildinfo",
              "dream-utf8-code-structure-map.zip",
          }

          MAX_FILE_BYTES = 5_000_000


          def code_roots() -> List[str]:
              raw = os.environ.get("CODE_ROOTS", "app,components,coresurfaces,daydreams,dr-eams,dreamdmbar,dreamr,engine,engins,hooks")
              return [item.strip().strip("/") for item in raw.split(",") if item.strip()]


          def code_extensions() -> set[str]:
              raw = os.environ.get("CODE_EXTENSIONS", ".ts,.tsx,.js,.jsx,.mjs,.cjs")
              return {item.strip().lower() for item in raw.split(",") if item.strip()}


          def triangle_rows() -> int:
              raw = os.environ.get("TRIANGLE_ROWS", "512").strip()
              try:
                  value = int(raw)
              except ValueError:
                  value = 512
              return max(128, min(value, 1024))


          def should_include(path: Path, repo_root: Path, roots_set: set[str], extensions: set[str]) -> bool:
              if not path.is_file():
                  return False

              rel = path.relative_to(repo_root)

              if any(part in EXCLUDE_DIRS for part in rel.parts):
                  return False

              if path.name in EXCLUDE_FILE_NAMES:
                  return False

              top = rel.as_posix().split("/", 1)[0]
              if top not in roots_set:
                  return False

              if path.suffix.lower() not in extensions:
                  return False

              if path.stat().st_size > MAX_FILE_BYTES:
                  return False

              return True


          def iter_code_files(repo_root: Path) -> Iterable[Path]:
              ordered_roots = code_roots()
              roots_set = set(ordered_roots)
              extensions = code_extensions()

              for root_name in ordered_roots:
                  root_path = repo_root / root_name
                  if not root_path.exists():
                      continue

                  for path in sorted(root_path.rglob("*")):
                      if should_include(path, repo_root, roots_set, extensions):
                          yield path


          def pascal_odd(row: int, col: int) -> int:
              # Pascal coefficient mod 2. This is the Sierpinski triangle.
              return 1 if (col & ~row) == 0 else 0


          def write_csv(path: Path, fieldnames: list[str], rows: list[dict]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)


          def zip_dir(source: Path, destination: Path) -> None:
              if destination.exists():
                  destination.unlink()

              with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(source).as_posix())


          def load_font(size: int, bold: bool = False) -> ImageFont.ImageFont:
              candidates = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
              ]
              for candidate in candidates:
                  if Path(candidate).exists():
                      return ImageFont.truetype(candidate, size=size)
              return ImageFont.load_default()


          def density_shade(ratio: float) -> int:
              # Source-code UTF-8 tends to live roughly in 0.25..0.55.
              # Stretch that into visible contrast.
              low = 0.25
              high = 0.55
              t = (ratio - low) / (high - low)
              t = max(0.0, min(1.0, t))
              return int(255 - t * 255)


          def cell_to_row_col(cell_index: int) -> tuple[int, int]:
              # Inverse triangular number.
              row = int((math.sqrt(8 * cell_index + 1) - 1) // 2)
              row_start = row * (row + 1) // 2
              col = cell_index - row_start
              return row, col


          def cell_center(cell_index: int, rows: int, scale: int, x0: int, y0: int) -> tuple[int, int]:
              row, col = cell_to_row_col(cell_index)
              x = int(x0 + ((rows - row - 1) * scale / 2) + col * scale + scale / 2)
              y = int(y0 + row * scale + scale / 2)
              return x, y


          def main() -> int:
              repo_root = Path(".").resolve()
              rows = triangle_rows()
              cells = rows * (rows + 1) // 2

              if OUT_DIR.exists():
                  shutil.rmtree(OUT_DIR)
              (OUT_DIR / "Data").mkdir(parents=True)
              (OUT_DIR / ".de").mkdir(parents=True)

              source_files: list[dict] = []
              root_ranges: dict[str, dict] = {}
              total_bytes = 0
              total_ones = 0

              for path in iter_code_files(repo_root):
                  rel = path.relative_to(repo_root).as_posix()
                  root = rel.split("/", 1)[0]

                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  data = text.encode("utf-8")
                  if not data:
                      continue

                  bits = len(data) * 8
                  ones = sum(byte.bit_count() for byte in data)
                  start_bit = total_bytes * 8
                  end_bit = start_bit + bits

                  source_files.append({
                      "sourcePath": rel,
                      "root": root,
                      "utf8Bytes": len(data),
                      "bits": bits,
                      "onesCount": ones,
                      "zerosCount": bits - ones,
                      "oneRatio": ones / bits if bits else 0,
                      "startBit": start_bit,
                      "endBitExclusive": end_bit,
                  })

                  if root not in root_ranges:
                      root_ranges[root] = {
                          "root": root,
                          "startBit": start_bit,
                          "endBitExclusive": end_bit,
                          "files": 0,
                          "utf8Bytes": 0,
                          "onesCount": 0,
                      }

                  root_ranges[root]["endBitExclusive"] = end_bit
                  root_ranges[root]["files"] += 1
                  root_ranges[root]["utf8Bytes"] += len(data)
                  root_ranges[root]["onesCount"] += ones

                  total_bytes += len(data)
                  total_ones += ones

              total_bits = total_bytes * 8
              if total_bits <= 0:
                  raise SystemExit("No UTF-8 application code was found.")

              cell_ones = [0] * cells
              cell_total = [0] * cells

              global_bit = 0
              for item in source_files:
                  data = (repo_root / item["sourcePath"]).read_text(encoding="utf-8").encode("utf-8")
                  for byte in data:
                      for shift in range(7, -1, -1):
                          bit = (byte >> shift) & 1
                          ci = (global_bit * cells) // total_bits
                          ci = min(ci, cells - 1)
                          cell_ones[ci] += bit
                          cell_total[ci] += 1
                          global_bit += 1

              cell_rows = []
              for ci in range(cells):
                  row, col = cell_to_row_col(ci)
                  ones = cell_ones[ci]
                  total = cell_total[ci]
                  zeros = total - ones
                  ratio = ones / total if total else 0
                  active = pascal_odd(row, col)
                  cell_rows.append({
                      "cellIndex": ci,
                      "row": row,
                      "col": col,
                      "onesCount": ones,
                      "zerosCount": zeros,
                      "totalBitsInCell": total,
                      "oneRatio": ratio,
                      "pascalOdd": active,
                  })

              # Drawing
              scale = 3 if rows <= 512 else 2
              left_margin = 80
              top_margin = 130
              right_panel = 520
              bottom_margin = 90

              tri_width = rows * scale
              tri_height = rows * scale
              width = left_margin + tri_width + right_panel
              height = top_margin + tri_height + bottom_margin

              img = Image.new("RGB", (width, height), "white")
              draw = ImageDraw.Draw(img)

              font_title = load_font(34, bold=True)
              font_header = load_font(22, bold=True)
              font_text = load_font(18)
              font_small = load_font(15)
              font_tiny = load_font(12)

              x0 = left_margin
              y0 = top_margin

              draw.text((30, 25), "DREAM UTF-8 CODE STRUCTURE MAP", fill=(0, 0, 0), font=font_title)
              draw.text(
                  (30, 70),
                  "application source -> UTF-8 bits -> Pascal/Sierpinski triangle geometry",
                  fill=(40, 40, 40),
                  font=font_text,
              )

              # Triangle cells.
              for entry in cell_rows:
                  row = entry["row"]
                  col = entry["col"]
                  ratio = entry["oneRatio"]
                  active = entry["pascalOdd"]

                  shade = density_shade(ratio)

                  if active:
                      color = (shade, shade, shade)
                  else:
                      # Faint inactive Pascal cells. Keeps the triangle visible without losing code density.
                      faint = int(245 - ((255 - shade) * 0.22))
                      color = (faint, faint, faint)

                  x = int(x0 + ((rows - row - 1) * scale / 2) + col * scale)
                  y = int(y0 + row * scale)
                  draw.rectangle([x, y, x + scale - 1, y + scale - 1], fill=color)

              # Root boundary marks and labels.
              root_rows = []
              for root in code_roots():
                  if root not in root_ranges:
                      continue
                  rr = root_ranges[root]
                  rr["bits"] = rr["endBitExclusive"] - rr["startBit"]
                  rr["oneRatio"] = rr["onesCount"] / (rr["bits"] or 1)
                  root_rows.append(rr)

              # Marker line for each root start/end in the triangular stream.
              for rr in root_rows:
                  start_cell = int((rr["startBit"] * cells) // total_bits)
                  end_cell = int(((rr["endBitExclusive"] - 1) * cells) // total_bits)
                  start_cell = max(0, min(cells - 1, start_cell))
                  end_cell = max(0, min(cells - 1, end_cell))
                  sx, sy = cell_center(start_cell, rows, scale, x0, y0)
                  ex, ey = cell_center(end_cell, rows, scale, x0, y0)

                  draw.ellipse([sx - 5, sy - 5, sx + 5, sy + 5], fill=(220, 0, 0), outline=(255, 255, 255))
                  draw.ellipse([ex - 4, ey - 4, ex + 4, ey + 4], fill=(0, 80, 220), outline=(255, 255, 255))

              panel_x = left_margin + tri_width + 35
              draw.text((panel_x, top_margin), "Legend", fill=(0, 0, 0), font=font_header)

              legend_y = top_margin + 38
              legend_items = [
                  ((0, 0, 0), "black: 1-heavy + Pascal active"),
                  ((95, 95, 95), "gray: mixed code density"),
                  ((235, 235, 235), "pale: Pascal inactive"),
                  ((220, 0, 0), "red dot: root starts"),
                  ((0, 80, 220), "blue dot: root ends"),
              ]

              for color, label in legend_items:
                  draw.rectangle([panel_x, legend_y, panel_x + 22, legend_y + 22], fill=color, outline=(0, 0, 0))
                  draw.text((panel_x + 32, legend_y - 1), label, fill=(0, 0, 0), font=font_small)
                  legend_y += 32

              stats_y = legend_y + 18
              draw.text((panel_x, stats_y), "Totals", fill=(0, 0, 0), font=font_header)
              stats_y += 32
              stats = [
                  f"files: {len(source_files):,}",
                  f"UTF-8 bytes: {total_bytes:,}",
                  f"bits: {total_bits:,}",
                  f"1 bits: {total_ones:,}",
                  f"1 ratio: {total_ones / total_bits:.4f}",
                  f"triangle rows: {rows}",
                  f"triangle cells: {cells:,}",
              ]
              for line in stats:
                  draw.text((panel_x, stats_y), line, fill=(0, 0, 0), font=font_small)
                  stats_y += 25

              roots_y = stats_y + 18
              draw.text((panel_x, roots_y), "Root bands", fill=(0, 0, 0), font=font_header)
              roots_y += 32

              for rr in root_rows:
                  ratio = rr["oneRatio"]
                  shade = density_shade(ratio)
                  color = (shade, shade, shade)
                  draw.rectangle([panel_x, roots_y + 2, panel_x + 18, roots_y + 20], fill=color, outline=(0, 0, 0))
                  label = (
                      f"{rr['root']}: {rr['files']} files, "
                      f"{rr['utf8Bytes']:,} bytes, 1r={ratio:.3f}"
                  )
                  draw.text((panel_x + 28, roots_y), label, fill=(0, 0, 0), font=font_tiny)
                  roots_y += 24

              bottom_y = top_margin + tri_height + 22
              draw.text(
                  (left_margin, bottom_y),
                  "Reading order: roots/files are folded into the triangle in source order. Red = root start. Blue = root end.",
                  fill=(30, 30, 30),
                  font=font_small,
              )

              output_png = OUT_DIR / "CODE_STRUCTURE_MAP.png"
              img.save(output_png)

              # Data that makes the PNG auditable.
              write_csv(
                  OUT_DIR / "Data" / "CODE_STRUCTURE_CELLS.csv",
                  ["cellIndex", "row", "col", "onesCount", "zerosCount", "totalBitsInCell", "oneRatio", "pascalOdd"],
                  cell_rows,
              )

              write_csv(
                  OUT_DIR / "Data" / "FILE_RANGES.csv",
                  ["sourcePath", "root", "utf8Bytes", "bits", "onesCount", "zerosCount", "oneRatio", "startBit", "endBitExclusive"],
                  source_files,
              )

              write_csv(
                  OUT_DIR / "Data" / "ROOT_RANGES.csv",
                  ["root", "startBit", "endBitExclusive", "bits", "files", "utf8Bytes", "onesCount", "oneRatio"],
                  root_rows,
              )

              manifest = {
                  "format": "dreamengin.utf8-code-structure-map.v1",
                  "mainImage": "CODE_STRUCTURE_MAP.png",
                  "scope": "product application source code only",
                  "includedRoots": code_roots(),
                  "includedExtensions": sorted(code_extensions()),
                  "operation": "source-ordered files -> UTF-8 bits -> Pascal/Sierpinski triangle cells -> labeled PNG",
                  "totals": {
                      "files": len(source_files),
                      "utf8Bytes": total_bytes,
                      "bits": total_bits,
                      "onesCount": total_ones,
                      "zerosCount": total_bits - total_ones,
                      "oneRatio": total_ones / total_bits,
                      "triangleRows": rows,
                      "triangleCells": cells,
                  },
                  "outputs": {
                      "mainImage": "CODE_STRUCTURE_MAP.png",
                      "cellData": "Data/CODE_STRUCTURE_CELLS.csv",
                      "fileRanges": "Data/FILE_RANGES.csv",
                      "rootRanges": "Data/ROOT_RANGES.csv",
                  },
              }

              (OUT_DIR / ".de" / "code-structure-map.json").write_text(
                  json.dumps(manifest, indent=2),
                  encoding="utf-8",
              )

              readme = [
                  "# DREAM UTF-8 Code Structure Map",
                  "",
                  "Open this first:",
                  "",
                  "```text",
                  "CODE_STRUCTURE_MAP.png",
                  "```",
                  "",
                  "This is the actual visual map.",
                  "",
                  "It contains:",
                  "",
                  "- Pascal/Sierpinski triangle structure",
                  "- UTF-8 code-density shading",
                  "- root start/end markers",
                  "- root labels",
                  "- legend",
                  "",
                  "Data files are included only so the image can be audited.",
              ]
              (OUT_DIR / "README.md").write_text("\n".join(readme), encoding="utf-8")

              zip_dir(OUT_DIR, ZIP_PATH)

              print(f"Created {ZIP_PATH}")
              print("Open first: CODE_STRUCTURE_MAP.png")
              print(f"files={len(source_files)}")
              print(f"bytes={total_bytes}")
              print(f"bits={total_bits}")
              print(f"triangleRows={rows}")
              print(f"triangleCells={cells}")

              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 /tmp/dream_utf8_code_structure_map.py

      - name: Upload code structure map artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-code-structure-map
          path: dream-utf8-code-structure-map.zip
          if-no-files-found: error
