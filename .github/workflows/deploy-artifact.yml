name: Extract zip code update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-code:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Unzip -> sync code -> commit
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          echo "Working branch: $BRANCH"

          # Make sure local branch is current before applying the zip
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          # 1. Find the zip file
          shopt -s nullglob
          zips=( *.zip )
          shopt -u nullglob
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found, nothing to do."
            exit 0
          fi

          IFS=$'\n' zips_sorted=($(printf "%s\n" "${zips[@]}" | sort))
          unset IFS
          ZIP="${zips_sorted[-1]}"
          echo "Processing: $ZIP"

          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          # 2. Flatten the folder if the zip has a single root wrapper (ignoring Mac hidden files)
          ROOT="$TMP"
          top_dirs=()
          for d in "$TMP"/*/; do
            [ -d "$d" ] || continue
            [[ "$(basename "$d")" == "__MACOSX" ]] && continue
            top_dirs+=( "$d" )
          done
          if [ "${#top_dirs[@]}" -eq 1 ]; then
            ROOT="${top_dirs[0]}"
          fi

          # 3. Sync EVERYTHING into the repo root, leaving existing files completely safe
          # Excludes .git/ and .github/ to protect your repository infrastructure
          rsync -a -v \
            --exclude=".git/" \
            --exclude=".github/" \
            "$ROOT/" "./"

          # 4. Remove the zip so it doesn't bloat the codebase
          rm -f "$ZIP"
          git rm -f "$ZIP" 2>/dev/null || true

          # 5. Stage and Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && echo "No code changes to commit." && exit 0
          git commit -m "chore: apply code updates from zip [skip ci] [skip vercel]"

          # 6. Rebase onto latest remote branch before push
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          # 7. Push the updated codebase back to GitHub
          git push origin "HEAD:$BRANCH"
