```
name: Export App Source (No Docs/CI/Tests)

on:
  workflow_dispatch:

jobs:
  export-src:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source-only zip
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="DREAMengin-src-${TIMESTAMP}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          zip -r "$ZIP_NAME" . \
            --exclude "*.md" \
            --exclude "*.MD" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.gif" \
            --exclude "*.svg" \
            --exclude "*.ico" \
            --exclude "*.mp4" \
            --exclude "*.mov" \
            --exclude "*.webm" \
            --exclude "*.ttf" \
            --exclude "*.woff" \
            --exclude "*.woff2" \
            --exclude "*.tsbuildinfo" \
            --exclude "*.yaml" \
            --exclude "*.yml" \
            --exclude "*pnpm-lock*" \
            --exclude "*package-lock*" \
            --exclude "*/node_modules/*" \
            --exclude "*/.github/*" \
            --exclude "*/scripts/*" \
            --exclude "*/tests/*" \
            --exclude "*/docs/*" \
            --exclude "*/public/*" \
            --exclude "*/build-memory/*" \
            --exclude "*/repo-visualizer/*" \
            --exclude "*/supabase/.temp/*" \
            --exclude "*/playwright.config.ts" \
            --exclude "*/vitest.config.ts" \
            --exclude "*/.git/*" \
            --exclude "*.DS_Store" \
            -X

          echo "Built: $ZIP_NAME"
          echo "Files: $(unzip -l $ZIP_NAME | tail -1)"
          echo "Size:  $(du -sh $ZIP_NAME | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREAMengin-src-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
```
