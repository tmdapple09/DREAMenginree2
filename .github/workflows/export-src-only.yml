name: Export App Source (No Docs/CI/Tests)

on:
  workflow_dispatch:

jobs:
  export-src:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source-only zip
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="DREAMengin-src-${TIMESTAMP}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          # App source directories
          SRC_DIRS=(
            app
            components
            hooks
            types
            utils
            styles
            src
            supabase
            dr-eams
            assembly
            daydreams
            coresurfaces
            config
            build-memory
            repo-visualizer
          )

          # Root config files
          ROOT_FILES=(
            next.config.mjs
            next.config.ts
            next.config.js
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            postcss.config.js
            postcss.config.mjs
            proxy.ts
            supabaseClient.ts
            tailwind.config.ts
            tailwindcss-animate.d.ts
            tsconfig.json
            tsconfig.app.json
            tsconfig.base.json
            tsconfig.games.json
            tsconfig.gamesengin.json
            tsconfig.server.json
            tsconfig.test.json
            tsconfig.worker.json
            vercel.json
            vitest.config.ts
          )

          # Collect args for zip
          ZIP_ARGS=()

          for dir in "${SRC_DIRS[@]}"; do
            [ -d "$dir" ] && ZIP_ARGS+=("$dir")
          done

          for f in "${ROOT_FILES[@]}"; do
            [ -f "$f" ] && ZIP_ARGS+=("$f")
          done

          # Build zip â exclude docs, media, and other non-source noise
          zip -r "$ZIP_NAME" "${ZIP_ARGS[@]}" \
            --exclude "*.md" \
            --exclude "*.MD" \
            --exclude "*.txt" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.gif" \
            --exclude "*.svg" \
            --exclude "*.mp4" \
            --exclude "*.mov" \
            --exclude "*.webm" \
            --exclude "*.ico" \
            --exclude "*.DS_Store" \
            --exclude "*/.git/*" \
            --exclude "*/node_modules/*" \
            --exclude "supabase/.temp/*" \
            -X

          echo "Built: $ZIP_NAME"
          echo "Files: $(unzip -l $ZIP_NAME | tail -1)"
          echo "Size:  $(du -sh $ZIP_NAME | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREAMengin-src-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
