name: Strict English Codebase CSV Export

on:
  workflow_dispatch:
    inputs:
      max_file_bytes:
        description: "Maximum text file size to translate"
        required: false
        default: "10000000"

permissions:
  contents: read

concurrency:
  group: strict-english-codebase-csv-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  strict-english-codebase-csv-export:
    name: Export repo mirror as strict English CSV files
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"

      - name: Generate strict English CSV repo mirror
        env:
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        run: |
          cat > export-strict-english-csv-repo.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const repoRoot = process.cwd();
          const outRoot = path.join(repoRoot, "build-memory", "strict-english-csv-repo");
          const maxFileBytes = Number(process.env.MAX_FILE_BYTES || "10000000");

          const ignoredDirectories = new Set([
            ".git",
            ".next",
            "node_modules",
            "dist",
            "build",
            ".vercel",
            ".turbo",
            "coverage",
            "tmp",
            "temp",
            "reports",
            "test-output",
            "build-memory",
          ]);

          const textExtensions = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".md",
            ".mdx",
            ".yml",
            ".yaml",
            ".css",
            ".scss",
            ".html",
            ".txt",
            ".sql",
            ".sh",
            ".bash",
            ".env",
            ".example",
            ".gitignore",
            ".dockerignore",
            ".toml",
            ".xml",
            ".csv",
          ]);

          const assetExtensions = new Set([
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".webp",
            ".ico",
            ".glb",
            ".gltf",
            ".mp4",
            ".mov",
            ".mp3",
            ".wav",
            ".ogg",
            ".wasm",
            ".zip",
            ".gz",
            ".tar",
            ".pdf",
            ".ttf",
            ".otf",
            ".woff",
            ".woff2",
            ".bin",
          ]);

          function toPosix(filePath) {
            return filePath.split(path.sep).join("/");
          }

          function ensureDir(filePath) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
          }

          function shouldIgnore(relativePath) {
            const posix = toPosix(relativePath);

            for (const ignored of ignoredDirectories) {
              if (posix === ignored || posix.startsWith(`${ignored}/`)) {
                return true;
              }
            }

            return false;
          }

          function isAssetFile(filePath) {
            return assetExtensions.has(path.extname(filePath).toLowerCase());
          }

          function isProbablyText(filePath, buffer) {
            const base = path.basename(filePath);
            const ext = path.extname(filePath).toLowerCase();

            if (textExtensions.has(ext)) return true;
            if (textExtensions.has(base)) return true;
            if (assetExtensions.has(ext)) return false;
            if (buffer.includes(0)) return false;

            const sample = buffer.subarray(0, Math.min(buffer.length, 4096));
            let suspicious = 0;

            for (const byte of sample) {
              const isTab = byte === 9;
              const isNewline = byte === 10 || byte === 13;
              const isPrintable = byte >= 32 && byte <= 126;
              const isUtf8Likely = byte >= 128;

              if (!isTab && !isNewline && !isPrintable && !isUtf8Likely) {
                suspicious += 1;
              }
            }

            return suspicious / Math.max(sample.length, 1) < 0.02;
          }

          function splitPhysicalLines(text) {
            const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

            if (normalized.length === 0) {
              return { lines: [], endedWithNewline: false };
            }

            const endedWithNewline = normalized.endsWith("\n");
            const lines = normalized.split("\n");

            if (endedWithNewline) {
              lines.pop();
            }

            return { lines, endedWithNewline };
          }

          function csvCell(value) {
            const clean = String(value ?? "")
              .replace(/\r?\n|\r/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            return `"${clean.replace(/"/g, '""')}"`;
          }

          function readableName(name) {
            if (!name) return "unnamed value";

            return name
              .replace(/^use([A-Z])/, "use $1")
              .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
              .replace(/[_-]+/g, " ")
              .replace(/[{}()[\].]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function cleanComment(trimmed) {
            return trimmed
              .replace(/^\/\//, "")
              .replace(/^\/\*/, "")
              .replace(/^\*/, "")
              .replace(/\*\/$/, "")
              .replace(/^#/, "")
              .trim();
          }

          function nameFrom(pattern, text) {
            return text.match(pattern)?.[1] || null;
          }

          function quotedValue(text) {
            return text.match(/["'`]([^"'`]+)["'`]/)?.[1] || null;
          }

          function explainComment(trimmed) {
            const note = cleanComment(trimmed);
            return note ? `${note}.` : "";
          }

          function explainImport(trimmed) {
            const fromMatch = trimmed.match(/from\s+["']([^"']+)["']/);
            const bareMatch = trimmed.match(/^import\s+["']([^"']+)["']/);
            const source = fromMatch?.[1] || bareMatch?.[1];

            return source
              ? `Current file receives needed names from ${source}.`
              : "Current file receives needed outside names.";
          }

          function explainExport(trimmed) {
            if (trimmed.startsWith("export default function ")) {
              const name = nameFrom(/^export\s+default\s+function\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Other files receive ${readableName(name)} as the main action from current file.`
                : "Other files receive the main action from current file.";
            }

            if (trimmed.startsWith("export default ")) {
              return "Other files receive the main value from current file.";
            }

            if (trimmed.startsWith("export type ")) {
              const name = nameFrom(/^export\s+type\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Other files receive allowed value rule ${readableName(name)} from current file.`
                : "Other files receive an allowed value rule from current file.";
            }

            if (trimmed.startsWith("export interface ")) {
              const name = nameFrom(/^export\s+interface\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Other files receive data shape ${readableName(name)} from current file.`
                : "Other files receive a data shape from current file.";
            }

            if (trimmed.startsWith("export function ")) {
              const name = nameFrom(/^export\s+function\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Current file creates action ${readableName(name)} for other files.`
                : "Current file creates an action for other files.";
            }

            if (trimmed.startsWith("export const ")) {
              const name = nameFrom(/^export\s+const\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Current file creates fixed value ${readableName(name)} for other files.`
                : "Current file creates a fixed value for other files.";
            }

            if (trimmed.startsWith("export ")) {
              return "Current file shares named values with other files.";
            }

            return null;
          }

          function explainDeclaration(trimmed) {
            const fixed = trimmed.match(/^const\s+([A-Za-z0-9_$]+)\s*=\s*(.+?);?$/);
            if (fixed) {
              const name = readableName(fixed[1]);
              const value = fixed[2].trim();

              if (value.includes(".map(")) return `${name} becomes one result for every item in a named list.`;
              if (value.includes(".filter(")) return `${name} becomes only the items that pass a named requirement.`;
              if (value.includes(".find(")) return `${name} becomes the first item that passes a named requirement.`;
              if (value.includes(".some(")) return `${name} becomes true when at least one item passes a named requirement.`;
              if (value.includes(".every(")) return `${name} becomes true only when every item passes a named requirement.`;
              if (value.includes("await ")) return `${name} becomes the completed result of waiting work.`;
              if (value === "true") return `${name} starts enabled.`;
              if (value === "false") return `${name} starts disabled.`;
              if (value === "null") return `${name} starts empty.`;
              if (value === "undefined") return `${name} starts unavailable.`;
              if (value.startsWith("[")) return `${name} starts as an ordered group.`;
              if (value.startsWith("{")) return `${name} starts as a named group.`;
              if (value.includes("=>")) return `${name} becomes a named action.`;

              return `${name} receives a fixed value.`;
            }

            const fixedNoValue = trimmed.match(/^const\s+([A-Za-z0-9_$]+)/);
            if (fixedNoValue) {
              return `${readableName(fixedNoValue[1])} receives a fixed value.`;
            }

            const changeable = trimmed.match(/^(let|var)\s+([A-Za-z0-9_$]+)\s*=\s*(.+?);?$/);
            if (changeable) {
              const name = readableName(changeable[2]);
              const value = changeable[3].trim();

              if (value === "true") return `${name} starts enabled and may change.`;
              if (value === "false") return `${name} starts disabled and may change.`;
              if (value === "null") return `${name} starts empty and may change.`;
              if (value === "undefined") return `${name} starts unavailable and may change.`;

              return `${name} receives a changeable value.`;
            }

            const changeableNoValue = trimmed.match(/^(let|var)\s+([A-Za-z0-9_$]+)/);
            if (changeableNoValue) {
              return `${readableName(changeableNoValue[2])} receives a changeable value.`;
            }

            const action = trimmed.match(/^(async\s+)?function\s+([A-Za-z0-9_$]+)/);
            if (action) {
              const waits = Boolean(action[1]);
              const name = readableName(action[2]);

              return waits
                ? `${name} action starts and may wait for outside work.`
                : `${name} action starts.`;
            }

            const shape = trimmed.match(/^interface\s+([A-Za-z0-9_$]+)/);
            if (shape) return `${readableName(shape[1])} data shape starts.`;

            const rule = trimmed.match(/^type\s+([A-Za-z0-9_$]+)/);
            if (rule) return `${readableName(rule[1])} allowed value rule starts.`;

            const unit = trimmed.match(/^class\s+([A-Za-z0-9_$]+)/);
            if (unit) return `${readableName(unit[1])} reusable unit starts.`;

            return null;
          }

          function explainCondition(trimmed) {
            const inside = trimmed.match(/^if\s*$begin:math:text$\(\.\*\)$end:math:text$\s*\{?$/)?.[1];

            if (!inside) return "Named condition must pass before following group runs.";

            if (inside.includes("&&")) {
              return "Every named requirement must pass before following group runs.";
            }

            if (inside.includes("||")) {
              return "At least one named requirement must pass before following group runs.";
            }

            if (inside.startsWith("!")) {
              const target = inside.slice(1).replace(/[()]/g, "").trim();
              return `${readableName(target)} must be absent or false before following group runs.`;
            }

            return `${readableName(inside)} must pass before following group runs.`;
          }

          function explainAssignment(trimmed) {
            const match = trimmed.match(/^([A-Za-z0-9_.$[\]]+)\s*=\s*(.+?);?$/);
            if (!match) return null;

            const target = readableName(match[1]);
            const value = match[2].trim();

            if (value === "true") return `${target} becomes enabled.`;
            if (value === "false") return `${target} becomes disabled.`;
            if (value === "null") return `${target} becomes empty.`;
            if (value === "undefined") return `${target} becomes unavailable.`;

            return `${target} receives a new value.`;
          }

          function explainYaml(trimmed) {
            if (/^[A-Za-z0-9_-]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim();
              const rest = trimmed.slice(trimmed.indexOf(":") + 1).trim();

              if (rest) return `${readableName(key)} setting receives ${rest}.`;
              return `${readableName(key)} setting starts.`;
            }

            if (/^-\s+/.test(trimmed)) {
              return "Current list receives one item.";
            }

            return null;
          }

          function explainJson(trimmed) {
            if (/^"[^"]+"\s*:/.test(trimmed)) {
              const key = trimmed.match(/^"([^"]+)"/)?.[1];
              const rest = trimmed.slice(trimmed.indexOf(":") + 1).trim().replace(/,$/, "");

              if (rest === "true") return `${readableName(key)} field is enabled.`;
              if (rest === "false") return `${readableName(key)} field is disabled.`;
              if (rest === "null") return `${readableName(key)} field is empty.`;
              if (rest) return `${readableName(key)} field receives ${rest}.`;

              return `${readableName(key)} field starts.`;
            }

            return null;
          }

          function explainSql(trimmed) {
            const upper = trimmed.toUpperCase();

            if (upper.startsWith("CREATE TABLE")) return "Database table creation starts.";
            if (upper.startsWith("ALTER TABLE")) return "Database table change starts.";
            if (upper.startsWith("CREATE INDEX")) return "Database lookup helper creation starts.";
            if (upper.startsWith("INSERT INTO")) return "Database receives new stored data.";
            if (upper.startsWith("SELECT")) return "Database read request starts.";
            if (upper.startsWith("UPDATE")) return "Database stored data change starts.";
            if (upper.startsWith("DELETE")) return "Database stored data removal starts.";
            if (upper.startsWith("WHERE")) return "Database rule limits affected rows.";
            if (upper.startsWith("ORDER BY")) return "Database result order receives a rule.";
            if (upper.startsWith("GROUP BY")) return "Database results receive grouping.";
            if (upper.startsWith("RETURNING")) return "Database sends selected changed rows back.";

            return null;
          }

          function explainShell(trimmed) {
            if (trimmed.startsWith("#!")) return "Script runner receives a selection.";
            if (trimmed.startsWith("cd ")) return "Current command folder changes.";
            if (trimmed.startsWith("mkdir ")) return "Folder creation command runs.";
            if (trimmed.startsWith("echo ")) return "Text output command runs.";
            if (trimmed.startsWith("pnpm ")) return "Package command runs.";
            if (trimmed.startsWith("npm ")) return "Package command runs.";
            if (trimmed.startsWith("node ")) return "Node script command runs.";
            if (trimmed.startsWith("git ")) return "Repository command runs.";
            if (trimmed.startsWith("rm ")) return "Removal command runs.";
            if (trimmed.startsWith("cp ")) return "Copy command runs.";
            if (trimmed.startsWith("mv ")) return "Move command runs.";

            return null;
          }

          function strictLine(line, filePath) {
            const trimmed = line.trim();
            const ext = path.extname(filePath).toLowerCase();

            if (!trimmed) return "";

            if (
              trimmed.startsWith("//") ||
              trimmed.startsWith("/*") ||
              trimmed.startsWith("*") ||
              trimmed.startsWith("#")
            ) {
              return explainComment(trimmed);
            }

            if (trimmed.startsWith("import ")) return explainImport(trimmed);

            const exported = explainExport(trimmed);
            if (exported) return exported;

            const declared = explainDeclaration(trimmed);
            if (declared) return declared;

            if (/^if\s*\(/.test(trimmed)) return explainCondition(trimmed);
            if (/^else\s+if\s*\(/.test(trimmed)) return "Next named condition receives a check only after earlier condition fails.";
            if (/^else\b/.test(trimmed)) return "Fallback group runs only after earlier condition fails.";
            if (/^for\s*\(/.test(trimmed) || /^for\s+/.test(trimmed)) return "Following group repeats for each allowed step.";
            if (/^while\s*\(/.test(trimmed)) return "Following group repeats while named condition remains true.";
            if (/^switch\s*\(/.test(trimmed)) return "One path must be chosen from fixed possible paths.";
            if (/^case\s+/.test(trimmed)) return "Current path names one allowed choice.";
            if (/^default\s*:/.test(trimmed)) return "Fallback path handles all unmatched choices.";
            if (/^try\b/.test(trimmed)) return "Protected work starts.";
            if (/^catch\b/.test(trimmed)) return "Failure handling starts.";
            if (/^finally\b/.test(trimmed)) return "Cleanup work starts after protected work ends.";

            if (/^return\b/.test(trimmed)) {
              if (trimmed.includes("null")) return "Current action sends empty result back.";
              if (trimmed.includes("false")) return "Current action sends disabled result back.";
              if (trimmed.includes("true")) return "Current action sends enabled result back.";
              return "Current action sends result back.";
            }

            if (trimmed.includes("useState(")) return "Visible surface receives remembered changeable state.";
            if (trimmed.includes("useEffect(")) return "After-render work starts when listed requirements change.";
            if (trimmed.includes("useMemo(")) return "Remembered value updates only when listed requirements change.";
            if (trimmed.includes("useCallback(")) return "Remembered action updates only when listed requirements change.";
            if (trimmed.includes("useRef(")) return "Stable reference stores value without forcing visible update.";

            if (ext === ".json") {
              const json = explainJson(trimmed);
              if (json) return json;
            }

            if (ext === ".yml" || ext === ".yaml") {
              const yaml = explainYaml(trimmed);
              if (yaml) return yaml;
            }

            if (ext === ".sql") {
              const sql = explainSql(trimmed);
              if (sql) return sql;
            }

            if (ext === ".sh" || ext === ".bash") {
              const shell = explainShell(trimmed);
              if (shell) return shell;
            }

            const jsxOpen = trimmed.match(/^<([A-Za-z0-9_.$-]+)/);
            if (jsxOpen) return `${readableName(jsxOpen[1])} visible element starts.`;

            const jsxClose = trimmed.match(/^<\/([A-Za-z0-9_.$-]+)>/);
            if (jsxClose) return `${readableName(jsxClose[1])} visible element ends.`;

            if (trimmed === "{" || trimmed.endsWith("{")) return "Named group starts.";
            if (trimmed === "}" || trimmed === "};" || trimmed === "},") return "Current named group ends.";
            if (trimmed === "[" || trimmed.endsWith("[")) return "Ordered group starts.";
            if (trimmed === "]" || trimmed === "];" || trimmed === "],") return "Current ordered group ends.";

            const assigned = explainAssignment(trimmed);
            if (assigned) return assigned;

            if (/^[A-Za-z0-9_$'"]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim().replace(/^["']|["']$/g, "");
              const value = trimmed.slice(trimmed.indexOf(":") + 1).trim().replace(/,$/, "");

              if (value === "true") return `${readableName(key)} field is enabled.`;
              if (value === "false") return `${readableName(key)} field is disabled.`;
              if (value === "null") return `${readableName(key)} field is empty.`;
              if (value) return `${readableName(key)} field receives ${value}.`;

              return `${readableName(key)} field starts.`;
            }

            if (trimmed.endsWith(";")) return "Current instruction completes.";
            if (trimmed.endsWith(",")) return "Current structure receives one item or field.";

            const quoted = quotedValue(trimmed);
            if (quoted) return `Current line contains ${quoted}.`;

            return "Current instruction continues.";
          }

          function translateFile(relativePath, buffer) {
            const text = buffer.toString("utf8");
            const { lines, endedWithNewline } = splitPhysicalLines(text);

            const outPath = path.join(outRoot, `${relativePath}.csv`);
            ensureDir(outPath);

            const rows = lines.map((line, index) => {
              const lineNumber = index + 1;
              const translation = strictLine(line, relativePath);

              return `${lineNumber},${csvCell(translation)}`;
            });

            let output = rows.join("\n");

            if (endedWithNewline && rows.length > 0) {
              output += "\n";
            }

            fs.writeFileSync(outPath, output);
          }

          function walk(directory) {
            const entries = fs.readdirSync(directory, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              const relativePath = toPosix(path.relative(repoRoot, absolutePath));

              if (!relativePath || shouldIgnore(relativePath)) continue;

              if (entry.isDirectory()) {
                files.push(...walk(absolutePath));
                continue;
              }

              if (entry.isFile()) {
                files.push({ absolutePath, relativePath });
              }
            }

            return files;
          }

          fs.rmSync(outRoot, { recursive: true, force: true });
          fs.mkdirSync(outRoot, { recursive: true });

          const files = walk(repoRoot);

          let translated = 0;
          let listedAsset = 0;
          let skippedLarge = 0;
          let skippedBinary = 0;

          for (const file of files) {
            const buffer = fs.readFileSync(file.absolutePath);

            if (isAssetFile(file.relativePath)) {
              listedAsset += 1;
              continue;
            }

            if (buffer.length > maxFileBytes) {
              skippedLarge += 1;
              continue;
            }

            if (!isProbablyText(file.relativePath, buffer)) {
              skippedBinary += 1;
              continue;
            }

            translateFile(file.relativePath, buffer);
            translated += 1;
          }

          console.log(`Translated text files: ${translated}`);
          console.log(`Asset files left out: ${listedAsset}`);
          console.log(`Large files left out: ${skippedLarge}`);
          console.log(`Other binary files left out: ${skippedBinary}`);
          NODE

          node export-strict-english-csv-repo.mjs

      - name: Upload strict English CSV repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: strict-english-csv-repo-${{ github.run_id }}
          path: build-memory/strict-english-csv-repo
          retention-days: 30
          if-no-files-found: error
