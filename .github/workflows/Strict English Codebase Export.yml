name: Strict English Codebase Export

on:
  workflow_dispatch:
    inputs:
      max_file_bytes:
        description: "Maximum text file size to translate"
        required: false
        default: "10000000"

permissions:
  contents: read

concurrency:
  group: strict-english-codebase-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  strict-english-codebase-export:
    name: Mirror repo as strict English line translations
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"

      - name: Generate strict English translated mirror
        env:
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        run: |
          cat > export-strict-english-codebase.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const repoRoot = process.cwd();
          const outRoot = path.join(repoRoot, "build-memory", "strict-english-codebase");
          const manifestPath = path.join(repoRoot, "build-memory", "strict-english-codebase-manifest.json");
          const summaryPath = path.join(repoRoot, "build-memory", "strict-english-codebase-summary.md");
          const assetListPath = path.join(repoRoot, "build-memory", "strict-english-asset-files.txt");
          const maxFileBytes = Number(process.env.MAX_FILE_BYTES || "10000000");

          const ignoredDirectories = new Set([
            ".git",
            ".next",
            "node_modules",
            "dist",
            "build",
            ".vercel",
            ".turbo",
            "coverage",
            "tmp",
            "temp",
            "reports",
            "test-output",
            "build-memory/strict-english-codebase",
          ]);

          const textExtensions = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".md",
            ".mdx",
            ".yml",
            ".yaml",
            ".css",
            ".scss",
            ".html",
            ".txt",
            ".sql",
            ".sh",
            ".bash",
            ".env",
            ".example",
            ".gitignore",
            ".dockerignore",
            ".toml",
            ".xml",
            ".csv",
          ]);

          const assetExtensions = new Set([
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".webp",
            ".ico",
            ".glb",
            ".gltf",
            ".mp4",
            ".mov",
            ".mp3",
            ".wav",
            ".ogg",
            ".wasm",
            ".zip",
            ".gz",
            ".tar",
            ".pdf",
            ".ttf",
            ".otf",
            ".woff",
            ".woff2",
            ".bin",
          ]);

          function toPosix(filePath) {
            return filePath.split(path.sep).join("/");
          }

          function ensureDir(filePath) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
          }

          function shouldIgnore(relativePath) {
            const posix = toPosix(relativePath);

            for (const ignored of ignoredDirectories) {
              if (posix === ignored || posix.startsWith(`${ignored}/`)) {
                return true;
              }
            }

            return false;
          }

          function isAssetFile(filePath) {
            return assetExtensions.has(path.extname(filePath).toLowerCase());
          }

          function isProbablyText(filePath, buffer) {
            const base = path.basename(filePath);
            const ext = path.extname(filePath).toLowerCase();

            if (textExtensions.has(ext)) return true;
            if (textExtensions.has(base)) return true;
            if (assetExtensions.has(ext)) return false;
            if (buffer.includes(0)) return false;

            const sample = buffer.subarray(0, Math.min(buffer.length, 4096));
            let suspicious = 0;

            for (const byte of sample) {
              const isTab = byte === 9;
              const isNewline = byte === 10 || byte === 13;
              const isPrintable = byte >= 32 && byte <= 126;
              const isUtf8Likely = byte >= 128;

              if (!isTab && !isNewline && !isPrintable && !isUtf8Likely) {
                suspicious += 1;
              }
            }

            return suspicious / Math.max(sample.length, 1) < 0.02;
          }

          function splitPhysicalLines(text) {
            const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

            if (normalized.length === 0) {
              return { lines: [], sourceEndedWithNewline: false };
            }

            const sourceEndedWithNewline = normalized.endsWith("\n");
            const lines = normalized.split("\n");

            if (sourceEndedWithNewline) {
              lines.pop();
            }

            return { lines, sourceEndedWithNewline };
          }

          function cleanComment(trimmed) {
            return trimmed
              .replace(/^\/\//, "")
              .replace(/^\/\*/, "")
              .replace(/^\*/, "")
              .replace(/\*\/$/, "")
              .replace(/^#/, "")
              .trim();
          }

          function nameFrom(pattern, text) {
            return text.match(pattern)?.[1] || null;
          }

          function strictEnglishForLine(line, filePath) {
            const trimmed = line.trim();
            const ext = path.extname(filePath).toLowerCase();

            if (!trimmed) return "";

            if (
              trimmed.startsWith("//") ||
              trimmed.startsWith("/*") ||
              trimmed.startsWith("*") ||
              trimmed.startsWith("#")
            ) {
              const note = cleanComment(trimmed);
              return note ? `Human note states ${note}.` : "Human note marker exists.";
            }

            if (trimmed.startsWith("import ")) {
              const fromMatch = trimmed.match(/from\s+["']([^"']+)["']/);
              const bareMatch = trimmed.match(/^import\s+["']([^"']+)["']/);
              const source = fromMatch?.[1] || bareMatch?.[1];

              return source
                ? `Current file receives outside names from ${source}.`
                : "Current file receives outside names.";
            }

            if (trimmed.startsWith("export default function ")) {
              const name = nameFrom(/^export\s+default\s+function\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Other files receive ${name} as the main action from current file.`
                : "Other files receive the main action from current file.";
            }

            if (trimmed.startsWith("export default ")) {
              return "Other files receive the main value from current file.";
            }

            if (trimmed.startsWith("export type ")) {
              const name = nameFrom(/^export\s+type\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Other files receive allowed value rule ${name} from current file.`
                : "Other files receive an allowed value rule from current file.";
            }

            if (trimmed.startsWith("export interface ")) {
              const name = nameFrom(/^export\s+interface\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Other files receive data shape ${name} from current file.`
                : "Other files receive a data shape from current file.";
            }

            if (trimmed.startsWith("export function ")) {
              const name = nameFrom(/^export\s+function\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Current file creates action ${name} for other files.`
                : "Current file creates an action for other files.";
            }

            if (trimmed.startsWith("export const ")) {
              const name = nameFrom(/^export\s+const\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? `Current file creates fixed value ${name} for other files.`
                : "Current file creates a fixed value for other files.";
            }

            if (trimmed.startsWith("export ")) {
              return "Current file makes named values available to other files.";
            }

            const constMatch = nameFrom(/^const\s+([A-Za-z0-9_$]+)/, trimmed);
            if (constMatch) {
              return `Current scope creates fixed value ${constMatch}.`;
            }

            const letMatch = nameFrom(/^let\s+([A-Za-z0-9_$]+)/, trimmed);
            if (letMatch) {
              return `Current scope creates changeable value ${letMatch}.`;
            }

            const varMatch = nameFrom(/^var\s+([A-Za-z0-9_$]+)/, trimmed);
            if (varMatch) {
              return `Current scope creates changeable value ${varMatch}.`;
            }

            const functionMatch = trimmed.match(/^(async\s+)?function\s+([A-Za-z0-9_$]+)/);
            if (functionMatch) {
              const isAsync = Boolean(functionMatch[1]);
              const name = functionMatch[2];

              return isAsync
                ? `Action ${name} starts and may wait for outside work.`
                : `Action ${name} starts.`;
            }

            const interfaceMatch = nameFrom(/^interface\s+([A-Za-z0-9_$]+)/, trimmed);
            if (interfaceMatch) {
              return `Data shape ${interfaceMatch} starts.`;
            }

            const typeMatch = nameFrom(/^type\s+([A-Za-z0-9_$]+)/, trimmed);
            if (typeMatch) {
              return `Allowed value rule ${typeMatch} starts.`;
            }

            const classMatch = nameFrom(/^class\s+([A-Za-z0-9_$]+)/, trimmed);
            if (classMatch) {
              return `Reusable unit ${classMatch} starts.`;
            }

            if (/^if\s*\(/.test(trimmed)) return "Condition must pass before following block runs.";
            if (/^else\s+if\s*\(/.test(trimmed)) return "Next condition receives a check only after earlier condition fails.";
            if (/^else\b/.test(trimmed)) return "Fallback block runs only after earlier condition fails.";
            if (/^for\s*\(/.test(trimmed) || /^for\s+/.test(trimmed)) return "Following block repeats for each allowed step.";
            if (/^while\s*\(/.test(trimmed)) return "Following block repeats while condition remains true.";
            if (/^switch\s*\(/.test(trimmed)) return "One path must be chosen from fixed possible paths.";
            if (/^case\s+/.test(trimmed)) return "Current path names one allowed choice.";
            if (/^default\s*:/.test(trimmed)) return "Fallback path handles all unmatched choices.";
            if (/^try\b/.test(trimmed)) return "Protected work starts.";
            if (/^catch\b/.test(trimmed)) return "Failure handling starts.";
            if (/^finally\b/.test(trimmed)) return "Cleanup work starts after protected work ends.";
            if (/^return\b/.test(trimmed)) return "Current action sends result back to caller.";

            if (trimmed.includes("useState(")) return "Visible surface receives remembered changeable state.";
            if (trimmed.includes("useEffect(")) return "After-render work starts when listed requirements change.";
            if (trimmed.includes("useMemo(")) return "Remembered value updates only when listed requirements change.";
            if (trimmed.includes("useCallback(")) return "Remembered action updates only when listed requirements change.";
            if (trimmed.includes("useRef(")) return "Stable reference stores value without forcing visible update.";

            if (ext === ".json" && /^"[^"]+"\s*:/.test(trimmed)) {
              const key = trimmed.match(/^"([^"]+)"/)?.[1];
              return `Data field ${key} receives a definition.`;
            }

            if ((ext === ".yml" || ext === ".yaml") && /^[A-Za-z0-9_-]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim();
              return `Setting ${key} receives a definition.`;
            }

            if ((ext === ".yml" || ext === ".yaml") && /^-\s+/.test(trimmed)) {
              return "Current list receives one item.";
            }

            if (ext === ".sql") {
              const upper = trimmed.toUpperCase();

              if (upper.startsWith("CREATE TABLE")) return "Database table creation starts.";
              if (upper.startsWith("ALTER TABLE")) return "Database table change starts.";
              if (upper.startsWith("CREATE INDEX")) return "Database lookup helper creation starts.";
              if (upper.startsWith("INSERT INTO")) return "Database receives new stored data.";
              if (upper.startsWith("SELECT")) return "Database read request starts.";
              if (upper.startsWith("UPDATE")) return "Database stored data change starts.";
              if (upper.startsWith("DELETE")) return "Database stored data removal starts.";
            }

            if (ext === ".sh" || ext === ".bash") {
              if (trimmed.startsWith("#!")) return "Script runner receives a selection.";
              if (trimmed.startsWith("cd ")) return "Current command folder changes.";
              if (trimmed.startsWith("mkdir ")) return "Folder creation command runs.";
              if (trimmed.startsWith("echo ")) return "Text output command runs.";
              if (trimmed.startsWith("pnpm ")) return "Package command runs.";
              if (trimmed.startsWith("npm ")) return "Package command runs.";
              if (trimmed.startsWith("node ")) return "Node script command runs.";
              if (trimmed.startsWith("git ")) return "Repository command runs.";
            }

            const jsxOpen = trimmed.match(/^<([A-Za-z0-9_.$-]+)/);
            if (jsxOpen) {
              return `Visible element ${jsxOpen[1]} starts.`;
            }

            const jsxClose = trimmed.match(/^<\/([A-Za-z0-9_.$-]+)>/);
            if (jsxClose) {
              return `Visible element ${jsxClose[1]} ends.`;
            }

            if (trimmed === "{" || trimmed.endsWith("{")) return "Grouped instructions start.";
            if (trimmed === "}" || trimmed === "};" || trimmed === "},") return "Current grouped instructions end.";
            if (trimmed === "[" || trimmed.endsWith("[")) return "Ordered group starts.";
            if (trimmed === "]" || trimmed === "];" || trimmed === "],") return "Current ordered group ends.";

            if (/^[A-Za-z0-9_.$[\]]+\s*=/.test(trimmed)) {
              const name = trimmed.split("=")[0].trim();
              return `${name} receives a new value.`;
            }

            if (/^[A-Za-z0-9_$'"]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim().replace(/^["']|["']$/g, "");
              return `Field ${key} receives a definition.`;
            }

            if (trimmed.endsWith(";")) return "Current instruction completes.";
            if (trimmed.endsWith(",")) return "Current structure receives one item or field.";

            return "Current instruction continues.";
          }

          function translateTextFile(relativePath, buffer) {
            const text = buffer.toString("utf8");
            const { lines, sourceEndedWithNewline } = splitPhysicalLines(text);

            const outPath = path.join(outRoot, `${relativePath}.strict-english.txt`);
            ensureDir(outPath);

            const translatedLines = lines.map((line) => {
              if (line.trim() === "") return "";
              return strictEnglishForLine(line, relativePath);
            });

            let output = translatedLines.join("\n");
            if (sourceEndedWithNewline && translatedLines.length > 0) {
              output += "\n";
            }

            fs.writeFileSync(outPath, output);

            return {
              path: relativePath,
              output: toPosix(path.relative(outRoot, outPath)),
              kind: "translated-text",
              sourceLines: lines.length,
              translatedLines: translatedLines.length,
              bytes: buffer.length,
            };
          }

          function walk(directory) {
            const entries = fs.readdirSync(directory, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              const relativePath = toPosix(path.relative(repoRoot, absolutePath));

              if (!relativePath || shouldIgnore(relativePath)) continue;

              if (entry.isDirectory()) {
                files.push(...walk(absolutePath));
                continue;
              }

              if (entry.isFile()) {
                files.push({ absolutePath, relativePath });
              }
            }

            return files;
          }

          fs.rmSync(outRoot, { recursive: true, force: true });
          fs.mkdirSync(outRoot, { recursive: true });

          const files = walk(repoRoot);
          const manifest = [];
          const assetFiles = [];

          let translatedTextFiles = 0;
          let skippedLargeFiles = 0;
          let skippedAssetFiles = 0;
          let skippedBinaryFiles = 0;
          let totalSourceLines = 0;
          let totalTranslatedLines = 0;

          for (const file of files) {
            const buffer = fs.readFileSync(file.absolutePath);

            if (isAssetFile(file.relativePath)) {
              skippedAssetFiles += 1;
              assetFiles.push(file.relativePath);
              manifest.push({
                path: file.relativePath,
                kind: "asset-file-listed-only",
                bytes: buffer.length,
              });
              continue;
            }

            if (buffer.length > maxFileBytes) {
              skippedLargeFiles += 1;
              manifest.push({
                path: file.relativePath,
                kind: "skipped-large-file",
                bytes: buffer.length,
              });
              continue;
            }

            if (!isProbablyText(file.relativePath, buffer)) {
              skippedBinaryFiles += 1;
              assetFiles.push(file.relativePath);
              manifest.push({
                path: file.relativePath,
                kind: "binary-file-listed-only",
                bytes: buffer.length,
              });
              continue;
            }

            const entry = translateTextFile(file.relativePath, buffer);

            translatedTextFiles += 1;
            totalSourceLines += entry.sourceLines;
            totalTranslatedLines += entry.translatedLines;
            manifest.push(entry);
          }

          fs.writeFileSync(assetListPath, assetFiles.sort().join("\n") + (assetFiles.length ? "\n" : ""));

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(
              {
                generatedAt: new Date().toISOString(),
                sourceBranch: process.env.GITHUB_REF_NAME || null,
                sourceSha: process.env.GITHUB_SHA || null,
                outputRoot: "build-memory/strict-english-codebase",
                translatedTextFiles,
                skippedLargeFiles,
                skippedAssetFiles,
                skippedBinaryFiles,
                totalSeenFiles: files.length,
                totalSourceLines,
                totalTranslatedLines,
                lineRule: "Each source line produces exactly one translated line. Blank source lines produce blank translated lines.",
                assetRule: "Image, model, font, media, archive, wasm, and other binary assets are listed by file path only.",
                files: manifest,
              },
              null,
              2
            )
          );

          fs.writeFileSync(
            summaryPath,
            [
              "# Strict English Codebase Export",
              "",
              `Generated at: ${new Date().toISOString()}`,
              "",
              `Text files translated: ${translatedTextFiles}`,
              `Asset files listed only: ${skippedAssetFiles}`,
              `Other binary files listed only: ${skippedBinaryFiles}`,
              `Large files skipped: ${skippedLargeFiles}`,
              `Total files seen: ${files.length}`,
              `Total source lines translated: ${totalSourceLines}`,
              `Total strict-English lines written: ${totalTranslatedLines}`,
              "",
              "Rules:",
              "",
              "- Each source line produces exactly one translated line.",
              "- Blank source lines produce blank translated lines.",
              "- Translated files do not include original code.",
              "- Image, model, font, media, archive, wasm, and other binary assets are listed by file path only.",
              "",
            ].join("\n")
          );

          console.log(`Text files translated: ${translatedTextFiles}`);
          console.log(`Asset files listed only: ${skippedAssetFiles}`);
          console.log(`Other binary files listed only: ${skippedBinaryFiles}`);
          console.log(`Total source lines translated: ${totalSourceLines}`);
          console.log(`Total strict-English lines written: ${totalTranslatedLines}`);
          NODE

          node export-strict-english-codebase.mjs

      - name: Create downloadable zip
        run: |
          cd build-memory
          zip -r strict-english-codebase.zip \
            strict-english-codebase \
            strict-english-codebase-manifest.json \
            strict-english-codebase-summary.md \
            strict-english-asset-files.txt

      - name: Upload strict English codebase zip
        uses: actions/upload-artifact@v4
        with:
          name: strict-english-codebase-${{ github.run_id }}
          path: build-memory/strict-english-codebase.zip
          retention-days: 30
          if-no-files-found: error
