name: Strict English Codebase Export

on:
  workflow_dispatch:
    inputs:
      max_file_bytes:
        description: "Maximum text file size to translate"
        required: false
        default: "10000000"

permissions:
  contents: read

concurrency:
  group: strict-english-codebase-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  strict-english-codebase-export:
    name: Mirror repo as strict English line translations
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'

      - name: Generate strict English translated mirror
        env:
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        run: |
          cat > export-strict-english-codebase.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const repoRoot = process.cwd();
          const outRoot = path.join(repoRoot, "build-memory", "strict-english-codebase");
          const manifestPath = path.join(repoRoot, "build-memory", "strict-english-codebase-manifest.json");
          const summaryPath = path.join(repoRoot, "build-memory", "strict-english-codebase-summary.md");
          const assetListPath = path.join(repoRoot, "build-memory", "strict-english-asset-files.txt");
          const maxFileBytes = Number(process.env.MAX_FILE_BYTES || "10000000");

          const ignoredDirectories = new Set([
            ".git",
            ".next",
            "node_modules",
            "dist",
            "build",
            ".vercel",
            ".turbo",
            "coverage",
            "tmp",
            "temp",
            "reports",
            "test-output",
            "build-memory/strict-english-codebase",
          ]);

          const textExtensions = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".md",
            ".mdx",
            ".yml",
            ".yaml",
            ".css",
            ".scss",
            ".html",
            ".txt",
            ".sql",
            ".sh",
            ".bash",
            ".env",
            ".example",
            ".gitignore",
            ".dockerignore",
            ".toml",
            ".xml",
            ".csv",
          ]);

          const assetExtensions = new Set([
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".webp",
            ".ico",
            ".glb",
            ".gltf",
            ".mp4",
            ".mov",
            ".mp3",
            ".wav",
            ".ogg",
            ".wasm",
            ".zip",
            ".gz",
            ".tar",
            ".pdf",
            ".ttf",
            ".otf",
            ".woff",
            ".woff2",
            ".bin",
          ]);

          function toPosix(filePath) {
            return filePath.split(path.sep).join("/");
          }

          function ensureDir(filePath) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
          }

          function shouldIgnore(relativePath) {
            const posix = toPosix(relativePath);

            for (const ignored of ignoredDirectories) {
              if (posix === ignored || posix.startsWith(`${ignored}/`)) {
                return true;
              }
            }

            return false;
          }

          function isAssetFile(filePath) {
            return assetExtensions.has(path.extname(filePath).toLowerCase());
          }

          function isProbablyText(filePath, buffer) {
            const base = path.basename(filePath);
            const ext = path.extname(filePath).toLowerCase();

            if (textExtensions.has(ext)) return true;
            if (textExtensions.has(base)) return true;
            if (assetExtensions.has(ext)) return false;
            if (buffer.includes(0)) return false;

            const sample = buffer.subarray(0, Math.min(buffer.length, 4096));
            let suspicious = 0;

            for (const byte of sample) {
              const isTab = byte === 9;
              const isNewline = byte === 10 || byte === 13;
              const isPrintable = byte >= 32 && byte <= 126;
              const isUtf8Likely = byte >= 128;

              if (!isTab && !isNewline && !isPrintable && !isUtf8Likely) {
                suspicious += 1;
              }
            }

            return suspicious / Math.max(sample.length, 1) < 0.02;
          }

          function splitPhysicalLines(text) {
            const normalized = text.replace(/\r\n/g, "\n");

            if (normalized.length === 0) {
              return [];
            }

            const lines = normalized.split("\n");

            if (lines.length > 0 && lines[lines.length - 1] === "") {
              lines.pop();
            }

            return lines;
          }

          function cleanComment(trimmed) {
            return trimmed
              .replace(/^\/\//, "")
              .replace(/^\/\*/, "")
              .replace(/^\*/, "")
              .replace(/\*\/$/, "")
              .replace(/^#/, "")
              .trim();
          }

          function strictEnglishForLine(line, filePath) {
            const trimmed = line.trim();
            const ext = path.extname(filePath).toLowerCase();

            if (!trimmed) return "";

            if (
              trimmed.startsWith("//") ||
              trimmed.startsWith("/*") ||
              trimmed.startsWith("*") ||
              trimmed.startsWith("#")
            ) {
              const note = cleanComment(trimmed);
              return note ? `Human note: ${note}.` : "Comment marker.";
            }

            if (trimmed.startsWith("import ")) {
              const fromMatch = trimmed.match(/from\s+["']([^"']+)["']/);
              const bareMatch = trimmed.match(/^import\s+["']([^"']+)["']/);
              const source = fromMatch?.[1] || bareMatch?.[1];

              return source
                ? `Bring code from ${source} into this file.`
                : "Bring outside code into this file.";
            }

            if (trimmed.startsWith("export default function ")) {
              const name = trimmed.match(/^export\s+default\s+function\s+([A-Za-z0-9_$]+)/)?.[1];
              return name
                ? `Make ${name} the main function other files receive from this file.`
                : "Make this function the main thing other files receive from this file.";
            }

            if (trimmed.startsWith("export default ")) {
              return "Make this value the main thing other files receive from this file.";
            }

            if (trimmed.startsWith("export type ")) {
              const name = trimmed.match(/^export\s+type\s+([A-Za-z0-9_$]+)/)?.[1];
              return name
                ? `Make the type rule named ${name} available to other files.`
                : "Make this type rule available to other files.";
            }

            if (trimmed.startsWith("export interface ")) {
              const name = trimmed.match(/^export\s+interface\s+([A-Za-z0-9_$]+)/)?.[1];
              return name
                ? `Make the shape named ${name} available to other files.`
                : "Make this shape available to other files.";
            }

            if (trimmed.startsWith("export function ")) {
              const name = trimmed.match(/^export\s+function\s+([A-Za-z0-9_$]+)/)?.[1];
              return name
                ? `Create the action named ${name} and make the action available to other files.`
                : "Create this action and make the action available to other files.";
            }

            if (trimmed.startsWith("export const ")) {
              const name = trimmed.match(/^export\s+const\s+([A-Za-z0-9_$]+)/)?.[1];
              return name
                ? `Create the value named ${name} and make the value available to other files.`
                : "Create this value and make the value available to other files.";
            }

            if (trimmed.startsWith("export ")) {
              return "Make named code from this file available to other files.";
            }

            const constMatch = trimmed.match(/^const\s+([A-Za-z0-9_$]+)/);
            if (constMatch) {
              return `Create the value named ${constMatch[1]}.`;
            }

            const letMatch = trimmed.match(/^let\s+([A-Za-z0-9_$]+)/);
            if (letMatch) {
              return `Create the changeable value named ${letMatch[1]}.`;
            }

            const varMatch = trimmed.match(/^var\s+([A-Za-z0-9_$]+)/);
            if (varMatch) {
              return `Create the changeable value named ${varMatch[1]}.`;
            }

            const functionMatch = trimmed.match(/^(async\s+)?function\s+([A-Za-z0-9_$]+)/);
            if (functionMatch) {
              const isAsync = Boolean(functionMatch[1]);
              const name = functionMatch[2];

              return isAsync
                ? `Start the asynchronous action named ${name}.`
                : `Start the action named ${name}.`;
            }

            const interfaceMatch = trimmed.match(/^interface\s+([A-Za-z0-9_$]+)/);
            if (interfaceMatch) {
              return `Start the shape named ${interfaceMatch[1]}.`;
            }

            const typeMatch = trimmed.match(/^type\s+([A-Za-z0-9_$]+)/);
            if (typeMatch) {
              return `Start the type rule named ${typeMatch[1]}.`;
            }

            const classMatch = trimmed.match(/^class\s+([A-Za-z0-9_$]+)/);
            if (classMatch) {
              return `Start the class named ${classMatch[1]}.`;
            }

            if (/^if\s*\(/.test(trimmed)) return "Check whether the condition is true.";
            if (/^else\s+if\s*\(/.test(trimmed)) return "Check another condition only after the earlier condition fails.";
            if (/^else\b/.test(trimmed)) return "Run this fallback only when the earlier condition fails.";
            if (/^for\s*\(/.test(trimmed) || /^for\s+/.test(trimmed)) return "Repeat the next block for each allowed step.";
            if (/^while\s*\(/.test(trimmed)) return "Repeat the next block while the condition remains true.";
            if (/^switch\s*\(/.test(trimmed)) return "Choose one path from a fixed set of possible paths.";
            if (/^case\s+/.test(trimmed)) return "Name one allowed path inside the choice block.";
            if (/^default\s*:/.test(trimmed)) return "Name the fallback path inside the choice block.";
            if (/^try\b/.test(trimmed)) return "Start protected work that may fail.";
            if (/^catch\b/.test(trimmed)) return "Handle a failure from protected work.";
            if (/^finally\b/.test(trimmed)) return "Run cleanup after protected work ends.";
            if (/^return\b/.test(trimmed)) return "Send a result back to the caller and stop this path.";

            if (trimmed.includes("useState(")) return "Create or read state that can change the visible surface.";
            if (trimmed.includes("useEffect(")) return "Start work that runs after rendering when its requirements change.";
            if (trimmed.includes("useMemo(")) return "Create a remembered value that changes only when its requirements change.";
            if (trimmed.includes("useCallback(")) return "Create a remembered action that changes only when its requirements change.";
            if (trimmed.includes("useRef(")) return "Create a reference that can hold a value without forcing a visible update.";

            if (ext === ".json" && /^"[^"]+"\s*:/.test(trimmed)) {
              const key = trimmed.match(/^"([^"]+)"/)?.[1];
              return `Define the JSON field named ${key}.`;
            }

            if ((ext === ".yml" || ext === ".yaml") && /^[A-Za-z0-9_-]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim();
              return `Define the YAML setting named ${key}.`;
            }

            if ((ext === ".yml" || ext === ".yaml") && /^-\s+/.test(trimmed)) {
              return "Add one item to the current YAML list.";
            }

            if (ext === ".sql") {
              const upper = trimmed.toUpperCase();

              if (upper.startsWith("CREATE TABLE")) return "Start a database table creation rule.";
              if (upper.startsWith("ALTER TABLE")) return "Start a database table change rule.";
              if (upper.startsWith("CREATE INDEX")) return "Start a database index creation rule.";
              if (upper.startsWith("INSERT INTO")) return "Start a database insert rule.";
              if (upper.startsWith("SELECT")) return "Start a database read rule.";
              if (upper.startsWith("UPDATE")) return "Start a database update rule.";
              if (upper.startsWith("DELETE")) return "Start a database delete rule.";
            }

            if (ext === ".sh" || ext === ".bash") {
              if (trimmed.startsWith("#!")) return "Select the program that runs this script.";
              if (trimmed.startsWith("cd ")) return "Change the current working folder.";
              if (trimmed.startsWith("mkdir ")) return "Create one or more folders.";
              if (trimmed.startsWith("echo ")) return "Write text to command output or to a file.";
              if (trimmed.startsWith("pnpm ")) return "Run a pnpm command.";
              if (trimmed.startsWith("npm ")) return "Run an npm command.";
              if (trimmed.startsWith("node ")) return "Run a Node.js script.";
              if (trimmed.startsWith("git ")) return "Run a Git command.";
            }

            const jsxOpen = trimmed.match(/^<([A-Za-z0-9_.$-]+)/);
            if (jsxOpen) {
              return `Start the visible element or component named ${jsxOpen[1]}.`;
            }

            const jsxClose = trimmed.match(/^<\/([A-Za-z0-9_.$-]+)>/);
            if (jsxClose) {
              return `End the visible element or component named ${jsxClose[1]}.`;
            }

            if (trimmed === "{" || trimmed.endsWith("{")) return "Start a block.";
            if (trimmed === "}" || trimmed === "};" || trimmed === "},") return "End the current block.";
            if (trimmed === "[" || trimmed.endsWith("[")) return "Start a list.";
            if (trimmed === "]" || trimmed === "];" || trimmed === "],") return "End the current list.";

            if (/^[A-Za-z0-9_.$[\]]+\s*=/.test(trimmed)) {
              const name = trimmed.split("=")[0].trim();
              return `Set ${name} to a new value.`;
            }

            if (/^[A-Za-z0-9_$'"]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim().replace(/^["']|["']$/g, "");
              return `Define the field named ${key}.`;
            }

            if (trimmed.endsWith(";")) return "Perform one complete instruction.";
            if (trimmed.endsWith(",")) return "Provide one item or field inside the current structure.";

            return "Continue the current instruction or text.";
          }

          function translateTextFile(relativePath, buffer) {
            const text = buffer.toString("utf8");
            const lines = splitPhysicalLines(text);

            const outPath = path.join(outRoot, `${relativePath}.strict-english.txt`);
            ensureDir(outPath);

            const translatedLines = lines.map((line) => {
              if (line.trim() === "") return "";
              return strictEnglishForLine(line, relativePath);
            });

            fs.writeFileSync(outPath, translatedLines.join("\n"));

            return {
              path: relativePath,
              output: toPosix(path.relative(outRoot, outPath)),
              kind: "translated-text",
              sourceLines: lines.length,
              translatedLines: translatedLines.length,
              bytes: buffer.length,
            };
          }

          function walk(directory) {
            const entries = fs.readdirSync(directory, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              const relativePath = toPosix(path.relative(repoRoot, absolutePath));

              if (!relativePath || shouldIgnore(relativePath)) continue;

              if (entry.isDirectory()) {
                files.push(...walk(absolutePath));
                continue;
              }

              if (entry.isFile()) {
                files.push({ absolutePath, relativePath });
              }
            }

            return files;
          }

          fs.rmSync(outRoot, { recursive: true, force: true });
          fs.mkdirSync(outRoot, { recursive: true });

          const files = walk(repoRoot);
          const manifest = [];
          const assetFiles = [];

          let translatedTextFiles = 0;
          let skippedLargeFiles = 0;
          let skippedAssetFiles = 0;
          let skippedBinaryFiles = 0;
          let totalSourceLines = 0;
          let totalTranslatedLines = 0;

          for (const file of files) {
            const buffer = fs.readFileSync(file.absolutePath);

            if (isAssetFile(file.relativePath)) {
              skippedAssetFiles += 1;
              assetFiles.push(file.relativePath);
              manifest.push({
                path: file.relativePath,
                kind: "asset-file-listed-only",
                bytes: buffer.length,
              });
              continue;
            }

            if (buffer.length > maxFileBytes) {
              skippedLargeFiles += 1;
              manifest.push({
                path: file.relativePath,
                kind: "skipped-large-file",
                bytes: buffer.length,
              });
              continue;
            }

            if (!isProbablyText(file.relativePath, buffer)) {
              skippedBinaryFiles += 1;
              assetFiles.push(file.relativePath);
              manifest.push({
                path: file.relativePath,
                kind: "binary-file-listed-only",
                bytes: buffer.length,
              });
              continue;
            }

            const entry = translateTextFile(file.relativePath, buffer);

            translatedTextFiles += 1;
            totalSourceLines += entry.sourceLines;
            totalTranslatedLines += entry.translatedLines;
            manifest.push(entry);
          }

          fs.writeFileSync(assetListPath, assetFiles.sort().join("\n") + (assetFiles.length ? "\n" : ""));

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(
              {
                generatedAt: new Date().toISOString(),
                sourceBranch: process.env.GITHUB_REF_NAME || null,
                sourceSha: process.env.GITHUB_SHA || null,
                outputRoot: "build-memory/strict-english-codebase",
                translatedTextFiles,
                skippedLargeFiles,
                skippedAssetFiles,
                skippedBinaryFiles,
                totalSeenFiles: files.length,
                totalSourceLines,
                totalTranslatedLines,
                lineRule: "Each source line produces exactly one translated line. Blank source lines produce blank translated lines.",
                assetRule: "Image, model, font, media, archive, wasm, and other binary assets are listed by file path only.",
                files: manifest,
              },
              null,
              2
            )
          );

          fs.writeFileSync(
            summaryPath,
            [
              "# Strict English Codebase Export",
              "",
              `Generated at: ${new Date().toISOString()}`,
              "",
              `Text files translated: ${translatedTextFiles}`,
              `Asset files listed only: ${skippedAssetFiles}`,
              `Other binary files listed only: ${skippedBinaryFiles}`,
              `Large files skipped: ${skippedLargeFiles}`,
              `Total files seen: ${files.length}`,
              `Total source lines translated: ${totalSourceLines}`,
              `Total strict-English lines written: ${totalTranslatedLines}`,
              "",
              "Rules:",
              "",
              "- Each source line produces exactly one translated line.",
              "- Blank source lines produce blank translated lines.",
              "- Translated files do not include original code.",
              "- Image, model, font, media, archive, wasm, and other binary assets are listed by file path only.",
              "",
            ].join("\n")
          );

          console.log(`Text files translated: ${translatedTextFiles}`);
          console.log(`Asset files listed only: ${skippedAssetFiles}`);
          console.log(`Other binary files listed only: ${skippedBinaryFiles}`);
          console.log(`Total source lines translated: ${totalSourceLines}`);
          console.log(`Total strict-English lines written: ${totalTranslatedLines}`);
          NODE

          node export-strict-english-codebase.mjs

      - name: Create downloadable zip
        run: |
          cd build-memory
          zip -r strict-english-codebase.zip \
            strict-english-codebase \
            strict-english-codebase-manifest.json \
            strict-english-codebase-summary.md \
            strict-english-asset-files.txt

      - name: Upload strict English codebase zip
        uses: actions/upload-artifact@v4
        with:
          name: strict-english-codebase-${{ github.run_id }}
          path: build-memory/strict-english-codebase.zip
          retention-days: 30
          if-no-files-found: error
