name: Strict English Codebase CSV Export

on:
  workflow_dispatch:
    inputs:
      max_file_bytes:
        description: "Maximum text file size to translate"
        required: false
        default: "10000000"

permissions:
  contents: read

concurrency:
  group: strict-english-codebase-csv-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  strict-english-codebase-csv-export:
    name: Export repo-shaped strict English CSV mirror
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"

      - name: Generate strict English CSV repo mirror
        env:
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        run: |
          cat > export-strict-english-csv-repo.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const repoRoot = process.cwd();
          const outRoot = path.join(repoRoot, "build-memory", "strict-english-csv-repo");
          const maxFileBytes = Number(process.env.MAX_FILE_BYTES || "10000000");

          const ignoredDirectories = new Set([
            ".git",
            ".next",
            "node_modules",
            "dist",
            "build",
            ".vercel",
            ".turbo",
            "coverage",
            "tmp",
            "temp",
            "reports",
            "test-output",
            "build-memory",
          ]);

          const textExtensions = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".md",
            ".mdx",
            ".yml",
            ".yaml",
            ".css",
            ".scss",
            ".html",
            ".txt",
            ".sql",
            ".sh",
            ".bash",
            ".env",
            ".example",
            ".gitignore",
            ".dockerignore",
            ".toml",
            ".xml",
            ".csv",
          ]);

          const assetExtensions = new Set([
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".webp",
            ".ico",
            ".glb",
            ".gltf",
            ".mp4",
            ".mov",
            ".mp3",
            ".wav",
            ".ogg",
            ".wasm",
            ".zip",
            ".gz",
            ".tar",
            ".pdf",
            ".ttf",
            ".otf",
            ".woff",
            ".woff2",
            ".bin",
          ]);

          function toPosix(filePath) {
            return filePath.split(path.sep).join("/");
          }

          function ensureDir(filePath) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
          }

          function shouldIgnore(relativePath) {
            const posix = toPosix(relativePath);

            for (const ignored of ignoredDirectories) {
              if (posix === ignored || posix.startsWith(`${ignored}/`)) {
                return true;
              }
            }

            return false;
          }

          function isAssetFile(filePath) {
            return assetExtensions.has(path.extname(filePath).toLowerCase());
          }

          function isProbablyText(filePath, buffer) {
            const base = path.basename(filePath);
            const ext = path.extname(filePath).toLowerCase();

            if (textExtensions.has(ext)) return true;
            if (textExtensions.has(base)) return true;
            if (assetExtensions.has(ext)) return false;
            if (buffer.includes(0)) return false;

            const sample = buffer.subarray(0, Math.min(buffer.length, 4096));
            let suspicious = 0;

            for (const byte of sample) {
              const isTab = byte === 9;
              const isNewline = byte === 10 || byte === 13;
              const isPrintable = byte >= 32 && byte <= 126;
              const isUtf8Likely = byte >= 128;

              if (!isTab && !isNewline && !isPrintable && !isUtf8Likely) {
                suspicious += 1;
              }
            }

            return suspicious / Math.max(sample.length, 1) < 0.02;
          }

          function splitPhysicalLines(text) {
            const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

            if (normalized.length === 0) {
              return { lines: [], endedWithNewline: false };
            }

            const endedWithNewline = normalized.endsWith("\n");
            const lines = normalized.split("\n");

            if (endedWithNewline) {
              lines.pop();
            }

            return { lines, endedWithNewline };
          }

          function csvCell(value) {
            const clean = String(value ?? "")
              .replace(/\r?\n|\r/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            return `"${clean.replace(/"/g, '""')}"`;
          }

          function readableName(name) {
            if (!name) return "";

            return String(name)
              .replace(/^use([A-Z])/, "use $1")
              .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
              .replace(/[_-]+/g, " ")
              .replace(/[{}()[\].]/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .toLowerCase();
          }

          function cleanComment(trimmed) {
            return trimmed
              .replace(/^\/\//, "")
              .replace(/^\/\*/, "")
              .replace(/^\*/, "")
              .replace(/\*\/$/, "")
              .replace(/^#/, "")
              .trim();
          }

          function nameFrom(pattern, text) {
            return text.match(pattern)?.[1] || null;
          }

          function sourceFromImport(trimmed) {
            const fromMatch = trimmed.match(/from\s+["']([^"']+)["']/);
            const bareMatch = trimmed.match(/^import\s+["']([^"']+)["']/);

            return fromMatch?.[1] || bareMatch?.[1] || "";
          }

          function translateOperators(text) {
            return text
              .replace(/===/g, " is exactly ")
              .replace(/!==/g, " is not ")
              .replace(/>=/g, " is at least ")
              .replace(/<=/g, " is at most ")
              .replace(/&&/g, " and ")
              .replace(/\|\|/g, " or ")
              .replace(/=>/g, " gives ")
              .replace(/==/g, " is ")
              .replace(/!=/g, " is not ")
              .replace(/>/g, " is greater than ")
              .replace(/</g, " is less than ")
              .replace(/=/g, " to ");
          }

          function stripSyntax(text) {
            return text
              .replace(/["'`]/g, "")
              .replace(/[;]+/g, "")
              .replace(/[{}]/g, " ")
              .replace(/$begin:math:display$\/g\, \" ordered group \"\)
              \.replace\(\/$end:math:display$/g, " close ordered group ")
              .replace(/$begin:math:text$\/g\, \" \"\)
              \.replace\(\/$end:math:text$/g, " ")
              .replace(/,/g, " ")
              .replace(/\?/g, " optional ")
              .replace(/:/g, " receives ")
              .replace(/\./g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function literalEnglish(line) {
            const trimmed = line.trim();

            if (!trimmed) return "";

            let text = trimmed;

            text = text.replace(/\bconst\b/g, "set");
            text = text.replace(/\blet\b/g, "start");
            text = text.replace(/\bvar\b/g, "start");
            text = text.replace(/\breturn\b/g, "give back");
            text = text.replace(/\bif\b/g, "only when");
            text = text.replace(/\belse\b/g, "otherwise");
            text = text.replace(/\bfor\b/g, "for every");
            text = text.replace(/\bwhile\b/g, "while");
            text = text.replace(/\bawait\b/g, "wait for");
            text = text.replace(/\basync\b/g, "waiting");
            text = text.replace(/\btrue\b/g, "enabled");
            text = text.replace(/\bfalse\b/g, "disabled");
            text = text.replace(/\bnull\b/g, "empty");
            text = text.replace(/\bundefined\b/g, "unavailable");
            text = text.replace(/\bnew\b/g, "create");
            text = text.replace(/\bimport\b/g, "receive");
            text = text.replace(/\bexport\b/g, "share");
            text = text.replace(/\bfrom\b/g, "from");
            text = text.replace(/\bdefault\b/g, "main");
            text = text.replace(/\btype\b/g, "allowed rule");
            text = text.replace(/\binterface\b/g, "data shape");
            text = text.replace(/\bclass\b/g, "reusable unit");
            text = text.replace(/\bfunction\b/g, "action");

            text = translateOperators(text);
            text = stripSyntax(text);

            return text ? `${text}.` : "";
          }

          function explainComment(trimmed) {
            const note = cleanComment(trimmed);
            return note ? `${note}.` : "";
          }

          function explainImport(trimmed) {
            const source = sourceFromImport(trimmed);

            if (source) {
              return `receive needed names from ${source}.`;
            }

            return literalEnglish(trimmed);
          }

          function explainExport(trimmed) {
            if (trimmed.startsWith("export default function ")) {
              const name = nameFrom(/^export\s+default\s+function\s+([A-Za-z0-9_$]+)/, trimmed);

              if (name) return `share main action ${readableName(name)}.`;
              return literalEnglish(trimmed);
            }

            if (trimmed.startsWith("export default ")) {
              return "share main result.";
            }

            if (trimmed.startsWith("export type ")) {
              const name = nameFrom(/^export\s+type\s+([A-Za-z0-9_$]+)/, trimmed);

              if (name) return `share allowed rule ${readableName(name)}.`;
              return literalEnglish(trimmed);
            }

            if (trimmed.startsWith("export interface ")) {
              const name = nameFrom(/^export\s+interface\s+([A-Za-z0-9_$]+)/, trimmed);

              if (name) return `share data shape ${readableName(name)}.`;
              return literalEnglish(trimmed);
            }

            if (trimmed.startsWith("export function ")) {
              const name = nameFrom(/^export\s+function\s+([A-Za-z0-9_$]+)/, trimmed);

              if (name) return `share action ${readableName(name)}.`;
              return literalEnglish(trimmed);
            }

            if (trimmed.startsWith("export const ")) {
              const name = nameFrom(/^export\s+const\s+([A-Za-z0-9_$]+)/, trimmed);

              if (name) return `share ${readableName(name)}.`;
              return literalEnglish(trimmed);
            }

            if (trimmed.startsWith("export ")) {
              return literalEnglish(trimmed);
            }

            return null;
          }

          function explainDeclaration(trimmed) {
            const setMatch = trimmed.match(/^const\s+([A-Za-z0-9_$]+)\s*=\s*(.+?);?$/);
            if (setMatch) {
              const name = readableName(setMatch[1]);
              const value = setMatch[2].trim();

              if (value.includes(".every(")) return `set ${name} to every named item passing a requirement.`;
              if (value.includes(".some(")) return `set ${name} to at least one named item passing a requirement.`;
              if (value.includes(".map(")) return `set ${name} to one result for every named item.`;
              if (value.includes(".filter(")) return `set ${name} to only named items that pass a requirement.`;
              if (value.includes(".find(")) return `set ${name} to first named item that passes a requirement.`;
              if (value.includes("await ")) return `set ${name} to completed waiting result.`;
              if (value === "true") return `set ${name} to enabled.`;
              if (value === "false") return `set ${name} to disabled.`;
              if (value === "null") return `set ${name} to empty.`;
              if (value === "undefined") return `set ${name} to unavailable.`;
              if (value.startsWith("[")) return `set ${name} to ordered group.`;
              if (value.startsWith("{")) return `set ${name} to named group.`;

              return `set ${name} to ${literalEnglish(value).replace(/\.$/, "")}.`;
            }

            const setNoValue = trimmed.match(/^const\s+([A-Za-z0-9_$]+)/);
            if (setNoValue) return `set ${readableName(setNoValue[1])}.`;

            const startMatch = trimmed.match(/^(let|var)\s+([A-Za-z0-9_$]+)\s*=\s*(.+?);?$/);
            if (startMatch) {
              const name = readableName(startMatch[2]);
              const value = startMatch[3].trim();

              if (value === "true") return `start ${name} as enabled.`;
              if (value === "false") return `start ${name} as disabled.`;
              if (value === "null") return `start ${name} as empty.`;
              if (value === "undefined") return `start ${name} as unavailable.`;

              return `start ${name} as ${literalEnglish(value).replace(/\.$/, "")}.`;
            }

            const startNoValue = trimmed.match(/^(let|var)\s+([A-Za-z0-9_$]+)/);
            if (startNoValue) return `start ${readableName(startNoValue[2])}.`;

            const action = trimmed.match(/^(async\s+)?function\s+([A-Za-z0-9_$]+)/);
            if (action) {
              const waits = Boolean(action[1]);
              const name = readableName(action[2]);

              return waits ? `${name} action starts and can wait.` : `${name} action starts.`;
            }

            const shape = trimmed.match(/^interface\s+([A-Za-z0-9_$]+)/);
            if (shape) return `${readableName(shape[1])} data shape starts.`;

            const rule = trimmed.match(/^type\s+([A-Za-z0-9_$]+)/);
            if (rule) return `${readableName(rule[1])} allowed rule starts.`;

            const unit = trimmed.match(/^class\s+([A-Za-z0-9_$]+)/);
            if (unit) return `${readableName(unit[1])} reusable unit starts.`;

            return null;
          }

          function explainCondition(trimmed) {
            const inside = trimmed.match(/^if\s*$begin:math:text$\(\.\*\)$end:math:text$\s*\{?$/)?.[1];

            if (!inside) return literalEnglish(trimmed);

            if (inside.includes("&&")) {
              return `${literalEnglish(inside).replace(/\.$/, "")} all must pass.`;
            }

            if (inside.includes("||")) {
              return `${literalEnglish(inside).replace(/\.$/, "")} at least one must pass.`;
            }

            if (inside.startsWith("!")) {
              return `${readableName(inside.slice(1))} must be absent or disabled.`;
            }

            return `${literalEnglish(inside).replace(/\.$/, "")} must pass.`;
          }

          function explainAssignment(trimmed) {
            const match = trimmed.match(/^([A-Za-z0-9_.$[\]]+)\s*=\s*(.+?);?$/);
            if (!match) return null;

            const target = readableName(match[1]);
            const value = match[2].trim();

            if (value === "true") return `change ${target} to enabled.`;
            if (value === "false") return `change ${target} to disabled.`;
            if (value === "null") return `change ${target} to empty.`;
            if (value === "undefined") return `change ${target} to unavailable.`;

            return `change ${target} to ${literalEnglish(value).replace(/\.$/, "")}.`;
          }

          function explainYaml(trimmed) {
            if (/^[A-Za-z0-9_-]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim();
              const rest = trimmed.slice(trimmed.indexOf(":") + 1).trim();

              if (rest) return `${readableName(key)} receives ${literalEnglish(rest).replace(/\.$/, "")}.`;
              return `${readableName(key)} starts.`;
            }

            if (/^-\s+/.test(trimmed)) {
              return `add ${literalEnglish(trimmed.replace(/^-\s+/, "")).replace(/\.$/, "")}.`;
            }

            return null;
          }

          function explainJson(trimmed) {
            if (/^"[^"]+"\s*:/.test(trimmed)) {
              const key = trimmed.match(/^"([^"]+)"/)?.[1];
              const rest = trimmed.slice(trimmed.indexOf(":") + 1).trim().replace(/,$/, "");

              if (rest === "true") return `${readableName(key)} is enabled.`;
              if (rest === "false") return `${readableName(key)} is disabled.`;
              if (rest === "null") return `${readableName(key)} is empty.`;
              if (rest) return `${readableName(key)} receives ${literalEnglish(rest).replace(/\.$/, "")}.`;

              return `${readableName(key)} starts.`;
            }

            return null;
          }

          function explainSql(trimmed) {
            const upper = trimmed.toUpperCase();

            if (upper.startsWith("CREATE TABLE")) return "create database table.";
            if (upper.startsWith("ALTER TABLE")) return "change database table.";
            if (upper.startsWith("CREATE INDEX")) return "create database lookup helper.";
            if (upper.startsWith("INSERT INTO")) return "add stored database data.";
            if (upper.startsWith("SELECT")) return "read database data.";
            if (upper.startsWith("UPDATE")) return "change stored database data.";
            if (upper.startsWith("DELETE")) return "remove stored database data.";
            if (upper.startsWith("WHERE")) return "limit affected database rows.";
            if (upper.startsWith("ORDER BY")) return "order database results.";
            if (upper.startsWith("GROUP BY")) return "group database results.";
            if (upper.startsWith("RETURNING")) return "send changed database rows back.";

            return null;
          }

          function explainShell(trimmed) {
            if (trimmed.startsWith("#!")) return "select script runner.";
            if (trimmed.startsWith("cd ")) return "change command folder.";
            if (trimmed.startsWith("mkdir ")) return "create folder.";
            if (trimmed.startsWith("echo ")) return `write ${literalEnglish(trimmed.slice(5)).replace(/\.$/, "")}.`;
            if (trimmed.startsWith("pnpm ")) return `run package command ${trimmed.slice(5)}.`;
            if (trimmed.startsWith("npm ")) return `run package command ${trimmed.slice(4)}.`;
            if (trimmed.startsWith("node ")) return `run node command ${trimmed.slice(5)}.`;
            if (trimmed.startsWith("git ")) return `run repository command ${trimmed.slice(4)}.`;
            if (trimmed.startsWith("rm ")) return "remove file or folder.";
            if (trimmed.startsWith("cp ")) return "copy file or folder.";
            if (trimmed.startsWith("mv ")) return "move file or folder.";

            return null;
          }

          function strictLine(line, filePath) {
            const trimmed = line.trim();
            const ext = path.extname(filePath).toLowerCase();

            if (!trimmed) return "";

            if (
              trimmed.startsWith("//") ||
              trimmed.startsWith("/*") ||
              trimmed.startsWith("*") ||
              trimmed.startsWith("#")
            ) {
              return explainComment(trimmed);
            }

            if (trimmed.startsWith("import ")) return explainImport(trimmed);

            const exported = explainExport(trimmed);
            if (exported) return exported;

            const declared = explainDeclaration(trimmed);
            if (declared) return declared;

            if (/^if\s*\(/.test(trimmed)) return explainCondition(trimmed);
            if (/^else\s+if\s*\(/.test(trimmed)) return "otherwise check next requirement.";
            if (/^else\b/.test(trimmed)) return "otherwise run next group.";
            if (/^for\s*\(/.test(trimmed) || /^for\s+/.test(trimmed)) return literalEnglish(trimmed);
            if (/^while\s*\(/.test(trimmed)) return literalEnglish(trimmed);
            if (/^switch\s*\(/.test(trimmed)) return "choose one matching path.";
            if (/^case\s+/.test(trimmed)) return literalEnglish(trimmed);
            if (/^default\s*:/.test(trimmed)) return "use fallback path.";
            if (/^try\b/.test(trimmed)) return "start protected work.";
            if (/^catch\b/.test(trimmed)) return "handle failed work.";
            if (/^finally\b/.test(trimmed)) return "finish with cleanup work.";

            if (/^return\b/.test(trimmed)) {
              return literalEnglish(trimmed);
            }

            if (trimmed.includes("useState(")) return literalEnglish(trimmed);
            if (trimmed.includes("useEffect(")) return literalEnglish(trimmed);
            if (trimmed.includes("useMemo(")) return literalEnglish(trimmed);
            if (trimmed.includes("useCallback(")) return literalEnglish(trimmed);
            if (trimmed.includes("useRef(")) return literalEnglish(trimmed);

            if (ext === ".json") {
              const json = explainJson(trimmed);
              if (json) return json;
            }

            if (ext === ".yml" || ext === ".yaml") {
              const yaml = explainYaml(trimmed);
              if (yaml) return yaml;
            }

            if (ext === ".sql") {
              const sql = explainSql(trimmed);
              if (sql) return sql;
            }

            if (ext === ".sh" || ext === ".bash") {
              const shell = explainShell(trimmed);
              if (shell) return shell;
            }

            const jsxOpen = trimmed.match(/^<([A-Za-z0-9_.$-]+)/);
            if (jsxOpen) return `${readableName(jsxOpen[1])} visible part starts.`;

            const jsxClose = trimmed.match(/^<\/([A-Za-z0-9_.$-]+)>/);
            if (jsxClose) return `${readableName(jsxClose[1])} visible part ends.`;

            if (trimmed === "{" || trimmed.endsWith("{")) return "start group.";
            if (trimmed === "}" || trimmed === "};" || trimmed === "},") return "end group.";
            if (trimmed === "[" || trimmed.endsWith("[")) return "start ordered group.";
            if (trimmed === "]" || trimmed === "];" || trimmed === "],") return "end ordered group.";

            const assigned = explainAssignment(trimmed);
            if (assigned) return assigned;

            if (/^[A-Za-z0-9_$'"]+\s*:/.test(trimmed)) {
              const key = trimmed.split(":")[0].trim().replace(/^["']|["']$/g, "");
              const value = trimmed.slice(trimmed.indexOf(":") + 1).trim().replace(/,$/, "");

              if (value === "true") return `${readableName(key)} is enabled.`;
              if (value === "false") return `${readableName(key)} is disabled.`;
              if (value === "null") return `${readableName(key)} is empty.`;
              if (value) return `${readableName(key)} receives ${literalEnglish(value).replace(/\.$/, "")}.`;

              return `${readableName(key)} starts.`;
            }

            return literalEnglish(trimmed);
          }

          function translateFile(relativePath, buffer) {
            const text = buffer.toString("utf8");
            const { lines, endedWithNewline } = splitPhysicalLines(text);

            const outPath = path.join(outRoot, `${relativePath}.csv`);
            ensureDir(outPath);

            const rows = lines.map((line, index) => {
              const lineNumber = index + 1;
              const translation = strictLine(line, relativePath);

              if (line.trim() === "") {
                return `${lineNumber},`;
              }

              return `${lineNumber},${csvCell(translation)}`;
            });

            let output = rows.join("\n");

            if (endedWithNewline && rows.length > 0) {
              output += "\n";
            }

            fs.writeFileSync(outPath, output);
          }

          function representAsset(relativePath) {
            const outPath = path.join(outRoot, relativePath);
            ensureDir(outPath);
            fs.writeFileSync(outPath, "");
          }

          function walk(directory) {
            const entries = fs.readdirSync(directory, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              const relativePath = toPosix(path.relative(repoRoot, absolutePath));

              if (!relativePath || shouldIgnore(relativePath)) continue;

              if (entry.isDirectory()) {
                files.push(...walk(absolutePath));
                continue;
              }

              if (entry.isFile()) {
                files.push({ absolutePath, relativePath });
              }
            }

            return files;
          }

          fs.rmSync(outRoot, { recursive: true, force: true });
          fs.mkdirSync(outRoot, { recursive: true });

          const files = walk(repoRoot);

          let translated = 0;
          let representedAssets = 0;
          let skippedLarge = 0;
          let skippedBinary = 0;

          for (const file of files) {
            const buffer = fs.readFileSync(file.absolutePath);

            if (isAssetFile(file.relativePath)) {
              representAsset(file.relativePath);
              representedAssets += 1;
              continue;
            }

            if (buffer.length > maxFileBytes) {
              skippedLarge += 1;
              continue;
            }

            if (!isProbablyText(file.relativePath, buffer)) {
              representAsset(file.relativePath);
              skippedBinary += 1;
              continue;
            }

            translateFile(file.relativePath, buffer);
            translated += 1;
          }

          console.log(`translated text files: ${translated}`);
          console.log(`asset filenames represented: ${representedAssets}`);
          console.log(`large files skipped: ${skippedLarge}`);
          console.log(`other binary filenames represented: ${skippedBinary}`);
          NODE

          node export-strict-english-csv-repo.mjs

      - name: Upload strict English CSV repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: strict-english-csv-repo-${{ github.run_id }}
          path: build-memory/strict-english-csv-repo
          retention-days: 30
          if-no-files-found: error
