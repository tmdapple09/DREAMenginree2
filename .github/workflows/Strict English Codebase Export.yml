name: Force English Codebase CSV Export

on:
  workflow_dispatch:
    inputs:
      max_file_bytes:
        description: "Maximum text file size to translate"
        required: false
        default: "10000000"

permissions:
  contents: read

concurrency:
  group: force-english-codebase-csv-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  force-english-codebase-csv-export:
    name: Export repo-shaped Force-English CSV mirror
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"

      - name: Generate Force-English CSV repo mirror
        env:
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        run: |
          cat > export-force-english-csv-repo.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const repoRoot = process.cwd();
          const outRoot = path.join(repoRoot, "build-memory", "force-english-csv-repo");
          const maxFileBytes = Number(process.env.MAX_FILE_BYTES || "10000000");

          const ignoredDirectories = new Set([
            ".git",
            ".next",
            "node_modules",
            "dist",
            "build",
            ".vercel",
            ".turbo",
            "coverage",
            "tmp",
            "temp",
            "reports",
            "test-output",
            "build-memory",
          ]);

          const textExtensions = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".md",
            ".mdx",
            ".yml",
            ".yaml",
            ".css",
            ".scss",
            ".html",
            ".txt",
            ".sql",
            ".sh",
            ".bash",
            ".env",
            ".example",
            ".gitignore",
            ".dockerignore",
            ".toml",
            ".xml",
            ".csv",
          ]);

          const assetExtensions = new Set([
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".webp",
            ".ico",
            ".glb",
            ".gltf",
            ".mp4",
            ".mov",
            ".mp3",
            ".wav",
            ".ogg",
            ".wasm",
            ".zip",
            ".gz",
            ".tar",
            ".pdf",
            ".ttf",
            ".otf",
            ".woff",
            ".woff2",
            ".bin",
          ]);

          function toPosix(filePath) {
            return filePath.split(path.sep).join("/");
          }

          function ensureDir(filePath) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
          }

          function shouldIgnore(relativePath) {
            const posix = toPosix(relativePath);

            for (const ignored of ignoredDirectories) {
              if (posix === ignored || posix.startsWith(`${ignored}/`)) {
                return true;
              }
            }

            return false;
          }

          function isAssetFile(filePath) {
            return assetExtensions.has(path.extname(filePath).toLowerCase());
          }

          function isProbablyText(filePath, buffer) {
            const base = path.basename(filePath);
            const ext = path.extname(filePath).toLowerCase();

            if (textExtensions.has(ext)) return true;
            if (textExtensions.has(base)) return true;
            if (assetExtensions.has(ext)) return false;
            if (buffer.includes(0)) return false;

            const sample = buffer.subarray(0, Math.min(buffer.length, 4096));
            let suspicious = 0;

            for (const byte of sample) {
              const isTab = byte === 9;
              const isNewline = byte === 10 || byte === 13;
              const isPrintable = byte >= 32 && byte <= 126;
              const isUtf8Likely = byte >= 128;

              if (!isTab && !isNewline && !isPrintable && !isUtf8Likely) {
                suspicious += 1;
              }
            }

            return suspicious / Math.max(sample.length, 1) < 0.02;
          }

          function splitPhysicalLines(text) {
            const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

            if (normalized.length === 0) {
              return { lines: [], endedWithNewline: false };
            }

            const endedWithNewline = normalized.endsWith("\n");
            const lines = normalized.split("\n");

            if (endedWithNewline) {
              lines.pop();
            }

            return { lines, endedWithNewline };
          }

          function csvCell(value) {
            const clean = String(value ?? "")
              .replace(/\r?\n|\r/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            return `"${clean.replace(/"/g, '""')}"`;
          }

          function readableName(name) {
            if (!name) return "";

            return String(name)
              .replace(/^use([A-Z])/, "use $1")
              .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
              .replace(/[_-]+/g, " ")
              .replace(/[{}()[\].]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function cleanComment(trimmed) {
            return trimmed
              .replace(/^\/\//, "")
              .replace(/^\/\*/, "")
              .replace(/^\*/, "")
              .replace(/\*\/$/, "")
              .replace(/^#/, "")
              .trim();
          }

          function force(sentence) {
            const clean = String(sentence ?? "")
              .replace(/\r?\n|\r/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .replace(/\.$/, "");

            if (!clean) return "";
            if (clean === "Starts" || clean === "Ends") return `${clean}.`;

            return `Force ${clean}. if True.`;
          }

          function nameFrom(pattern, text) {
            return text.match(pattern)?.[1] || null;
          }

          function sourceFromImport(trimmed) {
            const fromMatch = trimmed.match(/from\s+["']([^"']+)["']/);
            const bareMatch = trimmed.match(/^import\s+["']([^"']+)["']/);

            return fromMatch?.[1] || bareMatch?.[1] || "";
          }

          function translateOperators(text) {
            return text
              .replace(/===/g, " is exactly ")
              .replace(/!==/g, " is not ")
              .replace(/>=/g, " is at least ")
              .replace(/<=/g, " is at most ")
              .replace(/&&/g, " and ")
              .replace(/\|\|/g, " or ")
              .replace(/=>/g, " gives ")
              .replace(/==/g, " is ")
              .replace(/!=/g, " is not ")
              .replace(/>/g, " is greater than ")
              .replace(/</g, " is less than ")
              .replace(/=/g, " to ");
          }

          function literalEnglish(line) {
            let text = String(line ?? "").trim();

            if (!text) return "";

            text = text.replace(/\bconst\b/g, "Set");
            text = text.replace(/\blet\b/g, "Start");
            text = text.replace(/\bvar\b/g, "Start");
            text = text.replace(/\breturn\b/g, "Give Back");
            text = text.replace(/\bif\b/g, "Check");
            text = text.replace(/\belse\b/g, "Otherwise");
            text = text.replace(/\bfor\b/g, "For Every");
            text = text.replace(/\bwhile\b/g, "While");
            text = text.replace(/\bawait\b/g, "Wait For");
            text = text.replace(/\basync\b/g, "Waiting");
            text = text.replace(/\btrue\b/g, "Enabled");
            text = text.replace(/\bfalse\b/g, "Disabled");
            text = text.replace(/\bnull\b/g, "Empty");
            text = text.replace(/\bundefined\b/g, "Unavailable");
            text = text.replace(/\bnew\b/g, "Create");
            text = text.replace(/\bimport\b/g, "Receive");
            text = text.replace(/\bexport\b/g, "Share");
            text = text.replace(/\bdefault\b/g, "Main");
            text = text.replace(/\btype\b/g, "Allowed Rule");
            text = text.replace(/\binterface\b/g, "Data Shape");
            text = text.replace(/\bclass\b/g, "Reusable Unit");
            text = text.replace(/\bfunction\b/g, "Action");

            text = translateOperators(text);

            text = text
              .replace(/["'`]/g, "")
              .replace(/[;]+/g, "")
              .replace(/[{}]/g, " ")
              .split("[")
              .join(" Ordered Group ")
              .split("]")
              .join(" Close Ordered Group ")
              .split("(")
              .join(" ")
              .split(")")
              .join(" ")
              .split(",")
              .join(" ")
              .split("?")
              .join(" Optional ")
              .split(":")
              .join(" Receives ")
              .split(".")
              .join(" ")
              .replace(/\s+/g, " ")
              .trim();

            return text;
          }

          function explainComment(trimmed) {
            return cleanComment(trimmed);
          }

          function explainImport(trimmed) {
            const source = sourceFromImport(trimmed);
            return source
              ? force(`Current File Receive ${source}`)
              : force("Current File Receive Outside Names");
          }

          function explainExport(trimmed) {
            if (trimmed.startsWith("export default function ")) {
              const name = nameFrom(/^export\s+default\s+function\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? force(`Current File Share Main Action ${readableName(name)}`)
                : force("Current File Share Main Action");
            }

            if (trimmed.startsWith("export default ")) {
              return force("Current File Share Main Result");
            }

            if (trimmed.startsWith("export type ")) {
              const name = nameFrom(/^export\s+type\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? force(`Current File Share Allowed Rule ${readableName(name)}`)
                : force("Current File Share Allowed Rule");
            }

            if (trimmed.startsWith("export interface ")) {
              const name = nameFrom(/^export\s+interface\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? force(`Current File Share Data Shape ${readableName(name)}`)
                : force("Current File Share Data Shape");
            }

            if (trimmed.startsWith("export function ")) {
              const name = nameFrom(/^export\s+function\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? force(`Current File Share Action ${readableName(name)}`)
                : force("Current File Share Action");
            }

            if (trimmed.startsWith("export const ")) {
              const name = nameFrom(/^export\s+const\s+([A-Za-z0-9_$]+)/, trimmed);
              return name
                ? force(`Current File Share ${readableName(name)}`)
                : force("Current File Share Value");
            }

            if (trimmed.startsWith("export ")) {
              return force(literalEnglish(trimmed));
            }

            return null;
          }

          function explainDeclaration(trimmed) {
            const setMatch = trimmed.match(/^const\s+([A-Za-z0-9_$]+)\s*=\s*(.+?);?$/);
            if (setMatch) {
              const name = readableName(setMatch[1]);
              const value = setMatch[2].trim();

              if (value.includes(".every(")) return force(`Set ${name} To Every Named Item Passing Requirement`);
              if (value.includes(".some(")) return force(`Set ${name} To At Least One Named Item Passing Requirement`);
              if (value.includes(".map(")) return force(`Set ${name} To One Result For Every Named Item`);
              if (value.includes(".filter(")) return force(`Set ${name} To Only Named Items That Pass Requirement`);
              if (value.includes(".find(")) return force(`Set ${name} To First Named Item That Passes Requirement`);
              if (value.includes("await ")) return force(`Set ${name} To Completed Waiting Result`);
              if (value === "true") return force(`Set ${name} To Enabled`);
              if (value === "false") return force(`Set ${name} To Disabled`);
              if (value === "null") return force(`Set ${name} To Empty`);
              if (value === "undefined") return force(`Set ${name} To Unavailable`);
              if (value.startsWith("[")) return force(`Set ${name} To Ordered Group`);
              if (value.startsWith("{")) return force(`Set ${name} To Named Group`);

              return force(`Set ${name} To ${literalEnglish(value)}`);
            }

            const setNoValue = trimmed.match(/^const\s+([A-Za-z0-9_$]+)/);
            if (setNoValue) {
              return force(`Set ${readableName(setNoValue[1])}`);
            }

            const startMatch = trimmed.match(/^(let|var)\s+([A-Za-z0-9_$]+)\s*=\s*(.+?);?$/);
            if (startMatch) {
              const name = readableName(startMatch[2]);
              const value = startMatch[3].trim();

              if (value === "true") return force(`Start ${name} As Enabled`);
              if (value === "false") return force(`Start ${name} As Disabled`);
              if (value === "null") return force(`Start ${name} As Empty`);
              if (value === "undefined") return force(`Start ${name} As Unavailable`);

              return force(`Start ${name} As ${literalEnglish(value)}`);
            }

            const startNoValue = trimmed.match(/^(let|var)\s+([A-Za-z0-9_$]+)/);
            if (startNoValue) {
              return force(`Start ${readableName(startNoValue[2])}`);
            }

            const action = trimmed.match(/^(async\s+)?function\s+([A-Za-z0-9_$]+)/);
            if (action) {
              const waits = Boolean(action[1]);
              const name = readableName(action[2]);
              return waits
                ? force(`${name} Action Starts And Can Wait`)
                : force(`${name} Action Starts`);
            }

            const shape = trimmed.match(/^interface\s+([A-Za-z0-9_$]+)/);
            if (shape) return force(`${readableName(shape[1])} Data Shape Starts`);

            const rule = trimmed.match(/^type\s+([A-Za-z0-9_$]+)/);
            if (rule) return force(`${readableName(rule[1])} Allowed Rule Starts`);

            const unit = trimmed.match(/^class\s+([A-Za-z0-9_$]+)/);
            if (unit) return force(`${readableName(unit[1])} Reusable Unit Starts`);

            return null;
          }

          function explainYaml(trimmed) {
            if (/^[A-Za-z0-9_-]+\s*:/.test(trimmed)) {
              const key = readableName(trimmed.split(":")[0].trim());
              const rest = trimmed.slice(trimmed.indexOf(":") + 1).trim();

              if (rest) return force(`${key} Receive ${literalEnglish(rest)}`);
              return force(`${key} Start`);
            }

            if (/^-\s+/.test(trimmed)) {
              return force(`Current List Receive ${literalEnglish(trimmed.replace(/^-\s+/, ""))}`);
            }

            return null;
          }

          function explainJson(trimmed) {
            if (/^"[^"]+"\s*:/.test(trimmed)) {
              const key = readableName(trimmed.match(/^"([^"]+)"/)?.[1]);
              const rest = trimmed.slice(trimmed.indexOf(":") + 1).trim().replace(/,$/, "");

              if (rest === "true") return force(`${key} Is Enabled`);
              if (rest === "false") return force(`${key} Is Disabled`);
              if (rest === "null") return force(`${key} Is Empty`);
              if (rest) return force(`${key} Receive ${literalEnglish(rest)}`);

              return force(`${key} Start`);
            }

            return null;
          }

          function explainAssignment(trimmed) {
            const match = trimmed.match(/^([A-Za-z0-9_.$[\]]+)\s*=\s*(.+?);?$/);
            if (!match) return null;

            const target = readableName(match[1]);
            const value = match[2].trim();

            if (value === "true") return force(`Change ${target} To Enabled`);
            if (value === "false") return force(`Change ${target} To Disabled`);
            if (value === "null") return force(`Change ${target} To Empty`);
            if (value === "undefined") return force(`Change ${target} To Unavailable`);

            return force(`Change ${target} To ${literalEnglish(value)}`);
          }

          function explainShell(trimmed) {
            if (trimmed.startsWith("#!")) return force("Script Runner Receive Selection");
            if (trimmed.startsWith("cd ")) return force("Command Folder Change");
            if (trimmed.startsWith("mkdir ")) return force("Folder Create");
            if (trimmed.startsWith("echo ")) return force(`Text Output Write ${literalEnglish(trimmed.slice(5))}`);
            if (trimmed.startsWith("pnpm ")) return force(`Package Command Run ${trimmed.slice(5)}`);
            if (trimmed.startsWith("npm ")) return force(`Package Command Run ${trimmed.slice(4)}`);
            if (trimmed.startsWith("node ")) return force(`Node Command Run ${trimmed.slice(5)}`);
            if (trimmed.startsWith("git ")) return force(`Repository Command Run ${trimmed.slice(4)}`);
            if (trimmed.startsWith("rm ")) return force("File Or Folder Remove");
            if (trimmed.startsWith("cp ")) return force("File Or Folder Copy");
            if (trimmed.startsWith("mv ")) return force("File Or Folder Move");

            return null;
          }

          function explainSql(trimmed) {
            const upper = trimmed.toUpperCase();

            if (upper.startsWith("CREATE TABLE")) return force("Database Table Create");
            if (upper.startsWith("ALTER TABLE")) return force("Database Table Change");
            if (upper.startsWith("CREATE INDEX")) return force("Database Lookup Helper Create");
            if (upper.startsWith("INSERT INTO")) return force("Database Data Add");
            if (upper.startsWith("SELECT")) return force("Database Data Read");
            if (upper.startsWith("UPDATE")) return force("Database Data Change");
            if (upper.startsWith("DELETE")) return force("Database Data Remove");
            if (upper.startsWith("WHERE")) return force("Database Rows Limit");
            if (upper.startsWith("ORDER BY")) return force("Database Results Order");
            if (upper.startsWith("GROUP BY")) return force("Database Results Group");
            if (upper.startsWith("RETURNING")) return force("Database Changed Rows Return");

            return null;
          }

          function translateLine(line, filePath) {
            const trimmed = line.trim();
            const ext = path.extname(filePath).toLowerCase();

            if (!trimmed) return "";

            if (
              trimmed.startsWith("//") ||
              trimmed.startsWith("/*") ||
              trimmed.startsWith("*") ||
              trimmed.startsWith("#")
            ) {
              return explainComment(trimmed);
            }

            if (trimmed === "{" || trimmed.endsWith("{")) return "Starts.";
            if (trimmed === "}" || trimmed === "};" || trimmed === "},") return "Ends.";
            if (trimmed === "[" || trimmed.endsWith("[")) return "Starts.";
            if (trimmed === "]" || trimmed === "];" || trimmed === "],") return "Ends.";

            if (trimmed.startsWith("import ")) return explainImport(trimmed);

            const exported = explainExport(trimmed);
            if (exported) return exported;

            const declared = explainDeclaration(trimmed);
            if (declared) return declared;

            if (/^if\s*\(/.test(trimmed)) return force(`Check ${literalEnglish(trimmed.replace(/^if\s*/, ""))}`);
            if (/^else\s+if\s*\(/.test(trimmed)) return force(`Otherwise Check ${literalEnglish(trimmed.replace(/^else\s+if\s*/, ""))}`);
            if (/^else\b/.test(trimmed)) return force("Otherwise Run Next Group");
            if (/^for\s*\(/.test(trimmed) || /^for\s+/.test(trimmed)) return force(literalEnglish(trimmed));
            if (/^while\s*\(/.test(trimmed)) return force(literalEnglish(trimmed));
            if (/^switch\s*\(/.test(trimmed)) return force("Choose Matching Path");
            if (/^case\s+/.test(trimmed)) return force(literalEnglish(trimmed));
            if (/^default\s*:/.test(trimmed)) return force("Use Fallback Path");
            if (/^try\b/.test(trimmed)) return force("Start Protected Work");
            if (/^catch\b/.test(trimmed)) return force("Handle Failed Work");
            if (/^finally\b/.test(trimmed)) return force("Finish Cleanup Work");
            if (/^return\b/.test(trimmed)) return force(literalEnglish(trimmed));

            if (ext === ".json") {
              const json = explainJson(trimmed);
              if (json) return json;
            }

            if (ext === ".yml" || ext === ".yaml") {
              const yaml = explainYaml(trimmed);
              if (yaml) return yaml;
            }

            if (ext === ".sql") {
              const sql = explainSql(trimmed);
              if (sql) return sql;
            }

            if (ext === ".sh" || ext === ".bash") {
              const shell = explainShell(trimmed);
              if (shell) return shell;
            }

            const jsxOpen = trimmed.match(/^<([A-Za-z0-9_.$-]+)/);
            if (jsxOpen) return force(`${readableName(jsxOpen[1])} Visible Part Starts`);

            const jsxClose = trimmed.match(/^<\/([A-Za-z0-9_.$-]+)>/);
            if (jsxClose) return force(`${readableName(jsxClose[1])} Visible Part Ends`);

            const assigned = explainAssignment(trimmed);
            if (assigned) return assigned;

            if (/^[A-Za-z0-9_$'"]+\s*:/.test(trimmed)) {
              const key = readableName(trimmed.split(":")[0].trim().replace(/^["']|["']$/g, ""));
              const value = trimmed.slice(trimmed.indexOf(":") + 1).trim().replace(/,$/, "");

              if (value === "true") return force(`${key} Is Enabled`);
              if (value === "false") return force(`${key} Is Disabled`);
              if (value === "null") return force(`${key} Is Empty`);
              if (value) return force(`${key} Receive ${literalEnglish(value)}`);

              return force(`${key} Start`);
            }

            return force(literalEnglish(trimmed));
          }

          function translateFile(relativePath, buffer) {
            const text = buffer.toString("utf8");
            const { lines, endedWithNewline } = splitPhysicalLines(text);

            const outPath = path.join(outRoot, `${relativePath}.csv`);
            ensureDir(outPath);

            const rows = lines.map((line, index) => {
              const lineNumber = index + 1;
              const translation = translateLine(line, relativePath);

              if (line.trim() === "") return `${lineNumber},`;

              return `${lineNumber},${csvCell(translation)}`;
            });

            let output = rows.join("\n");

            if (endedWithNewline && rows.length > 0) output += "\n";

            fs.writeFileSync(outPath, output);
          }

          function representAsset(relativePath) {
            const outPath = path.join(outRoot, relativePath);
            ensureDir(outPath);
            fs.writeFileSync(outPath, "");
          }

          function walk(directory) {
            const entries = fs.readdirSync(directory, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              const relativePath = toPosix(path.relative(repoRoot, absolutePath));

              if (!relativePath || shouldIgnore(relativePath)) continue;

              if (entry.isDirectory()) {
                files.push(...walk(absolutePath));
                continue;
              }

              if (entry.isFile()) files.push({ absolutePath, relativePath });
            }

            return files;
          }

          fs.rmSync(outRoot, { recursive: true, force: true });
          fs.mkdirSync(outRoot, { recursive: true });

          const files = walk(repoRoot);

          let translated = 0;
          let representedAssets = 0;
          let skippedLarge = 0;
          let representedBinary = 0;

          for (const file of files) {
            const buffer = fs.readFileSync(file.absolutePath);

            if (isAssetFile(file.relativePath)) {
              representAsset(file.relativePath);
              representedAssets += 1;
              continue;
            }

            if (buffer.length > maxFileBytes) {
              skippedLarge += 1;
              continue;
            }

            if (!isProbablyText(file.relativePath, buffer)) {
              representAsset(file.relativePath);
              representedBinary += 1;
              continue;
            }

            translateFile(file.relativePath, buffer);
            translated += 1;
          }

          console.log(`translated text files: ${translated}`);
          console.log(`asset filenames represented: ${representedAssets}`);
          console.log(`large files skipped: ${skippedLarge}`);
          console.log(`other binary filenames represented: ${representedBinary}`);
          NODE

          node export-force-english-csv-repo.mjs

      - name: Upload Force-English CSV repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: force-english-csv-repo-${{ github.run_id }}
          path: build-memory/force-english-csv-repo
          retention-days: 30
          if-no-files-found: error
