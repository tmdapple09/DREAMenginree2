              ".yml", ".yaml", ".css", ".scss", ".html", ".sql", ".sh", ".py",
              ".toml", ".env", ".example", ".txt", ".svg", ".tsx", ".mts", ".cts",
          }

          BINARY_EXTENSIONS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".mp3", ".wav",
              ".mp4", ".mov", ".glb", ".gltf", ".wasm", ".zip", ".pdf",
              ".ttf", ".otf", ".woff", ".woff2",
          }

          SKIP_SCAN_DIRS = {
              ".git", "node_modules", ".next", "dist", "build", ".turbo", ".cache",
              "_organized_repo_artifact", "_rebase_organized_zip_work", "__MACOSX",
          }

          GENERATED_NAMES = {
              BEHAVIOR_HELPER_FILENAME,
              "organized_file_tree.txt",
              "organized_manifest.json",
              "organized_manifest.csv",
          }

          @dataclass
          class FileFacts:
              rel: str
              path_lower: str
              name_lower: str
              suffix: str
              text: str
              lower: str
              is_text: bool
              is_binary: bool
              is_typescript: bool
              is_tsx: bool
              is_jsx: bool
              is_markdown: bool
              is_sql: bool
              is_yaml: bool
              is_json: bool
              is_css: bool
              is_page_file: bool
              is_layout_file: bool
              is_route_file: bool
              is_test_file: bool
              is_workflow: bool
              is_component_like: bool
              line_count: int

          def safe_part(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"[^a-z0-9._-]+", "_", value)
              value = re.sub(r"_+", "_", value).strip("_")
              return value or "uncategorized"

          def git_files() -> List[str]:
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=REPO)
              files = [p for p in raw.decode("utf-8", errors="replace").split("\0") if p]
              return [
                  p for p in files
                  if Path(p).name not in GENERATED_NAMES
                  and not any(part in SKIP_SCAN_DIRS for part in Path(p).parts)
              ]

          def is_probably_text_path(path: Path) -> bool:
              suffix = path.suffix.lower()
              if suffix in BINARY_EXTENSIONS:
                  return False
              if suffix in TEXT_EXTENSIONS:
                  return True
              if path.name in {"Dockerfile", "LICENSE", "Makefile", ".gitignore", ".gitleaks.toml", ".cursorrules"}:
                  return True
              return False

          def read_text(path: Path, limit: int = 900_000) -> Tuple[str, bool]:
              if not path.exists() or not path.is_file():
                  return "", False
              if not is_probably_text_path(path):
                  return "", False
              try:
                  data = path.read_bytes()
              except Exception:
                  return "", False
              if len(data) > limit:
                  data = data[:limit]
              return data.decode("utf-8", errors="replace"), True

          def facts_for(rel: str) -> FileFacts:
              path = REPO / rel
              suffix = path.suffix.lower()
              text, is_text = read_text(path)
              path_lower = rel.lower()
              name_lower = path.name.lower()
              lower = text.lower()
              is_ts = suffix in {".ts", ".tsx", ".mts", ".cts"}
              is_tsx = suffix == ".tsx"
              is_jsx = suffix == ".jsx"
              is_route_file = name_lower == "route.ts" or name_lower == "route.js" or "/route." in path_lower
              is_page_file = name_lower in {"page.tsx", "page.ts", "page.jsx", "page.js"} or "/page." in path_lower
              is_layout_file = name_lower in {"layout.tsx", "layout.ts", "layout.jsx", "layout.js"} or "/layout." in path_lower
              is_test_file = (
                  "/tests/" in f"/{path_lower}" or
                  name_lower.endswith(".test.ts") or name_lower.endswith(".test.tsx") or
                  name_lower.endswith(".spec.ts") or name_lower.endswith(".spec.tsx") or
                  "describe(" in lower and "expect(" in lower
              )
              is_workflow = path_lower.startswith(".github/workflows/") or path_lower.startswith(".github/ruleset/")
              is_component_like = (
                  is_tsx or is_jsx or
                  "export default function" in lower and "return (" in lower or
                  "react" in lower and "jsx" in lower
              )
              return FileFacts(
                  rel=rel,
                  path_lower=path_lower,
                  name_lower=name_lower,
                  suffix=suffix,
                  text=text,
                  lower=lower,
                  is_text=is_text,
                  is_binary=not is_text,
                  is_typescript=is_ts,
                  is_tsx=is_tsx,
                  is_jsx=is_jsx,
                  is_markdown=suffix in {".md", ".mdx"},
                  is_sql=suffix == ".sql",
                  is_yaml=suffix in {".yml", ".yaml"},
                  is_json=suffix == ".json",
                  is_css=suffix in {".css", ".scss"},
                  is_page_file=is_page_file,
                  is_layout_file=is_layout_file,
                  is_route_file=is_route_file,
                  is_test_file=is_test_file,
                  is_workflow=is_workflow,
                  is_component_like=is_component_like,
                  line_count=text.count("\n") + (1 if text else 0),
              )

          def contains_any(haystack: str, needles: Iterable[str]) -> bool:
              return any(needle.lower() in haystack for needle in needles)

          def count_any(haystack: str, needles: Iterable[str]) -> int:
              return sum(haystack.count(needle.lower()) for needle in needles)

          def regex_any(patterns: Iterable[str], haystack: str) -> bool:
              return any(re.search(pattern, haystack, flags=re.IGNORECASE | re.MULTILINE) for pattern in patterns)

          SEMANTIC_STOPWORDS = {
              "a", "an", "and", "or", "the", "to", "of", "in", "on", "for", "from", "with", "by", "as",
              "true", "false", "null", "undefined", "return", "const", "let", "var", "function", "class", "export",
              "import", "type", "interface", "props", "state", "data", "item", "items", "value", "values", "result",
              "error", "errors", "response", "request", "default", "async", "await", "new", "set", "get",
          }

          def split_identifier_words(value: str) -> List[str]:
              value = re.sub(r"([a-z0-9])([A-Z])", r"\1 \2", value)
              value = re.sub(r"[^A-Za-z0-9]+", " ", value)
              return [part.lower() for part in value.split() if len(part) >= 3 and part.lower() not in SEMANTIC_STOPWORDS]

          def extract_import_sources(text: str) -> List[str]:
              sources: List[str] = []
              patterns = [
                  r"import\s+(?:type\s+)?(?:[^;]+?)\s+from\s+['\"]([^'\"]+)['\"]",
                  r"import\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",
                  r"require\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, flags=re.MULTILINE):
                      sources.append(match.group(1))
              return sources[:120]

          def extract_exported_symbols(text: str) -> List[str]:
              symbols: List[str] = []
              patterns = [
                  r"export\s+(?:default\s+)?(?:async\s+)?function\s+([A-Za-z0-9_]+)",
                  r"export\s+(?:const|let|var)\s+([A-Za-z0-9_]+)",
                  r"export\s+(?:type|interface|class|enum)\s+([A-Za-z0-9_]+)",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, flags=re.MULTILINE):
                      symbols.append(match.group(1))
              return symbols[:120]

          def extract_jsx_tags(text: str) -> Set[str]:
              tags: Set[str] = set()
              for match in re.finditer(r"<\s*([A-Za-z][A-Za-z0-9_.:-]*)", text):
                  tag = match.group(1).lower()
                  if tag not in {"fragment", "react.fragment"}:
                      tags.add(tag)
              return tags

          def extract_event_handlers(text: str) -> Set[str]:
              handlers: Set[str] = set()
              for match in re.finditer(r"\b(on[A-Z][A-Za-z0-9_]+)\s*=", text):
                  handlers.add(match.group(1).lower())
              for match in re.finditer(r"addEventListener\s*\(\s*['\"]([^'\"]+)['\"]", text):
                  handlers.add(match.group(1).lower())
              return handlers

          def semantic_terms_for(f: FileFacts) -> Set[str]:
              terms: Set[str] = set()
              for part in Path(f.rel).parts:
                  terms.update(split_identifier_words(part))
              for source in extract_import_sources(f.text):
                  terms.update(split_identifier_words(source))
              for symbol in extract_exported_symbols(f.text):
                  terms.update(split_identifier_words(symbol))
              for tag in extract_jsx_tags(f.text):
                  terms.update(split_identifier_words(tag))
              return terms

          def has_function_call(haystack: str, name: str) -> bool:
              return re.search(rf"\b{re.escape(name.lower())}\s*\(", haystack, flags=re.IGNORECASE) is not None

          def semantic_summary_for(f: FileFacts, category: str, subfolder: str, area: str, behavior: str) -> str:
              role = file_role(f)
              p = f.path_lower
              h = f.lower
              if role == "api_route":
                  methods = re.findall(r"export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE)", f.text)
                  method_text = "/".join(methods) if methods else "HTTP"
                  return f"{method_text} API route handling request/response work for {area}."
              if role == "server_action":
                  return f"server-only action logic for {area}."
              if role == "sql_schema":
                  if "create policy" in h or "row level security" in h:
                      return "database schema with security/RLS policy behavior."
                  if "create table" in h:
                      return "database table/schema definition."
                  return "database migration/schema behavior."
              if role == "page_screen":
                  return f"Next.js screen/route surface for {area}."
              if role == "component_surface":
                  handlers = sorted(extract_event_handlers(f.text))[:5]
                  if handlers:
                      return f"React visible surface/component with interaction handlers: {', '.join(handlers)}."
                  return "React visible surface/component structure."
              if role == "hook":
                  return "React hook managing state, runtime, events, or interactions."
              if role == "engine_runtime":
                  return "core runtime/state/sync/execution code."
              if role == "engin_domain":
                  if "/brain/" in p:
                      return "Engin brain/knowledge/data file; not user-flow behavior."
                  if "ruleset" in p or "ruleset" in h:
                      return "Engin rule-set behavior: constraints, transformations, or parameters."
                  return f"Engin-owned domain behavior for {area}."
              if role == "data_json":
                  return "structured JSON data/config/manifest."
              if role == "documentation":
                  return "documentation/instructions/reference content."
              if role in {"asset_binary", "asset_source"}:
                  return "static asset/content file."
              if role == "workflow":
                  return "GitHub Actions workflow/tooling automation."
              if role == "test":
                  return "verification/test coverage file."
              return f"{category}/{subfolder} code for {area} / {behavior}."

          def add_deterministic_semantic_scores(
              role: str,
              scores: Dict[Tuple[str, str], int],
              reasons: Dict[Tuple[str, str], List[str]],
              f: FileFacts,
          ) -> None:
              """Deterministic semantic pass: role + syntax + imports + exported symbols.

              This is not an AI call. It is a higher-signal rule layer that treats code shape
              as meaning: route handlers are API behavior, JSX event handlers are interactions,
              SQL policies are security, Engin brain JSON is Engin knowledge/data, etc.
              """
              h = f.lower
              p = f.path_lower
              n = f.name_lower
              imports = "\n".join(extract_import_sources(f.text)).lower()
              exports = "\n".join(extract_exported_symbols(f.text)).lower()
              tags = extract_jsx_tags(f.text)
              handlers = extract_event_handlers(f.text)
              terms = semantic_terms_for(f)
              semantic_blob = " ".join(sorted(terms)) + "\n" + p + "\n" + imports + "\n" + exports

              # Absolute role/domain anchors. These get high scores because they are structural evidence.
              if role == "engin_domain" and ("/brain/" in p or p.endswith("/brain/README.md".lower())):
                  add_role_score(role, scores, reasons, "05_build_runtime_state", "active_engine", 900, "semantic role: Engin brain/knowledge file stays with active engine")
                  add_role_score(role, scores, reasons, "02_build_data_model", "entities", 190, "semantic secondary: structured Engin knowledge/data")
                  return

              if role == "data_json" and ("/brain/" in p or "brain/" in p):
                  add_role_score(role, scores, reasons, "05_build_runtime_state", "active_engine", 850, "semantic role: brain JSON is engine knowledge/data, not user flow")
                  add_role_score(role, scores, reasons, "02_build_data_model", "entities", 160, "semantic secondary: structured JSON knowledge")
                  return

              if role == "sql_schema":
                  if "enable row level security" in h or "create policy" in h or "auth.uid()" in h:
                      add_role_score(role, scores, reasons, "11_security", "row_level_security", 950, "semantic SQL: RLS/policy/auth.uid is security behavior")
                  elif "create table" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "database_tables", 900, "semantic SQL: CREATE TABLE defines data model")
                  elif "create index" in h or "using gin" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "indexes", 820, "semantic SQL: CREATE INDEX defines data model index")
                      add_role_score(role, scores, reasons, "12_performance", "database_indexes", 240, "semantic secondary: database index affects performance")
                  return

              if role == "api_route":
                  if regex_any([r"export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE)", r"NextResponse\.json", r"new\s+Response\s*\("], f.text):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "route_handlers", 900, "semantic API: exported HTTP handler and Response shape")
                  if contains_any(h, ["request.json", "req.json", "z.object", "safeparse", "parse("]):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "body_validation", 330, "semantic API: body parsing/validation")
                  if contains_any(h, ["searchparams", "nexturl.searchparams"]):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "query_params", 310, "semantic API: query/search params")
                  if contains_any(h, ["formdata", "blob", "file", "upload"]):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "upload_endpoints", 360, "semantic API: upload/FormData endpoint")
                  if contains_any(h, ["supabase.auth.getuser", "getuser(", "cookies(", "session"]):
                      add_role_score(role, scores, reasons, "03_build_backend", "auth", 380, "semantic backend: server auth/session lookup")
                  if contains_any(h, ["forbidden", "unauthorized", "permission", "role", "admin"]):
                      add_role_score(role, scores, reasons, "11_security", "authorization", 360, "semantic security: authorization/permission branch")
                  if contains_any(h, ["supabase.from", ".select(", ".insert(", ".update(", ".delete("]):
                      add_role_score(role, scores, reasons, "03_build_backend", "database_access", 340, "semantic backend: database CRUD access")
                  if contains_any(h + p, ["webhook", "signature", "x-hub", "stripe-signature"]):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "webhook_endpoints", 420, "semantic API: webhook endpoint")
                  return

              if role == "server_action":
                  add_role_score(role, scores, reasons, "03_build_backend", "server_only_logic", 800, "semantic server action: server-only behavior")
                  if contains_any(h, ["supabase", "from(", ".select(", ".insert(", ".update(", ".delete("]):
                      add_role_score(role, scores, reasons, "03_build_backend", "database_access", 310, "semantic server action: database access")
                  if contains_any(h, ["redirect(", "revalidatepath", "cookies("]):
                      add_role_score(role, scores, reasons, "06_build_application_behavior", "what_happens_on_save", 220, "semantic server action: mutation/navigation side effect")
                  return

              if role == "page_screen":
                  if f.is_page_file:
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "page_files", 880, "semantic page: Next route page")
                  if f.is_layout_file:
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "layout_files", 880, "semantic page: Next layout")
                  if n.startswith("loading"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "loading_pages", 880, "semantic page: loading boundary")
                      add_role_score(role, scores, reasons, "01_define_user_flow", "loading_path", 240, "semantic flow: loading state")
                  if n.startswith("error"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "error_pages", 880, "semantic page: error boundary")
                      add_role_score(role, scores, reasons, "01_define_user_flow", "failure_path", 240, "semantic flow: failure state")
                  if n.startswith("not-found"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "not_found_pages", 880, "semantic page: not-found boundary")
                      add_role_score(role, scores, reasons, "01_define_user_flow", "empty_path", 220, "semantic flow: empty/not-found state")
                  if contains_any(p + h, ["login", "sign-in", "sign in", "unauthenticated"]):
                      add_role_score(role, scores, reasons, "01_define_user_flow", "logged_out_path", 310, "semantic flow: logged-out/login page")
                  if contains_any(p + h, ["onboarding", "welcome", "first-time"]):
                      add_role_score(role, scores, reasons, "01_define_user_flow", "onboarding_path", 330, "semantic flow: onboarding path")
                  if contains_any(h, ["searchparams", "params:"]):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "deep_link_behavior", 270, "semantic page: route params/deep link behavior")
                  return

              if role == "component_surface":
                  if tags & {"button"} or "button" in semantic_blob:
                      add_role_score(role, scores, reasons, "08_build_ui_components", "buttons", 300, "semantic JSX: button element/component")
                  if tags & {"form"}:
                      add_role_score(role, scores, reasons, "08_build_ui_components", "forms", 340, "semantic JSX: form element")
                  if tags & {"input", "textarea", "select"}:
                      add_role_score(role, scores, reasons, "08_build_ui_components", "inputs", 330, "semantic JSX: input/textarea/select")
                  if contains_any(semantic_blob, ["modal", "dialog"]):
                      add_role_score(role, scores, reasons, "08_build_ui_components", "modals", 320, "semantic component: modal/dialog surface")
                  if contains_any(semantic_blob, ["panel", "drawer", "sheet"]):
                      add_role_score(role, scores, reasons, "08_build_ui_components", "panels", 300, "semantic component: panel/drawer/sheet surface")
                  if contains_any(semantic_blob, ["card", "tile"]):
                      add_role_score(role, scores, reasons, "08_build_ui_components", "cards", 285, "semantic component: card/tile surface")
                  if handlers & {"onclick", "click"}:
                      add_role_score(role, scores, reasons, "09_wire_interactions", "click", 330, "semantic handler: click/onClick")
                  if handlers & {"onpointerdown", "onpointermove", "onpointerup", "pointerdown", "pointermove", "pointerup"}:
                      add_role_score(role, scores, reasons, "09_wire_interactions", "pointer_capture", 350, "semantic handler: pointer interaction")
                  if handlers & {"ontouchstart", "ontouchmove", "ontouchend", "touchstart", "touchmove", "touchend"}:
                      add_role_score(role, scores, reasons, "09_wire_interactions", "mobile_touch_behavior", 350, "semantic handler: mobile touch interaction")
                  if contains_any(h + p, ["drag", "draggable", "ondrag", "drop target", "ondrop"]):
                      add_role_score(role, scores, reasons, "09_wire_interactions", "drag", 360, "semantic interaction: drag/drop behavior")
                  if contains_any(h, ["aria-label", "aria-labelledby", "role=", "tabindex"]):
                      add_role_score(role, scores, reasons, "13_accessibility", "labels", 310, "semantic accessibility: ARIA/role/tabIndex")
                  if contains_any(h, ["usestate", "usereducer", "usememo", "useeffect"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "active_screen", 160, "semantic secondary: component state/effects")
                  return

              if role == "hook":
                  if contains_any(p + h, ["drag", "drop", "pointer", "touch", "swipe", "pinch", "gesture"]):
                      add_role_score(role, scores, reasons, "09_wire_interactions", "mobile_touch_behavior", 520, "semantic hook: gesture/touch/pointer interaction")
                  if contains_any(h, ["localstorage", "sessionstorage", "indexeddb"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "persisted_local_state", 420, "semantic hook: persisted local state")
                  if contains_any(h, ["addeventlistener", "removeeventlistener", "subscribe", "unsubscribe"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "events", 360, "semantic hook: event lifecycle")
                  if contains_any(h, ["usestate", "usereducer"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "active_selection", 220, "semantic hook: state management")
                  return

              if role == "engine_runtime":
                  add_role_score(role, scores, reasons, "05_build_runtime_state", "active_runtime", 760, "semantic runtime: engine/runtime path")
                  if contains_any(h + p, ["offlinequeue", "offline queue", "queue"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "offline_queue", 360, "semantic runtime: offline/queue behavior")
                  if contains_any(h + p, ["snapshot", "fingerprint"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "sync_state", 330, "semantic runtime: snapshot/sync state")
                  if contains_any(h + p, ["channel", "eventbus", "emit(", "subscribe"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "events", 310, "semantic runtime: events/channel bus")
                  if contains_any(h + p, ["webgpu", "wasm", "frame", "raf", "requestanimationframe"]):
                      add_role_score(role, scores, reasons, "12_performance", "mobile_frame_rate", 240, "semantic runtime: frame/GPU performance")
                  return

              if role == "engin_domain":
                  add_role_score(role, scores, reasons, "05_build_runtime_state", "active_engine", 700, "semantic Engin domain: engine-owned source area")
                  if contains_any(h + p, ["ruleset", "rule-set", "constraints", "transformations", "parameters"]):
                      add_role_score(role, scores, reasons, "06_build_application_behavior", "what_business_rules_run", 440, "semantic Engin: rule-set constraints/transformations/parameters")
                  if contains_any(h + p, ["cartridge", "gameruntime", "game runtime"]):
                      add_role_score(role, scores, reasons, "05_build_runtime_state", "active_engine", 430, "semantic GameEngin: cartridge/runtime behavior")
                  if contains_any(h + p, ["asset", "recipe", "glb", "mesh", "rig", "material"]):
                      add_role_score(role, scores, reasons, "06_build_application_behavior", "what_business_rules_run", 260, "semantic ContentEngin/asset behavior")
