                  else:
                      add_role_score(role, scores, reasons, "02_build_data_model", "entities", 300, "semantic JSON: structured data/config")
                  return

              if role == "documentation":
                  if contains_any(p + h[:120000], ["agent", "operating law", "instructions", "ai agent"]):
                      add_role_score(role, scores, reasons, "20_documentation", "agent_instructions", 520, "semantic doc: agent instructions/law")
                  if contains_any(p + h[:120000], ["architecture", "blueprint", "runtime", "system design"]):
                      add_role_score(role, scores, reasons, "20_documentation", "architecture_notes", 460, "semantic doc: architecture/system design")
                  return

          def add_score(scores: Dict[Tuple[str, str], int], reasons: Dict[Tuple[str, str], List[str]], category: str, subfolder: str, weight: int, reason: str) -> None:
              if category not in CATEGORIES:
                  raise KeyError(f"Unknown category: {category}")
              if subfolder not in CATEGORIES[category]:
                  raise KeyError(f"Unknown subfolder: {category}/{subfolder}")
              key = (category, subfolder)
              scores[key] += weight
              reasons[key].append(reason)

          def file_role(f: FileFacts) -> str:
              p = f.path_lower
              n = f.name_lower

              if f.is_binary:
                  return "asset_binary"
              if f.is_test_file:
                  return "test"
              if f.is_workflow:
                  return "workflow"
              if n in {"package.json", "pnpm-lock.yaml", "package-lock.json", "yarn.lock", "bun.lockb", "pnpm-workspace.yaml"}:
                  return "package_manager"
              if n.startswith("tsconfig") or n in {"eslint.config.mjs", "postcss.config.mjs", "tailwind.config.ts", "vitest.config.ts", "playwright.config.ts"}:
                  return "tool_config"
              if f.is_sql or p.startswith("supabase/migrations/") or p.startswith("supabase/schema/"):
                  return "sql_schema"
              if f.is_route_file:
                  return "api_route"
              if f.is_page_file or f.is_layout_file or n in {"loading.tsx", "loading.ts", "error.tsx", "error.ts", "not-found.tsx", "not-found.ts"}:
                  return "page_screen"
              if f.is_markdown:
                  return "documentation"
              if p.startswith("scripts/") or p.startswith(".ci/") or p.startswith("repo-visualizer/"):
                  return "script_tooling"
              if p.startswith("public/") or p.startswith("fonts/"):
                  return "asset_source"
              if p.startswith("supabase/"):
                  return "backend_supabase"
              if p.startswith("agents/") or p.startswith("dr-eams/"):
                  return "agent_behavior"
              if p.startswith("app/actions/"):
                  return "server_action"
              if p.startswith("hooks/") or "/hooks/" in p or n.startswith("use") and f.is_typescript:
                  return "hook"
              if f.is_component_like or p.startswith("components/") or p.startswith("daydreams/") or p.startswith("coresurfaces/"):
                  return "component_surface"
              if p.startswith("engine/") or p.startswith("lib/runtime/") or p.startswith("lib/engin-runtime/"):
                  return "engine_runtime"
              if p.startswith("engins/") or p.startswith("lib/gameengin/") or p.startswith("lib/contentengin/") or p.startswith("lib/codeengin/"):
                  return "engin_domain"
              if f.is_json:
                  return "data_json"
              if f.is_yaml:
                  return "tool_config"
              if f.is_css:
                  return "style"
              return "generic_code"

          ROLE_ALLOWED_CATEGORIES: Dict[str, Set[str]] = {
              "asset_binary": {"18_content_assets", "12_performance"},
              "asset_source": {"18_content_assets", "12_performance", "13_accessibility"},
              "documentation": {"20_documentation", "17_compliance_policy", "19_release_management", "15_dev_tooling"},
              "workflow": {"15_dev_tooling", "10_verify_build_deploy", "19_release_management", "11_security"},
              "package_manager": {"15_dev_tooling", "19_release_management", "10_verify_build_deploy", "11_security"},
              "tool_config": {"15_dev_tooling", "10_verify_build_deploy", "12_performance"},
              "script_tooling": {"15_dev_tooling", "10_verify_build_deploy", "19_release_management", "02_build_data_model", "18_content_assets", "14_observability"},
              "test": {"10_verify_build_deploy", "11_security", "12_performance", "13_accessibility", "04_build_api_layer", "02_build_data_model"},
              "sql_schema": {"02_build_data_model", "11_security", "17_compliance_policy", "12_performance"},
              "api_route": {"04_build_api_layer", "03_build_backend", "11_security", "14_observability", "17_compliance_policy", "16_product_operations", "02_build_data_model"},
              "server_action": {"03_build_backend", "04_build_api_layer", "06_build_application_behavior", "11_security", "02_build_data_model", "14_observability"},
              "page_screen": {"07_build_pages_screens", "01_define_user_flow", "08_build_ui_components", "09_wire_interactions", "05_build_runtime_state", "13_accessibility", "17_compliance_policy", "16_product_operations", "18_content_assets"},
              "component_surface": {"08_build_ui_components", "09_wire_interactions", "05_build_runtime_state", "13_accessibility", "01_define_user_flow", "06_build_application_behavior", "12_performance", "18_content_assets"},
              "hook": {"09_wire_interactions", "05_build_runtime_state", "06_build_application_behavior", "13_accessibility", "12_performance", "14_observability"},
              "engine_runtime": {"05_build_runtime_state", "06_build_application_behavior", "12_performance", "14_observability", "11_security", "02_build_data_model", "09_wire_interactions", "18_content_assets"},
              "engin_domain": {"05_build_runtime_state", "06_build_application_behavior", "02_build_data_model", "09_wire_interactions", "12_performance", "14_observability", "18_content_assets", "11_security"},
              "agent_behavior": {"06_build_application_behavior", "03_build_backend", "11_security", "16_product_operations", "17_compliance_policy", "14_observability"},
              "backend_supabase": {"03_build_backend", "02_build_data_model", "11_security", "04_build_api_layer"},
              "data_json": {"02_build_data_model", "18_content_assets", "05_build_runtime_state", "06_build_application_behavior", "15_dev_tooling"},
              "style": {"08_build_ui_components", "18_content_assets", "13_accessibility"},
              "generic_code": {"06_build_application_behavior", "05_build_runtime_state", "02_build_data_model", "11_security", "12_performance", "14_observability"},
          }

          def add_role_score(
              role: str,
              scores: Dict[Tuple[str, str], int],
              reasons: Dict[Tuple[str, str], List[str]],
              category: str,
              subfolder: str,
              weight: int,
              reason: str,
          ) -> None:
              allowed = ROLE_ALLOWED_CATEGORIES.get(role, ROLE_ALLOWED_CATEGORIES["generic_code"])
              if category not in allowed:
                  return
              add_score(scores, reasons, category, subfolder, weight, reason)

          def primary_fallback_for_role(role: str, f: FileFacts) -> Tuple[str, str, str]:
              p = f.path_lower
              if role == "asset_binary":
                  if f.suffix in {".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico"}:
                      return "18_content_assets", "images" if f.suffix != ".svg" else "icons", f"binary image/icon asset {f.suffix}"
                  if f.suffix in {".ttf", ".otf", ".woff", ".woff2"}:
                      return "18_content_assets", "fonts", f"font asset {f.suffix}"
                  if f.suffix in {".mp3", ".wav"}:
                      return "18_content_assets", "audio", f"audio asset {f.suffix}"
                  if f.suffix in {".mp4", ".mov"}:
                      return "18_content_assets", "video", f"video asset {f.suffix}"
                  if f.suffix in {".glb", ".gltf"}:
                      return "18_content_assets", "models", f"model asset {f.suffix}"
                  return "18_content_assets", "static_files", f"binary/static asset {f.suffix}"
              if role == "documentation":
                  return "20_documentation", "architecture_notes" if "architecture" in p else "feature_docs", "Markdown/documentation file role"
              if role == "workflow":
                  return "15_dev_tooling", "ci_workflows", "GitHub workflow file role"
              if role == "package_manager":
                  return "15_dev_tooling", "package_manager", "package/dependency file role"
              if role == "tool_config":
                  return "15_dev_tooling", "typecheck_config", "tooling/config file role"
              if role == "script_tooling":
                  return "15_dev_tooling", "scripts", "script/tooling file role"
              if role == "test":
                  return "10_verify_build_deploy", "unit_tests", "test file role"
              if role == "sql_schema":
                  return "02_build_data_model", "migration_files", "SQL/schema file role"
              if role == "api_route":
                  return "04_build_api_layer", "routes", "API route file role"
              if role == "server_action":
                  return "03_build_backend", "server_only_logic", "server action file role"
              if role == "page_screen":
                  if f.name_lower.startswith("loading"):
                      return "07_build_pages_screens", "loading_pages", "Next loading route file role"
                  if f.name_lower.startswith("error"):
                      return "07_build_pages_screens", "error_pages", "Next error route file role"
                  if f.name_lower.startswith("not-found"):
                      return "07_build_pages_screens", "not_found_pages", "Next not-found route file role"
                  if f.is_layout_file:
                      return "07_build_pages_screens", "layout_files", "Next layout file role"
                  return "07_build_pages_screens", "page_files", "Next page/screen file role"
              if role == "component_surface":
                  return "08_build_ui_components", "component_variants", "React component/surface file role"
              if role == "hook":
                  return "05_build_runtime_state", "persisted_local_state", "hook/state helper file role"
              if role == "engine_runtime":
                  return "05_build_runtime_state", "active_runtime", "engine runtime file role"
              if role == "engin_domain":
                  return "05_build_runtime_state", "active_engine", "Engin domain file role"
              if role == "agent_behavior":
                  return "06_build_application_behavior", "what_business_rules_run", "agent/application behavior file role"
              if role == "backend_supabase":
                  return "03_build_backend", "database_access", "Supabase backend integration file role"
              if role == "data_json":
                  if "/brain/" in p or "brain/" in p:
                      return "05_build_runtime_state", "active_engine", "Engin brain/data JSON file role"
                  if "manifest" in p:
                      return "18_content_assets", "manifests", "manifest JSON file role"
                  return "02_build_data_model", "entities", "JSON data/config file role"
              if role == "style":
                  return "08_build_ui_components", "design_tokens", "style/design file role"
              return "06_build_application_behavior", "what_business_rules_run", "generic code file role"

          def classify_by_code(f: FileFacts) -> Tuple[str, str, str, List[Dict[str, object]]]:
              scores: Dict[Tuple[str, str], int] = defaultdict(int)
              reasons: Dict[Tuple[str, str], List[str]] = defaultdict(list)
              role = file_role(f)
              h = f.lower
              p = f.path_lower
              nh = f.name_lower

              fallback_category, fallback_subfolder, fallback_reason = primary_fallback_for_role(role, f)
              add_role_score(role, scores, reasons, fallback_category, fallback_subfolder, 100, fallback_reason)
              add_deterministic_semantic_scores(role, scores, reasons, f)

              # Hard role gates stop content words in data files from pretending to be user-flow/app behavior.
              # Example: a GameEngin brain JSON can mention recovery, screen, progress, or save, but it is not a UI flow file.

              # Binary/static assets.
              if role in {"asset_binary", "asset_source"}:
                  if f.suffix in {".png", ".jpg", ".jpeg", ".gif", ".webp"}:
                      add_role_score(role, scores, reasons, "18_content_assets", "images", 180, "image file extension")
                  if f.suffix == ".svg" or "/icons/" in p:
                      add_role_score(role, scores, reasons, "18_content_assets", "icons", 175, "icon/SVG asset evidence")
                  if f.suffix in {".ttf", ".otf", ".woff", ".woff2"} or "/fonts/" in p:
                      add_role_score(role, scores, reasons, "18_content_assets", "fonts", 180, "font asset evidence")
                  if f.suffix in {".glb", ".gltf"} or "/models/" in p:
                      add_role_score(role, scores, reasons, "18_content_assets", "models", 180, "model asset evidence")
                  if f.suffix in {".mp3", ".wav"} or "/audio/" in p:
                      add_role_score(role, scores, reasons, "18_content_assets", "audio", 180, "audio asset evidence")
                  if "manifest" in p or nh == "manifest.json":
                      add_role_score(role, scores, reasons, "18_content_assets", "manifests", 145, "manifest asset evidence")

              # Documentation only maps by document purpose, not by random code words inside docs.
              if role == "documentation":
                  doc_terms = p + "\n" + h[:120000]
                  if contains_any(doc_terms, ["architecture", "blueprint", "runtime law", "engine + rule", "system design"]):
                      add_role_score(role, scores, reasons, "20_documentation", "architecture_notes", 180, "architecture documentation evidence")
                  if contains_any(doc_terms, ["api", "endpoint", "request", "response"]):
                      add_role_score(role, scores, reasons, "20_documentation", "api_docs", 130, "API documentation evidence")
                  if contains_any(doc_terms, ["schema", "table", "migration", "database"]):
                      add_role_score(role, scores, reasons, "20_documentation", "data_model_docs", 130, "data model documentation evidence")
                  if contains_any(doc_terms, ["setup", "install", "local", "environment"]):
                      add_role_score(role, scores, reasons, "20_documentation", "setup_docs", 125, "setup documentation evidence")
                  if contains_any(doc_terms, ["agent", "ai agent", "operating law", "instructions"]):
                      add_role_score(role, scores, reasons, "20_documentation", "agent_instructions", 150, "agent instruction documentation evidence")
                  if contains_any(doc_terms, ["known issue", "bug", "failure", "troubleshoot"]):
                      add_role_score(role, scores, reasons, "20_documentation", "known_issues", 110, "known issue documentation evidence")
                  if contains_any(doc_terms, ["release", "changelog", "deploy", "rollback"]):
                      add_role_score(role, scores, reasons, "19_release_management", "release_checklist", 90, "release/deploy documentation evidence")
                  if contains_any(doc_terms, ["privacy", "terms", "policy", "child safety", "data retention"]):
                      add_role_score(role, scores, reasons, "17_compliance_policy", "privacy_policy", 120, "policy/compliance documentation evidence")

              # CI, package, config, scripts.
              if role == "workflow":
                  add_role_score(role, scores, reasons, "15_dev_tooling", "ci_workflows", 200, "workflow syntax path .github/workflows")
                  if contains_any(h + p, ["typecheck", "tsc", "lint", "eslint", "vitest", "test", "next build", "pnpm build"]):
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "build", 130, "verification/build command in workflow")
                  if contains_any(h + p, ["deploy", "vercel", "production", "rollback", "release"]):
                      add_role_score(role, scores, reasons, "19_release_management", "production_deploy", 130, "deploy/release command in workflow")
                  if contains_any(h + p, ["permissions:", "secrets", "token", "contents: write"]):
                      add_role_score(role, scores, reasons, "11_security", "secrets", 85, "workflow permission/secret handling")
              if role == "package_manager":
                  add_role_score(role, scores, reasons, "15_dev_tooling", "dependency_management", 120, "dependency manifest/lockfile")
                  if contains_any(h, ["scripts", "typecheck", "lint", "test", "build"]):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "scripts", 90, "package scripts")
              if role == "tool_config":
                  if nh.startswith("tsconfig"):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "typecheck_config", 180, "TypeScript config filename")
                  if contains_any(nh + p, ["eslint", "prettier"]):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "lint_config", 165, "lint/format config filename")
                  if contains_any(nh + p, ["vitest", "playwright"]):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "test_commands", 135, "test config filename")
                  if contains_any(nh + p, ["next.config", "tailwind", "postcss"]):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "local_setup", 120, "app build/style tooling config")
              if role == "script_tooling":
                  if contains_any(h + p, ["typecheck", "lint", "test", "build"]):
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "test_commands", 125, "script runs verification/build command")
                  if contains_any(h + p, ["deploy", "release", "rollback", "changelog"]):
                      add_role_score(role, scores, reasons, "19_release_management", "deploy_target", 125, "script handles deploy/release")
                  if contains_any(h + p, ["migration", "supabase", "schema"]):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "migration_scripts", 115, "script handles migrations/schema")
                  if contains_any(h + p, ["generate", "codegen", "export-repo", "file_tree"]):
                      add_role_score(role, scores, reasons, "15_dev_tooling", "codegen_commands", 105, "script handles generation/export")

              # Tests.
              if role == "test":
                  add_role_score(role, scores, reasons, "10_verify_build_deploy", "unit_tests", 170, "test file syntax/path")
                  if contains_any(p + h, ["integration", "route", "api", "request", "response"]):
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "integration_tests", 115, "integration/API test evidence")
                  if contains_any(p + h, ["auth", "permission", "security", "rls"]):
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "permission_tests", 110, "security/auth test evidence")
                  if contains_any(p + h, ["performance", "benchmark", "fps", "latency"]):
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "performance_checks", 110, "performance test evidence")
                  if contains_any(p + h, ["accessibility", "aria", "keyboard", "focus"]):
                      add_role_score(role, scores, reasons, "10_verify_build_deploy", "accessibility_checks", 110, "accessibility test evidence")

              # SQL/data schema.
              if role == "sql_schema":
                  if "create table" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "database_tables", 180, "CREATE TABLE SQL")
                  if "create view" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "database_views", 150, "CREATE VIEW SQL")
                  if "create index" in h or "using gin" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "indexes", 145, "CREATE INDEX SQL")
                      add_role_score(role, scores, reasons, "12_performance", "database_indexes", 100, "database index performance evidence")
                  if "primary key" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "primary_keys", 110, "PRIMARY KEY SQL")
                  if "foreign key" in h or "references " in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "foreign_keys", 120, "foreign key/reference SQL")
                  if "unique" in h:
                      add_role_score(role, scores, reasons, "02_build_data_model", "unique_constraints", 95, "unique constraint SQL")
                  if contains_any(h, ["created_at", "updated_at", "deleted_at"]):
                      add_role_score(role, scores, reasons, "02_build_data_model", "timestamps", 90, "timestamp fields SQL")
                  if contains_any(h, ["user_id", "owner_id", "auth.uid()"]):
                      add_role_score(role, scores, reasons, "02_build_data_model", "ownership", 105, "ownership/user fields SQL")
                  if "create policy" in h or "enable row level security" in h or "auth.uid()" in h:
                      add_role_score(role, scores, reasons, "11_security", "row_level_security", 200, "RLS/policy/auth.uid SQL")
                  if contains_any(h + p, ["delete-data", "export-data", "retention", "privacy"]):
                      add_role_score(role, scores, reasons, "17_compliance_policy", "data_retention", 105, "compliance/data retention SQL")

              # API routes and server actions.
              if role in {"api_route", "server_action"}:
                  if regex_any([r"export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE)", r"NextResponse\.json", r"new\s+Response\("], h):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "route_handlers", 180, "HTTP handler/Response code")
                  if "request.json" in h or "await req.json" in h or "await request.json" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "request_shape", 120, "request JSON parsing")
                  if "formdata" in h or "await request.formdata" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "upload_endpoints", 135, "FormData/upload endpoint parsing")
                      add_role_score(role, scores, reasons, "03_build_backend", "file_upload_handling", 120, "server upload handling")
                  if "searchparams" in h or ".nexturl.searchparams" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "query_params", 120, "searchParams code")
                  if "nextresponse.json" in h or "json(" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "response_shape", 115, "JSON response code")
                  if "status:" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "status_codes", 95, "explicit response status code")
                  if "ok: true" in h or "success" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "success_responses", 80, "success response shape")
                  if "ok: false" in h or "catch" in h or "error" in h:
                      add_role_score(role, scores, reasons, "04_build_api_layer", "error_responses", 105, "error response/catch handling")
                  if contains_any(h, ["supabase.auth.getuser", "getuser(", "session", "cookies("]):
                      add_role_score(role, scores, reasons, "03_build_backend", "auth", 130, "server auth/session lookup")
                      add_role_score(role, scores, reasons, "04_build_api_layer", "auth_checks", 125, "API auth check")
                  if contains_any(h, ["permission", "forbidden", "unauthorized", "role", "admin"]):
                      add_role_score(role, scores, reasons, "11_security", "authorization", 125, "authorization/permission checks")
                      add_role_score(role, scores, reasons, "04_build_api_layer", "permission_checks", 115, "API permission checks")
                  if contains_any(h, ["supabase.from", ".select(", ".insert(", ".update(", ".delete("]):
                      add_role_score(role, scores, reasons, "03_build_backend", "database_access", 125, "database access code")
                  if contains_any(h, ["rate limit", "ratelimit", "rate_limit"]):
                      add_role_score(role, scores, reasons, "03_build_backend", "rate_limits", 120, "rate limit code")
                  if contains_any(h + p, ["webhook", "signature", "x-hub", "stripe-signature"]):
                      add_role_score(role, scores, reasons, "04_build_api_layer", "webhook_endpoints", 150, "webhook/signature endpoint code")
                      add_role_score(role, scores, reasons, "03_build_backend", "webhook_verification", 130, "webhook verification code")
                  if contains_any(h + p, ["delete-data", "delete account"]):
                      add_role_score(role, scores, reasons, "17_compliance_policy", "delete_account_flow", 140, "delete account/data API code")
                  if contains_any(h + p, ["export-data", "export data"]):
                      add_role_score(role, scores, reasons, "17_compliance_policy", "export_data_flow", 140, "export data API code")
                  if contains_any(h, ["console.error", "logger", "metrics", "trace", "request id"]):
                      add_role_score(role, scores, reasons, "14_observability", "logs", 95, "logging/metrics in server code")

              # Pages/screens and user flow. Only route/page files get user-flow primary evidence.
              if role == "page_screen":
                  if f.is_page_file:
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "page_files", 180, "Next page file")
                  if f.is_layout_file:
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "layout_files", 180, "Next layout file")
                  if nh.startswith("loading"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "loading_pages", 180, "Next loading page file")
                      add_role_score(role, scores, reasons, "01_define_user_flow", "loading_path", 105, "loading route state")
                  if nh.startswith("error"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "error_pages", 180, "Next error page file")
                      add_role_score(role, scores, reasons, "01_define_user_flow", "failure_path", 105, "error route state")
                  if nh.startswith("not-found"):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "not_found_pages", 180, "Next not-found page file")
                      add_role_score(role, scores, reasons, "01_define_user_flow", "empty_path", 100, "not-found/empty route state")
                  if contains_any(p + h, ["login", "logout", "sign in", "sign-in", "unauthenticated"]):
                      add_role_score(role, scores, reasons, "01_define_user_flow", "logged_out_path", 125, "login/logged-out route evidence")
                  if contains_any(h, ["getuser", "session", "authenticated"]):
                      add_role_score(role, scores, reasons, "01_define_user_flow", "logged_in_path", 115, "session/authenticated page evidence")
                  if contains_any(p + h, ["onboarding", "welcome", "first time"]):
                      add_role_score(role, scores, reasons, "01_define_user_flow", "onboarding_path", 125, "onboarding route evidence")
                  if contains_any(h, ["redirect(", "router.push", "permanentredirect"]):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "redirects", 115, "redirect/navigation code")
                  if contains_any(h, ["metadata", "opengraph", "twitter:"]):
                      add_role_score(role, scores, reasons, "07_build_pages_screens", "page_metadata", 100, "page metadata export")
                  if contains_any(h, ["searchparams", "params"]):
