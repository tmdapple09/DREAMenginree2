              if role == "data_json":
                  if contains_any(p, ["manifest", "package.json"]):
                      add_role_score(role, scores, reasons, "18_content_assets", "manifests", 560, "semantic JSON: manifest/config package")
                  elif contains_any(p, ["fixture", "fixtures", "seed"]):
