name: Update Repo State
on:
  workflow_dispatch:
  push:
    paths:
      # ── Core app surfaces ──────────────────────────────────────
      - "app/**"
      - "dreamdmbar/**"
      - "coresurfaces/**"
      - "daydreams/**"
      # ── Engines ───────────────────────────────────────────────
      - "engins/**"
      # ── UI layer ──────────────────────────────────────────────
      - "components/**"
      - "styles/**"
      # ── Logic / runtime ───────────────────────────────────────
      - "lib/**"
      - "hooks/**"
      - "src/**"
      - "utils/**"
      # ── AI / agents ───────────────────────────────────────────
      - "agents/**"
      - "dr-eams/**"
      - "build-memory/**"
      # ── Runtime infra ─────────────────────────────────────────
      - "assembly/**"
      - "optimizer/**"
      - "workflow/**"
      - "config/**"
      - "misc/**"
      # ── Tests & scripts ───────────────────────────────────────
      - "tests/**"
      - "scripts/**"
      # ── Types ─────────────────────────────────────────────────
      - "types/**"
      # ── Root-level files ──────────────────────────────────────
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - "*.js"
      - "*.mjs"

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Generate Repository State
        run: node scripts/generate-repo-state.mjs

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPO_STATE.md FILE_TREE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(repo): update repository state [skip ci]"
            git push
          else
            echo "No changes detected"
          fi
