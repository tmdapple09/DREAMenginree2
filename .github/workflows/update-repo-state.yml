name: Update Repo State

on:
  workflow_dispatch:
  push:
    paths:
      # User-facing: pages, routes, named feature areas, and visible components with descriptive names.
      - "app/**"
      - "coresurfaces/**"
      - "daydreams/**"
      - "dreamdmbar/**"
      - "dreamr/**"

      # Runtime / engines
      - "engine/**"
      - "engins/**"
      - "assembly/**"

      # UI / assets
      - "components/**"
      - "styles/**"
      - "fonts/**"
      - "public/**"

      # Shared logic
      - "hooks/**"
      - "src/**"
      - "utils/**"
      - "types/**"

      # Backend / data
      - "supabase/**"
      - "supabaseClient.ts"
      - "proxy.ts"

      # AI / agents
      - "agents/**"
      - "dr-eams/**"
      - "build-memory/**"

      # Tooling / tests
      - ".github/**"
      - ".ci/**"
      - "scripts/**"
      - "tests/**"
      - "optimizer/**"
      - "repo-visualizer/**"
      - "config/**"
      - "misc/**"

      # Docs / research
      - "docs/**"
      - "research/**"
      - "research-and-development/**"
      - "*.md"

      # Root build / config
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.mjs"
      - "eslint.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.*"
      - "tsconfig*.json"
      - "vercel.json"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "*.json"
      - "*.js"
      - "*.cjs"
      - "*.mjs"
      - "*.ts"
      - "*.tsx"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - ".env.example"
      - ".env.local.example"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".cursorrules"
      - "LICENSE"

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Generate Repository State
        run: node scripts/generate-repo-state.mjs

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPO_STATE.md FILE_TREE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(repo): update repository state [skip ci]"
            git push
          else
            echo "No changes detected"
          fi
