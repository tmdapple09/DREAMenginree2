name: DREAM Equation-Generated Codebase Field
run-name: DREAM Equation-Generated Codebase Field

"on":
  workflow_dispatch:
    inputs:
      maximum_dimension:
        description: "Maximum square PNG dimension"
        required: false
        default: "16384"
        type: string

permissions:
  contents: read

concurrency:
  group: dream-equation-codebase-field-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-codebase-field:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install transform runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             "numpy>=2,<3"             "scipy>=1.13,<2"             "pypng>=0.20220715.0"             "zstandard>=0.22,<1"             "reedsolo>=1.7,<2"

      - name: Write the equation transform
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dream_equation_dct_codec.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          import os
          import stat
          import struct
          import subprocess
          import sys
          import tempfile
          from pathlib import Path, PurePosixPath
          from typing import Iterator

          import numpy as np
          import png
          import zstandard as zstd
          from reedsolo import RSCodec, ReedSolomonError
          from scipy.fft import dctn, idctn

          MAGIC = b"DRMDCT05"
          VERSION = 5
          CAPSULE_MAGIC = b"DRMCAP05"
          CAPSULE_PREFIX = struct.Struct(">8sQ")
          HEADER_STRUCT = struct.Struct(">8sHQQQ32s32sHHHH")
          HEADER_DATA_BYTES = 191
          HEADER_ECC_BYTES = 64
          HEADER_CODEWORD_BYTES = 255
          PAYLOAD_DATA_BYTES = 223
          PAYLOAD_ECC_BYTES = 32
          PAYLOAD_CODEWORD_BYTES = 255
          BLOCK_SIZE = 8
          COEFFICIENTS_PER_CHANNEL = 40
          COEFFICIENT_COUNT = COEFFICIENTS_PER_CHANNEL * 3
          BITS_PER_COEFFICIENT = 2
          BYTES_PER_BLOCK = COEFFICIENT_COUNT * BITS_PER_COEFFICIENT // 8
          AMPLITUDES = np.array([-28.0, -10.0, 10.0, 28.0], dtype=np.float32)
          MIN_BLOCK_SIDE = 8

          GOLDEN_ANGLE = math.pi / 5.0
          OMEGA = complex(math.cos(GOLDEN_ANGLE), math.sin(GOLDEN_ANGLE))
          PHI = float((OMEGA + OMEGA.conjugate()).real)
          GOLDEN_N = float((PHI + math.sqrt(PHI * PHI + 4.0)) / 2.0)
          IDENTITY_RESIDUAL = abs(GOLDEN_N - 1.0 / GOLDEN_N - PHI)

          if IDENTITY_RESIDUAL > 1.0e-12:
              raise RuntimeError("golden identity invariant failed")

          PHI_WORD = int(PHI * (1 << 52))
          N_WORD = int(GOLDEN_N * (1 << 52))
          ANGLE_WORD = int(GOLDEN_ANGLE * (1 << 52))


          class RecoveryError(RuntimeError):
              pass


          def canonical_json(value: object) -> bytes:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")


          def sha256_file(path: Path) -> bytes:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
              return digest.digest()


          def sha256_bytes(data: bytes) -> bytes:
              return hashlib.sha256(data).digest()


          def tracked_paths(root: Path) -> list[str]:
              result = subprocess.run(
                  [
                      "git",
                      "-C",
                      str(root),
                      "ls-files",
                      "-z",
                      "--recurse-submodules",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              paths = [
                  item.decode("utf-8", "surrogateescape")
                  for item in result.stdout.split(b"\0")
                  if item
              ]
              paths = sorted(set(paths))
              if not paths:
                  raise RuntimeError("git reported no tracked paths")
              return paths


          def validated_path(value: str) -> PurePosixPath:
              path = PurePosixPath(value)
              if (
                  not value
                  or path.is_absolute()
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise RecoveryError(f"unsafe repository path: {value!r}")
              return path


          def validate_symlink_target(link_path: PurePosixPath, target: str) -> None:
              if not target or "\x00" in target:
                  raise RecoveryError(f"invalid symlink target for {link_path}")
              target_path = PurePosixPath(target)
              if target_path.is_absolute():
                  raise RecoveryError(f"absolute symlink is not allowed: {link_path} -> {target}")
              depth = len(link_path.parent.parts)
              for part in target_path.parts:
                  if part in {"", "."}:
                      continue
                  if part == "..":
                      depth -= 1
                      if depth < 0:
                          raise RecoveryError(f"symlink escapes output tree: {link_path} -> {target}")
                  else:
                      depth += 1


          def build_capsule(root: Path, capsule_path: Path, data_path: Path) -> dict:
              entries: list[dict] = []
              offset = 0

              with data_path.open("wb") as data_output:
                  for relative_text in tracked_paths(root):
                      relative = validated_path(relative_text)
                      absolute = root.joinpath(*relative.parts)

                      if not absolute.exists() and not absolute.is_symlink():
                          raise RuntimeError(f"tracked path is missing: {relative_text}")

                      metadata = os.lstat(absolute)
                      mode = stat.S_IMODE(metadata.st_mode)

                      if stat.S_ISDIR(metadata.st_mode):
                          continue

                      if stat.S_ISLNK(metadata.st_mode):
                          target = os.readlink(absolute)
                          validate_symlink_target(relative, target)
                          entries.append(
                              {
                                  "path": relative.as_posix(),
                                  "type": "symlink",
                                  "mode": mode,
                                  "target": target,
                              }
                          )
                          continue

                      if not stat.S_ISREG(metadata.st_mode):
                          raise RuntimeError(f"unsupported tracked file type: {relative_text}")

                      digest = hashlib.sha256()
                      size = 0
                      with absolute.open("rb") as source:
                          while True:
                              chunk = source.read(1024 * 1024)
                              if not chunk:
                                  break
                              data_output.write(chunk)
                              digest.update(chunk)
                              size += len(chunk)

                      entries.append(
                          {
                              "path": relative.as_posix(),
                              "type": "file",
                              "mode": mode,
                              "offset": offset,
                              "size": size,
                              "sha256": digest.hexdigest(),
                          }
                      )
                      offset += size

              root_descriptor = [
                  {
                      "path": entry["path"],
                      "type": entry["type"],
                      "mode": entry["mode"],
                      "size": entry.get("size"),
                      "sha256": entry.get("sha256"),
                      "target": entry.get("target"),
                  }
                  for entry in entries
              ]
              codebase_root = hashlib.sha256(canonical_json(root_descriptor)).hexdigest()

              manifest = {
                  "format": "dream-equation-dct-codebase",
                  "version": VERSION,
                  "equation": {
                      "goldenAngle": GOLDEN_ANGLE,
                      "phi": PHI,
                      "n": GOLDEN_N,
                      "identityResidual": IDENTITY_RESIDUAL,
                  },
                  "codebaseRoot": codebase_root,
                  "entryCount": len(entries),
                  "dataBytes": offset,
                  "entries": entries,
              }
              manifest_bytes = canonical_json(manifest)

              with capsule_path.open("wb") as capsule:
                  capsule.write(CAPSULE_PREFIX.pack(CAPSULE_MAGIC, len(manifest_bytes)))
                  capsule.write(manifest_bytes)
                  with data_path.open("rb") as source:
                      while True:
                          chunk = source.read(1024 * 1024)
                          if not chunk:
                              break
                          capsule.write(chunk)

              return manifest


          def compress_capsule(capsule_path: Path, compressed_path: Path) -> None:
              compressor = zstd.ZstdCompressor(level=19, threads=-1, write_checksum=True)
              with (
                  capsule_path.open("rb") as source,
                  compressed_path.open("wb") as destination,
                  compressor.stream_writer(destination, closefd=False) as writer,
              ):
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      writer.write(chunk)


          def rs_encode_payload(source_path: Path, destination_path: Path) -> int:
              codec = RSCodec(PAYLOAD_ECC_BYTES)
              written = 0
              with source_path.open("rb") as source, destination_path.open("wb") as destination:
                  while True:
                      block = source.read(PAYLOAD_DATA_BYTES)
                      if not block:
                          break
                      if len(block) < PAYLOAD_DATA_BYTES:
                          block += b"\x00" * (PAYLOAD_DATA_BYTES - len(block))
                      encoded = bytes(codec.encode(block))
                      if len(encoded) != PAYLOAD_CODEWORD_BYTES:
                          raise RuntimeError("unexpected payload Reed-Solomon size")
                      destination.write(encoded)
                      written += len(encoded)
              return written


          def build_header(compressed_path: Path, capsule_path: Path, payload_encoded_bytes: int) -> bytes:
              body = HEADER_STRUCT.pack(
                  MAGIC,
                  VERSION,
                  compressed_path.stat().st_size,
                  payload_encoded_bytes,
                  capsule_path.stat().st_size,
                  sha256_file(compressed_path),
                  sha256_file(capsule_path),
                  PAYLOAD_DATA_BYTES,
                  PAYLOAD_ECC_BYTES,
                  BLOCK_SIZE,
                  BYTES_PER_BLOCK,
              )
              header = body + sha256_bytes(body)
              if len(header) > HEADER_DATA_BYTES:
                  raise RuntimeError("fixed header overflow")
              header += b"\x00" * (HEADER_DATA_BYTES - len(header))
              encoded = bytes(RSCodec(HEADER_ECC_BYTES).encode(header))
              if len(encoded) != HEADER_CODEWORD_BYTES:
                  raise RuntimeError("unexpected header Reed-Solomon size")
              return encoded


          def coefficient_positions() -> list[tuple[int, int, int]]:
              per_channel = []
              candidates = [
                  (u, v)
                  for u in range(BLOCK_SIZE)
                  for v in range(BLOCK_SIZE)
                  if (u, v) != (0, 0)
              ]
              candidates.sort(
                  key=lambda pair: (
                      (
                          pair[0] * PHI
                          + pair[1] * GOLDEN_N
                          + (pair[0] + 1) * (pair[1] + 1) * GOLDEN_ANGLE
                      ) % 1.0,
                      pair[0] + pair[1],
                      pair,
                  )
              )
              selected = candidates[:COEFFICIENTS_PER_CHANNEL]
              for channel in range(3):
                  rotation = int((channel + 1) * PHI * 7) % len(selected)
                  ordered = selected[rotation:] + selected[:rotation]
                  for u, v in ordered:
                      per_channel.append((channel, u, v))
              if len(per_channel) != COEFFICIENT_COUNT:
                  raise RuntimeError("coefficient map size mismatch")
              return per_channel


          POSITIONS = coefficient_positions()


          def coprime_step(modulus: int, candidate: int) -> int:
              step = candidate % modulus
              if step == 0:
                  step = 1
              while math.gcd(step, modulus) != 1:
                  step += 1
                  if step >= modulus:
                      step = 1
              return step


          def block_permutation(block_index: int) -> tuple[int, int]:
              step = coprime_step(
                  COEFFICIENT_COUNT,
                  PHI_WORD ^ N_WORD ^ (block_index * ANGLE_WORD),
              )
              offset = (
                  block_index * PHI_WORD
                  + N_WORD
                  + ANGLE_WORD
              ) % COEFFICIENT_COUNT
              return step, int(offset)


          def bytes_to_symbols(block: bytes) -> np.ndarray:
              if len(block) != BYTES_PER_BLOCK:
                  raise ValueError("invalid image block byte count")
              raw = np.frombuffer(block, dtype=np.uint8)
              symbols = np.empty(COEFFICIENT_COUNT, dtype=np.uint8)
              symbols[0::4] = raw >> 6
              symbols[1::4] = (raw >> 4) & 0x03
              symbols[2::4] = (raw >> 2) & 0x03
              symbols[3::4] = raw & 0x03
              return symbols


          def symbols_to_bytes(symbols: np.ndarray) -> bytes:
              if len(symbols) != COEFFICIENT_COUNT:
                  raise ValueError("invalid symbol count")
              packed = (
                  (symbols[0::4] << 6)
                  | (symbols[1::4] << 4)
                  | (symbols[2::4] << 2)
                  | symbols[3::4]
              ).astype(np.uint8)
              return packed.tobytes()


          def block_to_coefficients(block: bytes, block_index: int) -> np.ndarray:
              symbols = bytes_to_symbols(block)
              coefficients = np.zeros((3, BLOCK_SIZE, BLOCK_SIZE), dtype=np.float32)
              step, offset = block_permutation(block_index)
              for logical_index, symbol in enumerate(symbols):
                  physical_index = (offset + logical_index * step) % COEFFICIENT_COUNT
                  channel, u, v = POSITIONS[physical_index]
                  coefficients[channel, u, v] = AMPLITUDES[int(symbol)]
              return coefficients


          def coefficients_to_block(coefficients: np.ndarray, block_index: int) -> bytes:
              physical_symbols = np.empty(COEFFICIENT_COUNT, dtype=np.uint8)
              for physical_index, (channel, u, v) in enumerate(POSITIONS):
                  value = coefficients[channel, u, v]
                  physical_symbols[physical_index] = int(np.argmin(np.abs(AMPLITUDES - value)))
              step, offset = block_permutation(block_index)
              logical_symbols = np.empty(COEFFICIENT_COUNT, dtype=np.uint8)
              for logical_index in range(COEFFICIENT_COUNT):
                  physical_index = (offset + logical_index * step) % COEFFICIENT_COUNT
                  logical_symbols[logical_index] = physical_symbols[physical_index]
              return symbols_to_bytes(logical_symbols)


          def required_block_side(encoded_bytes: int) -> int:
              block_count = math.ceil(encoded_bytes / BYTES_PER_BLOCK)
              return max(MIN_BLOCK_SIDE, math.ceil(math.sqrt(block_count)))


          def stream_bytes(header: bytes, payload_path: Path, total_bytes: int) -> Iterator[bytes]:
              remaining = bytearray(header)
              with payload_path.open("rb") as payload:
                  while len(remaining) < total_bytes:
                      chunk = payload.read(1024 * 1024)
                      if not chunk:
                          break
                      remaining.extend(chunk)
              remaining.extend(b"\x00" * max(0, total_bytes - len(remaining)))
              for offset in range(0, total_bytes, BYTES_PER_BLOCK):
                  block = bytes(remaining[offset: offset + BYTES_PER_BLOCK])
                  if len(block) < BYTES_PER_BLOCK:
                      block += b"\x00" * (BYTES_PER_BLOCK - len(block))
                  yield block


          def write_image(output_path: Path, header: bytes, payload_path: Path, maximum_dimension: int) -> dict:
              encoded_bytes = len(header) + payload_path.stat().st_size
              block_side = required_block_side(encoded_bytes)
              image_side = block_side * BLOCK_SIZE
              if image_side > maximum_dimension:
                  raise RuntimeError(
                      f"codebase requires at least {image_side}x{image_side}; "
                      f"maximum_dimension is {maximum_dimension}"
                  )

              capacity_bytes = block_side * block_side * BYTES_PER_BLOCK
              block_stream = stream_bytes(header, payload_path, capacity_bytes)

              def rows() -> Iterator[list[int]]:
                  block_index = 0
                  for _block_row in range(block_side):
                      coefficients = np.zeros(
                          (block_side, 3, BLOCK_SIZE, BLOCK_SIZE),
                          dtype=np.float32,
                      )
                      for column in range(block_side):
                          coefficients[column] = block_to_coefficients(next(block_stream), block_index)
                          block_index += 1
                      spatial = idctn(coefficients, axes=(-2, -1), type=2, norm="ortho", workers=-1)
                      pixels = np.clip(spatial + 128.0, 0.0, 255.0).astype(np.uint8)
                      band = pixels.transpose(2, 0, 3, 1).reshape(BLOCK_SIZE, image_side, 3)
                      for row in band:
                          yield row.reshape(-1).tolist()

              output_path.parent.mkdir(parents=True, exist_ok=True)
              with output_path.open("wb") as destination:
                  writer = png.Writer(
                      width=image_side,
                      height=image_side,
                      greyscale=False,
                      alpha=False,
                      bitdepth=8,
                      compression=6,
                  )
                  writer.write(destination, rows())

              return {
                  "width": image_side,
                  "height": image_side,
                  "blockSide": block_side,
                  "bytesPerBlock": BYTES_PER_BLOCK,
                  "encodedBytes": encoded_bytes,
                  "capacityBytes": capacity_bytes,
              }


          def iter_image_bytes(image_path: Path) -> tuple[int, int, Iterator[int]]:
              reader = png.Reader(filename=str(image_path))
              width, height, rows, _ = reader.asRGB8()
              if width != height or width % BLOCK_SIZE != 0:
                  raise RecoveryError("image must be a square multiple of 8 pixels")
              block_side = width // BLOCK_SIZE
              row_iterator = iter(rows)

              def byte_iterator() -> Iterator[int]:
                  block_index = 0
                  for _block_row in range(block_side):
                      band_rows = []
                      for _ in range(BLOCK_SIZE):
                          try:
                              row = np.asarray(next(row_iterator), dtype=np.float32).reshape(width, 3)
                          except StopIteration as error:
                              raise RecoveryError("image ended before all rows were read") from error
                          band_rows.append(row)
                      band = np.stack(band_rows, axis=0)
                      blocks = band.reshape(BLOCK_SIZE, block_side, BLOCK_SIZE, 3).transpose(1, 3, 0, 2)
                      centered = blocks - 128.0
                      coefficients = dctn(centered, axes=(-2, -1), type=2, norm="ortho", workers=-1)
                      for column in range(block_side):
                          yield from coefficients_to_block(coefficients[column], block_index)
                          block_index += 1

              return width, height, byte_iterator()


          def read_exact(stream: Iterator[int], count: int) -> bytes:
              output = bytearray()
              for _ in range(count):
                  try:
                      output.append(next(stream))
                  except StopIteration as error:
                      raise RecoveryError(f"image ended while reading {count} bytes") from error
              return bytes(output)


          def decode_header(stream: Iterator[int]) -> dict:
              encoded = read_exact(stream, HEADER_CODEWORD_BYTES)
              try:
                  decoded = bytes(RSCodec(HEADER_ECC_BYTES).decode(encoded)[0])
              except ReedSolomonError as error:
                  raise RecoveryError(f"header correction failed: {error}") from error
              body_size = HEADER_STRUCT.size
              body = decoded[:body_size]
              expected_hash = decoded[body_size: body_size + 32]
              if sha256_bytes(body) != expected_hash:
                  raise RecoveryError("header integrity check failed")
              (
                  magic,
                  version,
                  compressed_bytes,
                  payload_encoded_bytes,
                  capsule_bytes,
                  compressed_hash,
                  capsule_hash,
                  payload_data_bytes,
                  payload_ecc_bytes,
                  block_size,
                  bytes_per_block,
              ) = HEADER_STRUCT.unpack(body)
              if magic != MAGIC or version != VERSION:
                  raise RecoveryError("unsupported DREAM DCT image")
              if (
                  payload_data_bytes != PAYLOAD_DATA_BYTES
                  or payload_ecc_bytes != PAYLOAD_ECC_BYTES
                  or block_size != BLOCK_SIZE
                  or bytes_per_block != BYTES_PER_BLOCK
              ):
                  raise RecoveryError("image codec parameters do not match")
              return {
                  "compressedBytes": compressed_bytes,
                  "payloadEncodedBytes": payload_encoded_bytes,
                  "capsuleBytes": capsule_bytes,
                  "compressedSha256": compressed_hash,
                  "capsuleSha256": capsule_hash,
              }


          def decode_payload(stream: Iterator[int], encoded_length: int, compressed_length: int, output_path: Path) -> None:
              if encoded_length % PAYLOAD_CODEWORD_BYTES != 0:
                  raise RecoveryError("invalid payload codeword length")
              codec = RSCodec(PAYLOAD_ECC_BYTES)
              remaining = compressed_length
              with output_path.open("wb") as output:
                  for block_index in range(encoded_length // PAYLOAD_CODEWORD_BYTES):
                      encoded = read_exact(stream, PAYLOAD_CODEWORD_BYTES)
                      try:
                          decoded = bytes(codec.decode(encoded)[0])
                      except ReedSolomonError as error:
                          raise RecoveryError(f"payload correction failed at block {block_index}: {error}") from error
                      amount = min(remaining, len(decoded))
                      output.write(decoded[:amount])
                      remaining -= amount
              if remaining != 0:
                  raise RecoveryError("decoded payload is truncated")


          def decompress_payload(compressed_path: Path, capsule_path: Path) -> None:
              decompressor = zstd.ZstdDecompressor()
              with (
                  compressed_path.open("rb") as source,
                  capsule_path.open("wb") as destination,
                  decompressor.stream_reader(source) as reader,
              ):
                  while True:
                      chunk = reader.read(1024 * 1024)
                      if not chunk:
                          break
                      destination.write(chunk)


          def parse_capsule(capsule_path: Path) -> tuple[dict, int]:
              with capsule_path.open("rb") as capsule:
                  prefix = capsule.read(CAPSULE_PREFIX.size)
                  if len(prefix) != CAPSULE_PREFIX.size:
                      raise RecoveryError("capsule prefix is truncated")
                  magic, manifest_length = CAPSULE_PREFIX.unpack(prefix)
                  if magic != CAPSULE_MAGIC:
                      raise RecoveryError("capsule magic is invalid")
                  manifest_bytes = capsule.read(manifest_length)
                  if len(manifest_bytes) != manifest_length:
                      raise RecoveryError("capsule manifest is truncated")
              try:
                  manifest = json.loads(manifest_bytes.decode("utf-8"))
              except Exception as error:
                  raise RecoveryError(f"capsule manifest is invalid: {error}") from error
              return manifest, CAPSULE_PREFIX.size + manifest_length


          def validate_manifest(manifest: dict) -> None:
              entries = manifest.get("entries")
              if not isinstance(entries, list):
                  raise RecoveryError("manifest entries are missing")
              seen: set[str] = set()
              symlinks: set[PurePosixPath] = set()
              descriptor = []
              for entry in entries:
                  relative = validated_path(str(entry.get("path", "")))
                  key = relative.as_posix()
                  if key in seen:
                      raise RecoveryError(f"duplicate manifest path: {key}")
                  seen.add(key)
                  for parent in relative.parents:
                      if parent in symlinks:
                          raise RecoveryError(f"path traverses symlink parent: {key}")
                  if entry.get("type") == "file":
                      descriptor.append(
                          {
                              "path": key,
                              "type": "file",
                              "mode": int(entry["mode"]),
                              "size": int(entry["size"]),
                              "sha256": entry["sha256"],
                              "target": None,
                          }
                      )
                  elif entry.get("type") == "symlink":
                      target = str(entry.get("target", ""))
                      validate_symlink_target(relative, target)
                      symlinks.add(relative)
                      descriptor.append(
                          {
                              "path": key,
                              "type": "symlink",
                              "mode": int(entry["mode"]),
                              "size": None,
                              "sha256": None,
                              "target": target,
                          }
                      )
                  else:
                      raise RecoveryError(f"unsupported entry type: {key}")
              if hashlib.sha256(canonical_json(descriptor)).hexdigest() != manifest["codebaseRoot"]:
                  raise RecoveryError("codebase root mismatch")


          def safe_output_path(root: Path, relative: PurePosixPath) -> Path:
              root_resolved = root.resolve()
              destination = root.joinpath(*relative.parts)
              current = root
              for part in relative.parts[:-1]:
                  current = current / part
                  if current.exists() and current.is_symlink():
                      raise RecoveryError(f"output traverses symlink: {relative}")
              parent = destination.parent.resolve()
              if parent != root_resolved and root_resolved not in parent.parents:
                  raise RecoveryError(f"output escapes destination: {relative}")
              return destination


          def restore_capsule(capsule_path: Path, output: Path) -> dict:
              manifest, data_offset = parse_capsule(capsule_path)
              validate_manifest(manifest)
              if output.exists() and any(output.iterdir()):
                  raise RecoveryError(f"destination is not empty: {output}")
              output.mkdir(parents=True, exist_ok=True)
              with capsule_path.open("rb") as capsule:
                  for entry in manifest["entries"]:
                      if entry["type"] != "file":
                          continue
                      relative = validated_path(entry["path"])
                      destination = safe_output_path(output, relative)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      capsule.seek(data_offset + int(entry["offset"]))
                      remaining = int(entry["size"])
                      digest = hashlib.sha256()
                      with destination.open("wb") as file_output:
                          while remaining:
                              chunk = capsule.read(min(remaining, 1024 * 1024))
                              if not chunk:
                                  raise RecoveryError(f"file data is truncated: {relative}")
                              file_output.write(chunk)
                              digest.update(chunk)
                              remaining -= len(chunk)
                      if digest.hexdigest() != entry["sha256"]:
                          raise RecoveryError(f"file hash mismatch: {relative}")
                      os.chmod(destination, int(entry["mode"]) & 0o777)
              for entry in manifest["entries"]:
                  if entry["type"] != "symlink":
                      continue
                  relative = validated_path(entry["path"])
                  destination = safe_output_path(output, relative)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  os.symlink(entry["target"], destination)
              return {
                  "restored": True,
                  "files": sum(1 for entry in manifest["entries"] if entry["type"] == "file"),
                  "symlinks": sum(1 for entry in manifest["entries"] if entry["type"] == "symlink"),
                  "codebaseRoot": manifest["codebaseRoot"],
              }


          def build(root: Path, output: Path, maximum_dimension: int) -> dict:
              with tempfile.TemporaryDirectory(prefix="dream-dct-") as temporary_text:
                  temporary = Path(temporary_text)
                  data_path = temporary / "data.bin"
                  capsule_path = temporary / "capsule.bin"
                  compressed_path = temporary / "capsule.zst"
                  payload_path = temporary / "payload.rs"
                  manifest = build_capsule(root, capsule_path, data_path)
                  compress_capsule(capsule_path, compressed_path)
                  payload_encoded_bytes = rs_encode_payload(compressed_path, payload_path)
                  header = build_header(compressed_path, capsule_path, payload_encoded_bytes)
                  image_info = write_image(output, header, payload_path, maximum_dimension)
                  return {
                      "artifact": str(output),
                      "artifactBytes": output.stat().st_size,
                      "artifactSha256": sha256_file(output).hex(),
                      "codebaseRoot": manifest["codebaseRoot"],
                      "entries": manifest["entryCount"],
                      "capsuleBytes": capsule_path.stat().st_size,
                      "compressedBytes": compressed_path.stat().st_size,
                      "payloadEncodedBytes": payload_encoded_bytes,
                      "equation": manifest["equation"],
                      **image_info,
                  }


          def restore(image: Path, output: Path) -> dict:
              with tempfile.TemporaryDirectory(prefix="dream-dct-restore-") as temporary_text:
                  temporary = Path(temporary_text)
                  compressed_path = temporary / "capsule.zst"
                  capsule_path = temporary / "capsule.bin"
                  width, height, stream = iter_image_bytes(image)
                  header = decode_header(stream)
                  decode_payload(
                      stream,
                      header["payloadEncodedBytes"],
                      header["compressedBytes"],
                      compressed_path,
                  )
                  if sha256_file(compressed_path) != header["compressedSha256"]:
                      raise RecoveryError("compressed payload hash mismatch")
                  decompress_payload(compressed_path, capsule_path)
                  if capsule_path.stat().st_size != header["capsuleBytes"]:
                      raise RecoveryError("capsule length mismatch")
                  if sha256_file(capsule_path) != header["capsuleSha256"]:
                      raise RecoveryError("capsule hash mismatch")
                  result = restore_capsule(capsule_path, output)
                  result.update({"width": width, "height": height, "version": VERSION})
                  return result


          def main() -> int:
              parser = argparse.ArgumentParser()
              commands = parser.add_subparsers(dest="command", required=True)
              build_parser = commands.add_parser("build")
              build_parser.add_argument("root", type=Path)
              build_parser.add_argument("output", type=Path)
              build_parser.add_argument("--maximum-dimension", type=int, default=16384)
              restore_parser = commands.add_parser("restore")
              restore_parser.add_argument("image", type=Path)
              restore_parser.add_argument("output", type=Path)
              args = parser.parse_args()
              if args.command == "build":
                  result = build(args.root.resolve(), args.output.resolve(), args.maximum_dimension)
              else:
                  result = restore(args.image.resolve(), args.output.resolve())
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (
                  RecoveryError,
                  KeyError,
                  OSError,
                  ValueError,
                  zstd.ZstdError,
                  ReedSolomonError,
              ) as error:
                  print(f"DREAM DCT atlas failed: {error}", file=sys.stderr)
                  raise SystemExit(2)

          PY
          python -m py_compile "$RUNNER_TEMP/dream_equation_dct_codec.py"

      - name: Build the image directly from codebase bytes
        shell: bash
        env:
          MAXIMUM_DIMENSION: ${{ inputs.maximum_dimension }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/dream-field-output"
          mkdir -p "$GITHUB_WORKSPACE/dream-field-output"

          python "$RUNNER_TEMP/dream_equation_dct_codec.py" build             "$GITHUB_WORKSPACE"             "$GITHUB_WORKSPACE/dream-field-output/DREAM_CODEBASE_SPATIAL_ATLAS.png"             --maximum-dimension "$MAXIMUM_DIMENSION"             | tee "$RUNNER_TEMP/dream-field-build.json"

      - name: Prove exact codebase reconstruction
        shell: bash
        run: |
          set -euo pipefail
          PROOF_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PROOF_ROOT"' EXIT

          python "$RUNNER_TEMP/dream_equation_dct_codec.py" restore             "$GITHUB_WORKSPACE/dream-field-output/DREAM_CODEBASE_SPATIAL_ATLAS.png"             "$PROOF_ROOT/rebuilt"

          python - "$GITHUB_WORKSPACE" "$PROOF_ROOT/rebuilt" <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          source = Path(sys.argv[1]).resolve()
          rebuilt = Path(sys.argv[2]).resolve()
          tracked = subprocess.run(
              ["git", "-C", str(source), "ls-files", "-z", "--recurse-submodules"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout

          expected: set[str] = set()
          for raw in tracked.split(b"\0"):
              if not raw:
                  continue
              relative = PurePosixPath(raw.decode("utf-8", "surrogateescape"))
              original = source.joinpath(*relative.parts)
              if original.is_dir() and not original.is_symlink():
                  continue
              key = relative.as_posix()
              expected.add(key)
              restored = rebuilt.joinpath(*relative.parts)
              if original.is_symlink():
                  if not restored.is_symlink() or os.readlink(original) != os.readlink(restored):
                      raise SystemExit(f"symlink mismatch: {key}")
                  continue
              if not restored.is_file() or restored.is_symlink():
                  raise SystemExit(f"missing file: {key}")
              if hashlib.sha256(original.read_bytes()).digest() != hashlib.sha256(restored.read_bytes()).digest():
                  raise SystemExit(f"byte mismatch: {key}")
              if stat.S_IMODE(os.lstat(original).st_mode) != stat.S_IMODE(os.lstat(restored).st_mode):
                  raise SystemExit(f"mode mismatch: {key}")

          actual: set[str] = set()
          for directory, dirnames, filenames in os.walk(rebuilt, followlinks=False):
              base = Path(directory)
              for dirname in list(dirnames):
                  item = base / dirname
                  if item.is_symlink():
                      actual.add(item.relative_to(rebuilt).as_posix())
                      dirnames.remove(dirname)
              for filename in filenames:
                  actual.add((base / filename).relative_to(rebuilt).as_posix())

          if expected != actual:
              raise SystemExit(
                  f"tree mismatch missing={sorted(expected-actual)[:20]} extra={sorted(actual-expected)[:20]}"
              )
          print(f"EXACT_CODEBASE_RECOVERY_OK entries={len(expected)}")
          PY

      - name: Upload the single image artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREAM_CODEBASE_SPATIAL_ATLAS
          path: dream-field-output/DREAM_CODEBASE_SPATIAL_ATLAS.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
