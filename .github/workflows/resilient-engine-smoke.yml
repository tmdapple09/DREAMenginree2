name: Resilient Engine Smoke

on:
  pull_request:
  push:
    branches:
      - completedream
      - 'copilot/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resilient-engine-smoke-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  workflow-guardrails:
    name: Guardrails (no fake-green patterns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail on job-level continue-on-error true
        run: python .github/scripts/check_workflow_masking.py

      - name: Fail on forbidden allow failure remnants
        run: |
          needle="allow"
          needle+="-failure"
          if grep -RIn --include='*.yml' --include='*.yaml' "$needle" .github/workflows .github/actions; then
            echo "::error::Found forbidden allow failure usage."
            exit 1
          fi

  resilient-engine-hard-fail:
    name: Resilient engine hard-failure behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run resilient engine with intentional failure
        id: intentional_failure
        # continue-on-error is step-scoped here so we can assert the expected failure outcome below.
        continue-on-error: true
        uses: ./.github/actions/resilient-engine
        with:
          command: "echo intentional failure && exit 7"
          retry-attempts: "2"
          retry-backoff-seconds: "1"
          timeout-minutes: "1"

      - name: Assert resilient engine exits non-zero on real failure
        run: |
          if [ "${{ steps.intentional_failure.outcome }}" != "failure" ]; then
            echo "::error::Expected resilient-engine action to fail, but outcome was '${{ steps.intentional_failure.outcome }}'."
            exit 1
          fi
          echo "✅ resilient-engine correctly failed on an intentional error."

  typescript-turbopack-autofix:
    name: TypeScript/Turbopack scan, autofix, rebase, push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Registry Wire-Up
        run: node scripts/wire-orphans.mjs

      - name: Run ESLint autofix
        continue-on-error: true
        run: |
          mkdir -p build-memory/typecheck

          pnpm exec eslint . \
            --fix \
            --ext .js,.jsx,.ts,.tsx,.mjs,.cjs \
            > build-memory/typecheck/eslint-autofix.log 2>&1

          cat build-memory/typecheck/eslint-autofix.log || true

      - name: Run Prettier autofix
        continue-on-error: true
        run: |
          mkdir -p build-memory/typecheck

          pnpm exec prettier . --write \
            > build-memory/typecheck/prettier-autofix.log 2>&1

          cat build-memory/typecheck/prettier-autofix.log || true

      - name: Scan TypeScript errors
        continue-on-error: true
        run: |
          mkdir -p build-memory/typecheck

          pnpm exec tsc --noEmit --pretty false \
            > build-memory/typecheck/typescript-errors.log 2>&1

          cat build-memory/typecheck/typescript-errors.log || true

      - name: Scan Next/Turbopack build errors
        continue-on-error: true
        run: |
          mkdir -p build-memory/typecheck

          pnpm build \
            > build-memory/typecheck/turbopack-build-errors.log 2>&1

          cat build-memory/typecheck/turbopack-build-errors.log || true

      - name: Extract files with TypeScript, syntax, or build errors
        run: |
          mkdir -p build-memory/typecheck

          {
            grep -Eo '([A-Za-z0-9_./@{}()[\]-]+\.(ts|tsx|js|jsx|mjs|cjs))' build-memory/typecheck/typescript-errors.log || true
            grep -Eo '([A-Za-z0-9_./@{}()[\]-]+\.(ts|tsx|js|jsx|mjs|cjs))' build-memory/typecheck/turbopack-build-errors.log || true
            grep -Eo '([A-Za-z0-9_./@{}()[\]-]+\.(ts|tsx|js|jsx|mjs|cjs))' build-memory/typecheck/eslint-autofix.log || true
          } \
            | sed 's#^\./##' \
            | sed 's#^@/##' \
            | sort -u \
            > build-memory/typecheck/error-files.txt

          echo "Files reported by TypeScript/Turbopack/ESLint:"
          cat build-memory/typecheck/error-files.txt || true

      - name: Upload generated Engin folder
        uses: actions/upload-artifact@v4
        with:
          name: engin-generated-${{ github.ref_name }}
          path: |
            src/engin/generated/**
            build-memory/registry.json
            build-memory/os-architecture-map.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload TypeScript and build error report
        uses: actions/upload-artifact@v4
        with:
          name: typescript-build-errors-${{ github.ref_name }}
          path: |
            build-memory/typecheck/**
          retention-days: 14
          if-no-files-found: warn

      - name: Commit autofix and generated updates
        run: |
          git config user.name "DREAMengin-Bot"
          git config user.email "bot@dreamengin.com"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "chore: autofix TypeScript surface and refresh engine registry [skip ci]"
          else
            echo "No autofix changes to commit."
          fi

      - name: Rebase and push updates
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Final TypeScript check
        run: pnpm exec tsc --noEmit --pretty false

      - name: Final Next/Turbopack build check
        run: pnpm build
