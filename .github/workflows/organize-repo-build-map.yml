name: Organize Repo Into Web App Build Map

on:
  workflow_dispatch:
    inputs:
      organized_repo_artifact_name:
        description: "Download name for the organized repository ZIP"
        required: true
        default: "dreamengin-organized-repository"
      file_tree_artifact_name:
        description: "Download name for the organized file tree TXT"
        required: true
        default: "dreamengin-organized-file-tree"
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "14"

permissions:
  contents: read

jobs:
  organize-repository:
    name: Organize repository into 20 web app categories plus DREAMengin behavior
    runs-on: ubuntu-latest

