                  if any(x in lower for x in ["model", ".glb", ".gltf"]):
                      return "18_content_assets", "models", "model asset"
                  return "18_content_assets", "static_files", "static/public asset"

              basename = Path(lower).name
              if basename in {"package.json", "pnpm-lock.yaml", "package-lock.json", "yarn.lock", "bun.lockb"}:
                  return "15_dev_tooling", "package_manager", "package manager/dependency file"
              if basename.startswith("tsconfig") or basename in {"eslint.config.mjs", ".eslintrc", ".prettierrc", "tailwind.config.ts", "postcss.config.mjs"}:
                  return "15_dev_tooling", "typecheck_config", "tooling config"
              if basename in {"next.config.mjs", "next.config.js", "vite.config.ts"}:
                  return "15_dev_tooling", "local_setup", "build/tooling config"
              if basename.startswith(".env"):
                  return "15_dev_tooling", "env_examples", "environment example/config"
              if basename.startswith("docker") or basename in {"docker-compose.yml", "docker-compose.yaml"}:
                  return "15_dev_tooling", "local_setup", "local/deploy tooling"
              if "architecture" in lower:
                  return "20_documentation", "architecture_notes", "architecture document"
              if "readme" in lower:
                  return "20_documentation", "setup_docs", "README/setup document"

              return "06_build_application_behavior", "what_business_rules_run", "fallback: app behavior/business logic"

          def line_is_meaningful(line: str) -> bool:
              stripped = line.strip()
              if not stripped:
                  return False
              if stripped in {"{", "}", "};", ");", "};"}:
                  return False
              return True

          def keyword_bundle(category: str, subfolder: str) -> List[str]:
              raw = []
              raw.extend(subfolder.split("_"))
              raw.extend(category.split("_")[1:])
              raw.extend(KEYWORD_SYNONYMS.get(subfolder, []))
              if category == "11_security":
                  raw.extend(["auth", "permission", "security", "rls", "policy"])
              elif category == "12_performance":
                  raw.extend(["performance", "cache", "lazy", "memo", "webgpu", "fps"])
              elif category == "13_accessibility":
                  raw.extend(["aria", "label", "focus", "keyboard", "screen reader", "reduced motion"])
              elif category == "14_observability":
                  raw.extend(["log", "metrics", "telemetry", "health", "trace", "monitor"])
              elif category == "01_define_user_flow":
                  raw.extend(["router", "redirect", "login", "onboarding", "loading", "error", "empty", "success"])
              cleaned = []
              seen = set()
              for item in raw:
                  item = item.strip().lower()
                  if len(item) < 2 or item in {"build", "define", "wire"}:
                      continue
                  if item not in seen:
                      seen.add(item)
                      cleaned.append(item)
              return cleaned

          def find_line_refs(terms: List[str], scan_files: List[str], max_results: int = 12) -> List[Tuple[str, int, str]]:
              results: List[Tuple[str, int, str]] = []
              seen = set()
              lowered_terms = [t.lower() for t in terms if len(t.strip()) >= 2]

              scored = []
              for rel in scan_files:
                  lower_rel = rel.lower()
                  score = sum(8 for term in lowered_terms if term in lower_rel)
                  scored.append((score, rel))
              scored.sort(reverse=True)

              ordered_files = [rel for score, rel in scored if score > 0] + [rel for score, rel in scored if score == 0]

              for rel in ordered_files[:300]:
                  text = read_text_limited(rel)
                  if not text:
                      continue
                  for index, line in enumerate(text.splitlines(), start=1):
                      lower_line = line.lower()
                      if not line_is_meaningful(line):
                          continue
                      if any(term in lower_line for term in lowered_terms):
                          key = (rel, index)
                          if key in seen:
                              continue
                          seen.add(key)
                          snippet = line.strip()
                          if len(snippet) > 180:
                              snippet = snippet[:177] + "..."
                          results.append((rel, index, snippet))
                          if len(results) >= max_results:
                              return results
              return results

          def subfolder_has_real_files(folder: Path) -> bool:
              for path in folder.rglob("*"):
                  if path.is_file() and path.name != BEHAVIOR_HELPER_FILENAME:
                      return True
              return False

          def create_behavior_helper_md(category: str, subfolder: str, target_dir: Path, web_refs: List[Tuple[str, int, str]], dream_refs: List[Tuple[str, int, str]]) -> None:
              helper = target_dir / BEHAVIOR_HELPER_FILENAME
              lines = [
                  "# DO NOT SEND THIS FILE BACK",
                  "",
                  "This Markdown file is generated because this category/subfolder had no primary files.",
                  "",
                  "When sending a patched organized ZIP back for rebasing:",
                  "",
                  "- Delete this generated Markdown file.",
                  "- Do not send this file back.",
                  "- Do not include PNG files in the patched ZIP unless the PNG itself was intentionally edited.",
                  "- Only send files that should rebase into a real repo path.",
                  "",
                  "DREAMengin rule:",
                  "",
                  "Any user-facing visible object should be treated as Dream-owned behavior: hideable, removable, replaceable, movable, resizable, shareable, cloneable, attachable, fullscreenable, and customizable.",
                  "",
                  f"Category: `{category}`",
                  f"Subfolder: `{subfolder}`",
                  "",
                  "## Web-app behavior/code locations found elsewhere",
                  "",
              ]
              if web_refs:
                  for rel, line, snippet in web_refs:
                      lines.append(f"- `{rel}:{line}`")
                      lines.append(f"  - `{snippet}`")
              else:
                  lines.append("- No direct keyword line matches found.")
              lines.extend(["", "## DREAMengin behavior/code locations found elsewhere", ""])
              if dream_refs:
                  for rel, line, snippet in dream_refs:
                      lines.append(f"- `{rel}:{line}`")
                      lines.append(f"  - `{snippet}`")
              else:
                  lines.append("- No direct DREAMengin vocabulary line matches found.")
              lines.append("")
              helper.write_text("\n".join(lines), encoding="utf-8")

          def tree_lines(root: Path) -> List[str]:
              lines = [root.name + "/"]
              def walk(directory: Path, prefix: str = "") -> None:
                  entries = sorted(directory.iterdir(), key=lambda x: (x.is_file(), x.name.lower()))
                  for index, entry in enumerate(entries):
                      connector = "└── " if index == len(entries) - 1 else "├── "
                      lines.append(prefix + connector + entry.name + ("/" if entry.is_dir() else ""))
                      if entry.is_dir():
                          extension = "    " if index == len(entries) - 1 else "│   "
                          walk(entry, prefix + extension)
              walk(root)
              return lines

          def zip_with_empty_dirs(source_root: Path, zip_path: Path) -> None:
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
                  for path in sorted(source_root.rglob("*")):
                      arcname = path.relative_to(source_root.parent).as_posix()
                      if path.is_dir():
                          z.writestr(arcname.rstrip("/") + "/", "")
                      elif path.is_symlink():
                          z.writestr(arcname, os.readlink(path))
                      else:
                          z.write(path, arcname)

          if OUT_ROOT.exists():
              shutil.rmtree(OUT_ROOT)
          OUT_ROOT.mkdir(parents=True, exist_ok=True)
          ORGANIZED.mkdir(parents=True, exist_ok=True)

          for category, subfolders in CATEGORIES.items():
              for subfolder in subfolders:
                  (ORGANIZED / category / subfolder).mkdir(parents=True, exist_ok=True)

          files = git_files()
          scan_files = readable_git_files(files)

          manifest = []
          counts = Counter()
          area_counts = Counter()
          dream_behavior_counts = Counter()
          copied = set()
          cross_links_by_category = defaultdict(list)
          dream_behavior_files = defaultdict(list)

          for rel in files:
              src = REPO / rel
              if not src.exists():
                  continue

              category, subfolder, reason = classify(rel)
              area = dreamengin_area(rel)
              dream_behavior_name, dream_behavior_reason = dreamengin_behavior(rel)
              secondary = [track for track in secondary_tracks(rel) if track != category]

              dest = ORGANIZED / category / subfolder / safe_part(area) / rel
              dest.parent.mkdir(parents=True, exist_ok=True)

              if src.is_symlink():
                  target = os.readlink(src)
                  if dest.exists() or dest.is_symlink():
                      dest.unlink()
                  os.symlink(target, dest)
              else:
                  shutil.copy2(src, dest)

              copied.add(rel)
              counts[category] += 1
              area_counts[area] += 1
              dream_behavior_counts[dream_behavior_name] += 1
              dream_behavior_files[dream_behavior_name].append(rel)

              row = {
                  "source_path": rel,
                  "category": category,
                  "subfolder": subfolder,
                  "dreamengin_area": area,
                  "dreamengin_behavior": dream_behavior_name,
                  "dreamengin_behavior_reason": dream_behavior_reason,
                  "destination_path": str(dest.relative_to(ORGANIZED)).replace("\\", "/"),
                  "secondary_tracks": secondary,
                  "reason": reason,
              }
              manifest.append(row)

              if secondary:
                  cross_links_by_category[category].append(row)

          missing = sorted(set(files) - copied)
          if missing:
              raise SystemExit("Some tracked files were not copied:\n" + "\n".join(missing[:100]))

          behavior_map: Dict[str, List[Tuple[str, int, str]]] = {}
          dream_empty_refs: Dict[str, List[Tuple[str, int, str]]] = {}
          generated_helpers = []

          dream_terms_all = []
          for terms in DREAMENGIN_BEHAVIORS.values():
              dream_terms_all.extend(terms)
          dream_refs_global = find_line_refs(dream_terms_all, scan_files, max_results=24)

          for category, subfolders in CATEGORIES.items():
              for subfolder in subfolders:
                  folder = ORGANIZED / category / subfolder
                  if subfolder_has_real_files(folder):
                      continue

                  web_refs = find_line_refs(keyword_bundle(category, subfolder), scan_files, max_results=12)
                  dream_refs = dream_refs_global[:12]
                  create_behavior_helper_md(category, subfolder, folder, web_refs, dream_refs)

                  key = f"{category}/{subfolder}"
                  behavior_map[key] = web_refs
                  dream_empty_refs[key] = dream_refs
                  generated_helpers.append(str((folder / BEHAVIOR_HELPER_FILENAME).relative_to(ORGANIZED)).replace("\\", "/"))

          TREE_FILE.write_text("", encoding="utf-8")

          tree_output = []
          tree_output.append("DREAMENGIN ORGANIZED REPOSITORY FILE TREE")
          tree_output.append("")
          tree_output.append("This file is a separate download from the organized repository ZIP.")
          tree_output.append("The organized repository ZIP contains organized-repository/ with the 20 category folders.")
          tree_output.append("")
          tree_output.append("Generated helper Markdown files named __DO_NOT_RETURN_BEHAVIOR_LOCATIONS.md are only pointers for empty folders.")
          tree_output.append("Do not send those helper Markdown files back when returning a patched ZIP.")
          tree_output.append("Do not include PNG files in a patched ZIP unless the PNG itself was intentionally edited.")
          tree_output.append("")
          tree_output.append("DREAMengin law tracked by this workflow:")
          tree_output.append("Any user-facing visible object should be treated as Dream-owned behavior: hideable, removable, replaceable, movable, resizable, shareable, cloneable, attachable, fullscreenable, and customizable.")
          tree_output.append("")
          tree_output.append(f"Total tracked files copied: {len(copied)}")
          tree_output.append(f"Generated empty-folder behavior helper files: {len(generated_helpers)}")
          tree_output.append("")
          tree_output.append("CATEGORY COUNTS")
          tree_output.append("")
          for category in CATEGORIES:
              tree_output.append(f"- {category}: {counts[category]} files")

          tree_output.append("")
          tree_output.append("DREAMENGIN AREA COUNTS")
          tree_output.append("")
          for area, count in sorted(area_counts.items()):
              tree_output.append(f"- {area}: {count} files")

          tree_output.append("")
          tree_output.append("DREAMENGIN BEHAVIOR COUNTS")
          tree_output.append("")
          for behavior in DREAMENGIN_BEHAVIORS:
              tree_output.append(f"- {behavior}: {dream_behavior_counts[behavior]} files")
          unclassified = dream_behavior_counts.get("unclassified_dreamengin_behavior", 0)
          if unclassified:
              tree_output.append(f"- unclassified_dreamengin_behavior: {unclassified} files")

          tree_output.append("")
          tree_output.append("DREAMENGIN BEHAVIOR MAP")
          tree_output.append("")
          for behavior in DREAMENGIN_BEHAVIORS:
              tree_output.append(behavior)
              for rel in sorted(dream_behavior_files.get(behavior, []))[:200]:
                  tree_output.append(f"  - {rel}")
              if len(dream_behavior_files.get(behavior, [])) > 200:
                  tree_output.append(f"  - ... {len(dream_behavior_files[behavior]) - 200} more files")
              tree_output.append("")

          tree_output.append("")
          tree_output.append("EMPTY FOLDER BEHAVIOR POINTERS")
          tree_output.append("")
          tree_output.append("Format: category/subfolder -> file:line")
          tree_output.append("")
          if behavior_map:
              for key in sorted(behavior_map):
                  tree_output.append(key)
                  locations = behavior_map[key]
                  if not locations:
                      tree_output.append("  - no direct web-app keyword line match found")
                  else:
                      for rel, line, _snippet in locations:
                          tree_output.append(f"  - {rel}:{line}")
                  tree_output.append("")
          else:
              tree_output.append("No empty folders required behavior helper files.")
              tree_output.append("")

          tree_output.append("EMPTY FOLDER DREAMENGIN POINTERS")
          tree_output.append("")
          tree_output.append("Format: category/subfolder -> file:line")
          tree_output.append("")
          if dream_empty_refs:
              for key in sorted(dream_empty_refs):
                  tree_output.append(key)
                  refs = dream_empty_refs[key]
                  if not refs:
                      tree_output.append("  - no direct DREAMengin vocabulary line match found")
                  else:
                      for rel, line, _snippet in refs:
                          tree_output.append(f"  - {rel}:{line}")
                  tree_output.append("")

          tree_output.append("ORGANIZED FILE TREE")
          tree_output.append("")
          tree_output.extend(tree_lines(ORGANIZED))

          tree_output.append("")
          tree_output.append("CROSS-LINKED FILES")
          tree_output.append("")
          tree_output.append("Files are copied once into their primary category. This section lists files that also tie to other support tracks.")
          tree_output.append("")
          any_cross_links = False
          for category in CATEGORIES:
              rows = cross_links_by_category.get(category, [])
              if not rows:
                  continue
              any_cross_links = True
              tree_output.append(category)
              for row in rows:
                  tree_output.append(f"  - {row['source_path']}")
                  tree_output.append(f"    primary: {row['category']}/{row['subfolder']}")
                  tree_output.append(f"    dreamengin_area: {row['dreamengin_area']}")
                  tree_output.append(f"    dreamengin_behavior: {row['dreamengin_behavior']}")
                  tree_output.append(f"    also_ties_to: {', '.join(row['secondary_tracks'])}")
              tree_output.append("")
          if not any_cross_links:
              tree_output.append("No cross-linked files found.")

          TREE_FILE.write_text("\n".join(tree_output) + "\n", encoding="utf-8")

          MANIFEST_JSON.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          with MANIFEST_CSV.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "source_path",
                      "category",
                      "subfolder",
                      "dreamengin_area",
                      "dreamengin_behavior",
                      "dreamengin_behavior_reason",
                      "destination_path",
                      "secondary_tracks",
                      "reason",
                  ],
              )
              writer.writeheader()
              for row in manifest:
                  csv_row = dict(row)
                  csv_row["secondary_tracks"] = ";".join(row["secondary_tracks"])
                  writer.writerow(csv_row)

          zip_with_empty_dirs(ORGANIZED, ZIP_PATH)

          top = sorted([p.name for p in ORGANIZED.iterdir() if p.is_dir()])
          if len(top) != 20:
              raise SystemExit(f"Expected 20 top-level folders in organized repository, found {len(top)}")

          print("")
          print("ORGANIZED REPOSITORY CREATED")
          print(f"Tracked files copied: {len(copied)}")
          print(f"Behavior helper files generated for empty folders: {len(generated_helpers)}")
          print(f"Repository ZIP: {ZIP_PATH.relative_to(REPO)}")
          print(f"Separate file tree: {TREE_FILE.relative_to(REPO)}")
          print("")
          print("20 TOP-LEVEL FOLDERS")
          for item in top:
              print(item)
          print("")
          print("CATEGORY COUNTS")
          for category in CATEGORIES:
              print(f"{category}: {counts[category]}")
          print("")
          print("DREAMENGIN BEHAVIOR COUNTS")
          for behavior in DREAMENGIN_BEHAVIORS:
              print(f"{behavior}: {dream_behavior_counts[behavior]}")
          PY

      - name: Print organized file tree in workflow log
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Organized file tree"
          cat _organized_repo_artifact/organized_file_tree.txt
          echo "::endgroup::"

      - name: Upload organized repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.organized_repo_artifact_name }}
          path: _organized_repo_artifact/dreamengin-organized-repository.zip
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Upload organized file tree TXT
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.file_tree_artifact_name }}
          path: _organized_repo_artifact/organized_file_tree.txt
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
