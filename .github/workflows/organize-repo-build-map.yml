          TEXT_EXTENSIONS = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".json", ".md", ".mdx",
              ".yml", ".yaml", ".css", ".scss", ".html", ".sql", ".sh", ".py",
              ".toml", ".env", ".example", ".txt"
          }

          BINARY_EXTENSIONS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".mp3", ".wav",
              ".mp4", ".mov", ".glb", ".gltf", ".wasm", ".zip", ".pdf",
              ".ttf", ".otf", ".woff", ".woff2"
          }

          SKIP_SCAN_DIRS = {
              ".git", "node_modules", ".next", "dist", "build", ".turbo", ".cache",
              "_organized_repo_artifact", "_rebase_organized_zip_work", "__MACOSX"
          }

          def parse_category_spec(text: str) -> Dict[str, List[str]]:
              result: Dict[str, List[str]] = {}
              current = ""
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.endswith(":"):
                      current = line[:-1]
                      result[current] = []
                      continue
                  if line.startswith("- "):
                      if not current:
                          raise SystemExit(f"Subfolder without category: {line}")
                      result[current].append(line[2:].strip())
              return result

          CATEGORIES = parse_category_spec(CATEGORY_SPEC)

          def safe_part(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"[^a-z0-9._-]+", "_", value)
              value = re.sub(r"_+", "_", value).strip("_")
              return value or "uncategorized"

          def path_contains(path: str, needles: List[str]) -> bool:
              lower = path.lower()
              return any(needle.lower() in lower for needle in needles)

          def git_files() -> List[str]:
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=REPO)
              return [p for p in raw.decode("utf-8", errors="replace").split("\0") if p]

          def is_probably_text_file(path: Path) -> bool:
              suffix = path.suffix.lower()
              if path.name == BEHAVIOR_HELPER_FILENAME:
                  return False
              if suffix in BINARY_EXTENSIONS:
                  return False
              if suffix in TEXT_EXTENSIONS:
                  return True
              if path.name in {"Dockerfile", "LICENSE", "Makefile", ".gitignore", ".gitleaks.toml", ".cursorrules"}:
                  return True
              return False

          def readable_git_files(files: List[str]) -> List[str]:
              readable = []
              for rel in files:
                  p = REPO / rel
                  if not p.exists() or not p.is_file():
                      continue
                  if any(part in SKIP_SCAN_DIRS for part in p.relative_to(REPO).parts):
                      continue
                  if is_probably_text_file(p):
                      readable.append(rel)
              return readable

          def read_text_limited(rel: str, limit: int = 500_000) -> str:
              path = REPO / rel
              try:
                  data = path.read_bytes()
              except Exception:
                  return ""
              if len(data) > limit:
                  data = data[:limit]
              return data.decode("utf-8", errors="replace")

          def dreamengin_area(path: str) -> str:
              p = path.lower()
              explicit = [
                  ("dreamdmbar", ["dreamdmbar", "dreamdm"]),
                  ("dreamr", ["dreamr", "/feed", "feed/", "profile", "messages"]),
                  ("gameengin", ["gameengin", "games", "cartridge", "madmaxi"]),
                  ("contentengin", ["contentengin", "content"]),
                  ("codeengin", ["codeengin", "code"]),
                  ("starmakerengin", ["starmaker", "music"]),
                  ("labengin", ["labengin", "/lab", "lab/"]),
                  ("brandingengin", ["brandingengin", "brand"]),
                  ("forgeengin", ["forgeengin", "forge"]),
                  ("runtime", ["engine/runtime", "dualruntime", "runtime"]),
                  ("dreams", ["dreams", "dreamspace", "homedream", "daydream"]),
                  ("supabase", ["supabase"]),
                  ("agents_dr_eams", ["agents", "dr-eams", "idari", "boogie", "humanai"]),
                  ("ui_shell", ["components", "styles", "ui"]),
                  ("docs", ["docs", "readme", "architecture"]),
                  ("public_assets", ["public", "fonts", "images", "icons", "models", "audio"]),
              ]
              for area, needles in explicit:
                  if path_contains(p, needles):
                      return area
              return safe_part(p.split("/", 1)[0])

          def dreamengin_behavior(rel: str) -> Tuple[str, str]:
              lower_path = rel.lower()
              text = read_text_limited(rel).lower()
              haystack = lower_path + "\n" + text

              best_name = "unclassified_dreamengin_behavior"
              best_score = 0
              best_hits: List[str] = []

              for behavior, terms in DREAMENGIN_BEHAVIORS.items():
                  score = 0
                  hits = []
                  for term in terms:
                      term_l = term.lower()
                      if term_l in lower_path:
                          score += 12
                          hits.append(term)
                      elif term_l in haystack:
                          score += 3
                          hits.append(term)
                  if score > best_score:
                      best_score = score
                      best_name = behavior
                      best_hits = hits[:8]

              if best_score <= 0:
                  area = dreamengin_area(rel)
                  area_fallbacks = {
                      "dreamdmbar": "dreamdmbar",
                      "dreamr": "dreamr",
                      "gameengin": "gameengin_behavior",
                      "contentengin": "contentengin_behavior",
                      "codeengin": "codeengin_behavior",
                      "starmakerengin": "starmaker_music_behavior",
                      "labengin": "lab_sim_behavior",
                      "brandingengin": "forge_brand_agent_behavior",
                      "forgeengin": "forge_brand_agent_behavior",
                      "runtime": "runtime",
                      "dreams": "dreams_lifecycle",
                      "agents_dr_eams": "admin_agent_dr_eams",
                      "public_assets": "render_webgpu_visual_runtime",
                  }
                  best_name = area_fallbacks.get(area, "unclassified_dreamengin_behavior")
                  return best_name, f"fallback from DREAMengin area `{area}`"

              return best_name, "matched terms: " + ", ".join(best_hits)

