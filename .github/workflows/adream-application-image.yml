              ]
              write_text(DECODER_DIR / "DECODE_REPORT.md", "\n".join(lines) + "\n")
              return result


          def analyze_images(
              manifest: dict[str, Any],
              layers: dict[str, Any],
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
              unresolved: list[dict[str, str]],
              excluded_dependencies: list[dict[str, str]],
              external_imports: list[dict[str, str]],
              decode_result: dict[str, Any],
          ) -> dict[str, Any]:
              group_count = manifest["source"]["groupCount"]
              rows = manifest["source"]["pascalRows"]
              state_values: list[int] = []
              state_counts = Counter()
              symbol_counts = Counter()
              family_counts = Counter()
              case_counts = Counter()
              transitions = Counter()
              run_lengths: list[int] = []
              previous: int | None = None
              current_run = 0

              pixels = layers["exactImage"].load()
              for row in range(rows):
                  left = (rows - (row + 1)) // 2
                  for col in range(row + 1):
                      if len(state_values) >= group_count:
                          break
                      state = pixels[left + col, row]
                      state_values.append(state)
                      key = f"{state:03b}"
                      symbol = PAIR_SYMBOL_BY_BITS[key]
                      state_counts[key] += 1
                      symbol_counts[symbol] += 1
                      family_counts[PAIR_FAMILY_BY_BITS[key]] += 1
                      case_counts[PAIR_CASE_BY_BITS[key]] += 1

                      if previous is None:
                          previous = state
                          current_run = 1
                      elif state == previous:
                          current_run += 1
                      else:
                          previous_symbol = PAIR_SYMBOL_BY_BITS[f"{previous:03b}"]
                          transitions[f"{previous_symbol}->{symbol}"] += 1
                          run_lengths.append(current_run)
                          previous = state
                          current_run = 1
              if current_run:
                  run_lengths.append(current_run)

              entropy = -sum(
                  (count / group_count) * math.log2(count / group_count)
                  for count in state_counts.values()
                  if count
              )

              global_distribution = [state_counts[f"{state:03b}"] / group_count for state in range(8)]
              row_total_variation: list[float] = []
              state_index = 0
              for row in range(rows):
                  row_length = min(row + 1, group_count - state_index)
                  if row_length <= 0:
                      break
                  row_counts = Counter(state_values[state_index : state_index + row_length])
                  distribution = [row_counts[state] / row_length for state in range(8)]
                  tv = 0.5 * sum(abs(distribution[state] - global_distribution[state]) for state in range(8))
                  row_total_variation.append(tv)
                  state_index += row_length

              file_boundaries = []
              cross_file_cells = 0
              files = manifest["source"]["files"]
              for left_file, right_file in zip(files, files[1:]):
                  boundary_bit = right_file["bitOffset"]
                  crosses_cell = boundary_bit % 3 != 0
                  if crosses_cell:
                      cross_file_cells += 1
                  file_boundaries.append(
                      {
                          "before": left_file["path"],
                          "after": right_file["path"],
                          "boundaryBit": boundary_bit,
                          "boundaryCell": boundary_bit // 3,
                          "crossesThreeBitCell": crosses_cell,
                      }
                  )

              result = {
                  "format": FORMAT_NAME,
                  "imageDimensions": {"width": rows, "height": rows},
                  "sourceBits": manifest["source"]["sourceBits"],
                  "pascalCells": group_count,
                  "paddingBitsInFinalCell": manifest["source"]["paddingBitsInFinalCell"],
                  "payloadUtilization": group_count / (rows * rows),
                  "stateCounts": {key: state_counts[key] for key in STATE_KEYS},
                  "symbolCounts": {
                      symbol: symbol_counts[symbol]
                      for symbol in PAIR_SYMBOL_ORDER
                  },
                  "pairFamilyCounts": {
                      family: family_counts[family]
                      for family in "ABCD"
                  },
                  "pairCaseCounts": {
                      case: case_counts[case]
                      for case in ("uppercase", "lowercase")
                  },
                  "entropyBitsPerCell": entropy,
                  "meanRunLength": statistics.fmean(run_lengths) if run_lengths else 0.0,
                  "medianRunLength": statistics.median(run_lengths) if run_lengths else 0.0,
                  "maxRunLength": max(run_lengths) if run_lengths else 0,
                  "topSymbolTransitions": transitions.most_common(64),
                  "rowDistributionDeviation": {
                      "meanTotalVariation": statistics.fmean(row_total_variation) if row_total_variation else 0.0,
                      "medianTotalVariation": statistics.median(row_total_variation) if row_total_variation else 0.0,
                      "maximumTotalVariation": max(row_total_variation) if row_total_variation else 0.0,
                  },
                  "fileRegions": [
                      {
                          "path": item["path"],
                          "startCell": item["startCell"],
                          "endCellExclusive": item["endCellExclusive"],
                          "byteLength": item["byteLength"],
                          "runtimeExportCount": item["runtimeExportCount"],
                          "fanIn": item["fanIn"],
                          "fanOut": item["fanOut"],
                      }
                      for item in files
                  ],
                  "fileBoundaryCount": max(0, len(files) - 1),
                  "boundariesCrossingThreeBitCells": cross_file_cells,
                  "fileBoundaries": file_boundaries,
                  "dependency": {
                      "runtimeFiles": len(records),
                      "internalEdges": sum(len(targets) for targets in graph.values()),
                      "dependencyIslands": len(manifest["source"]["islands"]),
                      "unresolvedInternalImports": len(unresolved),
                      "intentionallyExcludedDependencies": len(excluded_dependencies),
                      "externalImports": len(external_imports),
                  },
                  "decodeVerification": {
                      "allExact": decode_result["allExact"],
                      "exactFileCount": decode_result["exactFileCount"],
                      "fileCount": decode_result["fileCount"],
                      "symbolMismatches": decode_result["layerCrossCheck"]["symbolMismatches"],
                  },
              }
              write_json(ANALYSIS_DIR / "IMAGE_ANALYSIS.json", result)

              lines = [
                  "# DREAM Image Analysis",
                  "",
                  f"- Exact image: **{rows} x {rows}** logical cells",
                  f"- Source bits: **{manifest['source']['sourceBits']}**",
                  f"- Three-bit cells: **{group_count}**",
                  f"- Payload utilization: **{result['payloadUtilization']:.6%}**",
                  f"- Entropy: **{entropy:.6f} bits per cell**",
                  f"- Mean run length: **{result['meanRunLength']:.6f}**",
                  f"- Maximum run length: **{result['maxRunLength']}**",
                  f"- Mean row-distribution deviation: **{result['rowDistributionDeviation']['meanTotalVariation']:.6f}**",
                  f"- File boundaries crossing a 3-bit cell: **{cross_file_cells}**",
                  f"- Decode exact: **{decode_result['allExact']}**",
                  f"- Exact-symbol mismatches: **{decode_result['layerCrossCheck']['symbolMismatches']}**",
                  "",
                  "## Eight exact symbols",
                  "",
              ]
              lines.extend(
                  f"- `{symbol}` = `{BITS_BY_PAIR_SYMBOL[symbol]}`: {symbol_counts[symbol]}"
                  for symbol in PAIR_SYMBOL_ORDER
              )
              lines.extend(["", "## Derived pair families", ""])
              lines.extend(f"- `{family}`: {family_counts[family]}" for family in "ABCD")
              lines.extend(["", "## Derived case membership", ""])
              lines.extend(
                  f"- `{case}`: {case_counts[case]}"
                  for case in ("uppercase", "lowercase")
              )
              lines.extend(["", "## Most common adjacent symbol transitions", ""])
              lines.extend(f"- `{transition}`: {count}" for transition, count in transitions.most_common(32))
              lines.extend(
                  [
                      "",
                      "## Interpretation boundaries",
                      "",
                      "The exact-state, exact-symbol, and saturation layers are generated from the same",
                      "continuous source stream. Pair family and case are derived analysis metadata only.",
                      "The repository-native shape is generated from the dependency graph. Visible bands can",
                      "reflect ordered source syntax and file clustering, while centered Pascal row wrapping",
                      "and the 8-bit-to-3-bit phase cadence are renderer effects. Decoder verification proves",
                      "byte fidelity; it does not by itself prove that a visual pattern is a hidden law.",
                  ]
              )
              write_text(ANALYSIS_DIR / "IMAGE_ANALYSIS.md", "\n".join(lines) + "\n")

              with (ANALYSIS_DIR / "FILE_REGIONS.csv").open("w", encoding="utf-8", newline="") as handle:
                  fieldnames = [
                      "path",
                      "startCell",
                      "endCellExclusive",
                      "byteLength",
                      "runtimeExportCount",
                      "fanIn",
                      "fanOut",
                  ]
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(result["fileRegions"])

              return result


          def write_csv(path: Path, fieldnames: list[str], rows: list[dict[str, Any]]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  for row in rows:
                      writer.writerow({key: row.get(key, "") for key in fieldnames})


          def code_health_analysis(
              repo_root: Path,
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
              root: str,
              unresolved: list[dict[str, str]],
              excluded_rows: list[dict[str, str]],
              excluded_dependencies: list[dict[str, str]],
          ) -> dict[str, Any]:
              incoming = Counter(target for targets in graph.values() for target in targets)
              cycles = strongly_connected_components(graph)
              metrics: list[dict[str, Any]] = []
              findings: list[dict[str, Any]] = []
              export_owners: dict[str, list[str]] = defaultdict(list)

              suspicious_patterns = {
                  "eval": re.compile(r"\beval\s*\("),
                  "new Function": re.compile(r"\bnew\s+Function\s*\("),
                  "dangerouslySetInnerHTML": re.compile(r"\bdangerouslySetInnerHTML\b"),
                  "ts-ignore": re.compile(r"@ts-ignore\b"),
                  "ts-nocheck": re.compile(r"@ts-nocheck\b"),
                  "TODO/FIXME/HACK": re.compile(r"\b(?:TODO|FIXME|HACK|XXX)\b", re.IGNORECASE),
                  "console.log": re.compile(r"\bconsole\.log\s*\("),
                  "localhost": re.compile(r"(?:https?://)?localhost(?::\d+)?", re.IGNORECASE),
                  "empty catch": re.compile(r"catch\s*(?:\([^)]*\))?\s*\{\s*\}", re.DOTALL),
              }

              for relative_path, record in records.items():
                  text = (repo_root / relative_path).read_text(encoding="utf-8", errors="replace")
                  clean = strip_comments(text)
                  line_count = len(text.splitlines())
                  function_like_count = len(
                      re.findall(r"\b(?:async\s+)?function\b|=>|\bclass\b", clean)
                  )
                  branch_count = len(
                      re.findall(r"\b(?:if|for|while|case|catch|switch)\b|\?\?|&&|\|\|", clean)
                  )
                  metrics.append(
                      {
                          "path": relative_path,
                          "bytes": record["bytes"],
                          "lineCount": line_count,
                          "functionLikeCount": function_like_count,
                          "branchCount": branch_count,
                          "complexityScore": 1 + branch_count,
                          "runtimeExportCount": record["runtimeExportCount"],
                          "fanIn": incoming[relative_path],
                          "fanOut": len(graph[relative_path]),
                          "couplingScore": incoming[relative_path] + len(graph[relative_path]),
                      }
                  )

                  for export_name in record["runtimeExports"]:
                      export_owners[export_name].append(relative_path)

                  for label, pattern in suspicious_patterns.items():
                      count = len(pattern.findall(text))
                      if count:
                          findings.append({"path": relative_path, "finding": label, "count": count})

              route_pattern = re.compile(
                  r"^(?:app|pages)/(?:.*/)?(?:page|layout|route|loading|error|not-found|template|default)\."
                  r"(?:ts|tsx|js|jsx|mjs|cjs)$"
              )
              dead_export_candidates = [
                  {
                      "path": path,
                      "runtimeExportCount": record["runtimeExportCount"],
                      "runtimeExports": record["runtimeExports"],
                  }
                  for path, record in records.items()
                  if record["runtimeExportCount"]
                  and incoming[path] == 0
                  and path != root
                  and not route_pattern.match(path)
              ]
              duplicate_exports = [
                  {"export": name, "fileCount": len(set(paths)), "files": sorted(set(paths))}
                  for name, paths in export_owners.items()
                  if name not in {"default", "module.exports"} and len(set(paths)) > 1
              ]
              orphan_files = sorted(
                  path for path in records if not graph[path] and incoming[path] == 0
              )

              high_complexity = sorted(
                  metrics,
                  key=lambda item: (item["complexityScore"], item["lineCount"]),
                  reverse=True,
              )[:250]
              high_coupling = sorted(
                  metrics,
                  key=lambda item: (item["couplingScore"], item["fanIn"]),
                  reverse=True,
              )[:250]

              report = {
                  "runtimeFiles": len(records),
                  "internalEdges": sum(len(targets) for targets in graph.values()),
                  "excludedFiles": len(excluded_rows),
                  "unresolvedInternalImports": unresolved,
                  "intentionallyExcludedDependencies": excluded_dependencies,
                  "circularDependencyGroups": cycles,
                  "orphanRuntimeFiles": orphan_files,
                  "deadExportCandidates": sorted(
                      dead_export_candidates,
                      key=lambda item: (item["runtimeExportCount"], item["path"]),
                      reverse=True,
                  ),
                  "duplicateRuntimeExportNames": sorted(
                      duplicate_exports,
                      key=lambda item: (item["fileCount"], item["export"]),
                      reverse=True,
                  ),
                  "highComplexityFiles": high_complexity,
                  "highCouplingFiles": high_coupling,
                  "heuristicFindings": findings,
                  "limitations": [
                      "Static import and export parsing is heuristic and does not replace the TypeScript compiler.",
                      "Dynamic computed imports and repository-specific aliases may require compiler-aware resolution.",
                      "Dead-export and complexity findings are review candidates, not proof of defects.",
                  ],
              }
              write_json(HEALTH_DIR / "CODE_HEALTH.json", report)
              write_csv(
                  HEALTH_DIR / "UNRESOLVED_IMPORTS.csv",
                  ["source", "specifier", "kind"],
                  unresolved,
              )
              write_csv(
                  HEALTH_DIR / "EXCLUDED_FILES.csv",
                  ["path", "reason"],
                  excluded_rows,
              )
              write_csv(
                  HEALTH_DIR / "EXCLUDED_DEPENDENCIES.csv",
                  ["source", "specifier", "target", "reason"],
                  excluded_dependencies,
              )
              write_csv(
                  HEALTH_DIR / "FILE_METRICS.csv",
                  list(metrics[0].keys()) if metrics else ["path"],
                  metrics,
              )

              lines = [
                  "# DREAM Code Health Report",
                  "",
                  f"- Runtime files: **{len(records)}**",
                  f"- Internal dependency edges: **{sum(len(targets) for targets in graph.values())}**",
                  f"- Unresolved internal imports: **{len(unresolved)}**",
                  f"- Circular dependency groups: **{len(cycles)}**",
                  f"- Orphan runtime files: **{len(orphan_files)}**",
                  f"- Dead-export candidates: **{len(dead_export_candidates)}**",
                  f"- Duplicate runtime export names: **{len(duplicate_exports)}**",
                  f"- Heuristic findings: **{len(findings)}**",
                  "",
                  "## Unresolved internal imports",
                  "",
              ]
              lines.extend(
                  [f"- `{item['source']}` -> `{item['specifier']}` ({item['kind']})" for item in unresolved]
                  or ["None found."]
              )
              lines.extend(["", "## Circular dependency groups", ""])
              if cycles:
                  for index, component in enumerate(cycles, start=1):
                      lines.append(f"### Group {index}")
                      lines.extend(f"- `{path}`" for path in component)
                      lines.append("")
              else:
                  lines.append("None found.")
              lines.extend(["", "## Highest complexity", ""])
              lines.extend(
                  f"- `{item['path']}`: score {item['complexityScore']}, {item['lineCount']} lines"
                  for item in high_complexity[:50]
              )
              lines.extend(["", "## Highest coupling", ""])
              lines.extend(
                  f"- `{item['path']}`: fan-in {item['fanIn']}, fan-out {item['fanOut']}"
                  for item in high_coupling[:50]
              )
              lines.extend(["", "## Dead-export candidates", ""])
              lines.extend(
                  f"- `{item['path']}`: {item['runtimeExportCount']} runtime export(s), no internal importer"
                  for item in report["deadExportCandidates"][:100]
              )
              lines.extend(["", "## Heuristic review targets", ""])
              lines.extend(
                  f"- `{item['path']}`: {item['finding']} ({item['count']})"
                  for item in findings[:500]
              )
              write_text(HEALTH_DIR / "CODE_HEALTH_REPORT.md", "\n".join(lines) + "\n")
              return report


          def route_from_app_path(repo_root: Path, path: Path) -> str:
              relative = path.relative_to(repo_root / "app")
              parts: list[str] = []
              for part in relative.parts[:-1]:
                  if (part.startswith("(") and part.endswith(")")) or part.startswith("@"):
                      continue
                  parts.append(part)
              route = "/" + "/".join(parts)
              return route or "/"


          def route_from_pages_path(repo_root: Path, path: Path) -> str:
              relative = path.relative_to(repo_root / "pages")
              parts = list(relative.parts)
              filename = parts.pop()
              stem = Path(filename).stem
              if stem != "index":
                  parts.append(stem)
              return "/" + "/".join(parts)


          def build_ui_map(
              repo_root: Path,
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
          ) -> dict[str, Any]:
              routes: list[dict[str, Any]] = []

              app_root = repo_root / "app"
              if app_root.exists():
                  for path in app_root.rglob("*"):
                      if not path.is_file() or path.suffix.lower() not in CODE_EXTENSIONS:
                          continue
                      if path.stem.lower() not in ROUTE_STEMS:
                          continue
                      relative_path = path.relative_to(repo_root).as_posix()
                      routes.append(
                          {
                              "router": "app",
                              "route": route_from_app_path(repo_root, path),
                              "kind": path.stem.lower(),
                              "file": relative_path,
                          }
                      )

              pages_root = repo_root / "pages"
              if pages_root.exists():
                  for path in pages_root.rglob("*"):
                      if not path.is_file() or path.suffix.lower() not in CODE_EXTENSIONS:
                          continue
                      if path.name.startswith("_"):
                          kind = "pages-special"
                      elif "api" in path.relative_to(pages_root).parts:
                          kind = "api-route"
                      else:
                          kind = "page"
                      relative_path = path.relative_to(repo_root).as_posix()
                      routes.append(
                          {
                              "router": "pages",
                              "route": route_from_pages_path(repo_root, path),
                              "kind": kind,
                              "file": relative_path,
                          }
                      )

              routes.sort(key=lambda item: (item["route"], item["kind"], item["file"]))
              all_nodes: set[str] = set()
              all_edges: set[tuple[str, str]] = set()

              for route in routes:
                  source = route["file"]
                  route["includedInRuntimeAtlas"] = source in records
                  route["directDependencies"] = sorted(graph.get(source, set()))
                  reachable: set[str] = set()
                  if source in graph:
                      queue = deque([source])
                      seen = {source}
                      all_nodes.add(source)
                      while queue:
                          current = queue.popleft()
                          for target in graph[current]:
                              all_edges.add((current, target))
                              all_nodes.add(target)
                              reachable.add(target)
                              if target not in seen:
                                  seen.add(target)
                                  queue.append(target)
                  route["reachableDependencyCount"] = len(reachable)
                  route["reachableDependencies"] = sorted(reachable)

              surface_counts = Counter()
              for node in all_nodes:
                  root_name = node.split("/", 1)[0]
                  surface_counts[root_name] += 1

              result = {
                  "routeCount": len(routes),
                  "routes": routes,
                  "synapseNodeCount": len(all_nodes),
                  "synapseEdgeCount": len(all_edges),
                  "runtimeSurfaceCounts": dict(surface_counts.most_common()),
                  "synapseNodes": sorted(all_nodes),
                  "synapseEdges": [list(edge) for edge in sorted(all_edges)],
              }
              write_json(UI_DIR / "UI_ROUTE_MAP.json", result)

              lines = [
                  "# DREAM UI and Runtime Synapse",
                  "",
                  f"- Route files: **{len(routes)}**",
                  f"- Runtime nodes reachable from routes: **{len(all_nodes)}**",
                  f"- Runtime edges reachable from routes: **{len(all_edges)}**",
                  "",
                  "## Runtime surfaces",
                  "",
              ]
              lines.extend(f"- `{name}`: {count} node(s)" for name, count in surface_counts.most_common())
              lines.extend(["", "## Routes", ""])
              lines.extend(
                  f"- `{item['route']}` [{item['router']}:{item['kind']}] -> `{item['file']}`; "
                  f"direct {len(item['directDependencies'])}, reachable {item['reachableDependencyCount']}"
                  for item in routes
              )
              write_text(UI_DIR / "UI_ROUTE_MAP.md", "\n".join(lines) + "\n")

              dot_lines = ["digraph DREAM_UI {", "  rankdir=LR;"]
              route_files = {item["file"] for item in routes}
              for node in sorted(all_nodes):
                  shape = "box" if node in route_files else "ellipse"
                  dot_lines.append(f"  {json.dumps(node)} [shape={shape}];")
              for source, target in sorted(all_edges):
                  dot_lines.append(f"  {json.dumps(source)} -> {json.dumps(target)};")
              dot_lines.append("}")
              write_text(UI_DIR / "UI_SYNAPSE.dot", "\n".join(dot_lines) + "\n")

              render_ui_synapse(routes, all_nodes, all_edges)
              return result


          def render_ui_synapse(
              routes: list[dict[str, Any]],
              all_nodes: set[str],
              all_edges: set[tuple[str, str]],
          ) -> None:
              shown_routes = routes[:160]
              route_files = {item["file"] for item in shown_routes}
              components = [node for node in sorted(all_nodes) if node not in route_files][:700]
              width = 3000
              route_spacing = 68
              component_spacing = 48
              height = max(1800, 160 + max(len(shown_routes) * route_spacing, math.ceil(len(components) / 5) * component_spacing))
              height = min(height, 14000)
              image = Image.new("RGB", (width, height), (247, 249, 253))
              draw = ImageDraw.Draw(image)
              title_font = load_font(32, True)
              route_font = load_font(15, True)
              node_font = load_font(12)
              draw.text((45, 30), "DREAM UI and Runtime Synapse", fill=(20, 25, 38), font=title_font)

              route_positions: dict[str, tuple[int, int]] = {}
              component_positions: dict[str, tuple[int, int]] = {}

              for index, route in enumerate(shown_routes):
                  y = 100 + index * route_spacing
                  route_positions[route["file"]] = (45, y)
                  draw.rounded_rectangle((45, y, 735, y + 42), radius=7, fill=(224, 232, 250), outline=(82, 105, 160))
                  label = f"{route['route']} [{route['kind']}]"
                  draw.text((58, y + 11), label[:78], fill=(25, 35, 65), font=route_font)

              for index, node in enumerate(components):
                  column = index % 5
                  row = index // 5
                  x = 850 + column * 420
                  y = 100 + row * component_spacing
                  if y > height - 45:
                      break
                  component_positions[node] = (x, y)
                  draw.rounded_rectangle((x, y, x + 375, y + 32), radius=5, fill=(238, 241, 247), outline=(145, 152, 168))
                  draw.text((x + 7, y + 8), Path(node).name[:45], fill=(42, 48, 62), font=node_font)

              for source, target in all_edges:
                  source_position = route_positions.get(source) or component_positions.get(source)
                  target_position = route_positions.get(target) or component_positions.get(target)
                  if not source_position or not target_position:
                      continue
                  source_width = 690 if source in route_positions else 375
                  draw.line(
                      (
                          source_position[0] + source_width,
                          source_position[1] + 18,
                          target_position[0],
                          target_position[1] + 16,
                      ),
                      fill=(128, 138, 163),
                      width=1,
                  )

              image.save(UI_DIR / "UI_SYNAPSE_MAP.png", "PNG", compress_level=6)


          def render_pdf(
              layers: dict[str, Any],
              repo_shape_path: Path,
              manifest: dict[str, Any],
              saturation_n: float,
              saturation_a0: float,
              pascal_gain: float,
          ) -> Path:
              title_font = load_font(40, True)
              head_font = load_font(23, True)
              text_font = load_font(17)
              pages: list[Image.Image] = []

              page1 = Image.new("RGB", PDF_PAGE_SIZE, (255, 255, 255))
              draw1 = ImageDraw.Draw(page1)
              draw1.text((100, 70), "DREAM Pascal 3-Bit Symbols - Exact Lossless State Image", fill=(0, 0, 0), font=title_font)
              draw1.text(
                  (100, 130),
                  "3 source bits = one Pascal cell; opaque black is A=000 and transparent area is outside the triangle.",
                  fill=(0, 0, 0),
                  font=text_font,
              )
              draw1.text(
                  (100, 165),
                  f"Root: {manifest['source']['rootFile']} | Files: {manifest['source']['fileCount']} | "
                  f"Bits: {manifest['source']['sourceBits']:,} | Cells: {manifest['source']['groupCount']:,}",
                  fill=(0, 0, 0),
                  font=text_font,
              )
              exact = fit_on_white(layers["exactImage"], 1700, 1750)
              page1.paste(exact, (100, 220))

              legend_x = 1870
              legend_y = 230
              draw1.text((legend_x, legend_y), "Eight exact symbols", fill=(0, 0, 0), font=head_font)
              legend_y += 45
              for symbol in PAIR_SYMBOL_ORDER:
                  key = BITS_BY_PAIR_SYMBOL[symbol]
                  color = PAIR_SYMBOL_COLORS[symbol]
                  draw1.rectangle((legend_x, legend_y, legend_x + 34, legend_y + 34), fill=color, outline=(0, 0, 0))
                  draw1.text(
                      (legend_x + 48, legend_y + 6),
                      f"{symbol} = {key}",
                      fill=(0, 0, 0),
                      font=text_font,
                  )
                  legend_y += 42
              legend_y += 20
              draw1.text((legend_x, legend_y), "Derived counterpart families", fill=(0, 0, 0), font=head_font)
              legend_y += 42
              for line in ["A/a: 000 / 111", "B/b: 001 / 100", "C/c: 011 / 110", "D/d: 010 / 101"]:
                  draw1.text((legend_x, legend_y), line, fill=(0, 0, 0), font=text_font)
                  legend_y += 32
              pages.append(page1)

              page2 = Image.new("RGB", PDF_PAGE_SIZE, (255, 255, 255))
              draw2 = ImageDraw.Draw(page2)
              draw2.text((100, 70), "Exact Symbol Identity and Pascal Saturation Field", fill=(0, 0, 0), font=title_font)
              panels = [
                  ("Eight-symbol identity A/a/B/b/C/c/D/d", layers["symbolImage"]),
                  ("Saturation field", layers["saturationImage"]),
              ]
              panel_y = 150
              for label, image in panels:
                  draw2.text((100, panel_y), label, fill=(0, 0, 0), font=head_font)
                  panel = fit_on_white(image, 1250, 1150)
                  page2.paste(panel, (100, panel_y + 38))
                  panel_y += 1450

              formula_x = 1500
              formula_y = 170
              draw2.text((formula_x, formula_y), "Saturating function", fill=(0, 0, 0), font=head_font)
              formula_y += 45
              for line in [
                  "f(x) = a0*x / (1 + x^n)^(1/n)",
                  f"a0 = {saturation_a0:.6g}",
                  f"n = {saturation_n:g}",
                  f"Pascal gain = {pascal_gain:g}",
                  "",
                  "x = gain * C(row,col) / max_k C(row,k)",
                  "",
                  "Displayed field = 254 * f(x)/a0",
                  "",
                  "Applied once as a separate field.",
                  "Exact 3-bit and symbol colors remain unchanged.",
              ]:
                  draw2.text((formula_x, formula_y), line, fill=(0, 0, 0), font=text_font)
                  formula_y += 32
              pages.append(page2)

              page3 = Image.new("RGB", PDF_PAGE_SIZE, (255, 255, 255))
              draw3 = ImageDraw.Draw(page3)
              draw3.text((100, 70), "Repository-Native Runtime Shape", fill=(0, 0, 0), font=title_font)
              repo_shape = fit_on_white(Image.open(repo_shape_path), 2200, 2700)
              page3.paste(repo_shape, (150, 150))
              pages.append(page3)

              pdf_path = RENDER_DIR / "APP_CODE_PASCAL_3BIT_SYMBOL_SATURATION_PRINT.pdf"
              pages[0].save(pdf_path, "PDF", save_all=True, append_images=pages[1:], resolution=300.0)
              return pdf_path


          def write_metadata_and_docs(
              manifest: dict[str, Any],
              layers: dict[str, Any],
              repo_shape_path: Path,
              pdf_path: Path,
              records: dict[str, dict[str, Any]],
              saturation_n: float,
              saturation_a0: float,
              pascal_gain: float,
              cell_size: int,
          ) -> None:
              write_text(
                  DATA_DIR / "SOURCE_ORDER.txt",
                  "\n".join(item["path"] for item in manifest["source"]["files"]) + "\n",
              )
              write_json(DATA_DIR / "FILE_MANIFEST.json", manifest)

              ranking = sorted(records.values(), key=record_score, reverse=True)
              write_csv(
                  DATA_DIR / "EXPORT_RANKING.csv",
                  ["rank", "path", "runtimeExportCount", "fanIn", "fanOut", "bytes"],
                  [
                      {
                          "rank": index,
                          "path": item["path"],
                          "runtimeExportCount": item["runtimeExportCount"],
                          "fanIn": item["fanIn"],
                          "fanOut": item["fanOut"],
                          "bytes": item["bytes"],
                      }
                      for index, item in enumerate(ranking, start=1)
                  ],
              )

              metadata = {
                  **manifest,
                  "rendering": {
                      "logicalCellSizePixels": 1,
                      "visibleTileCellSizePixels": cell_size,
                      "transparentPaletteIndex": TRANSPARENT_INDEX,
                      "real000IsOpaqueBlack": True,
                      "saturation": {
                          "formula": "f(x)=a0*x/(1+x^n)^(1/n)",
                          "a0": saturation_a0,
                          "n": saturation_n,
                          "pascalGain": pascal_gain,
                          "x": "gain * C(row,col) / max_k C(row,k)",
                          "usage": "one-pass separate visual field; exact state image unchanged",
                      },
                  },
                  "outputs": {
                      "exactStatePng": layers["paths"]["exact"].as_posix(),
                      "pairSymbolPng": layers["paths"]["symbol"].as_posix(),
                      "saturationFieldPng": layers["paths"]["saturation"].as_posix(),
                      "repositoryNativeShapePng": repo_shape_path.as_posix(),
                      "colorPdf": pdf_path.as_posix(),
                      "tiles": layers["tiles"],
                      "decoder": (DECODER_DIR / "decode_from_image.py").as_posix(),
                      "decodeVerification": (DECODER_DIR / "IMAGE_TO_CODE_VERIFICATION.json").as_posix(),
                  },
              }
              write_json(META_DIR / "APP_CODE_REPO_NATIVE_PASCAL_3BIT_SYMBOL.json", metadata)

              math_notes = [
                  "# DREAM Repo-Native Pascal 3-Bit Symbol Math",
                  "",
                  "## Exact source identity",
                  "",
                  "`3 source bits = 0.375 bytes = 1 Pascal cell`",
                  "",
                  "`one pair symbol = one exact 3-bit source state`",
                  "",
                  "- `A=000`, `a=111`",
                  "- `B=001`, `b=100`",
                  "- `C=011`, `c=110`",
                  "- `D=010`, `d=101`",
                  "",
                  "Uppercase/lowercase family and case are derived metadata, not the primary state.",
                  "",
                  "## Source ordering",
                  "",
                  "The root is the runtime file with the highest runtime-export count.",
                  "Dependency degree, fan-in, byte size, and path are deterministic tie-breakers.",
                  "The source order follows a dependency breadth-first traversal using imports and importers.",
                  "Disconnected islands restart from the strongest remaining runtime file.",
                  "",
                  "## Pascal field",
                  "",
                  "`cell(row,col)=C(row,col)`",
                  "`C(n,k)=C(n-1,k-1)+C(n-1,k)`",
                  "",
                  "## Saturating function",
                  "",
                  "`f(x)=a0*x/(1+x^n)^(1/n)`",
                  f"`a0={saturation_a0}`",
                  f"`n={saturation_n}`",
                  f"`Pascal gain={pascal_gain}`",
                  "",
                  "The function is applied once as a separate grayscale field.",
                  "The exact source-state image is not modified.",
                  "",
                  "## Decode",
                  "",
                  "The exact PNG embeds the file manifest in a compressed PNG text chunk.",
                  "Pixel cells contain the source bitstream. The manifest contains file boundaries and hashes.",
              ]
              write_text(DATA_DIR / "PASCAL_3BIT_SYMBOL_MATH.md", "\n".join(math_notes) + "\n")


          def copy_decoder_image(exact_path: Path) -> None:
              destination = DECODER_DIR / exact_path.name
              if destination.exists():
                  destination.unlink()
              try:
                  os.link(exact_path, destination)
              except OSError:
                  shutil.copy2(exact_path, destination)


          def write_readme(summary: dict[str, Any]) -> None:
              lines = [
                  "# DREAM Application Image and Runtime Atlas",
                  "",
                  f"- Root file: `{summary['rootFile']}`",
                  f"- Runtime files: **{summary['runtimeFiles']}**",
                  f"- Dependency edges: **{summary['dependencyEdges']}**",
                  f"- Dependency islands: **{summary['dependencyIslands']}**",
                  f"- Route files: **{summary['uiRoutes']}**",
                  f"- Complete image-to-code round trip exact: **{summary['decodeAllExact']}**",
                  "",
                  "## What this run builds",
                  "",
                  "- the exact 3-bit Pascal state image",
                  "- the exact eight-symbol A/a/B/b/C/c/D/d identity layer",
                  "- the Pascal saturation field",
                  "- visible nearest-neighbor tiles",
                  "- the color PDF",
                  "- a repository-native dependency shape colored by dominant exact symbol",
                  "- a decoder that rebuilds the encoded files from the generated exact image",
                  "- SHA-256 round-trip and exact-symbol cross-check verification",
                  "- image analysis, code-health reports, and UI/runtime synapse maps",
                  "",
                  "Pair family and uppercase/lowercase case remain available only as derived analysis metadata.",
                  "The workflow records analysis and project-check failures instead of stopping artifact creation.",
              ]
              write_text(OUT_DIR / "README.md", "\n".join(lines) + "\n")


          def main() -> int:
              repo_root = Path(".").resolve()
              cell_size = env_int("CELL_SIZE", 4, 1, 64)
              max_png_dimension = env_int("MAX_PNG_DIMENSION", 20000, 1000, 50000)
              max_tile_pixels = env_int("MAX_TILE_PIXELS", 100_000_000, 1_000_000, 400_000_000)
              saturation_n = env_float("SATURATION_N", 2.0, 0.000001)
              saturation_a0 = env_float("SATURATION_A0", 1.2e-14, 1e-300)
              pascal_gain = env_float("PASCAL_GAIN", 8.0, 0.0)

              all_code, seed_files, excluded_reasons, excluded_rows = collect_code_files(repo_root)
              files = dependency_closure(repo_root, seed_files, all_code, excluded_reasons)
              records, graph, unresolved, excluded_dependencies, external_imports = build_dependency_graph(
                  repo_root,
                  files,
                  all_code,
                  excluded_reasons,
              )
              root, order, islands, depths, island_index_by_path = dependency_traversal(records, graph)

              manifest = build_file_manifest(
                  repo_root,
                  order,
                  records,
                  graph,
                  root,
                  islands,
                  depths,
                  island_index_by_path,
              )
              layers = render_pascal_layers(
                  repo_root,
                  order,
                  manifest,
                  cell_size,
                  max_png_dimension,
                  max_tile_pixels,
                  saturation_n,
                  saturation_a0,
                  pascal_gain,
              )
              repo_shape_path = render_repository_shape(
                  records,
                  graph,
                  root,
                  islands,
                  depths,
                  island_index_by_path,
              )
              decode_result = run_decoder_in_process(
                  layers["paths"]["exact"],
                  layers["paths"]["symbol"],
              )
              copy_decoder_image(layers["paths"]["exact"])

              image_analysis = analyze_images(
                  manifest,
                  layers,
                  records,
                  graph,
                  unresolved,
                  excluded_dependencies,
                  external_imports,
                  decode_result,
              )
              health_report = code_health_analysis(
                  repo_root,
                  records,
                  graph,
                  root,
                  unresolved,
                  excluded_rows,
                  excluded_dependencies,
              )
              ui_report = build_ui_map(repo_root, records, graph)
              pdf_path = render_pdf(
                  layers,
                  repo_shape_path,
                  manifest,
                  saturation_n,
                  saturation_a0,
                  pascal_gain,
              )
              write_metadata_and_docs(
                  manifest,
                  layers,
                  repo_shape_path,
                  pdf_path,
                  records,
                  saturation_n,
                  saturation_a0,
                  pascal_gain,
                  cell_size,
              )

              summary = {
                  "status": "completed-with-findings"
                  if unresolved or health_report["circularDependencyGroups"] or not decode_result["allExact"]
                  else "completed",
                  "rootFile": root,
                  "runtimeFiles": len(records),
                  "excludedFiles": len(excluded_rows),
                  "dependencyEdges": sum(len(targets) for targets in graph.values()),
                  "dependencyIslands": len(islands),
                  "unresolvedInternalImports": len(unresolved),
                  "excludedDependencies": len(excluded_dependencies),
                  "circularDependencyGroups": len(health_report["circularDependencyGroups"]),
                  "uiRoutes": ui_report["routeCount"],
                  "sourceBits": manifest["source"]["sourceBits"],
                  "pascalCells": manifest["source"]["groupCount"],
                  "pascalRows": manifest["source"]["pascalRows"],
                  "decodeAllExact": decode_result["allExact"],
                  "imageEntropyBitsPerCell": image_analysis["entropyBitsPerCell"],
              }
              write_json(OUT_DIR / "ATLAS_SUMMARY.json", summary)
              write_readme(summary)

              for status_file in (
                  RENDER_DIR / "STATUS.md",
                  DECODER_DIR / "STATUS.md",
                  ANALYSIS_DIR / "STATUS.md",
                  HEALTH_DIR / "STATUS.md",
                  UI_DIR / "STATUS.md",
              ):
                  write_text(status_file, "Generated successfully.\n")

              print(json.dumps(summary, indent=2))
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except SystemExit:
                  raise
              except Exception:
                  error_text = traceback.format_exc()
                  write_text(DIAG_DIR / "GENERATOR_EXCEPTION.txt", error_text)
                  print(error_text, file=sys.stderr)
                  raise
          PY

          python3 -m py_compile "$RUNNER_TEMP/dream_atlas.py" \
            > >(tee "$OUT/Diagnostics/PYTHON_COMPILE_STDOUT.log") \
            2> >(tee "$OUT/Diagnostics/PYTHON_COMPILE_STDERR.log" >&2)

          compile_status=$?
          printf '%s\n' "$compile_status" \
            > "$OUT/Diagnostics/PYTHON_COMPILE_EXIT_CODE.txt"

          if [ "$compile_status" -eq 0 ]; then
            python3 "$RUNNER_TEMP/dream_atlas.py" \
              > >(tee "$OUT/Diagnostics/GENERATOR_STDOUT.log") \
              2> >(tee "$OUT/Diagnostics/GENERATOR_STDERR.log" >&2)
            generator_status=$?
          else
            generator_status=125
            printf '%s\n' \
              "Generator was not run because the embedded Python did not compile." \
              > "$OUT/Diagnostics/GENERATOR_NOT_RUN.txt"
          fi

          printf '%s\n' "$generator_status" \
            > "$OUT/Diagnostics/GENERATOR_EXIT_CODE.txt"

          if [ "$generator_status" -ne 0 ]; then
            for directory in Rendering Decoder Analysis Health UI; do
              printf '%s\n' \
                "Generation failed with exit code $generator_status. See ../Diagnostics/." \
                > "$OUT/$directory/STATUS.md"
            done
          fi

          exit 0

      - name: Run typecheck lint and build without stopping reports
        id: project_checks
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CI: "true"
        run: |
          set +e

          OUT="dream-application-image/Diagnostics/ProjectChecks"
          mkdir -p "$OUT"

          if [ ! -f package.json ]; then
            printf '%s\n' "No package.json found; project checks skipped." \
              > "$OUT/PROJECT_CHECKS_SKIPPED.txt"
            exit 0
          fi

          PM="npm"
          if [ -f pnpm-lock.yaml ]; then
            PM="pnpm"
            corepack enable > "$OUT/COREPACK_STDOUT.log" 2> "$OUT/COREPACK_STDERR.log"
          elif [ -f yarn.lock ]; then
            PM="yarn"
            corepack enable > "$OUT/COREPACK_STDOUT.log" 2> "$OUT/COREPACK_STDERR.log"
          fi

          printf '%s\n' "$PM" > "$OUT/PACKAGE_MANAGER.txt"

          if [ "$PM" = "pnpm" ]; then
            timeout 30m pnpm install --frozen-lockfile --ignore-scripts \
              > >(tee "$OUT/INSTALL_STDOUT.log") \
              2> >(tee "$OUT/INSTALL_STDERR.log" >&2)
          elif [ "$PM" = "yarn" ]; then
            timeout 30m yarn install --immutable --ignore-scripts \
              > >(tee "$OUT/INSTALL_STDOUT.log") \
              2> >(tee "$OUT/INSTALL_STDERR.log" >&2)
          elif [ -f package-lock.json ]; then
            timeout 30m npm ci --ignore-scripts --no-audit --no-fund \
              > >(tee "$OUT/INSTALL_STDOUT.log") \
              2> >(tee "$OUT/INSTALL_STDERR.log" >&2)
          else
            timeout 30m npm install --ignore-scripts --no-audit --no-fund \
              > >(tee "$OUT/INSTALL_STDOUT.log") \
              2> >(tee "$OUT/INSTALL_STDERR.log" >&2)
          fi

          install_status=$?
          printf '%s\n' "$install_status" > "$OUT/INSTALL_EXIT_CODE.txt"

          for script_name in typecheck lint build; do
            node -e \
              "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)" \
              "$script_name"

            if [ "$?" -ne 0 ]; then
              printf '%s\n' "Script not present: $script_name" \
                > "$OUT/${script_name^^}_SKIPPED.txt"
              continue
            fi

            if [ "$install_status" -ne 0 ]; then
              printf '%s\n' \
                "Dependency installation exited $install_status; $script_name was skipped." \
                > "$OUT/${script_name^^}_SKIPPED.txt"
              continue
            fi

            timeout 30m "$PM" run "$script_name" \
              > >(tee "$OUT/${script_name^^}_STDOUT.log") \
              2> >(tee "$OUT/${script_name^^}_STDERR.log" >&2)

            printf '%s\n' "$?" > "$OUT/${script_name^^}_EXIT_CODE.txt"
          done

          exit 0

      - name: Document findings and build separate zip packages
        id: package
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          PILLOW_OUTCOME: ${{ steps.install_pillow.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          CHECKS_OUTCOME: ${{ steps.project_checks.outcome }}
        run: |
          set +e

          OUT="dream-application-image"
          ART="dream-artifacts"
          REPORT="$OUT/Diagnostics/WORKFLOW_REPORT.md"

          mkdir -p "$OUT/Diagnostics" "$ART"

          {
            echo "# DREAM Application Image Workflow Report"
            echo
            echo "The workflow records failures and continues to reporting and package creation."
            echo
            echo "## Step outcomes"
            echo "- Checkout: ${CHECKOUT_OUTCOME:-unknown}"
            echo "- Python setup: ${PYTHON_OUTCOME:-unknown}"
            echo "- Pillow installation step: ${PILLOW_OUTCOME:-unknown}"
            echo "- Generator shell step: ${GENERATE_OUTCOME:-unknown}"
            echo "- Project-check shell step: ${CHECKS_OUTCOME:-unknown}"
            echo
            echo "## Recorded exit codes"

            find "$OUT/Diagnostics" -type f -name '*_EXIT_CODE.txt' -print 2>/dev/null \
              | sort \
              | while read -r file; do
                  echo "- $file: $(cat "$file")"
                done

            echo
            echo "## Generated outputs"

            for file in \
              "$OUT/Rendering/APP_CODE_PASCAL_3BIT_EXACT.png" \
              "$OUT/Rendering/APP_CODE_PASCAL_PAIR_SYMBOL.png" \
              "$OUT/Rendering/APP_CODE_PASCAL_SATURATION_FIELD.png" \
              "$OUT/Rendering/REPO_NATIVE_RUNTIME_SHAPE.png" \
              "$OUT/Rendering/APP_CODE_PASCAL_3BIT_SYMBOL_SATURATION_PRINT.pdf" \
              "$OUT/Decoder/decode_from_image.py" \
              "$OUT/Decoder/IMAGE_TO_CODE_VERIFICATION.json" \
              "$OUT/Analysis/IMAGE_ANALYSIS.md" \
              "$OUT/Health/CODE_HEALTH_REPORT.md" \
              "$OUT/UI/UI_ROUTE_MAP.md" \
              "$OUT/UI/UI_SYNAPSE_MAP.png"; do

              if [ -f "$file" ]; then
                echo "- PRESENT: $file ($(wc -c < "$file") bytes)"
              else
                echo "- MISSING: $file"
              fi
            done

            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$REPORT"

          cp "$REPORT" "$OUT/WORKFLOW_REPORT.md" 2>/dev/null || true
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          rm -f \
            "$ART/dream-application-image-full.zip" \
            "$ART/dream-application-image-rendering.zip" \
            "$ART/dream-application-image-decoder.zip" \
            "$ART/dream-application-image-analysis.zip"

          zip -q -r "$ART/dream-application-image-full.zip" "$OUT" \
            > "$OUT/Diagnostics/FULL_ZIP_STDOUT.log" \
            2> "$OUT/Diagnostics/FULL_ZIP_STDERR.log"
          printf '%s\n' "$?" > "$OUT/Diagnostics/FULL_ZIP_EXIT_CODE.txt"

          (
            cd "$OUT" || exit 1
            zip -q -r "../$ART/dream-application-image-rendering.zip" \
              Rendering Data Metadata README.md ATLAS_SUMMARY.json WORKFLOW_REPORT.md
          ) > "$OUT/Diagnostics/RENDERING_ZIP_STDOUT.log" \
            2> "$OUT/Diagnostics/RENDERING_ZIP_STDERR.log"
          printf '%s\n' "$?" > "$OUT/Diagnostics/RENDERING_ZIP_EXIT_CODE.txt"

          (
            cd "$OUT" || exit 1
            zip -q -r "../$ART/dream-application-image-decoder.zip" \
              Decoder Data/FILE_MANIFEST.json Metadata/APP_CODE_REPO_NATIVE_PASCAL_3BIT_SYMBOL.json \
              README.md ATLAS_SUMMARY.json WORKFLOW_REPORT.md
          ) > "$OUT/Diagnostics/DECODER_ZIP_STDOUT.log" \
            2> "$OUT/Diagnostics/DECODER_ZIP_STDERR.log"
          printf '%s\n' "$?" > "$OUT/Diagnostics/DECODER_ZIP_EXIT_CODE.txt"

          (
            cd "$OUT" || exit 1
            zip -q -r "../$ART/dream-application-image-analysis.zip" \
              Analysis Health UI Diagnostics README.md ATLAS_SUMMARY.json WORKFLOW_REPORT.md
          ) > "$OUT/Diagnostics/ANALYSIS_ZIP_STDOUT.log" \
            2> "$OUT/Diagnostics/ANALYSIS_ZIP_STDERR.log"
          printf '%s\n' "$?" > "$OUT/Diagnostics/ANALYSIS_ZIP_EXIT_CODE.txt"

          package_failure=0
          for archive in \
            "$ART/dream-application-image-full.zip" \
            "$ART/dream-application-image-rendering.zip" \
            "$ART/dream-application-image-decoder.zip" \
            "$ART/dream-application-image-analysis.zip"; do

            if [ ! -s "$archive" ]; then
              echo "Required package was not created or is empty: $archive" >&2
              package_failure=1
            fi
          done

          if [ "$package_failure" -ne 0 ]; then
            exit 1
          fi

          ls -lh \
            "$ART/dream-application-image-full.zip" \
            "$ART/dream-application-image-rendering.zip" \
            "$ART/dream-application-image-decoder.zip" \
            "$ART/dream-application-image-analysis.zip"

          exit 0

      - name: Upload full one-day package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-full
          path: dream-artifacts/dream-application-image-full.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload rendering package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-rendering
          path: dream-artifacts/dream-application-image-rendering.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload decoder package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-decoder
          path: dream-artifacts/dream-application-image-decoder.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload analysis health UI and diagnostics package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-analysis
          path: dream-artifacts/dream-application-image-analysis.zip
          if-no-files-found: error
          retention-days: 1
