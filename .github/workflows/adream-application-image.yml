name: DREAM Application Image and Runtime Atlas
run-name: DREAM Application Image and Runtime Atlas

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-dream-application-image:
    name: Build DREAM application image
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Set up Python
        id: setup_python
        if: always()
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Prepare real output paths
        id: prepare
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          OUT="dream-application-image"
          ART="dream-artifacts"

          mkdir -p \
            "$OUT/Rendering" \
            "$OUT/Data" \
            "$OUT/Metadata" \
            "$OUT/Decoder/REBUILT_CODE" \
            "$OUT/Analysis" \
            "$OUT/Health" \
            "$OUT/UI" \
            "$OUT/Diagnostics/ProjectChecks" \
            "$ART"

          for directory in Rendering Decoder Analysis Health UI; do
            printf '%s\n' \
              "Pending generation. See ../Diagnostics/WORKFLOW_REPORT.md after the run." \
              > "$OUT/$directory/STATUS.md"
          done

          cat > "$OUT/README.md" <<'EOF'
          # DREAM Application Image and Runtime Atlas

          Generation has not completed yet. See `Diagnostics/WORKFLOW_REPORT.md`.
          EOF

          printf '{"status":"pending"}\n' > "$OUT/ATLAS_SUMMARY.json"
          printf 'Workflow started: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$OUT/Diagnostics/WORKFLOW_START.txt"

          exit 0

      - name: Install Pillow
        id: install_pillow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          OUT="dream-application-image"
          mkdir -p "$OUT/Diagnostics"

          python3 -m pip install \
            --disable-pip-version-check \
            --upgrade Pillow \
            > >(tee "$OUT/Diagnostics/PILLOW_INSTALL_STDOUT.log") \
            2> >(tee "$OUT/Diagnostics/PILLOW_INSTALL_STDERR.log" >&2)

          printf '%s\n' "$?" > "$OUT/Diagnostics/PILLOW_INSTALL_EXIT_CODE.txt"
          exit 0

      - name: Build images decoder analysis health and UI synapse
        id: generate
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CELL_SIZE: "4"
          MAX_PNG_DIMENSION: "20000"
          MAX_TILE_PIXELS: "100000000"
          SATURATION_N: "2.0"
          SATURATION_A0: "1.2e-14"
          PASCAL_GAIN: "8.0"
        run: |
          set +e

          OUT="dream-application-image"
          mkdir -p "$OUT/Diagnostics"

          cat > "$RUNNER_TEMP/dream_atlas.py" <<'PY'
          from __future__ import annotations

          import base64
          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import shutil
          import statistics
          import sys
          import traceback
          import zlib
          from collections import Counter, defaultdict, deque
          from pathlib import Path
          from typing import Any

          from PIL import Image, ImageDraw, ImageFont, PngImagePlugin


          OUT_DIR = Path("dream-application-image")
          RENDER_DIR = OUT_DIR / "Rendering"
          DATA_DIR = OUT_DIR / "Data"
          META_DIR = OUT_DIR / "Metadata"
          DECODER_DIR = OUT_DIR / "Decoder"
          REBUILT_DIR = DECODER_DIR / "REBUILT_CODE"
          ANALYSIS_DIR = OUT_DIR / "Analysis"
          HEALTH_DIR = OUT_DIR / "Health"
          UI_DIR = OUT_DIR / "UI"
          DIAG_DIR = OUT_DIR / "Diagnostics"
          TILES_DIR = RENDER_DIR / "Tiles"

          for directory in (
              OUT_DIR,
              RENDER_DIR,
              DATA_DIR,
              META_DIR,
              DECODER_DIR,
              REBUILT_DIR,
              ANALYSIS_DIR,
              HEALTH_DIR,
              UI_DIR,
              DIAG_DIR,
              TILES_DIR,
          ):
              directory.mkdir(parents=True, exist_ok=True)


          APP_ROOTS = [
              "app",
              "components",
              "coresurfaces",
              "daydreams",
              "dr-eams",
              "dreamdmbar",
              "dreamr",
              "engine",
              "engins",
              "hooks",
          ]

          CODE_EXTENSIONS = {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"}

          EXCLUDED_DIR_NAMES = {
              ".git",
              ".github",
              ".ci",
              ".next",
              ".turbo",
              ".vercel",
              ".cache",
              ".pytest_cache",
              "__pycache__",
              "node_modules",
              "coverage",
              "dist",
              "build",
              "out",
              "docs",
              "doc",
              "test",
              "tests",
              "__tests__",
              "__mocks__",
              "fixtures",
              "examples",
              ".storybook",
              "storybook",
              OUT_DIR.name.lower(),
          }

          EXCLUDED_FILE_MARKERS = (
              ".test.",
              ".spec.",
              ".stories.",
              ".story.",
              ".mock.",
              ".fixture.",
              ".bench.",
              ".generated.",
              ".gen.",
              ".demo.",
              ".example.",
              ".setup.",
              ".config.",
          )

          STATE_KEYS = [
              "000",
              "001",
              "010",
              "011",
              "100",
              "101",
              "110",
              "111",
          ]

          STATE_INDEX = {
              key: index
              for index, key in enumerate(STATE_KEYS)
          }

          RGB_BY_BITS = {
              "000": (0, 0, 0),
              "111": (255, 255, 255),
              "001": (0, 0, 255),
              "100": (255, 0, 0),
              "011": (0, 255, 255),
              "110": (255, 255, 0),
              "010": (0, 255, 0),
              "101": (255, 0, 255),
          }

          PAIR_SYMBOL_BY_BITS = {
              "000": "A",
              "111": "a",
              "001": "B",
              "100": "b",
              "011": "C",
              "110": "c",
              "010": "D",
              "101": "d",
          }

          BITS_BY_PAIR_SYMBOL = {
              symbol: bits
              for bits, symbol in PAIR_SYMBOL_BY_BITS.items()
          }

          PAIR_SYMBOL_ORDER = [
              "A",
              "a",
              "B",
              "b",
              "C",
              "c",
              "D",
              "d",
          ]

          PAIR_SYMBOL_INDEX = {
              symbol: index
              for index, symbol in enumerate(PAIR_SYMBOL_ORDER)
          }

          PAIR_SYMBOL_COLORS = {
              "A": RGB_BY_BITS["000"],
              "a": RGB_BY_BITS["111"],
              "B": RGB_BY_BITS["001"],
              "b": RGB_BY_BITS["100"],
              "C": RGB_BY_BITS["011"],
              "c": RGB_BY_BITS["110"],
              "D": RGB_BY_BITS["010"],
              "d": RGB_BY_BITS["101"],
          }

          PAIR_FAMILY_BY_BITS = {
              "000": "A",
              "111": "A",
              "001": "B",
              "100": "B",
              "011": "C",
              "110": "C",
              "010": "D",
              "101": "D",
          }

          PAIR_FAMILY_INDEX = {
              "A": 0,
              "B": 1,
              "C": 2,
              "D": 3,
          }

          PAIR_CASE_BY_BITS = {
              bits: (
                  "uppercase"
                  if symbol.isupper()
                  else "lowercase"
              )
              for bits, symbol in PAIR_SYMBOL_BY_BITS.items()
          }

          TRANSPARENT_INDEX = 255
          PDF_PAGE_SIZE = (2550, 3300)
          MANIFEST_INFO_KEY = "dreamengin_manifest_zlib_base64_v5"
          FORMAT_NAME = "dreamengin.application-code-repo-native-pascal-3bit-symbol.v5"

          IMPORT_FROM_RE = re.compile(
              r"\bimport\s+(?P<clause>[^;\n]*?)\s+from\s+['\"](?P<spec>[^'\"]+)['\"]",
              re.MULTILINE,
          )
          BARE_IMPORT_RE = re.compile(r"\bimport\s*['\"](?P<spec>[^'\"]+)['\"]")
          EXPORT_FROM_RE = re.compile(
              r"\bexport\s+(?P<clause>\*|\{[^}]*\})\s+from\s+['\"](?P<spec>[^'\"]+)['\"]",
              re.MULTILINE | re.DOTALL,
          )
          EXPORT_TYPE_FROM_RE = re.compile(
              r"\bexport\s+type\s+(?:\*|\{[^}]*\})\s+from\s+['\"](?P<spec>[^'\"]+)['\"]",
              re.MULTILINE | re.DOTALL,
          )
          REQUIRE_RE = re.compile(r"\brequire\s*\(\s*['\"](?P<spec>[^'\"]+)['\"]\s*\)")
          DYNAMIC_IMPORT_RE = re.compile(r"\bimport\s*\(\s*['\"](?P<spec>[^'\"]+)['\"]\s*\)")

          EXPORT_DECL_RE = re.compile(
              r"\bexport\s+(?:default\s+)?(?:async\s+)?"
              r"(?:function|class|const|let|var|enum)\s*([A-Za-z_$][\w$]*)?"
          )
          EXPORT_DEFAULT_EXPR_RE = re.compile(
              r"\bexport\s+default\s+(?!(?:async\s+)?(?:function|class)\b)"
          )
          EXPORT_LIST_RE = re.compile(r"\bexport\s*(?!type\b)\{([^}]*)\}", re.DOTALL)
          VALUE_CODE_RE = re.compile(
              r"\b(?:const|let|var|function|class|enum|namespace|return|new|throw|await)\b"
              r"|<\s*[A-Z][A-Za-z0-9_.]*\b"
          )

          ROUTE_STEMS = {
              "page",
              "layout",
              "route",
              "loading",
              "error",
              "not-found",
              "template",
              "default",
          }


          class BuildError(RuntimeError):
              pass


          def env_int(name: str, default: int, minimum: int, maximum: int) -> int:
              raw = os.environ.get(name, str(default)).strip()
              try:
                  value = int(raw)
              except ValueError:
                  value = default
              return max(minimum, min(maximum, value))


          def env_float(name: str, default: float, minimum: float) -> float:
              raw = os.environ.get(name, str(default)).strip()
              try:
                  value = float(raw)
              except ValueError:
                  value = default
              return max(minimum, value)


          def write_text(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")


          def write_json(path: Path, value: Any) -> None:
              write_text(path, json.dumps(value, indent=2, ensure_ascii=False) + "\n")


          def strip_comments(text: str) -> str:
              text = re.sub(r"/\*.*?\*/", " ", text, flags=re.DOTALL)
              return re.sub(r"(^|[^:])//.*?$", r"\1 ", text, flags=re.MULTILINE)


          def file_exclusion_reason(relative_path: Path) -> str | None:
              lowered_parts = [part.lower() for part in relative_path.parts]
              if any(part in EXCLUDED_DIR_NAMES for part in lowered_parts[:-1]):
                  return "excluded directory"

              name = relative_path.name.lower()
              if relative_path.stem.lower() == "index":
                  return "index/barrel file"
              if name.endswith(".d.ts"):
                  return "type declaration"
              if any(marker in name for marker in EXCLUDED_FILE_MARKERS):
                  return "test/story/mock/generated/config file"
              return None


          def is_type_only_module(text: str) -> bool:
              clean = strip_comments(text)
              has_type_syntax = bool(
                  re.search(
                      r"\b(?:interface|type)\s+[A-Za-z_$]|\b(?:import|export)\s+type\b",
                      clean,
                  )
              )
              return has_type_syntax and not bool(VALUE_CODE_RE.search(clean))


          def runtime_import_refs(text: str) -> list[dict[str, Any]]:
              clean = strip_comments(text)
              refs: list[dict[str, Any]] = []

              type_only_specs = {match.group("spec") for match in EXPORT_TYPE_FROM_RE.finditer(clean)}

              for match in IMPORT_FROM_RE.finditer(clean):
                  clause = match.group("clause").strip()
                  refs.append(
                      {
                          "specifier": match.group("spec"),
                          "kind": "import",
                          "typeOnly": clause.startswith("type "),
                      }
                  )

              for match in BARE_IMPORT_RE.finditer(clean):
                  refs.append(
                      {
                          "specifier": match.group("spec"),
                          "kind": "bare-import",
                          "typeOnly": False,
                      }
                  )

              for match in EXPORT_FROM_RE.finditer(clean):
                  specifier = match.group("spec")
                  clause = match.group("clause")
                  non_type_member = True
                  if clause.startswith("{"):
                      members = [item.strip() for item in clause[1:-1].split(",") if item.strip()]
                      non_type_member = any(not item.startswith("type ") for item in members)
                  refs.append(
                      {
                          "specifier": specifier,
                          "kind": "re-export",
                          "typeOnly": specifier in type_only_specs or not non_type_member,
                      }
                  )

              for pattern, kind in ((REQUIRE_RE, "require"), (DYNAMIC_IMPORT_RE, "dynamic-import")):
                  for match in pattern.finditer(clean):
                      refs.append(
                          {
                              "specifier": match.group("spec"),
                              "kind": kind,
                              "typeOnly": False,
                          }
                      )

              deduplicated: dict[tuple[str, str, bool], dict[str, Any]] = {}
              for ref in refs:
                  key = (ref["specifier"], ref["kind"], ref["typeOnly"])
                  deduplicated[key] = ref
              return list(deduplicated.values())


          def runtime_exports(text: str) -> list[str]:
              clean = strip_comments(text)
              exports: list[str] = []

              for match in EXPORT_DECL_RE.finditer(clean):
                  exports.append(match.group(1) or "default")

              exports.extend("default" for _ in EXPORT_DEFAULT_EXPR_RE.finditer(clean))

              for match in EXPORT_LIST_RE.finditer(clean):
                  for raw_item in match.group(1).split(","):
                      item = raw_item.strip()
                      if not item or item.startswith("type "):
                          continue
                      name = re.split(r"\s+as\s+", item, maxsplit=1)[0].strip()
                      if re.fullmatch(r"[A-Za-z_$][\w$]*", name):
                          exports.append(name)

              if "module.exports" in clean:
                  exports.append("module.exports")

              return exports


          def collect_code_files(repo_root: Path) -> tuple[dict[str, Path], list[Path], dict[str, str], list[dict[str, str]]]:
              all_code: dict[str, Path] = {}
              seed_files: list[Path] = []
              excluded_reasons: dict[str, str] = {}
              excluded_rows: list[dict[str, str]] = []

              for path in repo_root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in CODE_EXTENSIONS:
                      continue

                  relative_path = path.relative_to(repo_root)
                  key = relative_path.as_posix()
                  all_code[key] = path

                  reason = file_exclusion_reason(relative_path)
                  if reason:
                      excluded_reasons[key] = reason
                      excluded_rows.append({"path": key, "reason": reason})
                      continue

                  try:
                      text = path.read_text(encoding="utf-8", errors="replace")
                  except OSError as error:
                      reason = f"read error: {error}"
                      excluded_reasons[key] = reason
                      excluded_rows.append({"path": key, "reason": reason})
                      continue

                  if is_type_only_module(text):
                      reason = "type-only module"
                      excluded_reasons[key] = reason
                      excluded_rows.append({"path": key, "reason": reason})
                      continue

                  if relative_path.parts and relative_path.parts[0] in APP_ROOTS:
                      seed_files.append(path)

              return all_code, seed_files, excluded_reasons, excluded_rows


          def candidate_module_paths(base: Path) -> list[Path]:
              candidates: list[Path] = []
              if base.suffix.lower() in CODE_EXTENSIONS:
                  candidates.append(base)
              else:
                  candidates.extend(Path(str(base) + extension) for extension in sorted(CODE_EXTENSIONS))
                  candidates.extend(base / f"index{extension}" for extension in sorted(CODE_EXTENSIONS))
              return candidates


          def resolve_internal_specifier(
              repo_root: Path,
              source_path: Path,
              specifier: str,
              all_code: dict[str, Path],
          ) -> Path | None:
              if specifier.startswith("."):
                  base = (source_path.parent / specifier).resolve()
              elif specifier.startswith(("@/", "~/")):
                  base = (repo_root / specifier[2:]).resolve()
              elif any(specifier == root or specifier.startswith(root + "/") for root in APP_ROOTS):
                  base = (repo_root / specifier).resolve()
              else:
                  return None

              for candidate in candidate_module_paths(base):
                  try:
                      key = candidate.relative_to(repo_root).as_posix()
                  except ValueError:
                      continue
                  if key in all_code:
                      return all_code[key]
              return None


          def barrel_runtime_leaves(
              repo_root: Path,
              barrel_path: Path,
              all_code: dict[str, Path],
              seen: set[str] | None = None,
          ) -> set[Path]:
              seen = set() if seen is None else seen
              key = barrel_path.relative_to(repo_root).as_posix()
              if key in seen:
                  return set()
              seen.add(key)

              try:
                  text = barrel_path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return set()

              leaves: set[Path] = set()
              for ref in runtime_import_refs(text):
                  if ref["typeOnly"]:
                      continue
                  target = resolve_internal_specifier(repo_root, barrel_path, ref["specifier"], all_code)
                  if target is None:
                      continue
                  if target.stem.lower() == "index":
                      leaves.update(barrel_runtime_leaves(repo_root, target, all_code, seen))
                  else:
                      leaves.add(target)
              return leaves


          def dependency_closure(
              repo_root: Path,
              seed_files: list[Path],
              all_code: dict[str, Path],
              excluded_reasons: dict[str, str],
          ) -> list[Path]:
              included = {path.relative_to(repo_root).as_posix(): path for path in seed_files}
              queue = deque(seed_files)

              while queue:
                  source = queue.popleft()
                  text = source.read_text(encoding="utf-8", errors="replace")
                  for ref in runtime_import_refs(text):
                      if ref["typeOnly"]:
                          continue
                      target = resolve_internal_specifier(repo_root, source, ref["specifier"], all_code)
                      if target is None:
                          continue
                      targets = (
                          barrel_runtime_leaves(repo_root, target, all_code)
                          if target.stem.lower() == "index"
                          else {target}
                      )
                      for item in targets:
                          key = item.relative_to(repo_root).as_posix()
                          if key in included or key in excluded_reasons:
                              continue
                          included[key] = item
                          queue.append(item)

              return list(included.values())


          def bits_from_bytes(data: bytes):
              for byte in data:
                  for shift in range(7, -1, -1):
                      yield (byte >> shift) & 1


          def file_state_statistics(data: bytes) -> dict[str, Any]:
              state_counts = [0] * 8
              symbol_counts = Counter()
              family_counts = Counter()
              case_counts = Counter()
              bit_buffer = 0
              bit_count = 0

              def record_state(state: int) -> None:
                  state_counts[state] += 1
                  key = f"{state:03b}"
                  symbol = PAIR_SYMBOL_BY_BITS[key]
                  symbol_counts[symbol] += 1
                  family_counts[PAIR_FAMILY_BY_BITS[key]] += 1
                  case_counts[PAIR_CASE_BY_BITS[key]] += 1

              for byte in data:
                  bit_buffer = (bit_buffer << 8) | byte
                  bit_count += 8
                  while bit_count >= 3:
                      shift = bit_count - 3
                      state = (bit_buffer >> shift) & 7
                      record_state(state)
                      bit_count -= 3
                      bit_buffer &= (1 << bit_count) - 1 if bit_count else 0

              if bit_count:
                  state = (bit_buffer << (3 - bit_count)) & 7
                  record_state(state)

              dominant_symbol = (
                  max(PAIR_SYMBOL_ORDER, key=lambda symbol: symbol_counts[symbol])
                  if sum(symbol_counts.values())
                  else "A"
              )
              return {
                  "stateCounts": {f"{state:03b}": state_counts[state] for state in range(8)},
                  "symbolCounts": {
                      symbol: symbol_counts[symbol]
                      for symbol in PAIR_SYMBOL_ORDER
                  },
                  "pairFamilyCounts": {
                      family: family_counts[family]
                      for family in "ABCD"
                  },
                  "pairCaseCounts": {
                      case: case_counts[case]
                      for case in ("uppercase", "lowercase")
                  },
                  "dominantSymbol": dominant_symbol,
              }


          def build_dependency_graph(
              repo_root: Path,
              files: list[Path],
              all_code: dict[str, Path],
              excluded_reasons: dict[str, str],
          ) -> tuple[
              dict[str, dict[str, Any]],
              dict[str, set[str]],
              list[dict[str, str]],
              list[dict[str, str]],
              list[dict[str, str]],
          ]:
              included = {path.relative_to(repo_root).as_posix() for path in files}
              graph = {key: set() for key in included}
              records: dict[str, dict[str, Any]] = {}
              unresolved: list[dict[str, str]] = []
              excluded_dependencies: list[dict[str, str]] = []
              external_imports: list[dict[str, str]] = []

              for path in files:
                  relative_path = path.relative_to(repo_root).as_posix()
                  data = path.read_bytes()
                  text = data.decode("utf-8", errors="replace")
                  exports = runtime_exports(text)
                  states = file_state_statistics(data)
                  records[relative_path] = {
                      "path": relative_path,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "runtimeExports": exports,
                      "runtimeExportCount": len(exports),
                      "dominantSymbol": states["dominantSymbol"],
                      "stateCounts": states["stateCounts"],
                      "symbolCounts": states["symbolCounts"],
                      "pairFamilyCounts": states["pairFamilyCounts"],
                      "pairCaseCounts": states["pairCaseCounts"],
                      "extension": path.suffix.lower(),
                  }

                  for ref in runtime_import_refs(text):
                      if ref["typeOnly"]:
                          continue
                      specifier = ref["specifier"]
                      target = resolve_internal_specifier(repo_root, path, specifier, all_code)
                      if target is None:
                          if specifier.startswith((".", "@/", "~/")) or any(
                              specifier == root or specifier.startswith(root + "/") for root in APP_ROOTS
                          ):
                              unresolved.append(
                                  {
                                      "source": relative_path,
                                      "specifier": specifier,
                                      "kind": ref["kind"],
                                  }
                              )
                          else:
                              external_imports.append(
                                  {
                                      "source": relative_path,
                                      "specifier": specifier,
                                      "kind": ref["kind"],
                                  }
                              )
                          continue

                      targets = (
                          barrel_runtime_leaves(repo_root, target, all_code)
                          if target.stem.lower() == "index"
                          else {target}
                      )
                      for leaf in targets:
                          key = leaf.relative_to(repo_root).as_posix()
                          if key in included:
                              graph[relative_path].add(key)
                          elif key in excluded_reasons:
                              excluded_dependencies.append(
                                  {
                                      "source": relative_path,
                                      "specifier": specifier,
                                      "target": key,
                                      "reason": excluded_reasons[key],
                                  }
                              )

              incoming = Counter(target for targets in graph.values() for target in targets)
              for path, record in records.items():
                  record["fanIn"] = incoming[path]
                  record["fanOut"] = len(graph[path])
                  record["internalImports"] = sorted(graph[path])

              return records, graph, unresolved, excluded_dependencies, external_imports


          def record_score(record: dict[str, Any]) -> tuple[int, int, int, int, str]:
              return (
                  record["runtimeExportCount"],
                  record["fanIn"] + record["fanOut"],
                  record["fanIn"],
                  record["bytes"],
                  record["path"],
              )


          def dependency_traversal(
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
          ) -> tuple[str, list[str], list[dict[str, Any]], dict[str, int], dict[str, int]]:
              if not records:
                  raise BuildError("No runtime application files remained after filtering.")

              reverse = defaultdict(set)
              for source, targets in graph.items():
                  for target in targets:
                      reverse[target].add(source)

              root = max(records, key=lambda path: record_score(records[path]))
              visited: set[str] = set()
              order: list[str] = []
              islands: list[dict[str, Any]] = []
              depths: dict[str, int] = {}
              island_index_by_path: dict[str, int] = {}

              def walk(seed: str, island_index: int) -> None:
                  queue = deque([(seed, 0)])
                  count = 0
                  while queue:
                      node, depth = queue.popleft()
                      if node in visited:
                          continue
                      visited.add(node)
                      order.append(node)
                      depths[node] = depth
                      island_index_by_path[node] = island_index
                      count += 1

                      neighbors = (graph[node] | reverse[node]) - visited
                      ranked = sorted(
                          neighbors,
                          key=lambda item: record_score(records[item]),
                          reverse=True,
                      )
                      queue.extend((neighbor, depth + 1) for neighbor in ranked)

                  islands.append({"index": island_index, "root": seed, "fileCount": count})

              walk(root, 0)
              while len(visited) < len(records):
                  seed = max(
                      (path for path in records if path not in visited),
                      key=lambda path: record_score(records[path]),
                  )
                  walk(seed, len(islands))

              return root, order, islands, depths, island_index_by_path


          def pascal_rows_for_cell_count(cell_count: int) -> int:
              if cell_count <= 1:
                  return 1
              return math.ceil((math.sqrt(8 * cell_count + 1) - 1) / 2)


          def group_to_key(group_bits: list[int]) -> str:
              padded = (group_bits + [0, 0, 0])[:3]
              return "".join(str(bit) for bit in padded)


          def saturating_value(x: float, n: float, a0: float) -> float:
              if x < 0:
                  raise ValueError("x must be nonnegative")
              if n <= 0:
                  raise ValueError("n must be positive")
              return a0 * x / ((1.0 + x**n) ** (1.0 / n))


          def normalized_saturation(x: float, n: float, a0: float) -> float:
              return saturating_value(x=x, n=n, a0=a0) / a0


          def relative_pascal_row_weights(row: int) -> list[float]:
              weights = [0.0] * (row + 1)
              peak = row // 2
              weights[peak] = 1.0
              for col in range(peak - 1, -1, -1):
                  weights[col] = weights[col + 1] * ((col + 1) / (row - col))
              for col in range(peak + 1, row + 1):
                  weights[col] = weights[col - 1] * ((row - col + 1) / col)
              return weights


          def palette_image(
              size: tuple[int, int],
              indices: bytes,
              colors: list[tuple[int, int, int]],
          ) -> Image.Image:
              image = Image.frombytes("P", size, indices)
              palette: list[int] = []
              for color in colors:
                  palette.extend(color)
              while len(palette) < 256 * 3:
                  palette.extend((0, 0, 0))
              image.putpalette(palette[: 256 * 3])
              image.info["transparency"] = TRANSPARENT_INDEX
              return image


          def grayscale_palette_image(size: tuple[int, int], indices: bytes) -> Image.Image:
              image = Image.frombytes("P", size, indices)
              palette: list[int] = []
              for value in range(255):
                  palette.extend((value, value, value))
              palette.extend((0, 0, 0))
              image.putpalette(palette)
              image.info["transparency"] = TRANSPARENT_INDEX
              return image


          def load_font(size: int, bold: bool = False):
              candidates = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
                  if bold
                  else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
                  if bold
                  else "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
              ]
              for candidate in candidates:
                  if Path(candidate).exists():
                      return ImageFont.truetype(candidate, size=size)
              return ImageFont.load_default()


          def compressed_manifest_text(manifest: dict[str, Any]) -> str:
              raw = json.dumps(manifest, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              return base64.b64encode(zlib.compress(raw, level=9)).decode("ascii")


          def manifest_from_image(image: Image.Image) -> dict[str, Any]:
              encoded = image.info.get(MANIFEST_INFO_KEY)
              if not isinstance(encoded, str) or not encoded:
                  raise BuildError(f"PNG is missing embedded manifest key {MANIFEST_INFO_KEY!r}.")
              raw = zlib.decompress(base64.b64decode(encoded.encode("ascii")))
              return json.loads(raw.decode("utf-8"))


          def save_png_with_manifest(image: Image.Image, path: Path, manifest: dict[str, Any]) -> None:
              png_info = PngImagePlugin.PngInfo()
              png_info.add_text(MANIFEST_INFO_KEY, compressed_manifest_text(manifest), zip=True)
              image.save(path, "PNG", compress_level=6, pnginfo=png_info)


          def safe_tile_cell_span(cell_size: int, max_dimension: int, max_tile_pixels: int) -> int:
              by_dimension = max(1, max_dimension // cell_size)
              by_pixels = max(1, int(math.sqrt(max_tile_pixels)) // cell_size)
              return max(1, min(by_dimension, by_pixels))


          def save_visible_tiles(
              image: Image.Image,
              stem: str,
              cell_size: int,
              max_dimension: int,
              max_tile_pixels: int,
          ) -> list[str]:
              destination = TILES_DIR / stem
              destination.mkdir(parents=True, exist_ok=True)
              logical_width, logical_height = image.size
              tile_cells = safe_tile_cell_span(cell_size, max_dimension, max_tile_pixels)
              output_paths: list[str] = []

              for tile_row, y0 in enumerate(range(0, logical_height, tile_cells)):
                  for tile_col, x0 in enumerate(range(0, logical_width, tile_cells)):
                      x1 = min(logical_width, x0 + tile_cells)
                      y1 = min(logical_height, y0 + tile_cells)
                      logical_tile = image.crop((x0, y0, x1, y1))
                      visible_tile = logical_tile.resize(
                          ((x1 - x0) * cell_size, (y1 - y0) * cell_size),
                          Image.Resampling.NEAREST,
                      )
                      path = destination / f"{stem}_r{tile_row:03d}_c{tile_col:03d}.png"
                      visible_tile.save(path, "PNG", compress_level=6)
                      output_paths.append(path.as_posix())

              return output_paths


          def fit_on_white(image: Image.Image, max_width: int, max_height: int) -> Image.Image:
              rgba = image.convert("RGBA")
              scale = min(max_width / rgba.width, max_height / rgba.height)
              new_size = (max(1, int(rgba.width * scale)), max(1, int(rgba.height * scale)))
              rgba = rgba.resize(new_size, Image.Resampling.NEAREST)
              white = Image.new("RGBA", new_size, (255, 255, 255, 255))
              white.alpha_composite(rgba)
              return white.convert("RGB")


          def build_file_manifest(
              repo_root: Path,
              order: list[str],
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
              root: str,
              islands: list[dict[str, Any]],
              depths: dict[str, int],
              island_index_by_path: dict[str, int],
          ) -> dict[str, Any]:
              files: list[dict[str, Any]] = []
              byte_offset = 0

              for traversal_index, relative_path in enumerate(order):
                  record = records[relative_path]
                  byte_length = record["bytes"]
                  bit_offset = byte_offset * 8
                  bit_length = byte_length * 8
                  files.append(
                      {
                          "path": relative_path,
                          "traversalIndex": traversal_index,
                          "islandIndex": island_index_by_path[relative_path],
                          "depth": depths[relative_path],
                          "byteOffset": byte_offset,
                          "byteLength": byte_length,
                          "bitOffset": bit_offset,
                          "bitLength": bit_length,
                          "startCell": bit_offset // 3,
                          "endCellExclusive": math.ceil((bit_offset + bit_length) / 3),
                          "sha256": record["sha256"],
                          "runtimeExports": record["runtimeExports"],
                          "runtimeExportCount": record["runtimeExportCount"],
                          "fanIn": record["fanIn"],
                          "fanOut": record["fanOut"],
                          "internalImports": sorted(graph[relative_path]),
                      }
                  )
                  byte_offset += byte_length

              source_bits = byte_offset * 8
              group_count = math.ceil(source_bits / 3) if source_bits else 1
              rows = pascal_rows_for_cell_count(group_count)
              return {
                  "format": FORMAT_NAME,
                  "manifestVersion": 5,
                  "source": {
                      "rootFile": root,
                      "rootRule": (
                          "highest runtime-export count; dependency degree, fan-in, byte size, "
                          "and path are deterministic tie-breakers"
                      ),
                      "traversal": (
                          "dependency graph breadth-first traversal using both imports and importers; "
                          "each disconnected island starts from the strongest remaining runtime file"
                      ),
                      "applicationRoots": APP_ROOTS,
                      "extensions": sorted(CODE_EXTENSIONS),
                      "fileCount": len(files),
                      "totalBytes": byte_offset,
                      "sourceBits": source_bits,
                      "groupCount": group_count,
                      "pascalRows": rows,
                      "paddingBitsInFinalCell": group_count * 3 - source_bits,
                      "islands": islands,
                      "files": files,
                  },
                  "encoding": {
                      "bitsPerCell": 3,
                      "bytesPerCell": 0.375,
                      "bitOrder": "MSB-first",
                      "cellOrder": "centered Pascal rows from row 0 through final row, left to right",
                      "stateOrder": STATE_KEYS,
                      "symbolOrder": PAIR_SYMBOL_ORDER,
                      "states": {
                          key: {
                              "symbol": PAIR_SYMBOL_BY_BITS[key],
                              "rgb": list(RGB_BY_BITS[key]),
                          }
                          for key in STATE_KEYS
                      },
                      "symbols": {
                          symbol: BITS_BY_PAIR_SYMBOL[symbol]
                          for symbol in PAIR_SYMBOL_ORDER
                      },
                      "derivedPairFamilyByBits": PAIR_FAMILY_BY_BITS,
                      "derivedPairCaseByBits": PAIR_CASE_BY_BITS,
                      "reconstruction": "each pair symbol is the exact 3-bit source state",
                  },
              }


          def render_pascal_layers(
              repo_root: Path,
              order: list[str],
              manifest: dict[str, Any],
              cell_size: int,
              max_png_dimension: int,
              max_tile_pixels: int,
              saturation_n: float,
              saturation_a0: float,
              pascal_gain: float,
          ) -> dict[str, Any]:
              source_bits = manifest["source"]["sourceBits"]
              group_count = manifest["source"]["groupCount"]
              rows = manifest["source"]["pascalRows"]
              pixel_count = rows * rows

              state_index_data = bytearray([TRANSPARENT_INDEX]) * pixel_count
              symbol_index_data = bytearray([TRANSPARENT_INDEX]) * pixel_count
              saturation_data = bytearray([TRANSPARENT_INDEX]) * pixel_count

              group_bits: list[int] = []
              row = 0
              col = 0
              emitted = 0

              def emit_group(bits: list[int]) -> None:
                  nonlocal row, col, emitted
                  key = group_to_key(bits)
                  x_cell = ((rows - (row + 1)) // 2) + col
                  offset = row * rows + x_cell
                  state_index_data[offset] = STATE_INDEX[key]
                  symbol = PAIR_SYMBOL_BY_BITS[key]
                  symbol_index_data[offset] = PAIR_SYMBOL_INDEX[symbol]
                  emitted += 1
                  if col == row:
                      row += 1
                      col = 0
                  else:
                      col += 1

              for relative_path in order:
                  for bit in bits_from_bytes((repo_root / relative_path).read_bytes()):
                      group_bits.append(bit)
                      if len(group_bits) == 3:
                          emit_group(group_bits)
                          group_bits = []

              valid_bits_in_final_cell = 3
              if group_bits:
                  valid_bits_in_final_cell = len(group_bits)
                  emit_group(group_bits)

              if emitted != group_count:
                  raise BuildError(f"Encoded {emitted} cells but expected {group_count}.")

              for row_index in range(rows):
                  weights = relative_pascal_row_weights(row_index)
                  left = (rows - (row_index + 1)) // 2
                  for col_index, weight in enumerate(weights):
                      offset = row_index * rows + left + col_index
                      if state_index_data[offset] == TRANSPARENT_INDEX:
                          continue
                      x_value = pascal_gain * weight
                      value = round(
                          254
                          * normalized_saturation(
                              x=x_value,
                              n=saturation_n,
                              a0=saturation_a0,
                          )
                      )
                      saturation_data[offset] = max(0, min(254, value))

              exact_image = palette_image(
                  (rows, rows),
                  bytes(state_index_data),
                  [RGB_BY_BITS[key] for key in STATE_KEYS],
              )
              symbol_image = palette_image(
                  (rows, rows),
                  bytes(symbol_index_data),
                  [
                      PAIR_SYMBOL_COLORS[symbol]
                      for symbol in PAIR_SYMBOL_ORDER
                  ],
              )
              saturation_image = grayscale_palette_image((rows, rows), bytes(saturation_data))

              exact_path = RENDER_DIR / "APP_CODE_PASCAL_3BIT_EXACT.png"
              symbol_path = RENDER_DIR / "APP_CODE_PASCAL_PAIR_SYMBOL.png"
              saturation_path = RENDER_DIR / "APP_CODE_PASCAL_SATURATION_FIELD.png"

              save_png_with_manifest(exact_image, exact_path, manifest)
              save_png_with_manifest(symbol_image, symbol_path, manifest)
              save_png_with_manifest(saturation_image, saturation_path, manifest)

              exact_tiles = save_visible_tiles(
                  exact_image,
                  "EXACT",
                  cell_size,
                  max_png_dimension,
                  max_tile_pixels,
              )
              symbol_tiles = save_visible_tiles(
                  symbol_image,
                  "PAIR_SYMBOL",
                  cell_size,
                  max_png_dimension,
                  max_tile_pixels,
              )
              saturation_tiles = save_visible_tiles(
                  saturation_image,
                  "SATURATION",
                  cell_size,
                  max_png_dimension,
                  max_tile_pixels,
              )

              return {
                  "exactImage": exact_image,
                  "symbolImage": symbol_image,
                  "saturationImage": saturation_image,
                  "stateIndexData": state_index_data,
                  "symbolIndexData": symbol_index_data,
                  "saturationData": saturation_data,
                  "validBitsInFinalCell": valid_bits_in_final_cell,
                  "paths": {
                      "exact": exact_path,
                      "symbol": symbol_path,
                      "saturation": saturation_path,
                  },
                  "tiles": {
                      "exact": exact_tiles,
                      "symbol": symbol_tiles,
                      "saturation": saturation_tiles,
                  },
              }


          def strongly_connected_components(graph: dict[str, set[str]]) -> list[list[str]]:
              index = 0
              stack: list[str] = []
              on_stack: set[str] = set()
              indices: dict[str, int] = {}
              low_links: dict[str, int] = {}
              components: list[list[str]] = []

              def visit(node: str) -> None:
                  nonlocal index
                  indices[node] = index
                  low_links[node] = index
                  index += 1
                  stack.append(node)
                  on_stack.add(node)

                  for target in graph[node]:
                      if target not in indices:
                          visit(target)
                          low_links[node] = min(low_links[node], low_links[target])
                      elif target in on_stack:
                          low_links[node] = min(low_links[node], indices[target])

                  if low_links[node] != indices[node]:
                      return

                  component: list[str] = []
                  while True:
                      target = stack.pop()
                      on_stack.remove(target)
                      component.append(target)
                      if target == node:
                          break

                  if len(component) > 1 or node in graph[node]:
                      components.append(sorted(component))

              for node in graph:
                  if node not in indices:
                      visit(node)

              return sorted(components, key=lambda component: (-len(component), component))


          def repository_layout(
              records: dict[str, dict[str, Any]],
              islands: list[dict[str, Any]],
              depths: dict[str, int],
              island_index_by_path: dict[str, int],
              canvas_size: int,
          ) -> dict[str, tuple[float, float]]:
              center = canvas_size / 2
              by_island: dict[int, list[str]] = defaultdict(list)
              for path, island_index in island_index_by_path.items():
                  by_island[island_index].append(path)

              positions: dict[str, tuple[float, float]] = {}
              island_count = len(islands)

              for island_index, nodes in sorted(by_island.items()):
                  if island_index == 0:
                      island_center = (center, center)
                      island_radius = canvas_size * 0.38
                  else:
                      angle = 2 * math.pi * (island_index - 1) / max(1, island_count - 1)
                      island_center = (
                          center + math.cos(angle) * canvas_size * 0.38,
                          center + math.sin(angle) * canvas_size * 0.38,
                      )
                      island_radius = max(70.0, canvas_size * 0.085)

                  levels: dict[int, list[str]] = defaultdict(list)
                  for node in nodes:
                      levels[depths.get(node, 0)].append(node)
                  max_depth = max(levels) if levels else 0

                  for depth, level_nodes in sorted(levels.items()):
                      ranked = sorted(level_nodes, key=lambda item: record_score(records[item]), reverse=True)
                      radius = 0.0 if depth == 0 else island_radius * depth / max(1, max_depth)
                      for item_index, node in enumerate(ranked):
                          angle = 2 * math.pi * item_index / max(1, len(ranked))
                          angle += (depth % 2) * math.pi / max(1, len(ranked))
                          positions[node] = (
                              island_center[0] + math.cos(angle) * radius,
                              island_center[1] + math.sin(angle) * radius,
                          )

              return positions


          def render_repository_shape(
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
              root: str,
              islands: list[dict[str, Any]],
              depths: dict[str, int],
              island_index_by_path: dict[str, int],
          ) -> Path:
              canvas_size = 4000
              positions = repository_layout(
                  records,
                  islands,
                  depths,
                  island_index_by_path,
                  canvas_size,
              )
              image = Image.new("RGB", (canvas_size, canvas_size), (9, 11, 18))
              draw = ImageDraw.Draw(image)

              for source, targets in graph.items():
                  source_position = positions.get(source)
                  if source_position is None:
                      continue
                  for target in targets:
                      target_position = positions.get(target)
                      if target_position is None:
                          continue
                      draw.line((*source_position, *target_position), fill=(55, 64, 86), width=1)

              label_paths = {root}
              label_paths.update(
                  sorted(records, key=lambda path: record_score(records[path]), reverse=True)[:80]
              )
              small_font = load_font(14)
              title_font = load_font(34, True)
              subtitle_font = load_font(18)

              for path, (x_position, y_position) in positions.items():
                  record = records[path]
                  radius = max(
                      3,
                      min(
                          26,
                          3
                          + math.sqrt(max(1, record["bytes"])) / 70
                          + record["runtimeExportCount"] * 0.8
                          + math.sqrt(record["fanIn"] + record["fanOut"]),
                      ),
                  )
                  color = PAIR_SYMBOL_COLORS[record["dominantSymbol"]]
                  outline = (255, 255, 255) if path == root else (175, 183, 205)
                  draw.ellipse(
                      (
                          x_position - radius,
                          y_position - radius,
                          x_position + radius,
                          y_position + radius,
                      ),
                      fill=color,
                      outline=outline,
                      width=3 if path == root else 1,
                  )

                  if path in label_paths:
                      draw.text(
                          (x_position + radius + 3, y_position - 7),
                          Path(path).name[:44],
                          fill=(235, 240, 255),
                          font=small_font,
                      )

              draw.text(
                  (45, 35),
                  "DREAM Repository-Native Runtime Shape",
                  fill=(245, 247, 255),
                  font=title_font,
              )
              draw.text(
                  (45, 82),
                  f"Root: {root} | Files: {len(records)} | Edges: {sum(len(v) for v in graph.values())}",
                  fill=(205, 218, 245),
                  font=subtitle_font,
              )

              output_path = RENDER_DIR / "REPO_NATIVE_RUNTIME_SHAPE.png"
              image.save(output_path, "PNG", compress_level=6)

              dot_lines = ["digraph DREAM_RUNTIME {", "  overlap=false;", "  splines=true;"]
              for path, record in records.items():
                  label = f"{Path(path).name}\\nexports={record['runtimeExportCount']} in={record['fanIn']} out={record['fanOut']}"
                  dot_lines.append(f"  {json.dumps(path)} [label={json.dumps(label)}];")
              for source, targets in graph.items():
                  for target in sorted(targets):
                      dot_lines.append(f"  {json.dumps(source)} -> {json.dumps(target)};")
              dot_lines.append("}")
              write_text(ANALYSIS_DIR / "REPO_NATIVE_RUNTIME_SHAPE.dot", "\n".join(dot_lines) + "\n")

              return output_path


          def decoder_source() -> str:
              return r'''from __future__ import annotations

          import argparse
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          from PIL import Image

          MANIFEST_INFO_KEY = "dreamengin_manifest_zlib_base64_v5"
          SYMBOL_INDEX_BY_STATE = (0, 2, 6, 4, 3, 7, 5, 1)


          def manifest_from_image(image: Image.Image) -> dict:
              encoded = image.info.get(MANIFEST_INFO_KEY)
              if not isinstance(encoded, str) or not encoded:
                  raise ValueError(f"Missing embedded manifest: {MANIFEST_INFO_KEY}")
              raw = zlib.decompress(base64.b64decode(encoded.encode("ascii")))
              return json.loads(raw.decode("utf-8"))


          def iter_pascal_states(image: Image.Image, cell_count: int, rows: int):
              if image.mode != "P":
                  raise ValueError("Exact image must remain an indexed PNG in mode P.")
              if image.size != (rows, rows):
                  raise ValueError(f"Expected image size {(rows, rows)}, found {image.size}.")

              pixels = image.load()
              emitted = 0
              for row in range(rows):
                  left = (rows - (row + 1)) // 2
                  for col in range(row + 1):
                      if emitted >= cell_count:
                          return
                      value = pixels[left + col, row]
                      if value < 0 or value > 7:
                          raise ValueError(
                              f"Invalid exact-state palette index {value} at row={row}, col={col}."
                          )
                      yield value
                      emitted += 1

              if emitted != cell_count:
                  raise ValueError(f"Read {emitted} cells but expected {cell_count}.")


          def decode_stream(states, source_bits: int) -> bytes:
              output = bytearray()
              accumulator = 0
              accumulator_bits = 0
              consumed_bits = 0

              for state in states:
                  remaining = source_bits - consumed_bits
                  if remaining <= 0:
                      break
                  valid_bits = min(3, remaining)
                  value = state >> (3 - valid_bits)
                  accumulator = (accumulator << valid_bits) | value
                  accumulator_bits += valid_bits
                  consumed_bits += valid_bits

                  while accumulator_bits >= 8:
                      shift = accumulator_bits - 8
                      output.append((accumulator >> shift) & 0xFF)
                      accumulator_bits -= 8
                      accumulator &= (1 << accumulator_bits) - 1 if accumulator_bits else 0

              if consumed_bits != source_bits:
                  raise ValueError(f"Decoded {consumed_bits} bits but expected {source_bits}.")
              if accumulator_bits != 0:
                  raise ValueError(f"Decoder ended with {accumulator_bits} unflushed bits.")
              return bytes(output)


          def cross_check_symbol_layer(exact_states, symbol_path: Path | None, rows: int):
              result = {
                  "symbolLayerChecked": False,
                  "symbolMismatches": 0,
              }
              states = list(exact_states)

              if symbol_path and symbol_path.exists():
                  image = Image.open(symbol_path)
                  if image.mode != "P":
                      raise ValueError("Symbol image must remain an indexed PNG in mode P.")
                  if image.size != (rows, rows):
                      raise ValueError(f"Expected symbol image size {(rows, rows)}, found {image.size}.")
                  pixels = image.load()
                  result["symbolLayerChecked"] = True
                  index = 0
                  for row in range(rows):
                      left = (rows - (row + 1)) // 2
                      for col in range(row + 1):
                          if index >= len(states):
                              break
                          expected = SYMBOL_INDEX_BY_STATE[states[index]]
                          if pixels[left + col, row] != expected:
                              result["symbolMismatches"] += 1
                          index += 1

              return result


          def decode(exact_path: Path, output_root: Path, symbol_path: Path | None = None) -> dict:
              exact_image = Image.open(exact_path)
              manifest = manifest_from_image(exact_image)
              source = manifest["source"]
              states = list(iter_pascal_states(exact_image, source["groupCount"], source["pascalRows"]))
              stream = decode_stream(iter(states), source["sourceBits"])

              if len(stream) != source["totalBytes"]:
                  raise ValueError(
                      f"Decoded {len(stream)} bytes but manifest expects {source['totalBytes']}."
                  )

              output_root.mkdir(parents=True, exist_ok=True)
              safe_root = output_root.resolve()
              results = []

              for item in source["files"]:
                  start = int(item["byteOffset"])
                  end = start + int(item["byteLength"])
                  data = stream[start:end]
                  destination = (output_root / item["path"]).resolve()
                  if destination != safe_root and safe_root not in destination.parents:
                      raise ValueError(f"Unsafe path in embedded manifest: {item['path']}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  actual_hash = hashlib.sha256(data).hexdigest()
                  results.append(
                      {
                          "path": item["path"],
                          "expectedBytes": item["byteLength"],
                          "decodedBytes": len(data),
                          "expectedSha256": item["sha256"],
                          "decodedSha256": actual_hash,
                          "exactMatch": len(data) == item["byteLength"] and actual_hash == item["sha256"],
                      }
                  )

              layer_check = cross_check_symbol_layer(states, symbol_path, source["pascalRows"])
              all_exact = all(item["exactMatch"] for item in results)
              all_layers_exact = layer_check["symbolMismatches"] == 0

              return {
                  "format": manifest.get("format"),
                  "rootFile": source.get("rootFile"),
                  "sourceBits": source["sourceBits"],
                  "decodedBytes": len(stream),
                  "fileCount": len(results),
                  "exactFileCount": sum(item["exactMatch"] for item in results),
                  "allFilesExact": all_exact,
                  "layerCrossCheck": layer_check,
                  "allLayersExact": all_layers_exact,
                  "allExact": all_exact and all_layers_exact,
                  "files": results,
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("exact_image", type=Path)
              parser.add_argument("output_root", type=Path)
              parser.add_argument("--symbol-image", type=Path)
              parser.add_argument("--report", type=Path)
              arguments = parser.parse_args()

              result = decode(
                  arguments.exact_image,
                  arguments.output_root,
                  arguments.symbol_image,
              )
              text = json.dumps(result, indent=2)
              print(text)
              if arguments.report:
                  arguments.report.parent.mkdir(parents=True, exist_ok=True)
                  arguments.report.write_text(text + "\n", encoding="utf-8")
              return 0 if result["allExact"] else 2


          if __name__ == "__main__":
              raise SystemExit(main())
          '''


          def run_decoder_in_process(
              exact_path: Path,
              symbol_path: Path,
          ) -> dict[str, Any]:
              source = decoder_source()
              decoder_path = DECODER_DIR / "decode_from_image.py"
              write_text(decoder_path, source)
              namespace: dict[str, Any] = {}
              exec(compile(source, str(decoder_path), "exec"), namespace)
              result = namespace["decode"](
                  exact_path,
                  REBUILT_DIR,
                  symbol_path,
              )
              write_json(DECODER_DIR / "IMAGE_TO_CODE_VERIFICATION.json", result)

              lines = [
