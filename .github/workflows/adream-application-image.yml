              )
              path = (
                  Path(
                      "/usr/share/fonts/"
                      "truetype/dejavu"
                  )
                  / name
              )

              return (
                  ImageFont.truetype(
                      path,
                      size,
                  )
                  if path.exists()
                  else ImageFont.load_default()
              )


