      - name: Run project checks and capture exit codes
        id: checks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="dream-application-image/Diagnostics/ProjectChecks"
          mkdir -p "$OUT"

          if [ ! -f package.json ]; then
            printf '%s\n' \
              '{"packageManager":null,"install":null,"scripts":{}}' \
              > "$OUT/SUMMARY.json"
            exit 0
          fi

          PM="npm"
          if [ -f pnpm-lock.yaml ]; then
            PM="pnpm"
            corepack enable
          fi
          if [ -f yarn.lock ]; then
            PM="yarn"
            corepack enable
          fi

          if [ "$PM" = "pnpm" ]; then
            timeout 30m pnpm install \
              --frozen-lockfile \
              --ignore-scripts \
              > "$OUT/INSTALL.log" 2>&1
          elif [ "$PM" = "yarn" ]; then
            timeout 30m yarn install \
              --immutable \
              --ignore-scripts \
              > "$OUT/INSTALL.log" 2>&1
          elif [ -f package-lock.json ]; then
            timeout 30m npm ci \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              > "$OUT/INSTALL.log" 2>&1
          else
            timeout 30m npm install \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              > "$OUT/INSTALL.log" 2>&1
          fi
          INSTALL=$?

          printf \
            '{"packageManager":"%s","install":%s,"scripts":{}}\n' \
            "$PM" "$INSTALL" \
            > "$OUT/SUMMARY.json"

          for SCRIPT in typecheck lint test build; do
            node -e \
              "const p=require('./package.json');process.exit(p.scripts&&p.scripts[process.argv[1]]?0:1)" \
              "$SCRIPT"

            if [ "$?" -ne 0 ] || [ "$INSTALL" -ne 0 ]; then
              CODE=null
            else
              timeout 30m "$PM" run "$SCRIPT" \
                > "$OUT/${SCRIPT^^}.log" 2>&1
              CODE=$?
            fi

            python - "$OUT/SUMMARY.json" "$SCRIPT" "$CODE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )
          data["scripts"][sys.argv[2]] = (
              None
              if sys.argv[3] == "null"
              else int(sys.argv[3])
          )
          path.write_text(
              json.dumps(
                  data,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          done

          exit 0

