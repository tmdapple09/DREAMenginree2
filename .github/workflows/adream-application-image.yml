                  f"- Complete round trip exact: **{result['allExact']}**",
                  "",
                  "The decoder reads the generated Pascal exact-state PNG, recovers the",
                  "continuous MSB-first 3-bit stream, trims only the recorded final padding,",
                  "splits the byte stream using the manifest embedded in the PNG, rebuilds every",
