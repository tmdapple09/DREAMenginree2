name: DREAM Repository Image and 4D Runtime Atlas
run-name: DREAM Repository Image and 4D Runtime Atlas

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-dream-repository-image:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout complete repository
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Set up Python
        id: python
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare outputs
        if: always()
        shell: bash
        run: |
          rm -rf dream-application-image dream-artifacts
          mkdir -p \
            dream-application-image/Rendering/RepositoryCells \
            dream-application-image/Decoder \
            dream-application-image/Data \
            dream-application-image/Metadata \
            dream-application-image/Analysis \
            dream-application-image/Health \
            dream-application-image/Diagnostics/ProjectChecks \
            dream-artifacts

      - name: Install Pillow
        id: pillow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" \
            > >(tee dream-application-image/Diagnostics/PILLOW_STDOUT.log) \
            2> >(tee dream-application-image/Diagnostics/PILLOW_STDERR.log >&2)
          printf '%s\n' "$?" > dream-application-image/Diagnostics/PILLOW_EXIT_CODE.txt
          exit 0

      - name: Build exact repository images and real diagnostics
        id: generator
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DREAM_IMAGE_MAX_DIMENSION: "12000"
        run: |
          set +e
          cat > "$RUNNER_TEMP/dream_repository_image.py" <<'PY'
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          import os
          import re
          import shutil
          import stat
          import struct
          import subprocess
          import sys
          import tempfile
          import traceback
          import zipfile
          import zlib
          from collections import Counter, defaultdict
          from pathlib import Path, PurePosixPath
          from typing import Iterable

          from PIL import Image, ImageDraw, ImageFont

          FORMAT = "dreamengin.repository-image.4d.v7"
          SHARDS = 16
          MAGIC = b"DRM4DV7\0"
          HEADER_NO_CRC = struct.Struct(">8sBBBBHHQQQQQ32s")
          HEADER = struct.Struct(">8sBBBBHHQQQQQ32sI")
          HEADER_STATES = math.ceil(HEADER.size * 8 / 3)
          TRANSPARENT = 255
          COLORS = [
              (0, 0, 0), (0, 0, 255), (0, 255, 0), (0, 255, 255),
              (255, 0, 0), (255, 0, 255), (255, 255, 0), (255, 255, 255),
          ]
          CODE_EXTENSIONS = {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"}
          IMPORT_RE = re.compile(
              r"(?:from\s+|import\s*\(|require\s*\()\s*['\"]([^'\"]+)['\"]"
          )
          TODO_RE = re.compile(
              r"\b(?:TODO|FIXME|HACK|XXX)\b",
              re.IGNORECASE,
          )


          class DreamError(RuntimeError):
              pass


          def write_json(path: Path, value) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )


          def write_text(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")


          def safe_path(value: str) -> PurePosixPath:
              path = PurePosixPath(value)
              if (
                  path.is_absolute()
                  or not path.parts
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise DreamError(
                      f"unsafe repository path: {value!r}"
                  )
              return path


          def git_bytes(*args: str) -> bytes:
              result = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if result.returncode:
                  raise DreamError(
                      result.stderr.decode("utf-8", "replace")
                  )
              return result.stdout


          def tracked_files(root: Path) -> list[str]:
              raw = git_bytes(
                  "ls-files",
                  "-z",
                  "--recurse-submodules",
              )
              paths = sorted(
                  {
                      item.decode(
                          "utf-8",
                          "surrogateescape",
                      )
                      for item in raw.split(b"\0")
                      if item
                  }
              )
              if not paths:
                  raise DreamError(
                      "no tracked files were found"
                  )
              for value in paths:
                  safe_path(value)
                  path = root / value
                  if (
                      not path.exists()
                      and not path.is_symlink()
                  ):
                      raise DreamError(
                          f"tracked path is missing: {value}"
                      )
              return paths


          def repository_manifest(
              root: Path,
              paths: list[str],
          ) -> dict:
              files = []
              offset = 0

              for value in paths:
                  path = root / value
                  info = path.lstat()

                  if stat.S_ISLNK(info.st_mode):
                      kind = "symlink"
                      data = os.readlink(path).encode(
                          "utf-8",
                          "surrogateescape",
                      )
                  elif stat.S_ISREG(info.st_mode):
                      kind = "file"
                      data = path.read_bytes()
                  else:
                      raise DreamError(
                          "unsupported tracked file type: "
                          f"{value}"
                      )

                  files.append(
                      {
                          "path": value,
                          "kind": kind,
                          "mode": stat.S_IMODE(
                              info.st_mode
                          ),
                          "length": len(data),
                          "sha256": hashlib.sha256(
                              data
                          ).hexdigest(),
                          "offset": offset,
                      }
                  )
                  offset += len(data)

              return {
                  "format": FORMAT,
                  "commit": git_bytes(
                      "rev-parse",
                      "HEAD",
                  ).decode("ascii").strip(),
                  "scope": (
                      "complete checked-out tracked "
                      "working tree; Git history is "
                      "not embedded"
                  ),
                  "fileCount": len(files),
                  "payloadBytes": offset,
                  "files": files,
              }


          def build_payload(
              root: Path,
              paths: list[str],
              manifest: dict,
              destination: Path,
          ) -> None:
              with zipfile.ZipFile(
                  destination,
                  "w",
                  compression=zipfile.ZIP_STORED,
                  allowZip64=True,
              ) as archive:
                  archive.writestr(
                      "DREAM_MANIFEST.json",
                      json.dumps(
                          manifest,
                          separators=(",", ":"),
                          sort_keys=True,
                      ),
                  )

                  for item in manifest["files"]:
                      path = root / item["path"]
                      info = zipfile.ZipInfo(
                          f"repository/{item['path']}"
                      )
                      info.date_time = (
                          1980,
                          1,
                          1,
                          0,
                          0,
                          0,
                      )
                      info.compress_type = (
                          zipfile.ZIP_STORED
                      )
                      info.create_system = 3

                      if item["kind"] == "symlink":
                          info.external_attr = (
                              stat.S_IFLNK
                              | item["mode"]
                          ) << 16
                          data = os.readlink(path).encode(
                              "utf-8",
                              "surrogateescape",
                          )
                      else:
                          info.external_attr = (
                              stat.S_IFREG
                              | item["mode"]
                          ) << 16
                          data = path.read_bytes()

                      archive.writestr(info, data)


          def byte_states(
              data: bytes,
              valid_bits: int | None = None,
          ) -> list[int]:
              bits = (
                  len(data) * 8
                  if valid_bits is None
                  else valid_bits
              )
              output = []
              accumulator = 0
              accumulator_bits = 0
              consumed = 0

              for byte in data:
                  take = min(
                      8,
                      bits - consumed,
                  )
                  if take <= 0:
                      break

                  accumulator = (
                      accumulator << take
                  ) | (
                      byte >> (8 - take)
                  )
                  accumulator_bits += take
                  consumed += take

                  while accumulator_bits >= 3:
                      shift = (
                          accumulator_bits - 3
                      )
                      output.append(
                          (
                              accumulator >> shift
                          )
                          & 7
                      )
                      accumulator_bits -= 3
                      accumulator &= (
                          (1 << accumulator_bits) - 1
                          if accumulator_bits
                          else 0
                      )

              if accumulator_bits:
                  output.append(
                      (
                          accumulator
                          << (
                              3
                              - accumulator_bits
                          )
                      )
                      & 7
                  )

              return output


          def states_bytes(
              states: Iterable[int],
              valid_bits: int,
          ) -> bytes:
              output = bytearray()
              accumulator = 0
              accumulator_bits = 0
              consumed = 0

              for state_value in states:
                  remaining = (
                      valid_bits - consumed
                  )
                  if remaining <= 0:
                      break

                  take = min(3, remaining)
                  accumulator = (
                      accumulator << take
                  ) | (
                      int(state_value)
                      >> (3 - take)
                  )
                  accumulator_bits += take
                  consumed += take

                  while accumulator_bits >= 8:
                      shift = (
                          accumulator_bits - 8
                      )
                      output.append(
                          (
                              accumulator >> shift
                          )
                          & 255
                      )
                      accumulator_bits -= 8
                      accumulator &= (
                          (1 << accumulator_bits) - 1
                          if accumulator_bits
                          else 0
                      )

              if (
                  consumed != valid_bits
                  or accumulator_bits
              ):
                  raise DreamError(
                      "invalid 3-bit state "
                      "stream length"
                  )

              return bytes(output)


          def split_states(
              payload: Path,
              temporary: Path,
          ) -> tuple[
              list[Path],
              list[int],
              int,
          ]:
              paths = [
                  temporary
                  / f"cell-{cell:02d}.states"
                  for cell in range(SHARDS)
              ]
              handles = [
                  path.open("wb")
                  for path in paths
              ]
              counts = [0] * SHARDS
              accumulator = 0
              accumulator_bits = 0
              state_index = 0

              try:
                  with payload.open("rb") as source:
                      while block := source.read(
                          1024 * 1024
                      ):
                          for byte in block:
                              accumulator = (
                                  accumulator << 8
                              ) | byte
                              accumulator_bits += 8

                              while (
                                  accumulator_bits
                                  >= 3
                              ):
                                  shift = (
                                      accumulator_bits
                                      - 3
                                  )
                                  value = (
                                      accumulator
                                      >> shift
                                  ) & 7
                                  cell = (
                                      state_index & 15
                                  )
                                  handles[cell].write(
                                      bytes((value,))
                                  )
                                  counts[cell] += 1
                                  state_index += 1
                                  accumulator_bits -= 3
                                  accumulator &= (
                                      (
                                          1
                                          << accumulator_bits
                                      )
                                      - 1
                                      if accumulator_bits
                                      else 0
                                  )

                  if accumulator_bits:
                      value = (
                          accumulator
                          << (
                              3
                              - accumulator_bits
                          )
                      ) & 7
                      cell = state_index & 15
                      handles[cell].write(
                          bytes((value,))
                      )
                      counts[cell] += 1
                      state_index += 1
              finally:
                  for handle in handles:
                      handle.close()

              return (
                  paths,
                  counts,
                  state_index,
              )


          def header_bytes(
              cell: int,
              page: int,
              pages: int,
              total_bits: int,
              total_states: int,
              shard_states: int,
              page_start: int,
              page_states: int,
              digest: bytes,
          ) -> bytes:
              raw = HEADER_NO_CRC.pack(
                  MAGIC,
                  7,
                  cell,
                  SHARDS,
                  0,
                  page,
                  pages,
                  total_bits,
                  total_states,
                  shard_states,
                  page_start,
                  page_states,
                  digest,
              )
              return raw + struct.pack(
                  ">I",
                  zlib.crc32(raw)
                  & 0xFFFFFFFF,
              )


          def palette_image(
              width: int,
              height: int,
              values: bytes,
          ) -> Image.Image:
              image = Image.frombytes(
                  "P",
                  (width, height),
                  values,
              )
              palette = []

              for color in COLORS:
                  palette.extend(color)

              while len(palette) < 768:
                  palette.extend(
                      (0, 0, 0)
                  )

              image.putpalette(
                  palette[:768]
              )
              image.info["transparency"] = (
                  TRANSPARENT
              )
              return image


          def save_images(
              state_paths: list[Path],
              counts: list[int],
              total_states: int,
              payload_bits: int,
              payload_digest: bytes,
              output: Path,
              max_dimension: int,
          ) -> list[dict]:
              output.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              max_page_states = (
                  max_dimension
                  * max_dimension
                  - HEADER_STATES
              )
              rows = []

              for (
                  cell,
                  state_path,
              ) in enumerate(state_paths):
                  page_count = max(
                      1,
                      math.ceil(
                          counts[cell]
                          / max_page_states
                      ),
                  )

                  with state_path.open(
                      "rb"
                  ) as handle:
                      for page in range(
                          page_count
                      ):
                          start = (
                              page
                              * max_page_states
                          )
                          data = handle.read(
                              max_page_states
                          )
                          header = byte_states(
                              header_bytes(
                                  cell,
                                  page,
                                  page_count,
                                  payload_bits,
                                  total_states,
                                  counts[cell],
                                  start,
                                  len(data),
                                  payload_digest,
                              )
                          )
                          values = (
                              header
                              + list(data)
                          )
                          side = math.ceil(
                              math.sqrt(
                                  len(values)
                              )
                          )
                          pixels = bytearray(
                              [TRANSPARENT]
                          ) * (
                              side * side
                          )
                          pixels[
                              : len(values)
                          ] = bytes(values)

                          path = (
                              output
                              / (
                                  f"cell-{cell:02d}"
                                  f"-page-{page:04d}"
                                  ".png"
                              )
                          )

                          palette_image(
                              side,
                              side,
                              bytes(pixels),
                          ).save(
                              path,
                              "PNG",
                              compress_level=6,
                          )

                          rows.append(
                              {
                                  "cell": cell,
                                  "bits": (
                                      f"{cell:04b}"
                                  ),
                                  "page": page,
                                  "pageCount": (
                                      page_count
                                  ),
                                  "states": len(data),
                                  "side": side,
                                  "path": (
                                      path.as_posix()
                                  ),
                                  "sha256": (
                                      hashlib.sha256(
                                          path.read_bytes()
                                      ).hexdigest()
                                  ),
                              }
                          )

              return rows


          def image_states(
              path: Path,
          ) -> list[int]:
              image = Image.open(path)

              if (
                  image.mode != "P"
                  or image.width
                  != image.height
              ):
                  raise DreamError(
                      "invalid repository image: "
                      f"{path}"
                  )

              states = []

              for value in image.getdata():
                  if value == TRANSPARENT:
                      break
                  if not 0 <= value <= 7:
                      raise DreamError(
                          f"invalid state in {path}"
                      )
                  states.append(value)

              return states


          def parse_header(
              states: list[int],
          ) -> dict:
              raw = states_bytes(
                  states[:HEADER_STATES],
                  HEADER.size * 8,
              )
              values = HEADER.unpack(raw)

              (
                  magic,
                  version,
                  cell,
                  shards,
                  flags,
                  page,
                  pages,
                  total_bits,
                  total_states,
                  shard_states,
                  page_start,
                  page_states,
                  digest,
                  crc,
              ) = values

              if (
                  magic != MAGIC
                  or version != 7
                  or shards != SHARDS
                  or flags != 0
              ):
                  raise DreamError(
                      "invalid repository "
                      "image header"
                  )

              if (
                  zlib.crc32(raw[:-4])
                  & 0xFFFFFFFF
                  != crc
              ):
                  raise DreamError(
                      "repository image "
                      "header CRC mismatch"
                  )

              return {
                  "cell": cell,
                  "page": page,
                  "pages": pages,
                  "totalBits": total_bits,
                  "totalStates": (
                      total_states
                  ),
                  "shardStates": (
                      shard_states
                  ),
                  "pageStart": page_start,
                  "pageStates": page_states,
                  "digest": digest,
              }


          def reconstruct_payload(
              image_dir: Path,
          ) -> bytes:
              pages: dict[
                  int,
                  dict[
                      int,
                      tuple[
                          dict,
                          list[int],
                      ],
                  ],
              ] = defaultdict(dict)
              common = None

              for path in sorted(
                  image_dir.glob(
                      "cell-??-page-????.png"
                  )
              ):
                  states = image_states(path)

                  if (
                      len(states)
                      < HEADER_STATES
                  ):
                      raise DreamError(
                          f"truncated header: {path}"
                      )

                  header = parse_header(states)
                  data = states[
                      HEADER_STATES:
                      HEADER_STATES
                      + header["pageStates"]
                  ]

                  if (
                      len(data)
                      != header["pageStates"]
                  ):
                      raise DreamError(
                          f"truncated data: {path}"
                      )

                  pages[
                      header["cell"]
                  ][
                      header["page"]
                  ] = (
                      header,
                      data,
                  )

                  signature = (
                      header["totalBits"],
                      header["totalStates"],
                      header["digest"],
                  )
                  common = (
                      signature
                      if common is None
                      else common
                  )

                  if signature != common:
                      raise DreamError(
                          "images belong to "
                          "different payloads"
                      )

              if set(pages) != set(
                  range(SHARDS)
              ):
                  raise DreamError(
                      "all 16 repository "
                      "cells are required"
                  )

              shards = []

              for cell in range(SHARDS):
                  first = pages[cell][0][0]

                  if (
                      set(pages[cell])
                      != set(
                          range(
                              first["pages"]
                          )
                      )
                  ):
                      raise DreamError(
                          "missing image page "
                          f"in cell {cell}"
                      )

                  combined = []

                  for page in range(
                      first["pages"]
                  ):
                      (
                          header,
                          data,
                      ) = pages[cell][page]

                      if (
                          header["pageStart"]
                          != len(combined)
                      ):
                          raise DreamError(
                              "non-contiguous pages "
                              f"in cell {cell}"
                          )

                      combined.extend(data)

                  if (
                      len(combined)
                      != first["shardStates"]
                  ):
                      raise DreamError(
                          "cell state count "
                          f"mismatch: {cell}"
                      )

                  shards.append(combined)

              (
                  total_bits,
                  total_states,
                  digest,
              ) = common
              cursors = [0] * SHARDS
              ordered = []

              for index in range(
                  total_states
              ):
                  cell = index & 15
                  ordered.append(
                      shards[cell][
                          cursors[cell]
                      ]
                  )
                  cursors[cell] += 1

              payload = states_bytes(
                  ordered,
                  total_bits,
              )

              if (
                  hashlib.sha256(
                      payload
                  ).digest()
                  != digest
              ):
                  raise DreamError(
                      "reconstructed payload "
                      "SHA-256 mismatch"
                  )

              return payload


          def extract_payload(
              payload: bytes,
              output: Path,
          ) -> dict:
              output.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              root = output.resolve()

              with tempfile.NamedTemporaryFile(
                  suffix=".zip"
              ) as handle:
                  handle.write(payload)
                  handle.flush()

                  with zipfile.ZipFile(
                      handle.name
                  ) as archive:
                      manifest = json.loads(
                          archive.read(
                              "DREAM_MANIFEST.json"
                          )
                      )
                      results = []

                      for item in manifest[
                          "files"
                      ]:
                          relative = safe_path(
                              item["path"]
                          )
                          destination = (
                              root
                              / Path(
                                  *relative.parts
                              )
                          ).resolve(
                              strict=False
                          )

                          if (
                              destination != root
                              and root
                              not in destination.parents
                          ):
                              raise DreamError(
                                  "unsafe output path: "
                                  f"{item['path']}"
                              )

                          data = archive.read(
                              "repository/"
                              f"{item['path']}"
                          )
                          exact = (
                              len(data)
                              == item["length"]
                              and hashlib.sha256(
                                  data
                              ).hexdigest()
                              == item["sha256"]
                          )

                          destination.parent.mkdir(
                              parents=True,
                              exist_ok=True,
                          )

                          if (
                              item["kind"]
                              == "symlink"
                          ):
                              if (
                                  destination.exists()
                                  or destination.is_symlink()
                              ):
                                  destination.unlink()

                              os.symlink(
                                  data.decode(
                                      "utf-8",
                                      "surrogateescape",
                                  ),
                                  destination,
                              )
                          else:
                              destination.write_bytes(
                                  data
                              )
                              os.chmod(
                                  destination,
                                  item["mode"],
                              )

                          results.append(
                              {
                                  "path": (
                                      item["path"]
                                  ),
                                  "exact": exact,
                              }
                          )

              return {
                  "format": manifest["format"],
                  "commit": manifest["commit"],
                  "fileCount": len(results),
                  "exactFileCount": sum(
                      item["exact"]
                      for item in results
                  ),
                  "allExact": all(
                      item["exact"]
                      for item in results
                  ),
                  "files": results,
              }


          def tesseract_integrity(
              state_paths: list[Path],
              image_rows: list[dict],
          ) -> dict:
              digests = [
                  hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
                  for path in state_paths
              ]

              def joined(
                  cells: Iterable[int],
              ) -> str:
                  hasher = hashlib.sha256()

                  for cell in cells:
                      hasher.update(
                          bytes.fromhex(
                              digests[cell]
                          )
                      )

                  return hasher.hexdigest()

              edges = []

              for axis in range(4):
                  bit = 1 << axis

                  for cell in range(16):
                      if not cell & bit:
                          edges.append(
                              {
                                  "axis": axis,
                                  "cells": [
                                      cell,
                                      cell | bit,
                                  ],
                                  "digest": joined(
                                      [
                                          cell,
                                          cell | bit,
                                      ]
                                  ),
                              }
                          )

              faces = []

              for first_axis in range(4):
                  for second_axis in range(
                      first_axis + 1,
                      4,
                  ):
                      mask = (
                          1 << first_axis
                      ) | (
                          1 << second_axis
                      )

                      for base in range(16):
                          if not base & mask:
                              cells = [
                                  base,
                                  base
                                  | (
                                      1
                                      << first_axis
                                  ),
                                  base
                                  | (
                                      1
                                      << second_axis
                                  ),
                                  base | mask,
                              ]
                              faces.append(
                                  {
                                      "axes": [
                                          first_axis,
                                          second_axis,
                                      ],
                                      "cells": cells,
                                      "digest": joined(
                                          cells
                                      ),
                                  }
                              )

              slices = []

              for axis in range(4):
                  for side in (0, 1):
                      cells = [
                          cell
                          for cell in range(16)
                          if int(
                              bool(
                                  cell
                                  & (
                                      1
                                      << axis
                                  )
                              )
                          )
                          == side
                      ]
                      slices.append(
                          {
                              "axis": axis,
                              "side": side,
                              "cells": cells,
                              "digest": joined(
                                  cells
                              ),
                          }
                      )

              return {
                  "format": FORMAT,
                  "cells": {
                      f"{cell:04b}": (
                          digests[cell]
                      )
                      for cell in range(16)
                  },
                  "edges": edges,
                  "faces": faces,
                  "slices": slices,
                  "whole": joined(
                      range(16)
                  ),
                  "images": image_rows,
              }


          def source_diagnostics(
              root: Path,
              manifest: dict,
          ) -> dict:
              paths = [
                  item["path"]
                  for item in manifest["files"]
              ]
              code = [
                  path
                  for path in paths
                  if Path(path).suffix.lower()
                  in CODE_EXTENSIONS
              ]
              code_set = set(code)
              unresolved = []
              todos = []

              for relative in code:
                  path = root / relative
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
                  todo_count = len(
                      TODO_RE.findall(text)
                  )

                  if todo_count:
                      todos.append(
                          {
                              "path": relative,
                              "count": todo_count,
                          }
                      )

                  for specifier in (
                      IMPORT_RE.findall(text)
                  ):
                      if not specifier.startswith(
                          "."
                      ):
                          continue

                      base = (
                          path.parent
                          / specifier
                      )
                      candidates = (
                          [base]
                          if base.suffix
                          else [
                              *[
                                  Path(
                                      str(base)
                                      + extension
                                  )
                                  for extension
                                  in CODE_EXTENSIONS
                              ],
                              *[
                                  base
                                  / (
                                      "index"
                                      f"{extension}"
                                  )
                                  for extension
                                  in CODE_EXTENSIONS
                              ],
                          ]
                      )
                      found = False

                      for candidate in candidates:
                          try:
                              target = (
                                  candidate.resolve()
                                  .relative_to(root)
                                  .as_posix()
                              )
                          except ValueError:
                              continue

                          if target in code_set:
                              found = True
                              break

                      if not found:
                          unresolved.append(
                              {
                                  "source": relative,
                                  "specifier": (
                                      specifier
                                  ),
                              }
                          )

              hashes = defaultdict(list)

              for item in manifest["files"]:
                  hashes[
                      item["sha256"]
                  ].append(
                      item["path"]
                  )

              duplicates = [
                  duplicate_paths
                  for duplicate_paths
                  in hashes.values()
                  if len(duplicate_paths) > 1
              ]

              return {
                  "trackedFiles": len(paths),
                  "codeFiles": len(code),
                  "unresolvedRelativeImports": (
                      unresolved
                  ),
                  "todoFindings": todos,
                  "duplicateContentGroups": (
                      duplicates
                  ),
                  "largestFiles": sorted(
                      manifest["files"],
                      key=lambda item: (
                          item["length"]
                      ),
                      reverse=True,
                  )[:100],
              }


          def font(
              size: int,
              bold: bool = False,
