              / "WORKFLOW_REPORT.md"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          (
              out / "WORKFLOW_REPORT.md"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f dream-artifacts/*.zip

          (
            cd dream-application-image || exit 1

            zip -q -r \
              ../dream-artifacts/dream-application-image-full.zip \
              .

            zip -q -r \
              ../dream-artifacts/dream-application-image-rendering.zip \
              Rendering \
              Data \
              Metadata \
              README.md \
              ATLAS_SUMMARY.json \
              WORKFLOW_REPORT.md

            zip -q -r \
              ../dream-artifacts/dream-application-image-decoder.zip \
              Decoder \
              Rendering/RepositoryCells \
              Data/REPOSITORY_MANIFEST.json \
              Metadata/DREAM_4D_INTEGRITY.json \
              README.md \
              WORKFLOW_REPORT.md

            zip -q -r \
              ../dream-artifacts/dream-application-image-analysis.zip \
              Analysis \
              Health \
              Diagnostics \
              README.md \
              WORKFLOW_REPORT.md
          )

          ZIP_CODE=$?

          if [ "$ZIP_CODE" -eq 0 ]; then
            for archive in dream-artifacts/*.zip; do
              unzip -tq "$archive" >/dev/null \
                || ZIP_CODE=1
            done
          fi

          printf '%s\n' "$ZIP_CODE" \
            > dream-application-image/Diagnostics/PACKAGE_EXIT_CODE.txt

          exit 0

      - name: Upload full package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-full
          path: dream-artifacts/dream-application-image-full.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload rendering package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-rendering
          path: dream-artifacts/dream-application-image-rendering.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload decoder package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-decoder
          path: dream-artifacts/dream-application-image-decoder.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-application-image-analysis
          path: dream-artifacts/dream-application-image-analysis.zip
          if-no-files-found: error
          retention-days: 1

      - name: Fail after uploads when diagnostics found a real failure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          path = Path(
              "dream-application-image/"
              "Diagnostics/"
              "WORKFLOW_DIAGNOSTICS.json"
          )

          if path.exists():
              failures.extend(
                  json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  ).get(
                      "criticalFailures",
                      [],
                  )
              )
          else:
              failures.append(
                  "workflow diagnostics "
                  "were not generated"
              )

          try:
              package_code = int(
                  Path(
                      "dream-application-image/"
                      "Diagnostics/"
                      "PACKAGE_EXIT_CODE.txt"
                  ).read_text(
                      encoding="utf-8"
                  ).strip()
              )
          except Exception:
              package_code = 1

          if package_code != 0:
              failures.append(
                  "package creation or "
                  "ZIP validation failed"
              )

          if failures:
              raise SystemExit(
                  "\n".join(
                      [
                          "DREAM workflow failed:",
                          *[
                              f"- {item}"
                              for item
                              in failures
                          ],
                      ]
                  )
              )

          print(
              "Repository images rebuilt every "
              "tracked file exactly and all "
              "critical checks passed."
          )
          PY
