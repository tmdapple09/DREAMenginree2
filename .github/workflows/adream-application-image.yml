          def compare_repository(
              root: Path,
              rebuilt: Path,
              manifest: dict,
          ) -> dict:
              results = []

              for item in manifest["files"]:
                  original = (
                      root / item["path"]
                  )
                  recovered = (
                      rebuilt / item["path"]
                  )

                  if item["kind"] == "symlink":
                      exact = (
                          recovered.is_symlink()
                          and os.readlink(original)
                          == os.readlink(recovered)
                      )
                  else:
                      exact = (
                          recovered.is_file()
                          and hashlib.sha256(
                              original.read_bytes()
                          ).hexdigest()
                          == hashlib.sha256(
                              recovered.read_bytes()
                          ).hexdigest()
                          and stat.S_IMODE(
                              original.stat().st_mode
                          )
                          == stat.S_IMODE(
                              recovered.stat().st_mode
                          )
                      )

                  results.append(
                      {
                          "path": item["path"],
                          "exact": exact,
                      }
                  )

              return {
                  "fileCount": len(results),
                  "exactFileCount": sum(
                      item["exact"]
                      for item in results
                  ),
                  "allExact": all(
                      item["exact"]
                      for item in results
                  ),
                  "rebuiltTreePackaged": False,
                  "files": results,
              }


          def build(
              root: Path,
              output: Path,
          ) -> int:
              rendering = output / "Rendering"
              image_dir = (
                  rendering
                  / "RepositoryCells"
              )
              decoder_dir = output / "Decoder"
              data_dir = output / "Data"
              metadata_dir = (
                  output / "Metadata"
              )
              analysis_dir = (
                  output / "Analysis"
              )
              health_dir = output / "Health"
              diagnostics_dir = (
                  output / "Diagnostics"
              )

              for directory in (
                  rendering,
                  image_dir,
                  decoder_dir,
                  data_dir,
                  metadata_dir,
                  analysis_dir,
                  health_dir,
                  diagnostics_dir,
              ):
                  directory.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

              paths = tracked_files(root)
              manifest = repository_manifest(
                  root,
                  paths,
              )
              write_json(
                  data_dir
                  / "REPOSITORY_MANIFEST.json",
                  manifest,
              )
              write_text(
                  data_dir
                  / "SOURCE_ORDER.txt",
                  "\n".join(paths) + "\n",
              )
              shutil.copy2(
                  Path(__file__),
                  decoder_dir
                  / "dream_repository_image.py",
              )

              with tempfile.TemporaryDirectory(
                  prefix="dream-image-build-"
              ) as temp_name:
                  temp = Path(temp_name)
                  payload = (
                      temp / "repository.zip"
                  )
                  build_payload(
                      root,
                      paths,
                      manifest,
                      payload,
                  )
                  digest = hashlib.sha256(
                      payload.read_bytes()
                  ).digest()
                  (
                      state_paths,
                      counts,
                      total_states,
                  ) = split_states(
                      payload,
                      temp,
                  )
                  image_rows = save_images(
                      state_paths,
                      counts,
                      total_states,
                      payload.stat().st_size
                      * 8,
                      digest,
                      image_dir,
                      max(
                          256,
                          int(
                              os.environ.get(
                                  "DREAM_IMAGE_"
                                  "MAX_DIMENSION",
                                  "12000",
                              )
                          ),
                      ),
                  )
                  integrity = (
                      tesseract_integrity(
                          state_paths,
                          image_rows,
                      )
                  )
                  write_json(
                      metadata_dir
                      / "DREAM_4D_INTEGRITY.json",
                      integrity,
                  )
                  overview(
                      rendering,
                      counts,
                      image_rows,
                      integrity,
                  )

                  rebuilt = temp / "rebuilt"
                  decoded = extract_payload(
                      reconstruct_payload(
                          image_dir
                      ),
                      rebuilt,
                  )
                  comparison = (
                      compare_repository(
                          root,
                          rebuilt,
                          manifest,
                      )
                  )

              verification = {
                  "decoder": decoded,
                  "sourceComparison": comparison,
                  "allExact": (
                      decoded["allExact"]
                      and comparison["allExact"]
                  ),
                  "rebuiltTreePackaged": False,
                  "note": (
                      "The workflow rebuilds into "
                      "a temporary directory, "
                      "verifies every tracked file, "
                      "then deletes it."
                  ),
              }
              write_json(
                  decoder_dir
                  / (
                      "REPOSITORY_ROUNDTRIP_"
                      "VERIFICATION.json"
                  ),
                  verification,
              )

              health = source_diagnostics(
                  root,
                  manifest,
              )
              write_json(
                  health_dir
                  / "SOURCE_DIAGNOSTICS.json",
                  health,
              )
              write_text(
                  health_dir
                  / "SOURCE_DIAGNOSTICS.md",
                  "\n".join(
                      [
                          "# DREAM Source Diagnostics",
                          "",
                          (
                              "- Tracked files: "
                              f"**{health['trackedFiles']}**"
                          ),
                          (
                              "- Code files: "
                              f"**{health['codeFiles']}**"
                          ),
                          (
                              "- Unresolved relative "
                              "imports: "
                              f"**{len(health['unresolvedRelativeImports'])}**"
                          ),
                          (
                              "- TODO/FIXME/HACK "
                              "findings: "
                              f"**{len(health['todoFindings'])}**"
                          ),
                          (
                              "- Duplicate-content "
                              "groups: "
                              f"**{len(health['duplicateContentGroups'])}**"
                          ),
                      ]
                  )
                  + "\n",
              )
              write_json(
                  analysis_dir
                  / "IMAGE_PAGE_INDEX.json",
                  image_rows,
              )

              critical = []
              warnings = []

              if not verification["allExact"]:
                  critical.append(
                      "image-to-repository "
                      "round trip was not exact"
                  )

              if health[
                  "unresolvedRelativeImports"
              ]:
                  warnings.append(
                      f"{len(health['unresolvedRelativeImports'])} "
                      "unresolved relative imports"
                  )

              diagnostics = {
                  "criticalFailures": critical,
                  "warnings": warnings,
                  "roundTripExact": (
                      verification["allExact"]
                  ),
                  "trackedFiles": len(paths),
                  "imagePages": len(image_rows),
              }
              write_json(
                  diagnostics_dir
                  / "GENERATOR_DIAGNOSTICS.json",
                  diagnostics,
              )

              summary = {
                  "status": (
                      "completed"
                      if not critical
                      else "failed"
                  ),
                  "format": FORMAT,
                  "commit": manifest["commit"],
                  "trackedFiles": len(paths),
                  "imagePages": len(image_rows),
                  "roundTripExact": (
                      verification["allExact"]
                  ),
              }
              write_json(
                  output / "ATLAS_SUMMARY.json",
                  summary,
              )

              write_text(
                  output / "README.md",
                  "\n".join(
                      [
                          (
                              "# DREAM Repository Image "
                              "and 4D Runtime Atlas"
                          ),
                          "",
                          (
                              "The exact PNG pages under "
                              "`Rendering/RepositoryCells/` "
                              "contain the complete "
                              "checked-out tracked "
                              "repository working tree."
                          ),
                          (
                              "The reconstruction manifest, "
                              "file bytes, paths, modes, "
                              "symlink targets, and hashes "
                              "are inside the pixel-"
                              "reconstructed ZIP payload."
                          ),
                          (
                              "Sidecar JSON files are reports "
                              "only; the decoder does not "
                              "need them."
                          ),
                          "",
                          "```bash",
                          (
                              "python Decoder/"
                              "dream_repository_image.py "
                              "decode "
                              "Rendering/RepositoryCells "
                              "rebuilt-repository"
                          ),
                          "```",
                          "",
                          (
                              "The workflow verifies that "
                              "reconstruction in a temporary "
                              "directory and does not package "
                              "the rebuilt copy, avoiding "
                              "duplicate repository contents."
                          ),
                      ]
                  )
                  + "\n",
              )

              return (
                  0
                  if not critical
                  else 2
              )


          def main() -> int:
              parser = argparse.ArgumentParser()
              subcommands = (
                  parser.add_subparsers(
                      dest="command",
                      required=True,
                  )
              )

              build_parser = (
                  subcommands.add_parser(
                      "build"
                  )
              )
              build_parser.add_argument(
                  "root",
                  type=Path,
              )
              build_parser.add_argument(
                  "output",
                  type=Path,
              )

              decode_parser = (
                  subcommands.add_parser(
                      "decode"
                  )
              )
              decode_parser.add_argument(
                  "images",
                  type=Path,
              )
              decode_parser.add_argument(
                  "output",
                  type=Path,
              )
              decode_parser.add_argument(
                  "--report",
                  type=Path,
              )

              arguments = parser.parse_args()

              if arguments.command == "build":
                  return build(
                      arguments.root.resolve(),
                      arguments.output,
                  )

              result = extract_payload(
                  reconstruct_payload(
                      arguments.images
                  ),
                  arguments.output,
              )
              text = json.dumps(
                  result,
                  indent=2,
              )
              print(text)

              if arguments.report:
                  write_text(
                      arguments.report,
                      text + "\n",
                  )

              return (
                  0
                  if result["allExact"]
                  else 2
              )


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except SystemExit:
                  raise
              except Exception:
                  traceback.print_exc()
                  raise
          PY

