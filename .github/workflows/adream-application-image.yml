                          Path(node).name[:40],
                          fill=(235, 240, 255),
                          font=small_font,
                      )

              draw.text(
                  (45, 35),
                  "DREAM Repository-Native Dependency Shape",
                  fill=(245, 247, 255),
                  font=title_font,
              )

              draw.text(
                  (45, 80),
                  f"Root: {root}",
                  fill=(210, 220, 245),
                  font=font(18),
              )

              image.save(
                  ANALYSIS
                  / "REPO_NATIVE_SYNAPSE.png",
                  "PNG",
                  compress_level=6,
              )

              dot = [
                  "digraph DREAM_REPO {",
                  "  overlap=false;",
                  "  splines=true;",
              ]

              for node in records:
                  dot.append(
                      f"  {json.dumps(node)};"
                  )

              for source, targets in graph.items():
                  for target in targets:
                      dot.append(
                          f"  {json.dumps(source)}"
                          f" -> {json.dumps(target)};"
                      )

              dot.append("}")

              write(
                  ANALYSIS
                  / "REPO_NATIVE_SYNAPSE.dot",
                  "\n".join(dot) + "\n",
              )


          def route_name(
              repo: Path,
              path: Path,
          ) -> str:
              parts = []

              for part in path.relative_to(
                  repo / "app"
              ).parts[:-1]:
                  if (
                      (
                          part.startswith("(")
                          and part.endswith(")")
                      )
                      or part.startswith("@")
                  ):
                      continue

                  parts.append(part)

              return "/" + "/".join(parts)


          def build_ui_map(
              repo: Path,
              records,
              graph,
          ):
              routes = []
              app_root = repo / "app"

              if app_root.exists():
                  for path in app_root.rglob("*"):
                      if (
                          path.is_file()
                          and path.suffix.lower() in EXTS
                          and path.stem.lower()
                          in {
                              "page",
                              "layout",
                              "route",
                              "loading",
                              "error",
                              "not-found",
                              "template",
                          }
                      ):
                          relative_path = (
                              path.relative_to(
                                  repo
                              ).as_posix()
                          )

                          routes.append(
                              {
                                  "route": route_name(
                                      repo,
                                      path,
                                  ),
                                  "kind": path.stem.lower(),
                                  "file": relative_path,
                                  "includedInRuntimeAtlas": (
                                      relative_path in records
                                  ),
                                  "directDependencies": sorted(
                                      graph.get(
                                          relative_path,
                                          set(),
                                      )
                                  ),
                              }
                          )

              routes.sort(
                  key=lambda route: (
                      route["route"],
                      route["kind"],
                      route["file"],
                  )
              )

              nodes = set()
              edges = set()

              for route in routes:
                  source = route["file"]
                  reachable = set()

                  if source in graph:
                      queue = deque([source])
                      seen = {source}
                      nodes.add(source)

                      while queue:
                          current = queue.popleft()

                          for target in graph[current]:
                              edges.add(
                                  (current, target)
                              )

                              nodes.add(target)
                              reachable.add(target)

                              if target not in seen:
                                  seen.add(target)
                                  queue.append(target)

                  route[
                      "reachableDependencyCount"
                  ] = len(reachable)

                  route[
                      "reachableDependencies"
                  ] = sorted(reachable)

              result = {
                  "routeCount": len(routes),
                  "routes": routes,
                  "synapseNodeCount": len(nodes),
                  "synapseEdgeCount": len(edges),
                  "synapseNodes": sorted(nodes),
                  "synapseEdges": sorted(
                      [
                          list(edge)
                          for edge in edges
                      ]
                  ),
                  "scope": (
                      "full transitive runtime "
                      "dependency closure for every route"
                  ),
              }

              write(
                  UI / "UI_ROUTE_MAP.json",
                  json.dumps(
                      result,
                      indent=2,
                  ) + "\n",
              )

              markdown = [
                  "# DREAM UI Route Map",
                  "",
                  f"- Route files: **{len(routes)}**",
                  f"- Synapse nodes: **{len(nodes)}**",
                  f"- Synapse edges: **{len(edges)}**",
                  "",
                  "## Routes",
                  "",
              ]

              markdown.extend(
                  (
                      f"- `{route['route']}` "
                      f"[{route['kind']}] -> "
                      f"`{route['file']}`; "
                      f"direct "
                      f"{len(route['directDependencies'])}, "
                      f"reachable "
                      f"{route['reachableDependencyCount']}"
                  )
                  for route in routes
              )

              write(
                  UI / "UI_ROUTE_MAP.md",
                  "\n".join(markdown) + "\n",
              )

              dot = [
                  "digraph DREAM_UI {",
                  "  rankdir=LR;",
              ]

              route_files = {
                  route["file"]
                  for route in routes
              }

              for node in nodes:
                  shape = (
                      "box"
                      if node in route_files
                      else "ellipse"
                  )

                  dot.append(
                      f"  {json.dumps(node)} "
                      f"[shape={shape}];"
                  )

              for source, target in edges:
                  dot.append(
                      f"  {json.dumps(source)}"
                      f" -> {json.dumps(target)};"
                  )

              dot.append("}")

              write(
                  UI / "UI_SYNAPSE_FULL.dot",
                  "\n".join(dot) + "\n",
              )

              width = 2600
              shown_routes = routes[:130]

              components = [
                  node
                  for node in sorted(nodes)
                  if node not in route_files
              ][:500]

              height = min(
                  12000,
                  max(
                      1600,
                      140
                      + 80
                      * len(shown_routes),
                  ),
              )

              image = Image.new(
                  "RGB",
                  (width, height),
                  (248, 249, 252),
              )

              draw = ImageDraw.Draw(image)

              draw.text(
                  (45, 30),
                  "DREAM UI and Runtime Synapse",
                  fill=(20, 25, 35),
                  font=font(32, True),
              )

              route_positions = {}
              component_positions = {}

              for index, route in enumerate(
                  shown_routes
              ):
                  y_position = (
                      100
                      + index * 75
                  )

                  route_positions[
                      route["file"]
                  ] = (
                      50,
                      y_position,
                  )

                  draw.rounded_rectangle(
                      (
                          50,
                          y_position,
                          650,
                          y_position + 45,
                      ),
                      8,
                      fill=(225, 232, 248),
                      outline=(90, 110, 160),
                  )

                  draw.text(
                      (
                          65,
                          y_position + 12,
                      ),
                      (
                          f"{route['route']} "
                          f"[{route['kind']}]"
                      )[:70],
                      fill=(25, 35, 60),
                      font=font(17, True),
                  )

              for index, node in enumerate(
                  components
              ):
                  column = index % 4
                  row = index // 4

                  x_position = (
                      820
                      + column * 430
                  )

                  y_position = (
                      100
                      + row * 55
                  )

                  if y_position > height - 50:
                      break

                  component_positions[node] = (
                      x_position,
                      y_position,
                  )

                  draw.rounded_rectangle(
                      (
                          x_position,
                          y_position,
                          x_position + 380,
                          y_position + 34,
                      ),
                      6,
                      fill=(240, 242, 246),
                      outline=(150, 155, 165),
                  )

                  draw.text(
                      (
                          x_position + 8,
                          y_position + 8,
                      ),
                      Path(node).name[:45],
                      fill=(45, 50, 60),
                      font=font(13),
                  )

              for source, target in edges:
                  source_position = (
                      route_positions.get(source)
                      or component_positions.get(source)
                  )

                  target_position = (
                      route_positions.get(target)
                      or component_positions.get(target)
                  )

                  if (
                      not source_position
                      or not target_position
                  ):
                      continue

                  draw.line(
                      (
                          source_position[0]
                          + (
                              600
                              if source in route_positions
                              else 380
                          ),
                          source_position[1] + 20,
                          target_position[0],
                          target_position[1] + 17,
                      ),
                      fill=(125, 135, 160),
                      width=1,
                  )

              image.save(
                  UI / "UI_SYNAPSE_MAP.png",
                  "PNG",
                  compress_level=6,
              )

              return result


          def write_health(
              repo: Path,
              records,
              graph,
              root,
              unresolved,
              excluded_rows,
              excluded_dependencies,
          ):
              incoming = Counter(
                  target
                  for targets in graph.values()
                  for target in targets
              )

              cycles = (
                  strongly_connected_components(
                      graph
                  )
              )

              metrics = []
              suspicious = []
              owners = defaultdict(list)

              route_entry = re.compile(
                  r"^app/(?:.*/)?"
                  r"(?:page|layout|route|loading|"
                  r"error|not-found|template)"
                  r"\.(?:ts|tsx|js|jsx|mjs|cjs)$"
              )

              for relative_path, record in records.items():
                  text = (
                      repo / relative_path
                  ).read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  clean = strip_comments(text)
                  lines = text.splitlines()

                  function_count = len(
                      re.findall(
                          r"\b(?:async\s+)?function\b"
                          r"|=>"
                          r"|\bclass\b",
                          clean,
                      )
                  )

                  branch_count = len(
                      re.findall(
                          r"\b(?:if|for|while|case|catch)\b"
                          r"|\?\?"
                          r"|&&"
                          r"|\|\|",
                          clean,
                      )
                  )

                  metrics.append(
                      {
                          "path": relative_path,
                          "bytes": record["bytes"],
                          "lineCount": len(lines),
                          "functionLikeCount": function_count,
                          "branchCount": branch_count,
                          "complexityScore": (
                              1 + branch_count
                          ),
                          "runtimeExportCount": record[
                              "runtimeExportCount"
                          ],
                          "fanIn": incoming[
                              relative_path
                          ],
                          "fanOut": len(
                              graph[relative_path]
                          ),
                          "couplingScore": (
                              incoming[relative_path]
                              + len(graph[relative_path])
                          ),
                      }
                  )

                  for export_name in record[
                      "runtimeExports"
                  ]:
                      owners[export_name].append(
                          relative_path
                      )

                  for label, pattern in SUSPICIOUS.items():
                      count = len(
                          pattern.findall(text)
                      )

                      if count:
                          suspicious.append(
                              {
                                  "path": relative_path,
                                  "finding": label,
                                  "count": count,
                              }
                          )

              high_complexity = sorted(
                  metrics,
                  key=lambda item: (
                      item["complexityScore"],
                      item["lineCount"],
                  ),
                  reverse=True,
              )[:200]

              high_coupling = sorted(
                  metrics,
                  key=lambda item: (
                      item["couplingScore"],
                      item["fanIn"],
                  ),
                  reverse=True,
              )[:200]

              dead_exports = sorted(
                  [
                      {
                          "path": relative_path,
                          "runtimeExportCount": record[
                              "runtimeExportCount"
                          ],
                          "runtimeExports": record[
                              "runtimeExports"
                          ],
                      }
                      for relative_path, record
                      in records.items()
                      if (
                          record["runtimeExportCount"]
                          and incoming[relative_path] == 0
                          and relative_path != root
                          and not route_entry.match(
                              relative_path
                          )
                      )
                  ],
                  key=lambda item: (
                      item["runtimeExportCount"],
                      item["path"],
                  ),
                  reverse=True,
              )

              duplicate_exports = sorted(
                  [
                      {
                          "export": export_name,
                          "files": sorted(set(files)),
                          "fileCount": len(set(files)),
                      }
                      for export_name, files
                      in owners.items()
                      if (
                          export_name
                          not in {
                              "default",
                              "module.exports",
                          }
                          and len(set(files)) > 1
                      )
                  ],
                  key=lambda item: (
                      item["fileCount"],
                      item["export"],
                  ),
                  reverse=True,
              )

              orphan_files = sorted(
                  relative_path
                  for relative_path in records
                  if (
                      not graph[relative_path]
                      and incoming[relative_path] == 0
                  )
              )

              report = {
                  "includedRuntimeFiles": len(records),
                  "excludedFiles": len(
                      excluded_rows
                  ),
                  "internalEdges": sum(
                      len(targets)
                      for targets in graph.values()
                  ),
                  "unresolvedInternalImports": unresolved,
                  "intentionallyExcludedDependencies": (
                      excluded_dependencies
                  ),
                  "circularDependencyGroups": cycles,
                  "orphanFiles": orphan_files,
                  "deadExportCandidates": dead_exports,
                  "duplicateRuntimeExportNames": (
                      duplicate_exports
                  ),
                  "highComplexityFiles": high_complexity,
                  "highCouplingFiles": high_coupling,
                  "heuristicFindings": suspicious,
                  "limitations": [
                      (
                          "Static parsing is heuristic "
                          "and does not replace the "
                          "TypeScript compiler."
                      ),
                      (
                          "Dynamic imports and custom aliases "
                          "may require compiler-aware resolution."
                      ),
                      (
                          "Dead exports and complexity are "
                          "review candidates, not proof of defects."
                      ),
                  ],
              }

              write(
                  HEALTH / "CODE_HEALTH.json",
                  json.dumps(
                      report,
                      indent=2,
                  ) + "\n",
              )

              def write_csv(
                  name: str,
                  fields,
                  rows,
              ) -> None:
                  with (
                      HEALTH / name
                  ).open(
                      "w",
                      encoding="utf-8",
                      newline="",
                  ) as handle:
                      writer = csv.DictWriter(
                          handle,
                          fieldnames=fields,
                      )

                      writer.writeheader()
                      writer.writerows(rows)

              write_csv(
                  "UNRESOLVED_IMPORTS.csv",
                  ["source", "specifier"],
                  unresolved,
              )

              write_csv(
                  "EXCLUDED_FILES.csv",
                  ["path", "reason"],
                  excluded_rows,
              )

              write_csv(
                  "EXCLUDED_DEPENDENCIES.csv",
                  [
                      "source",
                      "specifier",
                      "target",
                      "reason",
                  ],
                  excluded_dependencies,
              )

              write_csv(
                  "FILE_METRICS.csv",
                  (
                      list(metrics[0].keys())
                      if metrics
                      else ["path"]
                  ),
                  metrics,
              )

              write_csv(
                  "HIGH_COUPLING.csv",
                  [
                      "path",
                      "fanIn",
                      "fanOut",
                      "couplingScore",
                  ],
                  [
                      {
                          key: item[key]
                          for key in (
                              "path",
                              "fanIn",
                              "fanOut",
                              "couplingScore",
                          )
                      }
                      for item in high_coupling
                  ],
              )

              write_csv(
                  "DEAD_EXPORT_CANDIDATES.csv",
                  [
                      "path",
                      "runtimeExportCount",
                      "runtimeExports",
                  ],
                  [
                      {
                          "path": item["path"],
                          "runtimeExportCount": item[
                              "runtimeExportCount"
                          ],
                          "runtimeExports": ";".join(
                              item["runtimeExports"]
                          ),
                      }
                      for item in dead_exports
                  ],
              )

              markdown = [
                  "# DREAM Code Health Report",
                  "",
                  (
                      f"- Runtime files: "
                      f"**{len(records)}**"
                  ),
                  (
                      f"- Internal edges: "
                      f"**{sum(len(targets) for targets in graph.values())}**"
                  ),
                  (
                      f"- Unresolved internal imports: "
                      f"**{len(unresolved)}**"
                  ),
                  (
                      f"- Circular groups: "
                      f"**{len(cycles)}**"
                  ),
                  (
                      f"- Dead-export candidates: "
                      f"**{len(dead_exports)}**"
                  ),
                  (
                      f"- Heuristic findings: "
                      f"**{len(suspicious)}**"
                  ),
                  "",
                  "## Unresolved imports",
                  "",
              ]

              if unresolved:
                  markdown.extend(
                      (
                          f"- `{item['source']}` -> "
                          f"`{item['specifier']}`"
                      )
                      for item in unresolved
                  )
              else:
                  markdown.append("None found.")

              markdown.extend(
                  [
                      "",
                      "## Circular dependencies",
                      "",
                  ]
              )

              if cycles:
                  for index, component in enumerate(
                      cycles,
                      start=1,
                  ):
                      markdown.append(
                          f"### Group {index}"
                      )

                      markdown.extend(
                          f"- `{item}`"
                          for item in component
                      )

                      markdown.append("")
              else:
                  markdown.append("None found.")

              markdown.extend(
                  [
                      "",
                      "## Highest complexity",
                      "",
                  ]
              )

              markdown.extend(
                  (
                      f"- `{item['path']}`: "
                      f"score {item['complexityScore']}, "
                      f"{item['lineCount']} lines"
                  )
                  for item in high_complexity[:40]
              )

              markdown.extend(
                  [
                      "",
                      "## Highest coupling",
                      "",
                  ]
              )

              markdown.extend(
                  (
                      f"- `{item['path']}`: "
                      f"fan-in {item['fanIn']}, "
                      f"fan-out {item['fanOut']}"
                  )
                  for item in high_coupling[:40]
              )

              markdown.extend(
                  [
                      "",
                      "## Dead-export candidates",
                      "",
                  ]
              )

              markdown.extend(
                  (
                      f"- `{item['path']}`: "
                      f"{item['runtimeExportCount']} "
                      f"runtime export(s), no internal importers"
                  )
                  for item in dead_exports[:100]
              )

              markdown.extend(
                  [
                      "",
                      "## Heuristic review targets",
                      "",
                  ]
              )

              markdown.extend(
                  (
                      f"- `{item['path']}`: "
                      f"{item['finding']} "
                      f"({item['count']})"
                  )
                  for item in suspicious[:500]
              )

              write(
                  HEALTH / "CODE_HEALTH_REPORT.md",
                  "\n".join(markdown) + "\n",
              )

              return report


          def main() -> int:
              repo = Path(".").resolve()

              (
                  seeds,
                  all_code,
                  reasons,
                  excluded_rows,
              ) = collect(repo)

              files = closure(
                  repo,
                  seeds,
                  all_code,
                  reasons,
              )

              if not files:
                  raise RuntimeError(
                      "No runtime application files remained "
                      "after filtering."
                  )

              (
                  records,
                  graph,
                  unresolved,
                  excluded_dependencies,
                  external,
              ) = graph_data(
                  repo,
                  files,
                  all_code,
                  reasons,
              )

              (
                  root,
                  order,
                  islands,
                  depth,
              ) = traverse(
                  records,
                  graph,
              )

              payload, manifest = build_payload(
                  repo,
                  records,
                  graph,
                  root,
                  order,
                  islands,
              )

              canonical_path = (
                  CANON
                  / "CANONICAL_CODE_IMAGE.png"
              )

              (
                  image_info,
                  image_analysis,
              ) = encode_png(
                  payload,
                  canonical_path,
              )

              manifest["canonicalImage"] = image_info
              manifest["excludedFileCount"] = len(
                  excluded_rows
              )
              manifest["externalImportCount"] = len(
                  external
              )

              write(
                  CANON / "ENCODE_MANIFEST.json",
                  json.dumps(
                      manifest,
                      indent=2,
                  ) + "\n",
              )

              decoder_path = (
                  DECODE
                  / "decode_from_image.py"
              )

              write(
                  decoder_path,
                  decoder_text(),
              )

              namespace: dict[str, Any] = {}

              exec(
                  compile(
                      decoder_text(),
                      str(decoder_path),
                      "exec",
                  ),
                  namespace,
              )

              verification = namespace["decode"](
                  canonical_path,
                  REBUILT,
              )

              write(
                  DECODE
                  / "IMAGE_TO_CODE_VERIFICATION.json",
                  json.dumps(
                      verification,
                      indent=2,
                  ) + "\n",
              )

              write(
                  ANALYSIS / "IMAGE_ANALYSIS.json",
                  json.dumps(
                      image_analysis,
                      indent=2,
                  ) + "\n",
              )

              analysis_lines = [
                  "# Canonical Image Analysis",
                  "",
                  f"- Root: `{root}`",
                  (
                      f"- Runtime files encoded: "
                      f"**{len(order)}**"
                  ),
                  (
                      f"- Dependency islands: "
                      f"**{len(islands)}**"
                  ),
                  (
                      f"- Dimensions: "
                      f"**{image_info['width']} "
                      f"x {image_info['height']}**"
                  ),
                  (
                      f"- Payload bytes: "
                      f"**{image_info['payloadBytes']}**"
                  ),
                  (
                      f"- Final padding: "
                      f"**{image_info['paddingBits']} "
                      f"bit(s)**"
                  ),
                  (
                      f"- Cell entropy: "
                      f"**{image_analysis['entropyBitsPerCell']:.6f} "
                      f"bits**"
                  ),
                  "",
                  "## Exact states",
                  "",
              ]

              for (
                  state,
                  count,
              ) in image_analysis[
                  "stateCounts"
              ].items():
                  group, member = PAIR[
                      int(state, 2)
                  ]

                  analysis_lines.append(
                      f"- `{state}` / "
                      f"`{group}{member}`: "
                      f"{count}"
                  )

              analysis_lines.extend(
                  [
                      "",
                      (
                          "The canonical PNG contains the "
                          "manifest and exact file bytes."
                      ),
                      (
                          "The repository-native PNG uses "
                          "the dependency graph for its shape."
                      ),
                  ]
              )

              write(
                  ANALYSIS / "IMAGE_ANALYSIS.md",
                  "\n".join(
                      analysis_lines
                  ) + "\n",
              )

              write(
                  ANALYSIS / "TRAVERSAL_ORDER.txt",
                  "\n".join(order) + "\n",
              )

              with (
                  ANALYSIS / "EXPORT_RANKING.csv"
              ).open(
                  "w",
                  encoding="utf-8",
                  newline="",
              ) as handle:
                  fields = [
                      "rank",
                      "path",
                      "runtimeExportCount",
                      "fanIn",
                      "fanOut",
                      "bytes",
                  ]

                  writer = csv.DictWriter(
                      handle,
                      fieldnames=fields,
                  )

                  writer.writeheader()

                  ranked_files = sorted(
                      records,
                      key=lambda relative_path: score(
                          records[relative_path]
                      ),
                      reverse=True,
                  )

                  for index, relative_path in enumerate(
                      ranked_files,
                      start=1,
                  ):
                      writer.writerow(
                          {
                              "rank": index,
                              "path": relative_path,
                              "runtimeExportCount": records[
                                  relative_path
                              ]["runtimeExportCount"],
                              "fanIn": records[
                                  relative_path
                              ]["fanIn"],
                              "fanOut": records[
                                  relative_path
                              ]["fanOut"],
                              "bytes": records[
                                  relative_path
                              ]["bytes"],
                          }
                      )

              render_repo(
                  records,
                  graph,
                  root,
                  islands,
                  depth,
              )

              health = write_health(
                  repo,
                  records,
                  graph,
                  root,
                  unresolved,
                  excluded_rows,
                  excluded_dependencies,
              )

              ui = build_ui_map(
                  repo,
                  records,
                  graph,
              )

              summary = {
                  "status": (
                      "completed-with-findings"
                      if (
                          unresolved
                          or not verification["allExact"]
                      )
                      else "completed"
                  ),
                  "rootFile": root,
                  "runtimeFiles": len(records),
                  "excludedFiles": len(
                      excluded_rows
                  ),
                  "dependencyEdges": sum(
                      len(targets)
                      for targets in graph.values()
                  ),
                  "dependencyIslands": len(
                      islands
                  ),
                  "unresolvedInternalImports": len(
                      unresolved
                  ),
                  "intentionallyExcludedDependencies": len(
                      excluded_dependencies
                  ),
                  "circularDependencyGroups": len(
                      health[
                          "circularDependencyGroups"
                      ]
                  ),
                  "uiRoutes": ui["routeCount"],
                  "decodeAllExact": verification[
                      "allExact"
                  ],
              }

              write(
                  OUT / "ATLAS_SUMMARY.json",
                  json.dumps(
                      summary,
                      indent=2,
                  ) + "\n",
              )

              readme = [
                  "# DREAM Application Image and Runtime Atlas",
                  "",
                  f"Root: `{root}`",
                  "",
                  (
                      "Root selection uses runtime export "
                      "count first."
                  ),
                  (
                      "Ordering uses dependency BFS, "
                      "not alphabetical order."
                  ),
                  (
                      "Indexes, tests, specs, stories, "
                      "mocks, generated files, declarations, "
                      "docs, and type-only modules are excluded "
                      "from the carrier."
                  ),
                  "",
                  "## Decode",
                  "",
                  "```bash",
                  (
                      "python3 Decode/decode_from_image.py "
                      "Canonical/CANONICAL_CODE_IMAGE.png "
                      "rebuilt --verification verification.json"
                  ),
                  "```",
                  "",
                  (
                      f"Self-check: "
                      f"**{verification['allExact']}** "
                      f"({verification['exactFileCount']}/"
                      f"{verification['fileCount']} exact)."
                  ),
              ]

              write(
                  OUT / "README.md",
                  "\n".join(readme) + "\n",
              )

              print(
                  json.dumps(
                      summary,
                      indent=2,
                  )
              )

              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except SystemExit:
                  raise
              except Exception:
                  error_text = traceback.format_exc()

                  write(
                      DIAG / "GENERATOR_EXCEPTION.txt",
                      error_text,
                  )

                  print(
                      error_text,
                      file=sys.stderr,
                  )

                  raise
          PY

          python3 -m py_compile "$RUNNER_TEMP/dream_repo_atlas.py" \
            > >(tee "$DIAG/PYTHON_COMPILE_STDOUT.log") \
            2> >(tee "$DIAG/PYTHON_COMPILE_STDERR.log" >&2)

          compile_status=$?

          printf '%s\n' "$compile_status" \
            > "$DIAG/PYTHON_COMPILE_EXIT_CODE.txt"

          if [ "$compile_status" -eq 0 ]; then
            python3 "$RUNNER_TEMP/dream_repo_atlas.py" \
              > >(tee "$DIAG/GENERATOR_STDOUT.log") \
              2> >(tee "$DIAG/GENERATOR_STDERR.log" >&2)

            generator_status=$?
          else
            generator_status=125

            printf '%s\n' \
              "Generator skipped because Python compilation failed." \
              > "$DIAG/GENERATOR_NOT_RUN.txt"
          fi

          printf '%s\n' "$generator_status" \
            > "$DIAG/GENERATOR_EXIT_CODE.txt"

          exit 0

      - name: Run typecheck lint and build without stopping the workflow
        id: project_checks
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CI: "true"
        run: |
          set +e

          CHECKS="dream-application-image/Diagnostics/ProjectChecks"
          mkdir -p "$CHECKS"

          if [ ! -f package.json ]; then
            printf '%s\n' \
              "No package.json found; project checks skipped." \
              > "$CHECKS/PROJECT_CHECKS_SKIPPED.txt"

            exit 0
          fi

          PM="npm"

          if [ -f pnpm-lock.yaml ]; then
            PM="pnpm"

            corepack enable \
              > "$CHECKS/COREPACK_STDOUT.log" \
              2> "$CHECKS/COREPACK_STDERR.log"

          elif [ -f yarn.lock ]; then
            PM="yarn"

            corepack enable \
              > "$CHECKS/COREPACK_STDOUT.log" \
              2> "$CHECKS/COREPACK_STDERR.log"
          fi

          printf '%s\n' "$PM" \
            > "$CHECKS/PACKAGE_MANAGER.txt"

          if [ "$PM" = "pnpm" ]; then
            timeout 30m \
              pnpm install \
              --frozen-lockfile \
              --ignore-scripts \
              > >(tee "$CHECKS/INSTALL_STDOUT.log") \
              2> >(tee "$CHECKS/INSTALL_STDERR.log" >&2)

          elif [ "$PM" = "yarn" ]; then
            timeout 30m \
              yarn install \
              --immutable \
              --ignore-scripts \
              > >(tee "$CHECKS/INSTALL_STDOUT.log") \
              2> >(tee "$CHECKS/INSTALL_STDERR.log" >&2)

          elif [ -f package-lock.json ]; then
            timeout 30m \
              npm ci \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              > >(tee "$CHECKS/INSTALL_STDOUT.log") \
              2> >(tee "$CHECKS/INSTALL_STDERR.log" >&2)

          else
            timeout 30m \
              npm install \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              > >(tee "$CHECKS/INSTALL_STDOUT.log") \
              2> >(tee "$CHECKS/INSTALL_STDERR.log" >&2)
          fi

          install_status=$?

          printf '%s\n' "$install_status" \
            > "$CHECKS/INSTALL_EXIT_CODE.txt"

          for script_name in typecheck lint build; do
            node -e \
              "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)" \
              "$script_name"

            if [ "$?" -ne 0 ]; then
              printf '%s\n' \
                "Script not present: $script_name" \
                > "$CHECKS/${script_name^^}_SKIPPED.txt"

              continue
            fi

            if [ "$install_status" -ne 0 ]; then
              printf '%s\n' \
                "Dependency installation exited $install_status; $script_name skipped." \
                > "$CHECKS/${script_name^^}_SKIPPED.txt"

              continue
            fi

            timeout 30m \
              "$PM" run "$script_name" \
              > >(tee "$CHECKS/${script_name^^}_STDOUT.log") \
              2> >(tee "$CHECKS/${script_name^^}_STDERR.log" >&2)

            printf '%s\n' "$?" \
              > "$CHECKS/${script_name^^}_EXIT_CODE.txt"
          done

          exit 0

      - name: Document findings and create one-day full zip
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          PILLOW_OUTCOME: ${{ steps.pillow.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          CHECKS_OUTCOME: ${{ steps.project_checks.outcome }}
        run: |
          set +e

          OUT="dream-application-image"
          DIAG="$OUT/Diagnostics"
          REPORT="$DIAG/WORKFLOW_REPORT.md"

          mkdir -p "$DIAG"

          {
            echo "# DREAM Application Image Workflow Report"
            echo
            echo "The workflow records errors and continues to reporting and artifact upload."
            echo
            echo "## Step outcomes"
            echo "- Checkout: ${CHECKOUT_OUTCOME:-unknown}"
            echo "- Python setup: ${PYTHON_OUTCOME:-unknown}"
            echo "- Prepare: ${PREPARE_OUTCOME:-unknown}"
            echo "- Pillow: ${PILLOW_OUTCOME:-unknown}"
            echo "- Generator: ${GENERATE_OUTCOME:-unknown}"
            echo "- Project checks: ${CHECKS_OUTCOME:-unknown}"
            echo
            echo "## Recorded exit codes"

            find "$DIAG" \
              -name '*_EXIT_CODE.txt' \
              -type f \
              -print \
              2>/dev/null \
              | sort \
              | while read -r file; do
                  echo "- $file: $(cat "$file")"
                done

            echo
            echo "## Required outputs"

            for file in \
              "$OUT/Canonical/CANONICAL_CODE_IMAGE.png" \
              "$OUT/Decode/decode_from_image.py" \
              "$OUT/Decode/IMAGE_TO_CODE_VERIFICATION.json" \
              "$OUT/Analysis/REPO_NATIVE_SYNAPSE.png" \
              "$OUT/Analysis/IMAGE_ANALYSIS.md" \
              "$OUT/Health/CODE_HEALTH_REPORT.md" \
              "$OUT/UI/UI_ROUTE_MAP.md" \
              "$OUT/UI/UI_SYNAPSE_MAP.png"; do

              if [ -f "$file" ]; then
                echo "- PRESENT: $file ($(wc -c < "$file") bytes)"
              else
                echo "- MISSING: $file"
              fi
            done

            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$REPORT"

          cp "$REPORT" "$OUT/WORKFLOW_REPORT.md" \
            2>/dev/null \
            || true

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY" \
            2>/dev/null \
            || true

          rm -f dream-application-image-full.zip

          if [ -d "$OUT" ]; then
            zip -q -r \
              dream-application-image-full.zip \
              "$OUT"

            printf '%s\n' "$?" \
              > "$DIAG/FULL_ZIP_EXIT_CODE.txt"
          fi

          exit 0

      - name: Upload full atlas zip for one day
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dream-application-image-full
          path: dream-application-image-full.zip
          if-no-files-found: warn
          retention-days: 1

      - name: Upload analysis health diagnostics and UI maps
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dream-application-image-analysis
          path: |
            dream-application-image/README.md
            dream-application-image/ATLAS_SUMMARY.json
            dream-application-image/WORKFLOW_REPORT.md
            dream-application-image/Analysis/
            dream-application-image/Health/
            dream-application-image/UI/
            dream-application-image/Diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload decoder image manifest and verification pack
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dream-application-image-decoder
          path: |
            dream-application-image/Canonical/
            dream-application-image/Decode/decode_from_image.py
            dream-application-image/Decode/IMAGE_TO_CODE_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 7
