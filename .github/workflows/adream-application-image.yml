name: DREAM Application Image and Runtime Atlas
run-name: DREAM Application Image and Runtime Atlas

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-dream-application-atlas:
    name: Build DREAM application atlas
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        if: always()
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare output directories
        id: prepare
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p \
            dream-application-image/Canonical \
            dream-application-image/Analysis \
            dream-application-image/Decode \
            dream-application-image/Health \
            dream-application-image/UI \
            dream-application-image/Diagnostics/ProjectChecks
          printf 'Workflow started: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > dream-application-image/Diagnostics/WORKFLOW_START.txt
          exit 0

      - name: Install Pillow
        id: pillow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          DIAG="dream-application-image/Diagnostics"
          mkdir -p "$DIAG"
          python3 -m pip install --disable-pip-version-check --upgrade Pillow \
            > >(tee "$DIAG/PILLOW_INSTALL_STDOUT.log") \
            2> >(tee "$DIAG/PILLOW_INSTALL_STDERR.log" >&2)
          printf '%s\n' "$?" > "$DIAG/PILLOW_INSTALL_EXIT_CODE.txt"
          exit 0

      - name: Generate repository-native atlas and decoder
        id: generate
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DREAM_ATLAS_OUT: dream-application-image
        run: |
          set +e
          DIAG="dream-application-image/Diagnostics"
          mkdir -p "$DIAG"

          cat > "$RUNNER_TEMP/dream_repo_atlas.py" <<'PY'
          from __future__ import annotations

          import argparse
          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import struct
          import sys
          import traceback
          from collections import Counter, defaultdict, deque
          from pathlib import Path
          from typing import Any

          from PIL import Image, ImageDraw, ImageFont

          OUT = Path(os.environ.get("DREAM_ATLAS_OUT", "dream-application-image"))
          CANON = OUT / "Canonical"
          ANALYSIS = OUT / "Analysis"
          DECODE = OUT / "Decode"
          REBUILT = DECODE / "REBUILT_CODE"
          HEALTH = OUT / "Health"
          UI = OUT / "UI"
          DIAG = OUT / "Diagnostics"

          for directory in (
              OUT,
              CANON,
              ANALYSIS,
              DECODE,
              REBUILT,
              HEALTH,
              UI,
              DIAG,
          ):
              directory.mkdir(parents=True, exist_ok=True)

          ROOTS = [
              "app",
              "components",
              "coresurfaces",
              "daydreams",
              "dr-eams",
              "dreamdmbar",
              "dreamr",
              "engine",
              "engins",
              "hooks",
          ]

          EXTS = {
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
              ".mjs",
              ".cjs",
          }

          BAD_DIRS = {
              ".git",
              ".github",
              ".next",
              ".turbo",
              ".vercel",
              ".cache",
              "node_modules",
              "coverage",
              "dist",
              "build",
              "out",
              "docs",
              "doc",
              "test",
              "tests",
              "__tests__",
              "__mocks__",
              "fixtures",
              "examples",
              ".storybook",
              "storybook",
          }

          BAD_MARKERS = (
              ".test.",
              ".spec.",
              ".stories.",
              ".story.",
              ".mock.",
              ".fixture.",
              ".bench.",
              ".generated.",
              ".gen.",
              ".demo.",
              ".example.",
              ".setup.",
          )

          RGB = [
              (0, 0, 0),
              (0, 0, 255),
              (0, 255, 0),
              (0, 255, 255),
              (255, 0, 0),
              (255, 0, 255),
              (255, 255, 0),
              (255, 255, 255),
          ]

          PAIR = {
              0: ("A", 0),
              7: ("A", 1),
              1: ("B", 0),
              4: ("B", 1),
              3: ("C", 0),
              6: ("C", 1),
              2: ("D", 0),
              5: ("D", 1),
          }

          PAIR_COLOR = {
              "A": (150, 150, 150),
              "B": (255, 75, 75),
              "C": (255, 210, 0),
              "D": (170, 80, 255),
          }

          MAGIC = b"DREAMIMG4\0"
          FORMAT = "dreamengin.repo-native-lossless-image.v4"

          IMPORT_RE = [
              re.compile(
                  r"\bimport\s+(?:[^'\";]*?\s+from\s+)?['\"]([^'\"]+)['\"]",
                  re.MULTILINE,
              ),
              re.compile(
                  r"\bexport\s+(?:\*|\{[^}]*\})\s+from\s+['\"]([^'\"]+)['\"]",
                  re.MULTILINE,
              ),
              re.compile(
                  r"\brequire\s*$begin:math:text$\\s\*\[\'\\\"\]\(\[\^\'\\\"\]\+\)\[\'\\\"\]\\s\*$end:math:text$"
              ),
              re.compile(
                  r"\bimport\s*$begin:math:text$\\s\*\[\'\\\"\]\(\[\^\'\\\"\]\+\)\[\'\\\"\]\\s\*$end:math:text$"
              ),
          ]

          EXPORT_DECL_RE = re.compile(
              r"\bexport\s+"
              r"(?:default\s+)?"
              r"(?:async\s+)?"
              r"(?:function|class|const|let|var|enum)"
              r"\s*([A-Za-z_$][\w$]*)?"
          )

          EXPORT_LIST_RE = re.compile(
              r"\bexport\s*(?!type\b)\{([^}]*)\}",
              re.DOTALL,
          )

          VALUE_RE = re.compile(
              r"\b(?:const|let|var|function|class|enum|namespace|return|new)\b"
              r"|<\s*[A-Z][A-Za-z0-9_.]*\b"
          )

          SUSPICIOUS = {
              "eval": re.compile(r"\beval\s*$begin:math:text$\"\)\,
              \"new Function\"\: re\.compile\(r\"\\bnew\\s\+Function\\s\*\\\(\"\)\,
              \"dangerouslySetInnerHTML\"\: re\.compile\(
                  r\"\\bdangerouslySetInnerHTML\\b\"
              \)\,
              \"ts\-ignore\"\: re\.compile\(r\"\@ts\-ignore\\b\"\)\,
              \"ts\-nocheck\"\: re\.compile\(r\"\@ts\-nocheck\\b\"\)\,
              \"TODO\/FIXME\/HACK\"\: re\.compile\(
                  r\"\\b\(\?\:TODO\|FIXME\|HACK\|XXX\)\\b\"\,
                  re\.IGNORECASE\,
              \)\,
              \"console\.log\"\: re\.compile\(r\"\\bconsole\\\.log\\s\*\\\(\"\)\,
              \"localhost\"\: re\.compile\(
                  r\"\(\?\:https\?\:\/\/\)\?localhost\(\?\:\:\\d\+\)\?\"\,
                  re\.IGNORECASE\,
              \)\,
              \"empty catch\"\: re\.compile\(
                  r\"catch\\s\*\(\?\:\\\(\[\^\)\]\*$end:math:text$)?\s*\{\s*\}",
                  re.DOTALL,
              ),
          }


          def write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")


          def strip_comments(text: str) -> str:
              text = re.sub(
                  r"/\*.*?\*/",
                  " ",
                  text,
                  flags=re.DOTALL,
              )
              return re.sub(
                  r"(^|[^:])//.*?$",
                  r"\1 ",
                  text,
                  flags=re.MULTILINE,
              )


          def excluded(relative_path: Path) -> tuple[bool, str]:
              parts = [
                  part.lower()
                  for part in relative_path.parts
              ]

              if any(
                  part in BAD_DIRS
                  for part in parts[:-1]
              ):
                  return True, "excluded directory"

              name = relative_path.name.lower()

              if relative_path.stem.lower() == "index":
                  return True, "index/barrel file"

              if name.endswith(".d.ts"):
                  return True, "type declaration"

              if any(
                  marker in name
                  for marker in BAD_MARKERS
              ):
                  return True, "test/story/mock/generated file"

              return False, ""


          def imports(text: str) -> list[str]:
              clean = strip_comments(text)
              output: list[str] = []

              for pattern in IMPORT_RE:
                  output.extend(
                      match.group(1)
                      for match in pattern.finditer(clean)
                  )

              return list(dict.fromkeys(output))


          def runtime_exports(text: str) -> list[str]:
              clean = strip_comments(text)
              output: list[str] = []

              for match in EXPORT_DECL_RE.finditer(clean):
                  output.append(
                      match.group(1) or "default"
                  )

              for match in EXPORT_LIST_RE.finditer(clean):
                  for raw_item in match.group(1).split(","):
                      raw_item = raw_item.strip()

                      if (
                          not raw_item
                          or raw_item.startswith("type ")
                      ):
                          continue

                      name = re.split(
                          r"\s+as\s+",
                          raw_item,
                          maxsplit=1,
                      )[0].strip()

                      if re.fullmatch(
                          r"[A-Za-z_$][\w$]*",
                          name,
                      ):
                          output.append(name)

              if "module.exports" in clean:
                  output.append("module.exports")

              return output


          def type_only(text: str) -> bool:
              clean = strip_comments(text)

              has_types = bool(
                  re.search(
                      r"\b(?:interface|type)\s+[A-Za-z_$]"
                      r"|\b(?:import|export)\s+type\b",
                      clean,
                  )
              )

              return (
                  has_types
                  and not bool(VALUE_RE.search(clean))
              )


          def collect(
              repo: Path,
          ) -> tuple[
              list[Path],
              dict[str, Path],
              dict[str, str],
              list[dict[str, str]],
          ]:
              all_code: dict[str, Path] = {}
              reasons: dict[str, str] = {}
              excluded_rows: list[dict[str, str]] = []
              seeds: list[Path] = []

              for path in repo.rglob("*"):
                  if (
                      not path.is_file()
                      or path.suffix.lower() not in EXTS
                  ):
                      continue

                  relative_path = path.relative_to(repo)

                  if any(
                      part.lower() in BAD_DIRS
                      for part in relative_path.parts[:-1]
                  ):
                      continue

                  key = relative_path.as_posix()
                  all_code[key] = path

                  is_bad, reason = excluded(relative_path)

                  if is_bad:
                      reasons[key] = reason
                      excluded_rows.append(
                          {
                              "path": key,
                              "reason": reason,
                          }
                      )
                      continue

                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="replace",
                      )
                  except OSError as error:
                      reasons[key] = f"read error: {error}"
                      excluded_rows.append(
                          {
                              "path": key,
                              "reason": reasons[key],
                          }
                      )
                      continue

                  if type_only(text):
                      reasons[key] = "type-only module"
                      excluded_rows.append(
                          {
                              "path": key,
                              "reason": reasons[key],
                          }
                      )
                      continue

                  if (
                      relative_path.parts
                      and relative_path.parts[0] in ROOTS
                  ):
                      seeds.append(path)

              return (
                  seeds,
                  all_code,
                  reasons,
                  excluded_rows,
              )


          def candidates(base: Path) -> list[Path]:
              if base.suffix.lower() in EXTS:
                  return [base]

              return [
                  Path(str(base) + extension)
                  for extension in sorted(EXTS)
              ] + [
                  base / f"index{extension}"
                  for extension in sorted(EXTS)
              ]


          def resolve(
              repo: Path,
              source: Path,
              specifier: str,
              all_code: dict[str, Path],
          ) -> Path | None:
              if specifier.startswith("."):
                  base = (
                      source.parent / specifier
                  ).resolve()

              elif specifier.startswith(("@/", "~/")):
                  base = (
                      repo / specifier[2:]
                  ).resolve()

              elif any(
                  specifier == root
                  or specifier.startswith(root + "/")
                  for root in ROOTS
              ):
                  base = (
                      repo / specifier
                  ).resolve()

              else:
                  return None

              for path in candidates(base):
                  try:
                      key = path.relative_to(
                          repo
                      ).as_posix()
                  except ValueError:
                      continue

                  if key in all_code:
                      return all_code[key]

              return None


          def barrel_leaves(
              repo: Path,
              barrel: Path,
              all_code: dict[str, Path],
              seen: set[str] | None = None,
          ) -> set[Path]:
              seen = (
                  set()
                  if seen is None
                  else seen
              )

              key = barrel.relative_to(
                  repo
              ).as_posix()

              if key in seen:
                  return set()

              seen.add(key)

              try:
                  text = barrel.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
              except OSError:
                  return set()

              output: set[Path] = set()

              for specifier in imports(text):
                  target = resolve(
                      repo,
                      barrel,
                      specifier,
                      all_code,
                  )

                  if not target:
                      continue

                  if target.stem.lower() == "index":
                      output.update(
                          barrel_leaves(
                              repo,
                              target,
                              all_code,
                              seen,
                          )
                      )
                  else:
                      output.add(target)

              return output


          def closure(
              repo: Path,
              seeds: list[Path],
              all_code: dict[str, Path],
              reasons: dict[str, str],
          ) -> list[Path]:
              included = {
                  path.relative_to(repo).as_posix(): path
                  for path in seeds
              }

              queue = deque(seeds)

              while queue:
                  source = queue.popleft()

                  text = source.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  for specifier in imports(text):
                      target = resolve(
                          repo,
                          source,
                          specifier,
                          all_code,
                      )

                      if not target:
                          continue

                      if target.stem.lower() == "index":
                          targets = barrel_leaves(
                              repo,
                              target,
                              all_code,
                          )
                      else:
                          targets = {target}

                      for item in targets:
                          key = item.relative_to(
                              repo
                          ).as_posix()

                          if (
                              key in included
                              or key in reasons
                          ):
                              continue

                          included[key] = item
                          queue.append(item)

              return list(included.values())


          def dominant_pair(data: bytes) -> str:
              counts = Counter()
              accumulator = 0
              bit_count = 0

              for byte in data:
                  accumulator = (
                      accumulator << 8
                  ) | byte

                  bit_count += 8

                  while bit_count >= 3:
                      shift = bit_count - 3
                      value = (
                          accumulator >> shift
                      ) & 7

                      counts[
                          PAIR[value][0]
                      ] += 1

                      bit_count -= 3

                      accumulator &= (
                          (1 << bit_count) - 1
                          if bit_count
                          else 0
                      )

              if not counts:
                  return "A"

              return max(
                  "ABCD",
                  key=lambda group: counts[group],
              )


          def graph_data(
              repo: Path,
              files: list[Path],
              all_code: dict[str, Path],
              reasons: dict[str, str],
          ):
              included = {
                  path.relative_to(repo).as_posix()
                  for path in files
              }

              records: dict[
                  str,
                  dict[str, Any],
              ] = {}

              graph = {
                  key: set()
                  for key in included
              }

              unresolved: list[dict[str, str]] = []
              excluded_deps: list[dict[str, str]] = []
              external: list[dict[str, str]] = []

              for path in files:
                  relative_path = path.relative_to(
                      repo
                  ).as_posix()

                  data = path.read_bytes()

                  text = data.decode(
                      "utf-8",
                      errors="replace",
                  )

                  export_names = runtime_exports(text)

                  records[relative_path] = {
                      "path": relative_path,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(
                          data
                      ).hexdigest(),
                      "runtimeExports": export_names,
                      "runtimeExportCount": len(
                          export_names
                      ),
                      "dominantPair": dominant_pair(
                          data
                      ),
                      "jsx": path.suffix.lower()
                      in {".tsx", ".jsx"},
                  }

                  for specifier in imports(text):
                      target = resolve(
                          repo,
                          path,
                          specifier,
                          all_code,
                      )

                      if not target:
                          if (
                              specifier.startswith(
                                  (".", "@/", "~/")
                              )
                              or any(
                                  specifier == root
                                  or specifier.startswith(
                                      root + "/"
                                  )
                                  for root in ROOTS
                              )
                          ):
                              unresolved.append(
                                  {
                                      "source": relative_path,
                                      "specifier": specifier,
                                  }
                              )
                          else:
                              external.append(
                                  {
                                      "source": relative_path,
                                      "specifier": specifier,
                                  }
                              )

                          continue

                      if target.stem.lower() == "index":
                          targets = barrel_leaves(
                              repo,
                              target,
                              all_code,
                          )
                      else:
                          targets = {target}

                      connected = False

                      for leaf in targets:
                          key = leaf.relative_to(
                              repo
                          ).as_posix()

                          if key in included:
                              graph[
                                  relative_path
                              ].add(key)
                              connected = True

                          elif key in reasons:
                              excluded_deps.append(
                                  {
                                      "source": relative_path,
                                      "specifier": specifier,
                                      "target": key,
                                      "reason": reasons[key],
                                  }
                              )

                      target_key = target.relative_to(
                          repo
                      ).as_posix()

                      if (
                          not connected
                          and target_key in reasons
                      ):
                          excluded_deps.append(
                              {
                                  "source": relative_path,
                                  "specifier": specifier,
                                  "target": target_key,
                                  "reason": reasons[
                                      target_key
                                  ],
                              }
                          )

              incoming = Counter(
                  target
                  for targets in graph.values()
                  for target in targets
              )

              for relative_path in records:
                  records[
                      relative_path
                  ]["internalImports"] = sorted(
                      graph[relative_path]
                  )

                  records[
                      relative_path
                  ]["fanOut"] = len(
                      graph[relative_path]
                  )

                  records[
                      relative_path
                  ]["fanIn"] = incoming[
                      relative_path
                  ]

              return (
                  records,
                  graph,
                  unresolved,
                  excluded_deps,
                  external,
              )


          def score(
              record: dict[str, Any],
          ) -> tuple[int, int, int, int, str]:
              return (
                  record["runtimeExportCount"],
                  record["fanIn"] + record["fanOut"],
                  record["fanIn"],
                  record["bytes"],
                  record["path"],
              )


          def traverse(
              records: dict[str, dict[str, Any]],
              graph: dict[str, set[str]],
          ):
              root = max(
                  records,
                  key=lambda relative_path: score(
                      records[relative_path]
                  ),
              )

              reverse = defaultdict(set)

              for source, targets in graph.items():
                  for target in targets:
                      reverse[target].add(source)

              visited: set[str] = set()
              order: list[str] = []
              islands: list[dict[str, Any]] = []
              depth: dict[str, int] = {}

              def walk(
                  seed: str,
                  index: int,
              ) -> None:
                  queue = deque([(seed, 0)])
                  count = 0

                  while queue:
                      node, current_depth = (
                          queue.popleft()
                      )

                      if node in visited:
                          continue

                      visited.add(node)
                      order.append(node)
                      depth[node] = current_depth
                      count += 1

                      neighbors = (
                          graph[node]
                          | reverse[node]
                      ) - visited

                      queue.extend(
                          (
                              neighbor,
                              current_depth + 1,
                          )
                          for neighbor in sorted(
                              neighbors,
                              key=lambda item: score(
                                  records[item]
                              ),
                              reverse=True,
                          )
                      )

                  islands.append(
                      {
                          "index": index,
                          "root": seed,
                          "fileCount": count,
                      }
                  )

              walk(root, 0)

              while len(visited) < len(records):
                  seed = max(
                      (
                          relative_path
                          for relative_path in records
                          if relative_path not in visited
                      ),
                      key=lambda relative_path: score(
                          records[relative_path]
                      ),
                  )

                  walk(seed, len(islands))

              return (
                  root,
                  order,
                  islands,
                  depth,
              )


          def strongly_connected_components(
              graph: dict[str, set[str]],
          ) -> list[list[str]]:
              index = 0
              stack: list[str] = []
              on_stack: set[str] = set()
              indices: dict[str, int] = {}
              low_links: dict[str, int] = {}
              output: list[list[str]] = []

              def visit(node: str) -> None:
                  nonlocal index

                  indices[node] = index
                  low_links[node] = index
                  index += 1

                  stack.append(node)
                  on_stack.add(node)

                  for target in graph[node]:
                      if target not in indices:
                          visit(target)

                          low_links[node] = min(
                              low_links[node],
                              low_links[target],
                          )

                      elif target in on_stack:
                          low_links[node] = min(
                              low_links[node],
                              indices[target],
                          )

                  if low_links[node] != indices[node]:
                      return

                  component: list[str] = []

                  while True:
                      target = stack.pop()
                      on_stack.remove(target)
                      component.append(target)

                      if target == node:
                          break

                  if (
                      len(component) > 1
                      or node in graph[node]
                  ):
                      output.append(
                          sorted(component)
                      )

              for node in graph:
                  if node not in indices:
                      visit(node)

              return sorted(
                  output,
                  key=lambda component: (
                      -len(component),
                      component,
                  ),
              )


          def build_payload(
              repo: Path,
              records,
              graph,
              root,
              order,
              islands,
          ):
              files = []
              parts = []
              offset = 0

              for index, relative_path in enumerate(order):
                  data = (
                      repo / relative_path
                  ).read_bytes()

                  record = records[relative_path]

                  files.append(
                      {
                          "path": relative_path,
                          "length": len(data),
                          "sha256": record["sha256"],
                          "traversalIndex": index,
                          "dataOffset": offset,
                          "runtimeExportCount": record[
                              "runtimeExportCount"
                          ],
                          "internalImports": sorted(
                              graph[relative_path]
                          ),
                      }
                  )

                  parts.append(data)
                  offset += len(data)

              manifest = {
                  "format": FORMAT,
                  "encoding": {
                      "bitsPerCell": 3,
                      "bitOrder": "MSB-first",
                      "states": {
                          f"{value:03b}": RGB[value]
                          for value in range(8)
                      },
                      "pairs": {
                          "A0": "000",
                          "A1": "111",
                          "B0": "001",
                          "B1": "100",
                          "C0": "011",
                          "C1": "110",
                          "D0": "010",
                          "D1": "101",
                      },
                  },
                  "rootFile": root,
                  "rootRule": (
                      "highest runtime-export count; "
                      "dependency degree, fan-in, bytes, "
                      "and path are deterministic tie-breakers"
                  ),
                  "traversal": (
                      "undirected dependency BFS; "
                      "disconnected islands restart from "
                      "the strongest remaining file"
                  ),
                  "islands": islands,
                  "files": files,
              }

              manifest_bytes = json.dumps(
                  manifest,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")

              payload = (
                  MAGIC
                  + struct.pack(
                      ">Q",
                      len(manifest_bytes),
                  )
                  + manifest_bytes
                  + b"".join(parts)
              )

              return payload, manifest


          def encode_png(
              payload: bytes,
              path: Path,
          ):
              source_bits = len(payload) * 8
              cells = math.ceil(source_bits / 3)
              padding_bits = (
                  cells * 3
                  - source_bits
              )

              width = math.ceil(
                  math.sqrt(cells)
              )

              height = math.ceil(
                  cells / width
              )

              number = (
                  int.from_bytes(payload, "big")
                  << padding_bits
              )

              octal = format(
                  number,
                  f"0{cells}o",
              ).encode("ascii")

              indices = bytearray(
                  octal
              ).translate(
                  bytes.maketrans(
                      b"01234567",
                      bytes(range(8)),
                  )
              )

              state_counts = [
                  indices.count(value)
                  for value in range(8)
              ]

              canvas = (
                  indices
                  + bytearray(
                      [255]
                  )
                  * (
                      width * height
                      - cells
                  )
              )

              image = Image.frombytes(
                  "P",
                  (width, height),
                  bytes(canvas),
              )

              palette = [
                  channel
                  for color in RGB
                  for channel in color
              ]

              palette += [
                  0
              ] * (
                  256 * 3
                  - len(palette)
              )

              image.putpalette(palette)
              image.info["transparency"] = 255

              image.save(
                  path,
                  "PNG",
                  compress_level=6,
              )

              entropy = -sum(
                  (
                      count / cells
                  )
                  * math.log2(
                      count / cells
                  )
                  for count in state_counts
                  if count
              )

              pair_counts = Counter()
              polarity_counts = Counter()

              for value, count in enumerate(
                  state_counts
              ):
                  group, member = PAIR[value]

                  pair_counts[group] += count
                  polarity_counts[
                      str(member)
                  ] += count

              runs = []
              transitions = Counter()

              if indices:
                  previous = indices[0]
                  current_run = 1

                  for current in indices[1:]:
                      if current == previous:
                          current_run += 1
                      else:
                          runs.append(current_run)

                          transitions[
                              f"{previous:03b}->{current:03b}"
                          ] += 1

                          previous = current
                          current_run = 1

                  runs.append(current_run)

              image_info = {
                  "payloadBytes": len(payload),
                  "sourceBits": source_bits,
                  "cellCount": cells,
                  "width": width,
                  "height": height,
                  "paddingBits": padding_bits,
              }

              image_analysis = {
                  **image_info,
                  "stateCounts": {
                      f"{value:03b}": state_counts[value]
                      for value in range(8)
                  },
                  "pairCounts": dict(pair_counts),
                  "polarityCounts": dict(
                      polarity_counts
                  ),
                  "entropyBitsPerCell": entropy,
                  "meanRunLength": (
                      sum(runs) / len(runs)
                      if runs
                      else 0
                  ),
                  "maxRunLength": (
                      max(runs)
                      if runs
                      else 0
                  ),
                  "topTransitions": transitions.most_common(
                      32
                  ),
              }

              return image_info, image_analysis


          def decoder_text() -> str:
              return r'''from __future__ import annotations

          import argparse
          import hashlib
          import json
          import struct
          from pathlib import Path

          from PIL import Image

          MAGIC = b"DREAMIMG4\0"


          def image_bytes(path: Path) -> bytes:
              image = Image.open(path)

              if image.mode != "P":
                  raise ValueError(
                      "Canonical image must remain an indexed PNG."
                  )

              raw = image.tobytes()
              end = raw.find(b"\xff")

              if end >= 0:
                  raw = raw[:end]

              if any(value > 7 for value in raw):
                  raise ValueError(
                      "Canonical palette indices must be 0..7."
                  )

              octal = raw.translate(
                  bytes.maketrans(
                      bytes(range(8)),
                      b"01234567",
                  )
              )

              number = (
                  int(octal, 8)
                  if octal
                  else 0
              )

              total_bits = len(raw) * 3

              for padding_bits in (0, 1, 2):
                  usable_bits = (
                      total_bits
                      - padding_bits
                  )

                  if (
                      usable_bits >= 0
                      and usable_bits % 8 == 0
                  ):
                      packed = (
                          number >> padding_bits
                      ).to_bytes(
                          usable_bits // 8,
                          "big",
                      )

                      if packed.startswith(MAGIC):
                          return packed

              raise ValueError(
                  "DREAM header was not found; "
                  "the image was altered or alignment is invalid."
              )


          def decode(
              image: Path,
              output: Path,
          ) -> dict:
              packed = image_bytes(image)
              cursor = len(MAGIC)

              manifest_length = struct.unpack(
                  ">Q",
                  packed[
                      cursor:
                      cursor + 8
                  ],
              )[0]

              cursor += 8

              manifest = json.loads(
                  packed[
                      cursor:
                      cursor + manifest_length
                  ].decode("utf-8")
              )

              cursor += manifest_length

              output.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              base = output.resolve()
              results = []

              for item in manifest["files"]:
                  length = int(item["length"])

                  data = packed[
                      cursor:
                      cursor + length
                  ]

                  cursor += length

                  destination = (
                      output / item["path"]
                  ).resolve()

                  if (
                      base != destination
                      and base not in destination.parents
                  ):
                      raise ValueError(
                          "Unsafe path in image manifest: "
                          f"{item['path']}"
                      )

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  destination.write_bytes(data)

                  actual_hash = hashlib.sha256(
                      data
                  ).hexdigest()

                  results.append(
                      {
                          "path": item["path"],
                          "expectedLength": length,
                          "decodedLength": len(data),
                          "expectedSha256": item[
                              "sha256"
                          ],
                          "decodedSha256": actual_hash,
                          "exactMatch": (
                              len(data) == length
                              and actual_hash
                              == item["sha256"]
                          ),
                      }
                  )

              return {
                  "format": manifest.get("format"),
                  "rootFile": manifest.get(
                      "rootFile"
                  ),
                  "fileCount": len(results),
                  "exactFileCount": sum(
                      result["exactMatch"]
                      for result in results
                  ),
                  "allExact": all(
                      result["exactMatch"]
                      for result in results
                  ),
                  "files": results,
              }


          def main() -> int:
              parser = argparse.ArgumentParser()

              parser.add_argument(
                  "image",
                  type=Path,
              )

              parser.add_argument(
                  "output",
                  type=Path,
              )

              parser.add_argument(
                  "--verification",
                  type=Path,
              )

              arguments = parser.parse_args()

              result = decode(
                  arguments.image,
                  arguments.output,
              )

              text = json.dumps(
                  result,
                  indent=2,
              )

              print(text)

              if arguments.verification:
                  arguments.verification.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  arguments.verification.write_text(
                      text + "\n",
                      encoding="utf-8",
                  )

              return (
                  0
                  if result["allExact"]
                  else 2
              )


          if __name__ == "__main__":
              raise SystemExit(main())
          '''


          def font(
              size: int,
              bold: bool = False,
          ):
              paths = [
                  (
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf"
                      if bold
                      else
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans.ttf"
                  ),
                  (
                      "/usr/share/fonts/truetype/liberation2/"
                      "LiberationSans-Bold.ttf"
                      if bold
                      else
                      "/usr/share/fonts/truetype/liberation2/"
                      "LiberationSans-Regular.ttf"
                  ),
              ]

              for path in paths:
                  if Path(path).exists():
                      return ImageFont.truetype(
                          path,
                          size,
                      )

              return ImageFont.load_default()


          def layout(
              records,
              graph,
              islands,
              depth,
              size=3000,
          ):
              reverse = defaultdict(set)

              for source, targets in graph.items():
                  for target in targets:
                      reverse[target].add(source)

              positions = {}
              center = size / 2

              for island_index, island in enumerate(islands):
                  root = island["root"]
                  nodes = []

                  queue = deque([root])
                  seen = set()

                  while queue:
                      node = queue.popleft()

                      if node in seen:
                          continue

                      seen.add(node)
                      nodes.append(node)

                      queue.extend(
                          (
                              graph[node]
                              | reverse[node]
                          ) - seen
                      )

                  if island_index == 0:
                      center_x = center
                      center_y = center
                      scale = size * 0.38
                  else:
                      angle = (
                          2
                          * math.pi
                          * (island_index - 1)
                          / max(
                              1,
                              len(islands) - 1,
                          )
                      )

                      center_x = (
                          center
                          + math.cos(angle)
                          * size
                          * 0.38
                      )

                      center_y = (
                          center
                          + math.sin(angle)
                          * size
                          * 0.38
                      )

                      scale = size * 0.10

                  levels = defaultdict(list)

                  for node in nodes:
                      levels[
                          depth.get(node, 0)
                      ].append(node)

                  for current_depth, level in levels.items():
                      radius = min(
                          scale,
                          25
                          + current_depth
                          * max(
                              10,
                              scale
                              / max(
                                  1,
                                  len(levels),
                              ),
                          ),
                      )

                      ranked_level = sorted(
                          level,
                          key=lambda node: score(
                              records[node]
                          ),
                          reverse=True,
                      )

                      for index, node in enumerate(
                          ranked_level
                      ):
                          angle = (
                              2
                              * math.pi
                              * index
                              / max(
                                  1,
                                  len(ranked_level),
                              )
                          )

                          positions[node] = (
                              center_x
                              + math.cos(angle)
                              * radius,
                              center_y
                              + math.sin(angle)
                              * radius,
                          )

              return positions


          def render_repo(
              records,
              graph,
              root,
              islands,
              depth,
          ) -> None:
              size = 3000

              positions = layout(
                  records,
                  graph,
                  islands,
                  depth,
                  size,
              )

              image = Image.new(
                  "RGB",
                  (size, size),
                  (10, 12, 18),
              )

              draw = ImageDraw.Draw(image)

              for source, targets in graph.items():
                  if source not in positions:
                      continue

                  for target in targets:
                      if target not in positions:
                          continue

                      draw.line(
                          (
                              *positions[source],
                              *positions[target],
                          ),
                          fill=(65, 72, 92),
                          width=1,
                      )

              labels = {
                  root
              } | set(
                  sorted(
                      records,
                      key=lambda item: score(
                          records[item]
                      ),
                      reverse=True,
                  )[:60]
              )

              small_font = font(14)
              title_font = font(34, True)

              for node, (
                  x_position,
                  y_position,
              ) in positions.items():
                  radius = max(
                      3,
                      min(
                          22,
                          3
                          + math.sqrt(
                              records[node]["bytes"]
                          ) / 60
                          + records[node][
                              "runtimeExportCount"
                          ],
                      ),
                  )

                  color = PAIR_COLOR[
                      records[node]["dominantPair"]
                  ]

                  outline = (
                      (255, 255, 255)
                      if node == root
                      else
                      (190, 195, 210)
                  )

                  draw.ellipse(
                      (
                          x_position - radius,
                          y_position - radius,
                          x_position + radius,
                          y_position + radius,
                      ),
                      fill=color,
                      outline=outline,
                      width=(
                          3
                          if node == root
                          else 1
                      ),
                  )

                  if node in labels:
                      draw.text(
                          (
                              x_position
                              + radius
                              + 3,
                              y_position - 7,
