name: Full Repair

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit deterministic repairs back to the branch"
        type: boolean
        default: true
      install_dependencies:
        description: "Install dependencies before verification"
        type: boolean
        default: true
      run_typecheck:
        description: "Run package typecheck when available"
        type: boolean
        default: true
      run_lint:
        description: "Run package lint when available"
        type: boolean
        default: false
      run_tests:
        description: "Run package tests when available"
        type: boolean
        default: false
      commit_message:
        description: "Commit message"
        type: string
        default: "chore(dreamengin): deterministic repo repair"

permissions:
  contents: write
  actions: read

concurrency:
  group: dreamengin-deterministic-full-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-full-repair:
    name: Scan, repair, verify, and commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        if: ${{ inputs.install_dependencies }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable || true

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Write deterministic repair runner outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dreamengin-repair"

          cat > "$RUNNER_TEMP/dreamengin-repair/deterministic-repair.cjs" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const cp = require("node:child_process");

          const ROOT = process.cwd();
          const REPORT_LINES = [];

          const IGNORE_DIRS = new Set([
            "node_modules",
            ".git",
            ".next",
            ".vercel",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".husky",
          ]);

          const MEDIA_EXTENSIONS = new Set([
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".webp",
            ".avif",
            ".mp4",
            ".mov",
            ".webm",
            ".m4v",
            ".avi",
            ".mkv",
            ".ico",
          ]);

          const CODE_EXTENSIONS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
          ]);

          const TEXT_EXTENSIONS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".css",
            ".scss",
            ".sql",
            ".md",
            ".yml",
            ".yaml",
          ]);

          const RESOLVE_EXTENSIONS = [
            "",
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".json",
            ".css",
            ".scss",
            ".module.css",
            ".module.scss",
            ".wasm",
            ".sql",
            ".svg",
          ];

          const INDEX_EXTENSIONS = [
            "/index.ts",
            "/index.tsx",
            "/index.js",
            "/index.jsx",
            "/index.mjs",
            "/index.cjs",
            "/index.json",
          ];

          function log(line = "") {
            console.log(line);
            REPORT_LINES.push(line);
          }

          function posix(value) {
            return value.split(path.sep).join("/");
          }

          function rel(value) {
            return posix(path.relative(ROOT, value));
          }

          function abs(file) {
            return path.join(ROOT, file);
          }

          function exists(file) {
            return fs.existsSync(abs(file));
          }

          function isDir(file) {
            try {
              return fs.statSync(abs(file)).isDirectory();
            } catch {
              return false;
            }
          }

          function ext(file) {
            return path.extname(file).toLowerCase();
          }

          function read(file) {
            return fs.readFileSync(abs(file), "utf8");
          }

          function write(file, content) {
            fs.mkdirSync(path.dirname(abs(file)), { recursive: true });
            const current = exists(file) ? read(file) : null;
            if (current === content) return false;
            fs.writeFileSync(abs(file), content, "utf8");
            return true;
          }

          function walk(dirAbs, out = []) {
            for (const entry of fs.readdirSync(dirAbs, { withFileTypes: true })) {
              if (entry.isDirectory() && IGNORE_DIRS.has(entry.name)) continue;

              const full = path.join(dirAbs, entry.name);
              const relative = rel(full);

              if (entry.isDirectory()) {
                walk(full, out);
              } else {
                out.push(relative);
              }
            }

            return out;
          }

          function scan() {
            const allFiles = walk(ROOT).sort();
            const sourceFiles = allFiles.filter((file) => !MEDIA_EXTENSIONS.has(ext(file)));
            const textFiles = sourceFiles.filter((file) => TEXT_EXTENSIONS.has(ext(file)));
            const codeFiles = sourceFiles.filter((file) => CODE_EXTENSIONS.has(ext(file)));

            const fileSet = new Set(allFiles);
            const fileCaseMap = new Map();

            for (const file of allFiles) {
              fileCaseMap.set(file.toLowerCase(), file);
            }

            return { allFiles, sourceFiles, textFiles, codeFiles, fileSet, fileCaseMap };
          }

          function repairCodeEnginCaseCollision() {
            log("## CodeEngin casing repair");

            const oldDir = "engins/CodeEngin";
            const newDir = "engins/codeengin-ui";

            if (isDir(oldDir) && !exists(newDir)) {
              fs.renameSync(abs(oldDir), abs(newDir));
              log(`- renamed ${oldDir} to ${newDir}`);
            } else if (isDir(oldDir) && isDir(newDir)) {
              log(`- both ${oldDir} and ${newDir} exist; manual merge required`);
            } else {
              log(`- ${oldDir} not present`);
            }

            const { textFiles } = scan();
            let touched = 0;

            for (const file of textFiles) {
              if (!exists(file)) continue;

              const current = read(file);
              const next = current
                .split("engins/CodeEngin")
                .join("engins/codeengin-ui")
                .split("@/engins/CodeEngin")
                .join("@/engins/codeengin-ui");

              if (write(file, next)) {
                touched += 1;
                log(`- updated reference in ${file}`);
              }
            }

            log(`- files touched: ${touched}`);
            log();
          }

          function isBoundary(ch) {
            if (!ch) return true;
            return !/[A-Za-z0-9_$]/.test(ch);
          }

          function startsWord(content, index, word) {
            return content.slice(index, index + word.length) === word &&
              isBoundary(content[index - 1]) &&
              isBoundary(content[index + word.length]);
          }

          function findStatementEnd(content, start) {
            let quote = "";
            let escaped = false;
            let lineComment = false;
            let blockComment = false;

            for (let index = start; index < content.length; index += 1) {
              const ch = content[index];
              const next = content[index + 1];

              if (lineComment) {
                if (ch === "\n") lineComment = false;
                continue;
              }

              if (blockComment) {
                if (ch === "*" && next === "/") {
                  blockComment = false;
                  index += 1;
                }
                continue;
              }

              if (quote) {
                if (escaped) {
                  escaped = false;
                  continue;
                }

                if (ch === "\\") {
                  escaped = true;
                  continue;
                }

                if (ch === quote) quote = "";
                continue;
              }

              if (ch === "/" && next === "/") {
                lineComment = true;
                index += 1;
                continue;
              }

              if (ch === "/" && next === "*") {
                blockComment = true;
                index += 1;
                continue;
              }

              if (ch === "'" || ch === '"' || ch === "`") {
                quote = ch;
                continue;
              }

              if (ch === ";") return index + 1;
              if (ch === "\n" && !content.slice(start, index).includes("{")) return index + 1;
            }

            return content.length;
          }

          function findQuoted(text, start = 0) {
            for (let index = start; index < text.length; index += 1) {
              const quote = text[index];
              if (quote !== "'" && quote !== '"' && quote !== "`") continue;

              let value = "";
              let escaped = false;

              for (let cursor = index + 1; cursor < text.length; cursor += 1) {
                const ch = text[cursor];

                if (escaped) {
                  value += ch;
                  escaped = false;
                  continue;
                }

                if (ch === "\\") {
                  escaped = true;
                  continue;
                }

                if (ch === quote) {
                  return { value, start: index, end: cursor + 1 };
                }

                value += ch;
              }
            }

            return null;
          }

          function importStatements(content) {
            const items = [];

            for (let index = 0; index < content.length; index += 1) {
              if (!startsWord(content, index, "import") && !startsWord(content, index, "export")) continue;

              const keyword = startsWord(content, index, "import") ? "import" : "export";
              const end = findStatementEnd(content, index);
              const statement = content.slice(index, end);

              let quoted = null;
              const fromMatch = statement.match(/\bfrom\s*(['"`][^'"`]+['"`])/);

              if (fromMatch) {
                const fromIndex = statement.indexOf(fromMatch[1]);
                quoted = findQuoted(statement, fromIndex);
              } else if (keyword === "import") {
                quoted = findQuoted(statement, keyword.length);
              }

              if (quoted) {
                items.push({
                  start: index,
                  end,
                  specifier: quoted.value,
                  specifierStart: index + quoted.start + 1,
                  specifierEnd: index + quoted.end - 1,
                });
              }

              index = end - 1;
            }

            return items;
          }

          function isInternal(specifier) {
            return specifier.startsWith(".") || specifier.startsWith("/") || specifier.startsWith("@/");
          }

          function cleanSpecifier(specifier) {
            return specifier.split("?")[0].split("#")[0];
          }

          function candidates(fromFile, specifier) {
            const clean = cleanSpecifier(specifier);

            if (clean.startsWith("@/")) return [clean.slice(2)];
            if (clean.startsWith(".")) return [path.posix.normalize(path.posix.join(path.posix.dirname(fromFile), clean))];
            if (clean.startsWith("/")) return [clean.slice(1), path.posix.join("public", clean.slice(1))];

            return [];
          }

          function tryResolve(candidate, fileSet, fileCaseMap, caseInsensitive) {
            function hit(file) {
              if (caseInsensitive) return fileCaseMap.get(file.toLowerCase()) || null;
              return fileSet.has(file) ? file : null;
            }

            const direct = hit(candidate);
            if (direct) return direct;

            for (const extension of RESOLVE_EXTENSIONS) {
              const resolved = hit(`${candidate}${extension}`);
              if (resolved) return resolved;
            }

            for (const indexExtension of INDEX_EXTENSIONS) {
              const resolved = hit(`${candidate}${indexExtension}`);
              if (resolved) return resolved;
            }

            return null;
          }

          function resolveSpecifier(fromFile, specifier, fileSet, fileCaseMap, caseInsensitive) {
            for (const candidate of candidates(fromFile, specifier)) {
              const resolved = tryResolve(candidate, fileSet, fileCaseMap, caseInsensitive);
              if (resolved) return resolved;
            }

            return null;
          }

          function removeKnownCodeExtension(file) {
            for (const extension of [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]) {
              if (file.endsWith(extension)) return file.slice(0, -extension.length);
            }

            return file;
          }

          function buildSpecifier(fromFile, oldSpecifier, resolvedFile) {
            const clean = cleanSpecifier(oldSpecifier);
            const target = removeKnownCodeExtension(resolvedFile);

            if (clean.startsWith("@/")) return `@/${target}`;

            if (clean.startsWith(".")) {
              let relative = path.posix.relative(path.posix.dirname(fromFile), target);
              if (!relative.startsWith(".")) relative = `./${relative}`;
              return relative;
            }

            if (clean.startsWith("/")) {
              return target.startsWith("public/") ? `/${target.slice("public/".length)}` : `/${target}`;
            }

            return oldSpecifier;
          }

          function replaceRanges(content, replacements) {
            let next = content;

            for (const replacement of replacements.sort((a, b) => b.start - a.start)) {
              next = next.slice(0, replacement.start) + replacement.text + next.slice(replacement.end);
            }

            return next;
          }

          function repairImportCasing() {
            log("## Import casing repair");

            const { codeFiles, fileSet, fileCaseMap } = scan();
            let touched = 0;

            for (const file of codeFiles) {
              if (!exists(file)) continue;

              const content = read(file);
              const replacements = [];

              for (const statement of importStatements(content)) {
                if (!isInternal(statement.specifier)) continue;

                const exact = resolveSpecifier(file, statement.specifier, fileSet, fileCaseMap, false);
                if (exact) continue;

                const loose = resolveSpecifier(file, statement.specifier, fileSet, fileCaseMap, true);
                if (!loose) continue;

                const corrected = buildSpecifier(file, statement.specifier, loose);

                if (corrected !== statement.specifier) {
                  replacements.push({
                    start: statement.specifierStart,
                    end: statement.specifierEnd,
                    text: corrected,
                  });
                }
              }

              if (!replacements.length) continue;

              if (write(file, replaceRanges(content, replacements))) {
                touched += 1;
                log(`- ${file}: ${replacements.length} import path fix(es)`);
              }
            }

            log(`- files touched: ${touched}`);
            log();
          }

          function writeRedirect(file, destination) {
            const content = [
              "import { redirect } from 'next/navigation';",
              "",
              "export default function RenderEnginServiceRedirect() {",
              `  redirect('${destination}');`,
              "}",
              "",
            ].join("\n");

            if (write(file, content)) {
              log(`- ${file} redirects to ${destination}`);
            }
          }

          function repairRenderEnginRoutes() {
            log("## RenderEngin route repair");

            if (isDir("app/engines/render") || exists("app/engines/render/page.tsx")) {
              writeRedirect("app/engines/render/page.tsx", "/engines/create");
            } else {
              log("- app/engines/render not present");
            }

            if (isDir("app/daydream/render") || exists("app/daydream/render/page.tsx")) {
              writeRedirect("app/daydream/render/page.tsx", "/engines/create");
            } else {
              log("- app/daydream/render not present");
            }

            log("- note: this only removes standalone RenderEngin routing; it does not wire ContentEngin to RenderEngin rendering.");
            log();
          }

          function regenerateRepoState() {
            log("## Repo state regeneration");

            if (!exists("scripts/generate-repo-state.mjs")) {
              log("- scripts/generate-repo-state.mjs not present");
              log();
              return;
            }

            cp.execSync("node scripts/generate-repo-state.mjs", { stdio: "inherit" });
            log("- regenerated repo state");
            log();
          }

          function syntaxCheckChangedJs() {
            log("## Syntax check changed JS files");

            const status = cp.execSync("git status --porcelain", { encoding: "utf8" });
            const files = status
              .split("\n")
              .map((line) => line.trim().slice(3))
              .filter(Boolean)
              .filter((file) => [".js", ".mjs", ".cjs"].includes(ext(file)))
              .filter((file) => exists(file));

            if (!files.length) {
              log("- no changed JS/MJS/CJS files");
              log();
              return;
            }

            for (const file of files) {
              cp.execSync(`node --check ${JSON.stringify(file)}`, { stdio: "inherit" });
              log(`- passed: ${file}`);
            }

            log();
          }

          function writeReport() {
            const artifactDir = process.env.DREAMENGIN_ARTIFACT_DIR;
            if (!artifactDir) return;

            fs.mkdirSync(artifactDir, { recursive: true });

            const status = cp.execSync("git status --porcelain", { encoding: "utf8" }).trim();

            const report = [
              "# DREAMengin Deterministic Repair Report",
              "",
              "This report is an artifact only. It is not committed to the repo.",
              "",
              ...REPORT_LINES,
              "",
              "## Git status",
              "",
              status ? status.split("\n").map((line) => `- ${line}`).join("\n") : "_No changes detected._",
              "",
            ].join("\n");

            fs.writeFileSync(path.join(artifactDir, "DREAMENGIN_DETERMINISTIC_REPAIR_REPORT.md"), report, "utf8");
          }

          log("# DREAMengin deterministic repair");
          log();

          repairCodeEnginCaseCollision();
          repairImportCasing();
          repairRenderEnginRoutes();
          regenerateRepoState();
          syntaxCheckChangedJs();
          writeReport();

          log("Done.");
          NODE

      - name: Run deterministic repair
        shell: bash
        env:
          DREAMENGIN_ARTIFACT_DIR: ${{ runner.temp }}/dreamengin-repair-artifacts
        run: |
          set -euo pipefail
          node --check "$RUNNER_TEMP/dreamengin-repair/deterministic-repair.cjs"
          node "$RUNNER_TEMP/dreamengin-repair/deterministic-repair.cjs"

      - name: Verify typecheck
        if: ${{ inputs.run_typecheck }}
        shell: bash
        run: |
          set -euo pipefail

          has_script() {
            node -e "
              const fs = require('node:fs');
              if (!fs.existsSync('package.json')) process.exit(1);
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              process.exit(pkg.scripts && pkg.scripts[process.argv[1]] ? 0 : 1);
            " "$1"
          }

          run_script() {
            if [ -f pnpm-lock.yaml ]; then pnpm run "$1";
            elif [ -f yarn.lock ]; then yarn run "$1";
            else npm run "$1";
            fi
          }

          if has_script typecheck; then
            run_script typecheck
          else
            echo "No package typecheck script found; skipped."
          fi

      - name: Verify lint
        if: ${{ inputs.run_lint }}
        shell: bash
        run: |
          set -euo pipefail

          has_script() {
            node -e "
              const fs = require('node:fs');
              if (!fs.existsSync('package.json')) process.exit(1);
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              process.exit(pkg.scripts && pkg.scripts[process.argv[1]] ? 0 : 1);
            " "$1"
          }

          run_script() {
            if [ -f pnpm-lock.yaml ]; then pnpm run "$1";
            elif [ -f yarn.lock ]; then yarn run "$1";
            else npm run "$1";
            fi
          }

          if has_script lint; then
            run_script lint
          else
            echo "No package lint script found; skipped."
          fi

      - name: Verify tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -euo pipefail

          has_script() {
            node -e "
              const fs = require('node:fs');
              if (!fs.existsSync('package.json')) process.exit(1);
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              process.exit(pkg.scripts && pkg.scripts[process.argv[1]] ? 0 : 1);
            " "$1"
          }

          run_script() {
            if [ -f pnpm-lock.yaml ]; then pnpm run "$1";
            elif [ -f yarn.lock ]; then yarn run "$1";
            else npm run "$1";
            fi
          }

          if has_script test; then
            run_script test
          else
            echo "No package test script found; skipped."
          fi

      - name: Build repair patch and source archive
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/dreamengin-repair-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          git status --short > "$ARTIFACT_DIR/git-status.txt"

          # Make untracked repaired source files visible in the patch without committing yet.
          git add -N . || true

          git diff --binary > "$ARTIFACT_DIR/dreamengin-deterministic-repair.patch" || true

          git ls-files -z --cached --others --exclude-standard \
            | tar --null -T - -czf "$ARTIFACT_DIR/dreamengin-repaired-source.tar.gz"

      - name: Commit deterministic repairs
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No deterministic repair changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged deterministic repair changes to commit."
            exit 0
          fi

          git commit -m "${{ inputs.commit_message }}"
          git push

      - name: Upload repair artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamengin-deterministic-repair
          path: ${{ runner.temp }}/dreamengin-repair-artifacts
          if-no-files-found: warn
