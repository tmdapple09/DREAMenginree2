          def rotr(x: int, n: int) -> int:
              return (
                  (x >> n)
                  | (x << (32 - n))
              ) & MASK32


          def small_sigma0(x: int) -> int:
              return (
                  rotr(x, 7)
                  ^ rotr(x, 18)
                  ^ (x >> 3)
              )


          def small_sigma1(x: int) -> int:
              return (
                  rotr(x, 17)
                  ^ rotr(x, 19)
                  ^ (x >> 10)
              )


          def big_sigma0(x: int) -> int:
              return (
                  rotr(x, 2)
                  ^ rotr(x, 13)
                  ^ rotr(x, 22)
              )


          def big_sigma1(x: int) -> int:
              return (
                  rotr(x, 6)
                  ^ rotr(x, 11)
                  ^ rotr(x, 25)
              )


          def choose(
              x: int,
              y: int,
              z: int,
          ) -> int:
              return (
                  (x & y)
                  ^ ((~x) & z)
              )


          def majority(
              x: int,
              y: int,
              z: int,
          ) -> int:
              return (
                  (x & y)
                  ^ (x & z)
                  ^ (y & z)
              )


          def words_from_bytes(
              data: bytes,
          ) -> List[int]:
              if len(data) % 4:
                  raise ValueError(
                      "word conversion requires "
                      "a multiple of four bytes"
                  )

              return [
                  int.from_bytes(
                      data[index:index + 4],
                      "big",
                  )
                  for index in range(
                      0,
                      len(data),
                      4,
                  )
              ]


          def words_to_bytes(
              words: Sequence[int],
          ) -> bytes:
              return b"".join(
                  (
                      word & MASK32
                  ).to_bytes(
                      4,
                      "big",
                  )
                  for word in words
              )


          def expand_schedule(
              block64: bytes,
          ) -> List[int]:
              if len(block64) != 64:
                  raise ValueError(
                      "SHA-256 compression block "
                      "must be 64 bytes"
                  )

              schedule = words_from_bytes(
                  block64
              )

              for t in range(16, 64):
                  schedule.append(
                      (
                          small_sigma1(
                              schedule[t - 2]
                          )
                          + schedule[t - 7]
                          + small_sigma0(
                              schedule[t - 15]
                          )
                          + schedule[t - 16]
                      )
                      & MASK32
                  )

              return schedule


          @dataclass(frozen=True)
          class RoundState:
              phase: int
              round_index: int
              w: int
              state_in: Tuple[int, ...]
              state_out: Tuple[int, ...]


          @dataclass(frozen=True)
          class CompressionTrace:
              phase: int
              initial: Tuple[int, ...]
              schedule: Tuple[int, ...]
              rounds: Tuple[RoundState, ...]
              output: Tuple[int, ...]


          @dataclass(frozen=True)
          class BackwardCompatibility:
              required_words: Tuple[
                  Tuple[int, ...],
                  Tuple[int, ...],
                  Tuple[int, ...],
              ]

              backward_states: Tuple[
                  Tuple[
                      Tuple[int, ...],
                      ...
                  ],
                  ...
              ]

              state_edge_hamming: int
              schedule_edge_hamming: int
              E_local: float
              pullback_header: bytes
              residual_signature: int


          @dataclass(frozen=True)
          class ProjectionState:
              mask: Tuple[int, ...]
              permutation: Tuple[int, ...]
              orientations: Tuple[int, ...]
              p0: int
              p1: int
              p2: int
              p3: int
              observation_hamming: int
              hard_constraints_ok: bool


          @dataclass(frozen=True)
          class Evaluation:
              header: bytes
              digest_raw: bytes
              displayed_hash: str

              traces: Tuple[
                  CompressionTrace,
                  CompressionTrace,
                  CompressionTrace,
              ]

              compatibility: BackwardCompatibility
              projection: ProjectionState
              digest_hamming: int
              digest_prefix_match: int
              E_digest: float
              E_observation: float
              E_local: float
              E_global: float
              C_missing: int
              total_energy: float
              transformed_energy: float
              exact_hash_match: bool


          @dataclass(frozen=True)
          class LightRecord:
              header: bytes
              displayed_hash: str
              digest_hamming: int
              digest_prefix_match: int
              E_digest: float
              E_observation: float
              E_local: float
              E_global: float
              C_missing: int
              total_energy: float
              residual_signature: int
              source: str
              serial: int


          def compress(
              initial: Sequence[int],
              block64: bytes,
              phase: int,
          ) -> CompressionTrace:
              schedule = expand_schedule(
                  block64
              )

              a, b, c, d, e, f, g, h = [
                  value & MASK32
                  for value in initial
              ]

              rounds: List[RoundState] = []

              for t in range(64):
                  state_in = (
                      a,
                      b,
                      c,
                      d,
                      e,
                      f,
                      g,
                      h,
                  )

                  t1 = (
                      h
                      + big_sigma1(e)
                      + choose(e, f, g)
                      + K[t]
                      + schedule[t]
                  ) & MASK32

                  t2 = (
                      big_sigma0(a)
                      + majority(a, b, c)
                  ) & MASK32

                  state_out = (
                      (t1 + t2) & MASK32,
                      a,
                      b,
                      c,
                      (d + t1) & MASK32,
                      e,
                      f,
                      g,
                  )

                  rounds.append(
                      RoundState(
                          phase,
                          t,
                          schedule[t],
                          state_in,
                          state_out,
                      )
                  )

                  (
                      a,
                      b,
                      c,
                      d,
                      e,
                      f,
                      g,
                      h,
                  ) = state_out

              output = tuple(
                  (
                      initial[index]
                      + value
                  )
                  & MASK32
                  for index, value in enumerate(
                      (
                          a,
                          b,
                          c,
                          d,
                          e,
                          f,
                          g,
                          h,
                      )
                  )
              )

              return CompressionTrace(
                  phase,
                  tuple(initial),
                  tuple(schedule),
                  tuple(rounds),
                  output,
              )


          def sha256d_trace(
              header: bytes,
          ) -> Tuple[
              bytes,
              Tuple[
                  CompressionTrace,
                  CompressionTrace,
                  CompressionTrace,
              ],
          ]:
              if len(header) != 80:
                  raise ValueError(
                      "Bitcoin header must be "
                      "exactly 80 bytes"
                  )

              block0 = header[:64]

              block1 = (
                  header[64:]
                  + b"\x80"
                  + b"\x00" * 39
                  + (640).to_bytes(
                      8,
                      "big",
                  )
              )

              trace0 = compress(
                  H0,
                  block0,
                  0,
              )

              trace1 = compress(
                  trace0.output,
                  block1,
                  1,
              )

              inner = words_to_bytes(
                  trace1.output
              )

              block2 = (
                  inner
                  + b"\x80"
                  + b"\x00" * 23
                  + (256).to_bytes(
                      8,
                      "big",
                  )
              )

              trace2 = compress(
                  H0,
                  block2,
                  2,
              )

              return (
                  words_to_bytes(
                      trace2.output
                  ),
                  (
                      trace0,
                      trace1,
                      trace2,
                  ),
              )


          def displayed_hash_from_raw(
              raw_digest: bytes,
          ) -> str:
              return raw_digest[::-1].hex()


          def hashlib_displayed_hash(
              header: bytes,
          ) -> str:
              first = hashlib.sha256(
                  header
              ).digest()

              second = hashlib.sha256(
                  first
              ).digest()

              return second[::-1].hex()


          def hamming_word(
              left: int,
              right: int,
          ) -> int:
              return (
                  (left ^ right)
                  & MASK32
              ).bit_count()


          def hamming_bytes(
              left: bytes,
              right: bytes,
          ) -> int:
              return sum(
                  (a ^ b).bit_count()
                  for a, b in zip(
                      left,
                      right,
                  )
              )


          def hamming_state(
              left: Sequence[int],
              right: Sequence[int],
          ) -> int:
              return sum(
                  hamming_word(a, b)
                  for a, b in zip(
                      left,
                      right,
                  )
              )


          def matching_prefix_bits(
              left: bytes,
              right: bytes,
          ) -> int:
              matched = 0

              for a, b in zip(
                  left,
                  right,
              ):
                  difference = a ^ b

                  if difference == 0:
                      matched += 8
                      continue

                  matched += (
                      8
                      - difference.bit_length()
                  )

                  break

              return matched


          def inverse_round(
              state_out: Sequence[int],
              w: int,
              round_index: int,
          ) -> Tuple[int, ...]:
              (
                  ap,
                  bp,
                  cp,
                  dp,
                  ep,
                  fp,
                  gp,
                  hp,
              ) = [
                  value & MASK32
                  for value in state_out
              ]

              a = bp
              b = cp
              c = dp

              e = fp
              f = gp
              g = hp

              t2 = (
                  big_sigma0(a)
                  + majority(a, b, c)
              ) & MASK32

              t1 = (
                  ap - t2
              ) & MASK32

              d = (
                  ep - t1
              ) & MASK32

              h = (
                  t1
                  - big_sigma1(e)
                  - choose(e, f, g)
                  - K[round_index]
                  - w
              ) & MASK32

              return (
                  a,
                  b,
                  c,
                  d,
                  e,
                  f,
                  g,
                  h,
              )


          def backward_states(
              trace: CompressionTrace,
              desired_output_words: Sequence[int],
          ) -> Tuple[
              Tuple[int, ...],
              ...
          ]:
              working_end = tuple(
                  (
                      desired_output_words[index]
                      - trace.initial[index]
                  )
                  & MASK32
                  for index in range(8)
              )

              states: List[
                  Optional[
                      Tuple[int, ...]
                  ]
              ] = [None] * 65

              states[64] = working_end

              for t in reversed(
                  range(64)
              ):
                  states[t] = inverse_round(
                      states[t + 1],
                      trace.schedule[t],
                      t,
                  )

              return tuple(
                  tuple(state)
                  for state in states
                  if state is not None
              )


          def required_schedule_word(
              forward_state_in: Sequence[int],
              desired_state_out: Sequence[int],
              round_index: int,
          ) -> int:
              (
                  a,
                  b,
                  c,
                  d,
                  e,
                  f,
                  g,
                  h,
              ) = [
                  value & MASK32
                  for value in forward_state_in
              ]

              desired_a_out = (
                  desired_state_out[0]
                  & MASK32
              )

              t2 = (
                  big_sigma0(a)
                  + majority(a, b, c)
              ) & MASK32

              required_t1 = (
                  desired_a_out - t2
              ) & MASK32

              return (
                  required_t1
                  - h
                  - big_sigma1(e)
                  - choose(e, f, g)
                  - K[round_index]
              ) & MASK32


          def chunks40(
              header: bytes,
          ) -> List[int]:
              return [
                  int.from_bytes(
                      header[
                          index * 5:
                          (index + 1) * 5
                      ],
                      "big",
                  )
                  for index in range(16)
              ]


          def header_from_chunks40(
              chunks: Sequence[int],
          ) -> bytes:
              return b"".join(
                  (
                      value & MASK40
                  ).to_bytes(
                      5,
                      "big",
                  )
                  for value in chunks
              )


          def residual_signature(
              current: bytes,
              pullback: bytes,
          ) -> int:
              counts = bytes(
                  min(
                      255,
                      (
                          current_chunk
                          ^ pullback_chunk
                      ).bit_count(),
                  )
                  for (
                      current_chunk,
                      pullback_chunk,
                  ) in zip(
                      chunks40(current),
                      chunks40(pullback),
                  )
              )

              digest = hashlib.blake2b(
                  counts,
                  digest_size=8,
              ).digest()

              return int.from_bytes(
                  digest,
                  "big",
              )


          def derive_backward_compatibility(
              header: bytes,
              traces: Tuple[
                  CompressionTrace,
                  CompressionTrace,
                  CompressionTrace,
              ],
              target_raw: bytes,
          ) -> BackwardCompatibility:
              trace0, trace1, trace2 = traces

              target_words = words_from_bytes(
                  target_raw
              )

              backward2 = backward_states(
                  trace2,
                  target_words,
              )

              required2 = tuple(
                  required_schedule_word(
                      trace2.rounds[t].state_in,
                      backward2[t + 1],
                      t,
                  )
                  for t in range(64)
              )

              desired_inner_digest = (
                  required2[:8]
              )

              backward1 = backward_states(
                  trace1,
                  desired_inner_digest,
              )

              required1 = tuple(
                  required_schedule_word(
                      trace1.rounds[t].state_in,
                      backward1[t + 1],
                      t,
                  )
                  for t in range(64)
              )

              desired_phase0_output = (
                  backward1[0]
              )

              backward0 = backward_states(
                  trace0,
                  desired_phase0_output,
              )

              required0 = tuple(
                  required_schedule_word(
                      trace0.rounds[t].state_in,
                      backward0[t + 1],
                      t,
                  )
                  for t in range(64)
              )

              backward_all = (
                  backward0,
                  backward1,
                  backward2,
              )

              required_all = (
                  required0,
                  required1,
                  required2,
              )

              state_hamming = 0
              schedule_hamming = 0
              state_distance = 0.0
              schedule_distance = 0.0

              for (
                  trace,
                  backward,
                  required,
              ) in zip(
                  traces,
                  backward_all,
                  required_all,
              ):
                  forward_boundaries = [
                      trace.rounds[0].state_in
                  ] + [
                      row.state_out
                      for row in trace.rounds
                  ]

                  for (
                      forward_state,
                      backward_state,
                  ) in zip(
                      forward_boundaries,
                      backward,
                  ):
                      disagreement = (
                          hamming_state(
                              forward_state,
                              backward_state,
                          )
                      )

                      state_hamming += disagreement

                      state_distance += (
                          disagreement / 256.0
                      )

                  for (
                      actual,
                      wanted,
                  ) in zip(
                      trace.schedule,
                      required,
                  ):
                      disagreement = (
                          hamming_word(
                              actual,
                              wanted,
                          )
                      )

                      schedule_hamming += (
                          disagreement
                      )

                      schedule_distance += (
                          disagreement / 32.0
                      )

              pullback_header = (
                  words_to_bytes(
                      required0[:16]
                  )
                  + words_to_bytes(
                      required1[:4]
                  )
              )

              return BackwardCompatibility(
                  required_all,
                  backward_all,
                  state_hamming,
                  schedule_hamming,
                  (
                      state_distance
                      + schedule_distance
                  ),
                  pullback_header,
                  residual_signature(
                      header,
                      pullback_header,
                  ),
              )


          def parse_hidden_bits() -> set[int]:
              if RECOVERY_SCOPE == "full_header":
                  return set(
                      range(640)
                  )

              hidden: set[int] = set()

              if RECOVERY_SCOPE == "selected_fields":
                  for field in HIDDEN_FIELDS:
                      if field not in FIELD_RANGES_BYTES:
                          raise ValueError(
                              f"unknown hidden field: {field}"
                          )

                      start, end = (
                          FIELD_RANGES_BYTES[field]
                      )

                      hidden.update(
                          range(
                              start * 8,
                              end * 8,
                          )
                      )

              if (
                  RECOVERY_SCOPE == "selected_bits"
                  or HIDDEN_BIT_RANGES
              ):
                  for token in HIDDEN_BIT_RANGES.split(","):
                      token = token.strip()

                      if not token:
                          continue

                      if ":" in token:
                          left, right = token.split(
                              ":",
                              1,
                          )

                          start = int(left)
                          end = int(right)

                          if not (
                              0
                              <= start
                              <= end
                              <= 640
                          ):
                              raise ValueError(
                                  f"invalid hidden range: {token}"
                              )

                          hidden.update(
                              range(
                                  start,
                                  end,
                              )
                          )

                      else:
                          bit = int(token)

                          if not (
                              0
                              <= bit
                              < 640
                          ):
                              raise ValueError(
                                  f"invalid hidden bit: {token}"
                              )

                          hidden.add(bit)

              return hidden


          def get_bit(
              data: bytes,
              bit: int,
          ) -> int:
              byte_index, offset = divmod(
                  bit,
                  8,
              )

              return (
                  data[byte_index]
                  >> (7 - offset)
              ) & 1


          def put_bit(
              data: bytearray,
              bit: int,
              value: int,
          ) -> None:
              byte_index, offset = divmod(
                  bit,
                  8,
              )

              mask = 1 << (
                  7 - offset
              )

              if value:
                  data[byte_index] |= mask
              else:
                  data[byte_index] &= ~mask


          def clamp_known_bits(
              candidate: bytes,
              observation: bytes,
              hidden: set[int],
          ) -> bytes:
              result = bytearray(
                  candidate
              )

              for bit in range(640):
                  if bit not in hidden:
                      put_bit(
                          result,
                          bit,
                          get_bit(
                              observation,
                              bit,
                          ),
                      )

              return bytes(
                  result
              )


          def rotate40(
              value: int,
              orientation: int,
          ) -> int:
              shift = (
                  0,
                  13,
                  27,
              )[orientation % 3]

              if shift == 0:
                  return value & MASK40

              return (
                  (value << shift)
                  | (value >> (40 - shift))
              ) & MASK40


          def permutation_parity(
              permutation: Sequence[int],
          ) -> int:
              parity = 0

              for i in range(
                  len(permutation)
              ):
                  for j in range(
                      i + 1,
                      len(permutation),
                  ):
                      parity ^= int(
                          permutation[i]
                          > permutation[j]
                      )

              return parity


          def project_header(
              header: bytes,
              permutation: Sequence[int],
              orientations: Sequence[int],
          ) -> bytes:
              canonical = chunks40(
                  header
              )

              projected = [
                  rotate40(
                      canonical[
                          permutation[slot]
                      ],
                      orientations[slot],
                  )
                  for slot in range(16)
              ]

              return header_from_chunks40(
                  projected
              )


          def projection_piece_cost(
              canonical_chunks: Sequence[int],
              observed_chunks: Sequence[int],
              mask: Sequence[int],
              slot: int,
              source: int,
              orientation: int,
          ) -> int:
              value = rotate40(
                  canonical_chunks[source],
                  orientation,
              )

              cost = 0

              for local in range(40):
                  bit = (
                      slot * 40
                      + local
                  )

                  if mask[bit]:
                      actual = (
                          value
                          >> (39 - local)
                      ) & 1

                      expected = (
                          observed_chunks[slot]
                          >> (39 - local)
                      ) & 1

                      cost += int(
                          actual != expected
                      )

              return cost


          def solve_projection_variables(
              header: bytes,
              observation: bytes,
              initial_mask: Sequence[int],
          ) -> ProjectionState:
              canonical_chunks = chunks40(
                  header
              )

              observed_chunks = chunks40(
                  observation
              )

              if (
                  not INFER_PERMUTATION
                  and not INFER_ORIENTATION
              ):
                  permutation = tuple(
                      range(16)
                  )

                  orientations = (
                      0,
                  ) * 16

              else:
                  states: Dict[
                      Tuple[int, int],
                      Tuple[
                          int,
                          Tuple[
                              Tuple[int, int],
                              ...
                          ],
                      ],
                  ] = {
                      (
                          0,
                          0,
                      ): (
                          0,
                          tuple(),
                      )
                  }

                  for slot in range(16):
                      next_states: Dict[
                          Tuple[int, int],
                          Tuple[
                              int,
                              Tuple[
                                  Tuple[int, int],
                                  ...
                              ],
                          ],
                      ] = {}

                      for (
                          used,
                          residue,
                      ), (
                          cost_so_far,
                          assignment,
                      ) in states.items():
                          sources = (
                              range(16)
                              if INFER_PERMUTATION
                              else (slot,)
                          )

                          for source in sources:
                              if (
                                  used >> source
                              ) & 1:
                                  continue

                              choices = (
                                  range(3)
                                  if INFER_ORIENTATION
                                  else (0,)
                              )

                              for orientation in choices:
                                  new_key = (
                                      used
                                      | (1 << source),
                                      (
                                          residue
                                          + orientation
                                      )
                                      % 3,
                                  )

                                  new_cost = (
                                      cost_so_far
                                      + projection_piece_cost(
                                          canonical_chunks,
                                          observed_chunks,
                                          initial_mask,
                                          slot,
                                          source,
                                          orientation,
                                      )
                                  )

                                  candidate_assignment = (
                                      assignment
                                      + (
                                          (
                                              source,
                                              orientation,
                                          ),
                                      )
                                  )

                                  previous = (
                                      next_states.get(
                                          new_key
                                      )
                                  )

                                  if (
                                      previous is None
                                      or new_cost
                                      < previous[0]
                                      or (
                                          new_cost
                                          == previous[0]
                                          and candidate_assignment
                                          < previous[1]
                                      )
                                  ):
                                      next_states[
                                          new_key
                                      ] = (
                                          new_cost,
                                          candidate_assignment,
                                      )

                      states = next_states

                  final = states.get(
                      (
                          (1 << 16) - 1,
                          0,
                      )
                  )

                  if final is None:
                      raise RuntimeError(
                          "no pi/O assignment satisfies "
                          "product O_i = Identity"
                      )

                  assignment = final[1]

                  permutation = tuple(
                      source
                      for source, _ in assignment
                  )

                  orientations = tuple(
                      orientation
                      for _, orientation in assignment
                  )

              projected = project_header(
                  header,
                  permutation,
                  orientations,
              )

              if INFER_MASK:
                  mismatch_cost = (
                      1.0
                      / (
                          2.0
                          * SIGMA
                          * SIGMA
                      )
                  )

                  mask = tuple(
                      0
                      if (
                          get_bit(
                              projected,
                              bit,
                          )
                          != get_bit(
                              observation,
                              bit,
                          )
                          and GAMMA_MISSING
                          < mismatch_cost
                      )
                      else 1
                      for bit in range(640)
                  )

              else:
                  mask = tuple(
                      initial_mask
                  )

              observation_hamming = sum(
                  int(mask[bit])
                  * int(
                      get_bit(
                          projected,
                          bit,
                      )
                      != get_bit(
                          observation,
                          bit,
                      )
                  )
                  for bit in range(640)
              )

              p0 = permutation_parity(
                  permutation
              )

              p1 = p0
              p2 = 0
              p3 = 0

              hard_constraints_ok = (
                  (
                      p0
                      ^ p1
                      ^ p2
                      ^ p3
                  )
                  == 0
                  and (
                      p0
                      ^ p1
                  )
                  == 0
                  and sum(
                      orientations
                  )
                  % 3
                  == 0
              )

              return ProjectionState(
                  mask,
                  permutation,
                  orientations,
                  p0,
                  p1,
                  p2,
                  p3,
                  observation_hamming,
                  hard_constraints_ok,
              )


          def bitcoin_global_energy(
              header: bytes,
              metadata: dict,
          ) -> float:
              if (
                  CONTEXT_MODE == "hash_only"
                  or not metadata
              ):
                  return 0.0

              energy = 0

              previous_display = str(
                  metadata.get(
                      "previousblockhash",
                      "",
                  )
              )

              merkle_display = str(
                  metadata.get(
                      "merkle_root",
                      "",
                  )
              )

              bits_value = int(
                  metadata.get(
                      "bits",
                      0,
                  )
                  or 0
              )

              timestamp_value = int(
                  metadata.get(
                      "timestamp",
                      0,
                  )
                  or 0
              )

              if previous_display:
                  energy += hamming_bytes(
                      header[4:36],
                      bytes.fromhex(
                          previous_display
                      )[::-1],
                  )

              if merkle_display:
                  energy += hamming_bytes(
                      header[36:68],
                      bytes.fromhex(
                          merkle_display
                      )[::-1],
                  )

              if bits_value:
                  energy += hamming_bytes(
                      header[72:76],
                      bits_value.to_bytes(
                          4,
                          "little",
                      ),
                  )

              if timestamp_value:
                  timestamp = int.from_bytes(
                      header[68:72],
                      "little",
                  )

                  if CONTEXT_MODE == "all_public":
                      energy += (
                          timestamp
                          ^ timestamp_value
                      ).bit_count()

                  else:
                      distance = abs(
                          timestamp
                          - timestamp_value
                      )

                      energy += (
                          0
                          if distance <= 7200
                          else min(
                              32,
                              1
                              + int(
                                  math.log2(
                                      distance
                                      - 7199
                                  )
                              ),
                          )
                      )

              return float(
                  energy
              )


          def f_transform(
              x: float,
          ) -> float:
              if x < 0:
                  return float("nan")

              return (
                  A0
                  * x
                  / (
                      (
                          1.0
                          + x ** N_EXPONENT
                      )
                      ** (
                          1.0
                          / N_EXPONENT
                      )
                  )
              )


          def evaluate(
              header: bytes,
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              initial_mask: Sequence[int],
              metadata: dict,
              target_pressure: float,
          ) -> Evaluation:
              digest_raw, traces = (
                  sha256d_trace(
                      header
                  )
              )

              compatibility = (
                  derive_backward_compatibility(
                      header,
                      traces,
                      target_raw,
                  )
              )

              projection = (
                  solve_projection_variables(
                      header,
                      observation,
                      initial_mask,
                  )
              )

              if not projection.hard_constraints_ok:
                  raise RuntimeError(
                      "the supplied parity/orientation "
                      "constraints were violated"
                  )

              digest_hamming = (
                  hamming_bytes(
                      digest_raw,
                      target_raw,
                  )
              )

              digest_prefix_match = (
                  matching_prefix_bits(
                      digest_raw,
                      target_raw,
                  )
              )

              E_digest = (
                  target_pressure
                  * (
                      DIGEST_HAMMING_WEIGHT
                      * digest_hamming
                      + DIGEST_PREFIX_WEIGHT
                      * (
                          256
                          - digest_prefix_match
                      )
                  )
              )

              E_header_observation = (
                  projection.observation_hamming
              )

              if (
                  not ALLOW_OBSERVATION_NOISE
                  and projection.observation_hamming
              ):
                  E_header_observation = (
                      float("inf")
                  )

              E_observation = (
                  E_digest
                  + E_header_observation
              ) / (
                  2.0
                  * SIGMA
                  * SIGMA
              )

              E_local = (
                  compatibility.E_local
              )

              E_global = (
                  bitcoin_global_energy(
                      header,
                      metadata,
                  )
              )

              C_missing = sum(
                  1 - value
                  for value
                  in projection.mask
              )

              total_energy = (
                  E_observation
                  + LAMBDA_LOCAL
                  * E_local
                  + BETA_GLOBAL
                  * E_global
                  + GAMMA_MISSING
                  * C_missing
              )

              transformed_energy = (
                  f_transform(
                      total_energy
                      / 640.0
                  )
                  if math.isfinite(
                      total_energy
                  )
                  else float("nan")
              )

              exact_hash_match = (
                  displayed_hash_from_raw(
                      digest_raw
                  )
                  == target_display
              )

              return Evaluation(
                  header,
                  digest_raw,
                  displayed_hash_from_raw(
                      digest_raw
                  ),
                  traces,
                  compatibility,
                  projection,
                  digest_hamming,
                  digest_prefix_match,
                  E_digest,
                  E_observation,
                  E_local,
                  E_global,
                  C_missing,
                  total_energy,
                  transformed_energy,
                  exact_hash_match,
              )


          def to_light(
              evaluation: Evaluation,
              source: str,
              serial: int,
          ) -> LightRecord:
              return LightRecord(
                  evaluation.header,
                  evaluation.displayed_hash,
                  evaluation.digest_hamming,
                  evaluation.digest_prefix_match,
                  evaluation.E_digest,
                  evaluation.E_observation,
                  evaluation.E_local,
                  evaluation.E_global,
                  evaluation.C_missing,
                  evaluation.total_energy,
                  evaluation.compatibility.residual_signature,
                  source,
                  serial,
              )


          def priority(
              record: LightRecord,
          ) -> Tuple[
              float,
              int,
              int,
              float,
              int,
          ]:
              return (
                  record.total_energy,
                  record.digest_hamming,
                  -record.digest_prefix_match,
                  record.E_local,
                  record.serial,
              )


          def header_fingerprint(
              header: bytes,
          ) -> int:
              digest = hashlib.blake2b(
                  header,
                  digest_size=8,
              ).digest()

              return int.from_bytes(
                  digest,
                  "big",
              )


          class BoundedFingerprints:
              def __init__(
                  self,
                  capacity: int,
              ):
                  self.capacity = capacity

                  self.data: OrderedDict[
                      int,
                      None,
                  ] = OrderedDict()

              def add(
                  self,
                  fingerprint: int,
              ) -> bool:
                  if fingerprint in self.data:
                      self.data.move_to_end(
                          fingerprint
                      )

                      return False

                  self.data[
                      fingerprint
                  ] = None

                  if (
                      len(self.data)
                      > self.capacity
                  ):
                      self.data.popitem(
                          last=False
                      )

                  return True

              def __len__(self) -> int:
                  return len(
                      self.data
                  )


          def apply_selected_pullback_bits(
              current: bytes,
              pullback: bytes,
              bits: Iterable[int],
              observation: bytes,
              hidden: set[int],
          ) -> bytes:
              candidate = bytearray(
                  current
              )

              for bit in bits:
                  if bit in hidden:
                      put_bit(
                          candidate,
                          bit,
                          get_bit(
                              pullback,
                              bit,
                          ),
                      )

              return clamp_known_bits(
                  bytes(candidate),
                  observation,
                  hidden,
              )


          def geometry_sections() -> List[
              Tuple[
                  str,
                  Tuple[int, ...],
              ]
          ]:
              sections: List[
                  Tuple[
                      str,
                      Tuple[int, ...],
                  ]
              ] = [
                  (
                      "all_16_interior_cells",
                      tuple(range(16)),
                  )
              ]

              for (
                  index,
                  coord,
              ) in enumerate(
                  INTERIOR_COORDS
              ):
                  sections.append(
                      (
                          f"interior_cell_{coord}",
                          (index,),
                      )
                  )

              for axis in range(4):
                  for value in (
                      1,
                      2,
                  ):
                      sections.append(
                          (
                              (
                                  f"axis_{axis}_"
                                  f"slice_{value}"
                              ),
                              tuple(
                                  index
                                  for (
                                      index,
                                      coord,
                                  ) in enumerate(
                                      INTERIOR_COORDS
                                  )
                                  if (
                                      coord[axis]
                                      == value
                                  )
                              ),
                          )
                      )

              for (
                  axis_a,
                  axis_b,
              ) in combinations(
                  range(4),
                  2,
              ):
                  for value_a in (
                      1,
                      2,
                  ):
                      for value_b in (
                          1,
                          2,
                      ):
                          sections.append(
                              (
                                  (
                                      f"face_axes_"
                                      f"{axis_a}_{axis_b}_"
                                      f"values_"
                                      f"{value_a}_{value_b}"
                                  ),
                                  tuple(
                                      index
                                      for (
                                          index,
                                          coord,
                                      ) in enumerate(
                                          INTERIOR_COORDS
                                      )
                                      if (
                                          coord[axis_a]
                                          == value_a
                                          and coord[axis_b]
                                          == value_b
                                      )
                                  ),
                              )
                          )

              for left in range(16):
                  for right in range(
                      left + 1,
                      16,
                  ):
                      distance = sum(
                          a != b
                          for a, b in zip(
                              INTERIOR_COORDS[left],
                              INTERIOR_COORDS[right],
                          )
                      )

                      if distance == 1:
                          sections.append(
                              (
                                  (
                                      f"adjacency_edge_"
                                      f"{left}_{right}"
                                  ),
                                  (
                                      left,
                                      right,
                                  ),
                              )
                          )

              return sections


          GEOMETRY_SECTIONS = (
              geometry_sections()
          )


          def ordered_pullback_bits(
              evaluation: Evaluation,
              hidden: set[int],
              cycle: int,
          ) -> List[int]:
              pullback = (
                  evaluation
                  .compatibility
                  .pullback_header
              )

              disagreement = [
                  bit
                  for bit in hidden
                  if (
                      get_bit(
                          evaluation.header,
                          bit,
                      )
                      != get_bit(
                          pullback,
                          bit,
                      )
                  )
              ]

              if not disagreement:
                  return []

              chunk_weight = [
                  (
                      current_chunk
                      ^ pullback_chunk
                  ).bit_count()
                  for (
                      current_chunk,
                      pullback_chunk,
                  ) in zip(
                      chunks40(
                          evaluation.header
                      ),
                      chunks40(
                          pullback
                      ),
                  )
              ]

              disagreement.sort(
                  key=lambda bit: (
                      -chunk_weight[
                          bit // 40
                      ],
                      (
                          bit
                          + DETERMINISTIC_SEED
                          + cycle * 97
                      )
                      % 640,
                  )
              )

              if (
                  len(disagreement)
                  <= BIT_PROBE_BUDGET
              ):
                  return disagreement

              offset = (
                  cycle
                  * BIT_PROBE_BUDGET
              ) % len(disagreement)

              rotated = (
                  disagreement[offset:]
                  + disagreement[:offset]
              )

              return rotated[
                  :BIT_PROBE_BUDGET
              ]


          def candidate_headers(
              evaluation: Evaluation,
              observation: bytes,
              hidden: set[int],
              cycle: int,
          ) -> List[
              Tuple[
                  str,
                  bytes,
              ]
          ]:
              pullback = clamp_known_bits(
                  evaluation.compatibility.pullback_header,
                  observation,
                  hidden,
              )

              current_chunks = chunks40(
                  evaluation.header
              )

              pullback_chunks = chunks40(
                  pullback
              )

              proposals: Dict[
                  bytes,
                  str,
              ] = {}

              def add(
                  name: str,
                  candidate: bytes,
              ) -> None:
                  if candidate != evaluation.header:
                      proposals.setdefault(
                          candidate,
                          name,
                      )

              for (
                  name,
                  selected_chunks,
              ) in GEOMETRY_SECTIONS:
                  candidate_chunks = list(
                      current_chunks
                  )

                  changed = False

                  for chunk_index in selected_chunks:
                      if (
                          candidate_chunks[
                              chunk_index
                          ]
                          != pullback_chunks[
                              chunk_index
                          ]
                      ):
                          candidate_chunks[
                              chunk_index
                          ] = pullback_chunks[
                              chunk_index
                          ]

                          changed = True

                  if changed:
                      add(
                          name,
                          clamp_known_bits(
                              header_from_chunks40(
                                  candidate_chunks
                              ),
                              observation,
                              hidden,
                          ),
                      )

              probe_bits = (
                  ordered_pullback_bits(
                      evaluation,
                      hidden,
                      cycle,
                  )
              )

              for bit in probe_bits:
                  add(
                      f"local_edge_bit_{bit}",
                      apply_selected_pullback_bits(
                          evaluation.header,
                          pullback,
                          (bit,),
                          observation,
                          hidden,
                      ),
                  )

              return [
                  (
                      name,
                      candidate,
                  )
                  for (
                      candidate,
                      name,
                  ) in proposals.items()
              ]


          def evaluate_children(
              parent: Evaluation,
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              hidden: set[int],
              initial_mask: Sequence[int],
              metadata: dict,
              target_pressure: float,
              cycle: int,
              serial_start: int,
          ) -> Tuple[
              List[LightRecord],
              int,
          ]:
              records: List[
                  LightRecord
              ] = []

              serial = serial_start

              for (
                  source,
                  candidate_header,
              ) in candidate_headers(
                  parent,
                  observation,
                  hidden,
                  cycle,
              ):
                  serial += 1

                  child = evaluate(
                      candidate_header,
                      target_raw,
                      target_display,
                      observation,
                      initial_mask,
                      metadata,
                      target_pressure,
                  )

                  records.append(
                      to_light(
                          child,
                          source,
                          serial,
                      )
                  )

              records.sort(
                  key=priority
              )

              single_records = records[
                  :max(
                      CHILDREN_PER_STATE,
                      PAIR_PROBE_BUDGET,
                  )
              ]

              pair_sources = [
                  record
                  for record in single_records
                  if record.source.startswith(
                      "local_edge_bit_"
                  )
              ][
                  :PAIR_PROBE_BUDGET
              ]

              parent_pullback = (
                  clamp_known_bits(
                      parent.compatibility.pullback_header,
                      observation,
                      hidden,
                  )
              )

              pair_seen: set[
                  bytes
              ] = set()

              for (
                  left,
                  right,
              ) in combinations(
                  pair_sources,
                  2,
              ):
                  left_bit = int(
                      left.source.rsplit(
                          "_",
                          1,
                      )[1]
                  )

                  right_bit = int(
                      right.source.rsplit(
                          "_",
                          1,
                      )[1]
                  )

                  candidate_header = (
                      apply_selected_pullback_bits(
                          parent.header,
                          parent_pullback,
                          (
                              left_bit,
                              right_bit,
                          ),
                          observation,
                          hidden,
                      )
                  )

                  if (
                      candidate_header
                      in pair_seen
                      or candidate_header
                      == parent.header
                  ):
                      continue

                  pair_seen.add(
                      candidate_header
                  )

                  serial += 1

                  child = evaluate(
                      candidate_header,
                      target_raw,
                      target_display,
                      observation,
                      initial_mask,
                      metadata,
                      target_pressure,
                  )

                  records.append(
                      to_light(
                          child,
                          (
                              "paired_local_edges_"
                              f"{left_bit}_{right_bit}"
                          ),
                          serial,
                      )
                  )

                  if (
                      len(pair_seen)
                      >= PAIR_PROBE_BUDGET
                  ):
                      break

              records.sort(
                  key=priority
              )

              return (
                  pareto_prune(
                      records,
                      CHILDREN_PER_STATE,
                  ),
                  serial,
              )


          def dominates(
              left: LightRecord,
              right: LightRecord,
          ) -> bool:
              no_worse = (
                  left.digest_hamming
                  <= right.digest_hamming
                  and left.digest_prefix_match
                  >= right.digest_prefix_match
                  and left.E_local
                  <= right.E_local
                  and left.E_global
                  <= right.E_global
                  and left.total_energy
                  <= right.total_energy
              )

              strictly_better = (
                  left.digest_hamming
                  < right.digest_hamming
                  or left.digest_prefix_match
                  > right.digest_prefix_match
                  or left.E_local
                  < right.E_local
                  or left.E_global
                  < right.E_global
                  or left.total_energy
                  < right.total_energy
              )

              return (
                  no_worse
                  and strictly_better
              )


          def pareto_prune(
              records: Sequence[LightRecord],
              limit: int,
          ) -> List[LightRecord]:
              retained: List[
                  LightRecord
              ] = []

              for record in sorted(
                  records,
                  key=priority,
              ):
                  if any(
                      dominates(
                          existing,
                          record,
                      )
                      for existing
                      in retained
                  ):
                      continue

                  retained = [
                      existing
                      for existing in retained
                      if not dominates(
                          record,
                          existing,
                      )
                  ]

                  retained.append(
                      record
                  )

                  if (
                      len(retained)
                      >= max(
                          limit * 2,
                          limit + 8,
                      )
                  ):
                      retained.sort(
                          key=priority
                      )

                      retained = retained[
                          :limit
                      ]

              retained.sort(
                  key=priority
              )

              return retained[
                  :limit
              ]


          def adaptive_slack(
              stagnation_cycles: int,
          ) -> int:
              if STAGNATION_WINDOW <= 0:
                  return DIGEST_SLACK

              increments = (
                  stagnation_cycles
                  // STAGNATION_WINDOW
              )

              return min(
                  MAX_DIGEST_SLACK,
                  DIGEST_SLACK
                  + increments,
              )


          def target_pressure(
              stagnation_cycles: int,
          ) -> float:
              # Digest weights are already dominant.
              #
              # Keep one fixed objective across every cycle so records
              # inserted during earlier cycles remain directly comparable
              # to records inserted later. Stagnation changes digest slack,
              # not the objective itself.
              return 1.0


          def frontier_prune(
              candidates: Sequence[LightRecord],
              best_digest: int,
              slack: int,
          ) -> List[LightRecord]:
              eligible = [
                  record
                  for record in candidates
                  if (
                      record.digest_hamming
                      <= best_digest + slack
                  )
              ]

              eligible.sort(
                  key=priority
              )

              bucket_counts: Dict[
                  Tuple[
                      int,
                      int,
                      int,
                  ],
                  int,
              ] = defaultdict(int)

              diverse: List[
                  LightRecord
              ] = []

              for record in eligible:
                  bucket = (
                      record.digest_hamming,
                      (
                          record.digest_prefix_match
                          // 8
                      ),
                      (
                          record.residual_signature
                          & 0xFFFF
                      ),
                  )

                  if (
                      bucket_counts[bucket]
                      >= DIVERSITY_PER_BUCKET
                  ):
                      continue

                  bucket_counts[bucket] += 1

                  diverse.append(
                      record
                  )

                  if (
                      len(diverse)
                      >= BEAM_WIDTH * 3
                  ):
                      break

              return pareto_prune(
                  diverse,
                  BEAM_WIDTH,
              )


          def canonical_initial_header(
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              hidden: set[int],
              initial_mask: Sequence[int],
              metadata: dict,
          ) -> bytes:
              zero_section = clamp_known_bits(
                  bytes(80),
                  observation,
                  hidden,
              )

              zero_evaluation = evaluate(
                  zero_section,
                  target_raw,
                  target_display,
                  observation,
                  initial_mask,
                  metadata,
                  1.0,
              )

              return clamp_known_bits(
                  zero_evaluation
                  .compatibility
                  .pullback_header,
                  observation,
                  hidden,
              )


          def requested_model_count_reached(
              count: int,
          ) -> bool:
              return (
                  POSTERIOR_MODELS > 0
                  and count
                  >= POSTERIOR_MODELS
              )


          def append_csv(
              path: Path,
              row: dict,
          ) -> None:
              exists = path.exists()

              with path.open(
                  "a",
                  newline="",
                  encoding="utf-8",
              ) as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=list(
                          row.keys()
                      ),
                  )

                  if not exists:
                      writer.writeheader()

                  writer.writerow(
                      row
                  )


          def write_csv(
              path: Path,
              rows: Sequence[dict],
          ) -> None:
              if not rows:
                  return

              with path.open(
                  "w",
                  newline="",
                  encoding="utf-8",
              ) as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=list(
                          rows[0].keys()
                      ),
                  )

                  writer.writeheader()
                  writer.writerows(rows)


          def tesseract_slot_rows() -> List[dict]:
              all_coords = list(
                  product(
                      range(4),
                      repeat=4,
                  )
              )

              interior_set = set(
                  INTERIOR_COORDS
              )

              surface = sorted(
                  coord
                  for coord in all_coords
                  if coord not in interior_set
              )

              rows: List[dict] = []

              for (
                  index,
                  coord,
              ) in enumerate(
                  INTERIOR_COORDS
              ):
                  rows.append({
                      "a":
                      coord[0],

                      "b":
                      coord[1],

                      "c":
                      coord[2],

                      "d":
                      coord[3],

                      "region":
                      "interior_header",

                      "slot_index":
                      index,

                      "semantic":
                      (
                          f"header_chunk_"
                          f"{index:02d}_bits_"
                          f"{40 * index}:"
                          f"{40 * (index + 1)}"
                      ),
                  })

              for (
                  index,
                  coord,
              ) in enumerate(
                  surface
              ):
                  if index < 192:
                      (
                          phase,
                          round_index,
                      ) = divmod(
                          index,
                          64,
                      )

                      region = (
                          "surface_sha_round"
                      )

                      semantic = (
                          f"phase_{phase}_"
                          f"round_{round_index}"
                      )

                  elif index < 208:
                      region = (
                          "surface_observation"
                      )

                      semantic = (
                          "mask_pi_orientation_"
                          f"{index - 192}"
                      )

                  elif index < 216:
                      region = (
                          "surface_digest"
                      )

                      semantic = (
                          "digest_word_"
                          f"{index - 208}"
                      )

                  elif index < 224:
                      region = (
                          "surface_bitcoin_prior"
                      )

                      semantic = (
                          "bitcoin_prior_"
                          f"{index - 216}"
                      )

                  else:
                      region = (
                          "surface_posterior_"
                          "gauge_projection"
                      )

                      semantic = (
                          "posterior_gauge_"
                          "projection_"
                          f"{index - 224}"
                      )

                  rows.append({
                      "a":
                      coord[0],

                      "b":
                      coord[1],

                      "c":
                      coord[2],

                      "d":
                      coord[3],

                      "region":
                      region,

                      "slot_index":
                      index,

                      "semantic":
                      semantic,
                  })

              return rows


          def log_state_space() -> Tuple[
              float,
              float,
          ]:
              log2_value = (
                  math.lgamma(17)
                  / math.log(2)
                  + 2
                  * math.lgamma(65)
                  / math.log(2)
                  + math.lgamma(97)
                  / math.log(2)
                  + 45
                  + 15
                  * math.log2(3)
                  - math.log2(1536)
                  - 8
                  * math.lgamma(9)
                  / math.log(2)
              )

              return (
                  log2_value,
                  log2_value
                  * math.log10(2),
              )


          def write_model_spec() -> None:
              MODEL_SPEC.write_text(
                  """BITCOIN SHA-256d 4D JOINT-INFERENCE MODEL
          =========================================

          x = H_{m,pi}(y) + xi
          H_{m,pi} = D_m o P_pi

          E_local(y)  = sum_(i,j in A) d(e_i^right,e_j^left)
          E_global(y) = -log p_prior(y)
          C(m)        = sum_j (1-m_j)

          (y_hat,m_hat,pi_hat) = argmin [
              ||x-H_{m,pi}(y)||^2/(2 sigma^2)
              + lambda E_local(y)
              + beta E_global(y)
              + gamma C(m)
          ]

          The target digest is part of x. Its observation residual is therefore not a
          post-processing statistic: it contributes directly to E_observation through
          digest Hamming distance and matching-prefix distance. Local edge distances
          are normalized Hamming distances on exact forward/backward SHA state and
          schedule boundaries.

          The 4x4x4x4 geometry supplies deterministic residual sections over all sixteen
          interior cells, individual cells, axis slices, faces, and adjacency edges.
          These are not physical Rubik turns and no extra group law is introduced.

          Frontier control is structural and explicit:
          * only lightweight scalar records live in the beam;
          * full 192-round traces are transient;
          * digest slack removes states too far from the global best;
          * Pareto dominance removes inferior states;
          * residual-basin quotas preserve 4D diversity;
          * a bounded fingerprint cache prevents cycles without unbounded memory.

          The target pressure is fixed across cycles. Stagnation changes only the
          admissible digest slack, so energy values retained in the beam remain
          comparable instead of being silently reweighted after insertion.

          There is no internal completion timeout or iteration cap. Beam width and probe
          budgets bound memory and per-cycle branching, not the number of cycles.

          Hard constraints:
              p0 XOR p1 XOR p2 XOR p3 = 0
              p0 XOR p1 = 0
              product_i O_i = Identity

          N_states =
              (16! * (64!)^2 * 96! * 2^45 * 3^15) /
              (1536 * (8!)^8)

          Continuous extension:
              x = H_{m,pi}(T_{g,phi} y) + xi

          Completion requires independent exact SHA256d(header)=target verification.
          Historical-header equality is reported separately.
          """,
                  encoding="utf-8",
              )


          def write_checkpoint(
              cycle: int,
              beam: Sequence[LightRecord],
              best: LightRecord,
              best_digest: int,
              stagnation_cycles: int,
              exact_models: Sequence[LightRecord],
              dedup_size: int,
              started: float,
              terminated_by_signal: Optional[int] = None,
          ) -> None:
              payload = {
                  "model_revision":
                  MODEL_REVISION,

                  "cycle":
                  cycle,

                  "beam_size":
                  len(beam),

                  "beam_width":
                  BEAM_WIDTH,

                  "best_header_hex":
                  best.header.hex(),

                  "best_displayed_hash":
                  best.displayed_hash,

                  "best_digest_hamming":
                  best_digest,

                  "best_digest_prefix_match":
                  best.digest_prefix_match,

                  "best_E_digest":
                  best.E_digest,

                  "best_E_local":
                  best.E_local,

                  "best_total_energy":
                  best.total_energy,

                  "stagnation_cycles":
                  stagnation_cycles,

                  "current_digest_slack":
                  adaptive_slack(
                      stagnation_cycles
                  ),

                  "current_target_pressure":
                  target_pressure(
                      stagnation_cycles
                  ),

                  "dedup_fingerprints":
                  dedup_size,

                  "exact_models":
                  [
                      model.header.hex()
                      for model in exact_models
                  ],

                  "elapsed_seconds":
                  time.time() - started,

                  "terminated_by_signal":
                  terminated_by_signal,
              }

              CHECKPOINT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      sort_keys=True,
                  ),
                  encoding="utf-8",
              )


          def write_frontier(
              beam: Sequence[LightRecord],
              best_digest: int,
              slack: int,
          ) -> None:
              rows = []

              for (
                  rank,
                  record,
              ) in enumerate(
                  sorted(
                      beam,
                      key=priority,
                  )[:BEAM_WIDTH]
              ):
                  rows.append({
                      "rank":
                      rank,

                      "source":
                      record.source,

                      "digest_hamming":
                      record.digest_hamming,

                      "digest_prefix_match":
                      record.digest_prefix_match,

                      "best_digest_hamming":
                      best_digest,

                      "digest_slack":
                      slack,

                      "E_digest":
                      record.E_digest,

                      "E_observation":
                      record.E_observation,

                      "E_local":
                      record.E_local,

                      "E_global":
                      record.E_global,

                      "C_missing":
                      record.C_missing,

                      "total_energy":
                      record.total_energy,

                      "residual_signature":
                      (
                          f"{record.residual_signature:016x}"
                      ),

                      "header_hex":
                      record.header.hex(),

                      "displayed_hash":
                      record.displayed_hash,
                  })

              write_csv(
                  FRONTIER,
                  rows,
              )


          def write_final_exports(
              evaluation: Evaluation,
              truth_header: bytes,
          ) -> None:
              round_rows: List[dict] = []
              lattice_rows: List[dict] = []

              feature = np.zeros(
                  (
                      4,
                      4,
                      4,
                      4,
                  ),
                  dtype=float,
              )

              lane_pairs = (
                  (
                      0,
                      4,
                  ),
                  (
                      1,
                      5,
                  ),
                  (
                      2,
                      6,
                  ),
                  (
                      3,
                      7,
                  ),
              )

              for (
                  trace,
                  required,
                  backward,
              ) in zip(
                  evaluation.traces,
                  evaluation.compatibility.required_words,
                  evaluation.compatibility.backward_states,
              ):
                  for row in trace.rounds:
                      round_rows.append({
                          "phase":
                          trace.phase,

                          "round":
                          row.round_index,

                          "w_actual":
                          f"{row.w:08x}",

                          "w_required":
                          (
                              f"{required[row.round_index]:08x}"
                          ),

                          "schedule_edge_hamming":
                          hamming_word(
                              row.w,
                              required[
                                  row.round_index
                              ],
                          ),

                          "state_edge_hamming":
                          hamming_state(
                              row.state_in,
                              backward[
                                  row.round_index
                              ],
                          ),

                          "a_in":
                          f"{row.state_in[0]:08x}",

                          "b_in":
                          f"{row.state_in[1]:08x}",

                          "c_in":
                          f"{row.state_in[2]:08x}",

                          "d_in":
                          f"{row.state_in[3]:08x}",

                          "e_in":
                          f"{row.state_in[4]:08x}",

                          "f_in":
                          f"{row.state_in[5]:08x}",

                          "g_in":
                          f"{row.state_in[6]:08x}",

                          "h_in":
                          f"{row.state_in[7]:08x}",
                      })

                      r = row.round_index

                      (
                          a_coord,
                          remainder,
                      ) = divmod(
                          r,
                          16,
                      )

                      (
                          b_coord,
                          c_coord,
                      ) = divmod(
                          remainder,
                          4,
                      )

                      for (
                          d_coord,
                          pair,
                      ) in enumerate(
                          lane_pairs
                      ):
                          values = (
                              row.state_in[
                                  pair[0]
                              ],
                              row.state_in[
                                  pair[1]
                              ],
                          )

                          feature[
                              a_coord,
                              b_coord,
                              c_coord,
                              d_coord,
                          ] += (
                              sum(
                                  value.bit_count()
                                  for value in values
                              )
                              / 192.0
                          )

                          if EMIT_LATTICE_BITS:
                              for lane_index in pair:
                                  lane_value = (
                                      row.state_in[
                                          lane_index
                                      ]
                                  )

                                  for bit in range(32):
                                      lattice_rows.append({
                                          "phase":
                                          trace.phase,

                                          "a":
                                          a_coord,

                                          "b":
                                          b_coord,

                                          "c":
                                          c_coord,

                                          "d":
                                          d_coord,

                                          "round":
                                          r,

                                          "state_lane":
                                          "abcdefgh"[
                                              lane_index
                                          ],

                                          "bit":
                                          bit,

                                          "value":
                                          (
                                              lane_value
                                              >> (
                                                  31
                                                  - bit
                                              )
                                          )
                                          & 1,
                                      })

              write_csv(
                  ROUND_STATES,
                  round_rows,
              )

              if lattice_rows:
                  write_csv(
                      LATTICE_BITS,
                      lattice_rows,
                  )

              projection_rows: List[dict] = []

              clouds: Dict[
                  int,
                  np.ndarray,
              ] = {}

              rng = np.random.default_rng(
                  DETERMINISTIC_SEED
                  or 314159
              )

              for omitted_axis in range(4):
                  reduced = feature.sum(
                      axis=omitted_axis
                  )

                  if (
                      PROJECTION_NOISE_SIGMA
                      > 0
                  ):
                      reduced = (
                          reduced
                          + rng.normal(
                              0,
                              PROJECTION_NOISE_SIGMA,
                              size=reduced.shape,
                          )
                      )

                  cloud = []

                  for index in np.ndindex(
                      reduced.shape
                  ):
                      value = float(
                          reduced[index]
                      )

                      cloud.append([
                          float(index[0]),
                          float(index[1]),
                          float(index[2]),
                          value,
                      ])

                      projection_rows.append({
                          "omitted_axis":
                          omitted_axis,

                          "u":
                          index[0],

                          "v":
                          index[1],

                          "w":
                          index[2],

                          "projected_feature":
                          value,
                      })

                  clouds[omitted_axis] = (
                      np.asarray(
                          cloud,
                          dtype=float,
                      )
                  )

              write_csv(
                  PROJECTIONS,
                  projection_rows,
              )

              gauge_rows = []

              for (
                  axis,
                  cloud4,
              ) in clouds.items():
                  coordinates = (
                      cloud4[:, :3]
                  )

                  weights = (
                      np.abs(
                          cloud4[:, 3]
                      )
                      + 1e-12
                  )

                  weights /= weights.sum()

                  centroid = np.sum(
                      coordinates
                      * weights[:, None],
                      axis=0,
                  )

                  centered = (
                      coordinates
                      - centroid
                  )

                  rms = float(
                      np.sqrt(
                          np.sum(
                              weights
                              * np.sum(
                                  centered ** 2,
                                  axis=1,
                              )
                          )
                      )
                  )

                  scaled = (
                      centered / rms
                      if rms
                      else centered
                  )

                  covariance = (
                      (
                          scaled
                          * weights[:, None]
                      ).T
                      @ scaled
                  )

                  (
                      eigenvalues,
                      eigenvectors,
                  ) = np.linalg.eigh(
                      covariance
                  )

                  order = np.argsort(
                      eigenvalues
                  )[::-1]

                  principal = (
                      eigenvectors[
                          :,
                          order[0],
                      ]
                  )

                  gauge_rows.append({
                      "omitted_axis":
                      axis,

                      "centroid_x":
                      float(
                          centroid[0]
                      ),

                      "centroid_y":
                      float(
                          centroid[1]
                      ),

                      "centroid_z":
                      float(
                          centroid[2]
                      ),

                      "rms_scale":
                      rms,

                      "principal_axis_x":
                      float(
                          principal[0]
                      ),

                      "principal_axis_y":
                      float(
                          principal[1]
                      ),

                      "principal_axis_z":
                      float(
                          principal[2]
                      ),

                      "gauge_section":
                      (
                          "weighted center=0; "
                          "RMS=1; principal axis fixed"
                      ),
                  })

              write_csv(
                  GAUGE_DIAGNOSTICS,
                  gauge_rows,
              )

              frequency_rows = []

              for axis in range(4):
                  field = (
                      clouds[axis][:, 3]
                      .reshape(
                          4,
                          4,
                          4,
                      )
                  )

                  spectrum = np.fft.fftn(
                      field
                  )

                  frequencies = np.meshgrid(
                      *[
                          np.fft.fftfreq(4)
                      ]
                      * 3,
                      indexing="ij",
                  )

                  radius = np.sqrt(
                      sum(
                          component ** 2
                          for component
                          in frequencies
                      )
                  )

                  cutoff = 0.35

                  low = np.where(
                      radius <= cutoff,
                      spectrum,
                      0,
                  )

                  high = spectrum - low

                  low_energy = float(
                      np.sum(
                          np.abs(low) ** 2
                      )
                  )

                  high_energy = float(
                      np.sum(
                          np.abs(high) ** 2
                      )
                  )

                  frequency_rows.append({
                      "omitted_axis":
                      axis,

                      "cutoff":
                      cutoff,

                      "low_frequency_phi_energy":
                      low_energy,

                      "high_frequency_xi_energy":
                      high_energy,

                      "low_fraction":
                      (
                          low_energy
                          / (
                              low_energy
                              + high_energy
                          )
                          if (
                              low_energy
                              + high_energy
                          )
                          else 0.0
                      ),
                  })

              write_csv(
                  FREQUENCY_SPLIT,
                  frequency_rows,
              )

              write_csv(
                  TOLERANCE,
                  [
                      {
                          "delta":
                          0.0,

                          "active_points":
                          1,

                          "connected_components":
                          1,

                          "posterior_mass_in_ball":
                          1.0,

                          "note":
                          (
                              "one exact returned model; "
                              "no unobserved posterior "
                              "samples fabricated"
                          ),
                      }
                  ],
              )

              write_csv(
                  STABILITY,
                  [
                      {
                          "eta":
                          0.0,

                          "mean_quotient_displacement":
                          0.0,

                          "p95_quotient_displacement":
                          0.0,

                          "max_quotient_displacement":
                          0.0,

                          "claim":
                          "exact solved state only",
                      }
                  ],
              )


          def main() -> None:
              started = time.time()

              write_model_spec()

              SEARCH_TRACE.unlink(
                  missing_ok=True
              )

              state_for_signal: Dict[
                  str,
                  object,
              ] = {
                  "cycle":
                  0,

                  "beam":
                  [],

                  "best":
                  None,

                  "best_digest":
                  256,

                  "stagnation":
                  0,

                  "exact_models":
                  [],

                  "dedup_size":
                  0,
              }


              def handle_signal(
                  signum,
                  frame,
              ) -> None:
                  best = state_for_signal.get(
                      "best"
                  )

                  beam = (
                      state_for_signal.get(
                          "beam"
                      )
                      or []
                  )

                  exact_models = (
                      state_for_signal.get(
                          "exact_models"
                      )
                      or []
                  )

                  if isinstance(
                      best,
                      LightRecord,
                  ):
                      write_checkpoint(
                          int(
                              state_for_signal.get(
                                  "cycle",
                                  0,
                              )
                          ),
                          beam,
                          best,
                          int(
                              state_for_signal.get(
                                  "best_digest",
                                  best.digest_hamming,
                              )
                          ),
                          int(
                              state_for_signal.get(
                                  "stagnation",
                                  0,
                              )
                          ),
                          exact_models,
                          int(
                              state_for_signal.get(
                                  "dedup_size",
                                  0,
                              )
                          ),
                          started,
                          terminated_by_signal=signum,
                      )

                  STATUS.write_text(
                      json.dumps(
                          {
                              "completed":
                              False,

                              "fake_completion":
                              False,

                              "terminated_by_signal":
                              signum,

                              "exit_code":
                              128 + signum,

                              "model_revision":
                              MODEL_REVISION,

                              "elapsed_seconds":
                              time.time() - started,

                              "checkpoint_written":
                              CHECKPOINT.exists(),
                          },
                          indent=2,
                          sort_keys=True,
                      ),
                      encoding="utf-8",
                  )

                  raise SystemExit(
                      128 + signum
                  )


              signal.signal(
                  signal.SIGTERM,
                  handle_signal,
              )

              signal.signal(
                  signal.SIGINT,
                  handle_signal,
              )


              status = {
                  "completed":
                  False,

                  "fake_completion":
                  False,

                  "model_revision":
                  MODEL_REVISION,

                  "external_symbolic_solver_used":
                  False,

                  "z3_used":
                  False,

                  "artificial_scramble":
                  False,

                  "physical_rubik_moves_used":
                  False,

                  "nonce_interval_loop":
                  False,

                  "internal_solver_timeout":
                  None,

                  "iteration_limit":
                  None,

                  "search_depth_limit":
                  None,

                  "beam_width":
                  BEAM_WIDTH,

                  "exact_hash_match":
                  False,

                  "exact_original_header_match":
                  False,
              }


              try:
                  metadata: dict = {}

                  block_hash = BLOCK_HASH
                  raw_header_hex = RAW_HEADER_HEX

                  if raw_header_hex:
                      if len(
                          raw_header_hex
                      ) != 160:
                          raise ValueError(
                              "RAW_HEADER_HEX must be "
                              "exactly 160 hex characters"
                          )

                      sealed_truth_header = (
                          bytes.fromhex(
                              raw_header_hex
                          )
                      )

                      computed = (
                          hashlib_displayed_hash(
                              sealed_truth_header
                          )
                      )

                      block_hash = (
                          EXPECTED_BLOCK_HASH
                          or computed
                      )

                      if computed != block_hash:
                          raise ValueError(
                              "raw header does not match "
                              "expected block hash"
                          )

                  else:
                      if not block_hash:
                          block_hash = (
                              http_text(
                                  (
                                      "/block-height/"
                                      f"{int(BLOCK_HEIGHT)}"
                                  )
                              )
                              if BLOCK_HEIGHT
                              else http_text(
                                  "/blocks/tip/hash"
                              )
                          )

                      raw_header_hex = http_text(
                          (
                              f"/block/{block_hash}"
                              "/header"
                          )
                      ).lower()

                      if len(
                          raw_header_hex
                      ) != 160:
                          raise RuntimeError(
                              "API did not return "
                              "an 80-byte header"
                          )

                      sealed_truth_header = (
                          bytes.fromhex(
                              raw_header_hex
                          )
                      )

                      metadata = http_json(
                          f"/block/{block_hash}"
                      )

                      if (
                          hashlib_displayed_hash(
                              sealed_truth_header
                          )
                          != block_hash
                      ):
                          raise RuntimeError(
                              "fetched header failed "
                              "independent validation"
                          )

                  target_raw = bytes.fromhex(
                      block_hash
                  )[::-1]

                  hidden = parse_hidden_bits()

                  observation_mutable = bytearray(
                      sealed_truth_header
                  )

                  for bit in hidden:
                      put_bit(
                          observation_mutable,
                          bit,
                          0,
                      )

                  observation = bytes(
                      observation_mutable
                  )

                  initial_mask = tuple(
                      0
                      if bit in hidden
                      else 1
                      for bit in range(640)
                  )

                  initial_header = (
                      canonical_initial_header(
                          target_raw,
                          block_hash,
                          observation,
                          hidden,
                          initial_mask,
                          metadata,
                      )
                  )

                  initial_evaluation = evaluate(
                      initial_header,
                      target_raw,
                      block_hash,
                      observation,
                      initial_mask,
                      metadata,
                      1.0,
                  )

                  serial = 0

                  initial_record = to_light(
                      initial_evaluation,
                      "canonical_backward_pullback",
                      serial,
                  )

                  beam: List[
                      LightRecord
                  ] = [
                      initial_record
                  ]

                  dedup = BoundedFingerprints(
                      DEDUP_CAPACITY
                  )

                  dedup.add(
                      header_fingerprint(
                          initial_header
                      )
                  )

                  exact_models: List[
                      LightRecord
                  ] = []

                  best = initial_record

                  best_digest = (
                      initial_record
                      .digest_hamming
                  )

                  best_prefix = (
                      initial_record
                      .digest_prefix_match
                  )

                  stagnation_cycles = 0
                  cycle = 0

                  emit(
                      (
                          "[model] revision="
                          f"{MODEL_REVISION}"
                      )
                  )

                  emit(
                      (
                          "[bitcoin] block_hash="
                          f"{block_hash}"
                      )
                  )

                  emit(
                      (
                          "[config] recovery_scope="
                          f"{RECOVERY_SCOPE} "
                          "context_mode="
                          f"{CONTEXT_MODE}"
                      )
                  )

                  emit(
                      (
                          "[config] hidden_bits="
                          f"{len(hidden)} "
                          "z3_used=false"
                      )
                  )

                  emit(
                      (
                          "[memory] beam_width="
                          f"{BEAM_WIDTH} "
                          "lightweight_records=true "
                          "dedup_capacity="
                          f"{DEDUP_CAPACITY}"
                      )
                  )

                  emit(
                      (
                          "[target] "
                          "digest_hamming_weight="
                          f"{DIGEST_HAMMING_WEIGHT} "
                          "digest_prefix_weight="
                          f"{DIGEST_PREFIX_WEIGHT}"
                      )
                  )

                  emit(
                      (
                          "[initial] "
                          "digest_hamming="
                          f"{best_digest} "
                          "prefix="
                          f"{best_prefix} "
                          "E_local="
                          f"{best.E_local:.6f} "
                          "total="
                          f"{best.total_energy:.6f}"
                      )
                  )

                  while not requested_model_count_reached(
                      len(exact_models)
                  ):
                      cycle += 1

                      current_pressure = (
                          target_pressure(
                              stagnation_cycles
                          )
                      )

                      current_slack = (
                          adaptive_slack(
                              stagnation_cycles
                          )
                      )

                      beam.sort(
                          key=priority
                      )

                      active = beam[
                          :min(
                              EXPANSION_BATCH,
                              len(beam),
                          )
                      ]

                      survivors = beam[
                          len(active):
                      ]

                      generated: List[
                          LightRecord
                      ] = []

                      for record in active:
                          parent = evaluate(
                              record.header,
                              target_raw,
                              block_hash,
                              observation,
                              initial_mask,
                              metadata,
                              current_pressure,
                          )

                          if parent.exact_hash_match:
                              if (
                                  hashlib_displayed_hash(
                                      parent.header
                                  )
                                  != block_hash
                              ):
                                  raise RuntimeError(
                                      "internal exact state "
                                      "failed independent "
                                      "hashlib validation"
                                  )

                              exact_record = (
                                  to_light(
                                      parent,
                                      record.source,
                                      record.serial,
                                  )
                              )

                              if all(
                                  model.header
                                  != exact_record.header
                                  for model
                                  in exact_models
                              ):
                                  exact_models.append(
                                      exact_record
                                  )

                                  emit(
                                      (
                                          "[complete] exact "
                                          "model "
                                          f"{len(exact_models)}: "
                                          f"{exact_record.header.hex()}"
                                      )
                                  )

                              if requested_model_count_reached(
                                  len(exact_models)
                              ):
                                  best = exact_record
                                  break

                          children, serial = (
                              evaluate_children(
                                  parent,
                                  target_raw,
                                  block_hash,
                                  observation,
                                  hidden,
                                  initial_mask,
                                  metadata,
                                  current_pressure,
                                  cycle,
                                  serial,
                              )
                          )

                          for child in children:
                              if (
                                  child.digest_hamming
                                  > best_digest
                                  + current_slack
                              ):
                                  continue

                              if not dedup.add(
                                  header_fingerprint(
                                      child.header
                                  )
                              ):
                                  continue

                              generated.append(
                                  child
                              )

                      if requested_model_count_reached(
                          len(exact_models)
                      ):
                          break

                      candidate_pool = (
                          survivors
                          + generated
                      )

                      if not candidate_pool:
                          reevaluated_best = (
                              evaluate(
                                  best.header,
                                  target_raw,
                                  block_hash,
                                  observation,
                                  initial_mask,
                                  metadata,
                                  current_pressure,
                              )
                          )

                          (
                              children,
                              serial,
                          ) = evaluate_children(
                              reevaluated_best,
                              target_raw,
                              block_hash,
                              observation,
                              hidden,
                              initial_mask,
                              metadata,
                              current_pressure,
                              cycle,
                              serial,
                          )

                          candidate_pool = (
                              children
                          )

                      beam = frontier_prune(
                          candidate_pool,
                          best_digest,
                          current_slack,
                      )

                      if not beam:
                          raise RuntimeError(
                              "bounded 4D beam became empty "
                              "after structural pruning; "
                              "checkpoint contains the best "
                              "state and active thresholds"
                          )

                      cycle_best = min(
                          beam,
                          key=priority,
                      )

                      improved_digest = (
                          cycle_best.digest_hamming
                          < best_digest
                      )

                      improved_prefix = (
                          cycle_best.digest_hamming
                          == best_digest
                          and cycle_best.digest_prefix_match
                          > best_prefix
                      )

                      improved_energy = (
                          cycle_best.total_energy
                          < best.total_energy
                      )

                      if (
                          improved_digest
                          or improved_prefix
                          or improved_energy
                      ):
                          if improved_digest:
                              best_digest = (
                                  cycle_best
                                  .digest_hamming
                              )

                          if (
                              cycle_best.digest_hamming
                              == best_digest
                          ):
                              best_prefix = max(
                                  best_prefix,
                                  cycle_best
                                  .digest_prefix_match,
                              )

                          if (
                              priority(cycle_best)
                              < priority(best)
                          ):
                              best = cycle_best

                          if (
                              improved_digest
                              or improved_prefix
                          ):
                              stagnation_cycles = 0
                          else:
                              stagnation_cycles += 1

                      else:
                          stagnation_cycles += 1

                      state_for_signal.update({
                          "cycle":
                          cycle,

                          "beam":
                          beam,

                          "best":
                          best,

                          "best_digest":
                          best_digest,

                          "stagnation":
                          stagnation_cycles,

                          "exact_models":
                          exact_models,

                          "dedup_size":
                          len(dedup),
                      })

                      append_csv(
                          SEARCH_TRACE,
                          {
                              "cycle":
                              cycle,

                              "expanded":
                              len(active),

                              "generated_before_prune":
                              len(generated),

                              "beam_size":
                              len(beam),

                              "beam_width":
                              BEAM_WIDTH,

                              "best_digest_hamming":
                              best_digest,

                              "best_digest_prefix_match":
                              best_prefix,

                              "active_digest_hamming":
                              cycle_best.digest_hamming,

                              "active_digest_prefix_match":
                              cycle_best
                              .digest_prefix_match,

                              "best_E_local":
                              best.E_local,

                              "active_E_local":
                              cycle_best.E_local,

                              "best_total_energy":
                              best.total_energy,

                              "active_total_energy":
                              cycle_best.total_energy,

                              "digest_slack":
                              current_slack,

                              "target_pressure":
                              current_pressure,

                              "stagnation_cycles":
                              stagnation_cycles,

                              "dedup_fingerprints":
                              len(dedup),

                              "best_header_hex":
                              best.header.hex(),

                              "best_displayed_hash":
                              best.displayed_hash,
                          },
                      )

                      if (
                          cycle == 1
                          or cycle
                          % CHECKPOINT_INTERVAL
                          == 0
                          or improved_digest
                      ):
                          emit(
                              (
                                  "[cycle "
                                  f"{cycle}] "
                                  "beam="
                                  f"{len(beam)} "
                                  "generated="
                                  f"{len(generated)} "
                                  "active_hamming="
                                  f"{cycle_best.digest_hamming} "
                                  "best_hamming="
                                  f"{best_digest} "
                                  "best_prefix="
                                  f"{best_prefix} "
                                  "slack="
                                  f"{current_slack} "
                                  "pressure="
                                  f"{current_pressure:.2f} "
                                  "stagnation="
                                  f"{stagnation_cycles}"
                              )
                          )

                          write_frontier(
                              beam,
                              best_digest,
                              current_slack,
                          )

                          write_checkpoint(
                              cycle,
                              beam,
                              best,
                              best_digest,
                              stagnation_cycles,
                              exact_models,
                              len(dedup),
                              started,
                          )

                  if not exact_models:
                      raise RuntimeError(
                          "search ended without "
                          "an exact model"
                      )

                  recovered_record = (
                      exact_models[0]
                  )

                  recovered = evaluate(
                      recovered_record.header,
                      target_raw,
                      block_hash,
                      observation,
                      initial_mask,
                      metadata,
                      1.0,
                  )

                  exact_hash_match = (
                      hashlib_displayed_hash(
                          recovered.header
                      )
                      == block_hash
                  )

                  historical_match = (
                      recovered.header
                      == sealed_truth_header
                  )

                  if not exact_hash_match:
                      raise RuntimeError(
                          "completion failed "
                          "independent exact "
                          "SHA-256d validation"
                      )

                  header_rows = []

                  for byte_index in range(80):
                      field = next(
                          name
                          for (
                              name,
                              (
                                  start,
                                  end,
                              ),
                          ) in FIELD_RANGES_BYTES.items()
                          if (
                              start
                              <= byte_index
                              < end
                          )
                      )

                      was_hidden = any(
                          bit in hidden
                          for bit in range(
                              byte_index * 8,
                              byte_index * 8 + 8,
                          )
                      )

                      header_rows.append({
                          "byte_index":
                          byte_index,

                          "field":
                          field,

                          "observed_hex":
                          (
                              f"{observation[byte_index]:02x}"
                          ),

                          "recovered_hex":
                          (
                              f"{recovered.header[byte_index]:02x}"
                          ),

                          "historical_hex":
                          (
                              f"{sealed_truth_header[byte_index]:02x}"
                          ),

                          "was_hidden":
                          was_hidden,

                          "historical_match":
                          (
                              recovered.header[
                                  byte_index
                              ]
                              == sealed_truth_header[
                                  byte_index
                              ]
                          ),
                      })

                  write_csv(
                      HEADER_RECOVERY,
                      header_rows,
                  )

                  write_csv(
                      TESSERACT_SLOTS,
                      tesseract_slot_rows(),
                  )

                  write_final_exports(
                      recovered,
                      sealed_truth_header,
                  )

                  write_csv(
                      POSTERIOR,
                      [
                          {
                              "candidate":
                              index,

                              "recovered_header_hex":
                              model.header.hex(),

                              "displayed_hash":
                              model.displayed_hash,

                              "exact_hash_match":
                              True,

                              "exact_original_header_match":
                              (
                                  model.header
                                  == sealed_truth_header
                              ),

                              "candidate_set_posterior_mass":
                              (
                                  1.0
                                  / len(exact_models)
                              ),

                              "scope":
                              (
                                  "mass normalized only "
                                  "across exact models "
                                  "actually returned"
                              ),
                          }
                          for (
                              index,
                              model,
                          ) in enumerate(
                              exact_models
                          )
                      ],
                  )

                  write_csv(
                      FUNCTIONALS,
                      [
                          {
                              "functional":
                              "double_sha256_digest",

                              "hidden_from_observation":
                              False,

                              "exactly_recovered":
                              exact_hash_match,

                              "confidence_type":
                              (
                                  "independent hashlib "
                                  "validation"
                              ),

                              "ambiguity":
                              (
                                  "none for digest equality"
                              ),
                          },
                          {
                              "functional":
                              "historical_header_identity",

                              "hidden_from_observation":
                              bool(hidden),

                              "exactly_recovered":
                              historical_match,

                              "confidence_type":
                              (
                                  "post-solve comparison only"
                              ),

                              "ambiguity":
                              (
                                  "other exact preimages "
                                  "may exist"
                              ),
                          },
                      ],
                  )

                  write_csv(
                      MEASURE_AUDIT,
                      [
                          {
                              "component":
                              (
                                  "compact projection "
                                  "orientation"
                              ),

                              "measure":
                              (
                                  "normalized finite C3 "
                                  "counting measure"
                              ),

                              "operational":
                              (
                                  "product O_i=Identity "
                                  "enforced by "
                                  "sum O_i=0 mod 3"
                              ),
                          },
                          {
                              "component":
                              "translation gauge",

                              "measure":
                              "proper prior required",

                              "operational":
                              (
                                  "removed by weighted "
                                  "centering in projection "
                                  "diagnostics"
                              ),
                          },
                          {
                              "component":
                              "positive scale",

                              "measure":
                              (
                                  "log-scale coordinate ds/s"
                              ),

                              "operational":
                              (
                                  "removed by RMS "
                                  "normalization"
                              ),
                          },
                          {
                              "component":
                              (
                                  "declared tesseract "
                                  "state volume"
                              ),

                              "measure":
                              (
                                  "user-supplied finite "
                                  "prior volume"
                              ),

                              "operational":
                              (
                                  "used directly with no "
                                  "verification gate"
                              ),
                          },
                      ],
                  )

                  (
                      log2_states,
                      log10_states,
                  ) = log_state_space()

                  STATE_SPACE.write_text(
                      json.dumps(
                          {
                              "formula":
                              (
                                  "(16! * (64!)^2 * "
                                  "96! * 2^45 * 3^15) / "
                                  "(1536 * (8!)^8)"
                              ),

                              "declared_log2_states":
                              log2_states,

                              "declared_log10_states":
                              log10_states,

                              "formula_verification_gate":
                              False,

                              "interior_header_cells":
                              16,

                              "surface_constraint_cells":
                              240,

                              "total_4d_cells":
                              256,

                              "hard_constraints":
                              [
                                  (
                                      "p0 XOR p1 XOR "
                                      "p2 XOR p3 = 0"
                                  ),
                                  (
                                      "p0 XOR p1 = 0"
                                  ),
                                  (
                                      "product_i O_i = "
                                      "Identity"
                                  ),
                              ],

                              "added_group_law":
                              None,
                          },
                          indent=2,
                      ),
                      encoding="utf-8",
                  )

                  status.update({
                      "completed":
                      True,

                      "exact_hash_match":
                      exact_hash_match,

                      "exact_original_header_match":
                      historical_match,

                      "block_hash":
                      block_hash,

                      "hidden_bit_count":
                      len(hidden),

                      "cycles":
                      cycle,

                      "beam_size":
                      len(beam),

                      "beam_width":
                      BEAM_WIDTH,

                      "best_digest_hamming":
                      0,

                      "best_digest_prefix_match":
                      256,

                      "E_observation":
                      recovered.E_observation,

                      "E_local":
                      recovered.E_local,

                      "E_local_state_edges":
                      recovered
                      .compatibility
                      .state_edge_hamming,

                      "E_local_schedule_edges":
                      recovered
                      .compatibility
                      .schedule_edge_hamming,

                      "E_global":
                      recovered.E_global,

                      "C_missing":
                      recovered.C_missing,

                      "energy":
                      recovered.total_energy,

                      "recovered_header_hex":
                      recovered.header.hex(),

                      "recovered_display_hash":
                      recovered.displayed_hash,

                      "returned_exact_models":
                      len(exact_models),

                      "dedup_fingerprints":
                      len(dedup),

                      "elapsed_seconds":
                      time.time() - started,
                  })

                  STATUS.write_text(
                      json.dumps(
                          status,
                          indent=2,
                          sort_keys=True,
                      ),
                      encoding="utf-8",
                  )

                  REPORT.write_text(
                      "\n".join([
                          (
                              "BITCOIN SHA-256d 4D "
                              "JOINT-INFERENCE RESULT"
                          ),
                          "=" * 72,
                          (
                              "Model revision:                 "
                              f"{MODEL_REVISION}"
                          ),
                          (
                              "Block hash:                     "
                              f"{block_hash}"
                          ),
                          (
                              "Recovery scope:                 "
                              f"{RECOVERY_SCOPE}"
                          ),
                          (
                              "Hidden bits:                    "
                              f"{len(hidden)}"
                          ),
                          (
                              "Context mode:                   "
                              f"{CONTEXT_MODE}"
                          ),
                          (
                              "Cycles:                         "
                              f"{cycle}"
                          ),
                          (
                              "Beam width:                     "
                              f"{BEAM_WIDTH}"
                          ),
                          (
                              "Exact digest match:             "
                              f"{exact_hash_match}"
                          ),
                          (
                              "Exact historical header match: "
                              f"{historical_match}"
                          ),
                          (
                              "E_observation:                  "
                              f"{recovered.E_observation}"
                          ),
                          (
                              "E_local:                        "
                              f"{recovered.E_local}"
                          ),
                          (
                              "E_global:                       "
                              f"{recovered.E_global}"
                          ),
                          (
                              "C(m):                           "
                              f"{recovered.C_missing}"
                          ),
                          (
                              "Total MAP energy:               "
                              f"{recovered.total_energy}"
                          ),
                          (
                              "External SAT/SMT solver used:    "
                              "False"
                          ),
                          (
                              "Artificial scramble used:        "
                              "False"
                          ),
                          (
                              "Physical Rubik moves used:       "
                              "False"
                          ),
                          (
                              "Nonce interval loop used:        "
                              "False"
                          ),
                          (
                              "Internal timeout/iteration cap:  "
                              "None"
                          ),
                          (
                              "Frontier memory bounded:         "
                              "True"
                          ),
                          (
                              "Full traces stored in frontier:  "
                              "False"
                          ),
                          "",
                          "Recovered raw header:",
                          recovered.header.hex(),
                          "",
                          (
                              "Historical raw header "
                              "(post-solve comparison only):"
                          ),
                          sealed_truth_header.hex(),
                      ])
                      + "\n",
                      encoding="utf-8",
                  )

                  emit(
                      REPORT.read_text(
                          encoding="utf-8"
                      )
                  )

              except SystemExit:
                  raise

              except Exception as exc:
                  status.update({
                      "completed":
                      False,

                      "fake_completion":
                      False,

                      "error":
                      str(exc),

                      "traceback":
                      traceback.format_exc(),

                      "elapsed_seconds":
                      time.time() - started,
                  })

                  STATUS.write_text(
                      json.dumps(
                          status,
                          indent=2,
                          sort_keys=True,
                      ),
                      encoding="utf-8",
                  )

                  REPORT.write_text(
                      (
                          "BITCOIN SHA-256d 4D "
                          "JOINT-INFERENCE — INCOMPLETE\n"
                          + "=" * 72
                          + "\n"
                          + traceback.format_exc()
                      ),
                      encoding="utf-8",
                  )

                  emit(
                      REPORT.read_text(
                          encoding="utf-8"
                      )
                  )

                  raise


          if __name__ == "__main__":
              main()
          PY

          solver_rc=${PIPESTATUS[0]}
          exit "$solver_rc"

      - name: Publish authoritative status
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e

          if [ -f bitcoin_sha256d_4d_inverse_status.json ]; then
            cat bitcoin_sha256d_4d_inverse_status.json
          else
            echo '{"completed":false,"error":"status file not produced"}'
          fi

          exit 0

      - name: Upload the complete mathematical evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-sha256d-4d-joint-${{ github.run_number }}
          path: |
            bitcoin_sha256d_4d_inverse_status.json
            bitcoin_sha256d_4d_inverse_report.txt
            bitcoin_sha256d_mathematical_model.txt
            bitcoin_sha256d_header_recovery.csv
            bitcoin_sha256d_round_states.csv
            bitcoin_sha256d_tesseract_slots.csv
            bitcoin_sha256d_lattice_bits.csv
            bitcoin_sha256d_3d_projections.csv
            bitcoin_sha256d_4d_search_trace.csv
            bitcoin_sha256d_4d_frontier.csv
            bitcoin_sha256d_posterior_models.csv
            bitcoin_sha256d_tolerance_topology.csv
            bitcoin_sha256d_functional_identifiability.csv
            bitcoin_sha256d_measure_audit.csv
            bitcoin_sha256d_frequency_split.csv
            bitcoin_sha256d_gauge_diagnostics.csv
            bitcoin_sha256d_stability.csv
            bitcoin_sha256d_tesseract_state_space.json
            bitcoin_sha256d_4d_checkpoint.json
            bitcoin_sha256d_4d_inverse_console.log
          if-no-files-found: warn
          retention-days: 30