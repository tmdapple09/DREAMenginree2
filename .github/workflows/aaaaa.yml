          from itertools import combinations, product
          from pathlib import Path
          from typing import Dict, Iterable, List, Optional, Sequence, Tuple

          import numpy as np


          MASK32 = 0xFFFFFFFF
          MASK40 = (1 << 40) - 1

          STATE_EDGE_COUNT = 3 * 65
          SCHEDULE_EDGE_COUNT = 3 * 64


          API_BASE = os.environ.get(
