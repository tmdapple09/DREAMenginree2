# Bitcoin SHA-256d 4D tesseract reconstruction using the stated model
#
#   x = H_{m,pi}(y) + xi
#   H_{m,pi} = D_m o P_pi
#
#   E_local(y)  = sum_{(i,j) in A} d(e_i^->, e_j^<-)
#   E_global(y) = -log p_prior(y)
#   C(m)        = sum_j (1-m_j)
#
#   (y_hat,m_hat,pi_hat) = argmin [
#       ||x-H_{m,pi}(y)||^2/(2*sigma^2)
#       + lambda E_local(y)
#       + beta E_global(y)
#       + gamma C(m)
#   ]
#
# subject to:
#   p0 XOR p1 XOR p2 XOR p3 = 0
#   p0 XOR p1 = 0
#   product_{i=1}^16 O_i = Identity
#
# N_states =
#   (16! * (64!)^2 * 96! * 2^45 * 3^15) /
#   (1536 * (8!)^8)
#
# Continuous extension:
#   x = H_{m,pi}(T_{g,phi} y) + xi
#
# SHA-256d itself is the mixed 4D object. There is no artificial scramble,
# physical Rubik move sequence, nonce interval loop, SAT solver, SMT solver,
# or Z3 dependency.
#
# Revision r4 fixes the two failure modes observed in the previous run:
#
# 1. Frontier memory is bounded. The beam stores only lightweight scalar
#    records, never the 192-round traces. Full traces exist only while one
#    state is being evaluated and are immediately discarded.
#
# 2. The target digest is part of the observation energy with a dominant,
#    explicit weight. The beam is pruned by digest slack, Pareto dominance,
#    4D residual diversity, and a bounded transposition cache. The reported
#    best digest Hamming distance is therefore monotone non-increasing even
#    when an individual exploratory state is temporarily worse.

name: Bitcoin SHA-256d 4D Joint Inference

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string

      block_height:
        description: "Bitcoin block height; tip uses the current tip"
        required: false
        default: "tip"
        type: string

      block_hash:
        description: "Displayed block hash; auto derives it from block_height"
        required: false
        default: "auto"
        type: string

      raw_header_hex:
        description: "Exact 80-byte header or fetch to retrieve it"
        required: false
        default: "fetch"
        type: string

      expected_block_hash:
        description: "Expected displayed hash or derive"
        required: false
        default: "derive"
        type: string

      recovery_scope:
        description: "Header information hidden from reconstruction"
        required: true
        default: "full_header"
        type: choice
        options:
          - selected_fields
          - selected_bits
          - full_header

      hidden_fields:
        description: "Comma-separated: version,previous_hash,merkle_root,timestamp,bits,nonce"
        required: false
        default: "version,previous_hash,merkle_root,timestamp,bits,nonce"
        type: string

      hidden_bit_ranges:
        description: "Half-open serialized-header bit ranges, or none"
        required: false
        default: "none"
        type: string

      context_mode:
        description: "Evidence used by E_global"
        required: true
        default: "hash_only"
        type: choice
        options:
          - hash_only
          - derived_bitcoin
          - all_public

      infer_mask:
        description: "Infer m instead of fixing the configured visibility mask"
        required: false
        default: false
        type: boolean

      infer_permutation:
        description: "Infer the 16-piece projection permutation pi"
        required: false
        default: false
        type: boolean

      infer_orientation:
        description: "Infer the 16 C3 orientations O_i"
        required: false
        default: false
        type: boolean

      allow_observation_noise:
        description: "Treat surviving header disagreement as latent xi"
        required: false
        default: false
        type: boolean

      posterior_models:
        description: "Exact completed models requested; 0 keeps running with bounded memory"
        required: false
        default: "1"
        type: string

      sigma:
        description: "Observation-noise scale sigma"
        required: false
        default: "1.0"
        type: string

      lambda_local:
        description: "Weight lambda on normalized forward/backward local compatibility"
        required: false
        default: "1.0"
        type: string

      beta_global:
        description: "Weight beta on Bitcoin global coherence"
        required: false
        default: "1.0"
        type: string

      gamma_missing:
        description: "Weight gamma on C(m)"
        required: false
        default: "1.0"
        type: string

      a0:
        description: "a0 in f(x)=a0*x/(1+x^n)^(1/n)"
        required: false
        default: "1.2e-14"
        type: string

      n:
        description: "n in f(x)=a0*x/(1+x^n)^(1/n)"
        required: false
        default: "2.0"
        type: string

      projection_noise_sigma:
        description: "Continuous xi used only in exported 3D projections"
        required: false
        default: "0.0"
        type: string

      emit_lattice_bits:
        description: "Export solved bits across the final 4D round/lane lattice"
        required: false
        default: true
        type: boolean

      z3_random_seed:
        description: "Retained input name; deterministic tie-break seed only, no Z3 is used"
        required: false
        default: "0"
        type: string

      api_base:
        description: "Esplora-compatible Bitcoin API base"
        required: false
        default: "https://blockstream.info/api"
        type: string

      digest_hamming_weight:
        description: "Observation-energy weight for each wrong digest bit"
        required: false
        default: "256.0"
        type: string

      digest_prefix_weight:
        description: "Observation-energy weight for each unmatched leading digest bit"
        required: false
        default: "4.0"
        type: string

      beam_width:
        description: "Maximum lightweight states retained after each pruning cycle"
        required: false
        default: "2048"
        type: string

      expansion_batch:
        description: "Best beam states expanded per cycle"
        required: false
        default: "4"
        type: string

      children_per_state:
        description: "Best non-dominated children retained from each expanded state"
        required: false
        default: "48"
        type: string

      bit_probe_budget:
        description: "Pullback-disagreement bits tested per expanded state"
        required: false
        default: "128"
        type: string

      pair_probe_budget:
        description: "Best single-bit corrections paired per expanded state"
        required: false
        default: "24"
        type: string

      digest_slack:
        description: "Temporary digest-Hamming increase allowed above the global best"
        required: false
        default: "6"
        type: string

      max_digest_slack:
        description: "Maximum adaptive digest slack during stagnation"
        required: false
        default: "18"
        type: string

      stagnation_window:
        description: "Cycles without digest improvement before increasing digest slack"
        required: false
        default: "20"
        type: string

      diversity_per_bucket:
        description: "Maximum states retained per digest/prefix/residual basin"
        required: false
        default: "16"
        type: string

      dedup_capacity:
        description: "Bounded 64-bit transposition fingerprints retained"
        required: false
        default: "250000"
        type: string

      checkpoint_interval:
        description: "Cycles between full status/checkpoint writes"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: bitcoin-sha256d-4d-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ${{ inputs.runner_label }}
    continue-on-error: true

    env:
      BLOCK_HEIGHT: ${{ inputs.block_height }}
      BLOCK_HASH: ${{ inputs.block_hash }}
      RAW_HEADER_HEX: ${{ inputs.raw_header_hex }}
      EXPECTED_BLOCK_HASH: ${{ inputs.expected_block_hash }}
      RECOVERY_SCOPE: ${{ inputs.recovery_scope }}
      HIDDEN_FIELDS: ${{ inputs.hidden_fields }}
      HIDDEN_BIT_RANGES: ${{ inputs.hidden_bit_ranges }}
      CONTEXT_MODE: ${{ inputs.context_mode }}
      INFER_MASK: ${{ inputs.infer_mask }}
      INFER_PERMUTATION: ${{ inputs.infer_permutation }}
      INFER_ORIENTATION: ${{ inputs.infer_orientation }}
      ALLOW_OBSERVATION_NOISE: ${{ inputs.allow_observation_noise }}
      POSTERIOR_MODELS: ${{ inputs.posterior_models }}
      SIGMA: ${{ inputs.sigma }}
      LAMBDA_LOCAL: ${{ inputs.lambda_local }}
      BETA_GLOBAL: ${{ inputs.beta_global }}
      GAMMA_MISSING: ${{ inputs.gamma_missing }}
      A0: ${{ inputs.a0 }}
      N_EXPONENT: ${{ inputs.n }}
      PROJECTION_NOISE_SIGMA: ${{ inputs.projection_noise_sigma }}
      EMIT_LATTICE_BITS: ${{ inputs.emit_lattice_bits }}
      DETERMINISTIC_SEED: ${{ inputs.z3_random_seed }}
      API_BASE: ${{ inputs.api_base }}
      DIGEST_HAMMING_WEIGHT: ${{ inputs.digest_hamming_weight }}
      DIGEST_PREFIX_WEIGHT: ${{ inputs.digest_prefix_weight }}
      BEAM_WIDTH: ${{ inputs.beam_width }}
      EXPANSION_BATCH: ${{ inputs.expansion_batch }}
      CHILDREN_PER_STATE: ${{ inputs.children_per_state }}
      BIT_PROBE_BUDGET: ${{ inputs.bit_probe_budget }}
      PAIR_PROBE_BUDGET: ${{ inputs.pair_probe_budget }}
      DIGEST_SLACK: ${{ inputs.digest_slack }}
      MAX_DIGEST_SLACK: ${{ inputs.max_digest_slack }}
      STAGNATION_WINDOW: ${{ inputs.stagnation_window }}
      DIVERSITY_PER_BUCKET: ${{ inputs.diversity_per_bucket }}
      DEDUP_CAPACITY: ${{ inputs.dedup_capacity }}
      CHECKPOINT_INTERVAL: ${{ inputs.checkpoint_interval }}
      MODEL_REVISION: "2026-07-15-user-model-direct-r4-bounded-beam"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical projection dependency
        shell: bash
        run: |
          set -e
          python -m pip install --disable-pip-version-check numpy

      - name: Run bounded 4D target-directed reconstruction
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          python - <<'PY' 2>&1 | tee bitcoin_sha256d_4d_inverse_console.log
