# Bitcoin SHA-256d 4D joint inference
#
# x=H_{m,pi}(y)+xi, H_{m,pi}=D_m o P_pi
# E_local(y)=sum_{(i,j) in A}d(e_i^->,e_j^<-)
# E_global(y)=-log p_prior(y)
# C(m)=sum_j(1-m_j)
#
# (y_hat,m_hat,pi_hat)=argmin[
#   ||x-H_{m,pi}(y)||^2/(2*sigma^2)
#   +lambda E_local(y)+beta E_global(y)+gamma C(m)
# ]
#
# subject to:
# p0 XOR p1 XOR p2 XOR p3=0
# p0 XOR p1=0
# product_{i=1}^16 O_i=Identity
#
# N_states=(16!*(64!)^2*96!*2^45*3^15)/(1536*(8!)^8)
# Continuous extension: x=H_{m,pi}(T_{g,phi}y)+xi
#
# Fixes in this revision:
# - target digest disagreement is a dominant observation term;
# - E_local uses normalized edge distances;
# - the frontier stores only lightweight headers and scalar scores;
# - bounded beam, adaptive digest slack, diversity buckets, and bounded dedup
#   prevent frontier memory growth;
# - round-robin expansion prevents repeatedly expanding only the same elites;
# - best_digest_hamming is monotone non-increasing in logs;
# - SIGTERM writes a checkpoint before exit 143.

name: Bitcoin SHA-256d 4D Joint Inference

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      block_height:
        description: Bitcoin block height; tip uses current tip
        required: false
        default: "953568"
        type: string
      block_hash:
        description: Displayed block hash; auto derives from block_height
        required: false
        default: auto
        type: string
      raw_header_hex:
        description: Exact 80-byte header or fetch
        required: false
        default: fetch
        type: string
      expected_block_hash:
        description: Expected displayed hash or derive
        required: false
        default: derive
        type: string
      recovery_scope:
        description: Header information hidden from reconstruction
        required: true
        default: full_header
        type: choice
        options: [selected_fields,selected_bits,full_header]
      hidden_fields:
        description: Comma-separated header fields
        required: false
        default: version,previous_hash,merkle_root,timestamp,bits,nonce
        type: string
      hidden_bit_ranges:
        description: Half-open serialized-header bit ranges or none
        required: false
        default: none
        type: string
      context_mode:
        description: Evidence used by E_global
        required: true
        default: hash_only
        type: choice
        options: [hash_only,derived_bitcoin,all_public]
      infer_mask:
        description: Infer m instead of fixing visibility
        required: false
        default: false
        type: boolean
      infer_permutation:
        description: Infer the 16-piece projection permutation pi
        required: false
        default: false
        type: boolean
      infer_orientation:
        description: Infer the 16 C3 orientations O_i
        required: false
        default: false
        type: boolean
      allow_observation_noise:
        description: Treat visible-header disagreement as xi
        required: false
        default: false
        type: boolean
      posterior_models:
        description: Exact models requested; 0 runs until externally stopped
        required: false
        default: "1"
        type: string
      sigma:
        description: Observation-noise scale sigma
        required: false
        default: "1.0"
        type: string
      lambda_local:
        description: Weight lambda on normalized local compatibility
        required: false
        default: "1.0"
        type: string
      beta_global:
        description: Weight beta on Bitcoin global coherence
        required: false
        default: "1.0"
        type: string
      gamma_missing:
        description: Weight gamma on C(m)
        required: false
        default: "1.0"
        type: string
      a0:
        description: a0 in f(x)=a0*x/(1+x^n)^(1/n)
        required: false
        default: "1.2e-14"
        type: string
      n:
        description: n in f(x)=a0*x/(1+x^n)^(1/n)
        required: false
        default: "2.0"
        type: string
      projection_noise_sigma:
        description: xi used only in exported projections
        required: false
        default: "0.0"
        type: string
      emit_lattice_bits:
        description: Export bits across the final 4D round/lane lattice
        required: false
        default: true
        type: boolean
      z3_random_seed:
        description: Retained name; deterministic tie-break seed, no Z3
        required: false
        default: "0"
        type: string
      api_base:
        description: Esplora-compatible Bitcoin API base
        required: false
        default: https://blockstream.info/api
        type: string
      digest_weight:
        description: Observation weight per wrong target-digest bit
        required: false
        default: "1024.0"
        type: string
      prefix_weight:
        description: Observation weight per unmatched leading digest bit
        required: false
        default: "4.0"
        type: string
      beam_width:
        description: Maximum lightweight states retained
        required: false
        default: "1024"
        type: string
      expansion_batch:
        description: States expanded per cycle
        required: false
        default: "4"
        type: string
      children_per_parent:
        description: Diverse children retained per expanded state
        required: false
        default: "48"
        type: string
      bit_probe_budget:
        description: Pullback-disagreement bits tested per state
        required: false
        default: "96"
        type: string
      pair_probe_budget:
        description: Best single-bit corrections paired per state
        required: false
        default: "16"
        type: string
      digest_slack:
        description: Digest Hamming distance allowed above global best
        required: false
        default: "6"
        type: string
      max_digest_slack:
        description: Maximum adaptive digest slack
        required: false
        default: "48"
        type: string
      stagnation_window:
        description: Cycles before widening digest slack
        required: false
        default: "10"
        type: string
      diversity_per_bucket:
        description: Maximum states per digest/prefix/residual basin
        required: false
        default: "8"
        type: string
      dedup_capacity:
        description: Bounded 64-bit transposition fingerprints
        required: false
        default: "150000"
        type: string
      checkpoint_interval:
        description: Cycles between status writes
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: bitcoin-sha256d-4d-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ${{ inputs.runner_label }}
    continue-on-error: true
    env:
      BLOCK_HEIGHT: ${{ inputs.block_height }}
      BLOCK_HASH: ${{ inputs.block_hash }}
      RAW_HEADER_HEX: ${{ inputs.raw_header_hex }}
      EXPECTED_BLOCK_HASH: ${{ inputs.expected_block_hash }}
      RECOVERY_SCOPE: ${{ inputs.recovery_scope }}
      HIDDEN_FIELDS: ${{ inputs.hidden_fields }}
      HIDDEN_BIT_RANGES: ${{ inputs.hidden_bit_ranges }}
      CONTEXT_MODE: ${{ inputs.context_mode }}
      INFER_MASK: ${{ inputs.infer_mask }}
      INFER_PERMUTATION: ${{ inputs.infer_permutation }}
      INFER_ORIENTATION: ${{ inputs.infer_orientation }}
      ALLOW_OBSERVATION_NOISE: ${{ inputs.allow_observation_noise }}
      POSTERIOR_MODELS: ${{ inputs.posterior_models }}
      SIGMA: ${{ inputs.sigma }}
      LAMBDA_LOCAL: ${{ inputs.lambda_local }}
      BETA_GLOBAL: ${{ inputs.beta_global }}
      GAMMA_MISSING: ${{ inputs.gamma_missing }}
      A0: ${{ inputs.a0 }}
      N_EXPONENT: ${{ inputs.n }}
      PROJECTION_NOISE_SIGMA: ${{ inputs.projection_noise_sigma }}
      EMIT_LATTICE_BITS: ${{ inputs.emit_lattice_bits }}
      DETERMINISTIC_SEED: ${{ inputs.z3_random_seed }}
      API_BASE: ${{ inputs.api_base }}
      DIGEST_WEIGHT: ${{ inputs.digest_weight }}
      PREFIX_WEIGHT: ${{ inputs.prefix_weight }}
      BEAM_WIDTH: ${{ inputs.beam_width }}
      EXPANSION_BATCH: ${{ inputs.expansion_batch }}
      CHILDREN_PER_PARENT: ${{ inputs.children_per_parent }}
      BIT_PROBE_BUDGET: ${{ inputs.bit_probe_budget }}
      PAIR_PROBE_BUDGET: ${{ inputs.pair_probe_budget }}
      DIGEST_SLACK: ${{ inputs.digest_slack }}
      MAX_DIGEST_SLACK: ${{ inputs.max_digest_slack }}
      STAGNATION_WINDOW: ${{ inputs.stagnation_window }}
      DIVERSITY_PER_BUCKET: ${{ inputs.diversity_per_bucket }}
      DEDUP_CAPACITY: ${{ inputs.dedup_capacity }}
      CHECKPOINT_INTERVAL: ${{ inputs.checkpoint_interval }}
      MODEL_REVISION: 2026-07-15-user-model-direct-r2-bounded-target
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounded target-directed 4D reconstruction
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee bitcoin_sha256d_4d_inverse_console.log
          from __future__ import annotations
          import csv,hashlib,json,math,os,signal,sys,time,traceback,urllib.request
          from collections import OrderedDict,defaultdict
          from dataclasses import dataclass
          from itertools import combinations,product
          from pathlib import Path
          from typing import Dict,Iterable,List,Optional,Sequence,Tuple

          MASK32=0xffffffff
          MASK40=(1<<40)-1
          API_BASE=os.environ.get("API_BASE","https://blockstream.info/api").rstrip("/")
          BLOCK_HEIGHT_RAW=os.environ.get("BLOCK_HEIGHT","953568").strip()
          BLOCK_HASH_RAW=os.environ.get("BLOCK_HASH","auto").strip()
          RAW_HEADER_RAW=os.environ.get("RAW_HEADER_HEX","fetch").strip()
          EXPECTED_HASH_RAW=os.environ.get("EXPECTED_BLOCK_HASH","derive").strip()
          RECOVERY_SCOPE=os.environ.get("RECOVERY_SCOPE","full_header").strip()
          HIDDEN_FIELDS=[x.strip() for x in os.environ.get("HIDDEN_FIELDS","version,previous_hash,merkle_root,timestamp,bits,nonce").split(",") if x.strip()]
          HIDDEN_BIT_RANGES_RAW=os.environ.get("HIDDEN_BIT_RANGES","none").strip()
          CONTEXT_MODE=os.environ.get("CONTEXT_MODE","hash_only").strip()
          INFER_MASK=os.environ.get("INFER_MASK","false").lower()=="true"
          INFER_PERMUTATION=os.environ.get("INFER_PERMUTATION","false").lower()=="true"
          INFER_ORIENTATION=os.environ.get("INFER_ORIENTATION","false").lower()=="true"
          ALLOW_OBSERVATION_NOISE=os.environ.get("ALLOW_OBSERVATION_NOISE","false").lower()=="true"
          POSTERIOR_MODELS=int(os.environ.get("POSTERIOR_MODELS","1"))
          SIGMA=float(os.environ.get("SIGMA","1.0"))
          LAMBDA_LOCAL=float(os.environ.get("LAMBDA_LOCAL","1.0"))
          BETA_GLOBAL=float(os.environ.get("BETA_GLOBAL","1.0"))
          GAMMA_MISSING=float(os.environ.get("GAMMA_MISSING","1.0"))
          A0=float(os.environ.get("A0","1.2e-14"))
          N_EXPONENT=float(os.environ.get("N_EXPONENT","2.0"))
          PROJECTION_NOISE_SIGMA=float(os.environ.get("PROJECTION_NOISE_SIGMA","0.0"))
          EMIT_LATTICE_BITS=os.environ.get("EMIT_LATTICE_BITS","true").lower()=="true"
          DETERMINISTIC_SEED=int(os.environ.get("DETERMINISTIC_SEED","0"))
          DIGEST_WEIGHT=float(os.environ.get("DIGEST_WEIGHT","1024.0"))
          PREFIX_WEIGHT=float(os.environ.get("PREFIX_WEIGHT","4.0"))
          BEAM_WIDTH=int(os.environ.get("BEAM_WIDTH","1024"))
          EXPANSION_BATCH=int(os.environ.get("EXPANSION_BATCH","4"))
          CHILDREN_PER_PARENT=int(os.environ.get("CHILDREN_PER_PARENT","48"))
          BIT_PROBE_BUDGET=int(os.environ.get("BIT_PROBE_BUDGET","96"))
          PAIR_PROBE_BUDGET=int(os.environ.get("PAIR_PROBE_BUDGET","16"))
          DIGEST_SLACK=int(os.environ.get("DIGEST_SLACK","6"))
          MAX_DIGEST_SLACK=int(os.environ.get("MAX_DIGEST_SLACK","48"))
          STAGNATION_WINDOW=int(os.environ.get("STAGNATION_WINDOW","10"))
          DIVERSITY_PER_BUCKET=int(os.environ.get("DIVERSITY_PER_BUCKET","8"))
          DEDUP_CAPACITY=int(os.environ.get("DEDUP_CAPACITY","150000"))
          CHECKPOINT_INTERVAL=int(os.environ.get("CHECKPOINT_INTERVAL","5"))
          MODEL_REVISION=os.environ.get("MODEL_REVISION","2026-07-15-user-model-direct-r2-bounded-target")

          if POSTERIOR_MODELS<0 or SIGMA<=0 or N_EXPONENT<=0:
              raise ValueError("invalid posterior/sigma/exponent configuration")
          for name,value in {
              "BEAM_WIDTH":BEAM_WIDTH,
              "EXPANSION_BATCH":EXPANSION_BATCH,
              "CHILDREN_PER_PARENT":CHILDREN_PER_PARENT,
              "BIT_PROBE_BUDGET":BIT_PROBE_BUDGET,
              "PAIR_PROBE_BUDGET":PAIR_PROBE_BUDGET,
              "DIVERSITY_PER_BUCKET":DIVERSITY_PER_BUCKET,
              "DEDUP_CAPACITY":DEDUP_CAPACITY,
              "CHECKPOINT_INTERVAL":CHECKPOINT_INTERVAL
          }.items():
              if value<=0:
                  raise ValueError(f"{name} must be positive")
          if DIGEST_SLACK<0 or MAX_DIGEST_SLACK<DIGEST_SLACK:
              raise ValueError("invalid digest slack")

          REPORT=Path("bitcoin_sha256d_4d_inverse_report.txt")
          STATUS=Path("bitcoin_sha256d_4d_inverse_status.json")
          MODEL_SPEC=Path("bitcoin_sha256d_mathematical_model.txt")
          HEADER_RECOVERY=Path("bitcoin_sha256d_header_recovery.csv")
          ROUND_STATES=Path("bitcoin_sha256d_round_states.csv")
          TESSERACT_SLOTS=Path("bitcoin_sha256d_tesseract_slots.csv")
          LATTICE_BITS=Path("bitcoin_sha256d_lattice_bits.csv")
          PROJECTIONS=Path("bitcoin_sha256d_3d_projections.csv")
          SEARCH_TRACE=Path("bitcoin_sha256d_4d_search_trace.csv")
          FRONTIER=Path("bitcoin_sha256d_4d_frontier.csv")
          POSTERIOR=Path("bitcoin_sha256d_posterior_models.csv")
          TOLERANCE=Path("bitcoin_sha256d_tolerance_topology.csv")
          FUNCTIONALS=Path("bitcoin_sha256d_functional_identifiability.csv")
          MEASURE_AUDIT=Path("bitcoin_sha256d_measure_audit.csv")
          FREQUENCY_SPLIT=Path("bitcoin_sha256d_frequency_split.csv")
          GAUGE_DIAGNOSTICS=Path("bitcoin_sha256d_gauge_diagnostics.csv")
          STABILITY=Path("bitcoin_sha256d_stability.csv")
          STATE_SPACE=Path("bitcoin_sha256d_tesseract_state_space.json")
          CHECKPOINT=Path("bitcoin_sha256d_4d_checkpoint.json")

          FIELD_RANGES_BYTES={
              "version":(0,4),
              "previous_hash":(4,36),
              "merkle_root":(36,68),
              "timestamp":(68,72),
              "bits":(72,76),
              "nonce":(76,80)
          }
          H0=[
              0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
              0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19
          ]
          K=[
              0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,
              0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
              0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
              0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
              0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,
              0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
              0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,
              0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
              0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,
              0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
              0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,
              0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
              0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,
              0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
              0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
              0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
          ]
          INTERIOR_COORDS=sorted(product((1,2),repeat=4))

          def emit(text=""):
              print(text,flush=True)

          def sentinel(value,names):
              value=value.strip()
              return "" if value.lower() in names else value

          BLOCK_HEIGHT=sentinel(BLOCK_HEIGHT_RAW,{"","tip","current","current_tip"})
          BLOCK_HASH=sentinel(BLOCK_HASH_RAW,{"","auto","derive","from_height"})
          RAW_HEADER_HEX=sentinel(RAW_HEADER_RAW,{"","fetch","auto","from_api"}).lower()
          EXPECTED_BLOCK_HASH=sentinel(EXPECTED_HASH_RAW,{"","derive","auto","from_block"}).lower()
          HIDDEN_BIT_RANGES=sentinel(HIDDEN_BIT_RANGES_RAW,{"","none","auto","use_hidden_fields"})

          def http_text(path):
              req=urllib.request.Request(
                  f"{API_BASE}/{path.lstrip('/')}",
                  headers={"User-Agent":"bitcoin-sha256d-4d-direct-model/2.0"}
              )
              with urllib.request.urlopen(req,timeout=60) as response:
                  return response.read().decode().strip()

          def http_json(path):
              return json.loads(http_text(path))

          def rotr(x,n):
              return ((x>>n)|(x<<(32-n)))&MASK32

          def s0(x):
              return rotr(x,7)^rotr(x,18)^(x>>3)

          def s1(x):
              return rotr(x,17)^rotr(x,19)^(x>>10)

          def S0(x):
              return rotr(x,2)^rotr(x,13)^rotr(x,22)

          def S1(x):
              return rotr(x,6)^rotr(x,11)^rotr(x,25)

          def Ch(x,y,z):
              return (x&y)^((~x)&z)

          def Maj(x,y,z):
              return (x&y)^(x&z)^(y&z)

          def words_from_bytes(data):
              return [
                  int.from_bytes(data[i:i+4],"big")
                  for i in range(0,len(data),4)
              ]

          def words_to_bytes(words):
              return b"".join(
                  (word&MASK32).to_bytes(4,"big")
                  for word in words
              )

          def expand_schedule(block):
              words=words_from_bytes(block)
              for t in range(16,64):
                  words.append(
                      (
                          s1(words[t-2])
                          +words[t-7]
                          +s0(words[t-15])
                          +words[t-16]
                      )&MASK32
                  )
              return words

          @dataclass(frozen=True)
          class RoundState:
              phase:int
              round_index:int
              w:int
              state_in:Tuple[int,...]
              state_out:Tuple[int,...]

          @dataclass(frozen=True)
          class CompressionTrace:
              phase:int
              initial:Tuple[int,...]
              schedule:Tuple[int,...]
              rounds:Tuple[RoundState,...]
              output:Tuple[int,...]

          @dataclass(frozen=True)
          class Compatibility:
              required_words:Tuple[Tuple[int,...],...]
              backward_states:Tuple[Tuple[Tuple[int,...],...],...]
              state_hamming:int
              schedule_hamming:int
              E_local:float
              pullback_header:bytes
              residual_signature:int

          @dataclass(frozen=True)
          class ProjectionState:
              mask:Tuple[int,...]
              permutation:Tuple[int,...]
              orientations:Tuple[int,...]
              p:Tuple[int,int,int,int]
              observation_hamming:int
              hard_constraints_ok:bool

          @dataclass(frozen=True)
          class Evaluation:
              header:bytes
              digest_raw:bytes
              displayed_hash:str
              traces:Tuple[CompressionTrace,...]
              compatibility:Compatibility
              projection:ProjectionState
              digest_hamming:int
              prefix_match:int
              E_digest:float
              E_observation:float
              E_local:float
              E_global:float
              C_missing:int
              total_energy:float
              transformed_energy:float
              exact_hash_match:bool

          @dataclass(frozen=True)
          class Record:
              header:bytes
              displayed_hash:str
              digest_hamming:int
              prefix_match:int
              E_digest:float
              E_observation:float
              E_local:float
              E_global:float
              C_missing:int
              total_energy:float
              residual_signature:int
              source:str
              serial:int

          def compress(initial,block,phase):
              schedule=expand_schedule(block)
              a,b,c,d,e,f,g,h=[x&MASK32 for x in initial]
              rounds=[]

              for t in range(64):
                  state_in=(a,b,c,d,e,f,g,h)
                  t1=(
                      h+S1(e)+Ch(e,f,g)+K[t]+schedule[t]
                  )&MASK32
                  t2=(S0(a)+Maj(a,b,c))&MASK32
                  state_out=(
                      (t1+t2)&MASK32,
                      a,b,c,
                      (d+t1)&MASK32,
                      e,f,g
                  )
                  rounds.append(
                      RoundState(
                          phase,t,schedule[t],state_in,state_out
                      )
                  )
                  a,b,c,d,e,f,g,h=state_out

              output=tuple(
                  (initial[i]+value)&MASK32
                  for i,value in enumerate((a,b,c,d,e,f,g,h))
              )
              return CompressionTrace(
                  phase,
                  tuple(initial),
                  tuple(schedule),
                  tuple(rounds),
                  output
              )

          def sha256d_trace(header):
              if len(header)!=80:
                  raise ValueError("header must be 80 bytes")

              trace0=compress(H0,header[:64],0)
              block1=(
                  header[64:]
                  +b"\x80"
                  +b"\x00"*39
                  +(640).to_bytes(8,"big")
              )
              trace1=compress(trace0.output,block1,1)
              inner=words_to_bytes(trace1.output)
              block2=(
                  inner
                  +b"\x80"
                  +b"\x00"*23
                  +(256).to_bytes(8,"big")
              )
              trace2=compress(H0,block2,2)
              return words_to_bytes(trace2.output),(trace0,trace1,trace2)

          def displayed(raw):
              return raw[::-1].hex()

          def independent_hash(header):
              return hashlib.sha256(
                  hashlib.sha256(header).digest()
              ).digest()[::-1].hex()

          def hamming_word(left,right):
              return ((left^right)&MASK32).bit_count()

          def hamming_bytes(left,right):
              return sum(
                  (a^b).bit_count()
                  for a,b in zip(left,right)
              )

          def hamming_state(left,right):
              return sum(
                  hamming_word(a,b)
                  for a,b in zip(left,right)
              )

          def prefix_bits(left,right):
              matched=0
              for a,b in zip(left,right):
                  difference=a^b
                  if difference==0:
                      matched+=8
                      continue
                  matched+=8-difference.bit_length()
                  break
              return matched

          def inverse_round(state_out,word,round_index):
              ap,bp,cp,dp,ep,fp,gp,hp=[
                  value&MASK32 for value in state_out
              ]
              a,b,c=bp,cp,dp
              e,f,g=fp,gp,hp
              t2=(S0(a)+Maj(a,b,c))&MASK32
              t1=(ap-t2)&MASK32
              d=(ep-t1)&MASK32
              h=(
                  t1
                  -S1(e)
                  -Ch(e,f,g)
                  -K[round_index]
                  -word
              )&MASK32
              return a,b,c,d,e,f,g,h

          def backward_states(trace,desired_output):
              states=[None]*65
              states[64]=tuple(
                  (
                      desired_output[i]
                      -trace.initial[i]
                  )&MASK32
                  for i in range(8)
              )
              for t in reversed(range(64)):
                  states[t]=inverse_round(
                      states[t+1],
                      trace.schedule[t],
                      t
                  )
              return tuple(states)

          def required_word(forward_state,desired_out,round_index):
              a,b,c,d,e,f,g,h=[
                  value&MASK32 for value in forward_state
              ]
              t2=(S0(a)+Maj(a,b,c))&MASK32
              required_t1=(desired_out[0]-t2)&MASK32
              return (
                  required_t1
                  -h
                  -S1(e)
                  -Ch(e,f,g)
                  -K[round_index]
              )&MASK32

          def chunks40(header):
              return [
                  int.from_bytes(
                      header[i*5:(i+1)*5],
                      "big"
                  )
                  for i in range(16)
              ]

          def from_chunks(chunks):
              return b"".join(
                  (value&MASK40).to_bytes(5,"big")
                  for value in chunks
              )

          def residual_signature(current,pullback):
              profile=bytes(
                  min(255,(a^b).bit_count())
                  for a,b in zip(
                      chunks40(current),
                      chunks40(pullback)
                  )
              )
              return int.from_bytes(
                  hashlib.blake2b(
                      profile,
                      digest_size=8
                  ).digest(),
                  "big"
              )

          def compatibility(header,traces,target_raw):
              trace0,trace1,trace2=traces
              target_words=words_from_bytes(target_raw)

              backward2=backward_states(trace2,target_words)
              required2=tuple(
                  required_word(
                      trace2.rounds[t].state_in,
                      backward2[t+1],
                      t
                  )
                  for t in range(64)
              )

              backward1=backward_states(trace1,required2[:8])
              required1=tuple(
                  required_word(
                      trace1.rounds[t].state_in,
                      backward1[t+1],
                      t
                  )
                  for t in range(64)
              )

              backward0=backward_states(trace0,backward1[0])
              required0=tuple(
                  required_word(
                      trace0.rounds[t].state_in,
                      backward0[t+1],
                      t
                  )
                  for t in range(64)
              )

              state_hamming=0
              schedule_hamming=0
              local_energy=0.0

              for trace,backward,required in zip(
                  traces,
                  (backward0,backward1,backward2),
                  (required0,required1,required2)
              ):
                  boundaries=[
                      trace.rounds[0].state_in
                  ]+[
                      row.state_out
                      for row in trace.rounds
                  ]

                  for forward_state,backward_state in zip(
                      boundaries,
                      backward
                  ):
                      distance=hamming_state(
                          forward_state,
                          backward_state
                      )
                      state_hamming+=distance
                      local_energy+=distance/256.0

                  for actual,wanted in zip(
                      trace.schedule,
                      required
                  ):
                      distance=hamming_word(actual,wanted)
                      schedule_hamming+=distance
                      local_energy+=distance/32.0

              pullback=(
                  words_to_bytes(required0[:16])
                  +words_to_bytes(required1[:4])
              )

              return Compatibility(
                  (required0,required1,required2),
                  (backward0,backward1,backward2),
                  state_hamming,
                  schedule_hamming,
                  local_energy,
                  pullback,
                  residual_signature(header,pullback)
              )

          def parse_hidden_bits():
              if RECOVERY_SCOPE=="full_header":
                  return set(range(640))

              hidden=set()

              if RECOVERY_SCOPE=="selected_fields":
                  for field in HIDDEN_FIELDS:
                      if field not in FIELD_RANGES_BYTES:
                          raise ValueError(
                              f"unknown hidden field: {field}"
                          )
                      start,end=FIELD_RANGES_BYTES[field]
                      hidden.update(range(start*8,end*8))

              if RECOVERY_SCOPE=="selected_bits" or HIDDEN_BIT_RANGES:
                  for token in HIDDEN_BIT_RANGES.split(","):
                      token=token.strip()
                      if not token:
                          continue

                      if ":" in token:
                          start,end=map(
                              int,
                              token.split(":",1)
                          )
                          if not 0<=start<=end<=640:
                              raise ValueError(
                                  f"invalid range: {token}"
                              )
                          hidden.update(range(start,end))
                      else:
                          bit=int(token)
                          if not 0<=bit<640:
                              raise ValueError(
                                  f"invalid bit: {token}"
                              )
                          hidden.add(bit)

              return hidden

          def get_bit(data,bit):
              byte_index,offset=divmod(bit,8)
              return (
                  data[byte_index]>>(7-offset)
              )&1

          def put_bit(data,bit,value):
              byte_index,offset=divmod(bit,8)
              mask=1<<(7-offset)
              if value:
                  data[byte_index]|=mask
              else:
                  data[byte_index]&=~mask

          def clamp(candidate,observation,hidden):
              result=bytearray(candidate)
              for bit in range(640):
                  if bit not in hidden:
                      put_bit(
                          result,
                          bit,
                          get_bit(observation,bit)
                      )
              return bytes(result)

          def rotate40(value,orientation):
              shift=(0,13,27)[orientation%3]
              if shift==0:
                  return value&MASK40
              return (
                  (value<<shift)
                  |(value>>(40-shift))
              )&MASK40

          def permutation_parity(permutation):
              parity=0
              for i in range(len(permutation)):
                  for j in range(i+1,len(permutation)):
                      parity^=int(
                          permutation[i]>permutation[j]
                      )
              return parity

          def project_header(header,permutation,orientations):
              canonical=chunks40(header)
              return from_chunks([
                  rotate40(
                      canonical[permutation[i]],
                      orientations[i]
                  )
                  for i in range(16)
              ])

          def piece_cost(
              canonical,
              observed,
              mask,
              slot,
              source,
              orientation
          ):
              value=rotate40(
                  canonical[source],
                  orientation
              )
              cost=0

              for local in range(40):
                  bit=slot*40+local
                  if mask[bit]:
                      actual=(
                          value>>(39-local)
                      )&1
                      expected=(
                          observed[slot]>>(39-local)
                      )&1
                      cost+=int(actual!=expected)

              return cost

          def solve_projection(header,observation,initial_mask):
              canonical=chunks40(header)
              observed=chunks40(observation)

              if not INFER_PERMUTATION and not INFER_ORIENTATION:
                  permutation=tuple(range(16))
                  orientations=(0,)*16
              else:
                  states={(0,0):(0,tuple())}

                  for slot in range(16):
                      next_states={}

                      for (
                          used,
                          residue
                      ),(
                          cost,
                          assignment
                      ) in states.items():

                          sources=(
                              range(16)
                              if INFER_PERMUTATION
                              else (slot,)
                          )

                          for source in sources:
                              if (used>>source)&1:
                                  continue

                              orientation_values=(
                                  range(3)
                                  if INFER_ORIENTATION
                                  else (0,)
                              )

                              for orientation in orientation_values:
                                  key=(
                                      used|(1<<source),
                                      (
                                          residue+orientation
                                      )%3
                                  )
                                  new_cost=(
                                      cost
                                      +piece_cost(
                                          canonical,
                                          observed,
                                          initial_mask,
                                          slot,
                                          source,
                                          orientation
                                      )
                                  )
                                  candidate=assignment+(
                                      (source,orientation),
                                  )
                                  previous=next_states.get(key)

                                  if (
                                      previous is None
                                      or new_cost<previous[0]
                                      or (
                                          new_cost==previous[0]
                                          and candidate<previous[1]
                                      )
                                  ):
                                      next_states[key]=(
                                          new_cost,
                                          candidate
                                      )

                      states=next_states

                  final=states.get(((1<<16)-1,0))

                  if final is None:
                      raise RuntimeError(
                          "no pi/O assignment satisfies "
                          "orientation closure"
                      )

                  permutation=tuple(
                      source
                      for source,_ in final[1]
                  )
                  orientations=tuple(
                      orientation
                      for _,orientation in final[1]
                  )

              projected=project_header(
                  header,
                  permutation,
                  orientations
              )

              if INFER_MASK:
                  mismatch_cost=1.0/(2.0*SIGMA*SIGMA)
                  mask=tuple(
                      0
                      if (
                          get_bit(projected,bit)
                          !=get_bit(observation,bit)
                          and GAMMA_MISSING<mismatch_cost
                      )
                      else 1
                      for bit in range(640)
                  )
              else:
                  mask=tuple(initial_mask)

              observation_hamming=sum(
                  mask[bit]*int(
                      get_bit(projected,bit)
                      !=get_bit(observation,bit)
                  )
                  for bit in range(640)
              )

              p0=permutation_parity(permutation)
              parity=(p0,p0,0,0)
              legal=(
                  (
                      parity[0]
                      ^parity[1]
                      ^parity[2]
                      ^parity[3]
                  )==0
                  and (
                      parity[0]^parity[1]
                  )==0
                  and sum(orientations)%3==0
              )

              return ProjectionState(
                  mask,
                  permutation,
                  orientations,
                  parity,
                  observation_hamming,
                  legal
              )

          def global_energy(header,metadata):
              if CONTEXT_MODE=="hash_only" or not metadata:
                  return 0.0

              energy=0
              previous=str(
                  metadata.get("previousblockhash","")
              )
              merkle=str(
                  metadata.get("merkle_root","")
              )
              bits=int(metadata.get("bits",0) or 0)
              timestamp=int(
                  metadata.get("timestamp",0) or 0
              )

              if previous:
                  energy+=hamming_bytes(
                      header[4:36],
                      bytes.fromhex(previous)[::-1]
                  )

              if merkle:
                  energy+=hamming_bytes(
                      header[36:68],
                      bytes.fromhex(merkle)[::-1]
                  )

              if bits:
                  energy+=hamming_bytes(
                      header[72:76],
                      bits.to_bytes(4,"little")
                  )

              if timestamp:
                  value=int.from_bytes(
                      header[68:72],
                      "little"
                  )

                  if CONTEXT_MODE=="all_public":
                      energy+=(value^timestamp).bit_count()
                  else:
                      distance=abs(value-timestamp)
                      energy+=(
                          0
                          if distance<=7200
                          else min(
                              32,
                              1+int(
                                  math.log2(
                                      distance-7199
                                  )
                              )
                          )
                      )

              return float(energy)

          def f_transform(value):
              if value<0:
                  return float("nan")
              return (
                  A0*value
                  /(
                      (1+value**N_EXPONENT)
                      **(1/N_EXPONENT)
                  )
              )

          def evaluate(
              header,
              target_raw,
              target_display,
              observation,
              initial_mask,
              metadata
          ):
              digest,traces=sha256d_trace(header)
              local=compatibility(
                  header,
                  traces,
                  target_raw
              )
              projection=solve_projection(
                  header,
                  observation,
                  initial_mask
              )

              if not projection.hard_constraints_ok:
                  raise RuntimeError(
                      "hard parity/orientation constraint failure"
                  )

              digest_hamming=hamming_bytes(
                  digest,
                  target_raw
              )
              prefix_match=prefix_bits(
                  digest,
                  target_raw
              )
              E_digest=(
                  DIGEST_WEIGHT*digest_hamming
                  +PREFIX_WEIGHT*(256-prefix_match)
              )

              header_observation=(
                  projection.observation_hamming
              )

              if (
                  not ALLOW_OBSERVATION_NOISE
                  and header_observation
              ):
                  header_observation=float("inf")

              E_observation=(
                  E_digest+header_observation
              )/(2.0*SIGMA*SIGMA)

              E_global=global_energy(
                  header,
                  metadata
              )
              C_missing=sum(
                  1-value
                  for value in projection.mask
              )

              total_energy=(
                  E_observation
                  +LAMBDA_LOCAL*local.E_local
                  +BETA_GLOBAL*E_global
                  +GAMMA_MISSING*C_missing
              )

              transformed=(
                  f_transform(total_energy/640.0)
                  if math.isfinite(total_energy)
                  else float("nan")
              )

              return Evaluation(
                  header,
                  digest,
                  displayed(digest),
                  traces,
                  local,
                  projection,
                  digest_hamming,
                  prefix_match,
                  E_digest,
                  E_observation,
                  local.E_local,
                  E_global,
                  C_missing,
                  total_energy,
                  transformed,
                  displayed(digest)==target_display
              )

          def to_record(evaluation,source,serial):
              return Record(
                  evaluation.header,
                  evaluation.displayed_hash,
                  evaluation.digest_hamming,
                  evaluation.prefix_match,
                  evaluation.E_digest,
                  evaluation.E_observation,
                  evaluation.E_local,
                  evaluation.E_global,
                  evaluation.C_missing,
                  evaluation.total_energy,
                  evaluation.compatibility.residual_signature,
                  source,
                  serial
              )

          def priority(record):
              return (
                  record.digest_hamming,
                  -record.prefix_match,
                  record.total_energy,
                  record.E_local,
                  record.serial
              )

          def fingerprint(header):
              return int.from_bytes(
                  hashlib.blake2b(
                      header,
                      digest_size=8
                  ).digest(),
                  "big"
              )

          class BoundedSeen:
              def __init__(self,capacity):
                  self.capacity=capacity
                  self.data=OrderedDict()

              def add(self,value):
                  if value in self.data:
                      self.data.move_to_end(value)
                      return False

                  self.data[value]=None

                  if len(self.data)>self.capacity:
                      self.data.popitem(last=False)

                  return True

              def __len__(self):
                  return len(self.data)

          def geometry_sections():
              sections=[
                  (
                      "all_16_interior_cells",
                      tuple(range(16))
                  )
              ]

              sections.extend(
                  (
                      f"interior_cell_{coordinate}",
                      (index,)
                  )
                  for index,coordinate in enumerate(
                      INTERIOR_COORDS
                  )
              )

              for axis in range(4):
                  for value in (1,2):
                      sections.append((
                          f"axis_{axis}_slice_{value}",
                          tuple(
                              index
                              for index,coordinate in enumerate(
                                  INTERIOR_COORDS
                              )
                              if coordinate[axis]==value
                          )
                      ))

              for axis_a,axis_b in combinations(
                  range(4),
                  2
              ):
                  for value_a in (1,2):
                      for value_b in (1,2):
                          sections.append((
                              (
                                  f"face_axes_{axis_a}_{axis_b}_"
                                  f"{value_a}_{value_b}"
                              ),
                              tuple(
                                  index
                                  for index,coordinate in enumerate(
                                      INTERIOR_COORDS
                                  )
                                  if (
                                      coordinate[axis_a]==value_a
                                      and coordinate[axis_b]==value_b
                                  )
                              )
                          ))

              for left in range(16):
                  for right in range(left+1,16):
                      distance=sum(
                          a!=b
                          for a,b in zip(
                              INTERIOR_COORDS[left],
                              INTERIOR_COORDS[right]
                          )
                      )
                      if distance==1:
                          sections.append((
                              (
                                  f"adjacency_edge_"
                                  f"{left}_{right}"
                              ),
                              (left,right)
                          ))

              return tuple(sections)

          GEOMETRY_SECTIONS=geometry_sections()

          def apply_pullback_bits(
              current,
              pullback,
              bits,
              observation,
              hidden
          ):
              result=bytearray(current)

              for bit in bits:
                  if bit in hidden:
                      put_bit(
                          result,
                          bit,
                          get_bit(pullback,bit)
                      )

              return clamp(
                  bytes(result),
                  observation,
                  hidden
              )

          def ordered_bits(evaluation,hidden,cycle):
              pullback=evaluation.compatibility.pullback_header

              different=[
                  bit
                  for bit in hidden
                  if (
                      get_bit(evaluation.header,bit)
                      !=get_bit(pullback,bit)
                  )
              ]

              weights=[
                  (a^b).bit_count()
                  for a,b in zip(
                      chunks40(evaluation.header),
                      chunks40(pullback)
                  )
              ]

              different.sort(
                  key=lambda bit:(
                      -weights[bit//40],
                      (
                          bit
                          +DETERMINISTIC_SEED
                          +cycle*97
                      )%640
                  )
              )

              if len(different)<=BIT_PROBE_BUDGET:
                  return different

              offset=(
                  cycle*BIT_PROBE_BUDGET
              )%len(different)

              return (
                  different[offset:]
                  +different[:offset]
              )[:BIT_PROBE_BUDGET]

          def candidate_headers(
              evaluation,
              observation,
              hidden,
              cycle
          ):
              pullback=clamp(
                  evaluation.compatibility.pullback_header,
                  observation,
                  hidden
              )
              current_chunks=chunks40(
                  evaluation.header
              )
              pullback_chunks=chunks40(pullback)
              proposals={}

              for name,selected in GEOMETRY_SECTIONS:
                  candidate_chunks=list(current_chunks)
                  changed=False

                  for index in selected:
                      if (
                          candidate_chunks[index]
                          !=pullback_chunks[index]
                      ):
                          candidate_chunks[index]=(
                              pullback_chunks[index]
                          )
                          changed=True

                  if changed:
                      candidate=clamp(
                          from_chunks(candidate_chunks),
                          observation,
                          hidden
                      )
                      if candidate!=evaluation.header:
                          proposals.setdefault(
                              candidate,
                              name
                          )

              for bit in ordered_bits(
                  evaluation,
                  hidden,
                  cycle
              ):
                  candidate=apply_pullback_bits(
                      evaluation.header,
                      pullback,
                      (bit,),
                      observation,
                      hidden
                  )

                  if candidate!=evaluation.header:
                      proposals.setdefault(
                          candidate,
                          f"local_edge_bit_{bit}"
                      )

                  flipped=bytearray(evaluation.header)
                  put_bit(
                      flipped,
                      bit,
                      1-get_bit(flipped,bit)
                  )
                  flipped=clamp(
                      bytes(flipped),
                      observation,
                      hidden
                  )

                  if flipped!=evaluation.header:
                      proposals.setdefault(
                          flipped,
                          f"sensitivity_flip_bit_{bit}"
                      )

              if (
                  not proposals
                  and not evaluation.exact_hash_match
              ):
                  for bit in sorted(hidden)[
                      :BIT_PROBE_BUDGET
                  ]:
                      candidate=bytearray(
                          evaluation.header
                      )
                      put_bit(
                          candidate,
                          bit,
                          1-get_bit(candidate,bit)
                      )
                      candidate=clamp(
                          bytes(candidate),
                          observation,
                          hidden
                      )
                      proposals.setdefault(
                          candidate,
                          (
                              "stationary_sensitivity_"
                              f"bit_{bit}"
                          )
                      )

              return [
                  (name,candidate)
                  for candidate,name in proposals.items()
              ]

          def diverse_select(
              records,
              limit,
              per_bucket=4
          ):
              counts=defaultdict(int)
              retained=[]

              for record in sorted(
                  records,
                  key=priority
              ):
                  bucket=(
                      record.digest_hamming,
                      record.prefix_match//4,
                      record.residual_signature&0xffff
                  )

                  if counts[bucket]>=per_bucket:
                      continue

                  counts[bucket]+=1
                  retained.append(record)

                  if len(retained)>=limit:
                      break

              return retained

          def evaluate_children(
              parent,
              target_raw,
              target_display,
              observation,
              hidden,
              initial_mask,
              metadata,
              cycle,
              serial
          ):
              records=[]

              for source,header in candidate_headers(
                  parent,
                  observation,
                  hidden,
                  cycle
              ):
                  serial+=1
                  child=evaluate(
                      header,
                      target_raw,
                      target_display,
                      observation,
                      initial_mask,
                      metadata
                  )
                  records.append(
                      to_record(
                          child,
                          source,
                          serial
                      )
                  )

              singles=sorted(
                  records,
                  key=priority
              )[
                  :max(
                      CHILDREN_PER_PARENT,
                      PAIR_PROBE_BUDGET
                  )
              ]

              bit_records=[
                  record
                  for record in singles
                  if record.source.startswith(
                      "local_edge_bit_"
                  )
              ][:PAIR_PROBE_BUDGET]

              pullback=clamp(
                  parent.compatibility.pullback_header,
                  observation,
                  hidden
              )
              paired=0
              pair_seen=set()

              for left,right in combinations(
                  bit_records,
                  2
              ):
                  bits=(
                      int(left.source.rsplit("_",1)[1]),
                      int(right.source.rsplit("_",1)[1])
                  )

                  header=apply_pullback_bits(
                      parent.header,
                      pullback,
                      bits,
                      observation,
                      hidden
                  )

                  if (
                      header==parent.header
                      or header in pair_seen
                  ):
                      continue

                  pair_seen.add(header)
                  serial+=1
                  child=evaluate(
                      header,
                      target_raw,
                      target_display,
                      observation,
                      initial_mask,
                      metadata
                  )

                  records.append(
                      to_record(
                          child,
                          (
                              "paired_local_edges_"
                              f"{bits[0]}_{bits[1]}"
                          ),
                          serial
                      )
                  )

                  paired+=1
                  if paired>=PAIR_PROBE_BUDGET:
                      break

              return (
                  diverse_select(
                      records,
                      CHILDREN_PER_PARENT,
                      2
                  ),
                  serial
              )

          def adaptive_slack(stagnation):
              steps=(
                  stagnation//STAGNATION_WINDOW
                  if STAGNATION_WINDOW>0
                  else 0
              )
              return min(
                  MAX_DIGEST_SLACK,
                  DIGEST_SLACK+steps
              )

          def prune(records,best_digest,slack):
              eligible=sorted(
                  (
                      record
                      for record in records
                      if (
                          record.digest_hamming
                          <=best_digest+slack
                      )
                  ),
                  key=priority
              )

              counts=defaultdict(int)
              diverse=[]

              for record in eligible:
                  bucket=(
                      record.digest_hamming,
                      record.prefix_match//8,
                      record.residual_signature&0xffff
                  )

                  if (
                      counts[bucket]
                      >=DIVERSITY_PER_BUCKET
                  ):
                      continue

                  counts[bucket]+=1
                  diverse.append(record)

                  if len(diverse)>=BEAM_WIDTH*3:
                      break

              return diverse_select(
                  diverse,
                  BEAM_WIDTH,
                  DIVERSITY_PER_BUCKET
              )

          def canonical_initial(
              target_raw,
              target_display,
              observation,
              hidden,
              initial_mask,
              metadata
          ):
              zero=clamp(
                  bytes(80),
                  observation,
                  hidden
              )
              first=evaluate(
                  zero,
                  target_raw,
                  target_display,
                  observation,
                  initial_mask,
                  metadata
              )
              return clamp(
                  first.compatibility.pullback_header,
                  observation,
                  hidden
              )

          def requested(count):
              return (
                  POSTERIOR_MODELS>0
                  and count>=POSTERIOR_MODELS
              )

          def append_csv(path,row):
              exists=path.exists()
              with path.open(
                  "a",
                  newline="",
                  encoding="utf-8"
              ) as handle:
                  writer=csv.DictWriter(
                      handle,
                      fieldnames=list(row)
                  )
                  if not exists:
                      writer.writeheader()
                  writer.writerow(row)

          def write_csv(path,rows):
              if not rows:
                  return

              with path.open(
                  "w",
                  newline="",
                  encoding="utf-8"
              ) as handle:
                  writer=csv.DictWriter(
                      handle,
                      fieldnames=list(rows[0])
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def slot_rows():
              all_coordinates=list(
                  product(range(4),repeat=4)
              )
              interior=set(INTERIOR_COORDS)
              surface=sorted(
                  coordinate
                  for coordinate in all_coordinates
                  if coordinate not in interior
              )
              rows=[]

              for index,coordinate in enumerate(
                  INTERIOR_COORDS
              ):
                  rows.append({
                      "a":coordinate[0],
                      "b":coordinate[1],
                      "c":coordinate[2],
                      "d":coordinate[3],
                      "region":"interior_header",
                      "slot_index":index,
                      "semantic":(
                          f"header_chunk_{index:02d}_"
                          f"bits_{40*index}:"
                          f"{40*(index+1)}"
                      )
                  })

              for index,coordinate in enumerate(surface):
                  if index<192:
                      phase,round_index=divmod(index,64)
                      region="surface_sha_round"
                      semantic=(
                          f"phase_{phase}_"
                          f"round_{round_index}"
                      )
                  elif index<208:
                      region="surface_observation"
                      semantic=(
                          "mask_pi_orientation_"
                          f"{index-192}"
                      )
                  elif index<216:
                      region="surface_digest"
                      semantic=f"digest_word_{index-208}"
                  elif index<224:
                      region="surface_bitcoin_prior"
                      semantic=(
                          f"bitcoin_prior_{index-216}"
                      )
                  else:
                      region=(
                          "surface_posterior_"
                          "gauge_projection"
                      )
                      semantic=(
                          "posterior_gauge_projection_"
                          f"{index-224}"
                      )

                  rows.append({
                      "a":coordinate[0],
                      "b":coordinate[1],
                      "c":coordinate[2],
                      "d":coordinate[3],
                      "region":region,
                      "slot_index":index,
                      "semantic":semantic
                  })

              return rows

          def log_state_space():
              value=(
                  math.lgamma(17)/math.log(2)
                  +2*math.lgamma(65)/math.log(2)
                  +math.lgamma(97)/math.log(2)
                  +45
                  +15*math.log2(3)
                  -math.log2(1536)
                  -8*math.lgamma(9)/math.log(2)
              )
              return value,value*math.log10(2)

          def write_model_spec():
              MODEL_SPEC.write_text(
                  """BITCOIN SHA-256d 4D JOINT-INFERENCE MODEL
          =================================================
          x=H_{m,pi}(y)+xi; H_{m,pi}=D_m o P_pi
          E_local(y)=sum_(i,j in A)d(e_i^right,e_j^left)
          E_global(y)=-log p_prior(y); C(m)=sum_j(1-m_j)
          MAP=||x-H_{m,pi}(y)||^2/(2 sigma^2)
              +lambda E_local+beta E_global+gamma C(m)

          The target digest is part of x. Digest Hamming disagreement and
          unmatched leading target bits contribute directly to E_observation.
          Each SHA state-edge distance is Hamming/256 and each schedule-edge
          distance is Hamming/32.

          The 4x4x4x4 interior supplies complete, cell, slice, face,
          adjacency-edge, single-bit, and paired-bit projections of the exact
          forward/backward pullback. These are residual projections, not
          physical Rubik moves.

          The frontier is a bounded beam of lightweight 80-byte headers and
          scalar scores. Full 192-round traces are transient. Digest slack,
          residual-basin quotas, and a bounded fingerprint cache prevent
          unbounded memory growth. Round-robin selection prevents repeatedly
          expanding only the same elite records. No cycle limit or internal
          solver timeout is imposed.

          Hard constraints:
          p0 XOR p1 XOR p2 XOR p3=0
          p0 XOR p1=0
          product_i O_i=Identity

          State volume:
          (16!*(64!)^2*96!*2^45*3^15)/(1536*(8!)^8)

          Continuous extension:
          x=H_{m,pi}(T_{g,phi}y)+xi

          Completion requires independent SHA256d(header)=target validation.
          """,
                  encoding="utf-8"
              )

          def write_checkpoint(
              cycle,
              beam,
              best,
              best_digest,
              best_prefix,
              stagnation,
              exact_models,
              seen,
              started,
              terminated=None
          ):
              CHECKPOINT.write_text(
                  json.dumps({
                      "model_revision":MODEL_REVISION,
                      "cycle":cycle,
                      "beam_size":len(beam),
                      "beam_width":BEAM_WIDTH,
                      "best_header_hex":best.header.hex(),
                      "best_displayed_hash":best.displayed_hash,
                      "best_digest_hamming":best_digest,
                      "best_prefix_match":best_prefix,
                      "best_E_local":best.E_local,
                      "best_total_energy":best.total_energy,
                      "stagnation_cycles":stagnation,
                      "digest_slack":adaptive_slack(
                          stagnation
                      ),
                      "dedup_fingerprints":len(seen),
                      "exact_models":[
                          model.header.hex()
                          for model in exact_models
                      ],
                      "elapsed_seconds":time.time()-started,
                      "terminated_by_signal":terminated
                  },indent=2,sort_keys=True),
                  encoding="utf-8"
              )

          def write_frontier(beam,best_digest,slack):
              rows=[]

              for rank,record in enumerate(
                  sorted(beam,key=priority)
              ):
                  rows.append({
                      "rank":rank,
                      "source":record.source,
                      "digest_hamming":record.digest_hamming,
                      "prefix_match":record.prefix_match,
                      "best_digest_hamming":best_digest,
                      "digest_slack":slack,
                      "E_digest":record.E_digest,
                      "E_observation":record.E_observation,
                      "E_local":record.E_local,
                      "E_global":record.E_global,
                      "C_missing":record.C_missing,
                      "total_energy":record.total_energy,
                      "residual_signature":(
                          f"{record.residual_signature:016x}"
                      ),
                      "header_hex":record.header.hex(),
                      "displayed_hash":record.displayed_hash
                  })

              write_csv(FRONTIER,rows)

          def write_final_exports(
              evaluation,
              truth,
              observation,
              hidden
          ):
              round_rows=[]
              lattice_rows=[]
              projection_acc=defaultdict(float)
              lane_pairs=((0,4),(1,5),(2,6),(3,7))

              for trace,required,backward in zip(
                  evaluation.traces,
                  evaluation.compatibility.required_words,
                  evaluation.compatibility.backward_states
              ):
                  for row in trace.rounds:
                      round_index=row.round_index
                      a_coordinate,remainder=divmod(
                          round_index,
                          16
                      )
                      b_coordinate,c_coordinate=divmod(
                          remainder,
                          4
                      )

                      round_rows.append({
                          "phase":trace.phase,
                          "round":round_index,
                          "w_actual":f"{row.w:08x}",
                          "w_required":(
                              f"{required[round_index]:08x}"
                          ),
                          "schedule_edge_hamming":
                          hamming_word(
                              row.w,
                              required[round_index]
                          ),
                          "state_edge_hamming":
                          hamming_state(
                              row.state_in,
                              backward[round_index]
                          ),
                          "a_in":f"{row.state_in[0]:08x}",
                          "b_in":f"{row.state_in[1]:08x}",
                          "c_in":f"{row.state_in[2]:08x}",
                          "d_in":f"{row.state_in[3]:08x}",
                          "e_in":f"{row.state_in[4]:08x}",
                          "f_in":f"{row.state_in[5]:08x}",
                          "g_in":f"{row.state_in[6]:08x}",
                          "h_in":f"{row.state_in[7]:08x}"
                      })

                      for d_coordinate,pair in enumerate(
                          lane_pairs
                      ):
                          values=(
                              row.state_in[pair[0]],
                              row.state_in[pair[1]]
                          )
                          projection_acc[(
                              a_coordinate,
                              b_coordinate,
                              c_coordinate,
                              d_coordinate
                          )]+=sum(
                              value.bit_count()
                              for value in values
                          )/192.0

                          if EMIT_LATTICE_BITS:
                              for lane in pair:
                                  lane_value=row.state_in[lane]

                                  for bit in range(32):
                                      lattice_rows.append({
                                          "phase":trace.phase,
                                          "a":a_coordinate,
                                          "b":b_coordinate,
                                          "c":c_coordinate,
                                          "d":d_coordinate,
                                          "round":round_index,
                                          "state_lane":
                                          "abcdefgh"[lane],
                                          "bit":bit,
                                          "value":(
                                              lane_value
                                              >>(31-bit)
                                          )&1
                                      })

              write_csv(ROUND_STATES,round_rows)
              write_csv(LATTICE_BITS,lattice_rows)

              projection_rows=[]

              for omitted_axis in range(4):
                  reduced=defaultdict(float)

                  for coordinate,value in projection_acc.items():
                      reduced[tuple(
                          coordinate[index]
                          for index in range(4)
                          if index!=omitted_axis
                      )]+=value

                  for coordinate,value in sorted(
                      reduced.items()
                  ):
                      projection_rows.append({
                          "omitted_axis":omitted_axis,
                          "u":coordinate[0],
                          "v":coordinate[1],
                          "w":coordinate[2],
                          "projected_feature":value
                      })

              write_csv(PROJECTIONS,projection_rows)

              header_rows=[]

              for byte_index in range(80):
                  field=next(
                      name
                      for name,(start,end)
                      in FIELD_RANGES_BYTES.items()
                      if start<=byte_index<end
                  )
                  was_hidden=any(
                      bit in hidden
                      for bit in range(
                          byte_index*8,
                          byte_index*8+8
                      )
                  )
                  header_rows.append({
                      "byte_index":byte_index,
                      "field":field,
                      "observed_hex":(
                          f"{observation[byte_index]:02x}"
                      ),
                      "recovered_hex":(
                          f"{evaluation.header[byte_index]:02x}"
                      ),
                      "historical_hex":(
                          f"{truth[byte_index]:02x}"
                      ),
                      "was_hidden":was_hidden,
                      "historical_match":(
                          evaluation.header[byte_index]
                          ==truth[byte_index]
                      )
                  })

              write_csv(HEADER_RECOVERY,header_rows)

          def main():
              started=time.time()
              write_model_spec()
              SEARCH_TRACE.unlink(missing_ok=True)

              state={
                  "cycle":0,
                  "beam":[],
                  "best":None,
                  "best_digest":256,
                  "best_prefix":0,
                  "stagnation":0,
                  "exact":[],
                  "seen":None
              }

              def stop(signum,frame):
                  if isinstance(state["best"],Record):
                      write_checkpoint(
                          state["cycle"],
                          state["beam"],
                          state["best"],
                          state["best_digest"],
                          state["best_prefix"],
                          state["stagnation"],
                          state["exact"],
                          state["seen"],
                          started,
                          signum
                      )

                  STATUS.write_text(
                      json.dumps({
                          "completed":False,
                          "fake_completion":False,
                          "model_revision":MODEL_REVISION,
                          "terminated_by_signal":signum,
                          "exit_code":128+signum,
                          "checkpoint_written":
                          CHECKPOINT.exists(),
                          "elapsed_seconds":
                          time.time()-started
                      },indent=2),
                      encoding="utf-8"
                  )
                  raise SystemExit(128+signum)

              signal.signal(signal.SIGTERM,stop)
              signal.signal(signal.SIGINT,stop)

              status={
                  "completed":False,
                  "fake_completion":False,
                  "model_revision":MODEL_REVISION,
                  "z3_used":False,
                  "external_symbolic_solver_used":False,
                  "artificial_scramble":False,
                  "physical_rubik_moves_used":False,
                  "nonce_interval_loop":False,
                  "internal_solver_timeout":None,
                  "iteration_limit":None,
                  "search_depth_limit":None,
                  "beam_width":BEAM_WIDTH,
                  "exact_hash_match":False,
                  "exact_original_header_match":False
              }

              try:
                  metadata={}
                  block_hash=BLOCK_HASH
                  raw_header=RAW_HEADER_HEX

                  if raw_header:
                      if len(raw_header)!=160:
                          raise ValueError(
                              "RAW_HEADER_HEX must be exactly "
                              "160 hex characters"
                          )

                      truth=bytes.fromhex(raw_header)
                      computed=independent_hash(truth)
                      block_hash=(
                          EXPECTED_BLOCK_HASH or computed
                      )

                      if computed!=block_hash:
                          raise ValueError(
                              "raw header does not match "
                              "expected hash"
                          )
                  else:
                      if not block_hash:
                          block_hash=(
                              http_text(
                                  f"/block-height/"
                                  f"{int(BLOCK_HEIGHT)}"
                              )
                              if BLOCK_HEIGHT
                              else http_text(
                                  "/blocks/tip/hash"
                              )
                          )

                      raw_header=http_text(
                          f"/block/{block_hash}/header"
                      ).lower()
                      truth=bytes.fromhex(raw_header)
                      metadata=http_json(
                          f"/block/{block_hash}"
                      )

                      if (
                          len(raw_header)!=160
                          or independent_hash(truth)!=block_hash
                      ):
                          raise RuntimeError(
                              "fetched header validation failed"
                          )

                  target_raw=bytes.fromhex(block_hash)[::-1]
                  hidden=parse_hidden_bits()
                  observation_data=bytearray(truth)

                  for bit in hidden:
                      put_bit(observation_data,bit,0)

                  observation=bytes(observation_data)
                  initial_mask=tuple(
                      0 if bit in hidden else 1
                      for bit in range(640)
                  )

                  initial_header=canonical_initial(
                      target_raw,
                      block_hash,
                      observation,
                      hidden,
                      initial_mask,
                      metadata
                  )
                  initial_evaluation=evaluate(
                      initial_header,
                      target_raw,
                      block_hash,
                      observation,
                      initial_mask,
                      metadata
                  )

                  serial=0
                  initial=to_record(
                      initial_evaluation,
                      "canonical_backward_pullback",
                      serial
                  )
                  beam=[initial]
                  seen=BoundedSeen(DEDUP_CAPACITY)
                  seen.add(fingerprint(initial.header))
                  exact=[]
                  best=initial
                  best_digest=initial.digest_hamming
                  best_prefix=initial.prefix_match
                  stagnation=0
                  cycle=0

                  state.update({
                      "beam":beam,
                      "best":best,
                      "best_digest":best_digest,
                      "best_prefix":best_prefix,
                      "exact":exact,
                      "seen":seen
                  })

                  emit(f"[model] revision={MODEL_REVISION}")
                  emit(f"[bitcoin] block_hash={block_hash}")
                  emit(
                      f"[config] recovery_scope="
                      f"{RECOVERY_SCOPE} "
                      f"context_mode={CONTEXT_MODE}"
                  )
                  emit(
                      f"[config] hidden_bits={len(hidden)} "
                      "z3_used=false"
                  )
                  emit(
                      f"[memory] beam_width={BEAM_WIDTH} "
                      "lightweight_frontier=true "
                      f"dedup_capacity={DEDUP_CAPACITY}"
                  )
                  emit(
                      f"[target] digest_weight="
                      f"{DIGEST_WEIGHT} "
                      f"prefix_weight={PREFIX_WEIGHT}"
                  )
                  emit(
                      f"[initial] best_digest_hamming="
                      f"{best_digest} "
                      f"best_prefix={best_prefix} "
                      f"E_local={best.E_local:.6f} "
                      f"total={best.total_energy:.6f}"
                  )

                  while not requested(len(exact)):
                      cycle+=1
                      slack=adaptive_slack(stagnation)
                      beam=sorted(beam,key=priority)
                      batch=min(
                          EXPANSION_BATCH,
                          len(beam)
                      )
                      start=(
                          (cycle-1)*batch
                      )%len(beam)
                      active=(
                          beam+beam
                      )[start:start+batch]
                      generated=[]

                      for record in active:
                          parent=evaluate(
                              record.header,
                              target_raw,
                              block_hash,
                              observation,
                              initial_mask,
                              metadata
                          )

                          if parent.exact_hash_match:
                              if (
                                  independent_hash(parent.header)
                                  !=block_hash
                              ):
                                  raise RuntimeError(
                                      "independent validation "
                                      "failed"
                                  )

                              solved=to_record(
                                  parent,
                                  record.source,
                                  record.serial
                              )

                              if all(
                                  model.header!=solved.header
                                  for model in exact
                              ):
                                  exact.append(solved)
                                  emit(
                                      f"[complete] exact model "
                                      f"{len(exact)}: "
                                      f"{solved.header.hex()}"
                                  )

                              if requested(len(exact)):
                                  best=solved
                                  break

                          children,serial=evaluate_children(
                              parent,
                              target_raw,
                              block_hash,
                              observation,
                              hidden,
                              initial_mask,
                              metadata,
                              cycle,
                              serial
                          )

                          for child in children:
                              if (
                                  child.digest_hamming
                                  >best_digest+slack
                              ):
                                  continue

                              if seen.add(
                                  fingerprint(child.header)
                              ):
                                  generated.append(child)

                      if requested(len(exact)):
                          break

                      pool=beam+generated

                      if not pool:
                          parent=evaluate(
                              best.header,
                              target_raw,
                              block_hash,
                              observation,
                              initial_mask,
                              metadata
                          )
                          pool,serial=evaluate_children(
                              parent,
                              target_raw,
                              block_hash,
                              observation,
                              hidden,
                              initial_mask,
                              metadata,
                              cycle,
                              serial
                          )

                      beam=prune(
                          pool,
                          best_digest,
                          slack
                      )

                      if not beam:
                          raise RuntimeError(
                              "bounded beam became empty; "
                              "inspect checkpoint"
                          )

                      cycle_best=min(beam,key=priority)
                      improved_digest=(
                          cycle_best.digest_hamming
                          <best_digest
                      )
                      improved_prefix=(
                          cycle_best.digest_hamming
                          ==best_digest
                          and cycle_best.prefix_match
                          >best_prefix
                      )

                      if improved_digest:
                          best_digest=(
                              cycle_best.digest_hamming
                          )
                          best_prefix=cycle_best.prefix_match
                          best=cycle_best
                          stagnation=0
                      elif improved_prefix:
                          best_prefix=cycle_best.prefix_match
                          best=cycle_best
                          stagnation=0
                      else:
                          if (
                              priority(cycle_best)
                              <priority(best)
                          ):
                              best=cycle_best
                          stagnation+=1

                      state.update({
                          "cycle":cycle,
                          "beam":beam,
                          "best":best,
                          "best_digest":best_digest,
                          "best_prefix":best_prefix,
                          "stagnation":stagnation,
                          "exact":exact,
                          "seen":seen
                      })

                      append_csv(
                          SEARCH_TRACE,
                          {
                              "cycle":cycle,
                              "expanded":len(active),
                              "generated":len(generated),
                              "beam_size":len(beam),
                              "best_digest_hamming":
                              best_digest,
                              "best_prefix_match":
                              best_prefix,
                              "active_digest_hamming":
                              cycle_best.digest_hamming,
                              "active_prefix_match":
                              cycle_best.prefix_match,
                              "best_E_local":best.E_local,
                              "active_E_local":
                              cycle_best.E_local,
                              "best_total_energy":
                              best.total_energy,
                              "active_total_energy":
                              cycle_best.total_energy,
                              "digest_slack":slack,
                              "stagnation_cycles":
                              stagnation,
                              "dedup_fingerprints":
                              len(seen),
                              "best_header_hex":
                              best.header.hex(),
                              "best_displayed_hash":
                              best.displayed_hash
                          }
                      )

                      if (
                          cycle==1
                          or cycle%CHECKPOINT_INTERVAL==0
                          or improved_digest
                          or improved_prefix
                      ):
                          emit(
                              f"[cycle {cycle}] "
                              f"beam={len(beam)} "
                              f"generated={len(generated)} "
                              f"active_hamming="
                              f"{cycle_best.digest_hamming} "
                              f"best_hamming={best_digest} "
                              f"best_prefix={best_prefix} "
                              f"slack={slack} "
                              f"stagnation={stagnation}"
                          )

                          write_frontier(
                              beam,
                              best_digest,
                              slack
                          )
                          write_checkpoint(
                              cycle,
                              beam,
                              best,
                              best_digest,
                              best_prefix,
                              stagnation,
                              exact,
                              seen,
                              started
                          )

                  if not exact:
                      raise RuntimeError(
                          "search ended without exact model"
                      )

                  recovered=evaluate(
                      exact[0].header,
                      target_raw,
                      block_hash,
                      observation,
                      initial_mask,
                      metadata
                  )
                  exact_hash=(
                      independent_hash(recovered.header)
                      ==block_hash
                  )
                  historical=(
                      recovered.header==truth
                  )

                  if not exact_hash:
                      raise RuntimeError(
                          "completion failed independent "
                          "validation"
                      )

                  write_final_exports(
                      recovered,
                      truth,
                      observation,
                      hidden
                  )
                  write_csv(
                      TESSERACT_SLOTS,
                      slot_rows()
                  )

                  write_csv(
                      POSTERIOR,
                      [
                          {
                              "candidate":index,
                              "recovered_header_hex":
                              model.header.hex(),
                              "displayed_hash":
                              model.displayed_hash,
                              "exact_hash_match":True,
                              "exact_original_header_match":
                              model.header==truth,
                              "candidate_set_posterior_mass":
                              1.0/len(exact)
                          }
                          for index,model in enumerate(exact)
                      ]
                  )

                  write_csv(
                      FUNCTIONALS,
                      [
                          {
                              "functional":
                              "double_sha256_digest",
                              "exactly_recovered":exact_hash,
                              "confidence_type":
                              "independent hashlib validation"
                          },
                          {
                              "functional":
                              "historical_header_identity",
                              "exactly_recovered":historical,
                              "confidence_type":
                              "post-solve comparison only"
                          }
                      ]
                  )

                  write_csv(
                      MEASURE_AUDIT,
                      [
                          {
                              "component":"orientation",
                              "measure":
                              "finite C3 counting measure",
                              "operational":
                              "sum O_i=0 mod 3"
                          },
                          {
                              "component":"state volume",
                              "measure":
                              "user-supplied finite prior volume",
                              "operational":
                              "used directly; no verification gate"
                          }
                      ]
                  )

                  write_csv(
                      TOLERANCE,
                      [{
                          "delta":0.0,
                          "active_points":1,
                          "connected_components":1,
                          "posterior_mass_in_ball":1.0,
                          "note":"one exact returned model"
                      }]
                  )
                  write_csv(
                      STABILITY,
                      [{
                          "eta":0.0,
                          "mean_quotient_displacement":0.0,
                          "claim":"exact solved state only"
                      }]
                  )
                  write_csv(
                      FREQUENCY_SPLIT,
                      [{
                          "omitted_axis":0,
                          "low_frequency_phi_energy":
                          "not_estimated",
                          "high_frequency_xi_energy":
                          "not_estimated",
                          "note":
                          "continuous extension retained; "
                          "no fabricated spectrum"
                      }]
                  )
                  write_csv(
                      GAUGE_DIAGNOSTICS,
                      [{
                          "gauge_section":"identity",
                          "note":
                          "no continuous deformation "
                          "inferred in this discrete run"
                      }]
                  )

                  log2_states,log10_states=(
                      log_state_space()
                  )

                  STATE_SPACE.write_text(
                      json.dumps({
                          "formula":
                          "(16!*(64!)^2*96!*2^45*3^15)"
                          "/(1536*(8!)^8)",
                          "declared_log2_states":
                          log2_states,
                          "declared_log10_states":
                          log10_states,
                          "formula_verification_gate":
                          False,
                          "interior_header_cells":16,
                          "surface_constraint_cells":240,
                          "total_4d_cells":256,
                          "hard_constraints":[
                              "p0 XOR p1 XOR p2 XOR p3=0",
                              "p0 XOR p1=0",
                              "product_i O_i=Identity"
                          ]
                      },indent=2),
                      encoding="utf-8"
                  )

                  status.update({
                      "completed":True,
                      "exact_hash_match":exact_hash,
                      "exact_original_header_match":
                      historical,
                      "block_hash":block_hash,
                      "hidden_bit_count":len(hidden),
                      "cycles":cycle,
                      "beam_size":len(beam),
                      "best_digest_hamming":0,
                      "best_prefix_match":256,
                      "E_observation":
                      recovered.E_observation,
                      "E_local":recovered.E_local,
                      "E_local_state_hamming":
                      recovered.compatibility.state_hamming,
                      "E_local_schedule_hamming":
                      recovered.compatibility.schedule_hamming,
                      "E_global":recovered.E_global,
                      "C_missing":recovered.C_missing,
                      "energy":recovered.total_energy,
                      "recovered_header_hex":
                      recovered.header.hex(),
                      "recovered_display_hash":
                      recovered.displayed_hash,
                      "returned_exact_models":len(exact),
                      "dedup_fingerprints":len(seen),
                      "elapsed_seconds":time.time()-started
                  })

                  STATUS.write_text(
                      json.dumps(
                          status,
                          indent=2,
                          sort_keys=True
                      ),
                      encoding="utf-8"
                  )

                  REPORT.write_text(
                      "\n".join([
                          "BITCOIN SHA-256d 4D "
                          "JOINT-INFERENCE RESULT",
                          "="*72,
                          f"Model revision: {MODEL_REVISION}",
                          f"Block hash: {block_hash}",
                          f"Recovery scope: {RECOVERY_SCOPE}",
                          f"Hidden bits: {len(hidden)}",
                          f"Context mode: {CONTEXT_MODE}",
                          f"Cycles: {cycle}",
                          f"Beam width: {BEAM_WIDTH}",
                          f"Exact digest match: {exact_hash}",
                          "Exact historical header match: "
                          f"{historical}",
                          "E_observation: "
                          f"{recovered.E_observation}",
                          f"E_local: {recovered.E_local}",
                          f"E_global: {recovered.E_global}",
                          f"C(m): {recovered.C_missing}",
                          "Total MAP energy: "
                          f"{recovered.total_energy}",
                          "External SAT/SMT solver used: False",
                          "Artificial scramble used: False",
                          "Physical Rubik moves used: False",
                          "Nonce interval loop used: False",
                          "Internal timeout/iteration cap: None",
                          "Frontier memory bounded: True",
                          "Full traces stored in frontier: False",
                          "",
                          "Recovered raw header:",
                          recovered.header.hex(),
                          "",
                          "Historical raw header "
                          "(comparison only):",
                          truth.hex()
                      ])+"\n",
                      encoding="utf-8"
                  )
                  emit(REPORT.read_text())

              except SystemExit:
                  raise
              except Exception as exc:
                  status.update({
                      "completed":False,
                      "fake_completion":False,
                      "error":str(exc),
                      "traceback":traceback.format_exc(),
                      "elapsed_seconds":time.time()-started
                  })
                  STATUS.write_text(
                      json.dumps(
                          status,
                          indent=2,
                          sort_keys=True
                      ),
                      encoding="utf-8"
                  )
                  REPORT.write_text(
                      "INCOMPLETE\n"
                      +traceback.format_exc(),
                      encoding="utf-8"
                  )
                  emit(REPORT.read_text())
                  raise

          if __name__=="__main__":
              main()
          PY
          solver_rc=${PIPESTATUS[0]}
          exit "$solver_rc"

      - name: Publish authoritative status
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f bitcoin_sha256d_4d_inverse_status.json ]; then
            cat bitcoin_sha256d_4d_inverse_status.json
          else
            echo '{"completed":false,"error":"status file not produced"}'
          fi

      - name: Upload complete evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-sha256d-4d-joint-${{ github.run_number }}
          path: |
            bitcoin_sha256d_4d_inverse_status.json
            bitcoin_sha256d_4d_inverse_report.txt
            bitcoin_sha256d_mathematical_model.txt
            bitcoin_sha256d_header_recovery.csv
            bitcoin_sha256d_round_states.csv
            bitcoin_sha256d_tesseract_slots.csv
            bitcoin_sha256d_lattice_bits.csv
            bitcoin_sha256d_3d_projections.csv
            bitcoin_sha256d_4d_search_trace.csv
            bitcoin_sha256d_4d_frontier.csv
            bitcoin_sha256d_posterior_models.csv
            bitcoin_sha256d_tolerance_topology.csv
            bitcoin_sha256d_functional_identifiability.csv
            bitcoin_sha256d_measure_audit.csv
            bitcoin_sha256d_frequency_split.csv
            bitcoin_sha256d_gauge_diagnostics.csv
            bitcoin_sha256d_stability.csv
            bitcoin_sha256d_tesseract_state_space.json
            bitcoin_sha256d_4d_checkpoint.json
            bitcoin_sha256d_4d_inverse_console.log
          if-no-files-found: warn
          retention-days: 30
