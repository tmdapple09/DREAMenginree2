name: DREAM Pixel-Encoded Codebase Atlas
run-name: DREAM Pixel-Encoded Codebase Atlas

"on":
  workflow_dispatch:
    inputs:
      maximum_dimension:
        description: "Maximum width/height of the single RGB recovery PNG"
        required: false
        default: "16000"
        type: string

permissions:
  contents: read

concurrency:
  group: dream-pixel-codebase-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pixel-codebase-atlas:
    name: Encode and prove the codebase from one PNG
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the image encoder runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "Pillow>=10,<13" \
            "numpy>=2,<3"

      - name: Write the decoder embedded into the PNG
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dream_pixel_restore.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import base64
          import hashlib
          import json
          import os
          import stat
          import struct
          import sys
          import zlib
          from pathlib import Path, PurePosixPath
          from typing import Iterator

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"
          PACKET_MAGIC = b"DRMPXL01"
          PACKET_PREFIX = struct.Struct(">8sI")
          CAPSULE_MAGIC = b"DRMCAP01"
          CAPSULE_PREFIX = struct.Struct(">8sQ")


          class RecoveryError(RuntimeError):
              pass


          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def paeth(a: int, b: int, c: int) -> int:
              p = a + b - c
              pa = abs(p - a)
              pb = abs(p - b)
              pc = abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c


          def unfilter_row(
              filter_type: int,
              row: bytearray,
              previous: bytes,
              bytes_per_pixel: int,
          ) -> bytes:
              if filter_type == 0:
                  return bytes(row)

              for index in range(len(row)):
                  left = row[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  up = previous[index] if previous else 0
                  upper_left = (
                      previous[index - bytes_per_pixel]
                      if previous and index >= bytes_per_pixel
                      else 0
                  )

                  if filter_type == 1:
                      row[index] = (row[index] + left) & 0xFF
                  elif filter_type == 2:
                      row[index] = (row[index] + up) & 0xFF
                  elif filter_type == 3:
                      row[index] = (row[index] + ((left + up) // 2)) & 0xFF
                  elif filter_type == 4:
                      row[index] = (
                          row[index] + paeth(left, up, upper_left)
                      ) & 0xFF
                  else:
                      raise RecoveryError(
                          f"unsupported PNG filter type: {filter_type}"
                      )

              return bytes(row)


          def iter_png_rgb_rows(image_path: Path) -> Iterator[bytes]:
              width = None
              height = None
              stride = None
              previous = b""
              pending = bytearray()
              rows_seen = 0
              decompressor = zlib.decompressobj()

              with image_path.open("rb") as handle:
                  if handle.read(8) != PNG_SIGNATURE:
                      raise RecoveryError(
                          "input is not a PNG; use the original generated artifact"
                      )

                  while True:
                      raw_length = handle.read(4)
                      if not raw_length:
                          break
                      if len(raw_length) != 4:
                          raise RecoveryError("truncated PNG chunk length")

                      length = struct.unpack(">I", raw_length)[0]
                      chunk_type = handle.read(4)
                      data = handle.read(length)
                      raw_crc = handle.read(4)

                      if (
                          len(chunk_type) != 4
                          or len(data) != length
                          or len(raw_crc) != 4
                      ):
                          raise RecoveryError("truncated PNG chunk")

                      expected_crc = struct.unpack(">I", raw_crc)[0]
                      actual_crc = zlib.crc32(chunk_type)
                      actual_crc = zlib.crc32(data, actual_crc) & 0xFFFFFFFF
                      if expected_crc != actual_crc:
                          raise RecoveryError(
                              f"PNG CRC mismatch in {chunk_type!r}"
                          )

                      if chunk_type == b"IHDR":
                          if length != 13:
                              raise RecoveryError("invalid PNG IHDR length")

                          (
                              width,
                              height,
                              bit_depth,
                              color_type,
                              compression_method,
                              filter_method,
                              interlace_method,
                          ) = struct.unpack(">IIBBBBB", data)

                          if (
                              bit_depth != 8
                              or color_type != 2
                              or compression_method != 0
                              or filter_method != 0
                              or interlace_method != 0
                          ):
                              raise RecoveryError(
                                  "atlas must remain a non-interlaced 8-bit RGB PNG"
                              )

                          stride = width * 3

                      elif chunk_type == b"IDAT":
                          if stride is None:
                              raise RecoveryError("PNG IDAT appeared before IHDR")

                          pending.extend(decompressor.decompress(data))
                          row_size = stride + 1

                          while len(pending) >= row_size:
                              filter_type = pending[0]
                              filtered = bytearray(pending[1:row_size])
                              del pending[:row_size]

                              restored = unfilter_row(
                                  filter_type,
                                  filtered,
                                  previous,
                                  3,
                              )
                              previous = restored
                              rows_seen += 1
                              yield restored

                      elif chunk_type == b"IEND":
                          if stride is None or height is None:
                              raise RecoveryError("PNG ended before IHDR")

                          pending.extend(decompressor.flush())
                          row_size = stride + 1

                          while (
                              len(pending) >= row_size
                              and rows_seen < height
                          ):
                              filter_type = pending[0]
                              filtered = bytearray(pending[1:row_size])
                              del pending[:row_size]

                              restored = unfilter_row(
                                  filter_type,
                                  filtered,
                                  previous,
                                  3,
                              )
                              previous = restored
                              rows_seen += 1
                              yield restored

                          if rows_seen != height:
                              raise RecoveryError(
                                  "PNG row count mismatch: "
                                  f"expected {height}, decoded {rows_seen}"
                              )
                          return

              raise RecoveryError("PNG is missing its IEND chunk")


          def iter_carrier_bytes(image_path: Path) -> Iterator[int]:
              accumulator = 0
              bit_count = 0

              for row in iter_png_rgb_rows(image_path):
                  for index in range(0, len(row), 3):
                      symbol = (
                          ((row[index] & 0x03) << 4)
                          | ((row[index + 1] & 0x03) << 2)
                          | (row[index + 2] & 0x03)
                      )

                      accumulator = (accumulator << 6) | symbol
                      bit_count += 6

                      while bit_count >= 8:
                          bit_count -= 8
                          yield (accumulator >> bit_count) & 0xFF
                          accumulator &= (
                              (1 << bit_count) - 1 if bit_count else 0
                          )


          def read_exact(stream: Iterator[int], count: int) -> bytes:
              output = bytearray()

              for _ in range(count):
                  try:
                      output.append(next(stream))
                  except StopIteration as error:
                      raise RecoveryError(
                          f"pixel carrier ended while reading {count} bytes"
                      ) from error

              return bytes(output)


          def decode_image_packet(image_path: Path) -> tuple[dict, bytes]:
              stream = iter_carrier_bytes(image_path)

              prefix = read_exact(stream, PACKET_PREFIX.size)
              magic, header_length = PACKET_PREFIX.unpack(prefix)

              if magic != PACKET_MAGIC:
                  raise RecoveryError(
                      "DREAM pixel magic is absent. The PNG was probably "
                      "resized, recompressed, converted, or screenshotted."
                  )

              encoded_header = read_exact(stream, header_length)
              try:
                  header = json.loads(encoded_header.decode("utf-8"))
              except Exception as error:
                  raise RecoveryError(
                      f"invalid pixel packet header: {error}"
                  ) from error

              payload_length = int(header.get("payloadBytes", -1))
              if payload_length < 0:
                  raise RecoveryError("pixel packet is missing payloadBytes")

              payload = read_exact(stream, payload_length)

              if sha256(payload) != header.get("payloadSha256"):
                  raise RecoveryError(
                      "pixel payload SHA-256 mismatch"
                  )

              return header, payload


          def parse_capsule(payload: bytes) -> tuple[dict, memoryview]:
              if len(payload) < CAPSULE_PREFIX.size:
                  raise RecoveryError("truncated codebase capsule")

              magic, manifest_length = CAPSULE_PREFIX.unpack(
                  payload[: CAPSULE_PREFIX.size]
              )
              if magic != CAPSULE_MAGIC:
                  raise RecoveryError("invalid codebase capsule magic")

              manifest_start = CAPSULE_PREFIX.size
              manifest_end = manifest_start + manifest_length
              if manifest_end > len(payload):
                  raise RecoveryError("truncated codebase manifest")

              try:
                  manifest = json.loads(
                      payload[manifest_start:manifest_end].decode("utf-8")
                  )
              except Exception as error:
                  raise RecoveryError(
                      f"invalid codebase manifest: {error}"
                  ) from error

              embedded_decoder = zlib.decompress(
                  base64.b64decode(
                      manifest["embeddedDecoderZlibBase64"],
                      validate=True,
                  )
              )
              if sha256(embedded_decoder) != manifest["embeddedDecoderSha256"]:
                  raise RecoveryError(
                      "decoder copy inside the pixel payload is corrupt"
                  )

              return manifest, memoryview(payload)[manifest_end:]


          def validated_path(value: str) -> PurePosixPath:
              path = PurePosixPath(value)

              if (
                  not value
                  or path.is_absolute()
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise RecoveryError(f"unsafe archive path: {value!r}")

              return path


          def validate_symlink_target(
              link_path: PurePosixPath,
              target: str,
          ) -> None:
              if not target or "\x00" in target:
                  raise RecoveryError(
                      f"invalid symlink target for {link_path}"
                  )

              target_path = PurePosixPath(target)
              if target_path.is_absolute():
                  raise RecoveryError(
                      f"absolute symlink is not allowed: "
                      f"{link_path} -> {target}"
                  )

              depth = len(link_path.parent.parts)
              for part in target_path.parts:
                  if part in {"", "."}:
                      continue
                  if part == "..":
                      depth -= 1
                      if depth < 0:
                          raise RecoveryError(
                              f"symlink escapes output tree: "
                              f"{link_path} -> {target}"
                          )
                  else:
                      depth += 1


          def read_file_entry(
              entry: dict,
              data: memoryview,
          ) -> bytes:
              offset = int(entry["offset"])
              compressed_size = int(entry["compressedSize"])
              raw_size = int(entry["size"])

              if (
                  offset < 0
                  or compressed_size < 0
                  or offset + compressed_size > len(data)
              ):
                  raise RecoveryError(
                      f"invalid payload interval for {entry.get('path')}"
                  )

              compressed = bytes(
                  data[offset : offset + compressed_size]
              )

              if sha256(compressed) != entry["compressedSha256"]:
                  raise RecoveryError(
                      f"compressed SHA-256 mismatch for {entry.get('path')}"
                  )

              try:
                  raw = zlib.decompress(compressed)
              except Exception as error:
                  raise RecoveryError(
                      f"cannot decompress {entry.get('path')}: {error}"
                  ) from error

              if len(raw) != raw_size:
                  raise RecoveryError(
                      f"size mismatch for {entry.get('path')}"
                  )

              if sha256(raw) != entry["sha256"]:
                  raise RecoveryError(
                      f"content SHA-256 mismatch for {entry.get('path')}"
                  )

              return raw


          def validate_manifest(
              manifest: dict,
              data: memoryview,
              verify_all_content: bool,
          ) -> None:
              entries = manifest.get("entries")
              if not isinstance(entries, list):
                  raise RecoveryError("manifest entries are missing")

              seen: set[str] = set()
              symlinks: set[PurePosixPath] = set()

              root_descriptor = []

              for entry in entries:
                  relative = validated_path(
                      str(entry.get("path", ""))
                  )
                  key = relative.as_posix()

                  if key in seen:
                      raise RecoveryError(
                          f"duplicate manifest path: {key}"
                      )
                  seen.add(key)

                  for parent in relative.parents:
                      if parent in symlinks:
                          raise RecoveryError(
                              f"path traverses a symlink parent: {key}"
                          )

                  kind = entry.get("type")
                  if kind == "file":
                      if verify_all_content:
                          read_file_entry(entry, data)

                      root_descriptor.append(
                          {
                              "path": key,
                              "type": "file",
                              "mode": int(entry["mode"]),
                              "size": int(entry["size"]),
                              "sha256": entry["sha256"],
                              "target": None,
                          }
                      )

                  elif kind == "symlink":
                      target = str(entry.get("target", ""))
                      validate_symlink_target(relative, target)
                      symlinks.add(relative)

                      root_descriptor.append(
                          {
                              "path": key,
                              "type": "symlink",
                              "mode": int(entry["mode"]),
                              "size": None,
                              "sha256": None,
                              "target": target,
                          }
                      )

                  else:
                      raise RecoveryError(
                          f"unsupported entry type for {key}: {kind!r}"
                      )

              encoded_root = json.dumps(
                  root_descriptor,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")

              if sha256(encoded_root) != manifest["codebaseRoot"]:
                  raise RecoveryError("codebase root mismatch")


          def safe_output_path(
              root: Path,
              relative: PurePosixPath,
          ) -> Path:
              root_resolved = root.resolve()
              target = root.joinpath(*relative.parts)

              current = root
              for part in relative.parts[:-1]:
                  current = current / part
                  if current.exists() and current.is_symlink():
                      raise RecoveryError(
                          f"output path traverses symlink: {relative}"
                      )

              parent = target.parent.resolve()
              if (
                  parent != root_resolved
                  and root_resolved not in parent.parents
              ):
                  raise RecoveryError(
                      f"output path escapes destination: {relative}"
                  )

              return target


          def restore(
              image_path: Path,
              output: Path,
          ) -> dict:
              header, payload = decode_image_packet(image_path)
              manifest, data = parse_capsule(payload)
              validate_manifest(
                  manifest,
                  data,
                  verify_all_content=False,
              )

              if output.exists() and any(output.iterdir()):
                  raise RecoveryError(
                      f"destination is not empty: {output}"
                  )

              output.mkdir(parents=True, exist_ok=True)
              entries = manifest["entries"]

              restored_files = 0
              restored_symlinks = 0

              for entry in entries:
                  if entry["type"] != "file":
                      continue

                  relative = validated_path(entry["path"])
                  destination = safe_output_path(output, relative)
                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )
                  destination.write_bytes(
                      read_file_entry(entry, data)
                  )
                  os.chmod(
                      destination,
                      int(entry["mode"]) & 0o777,
                  )
                  restored_files += 1

              for entry in entries:
                  if entry["type"] != "symlink":
                      continue

                  relative = validated_path(entry["path"])
                  destination = safe_output_path(output, relative)
                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )
                  os.symlink(
                      entry["target"],
                      destination,
                  )
                  restored_symlinks += 1

              return {
                  "restored": True,
                  "format": header.get("format"),
                  "codebaseRoot": manifest["codebaseRoot"],
                  "files": restored_files,
                  "symlinks": restored_symlinks,
                  "output": str(output),
              }


          def extract_one(
              image_path: Path,
              requested_path: str,
              destination: Path,
          ) -> dict:
              _, payload = decode_image_packet(image_path)
              manifest, data = parse_capsule(payload)
              wanted = validated_path(requested_path).as_posix()

              for entry in manifest["entries"]:
                  if entry["path"] != wanted:
                      continue

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  if entry["type"] == "file":
                      destination.write_bytes(
                          read_file_entry(entry, data)
                      )
                      os.chmod(
                          destination,
                          int(entry["mode"]) & 0o777,
                      )
                  else:
                      validate_symlink_target(
                          PurePosixPath(wanted),
                          entry["target"],
                      )
                      os.symlink(
                          entry["target"],
                          destination,
                      )

                  return {
                      "extracted": True,
                      "path": wanted,
                      "destination": str(destination),
                      "type": entry["type"],
                  }

              raise RecoveryError(
                  f"path is not present in the atlas: {wanted}"
              )


          def main() -> int:
              parser = argparse.ArgumentParser(
                  description=(
                      "Restore a complete tracked codebase from the RGB "
                      "low-bit payload of one DREAM PNG."
                  )
              )
              commands = parser.add_subparsers(
                  dest="command",
                  required=True,
              )

              restore_parser = commands.add_parser("restore")
              restore_parser.add_argument("image", type=Path)
              restore_parser.add_argument("output", type=Path)

              verify_parser = commands.add_parser("verify")
              verify_parser.add_argument("image", type=Path)

              list_parser = commands.add_parser("list")
              list_parser.add_argument("image", type=Path)

              extract_parser = commands.add_parser("extract")
              extract_parser.add_argument("image", type=Path)
              extract_parser.add_argument("path")
              extract_parser.add_argument("destination", type=Path)

              args = parser.parse_args()

              if args.command == "restore":
                  result = restore(
                      args.image.resolve(),
                      args.output.resolve(),
                  )

              elif args.command == "verify":
                  header, payload = decode_image_packet(
                      args.image.resolve()
                  )
                  manifest, data = parse_capsule(payload)
                  validate_manifest(
                      manifest,
                      data,
                      verify_all_content=True,
                  )
                  result = {
                      "valid": True,
                      "format": header.get("format"),
                      "codebaseRoot": manifest["codebaseRoot"],
                      "entries": len(manifest["entries"]),
                      "payloadBytes": len(payload),
                  }

              elif args.command == "list":
                  _, payload = decode_image_packet(
                      args.image.resolve()
                  )
                  manifest, _ = parse_capsule(payload)
                  for entry in manifest["entries"]:
                      print(entry["path"])
                  return 0

              else:
                  result = extract_one(
                      args.image.resolve(),
                      args.path,
                      args.destination.resolve(),
                  )

              print(
                  json.dumps(
                      result,
                      indent=2,
                      sort_keys=True,
                  )
              )
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (
                  RecoveryError,
                  KeyError,
                  OSError,
                  ValueError,
                  zlib.error,
              ) as error:
                  print(
                      f"DREAM recovery failed: {error}",
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
          PY

          python -m py_compile "$RUNNER_TEMP/dream_pixel_restore.py"

      - name: Encode every tracked byte into RGB pixels
        shell: bash
        env:
          MAXIMUM_DIMENSION: ${{ inputs.maximum_dimension }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_dream_pixel_atlas.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import base64
          import hashlib
          import json
          import math
          import os
          import shutil
          import stat
          import struct
          import subprocess
          import tempfile
          import zlib
          from pathlib import Path, PurePosixPath

          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, PngImagePlugin

          PACKET_MAGIC = b"DRMPXL01"
          PACKET_PREFIX = struct.Struct(">8sI")
          CAPSULE_MAGIC = b"DRMCAP01"
          CAPSULE_PREFIX = struct.Struct(">8sQ")
          CARRIER_BITS_PER_PIXEL = 6
          VISIBLE_CHANNEL_MASK = 0xFC


          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
              return digest.hexdigest()


          def canonical_json(value: object) -> bytes:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")


          def tracked_paths(root: Path) -> list[str]:
              result = subprocess.run(
                  [
                      "git",
                      "-C",
                      str(root),
                      "ls-files",
                      "-z",
                      "--recurse-submodules",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              paths = [
                  item.decode("utf-8", "surrogateescape")
                  for item in result.stdout.split(b"\0")
                  if item
              ]
              paths = sorted(set(paths))
              if not paths:
                  raise RuntimeError("git reported no tracked paths")
              return paths


          def validated_repo_path(value: str) -> PurePosixPath:
              path = PurePosixPath(value)
              if (
                  not value
                  or path.is_absolute()
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise RuntimeError(
                      f"unsafe repository path: {value!r}"
                  )
              return path


          def validate_symlink_target(
              link_path: PurePosixPath,
              target: str,
          ) -> None:
              if not target or "\x00" in target:
                  raise RuntimeError(
                      f"invalid symlink target for {link_path}"
                  )

              target_path = PurePosixPath(target)
              if target_path.is_absolute():
                  raise RuntimeError(
                      f"absolute symlink is not recoverable safely: "
                      f"{link_path} -> {target}"
                  )

              depth = len(link_path.parent.parts)
              for part in target_path.parts:
                  if part in {"", "."}:
                      continue
                  if part == "..":
                      depth -= 1
                      if depth < 0:
                          raise RuntimeError(
                              f"symlink escapes repository: "
                              f"{link_path} -> {target}"
                          )
                  else:
                      depth += 1


          def build_capsule(
              root: Path,
              destination: Path,
              decoder_source: bytes,
              temporary: Path,
          ) -> tuple[dict, int]:
              data_path = temporary / "codebase-data.bin"
              entries: list[dict] = []
              offset = 0

              with data_path.open("wb") as data_handle:
                  for relative_text in tracked_paths(root):
                      relative = validated_repo_path(relative_text)
                      absolute = root.joinpath(*relative.parts)

                      if (
                          not absolute.exists()
                          and not absolute.is_symlink()
                      ):
                          raise RuntimeError(
                              "tracked path is missing from checkout: "
                              f"{relative_text}"
                          )

                      metadata = os.lstat(absolute)
                      mode = stat.S_IMODE(metadata.st_mode)

                      if stat.S_ISDIR(metadata.st_mode):
                          continue

                      if stat.S_ISLNK(metadata.st_mode):
                          target = os.readlink(absolute)
                          validate_symlink_target(
                              relative,
                              target,
                          )
                          entries.append(
                              {
                                  "path": relative.as_posix(),
                                  "type": "symlink",
                                  "mode": mode,
                                  "target": target,
                              }
                          )
                          continue

                      if not stat.S_ISREG(metadata.st_mode):
                          raise RuntimeError(
                              "unsupported tracked file type: "
                              f"{relative_text}"
                          )

                      raw = absolute.read_bytes()
                      compressed = zlib.compress(raw, level=9)

                      entries.append(
                          {
                              "path": relative.as_posix(),
                              "type": "file",
                              "mode": mode,
                              "size": len(raw),
                              "sha256": sha256(raw),
                              "codec": "zlib",
                              "offset": offset,
                              "compressedSize": len(compressed),
                              "compressedSha256": sha256(compressed),
                          }
                      )

                      data_handle.write(compressed)
                      offset += len(compressed)

              root_descriptor = [
                  {
                      "path": entry["path"],
                      "type": entry["type"],
                      "mode": entry["mode"],
                      "size": entry.get("size"),
                      "sha256": entry.get("sha256"),
                      "target": entry.get("target"),
                  }
                  for entry in entries
              ]
              codebase_root = sha256(
                  canonical_json(root_descriptor)
              )

              manifest = {
                  "format": "dream-pixel-codebase-capsule",
                  "version": 1,
                  "codebaseRoot": codebase_root,
                  "entryCount": len(entries),
                  "dataBytes": offset,
                  "embeddedDecoderSha256": sha256(decoder_source),
                  "embeddedDecoderZlibBase64": base64.b64encode(
                      zlib.compress(decoder_source, level=9)
                  ).decode("ascii"),
                  "entries": entries,
              }
              manifest_bytes = canonical_json(manifest)

              with destination.open("wb") as capsule_handle:
                  capsule_handle.write(
                      CAPSULE_PREFIX.pack(
                          CAPSULE_MAGIC,
                          len(manifest_bytes),
                      )
                  )
                  capsule_handle.write(manifest_bytes)

                  with data_path.open("rb") as data_handle:
                      shutil.copyfileobj(
                          data_handle,
                          capsule_handle,
                          length=1024 * 1024,
                      )

              return manifest, len(manifest_bytes)


          def quantized_color(seed: str) -> tuple[int, int, int]:
              digest = hashlib.sha256(
                  seed.encode("utf-8")
              ).digest()
              return tuple(
                  ((44 + (digest[index] % 180)) // 4) * 4
                  for index in range(3)
              )


          def draw_linear_interval(
              draw: ImageDraw.ImageDraw,
              side: int,
              start_pixel: int,
              end_pixel: int,
              color: tuple[int, int, int],
          ) -> None:
              capacity = side * side
              start_pixel = max(
                  0,
                  min(start_pixel, capacity),
              )
              end_pixel = max(
                  0,
                  min(end_pixel, capacity),
              )

              if end_pixel <= start_pixel:
                  return

              start_row, start_column = divmod(
                  start_pixel,
                  side,
              )
              end_row, end_column = divmod(
                  end_pixel,
                  side,
              )

              if start_row == end_row:
                  draw.rectangle(
                      (
                          start_column,
                          start_row,
                          max(start_column, end_column - 1),
                          start_row,
                      ),
                      fill=color,
                  )
                  return

              draw.rectangle(
                  (
                      start_column,
                      start_row,
                      side - 1,
                      start_row,
                  ),
                  fill=color,
              )

              if end_row - start_row > 1:
                  draw.rectangle(
                      (
                          0,
                          start_row + 1,
                          side - 1,
                          end_row - 1,
                      ),
                      fill=color,
                  )

              if end_column:
                  draw.rectangle(
                      (
                          0,
                          end_row,
                          end_column - 1,
                          end_row,
                      ),
                      fill=color,
                  )


          def render_carrier(
              side: int,
              packet_header_bytes: int,
              capsule_manifest_bytes: int,
              manifest: dict,
              packet_bytes: int,
          ) -> Image.Image:
              image = Image.new(
                  "RGB",
                  (side, side),
                  (12, 16, 28),
              )
              draw = ImageDraw.Draw(image)
              font = ImageFont.load_default()

              capsule_data_start = (
                  packet_header_bytes
                  + CAPSULE_PREFIX.size
                  + capsule_manifest_bytes
              )

              intervals = []
              for entry in manifest["entries"]:
                  if entry["type"] != "file":
                      continue

                  byte_start = (
                      capsule_data_start
                      + int(entry["offset"])
                  )
                  byte_end = (
                      byte_start
                      + int(entry["compressedSize"])
                  )

                  pixel_start = (
                      byte_start * 8
                  ) // CARRIER_BITS_PER_PIXEL
                  pixel_end = math.ceil(
                      byte_end * 8
                      / CARRIER_BITS_PER_PIXEL
                  )

                  path = PurePosixPath(entry["path"])
                  group = (
                      path.parts[0]
                      if path.parts
                      else "root"
                  )
                  intervals.append(
                      {
                          "entry": entry,
                          "pixelStart": pixel_start,
                          "pixelEnd": pixel_end,
                          "group": group,
                      }
                  )

              for interval in intervals:
                  draw_linear_interval(
                      draw,
                      side,
                      interval["pixelStart"],
                      interval["pixelEnd"],
                      quantized_color(interval["group"]),
                  )

              dashboard_height = max(
                  150,
                  min(420, side // 9),
              )
              draw.rectangle(
                  (
                      0,
                      0,
                      side - 1,
                      dashboard_height,
                  ),
                  fill=(16, 20, 36),
                  outline=(164, 188, 236),
                  width=max(2, side // 1200),
              )
              draw.text(
                  (18, 16),
                  "DREAM CODEBASE SPATIAL RECOVERY ATLAS",
                  fill=(240, 244, 252),
                  font=font,
              )
              draw.text(
                  (18, 40),
                  (
                      "Every tracked repository byte is encoded into "
                      "the two least-significant bits of these RGB pixels."
                  ),
                  fill=(184, 204, 240),
                  font=font,
              )
              draw.text(
                  (18, 64),
                  (
                      "The PNG metadata contains only the bootstrap "
                      "decoder; the decoder is also duplicated inside "
                      "the pixel payload."
                  ),
                  fill=(184, 204, 240),
                  font=font,
              )
              draw.text(
                  (18, 88),
                  (
                      "Use the original PNG. Resizing, JPEG conversion, "
                      "screenshots, or image optimization destroys recovery."
                  ),
                  fill=(244, 176, 176),
                  font=font,
              )
              draw.text(
                  (18, dashboard_height - 22),
                  (
                      f"entries={manifest['entryCount']:,}  "
                      f"packet={packet_bytes:,} bytes  "
                      f"root={manifest['codebaseRoot']}"
                  ),
                  fill=(140, 168, 216),
                  font=font,
              )

              grid_color = (72, 88, 124)
              for fraction in range(1, 8):
                  coordinate = side * fraction // 8
                  draw.line(
                      (
                          coordinate,
                          dashboard_height,
                          coordinate,
                          side - 1,
                      ),
                      fill=grid_color,
                      width=1,
                  )
                  draw.line(
                      (
                          0,
                          coordinate,
                          side - 1,
                          coordinate,
                      ),
                      fill=grid_color,
                      width=1,
                  )

              largest = sorted(
                  intervals,
                  key=lambda item: (
                      item["pixelEnd"]
                      - item["pixelStart"]
                  ),
                  reverse=True,
              )[:120]

              for interval in largest:
                  midpoint = (
                      interval["pixelStart"]
                      + interval["pixelEnd"]
                  ) // 2
                  x = midpoint % side
                  y = midpoint // side

                  if (
                      y <= dashboard_height + 4
                      or y >= side
                  ):
                      continue

                  label = PurePosixPath(
                      interval["entry"]["path"]
                  ).name[:44]

                  draw.text(
                      (x + 2, y + 2),
                      label,
                      fill=(244, 246, 252),
                      font=font,
                      stroke_width=1,
                      stroke_fill=(12, 16, 28),
                  )

              array = np.asarray(
                  image,
                  dtype=np.uint8,
              ).copy()
              array &= VISIBLE_CHANNEL_MASK

              return Image.fromarray(
                  array,
                  mode="RGB",
              )


          def iter_six_bit_symbol_chunks(
              packet_path: Path,
              chunk_bytes: int = 3 * 1024 * 1024,
          ):
              remainder = b""

              with packet_path.open("rb") as handle:
                  while True:
                      incoming = handle.read(chunk_bytes)
                      if not incoming:
                          break

                      data = remainder + incoming
                      complete = (len(data) // 3) * 3
                      block = data[:complete]
                      remainder = data[complete:]

                      if block:
                          values = np.frombuffer(
                              block,
                              dtype=np.uint8,
                          ).reshape(-1, 3)

                          symbols = np.empty(
                              values.shape[0] * 4,
                              dtype=np.uint8,
                          )
                          first = values[:, 0]
                          second = values[:, 1]
                          third = values[:, 2]

                          symbols[0::4] = first >> 2
                          symbols[1::4] = (
                              ((first & 0x03) << 4)
                              | (second >> 4)
                          )
                          symbols[2::4] = (
                              ((second & 0x0F) << 2)
                              | (third >> 6)
                          )
                          symbols[3::4] = third & 0x3F

                          yield symbols

              if remainder:
                  padded = remainder + b"\x00" * (3 - len(remainder))
                  values = np.frombuffer(
                      padded,
                      dtype=np.uint8,
                  )
                  first = int(values[0])
                  second = int(values[1])
                  third = int(values[2])

                  symbols = np.array(
                      [
                          first >> 2,
                          ((first & 0x03) << 4) | (second >> 4),
                          ((second & 0x0F) << 2) | (third >> 6),
                          third & 0x3F,
                      ],
                      dtype=np.uint8,
                  )

                  required = math.ceil(
                      len(remainder) * 8 / 6
                  )
                  yield symbols[:required]


          def embed_packet(
              carrier: Image.Image,
              packet_path: Path,
              symbol_count: int,
          ) -> Image.Image:
              pixels = np.asarray(
                  carrier,
                  dtype=np.uint8,
              ).copy().reshape(-1, 3)

              if symbol_count > len(pixels):
                  raise RuntimeError(
                      "carrier capacity failure: "
                      f"need {symbol_count:,} pixels, "
                      f"have {len(pixels):,}"
                  )

              pixels &= VISIBLE_CHANNEL_MASK
              cursor = 0

              for symbols in iter_six_bit_symbol_chunks(
                  packet_path
              ):
                  end = cursor + len(symbols)
                  target = pixels[cursor:end]
                  target[:, 0] |= (symbols >> 4) & 0x03
                  target[:, 1] |= (symbols >> 2) & 0x03
                  target[:, 2] |= symbols & 0x03
                  cursor = end

              if cursor != symbol_count:
                  raise RuntimeError(
                      "encoder symbol count mismatch: "
                      f"{cursor} != {symbol_count}"
                  )

              return Image.fromarray(
                  pixels.reshape(
                      carrier.height,
                      carrier.width,
                      3,
                  ),
                  mode="RGB",
              )


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument(
                  "--root",
                  type=Path,
                  required=True,
              )
              parser.add_argument(
                  "--output",
                  type=Path,
                  required=True,
              )
              parser.add_argument(
                  "--decoder",
                  type=Path,
                  required=True,
              )
              parser.add_argument(
                  "--maximum-dimension",
                  type=int,
                  default=16000,
              )
              args = parser.parse_args()

              root = args.root.resolve()
              output = args.output.resolve()
              decoder_source = args.decoder.read_bytes()
              output.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              with tempfile.TemporaryDirectory(
                  prefix="dream-pixel-atlas-"
              ) as temporary_text:
                  temporary = Path(temporary_text)
                  capsule_path = temporary / "codebase.capsule"
                  packet_path = temporary / "image.packet"

                  manifest, manifest_bytes = build_capsule(
                      root,
                      capsule_path,
                      decoder_source,
                      temporary,
                  )

                  packet_header = {
                      "format": "dream-pixel-codebase-atlas",
                      "version": 1,
                      "payloadBytes": capsule_path.stat().st_size,
                      "payloadSha256": sha256_file(capsule_path),
                      "codebaseRoot": manifest["codebaseRoot"],
                      "entryCount": manifest["entryCount"],
                      "carrier": (
                          "row-major RGB; two least-significant "
                          "bits per channel; six payload bits per pixel"
                      ),
                  }
                  packet_header_bytes = canonical_json(
                      packet_header
                  )

                  with packet_path.open("wb") as packet_handle:
                      packet_handle.write(
                          PACKET_PREFIX.pack(
                              PACKET_MAGIC,
                              len(packet_header_bytes),
                          )
                      )
                      packet_handle.write(packet_header_bytes)

                      with capsule_path.open("rb") as capsule_handle:
                          shutil.copyfileobj(
                              capsule_handle,
                              packet_handle,
                              length=1024 * 1024,
                          )

                  packet_bytes = packet_path.stat().st_size
                  required_pixels = math.ceil(
                      packet_bytes * 8
                      / CARRIER_BITS_PER_PIXEL
                  )
                  required_side = math.ceil(
                      math.sqrt(required_pixels)
                  )
                  side = max(
                      1536,
                      ((required_side + 63) // 64) * 64,
                  )

                  if side > args.maximum_dimension:
                      raise RuntimeError(
                          "the repository does not fit in one PNG at "
                          f"{args.maximum_dimension}x"
                          f"{args.maximum_dimension}. "
                          f"Required minimum is approximately "
                          f"{required_side}x{required_side}."
                      )

                  carrier = render_carrier(
                      side,
                      PACKET_PREFIX.size
                      + len(packet_header_bytes),
                      manifest_bytes,
                      manifest,
                      packet_bytes,
                  )
                  encoded = embed_packet(
                      carrier,
                      packet_path,
                      math.ceil(
                          packet_bytes * 8
                          / CARRIER_BITS_PER_PIXEL
                      ),
                  )

                  png_info = PngImagePlugin.PngInfo()
                  png_info.add_text(
                      "DREAM_DECODER",
                      decoder_source.decode("utf-8"),
                      zip=True,
                  )
                  png_info.add_text(
                      "DREAM_FORMAT",
                      "dream-pixel-codebase-atlas-v1",
                      zip=False,
                  )
                  png_info.add_text(
                      "DREAM_CODEBASE_ROOT",
                      manifest["codebaseRoot"],
                      zip=False,
                  )

                  encoded.save(
                      output,
                      "PNG",
                      pnginfo=png_info,
                      compress_level=6,
                      optimize=False,
                  )

              print(
                  json.dumps(
                      {
                          "artifact": str(output),
                          "artifactBytes": output.stat().st_size,
                          "artifactSha256": sha256_file(output),
                          "width": side,
                          "height": side,
                          "pixelPacketBytes": packet_bytes,
                          "entries": manifest["entryCount"],
                          "codebaseRoot": manifest["codebaseRoot"],
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python -m py_compile \
            "$RUNNER_TEMP/build_dream_pixel_atlas.py"

          rm -rf "$GITHUB_WORKSPACE/dream-pixel-output"
          mkdir -p "$GITHUB_WORKSPACE/dream-pixel-output"

          python "$RUNNER_TEMP/build_dream_pixel_atlas.py" \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/dream-pixel-output/DREAM_CODEBASE_SPATIAL_ATLAS.png" \
            --decoder "$RUNNER_TEMP/dream_pixel_restore.py" \
            --maximum-dimension "$MAXIMUM_DIMENSION" \
            | tee "$RUNNER_TEMP/dream-pixel-build.json"

      - name: Prove exact recovery starting with only the PNG
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/dream-pixel-output/DREAM_CODEBASE_SPATIAL_ATLAS.png"
          PROOF_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PROOF_ROOT"' EXIT

          cp "$IMAGE" "$PROOF_ROOT/DREAM_CODEBASE_SPATIAL_ATLAS.png"
          cd "$PROOF_ROOT"

          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test -f DREAM_CODEBASE_SPATIAL_ATLAS.png

          python - \
            DREAM_CODEBASE_SPATIAL_ATLAS.png \
            rebuilt-codebase \
            restore <<'PY'
          from __future__ import annotations

          import struct
          import sys
          import zlib
          from pathlib import Path

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"

          image = Path(sys.argv[1])
          output = sys.argv[2]
          command = sys.argv[3]

          data = image.read_bytes()
          if data[:8] != PNG_SIGNATURE:
              raise SystemExit("not a PNG")

          cursor = 8
          decoder = None

          while cursor < len(data):
              if cursor + 12 > len(data):
                  raise SystemExit("truncated PNG")

              length = struct.unpack(
                  ">I",
                  data[cursor : cursor + 4],
              )[0]
              chunk_type = data[
                  cursor + 4 : cursor + 8
              ]
              chunk_data = data[
                  cursor + 8 : cursor + 8 + length
              ]
              cursor += 12 + length

              if chunk_type == b"zTXt":
                  keyword, remainder = chunk_data.split(
                      b"\0",
                      1,
                  )
                  if (
                      keyword == b"DREAM_DECODER"
                      and remainder[:1] == b"\0"
                  ):
                      decoder = zlib.decompress(
                          remainder[1:]
                      )
                      break

              if chunk_type == b"IEND":
                  break

          if decoder is None:
              raise SystemExit(
                  "DREAM_DECODER metadata is missing"
              )

          sys.argv = [
              "dream_pixel_restore.py",
              command,
              str(image),
              output,
          ]
          exec(
              compile(
                  decoder,
                  "dream_pixel_restore.py",
                  "exec",
              ),
              {
                  "__name__": "__main__",
                  "__file__": "dream_pixel_restore.py",
              },
          )
          PY

          cat > "$RUNNER_TEMP/verify_pixel_roundtrip.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          source = Path(sys.argv[1]).resolve()
          rebuilt = Path(sys.argv[2]).resolve()

          result = subprocess.run(
              [
                  "git",
                  "-C",
                  str(source),
                  "ls-files",
                  "-z",
                  "--recurse-submodules",
              ],
              check=True,
              stdout=subprocess.PIPE,
          )

          expected: set[str] = set()

          for raw in result.stdout.split(b"\0"):
              if not raw:
                  continue

              relative_text = raw.decode(
                  "utf-8",
                  "surrogateescape",
              )
              relative = PurePosixPath(relative_text)
              original = source.joinpath(*relative.parts)

              if original.is_dir() and not original.is_symlink():
                  continue

              expected.add(relative.as_posix())
              restored = rebuilt.joinpath(*relative.parts)

              if original.is_symlink():
                  if not restored.is_symlink():
                      raise SystemExit(
                          f"missing symlink: {relative}"
                      )
                  if os.readlink(original) != os.readlink(restored):
                      raise SystemExit(
                          f"symlink target mismatch: {relative}"
                      )
                  continue

              if not restored.is_file() or restored.is_symlink():
                  raise SystemExit(
                      f"missing regular file: {relative}"
                  )

              if (
                  hashlib.sha256(
                      original.read_bytes()
                  ).digest()
                  != hashlib.sha256(
                      restored.read_bytes()
                  ).digest()
              ):
                  raise SystemExit(
                      f"byte mismatch: {relative}"
                  )

              original_mode = stat.S_IMODE(
                  os.lstat(original).st_mode
              )
              restored_mode = stat.S_IMODE(
                  os.lstat(restored).st_mode
              )
              if original_mode != restored_mode:
                  raise SystemExit(
                      f"mode mismatch: {relative}: "
                      f"{oct(original_mode)} != "
                      f"{oct(restored_mode)}"
                  )

          actual: set[str] = set()

          for directory, dirnames, filenames in os.walk(
              rebuilt,
              followlinks=False,
          ):
              base = Path(directory)

              for dirname in list(dirnames):
                  item = base / dirname
                  if item.is_symlink():
                      actual.add(
                          item.relative_to(
                              rebuilt
                          ).as_posix()
                      )
                      dirnames.remove(dirname)

              for filename in filenames:
                  actual.add(
                      (base / filename)
                      .relative_to(rebuilt)
                      .as_posix()
                  )

          if expected != actual:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(
                  "tree mismatch; "
                  f"missing={missing[:20]} "
                  f"extra={extra[:20]}"
              )

          print(
              "EXACT_PIXEL_ROUNDTRIP_OK "
              f"entries={len(expected)}"
          )
          PY

          python "$RUNNER_TEMP/verify_pixel_roundtrip.py" \
            "$GITHUB_WORKSPACE" \
            "$PROOF_ROOT/rebuilt-codebase"

          {
            echo "## DREAM pixel recovery proof"
            echo
            echo "The proof directory began with exactly one file:"
            echo
            echo "\`DREAM_CODEBASE_SPATIAL_ATLAS.png\`"
            echo
            echo "The repository capsule was decoded from the RGB low-bit pixel plane."
            echo "The PNG metadata supplied only the bootstrap decoder, and that decoder was also verified against the copy stored inside the pixel payload."
            echo "Every tracked file byte, executable mode, and symlink target matched the checkout."
            echo
            echo "The original PNG is mandatory. JPEG conversion, resizing, screenshots, cropping, or image optimization destroys the encoded pixel payload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the one-image recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREAM_CODEBASE_SPATIAL_ATLAS
          path: dream-pixel-output/DREAM_CODEBASE_SPATIAL_ATLAS.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
