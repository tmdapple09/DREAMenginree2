          def safe_part(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"[^a-z0-9._-]+", "_", value)
              value = re.sub(r"_+", "_", value).strip("_")
              return value or "uncategorized"

          def path_contains(path: str, needles: List[str]) -> bool:
              lower = path.lower()
              return any(needle in lower for needle in needles)

          def dreamengin_area(path: str) -> str:
              p = path.lower()

              explicit = [
                  ("dreamdmbar", ["dreamdmbar", "dreamdm"]),
                  ("dreamr", ["dreamr", "/feed", "feed/", "profile", "messages"]),
                  ("gameengin", ["gameengin", "games", "cartridge", "madmaxi"]),
                  ("contentengin", ["contentengin", "content"]),
                  ("codeengin", ["codeengin", "code"]),
                  ("starmakerengin", ["starmaker", "music"]),
                  ("labengin", ["labengin", "/lab", "lab/"]),
                  ("brandingengin", ["brandingengin", "brand"]),
                  ("forgeengin", ["forgeengin", "forge"]),
                  ("runtime", ["engine/runtime", "dualruntime", "runtime"]),
                  ("supabase", ["supabase"]),
                  ("agents_dr_eams", ["agents", "dr-eams", "idari", "boogie", "humanai"]),
                  ("ui_shell", ["components", "styles", "ui"]),
                  ("docs", ["docs", "readme", "architecture"]),
                  ("public_assets", ["public", "fonts", "images", "icons", "models", "audio"]),
              ]

              for area, needles in explicit:
                  if path_contains(p, needles):
                      return area

              first = p.split("/", 1)[0]
              return safe_part(first)

          def secondary_tracks(path: str) -> List[str]:
              p = path.lower()
              tracks = []

              checks = [
                  ("11_security", ["auth", "security", "permission", "rls", "csrf", "xss", "ssrf", "secret", "abuse", "bot", "child-safety", "privacy"]),
                  ("12_performance", ["perf", "performance", "benchmark", "optimizer", "webgpu", "wasm", "cache", "lazy", "bundle", "frame", "latency"]),
                  ("13_accessibility", ["accessibility", "a11y", "aria", "screen-reader", "reduced-motion", "focus", "keyboard"]),
                  ("14_observability", ["observability", "metric", "telemetry", "log", "logger", "health", "trace", "monitor", "alert", "sentry"]),
                  ("15_dev_tooling", [".github", ".ci", "script", "config", "tsconfig", "eslint", "prettier", "package.json", "pnpm-lock", "docker"]),
                  ("16_product_operations", ["admin", "moderation", "support", "report", "feature-flag", "announcement", "incident"]),
                  ("17_compliance_policy", ["policy", "privacy", "terms", "cookie", "consent", "delete-data", "export-data", "retention", "license"]),
                  ("18_content_assets", ["asset", "image", "icon", "font", "audio", "video", "model", "media", "manifest", "public"]),
                  ("19_release_management", ["release", "deploy", "rollback", "changelog", "version", "workflow", "ci", "smoke"]),
                  ("20_documentation", ["readme", "docs", ".md", "architecture", "known-issues", "runbook"]),
              ]

              for track, needles in checks:
                  if path_contains(p, needles):
                      tracks.append(track)

              return sorted(set(tracks))

          def classify(path: str) -> Tuple[str, str, str]:
              p = path.replace("\\", "/")
              lower = p.lower()

              if lower.startswith("engins/gameengin/") or lower.startswith("lib/gameengin/"):
                  return "05_build_runtime_state", "active_engine", "whole gameengin source area"
              if lower.startswith("engins/contentengin/") or lower.startswith("lib/contentengin/"):
                  return "05_build_runtime_state", "active_engine", "whole contentengin source area"
              if lower.startswith("engins/codeengin/") or lower.startswith("lib/codeengin/"):
                  return "05_build_runtime_state", "active_engine", "whole codeengin source area"
              if lower.startswith("engins/starmakerengin/") or lower.startswith("engins/music/") or lower.startswith("lib/music/"):
                  return "05_build_runtime_state", "active_engine", "whole starmaker/music source area"
              if lower.startswith("engins/labengin/"):
                  return "05_build_runtime_state", "active_engine", "whole labengin source area"
              if lower.startswith("engins/brandingengin/") or lower.startswith("engins/branding/") or lower.startswith("lib/branding/"):
                  return "05_build_runtime_state", "active_engine", "whole branding source area"
              if lower.startswith("engins/forgeengin/") or lower.startswith("engins/forge/") or lower.startswith("lib/forge/") or lower.startswith("lib/forge-ngn/"):
                  return "05_build_runtime_state", "active_engine", "whole forge source area"
