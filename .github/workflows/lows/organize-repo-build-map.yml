              if lower.startswith("engine/state/"):
                  return "05_build_runtime_state", "loaded_data", "state layer"
              if lower.startswith("engine/sync/"):
                  return "05_build_runtime_state", "sync_state", "sync/offline layer"
              if lower.startswith("engine/vm/"):
                  return "05_build_runtime_state", "active_runtime", "vm/runtime execution"
              if lower.startswith("engine/security/"):
                  return "11_security", "permissions", "security-owned engine code"
              if lower.startswith("engine/orchestration/"):
                  return "06_build_application_behavior", "what_business_rules_run", "orchestration/application behavior"

              if lower.startswith("app/api/"):
                  if any(x in lower for x in ["delete-data", "export-data", "privacy", "policy", "terms"]):
                      return "17_compliance_policy", "export_data_flow", "compliance API route"
                  if any(x in lower for x in ["auth", "login", "logout", "security", "admin"]):
                      return "03_build_backend", "auth", "backend/security API route"
                  return "04_build_api_layer", "routes", "API route"

              if lower.startswith("supabase/migrations/"):
                  return "02_build_data_model", "migration_files", "database migration"
              if lower.startswith("supabase/schema/"):
                  return "02_build_data_model", "database_tables", "database schema"
              if lower.startswith("supabase/"):
                  return "03_build_backend", "database_access", "supabase backend integration"

              if lower.startswith("app/"):
                  if "/page." in lower or lower.endswith("page.tsx") or lower.endswith("page.ts"):
                      if any(x in lower for x in ["privacy", "policy", "terms", "delete", "export"]):
                          return "17_compliance_policy", "privacy_policy", "policy/compliance page"
                      if any(x in lower for x in ["admin", "idari-console", "(internal)"]):
                          return "16_product_operations", "admin_panels", "admin/internal page"
                      return "07_build_pages_screens", "page_files", "Next.js app page"
                  if "/layout." in lower or lower.endswith("layout.tsx") or lower.endswith("layout.ts"):
                      return "07_build_pages_screens", "layout_files", "Next.js layout"
                  if "loading." in lower:
                      return "07_build_pages_screens", "loading_pages", "loading route file"
                  if "error." in lower:
                      return "07_build_pages_screens", "error_pages", "error route file"
                  if "not-found." in lower:
                      return "07_build_pages_screens", "not_found_pages", "not-found route file"
                  return "07_build_pages_screens", "routes", "app router file"

              if lower.startswith("daydreams/") or lower.startswith("coresurfaces/"):
                  return "07_build_pages_screens", "screen_structure", "surface/daydream screen area"

              if lower.startswith("components/ui/"):
                  return "08_build_ui_components", "buttons" if "button" in lower else "component_variants", "ui component"
              if lower.startswith("components/"):
                  if "modal" in lower:
                      return "08_build_ui_components", "modals", "component"
                  if "panel" in lower:
                      return "08_build_ui_components", "panels", "component"
                  if "card" in lower:
                      return "08_build_ui_components", "cards", "component"
                  if "feed" in lower:
                      return "08_build_ui_components", "feed_items", "component"
                  if "nav" in lower:
                      return "08_build_ui_components", "nav_bars", "component"
                  if "avatar" in lower:
                      return "08_build_ui_components", "avatars", "component"
                  if "loader" in lower or "skeleton" in lower:
                      return "08_build_ui_components", "loaders", "component"
                  return "08_build_ui_components", "component_variants", "component"

              if lower.startswith("styles/"):
                  return "08_build_ui_components", "design_tokens", "styles/design tokens"

              if lower.startswith("hooks/"):
                  if any(x in lower for x in ["tap", "drag", "gesture", "touch", "scroll", "swipe", "pinch", "keyboard", "hover", "focus"]):
                      return "09_wire_interactions", "mobile_touch_behavior", "interaction hook"
                  return "05_build_runtime_state", "persisted_local_state", "state/runtime hook"

              if lower.startswith("agents/") or lower.startswith("dr-eams/") or lower.startswith("lib/ai/") or lower.startswith("lib/agents/"):
                  return "06_build_application_behavior", "what_business_rules_run", "agent/application behavior"

              if lower.startswith(".github/workflows/"):
                  return "15_dev_tooling", "ci_workflows", "GitHub Actions workflow"
              if lower.startswith(".github/"):
                  return "15_dev_tooling", "repo_structure_rules", "GitHub repo configuration"
              if lower.startswith(".ci/"):
                  return "15_dev_tooling", "ci_workflows", "CI support"

              if lower.startswith("scripts/"):
                  if any(x in lower for x in ["deploy", "release", "rollback"]):
                      return "19_release_management", "deploy_target", "release script"
                  if "test" in lower or "typecheck" in lower or "lint" in lower:
                      return "10_verify_build_deploy", "test_commands", "verification script"
                  return "15_dev_tooling", "scripts", "developer script"

              if lower.startswith("tests/") or lower.startswith("__tests__/") or ".test." in lower or ".spec." in lower:
                  return "10_verify_build_deploy", "unit_tests", "test file"

              if lower.startswith("docs/") or lower.endswith(".md") or lower.endswith(".mdx"):
                  if any(x in lower for x in ["security", "privacy", "policy", "terms"]):
                      return "17_compliance_policy", "privacy_policy", "policy/compliance doc"
                  if any(x in lower for x in ["release", "deploy", "rollback", "changelog"]):
                      return "19_release_management", "release_checklist", "release doc"
                  return "20_documentation", "feature_docs", "documentation"

              if lower.startswith("public/") or lower.startswith("fonts/") or any(lower.endswith(ext) for ext in [".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg", ".ico", ".mp3", ".wav", ".glb", ".gltf", ".wasm"]):
                  if lower.endswith(".wasm"):
                      return "18_content_assets", "static_files", "wasm/static asset"
                  if "font" in lower or lower.startswith("fonts/"):
                      return "18_content_assets", "fonts", "font asset"
                  if "icon" in lower:
                      return "18_content_assets", "icons", "icon asset"
                  if any(x in lower for x in ["audio", ".mp3", ".wav"]):
                      return "18_content_assets", "audio", "audio asset"
                  if any(x in lower for x in ["model", ".glb", ".gltf"]):
                      return "18_content_assets", "models", "model asset"
                  return "18_content_assets", "static_files", "static/public asset"

              basename = Path(lower).name

              if basename in {"package.json", "pnpm-lock.yaml", "package-lock.json", "yarn.lock", "bun.lockb"}:
                  return "15_dev_tooling", "package_manager", "package manager/dependency file"

              if basename.startswith("tsconfig") or basename in {"eslint.config.mjs", ".eslintrc", ".prettierrc", "tailwind.config.ts", "postcss.config.mjs"}:
                  return "15_dev_tooling", "typecheck_config", "tooling config"

              if basename in {"next.config.mjs", "next.config.js", "vite.config.ts"}:
                  return "15_dev_tooling", "local_setup", "build/tooling config"

              if basename.startswith(".env"):
                  return "15_dev_tooling", "env_examples", "environment example/config"

              if basename.startswith("docker") or basename in {"docker-compose.yml", "docker-compose.yaml"}:
                  return "15_dev_tooling", "local_setup", "local/deploy tooling"

              if "architecture" in lower:
                  return "20_documentation", "architecture_notes", "architecture document"

              if "readme" in lower:
                  return "20_documentation", "setup_docs", "readme/setup document"

              return "06_build_application_behavior", "what_business_rules_run", "fallback: app behavior/business logic"

          def git_files() -> List[str]:
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=REPO)
              return [p for p in raw.decode("utf-8", errors="replace").split("\0") if p]

          files = git_files()
          manifest = []
          counts = Counter()
          area_counts = Counter()
          copied = set()

          cross_links_by_category = defaultdict(list)

          for rel in files:
              src = REPO / rel
              if not src.exists():
                  continue

              category, subfolder, reason = classify(rel)
              area = dreamengin_area(rel)
              secondary = [track for track in secondary_tracks(rel) if track != category]

              dest = ORGANIZED / category / subfolder / safe_part(area) / rel
              dest.parent.mkdir(parents=True, exist_ok=True)

              if src.is_symlink():
                  target = os.readlink(src)
                  if dest.exists() or dest.is_symlink():
                      dest.unlink()
                  os.symlink(target, dest)
              else:
                  shutil.copy2(src, dest)

              copied.add(rel)
              counts[category] += 1
              area_counts[area] += 1

              row = {
                  "source_path": rel,
                  "category": category,
                  "subfolder": subfolder,
                  "dreamengin_area": area,
                  "destination_path": str(dest.relative_to(ORGANIZED)).replace("\\", "/"),
                  "secondary_tracks": secondary,
                  "reason": reason,
              }
              manifest.append(row)

              if secondary:
                  cross_links_by_category[category].append(row)

          missing = sorted(set(files) - copied)
          if missing:
              raise SystemExit("Some tracked files were not copied:\n" + "\n".join(missing[:100]))

          def tree_lines(root: Path) -> List[str]:
              lines = [root.name + "/"]

              def walk(directory: Path, prefix: str = "") -> None:
                  entries = sorted(directory.iterdir(), key=lambda x: (x.is_file(), x.name.lower()))
                  for index, entry in enumerate(entries):
                      connector = "└── " if index == len(entries) - 1 else "├── "
                      lines.append(prefix + connector + entry.name + ("/" if entry.is_dir() else ""))
                      if entry.is_dir():
                          extension = "    " if index == len(entries) - 1 else "│   "
                          walk(entry, prefix + extension)

              walk(root)
              return lines

          tree_output = []
          tree_output.append("DREAMENGIN ORGANIZED REPOSITORY FILE TREE")
          tree_output.append("")
          tree_output.append("This file is a separate download from the organized repository ZIP.")
          tree_output.append("The organized repository ZIP contains only organized-repository/ with the 20 category folders.")
          tree_output.append("")
          tree_output.append(f"Total tracked files copied: {len(copied)}")
          tree_output.append("")
          tree_output.append("CATEGORY COUNTS")
          tree_output.append("")

          for category in CATEGORIES:
              tree_output.append(f"- {category}: {counts[category]} files")

          tree_output.append("")
          tree_output.append("DREAMENGIN AREA COUNTS")
          tree_output.append("")

          for area, count in sorted(area_counts.items()):
              tree_output.append(f"- {area}: {count} files")

          tree_output.append("")
          tree_output.append("ORGANIZED FILE TREE")
          tree_output.append("")
          tree_output.extend(tree_lines(ORGANIZED))

          tree_output.append("")
          tree_output.append("CROSS-LINKED FILES")
          tree_output.append("")
          tree_output.append("Files are copied once into their primary category. This section lists files that also tie to other support tracks.")
          tree_output.append("")

          any_cross_links = False
          for category in CATEGORIES:
              rows = cross_links_by_category.get(category, [])
              if not rows:
                  continue

              any_cross_links = True
              tree_output.append(f"{category}")
              for row in rows:
                  tree_output.append(f"  - {row['source_path']}")
                  tree_output.append(f"    primary: {row['category']}/{row['subfolder']}")
                  tree_output.append(f"    dreamengin_area: {row['dreamengin_area']}")
                  tree_output.append(f"    also_ties_to: {', '.join(row['secondary_tracks'])}")
              tree_output.append("")

          if not any_cross_links:
              tree_output.append("No cross-linked files found.")

          TREE_FILE.write_text("\n".join(tree_output) + "\n", encoding="utf-8")

          MANIFEST_JSON.write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          with MANIFEST_CSV.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "source_path",
                      "category",
                      "subfolder",
                      "dreamengin_area",
                      "destination_path",
                      "secondary_tracks",
                      "reason",
                  ],
              )
              writer.writeheader()
              for row in manifest:
                  csv_row = dict(row)
                  csv_row["secondary_tracks"] = ";".join(row["secondary_tracks"])
                  writer.writerow(csv_row)

          def zip_with_empty_dirs(source_root: Path, zip_path: Path) -> None:
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
                  for path in sorted(source_root.rglob("*")):
                      arcname = path.relative_to(source_root.parent).as_posix()
                      if path.is_dir():
                          z.writestr(arcname.rstrip("/") + "/", "")
                      elif path.is_symlink():
                          z.writestr(arcname, os.readlink(path))
                      else:
                          z.write(path, arcname)

          zip_with_empty_dirs(ORGANIZED, ZIP_PATH)

          top = sorted([p.name for p in ORGANIZED.iterdir() if p.is_dir()])
          if len(top) != 20:
              raise SystemExit(f"Expected 20 top-level folders in organized repository, found {len(top)}")

          print("")
          print("ORGANIZED REPOSITORY CREATED")
          print(f"Tracked files copied: {len(copied)}")
          print(f"Repository ZIP: {ZIP_PATH.relative_to(REPO)}")
          print(f"Separate file tree: {TREE_FILE.relative_to(REPO)}")
          print("")
          print("20 TOP-LEVEL FOLDERS")
          for item in top:
              print(item)
          print("")
          print("CATEGORY COUNTS")
          for category in CATEGORIES:
              print(f"{category}: {counts[category]}")
          PY

      - name: Print organized file tree in workflow log
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Organized file tree"
          cat _organized_repo_artifact/organized_file_tree.txt
          echo "::endgroup::"

      - name: Upload organized repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.organized_repo_artifact_name }}
          path: _organized_repo_artifact/dreamengin-organized-repository.zip
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Upload organized file tree TXT
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.file_tree_artifact_name }}
          path: _organized_repo_artifact/organized_file_tree.txt
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
