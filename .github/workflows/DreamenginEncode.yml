name: DREAMengin Encode Codebase

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  encode-codebase:
    name: Encode application codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Encode codebase using DREAMengin dictionaries
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifact/encoded-codebase
          mkdir -p artifact
          mkdir -p artifact/encoded-codebase

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const { execFileSync } = require("child_process");

          const ROOT = process.cwd();

          const PROGRAMMING_MAP_FILE = path.join(ROOT, "deepseek_json_20260701_3ac1d7.json");
          const DREAM_MAP_FILE = path.join(ROOT, "Dreamengin.names.json");

          const OUT_DIR = path.join(ROOT, "artifact", "encoded-codebase");
          const ZIP_FILE = path.join(ROOT, "artifact", "Dreamengin.encoded-codebase.zip");
          const MANIFEST_FILE = path.join(ROOT, "artifact", "encoding-manifest.json");

          const SOURCE_EXTS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".css",
            ".scss",
            ".sass",
            ".json",
            ".md",
            ".mdx"
          ]);

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            "node_modules",
            ".next",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".vercel",
            "public",
            "artifact"
          ]);

          const SKIP_FILES = new Set([
            "package-lock.json",
            "pnpm-lock.yaml",
            "yarn.lock",
            "bun.lockb",
            "deepseek_json_20260701_3ac1d7.json",
            "Dreamengin.names.json"
          ]);

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          function normalize(value) {
            return String(value || "").replace(/\\/g, "/");
          }

          function relativeFile(file) {
            return normalize(path.relative(ROOT, file));
          }

          function sha256(value) {
            return crypto.createHash("sha256").update(value).digest("hex");
          }

          function readJson(file) {
            if (!fs.existsSync(file)) {
              fail(`Missing required reference JSON: ${relativeFile(file)}`);
            }

            return JSON.parse(fs.readFileSync(file, "utf8"));
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) {
                  walk(full, out);
                }
                continue;
              }

              if (!entry.isFile()) continue;
              if (SKIP_FILES.has(entry.name)) continue;
              if (!SOURCE_EXTS.has(path.extname(entry.name))) continue;

              out.push(full);
            }

            return out;
          }

          function invertCodeMap(map, prefix) {
            const wordToCode = new Map();
            const codeToWord = {};

            for (const [code, word] of Object.entries(map)) {
              if (code === "__legend") continue;
              if (!code.startsWith(prefix)) continue;
              if (typeof word !== "string") continue;
              if (!word) continue;

              codeToWord[code] = word;

              if (!wordToCode.has(word)) {
                wordToCode.set(word, code);
              }
            }

            return { wordToCode, codeToWord };
          }

          function buildEncoder(programmingJson, dreamJson) {
            const programming = invertCodeMap(programmingJson, "T");
            const dream = invertCodeMap(dreamJson, "D");

            const wordToCode = new Map();

            // DREAMengin vocabulary wins if the same text appears in both maps.
            for (const [word, code] of programming.wordToCode.entries()) {
              wordToCode.set(word, code);
            }

            for (const [word, code] of dream.wordToCode.entries()) {
              wordToCode.set(word, code);
            }

            const words = [...wordToCode.keys()]
              .filter(Boolean)
              .sort((a, b) =>
                Array.from(b).length - Array.from(a).length ||
                b.localeCompare(a)
              );

            const escaped = words.map((word) =>
              word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
            );

            const pattern = new RegExp(
              `(?<![A-Za-z0-9_$])(${escaped.join("|")})(?![A-Za-z0-9_$])`,
              "g"
            );

            return {
              programmingCount: Object.keys(programming.codeToWord).length,
              dreamCount: Object.keys(dream.codeToWord).length,
              totalWordCount: words.length,
              encode(text) {
                let replacementCount = 0;
                const used = new Map();

                const encoded = String(text).replace(pattern, (match) => {
                  const code = wordToCode.get(match);

                  if (!code) {
                    return match;
                  }

                  replacementCount += 1;
                  used.set(code, (used.get(code) || 0) + 1);

                  return code;
                });

                return {
                  encoded,
                  replacementCount,
                  usedCodes: Object.fromEntries(
                    [...used.entries()].sort(([a], [b]) =>
                      a.localeCompare(b, undefined, { numeric: true })
                    )
                  )
                };
              }
            };
          }

          function ensureParentDir(file) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
          }

          function makeDuplicateFilePlaceholder(entry, canonicalEntry) {
            return [
              "DREAMENGIN_DUPLICATE_FILE_REF",
              `file=${entry.rel}`,
              `canonical=${canonicalEntry.rel}`,
              `encodedSha256=${entry.encodedSha256}`,
              `originalSha256=${entry.originalSha256}`,
              `originalBytes=${entry.originalBytes}`,
              `canonicalEncodedBytes=${canonicalEntry.encodedBytes}`,
              ""
            ].join("\n");
          }

          const programmingJson = readJson(PROGRAMMING_MAP_FILE);
          const dreamJson = readJson(DREAM_MAP_FILE);
          const encoder = buildEncoder(programmingJson, dreamJson);

          const files = walk(ROOT).sort();
          const manifestFiles = [];

          let totalReplacementCount = 0;

          const encodedEntries = [];
          const canonicalByEncodedHash = new Map();

          for (const file of files) {
            const rel = relativeFile(file);
            const original = fs.readFileSync(file, "utf8");
            const result = encoder.encode(original);

            const encodedSha256 = sha256(result.encoded);
            const originalSha256 = sha256(original);

            const entry = {
              rel,
              originalSha256,
              encodedSha256,
              originalBytes: Buffer.byteLength(original),
              encodedBytes: Buffer.byteLength(result.encoded),
              replacementCount: result.replacementCount,
              usedCodes: result.usedCodes,
              encoded: result.encoded
            };

            if (!canonicalByEncodedHash.has(encodedSha256)) {
              canonicalByEncodedHash.set(encodedSha256, entry);
            }

            encodedEntries.push(entry);
            totalReplacementCount += result.replacementCount;
          }

          let duplicateFileRefs = 0;
          let duplicateRawBytesReplaced = 0;
          let duplicateEncodedBytesReplaced = 0;
          let duplicatePlaceholderBytes = 0;

          const duplicateGroups = new Map();

          for (const entry of encodedEntries) {
            const canonicalEntry = canonicalByEncodedHash.get(entry.encodedSha256);
            const outFile = path.join(OUT_DIR, entry.rel);

            ensureParentDir(outFile);

            const isDuplicate = canonicalEntry.rel !== entry.rel;

            let writtenText;

            if (isDuplicate) {
              writtenText = makeDuplicateFilePlaceholder(entry, canonicalEntry);

              duplicateFileRefs += 1;
              duplicateRawBytesReplaced += entry.originalBytes;
              duplicateEncodedBytesReplaced += entry.encodedBytes;
              duplicatePlaceholderBytes += Buffer.byteLength(writtenText);

              if (!duplicateGroups.has(entry.encodedSha256)) {
                duplicateGroups.set(entry.encodedSha256, {
                  encodedSha256: entry.encodedSha256,
                  originalSha256: entry.originalSha256,
                  canonicalFile: canonicalEntry.rel,
                  canonicalEncodedBytes: canonicalEntry.encodedBytes,
                  canonicalOriginalBytes: canonicalEntry.originalBytes,
                  duplicateFiles: [],
                  duplicateCount: 0,
                  duplicateRawBytesReplaced: 0,
                  duplicateEncodedBytesReplaced: 0,
                  duplicatePlaceholderBytes: 0
                });
              }

              const group = duplicateGroups.get(entry.encodedSha256);
              group.duplicateFiles.push(entry.rel);
              group.duplicateCount += 1;
              group.duplicateRawBytesReplaced += entry.originalBytes;
              group.duplicateEncodedBytesReplaced += entry.encodedBytes;
              group.duplicatePlaceholderBytes += Buffer.byteLength(writtenText);
            } else {
              writtenText = entry.encoded;
            }

            fs.writeFileSync(outFile, writtenText);

            manifestFiles.push({
              file: entry.rel,
              encodedFile: normalize(path.relative(ROOT, outFile)),
              duplicateFileRef: isDuplicate,
              canonicalFile: isDuplicate ? canonicalEntry.rel : null,
              originalSha256: entry.originalSha256,
              encodedSha256: entry.encodedSha256,
              originalBytes: entry.originalBytes,
              encodedBytes: entry.encodedBytes,
              writtenBytes: Buffer.byteLength(writtenText),
              replacementCount: entry.replacementCount,
              usedCodes: entry.usedCodes
            });
          }

          const duplicateGroupsOutput = [...duplicateGroups.values()]
            .map((group) => ({
              ...group,
              duplicateFiles: group.duplicateFiles.sort(),
              duplicateNetEncodedBytesSaved:
                group.duplicateEncodedBytesReplaced - group.duplicatePlaceholderBytes
            }))
            .sort((a, b) =>
              b.duplicateNetEncodedBytesSaved - a.duplicateNetEncodedBytesSaved ||
              a.canonicalFile.localeCompare(b.canonicalFile)
            );

          const manifest = {
            generatedAt: new Date().toISOString(),
            referenceFiles: {
              programmingMap: relativeFile(PROGRAMMING_MAP_FILE),
              dreamMap: relativeFile(DREAM_MAP_FILE)
            },
            output: {
              encodedDirectory: normalize(path.relative(ROOT, OUT_DIR)),
              zipFile: normalize(path.relative(ROOT, ZIP_FILE))
            },
            counts: {
              sourceFilesEncoded: files.length,
              programmingReferenceTerms: encoder.programmingCount,
              dreamReferenceTerms: encoder.dreamCount,
              totalReferenceTerms: encoder.totalWordCount,
              totalReplacementCount,
              duplicateFileRefs,
              duplicateGroups: duplicateGroupsOutput.length,
              duplicateRawBytesReplaced,
              duplicateEncodedBytesReplaced,
              duplicatePlaceholderBytes,
              duplicateNetEncodedBytesSaved:
                duplicateEncodedBytesReplaced - duplicatePlaceholderBytes
            },
            duplicateGroups: duplicateGroupsOutput,
            files: manifestFiles
          };

          fs.writeFileSync(MANIFEST_FILE, JSON.stringify(manifest, null, 2));

          execFileSync("zip", ["-9qr", ZIP_FILE, "."], {
            cwd: OUT_DIR,
            stdio: "inherit"
          });

          console.log(`Encoded ${files.length} files.`);
          console.log(`Total replacements: ${totalReplacementCount}`);
          console.log(`Duplicate file refs: ${duplicateFileRefs}`);
          console.log(`Duplicate groups: ${duplicateGroupsOutput.length}`);
          console.log(`Duplicate encoded bytes replaced: ${duplicateEncodedBytesReplaced}`);
          console.log(`Duplicate placeholder bytes: ${duplicatePlaceholderBytes}`);
          console.log(`Duplicate net encoded bytes saved: ${duplicateEncodedBytesReplaced - duplicatePlaceholderBytes}`);
          console.log(`Wrote ${normalize(path.relative(ROOT, ZIP_FILE))}`);
          console.log(`Wrote ${normalize(path.relative(ROOT, MANIFEST_FILE))}`);
          NODE

      - name: Upload encoded codebase zip
        uses: actions/upload-artifact@v6
        with:
          name: Dreamengin-encoded-codebase
          path: artifact/Dreamengin.encoded-codebase.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload encoding manifest
        uses: actions/upload-artifact@v6
        with:
          name: Dreamengin-encoding-manifest
          path: artifact/encoding-manifest.json
          if-no-files-found: error
