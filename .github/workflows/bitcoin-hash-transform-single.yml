name: Bitcoin Hash Transform — Live Test

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "Number of recent main-chain blocks to fetch"
        required: false
        default: "300"
      n:
        description: "Exponent n in f(x)"
        required: false
        default: "2.0"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    env:
      BLOCK_COUNT: ${{ inputs.blocks || '300' }}
      N_EXPONENT: ${{ inputs.n || '2.0' }}
      A0: "1.2e-14"

    steps:
      - name: Fetch, transform, print, and save real Bitcoin data
        continue-on-error: true
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          import csv
          import json
          import math
          import os
          import sys
          import time
          import traceback
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BLOCK_COUNT = max(1, int(os.environ.get("BLOCK_COUNT", "300")))
          N_EXPONENT = float(os.environ.get("N_EXPONENT", "2.0"))
          A0 = float(os.environ.get("A0", "1.2e-14"))
          REQUEST_PAUSE_SECONDS = 0.15

          API_BASES = [
              "https://blockstream.info/api",
              "https://mempool.space/api",
          ]

          CSV_PATH = Path("bitcoin_hash_transform_results.csv")
          TXT_PATH = Path("bitcoin_hash_transform_report.txt")
          JSON_PATH = Path("bitcoin_hash_transform_status.json")

          def emit(text=""):
              print(text, flush=True)

          def http_get_text(path, attempts_per_provider=4):
              errors = []

              for base in API_BASES:
                  url = base.rstrip("/") + "/" + path.lstrip("/")

                  for attempt in range(1, attempts_per_provider + 1):
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-bitcoin-hash-transform/1.0",
                              "Accept": "application/json,text/plain",
                          },
                      )

                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              return response.read().decode("utf-8"), base

                      except Exception as exc:
                          errors.append(f"{url}: {type(exc).__name__}: {exc}")
                          delay = min(8.0, 0.75 * (2 ** (attempt - 1)))
                          emit(
                              f"[retry] provider={base} attempt={attempt}/"
                              f"{attempts_per_provider} wait={delay:.2f}s error={exc}"
                          )
                          time.sleep(delay)

              raise RuntimeError(
                  "All live API providers were unavailable.\n" + "\n".join(errors)
              )

          def http_get_json(path):
              text, provider = http_get_text(path)
              return json.loads(text), provider

          def fetch_recent_blocks(count):
              tip_text, provider = http_get_text("/blocks/tip/height")
              tip_height = int(tip_text.strip())

              emit(f"[live] provider={provider}")
              emit(f"[live] reported_tip_height={tip_height}")

              blocks_by_height = {}
              start_height = tip_height

              while len(blocks_by_height) < count and start_height >= 0:
                  batch, provider = http_get_json(f"/blocks/{start_height}")

                  if not isinstance(batch, list) or not batch:
                      raise RuntimeError(
                          f"Unexpected empty block response at height {start_height}"
                      )

                  for block in batch:
                      blocks_by_height[int(block["height"])] = block

                  lowest = min(int(block["height"]) for block in batch)
                  start_height = lowest - 1

                  emit(
                      f"[live] fetched={min(len(blocks_by_height), count)}/"
                      f"{count} lowest_height={lowest}"
                  )
                  time.sleep(REQUEST_PAUSE_SECONDS)

              chosen_heights = sorted(blocks_by_height, reverse=True)[:count]
              blocks = [blocks_by_height[height] for height in chosen_heights]
              blocks.sort(key=lambda block: int(block["height"]))
              return blocks, provider, tip_height

          def target_from_bits(bits):
              bits = int(bits)
              exponent = bits >> 24
              coefficient = bits & 0x007FFFFF

              if exponent <= 3:
                  return coefficient >> (8 * (3 - exponent))
              return coefficient << (8 * (exponent - 3))

          def transform(x):
              return A0 * x / ((1.0 + x ** N_EXPONENT) ** (1.0 / N_EXPONENT))

          def hamming_distance(left_hex, right_hex):
              return (int(left_hex, 16) ^ int(right_hex, 16)).bit_count()

          def lag1_correlation(values):
              if len(values) < 3:
                  return float("nan")

              xs = values[:-1]
              ys = values[1:]
              mean_x = sum(xs) / len(xs)
              mean_y = sum(ys) / len(ys)

              numerator = sum(
                  (x - mean_x) * (y - mean_y)
                  for x, y in zip(xs, ys)
              )
              dx = sum((x - mean_x) ** 2 for x in xs)
              dy = sum((y - mean_y) ** 2 for y in ys)
              denominator = math.sqrt(dx * dy)

              return numerator / denominator if denominator else float("nan")

          def uniform_ks_statistic(values):
              ordered = sorted(values)
              count = len(ordered)

              if count == 0:
                  return float("nan")

              d_plus = max(
                  (index + 1) / count - value
                  for index, value in enumerate(ordered)
              )
              d_minus = max(
                  value - index / count
                  for index, value in enumerate(ordered)
              )
              return max(d_plus, d_minus)

          status = {
              "completed": False,
              "live_data": False,
              "rows": 0,
              "message": "",
          }

          try:
              if N_EXPONENT <= 0:
                  raise ValueError("N_EXPONENT must be positive")

              blocks, provider, tip_height = fetch_recent_blocks(BLOCK_COUNT)

              rows = []
              previous_hash = None
              full_space_max = (1 << 256) - 1

              for block in blocks:
                  block_hash = str(block["id"])
                  hash_integer = int(block_hash, 16)
                  bits = int(block["bits"])
                  target = target_from_bits(bits)

                  x_full = hash_integer / full_space_max
                  x_target = hash_integer / target

                  y1 = transform(x_target)
                  y2 = transform(y1)
                  y3 = transform(y2)

                  timestamp = int(block["timestamp"])
                  utc_time = datetime.fromtimestamp(
                      timestamp, timezone.utc
                  ).isoformat()

                  hamming = (
                      hamming_distance(previous_hash, block_hash)
                      if previous_hash is not None
                      else None
                  )

                  rows.append(
                      {
                          "height": int(block["height"]),
                          "timestamp_utc": utc_time,
                          "hash": block_hash,
                          "previousblockhash": block.get(
                              "previousblockhash", ""
                          ),
                          "bits_hex": f"{bits:08x}",
                          "target_integer": target,
                          "hash_integer": hash_integer,
                          "pow_valid": hash_integer <= target,
                          "x_full_space": x_full,
                          "x_target_normalized": x_target,
                          "f_x_target": y1,
                          "f2_x_target": y2,
                          "f3_x_target": y3,
                          "hamming_to_previous_hash": hamming,
                      }
                  )

                  previous_hash = block_hash

              fieldnames = list(rows[0].keys())
              with CSV_PATH.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)

              x_values = [row["x_target_normalized"] for row in rows]
              y_values = [row["f_x_target"] for row in rows]
              y2_values = [row["f2_x_target"] for row in rows]
              hamming_values = [
                  row["hamming_to_previous_hash"]
                  for row in rows
                  if row["hamming_to_previous_hash"] is not None
              ]

              mean_x = sum(x_values) / len(x_values)
              lag_corr = lag1_correlation(x_values)
              ks_d = uniform_ks_statistic(x_values)
              ks_boundary = 1.36 / math.sqrt(len(x_values))
              mean_hamming = (
                  sum(hamming_values) / len(hamming_values)
                  if hamming_values
                  else float("nan")
              )
              all_pow_valid = all(row["pow_valid"] for row in rows)

              report_lines = [
                  "BITCOIN HASH TRANSFORM — REAL LIVE DATA",
                  "=" * 88,
                  f"provider: {provider}",
                  f"reported_tip_height: {tip_height}",
                  f"rows: {len(rows)}",
                  f"height_range: {rows[0]['height']}..{rows[-1]['height']}",
                  f"n: {N_EXPONENT}",
                  f"a0: {A0:.12e}",
                  f"all_pow_valid: {all_pow_valid}",
                  f"mean_hash_over_target: {mean_x:.12f}",
                  f"lag1_correlation: {lag_corr:.12f}",
                  f"uniform_ks_D: {ks_d:.12f}",
                  f"approx_5pct_ks_boundary: {ks_boundary:.12f}",
                  f"mean_hamming_distance: {mean_hamming:.6f}",
                  f"min_f_x_target: {min(y_values):.12e}",
                  f"max_f_x_target: {max(y_values):.12e}",
                  f"max_f2_x_target: {max(y2_values):.12e}",
                  "",
                  "height | timestamp_utc | hash | x_target | f(x) | f2(x) | f3(x) | hamming",
                  "-" * 220,
              ]

              for row in rows:
                  report_lines.append(
                      f"{row['height']} | "
                      f"{row['timestamp_utc']} | "
                      f"{row['hash']} | "
                      f"{row['x_target_normalized']:.15f} | "
                      f"{row['f_x_target']:.15e} | "
                      f"{row['f2_x_target']:.15e} | "
                      f"{row['f3_x_target']:.15e} | "
                      f"{row['hamming_to_previous_hash']}"
                  )

              report = "\n".join(report_lines) + "\n"
              TXT_PATH.write_text(report, encoding="utf-8")

              status.update(
                  {
                      "completed": True,
                      "live_data": True,
                      "rows": len(rows),
                      "provider": provider,
                      "tip_height": tip_height,
                      "height_start": rows[0]["height"],
                      "height_end": rows[-1]["height"],
                      "all_pow_valid": all_pow_valid,
                      "message": "Live Bitcoin data fetched and transformed.",
                  }
              )

              emit()
              emit(report)

              github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if github_summary:
                  summary_lines = [
                      "# Bitcoin hash transform",
                      "",
                      f"- Live provider: `{provider}`",
                      f"- Rows: `{len(rows)}`",
                      f"- Heights: `{rows[0]['height']}..{rows[-1]['height']}`",
                      f"- All proof-of-work checks valid: `{all_pow_valid}`",
                      f"- Mean `hash / target`: `{mean_x:.12f}`",
                      f"- Lag-1 correlation: `{lag_corr:.12f}`",
                      f"- Mean Hamming distance: `{mean_hamming:.6f}`",
                      "",
                      "The complete text table is in the workflow log and "
                      "`bitcoin_hash_transform_report.txt`.",
                  ]
                  with open(github_summary, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(summary_lines) + "\n")

          except Exception as exc:
              error_text = "".join(
                  traceback.format_exception(type(exc), exc, exc.__traceback__)
              )

              status.update(
                  {
                      "completed": False,
                      "live_data": False,
                      "rows": 0,
                      "message": str(exc),
                      "traceback": error_text,
                  }
              )

              report = (
                  "BITCOIN HASH TRANSFORM — NO SUBSTITUTE DATA GENERATED\n"
                  + "=" * 68
                  + "\n"
                  + "The live request did not complete. The workflow remains "
                    "non-failing by design.\n\n"
                  + error_text
              )
              TXT_PATH.write_text(report, encoding="utf-8")

              emit()
              emit(report)

              github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if github_summary:
                  with open(github_summary, "a", encoding="utf-8") as handle:
                      handle.write(
                          "# Bitcoin hash transform\n\n"
                          "Live data was unavailable. No synthetic or fallback "
                          "dataset was generated. See the workflow log and text "
                          "report for the exact error.\n"
                      )

          finally:
              JSON_PATH.write_text(
                  json.dumps(status, indent=2, sort_keys=True),
                  encoding="utf-8",
              )
              emit()
              emit("STATUS JSON")
              emit("-----------")
              emit(JSON_PATH.read_text(encoding="utf-8"))
              emit()
              emit("Workflow exit policy: always return success; inspect status.json.")
              sys.exit(0)
          PY

          exit 0

      - name: Upload generated text, CSV, and status
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-hash-transform-${{ github.run_number }}
          path: |
            bitcoin_hash_transform_report.txt
            bitcoin_hash_transform_results.csv
            bitcoin_hash_transform_status.json
          if-no-files-found: ignore
          retention-days: 30
