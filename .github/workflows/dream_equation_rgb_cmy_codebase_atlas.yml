name: DREAM Equation-Generated RGB-CMY Codebase Atlas
run-name: DREAM Equation-Generated RGB-CMY Codebase Atlas

"on":
  workflow_dispatch:
    inputs:
      maximum_dimension:
        description: "Maximum width/height of the one-image recovery artifact"
        required: false
        default: "16000"
        type: string
      jpeg_quality:
        description: "JPEG quality used by the resilience proof"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

concurrency:
  group: dream-equation-rgb-cmy-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-equation-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codec runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "Pillow>=10,<13" \
            "numpy>=2,<3" \
            "scipy>=1.13,<2" \
            "reedsolo>=1.7,<2"

      - name: Materialize the self-contained atlas codec
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > "$RUNNER_TEMP/dream_phi_rgb_cmy_frequency_codec.py" <<'B64'
