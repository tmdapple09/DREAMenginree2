      - name: Build the one-image codebase atlas
        shell: bash
        env:
          MAXIMUM_DIMENSION: ${{ inputs.maximum_dimension }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/dream-atlas-output"
          mkdir -p "$GITHUB_WORKSPACE/dream-atlas-output"

          python "$RUNNER_TEMP/dream_phi_rgb_cmy_frequency_codec.py" build \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/dream-atlas-output/DREAM_CODEBASE_SPATIAL_ATLAS.png" \
            --maximum-dimension "$MAXIMUM_DIMENSION" \
            | tee "$RUNNER_TEMP/dream-atlas-build.json"

      - name: Prove exact syntax recovery
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/dream-atlas-output/DREAM_CODEBASE_SPATIAL_ATLAS.png"
          PROOF_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PROOF_ROOT"' EXIT

          mkdir -p "$PROOF_ROOT/source-image"
          cp "$IMAGE" "$PROOF_ROOT/source-image/DREAM_CODEBASE_SPATIAL_ATLAS.png"

          python "$RUNNER_TEMP/dream_phi_rgb_cmy_frequency_codec.py" restore \
            "$PROOF_ROOT/source-image/DREAM_CODEBASE_SPATIAL_ATLAS.png" \
            "$PROOF_ROOT/rebuilt"

          cat > "$RUNNER_TEMP/verify_exact_tree.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          source = Path(sys.argv[1]).resolve()
          rebuilt = Path(sys.argv[2]).resolve()

          tracked = subprocess.run(
              [
                  "git",
                  "-C",
                  str(source),
                  "ls-files",
                  "-z",
                  "--recurse-submodules",
              ],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout

          expected: set[str] = set()

          for raw in tracked.split(b"\0"):
              if not raw:
                  continue

              relative_text = raw.decode(
                  "utf-8",
                  "surrogateescape",
              )
              relative = PurePosixPath(relative_text)
              original = source.joinpath(*relative.parts)

              if original.is_dir() and not original.is_symlink():
                  continue

              key = relative.as_posix()
              expected.add(key)
              restored = rebuilt.joinpath(*relative.parts)

              if original.is_symlink():
                  if not restored.is_symlink():
                      raise SystemExit(f"missing symlink: {key}")
                  if os.readlink(original) != os.readlink(restored):
                      raise SystemExit(f"symlink mismatch: {key}")
                  continue

              if not restored.is_file() or restored.is_symlink():
                  raise SystemExit(f"missing file: {key}")

              if hashlib.sha256(
                  original.read_bytes()
              ).digest() != hashlib.sha256(
                  restored.read_bytes()
              ).digest():
                  raise SystemExit(f"byte mismatch: {key}")

              original_mode = stat.S_IMODE(
                  os.lstat(original).st_mode
              )
              restored_mode = stat.S_IMODE(
                  os.lstat(restored).st_mode
              )
              if original_mode != restored_mode:
                  raise SystemExit(f"mode mismatch: {key}")

          actual: set[str] = set()

          for directory, dirnames, filenames in os.walk(
              rebuilt,
              followlinks=False,
          ):
              base = Path(directory)

              for dirname in list(dirnames):
                  item = base / dirname
                  if item.is_symlink():
                      actual.add(
                          item.relative_to(rebuilt).as_posix()
                      )
                      dirnames.remove(dirname)

              for filename in filenames:
                  actual.add(
                      (base / filename)
                      .relative_to(rebuilt)
                      .as_posix()
                  )

          if expected != actual:
              raise SystemExit(
                  "tree mismatch; "
                  f"missing={sorted(expected - actual)[:20]} "
                  f"extra={sorted(actual - expected)[:20]}"
              )

          print(f"EXACT_CODEBASE_RECOVERY_OK entries={len(expected)}")
          PY

          python "$RUNNER_TEMP/verify_exact_tree.py" \
            "$GITHUB_WORKSPACE" \
            "$PROOF_ROOT/rebuilt"

      - name: Prove RGB-CMY resilience after JPEG and resizing
        shell: bash
        env:
          JPEG_QUALITY: ${{ inputs.jpeg_quality }}
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/dream-atlas-output/DREAM_CODEBASE_SPATIAL_ATLAS.png"
          PROOF_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PROOF_ROOT"' EXIT

          python - "$IMAGE" "$PROOF_ROOT" "$RUNNER_TEMP/dream-atlas-build.json" "$JPEG_QUALITY" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from PIL import Image

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          build_info = json.loads(
              Path(sys.argv[3]).read_text(encoding="utf-8")
          )
          quality = int(sys.argv[4])

          image = Image.open(source).convert("RGB")
          image.save(
              output / "atlas-q.jpg",
              quality=quality,
              subsampling=0,
              optimize=True,
          )

          carrier_side = int(build_info["carrierSide"])
          target_side = max(
              carrier_side,
              int(min(image.size) * 0.85),
          )
          resized = image.resize(
              (target_side, target_side),
              Image.Resampling.LANCZOS,
          )
          resized.save(
              output / "atlas-resized-q.jpg",
              quality=quality,
              subsampling=0,
              optimize=True,
          )
          PY

          python "$RUNNER_TEMP/dream_phi_rgb_cmy_frequency_codec.py" restore \
            "$PROOF_ROOT/atlas-q.jpg" \
            "$PROOF_ROOT/jpeg-rebuilt"

          python "$RUNNER_TEMP/verify_exact_tree.py" \
            "$GITHUB_WORKSPACE" \
            "$PROOF_ROOT/jpeg-rebuilt"

          python "$RUNNER_TEMP/dream_phi_rgb_cmy_frequency_codec.py" restore \
            "$PROOF_ROOT/atlas-resized-q.jpg" \
            "$PROOF_ROOT/resized-rebuilt"

          python "$RUNNER_TEMP/verify_exact_tree.py" \
            "$GITHUB_WORKSPACE" \
            "$PROOF_ROOT/resized-rebuilt"

      - name: Upload the one-image recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREAM_CODEBASE_SPATIAL_ATLAS
          path: dream-atlas-output/DREAM_CODEBASE_SPATIAL_ATLAS.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
