name: Build DREAMengin Interface Behavior Codebase

on:
  workflow_dispatch:
    inputs:
      install_command:
        description: Dependency install command
        required: true
        default: pnpm install --frozen-lockfile
      build_command:
        description: Production build command
        required: true
        default: pnpm build
      start_command:
        description: Production start command for optional render evidence
        required: true
        default: pnpm exec next start -p 3000
      base_url:
        description: Local URL served by start_command for optional render evidence
        required: true
        default: http://127.0.0.1:3000

permissions:
  contents: read

jobs:
  build-interface-behavior-codebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable package manager shims
        run: corepack enable

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Install interface compiler tools
        run: |
          node -e "require('node:fs').mkdirSync('__interface_tools__',{recursive:true});require('node:fs').writeFileSync('__interface_tools__/package.json','{\"type\":\"commonjs\"}')"
          npm --prefix __interface_tools__ install @babel/parser@latest playwright@latest --no-package-lock --silent
          npx --prefix __interface_tools__ playwright install chromium

      - name: Compile source-owned interface behavior codebase
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, "__interface_codebase__");
          const FULL_CODEBASE_FILE = path.join(ROOT, "__FULL_CODEBASE.codebase");
          const INDEX_FILE = path.join(ROOT, "__INTERFACE_INDEX.json");
          const requireTools = createRequire(path.join(ROOT, "__interface_tools__", "package.json"));
          const parser = requireTools("@babel/parser");

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            ".ci",
            "node_modules",
            ".next",
            "out",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".cache",
            "__interface_tools__",
            "__interface_codebase__"
          ]);

          const TEXT_EXTS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".css",
            ".scss",
            ".sass",
            ".sql",
            ".json",
            ".yml",
            ".yaml",
            ".toml",
            ".md",
            ".mdx"
          ]);

          const PARSE_EXTS = new Set([".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]);
          const JSX_EXTS = new Set([".tsx", ".jsx", ".mdx"]);

          function posix(value) {
            return value.split(path.sep).join("/");
          }

          function ext(rel) {
            return path.posix.extname(rel).toLowerCase();
          }

          function sha16(value) {
            return crypto.createHash("sha256").update(value).digest("hex").slice(0, 16);
          }

          function b64url(value) {
            return Buffer.from(String(value), "utf8").toString("base64url");
          }

          function byteLen(value) {
            return Buffer.byteLength(value, "utf8");
          }

          function byteAt(source, charIndex) {
            return byteLen(source.slice(0, charIndex));
          }

          function cleanWords(value) {
            return String(value ?? "")
              .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
              .replace(/[_./:-]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function titleCase(value) {
            return cleanWords(value).replace(/\b\w/g, (m) => m.toUpperCase());
          }

          function sanitize(value, fallback = "Source") {
            const clean = titleCase(value)
              .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
              .replace(/\.$/, "")
              .slice(0, 96)
              .trim();

            return clean || fallback;
          }

          function sourceNoun(rel) {
            const base = path.posix.basename(rel || "").replace(/\.(tsx|jsx|ts|js|mjs|cjs|css|scss|sass|sql|json|md|mdx)$/i, "");
            const parent = path.posix.basename(path.posix.dirname(rel || ""));

            if (/^(page|layout|index|route|loading|error|not-found)$/i.test(base)) {
              return sanitize(parent || base);
            }

            return sanitize(base || parent || "Source");
          }

          const GENERIC_NAMES = new Set([
            "div",
            "span",
            "main",
            "section",
            "article",
            "header",
            "footer",
            "aside",
            "nav",
            "form",
            "button",
            "input",
            "select",
            "textarea",
            "label",
            "fragment",
            "provider",
            "context",
            "wrapper",
            "container",
            "content",
            "layout",
            "page",
            "default",
            "module",
            "anonymous"
          ]);

          function usableName(value) {
            const name = sanitize(value, "");
            if (!name) return "";
            if (GENERIC_NAMES.has(name.toLowerCase())) return "";
            if (/^(node|item|component|element)\s+\d+$/i.test(name)) return "";
            return name;
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) walk(full, out);
                continue;
              }

              if (!entry.isFile()) continue;

              const rel = posix(path.relative(ROOT, full));
              if (TEXT_EXTS.has(ext(rel))) out.push(rel);
            }

            return out;
          }

          function parseSource(source) {
            return parser.parse(source, {
              sourceType: "module",
              errorRecovery: true,
              plugins: [
                "jsx",
                "typescript",
                "classProperties",
                "classPrivateProperties",
                "classPrivateMethods",
                "decorators-legacy",
                "objectRestSpread",
                "dynamicImport",
                "optionalChaining",
                "nullishCoalescingOperator",
                "topLevelAwait",
                "importMeta"
              ]
            });
          }

          function childNodes(node) {
            const out = [];

            if (!node || typeof node !== "object") return out;

            for (const key of Object.keys(node)) {
              if (
                key === "loc" ||
                key === "start" ||
                key === "end" ||
                key === "leadingComments" ||
                key === "trailingComments" ||
                key === "innerComments" ||
                key === "extra"
              ) {
                continue;
              }

              const value = node[key];

              if (Array.isArray(value)) {
                for (const child of value) {
                  if (child && typeof child === "object" && child.type) out.push(child);
                }
              } else if (value && typeof value === "object" && value.type) {
                out.push(value);
              }
            }

            return out;
          }

          function jsxName(nameNode) {
            if (!nameNode) return "";

            if (nameNode.type === "JSXIdentifier") return nameNode.name;

            if (nameNode.type === "JSXMemberExpression") {
              const parts = [];
              let cursor = nameNode;

              while (cursor) {
                if (cursor.property?.name) parts.unshift(cursor.property.name);

                if (cursor.object?.name) {
                  parts.unshift(cursor.object.name);
                  break;
                }

                cursor = cursor.object;
              }

              return parts.join(".");
            }

            if (nameNode.type === "JSXNamespacedName") {
              return `${nameNode.namespace?.name || ""}:${nameNode.name?.name || ""}`;
            }

            return "";
          }

          function isDomTag(name) {
            return /^[a-z][a-z0-9:-]*$/.test(name);
          }

          function attrName(attr) {
            if (!attr || attr.type !== "JSXAttribute") return "";
            const name = attr.name;
            if (!name) return "";
            if (name.type === "JSXIdentifier") return name.name;
            if (name.type === "JSXNamespacedName") return `${name.namespace?.name || ""}:${name.name?.name || ""}`;
            return "";
          }

          function rawAttrValue(attr, source) {
            if (!attr || attr.type !== "JSXAttribute") return "";
            if (!attr.value) return "true";
            if (attr.value.type === "StringLiteral") return attr.value.value || "";
            if (attr.value.type === "JSXExpressionContainer") {
              const expr = attr.value.expression;
              if (!expr) return "";
              if (expr.type === "StringLiteral") return expr.value || "";
              if (expr.type === "NumericLiteral" || expr.type === "BooleanLiteral") return String(expr.value);
              if (expr.type === "Identifier") return expr.name;
              if (expr.start != null && expr.end != null) return source.slice(expr.start, expr.end);
            }
            return "";
          }

          function textFromJSX(node) {
            const pieces = [];

            function visit(child) {
              if (!child) return;

              if (child.type === "JSXText") {
                const text = child.value.replace(/\s+/g, " ").trim();
                if (text) pieces.push(text);
                return;
              }

              if (child.type === "JSXExpressionContainer") {
                const expr = child.expression;
                if (expr?.type === "StringLiteral") pieces.push(expr.value);
                return;
              }

              for (const next of childNodes(child)) visit(next);
            }

            for (const child of node.children || []) visit(child);

            return pieces.join(" ").replace(/\s+/g, " ").trim().slice(0, 120);
          }

          function ownerFrom(node, ancestors) {
            const parent = ancestors[ancestors.length - 1];
            const grand = ancestors[ancestors.length - 2];

            if (node.type === "FunctionDeclaration") {
              const wrapper = parent && ["ExportDefaultDeclaration", "ExportNamedDeclaration"].includes(parent.type)
                ? parent
                : node;

              return {
                name: node.id?.name || "Default",
                start: wrapper.start,
                end: wrapper.end
              };
            }

            if (node.type === "ArrowFunctionExpression" || node.type === "FunctionExpression") {
              if (parent?.type === "VariableDeclarator" && grand?.type === "VariableDeclaration") {
                return {
                  name: parent.id?.name || "Anonymous",
                  start: grand.start,
                  end: grand.end
                };
              }

              if (parent?.type === "ExportDefaultDeclaration") {
                return {
                  name: "Default",
                  start: parent.start,
                  end: parent.end
                };
              }

              return {
                name: node.id?.name || "Anonymous",
                start: node.start,
                end: node.end
              };
            }

            if (node.type === "ClassDeclaration") {
              return {
                name: node.id?.name || "Class",
                start: node.start,
                end: node.end
              };
            }

            if (node.type === "ClassMethod" || node.type === "ObjectMethod") {
              return {
                name: node.key?.name || "Method",
                start: node.start,
                end: node.end
              };
            }

            return null;
          }

          function byteRange(source, rel, charStart, charEnd, kind, fileStreamStart) {
            const byteStart = byteAt(source, charStart);
            const byteEnd = byteAt(source, charEnd);
            const slice = source.slice(charStart, charEnd);

            return {
              p: rel,
              k: kind,
              cs: charStart,
              ce: charEnd,
              bs: byteStart,
              be: byteEnd,
              ss: fileStreamStart + byteStart,
              se: fileStreamStart + byteEnd,
              h: sha16(slice)
            };
          }

          function idsIn(node, out = new Set()) {
            if (!node || typeof node !== "object") return out;

            if (node.type === "Identifier") out.add(node.name);
            if (node.type === "JSXIdentifier") out.add(node.name);

            for (const child of childNodes(node)) idsIn(child, out);

            return out;
          }

          function routeFromAppPage(rel) {
            if (!/^app\/(?:.*\/)?page\.(tsx|jsx|ts|js)$/.test(rel)) return null;

            const inner = rel
              .replace(/^app\//, "")
              .replace(/\/page\.(tsx|jsx|ts|js)$/, "")
              .replace(/^page\.(tsx|jsx|ts|js)$/, "");

            const parts = inner
              .split("/")
              .filter(Boolean)
              .filter((part) => !(part.startsWith("(") && part.endsWith(")")))
              .filter((part) => !part.startsWith("@"));

            if (parts.some((part) => part.startsWith("[") && part.endsWith("]"))) return null;

            return parts.length ? "/" + parts.join("/") : "/";
          }

          function routeFromPagesFile(rel) {
            const match = rel.match(/^(?:pages|src\/pages)\/(.+)\.(tsx|jsx|ts|js)$/);
            if (!match) return null;

            let inner = match[1];

            if (inner === "_app" || inner === "_document" || inner === "_error" || inner.startsWith("api/")) {
              return null;
            }

            inner = inner.replace(/\/index$/, "").replace(/^index$/, "");

            const parts = inner.split("/").filter(Boolean);

            if (parts.some((part) => part.startsWith("[") && part.endsWith("]"))) return null;

            return parts.length ? "/" + parts.join("/") : "/";
          }

          function routeFromFile(rel) {
            return routeFromAppPage(rel) || routeFromPagesFile(rel);
          }

          function insertPoint(source, opening) {
            let i = opening.end - 1;

            while (i > opening.start && source[i] !== ">") i--;

            if (source[i] !== ">") return null;

            return source[i - 1] === "/" ? i - 1 : i;
          }

          function hasInterfaceAttr(opening) {
            return (opening.attributes || []).some((attr) => attrName(attr) === "data-de-interface");
          }

          function behaviorKind(tag, attrs, componentName) {
            const lowerTag = String(tag || "").toLowerCase();
            const lowerComponent = String(componentName || "").toLowerCase();
            const role = String(attrs.role || "").toLowerCase();
            const type = String(attrs.type || "").toLowerCase();

            const hasHandler = Object.keys(attrs).some((name) => /^on[A-Z]/.test(name));
            const hasPopup = attrs["aria-haspopup"] || attrs["aria-controls"];
            const nameText = `${lowerTag} ${lowerComponent} ${role} ${type}`;

            if (/\b(dialog|modal|sheet|drawer|popover|overlay|toast)\b/.test(nameText)) return "Dialogs And Overlays";
            if (/\b(menu|menubar|menuitem|command|palette|search)\b/.test(nameText) || hasPopup) return "Menus And Commands";
            if (/\b(tab|tabpanel|tabs|segmented)\b/.test(nameText)) return "Tabs And Panels";
            if (/\b(form|input|textbox|textarea|select|checkbox|radio|switch|slider|combobox)\b/.test(nameText) || type) return "Forms And Inputs";
            if (/\b(nav|link|anchor|breadcrumb)\b/.test(nameText) || attrs.href) return "Navigation";
            if (/\b(button|action|control|toggle)\b/.test(nameText) || hasHandler) return "Actions And Controls";
            if (/\b(main|section|article|aside|header|footer|surface|workspace|canvas|viewport|shell|panel|region|widget|window|feed|profile|message|media)\b/.test(nameText)) return "Surfaces And Regions";
            return "Interface Structure";
          }

          function labelForNode(tag, attrs, text, ownerName, rel) {
            return (
              usableName(attrs["aria-label"]) ||
              usableName(attrs.title) ||
              usableName(attrs.placeholder) ||
              usableName(attrs["data-testid"]) ||
              usableName(attrs.id) ||
              usableName(text) ||
              usableName(ownerName) ||
              usableName(sourceNoun(rel)) ||
              sanitize(tag || "Interface Node")
            );
          }

          function sourceOwnerPath(marker) {
            const parts = [];

            for (const raw of marker.ownerStack || []) {
              const name = usableName(raw);
              if (!name) continue;
              if (parts[parts.length - 1] === name) continue;
              parts.push(name);
            }

            if (!parts.length) {
              const source = usableName(sourceNoun(marker.p));
              if (source) parts.push(source);
            }

            return parts.slice(-8);
          }

          function sliceName(range) {
            return [
              range.k,
              b64url(range.p),
              `C${range.cs}-${range.ce}`,
              `B${range.bs}-${range.be}`,
              `S${range.ss}-${range.se}`,
              `H${range.h}`
            ].join("__") + (path.posix.extname(range.p) || ".slice");
          }

          function sliceText(fullBuf, range) {
            return fullBuf.subarray(range.ss, range.se).toString("utf8");
          }

          function writeJson(file, data) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          }

          function writeJsonl(file, rows) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, rows.map((row) => JSON.stringify(row)).join("\n") + (rows.length ? "\n" : ""));
          }

          function writeSlice(fullBuf, dir, range) {
            const source = sliceText(fullBuf, range);
            if (!source.trim()) return;
            if (sha16(source) !== range.h) return;

            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, sliceName(range)), source);
          }

          function pathForMarker(marker) {
            const ownerParts = sourceOwnerPath(marker);
            const parts = ["Interface"]
              .concat(ownerParts)
              .concat([marker.behaviorKind, marker.label])
              .map((part) => sanitize(part))
              .filter(Boolean);

            return parts.filter((part, index, arr) => index === 0 || part !== arr[index - 1]);
          }

          const files = walk(ROOT).sort();
          const streamStarts = {};
          const full = [];
          const index = {
            generatedAt: new Date().toISOString(),
            routes: [],
            files: {},
            markers: {},
            directories: {}
          };

          let offset = 0;

          for (const rel of files) {
            const abs = path.join(ROOT, rel);
            const source = fs.readFileSync(abs, "utf8");
            const encodedPath = b64url(rel);
            const open = `\n@@FILE:${encodedPath}@@\n`;
            const close = `\n@@END:${encodedPath}@@\n`;

            streamStarts[rel] = offset + byteLen(open);
            full.push(open, source, close);
            offset += byteLen(open + source + close);

            const route = routeFromFile(rel);
            if (route) index.routes.push({ route, file: rel });

            index.files[rel] = {
              p: rel,
              h: sha16(source),
              bytes: byteLen(source),
              streamStart: streamStarts[rel],
              route,
              defs: {},
              imports: {}
            };
          }

          fs.rmSync(OUT, { recursive: true, force: true });
          fs.mkdirSync(OUT, { recursive: true });
          fs.writeFileSync(FULL_CODEBASE_FILE, full.join(""));
          fs.copyFileSync(FULL_CODEBASE_FILE, path.join(OUT, "000_FULL_CODEBASE.codebase"));

          const fullBuf = fs.readFileSync(FULL_CODEBASE_FILE);

          function collectDefsAndImports(ast, source, rel, fileStreamStart) {
            const defs = Object.create(null);
            const imports = Object.create(null);

            function recordDef(name, start, end, kind = "DEF") {
              if (!name || start == null || end == null) return;
              defs[name] = byteRange(source, rel, start, end, kind, fileStreamStart);
            }

            function visit(node, ancestors = []) {
              const parent = ancestors[ancestors.length - 1];
              const grand = ancestors[ancestors.length - 2];

              if (node.type === "ImportDeclaration") {
                for (const spec of node.specifiers || []) {
                  if (spec.local?.name) imports[spec.local.name] = node.source?.value || "";
                }
              }

              if (node.type === "FunctionDeclaration" && node.id?.name) {
                const wrapper = parent && ["ExportDefaultDeclaration", "ExportNamedDeclaration"].includes(parent.type)
                  ? parent
                  : node;
                recordDef(node.id.name, wrapper.start, wrapper.end);
              }

              if (
                parent?.type === "VariableDeclarator" &&
                grand?.type === "VariableDeclaration" &&
                parent.id?.type === "Identifier" &&
                (node.type === "ArrowFunctionExpression" || node.type === "FunctionExpression")
              ) {
                recordDef(parent.id.name, grand.start, grand.end);
              }

              if (node.type === "ClassDeclaration" && node.id?.name) {
                recordDef(node.id.name, node.start, node.end);
              }

              if (parent?.type === "ExportNamedDeclaration" && node.type === "VariableDeclaration") {
                for (const decl of node.declarations || []) {
                  if (decl.id?.type === "Identifier") {
                    recordDef(decl.id.name, parent.start, parent.end);
                  }
                }
              }

              for (const child of childNodes(node)) visit(child, ancestors.concat(node));
            }

            visit(ast.program, []);
            return { defs, imports };
          }

          function resolveImport(fromRel, specifier) {
            if (typeof specifier !== "string") return null;
            if (!specifier || (!specifier.startsWith(".") && !specifier.startsWith("@/"))) return null;

            const base = specifier.startsWith("@/")
              ? specifier.slice(2)
              : path.posix.normalize(path.posix.join(path.posix.dirname(fromRel), specifier));

            const candidates = [
              base,
              `${base}.ts`,
              `${base}.tsx`,
              `${base}.js`,
              `${base}.jsx`,
              `${base}.mjs`,
              `${base}.cjs`,
              `${base}/index.ts`,
              `${base}/index.tsx`,
              `${base}/index.js`,
              `${base}/index.jsx`
            ];

            return candidates.find((candidate) => index.files[candidate]) || null;
          }

          const astCache = new Map();

          for (const rel of files) {
            if (!PARSE_EXTS.has(ext(rel))) continue;

            const source = fs.readFileSync(path.join(ROOT, rel), "utf8");

            try {
              const ast = parseSource(source);
              astCache.set(rel, ast);

              const { defs, imports } = collectDefsAndImports(ast, source, rel, streamStarts[rel]);
              index.files[rel].defs = defs;
              index.files[rel].imports = imports;
            } catch {
              continue;
            }
          }

          for (const rel of files) {
            if (!JSX_EXTS.has(ext(rel))) continue;

            const abs = path.join(ROOT, rel);
            const source = fs.readFileSync(abs, "utf8");
            const ast = astCache.get(rel);
            if (!ast) continue;

            const inserts = [];
            const fileStreamStart = streamStarts[rel];

            function visit(node, ancestors = [], owners = []) {
              const owner = ownerFrom(node, ancestors);
              const nextOwners = owner ? owners.concat(owner) : owners;

              if (node.type === "JSXElement" && node.openingElement) {
                const opening = node.openingElement;
                const tag = jsxName(opening.name);
                const attrs = {};

                for (const attr of opening.attributes || []) {
                  const name = attrName(attr);
                  if (!name) continue;
                  attrs[name] = rawAttrValue(attr, source);
                }

                const ownerRange = nextOwners[nextOwners.length - 1] || {
                  name: sourceNoun(rel),
                  start: 0,
                  end: source.length
                };

                const text = textFromJSX(node);
                const behavior = behaviorKind(tag, attrs, ownerRange.name);
                const label = labelForNode(tag, attrs, text, ownerRange.name, rel);
                const markerId = sha16(`${rel}:${node.start}:${node.end}:${ownerRange.start}:${ownerRange.end}:${tag}`);

                const marker = {
                  id: markerId,
                  p: rel,
                  tag,
                  isDom: isDomTag(tag),
                  label,
                  text,
                  behaviorKind: behavior,
                  ownerName: ownerRange.name,
                  ownerStack: nextOwners.map((item) => item.name).filter(Boolean),
                  attrs: Object.fromEntries(Object.entries(attrs).filter(([name]) => (
                    name === "role" ||
                    name === "href" ||
                    name === "id" ||
                    name === "data-testid" ||
                    name === "aria-label" ||
                    name === "aria-haspopup" ||
                    name === "aria-controls" ||
                    name === "aria-expanded" ||
                    name === "type" ||
                    /^on[A-Z]/.test(name)
                  ))),
                  ids: Array.from(idsIn(node)).filter(Boolean).slice(0, 200),
                  view: byteRange(source, rel, node.start, node.end, "VIEW", fileStreamStart),
                  owner: byteRange(source, rel, ownerRange.start, ownerRange.end, "OWNER", fileStreamStart),
                  handlers: []
                };

                for (const attr of opening.attributes || []) {
                  const name = attrName(attr);
                  if (!/^on[A-Z]/.test(name)) continue;

                  const expr = attr.value?.type === "JSXExpressionContainer" ? attr.value.expression : null;
                  if (!expr) continue;

                  if (expr.start != null && expr.end != null) {
                    marker.handlers.push({
                      name,
                      range: byteRange(source, rel, expr.start, expr.end, "HANDLER_REF", fileStreamStart),
                      ref: expr.type === "Identifier" ? expr.name : ""
                    });
                  }
                }

                const dirParts = pathForMarker(marker);
                marker.dir = dirParts.join("/");

                index.markers[markerId] = marker;
                index.directories[marker.dir] = {
                  dir: marker.dir,
                  marker: marker.id,
                  file: marker.p,
                  owner: marker.ownerName,
                  behaviorKind: marker.behaviorKind,
                  label: marker.label
                };

                const dir = path.join(OUT, ...dirParts);

                writeJson(path.join(dir, "interface.node.json"), {
                  id: marker.id,
                  file: marker.p,
                  tag: marker.tag,
                  isDom: marker.isDom,
                  label: marker.label,
                  behaviorKind: marker.behaviorKind,
                  ownerName: marker.ownerName,
                  ownerStack: marker.ownerStack,
                  attrs: marker.attrs,
                  ids: marker.ids,
                  sourceDir: marker.dir
                });

                writeSlice(fullBuf, dir, marker.view);
                writeSlice(fullBuf, dir, marker.owner);

                const fileInfo = index.files[marker.p] || {};
                const defs = fileInfo.defs || {};
                const imports = fileInfo.imports || {};

                for (const handler of marker.handlers) {
                  writeSlice(fullBuf, path.join(dir, "Handlers"), handler.range);

                  if (handler.ref && Object.hasOwn(defs, handler.ref)) {
                    writeSlice(fullBuf, path.join(dir, "Handlers"), defs[handler.ref]);
                  }

                  if (handler.ref && Object.hasOwn(imports, handler.ref)) {
                    const resolved = resolveImport(marker.p, imports[handler.ref]);
                    const importedDef = resolved && Object.hasOwn(index.files[resolved]?.defs || {}, handler.ref) ? index.files[resolved].defs[handler.ref] : null;
                    if (importedDef) writeSlice(fullBuf, path.join(dir, "Handlers"), importedDef);
                  }
                }

                for (const id of marker.ids || []) {
                  if (Object.hasOwn(defs, id)) {
                    writeSlice(fullBuf, path.join(dir, "Local Definitions"), defs[id]);
                  }

                  const specifier = Object.hasOwn(imports, id) ? imports[id] : null;
                  const resolved = resolveImport(marker.p, specifier);
                  const resolvedDefs = resolved ? (index.files[resolved]?.defs || {}) : {};
                  const importedDef = Object.hasOwn(resolvedDefs, id) ? resolvedDefs[id] : null;

                  if (importedDef) {
                    writeSlice(fullBuf, path.join(dir, "Imported Definitions"), importedDef);
                  }
                }

                if (isDomTag(tag) && !hasInterfaceAttr(opening)) {
                  const at = insertPoint(source, opening);
                  if (at != null) inserts.push([at, ` data-de-interface="${markerId}"`]);
                }
              }

              for (const child of childNodes(node)) {
                visit(child, ancestors.concat(node), nextOwners);
              }
            }

            visit(ast.program, [], []);

            if (inserts.length) {
              inserts.sort((a, b) => b[0] - a[0]);

              let instrumented = source;

              for (const [at, text] of inserts) {
                instrumented = instrumented.slice(0, at) + text + instrumented.slice(at);
              }

              fs.writeFileSync(abs, instrumented);
            }
          }

          writeJson(INDEX_FILE, index);
          writeJson(path.join(OUT, "000_INTERFACE_INDEX.json"), index);
          writeJsonl(path.join(OUT, "000_ROUTES_RENDER_TARGETS.jsonl"), index.routes);
          writeJsonl(path.join(OUT, "000_INTERFACE_DIRECTORIES.jsonl"), Object.values(index.directories));

          NODE

      - name: Build app for optional render evidence
        continue-on-error: true
        run: ${{ inputs.build_command }}

      - name: Start app for optional render evidence
        continue-on-error: true
        env:
          START_COMMAND: ${{ inputs.start_command }}
        run: |
          bash -lc "$START_COMMAND" > __interface_server.log 2>&1 &
          echo $! > __interface_server.pid

      - name: Add optional render evidence without clicking
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const http = require("node:http");
          const https = require("node:https");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, "__interface_codebase__");
          const BASE_URL = process.env.BASE_URL || "http://127.0.0.1:3000";
          const INDEX_FILE = path.join(ROOT, "__INTERFACE_INDEX.json");

          if (!fs.existsSync(INDEX_FILE)) {
            process.exit(0);
          }

          const requireTools = createRequire(path.join(ROOT, "__interface_tools__", "package.json"));
          const { chromium } = requireTools("playwright");
          const INDEX = JSON.parse(fs.readFileSync(INDEX_FILE, "utf8"));

          function clientFor(url) {
            return url.startsWith("https:") ? https : http;
          }

          function waitForServer(url, timeoutMs = 25000) {
            const started = Date.now();
            const client = clientFor(url);

            return new Promise((resolve, reject) => {
              const check = () => {
                const req = client.get(url, (res) => {
                  res.resume();
                  resolve(true);
                });

                req.on("error", () => {
                  if (Date.now() - started > timeoutMs) {
                    reject(new Error("server not ready"));
                    return;
                  }

                  setTimeout(check, 1000);
                });

                req.setTimeout(3000, () => {
                  req.destroy();
                });
              };

              check();
            });
          }

          function writeJsonl(file, rows) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, rows.map((row) => JSON.stringify(row)).join("\n") + (rows.length ? "\n" : ""));
          }

          function appendJsonl(file, rows) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.appendFileSync(file, rows.map((row) => JSON.stringify(row)).join("\n") + (rows.length ? "\n" : ""));
          }

          async function extract(page, route) {
            return await page.evaluate((routeArg) => {
              function visible(el) {
                const style = window.getComputedStyle(el);
                const rect = el.getBoundingClientRect();

                return (
                  style.display !== "none" &&
                  style.visibility !== "hidden" &&
                  Number(style.opacity || "1") !== 0 &&
                  rect.width > 0 &&
                  rect.height > 0
                );
              }

              function labelOf(el) {
                return (
                  el.getAttribute("aria-label") ||
                  el.getAttribute("title") ||
                  el.innerText ||
                  el.textContent ||
                  el.getAttribute("alt") ||
                  el.getAttribute("placeholder") ||
                  ""
                ).replace(/\s+/g, " ").trim().slice(0, 160);
              }

              return Array.from(document.querySelectorAll("[data-de-interface]"))
                .map((el) => ({
                  route: routeArg,
                  marker: el.getAttribute("data-de-interface") || "",
                  tag: el.tagName.toLowerCase(),
                  role: el.getAttribute("role") || "",
                  label: labelOf(el),
                  href: el.getAttribute("href") || "",
                  id: el.id || "",
                  testid: el.getAttribute("data-testid") || "",
                  visible: visible(el)
                }))
                .filter((row) => row.marker);
            }, route);
          }

          async function main() {
            try {
              await waitForServer(BASE_URL);
            } catch {
              writeJsonl(path.join(OUT, "000_RENDER_EVIDENCE_SKIPPED.jsonl"), [{
                reason: "local server was not reachable",
                baseUrl: BASE_URL
              }]);
              return;
            }

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1200 } });
            const page = await context.newPage();

            const routes = Array.from(new Set((INDEX.routes || []).map((item) => item.route))).sort((a, b) => {
              if (a === "/") return -1;
              if (b === "/") return 1;
              return a.localeCompare(b);
            });

            const allEvidence = [];

            for (const route of routes) {
              try {
                await page.goto(BASE_URL + route, { waitUntil: "networkidle", timeout: 30000 });
              } catch {
                allEvidence.push({ route, skipped: true, reason: "route did not render" });
                continue;
              }

              const evidence = await extract(page, route);
              allEvidence.push(...evidence);

              for (const row of evidence) {
                const marker = INDEX.markers?.[row.marker];
                if (!marker?.dir) continue;

                appendJsonl(path.join(OUT, marker.dir, "render.evidence.jsonl"), [row]);
              }
            }

            writeJsonl(path.join(OUT, "000_RENDER_EVIDENCE.jsonl"), allEvidence);
            await browser.close();
          }

          main().catch((error) => {
            writeJsonl(path.join(OUT, "000_RENDER_EVIDENCE_SKIPPED.jsonl"), [{
              reason: String(error && error.message ? error.message : error),
              baseUrl: BASE_URL
            }]);
          });
          NODE

      - name: Zip interface behavior codebase
        run: |
          cd __interface_codebase__
          zip -qr ../dreamengin-interface-behavior-codebase.zip .

      - name: Upload interface behavior codebase
        uses: actions/upload-artifact@v4
        with:
          name: dreamengin-interface-behavior-codebase
          path: dreamengin-interface-behavior-codebase.zip
          include-hidden-files: false
          compression-level: 9

      - name: Stop app
        if: always()
        run: |
          if [ -f __interface_server.pid ]; then
            kill "$(cat __interface_server.pid)" || true
          fi
