name: DREAM 4D Cuckoo RGB-CMY AI Manifold
run-name: DREAM 4D Cuckoo RGB-CMY AI Manifold

"on":
  workflow_dispatch:
    inputs:
      maximum_dimension:
        description: "Maximum SVG viewBox dimension"
        required: false
        default: "24000"
        type: string

permissions:
  contents: read

concurrency:
  group: dream-4d-cuckoo-rgb-cmy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-manifold:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the 4D Cuckoo manifold renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_cuckoo_manifold_svg.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import html
          import json
          import math
          import os
          import stat
          import subprocess
          from collections import defaultdict, deque
          from dataclasses import dataclass
          from pathlib import Path, PurePosixPath
          from typing import Iterable

          GOLDEN_ANGLE = math.pi / 5.0
          OMEGA = complex(math.cos(GOLDEN_ANGLE), math.sin(GOLDEN_ANGLE))
          PHI = float((OMEGA + OMEGA.conjugate()).real)
          GOLDEN_N = float((PHI + math.sqrt(PHI * PHI + 4.0)) / 2.0)
          IDENTITY_RESIDUAL = abs(GOLDEN_N - 1.0 / GOLDEN_N - PHI)
          if IDENTITY_RESIDUAL > 1.0e-12:
              raise RuntimeError("golden identity invariant failed")

          MODEL_REVISION = "dream-4d-cuckoo-rgb-cmy-visible-grammar-r1"
          CELL_COUNT = 16
          MAX_SOURCE_COLUMNS = 86
          SOURCE_LINES_PER_CHUNK = 10
          HEX_BYTES_PER_LINE = 24
          HEX_LINES_PER_CHUNK = 8
          MIN_FONT_SIZE = 10
          MAX_FONT_SIZE = 22
          MARGIN = 180
          BACKGROUND = "#070910"
          PALETTE = (
              (255, 72, 72),
              (72, 255, 112),
              (80, 116, 255),
              (48, 236, 255),
              (255, 70, 236),
              (255, 224, 55),
          )


          @dataclass
          class RawFile:
              index: int
              path: str
              mode: int
              kind: str
              data: bytes
              sha256: str
              target: str | None


          @dataclass
          class Chunk:
              index: int
              file_index: int
              chunk_index: int
              path: str
              header: str
              lines: list[str]
              raw_digest: bytes
              cell: int = 0
              left: int = 0
              right: int = 0
              peel_round: int = 0
              core: bool = False
              component: int = 0
              order: int = 0
              x4: tuple[float, float, float, float] = (0.0, 0.0, 0.0, 0.0)
              x2: tuple[float, float] = (0.0, 0.0)
              angle: float = 0.0


          def canonical_json(value: object) -> bytes:
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")


          def tracked_paths(root: Path) -> list[str]:
              result = subprocess.run(
                  ["git", "-C", str(root), "ls-files", "-z", "--recurse-submodules"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              paths = [item.decode("utf-8", "surrogateescape") for item in result.stdout.split(b"\0") if item]
              paths = sorted(set(paths))
              if not paths:
                  raise RuntimeError("git reported no tracked paths")
              return paths


          def read_files(root: Path) -> tuple[list[RawFile], str]:
              files: list[RawFile] = []
              descriptor: list[dict] = []
              for index, relative_text in enumerate(tracked_paths(root)):
                  relative = PurePosixPath(relative_text)
                  absolute = root.joinpath(*relative.parts)
                  metadata = os.lstat(absolute)
                  mode = stat.S_IMODE(metadata.st_mode)
                  if stat.S_ISDIR(metadata.st_mode):
                      continue
                  if stat.S_ISLNK(metadata.st_mode):
                      target = os.readlink(absolute)
                      data = target.encode("utf-8", "surrogateescape")
                      kind = "symlink"
                  elif stat.S_ISREG(metadata.st_mode):
                      data = absolute.read_bytes()
                      target = None
                      kind = "file"
                  else:
                      continue
                  digest = hashlib.sha256(data).hexdigest()
                  files.append(RawFile(index=len(files), path=relative.as_posix(), mode=mode, kind=kind, data=data, sha256=digest, target=target))
                  descriptor.append({"path": relative.as_posix(), "mode": mode, "kind": kind, "sha256": digest, "size": len(data), "target": target})
              root_hash = hashlib.sha256(canonical_json(descriptor)).hexdigest()
              return files, root_hash


          def looks_text(data: bytes) -> bool:
              if not data:
                  return True
              if b"\x00" in data[:8192]:
                  return False
              try:
                  data.decode("utf-8")
                  return True
              except UnicodeDecodeError:
                  sample = data[:8192]
                  control = sum(1 for value in sample if value not in b"\t\n\r" and value < 32)
                  return control / max(1, len(sample)) < 0.02


          def visible_text_line(raw: bytes) -> str:
              ending = ""
              body = raw
              if body.endswith(b"\r\n"):
                  body = body[:-2]
                  ending = "␍␊"
              elif body.endswith(b"\n"):
                  body = body[:-1]
                  ending = "␊"
              elif body.endswith(b"\r"):
                  body = body[:-1]
                  ending = "␍"
              else:
                  ending = "∅"

              text = body.decode("utf-8", "surrogateescape")
              trailing_spaces = len(text) - len(text.rstrip(" "))
              if trailing_spaces:
                  text = text[:-trailing_spaces] + ("·" * trailing_spaces)

              output: list[str] = []
              for character in text:
                  code = ord(character)
                  if character == "\t":
                      output.append("⇥")
                  elif 0xDC80 <= code <= 0xDCFF:
                      output.append(f"\\x{code - 0xDC00:02x}")
                  elif code < 32 or code == 127:
                      output.append(f"\\x{code:02x}")
                  else:
                      output.append(character)
              return "".join(output) + ending


          def wrap_visible_line(text: str, width: int) -> list[str]:
              if len(text) <= width:
                  return [text]
              pieces: list[str] = []
              cursor = 0
              while cursor < len(text):
                  pieces.append(text[cursor:cursor + width])
                  cursor += width
              return pieces


          def chunks_from_file(file: RawFile, start_index: int) -> list[Chunk]:
              chunks: list[Chunk] = []
              if file.kind == "symlink":
                  lines = [f"SYMLINK→{file.target}"]
                  digest = hashlib.sha256(file.data + b"\x00symlink").digest()
                  chunks.append(Chunk(index=start_index, file_index=file.index, chunk_index=0, path=file.path, header="", lines=lines, raw_digest=digest))
                  return chunks

              if looks_text(file.data):
                  raw_lines = file.data.splitlines(keepends=True)
                  if not raw_lines:
                      raw_lines = [b""]
                  visible_lines: list[tuple[int, str]] = []
                  line_number = 1
                  for raw_line in raw_lines:
                      rendered = visible_text_line(raw_line)
                      pieces = wrap_visible_line(rendered, MAX_SOURCE_COLUMNS)
                      for piece_index, piece in enumerate(pieces):
                          label = f"{line_number:>6}" if piece_index == 0 else "      "
                          visible_lines.append((line_number, f"{label}│{piece}"))
                      line_number += 1
                  for chunk_index, start in enumerate(range(0, len(visible_lines), SOURCE_LINES_PER_CHUNK)):
                      section = visible_lines[start:start + SOURCE_LINES_PER_CHUNK]
                      lines = [item[1] for item in section]
                      start_line = section[0][0]
                      end_line = section[-1][0]
                      digest = hashlib.sha256(file.data + chunk_index.to_bytes(8, "big")).digest()
                      chunks.append(Chunk(index=start_index + len(chunks), file_index=file.index, chunk_index=chunk_index, path=file.path, header=f"L{start_line}-{end_line}", lines=lines, raw_digest=digest))
              else:
                  rows: list[str] = []
                  for offset in range(0, len(file.data), HEX_BYTES_PER_LINE):
                      part = file.data[offset:offset + HEX_BYTES_PER_LINE]
                      hex_part = " ".join(f"{value:02x}" for value in part)
                      rows.append(f"{offset:08x}│{hex_part}")
                  if not rows:
                      rows = ["00000000│"]
                  for chunk_index, start in enumerate(range(0, len(rows), HEX_LINES_PER_CHUNK)):
                      lines = rows[start:start + HEX_LINES_PER_CHUNK]
                      digest = hashlib.sha256(file.data + b"\x00hex" + chunk_index.to_bytes(8, "big")).digest()
                      chunks.append(Chunk(index=start_index + len(chunks), file_index=file.index, chunk_index=chunk_index, path=file.path, header=f"HEX {start * HEX_BYTES_PER_LINE}-{min(len(file.data), (start + len(lines)) * HEX_BYTES_PER_LINE)}", lines=lines, raw_digest=digest))
              return chunks


          def make_chunks(files: list[RawFile]) -> list[Chunk]:
              chunks: list[Chunk] = []
              for file in files:
                  file_chunks = chunks_from_file(file, len(chunks))
                  for chunk in file_chunks:
                      prefix = f"⟦{file.path}│{chunk.header}│mode={file.mode:o}│sha256={file.sha256[:16]}⟧"
                      chunk.header = prefix
                  chunks.extend(file_chunks)
              return chunks


          def next_power_of_two(value: int) -> int:
              result = 1
              while result < value:
                  result <<= 1
              return result


          def assign_cuckoo_graph(chunks: list[Chunk], root_hash: str) -> int:
              node_count = next_power_of_two(max(64, len(chunks) * 4))
              mask = node_count - 1
              seed = bytes.fromhex(root_hash)
              for chunk in chunks:
                  left_digest = hashlib.blake2b(seed + b"L" + chunk.raw_digest, digest_size=8).digest()
                  right_digest = hashlib.blake2b(seed + b"R" + chunk.raw_digest, digest_size=8).digest()
                  chunk.left = int.from_bytes(left_digest, "little") & mask
                  chunk.right = int.from_bytes(right_digest, "little") & mask
                  chunk.cell = chunk.raw_digest[0] & 0x0F
              return node_count


          def peel_rounds(chunks: list[Chunk], node_count: int) -> None:
              active = set(range(len(chunks)))
              round_index = 0
              while active:
                  left_degree = [0] * node_count
                  right_degree = [0] * node_count
                  for index in active:
                      chunk = chunks[index]
                      left_degree[chunk.left] += 1
                      right_degree[chunk.right] += 1
                  removed = [index for index in active if left_degree[chunks[index].left] < 2 or right_degree[chunks[index].right] < 2]
                  if not removed:
                      for index in active:
                          chunks[index].core = True
                          chunks[index].peel_round = round_index
                      break
                  for index in removed:
                      chunks[index].peel_round = round_index
                      active.remove(index)
                  round_index += 1
              if not active:
                  max_round = max((chunk.peel_round for chunk in chunks), default=0)
                  for chunk in chunks:
                      chunk.core = False
                      chunk.peel_round = max_round - chunk.peel_round


          def walsh16(values: list[int]) -> list[int]:
              result = [int(value) for value in values]
              stride = 1
              while stride < CELL_COUNT:
                  for start in range(0, CELL_COUNT, stride * 2):
                      for offset in range(stride):
                          a = result[start + offset]
                          b = result[start + offset + stride]
                          result[start + offset] = a + b
                          result[start + offset + stride] = a - b
                  stride *= 2
              return result


          def graph_components_and_order(chunks: list[Chunk], node_count: int) -> list[tuple[int, int]]:
              adjacency: dict[int, list[tuple[int, int]]] = defaultdict(list)
              offset = node_count
              for chunk in chunks:
                  u = chunk.left
                  v = offset + chunk.right
                  adjacency[u].append((v, chunk.index))
                  adjacency[v].append((u, chunk.index))

              unseen_nodes = set(adjacency)
              traversal_edges: list[tuple[int, int]] = []
              component_index = 0
              global_order = 0
              while unseen_nodes:
                  start = min(unseen_nodes)
                  queue = deque([start])
                  unseen_nodes.remove(start)
                  component_nodes: list[int] = []
                  component_edges: set[int] = set()
                  while queue:
                      node = queue.popleft()
                      component_nodes.append(node)
                      for neighbor, edge_index in sorted(adjacency[node], key=lambda item: item[1]):
                          component_edges.add(edge_index)
                          if neighbor in unseen_nodes:
                              unseen_nodes.remove(neighbor)
                              queue.append(neighbor)

                  visited_edges: set[int] = set()
                  stack = [min(component_nodes)]
                  previous_edge: int | None = None
                  while stack:
                      node = stack.pop()
                      candidates = sorted(adjacency[node], key=lambda item: (chunks[item[1]].cell, item[1]))
                      for neighbor, edge_index in candidates:
                          if edge_index in visited_edges:
                              continue
                          visited_edges.add(edge_index)
                          chunks[edge_index].component = component_index
                          chunks[edge_index].order = global_order
                          global_order += 1
                          traversal_edges.append((edge_index, neighbor))
                          stack.append(neighbor)
                  for edge_index in sorted(component_edges - visited_edges):
                      chunks[edge_index].component = component_index
                      chunks[edge_index].order = global_order
                      global_order += 1
                  component_index += 1
              return traversal_edges


          def rotate_plane(vector: list[float], axis_a: int, axis_b: int, angle: float) -> None:
              cosine = math.cos(angle)
              sine = math.sin(angle)
              a = vector[axis_a]
              b = vector[axis_b]
              vector[axis_a] = a * cosine - b * sine
              vector[axis_b] = a * sine + b * cosine


          def manifold_coordinates(chunks: list[Chunk], root_hash: str) -> list[int]:
              counts = [0] * CELL_COUNT
              for chunk in chunks:
                  counts[chunk.cell] += 1
              walsh = walsh16(counts)
              scale = max(1.0, max(abs(value) for value in walsh[1:]) if len(walsh) > 1 else 1.0)
              normalized = [value / scale for value in walsh]
              within_cell = [0] * CELL_COUNT
              root_bytes = bytes.fromhex(root_hash)
              root_phase = int.from_bytes(root_bytes[:8], "big") / float(1 << 64)

              ordered = sorted(chunks, key=lambda chunk: chunk.order)
              for order_index, chunk in enumerate(ordered):
                  cell = chunk.cell
                  local_index = within_cell[cell]
                  within_cell[cell] += 1
                  bits = [1.0 if cell & (1 << axis) else -1.0 for axis in range(4)]
                  digest_phase = int.from_bytes(chunk.raw_digest[:8], "big") / float(1 << 64)
                  graph_phase = (chunk.left + PHI * chunk.right + 1.0) / max(1.0, len(chunks) * 4.0)
                  t = (local_index + 0.5) / max(1, counts[cell])
                  peel = chunk.peel_round
                  core_gain = 1.14 if chunk.core else 1.0

                  vector = [
                      bits[0] * (0.92 + 0.14 * normalized[1]) + 0.24 * math.sin(2 * math.pi * (PHI * t + digest_phase)),
                      bits[1] * (0.92 + 0.14 * normalized[2]) + 0.24 * math.cos(2 * math.pi * (GOLDEN_N * t + graph_phase)),
                      bits[2] * (0.92 + 0.14 * normalized[4]) + 0.24 * math.sin(2 * math.pi * ((PHI + GOLDEN_N) * t + root_phase)),
                      bits[3] * (0.92 + 0.14 * normalized[8]) + 0.24 * math.cos(2 * math.pi * (t / GOLDEN_N + digest_phase)),
                  ]
                  radial = core_gain * (1.0 + min(0.24, peel * 0.018))
                  vector = [value * radial for value in vector]

                  base = GOLDEN_ANGLE + root_phase * math.pi
                  rotate_plane(vector, 0, 1, base)
                  rotate_plane(vector, 2, 3, base / PHI)
                  rotate_plane(vector, 0, 2, base * GOLDEN_N)
                  rotate_plane(vector, 1, 3, base / GOLDEN_N)
                  rotate_plane(vector, 0, 3, GOLDEN_ANGLE * (1 + chunk.component % 5))
                  rotate_plane(vector, 1, 2, GOLDEN_ANGLE * (1 + cell / 16.0))
                  chunk.x4 = tuple(vector)

                  x, y, z, w = vector
                  p4 = max(0.55, 2.7 - 0.58 * w)
                  x3 = x / p4
                  y3 = y / p4
                  z3 = z / p4
                  p3 = max(0.65, 2.5 - 0.62 * z3)
                  chunk.x2 = (x3 / p3, y3 / p3)

              for index, chunk in enumerate(ordered):
                  previous = ordered[index - 1]
                  following = ordered[(index + 1) % len(ordered)]
                  dx = following.x2[0] - previous.x2[0]
                  dy = following.x2[1] - previous.x2[1]
                  angle = math.degrees(math.atan2(dy, dx))
                  chunk.angle = max(-14.0, min(14.0, angle))
              return walsh




          def cell_manifold_points(root_hash: str, walsh: list[int]) -> list[tuple[float, float]]:
              scale = max(1.0, max(abs(value) for value in walsh[1:]) if len(walsh) > 1 else 1.0)
              normalized = [value / scale for value in walsh]
              root_bytes = bytes.fromhex(root_hash)
              root_phase = int.from_bytes(root_bytes[:8], "big") / float(1 << 64)
              points: list[tuple[float, float]] = []
              for cell in range(CELL_COUNT):
                  bits = [1.0 if cell & (1 << axis) else -1.0 for axis in range(4)]
                  vector = [
                      bits[0] * (0.94 + 0.16 * normalized[1]),
                      bits[1] * (0.94 + 0.16 * normalized[2]),
                      bits[2] * (0.94 + 0.16 * normalized[4]),
                      bits[3] * (0.94 + 0.16 * normalized[8]),
                  ]
                  base = GOLDEN_ANGLE + root_phase * math.pi
                  rotate_plane(vector, 0, 1, base)
                  rotate_plane(vector, 2, 3, base / PHI)
                  rotate_plane(vector, 0, 2, base * GOLDEN_N)
                  rotate_plane(vector, 1, 3, base / GOLDEN_N)
                  rotate_plane(vector, 0, 3, GOLDEN_ANGLE * (1 + cell % 5))
                  rotate_plane(vector, 1, 2, GOLDEN_ANGLE * (1 + cell / 16.0))
                  x, y, z, w = vector
                  p4 = max(0.55, 2.7 - 0.58 * w)
                  x3 = x / p4
                  y3 = y / p4
                  z3 = z / p4
                  p3 = max(0.65, 2.5 - 0.62 * z3)
                  points.append((x3 / p3, y3 / p3))
              return points

          def rgb_hex(color: tuple[int, int, int]) -> str:
              return "#" + "".join(f"{value:02x}" for value in color)


          def complement(color: tuple[int, int, int]) -> tuple[int, int, int]:
              return tuple(255 - value for value in color)


          def choose_color(chunk: Chunk, walsh: list[int]) -> tuple[tuple[int, int, int], tuple[int, int, int]]:
              index = (chunk.cell + chunk.component + (1 if walsh[chunk.cell] < 0 else 0)) % len(PALETTE)
              primary = PALETTE[index]
              secondary = complement(primary)
              return primary, secondary


          def estimate_text_size(chunks: list[Chunk], max_dimension: int) -> tuple[int, int, int, int]:
              line_count = max((len(chunk.lines) for chunk in chunks), default=1) + 1
              max_chars = max((max([len(chunk.header), *(len(line) for line in chunk.lines)]) for chunk in chunks), default=80)
              total_chars = sum(len(chunk.header) + sum(len(line) for line in chunk.lines) for chunk in chunks)
              font_size = MAX_FONT_SIZE
              while font_size > MIN_FONT_SIZE:
                  block_w = int(max_chars * font_size * 0.62 + 24)
                  block_h = int(line_count * font_size * 1.38 + 20)
                  required = math.sqrt(max(1, len(chunks)) * block_w * block_h / 0.23) + 2 * MARGIN
                  if required <= max_dimension:
                      break
                  font_size -= 1
              block_w = int(max_chars * font_size * 0.62 + 24)
              block_h = int(line_count * font_size * 1.38 + 20)
              required = int(math.ceil(math.sqrt(max(1, len(chunks)) * block_w * block_h / 0.20) + 2 * MARGIN))
              canvas = min(max_dimension, max(2400, required))
              if required > max_dimension:
                  canvas = max_dimension
              return font_size, block_w, block_h, canvas


          def collide(box: tuple[float, float, float, float], boxes: list[tuple[float, float, float, float]]) -> bool:
              x1, y1, x2, y2 = box
              for ox1, oy1, ox2, oy2 in boxes:
                  if not (x2 < ox1 or ox2 < x1 or y2 < oy1 or oy2 < y1):
                      return True
              return False


          def place_chunks(chunks: list[Chunk], canvas: int, block_w: int, block_h: int) -> dict[int, tuple[float, float]]:
              max_abs_x = max((abs(chunk.x2[0]) for chunk in chunks), default=1.0)
              max_abs_y = max((abs(chunk.x2[1]) for chunk in chunks), default=1.0)
              radius_x = (canvas / 2 - MARGIN - block_w / 2) / max(0.01, max_abs_x)
              radius_y = (canvas / 2 - MARGIN - block_h / 2) / max(0.01, max_abs_y)
              center = canvas / 2
              boxes: list[tuple[float, float, float, float]] = []
              positions: dict[int, tuple[float, float]] = {}

              for chunk in sorted(chunks, key=lambda item: (not item.core, item.peel_round, item.order)):
                  base_x = center + chunk.x2[0] * radius_x
                  base_y = center + chunk.x2[1] * radius_y
                  theta = math.atan2(chunk.x2[1], chunk.x2[0]) + GOLDEN_ANGLE
                  placed = False
                  for ring in range(0, 60):
                      distance = ring * min(block_w, block_h) * 0.18
                      candidates = [0.0] if ring == 0 else [theta + k * GOLDEN_ANGLE for k in range(8)]
                      for candidate_theta in candidates:
                          x = base_x + math.cos(candidate_theta) * distance - block_w / 2
                          y = base_y + math.sin(candidate_theta) * distance - block_h / 2
                          x = max(MARGIN / 2, min(canvas - MARGIN / 2 - block_w, x))
                          y = max(MARGIN / 2, min(canvas - MARGIN / 2 - block_h, y))
                          box = (x - 8, y - 8, x + block_w + 8, y + block_h + 8)
                          if not collide(box, boxes):
                              boxes.append(box)
                              positions[chunk.index] = (x, y)
                              placed = True
                              break
                      if placed:
                          break
                  if not placed:
                      x = max(MARGIN / 2, min(canvas - MARGIN / 2 - block_w, base_x - block_w / 2))
                      y = max(MARGIN / 2, min(canvas - MARGIN / 2 - block_h, base_y - block_h / 2))
                      positions[chunk.index] = (x, y)
                      boxes.append((x, y, x + block_w, y + block_h))
              return positions


          def xml_text(value: str) -> str:
              return html.escape(value, quote=False)


          def build_edges(chunks: list[Chunk], node_count: int) -> list[tuple[int, int]]:
              left_groups: dict[int, list[int]] = defaultdict(list)
              right_groups: dict[int, list[int]] = defaultdict(list)
              for chunk in chunks:
                  left_groups[chunk.left].append(chunk.index)
                  right_groups[chunk.right].append(chunk.index)
              edges: set[tuple[int, int]] = set()
              for groups in (left_groups, right_groups):
                  for indices in groups.values():
                      ordered = sorted(indices, key=lambda index: chunks[index].order)
                      for a, b in zip(ordered, ordered[1:]):
                          if a != b:
                              edges.add(tuple(sorted((a, b))))
              ordered_chunks = sorted(chunks, key=lambda chunk: chunk.order)
              for a, b in zip(ordered_chunks, ordered_chunks[1:]):
                  edges.add(tuple(sorted((a.index, b.index))))
              return sorted(edges)


          def render_svg(root: Path, output: Path, maximum_dimension: int) -> dict:
              files, root_hash = read_files(root)
              chunks = make_chunks(files)
              if not chunks:
                  raise RuntimeError("no codebase chunks were generated")
              node_count = assign_cuckoo_graph(chunks, root_hash)
              peel_rounds(chunks, node_count)
              graph_components_and_order(chunks, node_count)
              walsh = manifold_coordinates(chunks, root_hash)
              font_size, block_w, block_h, canvas = estimate_text_size(chunks, maximum_dimension)
              positions = place_chunks(chunks, canvas, block_w, block_h)
              graph_edges = build_edges(chunks, node_count)
              cell_points = cell_manifold_points(root_hash, walsh)
              cell_counts = [0] * CELL_COUNT
              for chunk in chunks:
                  cell_counts[chunk.cell] += 1

              output.parent.mkdir(parents=True, exist_ok=True)
              with output.open("w", encoding="utf-8", newline="\n") as svg:
                  write = svg.write
                  write('<?xml version="1.0" encoding="UTF-8"?>\n')
                  write(f'<svg xmlns="http://www.w3.org/2000/svg" width="{canvas}" height="{canvas}" viewBox="0 0 {canvas} {canvas}">\n')
                  metadata = {
                      "format": MODEL_REVISION,
                      "codebaseRoot": root_hash,
                      "fileCount": len(files),
                      "chunkCount": len(chunks),
                      "equation": {"goldenAngle": GOLDEN_ANGLE, "phi": PHI, "n": GOLDEN_N, "identityResidual": IDENTITY_RESIDUAL},
                      "graph": {"nodeCountPerSide": node_count, "cells": CELL_COUNT, "walsh16": walsh},
                      "visibleGrammar": {"tab": "⇥", "trailingSpace": "·", "lf": "␊", "crlf": "␍␊", "cr": "␍", "noTerminator": "∅", "rawByte": "\\xNN"},
                  }
                  write(f'<metadata>{xml_text(json.dumps(metadata, sort_keys=True, ensure_ascii=False))}</metadata>\n')
                  write('<defs>\n')
                  write('<radialGradient id="bg" cx="50%" cy="50%" r="72%"><stop offset="0%" stop-color="#171d34"/><stop offset="46%" stop-color="#0c1020"/><stop offset="100%" stop-color="#05060b"/></radialGradient>\n')
                  write('<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>\n')
                  for cell in range(CELL_COUNT):
                      primary = PALETTE[cell % len(PALETTE)]
                      secondary = complement(primary)
                      write(f'<radialGradient id="cell{cell}" cx="45%" cy="42%" r="60%"><stop offset="0%" stop-color="{rgb_hex(primary)}" stop-opacity="0.42"/><stop offset="48%" stop-color="{rgb_hex(secondary)}" stop-opacity="0.18"/><stop offset="100%" stop-color="{rgb_hex(primary)}" stop-opacity="0"/></radialGradient>\n')
                  write('</defs>\n')
                  write(f'<rect width="{canvas}" height="{canvas}" fill="url(#bg)"/>\n')

                  # Sixteen projected 4D cell fields and their tesseract adjacency.
                  cell_max_x = max(max(abs(point[0]) for point in cell_points), 0.01)
                  cell_max_y = max(max(abs(point[1]) for point in cell_points), 0.01)
                  cell_radius_x = canvas * 0.34 / cell_max_x
                  cell_radius_y = canvas * 0.34 / cell_max_y
                  cell_screen = [
                      (canvas / 2 + point[0] * cell_radius_x, canvas / 2 + point[1] * cell_radius_y)
                      for point in cell_points
                  ]
                  for cell in range(CELL_COUNT):
                      for axis in range(4):
                          neighbor = cell ^ (1 << axis)
                          if neighbor <= cell:
                              continue
                          x1, y1 = cell_screen[cell]
                          x2, y2 = cell_screen[neighbor]
                          primary = PALETTE[(cell + axis) % len(PALETTE)]
                          secondary = complement(primary)
                          write(f'<line x1="{x1:.2f}" y1="{y1:.2f}" x2="{x2:.2f}" y2="{y2:.2f}" stroke="{rgb_hex(secondary)}" stroke-width="14" stroke-opacity="0.045" filter="url(#soft)"/>\n')
                          write(f'<line x1="{x1:.2f}" y1="{y1:.2f}" x2="{x2:.2f}" y2="{y2:.2f}" stroke="{rgb_hex(primary)}" stroke-width="1.25" stroke-opacity="0.18"/>\n')
                  maximum_count = max(cell_counts) if cell_counts else 1
                  for cell, (cx, cy) in enumerate(cell_screen):
                      density = cell_counts[cell] / max(1, maximum_count)
                      size = canvas * (0.055 + 0.075 * math.sqrt(density))
                      angle = math.degrees(GOLDEN_ANGLE * (cell + 1))
                      write(f'<ellipse cx="{cx:.2f}" cy="{cy:.2f}" rx="{size:.2f}" ry="{size / GOLDEN_N:.2f}" fill="url(#cell{cell})" transform="rotate({angle:.2f} {cx:.2f} {cy:.2f})"/>\n')

                  # Equation/codebase-generated graph field.
                  for edge_index, (a, b) in enumerate(graph_edges):
                      ax, ay = positions[a]
                      bx, by = positions[b]
                      ca = chunks[a]
                      cb = chunks[b]
                      a_center = (ax + block_w / 2, ay + block_h / 2)
                      b_center = (bx + block_w / 2, by + block_h / 2)
                      primary, secondary = choose_color(ca, walsh)
                      p = rgb_hex(primary)
                      c = rgb_hex(secondary)
                      bend = ((ca.cell ^ cb.cell) - 7.5) * GOLDEN_ANGLE * 9.0
                      mx = (a_center[0] + b_center[0]) / 2 + math.cos(edge_index * GOLDEN_ANGLE) * bend
                      my = (a_center[1] + b_center[1]) / 2 + math.sin(edge_index * GOLDEN_ANGLE) * bend
                      path = f'M {a_center[0]:.2f},{a_center[1]:.2f} Q {mx:.2f},{my:.2f} {b_center[0]:.2f},{b_center[1]:.2f}'
                      write(f'<path d="{path}" fill="none" stroke="{c}" stroke-opacity="0.13" stroke-width="5" filter="url(#soft)"/>\n')
                      write(f'<path d="{path}" fill="none" stroke="{p}" stroke-opacity="0.30" stroke-width="1.25"/>\n')

                  # Visible grammar, not an equation or decoder.
                  legend = "VISIBLE BYTE GRAMMAR  ⇥ TAB   · TRAILING SPACE   ␊ LF   ␍␊ CRLF   ␍ CR   ∅ NO TERMINATOR   \\xNN RAW BYTE"
                  write(f'<text x="{MARGIN / 2:.0f}" y="{MARGIN / 2:.0f}" fill="#dce4ff" opacity="0.78" font-family="monospace" font-size="{max(11, font_size)}">{xml_text(legend)}</text>\n')
                  write(f'<text x="{MARGIN / 2:.0f}" y="{MARGIN / 2 + font_size * 1.6:.0f}" fill="#8f9bc4" opacity="0.75" font-family="monospace" font-size="{max(10, font_size - 1)}">ROOT {root_hash}  FILES {len(files)}  CHUNKS {len(chunks)}  4D CELLS 16  GRAPH NODES {node_count * 2}</text>\n')

                  for chunk in sorted(chunks, key=lambda item: item.order):
                      x, y = positions[chunk.index]
                      primary, secondary = choose_color(chunk, walsh)
                      p = rgb_hex(primary)
                      c = rgb_hex(secondary)
                      opacity = 1.0 if chunk.core else max(0.72, 0.96 - chunk.peel_round * 0.025)
                      write(f'<g transform="translate({x:.2f} {y:.2f}) rotate({chunk.angle:.2f} {block_w / 2:.2f} {block_h / 2:.2f})" opacity="{opacity:.3f}">\n')
                      write(f'<text x="0" y="{font_size}" font-family="monospace" font-size="{font_size}" font-weight="700" fill="{p}" stroke="{c}" stroke-opacity="0.38" stroke-width="1.15" paint-order="stroke fill">{xml_text(chunk.header)}</text>\n')
                      y_line = font_size * 2.35
                      for line in chunk.lines:
                          write(f'<text x="0" y="{y_line:.2f}" font-family="monospace" font-size="{font_size}" fill="#eef2ff" stroke="{c}" stroke-opacity="0.24" stroke-width="0.75" paint-order="stroke fill" xml:space="preserve">{xml_text(line)}</text>\n')
                          y_line += font_size * 1.34
                      write('</g>\n')
                  write('</svg>\n')

              return {
                  "artifact": str(output),
                  "artifactBytes": output.stat().st_size,
                  "canvas": canvas,
                  "fontSize": font_size,
                  "files": len(files),
                  "chunks": len(chunks),
                  "graphEdges": len(graph_edges),
                  "codebaseRoot": root_hash,
                  "walsh16": walsh,
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--root", type=Path, required=True)
              parser.add_argument("--output", type=Path, required=True)
              parser.add_argument("--maximum-dimension", type=int, default=24000)
              args = parser.parse_args()
              result = render_svg(args.root.resolve(), args.output.resolve(), args.maximum_dimension)
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())

          PY
          python -m py_compile "$RUNNER_TEMP/build_cuckoo_manifold_svg.py"

      - name: Build the AI-readable manifold image
        shell: bash
        env:
          MAXIMUM_DIMENSION: ${{ inputs.maximum_dimension }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/dream-manifold-output"
          mkdir -p "$GITHUB_WORKSPACE/dream-manifold-output"

          python "$RUNNER_TEMP/build_cuckoo_manifold_svg.py"             --root "$GITHUB_WORKSPACE"             --output "$GITHUB_WORKSPACE/dream-manifold-output/DREAM_4D_CUCKOO_RGB_CMY_CODEBASE_MANIFOLD.svg"             --maximum-dimension "$MAXIMUM_DIMENSION"             | tee "$RUNNER_TEMP/dream-manifold-build.json"

      - name: Validate the generated image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          image = Path(
              "dream-manifold-output/"
              "DREAM_4D_CUCKOO_RGB_CMY_CODEBASE_MANIFOLD.svg"
          )
          if not image.is_file() or image.stat().st_size == 0:
              raise SystemExit("manifold SVG was not generated")

          root = ET.parse(image).getroot()
          if not root.tag.endswith("svg"):
              raise SystemExit("generated artifact is not an SVG image")

          text_nodes = [
              element
              for element in root.iter()
              if element.tag.endswith("text")
          ]
          if not text_nodes:
              raise SystemExit("generated SVG contains no visible code text")

          print(
              f"MANIFOLD_IMAGE_OK bytes={image.stat().st_size} "
              f"visible_text_nodes={len(text_nodes)}"
          )
          PY

      - name: Publish build summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## DREAM 4D Cuckoo RGB-CMY AI Manifold"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/dream-manifold-build.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the single manifold image
        uses: actions/upload-artifact@v4
        with:
          name: DREAM_4D_CUCKOO_RGB_CMY_CODEBASE_MANIFOLD
          path: dream-manifold-output/DREAM_4D_CUCKOO_RGB_CMY_CODEBASE_MANIFOLD.svg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
