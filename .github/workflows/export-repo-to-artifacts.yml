name: Export application code to CSV and JSON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-application-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build application-code CSV and JSON exports
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import csv
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          ROOT = Path.cwd()

          OUT = ROOT / "repo-application-code-export"
          CSV_OUT = OUT / "csv"
          JSON_OUT = OUT / "json"

          APPLICATION_EXTENSIONS = {
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
              ".mjs",
              ".css",
              ".json",
          }

          APPLICATION_ROOTS = {
              "app",
              "pages",
              "components",
              "coresurfaces",
              "daydreams",
              "engins",
              "hooks",
              "lib",
              "src",
              "store",
              "stores",
              "contexts",
              "providers",
              "services",
              "styles",
              "types",
              "utils",
          }

          ROOT_APPLICATION_FILES = {
              "middleware.ts",
              "middleware.tsx",
              "middleware.js",
              "middleware.jsx",
              "next-env.d.ts",
          }

          IGNORE_DIRS = {
              ".git",
              ".github",
              "node_modules",
              ".next",
              "out",
              "dist",
              "build",
              "coverage",
              ".vercel",
              ".turbo",
              ".cache",
              ".parcel-cache",
              ".pnpm-store",
              ".yarn",
              ".swc",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "repo-file-export",
              "repo-application-code-export",
              "docs",
              "documentation",
              "research",
              "scripts",
              "script",
              "public",
              "migrations",
              "migration",
              "supabase",
              "test",
              "tests",
              "__tests__",
              "__mocks__",
              "fixtures",
              "fixture",
              "e2e",
              "playwright-report",
              "test-results",
          }

          IGNORE_FILE_PATTERNS = (
              ".test.",
              ".spec.",
              ".stories.",
              ".story.",
              ".mock.",
              ".fixture.",
          )

          SAFE_ENV_FILES = {
              ".env.example",
              ".env.sample",
              ".env.template",
              ".env.local.example",
              ".env.development.example",
              ".env.production.example",
          }

          def rel(path: Path) -> str:
              return path.relative_to(ROOT).as_posix()

          def ignored(path: Path) -> bool:
              parts = path.relative_to(ROOT).parts
              return any(part in IGNORE_DIRS for part in parts)

          def secret_env(path: Path) -> bool:
              name = path.name
              if name in SAFE_ENV_FILES:
                  return False
              return name == ".env" or name.startswith(".env.")

          def ignored_file_name(path: Path) -> bool:
              lower_name = path.name.lower()
              return any(pattern in lower_name for pattern in IGNORE_FILE_PATTERNS)

          def inside_application_root(path: Path) -> bool:
              parts = path.relative_to(ROOT).parts

              if not parts:
                  return False

              if len(parts) == 1:
                  return path.name in ROOT_APPLICATION_FILES

              return parts[0] in APPLICATION_ROOTS

          def included(path: Path) -> bool:
              return (
                  path.is_file()
                  and not ignored(path)
                  and not secret_env(path)
                  and not ignored_file_name(path)
                  and inside_application_root(path)
                  and path.suffix.lower() in APPLICATION_EXTENSIONS
              )

          def binary_file(data: bytes) -> bool:
              return b"\x00" in data[:4096]

          def safe_name(source_path: str, new_ext: str) -> str:
              safe = source_path.replace("\\", "/")
              safe = re.sub(r"[^A-Za-z0-9._/-]+", "_", safe)
              safe = safe.replace("/", "__")
              digest = hashlib.sha256(source_path.encode("utf-8")).hexdigest()[:12]

              if len(safe) > 180:
                  safe = safe[-180:]

              return f"{safe}.{digest}{new_ext}"

          def read_record(path: Path) -> dict:
              data = path.read_bytes()
              source_path = rel(path)
              suffix = path.suffix.lower()
              is_binary = binary_file(data)

              if is_binary:
                  content_text = ""
                  content_base64 = base64.b64encode(data).decode("ascii")
                  encoding = "base64"
              else:
                  try:
                      content_text = data.decode("utf-8")
                      encoding = "utf-8"
                  except UnicodeDecodeError:
                      content_text = data.decode("utf-8", errors="replace")
                      encoding = "utf-8-replacement"

                  content_base64 = ""

              return {
                  "path": source_path,
                  "file_name": path.name,
                  "extension": suffix,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "is_binary": is_binary,
                  "encoding": encoding,
                  "content_text": content_text,
                  "content_base64": content_base64,
              }

          def write_csv(path: Path, rows: list[dict]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)

              fieldnames = [
                  "path",
                  "file_name",
                  "extension",
                  "size_bytes",
                  "sha256",
                  "is_binary",
                  "encoding",
                  "content_text",
                  "content_base64",
              ]

              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)

          if OUT.exists():
              shutil.rmtree(OUT)

          CSV_OUT.mkdir(parents=True, exist_ok=True)
          JSON_OUT.mkdir(parents=True, exist_ok=True)

          files = sorted(
              [path for path in ROOT.rglob("*") if included(path)],
              key=lambda path: rel(path).lower(),
          )

          records = [read_record(path) for path in files]

          write_csv(CSV_OUT / "application-code.csv", records)

          for record in records:
              output_name = safe_name(record["path"], ".csv")
              write_csv(CSV_OUT / "files" / output_name, [record])

          (JSON_OUT / "application-code.json").write_text(
              json.dumps(records, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          for record in records:
              output_name = safe_name(record["path"], ".json")
              output_path = JSON_OUT / "files" / output_name
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(
                  json.dumps(record, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          manifest = {
              "purpose": "Application code only export",
              "included_extensions": sorted(APPLICATION_EXTENSIONS),
              "included_roots": sorted(APPLICATION_ROOTS),
              "included_root_files": sorted(ROOT_APPLICATION_FILES),
              "excluded_dirs": sorted(IGNORE_DIRS),
              "excluded_file_patterns": list(IGNORE_FILE_PATTERNS),
              "total_files_converted": len(records),
              "csv_export": {
                  "combined": "application-code.csv",
                  "per_file_folder": "files/",
              },
              "json_export": {
                  "combined": "application-code.json",
                  "per_file_folder": "files/",
              },
          }

          (CSV_OUT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (JSON_OUT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          summary = f"""# Application code export complete

          Included file types:

          `{", ".join(sorted(APPLICATION_EXTENSIONS))}`

          Included roots:

          `{", ".join(sorted(APPLICATION_ROOTS))}`

          Total application files converted: **{len(records)}**
          """

          print(summary)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              Path(step_summary).write_text(summary, encoding="utf-8")
          PY

      - name: Upload application-code CSV artifact zip
        uses: actions/upload-artifact@v4
        with:
          name: repo-application-code-csv
          path: repo-application-code-export/csv
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload application-code JSON artifact zip
        uses: actions/upload-artifact@v4
        with:
          name: repo-application-code-json
          path: repo-application-code-export/json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
