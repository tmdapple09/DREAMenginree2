name: Export listed repo file types to CSV and JSON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-listed-file-types:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build CSV and JSON exports
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import csv
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          ROOT = Path.cwd()

          OUT = ROOT / "repo-file-export"
          CSV_OUT = OUT / "csv"
          JSON_OUT = OUT / "json"

          FILE_EXTENSIONS = {
              ".ts",
              ".tsx",
              ".md",
              ".json",
              ".mjs",
              ".py",
              ".css",
              ".js",
              ".sh",
              ".svg",
              ".wasm",
              ".html",
          }

          REQUIRED_ROOT_DOCS = [
              "README.md",
              "ARCHITECTURE.md",
              "FILE_TREE.md",
          ]

          IGNORE_DIRS = {
              ".git",
              "node_modules",
              ".next",
              "out",
              "dist",
              "build",
              "coverage",
              ".vercel",
              ".turbo",
              ".cache",
              ".parcel-cache",
              ".pnpm-store",
              ".yarn",
              ".swc",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "repo-file-export",
          }

          SAFE_ENV_FILES = {
              ".env.example",
              ".env.sample",
              ".env.template",
              ".env.local.example",
              ".env.development.example",
              ".env.production.example",
          }

          def rel(path: Path) -> str:
              return path.relative_to(ROOT).as_posix()

          def ignored(path: Path) -> bool:
              parts = path.relative_to(ROOT).parts
              return any(part in IGNORE_DIRS for part in parts)

          def secret_env(path: Path) -> bool:
              name = path.name
              if name in SAFE_ENV_FILES:
                  return False
              return name == ".env" or name.startswith(".env.")

          def included(path: Path) -> bool:
              return (
                  path.is_file()
                  and not ignored(path)
                  and not secret_env(path)
                  and path.suffix.lower() in FILE_EXTENSIONS
              )

          def binary_file(data: bytes, suffix: str) -> bool:
              return suffix == ".wasm" or b"\x00" in data[:4096]

          def safe_name(source_path: str, new_ext: str) -> str:
              safe = source_path.replace("\\", "/")
              safe = re.sub(r"[^A-Za-z0-9._/-]+", "_", safe)
              safe = safe.replace("/", "__")
              digest = hashlib.sha256(source_path.encode("utf-8")).hexdigest()[:12]
              if len(safe) > 180:
                  safe = safe[-180:]
              return f"{safe}.{digest}{new_ext}"

          def read_record(path: Path) -> dict:
              data = path.read_bytes()
              source_path = rel(path)
              suffix = path.suffix.lower()
              is_binary = binary_file(data, suffix)

              if is_binary:
                  content_text = ""
                  content_base64 = base64.b64encode(data).decode("ascii")
                  encoding = "base64"
              else:
                  try:
                      content_text = data.decode("utf-8")
                      encoding = "utf-8"
                  except UnicodeDecodeError:
                      content_text = data.decode("utf-8", errors="replace")
                      encoding = "utf-8-replacement"
                  content_base64 = ""

              return {
                  "path": source_path,
                  "file_name": path.name,
                  "extension": suffix,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "is_binary": is_binary,
                  "encoding": encoding,
                  "content_text": content_text,
                  "content_base64": content_base64,
              }

          def write_csv(path: Path, rows: list[dict]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              fieldnames = [
                  "path",
                  "file_name",
                  "extension",
                  "size_bytes",
                  "sha256",
                  "is_binary",
                  "encoding",
                  "content_text",
                  "content_base64",
              ]

              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)

          def copy_root_docs() -> None:
              for doc in REQUIRED_ROOT_DOCS:
                  source = ROOT / doc

                  if not source.is_file():
                      raise FileNotFoundError(f"Required root doc missing: {doc}")

                  for folder in (CSV_OUT, JSON_OUT):
                      target = folder / "root-docs" / doc
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)

          if OUT.exists():
              shutil.rmtree(OUT)

          CSV_OUT.mkdir(parents=True, exist_ok=True)
          JSON_OUT.mkdir(parents=True, exist_ok=True)

          files = sorted(
              [path for path in ROOT.rglob("*") if included(path)],
              key=lambda path: rel(path).lower(),
          )

          records = [read_record(path) for path in files]

          write_csv(CSV_OUT / "all-files.csv", records)

          for record in records:
              output_name = safe_name(record["path"], ".csv")
              write_csv(CSV_OUT / "files" / output_name, [record])

          (JSON_OUT / "all-files.json").write_text(
              json.dumps(records, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          for record in records:
              output_name = safe_name(record["path"], ".json")
              output_path = JSON_OUT / "files" / output_name
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(
                  json.dumps(record, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          copy_root_docs()

          manifest = {
              "included_extensions": sorted(FILE_EXTENSIONS),
              "root_docs_copied_exactly": REQUIRED_ROOT_DOCS,
              "total_files_converted": len(records),
              "csv_export": {
                  "combined": "all-files.csv",
                  "per_file_folder": "files/",
                  "root_docs_folder": "root-docs/",
              },
              "json_export": {
                  "combined": "all-files.json",
                  "per_file_folder": "files/",
                  "root_docs_folder": "root-docs/",
              },
          }

          (CSV_OUT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (JSON_OUT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          summary = f"""# Repo file export complete

          Converted file types:

          `{", ".join(sorted(FILE_EXTENSIONS))}`

          Total files converted: **{len(records)}**

          Root docs copied exactly from repo root:

          - `README.md`
          - `ARCHITECTURE.md`
          - `FILE_TREE.md`
          """

          print(summary)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              Path(step_summary).write_text(summary, encoding="utf-8")
          PY

      - name: Upload CSV artifact zip
        uses: actions/upload-artifact@v4
        with:
          name: repo-files-csv
          path: repo-file-export/csv
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload JSON artifact zip
        uses: actions/upload-artifact@v4
        with:
          name: repo-files-json
          path: repo-file-export/json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
