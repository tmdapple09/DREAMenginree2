name: "🔍 Full Codebase Audit"

on:
  workflow_dispatch:
    inputs:
      fail_on_error:
        description: 'Fail the workflow if errors are found?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  audit:
    name: Full Error Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          packageManager: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
        continue-on-error: true

      - name: Create audit report directory
        run: mkdir -p audit-reports

      - name: '[1/12] TypeScript — type check'
        id: typescript
        run: |
          echo "## 1. TypeScript Type Errors" >> audit-reports/report.md
          pnpm tsc --noEmit --pretty false 2>&1 | tee audit-reports/typescript-raw.txt || true

          COUNT=$(grep -c "error TS" audit-reports/typescript-raw.txt | head -n 1 || echo 0)
          if [ -z "$COUNT" ]; then COUNT=0; fi
          echo "typescript_errors=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -gt 0 ]; then
            echo '```' >> audit-reports/report.md
            cat audit-reports/typescript-raw.txt >> audit-reports/report.md
            echo '```' >> audit-reports/report.md
          else
            echo "✅ No TypeScript errors detected." >> audit-reports/report.md
          fi
          echo "" >> audit-reports/report.md
          echo "**TypeScript errors found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[2/12] Type Root Cause Clustering + Definition Discovery'
        id: root_causes
        run: |
          echo "## 2. Type Root Cause Clustering + Definition Discovery" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          node <<'NODE' 2>&1 | tee audit-reports/root-causes.txt >> audit-reports/report.md
          const fs = require('fs');
          const { execSync } = require('child_process');

          const rawPath = 'audit-reports/typescript-raw.txt';
          if (!fs.existsSync(rawPath)) {
            console.log('No TypeScript diagnostics available.');
            process.exit(0);
          }

          const raw = fs.readFileSync(rawPath, 'utf8');
          const lines = raw.split(/\r?\n/);

          const byFile = new Map();
          const byCode = new Map();
          const bySymbol = new Map();

          function add(map, key, value) {
            if (!key) return;
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(value);
          }

          function symbolFromMessage(msg) {
            const patterns = [
              /Property '([^']+)' does not exist on type/,
              /Cannot find name '([^']+)'/,
              /Cannot find module '([^']+)'/,
              /has no exported member '([^']+)'/,
              /Type '([^']+)' is not assignable to type/,
              /Argument of type '([^']+)' is not assignable/,
              /Object is possibly '([^']+)'/,
              /Property '([^']+)' does not exist/,
            ];

            for (const re of patterns) {
              const m = msg.match(re);
              if (m) return m[1];
            }
            return null;
          }

          function searchDefinitions(symbol) {
            if (!symbol) return [];
            const escaped = symbol.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const cmd = [
              `grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' `,
              `'(^|[[:space:]])(interface|type|class|function|const|let|var)[[:space:]]+${escaped}([[:space:]=(<{:]|$)|export[[:space:]]+(declare[[:space:]]+)?(interface|type|class|function|const|let|var)[[:space:]]+${escaped}([[:space:]=(<{:]|$))' `,
              `app lib src pages components engins . 2>/dev/null`
            ].join('');

            try {
              const out = execSync(cmd, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
              if (!out) return [];
              return out.split(/\r?\n/).slice(0, 10);
            } catch {
              return [];
            }
          }

          const errors = [];

          for (const line of lines) {
            const m = line.match(/^(.+\.tsx?)\((\d+),(\d+)\): error (TS\d+): (.+)$/);
            if (!m) continue;

            const [, file, ln, col, code, msg] = m;
            const item = { file, ln: Number(ln), col: Number(col), code, msg };
            errors.push(item);

            add(byFile, file, item);
            add(byCode, code, item);

            const symbol = symbolFromMessage(msg);
            add(bySymbol, symbol, item);
          }

          console.log('═══════════════════════════════════════');
          console.log('TOP FILE BREAKERS');
          console.log('═══════════════════════════════════════');

          [...byFile.entries()]
            .sort((a, b) => b[1].length - a[1].length)
            .slice(0, 15)
            .forEach(([file, items], index) => {
              console.log('');
              console.log(`#${index + 1} ${file}`);
              console.log(`  Impact: ${items.length} errors`);
              console.log(`  Codes: ${[...new Set(items.map(x => x.code))].join(', ')}`);
            });

          console.log('');
          console.log('═══════════════════════════════════════');
          console.log('TOP ERROR CODES');
          console.log('═══════════════════════════════════════');

          [...byCode.entries()]
            .sort((a, b) => b[1].length - a[1].length)
            .forEach(([code, items]) => {
              console.log(`${code}: ${items.length}`);
            });

          console.log('');
          console.log('═══════════════════════════════════════');
          console.log('LIKELY ROOT SYMBOLS');
          console.log('═══════════════════════════════════════');

          const symbolEntries = [...bySymbol.entries()]
            .filter(([key]) => key)
            .sort((a, b) => b[1].length - a[1].length)
            .slice(0, 25);

          for (const [symbol, items] of symbolEntries) {
            const files = [...new Set(items.map(x => x.file))].slice(0, 5).join(', ');
            const defs = searchDefinitions(symbol);

            console.log('');
            console.log(symbol);
            console.log(`  Impact: ${items.length} errors`);
            console.log(`  Files: ${files}`);

            if (defs.length) {
              console.log('  Definitions:');
              defs.forEach(d => console.log(`    ${d}`));
            } else {
              console.log('  Definitions: NOT FOUND');
            }
          }

          console.log('');
          console.log('═══════════════════════════════════════');
          console.log('ROOT CAUSE HINTS');
          console.log('═══════════════════════════════════════');

          for (const [symbol, items] of symbolEntries.filter(([k, v]) => k && v.length >= 3).slice(0, 10)) {
            console.log('');
            console.log(`${symbol} → affects ${items.length} diagnostics`);
          }

          console.log('');
          console.log('Summary Metrics:');
          console.log(JSON.stringify({
            totalErrors: errors.length,
            impactedFiles: byFile.size,
            impactedCodes: byCode.size,
            likelySymbols: symbolEntries.filter(([k]) => k).length
          }));
          NODE

          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[3/12] Next.js — production build check'
        id: nextbuild
        run: |
          echo "## 3. Next.js Build Errors" >> audit-reports/report.md
          pnpm run build 2>&1 | tee audit-reports/build-raw.txt || true

          echo "### Build error lines:" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md
          grep -E "^(Error|error|Type error|×|\s+\^|Failed)" \
            audit-reports/build-raw.txt \
            >> audit-reports/report.md || echo "(none)" >> audit-reports/report.md
          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[4/12] Import resolution — missing modules'
        id: imports
        run: |
          echo "## 4. Missing / Broken Imports" >> audit-reports/report.md

          pnpm tsc --noEmit --pretty false 2>&1 \
            | grep -E "Cannot find module|Could not find|has no exported member|is not a module" \
            | sort -u \
            | tee audit-reports/imports-raw.txt || true

          COUNT=$(wc -l < audit-reports/imports-raw.txt)
          if [ "$COUNT" -gt 0 ]; then
            echo '```' >> audit-reports/report.md
            cat audit-reports/imports-raw.txt >> audit-reports/report.md
            echo '
```' >> audit-reports/report.md
          else
            echo "✅ All import graphs resolved smoothly." >> audit-reports/report.md
          fi
          echo "" >> audit-reports/report.md
          echo "**Import errors found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[5/12] Dead code — unused exports'
        id: unused_exports
        run: |
          echo "## 5. Unused Exports (dead code)" >> audit-reports/report.md

          pnpm dlx ts-prune \
            2>&1 | tee audit-reports/unused-exports-raw.txt || true

          COUNT=$(wc -l < audit-reports/unused-exports-raw.txt)
          if [ "$COUNT" -gt 0 ]; then
            echo '```' >> audit-reports/report.md
            cat audit-reports/unused-exports-raw.txt >> audit-reports/report.md
            echo '```' >> audit-reports/report.md
          else
            echo "✅ No dead exports detected." >> audit-reports/report.md
          fi
          echo "" >> audit-reports/report.md
          echo "**Unused exports found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[6/12] Circular dependencies'
        id: circular
        run: |
          echo "## 6. Circular Dependencies" >> audit-reports/report.md

          pnpm dlx madge \
            --circular \
            --extensions ts,tsx \
            --ts-config tsconfig.json \
            . \
            2>&1 | tee audit-reports/circular-raw.txt || true

          COUNT=$(grep -c "→\|Circular" audit-reports/circular-raw.txt || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo '```' >> audit-reports/report.md
            cat audit-reports/circular-raw.txt >> audit-reports/report.md
            echo '
```' >> audit-reports/report.md
          else
            echo "✅ Absolute linear tracking. No recursive files found." >> audit-reports/report.md
          fi
          echo "" >> audit-reports/report.md
          echo "**Circular dependency chains found: $COUNT**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[7/12] Environment variables — undeclared usages'
        id: env_vars
        run: |
          echo "## 7. Environment Variable Issues" >> audit-reports/report.md

          DECLARED_KEYS=""
          for f in .env.example .env.local.example .env.production.example; do
            if [ -f "$f" ]; then
              KEYS=$(grep -oP '^[A-Z_][A-Z0-9_]+(?==)' "$f" || true)
              DECLARED_KEYS="$DECLARED_KEYS $KEYS"
            fi
          done

          echo '```' >> audit-reports/report.md
          echo "Declared keys found in example configuration templates:" >> audit-reports/report.md
          echo "$DECLARED_KEYS" | tr ' ' '\n' | sort -u >> audit-reports/report.md
          echo "" >> audit-reports/report.md

          echo "All env keys referenced across runtime scope:" >> audit-reports/report.md
          grep -rhoP '(?:process\.env\.|env\.)[A-Z_][A-Z0-9_]+' \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            app/ lib/ src/ pages/ components/ 2>/dev/null \
            | sed 's/process\.env\.\|env\.//' \
            | sort -u \
            | tee audit-reports/env-used.txt \
            >> audit-reports/report.md || true

          echo "" >> audit-reports/report.md
          echo "Undeclared additions used in source but missing from .env instances:" >> audit-reports/report.md
          comm -23 \
            <(sort -u audit-reports/env-used.txt) \
            <(echo "$DECLARED_KEYS" | tr ' ' '\n' | sort -u) \
            | tee audit-reports/env-missing.txt \
            >> audit-reports/report.md || true

          MISSING=$(wc -l < audit-reports/env-missing.txt)
          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
          echo "**Undeclared env vars used: $MISSING**" >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[8/12] Security — hardcoded secrets scan'
        id: secrets
        run: |
          echo "## 8. Hardcoded Secrets / Sensitive Strings" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          curl -sSfL \
            [https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.4_linux_x64.tar.gz](https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.4_linux_x64.tar.gz) \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path audit-reports/gitleaks-raw.json \
            --no-git \
            --verbose \
            2>&1 | tee audit-reports/gitleaks-stdout.txt || true

          if [ -f audit-reports/gitleaks-raw.json ] && [ -s audit-reports/gitleaks-raw.json ]; then
            node -e "
              const fs = require('fs');
              try {
                const findings = JSON.parse(fs.readFileSync('audit-reports/gitleaks-raw.json','utf8') || '[]');
                findings.forEach(f => {
                  console.log('FILE: ' + f.File + ':' + f.StartLine);
                  console.log('  Rule: ' + f.RuleID);
                  console.log('  Match: ' + f.Match.replace(/./g, '*').substring(0,40) + '...');
                });
                console.log('Total: ' + findings.length + ' leak metric threshold target(s)');
              } catch(e) { console.log('Empty context trace sequence: ' + e.message); }
            " >> audit-reports/report.md
          else
            echo "✅ Absolute validation. 0 credentials or signature strings leaked." >> audit-reports/report.md
          fi

          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[9/12] Dependencies — vulnerability audit'
        id: deps
        run: |
          echo "## 9. Dependency Vulnerabilities" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          pnpm audit --json 2>/dev/null \
            | node -e "
              const chunks = [];
              process.stdin.on('data', c => chunks.push(c));
              process.stdin.on('end', () => {
                try {
                  const data = JSON.parse(chunks.join('') || '{}');
                  const vulns = data.vulnerabilities || {};
                  Object.entries(vulns).forEach(([pkg, v]) => {
                    const sev = v.severity;
                    const via = (v.via || []).map(x => typeof x === 'string' ? x : x.title || x.url || '?').join(', ');
                    console.log('[' + sev.toUpperCase() + '] ' + pkg + ' — via: ' + via);
                  });
                  const meta = data.metadata || {};
                  console.log('\nSummary Metrics:', JSON.stringify(meta.vulnerabilities || {}));
                } catch(e) { console.log('Core module structural parameters unvulnerable: ' + e.message); }
              });
            " 2>&1 | tee audit-reports/deps-raw.txt \
            >> audit-reports/report.md || true

          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[10/12] Supabase — table usage vs type definitions'
        id: supabase
        run: |
          echo "## 10. Supabase Table / RPC Usage Audit" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          echo "=== .from() table references ===" >> audit-reports/report.md
          grep -rhoP "\.from\(['\"]([^'\"]+)['\"]\)" app/ lib/ src/ pages/ 2>/dev/null | sort -u >> audit-reports/report.md || true

          echo -e "\n=== .rpc() functions referenced ===" >> audit-reports/report.md
          grep -rhoP "\.rpc\(['\"]([^'\"]+)['\"]\)" app/ lib/ src/ pages/ 2>/dev/null | sort -u >> audit-reports/report.md || true

          echo -e "\n=== Tables bypassed via 'as never' ===" >> audit-reports/report.md
          grep -rn "from(.*as never\|'as never'" app/ lib/ src/ pages/ 2>/dev/null >> audit-reports/report.md || echo "(none)" >> audit-reports/report.md

          echo -e "\n=== Fallback overrides to untyped Supabase Client ===" >> audit-reports/report.md
          grep -rn "as unknown as SupabaseClient" app/ lib/ src/ pages/ 2>/dev/null >> audit-reports/report.md || echo "(none)" >> audit-reports/report.md

          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[11/12] Per-file TypeScript error breakdown'
        id: per_file
        run: |
          echo "## 11. Per-File TypeScript Error Breakdown" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          node -e "
            const fs = require('fs');
            if (!fs.existsSync('audit-reports/typescript-raw.txt')) {
              console.log('No compilation data to evaluate.');
              process.exit(0);
            }
            const raw = fs.readFileSync('audit-reports/typescript-raw.txt', 'utf8');
            const lines = raw.split('\n');

            const fileMap = {};
            for (const line of lines) {
              const m = line.match(/^(.+\.tsx?)\((\d+),(\d+)\): (error|warning) (TS\d+): (.+)$/);
              if (!m) continue;
              const [, file, ln, col, severity, code, msg] = m;
              if (!fileMap[file]) fileMap[file] = [];
              fileMap[file].push({ ln, col, severity, code, msg });
            }

            const files = Object.keys(fileMap).sort();
            if (files.length === 0) {
              console.log('✅ 100% clean codebase parsing.');
            } else {
              for (const file of files) {
                const errs = fileMap[file];
                console.log('📄 ' + file + ' (' + errs.length + ' type crash instances)');
                errs.forEach(e => console.log('  Line ' + e.ln + ':' + e.col + '  [' + e.code + '] ' + e.msg));
              }
            }
          " 2>&1 | tee audit-reports/per-file-ts.txt >> audit-reports/report.md

          echo '
```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: '[12/12] Runtime danger patterns'
        id: patterns
        run: |
          echo "## 12. Runtime Danger Patterns" >> audit-reports/report.md
          echo '```' >> audit-reports/report.md

          node -e "
            const fs = require('fs');
            const path = require('path');

            const DIRS = ['app', 'lib', 'src', 'pages', 'components'].filter(d => fs.existsSync(d));
            const targets = [
              { label: 'console.log left in production', regex: /console\\.log\\(/ },
              { label: 'TODO / FIXME metrics left outstanding', regex: /(TODO|FIXME|HACK):/ },
              { label: 'Bypassing strict safety via \"as any\"', regex: /\\sas\\sany\\b/ },
              { label: 'TypeScript suppression rules (@ts-ignore)', regex: /@ts-ignore/ },
              { label: 'Evaluated raw execution scripts (eval)', regex: /\\beval\\(/ },
              { label: 'Raw HTML cross-site injection surface (dangerouslySetInnerHTML)', regex: /dangerouslySetInnerHTML/ }
            ];

            function scan(dir) {
              const files = fs.readdirSync(dir);
              for (const f of files) {
                const fp = path.join(dir, f);
                const stat = fs.statSync(fp);
                if (stat.isDirectory()) {
                  scan(fp);
                } else if (/\.(js|ts|tsx)$/.test(f)) {
                  const content = fs.readFileSync(fp, 'utf8');
                  targets.forEach(t => {
                    if (t.regex.test(content)) {
                      t.found = (t.found || 0) + 1;
                    }
                  });
                }
              }
            }

            DIRS.forEach(scan);
            targets.forEach(t => {
              console.log((t.found ? '⚠️' : '✅') + ' ' + t.label + ': ' + (t.found || 0) + ' matches tracked.');
            });
          " 2>&1 | tee audit-reports/patterns-raw.txt >> audit-reports/report.md

          echo '```' >> audit-reports/report.md
          echo "" >> audit-reports/report.md
        continue-on-error: true

      - name: Build final summary report
        run: |
          SUMMARY_FILE="audit-reports/summary.md"

          echo "# 🔍 Full Codebase Audit Report" > $SUMMARY_FILE
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $SUMMARY_FILE
          echo "Commit Signature: ${{ github.sha }}" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "## 🗂 Executive Summary Metrics" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          TS_ERRORS=$(grep -c "error TS" audit-reports/typescript-raw.txt 2>/dev/null | head -n 1 || echo 0)
          HOT_FILES=$(grep -c "^#\d\+" audit-reports/root-causes.txt 2>/dev/null | head -n 1 || echo 0)

          if [ -z "$TS_ERRORS" ]; then TS_ERRORS=0; fi
          if [ -z "$HOT_FILES" ]; then HOT_FILES=0; fi

          echo "| Engine Target Vector | Detected Integrity Anomalies |" >> $SUMMARY_FILE
          echo "|---|---|" >> $SUMMARY_FILE
          echo "| Core TypeScript Syntax Type Errors | $TS_ERRORS |" >> $SUMMARY_FILE
          echo "| Root Cause Hotspots Listed | $HOT_FILES |" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "---" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          cat audit-reports/report.md >> $SUMMARY_FILE
          cp $SUMMARY_FILE audit-reports/FULL_AUDIT_REPORT.md
        continue-on-error: true

      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-report-${{ github.run_number }}
          path: audit-reports/
          retention-days: 30
        if: always()

      - name: Fail workflow if errors found (optional)
        if: ${{ inputs.fail_on_error == 'true' }}
        run: |
          TS_ERRORS=$(grep -c "error TS" audit-reports/typescript-raw.txt 2>/dev/null | head -n 1 || echo 0)
          if [ -z "$TS_ERRORS" ]; then TS_ERRORS=0; fi
          if [ "$TS_ERRORS" -gt 0 ]; then
             echo "❌ Static verification failure metrics exceeded threshold limitations. Blocking runtime execution chain."
             exit 1
          fi
