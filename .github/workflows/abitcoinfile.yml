name: aBitcoinFile

# Hidden-coordinate 4D joint inference with adaptive protocol-path integration.
# The 80-byte header remains the protocol container and the solver state contains
# exactly the selected hidden coordinates. The geometric SHA pullback equations and
# protocol-linked chain coordinates are solved together in one weighted normal system.
# No candidate branching, candidate queue, fallback edges, or per-bit enumeration.

"on":
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string

      block_height:
        description: "Bitcoin block height; tip/current uses the current tip"
        required: false
        default: "953568"
        type: string

      block_hash:
        description: "Displayed block hash; auto derives it from block_height"
        required: false
        default: "auto"
        type: string

      raw_header_hex:
        description: "Exact 80-byte header, or fetch to retrieve it"
        required: false
        default: "fetch"
        type: string

      expected_block_hash:
        description: "Expected displayed hash, or derive"
        required: false
        default: "derive"
        type: string

      recovery_scope:
        description: "Header information hidden from reconstruction"
        required: true
        default: "selected_fields"
        type: choice
        options:
          - selected_fields
          - selected_bits
          - full_header

      hidden_fields:
        description: "Comma-separated: version,previous_hash,merkle_root,timestamp,bits,nonce"
        required: false
        default: "timestamp,nonce"
        type: string

      hidden_bit_ranges:
        description: "Half-open serialized-header bit ranges, or none"
        required: false
        default: "none"
        type: string

      context_mode:
        description: "Evidence used by E_global"
        required: true
        default: "hash_only"
        type: choice
        options:
          - hash_only
          - derived_bitcoin
          - all_public

      infer_mask:
        description: "Infer m instead of fixing the configured visibility mask"
        required: false
        default: false
        type: boolean

      infer_permutation:
        description: "Infer the 16-piece projection permutation pi"
        required: false
        default: false
        type: boolean

      infer_orientation:
        description: "Infer the 16 C3 orientations O_i"
        required: false
        default: false
        type: boolean

      allow_observation_noise:
        description: "Use finite Gaussian energy for surviving observation disagreement"
        required: false
        default: false
        type: boolean

      posterior_models:
        description: "Exact completed models requested; 0 continues until another budget terminates"
        required: false
        default: "1"
        type: string

      fail_on_incomplete:
        description: "Fail the workflow after artifacts upload when no exact model was validated"
        required: false
        default: true
        type: boolean

      sigma:
        description: "Observation-noise scale sigma"
        required: false
        default: "1.0"
        type: string

      lambda_local:
        description: "Weight lambda on exact forward/backward local compatibility"
        required: false
        default: "1.0"
        type: string

      beta_global:
        description: "Weight beta on Bitcoin global coherence"
        required: false
        default: "1.0"
        type: string

      gamma_missing:
        description: "Weight gamma on C(m)"
        required: false
        default: "1.0"
        type: string

      a0:
        description: "a0 in f(x)=a0*x/(1+x^n)^(1/n)"
        required: false
        default: "1.2e-14"
        type: string

      n:
        description: "n in f(x)=a0*x/(1+x^n)^(1/n)"
        required: false
        default: "2.0"
        type: string

      projection_noise_sigma:
        description: "Continuous xi used only in exported 3D projections"
        required: false
        default: "0.0"
        type: string

      emit_lattice_bits:
        description: "Export solved bits across the 4D round/lane lattice"
        required: false
        default: true
        type: boolean

      z3_random_seed:
        description: "Retained input name; deterministic tie-break seed only, no Z3 is used"
        required: false
        default: "0"
        type: string

      api_base:
        description: "Esplora-compatible Bitcoin API base"
        required: false
        default: "https://blockstream.info/api"
        type: string

permissions:
  contents: read

concurrency:
  group: bitcoin-sha256d-4d-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ${{ inputs.runner_label }}

    env:
      BLOCK_HEIGHT: ${{ inputs.block_height }}
      BLOCK_HASH: ${{ inputs.block_hash }}
      RAW_HEADER_HEX: ${{ inputs.raw_header_hex }}
      EXPECTED_BLOCK_HASH: ${{ inputs.expected_block_hash }}
      RECOVERY_SCOPE: ${{ inputs.recovery_scope }}
      HIDDEN_FIELDS: ${{ inputs.hidden_fields }}
      HIDDEN_BIT_RANGES: ${{ inputs.hidden_bit_ranges }}
      CONTEXT_MODE: ${{ inputs.context_mode }}
      INFER_MASK: ${{ inputs.infer_mask }}
      INFER_PERMUTATION: ${{ inputs.infer_permutation }}
      INFER_ORIENTATION: ${{ inputs.infer_orientation }}
      ALLOW_OBSERVATION_NOISE: ${{ inputs.allow_observation_noise }}
      POSTERIOR_MODELS: ${{ inputs.posterior_models }}
      INFERENCE_MODE: "joint_hidden_coordinate_path_solve"
      MAX_RUNTIME_SECONDS: "1800"
      MAX_JOINT_ITERATIONS: "5000"
      CHECKPOINT_EVERY: "10"
      SIGMA: ${{ inputs.sigma }}
      LAMBDA_LOCAL: ${{ inputs.lambda_local }}
      BETA_GLOBAL: ${{ inputs.beta_global }}
      LAMBDA_PROTOCOL: "1.0"
      PROTOCOL_WARMUP_ITERATIONS: "12"
      PROTOCOL_RAMP_ITERATIONS: "24"
      PROTOCOL_STABILITY_WINDOW: "8"
      PROTOCOL_ENERGY_REL_TOL: "0.02"
      PROTOCOL_CORRECTION_REL_TOL: "0.08"
      GAMMA_MISSING: ${{ inputs.gamma_missing }}
      A0: ${{ inputs.a0 }}
      N_EXPONENT: ${{ inputs.n }}
      PROJECTION_NOISE_SIGMA: ${{ inputs.projection_noise_sigma }}
      EMIT_LATTICE_BITS: ${{ inputs.emit_lattice_bits }}
      DETERMINISTIC_SEED: ${{ inputs.z3_random_seed }}
      API_BASE: ${{ inputs.api_base }}
      MODEL_REVISION: "2026-07-16-protocol-joint-normal-system-r6"
      TRAJECTORY_LOOKAHEAD_BLOCKS: "210000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numerical projection dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=2,<3"

      - name: Run the direct 4D tesseract reconstruction
        id: solver
        shell: bash
        run: |
          set -o pipefail

          python - <<'PY' 2>&1 | tee bitcoin_sha256d_4d_inverse_console.log
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import os
          import sys
          import time
          import traceback
          import urllib.request
          from dataclasses import dataclass, replace
          from itertools import combinations, product
          from pathlib import Path
          from typing import Dict, Iterable, List, Optional, Sequence, Tuple

          import numpy as np

          MASK32 = 0xFFFFFFFF
          MASK40 = (1 << 40) - 1
          HEADER_BYTES = 80
          HEADER_BITS = HEADER_BYTES * 8
          HEADER_CHUNKS = 16
          CHUNK_BITS = 40
          HALVING_INTERVAL = 210_000
          SATOSHIS_PER_BTC = 100_000_000
          INITIAL_SUBSIDY_SATS = 50 * SATOSHIS_PER_BTC
          PROTOCOL_PATH_DIMENSION = 6

          API_BASE = os.environ.get("API_BASE", "https://blockstream.info/api").rstrip("/")
          BLOCK_HEIGHT_RAW = os.environ.get("BLOCK_HEIGHT", "953568").strip()
          BLOCK_HASH_RAW = os.environ.get("BLOCK_HASH", "auto").strip()
          RAW_HEADER_RAW = os.environ.get("RAW_HEADER_HEX", "fetch").strip()
          EXPECTED_HASH_RAW = os.environ.get("EXPECTED_BLOCK_HASH", "derive").strip()
          RECOVERY_SCOPE = os.environ.get("RECOVERY_SCOPE", "full_header").strip()
          HIDDEN_FIELDS = [
              value.strip()
              for value in os.environ.get(
                  "HIDDEN_FIELDS",
                  "version,previous_hash,merkle_root,timestamp,bits,nonce",
              ).split(",")
              if value.strip()
          ]
          HIDDEN_BIT_RANGES_RAW = os.environ.get("HIDDEN_BIT_RANGES", "none").strip()
          CONTEXT_MODE = os.environ.get("CONTEXT_MODE", "hash_only").strip()
          INFER_MASK = os.environ.get("INFER_MASK", "false").lower() == "true"
          INFER_PERMUTATION = os.environ.get("INFER_PERMUTATION", "false").lower() == "true"
          INFER_ORIENTATION = os.environ.get("INFER_ORIENTATION", "false").lower() == "true"
          ALLOW_OBSERVATION_NOISE = (
              os.environ.get("ALLOW_OBSERVATION_NOISE", "false").lower() == "true"
          )
          POSTERIOR_MODELS = int(os.environ.get("POSTERIOR_MODELS", "1"))
          SIGMA = float(os.environ.get("SIGMA", "1.0"))
          LAMBDA_LOCAL = float(os.environ.get("LAMBDA_LOCAL", "1.0"))
          BETA_GLOBAL = float(os.environ.get("BETA_GLOBAL", "1.0"))
          LAMBDA_PROTOCOL = float(os.environ.get("LAMBDA_PROTOCOL", "1.0"))
          PROTOCOL_WARMUP_ITERATIONS = int(
              os.environ.get("PROTOCOL_WARMUP_ITERATIONS", "12")
          )
          PROTOCOL_RAMP_ITERATIONS = int(
              os.environ.get("PROTOCOL_RAMP_ITERATIONS", "24")
          )
          PROTOCOL_STABILITY_WINDOW = int(
              os.environ.get("PROTOCOL_STABILITY_WINDOW", "8")
          )
          PROTOCOL_ENERGY_REL_TOL = float(
              os.environ.get("PROTOCOL_ENERGY_REL_TOL", "0.02")
          )
          PROTOCOL_CORRECTION_REL_TOL = float(
              os.environ.get("PROTOCOL_CORRECTION_REL_TOL", "0.08")
          )
          GAMMA_MISSING = float(os.environ.get("GAMMA_MISSING", "1.0"))
          A0 = float(os.environ.get("A0", "1.2e-14"))
          N_EXPONENT = float(os.environ.get("N_EXPONENT", "2.0"))
          PROJECTION_NOISE_SIGMA = float(os.environ.get("PROJECTION_NOISE_SIGMA", "0.0"))
          EMIT_LATTICE_BITS = os.environ.get("EMIT_LATTICE_BITS", "true").lower() == "true"
          DETERMINISTIC_SEED = int(os.environ.get("DETERMINISTIC_SEED", "0"))
          MODEL_REVISION = os.environ.get(
              "MODEL_REVISION", "2026-07-16-protocol-joint-normal-system-r6"
          )

          INFERENCE_MODE = os.environ.get(
              "INFERENCE_MODE", "joint_hidden_coordinate_path_solve"
          ).strip()
          TRAJECTORY_LOOKAHEAD_BLOCKS = int(
              os.environ.get("TRAJECTORY_LOOKAHEAD_BLOCKS", "210000")
          )
          MAX_RUNTIME_SECONDS = int(os.environ.get("MAX_RUNTIME_SECONDS", "1800"))
          MAX_JOINT_ITERATIONS = int(os.environ.get("MAX_JOINT_ITERATIONS", "5000"))
          CHECKPOINT_EVERY = int(os.environ.get("CHECKPOINT_EVERY", "10"))

          if POSTERIOR_MODELS < 0:
              raise ValueError("POSTERIOR_MODELS must be zero or positive")
          if SIGMA <= 0:
              raise ValueError("SIGMA must be positive")
          if N_EXPONENT <= 0:
              raise ValueError("N_EXPONENT must be positive")
          if LAMBDA_PROTOCOL < 0:
              raise ValueError("LAMBDA_PROTOCOL must be zero or positive")
          if PROTOCOL_WARMUP_ITERATIONS < 0:
              raise ValueError("PROTOCOL_WARMUP_ITERATIONS must be zero or positive")
          if PROTOCOL_RAMP_ITERATIONS <= 0:
              raise ValueError("PROTOCOL_RAMP_ITERATIONS must be positive")
          if PROTOCOL_STABILITY_WINDOW < 2:
              raise ValueError("PROTOCOL_STABILITY_WINDOW must be at least two")
          if PROTOCOL_ENERGY_REL_TOL < 0 or PROTOCOL_CORRECTION_REL_TOL < 0:
              raise ValueError("protocol stability tolerances must be zero or positive")
          if MAX_RUNTIME_SECONDS < 0 or MAX_JOINT_ITERATIONS < 0:
              raise ValueError("joint-solve limits must be zero or positive")
          if CHECKPOINT_EVERY <= 0:
              raise ValueError("CHECKPOINT_EVERY must be positive")
          if INFERENCE_MODE != "joint_hidden_coordinate_path_solve":
              raise ValueError(
                  "INFERENCE_MODE must be joint_hidden_coordinate_path_solve"
              )
          if TRAJECTORY_LOOKAHEAD_BLOCKS < 1:
              raise ValueError("TRAJECTORY_LOOKAHEAD_BLOCKS must be positive")

          REPORT = Path("bitcoin_sha256d_4d_inverse_report.txt")
          STATUS = Path("bitcoin_sha256d_4d_inverse_status.json")
          MODEL_SPEC = Path("bitcoin_sha256d_mathematical_model.txt")
          HEADER_RECOVERY = Path("bitcoin_sha256d_header_recovery.csv")
          ROUND_STATES = Path("bitcoin_sha256d_round_states.csv")
          TESSERACT_SLOTS = Path("bitcoin_sha256d_tesseract_slots.csv")
          LATTICE_BITS = Path("bitcoin_sha256d_lattice_bits.csv")
          PROJECTIONS = Path("bitcoin_sha256d_3d_projections.csv")
          JOINT_TRACE = Path("bitcoin_sha256d_4d_joint_trace.csv")
          JOINT_UPDATES = Path("bitcoin_sha256d_4d_joint_updates.csv")
          POSTERIOR = Path("bitcoin_sha256d_posterior_models.csv")
          TOLERANCE = Path("bitcoin_sha256d_tolerance_topology.csv")
          FUNCTIONALS = Path("bitcoin_sha256d_functional_identifiability.csv")
          MEASURE_AUDIT = Path("bitcoin_sha256d_measure_audit.csv")
          FREQUENCY_SPLIT = Path("bitcoin_sha256d_frequency_split.csv")
          GAUGE_DIAGNOSTICS = Path("bitcoin_sha256d_gauge_diagnostics.csv")
          STABILITY = Path("bitcoin_sha256d_stability.csv")
          STATE_SPACE = Path("bitcoin_sha256d_tesseract_state_space.json")
          CHECKPOINT = Path("bitcoin_sha256d_4d_checkpoint.json")
          PROTOCOL_TRAJECTORY = Path("bitcoin_protocol_trajectory.csv")
          PROTOCOL_CURVE = Path("bitcoin_protocol_supply_curve.svg")
          PROTOCOL_CONSTRAINTS = Path("bitcoin_protocol_joint_constraints.csv")
          HIDDEN_STATE = Path("bitcoin_sha256d_hidden_coordinate_state.csv")

          OUTPUT_PATHS = [
              STATUS,
              REPORT,
              MODEL_SPEC,
              HEADER_RECOVERY,
              ROUND_STATES,
              TESSERACT_SLOTS,
              LATTICE_BITS,
              PROJECTIONS,
              JOINT_TRACE,
              JOINT_UPDATES,
              POSTERIOR,
              TOLERANCE,
              FUNCTIONALS,
              MEASURE_AUDIT,
              FREQUENCY_SPLIT,
              GAUGE_DIAGNOSTICS,
              STABILITY,
              STATE_SPACE,
              CHECKPOINT,
              PROTOCOL_TRAJECTORY,
              PROTOCOL_CURVE,
              PROTOCOL_CONSTRAINTS,
              HIDDEN_STATE,
          ]

          FIELD_RANGES_BYTES = {
              "version": (0, 4),
              "previous_hash": (4, 36),
              "merkle_root": (36, 68),
              "timestamp": (68, 72),
              "bits": (72, 76),
              "nonce": (76, 80),
          }

          H0 = [
              0x6A09E667,
              0xBB67AE85,
              0x3C6EF372,
              0xA54FF53A,
              0x510E527F,
              0x9B05688C,
              0x1F83D9AB,
              0x5BE0CD19,
          ]

          K = [
              0x428A2F98, 0x71374491, 0xB5C0FBCF, 0xE9B5DBA5,
              0x3956C25B, 0x59F111F1, 0x923F82A4, 0xAB1C5ED5,
              0xD807AA98, 0x12835B01, 0x243185BE, 0x550C7DC3,
              0x72BE5D74, 0x80DEB1FE, 0x9BDC06A7, 0xC19BF174,
              0xE49B69C1, 0xEFBE4786, 0x0FC19DC6, 0x240CA1CC,
              0x2DE92C6F, 0x4A7484AA, 0x5CB0A9DC, 0x76F988DA,
              0x983E5152, 0xA831C66D, 0xB00327C8, 0xBF597FC7,
              0xC6E00BF3, 0xD5A79147, 0x06CA6351, 0x14292967,
              0x27B70A85, 0x2E1B2138, 0x4D2C6DFC, 0x53380D13,
              0x650A7354, 0x766A0ABB, 0x81C2C92E, 0x92722C85,
              0xA2BFE8A1, 0xA81A664B, 0xC24B8B70, 0xC76C51A3,
              0xD192E819, 0xD6990624, 0xF40E3585, 0x106AA070,
              0x19A4C116, 0x1E376C08, 0x2748774C, 0x34B0BCB5,
              0x391C0CB3, 0x4ED8AA4A, 0x5B9CCA4F, 0x682E6FF3,
              0x748F82EE, 0x78A5636F, 0x84C87814, 0x8CC70208,
              0x90BEFFFA, 0xA4506CEB, 0xBEF9A3F7, 0xC67178F2,
          ]

          INTERIOR_COORDS = sorted(product((1, 2), repeat=4))


          def emit(text: str = "") -> None:
              print(text, flush=True)


          def auto_blank(value: str, sentinels: set[str]) -> str:
              cleaned = value.strip()
              return "" if cleaned.lower() in sentinels else cleaned


          BLOCK_HEIGHT = auto_blank(BLOCK_HEIGHT_RAW, {"", "tip", "current", "current_tip"})
          BLOCK_HASH = auto_blank(BLOCK_HASH_RAW, {"", "auto", "derive", "from_height"})
          RAW_HEADER_HEX = auto_blank(RAW_HEADER_RAW, {"", "fetch", "auto", "from_api"}).lower()
          EXPECTED_BLOCK_HASH = auto_blank(
              EXPECTED_HASH_RAW, {"", "derive", "auto", "from_block"}
          ).lower()
          HIDDEN_BIT_RANGES = auto_blank(
              HIDDEN_BIT_RANGES_RAW, {"", "none", "auto", "use_hidden_fields"}
          )


          def http_text(path: str) -> str:
              request = urllib.request.Request(
                  f"{API_BASE}/{path.lstrip('/')}",
                  headers={"User-Agent": "bitcoin-sha256d-4d-direct-model/2.0"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8").strip()


          def http_json(path: str) -> dict:
              return json.loads(http_text(path))


          def rotr(x: int, n: int) -> int:
              return ((x >> n) | (x << (32 - n))) & MASK32


          def small_sigma0(x: int) -> int:
              return rotr(x, 7) ^ rotr(x, 18) ^ (x >> 3)


          def small_sigma1(x: int) -> int:
              return rotr(x, 17) ^ rotr(x, 19) ^ (x >> 10)


          def big_sigma0(x: int) -> int:
              return rotr(x, 2) ^ rotr(x, 13) ^ rotr(x, 22)


          def big_sigma1(x: int) -> int:
              return rotr(x, 6) ^ rotr(x, 11) ^ rotr(x, 25)


          def choose(x: int, y: int, z: int) -> int:
              return (x & y) ^ ((~x) & z)


          def majority(x: int, y: int, z: int) -> int:
              return (x & y) ^ (x & z) ^ (y & z)


          def words_from_bytes(data: bytes) -> List[int]:
              if len(data) % 4:
                  raise ValueError("word conversion requires a multiple of four bytes")
              return [int.from_bytes(data[i : i + 4], "big") for i in range(0, len(data), 4)]


          def words_to_bytes(words: Sequence[int]) -> bytes:
              return b"".join((word & MASK32).to_bytes(4, "big") for word in words)


          def expand_schedule(block64: bytes) -> List[int]:
              if len(block64) != 64:
                  raise ValueError("SHA-256 compression block must be 64 bytes")
              schedule = words_from_bytes(block64)
              for t in range(16, 64):
                  schedule.append(
                      (
                          small_sigma1(schedule[t - 2])
                          + schedule[t - 7]
                          + small_sigma0(schedule[t - 15])
                          + schedule[t - 16]
                      )
                      & MASK32
                  )
              return schedule


          @dataclass(frozen=True)
          class RoundState:
              phase: int
              round_index: int
              w: int
              state_in: Tuple[int, ...]
              t1: int
              t2: int
              state_out: Tuple[int, ...]


          @dataclass(frozen=True)
          class CompressionTrace:
              phase: int
              initial: Tuple[int, ...]
              schedule: Tuple[int, ...]
              rounds: Tuple[RoundState, ...]
              output: Tuple[int, ...]


          @dataclass(frozen=True)
          class BackwardCompatibility:
              required_words: Tuple[Tuple[int, ...], Tuple[int, ...], Tuple[int, ...]]
              backward_states: Tuple[Tuple[Tuple[int, ...], ...], ...]
              state_edge_hamming: int
              schedule_edge_hamming: int
              pullback_header: bytes


          @dataclass(frozen=True)
          class ProjectionState:
              mask: Tuple[int, ...]
              permutation: Tuple[int, ...]
              orientations: Tuple[int, ...]
              p0: int
              p1: int
              p2: int
              p3: int
              observation_hamming: int
              hard_constraints_ok: bool


          @dataclass(frozen=True)
          class Evaluation:
              header: bytes
              digest_raw: bytes
              displayed_hash: str
              traces: Tuple[CompressionTrace, CompressionTrace, CompressionTrace]
              compatibility: BackwardCompatibility
              projection: ProjectionState
              digest_hamming: int
              E_observation: float
              E_local: float
              E_global: float
              E_protocol: float
              protocol_weight: float
              C_missing: int
              total_energy: float
              transformed_energy: float
              exact_hash_match: bool
              observation_noise_effective: bool


          @dataclass(frozen=True)
          class HiddenCoordinateState:
              bit_indices: Tuple[int, ...]
              values: Tuple[int, ...]


          @dataclass(frozen=True)
          class HiddenSectionSystem:
              bit_indices: Tuple[int, ...]
              equation_names: Tuple[str, ...]
              operator: np.ndarray
              left_inverse: np.ndarray
              rank: int


          @dataclass(frozen=True)
          class ProtocolConstraintSystem:
              hidden_bit_indices: Tuple[int, ...]
              equation_names: Tuple[str, ...]
              header_bit_indices: Tuple[int, ...]
              operator: np.ndarray
              target_values: np.ndarray
              equation_weights: np.ndarray
              rank: int


          @dataclass(frozen=True)
          class JointCorrection:
              header: bytes
              state: HiddenCoordinateState
              raw_residual_bits: int
              correction_bits: int
              relaxed_projection_error: float
              binary_section_residual: float
              protocol_residual_bits: int
              protocol_binary_residual: float
              protocol_weight: float
              protocol_equation_count: int
              normal_condition_number: float
              section_count: int
              state_dimension: int
              operator_rank: int


          def compress(initial: Sequence[int], block64: bytes, phase: int) -> CompressionTrace:
              schedule = expand_schedule(block64)
              a, b, c, d, e, f, g, h = [value & MASK32 for value in initial]
              rounds: List[RoundState] = []
              for t in range(64):
                  state_in = (a, b, c, d, e, f, g, h)
                  t1 = (h + big_sigma1(e) + choose(e, f, g) + K[t] + schedule[t]) & MASK32
                  t2 = (big_sigma0(a) + majority(a, b, c)) & MASK32
                  state_out = (
                      (t1 + t2) & MASK32,
                      a,
                      b,
                      c,
                      (d + t1) & MASK32,
                      e,
                      f,
                      g,
                  )
                  rounds.append(RoundState(phase, t, schedule[t], state_in, t1, t2, state_out))
                  a, b, c, d, e, f, g, h = state_out
              output = tuple(
                  (initial[index] + value) & MASK32
                  for index, value in enumerate((a, b, c, d, e, f, g, h))
              )
              return CompressionTrace(phase, tuple(initial), tuple(schedule), tuple(rounds), output)


          def sha256d_trace(
              header: bytes,
          ) -> Tuple[bytes, Tuple[CompressionTrace, CompressionTrace, CompressionTrace]]:
              if len(header) != 80:
                  raise ValueError("Bitcoin header must be exactly 80 bytes")
              block0 = header[:64]
              block1 = header[64:] + b"\x80" + b"\x00" * 39 + HEADER_BITS.to_bytes(8, "big")
              trace0 = compress(H0, block0, 0)
              trace1 = compress(trace0.output, block1, 1)
              inner = words_to_bytes(trace1.output)
              block2 = inner + b"\x80" + b"\x00" * 23 + (256).to_bytes(8, "big")
              trace2 = compress(H0, block2, 2)
              return words_to_bytes(trace2.output), (trace0, trace1, trace2)


          def displayed_hash_from_raw(raw_digest: bytes) -> str:
              return raw_digest[::-1].hex()


          def hashlib_displayed_hash(header: bytes) -> str:
              return hashlib.sha256(hashlib.sha256(header).digest()).digest()[::-1].hex()


          def hamming_word(left: int, right: int) -> int:
              return ((left ^ right) & MASK32).bit_count()


          def hamming_bytes(left: bytes, right: bytes) -> int:
              if len(left) != len(right):
                  raise ValueError("hamming_bytes requires equal-length byte strings")
              return sum((a ^ b).bit_count() for a, b in zip(left, right))


          def hamming_state(left: Sequence[int], right: Sequence[int]) -> int:
              return sum(hamming_word(a, b) for a, b in zip(left, right))


          def inverse_round(state_out: Sequence[int], w: int, round_index: int) -> Tuple[int, ...]:
              ap, bp, cp, dp, ep, fp, gp, hp = [value & MASK32 for value in state_out]
              a, b, c = bp, cp, dp
              e, f, g = fp, gp, hp
              t2 = (big_sigma0(a) + majority(a, b, c)) & MASK32
              t1 = (ap - t2) & MASK32
              d = (ep - t1) & MASK32
              h = (t1 - big_sigma1(e) - choose(e, f, g) - K[round_index] - w) & MASK32
              return a, b, c, d, e, f, g, h


          def backward_states(
              trace: CompressionTrace, desired_output_words: Sequence[int]
          ) -> Tuple[Tuple[int, ...], ...]:
              working_end = tuple(
                  (desired_output_words[index] - trace.initial[index]) & MASK32 for index in range(8)
              )
              states: List[Optional[Tuple[int, ...]]] = [None] * 65
              states[64] = working_end
              for t in reversed(range(64)):
                  states[t] = inverse_round(states[t + 1], trace.schedule[t], t)  # type: ignore[arg-type]
              return tuple(tuple(state) for state in states if state is not None)


          def required_schedule_word(
              forward_state_in: Sequence[int], desired_state_out: Sequence[int], round_index: int
          ) -> int:
              a, b, c, _d, e, f, g, h = [value & MASK32 for value in forward_state_in]
              desired_a_out = desired_state_out[0] & MASK32
              t2 = (big_sigma0(a) + majority(a, b, c)) & MASK32
              required_t1 = (desired_a_out - t2) & MASK32
              return (
                  required_t1 - h - big_sigma1(e) - choose(e, f, g) - K[round_index]
              ) & MASK32


          def derive_backward_compatibility(
              traces: Tuple[CompressionTrace, CompressionTrace, CompressionTrace], target_raw: bytes
          ) -> BackwardCompatibility:
              trace0, trace1, trace2 = traces
              target_words = words_from_bytes(target_raw)
              backward2 = backward_states(trace2, target_words)
              required2 = tuple(
                  required_schedule_word(trace2.rounds[t].state_in, backward2[t + 1], t)
                  for t in range(64)
              )
              desired_inner_digest = required2[:8]
              backward1 = backward_states(trace1, desired_inner_digest)
              required1 = tuple(
                  required_schedule_word(trace1.rounds[t].state_in, backward1[t + 1], t)
                  for t in range(64)
              )
              desired_phase0_output = backward1[0]
              backward0 = backward_states(trace0, desired_phase0_output)
              required0 = tuple(
                  required_schedule_word(trace0.rounds[t].state_in, backward0[t + 1], t)
                  for t in range(64)
              )
              backward_all = (backward0, backward1, backward2)
              required_all = (required0, required1, required2)
              state_edge_hamming = 0
              schedule_edge_hamming = 0
              for trace, backward, required in zip(traces, backward_all, required_all):
                  forward_boundaries = [trace.rounds[0].state_in] + [row.state_out for row in trace.rounds]
                  state_edge_hamming += sum(
                      hamming_state(forward_state, backward_state)
                      for forward_state, backward_state in zip(forward_boundaries, backward)
                  )
                  schedule_edge_hamming += sum(
                      hamming_word(actual, wanted) for actual, wanted in zip(trace.schedule, required)
                  )
              pullback_header = words_to_bytes(required0[:16]) + words_to_bytes(required1[:4])
              return BackwardCompatibility(
                  required_all,
                  backward_all,
                  state_edge_hamming,
                  schedule_edge_hamming,
                  pullback_header,
              )


          def parse_hidden_bits() -> set[int]:
              if RECOVERY_SCOPE == "full_header":
                  return set(range(HEADER_BITS))
              hidden: set[int] = set()
              if RECOVERY_SCOPE == "selected_fields":
                  for field in HIDDEN_FIELDS:
                      if field not in FIELD_RANGES_BYTES:
                          raise ValueError(f"unknown hidden field: {field}")
                      start, end = FIELD_RANGES_BYTES[field]
                      hidden.update(range(start * 8, end * 8))
              if RECOVERY_SCOPE == "selected_bits" or HIDDEN_BIT_RANGES:
                  if not HIDDEN_BIT_RANGES and RECOVERY_SCOPE == "selected_bits":
                      raise ValueError("selected_bits requires HIDDEN_BIT_RANGES")
                  for token in HIDDEN_BIT_RANGES.split(","):
                      token = token.strip()
                      if not token:
                          continue
                      if ":" in token:
                          left, right = token.split(":", 1)
                          start, end = int(left), int(right)
                          if not 0 <= start <= end <= HEADER_BITS:
                              raise ValueError(f"invalid hidden range: {token}")
                          hidden.update(range(start, end))
                      else:
                          bit = int(token)
                          if not 0 <= bit < HEADER_BITS:
                              raise ValueError(f"invalid hidden bit: {token}")
                          hidden.add(bit)
              return hidden


          def get_bit(data: bytes, bit: int) -> int:
              byte_index, offset = divmod(bit, 8)
              return (data[byte_index] >> (7 - offset)) & 1


          def put_bit(data: bytearray, bit: int, value: int) -> None:
              byte_index, offset = divmod(bit, 8)
              mask = 1 << (7 - offset)
              if value:
                  data[byte_index] |= mask
              else:
                  data[byte_index] &= ~mask


          def hidden_state_from_header(
              header: bytes, bit_indices: Sequence[int]
          ) -> HiddenCoordinateState:
              indices = tuple(bit_indices)
              return HiddenCoordinateState(
                  indices,
                  tuple(get_bit(header, bit) for bit in indices),
              )


          def materialize_hidden_state(
              state: HiddenCoordinateState, observation: bytes
          ) -> bytes:
              if len(state.bit_indices) != len(state.values):
                  raise ValueError("hidden state indices and values must have equal length")
              result = bytearray(observation)
              for bit, value in zip(state.bit_indices, state.values):
                  put_bit(result, bit, value)
              return bytes(result)


          def write_hidden_state(state: HiddenCoordinateState) -> None:
              write_csv(
                  HIDDEN_STATE,
                  [
                      {
                          "coordinate": coordinate,
                          "header_bit_index": bit,
                          "value": value,
                          "chunk": bit // CHUNK_BITS,
                          "bit_plane": bit % CHUNK_BITS,
                      }
                      for coordinate, (bit, value) in enumerate(
                          zip(state.bit_indices, state.values)
                      )
                  ],
                  fieldnames=(
                      "coordinate",
                      "header_bit_index",
                      "value",
                      "chunk",
                      "bit_plane",
                  ),
              )


          def clamp_known_bits(candidate: bytes, observation: bytes, hidden: set[int]) -> bytes:
              result = bytearray(candidate)
              for bit in range(HEADER_BITS):
                  if bit not in hidden:
                      put_bit(result, bit, get_bit(observation, bit))
              return bytes(result)


          def chunks40(header: bytes) -> List[int]:
              return [int.from_bytes(header[index * 5 : (index + 1) * 5], "big") for index in range(HEADER_CHUNKS)]


          def header_from_chunks40(chunks: Sequence[int]) -> bytes:
              return b"".join((value & MASK40).to_bytes(5, "big") for value in chunks)


          def rotate40(value: int, orientation: int) -> int:
              shift = (0, 13, 27)[orientation % 3]
              if shift == 0:
                  return value & MASK40
              return ((value << shift) | (value >> (40 - shift))) & MASK40


          def permutation_parity(permutation: Sequence[int]) -> int:
              parity = 0
              for i in range(len(permutation)):
                  for j in range(i + 1, len(permutation)):
                      parity ^= int(permutation[i] > permutation[j])
              return parity


          def project_header(
              header: bytes, permutation: Sequence[int], orientations: Sequence[int]
          ) -> bytes:
              canonical = chunks40(header)
              projected = [
                  rotate40(canonical[permutation[slot]], orientations[slot]) for slot in range(16)
              ]
              return header_from_chunks40(projected)


          def projection_piece_cost(
              canonical_chunks: Sequence[int],
              observed_chunks: Sequence[int],
              mask: Sequence[int],
              slot: int,
              source: int,
              orientation: int,
          ) -> int:
              value = rotate40(canonical_chunks[source], orientation)
              cost = 0
              for local in range(40):
                  bit = slot * 40 + local
                  if mask[bit]:
                      actual = (value >> (39 - local)) & 1
                      expected = (observed_chunks[slot] >> (39 - local)) & 1
                      cost += int(actual != expected)
              return cost


          def solve_projection_variables(
              header: bytes, observation: bytes, initial_mask: Sequence[int]
          ) -> ProjectionState:
              canonical_chunks = chunks40(header)
              observed_chunks = chunks40(observation)
              if not INFER_PERMUTATION and not INFER_ORIENTATION:
                  permutation = tuple(range(16))
                  orientations = (0,) * 16
              else:
                  states: Dict[
                      Tuple[int, int], Tuple[int, Tuple[Tuple[int, int], ...]]
                  ] = {(0, 0): (0, tuple())}
                  for slot in range(HEADER_CHUNKS):
                      next_states: Dict[
                          Tuple[int, int], Tuple[int, Tuple[Tuple[int, int], ...]]
                      ] = {}
                      for (used, residue), (cost_so_far, assignment) in states.items():
                          sources = range(HEADER_CHUNKS) if INFER_PERMUTATION else (slot,)
                          for source in sources:
                              if (used >> source) & 1:
                                  continue
                              choices = range(3) if INFER_ORIENTATION else (0,)
                              for orientation in choices:
                                  new_key = (used | (1 << source), (residue + orientation) % 3)
                                  new_cost = cost_so_far + projection_piece_cost(
                                      canonical_chunks,
                                      observed_chunks,
                                      initial_mask,
                                      slot,
                                      source,
                                      orientation,
                                  )
                                  candidate_assignment = assignment + ((source, orientation),)
                                  previous = next_states.get(new_key)
                                  if (
                                      previous is None
                                      or new_cost < previous[0]
                                      or (
                                          new_cost == previous[0]
                                          and candidate_assignment < previous[1]
                                      )
                                  ):
                                      next_states[new_key] = (new_cost, candidate_assignment)
                      states = next_states
                  final = states.get(((1 << HEADER_CHUNKS) - 1, 0))
                  if final is None:
                      raise RuntimeError("no pi/O assignment satisfies product O_i = Identity")
                  assignment = final[1]
                  permutation = tuple(source for source, _ in assignment)
                  orientations = tuple(orientation for _, orientation in assignment)
              projected = project_header(header, permutation, orientations)
              if INFER_MASK:
                  mismatch_cost = 1.0 / (2.0 * SIGMA * SIGMA)
                  mask = tuple(
                      0
                      if (
                          get_bit(projected, bit) != get_bit(observation, bit)
                          and GAMMA_MISSING < mismatch_cost
                      )
                      else 1
                      for bit in range(HEADER_BITS)
                  )
              else:
                  mask = tuple(initial_mask)
              observation_hamming = sum(
                  int(mask[bit])
                  * int(get_bit(projected, bit) != get_bit(observation, bit))
                  for bit in range(HEADER_BITS)
              )
              p0 = permutation_parity(permutation)
              p1, p2, p3 = p0, 0, 0
              hard_constraints_ok = (
                  (p0 ^ p1 ^ p2 ^ p3) == 0
                  and (p0 ^ p1) == 0
                  and sum(orientations) % 3 == 0
              )
              return ProjectionState(
                  mask,
                  permutation,
                  orientations,
                  p0,
                  p1,
                  p2,
                  p3,
                  observation_hamming,
                  hard_constraints_ok,
              )


          def bitcoin_global_energy(header: bytes, metadata: dict) -> float:
              if CONTEXT_MODE == "hash_only" or not metadata:
                  return 0.0
              energy = 0
              previous_display = str(metadata.get("previousblockhash", ""))
              merkle_display = str(metadata.get("merkle_root", ""))
              bits_value = int(metadata.get("bits", 0) or 0)
              timestamp_value = int(metadata.get("timestamp", 0) or 0)
              if previous_display:
                  energy += hamming_bytes(header[4:36], bytes.fromhex(previous_display)[::-1])
              if merkle_display:
                  energy += hamming_bytes(header[36:68], bytes.fromhex(merkle_display)[::-1])
              if bits_value:
                  energy += hamming_bytes(header[72:76], bits_value.to_bytes(4, "little"))
              if timestamp_value:
                  timestamp = int.from_bytes(header[68:72], "little")
                  if CONTEXT_MODE == "all_public":
                      energy += (timestamp ^ timestamp_value).bit_count()
                  else:
                      distance = abs(timestamp - timestamp_value)
                      if distance > 7200:
                          energy += min(32, 1 + int(math.log2(distance - 7199)))
              return float(energy)


          def build_protocol_constraint_system(
              system: HiddenSectionSystem,
              metadata: dict,
          ) -> ProtocolConstraintSystem:
              """Build protocol-linked equations in the same hidden-coordinate basis."""
              column_by_bit = {
                  bit: column for column, bit in enumerate(system.bit_indices)
              }
              target_header = bytearray(HEADER_BYTES)
              field_specs: List[Tuple[str, int, bytes, float]] = []

              version_value = metadata.get("version")
              if version_value is not None:
                  field_specs.append(
                      (
                          "version_path",
                          FIELD_RANGES_BYTES["version"][0],
                          (int(version_value) & MASK32).to_bytes(4, "little"),
                          0.5,
                      )
                  )

              previous_display = str(metadata.get("previousblockhash", ""))
              if previous_display:
                  field_specs.append(
                      (
                          "chain_previous_hash",
                          FIELD_RANGES_BYTES["previous_hash"][0],
                          bytes.fromhex(previous_display)[::-1],
                          4.0,
                      )
                  )

              timestamp_value = int(metadata.get("timestamp", 0) or 0)
              if timestamp_value:
                  field_specs.append(
                      (
                          "timestamp_path",
                          FIELD_RANGES_BYTES["timestamp"][0],
                          timestamp_value.to_bytes(4, "little"),
                          1.0,
                      )
                  )

              bits_value = int(metadata.get("bits", 0) or 0)
              if bits_value:
                  field_specs.append(
                      (
                          "difficulty_epoch_path",
                          FIELD_RANGES_BYTES["bits"][0],
                          bits_value.to_bytes(4, "little"),
                          2.0,
                      )
                  )

              equation_names: List[str] = []
              header_bit_indices: List[int] = []
              rows: List[np.ndarray] = []
              targets: List[float] = []
              weights: List[float] = []

              for source, byte_start, field_bytes, field_weight in field_specs:
                  target_header[byte_start : byte_start + len(field_bytes)] = field_bytes
                  for local_bit in range(len(field_bytes) * 8):
                      header_bit = byte_start * 8 + local_bit
                      column = column_by_bit.get(header_bit)
                      if column is None:
                          continue
                      row = np.zeros(len(system.bit_indices), dtype=np.float64)
                      row[column] = 1.0
                      equation_names.append(f"{source}:bit_{header_bit}")
                      header_bit_indices.append(header_bit)
                      rows.append(row)
                      targets.append(float(get_bit(bytes(target_header), header_bit)))
                      weights.append(field_weight)

              if rows:
                  operator = np.vstack(rows)
                  rank = int(np.linalg.matrix_rank(operator))
              else:
                  operator = np.zeros(
                      (0, len(system.bit_indices)), dtype=np.float64
                  )
                  rank = 0

              return ProtocolConstraintSystem(
                  system.bit_indices,
                  tuple(equation_names),
                  tuple(header_bit_indices),
                  operator,
                  np.asarray(targets, dtype=np.float64),
                  np.asarray(weights, dtype=np.float64),
                  rank,
              )


          def protocol_trajectory_energy(
              header: bytes,
              system: Optional[ProtocolConstraintSystem],
          ) -> float:
              if system is None or not system.equation_names:
                  return 0.0
              hidden_values = np.asarray(
                  [get_bit(header, bit) for bit in system.hidden_bit_indices],
                  dtype=np.float64,
              )
              selected = system.operator @ hidden_values
              mismatch = np.abs(selected - system.target_values)
              return float(np.dot(system.equation_weights, mismatch))


          def write_protocol_constraints(system: ProtocolConstraintSystem) -> None:
              rows = []
              for name, header_bit, target, weight in zip(
                  system.equation_names,
                  system.header_bit_indices,
                  system.target_values,
                  system.equation_weights,
              ):
                  rows.append(
                      {
                          "equation": name,
                          "header_bit_index": header_bit,
                          "target_value": int(target),
                          "equation_weight": float(weight),
                      }
                  )
              write_csv(
                  PROTOCOL_CONSTRAINTS,
                  rows,
                  fieldnames=(
                      "equation",
                      "header_bit_index",
                      "target_value",
                      "equation_weight",
                  ),
              )


          def f_transform(x: float) -> float:
              if x < 0:
                  return float("nan")
              return A0 * x / ((1.0 + x**N_EXPONENT) ** (1.0 / N_EXPONENT))


          def evaluate(
              header: bytes,
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              initial_mask: Sequence[int],
              metadata: dict,
              protocol_system: Optional[ProtocolConstraintSystem] = None,
              protocol_weight: float = 0.0,
          ) -> Evaluation:
              digest_raw, traces = sha256d_trace(header)
              compatibility = derive_backward_compatibility(traces, target_raw)
              projection = solve_projection_variables(header, observation, initial_mask)
              if not projection.hard_constraints_ok:
                  raise RuntimeError("the supplied parity/orientation constraints were violated")
              digest_hamming = hamming_bytes(digest_raw, target_raw)
              E_observation = projection.observation_hamming / (2.0 * SIGMA * SIGMA)
              observation_noise_effective = ALLOW_OBSERVATION_NOISE
              if projection.observation_hamming and not ALLOW_OBSERVATION_NOISE:
                  E_observation = float("inf")
              E_local = float(
                  compatibility.state_edge_hamming
                  + compatibility.schedule_edge_hamming
                  + digest_hamming
              )
              E_global = bitcoin_global_energy(header, metadata)
              E_protocol = protocol_trajectory_energy(header, protocol_system)
              C_missing = sum(1 - value for value in projection.mask)
              total_energy = (
                  E_observation
                  + LAMBDA_LOCAL * E_local
                  + BETA_GLOBAL * E_global
                  + protocol_weight * E_protocol
                  + GAMMA_MISSING * C_missing
              )
              state_dimension = max(1, sum(1 - int(value) for value in initial_mask))
              transformed_energy = (
                  f_transform(total_energy / float(state_dimension))
                  if math.isfinite(total_energy)
                  else float("nan")
              )
              displayed_hash = displayed_hash_from_raw(digest_raw)
              return Evaluation(
                  header,
                  digest_raw,
                  displayed_hash,
                  traces,
                  compatibility,
                  projection,
                  digest_hamming,
                  E_observation,
                  E_local,
                  E_global,
                  E_protocol,
                  protocol_weight,
                  C_missing,
                  total_energy,
                  transformed_energy,
                  displayed_hash == target_display,
                  observation_noise_effective,
              )


          def reweight_evaluation(
              evaluation: Evaluation, protocol_weight: float
          ) -> Evaluation:
              base_energy = (
                  evaluation.total_energy
                  - evaluation.protocol_weight * evaluation.E_protocol
              )
              total_energy = base_energy + protocol_weight * evaluation.E_protocol
              state_dimension = max(
                  1, sum(1 - int(value) for value in evaluation.projection.mask)
              )
              transformed_energy = (
                  f_transform(total_energy / float(state_dimension))
                  if math.isfinite(total_energy)
                  else float("nan")
              )
              return replace(
                  evaluation,
                  protocol_weight=protocol_weight,
                  total_energy=total_energy,
                  transformed_energy=transformed_energy,
              )


          def protocol_phase_is_stable(
              recent_energies: Sequence[float],
              recent_corrections: Sequence[int],
              state_dimension: int,
          ) -> bool:
              window = PROTOCOL_STABILITY_WINDOW
              if len(recent_energies) < window or len(recent_corrections) < window:
                  return False
              energies = recent_energies[-window:]
              corrections = recent_corrections[-window:]
              finite = [value for value in energies if math.isfinite(value)]
              if len(finite) != window:
                  return False
              energy_scale = max(1.0, abs(sum(finite) / float(window)))
              energy_spread = (max(finite) - min(finite)) / energy_scale
              correction_spread = (
                  max(corrections) - min(corrections)
              ) / float(max(1, state_dimension))
              return (
                  energy_spread <= PROTOCOL_ENERGY_REL_TOL
                  and correction_spread <= PROTOCOL_CORRECTION_REL_TOL
              )


          def protocol_weight_at_iteration(
              iteration: int,
              phase_started_at: Optional[int],
          ) -> float:
              if phase_started_at is None or LAMBDA_PROTOCOL == 0.0:
                  return 0.0
              phase_age = max(1, iteration - phase_started_at + 1)
              alpha = min(1.0, phase_age / float(PROTOCOL_RAMP_ITERATIONS))
              return LAMBDA_PROTOCOL * alpha


          def joint_section_system() -> Tuple[Tuple[str, ...], np.ndarray]:
              """Build the geometric section operator over the sixteen header chunks."""
              names: List[str] = []
              rows: List[np.ndarray] = []

              def add(name: str, selected_chunks: Iterable[int]) -> None:
                  selected = tuple(sorted(set(selected_chunks)))
                  if not selected:
                      return
                  row = np.zeros(HEADER_CHUNKS, dtype=np.float64)
                  row[list(selected)] = 1.0
                  row /= math.sqrt(float(len(selected)))
                  names.append(name)
                  rows.append(row)

              add("complete_interior", range(HEADER_CHUNKS))
              for chunk_index, coord in enumerate(INTERIOR_COORDS):
                  add(f"cell_{coord}", [chunk_index])
              for axis in range(4):
                  for coordinate_value in (1, 2):
                      add(
                          f"axis_{axis}_slice_{coordinate_value}",
                          [
                              index
                              for index, coord in enumerate(INTERIOR_COORDS)
                              if coord[axis] == coordinate_value
                          ],
                      )
              for axis_a, axis_b in combinations(range(4), 2):
                  for value_a in (1, 2):
                      for value_b in (1, 2):
                          add(
                              f"face_{axis_a}_{axis_b}_{value_a}_{value_b}",
                              [
                                  index
                                  for index, coord in enumerate(INTERIOR_COORDS)
                                  if coord[axis_a] == value_a and coord[axis_b] == value_b
                              ],
                          )
              for left in range(HEADER_CHUNKS):
                  for right in range(left + 1, HEADER_CHUNKS):
                      if sum(
                          a != b
                          for a, b in zip(INTERIOR_COORDS[left], INTERIOR_COORDS[right])
                      ) == 1:
                          add(f"edge_{left}_{right}", [left, right])

              matrix = np.vstack(rows)
              if np.linalg.matrix_rank(matrix) != HEADER_CHUNKS:
                  raise RuntimeError("joint 4D section operator is not full rank")
              return tuple(names), matrix


          JOINT_SECTION_NAMES, JOINT_SECTION_MATRIX = joint_section_system()


          def build_hidden_section_system(hidden: set[int]) -> HiddenSectionSystem:
              """Restrict all section equations to the actual k hidden coordinates."""
              bit_indices = tuple(sorted(hidden))
              if not bit_indices:
                  raise ValueError("at least one hidden coordinate is required")
              column_by_bit = {bit: column for column, bit in enumerate(bit_indices)}
              names: List[str] = []
              rows: List[np.ndarray] = []

              for section_index, section_name in enumerate(JOINT_SECTION_NAMES):
                  selected_chunks = tuple(
                      int(index)
                      for index in np.flatnonzero(
                          JOINT_SECTION_MATRIX[section_index] != 0.0
                      )
                  )
                  for local_bit in range(CHUNK_BITS):
                      selected_columns = [
                          column_by_bit[chunk * CHUNK_BITS + local_bit]
                          for chunk in selected_chunks
                          if chunk * CHUNK_BITS + local_bit in column_by_bit
                      ]
                      if not selected_columns:
                          continue
                      row = np.zeros(len(bit_indices), dtype=np.float64)
                      row[selected_columns] = 1.0 / math.sqrt(
                          float(len(selected_columns))
                      )
                      names.append(f"{section_name}:plane_{local_bit}")
                      rows.append(row)

              operator = np.vstack(rows)
              rank = int(np.linalg.matrix_rank(operator))
              if rank != len(bit_indices):
                  raise RuntimeError(
                      "hidden-coordinate section operator is rank deficient: "
                      f"rank={rank} state_dimension={len(bit_indices)}"
                  )
              gram = operator.T @ operator
              left_inverse = np.linalg.solve(gram, operator.T)
              return HiddenSectionSystem(
                  bit_indices,
                  tuple(names),
                  operator,
                  left_inverse,
                  rank,
              )


          def solve_joint_hidden_coordinate_system(
              evaluation: Evaluation,
              observation: bytes,
              system: HiddenSectionSystem,
              protocol_system: Optional[ProtocolConstraintSystem],
              protocol_weight: float,
          ) -> JointCorrection:
              """Solve geometric and protocol residuals in one normal equation."""
              pullback_header = materialize_hidden_state(
                  hidden_state_from_header(
                      evaluation.compatibility.pullback_header,
                      system.bit_indices,
                  ),
                  observation,
              )
              current_state = hidden_state_from_header(
                  evaluation.header, system.bit_indices
              )
              pullback_state = hidden_state_from_header(
                  pullback_header, system.bit_indices
              )
              current_values = np.asarray(current_state.values, dtype=np.float64)
              geometric_residual = np.asarray(
                  [
                      float(current_value ^ pullback_value)
                      for current_value, pullback_value in zip(
                          current_state.values, pullback_state.values
                      )
                  ],
                  dtype=np.float64,
              )

              section_targets = system.operator @ geometric_residual
              normal = LAMBDA_LOCAL * (system.operator.T @ system.operator)
              right_hand_side = LAMBDA_LOCAL * (
                  system.operator.T @ section_targets
              )

              protocol_flip_target = np.zeros(0, dtype=np.float64)
              protocol_residual_bits = 0
              protocol_equation_count = 0
              if (
                  protocol_system is not None
                  and protocol_system.equation_names
                  and protocol_weight > 0.0
              ):
                  selected_current = protocol_system.operator @ current_values
                  protocol_flip_target = np.abs(
                      selected_current - protocol_system.target_values
                  )
                  protocol_residual_bits = int(np.sum(protocol_flip_target))
                  protocol_equation_count = len(protocol_system.equation_names)
                  sqrt_weights = np.sqrt(protocol_system.equation_weights)
                  weighted_operator = (
                      sqrt_weights[:, np.newaxis] * protocol_system.operator
                  )
                  weighted_target = sqrt_weights * protocol_flip_target
                  normal = normal + protocol_weight * (
                      weighted_operator.T @ weighted_operator
                  )
                  right_hand_side = right_hand_side + protocol_weight * (
                      weighted_operator.T @ weighted_target
                  )

              relaxed = np.linalg.solve(normal, right_hand_side)
              relaxed = np.clip(relaxed, 0.0, 1.0)
              relaxed_projection_error = float(
                  np.linalg.norm(system.operator @ relaxed - section_targets)
              )
              correction = relaxed > 0.5
              next_state = HiddenCoordinateState(
                  system.bit_indices,
                  tuple(
                      int(value ^ bool(delta))
                      for value, delta in zip(current_state.values, correction)
                  ),
              )
              candidate_header = materialize_hidden_state(next_state, observation)
              binary_section_residual = float(
                  np.linalg.norm(
                      system.operator @ correction.astype(np.float64)
                      - section_targets
                  )
              )
              if protocol_equation_count:
                  protocol_binary_residual = float(
                      np.linalg.norm(
                          np.sqrt(protocol_system.equation_weights)
                          * (
                              protocol_system.operator
                              @ correction.astype(np.float64)
                              - protocol_flip_target
                          )
                      )
                  )
              else:
                  protocol_binary_residual = 0.0

              return JointCorrection(
                  candidate_header,
                  next_state,
                  int(np.sum(geometric_residual)),
                  int(np.sum(correction)),
                  relaxed_projection_error,
                  binary_section_residual,
                  protocol_residual_bits,
                  protocol_binary_residual,
                  protocol_weight,
                  protocol_equation_count,
                  float(np.linalg.cond(normal)),
                  len(system.equation_names),
                  len(system.bit_indices),
                  system.rank,
              )


          def canonical_initial_header(
              target_raw: bytes,
              target_display: str,
              observation: bytes,
              hidden: set[int],
              initial_mask: Sequence[int],
              metadata: dict,
              protocol_system: Optional[ProtocolConstraintSystem],
          ) -> bytes:
              zero_section = clamp_known_bits(bytes(80), observation, hidden)
              zero_eval = evaluate(
                  zero_section,
                  target_raw,
                  target_display,
                  observation,
                  initial_mask,
                  metadata,
                  protocol_system,
                  0.0,
              )
              return clamp_known_bits(zero_eval.compatibility.pullback_header, observation, hidden)


          def requested_model_count_reached(count: int) -> bool:
              return POSTERIOR_MODELS > 0 and count >= POSTERIOR_MODELS


          def write_csv(path: Path, rows: Sequence[dict], fieldnames: Optional[Sequence[str]] = None) -> None:
              if not rows and not fieldnames:
                  path.write_text("", encoding="utf-8")
                  return
              names = list(fieldnames or rows[0].keys())
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=names)
                  writer.writeheader()
                  writer.writerows(rows)


          def tesseract_slot_rows() -> List[dict]:
              all_coords = list(product(range(4), repeat=4))
              interior_set = set(INTERIOR_COORDS)
              surface = sorted(coord for coord in all_coords if coord not in interior_set)
              rows: List[dict] = []
              for index, coord in enumerate(INTERIOR_COORDS):
                  rows.append(
                      {
                          "a": coord[0],
                          "b": coord[1],
                          "c": coord[2],
                          "d": coord[3],
                          "region": "interior_header",
                          "slot_index": index,
                          "semantic": f"header_chunk_{index:02d}_bits_{40 * index}:{40 * (index + 1)}",
                      }
                  )
              for index, coord in enumerate(surface):
                  if index < 192:
                      phase, round_index = divmod(index, 64)
                      region, semantic = "surface_sha_round", f"phase_{phase}_round_{round_index}"
                  elif index < 208:
                      region, semantic = "surface_observation", f"mask_pi_orientation_{index - 192}"
                  elif index < 216:
                      region, semantic = "surface_digest", f"digest_word_{index - 208}"
                  elif index < 224:
                      region, semantic = "surface_bitcoin_prior", f"bitcoin_prior_{index - 216}"
                  else:
                      region, semantic = (
                          "surface_posterior_gauge_projection",
                          f"posterior_gauge_projection_{index - 224}",
                      )
                  rows.append(
                      {
                          "a": coord[0],
                          "b": coord[1],
                          "c": coord[2],
                          "d": coord[3],
                          "region": region,
                          "slot_index": index,
                          "semantic": semantic,
                      }
                  )
              return rows


          def log_state_space() -> Tuple[float, float]:
              log2_value = (
                  math.lgamma(17) / math.log(2)
                  + 2 * math.lgamma(65) / math.log(2)
                  + math.lgamma(97) / math.log(2)
                  + 45
                  + 15 * math.log2(3)
                  - math.log2(1536)
                  - 8 * math.lgamma(9) / math.log(2)
              )
              return log2_value, log2_value * math.log10(2)


          def connected_components(points: np.ndarray, radius: float) -> int:
              count = len(points)
              if count == 0:
                  return 0
              parent = list(range(count))

              def find(index: int) -> int:
                  while parent[index] != index:
                      parent[index] = parent[parent[index]]
                      index = parent[index]
                  return index

              def union(left: int, right: int) -> None:
                  root_left, root_right = find(left), find(right)
                  if root_left != root_right:
                      parent[root_right] = root_left

              for left in range(count):
                  for right in range(left + 1, count):
                      if np.linalg.norm(points[left] - points[right]) <= radius:
                          union(left, right)
              return len({find(index) for index in range(count)})


          def quotient_distance(points_a: np.ndarray, points_b: np.ndarray) -> float:
              if points_a.shape != points_b.shape or points_a.size == 0:
                  return float("nan")
              a = points_a - points_a.mean(axis=0, keepdims=True)
              b = points_b - points_b.mean(axis=0, keepdims=True)
              norm_a, norm_b = np.linalg.norm(a), np.linalg.norm(b)
              if norm_a == 0 or norm_b == 0:
                  return float("nan")
              a /= norm_a
              b /= norm_b
              u, _, vt = np.linalg.svd(b.T @ a)
              rotation = u @ vt
              if np.linalg.det(rotation) < 0:
                  u[:, -1] *= -1
                  rotation = u @ vt
              aligned = b @ rotation
              return float(np.sqrt(np.mean(np.sum((a - aligned) ** 2, axis=1))))


          def write_round_and_continuous_exports(evaluation: Evaluation) -> None:
              round_rows: List[dict] = []
              lattice_rows: List[dict] = []
              feature = np.zeros((4, 4, 4, 4), dtype=float)
              lane_pairs = ((0, 4), (1, 5), (2, 6), (3, 7))
              for trace, required, backward in zip(
                  evaluation.traces,
                  evaluation.compatibility.required_words,
                  evaluation.compatibility.backward_states,
              ):
                  for row in trace.rounds:
                      state_residual = hamming_state(row.state_in, backward[row.round_index])
                      round_rows.append(
                          {
                              "phase": trace.phase,
                              "round": row.round_index,
                              "w_actual": f"{row.w:08x}",
                              "w_required": f"{required[row.round_index]:08x}",
                              "schedule_edge_hamming": hamming_word(
                                  row.w, required[row.round_index]
                              ),
                              "state_edge_hamming": state_residual,
                              "a_in": f"{row.state_in[0]:08x}",
                              "b_in": f"{row.state_in[1]:08x}",
                              "c_in": f"{row.state_in[2]:08x}",
                              "d_in": f"{row.state_in[3]:08x}",
                              "e_in": f"{row.state_in[4]:08x}",
                              "f_in": f"{row.state_in[5]:08x}",
                              "g_in": f"{row.state_in[6]:08x}",
                              "h_in": f"{row.state_in[7]:08x}",
                          }
                      )
                      r = row.round_index
                      a_coord, remainder = divmod(r, 16)
                      b_coord, c_coord = divmod(remainder, 4)
                      for d_coord, pair in enumerate(lane_pairs):
                          values = (row.state_in[pair[0]], row.state_in[pair[1]])
                          value = sum(word.bit_count() for word in values) / 64.0
                          feature[a_coord, b_coord, c_coord, d_coord] += value / 3.0
                          if EMIT_LATTICE_BITS:
                              for lane_index in pair:
                                  lane_value = row.state_in[lane_index]
                                  for bit in range(32):
                                      lattice_rows.append(
                                          {
                                              "phase": trace.phase,
                                              "a": a_coord,
                                              "b": b_coord,
                                              "c": c_coord,
                                              "d": d_coord,
                                              "round": r,
                                              "state_lane": "abcdefgh"[lane_index],
                                              "bit": bit,
                                              "value": (lane_value >> (31 - bit)) & 1,
                                          }
                                      )
              write_csv(ROUND_STATES, round_rows)
              write_csv(
                  LATTICE_BITS,
                  lattice_rows,
                  fieldnames=["phase", "a", "b", "c", "d", "round", "state_lane", "bit", "value"],
              )

              projection_rows: List[dict] = []
              clouds: Dict[int, np.ndarray] = {}
              rng = np.random.default_rng(DETERMINISTIC_SEED or 314159)
              for omitted_axis in range(4):
                  reduced = feature.sum(axis=omitted_axis)
                  if PROJECTION_NOISE_SIGMA > 0:
                      reduced = reduced + rng.normal(0, PROJECTION_NOISE_SIGMA, size=reduced.shape)
                  cloud = []
                  for index in np.ndindex(reduced.shape):
                      value = float(reduced[index])
                      cloud.append([float(index[0]), float(index[1]), float(index[2]), value])
                      projection_rows.append(
                          {
                              "omitted_axis": omitted_axis,
                              "u": index[0],
                              "v": index[1],
                              "w": index[2],
                              "projected_feature": value,
                          }
                      )
                  clouds[omitted_axis] = np.asarray(cloud, dtype=float)
              write_csv(PROJECTIONS, projection_rows)

              gauge_rows: List[dict] = []
              gauged: Dict[int, np.ndarray] = {}
              for axis, cloud4 in clouds.items():
                  coordinates = cloud4[:, :3].copy()
                  weights = np.abs(cloud4[:, 3]) + 1e-12
                  weights /= weights.sum()
                  centroid = np.sum(coordinates * weights[:, None], axis=0)
                  centered = coordinates - centroid
                  rms = float(
                      np.sqrt(np.sum(weights * np.sum(centered**2, axis=1)))
                  )
                  scaled = centered / rms if rms else centered
                  covariance = (scaled * weights[:, None]).T @ scaled
                  eigenvalues, eigenvectors = np.linalg.eigh(covariance)
                  order = np.argsort(eigenvalues)[::-1]
                  eigenvalues = eigenvalues[order]
                  principal = eigenvectors[:, order[0]]
                  anchor = scaled[np.argmax(np.linalg.norm(scaled, axis=1))]
                  if float(np.dot(principal, anchor)) < 0:
                      principal = -principal
                  gauged[axis] = scaled
                  gauge_rows.append(
                      {
                          "omitted_axis": axis,
                          "centroid_x": float(centroid[0]),
                          "centroid_y": float(centroid[1]),
                          "centroid_z": float(centroid[2]),
                          "rms_scale": rms,
                          "principal_axis_x": float(principal[0]),
                          "principal_axis_y": float(principal[1]),
                          "principal_axis_z": float(principal[2]),
                          "eigenvalue_1": float(eigenvalues[0]),
                          "eigenvalue_2": float(eigenvalues[1]),
                          "eigenvalue_3": float(eigenvalues[2]),
                          "gauge_section": "weighted center=0; RMS=1; principal axis and sign fixed",
                      }
                  )
              write_csv(GAUGE_DIAGNOSTICS, gauge_rows)

              stability_rows: List[dict] = []
              base = gauged[0]
              stability_rng = np.random.default_rng((DETERMINISTIC_SEED or 314159) + 1)
              for eta in [0.0001, 0.00025, 0.0005, 0.001, 0.002, 0.005, 0.01]:
                  distances = []
                  for _ in range(24):
                      perturbed = base + stability_rng.normal(0, eta, size=base.shape)
                      distances.append(quotient_distance(base, perturbed))
                  stability_rows.append(
                      {
                          "eta": eta,
                          "mean_quotient_displacement": float(np.nanmean(distances)),
                          "p95_quotient_displacement": float(np.nanpercentile(distances, 95)),
                          "max_quotient_displacement": float(np.nanmax(distances)),
                          "claim": "finite-resolution empirical stability only",
                      }
                  )
              write_csv(STABILITY, stability_rows)

              tolerance_rows: List[dict] = []
              base_cloud = clouds[0][:, :3]
              base_feature = clouds[0][:, 3]
              median = np.median(base_feature)
              for delta in [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.25, 0.5, 1.0]:
                  active = base_cloud[np.abs(base_feature - median) <= delta]
                  tolerance_rows.append(
                      {
                          "delta": delta,
                          "active_points": len(active),
                          "connected_components": (
                              connected_components(active, max(delta, 1e-9)) if len(active) else 0
                          ),
                          "posterior_mass_in_ball": float("nan"),
                          "note": "no posterior mass is fabricated without multiple exact models",
                      }
                  )
              write_csv(TOLERANCE, tolerance_rows)

              frequency_rows: List[dict] = []
              for axis in range(4):
                  field = clouds[axis][:, 3].reshape(4, 4, 4)
                  spectrum = np.fft.fftn(field)
                  frequencies = np.meshgrid(
                      *[np.fft.fftfreq(4)] * 3,
                      indexing="ij",
                  )
                  radius = np.sqrt(sum(component**2 for component in frequencies))
                  cutoff = 0.35
                  low = np.where(radius <= cutoff, spectrum, 0)
                  high = spectrum - low
                  low_energy = float(np.sum(np.abs(low) ** 2))
                  high_energy = float(np.sum(np.abs(high) ** 2))
                  total_frequency_energy = low_energy + high_energy
                  frequency_rows.append(
                      {
                          "omitted_axis": axis,
                          "cutoff": cutoff,
                          "low_frequency_phi_energy": low_energy,
                          "high_frequency_xi_energy": high_energy,
                          "low_fraction": (
                              low_energy / total_frequency_energy if total_frequency_energy else 0.0
                          ),
                      }
                  )
              write_csv(FREQUENCY_SPLIT, frequency_rows)


          def block_subsidy_sats(height: int) -> int:
              if height < 0:
                  raise ValueError("height must be nonnegative")
              halvings = height // HALVING_INTERVAL
              return INITIAL_SUBSIDY_SATS >> halvings


          def issued_before_height(height: int) -> int:
              '''Consensus subsidy issued by blocks [0, height), excluding fees.'''
              remaining = max(0, height)
              total = 0
              era = 0
              while remaining and (INITIAL_SUBSIDY_SATS >> era):
                  blocks = min(remaining, HALVING_INTERVAL)
                  total += blocks * (INITIAL_SUBSIDY_SATS >> era)
                  remaining -= blocks
                  era += 1
              return total


          def last_subsidized_height_exclusive() -> int:
              era = 0
              while INITIAL_SUBSIDY_SATS >> era:
                  era += 1
              return era * HALVING_INTERVAL


          def protocol_coordinate(height: int) -> dict:
              era = height // HALVING_INTERVAL
              era_start = era * HALVING_INTERVAL
              subsidy = block_subsidy_sats(height)
              issued_before = issued_before_height(height)
              terminal_height = last_subsidized_height_exclusive()
              terminal_issuance = issued_before_height(terminal_height)
              return {
                  "height": height,
                  "halving_era": era,
                  "era_phase": (height - era_start) / float(HALVING_INTERVAL),
                  "subsidy_sats": subsidy,
                  "subsidy_btc": subsidy / SATOSHIS_PER_BTC,
                  "issued_before_sats": issued_before,
                  "issued_before_btc": issued_before / SATOSHIS_PER_BTC,
                  "remaining_sats": terminal_issuance - issued_before,
                  "remaining_btc": (
                      terminal_issuance - issued_before
                  ) / SATOSHIS_PER_BTC,
              }


          def write_protocol_trajectory(anchor_height: int) -> dict:
              terminal_height = last_subsidized_height_exclusive()
              important_heights = {0, terminal_height}
              important_heights.update(
                  range(0, terminal_height + 1, HALVING_INTERVAL)
              )
              important_heights.update(
                  {
                      max(0, anchor_height - 1),
                      max(0, anchor_height),
                      min(terminal_height, anchor_height + 1),
                      min(
                          terminal_height,
                          anchor_height + TRAJECTORY_LOOKAHEAD_BLOCKS,
                      ),
                  }
              )
              sample_count = 512
              for index in range(sample_count + 1):
                  important_heights.add(
                      int(round(terminal_height * index / sample_count))
                  )
              rows = [
                  protocol_coordinate(height)
                  for height in sorted(important_heights)
                  if 0 <= height <= terminal_height
              ]
              write_csv(PROTOCOL_TRAJECTORY, rows)

              max_issued = max(float(row["issued_before_btc"]) for row in rows) or 1.0
              width, height_px = 1200, 700
              left, right, top, bottom = 90, 30, 50, 80
              plot_width = width - left - right
              plot_height = height_px - top - bottom

              def sx(block_height: int) -> float:
                  return left + plot_width * block_height / float(terminal_height)

              def sy(issued_btc: float) -> float:
                  return top + plot_height * (1.0 - issued_btc / max_issued)

              points = " ".join(
                  f"{sx(int(row['height'])):.2f},{sy(float(row['issued_before_btc'])):.2f}"
                  for row in rows
              )
              anchor = protocol_coordinate(min(anchor_height, terminal_height))
              anchor_x = sx(int(anchor["height"]))
              anchor_y = sy(float(anchor["issued_before_btc"]))
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height_px}" viewBox="0 0 {width} {height_px}">
          <rect width="100%" height="100%" fill="white"/>
          <text x="{width / 2}" y="28" text-anchor="middle" font-family="monospace" font-size="20">Bitcoin subsidy issuance path by block height</text>
          <line x1="{left}" y1="{top}" x2="{left}" y2="{height_px - bottom}" stroke="black"/>
          <line x1="{left}" y1="{height_px - bottom}" x2="{width - right}" y2="{height_px - bottom}" stroke="black"/>
          <polyline points="{points}" fill="none" stroke="black" stroke-width="2"/>
          <circle cx="{anchor_x:.2f}" cy="{anchor_y:.2f}" r="5" fill="black"/>
          <text x="{anchor_x + 8:.2f}" y="{anchor_y - 8:.2f}" font-family="monospace" font-size="12">h={anchor['height']}</text>
          <text x="{width / 2}" y="{height_px - 25}" text-anchor="middle" font-family="monospace" font-size="14">block height</text>
          <text x="20" y="{height_px / 2}" text-anchor="middle" transform="rotate(-90 20 {height_px / 2})" font-family="monospace" font-size="14">cumulative subsidy BTC</text>
          <text x="{left}" y="{height_px - 45}" font-family="monospace" font-size="12">0</text>
          <text x="{width - right}" y="{height_px - 45}" text-anchor="end" font-family="monospace" font-size="12">{terminal_height}</text>
          <text x="{left - 10}" y="{top + 5}" text-anchor="end" font-family="monospace" font-size="12">{max_issued:.8f}</text>
          </svg>
              '''
              PROTOCOL_CURVE.write_text(svg, encoding="utf-8")
              return anchor


          def write_model_spec() -> None:
              MODEL_SPEC.write_text(
                  """BITCOIN SHA-256d HIDDEN-COORDINATE 4D PATH MODEL
          =================================================

          State definition
          ----------------
          The serialized Bitcoin header has 80 bytes = 640 bits because that is the
          protocol message format. It is not automatically the inference dimension.

          Let H = (h_0,...,h_(k-1)) be the ordered hidden-bit indices. The compact
          inference state is

              u in {0,1}^k,  k = |H|.

          The embedding E_H(u,x_observed) writes only those k coordinates into the
          fixed 80-byte header container and leaves every observed bit unchanged.
          Full-header recovery is the explicit special case k=640, not the default.

          Deterministic protocol path
          ---------------------------
          Height is the traversal coordinate. The subsidy-only path is exact:

              era(h) = floor(h / 210000)
              subsidy(h) = floor_satoshi(50 BTC / 2^era(h))
              issued(h) = sum_(j=0)^(h-1) subsidy(j)

          The workflow exports this staircase and its cumulative concave curve. This
          schedule determines subsidy and issuance coordinates. It does not determine
          future transaction sets, merkle roots, timestamps, miner choices, nonces,
          difficulty adjustments, or exact future block hashes.

          Exact SHA compatibility
          -----------------------
          Each iteration computes the exact forward SHA-256d trace, propagates the
          target digest backward, then restricts the pullback residual to H:

              r_H = u XOR R_H(B(F(E_H(u))), h_target)).

          Adaptive protocol-integrated joint update
          -----------------------------------------
          The 4D cell/slice/face/edge operator S_H is restricted to the actual k
          hidden coordinates. Protocol-linked chain coordinates are represented by
          a selector/Jacobian P_H with weighted flip target p_t. The correction is
          obtained from the complete joint normal system:

              delta_t = argmin_delta [
                  LAMBDA_LOCAL ||S_H delta - S_H r_H||_2^2
                  + alpha_t LAMBDA_PROTOCOL
                    ||W_P^(1/2) (P_H delta - p_t)||_2^2
              ]

              [LAMBDA_LOCAL S_H^T S_H
               + alpha_t LAMBDA_PROTOCOL P_H^T W_P P_H] delta_t
              = LAMBDA_LOCAL S_H^T S_H r_H
                + alpha_t LAMBDA_PROTOCOL P_H^T W_P p_t.

          Phase 1 keeps alpha_t=0. After the geometric trajectory has a stable energy
          and correction window, phase 2 ramps alpha_t continuously to one. S_H is
          never replaced or reduced, so its full column rank is preserved.

          The protocol equations currently couple version progression, previous-block
          linkage, timestamp position, and difficulty-epoch bits when those coordinates
          are hidden and public block metadata is available. There is one state
          trajectory and no frontier, candidate queue, sibling enumeration,
          connected-bit fallback, nonce interval loop, or best-of-many selection.

          Completion
          ----------
          Completion is emitted only when independent hashlib SHA256d of the embedded
          80-byte header equals the requested target hash.
          """,
                  encoding="utf-8",
              )


          def write_checkpoint(
              iteration: int,
              evaluation: Evaluation,
              exact_models: Sequence[str],
              started: float,
              termination_reason: Optional[str] = None,
              correction: Optional[JointCorrection] = None,
          ) -> None:
              CHECKPOINT.write_text(
                  json.dumps(
                      {
                          "model_revision": MODEL_REVISION,
                          "inference_mode": INFERENCE_MODE,
                          "iteration": iteration,
                          "candidate_header_hex": evaluation.header.hex(),
                          "candidate_displayed_hash": evaluation.displayed_hash,
                          "digest_hamming": evaluation.digest_hamming,
                          "E_observation": evaluation.E_observation,
                          "E_local": evaluation.E_local,
                          "E_global": evaluation.E_global,
                          "E_protocol": evaluation.E_protocol,
                          "protocol_weight": evaluation.protocol_weight,
                          "C_missing": evaluation.C_missing,
                          "total_energy": evaluation.total_energy,
                          "state_edge_hamming": evaluation.compatibility.state_edge_hamming,
                          "schedule_edge_hamming": evaluation.compatibility.schedule_edge_hamming,
                          "permutation": list(evaluation.projection.permutation),
                          "orientations": list(evaluation.projection.orientations),
                          "p": [
                              evaluation.projection.p0,
                              evaluation.projection.p1,
                              evaluation.projection.p2,
                              evaluation.projection.p3,
                          ],
                          "observation_noise_effective": evaluation.observation_noise_effective,
                          "joint_raw_residual_bits": (
                              correction.raw_residual_bits if correction else None
                          ),
                          "joint_correction_bits": (
                              correction.correction_bits if correction else None
                          ),
                          "joint_relaxed_projection_error": (
                              correction.relaxed_projection_error if correction else None
                          ),
                          "joint_binary_section_residual": (
                              correction.binary_section_residual if correction else None
                          ),
                          "protocol_residual_bits": (
                              correction.protocol_residual_bits if correction else None
                          ),
                          "protocol_binary_residual": (
                              correction.protocol_binary_residual if correction else None
                          ),
                          "protocol_equation_count": (
                              correction.protocol_equation_count if correction else None
                          ),
                          "joint_normal_condition_number": (
                              correction.normal_condition_number if correction else None
                          ),
                          "joint_section_count": (correction.section_count if correction else None),
                          "hidden_state_dimension": (
                              correction.state_dimension if correction else None
                          ),
                          "hidden_operator_rank": (
                              correction.operator_rank if correction else None
                          ),
                          "exact_models": list(exact_models),
                          "elapsed_seconds": time.time() - started,
                          "termination_reason": termination_reason,
                      },
                      indent=2,
                      sort_keys=True,
                  ),
                  encoding="utf-8",
              )


          def ensure_all_outputs_exist() -> None:
              for path in OUTPUT_PATHS:
                  if not path.exists():
                      if path.suffix == ".json":
                          path.write_text("{}\n", encoding="utf-8")
                      else:
                          path.write_text("", encoding="utf-8")


          def write_header_recovery(
              candidate: Evaluation,
              observation: bytes,
              sealed_truth_header: bytes,
              hidden: set[int],
          ) -> None:
              rows: List[dict] = []
              for byte_index in range(80):
                  field = next(
                      name
                      for name, (start, end) in FIELD_RANGES_BYTES.items()
                      if start <= byte_index < end
                  )
                  was_hidden = any(
                      bit in hidden for bit in range(byte_index * 8, byte_index * 8 + 8)
                  )
                  rows.append(
                      {
                          "byte_index": byte_index,
                          "field": field,
                          "observed_hex": f"{observation[byte_index]:02x}",
                          "recovered_hex": f"{candidate.header[byte_index]:02x}",
                          "historical_hex": f"{sealed_truth_header[byte_index]:02x}",
                          "was_hidden": was_hidden,
                          "historical_match": (
                              candidate.header[byte_index] == sealed_truth_header[byte_index]
                          ),
                      }
                  )
              write_csv(HEADER_RECOVERY, rows)


          def write_common_audits(
              hidden: set[int],
              exact_models: Sequence[Evaluation],
              candidate: Evaluation,
              sealed_truth_header: bytes,
              exact_hash_match: bool,
          ) -> None:
              posterior_rows = []
              for index, model in enumerate(exact_models):
                  posterior_rows.append(
                      {
                          "candidate": index,
                          "recovered_header_hex": model.header.hex(),
                          "displayed_hash": model.displayed_hash,
                          "exact_hash_match": model.exact_hash_match,
                          "exact_original_header_match": model.header == sealed_truth_header,
                          "energy": model.total_energy,
                          "candidate_set_posterior_mass": 1.0 / len(exact_models),
                          "scope": "mass normalized only across exact models actually returned",
                      }
                  )
              write_csv(
                  POSTERIOR,
                  posterior_rows,
                  fieldnames=[
                      "candidate",
                      "recovered_header_hex",
                      "displayed_hash",
                      "exact_hash_match",
                      "exact_original_header_match",
                      "energy",
                      "candidate_set_posterior_mass",
                      "scope",
                  ],
              )

              functional_rows = []
              for field, (start, end) in FIELD_RANGES_BYTES.items():
                  functional_rows.append(
                      {
                          "functional": field,
                          "hidden_from_observation": any(
                              bit in hidden for bit in range(start * 8, end * 8)
                          ),
                          "exactly_recovered": (
                              candidate.header[start:end] == sealed_truth_header[start:end]
                          ),
                          "confidence_type": "exact equality under returned candidate",
                          "ambiguity": "assessed only across exact models actually returned",
                      }
                  )
              functional_rows.extend(
                  [
                      {
                          "functional": "double_sha256_digest",
                          "hidden_from_observation": False,
                          "exactly_recovered": exact_hash_match,
                          "confidence_type": "independent hashlib validation",
                          "ambiguity": "none for digest equality",
                      },
                      {
                          "functional": "historical_header_identity",
                          "hidden_from_observation": bool(hidden),
                          "exactly_recovered": candidate.header == sealed_truth_header,
                          "confidence_type": "post-solve comparison only",
                          "ambiguity": "digest equality does not establish historical identity",
                      },
                  ]
              )
              write_csv(FUNCTIONALS, functional_rows)

              measure_rows = [
                  {
                      "component": "compact projection orientation",
                      "measure": "normalized finite C3 counting measure",
                      "operational": "product O_i=Identity enforced by sum O_i=0 mod 3",
                  },
                  {
                      "component": "translation gauge",
                      "measure": "proper prior required",
                      "operational": "removed by weighted centering in projection diagnostics",
                  },
                  {
                      "component": "positive scale",
                      "measure": "log-scale coordinate ds/s",
                      "operational": "removed by RMS normalization",
                  },
                  {
                      "component": "non-rigid deformation phi",
                      "measure": "finite low-frequency basis",
                      "operational": "FFT low-frequency projection component",
                  },
                  {
                      "component": "noise xi",
                      "measure": "high-frequency residual",
                      "operational": "FFT high-frequency projection component",
                  },
                  {
                      "component": "declared tesseract state volume",
                      "measure": "user-supplied finite prior volume",
                      "operational": "used directly with no verification gate",
                  },
              ]
              write_csv(MEASURE_AUDIT, measure_rows)

              log2_states, log10_states = log_state_space()
              STATE_SPACE.write_text(
                  json.dumps(
                      {
                          "formula": "(16! * (64!)^2 * 96! * 2^45 * 3^15) / (1536 * (8!)^8)",
                          "declared_log2_states": log2_states,
                          "declared_log10_states": log10_states,
                          "formula_verification_gate": False,
                          "interior_header_cells": 16,
                          "surface_constraint_cells": 240,
                          "total_4d_cells": 256,
                          "hard_constraints": [
                              "p0 XOR p1 XOR p2 XOR p3 = 0",
                              "p0 XOR p1 = 0",
                              "product_i O_i = Identity",
                          ],
                          "added_group_law": None,
                          "inference_mode": INFERENCE_MODE,
                          "base_section_count": len(JOINT_SECTION_NAMES),
                          "base_chunk_operator_rank": int(
                              np.linalg.matrix_rank(JOINT_SECTION_MATRIX)
                          ),
                          "header_container_bits": HEADER_BITS,
                      },
                      indent=2,
                      sort_keys=True,
                  ),
                  encoding="utf-8",
              )


          def main() -> None:
              started = time.time()
              write_model_spec()
              status = {
                  "completed": False,
                  "fake_completion": False,
                  "model_revision": MODEL_REVISION,
                  "inference_mode": INFERENCE_MODE,
                  "external_symbolic_solver_used": False,
                  "z3_used": False,
                  "artificial_scramble": False,
                  "physical_rubik_moves_used": False,
                  "nonce_interval_loop": False,
                  "candidate_branching_used": False,
                  "per_bit_candidate_enumeration_used": False,
                  "exact_hash_match": False,
                  "exact_original_header_match": False,
                  "max_runtime_seconds": MAX_RUNTIME_SECONDS,
                  "max_joint_iterations": MAX_JOINT_ITERATIONS,
                  "termination_reason": None,
              }

              best: Optional[Evaluation] = None
              sealed_truth_header = bytes(80)
              observation = bytes(80)
              hidden: set[int] = set()
              block_hash = ""
              trace_rows: List[dict] = []
              update_rows: List[dict] = []
              exact_models: List[Evaluation] = []
              iteration = 0
              seen_headers: Dict[str, int] = {}
              termination_reason: Optional[str] = None
              last_correction: Optional[JointCorrection] = None
              hidden_system: Optional[HiddenSectionSystem] = None
              protocol_system: Optional[ProtocolConstraintSystem] = None
              protocol_anchor: Optional[dict] = None
              protocol_phase_started_at: Optional[int] = None
              recent_energies: List[float] = []
              recent_corrections: List[int] = []

              try:
                  metadata: dict = {}
                  block_hash = BLOCK_HASH
                  raw_header_hex = RAW_HEADER_HEX

                  if raw_header_hex:
                      if len(raw_header_hex) != 160:
                          raise ValueError("RAW_HEADER_HEX must be exactly 160 hex characters")
                      sealed_truth_header = bytes.fromhex(raw_header_hex)
                      computed = hashlib_displayed_hash(sealed_truth_header)
                      block_hash = EXPECTED_BLOCK_HASH or block_hash or computed
                      if computed != block_hash:
                          raise ValueError("raw header does not match expected block hash")
                  else:
                      if not block_hash:
                          if BLOCK_HEIGHT:
                              block_hash = http_text(f"/block-height/{int(BLOCK_HEIGHT)}")
                          else:
                              block_hash = http_text("/blocks/tip/hash")
                      raw_header_hex = http_text(f"/block/{block_hash}/header").lower()
                      if len(raw_header_hex) != 160:
                          raise RuntimeError("API did not return an 80-byte header")
                      sealed_truth_header = bytes.fromhex(raw_header_hex)
                      metadata = http_json(f"/block/{block_hash}")
                      if hashlib_displayed_hash(sealed_truth_header) != block_hash:
                          raise RuntimeError("fetched header failed independent validation")

                  target_raw = bytes.fromhex(block_hash)[::-1]
                  hidden = parse_hidden_bits()
                  observation_mutable = bytearray(sealed_truth_header)
                  for bit in hidden:
                      put_bit(observation_mutable, bit, 0)
                  observation = bytes(observation_mutable)
                  initial_mask = tuple(
                      0 if bit in hidden else 1 for bit in range(HEADER_BITS)
                  )
                  hidden_system = build_hidden_section_system(hidden)
                  protocol_system = build_protocol_constraint_system(
                      hidden_system, metadata
                  )
                  write_protocol_constraints(protocol_system)
                  anchor_height = int(metadata.get("height", BLOCK_HEIGHT or 0) or 0)
                  protocol_anchor = write_protocol_trajectory(anchor_height)

                  initial_header = canonical_initial_header(
                      target_raw,
                      block_hash,
                      observation,
                      hidden,
                      initial_mask,
                      metadata,
                      protocol_system,
                  )
                  current = evaluate(
                      initial_header,
                      target_raw,
                      block_hash,
                      observation,
                      initial_mask,
                      metadata,
                      protocol_system,
                      0.0,
                  )
                  best = current

                  status.update(
                      {
                          "block_hash": block_hash,
                          "hidden_bit_count": len(hidden),
                          "visible_bit_count": HEADER_BITS - len(hidden),
                          "header_container_bits": HEADER_BITS,
                          "hidden_state_dimension": len(hidden_system.bit_indices),
                          "protocol_path_dimension": PROTOCOL_PATH_DIMENSION,
                          "joint_section_count": len(hidden_system.equation_names),
                          "joint_section_rank": hidden_system.rank,
                          "protocol_coordinate": protocol_anchor,
                          "protocol_equation_count": len(protocol_system.equation_names),
                          "protocol_operator_rank": protocol_system.rank,
                          "lambda_protocol": LAMBDA_PROTOCOL,
                          "protocol_warmup_iterations": PROTOCOL_WARMUP_ITERATIONS,
                          "protocol_ramp_iterations": PROTOCOL_RAMP_ITERATIONS,
                          "protocol_stability_window": PROTOCOL_STABILITY_WINDOW,
                          "observation_noise_requested": ALLOW_OBSERVATION_NOISE,
                          "observation_noise_effective": current.observation_noise_effective,
                      }
                  )

                  emit(f"[model] revision={MODEL_REVISION}")
                  emit(f"[bitcoin] block_hash={block_hash}")
                  emit(
                      f"[config] recovery_scope={RECOVERY_SCOPE} context_mode={CONTEXT_MODE} "
                      f"hidden_bits={len(hidden)}"
                  )
                  emit(
                      f"[state] hidden_dimension={len(hidden_system.bit_indices)} "
                      f"header_container_bits={HEADER_BITS} "
                      f"protocol_path_dimension={PROTOCOL_PATH_DIMENSION}"
                  )
                  emit(
                      f"[path] height={protocol_anchor['height']} "
                      f"era={protocol_anchor['halving_era']} "
                      f"subsidy_btc={protocol_anchor['subsidy_btc']} "
                      f"issued_before_btc={protocol_anchor['issued_before_btc']:.8f}"
                  )
                  emit(
                      f"[inference] mode={INFERENCE_MODE} "
                      f"active_equations={len(hidden_system.equation_names)} "
                      f"rank={hidden_system.rank} "
                      f"protocol_equations={len(protocol_system.equation_names)} "
                      f"protocol_rank={protocol_system.rank} "
                      "candidate_branching=False per_bit_enumeration=False"
                  )
                  emit(
                      f"[initial] energy={current.total_energy:.3f} "
                      f"digest_hamming={current.digest_hamming} "
                      f"state_edges={current.compatibility.state_edge_hamming} "
                      f"schedule_edges={current.compatibility.schedule_edge_hamming}"
                  )

                  while True:
                      if current.exact_hash_match:
                          independent = hashlib_displayed_hash(current.header)
                          if independent != block_hash:
                              raise RuntimeError(
                                  "internal exact state failed independent hashlib validation"
                              )
                          exact_models.append(current)
                          best = current
                          termination_reason = "exact_model_reached"
                          emit(f"[complete] exact model: {current.header.hex()}")
                          break

                      elapsed = time.time() - started
                      if MAX_RUNTIME_SECONDS and elapsed >= MAX_RUNTIME_SECONDS:
                          termination_reason = "max_runtime_seconds_reached"
                          break
                      if MAX_JOINT_ITERATIONS and iteration >= MAX_JOINT_ITERATIONS:
                          termination_reason = "max_joint_iterations_reached"
                          break

                      current_key = current.header.hex()
                      previous_iteration = seen_headers.get(current_key)
                      if previous_iteration is not None:
                          termination_reason = (
                              f"joint_fixed_point_cycle_detected_from_iteration_{previous_iteration}"
                          )
                          break
                      seen_headers[current_key] = iteration

                      if hidden_system is None:
                          raise RuntimeError("hidden-coordinate system was not initialized")
                      if protocol_system is None:
                          raise RuntimeError("protocol constraint system was not initialized")

                      recent_energies.append(current.total_energy)
                      if len(recent_energies) > PROTOCOL_STABILITY_WINDOW:
                          recent_energies = recent_energies[-PROTOCOL_STABILITY_WINDOW:]
                      if (
                          protocol_phase_started_at is None
                          and iteration >= PROTOCOL_WARMUP_ITERATIONS
                          and protocol_system.equation_names
                          and protocol_phase_is_stable(
                              recent_energies,
                              recent_corrections,
                              len(hidden_system.bit_indices),
                          )
                      ):
                          protocol_phase_started_at = iteration
                          emit(
                              f"[protocol phase] activated_at={iteration} "
                              f"equations={len(protocol_system.equation_names)}"
                          )

                      effective_protocol_weight = protocol_weight_at_iteration(
                          iteration, protocol_phase_started_at
                      )
                      current = reweight_evaluation(
                          current, effective_protocol_weight
                      )
                      if best is not None:
                          best = reweight_evaluation(
                              best, effective_protocol_weight
                          )

                      correction = solve_joint_hidden_coordinate_system(
                          current,
                          observation,
                          hidden_system,
                          protocol_system,
                          effective_protocol_weight,
                      )
                      last_correction = correction
                      iteration += 1

                      trace_rows.append(
                          {
                              "iteration": iteration,
                              "total_energy": current.total_energy,
                              "transformed_energy": current.transformed_energy,
                              "digest_hamming": current.digest_hamming,
                              "E_observation": current.E_observation,
                              "E_local": current.E_local,
                              "E_global": current.E_global,
                              "E_protocol": current.E_protocol,
                              "protocol_weight": current.protocol_weight,
                              "protocol_phase_active": protocol_phase_started_at is not None,
                              "C_missing": current.C_missing,
                              "state_edge_hamming": current.compatibility.state_edge_hamming,
                              "schedule_edge_hamming": current.compatibility.schedule_edge_hamming,
                              "joint_raw_residual_bits": correction.raw_residual_bits,
                              "joint_correction_bits": correction.correction_bits,
                              "joint_relaxed_projection_error": (
                                  correction.relaxed_projection_error
                              ),
                              "joint_binary_section_residual": (
                                  correction.binary_section_residual
                              ),
                              "protocol_residual_bits": correction.protocol_residual_bits,
                              "protocol_binary_residual": correction.protocol_binary_residual,
                              "protocol_equation_count": correction.protocol_equation_count,
                              "joint_normal_condition_number": (
                                  correction.normal_condition_number
                              ),
                              "hidden_state_dimension": correction.state_dimension,
                              "hidden_operator_rank": correction.operator_rank,
                              "candidate_header_hex": current.header.hex(),
                              "candidate_displayed_hash": current.displayed_hash,
                          }
                      )
                      update_rows.append(
                          {
                              "iteration": iteration,
                              "section_equations_solved_together": correction.section_count,
                              "raw_residual_bits": correction.raw_residual_bits,
                              "applied_correction_bits": correction.correction_bits,
                              "relaxed_projection_error": correction.relaxed_projection_error,
                              "binary_section_residual": correction.binary_section_residual,
                              "protocol_residual_bits": correction.protocol_residual_bits,
                              "protocol_binary_residual": correction.protocol_binary_residual,
                              "protocol_weight": correction.protocol_weight,
                              "protocol_equation_count": correction.protocol_equation_count,
                              "joint_normal_condition_number": (
                                  correction.normal_condition_number
                              ),
                              "hidden_state_dimension": correction.state_dimension,
                              "hidden_operator_rank": correction.operator_rank,
                              "next_header_hex": correction.header.hex(),
                          }
                      )

                      recent_corrections.append(correction.correction_bits)
                      if len(recent_corrections) > PROTOCOL_STABILITY_WINDOW:
                          recent_corrections = recent_corrections[-PROTOCOL_STABILITY_WINDOW:]

                      if iteration == 1 or iteration % CHECKPOINT_EVERY == 0:
                          emit(
                              f"[joint iteration {iteration}] "
                              f"correction_bits={correction.correction_bits} "
                              f"section_residual={correction.binary_section_residual:.6g} "
                              f"protocol_weight={correction.protocol_weight:.6g} "
                              f"protocol_residual_bits={correction.protocol_residual_bits} "
                              f"protocol_binary_residual={correction.protocol_binary_residual:.6g} "
                              f"energy={current.total_energy:.3f} "
                              f"digest_hamming={current.digest_hamming} "
                              f"state_edges={current.compatibility.state_edge_hamming} "
                              f"schedule_edges={current.compatibility.schedule_edge_hamming}"
                          )
                          write_csv(JOINT_TRACE, trace_rows)
                          write_csv(JOINT_UPDATES, update_rows)
                          write_checkpoint(
                              iteration,
                              current,
                              [model.header.hex() for model in exact_models],
                              started,
                              correction=correction,
                          )

                      if correction.correction_bits == 0 or correction.header == current.header:
                          termination_reason = "joint_fixed_point_stationary"
                          break

                      next_evaluation = evaluate(
                          correction.header,
                          target_raw,
                          block_hash,
                          observation,
                          initial_mask,
                          metadata,
                          protocol_system,
                          effective_protocol_weight,
                      )
                      current = next_evaluation
                      if best is None or current.total_energy < best.total_energy:
                          best = current

                  if best is None:
                      raise RuntimeError("joint solver did not produce an evaluation")

                  recovered = exact_models[0] if exact_models else best
                  exact_hash_match = hashlib_displayed_hash(recovered.header) == block_hash
                  historical_match = recovered.header == sealed_truth_header

                  write_header_recovery(recovered, observation, sealed_truth_header, hidden)
                  write_hidden_state(
                      hidden_state_from_header(recovered.header, tuple(sorted(hidden)))
                  )
                  write_csv(TESSERACT_SLOTS, tesseract_slot_rows())
                  write_csv(JOINT_TRACE, trace_rows)
                  write_csv(JOINT_UPDATES, update_rows)
                  write_round_and_continuous_exports(recovered)
                  write_common_audits(
                      hidden,
                      exact_models,
                      recovered,
                      sealed_truth_header,
                      exact_hash_match,
                  )
                  write_checkpoint(
                      iteration,
                      recovered,
                      [model.header.hex() for model in exact_models],
                      started,
                      termination_reason=termination_reason,
                      correction=last_correction,
                  )

                  completed = bool(exact_models) and exact_hash_match
                  status.update(
                      {
                          "completed": completed,
                          "exact_hash_match": exact_hash_match,
                          "exact_original_header_match": historical_match,
                          "iterations": iteration,
                          "trajectory_states": len(seen_headers),
                          "E_observation": recovered.E_observation,
                          "E_local": recovered.E_local,
                          "E_local_state_edges": (
                              recovered.compatibility.state_edge_hamming
                          ),
                          "E_local_schedule_edges": (
                              recovered.compatibility.schedule_edge_hamming
                          ),
                          "E_global": recovered.E_global,
                          "C_missing": recovered.C_missing,
                          "energy": recovered.total_energy,
                          "transformed_energy_f": recovered.transformed_energy,
                          "candidate_header_hex": recovered.header.hex(),
                          "candidate_display_hash": recovered.displayed_hash,
                          "recovered_header_hex": recovered.header.hex() if completed else None,
                          "recovered_display_hash": (
                              recovered.displayed_hash if completed else None
                          ),
                          "returned_exact_models": len(exact_models),
                          "termination_reason": termination_reason,
                          "observation_noise_effective": (
                              recovered.observation_noise_effective
                          ),
                          "last_joint_correction_bits": (
                              last_correction.correction_bits if last_correction else None
                          ),
                          "elapsed_seconds": time.time() - started,
                      }
                  )
                  if not completed:
                      status["error"] = (
                          "no independently validated exact SHA-256d preimage was reached by "
                          f"the direct joint trajectory: {termination_reason}"
                      )

                  STATUS.write_text(
                      json.dumps(status, indent=2, sort_keys=True), encoding="utf-8"
                  )

                  title = (
                      "BITCOIN SHA-256d 4D JOINT-INFERENCE RESULT"
                      if completed
                      else "BITCOIN SHA-256d 4D JOINT-INFERENCE — INCOMPLETE"
                  )
                  report_lines = [
                      title,
                      "=" * 72,
                      f"Model revision:                 {MODEL_REVISION}",
                      f"Block hash:                     {block_hash}",
                      f"Recovery scope:                 {RECOVERY_SCOPE}",
                      f"Header container bits:          {HEADER_BITS}",
                      f"Hidden-state dimension k:       {len(hidden)}",
                      f"Protocol path dimension:        {PROTOCOL_PATH_DIMENSION}",
                      f"Context mode:                   {CONTEXT_MODE}",
                      f"Inference mode:                 {INFERENCE_MODE}",
                      f"Joint active equations:         {len(hidden_system.equation_names) if hidden_system else 0}",
                      f"Joint hidden operator rank:     {hidden_system.rank if hidden_system else 0}",
                      f"Protocol anchor height:         {protocol_anchor['height'] if protocol_anchor else None}",
                      f"Protocol subsidy BTC:           {protocol_anchor['subsidy_btc'] if protocol_anchor else None}",
                      f"Protocol equations:             {len(protocol_system.equation_names) if protocol_system else 0}",
                      f"Protocol operator rank:          {protocol_system.rank if protocol_system else 0}",
                      f"Protocol phase activated at:     {protocol_phase_started_at}",
                      f"Final protocol weight:           {recovered.protocol_weight}",
                      "Candidate branching used:        False",
                      "Per-bit candidate enumeration:   False",
                      f"Termination reason:             {termination_reason}",
                      f"Trajectory states:              {len(seen_headers)}",
                      f"Iterations:                     {iteration}",
                      f"Exact digest match:             {exact_hash_match}",
                      f"Exact historical header match: {historical_match}",
                      f"E_observation:                  {recovered.E_observation}",
                      f"E_local:                        {recovered.E_local}",
                      f"E_global:                       {recovered.E_global}",
                      f"E_protocol:                     {recovered.E_protocol}",
                      f"Protocol weighted contribution: {recovered.protocol_weight * recovered.E_protocol}",
                      f"C(m):                           {recovered.C_missing}",
                      f"Total MAP energy:               {recovered.total_energy}",
                      "External SAT/SMT solver used:    False",
                      "Nonce interval loop used:        False",
                      "",
                      "Best trajectory state raw header:",
                      recovered.header.hex(),
                      "",
                      "Historical raw header (post-solve comparison only):",
                      sealed_truth_header.hex(),
                  ]
                  if not completed:
                      report_lines.extend(
                          [
                              "",
                              "INCOMPLETE",
                              str(status["error"]),
                              "No recovered-header claim was emitted.",
                          ]
                      )
                  REPORT.write_text("\n".join(report_lines) + "\n", encoding="utf-8")
                  emit(REPORT.read_text(encoding="utf-8"))

              except Exception as exc:
                  status.update(
                      {
                          "completed": False,
                          "fake_completion": False,
                          "error": str(exc),
                          "traceback": traceback.format_exc(),
                          "termination_reason": termination_reason or "exception",
                          "iterations": iteration,
                          "trajectory_states": len(seen_headers),
                          "elapsed_seconds": time.time() - started,
                      }
                  )
                  STATUS.write_text(
                      json.dumps(status, indent=2, sort_keys=True), encoding="utf-8"
                  )
                  REPORT.write_text(
                      "BITCOIN SHA-256d 4D JOINT-INFERENCE — INCOMPLETE\n"
                      + "=" * 72
                      + "\n"
                      + traceback.format_exc(),
                      encoding="utf-8",
                  )
                  emit(REPORT.read_text(encoding="utf-8"))
              finally:
                  ensure_all_outputs_exist()
                  sys.exit(0)


          if __name__ == "__main__":
              main()
          PY

      - name: Publish authoritative status
        if: always()
        shell: bash
        run: |
          if [[ -f bitcoin_sha256d_4d_inverse_status.json ]]; then
            cat bitcoin_sha256d_4d_inverse_status.json
          else
            printf '%s\n' '{"completed":false,"error":"status file not produced"}' \
              | tee bitcoin_sha256d_4d_inverse_status.json
          fi

      - name: Upload the complete mathematical evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-sha256d-4d-joint-${{ github.run_number }}
          path: |
            bitcoin_sha256d_4d_inverse_status.json
            bitcoin_sha256d_4d_inverse_report.txt
            bitcoin_sha256d_mathematical_model.txt
            bitcoin_sha256d_header_recovery.csv
            bitcoin_sha256d_round_states.csv
            bitcoin_sha256d_tesseract_slots.csv
            bitcoin_sha256d_lattice_bits.csv
            bitcoin_sha256d_3d_projections.csv
            bitcoin_sha256d_4d_joint_trace.csv
            bitcoin_sha256d_4d_joint_updates.csv
            bitcoin_sha256d_posterior_models.csv
            bitcoin_sha256d_tolerance_topology.csv
            bitcoin_sha256d_functional_identifiability.csv
            bitcoin_sha256d_measure_audit.csv
            bitcoin_sha256d_frequency_split.csv
            bitcoin_sha256d_gauge_diagnostics.csv
            bitcoin_sha256d_stability.csv
            bitcoin_sha256d_tesseract_state_space.json
            bitcoin_sha256d_4d_checkpoint.json
            bitcoin_protocol_trajectory.csv
            bitcoin_protocol_supply_curve.svg
            bitcoin_protocol_joint_constraints.csv
            bitcoin_sha256d_hidden_coordinate_state.csv
            bitcoin_sha256d_4d_inverse_console.log
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce authoritative completion status
        if: always()
        shell: bash
        env:
          FAIL_ON_INCOMPLETE: ${{ inputs.fail_on_incomplete }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path("bitcoin_sha256d_4d_inverse_status.json")
          if not path.exists():
              print("::error::Authoritative status file was not produced.")
              sys.exit(1)

          try:
              status = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error::Authoritative status is invalid JSON: {exc}")
              sys.exit(1)

          completed = status.get("completed") is True
          fail_on_incomplete = os.environ.get("FAIL_ON_INCOMPLETE", "true").lower() == "true"

          if completed:
              print("Exact SHA-256d completion was independently validated.")
              sys.exit(0)

          reason = status.get("termination_reason") or status.get("error") or "unknown"
          message = f"Reconstruction is incomplete: {reason}"
          if fail_on_incomplete:
              print(f"::error::{message}")
              sys.exit(1)

          print(f"::warning::{message}")
          PY
