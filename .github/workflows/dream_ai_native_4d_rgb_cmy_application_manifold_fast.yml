name: DREAM AI-Native 4D RGB-CMY Application Manifold v8
run-name: DREAM AI-Native 4D RGB-CMY Application Manifold v8

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-ai-native-4d-rgb-cmy-v8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ai-native-manifold:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout tracked repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "Pillow>=10,<13" \
            "numpy>=2,<3"

      - name: Write and compile the v8 builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_dream_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          import os
          import re
          import stat
          import struct
          import subprocess
          import sys
          import tempfile
          import time
          import zlib
          from dataclasses import dataclass
          from pathlib import Path, PurePosixPath

          import numpy as np
          from PIL import Image, ImageDraw

          WIDTH = 4284
          HEIGHT = 5712
          LOW_SCALE = 4
          LOW_WIDTH = WIDTH // LOW_SCALE
          LOW_HEIGHT = HEIGHT // LOW_SCALE
          GRID_COLUMNS = 17
          GRID_ROWS = 23
          PITCH = 248
          BLOCK_SIZE = 240
          LEFT_MARGIN = (WIDTH - GRID_COLUMNS * PITCH) // 2
          TOP_MARGIN = (HEIGHT - GRID_ROWS * PITCH) // 2
          TOTAL_SLOTS = GRID_COLUMNS * GRID_ROWS
          CALIBRATION_SLOTS = (
              0,
              GRID_COLUMNS - 1,
              TOTAL_SLOTS - GRID_COLUMNS,
              TOTAL_SLOTS - 1,
          )
          DATA_BLOCKS_MAX = TOTAL_SLOTS - len(CALIBRATION_SLOTS)

          HEADER_X = 4
          HEADER_Y = 4
          HEADER_CELL = 4
          HEADER_COLUMNS = 58
          HEADER_ROWS = 6
          HEADER_BYTE_CAPACITY = HEADER_COLUMNS * HEADER_ROWS * 2

          P2_DATA_WIDTH = 208
          P2_DATA_HEIGHT = 192
          P2_PHYSICAL_WIDTH = 221
          P2_PHYSICAL_HEIGHT = 204
          P2_X = 9
          P2_Y = 32

          PR_DATA_WIDTH = 232
          PR_DATA_HEIGHT = 192
          PR_PHYSICAL_WIDTH = 232
          PR_PHYSICAL_HEIGHT = 204
          PR_X = 4
          PR_Y = 32

          P0_DATA_WIDTH = 232
          P0_DATA_HEIGHT = 208
          P0_PHYSICAL_WIDTH = 232
          P0_PHYSICAL_HEIGHT = 208
          P0_X = 4
          P0_Y = 30

          PACKET_MAGIC = b"DREAM4D8\n"
          PACKET_PREFIX = struct.Struct(">9sQ")
          AFFINE_MULTIPLIER = 197
          AFFINE_OFFSET = 101
          AFFINE_INVERSE = 13
          PARITY_XOR = 0xA5

          GOLDEN_ANGLE = math.pi / 5.0
          OMEGA = complex(
              math.cos(GOLDEN_ANGLE),
              math.sin(GOLDEN_ANGLE),
          )
          PHI = float(
              (OMEGA + OMEGA.conjugate()).real
          )
          GOLDEN_N = float(
              (
                  PHI
                  + math.sqrt(PHI * PHI + 4.0)
              )
              / 2.0
          )
          IDENTITY_RESIDUAL = abs(
              GOLDEN_N - 1.0 / GOLDEN_N - PHI
          )

          if IDENTITY_RESIDUAL > 1.0e-12:
              raise RuntimeError(
                  "golden identity invariant failed"
              )

          APPLICATION_EXTENSIONS = {
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
              ".mjs",
              ".cjs",
              ".css",
              ".scss",
              ".sass",
              ".less",
              ".html",
              ".htm",
              ".vue",
              ".svelte",
              ".astro",
              ".graphql",
              ".gql",
              ".prisma",
          }

          EXCLUDED_DIRECTORIES = {
              ".git",
              ".github",
              ".circleci",
              ".husky",
              ".vscode",
              ".idea",
              "ci",
              "cd",
              "docs",
              "doc",
              "documentation",
              "test",
              "tests",
              "__tests__",
              "spec",
              "specs",
              "e2e",
              "cypress",
              "playwright",
              "fixtures",
              "mocks",
              "stories",
              "storybook",
              "coverage",
              "dist",
              "build",
              "out",
              ".next",
              "node_modules",
              "vendor",
              "generated",
              "public",
              "scripts",
              "tools",
              "bench",
              "benchmarks",
              "examples",
              "example",
              "tmp",
              "temp",
              ".cache",
              "cache",
          }

          EXCLUDED_NAME_REGEXES = tuple(
              re.compile(pattern, re.IGNORECASE)
              for pattern in (
                  r"\.test\.",
                  r"\.spec\.",
                  r"\.stories?\.",
                  r"\.story\.",
                  r"\.mock\.",
                  r"\.fixture\.",
                  r"\.bench(mark)?\.",
                  r"\.config\.",
                  r"\.setup\.",
                  r"\.min\.",
                  r"\.bundle\.",
              )
          )

          IMPORT_LINE = re.compile(
              r"(?:from\s+|import\s*\(\s*|require\s*\(\s*|"
              r"import\s+[^;\n]*?from\s+)[\"']([^\"']+)[\"']"
          )

          CHANNEL_PERMUTATIONS = (
              (0, 1, 2),
              (0, 2, 1),
              (1, 0, 2),
              (1, 2, 0),
              (2, 0, 1),
              (2, 1, 0),
          )


          class ManifoldError(RuntimeError):
              pass


          @dataclass
          class SourceFile:
              id: int
              path: str
              raw: bytes
              mode: int
              sha256: str
              imports: list[int]
              token_histogram: dict[str, int]
              packet_offset: int = 0


          @dataclass
          class DataBlock:
              index: int
              byte_start: int
              payload: bytes
              digest: bytes
              owner_file: int
              owner_chunk: int
              orientation: int
              target_x: float
              target_y: float
              slot: int = -1


          def now() -> str:
              return time.strftime("%H:%M:%S")


          def log(message: str) -> None:
              print(
                  f"[{now()}] {message}",
                  flush=True,
              )


          def sha256_hex(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def tracked_paths(root: Path) -> list[str]:
              result = subprocess.run(
                  [
                      "git",
                      "-C",
                      str(root),
                      "ls-files",
                      "-z",
                      "--recurse-submodules",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              )

              paths = sorted(
                  set(
                      item.decode(
                          "utf-8",
                          "surrogateescape",
                      )
                      for item
                      in result.stdout.split(b"\0")
                      if item
                  )
              )

              if not paths:
                  raise ManifoldError(
                      "git reported no tracked paths"
                  )

              return paths


          def should_include(
              relative: PurePosixPath,
          ) -> tuple[bool, str]:
              for part in relative.parts[:-1]:
                  if part.lower() in EXCLUDED_DIRECTORIES:
                      return (
                          False,
                          f"excluded-directory:{part}",
                      )

              if any(
                  regex.search(
                      relative.name.lower()
                  )
                  for regex
                  in EXCLUDED_NAME_REGEXES
              ):
                  return (
                      False,
                      f"excluded-name:{relative.name}",
                  )

              if (
                  relative.suffix.lower()
                  not in APPLICATION_EXTENSIONS
              ):
                  return (
                      False,
                      "excluded-extension:"
                      f"{relative.suffix or '(none)'}",
                  )

              return True, "application-source"


          def fast_token_histogram(
              raw: bytes,
          ) -> dict[str, int]:
              values = np.frombuffer(
                  raw,
                  dtype=np.uint8,
              )

              if values.size == 0:
                  return {
                      key: 0
                      for key in (
                          "whitespace",
                          "identifier",
                          "number",
                          "quote",
                          "operator",
                          "delimiter",
                          "other",
                      )
                  }

              whitespace = int(
                  np.count_nonzero(
                      np.isin(
                          values,
                          np.array(
                              [9, 10, 13, 32],
                              dtype=np.uint8,
                          ),
                      )
                  )
              )

              letters = int(
                  np.count_nonzero(
                      (
                          (values >= 65)
                          & (values <= 90)
                      )
                      | (
                          (values >= 97)
                          & (values <= 122)
                      )
                      | (values == 95)
                      | (values == 36)
                  )
              )

              numbers = int(
                  np.count_nonzero(
                      (values >= 48)
                      & (values <= 57)
                  )
              )

              quotes = int(
                  np.count_nonzero(
                      np.isin(
                          values,
                          np.array(
                              [34, 39, 96],
                              dtype=np.uint8,
                          ),
                      )
                  )
              )

              operators = int(
                  np.count_nonzero(
                      np.isin(
                          values,
                          np.frombuffer(
                              b"+-*/%=&|^~!<>?:",
                              dtype=np.uint8,
                          ),
                      )
                  )
              )

              delimiters = int(
                  np.count_nonzero(
                      np.isin(
                          values,
                          np.frombuffer(
                              b"{}[](),.;",
                              dtype=np.uint8,
                          ),
                      )
                  )
              )

              other = (
                  int(values.size)
                  - whitespace
                  - letters
                  - numbers
                  - quotes
                  - operators
                  - delimiters
              )

              return {
                  "whitespace": whitespace,
                  "identifier": letters,
                  "number": numbers,
                  "quote": quotes,
                  "operator": operators,
                  "delimiter": delimiters,
                  "other": max(0, other),
              }


          def resolve_imports(
              files: list[SourceFile],
          ) -> None:
              path_to_id = {
                  file.path: file.id
                  for file in files
              }

              extensions = tuple(
                  sorted(APPLICATION_EXTENSIONS)
              )

              def candidates(
                  base: PurePosixPath,
                  specifier: str,
              ):
                  if not specifier.startswith("."):
                      return

                  parts: list[str] = []

                  for part in (
                      base.parent
                      .joinpath(
                          PurePosixPath(specifier)
                      )
                      .parts
                  ):
                      if part in {"", "."}:
                          continue

                      if part == "..":
                          if parts:
                              parts.pop()
                      else:
                          parts.append(part)

                  normalized = PurePosixPath(*parts)

                  if normalized.suffix:
                      yield normalized.as_posix()
                      return

                  for extension in extensions:
                      yield (
                          normalized
                          .with_suffix(extension)
                          .as_posix()
                      )

                  for extension in extensions:
                      yield (
                          normalized
                          .joinpath(
                              "index" + extension
                          )
                          .as_posix()
                      )

              for index, file in enumerate(
                  files,
                  start=1,
              ):
                  text = file.raw.decode(
                      "utf-8",
                      "surrogateescape",
                  )

                  found: set[int] = set()

                  for line in text.splitlines():
                      if (
                          "import" not in line
                          and "require" not in line
                          and "from" not in line
                      ):
                          continue

                      match = IMPORT_LINE.search(
                          line[:4096]
                      )

                      if not match:
                          continue

                      options = candidates(
                          PurePosixPath(file.path),
                          match.group(1),
                      )

                      for candidate in options or ():
                          target = path_to_id.get(
                              candidate
                          )

                          if target is not None:
                              found.add(target)
                              break

                  file.imports = sorted(found)

                  if index % 500 == 0:
                      log(
                          "resolved imports for "
                          f"{index}/{len(files)} files"
                      )


          def collect_sources(
              root: Path,
          ) -> tuple[
              list[SourceFile],
              list[dict],
          ]:
              files: list[SourceFile] = []
              skipped: list[dict] = []

              paths = tracked_paths(root)

              log(
                  f"git returned {len(paths)} "
                  "tracked paths"
              )

              for index, relative_text in enumerate(
                  paths,
                  start=1,
              ):
                  relative = PurePosixPath(
                      relative_text
                  )

                  include, reason = should_include(
                      relative
                  )

                  absolute = root.joinpath(
                      *relative.parts
                  )

                  if not include:
                      skipped.append(
                          {
                              "path": (
                                  relative.as_posix()
                              ),
                              "reason": reason,
                          }
                      )
                      continue

                  metadata = os.lstat(absolute)

                  if not stat.S_ISREG(
                      metadata.st_mode
                  ):
                      skipped.append(
                          {
                              "path": (
                                  relative.as_posix()
                              ),
                              "reason": "non-regular",
                          }
                      )
                      continue

                  raw = absolute.read_bytes()

                  files.append(
                      SourceFile(
                          id=len(files),
                          path=relative.as_posix(),
                          raw=raw,
                          mode=stat.S_IMODE(
                              metadata.st_mode
                          ),
                          sha256=sha256_hex(raw),
                          imports=[],
                          token_histogram=(
                              fast_token_histogram(raw)
                          ),
                      )
                  )

                  if index % 1000 == 0:
                      log(
                          f"scanned {index}/"
                          f"{len(paths)} tracked paths"
                      )

              if not files:
                  raise ManifoldError(
                      "no application source files "
                      "matched the filter"
                  )

              log(
                  f"included {len(files)} "
                  "application files; excluded "
                  f"{len(skipped)} tracked paths"
              )

              resolve_imports(files)

              return files, skipped


          def mode_dimensions(mode: str):
              if mode == "P2":
                  return (
                      P2_DATA_WIDTH,
                      P2_DATA_HEIGHT,
                      P2_PHYSICAL_WIDTH,
                      P2_PHYSICAL_HEIGHT,
                      P2_X,
                      P2_Y,
                  )

              if mode == "PR":
                  return (
                      PR_DATA_WIDTH,
                      PR_DATA_HEIGHT,
                      PR_PHYSICAL_WIDTH,
                      PR_PHYSICAL_HEIGHT,
                      PR_X,
                      PR_Y,
                  )

              if mode == "P0":
                  return (
                      P0_DATA_WIDTH,
                      P0_DATA_HEIGHT,
                      P0_PHYSICAL_WIDTH,
                      P0_PHYSICAL_HEIGHT,
                      P0_X,
                      P0_Y,
                  )

              raise ValueError(mode)


          def data_bytes_per_block(
              mode: str,
          ) -> int:
              width, height, *_ = (
                  mode_dimensions(mode)
              )

              return width * height * 2


          def capacity_bytes(mode: str) -> int:
              return (
                  data_bytes_per_block(mode)
                  * DATA_BLOCKS_MAX
              )


          def build_manifest(
              files: list[SourceFile],
              mode: str,
              packet_offsets: bool,
          ) -> bytes:
              manifest = {
                  "format": (
                      "dream-4d-ai-native-"
                      "rgb-cmy-manifold"
                  ),
                  "version": 8,
                  "analysisOrder": [
                      (
                          "global equation field "
                          "and file topology"
                      ),
                      (
                          "four corner calibration "
                          "blocks"
                      ),
                      (
                          "repeated block headers "
                          "and orientation anchors"
                      ),
                      (
                          "two-byte RGB pixels plus "
                          "RGB/CMY parity"
                      ),
                      (
                          "manifest and exact "
                          "application files"
                      ),
                  ],
                  "equation": {
                      "goldenAngle": GOLDEN_ANGLE,
                      "phi": PHI,
                      "n": GOLDEN_N,
                      "identityResidual": (
                          IDENTITY_RESIDUAL
                      ),
                  },
                  "visualGrammar": {
                      "canvas": [
                          WIDTH,
                          HEIGHT,
                      ],
                      "slotGrid": [
                          GRID_COLUMNS,
                          GRID_ROWS,
                      ],
                      "blockPixels": BLOCK_SIZE,
                      "calibrationCorners": list(
                          CALIBRATION_SLOTS
                      ),
                      "pairPixel": (
                          "one primary RGB pixel "
                          "stores two ordered bytes; "
                          "blue is parity"
                      ),
                      "map": (
                          "A(v)=(197*v+101) mod 256; "
                          "R=A(first); G=A(second); "
                          "B=A(first XOR second XOR A5)"
                      ),
                      "inverse": (
                          "v=13*(A(v)-101) mod 256"
                      ),
                      "headers": (
                          "4x4 RGB/CMY cells; rotate "
                          "until D4AI8 or D4CAL8 is "
                          "readable"
                      ),
                      "modes": {
                          "P2": (
                              "row+column parity"
                          ),
                          "PR": "row parity",
                          "P0": "direct",
                      },
                      "packet": (
                          "DREAM4D8 newline, "
                          "big-endian manifest length, "
                          "JSON manifest, raw files"
                      ),
                  },
                  "mode": mode,
                  "capacityBytes": (
                      capacity_bytes(mode)
                  ),
                  "fileCount": len(files),
                  "files": [
                      {
                          "id": file.id,
                          "path": file.path,
                          "mode": file.mode,
                          "packetOffset": (
                              file.packet_offset
                              if packet_offsets
                              else 0
                          ),
                          "length": len(file.raw),
                          "sha256": file.sha256,
                          "imports": file.imports,
                          "tokenHistogram": (
                              file.token_histogram
                          ),
                      }
                      for file in files
                  ],
              }

              return json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode(
                  "utf-8",
                  "surrogatepass",
              )


          def assemble_packet(
              files: list[SourceFile],
              mode: str,
          ):
              provisional = build_manifest(
                  files,
                  mode,
                  False,
              )

              cursor = (
                  PACKET_PREFIX.size
                  + len(provisional)
              )

              for file in files:
                  file.packet_offset = cursor
                  cursor += len(file.raw)

              manifest = build_manifest(
                  files,
                  mode,
                  True,
              )

              for _ in range(2):
                  cursor = (
                      PACKET_PREFIX.size
                      + len(manifest)
                  )

                  for file in files:
                      file.packet_offset = cursor
                      cursor += len(file.raw)

                  updated = build_manifest(
                      files,
                      mode,
                      True,
                  )

                  if len(updated) == len(manifest):
                      manifest = updated
                      break

                  manifest = updated

              packet = bytearray(
                  PACKET_PREFIX.pack(
                      PACKET_MAGIC,
                      len(manifest),
                  )
              )

              packet.extend(manifest)

              for file in files:
                  packet.extend(file.raw)

              descriptor = [
                  {
                      "path": file.path,
                      "mode": file.mode,
                      "length": len(file.raw),
                      "sha256": file.sha256,
                  }
                  for file in files
              ]

              application_root = sha256_hex(
                  json.dumps(
                      descriptor,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              )

              return bytes(packet), {
                  "manifestBytes": len(manifest),
                  "packetBytes": len(packet),
                  "applicationRoot": (
                      application_root
                  ),
                  "packetSha256": (
                      sha256_hex(packet)
                  ),
              }


          def choose_mode(
              files: list[SourceFile],
          ):
              for mode in (
                  "P2",
                  "PR",
                  "P0",
              ):
                  packet, report = (
                      assemble_packet(
                          files,
                          mode,
                      )
                  )

                  log(
                      f"mode {mode}: "
                      f"packet={len(packet):,} "
                      f"capacity="
                      f"{capacity_bytes(mode):,}"
                  )

                  if (
                      len(packet)
                      <= capacity_bytes(mode)
                  ):
                      return (
                          mode,
                          packet,
                          report,
                      )

              raise ManifoldError(
                  "application code exceeds "
                  "one-image capacity"
              )


          def project_4d(
              x4: float,
              y4: float,
              z4: float,
              w4: float,
          ):
              d4 = max(
                  0.48,
                  2.28 - w4,
              )

              x3 = (
                  x4 + 0.30 * z4
              ) / d4

              y3 = (
                  y4 + 0.22 * z4
              ) / d4

              z3 = z4 / d4

              d3 = max(
                  0.58,
                  2.38 - z3,
              )

              return (
                  x3 / d3,
                  y3 / d3,
              )


          def file_anchor(
              file: SourceFile,
              total_files: int,
          ):
              digest = hashlib.sha256(
                  file.path.encode(
                      "utf-8",
                      "surrogateescape",
                  )
                  + bytes.fromhex(
                      file.sha256
                  )
              ).digest()

              t = (
                  file.id + 1
              ) / max(
                  2,
                  total_files + 1,
              )

              theta = (
                  2.0 * math.pi * t
                  + GOLDEN_ANGLE
                  * (file.id % 16)
              )

              phase = [
                  2.0
                  * math.pi
                  * digest[index]
                  / 255.0
                  for index in (
                      0,
                      7,
                      13,
                      21,
                  )
              ]

              size_scale = min(
                  1.0,
                  math.log2(
                      max(
                          2,
                          len(file.raw),
                      )
                  )
                  / 22.0,
              )

              degree_scale = min(
                  1.0,
                  len(file.imports) / 12.0,
              )

              return project_4d(
                  math.cos(
                      theta * GOLDEN_N
                      + phase[0]
                  )
                  * (
                      0.58
                      + 0.20 * size_scale
                  ),
                  math.sin(
                      theta * PHI
                      + phase[1]
                  )
                  * (
                      0.58
                      + 0.20 * degree_scale
                  ),
                  math.cos(
                      theta
                      * (
                          PHI + GOLDEN_N
                      )
                      + phase[2]
                  )
                  * (
                      0.46
                      + 0.18 * degree_scale
                  ),
                  math.sin(
                      theta / GOLDEN_N
                      + phase[3]
                  )
                  * (
                      0.46
                      + 0.18 * size_scale
                  ),
              )


          def golden_shell(index: int) -> int:
              shell = 0
              boundary = 1

              while boundary <= index:
                  shell += 1
                  boundary = max(
                      boundary + 1,
                      int(
                          math.floor(
                              GOLDEN_N ** shell
                          )
                      ),
                  )

              return shell


          def owner_for_offset(
              files: list[SourceFile],
              byte_offset: int,
              cursor_hint: int,
          ) -> tuple[int, int, int]:
              index = max(
                  0,
                  min(
                      cursor_hint,
                      len(files) - 1,
                  ),
              )

              while (
                  index + 1 < len(files)
                  and byte_offset
                  >= (
                      files[index].packet_offset
                      + len(files[index].raw)
                  )
              ):
                  index += 1

              file = files[index]

              if (
                  file.packet_offset
                  <= byte_offset
                  < (
                      file.packet_offset
                      + len(file.raw)
                  )
              ):
                  return (
                      file.id,
                      (
                          byte_offset
                          - file.packet_offset
                      )
                      // max(
                          1,
                          data_bytes_per_block(
                              "P2"
                          ),
                      ),
                      index,
                  )

              return (
                  -1,
                  byte_offset
                  // max(
                      1,
                      data_bytes_per_block(
                          "P2"
                      ),
                  ),
                  index,
              )


          def make_blocks(
              packet: bytes,
              files: list[SourceFile],
              mode: str,
              packet_sha: str,
          ):
              block_bytes = (
                  data_bytes_per_block(mode)
              )

              total = math.ceil(
                  len(packet) / block_bytes
              )

              if total > DATA_BLOCKS_MAX:
                  raise ManifoldError(
                      f"{total} blocks required; "
                      f"{DATA_BLOCKS_MAX} available"
                  )

              anchors = {
                  file.id: file_anchor(
                      file,
                      len(files),
                  )
                  for file in files
              }

              blocks: list[DataBlock] = []
              cursor_hint = 0
              packet_sha_bytes = bytes.fromhex(
                  packet_sha
              )

              for index in range(total):
                  start = index * block_bytes

                  payload = packet[
                      start:
                      start + block_bytes
                  ]

                  digest = hashlib.sha256(
                      packet_sha_bytes
                      + index.to_bytes(
                          4,
                          "big",
                      )
                      + payload
                  ).digest()

                  (
                      owner,
                      owner_chunk,
                      cursor_hint,
                  ) = owner_for_offset(
                      files,
                      start,
                      cursor_hint,
                  )

                  anchor_x, anchor_y = (
                      anchors.get(
                          owner,
                          (0.0, 0.0),
                      )
                  )

                  shell = golden_shell(
                      owner_chunk + 1
                  )

                  phase = (
                      2.0
                      * math.pi
                      * digest[5]
                      / 255.0
                  )

                  radial = (
                      0.025 * shell
                      + 0.014 * owner_chunk
                  )

                  orientation = int(
                      (
                          index
                          * int(
                              PHI
                              * (1 << 36)
                          )
                          + (owner + 2)
                          * int(
                              GOLDEN_N
                              * (1 << 32)
                          )
                          + int(
                              GOLDEN_ANGLE
                              * (1 << 40)
                          )
                      )
                      >> 11
                  ) & 3

                  blocks.append(
                      DataBlock(
                          index=index,
                          byte_start=start,
                          payload=payload,
                          digest=digest,
                          owner_file=owner,
                          owner_chunk=(
                              owner_chunk
                          ),
                          orientation=(
                              orientation
                          ),
                          target_x=(
                              anchor_x
                              + radial
                              * math.cos(
                                  GOLDEN_ANGLE
                                  * (
                                      owner_chunk + 1
                                  )
                                  + phase
                              )
                          ),
                          target_y=(
                              anchor_y
                              + radial
                              * math.sin(
                                  GOLDEN_ANGLE
                                  * GOLDEN_N
                                  * (
                                      owner_chunk + 1
                                  )
                                  + phase
                              )
                          ),
                      )
                  )

              return blocks


          def slot_geometry(slot: int):
              row, column = divmod(
                  slot,
                  GRID_COLUMNS,
              )

              left = (
                  LEFT_MARGIN
                  + column * PITCH
                  + (
                      PITCH - BLOCK_SIZE
                  )
                  // 2
              )

              top = (
                  TOP_MARGIN
                  + row * PITCH
                  + (
                      PITCH - BLOCK_SIZE
                  )
                  // 2
              )

              return (
                  left + BLOCK_SIZE // 2,
                  top + BLOCK_SIZE // 2,
                  left,
                  top,
              )


          def assign_slots(
              blocks: list[DataBlock],
          ):
              free = [
                  slot
                  for slot in range(
                      TOTAL_SLOTS
                  )
                  if slot
                  not in CALIBRATION_SLOTS
              ]

              placements = {}

              geometries = {
                  slot: slot_geometry(slot)
                  for slot in free
              }

              for block in sorted(
                  blocks,
                  key=lambda item: (
                      math.hypot(
                          item.target_x,
                          item.target_y,
                      ),
                      item.index,
                  ),
              ):
                  pixel_x = (
                      WIDTH / 2
                      + block.target_x
                      * WIDTH
                      * 0.82
                  )

                  pixel_y = (
                      HEIGHT / 2
                      + block.target_y
                      * HEIGHT
                      * 0.82
                  )

                  best = min(
                      free,
                      key=lambda slot: (
                          geometries[slot][0]
                          - pixel_x
                      )
                      ** 2
                      + (
                          geometries[slot][1]
                          - pixel_y
                      )
                      ** 2,
                  )

                  free.remove(best)

                  block.slot = best

                  placements[
                      block.index
                  ] = geometries[best]

              return placements


          def map_byte(values):
              return (
                  np.asarray(
                      values,
                      dtype=np.uint16,
                  )
                  * AFFINE_MULTIPLIER
                  + AFFINE_OFFSET
              ).astype(np.uint8)


          def unmap_byte(values):
              return (
                  (
                      np.asarray(
                          values,
                          dtype=np.int16,
                      )
                      - AFFINE_OFFSET
                  )
                  * AFFINE_INVERSE
                  % 256
              ).astype(np.uint8)


          def pair_to_rgb(
              first,
              second,
          ):
              first_u8 = np.asarray(
                  first,
                  dtype=np.uint8,
              )

              second_u8 = np.asarray(
                  second,
                  dtype=np.uint8,
              )

              parity = np.bitwise_xor(
                  np.bitwise_xor(
                      first_u8,
                      second_u8,
                  ),
                  np.uint8(PARITY_XOR),
              )

              return np.stack(
                  (
                      map_byte(first_u8),
                      map_byte(second_u8),
                      map_byte(parity),
                  ),
                  axis=-1,
              ).astype(np.uint8)


          def rgb_to_pair(rgb):
              decoded = unmap_byte(
                  np.asarray(
                      rgb,
                      dtype=np.uint8,
                  )
              )

              first = decoded[..., 0]
              second = decoded[..., 1]

              expected = np.bitwise_xor(
                  np.bitwise_xor(
                      first,
                      second,
                  ),
                  np.uint8(PARITY_XOR),
              )

              return (
                  first,
                  second,
                  expected == decoded[..., 2],
              )


          def header_bytes(
              text: str,
          ) -> bytes:
              raw = text.encode("ascii")

              calibration = (
                  bytes(range(32))
                  + bytes(
                      255 - index
                      for index in range(32)
                  )
              )

              output = (
                  raw
                  + b"\x00"
                  + calibration
              )

              if (
                  len(output)
                  > HEADER_BYTE_CAPACITY
              ):
                  raise ManifoldError(
                      "header too long: "
                      f"{len(output)} > "
                      f"{HEADER_BYTE_CAPACITY}"
                  )

              repeats = (
                  HEADER_BYTE_CAPACITY
                  - len(output)
                  + len(calibration)
                  - 1
              ) // len(calibration)

              return (
                  output
                  + calibration * repeats
              )[:HEADER_BYTE_CAPACITY]


          def render_header(
              array: np.ndarray,
              text: str,
          ) -> None:
              pairs = np.frombuffer(
                  header_bytes(text),
                  dtype=np.uint8,
              ).reshape(
                  HEADER_ROWS,
                  HEADER_COLUMNS,
                  2,
              )

              colors = pair_to_rgb(
                  pairs[..., 0],
                  pairs[..., 1],
              )

              tiles = np.empty(
                  (
                      HEADER_ROWS,
                      HEADER_COLUMNS,
                      HEADER_CELL,
                      HEADER_CELL,
                      3,
                  ),
                  dtype=np.uint8,
              )

              tiles[...] = (
                  255 - colors
              )[:, :, None, None, :]

              tiles[
                  :,
                  :,
                  1:3,
                  1:3,
                  :,
              ] = colors[
                  :,
                  :,
                  None,
                  None,
                  :,
              ]

              array[
                  HEADER_Y:
                  HEADER_Y
                  + HEADER_ROWS
                  * HEADER_CELL,
                  HEADER_X:
                  HEADER_X
                  + HEADER_COLUMNS
                  * HEADER_CELL,
              ] = (
                  tiles
                  .transpose(
                      0,
                      2,
                      1,
                      3,
                      4,
                  )
                  .reshape(
                      HEADER_ROWS
                      * HEADER_CELL,
                      HEADER_COLUMNS
                      * HEADER_CELL,
                      3,
                  )
              )


          def payload_pairs(
              payload: bytes,
              width: int,
              height: int,
              seed: bytes,
          ):
              required = (
                  width * height * 2
              )

              if len(payload) >= required:
                  raw = payload[:required]
              else:
                  missing = (
                      required - len(payload)
                  )

                  filler = bytearray()
                  counter = 0

                  while len(filler) < missing:
                      filler.extend(
                          hashlib.sha256(
                              seed
                              + counter.to_bytes(
                                  4,
                                  "big",
                              )
                          ).digest()
                      )
                      counter += 1

                  raw = (
                      payload
                      + bytes(
                          filler[:missing]
                      )
                  )

              return np.frombuffer(
                  raw,
                  dtype=np.uint8,
              ).reshape(
                  height,
                  width,
                  2,
              )


          def render_payload_matrix(
              pairs: np.ndarray,
              mode: str,
          ):
              data_height, data_width = (
                  pairs.shape[:2]
              )

              primary = pair_to_rgb(
                  pairs[..., 0],
                  pairs[..., 1],
              )

              if mode == "P2":
                  physical = np.zeros(
                      (
                          P2_PHYSICAL_HEIGHT,
                          P2_PHYSICAL_WIDTH,
                          3,
                      ),
                      dtype=np.uint8,
                  )

                  py = np.arange(
                      data_height,
                      dtype=np.int32,
                  )
                  py += py // 16

                  px = np.arange(
                      data_width,
                      dtype=np.int32,
                  )
                  px += px // 16

                  physical[
                      py[:, None],
                      px[None, :],
                  ] = primary

                  group_rows = (
                      data_height // 16
                  )

                  group_columns = (
                      data_width // 16
                  )

                  parity_y = (
                      np.arange(
                          group_rows,
                          dtype=np.int32,
                      )
                      * 17
                      + 16
                  )

                  parity_x = (
                      np.arange(
                          group_columns,
                          dtype=np.int32,
                      )
                      * 17
                      + 16
                  )

                  row_parity = (
                      np.bitwise_xor.reduce(
                          pairs.reshape(
                              group_rows,
                              16,
                              data_width,
                              2,
                          ),
                          axis=1,
                      )
                  )

                  physical[
                      parity_y[:, None],
                      px[None, :],
                  ] = (
                      255
                      - pair_to_rgb(
                          row_parity[..., 0],
                          row_parity[..., 1],
                      )
                  )

                  column_parity = (
                      np.bitwise_xor.reduce(
                          pairs.reshape(
                              data_height,
                              group_columns,
                              16,
                              2,
                          ),
                          axis=2,
                      )
                  )

                  physical[
                      py[:, None],
                      parity_x[None, :],
                  ] = (
                      255
                      - pair_to_rgb(
                          column_parity[
                              ...,
                              0,
                          ],
                          column_parity[
                              ...,
                              1,
                          ],
                      )
                  )

                  square_groups = (
                      pairs.reshape(
                          group_rows,
                          16,
                          group_columns,
                          16,
                          2,
                      )
                  )

                  square_parity = (
                      np.bitwise_xor.reduce(
                          np.bitwise_xor.reduce(
                              square_groups,
                              axis=1,
                          ),
                          axis=2,
                      )
                  )

                  physical[
                      parity_y[:, None],
                      parity_x[None, :],
                  ] = (
                      255
                      - pair_to_rgb(
                          square_parity[..., 0],
                          square_parity[..., 1],
                      )
                  )

                  return physical

              if mode == "PR":
                  physical = np.zeros(
                      (
                          PR_PHYSICAL_HEIGHT,
                          PR_PHYSICAL_WIDTH,
                          3,
                      ),
                      dtype=np.uint8,
                  )

                  py = np.arange(
                      data_height,
                      dtype=np.int32,
                  )
                  py += py // 16

                  physical[py] = primary

                  group_rows = (
                      data_height // 16
                  )

                  parity_y = (
                      np.arange(
                          group_rows,
                          dtype=np.int32,
                      )
                      * 17
                      + 16
                  )

                  row_parity = (
                      np.bitwise_xor.reduce(
                          pairs.reshape(
                              group_rows,
                              16,
                              data_width,
                              2,
                          ),
                          axis=1,
                      )
                  )

                  physical[parity_y] = (
                      255
                      - pair_to_rgb(
                          row_parity[..., 0],
                          row_parity[..., 1],
                      )
                  )

                  return physical

              if mode == "P0":
                  return primary

              raise ValueError(mode)


          def render_block(
              header: str,
              payload: bytes,
              mode: str,
              orientation: int,
              seed: bytes,
          ):
              array = np.zeros(
                  (
                      BLOCK_SIZE,
                      BLOCK_SIZE,
                      3,
                  ),
                  dtype=np.uint8,
              )

              array[:] = (
                  8,
                  12,
                  20,
              )

              render_header(
                  array,
                  header,
              )

              (
                  data_width,
                  data_height,
                  physical_width,
                  physical_height,
                  data_x,
                  data_y,
              ) = mode_dimensions(mode)

              matrix = render_payload_matrix(
                  payload_pairs(
                      payload,
                      data_width,
                      data_height,
                      seed,
                  ),
                  mode,
              )

              array[
                  data_y:
                  data_y + physical_height,
                  data_x:
                  data_x + physical_width,
              ] = matrix

              anchors = (
                  (
                      pair_to_rgb(
                          np.uint8(0x00),
                          np.uint8(0xFF),
                      ),
                      0,
                      0,
                  ),
                  (
                      pair_to_rgb(
                          np.uint8(0x55),
                          np.uint8(0xAA),
                      ),
                      BLOCK_SIZE - 6,
                      0,
                  ),
                  (
                      pair_to_rgb(
                          np.uint8(0x33),
                          np.uint8(0xCC),
                      ),
                      0,
                      BLOCK_SIZE - 6,
                  ),
                  (
                      pair_to_rgb(
                          np.uint8(0x0F),
                          np.uint8(0xF0),
                      ),
                      BLOCK_SIZE - 6,
                      BLOCK_SIZE - 6,
                  ),
              )

              for color, left, top in anchors:
                  array[
                      top:top + 6,
                      left:left + 6,
                  ] = color

              if orientation:
                  array = np.rot90(
                      array,
                      k=orientation,
                  )

              return np.ascontiguousarray(
                  array
              )


          def calibration_payload(
              kind: int,
              mode: str,
          ) -> bytes:
              width, height, *_ = (
                  mode_dimensions(mode)
              )

              count = width * height

              pairs = np.zeros(
                  (
                      height,
                      width,
                      2,
                  ),
                  dtype=np.uint8,
              )

              if kind == 0:
                  pairs[..., 0] = (
                      np.arange(
                          count,
                          dtype=np.uint32,
                      )
                      & 0xFF
                  ).astype(
                      np.uint8
                  ).reshape(
                      height,
                      width,
                  )

              elif kind == 1:
                  pairs[..., 1] = (
                      np.arange(
                          count,
                          dtype=np.uint32,
                      )
                      & 0xFF
                  ).astype(
                      np.uint8
                  ).reshape(
                      height,
                      width,
                  )

              elif kind == 2:
                  sequence = (
                      b"DREAM4D8\n"
                      b"0123456789ABCDEF\n"
                      b"{}[]()<>+-=*/&|!?:;,.`'\"_$\n"
                  )

                  return (
                      sequence
                      * (
                          (
                              count * 2
                              + len(sequence)
                              - 1
                          )
                          // len(sequence)
                      )
                  )[:count * 2]

              else:
                  x = np.arange(
                      width,
                      dtype=np.uint16,
                  )[None, :]

                  y = np.arange(
                      height,
                      dtype=np.uint16,
                  )[:, None]

                  pairs[..., 0] = (
                      (
                          x * 17 + y
                      )
                      & 0xFF
                  ).astype(np.uint8)

                  pairs[..., 1] = (
                      (
                          y * 29 + x
                      )
                      & 0xFF
                  ).astype(np.uint8)

              return pairs.tobytes()


          def calibration_block(
              kind: int,
              mode: str,
              packet_sha: str,
          ):
              header = (
                  f"D4CAL8|K={kind}|M={mode}|"
                  "A=197,101,13|X=A5|"
                  "PAIR=R:first,G:second,"
                  "B:first^second^A5|"
                  f"S={packet_sha[:16]}|"
              )

              return render_block(
                  header,
                  calibration_payload(
                      kind,
                      mode,
                  ),
                  mode,
                  kind % 4,
                  bytes.fromhex(packet_sha)
                  + bytes([kind]),
              )


          def block_header(
              block: DataBlock,
              total: int,
              mode: str,
              packet_length: int,
              packet_sha: str,
          ):
              crc = (
                  zlib.crc32(block.payload)
                  & 0xFFFFFFFF
              )

              return (
                  f"D4AI8|I={block.index:06X}|"
                  f"T={total:06X}|"
                  f"M={mode}|"
                  f"B={block.byte_start:010X}|"
                  f"N={len(block.payload):06X}|"
                  f"F={block.owner_file + 1:06X}|"
                  f"C={block.owner_chunk:06X}|"
                  f"O={block.orientation}|"
                  f"R={crc:08X}|"
                  f"P={packet_length:010X}|"
                  f"S={packet_sha[:16]}|"
              )


          def extension_walsh(
              files: list[SourceFile],
          ):
              counts = [0] * 16

              for file in files:
                  suffix = (
                      PurePosixPath(file.path)
                      .suffix
                      .lower()
                  )

                  bucket = (
                      hashlib.sha256(
                          suffix.encode("utf-8")
                      ).digest()[0]
                      & 15
                  )

                  counts[bucket] += 1

              output = counts[:]
              stride = 1

              while stride < 16:
                  for start in range(
                      0,
                      16,
                      2 * stride,
                  ):
                      for offset in range(
                          stride
                      ):
                          a = output[
                              start + offset
                          ]

                          b = output[
                              start
                              + offset
                              + stride
                          ]

                          output[
                              start + offset
                          ] = a + b

                          output[
                              start
                              + offset
                              + stride
                          ] = a - b

                  stride *= 2

              return output


          def lowres_background(
              files: list[SourceFile],
              application_root: str,
          ):
              log(
                  "building low-resolution "
                  "equation field"
              )

              x = np.linspace(
                  -1.0,
                  1.0,
                  LOW_WIDTH,
                  dtype=np.float32,
              )[None, :]

              y = np.linspace(
                  -1.0,
                  1.0,
                  LOW_HEIGHT,
                  dtype=np.float32,
              )[:, None]

              radius = np.sqrt(
                  x * x + y * y
              )

              theta = np.arctan2(
                  y,
                  x,
              )

              digest = hashlib.sha256(
                  application_root.encode("ascii")
              ).digest()

              phases = [
                  np.float32(
                      2.0
                      * math.pi
                      * digest[index]
                      / 255.0
                  )
                  for index in (
                      0,
                      7,
                      13,
                      21,
                  )
              ]

              walsh = extension_walsh(files)

              scale = max(
                  1,
                  max(
                      abs(value)
                      for value
                      in walsh[1:] or [1]
                  ),
              )

              sectors = np.mod(
                  np.floor(
                      (
                          theta
                          + np.float32(math.pi)
                      )
                      / np.float32(
                          2.0
                          * math.pi
                          / 16.0
                      )
                  ).astype(np.int16),
                  16,
              )

              bias = np.asarray(
                  [
                      value / scale
                      for value in walsh
                  ],
                  dtype=np.float32,
              )[sectors]

              x4 = np.cos(
                  theta * np.float32(PHI)
                  + phases[0]
              ) * (
                  np.float32(0.58)
                  + np.float32(0.24)
                  * np.cos(
                      theta
                      * np.float32(GOLDEN_N)
                      + phases[2]
                  )
              )

              y4 = np.sin(
                  theta
                  * np.float32(GOLDEN_N)
                  + phases[1]
              ) * (
                  np.float32(0.58)
                  + np.float32(0.24)
                  * np.sin(
                      theta
                      * np.float32(PHI)
                      + phases[3]
                  )
              )

              z4 = np.cos(
                  radius
                  * np.float32(
                      math.pi * PHI
                  )
                  + phases[2]
              ) * (
                  np.float32(0.46)
                  + np.float32(0.18)
                  * bias
              )

              w4 = np.sin(
                  radius
                  * np.float32(
                      math.pi * GOLDEN_N
                  )
                  + phases[3]
              ) * (
                  np.float32(0.46)
                  + np.float32(0.18)
                  * bias
              )

              d4 = np.maximum(
                  np.float32(0.5),
                  np.float32(2.25) - w4,
              )

              x3 = (
                  x4
                  + np.float32(0.30) * z4
              ) / d4

              y3 = (
                  y4
                  + np.float32(0.22) * z4
              ) / d4

              z3 = z4 / d4

              d3 = np.maximum(
                  np.float32(0.6),
                  np.float32(2.35) - z3,
              )

              projection = np.sqrt(
                  (x3 / d3) ** 2
                  + (y3 / d3) ** 2
              )

              ray = (
                  np.float32(0.5)
                  + np.float32(0.5)
                  * np.cos(
                      np.float32(5.0)
                      * theta
                      + phases[0]
                  )
              )

              opposite = (
                  np.float32(0.5)
                  + np.float32(0.5)
                  * np.cos(
                      np.float32(10.0)
                      * theta
                      + phases[1]
                      + radius
                      * np.float32(math.pi)
                  )
              )

              shell = np.exp(
                  np.float32(-3.6)
                  * radius
                  * radius
              )

              ribbon = np.exp(
                  np.float32(-18.0)
                  * np.abs(
                      projection
                      - (
                          np.float32(0.12)
                          + np.float32(0.42)
                          * ray
                      )
                  )
              )

              red = np.clip(
                  5
                  + 46 * shell
                  + 70 * ribbon
                  + 42 * np.maximum(
                      0,
                      bias,
                  ),
                  0,
                  255,
              )

              green = np.clip(
                  8
                  + 52 * opposite
                  + 48 * shell
                  + 30 * np.maximum(
                      0,
                      -bias,
                  ),
                  0,
                  255,
              )

              blue = np.clip(
                  14
                  + 74 * ray
                  + 68 * ribbon
                  + 32 * np.abs(bias),
                  0,
                  255,
              )

              return np.stack(
                  (
                      red,
                      green,
                      blue,
                  ),
                  axis=2,
              ).astype(np.uint8)


          def add_semantic_overlay(
              lowres: np.ndarray,
              files: list[SourceFile],
              blocks: list[DataBlock],
              placements,
          ):
              image = Image.fromarray(
                  lowres,
                  "RGB",
              )

              draw = ImageDraw.Draw(
                  image,
                  "RGBA",
              )

              first_block = {}

              for block in blocks:
                  if (
                      block.owner_file >= 0
                      and block.owner_file
                      not in first_block
                  ):
                      first_block[
                          block.owner_file
                      ] = block

              center = (
                  LOW_WIDTH // 2,
                  LOW_HEIGHT // 2,
              )

              for file in files:
                  block = first_block.get(
                      file.id
                  )

                  if block is None:
                      continue

                  x, y, _, _ = placements[
                      block.index
                  ]

                  x //= LOW_SCALE
                  y //= LOW_SCALE

                  digest = hashlib.sha256(
                      file.path.encode(
                          "utf-8",
                          "surrogateescape",
                      )
                      + bytes.fromhex(
                          file.sha256
                      )
                  ).digest()

                  color = (
                      80 + digest[0] % 176,
                      80 + digest[7] % 176,
                      80 + digest[13] % 176,
                      90,
                  )

                  draw.line(
                      (
                          center[0],
                          center[1],
                          x,
                          y,
                      ),
                      fill=color,
                      width=2,
                  )

              for file in files:
                  source = first_block.get(
                      file.id
                  )

                  if source is None:
                      continue

                  sx, sy, _, _ = placements[
                      source.index
                  ]

                  sx //= LOW_SCALE
                  sy //= LOW_SCALE

                  for target_id in file.imports:
                      target = first_block.get(
                          target_id
                      )

                      if target is None:
                          continue

                      tx, ty, _, _ = placements[
                          target.index
                      ]

                      tx //= LOW_SCALE
                      ty //= LOW_SCALE

                      draw.line(
                          (
                              sx,
                              sy,
                              tx,
                              ty,
                          ),
                          fill=(
                              160,
                              200,
                              255,
                              42,
                          ),
                          width=1,
                      )

              return np.asarray(
                  image,
                  dtype=np.uint8,
              )


          def create_canvas(
              lowres: np.ndarray,
              memmap_path: Path,
          ):
              log(
                  "expanding equation field into "
                  "disk-backed 24 MP canvas"
              )

              canvas = np.memmap(
                  memmap_path,
                  dtype=np.uint8,
                  mode="w+",
                  shape=(
                      HEIGHT,
                      WIDTH,
                      3,
                  ),
              )

              for low_row in range(
                  LOW_HEIGHT
              ):
                  expanded = np.repeat(
                      lowres[low_row],
                      LOW_SCALE,
                      axis=0,
                  )

                  start = (
                      low_row * LOW_SCALE
                  )

                  canvas[
                      start:
                      start + LOW_SCALE
                  ] = expanded[
                      None,
                      :,
                      :,
                  ]

                  if low_row % 250 == 0:
                      log(
                          "expanded background "
                          f"row group {low_row}/"
                          f"{LOW_HEIGHT}"
                      )

              canvas.flush()

              return canvas


          def border_semantics(
              block_array: np.ndarray,
              file: SourceFile | None,
          ):
              histogram = (
                  file.token_histogram
                  if file
                  else {
                      key: 1
                      for key in (
                          "identifier",
                          "quote",
                          "operator",
                          "delimiter",
                          "number",
                          "whitespace",
                          "other",
                      )
                  }
              )

              categories = (
                  "identifier",
                  "quote",
                  "operator",
                  "delimiter",
                  "number",
                  "whitespace",
                  "other",
              )

              palette = np.asarray(
                  (
                      (91, 192, 255),
                      (255, 202, 91),
                      (196, 91, 255),
                      (91, 255, 241),
                      (255, 133, 91),
                      (190, 198, 214),
                      (255, 91, 116),
                  ),
                  dtype=np.uint8,
              )

              total = max(
                  1,
                  sum(
                      histogram.get(
                          category,
                          0,
                      )
                      for category
                      in categories
                  ),
              )

              cursor = 6
              usable = BLOCK_SIZE - 12

              for category, color in zip(
                  categories,
                  palette,
              ):
                  length = max(
                      1,
                      int(
                          round(
                              usable
                              * histogram.get(
                                  category,
                                  0,
                              )
                              / total
                          )
                      ),
                  )

                  end = min(
                      BLOCK_SIZE - 6,
                      cursor + length,
                  )

                  block_array[
                      BLOCK_SIZE - 4:
                      BLOCK_SIZE - 1,
                      cursor:end,
                  ] = color

                  cursor = end

                  if cursor >= BLOCK_SIZE - 6:
                      break


          def render_to_memmap(
              canvas: np.memmap,
              files,
              blocks,
              placements,
              mode,
              packet,
              report,
          ):
              files_by_id = {
                  file.id: file
                  for file in files
              }

              log(
                  "rendering four calibration "
                  "blocks"
              )

              for kind, slot in enumerate(
                  CALIBRATION_SLOTS
              ):
                  _, _, left, top = (
                      slot_geometry(slot)
                  )

                  canvas[
                      top:top + BLOCK_SIZE,
                      left:left + BLOCK_SIZE,
                  ] = calibration_block(
                      kind,
                      mode,
                      report["packetSha256"],
                  )

              log(
                  f"rendering {len(blocks)} "
                  "payload blocks"
              )

              for number, block in enumerate(
                  blocks,
                  start=1,
              ):
                  _, _, left, top = (
                      placements[block.index]
                  )

                  rendered = render_block(
                      block_header(
                          block,
                          len(blocks),
                          mode,
                          len(packet),
                          report[
                              "packetSha256"
                          ],
                      ),
                      block.payload,
                      mode,
                      block.orientation,
                      block.digest,
                  )

                  border_semantics(
                      rendered,
                      files_by_id.get(
                          block.owner_file
                      ),
                  )

                  canvas[
                      top:top + BLOCK_SIZE,
                      left:left + BLOCK_SIZE,
                  ] = rendered

                  if (
                      number == 1
                      or number % 20 == 0
                      or number == len(blocks)
                  ):
                      log(
                          "rendered payload block "
                          f"{number}/{len(blocks)}"
                      )

              canvas.flush()


          def save_png(
              canvas: np.memmap,
              output: Path,
          ):
              output.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              log(
                  "writing uncompressed PNG; "
                  "this avoids the previous "
                  "compression stall"
              )

              image = Image.fromarray(
                  np.asarray(canvas),
                  "RGB",
              )

              image.save(
                  output,
                  "PNG",
                  compress_level=0,
                  optimize=False,
              )

              log(
                  f"PNG written: "
                  f"{output.stat().st_size:,} "
                  "bytes"
              )


          def build(
              root: Path,
              output: Path,
              audit: Path,
          ):
              log(
                  "phase 1/8: collecting "
                  "application source"
              )

              files, skipped = collect_sources(
                  root
              )

              log(
                  "phase 2/8: assembling exact "
                  "packet"
              )

              (
                  mode,
                  packet,
                  report,
              ) = choose_mode(files)

              blocks = make_blocks(
                  packet,
                  files,
                  mode,
                  report["packetSha256"],
              )

              placements = assign_slots(
                  blocks
              )

              log(
                  f"phase 3/8: prepared "
                  f"{len(blocks)} blocks in "
                  f"{mode} mode"
              )

              lowres = lowres_background(
                  files,
                  report["applicationRoot"],
              )

              lowres = add_semantic_overlay(
                  lowres,
                  files,
                  blocks,
                  placements,
              )

              log(
                  "phase 4/8: low-resolution "
                  "manifold field complete"
              )

              with tempfile.TemporaryDirectory(
                  prefix="dream-v8-"
              ) as temporary:
                  memmap_path = (
                      Path(temporary)
                      / "canvas.rgb"
                  )

                  canvas = create_canvas(
                      lowres,
                      memmap_path,
                  )

                  log(
                      "phase 5/8: 24 MP canvas "
                      "complete"
                  )

                  render_to_memmap(
                      canvas,
                      files,
                      blocks,
                      placements,
                      mode,
                      packet,
                      report,
                  )

                  log(
                      "phase 6/8: all visual "
                      "blocks complete"
                  )

                  save_png(
                      canvas,
                      output,
                  )

                  del canvas

              log(
                  "phase 7/8: writing audit "
                  "report"
              )

              result = {
                  "artifact": str(output),
                  "width": WIDTH,
                  "height": HEIGHT,
                  "megapixels": (
                      WIDTH
                      * HEIGHT
                      / 1_000_000
                  ),
                  "mode": mode,
                  "includedApplicationFiles": (
                      len(files)
                  ),
                  "excludedTrackedFiles": (
                      len(skipped)
                  ),
                  "packetBytes": len(packet),
                  "capacityBytes": (
                      capacity_bytes(mode)
                  ),
                  "dataBlocks": len(blocks),
                  "applicationRoot": (
                      report["applicationRoot"]
                  ),
                  "packetSha256": (
                      report["packetSha256"]
                  ),
                  "included": [
                      file.path
                      for file in files
                  ],
                  "excluded": skipped,
              }

              audit.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              audit.write_text(
                  json.dumps(
                      result,
                      indent=2,
                      sort_keys=True,
                  ),
                  encoding="utf-8",
              )

              log(
                  "phase 8/8: build complete"
              )

              return result


          def decode_header_from_block(
              block: Image.Image,
          ):
              array = np.asarray(
                  block.convert("RGB"),
                  dtype=np.uint8,
              )

              pairs = []

              for row in range(
                  HEADER_ROWS
              ):
                  for column in range(
                      HEADER_COLUMNS
                  ):
                      x = (
                          HEADER_X
                          + column
                          * HEADER_CELL
                          + 2
                      )

                      y = (
                          HEADER_Y
                          + row
                          * HEADER_CELL
                          + 2
                      )

                      (
                          first,
                          second,
                          valid,
                      ) = rgb_to_pair(
                          array[y, x]
                      )

                      if not bool(valid):
                          return None

                      pairs.extend(
                          (
                              int(first),
                              int(second),
                          )
                      )

              return (
                  bytes(pairs)
                  .split(b"\x00", 1)[0]
                  .decode(
                      "ascii",
                      "ignore",
                  )
              )


          def parse_header(text: str):
              parts = text.split("|")

              output = {
                  "magic": (
                      parts[0]
                      if parts
                      else ""
                  )
              }

              for part in parts[1:]:
                  if "=" in part:
                      key, value = part.split(
                          "=",
                          1,
                      )
                      output[key] = value

              return output


          def canonical_block(
              block: Image.Image,
          ):
              candidates = [
                  block,
                  block.transpose(
                      Image.Transpose.ROTATE_90
                  ),
                  block.transpose(
                      Image.Transpose.ROTATE_180
                  ),
                  block.transpose(
                      Image.Transpose.ROTATE_270
                  ),
              ]

              for candidate in candidates:
                  text = decode_header_from_block(
                      candidate
                  )

                  if (
                      text
                      and (
                          text.startswith(
                              "D4AI8|"
                          )
                          or text.startswith(
                              "D4CAL8|"
                          )
                      )
                  ):
                      return (
                          candidate,
                          parse_header(text),
                      )

              return None


          def decode_payload(
              block: Image.Image,
              mode: str,
              byte_count: int,
          ):
              array = np.asarray(
                  block.convert("RGB"),
                  dtype=np.uint8,
              )

              (
                  data_width,
                  data_height,
                  _,
                  _,
                  data_x,
                  data_y,
              ) = mode_dimensions(mode)

              py = np.arange(
                  data_height,
                  dtype=np.int32,
              )

              if mode in {
                  "P2",
                  "PR",
              }:
                  py += py // 16

              px = np.arange(
                  data_width,
                  dtype=np.int32,
              )

              if mode == "P2":
                  px += px // 16

              rgb = array[
                  data_y + py[:, None],
                  data_x + px[None, :],
              ]

              (
                  first,
                  second,
                  valid,
              ) = rgb_to_pair(rgb)

              if not bool(np.all(valid)):
                  raise ManifoldError(
                      "payload pixel parity failed"
                  )

              return (
                  np.stack(
                      (
                          first,
                          second,
                      ),
                      axis=-1,
                  )
                  .astype(
                      np.uint8,
                      copy=False,
                  )
                  .tobytes()
              )[:byte_count]


          def verify(image_path: Path):
              log(
                  "opening PNG for image-only "
                  "reconstruction"
              )

              image = Image.open(
                  image_path
              ).convert("RGB")

              headers = []

              for slot in range(
                  TOTAL_SLOTS
              ):
                  _, _, left, top = (
                      slot_geometry(slot)
                  )

                  found = canonical_block(
                      image.crop(
                          (
                              left,
                              top,
                              left + BLOCK_SIZE,
                              top + BLOCK_SIZE,
                          )
                      )
                  )

                  if found is None:
                      continue

                  block, header = found

                  if (
                      header.get("magic")
                      == "D4AI8"
                  ):
                      headers.append(
                          (
                              block,
                              header,
                          )
                      )

              if not headers:
                  raise ManifoldError(
                      "no payload blocks found"
                  )

              headers.sort(
                  key=lambda item: int(
                      item[1]["I"],
                      16,
                  )
              )

              packet_length = int(
                  headers[0][1]["P"],
                  16,
              )

              mode = headers[0][1]["M"]

              packet = bytearray()

              for number, (
                  block,
                  header,
              ) in enumerate(
                  headers,
                  start=1,
              ):
                  payload = decode_payload(
                      block,
                      mode,
                      int(
                          header["N"],
                          16,
                      ),
                  )

                  if (
                      zlib.crc32(payload)
                      & 0xFFFFFFFF
                      != int(
                          header["R"],
                          16,
                      )
                  ):
                      raise ManifoldError(
                          "CRC failed for block "
                          f"{header['I']}"
                      )

                  packet.extend(payload)

                  if number % 50 == 0:
                      log(
                          f"decoded {number}/"
                          f"{len(headers)} blocks"
                      )

              packet = packet[:packet_length]

              (
                  magic,
                  manifest_length,
              ) = PACKET_PREFIX.unpack(
                  packet[
                      :PACKET_PREFIX.size
                  ]
              )

              if magic != PACKET_MAGIC:
                  raise ManifoldError(
                      "packet magic mismatch"
                  )

              manifest_start = (
                  PACKET_PREFIX.size
              )

              manifest_end = (
                  manifest_start
                  + manifest_length
              )

              manifest = json.loads(
                  packet[
                      manifest_start:
                      manifest_end
                  ].decode(
                      "utf-8",
                      "surrogatepass",
                  )
              )

              for file in manifest["files"]:
                  start = int(
                      file["packetOffset"]
                  )

                  raw = bytes(
                      packet[
                          start:
                          start
                          + int(
                              file["length"]
                          )
                      ]
                  )

                  if (
                      sha256_hex(raw)
                      != file["sha256"]
                  ):
                      raise ManifoldError(
                          "file hash mismatch: "
                          f"{file['path']}"
                      )

              log(
                  f"verified "
                  f"{len(manifest['files'])} "
                  "exact application files"
              )

              return {
                  "verified": True,
                  "files": len(
                      manifest["files"]
                  ),
                  "packetBytes": len(packet),
                  "mode": mode,
              }


          def main():
              parser = argparse.ArgumentParser()

              subparsers = (
                  parser.add_subparsers(
                      dest="command",
                      required=True,
                  )
              )

              build_parser = (
                  subparsers.add_parser(
                      "build"
                  )
              )

              build_parser.add_argument(
                  "--root",
                  type=Path,
                  required=True,
              )

              build_parser.add_argument(
                  "--output",
                  type=Path,
                  required=True,
              )

              build_parser.add_argument(
                  "--audit",
                  type=Path,
                  required=True,
              )

              verify_parser = (
                  subparsers.add_parser(
                      "verify"
                  )
              )

              verify_parser.add_argument(
                  "--image",
                  type=Path,
                  required=True,
              )

              args = parser.parse_args()

              if args.command == "build":
                  result = build(
                      args.root.resolve(),
                      args.output.resolve(),
                      args.audit.resolve(),
                  )
              else:
                  result = verify(
                      args.image.resolve()
                  )

              print(
                  json.dumps(
                      result,
                      indent=2,
                      sort_keys=True,
                  )
              )


          if __name__ == "__main__":
              main()

          PY

          python -m py_compile \
            "$RUNNER_TEMP/build_dream_v8.py"

      - name: Build the 24 MP manifold PNG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            "$GITHUB_WORKSPACE/dream-ai-native-v8-output"

          mkdir -p \
            "$GITHUB_WORKSPACE/dream-ai-native-v8-output"

          python \
            "$RUNNER_TEMP/build_dream_v8.py" \
            build \
            --root "$GITHUB_WORKSPACE" \
            --output \
              "$GITHUB_WORKSPACE/dream-ai-native-v8-output/DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD.png" \
            --audit \
              "$GITHUB_WORKSPACE/dream-ai-native-v8-output/DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD_AUDIT.json" \
            | tee \
              "$RUNNER_TEMP/dream-ai-native-v8-build.json"

      - name: Prove image-only exact reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python \
            "$RUNNER_TEMP/build_dream_v8.py" \
            verify \
            --image \
              "$GITHUB_WORKSPACE/dream-ai-native-v8-output/DREAM_AI_NATIVE_4D_RGB_CMY_APPLICATION_MANIFOLD.png" \
            | tee \
              "$RUNNER_TEMP/dream-ai-native-v8-verify.json"

      - name: Verify PNG dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from PIL import Image

          path = Path(
              "dream-ai-native-v8-output/"
              "DREAM_AI_NATIVE_4D_RGB_CMY_"
              "APPLICATION_MANIFOLD.png"
          )

          with Image.open(path) as image:
              if image.size != (
                  4284,
                  5712,
              ):
                  raise SystemExit(
                      "unexpected dimensions: "
                      f"{image.size}"
                  )

              image.verify()

          print("PNG_OK 4284x5712")
          PY

