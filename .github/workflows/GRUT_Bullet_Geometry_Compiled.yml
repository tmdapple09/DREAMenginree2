          def propagate_jacobi(g,potential,sheet_density,ray_xy=None,reverse=False):
              # Observer distance D_l; local proper distances across the cube. The
              # original archive's D_ls/D_s=1 convention is the far-source limit.
              # J and B are derivatives of ray position and slope w.r.t. reference-plane
              # coordinates. Kicks and drifts integrate the actual Jacobi tangent map.
              if ray_xy is None:
                  xx,yy=np.meshgrid(g.x,g.x,indexing='ij'); ray_xy=np.stack((xx,yy),axis=-1)
              ray_xy=np.asarray(ray_xy,dtype=float); I=np.eye(2)
              d0=DL-g.L/2
