          def apmean(a,g,c,R=AP):
              dx=g.wrap(g.x[:,None]-c[0]);dy=g.wrap(g.x[None,:]-c[1]);r2=dx*dx+dy*dy
              # subpixel aperture coverage at 4x4 quadrature
              w=np.zeros_like(a)
              for i in (-.375,-.125,.125,.375):
                  for j in (-.375,-.125,.125,.375):w+=((dx+i*g.h)**2+(dy+j*g.h)**2<R*R)/16
              return float(np.sum(w*a)/max(w.sum(),1e-30))

          def aperture_kernel(R=AP,sigma=SMOOTH):
              # Gaussian PSF integrated over the circular aperture (Rice CDF), using
              # I0 for the azimuthal integral. The tail beyond R+8 sigma is negligible.
              dist=np.linspace(0,R+8*sigma,4097);u,w=np.polynomial.legendre.leggauss(48)
              r=.5*R*(u+1);wt=.5*R*w*r/sigma**2
              z=dist[:,None]*r[None,:]/sigma**2
              val=np.exp(-(dist[:,None]**2+r[None,:]**2)/(2*sigma**2))*np.i0(z)@wt
              return dist,val
          AP_KERNEL=aperture_kernel()
          def direct_aperture(g,c,x,m,gas_column=None,uniform_column=0.):
              dist,val=AP_KERNEL
              d=np.linalg.norm(g.wrap(x[:,:2]-c[:2]),axis=1)
              total=float(np.dot(m,np.interp(d,dist,val,right=0.)))
              if gas_column is not None:
                  dx=g.wrap(g.x[:,None]-c[0]);dy=g.wrap(g.x[None,:]-c[1]);weights=np.zeros_like(gas_column)
                  # Cell-averaged gas, integrated by subcell quadrature. Particles use
                  # their actual positions, not their coarse gravitational mesh shapes.
                  for a in (-.375,-.125,.125,.375):
                      for b in (-.375,-.125,.125,.375):
                          r=np.sqrt((dx+a*g.h)**2+(dy+b*g.h)**2)
                          weights+=np.interp(r,dist,val,right=0.)/16
                  total+=float(np.sum(weights*gas_column)*g.h**2)
              return total/(np.pi*AP**2*SIGCRIT)-uniform_column/SIGCRIT

          def moments(g,x,v,m,U):
              # Paper 09 N(n)=E-2M.n+n.P.n. SR particle weights on coordinate time slice;
              # gas nonrelativistic ideal-fluid expansion through O(v^2/c^2,p/rho c^2).
              r,vg,p=primitive(U); speed2=np.sum(v*v,axis=1)/C**2
              if np.max(speed2)>=.01: raise RuntimeError('Weak-field velocity regime exceeded')
              lor=1/np.sqrt(1-speed2); e=g.deposit(x,m*lor)+r+(U[4]/C**2)
              M=[]; P=[]; cov=[]
