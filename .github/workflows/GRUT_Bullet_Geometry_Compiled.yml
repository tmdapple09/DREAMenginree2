                  h=np.fft.rfftn(r);h*=g.inv[:,:,:g.n//2+1];return np.fft.irfftn(h,s=g.shape,axes=(0,1,2))
              target=4*np.pi*G*g.supported(b); tnorm=np.linalg.norm(target.ravel())
              if tnorm==0:return np.zeros(g.shape),dict(converged=True,relative_residual=0.,iterations=0,signed_positive_mass=0.,signed_negative_mass=0.)
              phi=-invlap(target) if initial is None else initial.copy()
              def residual(phi):
                  grad=g.gradient(phi);load=np.linalg.norm(grad,axis=-1)/AC;mu,dmu=constitutive(load); del dmu,load
                  grad*=mu[...,None];return g.div(grad)-target
              r=residual(phi);err=float(np.linalg.norm(r.ravel())/tnorm)
              it=0
              while err>tol and it<maxiter:
                  grad=g.gradient(phi);load=np.linalg.norm(grad,axis=-1)/AC;mu,dmu=constitutive(load)
                  grad*=np.divide(1.,AC*load,out=np.zeros_like(load),where=load>0)[...,None];del load
                  # K=mu I+(dmu/d ln x) n n^T. Small regularizer only in the
                  # Newton search direction, never in the actual constitutive residual.
                  reg=max(1e-9,1e-5*float(np.mean(mu)))
                  def op(q):
                      d=g.gradient(q);dot=np.sum(d*grad,axis=-1);d*=(mu+reg)[...,None];d+=grad*(dmu*dot)[...,None];return -g.div(d)
                  delta=np.zeros_like(phi);rr=r.copy();zz=invlap(rr);direction=zz.copy();rz=float(np.vdot(rr,zz));r0=np.linalg.norm(rr.ravel())
                  cg_tol=min(.1,max(1e-4,.2*err))
                  for inner in range(60):
                      Ad=op(direction);den=float(np.vdot(direction,Ad))
                      if den<=0 or rz<=0:break
                      alpha=rz/den;delta+=alpha*direction;rr-=alpha*Ad;del Ad
                      if np.linalg.norm(rr.ravel())<=cg_tol*r0:break
                      zz=invlap(rr);new=float(np.vdot(rr,zz));direction*=new/rz;direction+=zz;rz=new
                  del rr,zz,direction,grad,mu,dmu
