              J=np.broadcast_to((d0/DL)*I,ray_xy.shape[:-1]+(2,2)).copy()
              B=np.broadcast_to(I/DL,J.shape).copy()
              born=np.broadcast_to(I,J.shape).copy()
              order=range(g.n-1,-1,-1) if reverse else range(g.n)
              for idx,j in enumerate(order):
                  pos+=.5*g.h*slope; J+=.5*g.h*B
                  grad,H=cubic_potential_derivatives(g,potential[:,:,j],pos)
                  coefficient=2*g.h/C**2
                  # Restore absolute mean column using the explicit sheet convention.
                  # The sheet is not an extra energy or a local periodic metric mode.
                  sheet=4*np.pi*G*g.h*sheet_density[j]/C**2
                  slope-=coefficient*grad+sheet*pos
                  B-=(coefficient*H+sheet*I)@J
                  d=DL-g.L/2+(idx+.5)*g.h
                  _,Hb=cubic_potential_derivatives(g,potential[:,:,j],ray_xy*(d/DL))
                  born-=d*(coefficient*Hb+sheet*I)
                  pos+=.5*g.h*slope; J+=.5*g.h*B
              return DL*B,DL*slope,born


          def jacobi_observables(A):
