              # Check the source equation, not just reconstruction of a projected map.
              h=np.fft.rfftn(phi,axes=(0,1,2)); h*= -g.k2[:,:,:g.n//2+1]
              lap=np.fft.irfftn(h,s=g.shape,axes=(0,1,2)); err=rel(lap,4*np.pi*G*g.supported(rho_null));del lap,h
