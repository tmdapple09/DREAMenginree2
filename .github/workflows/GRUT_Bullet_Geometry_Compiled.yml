                          max_ordered_rotation=float(np.max(abs(rot))),
                          max_order_reversal_kappa_change=float(np.max(abs(kap-kr))),
                          max_ordered_deflection_kpc_equiv=float(np.max(np.linalg.norm(ray-np.stack(np.meshgrid(g.x,g.x,indexing='ij'),axis=-1),axis=-1))))


          def bands(a,g):
              k=2*np.pi*np.fft.fftfreq(g.n,g.h); k2=k[:,None]**2+k[None,:]**2
              ell=np.divide(2*np.pi,np.sqrt(k2),out=np.full_like(k2,np.inf),where=k2>0)
              S=[1/(1+np.exp(-np.clip((np.log(ell)-np.log(t))/.25,-700,700))) for t in (80,160,320,640)]
              W=np.array([1-S[0],S[0]-S[1],S[1]-S[2],S[2]-S[3],S[3]])
              F=np.fft.fft2(a); parts=np.fft.ifft2(W*F,axes=(-2,-1)).real
