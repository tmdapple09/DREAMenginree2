                      -.5*(A[...,0,1]+A[...,1,0]),.5*(A[...,0,1]-A[...,1,0]),
                      A[...,0,0]*A[...,1,1]-A[...,0,1]*A[...,1,0])


          def ordered_optical(g,rho_null):
