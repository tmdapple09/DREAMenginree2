                              signed_negative_mass=float(np.minimum(pol,0).sum()*g.dv))


          def finite_support_endpoint(g,U,x,m,l,table):
              b=g.deposit(x[l!=2],m[l!=2]);b+=U[0]
              pol,meta=nonlinear_support(g,b,table);del b
              budget=float(m[l==2].sum());mean=budget/g.L**3
              pol+=mean # same conserved k=0 allocation as infall; NOT a new mass
              meta.update(captured_budget=budget,endpoint_mass=float(pol.sum()*g.dv),
                          absolute_phase_endpoint_nonnegative=bool(pol.min()>=0.),
                          positive_charge_within_budget=bool(meta['signed_positive_mass']<=budget))
              meta['admissible_positive_phase_endpoint']=bool(meta['converged'] and meta['absolute_phase_endpoint_nonnegative'] and meta['positive_charge_within_budget'] and abs(meta['endpoint_mass']-budget)<=1e-9*max(budget,1e-30))
              return pol,meta

          def renewal_fraction(t,passage):
              return 0. if passage is None else float(-np.expm1(-max(0.,t-passage)/TAU))

          def mixture_current_check(g,r0,r1,s0,s1,f0,f1,dt):
              # Exact discrete product rule for moving endpoints. Each contribution
              # is a continuity current with known divergence; its transverse part is
              # not fixed by the density law. Record the longitudinal reconstruction.
              fb=.5*(f0+f1); df=f1-f0
              delta=(1-fb)*(r1-r0)+fb*(s1-s0)+df*(.5*(s0+s1-r0-r1))
              actual=(1-f1)*r1+f1*s1-((1-f0)*r0+f0*s0)
              scale=max(np.linalg.norm(actual.ravel()),1e-30)
              algebra=float(np.linalg.norm((actual-delta).ravel())/scale)
              # Jhat=+i k delta_rho_hat/k^2/dt => div J=-delta_rho/dt.
              h=np.fft.rfftn(delta/dt);h*=g.inv[:,:,:g.n//2+1]
              divh=np.zeros_like(h)
              for i,k in enumerate(g.k):
                  if i==2:k=k[:,:,:g.n//2+1]
                  jh=1j*k*h;divh+=1j*k*jh
              divj=np.fft.irfftn(divh,s=g.shape,axes=(0,1,2))
              error=float(np.linalg.norm((divj+actual/dt).ravel())/max(scale/dt,1e-30))
              return dict(discrete_product_error=algebra,longitudinal_continuity_error=error,net_mass_change=float(actual.sum()*g.dv))

          def center(g,x,m,label,i,prior):
              pos=x[label==i]; w=m[label==i]; c=prior.copy()
              for rad in (700.,400.,max(180.,1.2*g.h)):
                  d=g.wrap(pos-c); r2=np.sum(d*d,axis=1); weight=w*np.exp(-.5*r2/rad**2)
                  if weight.sum()<1e-12*w.sum():break
                  c=g.wrap(c+(d*weight[:,None]).sum(0)/weight.sum())
              return c

          def smooth2(a,g,s=SMOOTH):
              k=2*np.pi*np.fft.fftfreq(g.n,g.h); k2=k[:,None]**2+k[None,:]**2
              return np.fft.ifft2(np.fft.fft2(a)*np.exp(-s*s*k2/2)).real

          def optical(a):
              # Born thin lens shear / Jacobi amplification, periodic sky, mass-sheet convention.
              n=a.shape[0]; k=2*np.pi*np.fft.fftfreq(n); kx=k[:,None];ky=k[None,:];den=kx*kx+ky*ky
              h=np.fft.fft2(a); inv=np.divide(1.,den,out=np.zeros_like(den),where=den>0)
              s1=np.fft.ifft2((kx*kx-ky*ky)*inv*h).real;s2=np.fft.ifft2(2*kx*ky*inv*h).real
              return s1,s2,(1-a)**2-s1*s1-s2*s2

          # Paper 09 ordered Jacobi propagation and common-action null contraction.
          # Linearized quasi-static harmonic metric: ∇²Φ_n=4πG (T_kk/c²),
          # h_kk=-4Φ_n/c²; paraxial ray kick dθ=-2∇perpΦ_n dz/c².
          # A separate affine sheet restores the chosen absolute-column DC convention;
          # the periodic metric alone does not determine that mode.
          def null_potential(g,rho):
              h=np.fft.rfftn(rho,axes=(0,1,2)); h*=(-4*np.pi*G)*g.inv[:,:,:g.n//2+1]
              return np.fft.irfftn(h,s=g.shape,axes=(0,1,2))


          def cubic_potential_derivatives(g,p,xy):
              # Periodic Catmull–Rom interpolant of the scalar metric potential.
              # First and second derivatives of the SAME polynomial; no independently
              # interpolated Hessian that would fail the tangent-map identity.
              q=(xy+g.L/2)/g.h-.5; i=np.floor(q).astype(np.int64); t=q-i
              def weights(t):
                  t2=t*t; t3=t2*t
                  w=np.array([-.5*t+t2-.5*t3,1-2.5*t2+1.5*t3,.5*t+2*t2-1.5*t3,-.5*t2+.5*t3])
                  d=np.array([-.5+2*t-1.5*t2,-5*t+4.5*t2,.5+4*t-4.5*t2,-t+1.5*t2])/g.h
                  dd=np.array([2-3*t,-5+9*t,4-9*t,-1+3*t])/g.h**2
                  return w,d,dd
              wx,dx,ddx=weights(t[...,0]); wy,dy,ddy=weights(t[...,1]);
              grad=np.zeros_like(xy); H=np.zeros(xy.shape[:-1]+(2,2))
              for a in range(4):
