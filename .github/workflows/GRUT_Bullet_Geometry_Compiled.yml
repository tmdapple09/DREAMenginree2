                  accepted=False
                  for half in range(16):
                      candidate=phi+2.**(-half)*delta;rc=residual(candidate);ec=float(np.linalg.norm(rc.ravel())/tnorm)
                      if ec<err:phi,r,err=candidate,rc,ec;accepted=True;break
