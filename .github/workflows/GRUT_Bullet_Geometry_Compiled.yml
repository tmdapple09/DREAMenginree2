                  pos=np.stack(np.meshgrid(g.x,g.x,g.x,indexing='ij'),axis=-1).reshape(-1,3)
                  v=rng.normal(0,PHASE_SIGMA_KMS*KM,pos.shape); v-=v.mean(0)
                  xp.append(pos);vp.append(v);mp.append(np.full(len(pos),RHO_PHASE*g.dv));labels.append(np.full(len(pos),2,np.int8))
              elif mode=='file':
                  with np.load(PHASE_FILE,allow_pickle=False) as f: pos=np.asarray(f['x'],float); v=np.asarray(f['v'],float)*KM; m=np.asarray(f['mass'],float)
                  if pos.ndim!=2 or pos.shape[1]!=3 or v.shape!=pos.shape or m.shape!=(len(pos),) or not np.isfinite(np.c_[pos,v,m]).all() or np.any(m<=0):raise ValueError('Invalid independent phase initial data')
                  xp.append(g.wrap(pos));vp.append(v);mp.append(m);labels.append(np.full(len(pos),2,np.int8))
