                  md=g.deposit(x,m*lor*v[:,d]/C)+r*vg[d]/C
                  pd=g.deposit(x,m*lor*(v[:,d]/C)**2)+(r*vg[d]**2+p)/C**2
                  M.append(md);P.append(pd);cov.append(pd-md*md/e)
              return e,M,P,cov

          def config(mode):return dict(version=14,radial_mass_eV=RADIAL_MASS_EV,material_weight=RADIAL_W_B,metric="quasistatic_active_trace",stop_at_target=STOP_AT_TARGET,formation=dict(z_start=FORM_Z_START,z_end=FORM_Z_END,collapse_z=list(COLLAPSE_Z),cells=FORM_CELLS,shells=FORM_SHELLS,temperature_K=FORM_T_K,outer_factor=FORM_OUTER_FACTOR),N=N,box=BOX_KPC,end=END_MYR,output_every=OUTPUT_EVERY_MYR,CFL=CFL,gas_total=GAS_TOTAL,gas_bullet_fraction=GAS_BULLET_FRACTION,star_mass=list(STAR_MASS),scales=list(SCALE_KPC),separation=START_SEPARATION,impact=IMPACT_KPC,speed=RELATIVE_KMS,stars=STAR_PARTICLES,phase_mode=mode,phase_sigma=PHASE_SIGMA_KMS,seed=SEED,phase_file=PHASE_FILE if mode=='file' else None)

          def diagnostic(g,U,x,v,m,l,cent,t,passage,table,out,tag,initial_mass,mom0,renewal=None,renewal_state="not_reached"):
              f_used=0. if renewal is None else renewal[0]
              m_inf=m.copy();m_inf[l==2]*=1-f_used
              rho_main=g.deposit(x[l==0],m[l==0])+U[0]-U[5]
