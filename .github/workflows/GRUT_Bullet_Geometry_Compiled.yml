                  if not accepted:break
                  it+=1;emit('  exact nonlinear support Newton step',it,'CG',inner+1,'residual',err)
              grad=g.gradient(phi);load=np.linalg.norm(grad,axis=-1)/AC;mu,dmu=constitutive(load);del dmu,load
              grad*=(1-mu)[...,None];pol=g.div(grad)/(4*np.pi*G);del grad,mu
              return pol,dict(converged=bool(err<tol),relative_residual=err,iterations=it,
