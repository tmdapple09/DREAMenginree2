                  stage(f'{mode} diagnostic complete {tag}')
                  first=rows[0] if rows else row
                  row['energy_relative_change']=(row['total_newtonian_energy']-first['total_newtonian_energy'])/max(first['energy_absolute_components'],1e-30)
                  row['energy_scope']='Newtonian reference only, not conserved full relativistic energy'
                  row['cumulative_gravity_work_defect']=cumulative_repair
                  row['unprojected_grid_force_impulse']=raw_impulse
                  row['max_unprojected_grid_force_fraction']=max_raw_force
                  row['cumulative_absolute_gravity_work_defect']=cumulative_repair
                  row['work_defect_fraction_of_initial_abs_energy']=cumulative_repair/max(first['energy_absolute_components'],1e-30)
                  row['numerical_quality_flag']='REFINE_REQUIRED' if abs(row['energy_relative_change'])>.02 or row['work_defect_fraction_of_initial_abs_energy']>.02 or g.h>AP/2 or max_raw_force>.02 or row['max_gas_speed_over_c']>.1 or row['max_gas_sound_over_c']>.1 else 'CHECK_CONVERGENCE_AND_INITIAL_DATA'
                  row['gas_origin_relative_error']=max(abs(a-b)/b for a,b in zip(row['gas_origin_masses'],first['gas_origin_masses']))
                  assert row['gas_origin_relative_error']<1e-9
                  if abs(row['energy_relative_change'])>.02:emit('WARNING: energy drift >2%; refine grid/timestep before interpreting lensing')
                  if row['work_defect_fraction_of_initial_abs_energy']>.01:emit('WARNING: cumulative gravitational work defect >1% of initial absolute energy; refine before interpreting')
                  rows.append(row);jsonsave(hist,rows)
                  commit_state()
                  # CSV alongside restart data.
                  with (out/'history.csv').open('w',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
              if passage is not None and mode=='formed' and renewal_state=='not_reached':
                  stage('resume pending finite support check');candidate,meta=finite_support_endpoint(g,U,x,m,l,table)
                  jsonsave(out/'renewal_passage_endpoint.json',meta)
                  if meta['admissible_positive_phase_endpoint']:support=candidate;renewal_state='coupled_periodic_positive_endpoint'
                  else:renewal_state='unclosed_infall_only'
                  del candidate;commit_state()
              if not rows:
                  # Preserve the complete initial state even if the first optical diagnostic fails.
                  if not cp.exists() or not RESUME:commit_state()
                  save('initial')
              emit("Initial checkpoint committed | peak RSS MiB",round(peak_rss_mb(),1))
              if pause_due() and t<END_MYR-1e-8:raise CheckpointPause(f'{mode} checkpoint at {t:.3f} Myr')
              next_out=(math.floor(t/OUTPUT_EVERY_MYR+1e-8)+1)*OUTPUT_EVERY_MYR
              stage(f'{mode} initial gravity begin')
              phi,a,ap,rawforce,rawabs=g.forces(U,x,v,m,l,current_renewal());wall=time.monotonic()
              emit("Initial gravitational field ready | peak RSS MiB",round(peak_rss_mb(),1))
              while t<END_MYR-1e-8 and not (STOP_AT_TARGET and matched):
                  verbose_step=True  # Report every solver stage on every step.
                  step_wall=time.monotonic()
                  if verbose_step:stage(f'{mode} step {step+1} CFL begin')
                  speed=0.
                  for lo in range(0,g.n,HYDRO_SLAB):
                      r,vg,p=primitive(U[:,lo:lo+HYDRO_SLAB]);sound=np.sqrt(GAMMA*p/r)
                      speed=max(speed,float(np.max(np.sum(abs(vg),axis=0)+3*sound)))
                  del r,vg,p,sound
                  vpmax=float(np.max(np.linalg.norm(v,axis=1)))
                  acc=max(float(np.max(np.linalg.norm(a[lo:lo+HYDRO_SLAB],axis=-1))) for lo in range(0,g.n,HYDRO_SLAB))
                  limits={'hydro_CFL':CFL*g.h/max(speed,1e-12),'particle_crossing':.4*g.h/max(vpmax,1e-12),'acceleration':.3*np.sqrt(g.h/max(acc,1e-20)),'end':END_MYR-t,'output':next_out-t}
                  dt=min(limits.values());emit('TIMESTEP LIMITS',json.dumps(limits),'active',min(limits,key=limits.get))
                  if dt<=1e-9:raise RuntimeError('Time step underflow')
                  emit(f'{mode} step {step+1} START | t={t:.9f} Myr | dt={dt:.9f} Myr | peak RSS MiB={peak_rss_mb():.1f}')
                  for attempt in range(14):
                      if verbose_step or attempt:stage(f'{mode} step {step+1} attempt {attempt+1} first kick')
                      trial=U.copy();kick(trial,a,dt/2)
                      if verbose_step or attempt:stage(f'{mode} step {step+1} hydro stage 1')
                      mid,F1=hydro_rhs(trial,g,True,second_order=(attempt==0)); mid*=dt; mid+=trial
                      if valid(mid):
                          if verbose_step or attempt:stage(f'{mode} step {step+1} hydro stage 2')
                          new,F2=hydro_rhs(mid,g,True,second_order=(attempt==0)); new*=dt; new+=mid; new+=trial; new*=.5; del mid
                          if valid(new):
                              vh=v+dt/2*ap;xn=g.wrap(x+dt*vh)
                              if verbose_step or attempt:stage(f'{mode} step {step+1} updated gravity')
                              support_new=None; renewal_new=None
                              if support is not None:
                                  support_new,meta=finite_support_endpoint(g,new,xn,m,l,table)
                                  if not meta['admissible_positive_phase_endpoint']:
                                      jsonsave(out/'renewal_rejected.json',meta)
                                      raise RuntimeError('Nonlinear support endpoint ceased to be admissible; no arbitrary renormalization; prior checkpoint retained')
                                  renewal_new=(renewal_fraction(t+dt,passage),support_new)
                              phin,an,apn,rawforcen,rawabsn=g.forces(new,xn,vh,m,l,renewal_new)
                              if verbose_step or attempt:stage(f'{mode} step {step+1} work and final kick')
                              # Exact local momentum/kinetic-energy kicks preserve gas
                              # internal energy. Do not redistribute or manufacture heat
                              # to conceal the discrete gravitational-work error.
                              kickwork=trial[4]-U[4]
                              before=new[4].copy();kick(new,an,dt/2);kickwork+=new[4]-before
                              ph=.5*(phi+phin);work=np.zeros(g.shape)
                              for d in range(3):
                                  F=.5*(F1[d]+F2[d]); fw=-F*(np.roll(ph,-1,axis=d)-ph)*dt/g.h
                                  work+=.5*(fw+np.roll(fw,1,axis=d))
                              repair=float(abs(np.sum(work-kickwork)))
                              if valid(new):
                                  vn=vh+dt/2*apn;break
                      # Release any allocated stages before retry.
                      trial=mid=new=F1=F2=phin=an=apn=kickwork=before=ph=work=F=fw=None
                      dt*=.5
                      emit(f'{mode} step {step+1} RETRY | attempt={attempt+1} | dt={dt:.9f} Myr')
                  else:raise RuntimeError('Hydro positivity failure; last checkpoint retained')
                  cumulative_repair+=repair*g.dv
                  raw_impulse+=.5*dt*(rawabs+rawabsn);max_raw_force=max(max_raw_force,rawforcen)
                  # Same discrete characteristic map, differentiated in its own field.
                  # Fdot evolves through tidal acceleration; retain the history through passage.
                  if len(Fphase):
                      stage(f'{mode} step {step+1} inherited deformation update')
                      oldsign=np.linalg.slogdet(Fphase)[0]
                      Vhalf=Vphase+.5*dt*(g.tidal(phi,x[l==2])@Fphase)
                      Fn=Fphase+dt*Vhalf
                      Vphase=Vhalf+.5*dt*(g.tidal(phin,xn[l==2])@Fn)
                      crossings+=(np.linalg.slogdet(Fn)[0]*oldsign<0)
                      Fphase=Fn
                      if not (np.isfinite(Fphase).all() and np.isfinite(Vphase).all()):
                          raise FloatingPointError('Phase deformation tangent overflow; retained checkpoint; no strain reset')
                  if support is not None:
                      stage(f'{mode} step {step+1} polarization current continuity')
                      r0=g.deposit(x[l==2],m[l==2]);r1=g.deposit(xn[l==2],m[l==2])
                      current_check=mixture_current_check(g,r0,r1,support,support_new,renewal_fraction(t,passage),renewal_fraction(t+dt,passage),dt)
                      del r0,r1
                      support=support_new
                  U,x,v,a,phi,ap,rawforce,rawabs=new,xn,vn,an,phin,apn,rawforcen,rawabsn;t+=dt;step+=1
                  trial=mid=new=F1=F2=phin=an=apn=kickwork=before=ph=work=F=fw=None
                  stage(f'{mode} step {step} accepted; updating galaxy centers')
                  old_cent=cent.copy();cent=np.array([center(g,x,m,l,i,cent[i]) for i in range(2)])
                  sep=float(np.linalg.norm(g.wrap(cent[1]-cent[0])[:2]));best_sep=min(best_sep,sep)
                  emit(f'{mode} STEP {step} COMPLETE | t={t:.9f}/{END_MYR:.1f} Myr | dt={dt:.9f} Myr | separation={sep:.3f} kpc | step wall={time.monotonic()-step_wall:.1f}s | total wall={time.monotonic()-wall:.1f}s | peak RSS MiB={peak_rss_mb():.1f}')
                  # First sign reversal of the projected separation, only after approaching significantly.
                  old_axis=g.wrap(old_cent[1]-old_cent[0])[0]; new_axis=g.wrap(cent[1]-cent[0])[0]
                  if passage is None and old_axis>0>=new_axis and sep<.5*START_SEPARATION:
                      passage=t-dt+dt*old_axis/max(old_axis-new_axis,1e-30);emit('Detected core-axis crossing',passage,'Myr',best_sep,'kpc')
                      if mode=='formed':
                          # First test the actual finite-charge endpoint at passage.
                          # No physical inference is made from an inadmissible endpoint.
                          # If admissible, evolve the source's own mixture in the field
                          # equation on every subsequent accepted step.
                          commit_state()
                          stage('finite nonlinear support at passage')
                          candidate,meta=finite_support_endpoint(g,U,x,m,l,table)
                          jsonsave(out/'renewal_passage_endpoint.json',meta);emit('RENEWAL ENDPOINT',json.dumps(meta))
                          if meta['admissible_positive_phase_endpoint']:
                              support=candidate;renewal_state='coupled_periodic_positive_endpoint'
                              phi,a,ap,rawforce,rawabs=g.forces(U,x,v,m,l,current_renewal())
                          else:
                              renewal_state='unclosed_infall_only';emit('SUPPORT ENDPOINT REJECTED: infall continuation is a control, NOT a complete GRUT prediction')
                          del candidate
                          commit_state()
                  reached=passage is not None and not matched and last_sep<TARGET<=sep
                  last_sep=sep
                  if reached:matched=True;save('matched_separation') # first crossing; not exact interpolated registration
                  if t>=next_out-1e-7 or t>=END_MYR-1e-7:
                      save(f't{t:08.2f}');next_out+=OUTPUT_EVERY_MYR
                  # Checkpoint current accepted state independently of expensive optical diagnostics.
                  if time.monotonic()-last_commit>=300 or pause_due():
                      commit_state()
                  if pause_due() and t<END_MYR-1e-8:
                      raise CheckpointPause(f'{mode} checkpoint at {t:.3f} Myr')
              jsonsave(out/'summary.json',dict(mode=mode,matched_separation=matched,closest_separation_kpc=best_sep,passage_myr=passage,steps=step,last=rows[-1],near_target=min((r for r in rows if r['post_passage_myr'] is not None),key=lambda r:abs(r['separation_kpc']-TARGET),default=None),observational_reference={'main_kappa':.805,'bullet_kappa':.599,'separation_kpc':TARGET,'scope':'archived CANUCS three-map mean, 150 kpc apertures, 80 kpc smoothing, Dls/Ds=1; model optical source normalization Dls/Ds=1; absolute halo column plus atmosphere subtraction, coverage not registered; no fit claimed'}))
              # Optional static plot; no GUI and no blocking show.
              try:
                  if not MAKE_PLOTS:raise RuntimeError("plotting disabled")
                  import matplotlib.pyplot as plt
                  data=np.load(out/('matched_separation.npz' if matched else f't{t:08.2f}.npz'))
                  fig,axes=plt.subplots(2,2,figsize=(9,8));extent=[-g.L/2,g.L/2,-g.L/2,g.L/2]
                  for ax,key,title in zip(axes.flat,('kappa','gas_surface_density','kappa_phase_contrast','kappa_multistream_covariance'),('Born convergence (mass + null stress proxy)','Gas column','Phase contrast convergence','Directional velocity covariance')):
                      im=ax.imshow(data[key].T,origin='lower',extent=extent);ax.scatter(*data['centers_kpc'][:,:2].T,c='white',marker='+');ax.set_title(title);ax.set_xlabel('kpc');fig.colorbar(im,ax=ax,shrink=.75)
                  fig.tight_layout();fig.savefig(out/'maps.png',dpi=130);plt.close(fig);data.close()
              except Exception as ex:emit('Optional plot unavailable:',ex)
              emit('FINISHED',mode,'matched:',matched,'results:',out.resolve())
              return dict(last=rows[-1],crossed_target=matched,near_target=min((r for r in rows if r['post_passage_myr'] is not None),key=lambda r:abs(r['separation_kpc']-TARGET),default=None))

          def main():
              if PHASE_MODE!='formed':raise ValueError('Inherited deformation requires formation; baryon control runs separately')
              if not 0<GAS_BULLET_FRACTION<1:raise ValueError('Both progenitors require positive gas mass in this setup')
              OUT.mkdir(parents=True,exist_ok=True);g=Grid(N,BOX_KPC);table=cascade()
              emit('GRUT | Paper 03/09 |',MODE,'grid',N,'dx',g.h,'kpc | z',Z,'clock',TAU,'Myr | a_c (H(z) prescription)',AC,'kpc/Myr^2 | cosmic phase budget',RHO_PHASE*BOX_KPC**3,'x 1e12 Msun')
              emit('GRUT common action: massive radial ring material response, reciprocal material force, signed quasistatic gravitostatic source, phase deformation and C3 renewal.')
              emit('Radial mass eV',RADIAL_MASS_EV,'Compton kpc',RADIAL_COMPTON_KPC,'material coefficient',RADIAL_B,'| conditional slow branch; no imposed free waves')
              emit('Optics: three-dimensional sourced null metric, ordered Jacobi ray propagation, native-grid shear/rotation, and separate Born reference.')
              emit('Exact nonlinear support: coupled only after finite-charge and positivity checks; inadmissible endpoint leaves an explicitly labeled infall control. Full metric/support stress not closed.')
              formed=[radial_formation(i,table,OUT/'formation') for i in range(2)] if PHASE_MODE=='formed' else None
              final={PHASE_MODE:run(g,PHASE_MODE,table,formed)}
              if RUN_BARYON_CONTROL and PHASE_MODE!='none':final['none']=run(g,'none',table,formed)
              if formed is not None:
                  final['formation']=[json.loads((OUT/'formation'/f'progenitor_{i}.json').read_text()) for i in range(2)]
              jsonsave(OUT/'PASTE_BACK.json',final);emit('PASTE_BACK',json.dumps(final,indent=2))

          if __name__=='__main__':
              install_failure_trace()
              try:main()
              except CheckpointPause as e:
                  emit('PAUSED FOR CONTINUATION:',e);sys.exit(75)
          GRUT_EMBEDDED_PYTHON_EOF
      - name: Evolve formation and merger
        shell: bash
        run: |
          set +e
          # Record evidence, not an assumed termination cause.
          runner_state() {
            echo "=== runner evidence: $1 ==="
            date -u +%FT%TZ
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.events.local /sys/fs/cgroup/memory/memory.oom_control; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            df -h .
          }
          trap 'echo "Workflow shell received SIGTERM" | tee -a simulation.log; runner_state SIGTERM | tee -a simulation.log; exit 143' TERM
          trap 'echo "Workflow shell received SIGINT" | tee -a simulation.log; runner_state SIGINT | tee -a simulation.log; exit 130' INT
          runner_state before | tee simulation.log
          /usr/bin/time -v python -u GRUT_Bullet_Full.py 2>&1 | tee -a simulation.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          echo "Simulation exit=$status; log pipe exit=${statuses[1]}" | tee -a simulation.log
          runner_state after | tee -a simulation.log
          if [ "$status" -eq 0 ] && [ "${statuses[1]}" -ne 0 ]; then status=${statuses[1]}; fi
          set -e
          if [ "$status" -eq 75 ]; then
            echo 'Checkpoint saved. Dispatch another run with resume_run_id=${{ github.run_id }}.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 0 ]; then
            echo 'Simulation complete.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Upload results and restart state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grut-bullet-results
          path: |
            GRUT_Bullet_Geometry_results/
            !GRUT_Bullet_Geometry_results/**/*.tmp.npz
            !GRUT_Bullet_Geometry_results/**/*.tmp
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
      - name: Upload log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulation-log
          path: simulation.log
          if-no-files-found: warn
          retention-days: 14
