          # Source cascade: Paper 09 p09-law. Quadrature and monotone inversion tabulated once.
          def cascade():
              x=np.geomspace(1e-9,1e7,2200); j=np.arange(1,257.); n=1+1/(2*j); w=1/(2*(1-np.log(2))*j*(2*j+1)); n=np.r_[n,1.]; w=np.r_[w,1-w.sum()]
              u,q=np.polynomial.legendre.leggauss(48);u=(u+1)/2;q=q/2
              mu=np.empty_like(x); D=mu.copy()
              for i,xx in enumerate(x):
                  s=-n[:,None]*np.log1p(xx*u[None,:]/n[:,None]); coeff=w[:,None]*(3*q*u*u)[None,:]
                  mu[i]=np.sum(coeff*(-np.expm1(s)));D[i]=np.sum(coeff*np.exp(s))
              y=x*mu
              assert np.all(np.diff(y)>0) and abs(np.max(x*D)-.9286)<.001
              return x,y,x*D

          def support_flux(a,table):
              # Quasi-linear diagnostic, v=grad Phi_b=-a_b, S=(nu-1)v.
              x,y,boost=table; norm=np.linalg.norm(a,axis=-1); load=norm/AC
              b=np.zeros_like(load); good=load>0
              b[good]=np.exp(np.interp(np.log(load[good]),np.log(y),np.log(boost)))
              low=(load<y[0])&good; b[low]=np.sqrt(4*load[low]/3)-load[low]
              high=load>y[-1]; b[high]=boost[-1]*y[-1]/load[high] # diagnostic tail; flag range in output
              return -a*np.divide(AC*b,norm,out=np.zeros_like(norm),where=good)[...,None]


          def nonlinear_support(g,b,table,initial=None,maxiter=35,tol=3e-5):
              """Full-capture nonlinear bound-charge equation, periodic contrast branch.
              Inexact Newton-CG with exact tangent of the interpolated cascade. It
              solves div(mu grad Phi)=4 pi G delta rho_b, NOT a quasi-linear surrogate.
              No rescaling or fitted finite charge normalization.
              """
              x,y,_=table; logx=np.log(x); logmu=np.log(y/x)
              slopes=np.diff(logmu)/np.diff(logx)
              def constitutive(load):
                  logload=np.log(np.maximum(load,x[0])); mu=np.exp(np.interp(logload,logx,logmu))
                  j=np.clip(np.searchsorted(logx,logload)-1,0,len(slopes)-1)
                  dmu=mu*slopes[j];del j,logload
                  lo=load<x[0];mu[lo]=.75*load[lo];dmu[lo]=mu[lo]
                  hi=load>x[-1];mu[hi]=1.;dmu[hi]=0.
                  return mu,dmu
