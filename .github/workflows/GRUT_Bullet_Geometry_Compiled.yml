name: GRUT Bullet Cluster geometric optical evolution
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Previous workflow run ID to resume (blank for fresh run)'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label available in your repository'
        required: true
        type: string
        default: ubuntu-latest
permissions:
  contents: read
  actions: read
jobs:
  simulate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      GRUT_WALL_SECONDS: '16200'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<2.3' 'matplotlib>=3.8,<4' 'numba>=0.61.2,<0.66'
      - name: Restore previous results
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: grut-bullet-results
          path: GRUT_Bullet_Geometry_results
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Create embedded simulation
        shell: bash
        run: |
          cat > GRUT_Bullet_Full.py <<'GRUT_EMBEDDED_PYTHON_EOF'
          """GRUT source-linked late-time field reduction (Papers 01–04, 09; GRA 08/09).
          One embedded production workflow. No smoke mode or automatic grid reduction.
          Original switching eqs. (10), (13), (14): the massive radial field is eliminated
          at its adiabatic ring response, using the lightest allowed radial mass. This
          retains the material scalar force and interaction energy, NOT an invented
          cluster-scale free radial wave. The scalar force acts only on material; the
          constrained spacetime-energy phase remains geodesic. The source-free phase
          transport is the Paper 09 multistream limit, not an extra particle species.
          The local metric reduction uses quasi-static weak-field h00 sourced by E+tr P
          (Paper 09 signed gravitostatic charge), with the homogeneous background removed
          on the periodic box. It is NOT full 1PN or an evolved relativistic metric:
          vector/time-derivative metric terms and full relativistic momentum are omitted.
          The exact nonlinear full-capture equation is solved at passage. A periodic
          positive endpoint is admitted only if its signed positive budget fits the
          captured population and its absolute density is nonnegative. For an admissible
          endpoint the original C3 mixture feeds back into the evolving gravity source
          on every step; the discrete moving-endpoint current is checked. Otherwise the
          run explicitly continues as an infall control, not a complete prediction.
          Additional optical evolution integrates the null metric and ordered Jacobi map through all 255 slices, rather than only a projected mass sheet. This is a quasistatic conditional closure; the support stress tensor and free
          radial-wave initial data are not supplied. No invented finite-charge law. Original inherited deformation and C3 clock are
          separate records. No observational fit is claimed.
          """
          import json, csv, time, math, os, sys, signal, faulthandler
          from pathlib import Path
          import numpy as np

          # ==================== USER SETTINGS ====================
          # Fixed high-resolution run; no preliminary test modes or resolution overrides.
          # Full 9216 kpc cube: 255^3 cells, 36.141176 kpc spacing.
          # Large float64 working arrays require multiple GB of RAM. No automatic downshift.
          MODE = 'full_resolution'
          N = 255                     # fixed production grid; no automatic resolution reduction
          BOX_KPC = 9216.0            # periodic proper cube; vary box separately
          END_MYR = 2000.0
          OUTPUT_EVERY_MYR = 100.0
          CFL = 0.30
          GAS_TOTAL = 383.41          # archive extrapolated inventory; not measured initial ownership
          GAS_BULLET_FRACTION = 0.5   # explicit sensitivity input; NOT a fitted or derived ratio
          STAR_MASS = (11.96, 4.00)
          SCALE_KPC = (470., 245.)    # archived conditional profile scales, gas and stars
          START_SEPARATION = 4300.0
          IMPACT_KPC = 100.0
          RELATIVE_KMS = 2600.0       # illustrative initial relative speed, not shock speed measurement
          STAR_PARTICLES = 72000      # per galaxy population
          PHASE_SIGMA_KMS = 1.0       # conditional cold cosmic reservoir (Paper 09 capture section)
          PHASE_MODE = 'formed'       # 'formed', 'cosmic', 'none', or 'file'
          PHASE_FILE = 'phase_initial.npz' # optional x [kpc], v [km/s], mass [10^12 Msun], arrays
          RUN_BARYON_CONTROL = True
          MAKE_PLOTS = True
          STOP_AT_TARGET = False       # retain matched snapshot and evolve through END_MYR
          RESUME = True
          SEED = 8417
          OUT = Path('GRUT_Bullet_Geometry_results')
          # Wall-clock checkpoint interval only; does not change simulation settings.
          BUDGET_SECONDS = float(os.environ.get('GRUT_WALL_SECONDS', '0'))
          DEADLINE = time.monotonic()+BUDGET_SECONDS if BUDGET_SECONDS>0 else float('inf')
          class CheckpointPause(Exception): pass
          def pause_due(): return time.monotonic()>=DEADLINE
          # =======================================================
          KPC=3.085677581491367e19; MYR=31557600.e6; MS=1.98847e30
          MUNIT=1e12*MS; G=6.67430e-11*MUNIT*MYR**2/KPC**3
          C=299792458.*MYR/KPC; KM=1000.*MYR/KPC
          H0=67.35*1000*MYR/(1000*KPC); Z=.296; OL=27/(4*np.pi**2); OC=.26503; OM=.31599
          HZ=H0*np.sqrt(OM*(1+Z)**3+OL); AC=3*np.sqrt(3)/(4*np.pi**2)*C*HZ
          TAU=4*np.pi**2/(9*np.sqrt(3)*HZ) # Myr; source clock, approximately 31.4 Gyr
          RHO_PHASE=OC*3*H0**2/(8*np.pi*G)*(1+Z)**3
          DL=4.570*206264.80624709636; SIGCRIT=C*C/(4*np.pi*G*DL)
          GAMMA=5./3.; TARGET=880.07174; AP=150.; SMOOTH=80.


          # Original GRUT v4.4.0 eqs. (10),(13),(14), retained Paper 01 action;
          # Paper 03 material vertex, baryonic weight 0.200(4), not a fit.
          # m_delta=1e-3 eV is the most responsive allowed massive branch, not a
          # prediction of the radial mass. hbar*c/m_delta = 0.19732698 mm.
          RADIAL_MASS_EV=1.e-3
          RADIAL_COMPTON_KPC=1.973269804e-7/RADIAL_MASS_EV/KPC
          RADIAL_F2_OVER_C2=C*C/(8*G) # delta=pi; source normalization
          RADIAL_PHI_RING=np.sqrt(2.) # horizon shift < 1e-59
          RADIAL_W_B=0.200
          # eta=delta_phi/phi_ring = -a_eta * (rho_b - 3p_b/c^2)
          # B = w*a_eta; effective static interaction energy/c^2 = -B rho_b^2/2
          RADIAL_A_ETA=RADIAL_W_B*RADIAL_COMPTON_KPC**2/(RADIAL_PHI_RING**2*RADIAL_F2_OVER_C2)
          RADIAL_B=RADIAL_W_B*RADIAL_A_ETA

          # The leading slow-material Hamiltonian uses rest density in the scalar load.
          # Thermal trace corrections are evaluated in the output, not inserted into a
          # nonrelativistic gas EOS lacking the matching relativistic energy equations.
          # The gradient and inertial corrections to this response are order (lambda/L)^2
          # and (lambda/(c T))^2 respectively. The free homogeneous wave is unspecified.
          def radial_potential(rho_b):
              return -C*C*RADIAL_B*rho_b

          def radial_effects(rho_b, pressure=None):
              load=rho_b if pressure is None else rho_b-3*pressure/C**2
              eta=-RADIAL_A_ETA*load
              radial_W=.5*RADIAL_F2_OVER_C2*RADIAL_PHI_RING**2*(eta/RADIAL_COMPTON_KPC)**2
              matter_mass_shift=RADIAL_W_B*eta*rho_b
              # E+tr P of slow radial field = -2 W/c^2 + O(time derivatives).
              # Rest mass shift belongs to matter, not an extra radial population.
              return eta,radial_W,matter_mass_shift,matter_mass_shift-2*radial_W

          def emit(*a): print(*a,flush=True)

          def stage(name):
              emit(f'[STAGE {time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}]',name)

          def install_failure_trace():
              # The C-level handler emits the Python stack even during native NumPy work,
              # then chains to the original SIGTERM disposition. Do not claim a clean exit.
              faulthandler.enable(file=sys.stderr,all_threads=True)
              if hasattr(faulthandler,'register'):
                  faulthandler.register(signal.SIGTERM,file=sys.stderr,all_threads=True,chain=True)
              stage('failure traceback installed')
          def rel(a,b): return float(np.linalg.norm(a-b)/max(np.linalg.norm(b),1e-30))
          def jsonsave(path,obj):
              tmp=path.with_suffix('.tmp'); tmp.write_text(json.dumps(obj,indent=2,allow_nan=False)); tmp.replace(path)

          class Grid:
              def __init__(self,n,L):
                  self.n=n; self.L=L; self.h=L/n; self.dv=self.h**3; self.shape=(n,)*3
                  self.x=(np.arange(n)+.5)*self.h-L/2
                  self.xyz=np.meshgrid(self.x,self.x,self.x,indexing='ij',sparse=True)
                  k=2*np.pi*np.fft.fftfreq(n,self.h); kd=k.copy()
                  if n%2==0: kd[n//2]=0. # real, antisymmetric derivative at Nyquist
                  self.k=np.meshgrid(kd,kd,kd,indexing='ij',sparse=True)
                  # Compatible spectral Poisson/gradient/divergence; Nyquist-only nulls removed.
                  self.k2=sum(q*q for q in self.k); self.inv=np.divide(1.,self.k2,out=np.zeros(self.shape),where=self.k2>0)
              def wrap(self,x): return (x+self.L/2)%self.L-self.L/2
              def geometry(self,x,derivative=False):
                  # Quadratic B-spline particle shape. A smooth discrete Hamiltonian
                  # force uses the derivative of exactly this same mass assignment.
                  q=(x+self.L/2)/self.h-.5; i=np.floor(q+.5).astype(np.int64);d=q-i
                  W=(.5*(.5-d)**2,.75-d*d,.5*(.5+d)**2)
                  D=(-( .5-d)/self.h,-2*d/self.h,(.5+d)/self.h)
                  for a in range(3):
                      for b in range(3):
                          for c in range(3):
                              j=(i+np.array([a-1,b-1,c-1]))%self.n
                              idx=(j[:,0]*self.n+j[:,1])*self.n+j[:,2]
                              wx,wy,wz=W[a][:,0],W[b][:,1],W[c][:,2]
                              w=wx*wy*wz
                              if derivative:
                                  dw=np.column_stack((D[a][:,0]*wy*wz,wx*D[b][:,1]*wz,wx*wy*D[c][:,2]))
                                  yield idx,w,dw
                              else:yield idx,w
              def deposit(self,x,w):
                  out=np.zeros(self.n**3)
                  if len(x):
                      for idx,frac in self.geometry(x):out+=np.bincount(idx,weights=w*frac,minlength=out.size)
                  return out.reshape(self.shape)/self.dv
              def sample(self,field,x):
                  out=np.zeros((len(x),)+field.shape[3:]);flat=field.reshape((self.n**3,)+field.shape[3:])
                  for i,w in self.geometry(x):out+=flat[i]*w.reshape((-1,)+(1,)*(out.ndim-1))
                  return out
              def particle_force(self,phi,x):
                  out=np.zeros_like(x);flat=phi.ravel()
                  for idx,w,dw in self.geometry(x,True):out-=flat[idx,None]*dw
                  return out
              def tidal(self,phi,x):
                  # Derivative of the very same TSC-interpolated potential that moves the phase.
                  # Holds the Eulerian field fixed (neighboring test characteristics, not a
                  # derivative of the entire self-consistent particle ensemble).
                  if not len(x): return np.empty((0,3,3))
                  q=(x+self.L/2)/self.h-.5; i=np.floor(q+.5).astype(np.int64); d=q-i
                  W=(.5*(.5-d)**2,.75-d*d,.5*(.5+d)**2)
                  D=(-( .5-d)/self.h,-2*d/self.h,(.5+d)/self.h)
                  D2=np.array([1.,-2.,1.])/self.h**2
                  T=np.zeros((len(x),3,3)); flat=phi.ravel()
                  for a in range(3):
                      for b in range(3):
                          for c in range(3):
                              jj=(i+np.array([a-1,b-1,c-1]))%self.n
                              f=-flat[(jj[:,0]*self.n+jj[:,1])*self.n+jj[:,2]]
                              w=[W[a][:,0],W[b][:,1],W[c][:,2]]
                              dw=[D[a][:,0],D[b][:,1],D[c][:,2]]
                              ks=(a,b,c)
                              for k in range(3):
                                  u,v=[j for j in range(3) if j!=k]
                                  T[:,k,k]+=f*D2[ks[k]]*w[u]*w[v]
                                  for l in range(k+1,3):
                                      T[:,k,l]+=f*dw[k]*dw[l]*w[3-k-l]
                  T[:,1,0]=T[:,0,1];T[:,2,0]=T[:,0,2];T[:,2,1]=T[:,1,2]
                  return T
              def gradient(self,field):
                  ph=np.fft.rfftn(field,axes=(0,1,2)); a=np.empty(self.shape+(3,))
                  for i,k in enumerate(self.k):
                      if i==2:k=k[:,:,:self.n//2+1]
                      a[...,i]=np.fft.irfftn(1j*k*ph,s=self.shape,axes=(0,1,2))
                  return a
              def active_source(self,U,x,v,m,l,renewal=None):
                  # Paper 09, trace reversal in the grid observer frame. The gas rest
                  # density is a conserved coordinate density. To O(v^2/c^2,p/rho c^2)
                  # E/c^2=rho+U4/c^2; trP/c^2=(rho v^2+3p)/c^2.
                  beta2=np.sum(v*v,axis=1)/C**2
                  if np.max(beta2)>=.01:raise RuntimeError('Weak-field velocity regime exceeded')
                  weights=m*(1+beta2)/np.sqrt(1-beta2)
                  if renewal is not None and renewal[0]>0:
                      weights[l==2]*=1-renewal[0]
                  active=self.deposit(x,weights)
                  if renewal is not None and renewal[0]>0:active+=renewal[0]*renewal[1]
                  active+=U[0]
                  b=self.deposit(x[l!=2],m[l!=2]);b+=U[0]
                  for lo in range(0,self.n,HYDRO_SLAB):
                      hi=min(lo+HYDRO_SLAB,self.n); B=U[:,lo:hi];r,vg,p=primitive(B)
                      active[lo:hi]+=(B[4]+r*np.sum(vg*vg,axis=0)+3*p)/C**2
                      # Radial trace response retained separately even below floating
                      # precision of the dominant density. Vacuum constant lives in FLRW.
                      _,_,_,dr=radial_effects(b[lo:hi])
                      active[lo:hi]+=dr
                  return active,b
              def forces(self,U,x,v,m,l,renewal=None):
                  active,b=self.active_source(U,x,v,m,l,renewal)
                  phi,a=self.solve(active); del active
                  ap=self.particle_force(phi,x)
                  # Original eq. 56: -n grad(m c^2), after eliminating the massive
                  # radial field. No radial mass force on the geodesic phase.
                  sp=radial_potential(b);del b
                  ascalar=-self.gradient(sp)
                  ap[l!=2]+=self.particle_force(sp,x[l!=2]);del sp
                  a+=ascalar;del ascalar
                  # Raw force balance, without imposing a COM acceleration that would
                  # mask the omitted relativistic momentum terms. Uniform translation
                  # of the diagnostic coordinates is not a physical force.
                  gasforce=np.zeros(3);scale=0.
                  for lo in range(0,self.n,HYDRO_SLAB):
                      hi=min(lo+HYDRO_SLAB,self.n);r=U[0,lo:hi];ab=a[lo:hi]
                      gasforce+=np.sum(r[...,None]*ab,axis=(0,1,2))*self.dv
                      scale+=np.sum(r*np.linalg.norm(ab,axis=-1))*self.dv
                  residual=gasforce+np.sum(m[:,None]*ap,axis=0)
                  scale+=np.sum(m*np.linalg.norm(ap,axis=1))
                  return phi,a,ap,float(np.linalg.norm(residual)/max(scale,1e-30)),float(np.linalg.norm(residual))
              def solve(self,rho):
                  ph=np.fft.rfftn(rho,axes=(0,1,2)); ph*=(-4*np.pi*G)*self.inv[:,:,:self.n//2+1]
                  pot=np.fft.irfftn(ph,s=self.shape,axes=(0,1,2))
                  a=np.empty(self.shape+(3,))
                  for i,k in enumerate(self.k):
                      if i==2:k=k[:,:,:self.n//2+1]
                      a[...,i]=np.fft.irfftn(-1j*k*ph,s=self.shape,axes=(0,1,2))
                  return pot,a
              def div(self,v):
                  z=None
                  for i,k in enumerate(self.k):
                      if i==2:k=k[:,:,:self.n//2+1]
                      h=np.fft.rfftn(v[...,i],axes=(0,1,2));h*=1j*k
                      if z is None:z=h
                      else:z+=h
                  return np.fft.irfftn(z,s=self.shape,axes=(0,1,2))
              def supported(self,rho):
                  # Odd grid: only the spatially constant mode is in the kernel.
                  if self.n%2:return rho-rho.mean()
                  return np.fft.ifftn(np.fft.fftn(rho)*(self.k2>0)).real

          def primitive(U):
              r=U[0]; v=U[1:4]/r; p=(GAMMA-1)*(U[4]-.5*r*np.sum(v*v,axis=0))
              return r,v,p

          def valid(U):
              tol=1e-13*np.max(U[0])
              for lo in range(0,U.shape[1],HYDRO_SLAB):
                  B=U[:,lo:lo+HYDRO_SLAB]
                  if not np.isfinite(B).all() or np.min(B[0])<=0 or np.min(primitive(B)[2])<=0:return False
                  if len(B)>5 and (np.min(B[5]) < -tol or np.min(B[0]-B[5]) < -tol):return False
              return True

          # Full-resolution finite-volume operator evaluated in slabs. No coarsening.
          HYDRO_SLAB = 8

          from numba import njit, prange
          @njit(inline='always')
          def mc(a,b):
              return np.sign(a)*min(2*abs(a),2*abs(b),.5*abs(a+b)) if a*b>0 else 0.

          @njit(parallel=True,cache=True,error_model='numpy')
          def line_flux(U,Q,d,h,second,rhs,mf):
              # U and Q are axis-permuted views, with the flux direction last.
              nc,na,nb,n=U.shape
              for line in prange(na*nb):
                  i=line//nb;j=line%nb
                  face=np.empty((n,nc));ql=np.empty(nc);qr=np.empty(nc)
                  L=np.empty(nc);R=np.empty(nc);FL=np.empty(nc);FR=np.empty(nc);LS=np.empty(nc);RS=np.empty(nc)
                  for k in range(n):
                      km=(k-1)%n; kp=(k+1)%n;kpp=(k+2)%n
                      for c in range(nc):
                          q0=Q[c,i,j,k];q1=Q[c,i,j,kp]
                          if second:
                              ql[c]=q0+.5*mc(q0-Q[c,i,j,km],q1-q0)
                              qr[c]=q1-.5*mc(q1-q0,Q[c,i,j,kpp]-q1)
                          else:
                              ql[c]=q0;qr[c]=q1;L[c]=U[c,i,j,k];R[c]=U[c,i,j,kp]
                      rl=ql[0];rr=qr[0];pl=ql[4];pr=qr[4];vl=ql[d+1];vr=qr[d+1]
                      if second:
                          L[0]=rl;R[0]=rr;vl2=0.;vr2=0.
                          for c in range(1,4):
                              L[c]=rl*ql[c];R[c]=rr*qr[c];vl2+=ql[c]**2;vr2+=qr[c]**2
                          L[4]=pl/(GAMMA-1)+.5*rl*vl2;R[4]=pr/(GAMMA-1)+.5*rr*vr2
                          if nc>5:
                              L[5]=rl*min(1.,max(0.,ql[5]));R[5]=rr*min(1.,max(0.,qr[5]))
                          for c in range(6,nc):L[c]=rl*ql[c];R[c]=rr*qr[c]
                      cl=np.sqrt(GAMMA*pl/rl);cr=np.sqrt(GAMMA*pr/rr)
                      for c in range(nc):FL[c]=L[c]*vl;FR[c]=R[c]*vr
                      FL[d+1]+=pl;FR[d+1]+=pr;FL[4]+=pl*vl;FR[4]+=pr*vr
                      sl=min(vl-cl,vr-cr);sr=max(vl+cl,vr+cr)
                      ss=(pr-pl+rl*vl*(sl-vl)-rr*vr*(sr-vr))/(rl*(sl-vl)-rr*(sr-vr))
                      ratl=(sl-vl)/(sl-ss);ratr=(sr-vr)/(sr-ss)
                      for c in range(nc):LS[c]=L[c]*ratl;RS[c]=R[c]*ratr
                      LS[d+1]=LS[0]*ss;RS[d+1]=RS[0]*ss
                      LS[4]=LS[0]*(L[4]/rl+(ss-vl)*(ss+pl/(rl*(sl-vl))))
                      RS[4]=RS[0]*(R[4]/rr+(ss-vr)*(ss+pr/(rr*(sr-vr))))
                      kl=0.;kr=0.
                      for c in range(1,4):kl+=LS[c]**2;kr+=RS[c]**2
                      pls=(GAMMA-1)*(LS[4]-.5*kl/LS[0]);prs=(GAMMA-1)*(RS[4]-.5*kr/RS[0])
                      ok=LS[0]>0 and RS[0]>0 and pls>0 and prs>0 and ss>=sl and ss<=sr
                      ok=ok and max(rl,rr)<30*min(rl,rr) and max(pl,pr)<30*min(pl,pr)
                      for c in range(nc):
                          if sl>=0:f=FL[c]
                          elif ss>=0:f=FL[c]+sl*(LS[c]-L[c])
                          elif sr>0:f=FR[c]+sr*(RS[c]-R[c])
                          else:f=FR[c]
                          face[k,c]=f;ok=ok and np.isfinite(f)
                      if not ok:
                          speed=max(abs(vl)+cl,abs(vr)+cr)
                          for c in range(nc):face[k,c]=.5*(FL[c]+FR[c]-speed*(R[c]-L[c]))
                  for k in range(n):
                      for c in range(nc):rhs[c,i,j,k]-=(face[k,c]-face[(k-1)%n,c])/h
                      mf[i,j,k]=face[k,0]

          def hydro_rhs(U,g,return_mass_flux=False,second_order=True):
              Q=np.empty_like(U)
              for lo in range(0,g.n,HYDRO_SLAB):
                  B=U[:,lo:lo+HYDRO_SLAB];r,v,p=primitive(B)
                  Q[0,lo:lo+HYDRO_SLAB]=r;Q[1:4,lo:lo+HYDRO_SLAB]=v;Q[4,lo:lo+HYDRO_SLAB]=p
                  Q[5:,lo:lo+HYDRO_SLAB]=B[5:]/r
              rhs=np.zeros_like(U);mf=[]
              for d in range(3):
                  flux=np.empty(U.shape[1:],dtype=U.dtype)
                  line_flux(np.moveaxis(U,d+1,-1),np.moveaxis(Q,d+1,-1),d,g.h,second_order,np.moveaxis(rhs,d+1,-1),np.moveaxis(flux,d,-1))
                  if return_mass_flux:mf.append(flux)
              return (rhs,mf) if return_mass_flux else rhs


          def peak_rss_mb():
              import resource
              # Linux ru_maxrss is in KiB.
              return resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024

          def kick(U,a,h):
              for lo in range(0,U.shape[1],HYDRO_SLAB):
                  hi=min(lo+HYDRO_SLAB,U.shape[1]); B=U[:,lo:hi];old=B[1:4].copy(); delta=h*np.moveaxis(a[lo:hi],-1,0)
                  B[1:4]+=B[0]*delta
                  B[4]+=np.sum(old*delta,axis=0)+.5*B[0]*np.sum(delta*delta,axis=0)

          def positions(g,mode):
              rng=np.random.default_rng(SEED); gm=np.array([1-GAS_BULLET_FRACTION,GAS_BULLET_FRACTION])*GAS_TOTAL
              masses=gm+STAR_MASS; frac=masses[1]/masses.sum(); delta=np.array([START_SEPARATION,IMPACT_KPC,0.])
              centers=np.array([-frac*delta,(1-frac)*delta]); vel=np.array([[frac*RELATIVE_KMS*KM,0,0],[-(1-frac)*RELATIVE_KMS*KM,0,0]])
              U=np.zeros((6,)+g.shape); xp=[]; vp=[]; mp=[]; labels=[]
              for i,(m,star,a) in enumerate(zip(gm,STAR_MASS,SCALE_KPC)):
                  r2=sum(g.wrap(q-centers[i,j])**2 for j,q in enumerate(g.xyz)); radius=np.sqrt(r2+a*a)
                  rho=(1+r2/a**2)**(-2.5); rho*=m/(rho.sum()*g.dv)
                  # Isolated equal-scale Plummer hydrostatic pressure, approximate when overlapped.
                  p=rho*G*masses[i]/(6*radius)
                  U[0]+=rho; U[1:4]+=rho*vel[i,:,None,None,None]; U[4]+=p/(GAMMA-1)+.5*rho*np.dot(vel[i],vel[i]); U[5]+=rho if i==1 else 0
                  count=STAR_PARTICLES; cut=3.5*a; fmax=(cut/np.sqrt(cut**2+a*a))**3
                  u=rng.uniform(1e-10,fmax,count); r=a/np.sqrt(u**(-2/3)-1)
                  dirs=rng.normal(size=(count,3)); dirs/=np.linalg.norm(dirs,axis=1)[:,None]
                  pos=g.wrap(centers[i]+r[:,None]*dirs)
                  # Plummer isotropic DF p(q) proportional to q^2(1-q^2)^(7/2), q=v/v_escape.
                  q=np.empty(count); pending=np.arange(count)
                  while len(pending):
                      cand=rng.random(len(pending)); accept=rng.random(len(pending))*.1<cand**2*(1-cand*cand)**3.5
                      q[pending[accept]]=cand[accept]; pending=pending[~accept]
                  dirs=rng.normal(size=(count,3)); dirs/=np.linalg.norm(dirs,axis=1)[:,None]
                  vs=vel[i]+dirs*(q*np.sqrt(2*G*masses[i]/np.sqrt(r*r+a*a)))[:,None]
                  xp.append(pos);vp.append(vs);mp.append(np.full(count,star/count));labels.append(np.full(count,i,np.int8))
              if mode=='cosmic':
