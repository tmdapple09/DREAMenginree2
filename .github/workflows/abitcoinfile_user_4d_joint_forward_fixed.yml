              )


          def main() -> None:
              started = time.time()
              trace_rows: list[dict[str, Any]] = []
              update_rows: list[dict[str, Any]] = []
              status: dict[str, Any] = {
                  "completed": False,
                  "model_revision": MODEL_REVISION,
                  "objective": (
                      "next_protocol_valid_pow_header"
                  ),
                  "known_future_hash_used": False,
                  "timestamp_used_as_solve_target": False,
                  "pca_used": False,
                  "candidate_branching_used": False,
                  "per_bit_enumeration_used": False,
                  "runtime_cap_used": False,
                  "iteration_cap_used": False,
                  "step_cap_used": False,
              }

              write_model_spec()
              write_csv(TESSERACT_CSV, tesseract_rows())

              try:
                  anchor_height = resolve_anchor_height()
                  supplied_anchor_hash = resolve_hash(
                      anchor_height
                  )

                  history: list[
                      tuple[dict[str, Any], bytes]
                  ] = []
                  start_height = max(0, anchor_height - 10)
                  for height in range(
                      start_height, anchor_height + 1
                  ):
                      history.append(fetch_block(height))

                  anchor_metadata, anchor_header = history[-1]
                  anchor_hash = str(anchor_metadata["id"])
                  if anchor_hash != supplied_anchor_hash:
                      raise ValueError(
                          "anchor_hash does not match anchor_height"
                      )

                  if len(history) < 3:
                      raise RuntimeError(
                          "three observed headers are required"
                      )

                  older_header = history[-3][1]
                  previous_header = history[-2][1]
                  next_height = anchor_height + 1
                  next_bits = derive_next_bits(
                      anchor_height, anchor_metadata
                  )
                  target = compact_to_target(next_bits)
                  mtp = median_time_past(
                      [row[0] for row in history]
                  )

                  hidden = field_bits(LATENT_FIELDS)
                  system = build_hidden_system(hidden)
                  observation = build_next_observation(
                      anchor_header,
                      anchor_hash,
                      next_bits,
                      hidden,
                  )

                  trajectory_target = full_header_curve_target(
                      older_header,
                      previous_header,
                      anchor_header,
                      system.bit_indices,
                  )
                  initial_values = hidden_values(
                      anchor_header, system.bit_indices
                  )
                  initial_header = materialize(
                      observation,
                      system.bit_indices,
                      initial_values.astype(np.int8),
                  )
                  latent = initial_values.copy()

                  write_protocol_rows(
                      anchor_height,
                      next_height,
                      next_bits,
                      anchor_hash,
                  )
                  write_trajectory_seed(
                      (
                          older_header,
                          previous_header,
                          anchor_header,
                      ),
                      (
                          anchor_height - 2,
                          anchor_height - 1,
                          anchor_height,
                      ),
                      system,
                      trajectory_target,
                  )

                  current = evaluate(
                      initial_header,
                      target,
                      mtp,
                      system,
                      trajectory_target,
                  )
                  best = current
                  iteration = 0
                  last_correction: Optional[Correction] = None

                  status.update(
                      {
                          "anchor_height": anchor_height,
                          "anchor_hash": anchor_hash,
                          "next_height": next_height,
                          "next_bits": f"{next_bits:08x}",
                          "target_hex": f"{target:064x}",
                          "hidden_fields": list(LATENT_FIELDS),
                          "hidden_dimension": len(
                              system.bit_indices
                          ),
                          "joint_section_count": len(
                              system.equation_names
                          ),
                          "joint_operator_rank": system.rank,
                          "protocol_coordinate": (
                              protocol_coordinate(next_height)
                          ),
                          "median_time_past_audit_value": mtp,
                      }
                  )

                  emit(f"[model] revision={MODEL_REVISION}")
                  emit(
                      "[math] full_4d_cell_slice_face_edge=True "
                      "exact_sha_pullback=True full_chain_curve=True"
                  )
                  emit(
                      "[timestamp] forecast=False target=False "
                      "equation=False latent_with_full_header=True"
                  )
                  emit(
                      f"[anchor] height={anchor_height} "
                      f"hash={anchor_hash}"
                  )
                  emit(
                      f"[next protocol] height={next_height} "
                      f"bits={next_bits:08x} "
                      f"subsidy_sats={block_subsidy_sats(next_height)} "
                      f"issued_before_sats={issued_before_height(next_height)}"
                  )
                  emit(
                      f"[state] hidden_dimension={len(system.bit_indices)} "
                      f"sections={len(system.equation_names)} "
                      f"rank={system.rank}"
                  )
                  emit(
                      f"[initial] energy={current.total_energy:.6f} "
                      f"sha_energy={current.sha_energy:.6f} "
                      f"chain_energy={current.chain_energy:.6f} "
                      f"pow_log2_ratio={current.pow_log2_ratio:.6f}"
                  )

                  while True:
                      # Proof of work and the exact hash emerge from the joint header.
                      # Timestamp is decoded and audited only after PoW exists.
                      if (
                          current.pow_valid
                          and current.timestamp_mtp_valid
                      ):
                          independent = independent_digest(
                              current.header
                          )
                          independent_value = int.from_bytes(
                              independent, "little"
                          )
                          if independent_value > target:
                              raise RuntimeError(
                                  "independent PoW validation failed"
                              )
                          if (
                              current.header[4:36]
                              != bytes.fromhex(anchor_hash)[::-1]
                          ):
                              raise RuntimeError(
                                  "anchor linkage changed"
                              )
                          if (
                              int.from_bytes(
                                  current.header[72:76], "little"
                              )
                              != next_bits
                          ):
                              raise RuntimeError(
                                  "compact target changed"
                              )

                          status.update(
                              {
                                  "completed": True,
                                  "iterations": iteration,
                                  "candidate_header_hex": (
                                      current.header.hex()
                                  ),
                                  "candidate_displayed_hash": (
                                      current.displayed_hash
                                  ),
                                  "pow_valid": True,
                                  "timestamp_from_solved_header": (
                                      current.timestamp
                                  ),
                                  "timestamp_mtp_valid": True,
                                  "total_energy": (
                                      current.total_energy
                                  ),
                                  "elapsed_seconds": (
                                      time.time() - started
                                  ),
                              }
                          )
                          break

                      base = current
                      correction = solve_joint_direction(
                          base,
                          observation,
                          system,
                          trajectory_target,
                          latent,
                      )
                      last_correction = correction
                      iteration += 1
                      latent = np.asarray(
                          correction.latent_values,
                          dtype=np.float64,
                      )
                      candidate = evaluate(
                          correction.header,
                          target,
                          mtp,
                          system,
                          trajectory_target,
                      )

                      actual_reduction = (
                          base.total_energy
                          - candidate.total_energy
                      )
                      pow_ratio_reduction = (
                          base.pow_log2_ratio
                          - candidate.pow_log2_ratio
                      )
                      current = candidate

                      if (
                          current.pow_log2_ratio,
                          current.total_energy,
                      ) < (
                          best.pow_log2_ratio,
                          best.total_energy,
                      ):
                          best = current

                      trace_rows.append(
                          {
                              "iteration": iteration,
                              "candidate_header_hex": (
                                  current.header.hex()
                              ),
                              "candidate_displayed_hash": (
                                  current.displayed_hash
                              ),
                              "pow_valid": current.pow_valid,
                              "pow_log2_ratio": (
                                  current.pow_log2_ratio
                              ),
                              "pow_ratio_reduction": (
                                  pow_ratio_reduction
                              ),
                              "timestamp_from_candidate": (
                                  current.timestamp
                              ),
                              "timestamp_used_as_target": False,
                              "timestamp_mtp_valid": (
                                  current.timestamp_mtp_valid
                              ),
                              "sha_energy": current.sha_energy,
                              "chain_energy": (
                                  current.chain_energy
                              ),
                              "total_energy": (
                                  current.total_energy
                              ),
                              "predicted_reduction": (
                                  correction.predicted_reduction
                              ),
                              "actual_reduction": (
                                  actual_reduction
                              ),
                              "direction_norm": (
                                  correction.direction_norm
                              ),
                              "latent_step_norm": (
                                  correction.latent_step_norm
                              ),
                              "correction_bits": (
                                  correction.correction_bits
                              ),
                              "sha_projection_error": (
                                  correction.sha_projection_error
                              ),
                              "chain_projection_error": (
                                  correction.chain_projection_error
                              ),
                              "condition_number": (
                                  correction.condition_number
                              ),
                              "max_direction_component": (
                                  correction.max_direction_component
                              ),
                          }
                      )
                      update_rows.append(
                          {
                              "iteration": iteration,
                              "latent_advanced": (
                                  correction.latent_step_norm > 0.0
                              ),
                              "binary_projection_changed": (
                                  correction.correction_bits > 0
                              ),
                              "full_joint_solution": True,
                              "coordinate_trials": 0,
                              "candidate_branches": 0,
                              "per_bit_enumeration": False,
                          }
                      )

                      if (
                          iteration == 1
                          or iteration % CHECKPOINT_EVERY == 0
                      ):
                          emit(
                              f"[joint iteration {iteration}] "
                              "full_joint_solution=True "
                              f"direction_norm={correction.direction_norm:.6g} "
                              f"latent_step_norm={correction.latent_step_norm:.6g} "
                              f"correction_bits={correction.correction_bits} "
                              f"predicted_reduction={correction.predicted_reduction:.6g} "
                              f"actual_reduction={actual_reduction:.6g} "
                              f"pow_delta={pow_ratio_reduction:.6g} "
                              f"pow_log2_ratio={current.pow_log2_ratio:.6g} "
                              f"energy={current.total_energy:.6f} "
                              "timestamp_target=False"
                          )
                          write_csv(TRACE_CSV, trace_rows)
                          write_csv(UPDATES_CSV, update_rows)
                          write_checkpoint(
                              iteration,
                              current,
                              correction,
                              anchor_height,
                              next_height,
                              next_bits,
                              mtp,
                              started,
                          )
                          write_diagnostic(
                              status, trace_rows
                          )

                  FINAL_HEADER.write_text(
                      current.header.hex() + "\n",
                      encoding="utf-8",
                  )
                  RESULT_JSON.write_text(
                      json.dumps(
                          {
                              "model_revision": MODEL_REVISION,
                              "anchor_height": anchor_height,
                              "anchor_hash": anchor_hash,
                              "next_height": next_height,
                              "next_protocol_coordinate": (
                                  protocol_coordinate(next_height)
                              ),
                              "header_hex": (
                                  current.header.hex()
                              ),
                              "displayed_hash": (
                                  current.displayed_hash
                              ),
                              "pow_target_hex": (
                                  f"{target:064x}"
                              ),
                              "pow_valid": (
                                  current.pow_valid
                              ),
                              "version": int.from_bytes(
                                  current.header[0:4], "little"
                              ),
                              "previous_hash": (
                                  current.header[4:36][::-1].hex()
                              ),
                              "merkle_root": (
                                  current.header[36:68][::-1].hex()
                              ),
                              "timestamp": current.timestamp,
                              "timestamp_was_solve_target": False,
                              "median_time_past": mtp,
                              "timestamp_mtp_valid": (
                                  current.timestamp_mtp_valid
                              ),
                              "bits": int.from_bytes(
                                  current.header[72:76], "little"
                              ),
                              "nonce": int.from_bytes(
                                  current.header[76:80], "little"
                              ),
                              "iterations": iteration,
                          },
                          indent=2,
                          sort_keys=True,
                      ),
                      encoding="utf-8",
                  )
                  write_csv(TRACE_CSV, trace_rows)
                  write_csv(UPDATES_CSV, update_rows)
                  write_checkpoint(
                      iteration,
                      current,
                      last_correction,
                      anchor_height,
                      next_height,
                      next_bits,
                      mtp,
                      started,
                  )

                  status.update(
                      {
                          "best_header_hex": best.header.hex(),
                          "best_displayed_hash": (
                              best.displayed_hash
                          ),
                          "best_pow_log2_ratio": (
                              best.pow_log2_ratio
                          ),
                          "best_total_energy": (
                              best.total_energy
                          ),
                      }
                  )
                  STATUS_JSON.write_text(
                      json.dumps(
                          status, indent=2, sort_keys=True
                      ),
                      encoding="utf-8",
                  )

                  REPORT.write_text(
                      "\n".join(
                          [
                              "BITCOIN SHA-256d 4D JOINT FORWARD RESULT",
                              "=" * 72,
                              f"Model revision: {MODEL_REVISION}",
                              f"Anchor height: {anchor_height}",
                              f"Anchor hash: {anchor_hash}",
                              f"Next height: {next_height}",
                              f"Next bits: {next_bits:08x}",
                              f"Header: {current.header.hex()}",
                              f"Hash: {current.displayed_hash}",
                              f"PoW valid: {current.pow_valid}",
                              f"Timestamp from solved header: {current.timestamp}",
                              "Timestamp used as solve target: False",
                              f"Median-time-past audit: {mtp}",
                              f"Timestamp MTP valid: {current.timestamp_mtp_valid}",
                              f"Iterations: {iteration}",
                          ]
                      )
                      + "\n",
                      encoding="utf-8",
                  )
                  write_diagnostic(status, trace_rows)
                  emit(REPORT.read_text(encoding="utf-8"))

              except Exception:
                  error_text = traceback.format_exc()
                  status.update(
                      {
                          "completed": False,
                          "error": error_text,
                          "elapsed_seconds": (
                              time.time() - started
                          ),
                      }
                  )
                  STATUS_JSON.write_text(
                      json.dumps(
                          status, indent=2, sort_keys=True
                      ),
                      encoding="utf-8",
                  )
                  write_csv(
                      TRACE_CSV,
                      trace_rows,
                      fieldnames=(
                          list(trace_rows[0].keys())
                          if trace_rows
                          else (
                              "iteration",
                              "candidate_header_hex",
                              "candidate_displayed_hash",
                              "pow_valid",
                              "pow_log2_ratio",
                          )
                      ),
                  )
                  write_csv(
                      UPDATES_CSV,
                      update_rows,
                      fieldnames=(
                          list(update_rows[0].keys())
                          if update_rows
                          else (
                              "iteration",
                              "latent_advanced",
                              "binary_projection_changed",
                              "full_joint_solution",
                          )
                      ),
                  )
                  write_diagnostic(
                      status, trace_rows, error_text
                  )
                  raise


          if __name__ == "__main__":
              main()
          PY

      - name: Publish model summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Bitcoin SHA-256d 4D Joint Forward Inference"
            echo
            if [[ -f bitcoin_sha256d_4d_joint_report.txt ]]; then
              cat bitcoin_sha256d_4d_joint_report.txt
            elif [[ -f bitcoin_sha256d_where_it_went_wrong.txt ]]; then
              sed -n '1,180p' bitcoin_sha256d_where_it_went_wrong.txt
            else
              echo "No report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all mathematical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            bitcoin_sha256d_4d_joint_console.log
            bitcoin_sha256d_4d_joint_trace.csv
            bitcoin_sha256d_4d_joint_updates.csv
            bitcoin_sha256d_4d_joint_checkpoint.json
            bitcoin_sha256d_next_joint_header.json
            bitcoin_sha256d_4d_joint_status.json
            bitcoin_sha256d_4d_model_spec.txt
            bitcoin_sha256d_where_it_went_wrong.txt
            bitcoin_protocol_trajectory.csv
            bitcoin_sha256d_tesseract_slots.csv
            bitcoin_sha256d_full_header_trajectory_seed.csv
            bitcoin_sha256d_next_header.hex
            bitcoin_sha256d_4d_joint_report.txt
