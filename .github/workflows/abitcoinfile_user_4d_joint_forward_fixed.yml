name: Bitcoin SHA-256d 4D Joint Forward Inference
run-name: Jointly infer the header after ${{ inputs.anchor_height }}

# The model preserves the user's 4D cell/slice/face/edge section operator.
# It combines the exact SHA-256d backward pullback with the observed chain
# continuation in one full hidden-coordinate least-squares system.
#
# No PCA, statistical principal line, timestamp forecast, historical target
# timestamp, known future hash, candidate frontier, top-k selection, per-bit
# enumeration, nonce interval loop, trust radius, runtime cap, iteration cap,
# or minimum/maximum step is used.

"on":
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string

      anchor_height:
        description: "Last observed block height; tip/current uses the current tip"
        required: false
        default: "tip"
        type: string

      anchor_hash:
        description: "Anchor displayed hash; auto derives it from anchor_height"
        required: false
        default: "auto"
        type: string

      api_base:
        description: "Esplora-compatible Bitcoin mainnet API base"
        required: false
        default: "https://blockstream.info/api"
        type: string

      lambda_sha:
        description: "Weight on exact SHA-256d pullback compatibility"
        required: false
        default: "1.0"
        type: string

      lambda_chain:
        description: "Weight on the observed full-header trajectory continuation"
        required: false
        default: "1.0"
        type: string

      checkpoint_every:
        description: "Write/print cadence only; not a solve limit"
        required: false
        default: "10"
        type: string

      artifact_name:
        description: "Uploaded artifact name"
        required: false
        default: "bitcoin-sha256d-user-4d-joint-forward"
        type: string

permissions:
  contents: read

concurrency:
  group: bitcoin-user-4d-joint-forward-${{ github.ref }}-${{ inputs.anchor_height }}
  cancel-in-progress: false

jobs:
  infer:
    runs-on: ${{ inputs.runner_label }}

    env:
      ANCHOR_HEIGHT_RAW: ${{ inputs.anchor_height }}
      ANCHOR_HASH_RAW: ${{ inputs.anchor_hash }}
      API_BASE: ${{ inputs.api_base }}
      LAMBDA_SHA_RAW: ${{ inputs.lambda_sha }}
      LAMBDA_CHAIN_RAW: ${{ inputs.lambda_chain }}
      CHECKPOINT_EVERY_RAW: ${{ inputs.checkpoint_every }}
      MODEL_REVISION: "2026-07-17-user-4d-sha-chain-joint-forward-r1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=2,<3"

      - name: Run the full 4D SHA-chain joint path
        id: solve
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' 2>&1 | tee bitcoin_sha256d_4d_joint_console.log
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import os
          import statistics
          import time
          import traceback
          import urllib.request
          from dataclasses import asdict, dataclass
          from itertools import combinations, product
          from pathlib import Path
          from typing import Any, Iterable, Optional, Sequence

          import numpy as np

          MODEL_REVISION = os.environ.get(
              "MODEL_REVISION",
              "2026-07-17-user-4d-sha-chain-joint-forward-r1",
          )
          API_BASE = os.environ.get(
              "API_BASE", "https://blockstream.info/api"
          ).rstrip("/")
          ANCHOR_HEIGHT_RAW = os.environ.get(
              "ANCHOR_HEIGHT_RAW", "tip"
          ).strip()
          ANCHOR_HASH_RAW = os.environ.get(
              "ANCHOR_HASH_RAW", "auto"
          ).strip()
          LAMBDA_SHA = float(os.environ.get("LAMBDA_SHA_RAW", "1.0"))
          LAMBDA_CHAIN = float(
              os.environ.get("LAMBDA_CHAIN_RAW", "1.0")
          )
          CHECKPOINT_EVERY = int(
              os.environ.get("CHECKPOINT_EVERY_RAW", "10")
          )

          if not math.isfinite(LAMBDA_SHA) or LAMBDA_SHA <= 0.0:
              raise ValueError("lambda_sha must be finite and positive")
          if not math.isfinite(LAMBDA_CHAIN) or LAMBDA_CHAIN <= 0.0:
              raise ValueError("lambda_chain must be finite and positive")
          if CHECKPOINT_EVERY <= 0:
              raise ValueError("checkpoint_every must be positive")

          MASK32 = 0xFFFFFFFF
          HEADER_BYTES = 80
          HEADER_BITS = 640
          HEADER_CHUNKS = 16
          CHUNK_BITS = 40
          RETARGET_INTERVAL = 2016
          TARGET_TIMESPAN = 14 * 24 * 60 * 60
          HALVING_INTERVAL = 210_000
          INITIAL_SUBSIDY_SATS = 50 * 100_000_000
          MAINNET_POW_LIMIT_BITS = 0x1D00FFFF

          FIELD_RANGES = {
              "version": (0, 4),
              "previous_hash": (4, 36),
              "merkle_root": (36, 68),
              "timestamp": (68, 72),
              "bits": (72, 76),
              "nonce": (76, 80),
          }

          # Previous hash and compact target are the next block's exact protocol
          # coordinates. Every other header field remains latent. Timestamp is not
          # treated differently from version, merkle root, or nonce.
          LATENT_FIELDS = (
              "version",
              "merkle_root",
              "timestamp",
              "nonce",
          )

          TRACE_CSV = Path("bitcoin_sha256d_4d_joint_trace.csv")
          UPDATES_CSV = Path("bitcoin_sha256d_4d_joint_updates.csv")
          CHECKPOINT_JSON = Path("bitcoin_sha256d_4d_joint_checkpoint.json")
          RESULT_JSON = Path("bitcoin_sha256d_next_joint_header.json")
          STATUS_JSON = Path("bitcoin_sha256d_4d_joint_status.json")
          MODEL_SPEC = Path("bitcoin_sha256d_4d_model_spec.txt")
          WHERE_WRONG = Path("bitcoin_sha256d_where_it_went_wrong.txt")
          PROTOCOL_CSV = Path("bitcoin_protocol_trajectory.csv")
          TESSERACT_CSV = Path("bitcoin_sha256d_tesseract_slots.csv")
          TRAJECTORY_SEED_CSV = Path(
              "bitcoin_sha256d_full_header_trajectory_seed.csv"
          )
          FINAL_HEADER = Path("bitcoin_sha256d_next_header.hex")
          REPORT = Path("bitcoin_sha256d_4d_joint_report.txt")

          H0 = [
              0x6A09E667,
              0xBB67AE85,
              0x3C6EF372,
              0xA54FF53A,
              0x510E527F,
              0x9B05688C,
              0x1F83D9AB,
              0x5BE0CD19,
          ]

          K = [
              0x428A2F98, 0x71374491, 0xB5C0FBCF, 0xE9B5DBA5,
              0x3956C25B, 0x59F111F1, 0x923F82A4, 0xAB1C5ED5,
              0xD807AA98, 0x12835B01, 0x243185BE, 0x550C7DC3,
              0x72BE5D74, 0x80DEB1FE, 0x9BDC06A7, 0xC19BF174,
              0xE49B69C1, 0xEFBE4786, 0x0FC19DC6, 0x240CA1CC,
              0x2DE92C6F, 0x4A7484AA, 0x5CB0A9DC, 0x76F988DA,
              0x983E5152, 0xA831C66D, 0xB00327C8, 0xBF597FC7,
              0xC6E00BF3, 0xD5A79147, 0x06CA6351, 0x14292967,
              0x27B70A85, 0x2E1B2138, 0x4D2C6DFC, 0x53380D13,
              0x650A7354, 0x766A0ABB, 0x81C2C92E, 0x92722C85,
              0xA2BFE8A1, 0xA81A664B, 0xC24B8B70, 0xC76C51A3,
              0xD192E819, 0xD6990624, 0xF40E3585, 0x106AA070,
              0x19A4C116, 0x1E376C08, 0x2748774C, 0x34B0BCB5,
              0x391C0CB3, 0x4ED8AA4A, 0x5B9CCA4F, 0x682E6FF3,
              0x748F82EE, 0x78A5636F, 0x84C87814, 0x8CC70208,
              0x90BEFFFA, 0xA4506CEB, 0xBEF9A3F7, 0xC67178F2,
          ]

          INTERIOR_COORDS = sorted(product((1, 2), repeat=4))


          @dataclass(frozen=True)
          class RoundState:
              round_index: int
              schedule_word: int
              state_in: tuple[int, ...]
              state_out: tuple[int, ...]


          @dataclass(frozen=True)
          class CompressionTrace:
              initial: tuple[int, ...]
              schedule: tuple[int, ...]
              rounds: tuple[RoundState, ...]
              output: tuple[int, ...]


          @dataclass(frozen=True)
          class Compatibility:
              state_edge_hamming: int
              schedule_edge_hamming: int
              pullback_header: bytes


          @dataclass(frozen=True)
          class HiddenSystem:
              bit_indices: tuple[int, ...]
              equation_names: tuple[str, ...]
              operator: np.ndarray
              rank: int


          @dataclass(frozen=True)
          class Evaluation:
              header: bytes
              digest_raw: bytes
              displayed_hash: str
              pow_value: int
              target: int
              pow_valid: bool
              pow_log2_ratio: float
              pow_projection_raw: bytes
              digest_projection_hamming: int
              compatibility: Compatibility
              sha_energy: float
              chain_energy: float
              total_energy: float
              timestamp: int
              timestamp_mtp_valid: bool


          @dataclass(frozen=True)
          class Correction:
              header: bytes
              latent_values: tuple[float, ...]
              correction_bits: int
              direction_norm: float
              latent_step_norm: float
              predicted_reduction: float
              sha_projection_error: float
              chain_projection_error: float
              condition_number: float
              max_direction_component: float


          def emit(message: str = "") -> None:
              print(message, flush=True)


          def http_text(path: str) -> str:
              request = urllib.request.Request(
                  f"{API_BASE}/{path.lstrip('/')}",
                  headers={
                      "User-Agent": "bitcoin-user-4d-joint-forward/1.0"
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8").strip()


          def http_json(path: str) -> Any:
              return json.loads(http_text(path))


          def resolve_anchor_height() -> int:
              cleaned = ANCHOR_HEIGHT_RAW.lower()
              if cleaned in {"", "tip", "current", "current_tip"}:
                  return int(http_text("/blocks/tip/height"))
              height = int(ANCHOR_HEIGHT_RAW)
              if height < 2:
                  raise ValueError(
                      "anchor_height must be at least 2 for path curvature"
                  )
              return height


          def resolve_hash(height: int) -> str:
              cleaned = ANCHOR_HASH_RAW.lower()
              if cleaned in {"", "auto", "derive", "from_height"}:
                  return http_text(f"/block-height/{height}")
              if len(cleaned) != 64:
                  raise ValueError(
                      "anchor_hash must contain exactly 64 hexadecimal characters"
                  )
              int(cleaned, 16)
              return cleaned


          def fetch_block(height: int) -> tuple[dict[str, Any], bytes]:
              block_hash = http_text(f"/block-height/{height}")
              metadata = dict(http_json(f"/block/{block_hash}"))
              header_hex = http_text(f"/block/{block_hash}/header").lower()
              if len(header_hex) != 160:
                  raise RuntimeError(
                      f"API returned an invalid header at height {height}"
                  )
              header = bytes.fromhex(header_hex)
              if displayed_hash(header) != block_hash:
                  raise RuntimeError(
                      f"header/hash validation failed at height {height}"
                  )
              metadata.setdefault("id", block_hash)
              metadata.setdefault("height", height)
              return metadata, header


          def rotr(value: int, amount: int) -> int:
              return (
                  (value >> amount)
                  | (value << (32 - amount))
              ) & MASK32


          def small_sigma0(value: int) -> int:
              return rotr(value, 7) ^ rotr(value, 18) ^ (value >> 3)


          def small_sigma1(value: int) -> int:
              return rotr(value, 17) ^ rotr(value, 19) ^ (value >> 10)


          def big_sigma0(value: int) -> int:
              return rotr(value, 2) ^ rotr(value, 13) ^ rotr(value, 22)


          def big_sigma1(value: int) -> int:
              return rotr(value, 6) ^ rotr(value, 11) ^ rotr(value, 25)


          def choose(x: int, y: int, z: int) -> int:
              return (x & y) ^ ((~x) & z)


          def majority(x: int, y: int, z: int) -> int:
              return (x & y) ^ (x & z) ^ (y & z)


          def words_from_bytes(data: bytes) -> list[int]:
              if len(data) % 4:
                  raise ValueError(
                      "word conversion requires a multiple of four bytes"
                  )
              return [
                  int.from_bytes(data[index : index + 4], "big")
                  for index in range(0, len(data), 4)
              ]


          def words_to_bytes(words: Sequence[int]) -> bytes:
              return b"".join(
                  (word & MASK32).to_bytes(4, "big")
                  for word in words
              )


          def expand_schedule(block64: bytes) -> list[int]:
              if len(block64) != 64:
                  raise ValueError(
                      "SHA-256 compression input must be exactly 64 bytes"
                  )
              schedule = words_from_bytes(block64)
              for index in range(16, 64):
                  schedule.append(
                      (
                          small_sigma1(schedule[index - 2])
                          + schedule[index - 7]
                          + small_sigma0(schedule[index - 15])
                          + schedule[index - 16]
                      )
                      & MASK32
                  )
              return schedule


          def compress(
              initial: Sequence[int], block64: bytes
          ) -> CompressionTrace:
              schedule = expand_schedule(block64)
              a, b, c, d, e, f, g, h = [
                  value & MASK32 for value in initial
              ]
              rounds: list[RoundState] = []

              for index in range(64):
                  state_in = (a, b, c, d, e, f, g, h)
                  t1 = (
                      h
                      + big_sigma1(e)
                      + choose(e, f, g)
                      + K[index]
                      + schedule[index]
                  ) & MASK32
                  t2 = (
                      big_sigma0(a) + majority(a, b, c)
                  ) & MASK32
                  state_out = (
                      (t1 + t2) & MASK32,
                      a,
                      b,
                      c,
                      (d + t1) & MASK32,
                      e,
                      f,
                      g,
                  )
                  rounds.append(
                      RoundState(
                          index,
                          schedule[index],
                          state_in,
                          state_out,
                      )
                  )
                  a, b, c, d, e, f, g, h = state_out

              output = tuple(
                  (initial[index] + value) & MASK32
                  for index, value in enumerate(
                      (a, b, c, d, e, f, g, h)
                  )
              )
              return CompressionTrace(
                  tuple(initial),
                  tuple(schedule),
                  tuple(rounds),
                  output,
              )


          def sha256d_trace(
              header: bytes,
          ) -> tuple[
              bytes,
              tuple[
                  CompressionTrace,
                  CompressionTrace,
                  CompressionTrace,
              ],
          ]:
              if len(header) != HEADER_BYTES:
                  raise ValueError(
                      "Bitcoin header must contain exactly 80 bytes"
                  )
              block0 = header[:64]
              block1 = (
                  header[64:]
                  + b"\x80"
                  + b"\x00" * 39
                  + (HEADER_BYTES * 8).to_bytes(8, "big")
              )
              trace0 = compress(H0, block0)
              trace1 = compress(trace0.output, block1)
              inner = words_to_bytes(trace1.output)
              block2 = (
                  inner
                  + b"\x80"
                  + b"\x00" * 23
                  + (256).to_bytes(8, "big")
              )
              trace2 = compress(H0, block2)
              return words_to_bytes(trace2.output), (
                  trace0,
                  trace1,
                  trace2,
              )


          def independent_digest(header: bytes) -> bytes:
              return hashlib.sha256(
                  hashlib.sha256(header).digest()
              ).digest()


          def displayed_hash(header: bytes) -> str:
              return independent_digest(header)[::-1].hex()


          def inverse_round(
              state_out: Sequence[int],
              schedule_word: int,
              round_index: int,
          ) -> tuple[int, ...]:
              ap, bp, cp, dp, ep, fp, gp, hp = [
                  value & MASK32 for value in state_out
              ]
              a, b, c = bp, cp, dp
              e, f, g = fp, gp, hp
              t2 = (
                  big_sigma0(a) + majority(a, b, c)
              ) & MASK32
              t1 = (ap - t2) & MASK32
              d = (ep - t1) & MASK32
              h = (
                  t1
                  - big_sigma1(e)
                  - choose(e, f, g)
                  - K[round_index]
                  - schedule_word
              ) & MASK32
              return a, b, c, d, e, f, g, h


          def backward_states(
              trace: CompressionTrace,
              desired_output: Sequence[int],
          ) -> tuple[tuple[int, ...], ...]:
              working_end = tuple(
                  (
                      desired_output[index]
                      - trace.initial[index]
                  )
                  & MASK32
                  for index in range(8)
              )
              states: list[Optional[tuple[int, ...]]] = [None] * 65
              states[64] = working_end
              for index in reversed(range(64)):
                  states[index] = inverse_round(
                      states[index + 1],  # type: ignore[arg-type]
                      trace.schedule[index],
                      index,
                  )
              return tuple(
                  tuple(state)
                  for state in states
                  if state is not None
              )


          def required_schedule_word(
              forward_state_in: Sequence[int],
              desired_state_out: Sequence[int],
              round_index: int,
          ) -> int:
              a, b, c, _d, e, f, g, h = [
                  value & MASK32 for value in forward_state_in
              ]
              desired_a_out = desired_state_out[0] & MASK32
              t2 = (
                  big_sigma0(a) + majority(a, b, c)
              ) & MASK32
              required_t1 = (desired_a_out - t2) & MASK32
              return (
                  required_t1
                  - h
                  - big_sigma1(e)
                  - choose(e, f, g)
                  - K[round_index]
              ) & MASK32


          def hamming_word(left: int, right: int) -> int:
              return (
                  (left ^ right) & MASK32
              ).bit_count()


          def hamming_bytes(left: bytes, right: bytes) -> int:
              if len(left) != len(right):
                  raise ValueError(
                      "hamming_bytes requires equal-length values"
                  )
              return sum(
                  (a ^ b).bit_count()
                  for a, b in zip(left, right)
              )


          def hamming_state(
              left: Sequence[int], right: Sequence[int]
          ) -> int:
              return sum(
                  hamming_word(a, b)
                  for a, b in zip(left, right)
              )


          def derive_compatibility(
              traces: tuple[
                  CompressionTrace,
                  CompressionTrace,
                  CompressionTrace,
              ],
              projected_digest_raw: bytes,
          ) -> Compatibility:
              trace0, trace1, trace2 = traces
              desired_digest_words = words_from_bytes(
                  projected_digest_raw
              )

              backward2 = backward_states(
                  trace2, desired_digest_words
              )
              required2 = tuple(
                  required_schedule_word(
                      trace2.rounds[index].state_in,
                      backward2[index + 1],
                      index,
                  )
                  for index in range(64)
              )

              desired_inner = required2[:8]
              backward1 = backward_states(trace1, desired_inner)
              required1 = tuple(
                  required_schedule_word(
                      trace1.rounds[index].state_in,
                      backward1[index + 1],
                      index,
                  )
                  for index in range(64)
              )

              desired_phase0_output = backward1[0]
              backward0 = backward_states(
                  trace0, desired_phase0_output
              )
              required0 = tuple(
                  required_schedule_word(
                      trace0.rounds[index].state_in,
                      backward0[index + 1],
                      index,
                  )
                  for index in range(64)
              )

              state_edge_hamming = 0
              schedule_edge_hamming = 0
              for trace, backward, required in (
                  (trace0, backward0, required0),
                  (trace1, backward1, required1),
                  (trace2, backward2, required2),
              ):
                  forward_boundaries = (
                      [trace.rounds[0].state_in]
                      + [row.state_out for row in trace.rounds]
                  )
                  state_edge_hamming += sum(
                      hamming_state(forward, wanted)
                      for forward, wanted in zip(
                          forward_boundaries, backward
                      )
                  )
                  schedule_edge_hamming += sum(
                      hamming_word(actual, wanted)
                      for actual, wanted in zip(
                          trace.schedule, required
                      )
                  )

              pullback_header = (
                  words_to_bytes(required0[:16])
                  + words_to_bytes(required1[:4])
              )
              if len(pullback_header) != HEADER_BYTES:
                  raise RuntimeError(
                      "SHA pullback did not produce an 80-byte header"
                  )
              return Compatibility(
                  state_edge_hamming,
                  schedule_edge_hamming,
                  pullback_header,
              )


          def compact_to_target(bits: int) -> int:
              exponent = bits >> 24
              mantissa = bits & 0x007FFFFF
              if bits & 0x00800000:
                  raise ValueError(
                      "negative compact targets are invalid"
                  )
              if exponent <= 3:
                  return mantissa >> (8 * (3 - exponent))
              return mantissa << (8 * (exponent - 3))


          def target_to_compact(target: int) -> int:
              if target <= 0:
                  raise ValueError("target must be positive")
              size = (target.bit_length() + 7) // 8
              if size <= 3:
                  compact = target << (8 * (3 - size))
              else:
                  compact = target >> (8 * (size - 3))
              compact &= 0xFFFFFF
              if compact & 0x00800000:
                  compact >>= 8
                  size += 1
              return (size << 24) | compact


          def derive_next_bits(
              anchor_height: int,
              anchor_metadata: dict[str, Any],
          ) -> int:
              next_height = anchor_height + 1
              current_bits = int(anchor_metadata["bits"])
              if next_height % RETARGET_INTERVAL:
                  return current_bits

              epoch_start_height = (
                  next_height - RETARGET_INTERVAL
              )
              epoch_start, _header = fetch_block(epoch_start_height)
              actual_timespan = (
                  int(anchor_metadata["timestamp"])
                  - int(epoch_start["timestamp"])
              )
              clamped = min(
                  max(actual_timespan, TARGET_TIMESPAN // 4),
                  TARGET_TIMESPAN * 4,
              )
              previous_target = compact_to_target(current_bits)
              pow_limit = compact_to_target(
                  MAINNET_POW_LIMIT_BITS
              )
              next_target = min(
                  pow_limit,
                  previous_target * clamped // TARGET_TIMESPAN,
              )
              return target_to_compact(next_target)


          def block_subsidy_sats(height: int) -> int:
              if height < 0:
                  raise ValueError("height must be nonnegative")
              return INITIAL_SUBSIDY_SATS >> (
                  height // HALVING_INTERVAL
              )


          def issued_before_height(height: int) -> int:
              remaining = max(0, height)
              total = 0
              era = 0
              while remaining:
                  subsidy = INITIAL_SUBSIDY_SATS >> era
                  if subsidy == 0:
                      break
                  count = min(remaining, HALVING_INTERVAL)
                  total += count * subsidy
                  remaining -= count
                  era += 1
              return total


          def protocol_coordinate(height: int) -> dict[str, Any]:
              subsidy = block_subsidy_sats(height)
              issued = issued_before_height(height)
              return {
                  "height": height,
                  "halving_era": height // HALVING_INTERVAL,
                  "era_phase": (
                      height % HALVING_INTERVAL
                  ) / HALVING_INTERVAL,
                  "subsidy_sats": subsidy,
                  "subsidy_btc": subsidy / 100_000_000,
                  "issued_before_sats": issued,
                  "issued_before_btc": issued / 100_000_000,
              }


          def get_bit(data: bytes, bit: int) -> int:
              byte_index, offset = divmod(bit, 8)
              return (
                  data[byte_index] >> (7 - offset)
              ) & 1


          def put_bit(
              data: bytearray, bit: int, value: int
          ) -> None:
              byte_index, offset = divmod(bit, 8)
              mask = 1 << (7 - offset)
              if value:
                  data[byte_index] |= mask
              else:
                  data[byte_index] &= ~mask


          def field_bits(
              field_names: Sequence[str],
          ) -> set[int]:
              result: set[int] = set()
              for name in field_names:
                  start, end = FIELD_RANGES[name]
                  result.update(range(start * 8, end * 8))
              return result


          def hidden_values(
              header: bytes, bit_indices: Sequence[int]
          ) -> np.ndarray:
              return np.asarray(
                  [get_bit(header, bit) for bit in bit_indices],
                  dtype=np.float64,
              )


          def materialize(
              observation: bytes,
              bit_indices: Sequence[int],
              values: Sequence[int],
          ) -> bytes:
              result = bytearray(observation)
              for bit, value in zip(bit_indices, values):
                  put_bit(result, bit, int(value))
              return bytes(result)


          def build_next_observation(
              anchor_header: bytes,
              anchor_hash: str,
              next_bits: int,
              hidden: set[int],
          ) -> bytes:
              candidate = bytearray(anchor_header)
              candidate[4:36] = bytes.fromhex(anchor_hash)[::-1]
              candidate[72:76] = next_bits.to_bytes(4, "little")
              for bit in hidden:
                  put_bit(candidate, bit, 0)
              return bytes(candidate)


          def joint_section_system(
          ) -> tuple[tuple[str, ...], np.ndarray]:
              names: list[str] = []
              rows: list[np.ndarray] = []

              def add(
                  name: str, selected_chunks: Iterable[int]
              ) -> None:
                  selected = tuple(sorted(set(selected_chunks)))
                  if not selected:
                      return
                  row = np.zeros(
                      HEADER_CHUNKS, dtype=np.float64
                  )
                  row[list(selected)] = 1.0
                  row /= math.sqrt(float(len(selected)))
                  names.append(name)
                  rows.append(row)

              add("complete_interior", range(HEADER_CHUNKS))

              for index, coordinate in enumerate(
                  INTERIOR_COORDS
              ):
                  add(f"cell_{coordinate}", [index])

              for axis in range(4):
                  for value in (1, 2):
                      add(
                          f"axis_{axis}_slice_{value}",
                          [
                              index
                              for index, coordinate
                              in enumerate(INTERIOR_COORDS)
                              if coordinate[axis] == value
                          ],
                      )

              for axis_a, axis_b in combinations(range(4), 2):
                  for value_a in (1, 2):
                      for value_b in (1, 2):
                          add(
                              (
                                  f"face_{axis_a}_{axis_b}_"
                                  f"{value_a}_{value_b}"
                              ),
                              [
                                  index
                                  for index, coordinate
                                  in enumerate(INTERIOR_COORDS)
                                  if (
                                      coordinate[axis_a] == value_a
                                      and coordinate[axis_b] == value_b
                                  )
                              ],
                          )

              for left in range(HEADER_CHUNKS):
                  for right in range(left + 1, HEADER_CHUNKS):
                      distance = sum(
                          a != b
                          for a, b in zip(
                              INTERIOR_COORDS[left],
                              INTERIOR_COORDS[right],
                          )
                      )
                      if distance == 1:
                          add(
                              f"edge_{left}_{right}",
                              [left, right],
                          )

              matrix = np.vstack(rows)
              if (
                  np.linalg.matrix_rank(matrix)
                  != HEADER_CHUNKS
              ):
                  raise RuntimeError(
                      "the complete 4D section operator is not full rank"
                  )
              return tuple(names), matrix


          JOINT_NAMES, JOINT_MATRIX = joint_section_system()


          def build_hidden_system(
              hidden: set[int],
          ) -> HiddenSystem:
              bit_indices = tuple(sorted(hidden))
              if not bit_indices:
                  raise ValueError(
                      "the next header must contain latent coordinates"
                  )
              column_by_bit = {
                  bit: index
                  for index, bit in enumerate(bit_indices)
              }
              names: list[str] = []
              rows: list[np.ndarray] = []

              for section_index, section_name in enumerate(
                  JOINT_NAMES
              ):
                  selected_chunks = tuple(
                      int(index)
                      for index in np.flatnonzero(
                          JOINT_MATRIX[section_index] != 0.0
                      )
                  )
                  for plane in range(CHUNK_BITS):
                      selected_columns = [
                          column_by_bit[chunk * CHUNK_BITS + plane]
                          for chunk in selected_chunks
                          if (
                              chunk * CHUNK_BITS + plane
                              in column_by_bit
                          )
                      ]
                      if not selected_columns:
                          continue
                      row = np.zeros(
                          len(bit_indices), dtype=np.float64
                      )
                      row[selected_columns] = (
                          1.0
                          / math.sqrt(
                              float(len(selected_columns))
                          )
                      )
                      names.append(
                          f"{section_name}:plane_{plane}"
                      )
                      rows.append(row)

              operator = np.vstack(rows)
              rank = int(np.linalg.matrix_rank(operator))
              if rank != len(bit_indices):
                  raise RuntimeError(
                      "hidden 4D operator is rank deficient: "
                      f"rank={rank} dimension={len(bit_indices)}"
                  )
              return HiddenSystem(
                  bit_indices,
                  tuple(names),
                  operator,
                  rank,
              )


          def full_header_curve_target(
              older_header: bytes,
              previous_header: bytes,
              anchor_header: bytes,
              bit_indices: Sequence[int],
          ) -> np.ndarray:
              older = hidden_values(
                  older_header, bit_indices
              )
              previous = hidden_values(
                  previous_header, bit_indices
              )
              anchor = hidden_values(
                  anchor_header, bit_indices
              )

              previous_velocity = previous - older
              current_velocity = anchor - previous
              curvature = (
                  current_velocity - previous_velocity
              )

              # One complete second-order continuation of the observed path.
              # Timestamp is not isolated or supplied as a scalar prediction.
              return (
                  anchor
                  + current_velocity
                  + 0.5 * curvature
              )


          def pow_projection(
              digest_raw: bytes, target: int
          ) -> tuple[int, bool, bytes, float]:
              value = int.from_bytes(digest_raw, "little")
              valid = value <= target
              if valid:
                  projected = digest_raw
                  ratio = 0.0
              else:
                  projected = target.to_bytes(32, "little")
                  ratio = math.log2(value / target)
              return value, valid, projected, ratio


          def evaluate(
              header: bytes,
              target: int,
              mtp: int,
              system: HiddenSystem,
              trajectory_target: np.ndarray,
          ) -> Evaluation:
              digest_raw, traces = sha256d_trace(header)
              if digest_raw != independent_digest(header):
                  raise RuntimeError(
                      "internal SHA-256d trace disagrees with hashlib"
                  )

              (
                  pow_value,
                  pow_valid,
                  projected_digest,
                  pow_log2_ratio,
              ) = pow_projection(digest_raw, target)
              compatibility = derive_compatibility(
                  traces, projected_digest
              )
              digest_projection_hamming = hamming_bytes(
                  digest_raw, projected_digest
              )
              sha_energy = float(
                  compatibility.state_edge_hamming
                  + compatibility.schedule_edge_hamming
                  + digest_projection_hamming
              )

              current_values = hidden_values(
                  header, system.bit_indices
              )
              chain_residual = (
                  trajectory_target - current_values
              )
              projected_chain_residual = (
                  system.operator @ chain_residual
              )
              chain_energy = float(
                  np.dot(
                      projected_chain_residual,
                      projected_chain_residual,
                  )
              )

              total_energy = (
                  LAMBDA_SHA * sha_energy
                  + LAMBDA_CHAIN * chain_energy
              )
              timestamp = int.from_bytes(
                  header[68:72], "little"
              )

              return Evaluation(
                  header=header,
                  digest_raw=digest_raw,
                  displayed_hash=digest_raw[::-1].hex(),
                  pow_value=pow_value,
                  target=target,
                  pow_valid=pow_valid,
                  pow_log2_ratio=pow_log2_ratio,
                  pow_projection_raw=projected_digest,
                  digest_projection_hamming=(
                      digest_projection_hamming
                  ),
                  compatibility=compatibility,
                  sha_energy=sha_energy,
                  chain_energy=chain_energy,
                  total_energy=total_energy,
                  timestamp=timestamp,
                  timestamp_mtp_valid=timestamp > mtp,
              )


          def solve_joint_direction(
              evaluation: Evaluation,
              observation: bytes,
              system: HiddenSystem,
              trajectory_target: np.ndarray,
              latent: np.ndarray,
          ) -> Correction:
              pullback_values = hidden_values(
                  evaluation.compatibility.pullback_header,
                  system.bit_indices,
              )
              sha_residual = pullback_values - latent
              chain_residual = trajectory_target - latent

              sha_sections = (
                  system.operator @ sha_residual
              )
              chain_sections = (
                  system.operator @ chain_residual
              )

              joint_operator = np.vstack(
                  (
                      math.sqrt(LAMBDA_SHA) * system.operator,
                      math.sqrt(LAMBDA_CHAIN) * system.operator,
                  )
              )
              joint_target = np.concatenate(
                  (
                      math.sqrt(LAMBDA_SHA) * sha_sections,
                      math.sqrt(LAMBDA_CHAIN) * chain_sections,
                  )
              )

              (
                  direction,
                  _residuals,
                  _rank,
                  singular_values,
              ) = np.linalg.lstsq(
                  joint_operator, joint_target, rcond=None
              )
              if not np.all(np.isfinite(direction)):
                  raise RuntimeError(
                      "the full joint direction contains a non-finite value"
                  )

              direction_norm = float(np.linalg.norm(direction))
              if direction_norm == 0.0:
                  raise RuntimeError(
                      "the complete coupled equations reached a zero "
                      "direction before a protocol-valid proof-of-work header"
                  )

              next_latent = latent + direction
              binary_values = (
                  next_latent >= 0.5
              ).astype(np.int8)
              current_binary = hidden_values(
                  evaluation.header, system.bit_indices
              ).astype(np.int8)
              correction_bits = int(
                  np.sum(binary_values != current_binary)
              )
              next_header = materialize(
                  observation,
                  system.bit_indices,
                  binary_values,
              )

              modeled_before = float(
                  np.dot(joint_target, joint_target)
              )
              modeled_after_vector = (
                  joint_operator @ direction - joint_target
              )
              modeled_after = float(
                  np.dot(
                      modeled_after_vector,
                      modeled_after_vector,
                  )
              )
              predicted_reduction = (
                  modeled_before - modeled_after
              )

              sha_projection_error = float(
                  np.linalg.norm(
                      system.operator @ direction
                      - sha_sections
                  )
              )
              chain_projection_error = float(
                  np.linalg.norm(
                      system.operator @ direction
                      - chain_sections
                  )
              )

              if singular_values.size:
                  largest = float(
                      np.max(singular_values)
                  )
                  smallest = float(
                      np.min(singular_values)
                  )
                  condition_number = (
                      largest / smallest
                      if smallest > 0.0
                      else float("inf")
                  )
              else:
                  condition_number = float("inf")

              return Correction(
                  header=next_header,
                  latent_values=tuple(
                      float(value) for value in next_latent
                  ),
                  correction_bits=correction_bits,
                  direction_norm=direction_norm,
                  latent_step_norm=float(
                      np.linalg.norm(next_latent - latent)
                  ),
                  predicted_reduction=predicted_reduction,
                  sha_projection_error=sha_projection_error,
                  chain_projection_error=chain_projection_error,
                  condition_number=condition_number,
                  max_direction_component=float(
                      np.max(np.abs(direction))
                  ),
              )


          def median_time_past(
              metadata_rows: Sequence[dict[str, Any]],
          ) -> int:
              timestamps = [
                  int(row["timestamp"])
                  for row in metadata_rows[-11:]
              ]
              return int(statistics.median(timestamps))


          def write_csv(
              path: Path,
              rows: Sequence[dict[str, Any]],
              fieldnames: Optional[Sequence[str]] = None,
          ) -> None:
              if not rows and fieldnames is None:
                  path.write_text("", encoding="utf-8")
                  return
              names = list(
                  fieldnames
                  if fieldnames is not None
                  else rows[0].keys()
              )
              with path.open(
                  "w", newline="", encoding="utf-8"
              ) as handle:
                  writer = csv.DictWriter(
                      handle, fieldnames=names
                  )
                  writer.writeheader()
                  writer.writerows(rows)


          def tesseract_rows() -> list[dict[str, Any]]:
              all_coordinates = list(
                  product(range(4), repeat=4)
              )
              interior = set(INTERIOR_COORDS)
              surface = sorted(
                  value
                  for value in all_coordinates
                  if value not in interior
              )
              rows: list[dict[str, Any]] = []
              for index, coordinate in enumerate(
                  INTERIOR_COORDS
              ):
                  rows.append(
                      {
                          "a": coordinate[0],
                          "b": coordinate[1],
                          "c": coordinate[2],
                          "d": coordinate[3],
                          "region": "interior_header",
                          "slot": index,
                          "semantic": (
                              f"header_chunk_{index:02d}_"
                              f"bits_{index * CHUNK_BITS}:"
                              f"{(index + 1) * CHUNK_BITS}"
                          ),
                      }
                  )
              for index, coordinate in enumerate(surface):
                  rows.append(
                      {
                          "a": coordinate[0],
                          "b": coordinate[1],
                          "c": coordinate[2],
                          "d": coordinate[3],
                          "region": "surface_constraint",
                          "slot": index,
                          "semantic": (
                              f"sha_protocol_surface_{index}"
                          ),
                      }
                  )
              return rows


          def write_model_spec() -> None:
              MODEL_SPEC.write_text(
                  """BITCOIN SHA-256d USER 4D JOINT FORWARD MODEL
          =================================================

          Complete state
          --------------
          The next serialized block header remains the 80-byte, 640-bit protocol
          container. The previous-block hash and compact target are exact visible
          protocol coordinates. Version, merkle root, timestamp, and nonce are one
          joint hidden state z in R^k.

          Timestamp rule
          --------------
          There is no timestamp forecast, timestamp equality, historical timestamp
          target, timestamp bit selector, timestamp penalty, timestamp warm-up, or
          timestamp correction direction. Timestamp is carried only as part of z.
          It is decoded after the complete header produces proof of work. Median time
          past is then an audit of the completed coordinate, not an equation used to
          manufacture the timestamp.

          Exact protocol trajectory
          -------------------------
          Height is the chain traversal coordinate:

              h_next = h_anchor + 1
              era(h) = floor(h / 210000)
              subsidy(h) = floor_satoshi(50 BTC / 2^era(h))
              issued(h) = sum_(j=0)^(h-1) subsidy(j)

          The next previous-hash coordinate is the anchor hash. The next compact
          difficulty coordinate is copied within an epoch and calculated by the exact
          2016-block retarget equation at an epoch boundary.

          Observed full-header curve
          --------------------------
          Let u_(n-2), u_(n-1), u_n be the hidden coordinates of the last three
          observed headers. The complete second-order continuation is

              v_(n-1) = u_(n-1) - u_(n-2)
              v_n     = u_n - u_(n-1)
              a_n     = v_n - v_(n-1)
              r_chain = u_n + v_n + (1/2)a_n - z_t.

          This continuation is applied to the complete hidden state. Timestamp is not
          separated or supplied as an independently predicted scalar.

          Exact SHA-256d pullback
          -----------------------
          For the current header y_t, compute the exact three-compression SHA-256d
          trace. Let T be the protocol target. The digest projection is

              q_t = SHA256d(y_t),                         if uint256(q_t) <= T
                    little_endian_256(T),                 otherwise.

          Back-propagate q_t through the inverse round equations and restrict the
          resulting 80-byte pullback to the hidden state:

              r_SHA = R_H(B(F(y_t), q_t)) - z_t.

          User 4D joint equation
          ----------------------
          S_H is the user's complete cell/slice/face/edge operator over the sixteen
          40-bit header chunks, restricted to the actual hidden coordinates. The
          whole correction is solved simultaneously:

              delta_t = argmin_delta [
                  lambda_SHA
                    ||S_H delta - S_H r_SHA||_2^2
                  + lambda_chain
                    ||S_H delta - S_H r_chain||_2^2
              ].

          The latent trajectory is persistent:

              z_(t+1) = z_t + delta_t
              u_(t+1) = 1[z_(t+1) >= 1/2].

          No coordinate is tested separately. There is no candidate frontier, top-k
          truncation, per-bit retry, nonce interval, trust radius, step floor, step
          ceiling, runtime cap, or iteration cap.

          Completion
          ----------
          Completion requires independent hashlib validation of

              uint256_little_endian(SHA256d(header)) <= T

          with the exact anchor linkage and compact target still fixed. Timestamp is
          reported from that completed header and median-time-past validity is audited
          only after proof of work has emerged.
          """,
                  encoding="utf-8",
              )


          def write_protocol_rows(
              anchor_height: int,
              next_height: int,
              next_bits: int,
              anchor_hash: str,
          ) -> None:
              rows = []
              for height in (
                  max(0, anchor_height - 1),
                  anchor_height,
                  next_height,
              ):
                  coordinate = protocol_coordinate(height)
                  coordinate.update(
                      {
                          "role": (
                              "inferred_next"
                              if height == next_height
                              else "observed"
                          ),
                          "previous_hash_constraint": (
                              anchor_hash
                              if height == next_height
                              else ""
                          ),
                          "bits_constraint": (
                              f"{next_bits:08x}"
                              if height == next_height
                              else ""
                          ),
                      }
                  )
                  rows.append(coordinate)
              write_csv(PROTOCOL_CSV, rows)


          def write_trajectory_seed(
              headers: Sequence[bytes],
              heights: Sequence[int],
              system: HiddenSystem,
              target: np.ndarray,
          ) -> None:
              rows: list[dict[str, Any]] = []
              for coordinate, bit in enumerate(
                  system.bit_indices
              ):
                  row: dict[str, Any] = {
                      "coordinate": coordinate,
                      "header_bit_index": bit,
                      "chunk": bit // CHUNK_BITS,
                      "bit_plane": bit % CHUNK_BITS,
                  }
                  for height, header in zip(heights, headers):
                      row[f"height_{height}"] = get_bit(
                          header, bit
                      )
                  row["curve_target"] = float(
                      target[coordinate]
                  )
                  rows.append(row)
              write_csv(TRAJECTORY_SEED_CSV, rows)


          def write_checkpoint(
              iteration: int,
              evaluation: Evaluation,
              correction: Optional[Correction],
              anchor_height: int,
              next_height: int,
              next_bits: int,
              mtp: int,
              started: float,
          ) -> None:
              payload = {
                  "model_revision": MODEL_REVISION,
                  "iteration": iteration,
                  "anchor_height": anchor_height,
                  "next_height": next_height,
                  "next_bits": f"{next_bits:08x}",
                  "target_hex": f"{evaluation.target:064x}",
                  "candidate_header_hex": (
                      evaluation.header.hex()
                  ),
                  "candidate_displayed_hash": (
                      evaluation.displayed_hash
                  ),
                  "pow_valid": evaluation.pow_valid,
                  "pow_log2_ratio": (
                      evaluation.pow_log2_ratio
                  ),
                  "timestamp_from_candidate": (
                      evaluation.timestamp
                  ),
                  "timestamp_used_as_solve_target": False,
                  "median_time_past": mtp,
                  "timestamp_mtp_valid": (
                      evaluation.timestamp_mtp_valid
                  ),
                  "sha_energy": evaluation.sha_energy,
                  "chain_energy": evaluation.chain_energy,
                  "total_energy": evaluation.total_energy,
                  "elapsed_seconds": time.time() - started,
                  "correction": (
                      asdict(correction)
                      if correction is not None
                      else None
                  ),
              }
              if correction is not None:
                  payload["correction"]["header"] = (
                      correction.header.hex()
                  )
              CHECKPOINT_JSON.write_text(
                  json.dumps(payload, indent=2, sort_keys=True),
                  encoding="utf-8",
              )


          def write_diagnostic(
              status: dict[str, Any],
              trace_rows: Sequence[dict[str, Any]],
              error_text: Optional[str] = None,
          ) -> None:
              latest = trace_rows[-1] if trace_rows else {}
              lines = [
                  "BITCOIN SHA-256d — WHERE THE JOINT PATH WENT WRONG",
                  "=" * 76,
                  f"Model revision: {MODEL_REVISION}",
                  "",
                  "Model invariants",
                  "----------------",
                  "- User cell/slice/face/edge operator retained.",
                  "- Exact SHA-256d forward trace and inverse-round pullback retained.",
                  "- Full chain-header continuation retained in the same joint system.",
                  "- Timestamp solve target: absent.",
                  "- Known future hash: absent.",
                  "- Runtime/iteration/step caps: absent.",
                  "- Candidate branching/per-bit enumeration: absent.",
                  "",
                  "Latest recorded state",
                  "---------------------",
                  json.dumps(latest, indent=2, sort_keys=True),
                  "",
                  "Status",
                  "------",
                  json.dumps(status, indent=2, sort_keys=True),
              ]
              if error_text:
                  lines.extend(
                      [
                          "",
                          "Execution error",
