name: Architecture Verification (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Map Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (if present)
        run: pnpm run --if-present build

      - name: Map Codebase Architecture
        run: |
          mkdir -p reports
          pnpm add -D dependency-cruiser
          
          # Generates a minimal config file on the fly so dependency-cruiser stops crashing
          echo "module.exports = { options: { exclude: { path: '^(node_modules|\.next|\.git|dist|reports)' } } };" > .dependency-cruiser.js
          
          # Generate JSON map
          pnpm exec depcruise . --output-type json > reports/architecture-map.json
          
          # Generate Markdown map
          pnpm exec depcruise . --output-type markdown > reports/architecture-map.md

      - name: Print Report to Log
        if: always()
        run: |
          echo "::group::Architecture Report"
          cat reports/architecture-map.md
          echo "::endgroup::"

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: |
            reports/architecture-map.md
            reports/architecture-map.json
