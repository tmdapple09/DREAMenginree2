name: Architecture Verification (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Verify Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (if present)
        run: pnpm run --if-present build

      - name: Run Architecture Verifier
        run: |
          node tools/architecture-verifier/index.mjs \
            --repo . \
            --format markdown,json \
            --fail-on violation || true

      - name: Print Report to Log
        if: always()
        run: |
          echo "::group::Architecture Report"
          cat reports/architecture.md
          echo "::endgroup::"

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: |
            reports/architecture.md
            reports/architecture.json
