      - name: Print behavior tree
        shell: bash
        run: |
          set -euo pipefail
          cat build/ceedlotus-tree/BEHAVIOR_GRAPH.txt

      - name: Publish tree to job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## CeedLotus Behavior Tree'
            echo
            echo '```text'
            cat build/ceedlotus-tree/BEHAVIOR_GRAPH.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload behavior tree
        uses: actions/upload-artifact@v6
        with:
          name: ceedlotus-behavior-tree-${{ github.sha }}
          path: |
            build/ceedlotus-tree/BEHAVIOR_GRAPH.txt
            build/ceedlotus-tree/BEHAVIOR_GRAPH.json
            build/ceedlotus-tree/BEHAVIOR_GRAPH_MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
