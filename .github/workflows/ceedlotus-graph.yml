name: CeedLotus Tree

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ceedlotus-tree-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-tree:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install project dependencies (exact lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Generate behavior graph and ASCII tree
        shell: bash
        run: |
          set -euo pipefail
          cat > ceedlotus-tree.ts <<'SCRIPT'
          import { Project, ts } from "ts-morph";
          import * as fs from "node:fs";
          import * as path from "node:path";
          import * as crypto from "node:crypto";

          const workspace = process.env.GITHUB_WORKSPACE!;
          const sourceRoot = workspace;
          const treeOutputRoot = path.join(sourceRoot, "build", "ceedlotus-tree");
          const behaviorGraphJsonPath = path.join(treeOutputRoot, "BEHAVIOR_GRAPH.json");
          const behaviorGraphTextPath = path.join(treeOutputRoot, "BEHAVIOR_GRAPH.txt");
          const behaviorGraphManifestPath = path.join(treeOutputRoot, "BEHAVIOR_GRAPH_MANIFEST.txt");

          // ----------------------------------------------------------------
          //  File discovery
          // ----------------------------------------------------------------
          const supportedExtensions = new Set([
            ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"
          ]);
          const excludedDirectoryNames = new Set([
            ".git", ".github", ".next", ".nuxt", ".output", ".cache",
            ".parcel-cache", ".turbo", ".vercel", "node_modules", "vendor",
            "vendors", "third_party", "third-party", "external", "build",
            "dist", "out", "target", "coverage", "generated", "__generated__",
            "__snapshots__", "__tests__", "test", "tests", "spec", "specs",
            "mock", "mocks", "fixture", "fixtures", "benchmark", "benchmarks",
            "example", "examples", "sample", "samples", "docs", "documentation"
          ]);
          const excludedFilenamePatterns: RegExp[] = [
            /\.d\.ts$/i, /\.map$/i, /\.min\.[cm]?[jt]sx?$/i,
            /(?:^|[._-])(test|spec|mock|fixture|benchmark|bench)(?:[._-]|$)/i,
            /(?:^|[._-])(config|setup)(?:[._-]|$)/i,
            /(?:^|[._-])generated(?:[._-]|$)/i,
            /^ceedlotus-tree\.[cm]?[jt]s$/i
          ];

          function normalizeRelativePath(filePath: string): string {
            return path.relative(sourceRoot, filePath).split(path.sep).join("/");
          }
          function sha256(value: string | Buffer): string {
            return crypto.createHash("sha256").update(value).digest("hex");
          }
          function stableId(prefix: string, ...parts: string[]): string {
            return `${prefix}_${sha256(parts.join("\u0000")).slice(0, 20)}`;
          }
          function isExcludedDirectory(name: string): boolean {
            return excludedDirectoryNames.has(name.toLowerCase());
          }
          function isExcludedFile(relativePath: string): boolean {
            const basename = path.basename(relativePath);
            return excludedFilenamePatterns.some(p => p.test(basename));
          }
          function discoverFiles(directory: string): string[] {
            const discovered: string[] = [];
            function walk(currentDirectory: string) {
              const entries = fs.readdirSync(currentDirectory, { withFileTypes: true })
                .sort((a, b) => a.name.localeCompare(b.name, "en"));
              for (const entry of entries) {
                const absolutePath = path.join(currentDirectory, entry.name);
                if (entry.isDirectory()) {
                  if (!isExcludedDirectory(entry.name)) walk(absolutePath);
                  continue;
                }
                if (!entry.isFile()) continue;
                const extension = path.extname(entry.name).toLowerCase();
                if (!supportedExtensions.has(extension)) continue;
                const relativePath = normalizeRelativePath(absolutePath);
                if (!isExcludedFile(relativePath)) discovered.push(absolutePath);
              }
            }
            walk(directory);
            return discovered.sort((a, b) => normalizeRelativePath(a).localeCompare(normalizeRelativePath(b), "en"));
          }
          function scriptKindForFile(filePath: string): ts.ScriptKind {
            switch (path.extname(filePath).toLowerCase()) {
              case ".ts":  return ts.ScriptKind.TS;
              case ".tsx": return ts.ScriptKind.TSX;
              case ".jsx": return ts.ScriptKind.JSX;
              case ".js": case ".mjs": case ".cjs": return ts.ScriptKind.JS;
              default: return ts.ScriptKind.Unknown;
            }
          }

          // ----------------------------------------------------------------
          //  Position & source helpers
          // ----------------------------------------------------------------
          function hasRealPosition(node: any): boolean {
            return Boolean(
              node &&
              typeof node.pos === "number" &&
              typeof node.end === "number" &&
              node.pos >= 0 &&
              node.end >= node.pos
            );
          }
          function positionOf(sourceFile: any, node: any): {
            start: number; end: number; line: number; column: number;
          } | null {
            if (!hasRealPosition(node)) return null;
            const start = node.getStart(sourceFile, false);
            const end   = node.getEnd();
            const loc = sourceFile.getLineAndCharacterOfPosition(start);
            return { start, end, line: loc.line + 1, column: loc.character + 1 };
          }

          function sourceText(sourceFile: any, node: any, maxLen = 500): string {
            if (!node) return "";
            let text: string;
            if (!hasRealPosition(node) && (node.kind === ts.SyntaxKind.Unknown || node.kind == null)) {
              text = `[unprintable:${syntaxName(node)}]`;
            } else if (hasRealPosition(node)) {
              text = node.getText(sourceFile);
            } else {
              try {
                const printer = ts.createPrinter({
                  newLine: ts.NewLineKind.LineFeed,
                  removeComments: false
                });
                text = printer.printNode(ts.EmitHint.Unspecified, node, sourceFile);
              } catch (printerError) {
                text = `[unprintable:${syntaxName(node)}]`;
              }
            }
            text = text.replace(/\r\n/g, "\n").trim();
            return text.length <= maxLen ? text : `${text.slice(0, maxLen)}â¦`;
          }

          function syntaxName(node: any): string {
            return (ts as any).SyntaxKind[node.kind] ?? `SyntaxKind${node.kind}`;
          }

          // ----------------------------------------------------------------
          //  Data collectors
          // ----------------------------------------------------------------
          function collectBindingNames(nameNode: any, names: Set<string>) {
            if (!nameNode) return;
            if (ts.isIdentifier(nameNode)) { names.add(nameNode.text); return; }
            if (ts.isObjectBindingPattern(nameNode) || ts.isArrayBindingPattern(nameNode)) {
              for (const element of nameNode.elements) {
                if (ts.isBindingElement(element)) collectBindingNames(element.name, names);
              }
            }
          }
          function collectIdentifiers(node: any, sourceFile: any): string[] {
            const ids = new Set<string>();
            function visit(n: any) {
              if (ts.isIdentifier(n)) ids.add(n.text);
              ts.forEachChild(n, visit);
            }
            visit(node);
            return [...ids].sort((a, b) => a.localeCompare(b, "en"));
          }
          function collectDefinitions(node: any, sourceFile: any): string[] {
            const defs = new Set<string>();
            if (ts.isVariableDeclaration(node)) collectBindingNames(node.name, defs);
            if (
              ts.isFunctionDeclaration(node) || ts.isClassDeclaration(node) ||
              ts.isInterfaceDeclaration(node) || ts.isTypeAliasDeclaration(node) ||
              ts.isEnumDeclaration(node)
            ) {
              if (node.name) defs.add(sourceText(sourceFile, node.name, 100));
            }
            if (ts.isBinaryExpression(node) && node.operatorToken.kind === ts.SyntaxKind.EqualsToken) {
              if (ts.isIdentifier(node.left)) defs.add(node.left.text);
            }
            if (ts.isPrefixUnaryExpression(node) || ts.isPostfixUnaryExpression(node)) {
              if (ts.isIdentifier(node.operand)) defs.add(node.operand.text);
            }
            return [...defs].sort((a, b) => a.localeCompare(b, "en"));
          }
          function collectEffects(node: any, sourceFile: any): any[] {
            const effects: any[] = [];
            if (ts.isCallExpression(node)) effects.push({
              kind: "call",
              expression: sourceText(sourceFile, node.expression, 200),
              arguments: (node.arguments ?? []).map((a: any) => sourceText(sourceFile, a, 200)),
              optional: Boolean(node.questionDotToken)
            });
            if (ts.isNewExpression(node)) effects.push({
              kind: "construct",
              expression: sourceText(sourceFile, node.expression, 200),
              arguments: (node.arguments ?? []).map((a: any) => sourceText(sourceFile, a, 200))
            });
            if (ts.isReturnStatement(node)) effects.push({
              kind: "return",
              expression: node.expression ? sourceText(sourceFile, node.expression, 300) : null
            });
            if (ts.isThrowStatement(node)) effects.push({
              kind: "throw",
              expression: sourceText(sourceFile, node.expression, 300)
            });
            if (ts.isAwaitExpression(node)) effects.push({
              kind: "await",
              expression: sourceText(sourceFile, node.expression, 300)
            });
            if (ts.isYieldExpression(node)) effects.push({
              kind: "yield",
              expression: node.expression ? sourceText(sourceFile, node.expression, 300) : null
            });
            if (ts.isBinaryExpression(node) && node.operatorToken.kind >= ts.SyntaxKind.FirstAssignment && node.operatorToken.kind <= ts.SyntaxKind.LastAssignment) {
               effects.push({
                 kind: "write",
                 target: sourceText(sourceFile, node.left, 200),
                 operator: sourceText(sourceFile, node.operatorToken, 20),
                 value: sourceText(sourceFile, node.right, 300)
               });
            }
            return effects;
          }

          // ----------------------------------------------------------------
          //  CFGBuilder
          // ----------------------------------------------------------------
          class CFGBuilder {
            sourceFile: any;
            functionId: string;
            nodes: any[];
            edges: any[];
            sequence: number;
            breakTargets: (string | null)[];
            continueTargets: (string | null)[];
            returnTarget: string | null;
            throwTarget: string | null;

            constructor(sourceFile: any, functionId: string) {
              this.sourceFile = sourceFile;
              this.functionId = functionId;
              this.nodes = [];
              this.edges = [];
              this.sequence = 0;
              this.breakTargets = [];
              this.continueTargets = [];
              this.returnTarget = null;
              this.throwTarget = null;
            }

            addNode(kind: string, node: any = null, extra: any = {}): string {
              const loc = node ? positionOf(this.sourceFile, node) : null;
              const id = stableId(
                "state",
                this.functionId,
                String(this.sequence++),
                kind,
                loc ? String(loc.start) : `synthetic-${this.sequence}`
              );
              const record = {
                id,
                kind,
                source: loc,
                text: node ? sourceText(this.sourceFile, node) : null,
                definitions: node ? collectDefinitions(node, this.sourceFile) : [],
                uses: node ? collectIdentifiers(node, this.sourceFile) : [],
                effects: node ? collectEffects(node, this.sourceFile) : [],
                ...extra
              };
              this.nodes.push(record);
              return id;
            }

            addEdge(from: string | null, to: string | null, kind: string, guard: string | null = null, metadata: any = {}) {
              if (!from || !to) return;
              this.edges.push({
                id: stableId("transition", this.functionId, from, to, kind, guard ?? ""),
                from,
                to,
                kind,
                guard,
                ...metadata
              });
            }

            build(body: any) {
              const entry = this.addNode("entry");
              const normalExit = this.addNode("normal-exit");
              const exceptionalExit = this.addNode("exceptional-exit");
              this.returnTarget = normalExit;
              this.throwTarget = exceptionalExit;
              const result = ts.isSourceFile(body)
                ? this.buildBlock(body.statements)
                : this.buildStatement(body);
              this.addEdge(entry, result.entry, "enter");
              for (const exit of result.exits) this.addEdge(exit, normalExit, "complete");
              return {
                entry,
                normalExit,
                exceptionalExit,
                nodes: this.nodes.sort((a, b) => a.id.localeCompare(b.id, "en")),
                edges: this.edges.sort((a, b) => a.id.localeCompare(b.id, "en"))
              };
            }

            buildStatement(statement: any): { entry: string; exits: string[] } {
              if (ts.isBlock(statement)) return this.buildBlock(statement.statements);
              if (ts.isIfStatement(statement)) return this.buildIf(statement);
              if (
                ts.isWhileStatement(statement) || ts.isDoStatement(statement) ||
                ts.isForStatement(statement) || ts.isForInStatement(statement) ||
                ts.isForOfStatement(statement)
              ) return this.buildLoop(statement);
              if (ts.isSwitchStatement(statement)) return this.buildSwitch(statement);
              if (ts.isTryStatement(statement)) return this.buildTry(statement);
              if (ts.isReturnStatement(statement)) {
                const s = this.addNode("return", statement);
                this.addEdge(s, this.returnTarget, "return");
                return { entry: s, exits: [] };
              }
              if (ts.isThrowStatement(statement)) {
                const s = this.addNode("throw", statement);
                this.addEdge(s, this.throwTarget, "throw", null, { exceptional: true });
                return { entry: s, exits: [] };
              }
              if (ts.isBreakStatement(statement)) {
                const s = this.addNode("break", statement);
                const t = this.breakTargets[this.breakTargets.length - 1] ?? null;
                this.addEdge(s, t, "break");
                return { entry: s, exits: [] };
              }
              if (ts.isContinueStatement(statement)) {
                const s = this.addNode("continue", statement);
                const t = this.continueTargets[this.continueTargets.length - 1] ?? null;
                this.addEdge(s, t, "continue");
                return { entry: s, exits: [] };
              }
              const s = this.addNode(syntaxName(statement), statement);
              return { entry: s, exits: [s] };
            }

            buildBlock(statements: readonly any[]): { entry: string; exits: string[] } {
              if (statements.length === 0) {
                const empty = this.addNode("empty-block");
                return { entry: empty, exits: [empty] };
              }
              let first: string | null = null;
              let previousExits: string[] = [];
              for (const stmt of statements) {
                const cur = this.buildStatement(stmt);
                if (!first) first = cur.entry;
                for (const prev of previousExits) this.addEdge(prev, cur.entry, "next");
                previousExits = cur.exits;
              }
              return { entry: first!, exits: previousExits };
            }

            buildIf(statement: any): { entry: string; exits: string[] } {
              const cond = this.addNode("if-condition", statement.expression, {
                guardExpression: sourceText(this.sourceFile, statement.expression, 300)
              });
              const thenBr = this.buildStatement(statement.thenStatement);
              this.addEdge(cond, thenBr.entry, "true", sourceText(this.sourceFile, statement.expression, 300));
              if (statement.elseStatement) {
                const elseBr = this.buildStatement(statement.elseStatement);
                this.addEdge(cond, elseBr.entry, "false",
                  `!(${sourceText(this.sourceFile, statement.expression, 300)})`);
                return { entry: cond, exits: [...thenBr.exits, ...elseBr.exits] };
              }
              return { entry: cond, exits: [cond, ...thenBr.exits] };
            }

            buildLoop(statement: any): { entry: string; exits: string[] } {
              const afterLoop = this.addNode("loop-exit", null);
              let condNode: string;
              let condText: string;
              if (ts.isForStatement(statement)) {
                condText = statement.condition ? sourceText(this.sourceFile, statement.condition, 300) : "true";
                condNode = this.addNode("for-condition", statement.condition ?? statement, { guardExpression: condText });
              } else if (ts.isForInStatement(statement) || ts.isForOfStatement(statement)) {
                condText = sourceText(this.sourceFile, statement.expression, 300);
                condNode = this.addNode(
                  ts.isForInStatement(statement) ? "for-in-condition" : "for-of-condition",
                  statement.expression,
                  { guardExpression: condText }
                );
              } else {
                condText = sourceText(this.sourceFile, statement.expression, 300);
                condNode = this.addNode(
                  ts.isDoStatement(statement) ? "do-while-condition" : "while-condition",
                  statement.expression,
                  { guardExpression: condText }
                );
              }
              this.breakTargets.push(afterLoop);
              this.continueTargets.push(condNode);
              const body = this.buildStatement(statement.statement);
              this.continueTargets.pop();
              this.breakTargets.pop();
              this.addEdge(condNode, body.entry, "true", condText);
              this.addEdge(condNode, afterLoop, "false", `!(${condText})`);
              for (const exit of body.exits) this.addEdge(exit, condNode, "loop-back");
              if (ts.isDoStatement(statement)) return { entry: body.entry, exits: [afterLoop] };
              return { entry: condNode, exits: [afterLoop] };
            }

            buildSwitch(statement: any): { entry: string; exits: string[] } {
              const switchState = this.addNode("switch", statement.expression);
              const switchExit = this.addNode("switch-exit");
              this.breakTargets.push(switchExit);
              let previousFallthrough: string[] = [];
              for (const clause of statement.caseBlock.clauses) {
                const clauseState = this.addNode(
                  ts.isCaseClause(clause) ? "switch-case" : "switch-default",
                  clause
                );
                const guard = ts.isCaseClause(clause)
                  ? `${sourceText(this.sourceFile, statement.expression, 200)} === ${sourceText(this.sourceFile, clause.expression, 200)}`
                  : "default";
                this.addEdge(switchState, clauseState, ts.isCaseClause(clause) ? "case" : "default", guard);
                for (const prior of previousFallthrough) this.addEdge(prior, clauseState, "fallthrough");
                const clauseBody = this.buildBlock(clause.statements);
                this.addEdge(clauseState, clauseBody.entry, "enter-case");
                previousFallthrough = clauseBody.exits;
              }
              for (const exit of previousFallthrough) this.addEdge(exit, switchExit, "switch-complete");
              this.breakTargets.pop();
              return { entry: switchState, exits: [switchExit] };
            }

            buildTry(statement: any): { entry: string; exits: string[] } {
              const tryState = this.addNode("try", statement.tryBlock);
              const tryBody = this.buildStatement(statement.tryBlock);
              this.addEdge(tryState, tryBody.entry, "enter-try");
              let exits = [...tryBody.exits];
              if (statement.catchClause) {
                const catchState = this.addNode("catch", statement.catchClause);
                const catchBody = this.buildStatement(statement.catchClause.block);
                this.addEdge(tryState, catchState, "exception", null, { exceptional: true });
                this.addEdge(catchState, catchBody.entry, "enter-catch");
                exits.push(...catchBody.exits);
              }
              if (statement.finallyBlock) {
                const finallyState = this.addNode("finally", statement.finallyBlock);
                const finallyBody = this.buildStatement(statement.finallyBlock);
                for (const exit of exits) this.addEdge(exit, finallyState, "finally");
                this.addEdge(finallyState, finallyBody.entry, "enter-finally");
                exits = finallyBody.exits;
              }
              return { entry: tryState, exits };
            }
          }

          // ----------------------------------------------------------------
          //  Function analysis
          // ----------------------------------------------------------------
          let fallbackAnonymousCounter = 0;

          function functionName(node: any, sourceFile: any): string {
            if (node.name && ts.isIdentifier(node.name)) return node.name.text;
            if (node.parent && ts.isVariableDeclaration(node.parent) && ts.isIdentifier(node.parent.name))
              return node.parent.name.text;
            if (node.parent && ts.isPropertyAssignment(node.parent))
              return sourceText(sourceFile, node.parent.name, 100);
            if (
              ts.isMethodDeclaration(node) || ts.isGetAccessorDeclaration(node) ||
              ts.isSetAccessorDeclaration(node)
            )
              return sourceText(sourceFile, node.name, 100);
            if (ts.isConstructorDeclaration(node)) return "constructor";
            const loc = positionOf(sourceFile, node);
            if (loc) {
              return `anonymous_${loc.line}_${loc.column}`;
            }
            fallbackAnonymousCounter++;
            return `anonymous_gen_${fallbackAnonymousCounter}`;
          }

          function isFunctionLike(node: any): boolean {
            return (
              ts.isFunctionDeclaration(node) || ts.isFunctionExpression(node) ||
              ts.isArrowFunction(node) || ts.isMethodDeclaration(node) ||
              ts.isConstructorDeclaration(node) || ts.isGetAccessorDeclaration(node) ||
              ts.isSetAccessorDeclaration(node)
            );
          }

          function systemIdentity(node: any, sourceFile: any, relativePath: string): {
            id: string; name: string; source: any;
          } {
            const loc = positionOf(sourceFile, node);
            const name = functionName(node, sourceFile);
            return {
              id: stableId("system", relativePath, name, loc ? String(loc.start) : "nosource", syntaxName(node)),
              name,
              source: loc ? { file: relativePath, ...loc } : { file: relativePath }
            };
          }

          function applicationRelativePath(fileName: string): string | null {
            const absolute = path.resolve(fileName);
            const relative = normalizeRelativePath(absolute);
            if (relative === "" || relative === ".") return null;
            if (relative.startsWith("../") || path.isAbsolute(relative)) return null;
            const segments = relative.split("/");
            if (segments.some(segment => isExcludedDirectory(segment))) return null;
            if (!supportedExtensions.has(path.extname(relative).toLowerCase())) return null;
            if (isExcludedFile(relative)) return null;
            return relative;
          }

          function functionNodeFromDeclaration(declaration: any): any | null {
            if (!declaration) return null;
            if (isFunctionLike(declaration)) return declaration;
            if (ts.isVariableDeclaration(declaration) && declaration.initializer && isFunctionLike(declaration.initializer))
              return declaration.initializer;
            if (ts.isPropertyAssignment(declaration) && declaration.initializer && isFunctionLike(declaration.initializer))
              return declaration.initializer;
            if (ts.isPropertyDeclaration(declaration) && declaration.initializer && isFunctionLike(declaration.initializer))
              return declaration.initializer;
            if (ts.isClassDeclaration(declaration) || ts.isClassExpression(declaration)) {
              return declaration.members.find((member: any) => ts.isConstructorDeclaration(member)) ?? null;
            }
            return null;
          }

          function resolveSystemTarget(expression: any): any | null {
            try {
              const checker = project.getTypeChecker().compilerObject;
              let symbol = checker.getSymbolAtLocation(expression);
              if (!symbol && ts.isPropertyAccessExpression(expression))
                symbol = checker.getSymbolAtLocation(expression.name);
              if (!symbol && ts.isElementAccessExpression(expression) && ts.isStringLiteral(expression.argumentExpression))
                symbol = checker.getSymbolAtLocation(expression.argumentExpression);
              if (!symbol) return null;
              if (symbol.flags & ts.SymbolFlags.Alias) {
                try { symbol = checker.getAliasedSymbol(symbol); } catch { /* retain original symbol */ }
              }
              for (const declaration of symbol.declarations ?? []) {
                const targetNode = functionNodeFromDeclaration(declaration);
                if (!targetNode) continue;
                const targetSourceFile = targetNode.getSourceFile();
                const relativePath = applicationRelativePath(targetSourceFile.fileName);
                if (!relativePath) continue;
                const identity = systemIdentity(targetNode, targetSourceFile, relativePath);
                return {
                  resolution: "compiler-symbol",
                  systemId: identity.id,
                  name: identity.name,
                  source: identity.source
                };
              }
            } catch {
              return null;
            }
            return null;
          }

          function nearestParentSystemId(node: any, sourceFile: any, relativePath: string): string | null {
            let current = node.parent;
            while (current) {
              if (isFunctionLike(current)) return systemIdentity(current, sourceFile, relativePath).id;
              current = current.parent;
            }
            return null;
          }

          function classifySyntaxBehavior(node: any): string | null {
            if (ts.isIfStatement(node)) return "if";
            if (ts.isSwitchStatement(node)) return "switch";
            if (ts.isCaseClause(node)) return "case";
            if (ts.isDefaultClause(node)) return "default";
            if (ts.isForStatement(node)) return "for";
            if (ts.isForInStatement(node)) return "for-in";
            if (ts.isForOfStatement(node)) return "for-of";
            if (ts.isWhileStatement(node)) return "while";
            if (ts.isDoStatement(node)) return "do-while";
            if (ts.isTryStatement(node)) return "try";
            if (ts.isCatchClause(node)) return "catch";
            if (ts.isReturnStatement(node)) return "return";
            if (ts.isThrowStatement(node)) return "throw";
            if (ts.isBreakStatement(node)) return "break";
            if (ts.isContinueStatement(node)) return "continue";
            if (ts.isAwaitExpression(node)) return "await";
            if (ts.isYieldExpression(node)) return "yield";
            if (ts.isConditionalExpression(node)) return "conditional-expression";
            if (ts.isVariableDeclaration(node)) return "variable-declaration";
            if (ts.isBinaryExpression(node)) {
              const operator = node.operatorToken.kind;
              if (operator >= ts.SyntaxKind.FirstAssignment && operator <= ts.SyntaxKind.LastAssignment)
                return "assignment";
              if (
                operator === ts.SyntaxKind.AmpersandAmpersandToken ||
                operator === ts.SyntaxKind.BarBarToken ||
                operator === ts.SyntaxKind.QuestionQuestionToken
              ) return "short-circuit";
              return "binary-expression";
            }
            if (ts.isPrefixUnaryExpression(node) || ts.isPostfixUnaryExpression(node)) return "unary-update";
            if (ts.isDeleteExpression(node)) return "delete";
            if (ts.isElementAccessExpression(node)) {
              return ts.isStringLiteral(node.argumentExpression) || ts.isNumericLiteral(node.argumentExpression)
                ? "element-access"
                : "dynamic-element-access";
            }
            if (ts.isPropertyAccessExpression(node)) return "property-access";
            if (ts.isObjectLiteralExpression(node)) return "object-literal";
            if (ts.isArrayLiteralExpression(node)) return "array-literal";
            if (ts.isSpreadElement(node) || ts.isSpreadAssignment(node)) return "spread";
            if (ts.isTaggedTemplateExpression(node)) return "tagged-template";
            if (ts.isJsxElement(node) || ts.isJsxSelfClosingElement(node) || ts.isJsxFragment(node)) return "jsx-create";
            return null;
          }

          function collectScopeBehavior(scope: any, sourceFile: any, ownerId: string, relativePath: string): {
            variables: string[];
            calls: any[];
            dynamicBehaviors: any[];
            syntaxBehaviors: any[];
          } {
            const variables = new Set<string>();
            const calls: any[] = [];
            const dynamicBehaviors: any[] = [];
            const syntaxBehaviors: any[] = [];

            function walk(node: any, parentBehaviorId: string | null = null) {
              if (node !== scope && isFunctionLike(node)) {
                const child = systemIdentity(node, sourceFile, relativePath);
                const source = positionOf(sourceFile, node);
                const id = stableId("behavior", ownerId, "nested-function", String(source?.start ?? "nosource"));
                syntaxBehaviors.push({
                  id,
                  kind: "nested-function",
                  text: sourceText(sourceFile, node, 500),
                  source,
                  parentBehaviorId,
                  targetSystemId: child.id
                });
                return;
              }

              if (ts.isVariableDeclaration(node)) collectBindingNames(node.name, variables);

              let currentParent = parentBehaviorId;
              const syntaxKind = classifySyntaxBehavior(node);
              if (syntaxKind) {
                const source = positionOf(sourceFile, node);
                const id = stableId(
                  "behavior",
                  ownerId,
                  syntaxKind,
                  String(source?.start ?? "nosource"),
                  String(source?.end ?? "nosource")
                );
                syntaxBehaviors.push({
                  id,
                  kind: syntaxKind,
                  text: sourceText(sourceFile, node, 500),
                  source,
                  parentBehaviorId
                });
                currentParent = id;
              }

              if (ts.isCallExpression(node) || ts.isNewExpression(node)) {
                const expression = node.expression;
                const source = positionOf(sourceFile, node);
                const id = stableId(
                  ts.isNewExpression(node) ? "construct" : "call",
                  ownerId,
                  String(source?.start ?? "nosource")
                );
                const target = resolveSystemTarget(expression);
                const callbacks: any[] = [];
                for (let index = 0; index < (node.arguments ?? []).length; index++) {
                  const argument = node.arguments[index];
                  if (isFunctionLike(argument)) {
                    const callback = systemIdentity(argument, sourceFile, relativePath);
                    callbacks.push({
                      argumentIndex: index,
                      resolution: "inline-function",
                      systemId: callback.id,
                      name: callback.name,
                      source: callback.source
                    });
                  } else {
                    const callbackTarget = resolveSystemTarget(argument);
                    if (callbackTarget) callbacks.push({ argumentIndex: index, ...callbackTarget });
                  }
                }
                const isDynamicImport = ts.isCallExpression(node) && expression.kind === ts.SyntaxKind.ImportKeyword;
                const isComputedTarget = ts.isElementAccessExpression(expression) &&
                  !ts.isStringLiteral(expression.argumentExpression) &&
                  !ts.isNumericLiteral(expression.argumentExpression);
                const dynamic = !target || isDynamicImport || isComputedTarget;
                calls.push({
                  id,
                  invocationKind: ts.isNewExpression(node) ? "construct" : isDynamicImport ? "dynamic-import" : "call",
                  expression: sourceText(sourceFile, expression, 500),
                  arguments: (node.arguments ?? []).map((argument: any) => sourceText(sourceFile, argument, 500)),
                  source,
                  optional: Boolean((node as any).questionDotToken),
                  awaited: ts.isAwaitExpression(node.parent),
                  parentBehaviorId: currentParent,
                  resolution: target?.resolution ?? "runtime-expression",
                  target,
                  callbacks,
                  dynamic
                });
                if (dynamic) {
                  dynamicBehaviors.push({
                    id: stableId("dynamic", ownerId, String(source?.start ?? "nosource"), sourceText(sourceFile, node, 500)),
                    kind: isDynamicImport
                      ? "dynamic-import"
                      : isComputedTarget
                        ? "dynamic-dispatch"
                        : "runtime-call-target",
                    source,
                    text: sourceText(sourceFile, node, 500),
                    expression: sourceText(sourceFile, expression, 500),
                    callId: id
                  });
                }
              }

              ts.forEachChild(node, (child: any) => walk(child, currentParent));
            }

            walk(scope);
            return {
              variables: [...variables].sort((a, b) => a.localeCompare(b, "en")),
              calls: calls.sort((a, b) => a.id.localeCompare(b.id, "en")),
              dynamicBehaviors: dynamicBehaviors.sort((a, b) => a.id.localeCompare(b.id, "en")),
              syntaxBehaviors: syntaxBehaviors.sort((a, b) => a.id.localeCompare(b.id, "en"))
            };
          }

          // NEW: Collect human-readable declarations from inside function bodies
          function collectBodyDeclarations(body: ts.Node, sourceFile: ts.SourceFile): any[] {
            const items: any[] = [];
            function walk(n: ts.Node) {
              if (n !== body && isFunctionLike(n)) return;
              // Local variable declarations
              if (ts.isVariableStatement(n)) {
                for (const decl of n.declarationList.declarations) {
                  const name = sourceText(sourceFile, decl.name, 200);
                  const type = decl.type ? sourceText(sourceFile, decl.type, 100) : undefined;
                  const init = decl.initializer ? sourceText(sourceFile, decl.initializer, 300) : undefined;
                  items.push({
                    kind: "variable",
                    name,
                    type: type ?? null,
                    initializer: init ?? null,
                    source: positionOf(sourceFile, n)
                  });
                }
              }
              // Hook calls (function calls starting with "use")
              if (ts.isCallExpression(n)) {
                const callText = sourceText(sourceFile, n.expression, 100);
                if (callText.startsWith("use") && /^use[A-Z]/.test(callText)) {
                  const args = n.arguments.map(a => sourceText(sourceFile, a, 200));
                  const hookEntry: any = {
                    kind: "hook",
                    name: callText,
                    source: positionOf(sourceFile, n)
                  };
                  // Special handling for useEffect / useMemo / useCallback to capture deps
                  if (callText === "useEffect" || callText === "useMemo" || callText === "useCallback") {
                    hookEntry.deps = args.length >= 2 ? sourceText(sourceFile, n.arguments[1], 200) : null;
                  }
                  items.push(hookEntry);
                }
              }
              ts.forEachChild(n, walk);
            }
            walk(body);
            return items.sort((a, b) => (a.source?.start ?? 0) - (b.source?.start ?? 0));
          }

          function analyzeFunction(node: any, sourceFile: any, relativePath: string): any {
            const loc = positionOf(sourceFile, node);
            const name = functionName(node, sourceFile);
            const id = stableId("system", relativePath, name, loc ? String(loc.start) : "nosource", syntaxName(node));
            const rawParams = (node as any).parameters ?? [];
            const parameters = rawParams.map((p: any) => ({
              name: sourceText(sourceFile, p.name, 200),
              type: p.type ? sourceText(sourceFile, p.type, 200) : null,
              optional: Boolean(p.questionToken),
              rest: Boolean(p.dotDotDotToken),
              initializer: p.initializer ? sourceText(sourceFile, p.initializer, 300) : null,
              source: positionOf(sourceFile, p)
            }));

            const body = node.body ?? null;
            let cfg: any;
            if (!body) {
              const entry = stableId("state", id, "declaration-entry");
              const exit = stableId("state", id, "declaration-exit");
              cfg = {
                entry,
                normalExit: exit,
                exceptionalExit: stableId("state", id, "declaration-exceptional-exit"),
                nodes: [
                  { id: entry, kind: "declaration-only", source: loc, text: sourceText(sourceFile, node),
                    definitions: [], uses: [], effects: [] },
                  { id: exit, kind: "normal-exit", source: null, text: null, definitions: [], uses: [], effects: [] }
                ],
                edges: [
                  { id: stableId("transition", id, entry, exit, "complete"), from: entry, to: exit, kind: "complete", guard: null }
                ]
              };
            } else if (ts.isBlock(body)) {
              cfg = new CFGBuilder(sourceFile, id).build(body);
            } else {
              const builder = new CFGBuilder(sourceFile, id);
              const entry = builder.addNode("entry");
              const exprState = builder.addNode("expression-return", body, {
                effects: [{ kind: "return", expression: sourceText(sourceFile, body, 500) }]
              });
              const normalExit = builder.addNode("normal-exit");
              const exceptionalExit = builder.addNode("exceptional-exit");
              builder.addEdge(entry, exprState, "enter");
              builder.addEdge(exprState, normalExit, "return");
              cfg = {
                entry,
                normalExit,
                exceptionalExit,
                nodes: builder.nodes.sort((a, b) => a.id.localeCompare(b.id, "en")),
                edges: builder.edges.sort((a, b) => a.id.localeCompare(b.id, "en"))
              };
            }

            const scopeBehavior = body
              ? collectScopeBehavior(body, sourceFile, id, relativePath)
              : { variables: [], calls: [], dynamicBehaviors: [], syntaxBehaviors: [] };

            // Human-readable declarations retained from the original transformer.
            const bodyDeclarations = body ? collectBodyDeclarations(body, sourceFile) : [];

            return {
              id,
              name,
              kind: syntaxName(node),
              source: loc ? { file: relativePath, ...loc } : { file: relativePath },
              async: Boolean(node.modifiers?.some((m: any) => m.kind === ts.SyntaxKind.AsyncKeyword)),
              generator: Boolean(node.asteriskToken),
              parameters,
              returnType: node.type ? sourceText(sourceFile, node.type, 300) : null,
              parentSystemId: nearestParentSystemId(node, sourceFile, relativePath),
              variables: scopeBehavior.variables,
              inputs: parameters.map((p: any) => p.name),
              outputs: ["return", "throw", "effects"],
              initialState: cfg.entry,
              terminalStates: [cfg.normalExit, cfg.exceptionalExit],
              stateSpace: cfg.nodes,
              transitions: cfg.edges,
              calls: scopeBehavior.calls,
              dynamicBehaviors: scopeBehavior.dynamicBehaviors,
              syntaxBehaviors: scopeBehavior.syntaxBehaviors,
              unresolvedSemantics: scopeBehavior.dynamicBehaviors,
              bodyDeclarations
            };
          }

          function analyzeModuleInitializer(sourceFile: any, relativePath: string): any {
            const id = stableId("system", relativePath, "<module>", "0", "SourceFile");
            const cfg = new CFGBuilder(sourceFile, id).build(sourceFile);
            const scopeBehavior = collectScopeBehavior(sourceFile, sourceFile, id, relativePath);
            return {
              id,
              name: "<module>",
              kind: "SourceFile",
              source: { file: relativePath, start: 0, end: sourceFile.end, line: 1, column: 1 },
              parentSystemId: null,
              async: false,
              generator: false,
              parameters: [],
              returnType: null,
              variables: scopeBehavior.variables,
              inputs: [],
              outputs: ["module-effects", "throw"],
              initialState: cfg.entry,
              terminalStates: [cfg.normalExit, cfg.exceptionalExit],
              stateSpace: cfg.nodes,
              transitions: cfg.edges,
              calls: scopeBehavior.calls,
              dynamicBehaviors: scopeBehavior.dynamicBehaviors,
              syntaxBehaviors: scopeBehavior.syntaxBehaviors,
              unresolvedSemantics: scopeBehavior.dynamicBehaviors,
              bodyDeclarations: collectBodyDeclarations(sourceFile, sourceFile)
            };
          }

          // ----------------------------------------------------------------
          //  File analysis
          // ----------------------------------------------------------------
          const tsConfigPath = path.join(sourceRoot, "tsconfig.json");
          const project = fs.existsSync(tsConfigPath)
            ? new Project({ tsConfigFilePath: tsConfigPath, skipAddingFilesFromTsConfig: false })
            : new Project({
                compilerOptions: {
                  allowJs: true,
                  checkJs: false,
                  target: ts.ScriptTarget.ESNext,
                  module: ts.ModuleKind.NodeNext,
                  moduleResolution: ts.ModuleResolutionKind.NodeNext,
                  jsx: ts.JsxEmit.Preserve,
                  skipLibCheck: true
                }
              });

          function projectSourceFile(filePath: string) {
            const absolutePath = path.resolve(filePath);
            const existing = project.getSourceFile(absolutePath) ?? project.getSourceFile(normalizeRelativePath(absolutePath));
            if (existing) return existing;
            return project.addSourceFileAtPath(absolutePath);
          }

          function resolveImport(moduleSpecifier: string, containingFile: string): any {
            try {
              const resolved = ts.resolveModuleName(
                moduleSpecifier,
                containingFile,
                project.getCompilerOptions(),
                ts.sys
              ).resolvedModule;
              if (!resolved) return { resolution: "runtime-or-external", moduleSpecifier };
              const applicationPath = applicationRelativePath(resolved.resolvedFileName);
              return {
                resolution: applicationPath ? "application-module" : "external-module",
                moduleSpecifier,
                resolvedFile: applicationPath,
                resolvedPath: resolved.resolvedFileName,
                extension: String(resolved.extension)
              };
            } catch {
              return { resolution: "runtime-or-external", moduleSpecifier };
            }
          }

          function analyzeFile(filePath: string): any {
            const originalBytes = fs.readFileSync(filePath);
            const relativePath = normalizeRelativePath(filePath);
            const sourceFile = projectSourceFile(filePath);
            const nativeSourceFile = sourceFile.compilerNode;

            const imports: any[] = [];
            const exports: any[] = [];
            const declarations: any[] = [];
            const systems: any[] = [];
            const diagnostics: any[] = [];

            for (const diag of sourceFile.getPreEmitDiagnostics()) {
              const start = diag.getStart() ?? 0;
              const pos = sourceFile.getLineAndColumnAtPos(start);
              diagnostics.push({
                category: diag.getCategory(),
                code: diag.getCode(),
                message: diag.getMessageText(),
                line: pos.line,
                column: pos.column,
                start,
                length: diag.getLength() ?? 0
              });
            }

            function collectAllFunctions(node: ts.Node) {
              if (isFunctionLike(node)) {
                systems.push(analyzeFunction(node, nativeSourceFile, relativePath));
              }
              ts.forEachChild(node, collectAllFunctions);
            }

            systems.push(analyzeModuleInitializer(nativeSourceFile, relativePath));

            ts.forEachChild(nativeSourceFile, (child) => {
              if (ts.isImportDeclaration(child)) {
                const moduleSpecifier = ts.isStringLiteral(child.moduleSpecifier)
                  ? child.moduleSpecifier.text
                  : sourceText(nativeSourceFile, child.moduleSpecifier, 500);
                imports.push({
                  kind: syntaxName(child),
                  text: sourceText(nativeSourceFile, child, 500),
                  moduleSpecifier,
                  target: resolveImport(moduleSpecifier, filePath),
                  source: positionOf(nativeSourceFile, child)
                });
              } else if (ts.isImportEqualsDeclaration(child)) {
                const moduleSpecifier = sourceText(nativeSourceFile, child.moduleReference, 500);
                imports.push({
                  kind: syntaxName(child),
                  text: sourceText(nativeSourceFile, child, 500),
                  moduleSpecifier,
                  target: resolveImport(moduleSpecifier.replace(/^require\(["']|["']\)$/g, ""), filePath),
                  source: positionOf(nativeSourceFile, child)
                });
              }
              if (ts.isExportDeclaration(child) || ts.isExportAssignment(child))
                exports.push({ kind: syntaxName(child), text: sourceText(nativeSourceFile, child, 500),
                  source: positionOf(nativeSourceFile, child) });
              if (
                ts.isVariableStatement(child) || ts.isClassDeclaration(child) ||
                ts.isInterfaceDeclaration(child) || ts.isTypeAliasDeclaration(child) ||
                ts.isEnumDeclaration(child)
              )
                declarations.push({ kind: syntaxName(child), text: sourceText(nativeSourceFile, child, 500),
                  source: positionOf(nativeSourceFile, child), definitions: collectDefinitions(child, nativeSourceFile) });

              collectAllFunctions(child);
            });

            return {
              schema: "cdlds.application.module.v1",
              generator: { name: "cdlds-ast-transformer", version: "1.0.0", typescriptVersion: ts.version },
              module: {
                id: stableId("module", relativePath, sha256(originalBytes)),
                path: relativePath,
                sourceSha256: sha256(originalBytes),
                language: path.extname(filePath).slice(1).toLowerCase(),
                scriptKind: (ts as any).ScriptKind[scriptKindForFile(filePath)],
                imports: imports.sort((a, b) => (a.source?.start ?? 0) - (b.source?.start ?? 0)),
                exports: exports.sort((a, b) => (a.source?.start ?? 0) - (b.source?.start ?? 0)),
                declarations: declarations.sort((a, b) => (a.source?.start ?? 0) - (b.source?.start ?? 0)),
                diagnostics: diagnostics.sort((a, b) => (a.start ?? 0) - (b.start ?? 0) || (a.code ?? 0) - (b.code ?? 0))
              },
              systems: systems.sort((a, b) => a.id.localeCompare(b.id, "en"))
            };
          }

          // ----------------------------------------------------------------
          //  Serialization
          // ----------------------------------------------------------------
          function stableSerialize(value: any): string {
            if (value === undefined || value === null) return "null";
            if (typeof value !== "object") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(stableSerialize).join(",")}]`;
            const keys = Object.keys(value).sort((a, b) => a.localeCompare(b, "en"));
            return `{${keys.map(k => `${JSON.stringify(k)}:${stableSerialize(value[k])}`).join(",")}}`;
          }

          // ----------------------------------------------------------------
          //  Repository behavior graph
          // ----------------------------------------------------------------
          function buildBehaviorGraph(models: any[]): any {
            const nodes = new Map<string, any>();
            const edges = new Map<string, any>();
            const rootId = stableId("behavior-root", "application");

            function addNode(node: any) {
              if (!nodes.has(node.id)) nodes.set(node.id, node);
            }
            function addEdge(from: string, to: string, kind: string, metadata: any = {}) {
              const id = stableId("behavior-edge", from, to, kind, stableSerialize(metadata));
              if (!edges.has(id)) edges.set(id, { id, from, to, kind, ...metadata });
            }

            addNode({ id: rootId, kind: "application", label: "APPLICATION BEHAVIOR" });
            const moduleByPath = new Map(models.map(model => [model.module.path, model.module]));
            const systemById = new Map<string, any>();
            for (const model of models) {
              for (const system of model.systems) systemById.set(system.id, system);
            }

            for (const model of [...models].sort((a, b) => a.module.path.localeCompare(b.module.path, "en"))) {
              const module = model.module;
              addNode({
                id: module.id,
                kind: "module",
                label: module.path,
                path: module.path,
                language: module.language,
                sourceSha256: module.sourceSha256
              });
              addEdge(rootId, module.id, "contains-module");

              for (const imported of module.imports ?? []) {
                const importId = stableId("import", module.id, String(imported.source?.start ?? "nosource"), imported.text);
                addNode({
                  id: importId,
                  kind: "import",
                  label: imported.text,
                  source: imported.source,
                  moduleSpecifier: imported.moduleSpecifier,
                  resolution: imported.target?.resolution ?? "runtime-or-external"
                });
                addEdge(module.id, importId, "contains-import");
                const targetPath = imported.target?.resolvedFile;
                const targetModule = targetPath ? moduleByPath.get(targetPath) : null;
                if (targetModule) {
                  addEdge(importId, targetModule.id, "imports-module", { moduleSpecifier: imported.moduleSpecifier });
                } else {
                  const externalId = stableId("module-target", imported.moduleSpecifier ?? imported.text);
                  addNode({
                    id: externalId,
                    kind: imported.target?.resolution === "external-module" ? "external-module" : "runtime-module-target",
                    label: imported.moduleSpecifier ?? imported.text,
                    resolvedPath: imported.target?.resolvedPath ?? null
                  });
                  addEdge(importId, externalId, "imports-target", { resolution: imported.target?.resolution ?? "runtime-or-external" });
                }
              }

              for (const system of model.systems ?? []) {
                addNode({
                  id: system.id,
                  kind: "system",
                  label: `${module.path}::${system.name}`,
                  name: system.name,
                  systemKind: system.kind,
                  source: system.source,
                  async: system.async,
                  generator: system.generator
                });
                if (system.parentSystemId && systemById.has(system.parentSystemId))
                  addEdge(system.parentSystemId, system.id, "contains-nested-system");
                else
                  addEdge(module.id, system.id, "contains-system");

                for (const state of system.stateSpace ?? []) {
                  addNode({
                    id: state.id,
                    kind: "state",
                    label: state.text || state.kind,
                    stateKind: state.kind,
                    source: state.source,
                    definitions: state.definitions,
                    uses: state.uses,
                    effects: state.effects
                  });
                  addEdge(system.id, state.id, "contains-state");
                }
                for (const transition of system.transitions ?? []) {
                  addEdge(transition.from, transition.to, `control:${transition.kind}`, {
                    guard: transition.guard ?? null,
                    exceptional: Boolean(transition.exceptional)
                  });
                }

                for (const behavior of system.syntaxBehaviors ?? []) {
                  addNode({
                    id: behavior.id,
                    kind: "syntax-behavior",
                    label: behavior.text || behavior.kind,
                    behaviorKind: behavior.kind,
                    source: behavior.source,
                    targetSystemId: behavior.targetSystemId ?? null
                  });
                  if (behavior.parentBehaviorId)
                    addEdge(behavior.parentBehaviorId, behavior.id, "contains-syntax-behavior");
                  else
                    addEdge(system.id, behavior.id, "contains-syntax-behavior");
                  if (behavior.targetSystemId) {
                    if (systemById.has(behavior.targetSystemId))
                      addEdge(behavior.id, behavior.targetSystemId, "defines-nested-system");
                    else {
                      const missingId = stableId("runtime-system-target", behavior.targetSystemId);
                      addNode({ id: missingId, kind: "runtime-system-target", label: behavior.targetSystemId });
                      addEdge(behavior.id, missingId, "defines-runtime-system");
                    }
                  }
                }

                for (const call of system.calls ?? []) {
                  addNode({
                    id: call.id,
                    kind: call.invocationKind,
                    label: call.expression,
                    expression: call.expression,
                    arguments: call.arguments,
                    source: call.source,
                    optional: call.optional,
                    awaited: call.awaited,
                    resolution: call.resolution,
                    dynamic: call.dynamic
                  });
                  if (call.parentBehaviorId)
                    addEdge(call.parentBehaviorId, call.id, "contains-invocation");
                  else
                    addEdge(system.id, call.id, "contains-invocation");

                  if (call.target?.systemId && systemById.has(call.target.systemId)) {
                    addEdge(call.id, call.target.systemId, "invokes-system", { resolution: call.target.resolution });
                  } else {
                    const targetId = stableId("runtime-call-target", system.id, call.id, call.expression);
                    addNode({
                      id: targetId,
                      kind: "runtime-call-target",
                      label: call.expression,
                      expression: call.expression
                    });
                    addEdge(call.id, targetId, "invokes-runtime-expression", { resolution: call.resolution });
                  }

                  for (const callback of call.callbacks ?? []) {
                    if (callback.systemId && systemById.has(callback.systemId)) {
                      addEdge(call.id, callback.systemId, "passes-callback", {
                        argumentIndex: callback.argumentIndex,
                        resolution: callback.resolution
                      });
                    } else {
                      const callbackId = stableId("runtime-callback", call.id, String(callback.argumentIndex));
                      addNode({
                        id: callbackId,
                        kind: "runtime-callback",
                        label: callback.name ?? `argument[${callback.argumentIndex}]`
                      });
                      addEdge(call.id, callbackId, "passes-runtime-callback", {
                        argumentIndex: callback.argumentIndex,
                        resolution: callback.resolution
                      });
                    }
                  }
                }

                for (const dynamic of system.dynamicBehaviors ?? []) {
                  addNode({
                    id: dynamic.id,
                    kind: "dynamic-behavior",
                    label: dynamic.text,
                    behaviorKind: dynamic.kind,
                    expression: dynamic.expression,
                    source: dynamic.source
                  });
                  addEdge(system.id, dynamic.id, "contains-dynamic-behavior");
                  if (dynamic.callId) addEdge(dynamic.id, dynamic.callId, "describes-invocation");
                }
              }
            }

            return {
              schema: "cdlds.application.behavior-graph.v1",
              generator: {
                name: "cdlds-ast-transformer",
                version: "1.1.0",
                mode: "syntax-and-compiler-evidence-only",
                dynamicBehaviorPolicy: "preserve-expression-without-guessing",
                traversal: "complete-application-AST-no-depth-limit"
              },
              rootId,
              nodes: [...nodes.values()].sort((a, b) => a.id.localeCompare(b.id, "en")),
              edges: [...edges.values()].sort((a, b) => a.id.localeCompare(b.id, "en")),
              summary: {
                modules: models.length,
                systems: models.reduce((total, model) => total + model.systems.length, 0),
                nodes: nodes.size,
                edges: edges.size,
                dynamicBehaviors: models.reduce(
                  (total, model) => total + model.systems.reduce(
                    (systemTotal: number, system: any) => systemTotal + (system.dynamicBehaviors?.length ?? 0), 0
                  ), 0
                )
              }
            };
          }

          function oneLine(value: unknown, maxLength = 180): string {
            const text = String(value ?? "").replace(/\s+/g, " ").trim();
            return text.length <= maxLength ? text : `${text.slice(0, maxLength)}â¦`;
          }

          function renderBehaviorGraphTree(models: any[], graph: any): string {
            const lines: string[] = [];
