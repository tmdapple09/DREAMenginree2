name: Unzip fonts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip fonts into fonts/ and commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( fonts/*.zip )
          shopt -u nullglob

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found in fonts/, nothing to do."
            exit 0
          fi

          for ZIP in "${zips[@]}"; do
            echo "Processing: $ZIP"
            TMP="$(mktemp -d)"
            unzip -q "$ZIP" -d "$TMP"

            # Flatten single wrapper folder (e.g. MyFont-family/), ignoring __MACOSX
            ROOT="$TMP"
            top_dirs=()
            for d in "$TMP"/*/; do
              [ -d "$d" ] || continue
              [[ "$(basename "$d")" == "__MACOSX" ]] && continue
              top_dirs+=( "$d" )
            done
            if [ "${#top_dirs[@]}" -eq 1 ]; then
              ROOT="${top_dirs[0]}"
            fi

            # Sync only font files back into fonts/, preserving any subfolders
            rsync -a \
              --include="*.woff" \
              --include="*.woff2" \
              --include="*.ttf" \
              --include="*.otf" \
              --include="*.eot" \
              --include="*/" \
              --exclude="*" \
              "$ROOT/" "./fonts/"

            # Remove the zip from the repo tree
            rm -f "$ZIP"
            git rm -f "$ZIP" 2>/dev/null || true
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No font changes to commit." && exit 0
          git commit -m "chore: unzip fonts into fonts/ [skip ci] [skip vercel]"
          git push || true
