name: Export Recursive Website Feature Tree V20

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-recursive-website-feature-tree-v20:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install source parser
        run: |
          node -e "require('node:fs').mkdirSync('__de_feature_tools__',{recursive:true});require('node:fs').writeFileSync('__de_feature_tools__/package.json','{\"type\":\"commonjs\"}')"
          npm --prefix __de_feature_tools__ install @babel/parser@latest --no-package-lock --silent

      - name: Export recursive website feature tree
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, "__dreamengin_website_feature_tree__");
          const META = path.join(OUT, ".de");
          const requireTools = createRequire(path.join(ROOT, "__de_feature_tools__", "package.json"));
          const parser = requireTools("@babel/parser");

          const SKIP_DIRS = new Set([
            ".git", ".github", ".ci", "node_modules", ".next", "out", "dist", "build", "coverage", ".turbo", ".cache",
            "__de_feature_tools__", "__dreamengin_website_feature_tree__"
          ]);
          const SOURCE_EXTS = new Set([".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]);
          const JSX_EXTS = new Set([".tsx", ".jsx"]);

          const USER_FEATURE_RE = /(?:^|\b)(dream|dm|bar|menu|panel|drawer|dialog|modal|sheet|popover|tab|feed|profile|message|chat|thread|conversation|composer|comment|post|media|upload|asset|workspace|space|surface|canvas|viewport|shell|window|widget|search|settings|connector|launcher|editor|toolbar|card|engin|game|room|notification|button|link|input|form|select|toggle|switch|slider|list|grid|table|nav|header|footer|sidebar|player|viewer|preview|gallery|timeline|inbox|invite|share|member|identity|avatar|control|action|home|page|route|room|game|tool|asset|profile|settings)(?:\b|$)/i;
          const NON_UI_RE = /(?:^|\b)(provider|context|boundary|errorboundary|suspense|portal|helmet|head|metadata|script|theme|config|registry|adapter|clientprovider|queryclient|hydration|hydrate|analytics|telemetry|observer|guard|gate|authguard|permissionguard|featureflag|devtool|debug|test|mock|fixture|story|stories|schema|model|store|reducer|dispatch|controller|manager|service|factory|mapper|normalizer|serializer|parser)(?:\b|$)/i;
          const NON_ACTION_RE = /(?:^|\b)(error\s*boundary|boundary|provider|context|registry|adapter|telemetry|analytics|debug|mock|story|fixture|schema|reducer|store|manager|service|factory)(?:\b|$)/i;

          function isNoiseActionLabel(value) {
            return NON_ACTION_RE.test(cleanWords(value || ""));
          }

          function dynamicTargetName(raw) {
            const value = String(raw || "").trim();
            if (!value) return "";
            if (/[`$]|[{}]/.test(value)) return "";

            const parts = value.split(".").map((part) => part.trim()).filter(Boolean);
            let candidate = parts.length > 1 ? parts[parts.length - 1] : value;

            if (/^(href|url|path|route|to)$/i.test(candidate) && parts.length > 1) {
              candidate = parts[parts.length - 2];
            }

            if (!/^[A-Za-z_$][\w$]*(Href|Url|URL|Path|Route|To)?$/i.test(candidate)) return "";

            candidate = candidate.replace(/(Href|Url|URL|Path|Route|To)$/i, "");

            if (!candidate || /^(href|url|path|route|to|link|button|input|label|field|item|value)$/i.test(candidate)) return "";

            return sanitize(candidate, "");
          }

          function targetDisplayLabel(target) {
            if (!target) return "Destination";
            if (target.route) return routeLabel(target.route);
            if (target.kind === "external") return "External Destination";
            if (target.kind === "download") return "Download";
            if (target.kind === "dynamic") return dynamicTargetName(target.raw) || "Dynamic Destination";
            if (target.kind === "anchor") return "Same Page Anchor";
            if (target.kind === "unknown") return dynamicTargetName(target.raw) || "Unknown Destination";
            return sanitize(target.kind || "Destination", "Destination");
          }

          const ACTION_LABEL_RE = /(?:^|\b)(open|close|save|delete|remove|edit|cancel|send|submit|create|add|update|upload|download|share|launch|start|stop|play|pause|toggle|enable|disable|connect|disconnect|invite|join|leave|accept|decline|approve|reject|publish|unpublish|copy|duplicate|clear|reset|search|filter|sort|resize|drag|drop|move|select|choose|switch|next|previous|back|forward|reply|comment|like|follow|unfollow)(?:\b|$)/i;

          const GENERIC_ONE_WORD_ACTION_RE = /^(add|new|clear|close|cancel|stop|share|follow|edit|delete|remove|save|send|submit|create|update|copy|reset|open|back|next|previous|refresh)$/i;
          const TEMPLATE_TOKEN_RE = /[`$]|\{\s*[^}]+\s*\}/;

          function labelWithoutPlumbingWords(value) {
            return cleanWords(value || "")
              .replace(/^\d+\s+/, " ")
              .replace(/[←→↗↘↙↖]/g, " ")
              .replace(/\b(href|url|path|route)\b/gi, " ")
              .replace(/\bto\s+to\b/gi, "to")
              .replace(/\s+/g, " ")
              .trim();
          }

          function normalizedCompareLabel(value) {
            return labelWithoutPlumbingWords(value || "").toLowerCase().replace(/\s+/g, " ").trim();
          }

          function isBadGeneratedLabel(value) {
            const label = labelWithoutPlumbingWords(value || "");
            if (!label) return true;
            if (TEMPLATE_TOKEN_RE.test(String(value || ""))) return true;
            if (/^[^a-z0-9]+$/i.test(label)) return true;
            if (/^\d+(?:\s+\d+)?$/.test(label)) return true;
            if (/^(href|to|url|path|route|link|button|input|label|field|item|value)$/i.test(label)) return true;
            if (/\b(href|url|path|route)\b/i.test(cleanWords(value || "")) && label.split(/\s+/).length <= 1) return true;
            return false;
          }

          function compactUiLabel(value, fallback = "Open") {
            const raw = String(value || "");
            if (isBadGeneratedLabel(raw)) return fallback;
            const cleaned = sanitize(labelWithoutPlumbingWords(raw), fallback);
            const words = cleanWords(cleaned).split(/\s+/).filter(Boolean);
            if (words.length > 10 || cleaned.length > 80) return fallback;
            return folderSegmentLabel(cleaned, fallback);
          }

          function linkFolderLabel(labelRaw, target) {
            const targetLabel = targetDisplayLabel(target);
            const actionLabel = compactUiLabel(labelRaw, "Open");
            const actionNorm = normalizedCompareLabel(actionLabel);
            const targetNorm = normalizedCompareLabel(targetLabel);

            if (target.kind === "dynamic") {
              if (actionLabel !== "Open" && actionNorm && actionNorm !== targetNorm) return actionLabel;
              return `Open ${targetLabel}`;
            }

            if (actionLabel === "Open") return `Open ${targetLabel}`;
            if (actionNorm === targetNorm) return `Open ${targetLabel}`;
            if (/\bTo\b/i.test(actionLabel)) return folderSegmentLabel(actionLabel, actionLabel);
            if (actionNorm.endsWith(` to ${targetNorm}`) || actionNorm.endsWith(` ${targetNorm}`) || actionNorm.includes(` ${targetNorm} `)) return folderSegmentLabel(actionLabel, actionLabel);
            return folderSegmentLabel(`${actionLabel} To ${targetLabel}`, `${actionLabel} To ${targetLabel}`);
          }

          function isActionWorthy(tag, attrs, actionLabel, handler) {
            const base = String(tag || "").split(".").pop().toLowerCase();
            const role = String(attrs.role || "").toLowerCase();
            const type = String(attrs.type || "").toLowerCase();
            const label = cleanWords(actionLabel || "");
            const combined = `${tag || ""} ${role} ${type} ${label} ${handler?.event || ""}`;
            const wordCount = label ? label.split(/\s+/).filter(Boolean).length : 0;
            const genericControlLabel = /^(action|button|link|input|label|field|div|span|section|article|header|footer|main|aside|content|wrapper|container|element|control)$/i.test(label);
            const labelIsSane = label && !genericControlLabel && wordCount <= 10 && label.length <= 80 && !isBadGeneratedLabel(actionLabel);
            const hasActionVerb = ACTION_LABEL_RE.test(label);

            if (!label || isNoiseActionLabel(combined)) return false;
            if (genericControlLabel) return false;
            if (isBadGeneratedLabel(actionLabel)) return false;
            if (/^\d+(\s+\d+)?$/.test(label)) return false;
            if (/^\d+\s+/.test(label) && !hasActionVerb) return false;
            if (GENERIC_ONE_WORD_ACTION_RE.test(label)) return false;
            if (/\b(input|label|field|item)\b/i.test(label) && !hasActionVerb) return false;
            if (wordCount > 10 || label.length > 80) return false;

            if (base === "form" && handler?.event === "onSubmit") return labelIsSane || hasActionVerb;
            if (base === "input" && ["button", "submit", "reset", "checkbox", "radio"].includes(type)) return labelIsSane || hasActionVerb;
            if (base === "button" || role === "button" || role === "menuitem" || role === "tab") return labelIsSane || hasActionVerb;
            if (base === "summary") return labelIsSane || hasActionVerb;
            if (["switch", "checkbox", "radio", "option"].includes(role)) return labelIsSane || hasActionVerb;
            if (attrs["aria-haspopup"] || attrs["aria-controls"]) return labelIsSane || hasActionVerb;
            if (hasActionVerb) return true;

            return false;
          }


          function posix(value) { return value.split(path.sep).join("/"); }
          function ext(rel) { return path.posix.extname(rel).toLowerCase(); }
          function sha16(value) { return crypto.createHash("sha256").update(String(value)).digest("hex").slice(0, 16); }
          function sha32(value) { return crypto.createHash("sha256").update(String(value)).digest("hex").slice(0, 32); }
          function cleanWords(value) { return String(value ?? "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[_./:@#?=&+\-[\](){}]+/g, " ").replace(/\s+/g, " ").trim(); }
          function titleCase(value) { return cleanWords(value).replace(/\b\w/g, (m) => m.toUpperCase()); }
          function sanitize(value, fallback = "Unnamed") {
            const clean = titleCase(value).replace(/[<>:"/\\|?*\x00-\x1F]/g, "").replace(/\.$/, "").slice(0, 96).trim();
            return clean || fallback;
          }
          function compactKnownBrands(value) {
            return String(value || "")
              .replace(/\bGame\s*Engin\b/g, "GameEngin")
              .replace(/\bCode\s*Engin\b/g, "CodeEngin")
              .replace(/\bMedia\s*Engin\b/g, "MediaEngin")
              .replace(/\bAsset\s*Engin\b/g, "AssetEngin")
              .replace(/\bMessage\s*Engin\b/g, "MessageEngin")
              .replace(/\bContent\s*Engin\b/g, "ContentEngin")
              .replace(/\bRender\s*Engin\b/g, "RenderEngin")
              .replace(/\bForge\s*Engin\b/g, "ForgeEngin")
              .replace(/\bBrand(?:ing)?\s*Engin\b/g, "BrandingEngin")
              .replace(/\bPortfolio\s*Engin\b/g, "PortfolioEngin")
              .replace(/\bLab\s*Engin\b/g, "LabEngin")
              .replace(/\bStar\s*Maker\s*Engin\b/g, "StarMakerEngin")
              .replace(/\bDream\s*DMBar\b/g, "DreamDMBar")
              .replace(/\bDreamr\b/g, "DreamR")
              .replace(/\bHome\s*Dream\b/g, "HomeDream");
          }

          function folderSegmentLabel(value, fallback = "Feature") {
            const raw = String(value || "").trim();
            if (!raw) return fallback;
            return compactKnownBrands(sanitize(raw, fallback)) || fallback;
          }

          function safeFileName(value, fallback = "source") {
            return sanitize(value, fallback).replace(/\s+/g, "-").toLowerCase().replace(/[^a-z0-9._-]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || fallback;
          }
          function sourceNoun(rel) {
            const base = path.posix.basename(rel).replace(/\.(tsx|jsx|ts|js|mjs|cjs)$/i, "");
            const parent = path.posix.basename(path.posix.dirname(rel));
            if (/^(page|layout|index|route|main|app)$/i.test(base)) return sanitize(parent || base, "Feature");
            return sanitize(base || parent || "Feature", "Feature");
          }
          function writeText(file, value) { fs.mkdirSync(path.dirname(file), { recursive: true }); fs.writeFileSync(file, value); }
          function writeJson(file, value) { writeText(file, JSON.stringify(value, null, 2) + "\n"); }
          function writeJsonl(file, rows) { writeText(file, rows.map((row) => JSON.stringify(row)).join("\n") + (rows.length ? "\n" : "")); }
          function rangeFor(rel, source, start, end, kind) { const text = source.slice(start, end); return { kind, sourcePath: rel, start, end, hash: sha16(text) }; }
          function writeRange(file, rel, source, range) {
            const text = source.slice(range.start, range.end);
            if (sha16(text) !== range.hash) throw new Error(`range hash mismatch: ${rel}:${range.start}-${range.end}`);
            writeText(file, text);
          }
          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { if (!SKIP_DIRS.has(entry.name)) walk(full, out); continue; }
              if (!entry.isFile()) continue;
              const rel = posix(path.relative(ROOT, full));
              if (SOURCE_EXTS.has(ext(rel))) out.push(rel);
            }
            return out;
          }
          function parseSource(source, rel = "") {
            const common = ["classProperties", "classPrivateProperties", "classPrivateMethods", "decorators-legacy", "objectRestSpread", "dynamicImport", "optionalChaining", "nullishCoalescingOperator", "topLevelAwait", "importMeta"];
            const lower = String(rel).toLowerCase(); const attempts = [];
            function add(sourceType, plugins) { attempts.push({ sourceType, plugins: Array.from(new Set(plugins)) }); }
            if (lower.endsWith(".tsx")) { add("module", ["jsx", "typescript", ...common]); add("unambiguous", ["jsx", "typescript", ...common]); }
            else if (lower.endsWith(".ts")) { add("module", ["typescript", ...common]); add("unambiguous", ["typescript", ...common]); add("module", ["jsx", "typescript", ...common]); }
            else if (lower.endsWith(".jsx")) { add("module", ["jsx", ...common]); add("unambiguous", ["jsx", ...common]); add("module", ["jsx", "flow", ...common]); add("module", ["jsx", "typescript", ...common]); add("script", ["jsx", ...common]); }
            else { add("module", ["jsx", ...common]); add("unambiguous", ["jsx", ...common]); add("module", [...common]); add("unambiguous", [...common]); add("module", ["jsx", "flow", ...common]); add("module", ["jsx", "typescript", ...common]); add("script", ["jsx", ...common]); }
            let last = null;
            for (const options of attempts) { try { return parser.parse(source, { sourceType: options.sourceType, errorRecovery: true, plugins: options.plugins }); } catch (error) { last = error; } }
            throw last || new Error(`Unable to parse ${rel}`);
          }
          function childNodes(node) {
            const out = []; if (!node || typeof node !== "object") return out;
            for (const key of Object.keys(node)) {
              if (["loc", "start", "end", "leadingComments", "trailingComments", "innerComments", "extra"].includes(key)) continue;
              const value = node[key];
              if (Array.isArray(value)) { for (const child of value) if (child && typeof child === "object" && child.type) out.push(child); }
              else if (value && typeof value === "object" && value.type) out.push(value);
            }
            return out;
          }
          function sourceOf(source, node) { if (!node || node.start == null || node.end == null) return ""; return source.slice(node.start, node.end); }
          function containsJSX(node) { let found = false; function visit(current) { if (!current || found) return; if (current.type === "JSXElement" || current.type === "JSXFragment") { found = true; return; } for (const child of childNodes(current)) visit(child); } visit(node); return found; }
          function jsxName(nameNode) {
            if (!nameNode) return "";
            if (nameNode.type === "JSXIdentifier") return nameNode.name;
            if (nameNode.type === "JSXMemberExpression") { const parts = []; let cursor = nameNode; while (cursor) { if (cursor.property?.name) parts.unshift(cursor.property.name); if (cursor.object?.name) { parts.unshift(cursor.object.name); break; } cursor = cursor.object; } return parts.join("."); }
            if (nameNode.type === "JSXNamespacedName") return `${nameNode.namespace?.name || ""}:${nameNode.name?.name || ""}`;
            return "";
          }
          function attrName(attr) { if (!attr || attr.type !== "JSXAttribute") return ""; const name = attr.name; if (!name) return ""; if (name.type === "JSXIdentifier") return name.name; if (name.type === "JSXNamespacedName") return `${name.namespace?.name || ""}:${name.name?.name || ""}`; return ""; }
          function exprText(node, source) {
            if (!node) return "";
            if (node.type === "StringLiteral") return node.value || "";
            if (node.type === "TemplateLiteral" && node.expressions.length === 0) return node.quasis.map((q) => q.value.cooked || q.value.raw || "").join("");
            if (node.type === "TemplateLiteral") { const raw = sourceOf(source, node); const m = raw.match(/[`'"]((?:\/|\.\/|\.\.\/)[^`'"\s${}]*)/); return m ? m[1] : raw; }
            if (node.type === "Identifier") return node.name;
            if (node.type === "ObjectExpression") { const pathname = node.properties.find((prop) => (prop.key?.name || prop.key?.value) === "pathname"); if (pathname?.value) return exprText(pathname.value, source); }
            return sourceOf(source, node);
          }
          function rawAttrValue(attr, source) { if (!attr || attr.type !== "JSXAttribute") return ""; if (!attr.value) return "true"; if (attr.value.type === "StringLiteral") return attr.value.value || ""; if (attr.value.type === "JSXExpressionContainer") return exprText(attr.value.expression, source); return ""; }
          function attrsOf(opening, source) { const attrs = Object.create(null); for (const attr of opening.attributes || []) { const name = attrName(attr); if (name) attrs[name] = rawAttrValue(attr, source); } return attrs; }
          function textFromJSX(node) { const pieces = []; function visit(child) { if (!child) return; if (child.type === "JSXText") { const text = child.value.replace(/\s+/g, " ").trim(); if (text) pieces.push(text); return; } if (child.type === "JSXExpressionContainer") { const expr = child.expression; if (expr?.type === "StringLiteral") pieces.push(expr.value); return; } for (const next of childNodes(child)) visit(next); } for (const child of node.children || []) visit(child); return pieces.join(" ").replace(/\s+/g, " ").trim().slice(0, 140); }
          function isDomTag(tag) { return /^[a-z][a-z0-9:-]*$/.test(tag || ""); }
          function isNonUiName(name) { return NON_UI_RE.test(cleanWords(name || "")); }
          function hasHandler(attrs) { return Object.keys(attrs).some((name) => /^on[A-Z]/.test(name)); }
          function isLinkLike(tag, attrs, sourceText = "") { const base = String(tag || "").split(".").pop().toLowerCase(); const role = String(attrs.role || "").toLowerCase(); return base === "a" || base === "link" || base.endsWith("link") || base === "navlink" || role === "link" || Boolean(attrs.href || attrs.to || attrs.route || attrs.path || attrs.url) || /\b(router\.(push|replace)|navigate\(|redirect\(|location\.href)\b/.test(sourceText); }
          function routeFromFile(rel) {
            const parts = rel.split("/"); const file = parts[parts.length - 1]; const base = file.replace(/\.(tsx|jsx|ts|js|mjs|cjs)$/i, "");
            const appIndex = parts.lastIndexOf("app"); if (appIndex >= 0 && ["page", "route"].includes(base)) { const routeParts = parts.slice(appIndex + 1, -1).filter((part) => part && !part.startsWith("(") && !part.startsWith("@")); return "/" + routeParts.filter(Boolean).join("/"); }
            const pagesIndex = parts.lastIndexOf("pages"); if (pagesIndex >= 0 && parts[pagesIndex + 1] !== "api") { const routeParts = parts.slice(pagesIndex + 1); routeParts[routeParts.length - 1] = base; const clean = routeParts.filter((part) => part !== "index"); return "/" + clean.join("/"); }
            return "";
          }
          function routeLabel(route) { if (!route || route === "/") return "Home"; return folderSegmentLabel(route.replace(/^\//, "").replace(/\[(\.{3})?([^\]]+)\]/g, "$2"), "Feature"); }


          function safeBrandFolderLabel(value, fallback = "Feature") {
            const clean = String(value || "").replace(/[<>:"/\\|?*\x00-\x1F]/g, "").replace(/\.$/, "").slice(0, 96).trim();
            return clean || fallback;
          }

          function literalPropFromSource(source, propName) {
            const re = new RegExp(`${propName}\\s*=\\s*["']([^"']+)["']`);
            const match = String(source || "").match(re);
            return match ? match[1] : "";
          }

          function componentPropFromSource(source, propName) {
            const re = new RegExp(`${propName}\\s*=\\s*\\{\\s*([A-Za-z_$][\\w$]*)\\s*\\}`);
            const match = String(source || "").match(re);
            return match ? match[1] : "";
          }

          function enginRouteSuffix(route, brand) {
            const parts = String(route || "").split("/").filter(Boolean);
            if (!parts.length) return "";

            const brandBase = String(brand || "").replace(/Engin$/i, "").toLowerCase();

            if (parts[0] === "daydream") return "";
            if (parts[0] === "engines" && parts[1] && parts[1].toLowerCase() === brandBase) {
              return parts.slice(2).map((part) => part.replace(/\[(\.{3})?([^\]]+)\]/g, "$2")).join(" ");
            }

            const idx = parts.findIndex((part) => part.toLowerCase() === brandBase);
            if (idx >= 0) return parts.slice(idx + 1).map((part) => part.replace(/\[(\.{3})?([^\]]+)\]/g, "$2")).join(" ");

            return "";
          }

          function featureLabelFromEnginBrand(brand, route) {
            const cleanBrand = safeBrandFolderLabel(brand, "Feature");
            const suffix = folderSegmentLabel(enginRouteSuffix(route, cleanBrand), "");
            return suffix ? folderSegmentLabel(`${cleanBrand} ${suffix}`, cleanBrand) : cleanBrand;
          }

          function brandedFeatureLabel(component) {
            if (!component) return "";

            const source = sourceCache.get(component.sourcePath) || "";

            const enginName = literalPropFromSource(source, "enginName");
            if (enginName && /Engin$/i.test(enginName)) return featureLabelFromEnginBrand(enginName, component.route);

            const engineName = literalPropFromSource(source, "engineName");
            if (engineName && /Engin$/i.test(engineName)) return featureLabelFromEnginBrand(engineName, component.route);

            const sideBComponent = componentPropFromSource(source, "sideBComponent");
            if (sideBComponent && /Engin$/i.test(sideBComponent)) return featureLabelFromEnginBrand(sideBComponent, component.route);

            const daydreamType = literalPropFromSource(source, "daydreamType");
            if (daydreamType) {
              const mapped = {
                games: "GameEngin",
                game: "GameEngin",
                lab: "LabEngin",
                media: "MediaEngin",
                assets: "AssetEngin",
                messages: "MessageEngin",
                social: "SocialEngin",
                profile: "ProfileEngin",
                settings: "SettingsEngin",
                workspace: "WorkspaceEngin",
                code: "CodeEngin",
                content: "ContentEngin"
              }[daydreamType.toLowerCase()];
              if (mapped) return featureLabelFromEnginBrand(mapped, component.route);
            }

            const pathBrand = enginBrandFromRouteRel(component.sourcePath);
            if (pathBrand) return featureLabelFromEnginBrand(pathBrand, component.route);

            if (component.name && /Engin$/i.test(component.name)) return featureLabelFromEnginBrand(component.name, component.route);

            return "";
          }

          function normalizeTarget(raw, currentRoute) {
            const value = String(raw || "").trim(); if (!value) return { kind: "unknown", raw: value, route: "" };
            if (/^(data:|blob:)/i.test(value) || /^`?data[:\s]/i.test(value)) return { kind: "download", raw: value, route: "" };
            if (/^(mailto:|tel:|http:\/\/|https:\/\/)/i.test(value)) return { kind: "external", raw: value, route: "" };
            if (value.startsWith("#")) return { kind: "anchor", raw: value, route: currentRoute || "/" };
            if (/[`$]/.test(value) || /[{}]/.test(value) || /[A-Za-z_$][\w$]*\s*\(/.test(value)) return { kind: "dynamic", raw: value, route: "" };
