          for (const row of rangeRows) { const source = sourceCache.get(row.sourcePath); if (!source) continue; const text = source.slice(row.range.start, row.range.end); if (sha16(text) !== row.range.hash) validation.rangeHashFailures.push(row); }
          writeJson(path.join(META, "export-map.json"), { format: "dreamengin.recursive-website-feature-tree.v20", model: { featureFolders: "route/page components and source-owned UI components with links/actions", linkFolders: "navigation links and router navigation actions inside feature folders", opensFolders: "link destination feature folders expanded recursively with cycle and repeat protection", actionFolders: "meaningful non-navigation controls only; generic Button/Input/Label and oversized field-text folders are not emitted", structuralJsxFolders: false, sourceOwnedValueResolution: true, bindingHrefDynamicFix: true, plumbingLabelCleanup: true, duplicateToLabelFix: true, dottedHrefDynamicFix: true, numericActionFilter: true, mapTemplateExpansion: true, importedStaticValues: true, globalRepeatExpansion: false, zeroRouteFallback: true, rootSelection: "home route plus routes with no inbound links; fallback only when needed", unreachedRouteCapture: true, runtimeFeatureLayer: true, sourceOwnedBrandingLabels: true, exactEnginBrandingLabels: true, functionCallHrefDynamic: true, renderEnginUsedByFeature: true, exactBrandFolderNames: true, engineNameBrandingLabels: true, labEnginRouteBranding: true, enginCapabilityLayer: true, dreamDMBarOSLayer: true, scopedDreamDMBarCapture: true, guardedEnginBrandDetection: true, renderEnginNotCreativeEngin: true, nestedDestinationBrandFolders: true, enginImportClosure: true, noBrandPlaceholderLeak: true, fullCapabilitySourceModules: true, iconOnlyBackLinkLabels: true, noRuntimeTestFiles: true, scopedRuntimeClosure: true, enginNameBrandingLabels: true, cartridgeRuntimeCapture: true, bridgeRuntimeCapture: true, renderEnginRuntimePathCapture: true }, totals: { sourceFiles: sourceFiles.length, features: featureRows.length, links: linkRows.length, actions: actionRows.length, destinationExpansions: destinationRows.length, runtimeFeatures: runtimeFeatureRows.length, unreachedRoutes: unreachedRouteRows.length, parseFailures: parseFailures.