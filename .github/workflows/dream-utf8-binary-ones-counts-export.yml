name: DREAM UTF-8 Binary Ones Counts Export

on:
  workflow_dispatch:
    inputs:
      window_bits:
        description: "Window size for curve counts"
        required: false
        default: "1024"
      application_roots:
        description: "Comma-separated application code roots"
        required: false
        default: "app,components,engine,engins,dreamdmbar,dreamr,hooks,types,supabase,lib,utils,public"

permissions:
  contents: read

jobs:
  utf8-binary-ones-counts:
    name: UTF-8 binary bit counts export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert application code to UTF-8 binary and count 1-bit positions
        shell: bash
        env:
          WINDOW_BITS: ${{ inputs.window_bits || '1024' }}
          APPLICATION_ROOTS: ${{ inputs.application_roots || 'app,components,engine,engins,dreamdmbar,dreamr,hooks,types,supabase,lib,utils,public' }}
        run: |
          cat > /tmp/dream_utf8_binary_ones_counts_export.py <<'PY'
          from __future__ import annotations

          import csv
          import gzip
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path
          from typing import Iterable, List

          OUT_DIR = Path(".dream-utf8-binary-ones-counts-export")
          ZIP_PATH = Path("dream-utf8-binary-ones-counts-export.zip")

          APP_CODE_EXTENSIONS = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs",
              ".json", ".jsonc", ".md", ".mdx",
              ".css", ".scss", ".sass",
              ".html", ".svg",
              ".py", ".sh", ".sql",
              ".yml", ".yaml",
              ".toml", ".ini",
              ".txt",
          }

          EXCLUDE_DIRS = {
              ".git", ".github", "node_modules", ".next", "out", "dist", "build",
              "coverage", ".turbo", ".vercel", ".cache", "__pycache__",
              ".pytest_cache", ".dream-utf8-binary-ones-counts-export",
          }

          EXCLUDE_FILE_NAMES = {
              "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lockb",
              "dream-utf8-binary-ones-counts-export.zip",
          }

          MAX_FILE_BYTES = 5_000_000


          def application_roots() -> List[str]:
              raw = os.environ.get(
                  "APPLICATION_ROOTS",
                  "app,components,engine,engins,dreamdmbar,dreamr,hooks,types,supabase,lib,utils,public",
              )
              return [item.strip().strip("/") for item in raw.split(",") if item.strip()]


          def window_bits() -> int:
              raw = os.environ.get("WINDOW_BITS", "1024")
              try:
                  value = int(raw)
              except ValueError:
                  value = 1024
              return max(8, value)


          def should_include_file(path: Path, root: Path, app_roots: List[str]) -> bool:
              if not path.is_file():
                  return False

              rel = path.relative_to(root)

              if any(part in EXCLUDE_DIRS for part in rel.parts):
                  return False

              if path.name in EXCLUDE_FILE_NAMES:
                  return False

              first = rel.as_posix().split("/", 1)[0]
              if first not in app_roots:
                  return False

              if path.suffix.lower() not in APP_CODE_EXTENSIONS:
                  return False

              if path.stat().st_size > MAX_FILE_BYTES:
                  return False

              return True


          def iter_application_code_files(root: Path) -> Iterable[Path]:
              app_roots = application_roots()
              for path in sorted(root.rglob("*")):
                  if should_include_file(path, root, app_roots):
                      yield path


          def to_bits(data: bytes) -> str:
              return "".join(f"{byte:08b}" for byte in data)


          def safe_name(source_path: str) -> str:
              return source_path.replace("/", "__").replace("\\", "__")


          def write_gzip_text(path: Path, value: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              with gzip.open(path, "wt", encoding="utf-8") as handle:
                  handle.write(value)


          def append_csv_rows(path: Path, fieldnames: List[str], rows: Iterable[dict]) -> int:
              path.parent.mkdir(parents=True, exist_ok=True)
              count = 0

              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()

                  for row in rows:
                      writer.writerow(row)
                      count += 1

              return count


          def write_global_ones_csv(path: Path, ones_rows: Iterable[dict]) -> int:
              return append_csv_rows(
                  path,
                  ["sourcePath", "fileBitPosition", "globalBitPosition", "byteIndex", "byteBitPosition"],
                  ones_rows,
              )


          def zip_dir(source: Path, destination: Path) -> None:
              if destination.exists():
                  destination.unlink()

              with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(source).as_posix())


          def main() -> int:
              root = Path(".").resolve()
              w = window_bits()

              if OUT_DIR.exists():
                  shutil.rmtree(OUT_DIR)

              OUT_DIR.mkdir(parents=True)
              (OUT_DIR / ".de").mkdir(parents=True)
              (OUT_DIR / "Counts").mkdir(parents=True)

              files_index = []
              all_global_one_rows = []

              # Byte slot counts:
              # slot 1 means first bit in each byte, slot 8 means last bit in each byte.
              byte_slot_ones = {slot: 0 for slot in range(1, 9)}
              byte_slot_zeros = {slot: 0 for slot in range(1, 9)}
              byte_slot_total = {slot: 0 for slot in range(1, 9)}

              global_window_rows = []
              global_next_bit = 1
              total_bits = 0
              total_ones = 0
              total_zeros = 0

              for file_path in iter_application_code_files(root):
                  source_path = file_path.relative_to(root).as_posix()

                  try:
                      text = file_path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  data = text.encode("utf-8")
                  bits = to_bits(data)
                  safe = safe_name(source_path)

                  binary_rel = f"UTF8 Binary/{safe}.bits.gz"
                  one_positions_rel = f"One Bit Positions/{safe}.ones.csv"
                  file_windows_rel = f"Curve Windows/{safe}.windows.csv"

                  write_gzip_text(OUT_DIR / binary_rel, bits)

                  file_one_rows = []
                  file_window_rows = []

                  file_byte_slot_ones = {slot: 0 for slot in range(1, 9)}
                  file_byte_slot_zeros = {slot: 0 for slot in range(1, 9)}
                  file_byte_slot_total = {slot: 0 for slot in range(1, 9)}

                  for zero_index, bit in enumerate(bits):
                      file_bit_position = zero_index + 1
                      global_bit_position = global_next_bit + zero_index
                      byte_index = zero_index // 8
                      byte_bit_position = (zero_index % 8) + 1

                      byte_slot_total[byte_bit_position] += 1
                      file_byte_slot_total[byte_bit_position] += 1

                      if bit == "1":
                          byte_slot_ones[byte_bit_position] += 1
                          file_byte_slot_ones[byte_bit_position] += 1

                          row = {
                              "sourcePath": source_path,
                              "fileBitPosition": file_bit_position,
                              "globalBitPosition": global_bit_position,
                              "byteIndex": byte_index,
                              "byteBitPosition": byte_bit_position,
                          }
                          file_one_rows.append(row)
                          all_global_one_rows.append(row)
                      else:
                          byte_slot_zeros[byte_bit_position] += 1
                          file_byte_slot_zeros[byte_bit_position] += 1

                  append_csv_rows(
                      OUT_DIR / one_positions_rel,
                      ["sourcePath", "fileBitPosition", "globalBitPosition", "byteIndex", "byteBitPosition"],
                      file_one_rows,
                  )

                  for start_zero_based in range(0, len(bits), w):
                      chunk = bits[start_zero_based:start_zero_based + w]
                      if not chunk:
                          continue

                      ones = chunk.count("1")
                      zeros = len(chunk) - ones
                      window_index = start_zero_based // w

                      row = {
                          "sourcePath": source_path,
                          "fileWindowIndex": window_index,
                          "fileBitStart": start_zero_based + 1,
                          "fileBitEnd": start_zero_based + len(chunk),
                          "globalBitStart": global_next_bit + start_zero_based,
                          "globalBitEnd": global_next_bit + start_zero_based + len(chunk) - 1,
                          "bitsInWindow": len(chunk),
                          "onesCount": ones,
                          "zerosCount": zeros,
                          "oneRatio": ones / len(chunk),
                      }

                      file_window_rows.append(row)
                      global_window_rows.append(row)

                  append_csv_rows(
                      OUT_DIR / file_windows_rel,
                      [
                          "sourcePath", "fileWindowIndex", "fileBitStart", "fileBitEnd",
                          "globalBitStart", "globalBitEnd", "bitsInWindow",
                          "onesCount", "zerosCount", "oneRatio",
                      ],
                      file_window_rows,
                  )

                  file_bits = len(bits)
                  file_ones = len(file_one_rows)
                  file_zeros = file_bits - file_ones

                  file_counts_rel = f"Counts/Per File Byte Slot Counts/{safe}.byte-slots.csv"
                  append_csv_rows(
                      OUT_DIR / file_counts_rel,
                      ["sourcePath", "byteBitPosition", "onesCount", "zerosCount", "totalBits", "oneRatio"],
                      [
                          {
                              "sourcePath": source_path,
                              "byteBitPosition": slot,
                              "onesCount": file_byte_slot_ones[slot],
                              "zerosCount": file_byte_slot_zeros[slot],
                              "totalBits": file_byte_slot_total[slot],
                              "oneRatio": file_byte_slot_ones[slot] / file_byte_slot_total[slot]
                              if file_byte_slot_total[slot]
                              else 0,
                          }
                          for slot in range(1, 9)
                      ],
                  )

                  files_index.append(
                      {
                          "sourcePath": source_path,
                          "utf8Bytes": len(data),
                          "bits": file_bits,
                          "onesCount": file_ones,
                          "zerosCount": file_zeros,
                          "oneRatio": file_ones / file_bits if file_bits else 0,
                          "sha256OfUtf8Bytes": hashlib.sha256(data).hexdigest(),
                          "utf8Binary": binary_rel,
                          "oneBitPositions": one_positions_rel,
                          "curveWindows": file_windows_rel,
                          "byteSlotCounts": file_counts_rel,
                          "globalBitStart": global_next_bit,
                          "globalBitEnd": global_next_bit + file_bits - 1 if file_bits else global_next_bit - 1,
                      }
                  )

                  global_next_bit += file_bits
                  total_bits += file_bits
                  total_ones += file_ones
                  total_zeros += file_zeros

              write_global_ones_csv(
                  OUT_DIR / "One Bit Positions" / "_GLOBAL_ONES.csv",
                  all_global_one_rows,
              )

              append_csv_rows(
                  OUT_DIR / "Counts" / "_BYTE_SLOT_COUNTS.csv",
                  ["byteBitPosition", "onesCount", "zerosCount", "totalBits", "oneRatio"],
                  [
                      {
                          "byteBitPosition": slot,
                          "onesCount": byte_slot_ones[slot],
                          "zerosCount": byte_slot_zeros[slot],
                          "totalBits": byte_slot_total[slot],
                          "oneRatio": byte_slot_ones[slot] / byte_slot_total[slot]
                          if byte_slot_total[slot]
                          else 0,
                      }
                      for slot in range(1, 9)
                  ],
              )

              append_csv_rows(
                  OUT_DIR / "Counts" / "_FILE_COUNTS.csv",
                  [
                      "sourcePath", "utf8Bytes", "bits", "onesCount", "zerosCount",
                      "oneRatio", "globalBitStart", "globalBitEnd",
                  ],
                  [
                      {
                          "sourcePath": item["sourcePath"],
                          "utf8Bytes": item["utf8Bytes"],
                          "bits": item["bits"],
                          "onesCount": item["onesCount"],
                          "zerosCount": item["zerosCount"],
                          "oneRatio": item["oneRatio"],
                          "globalBitStart": item["globalBitStart"],
                          "globalBitEnd": item["globalBitEnd"],
                      }
                      for item in files_index
                  ],
              )

              append_csv_rows(
                  OUT_DIR / "Counts" / "_WINDOW_COUNTS.csv",
                  [
                      "globalWindowIndex", "sourcePath", "fileWindowIndex",
                      "fileBitStart", "fileBitEnd", "globalBitStart", "globalBitEnd",
                      "bitsInWindow", "onesCount", "zerosCount", "oneRatio",
                  ],
                  [
                      {"globalWindowIndex": idx, **row}
                      for idx, row in enumerate(global_window_rows)
                  ],
              )

              global_counts = {
                  "format": "dreamengin.utf8-binary-one-bit-counts.v1",
                  "operation": "application code -> UTF-8 bytes -> binary bits -> count 1-bit positions",
                  "bitNumbering": {
                      "base": 1,
                      "example": {
                          "positions": "12345678",
                          "bits": "00010011",
                          "oneBitPositions": [4, 7, 8],
                          "countByByteBitPosition": {
                              "4": 1,
                              "7": 1,
                              "8": 1,
                          },
                      },
                      "byteBitPosition": "1 through 8 inside each UTF-8 byte",
                      "fileBitPosition": "1-based bit number inside each file",
                      "globalBitPosition": "1-based bit number across all included application code files in sorted path order",
                  },
                  "applicationRoots": application_roots(),
                  "windowBits": w,
                  "totals": {
                      "files": len(files_index),
                      "bits": total_bits,
                      "onesCount": total_ones,
                      "zerosCount": total_zeros,
                      "oneRatio": total_ones / total_bits if total_bits else 0,
                  },
                  "byteSlotCounts": {
                      str(slot): {
                          "onesCount": byte_slot_ones[slot],
                          "zerosCount": byte_slot_zeros[slot],
                          "totalBits": byte_slot_total[slot],
                          "oneRatio": byte_slot_ones[slot] / byte_slot_total[slot]
                          if byte_slot_total[slot]
                          else 0,
                      }
                      for slot in range(1, 9)
                  },
                  "outputs": {
                      "globalCounts": "Counts/_GLOBAL_COUNTS.json",
                      "byteSlotCounts": "Counts/_BYTE_SLOT_COUNTS.csv",
                      "fileCounts": "Counts/_FILE_COUNTS.csv",
                      "windowCounts": "Counts/_WINDOW_COUNTS.csv",
                      "globalOneBitPositions": "One Bit Positions/_GLOBAL_ONES.csv",
                  },
                  "files": files_index,
              }

              (OUT_DIR / "Counts" / "_GLOBAL_COUNTS.json").write_text(
                  json.dumps(global_counts, indent=2),
                  encoding="utf-8",
              )

              (OUT_DIR / ".de" / "utf8-binary-one-bit-counts-map.json").write_text(
                  json.dumps(global_counts, indent=2),
                  encoding="utf-8",
              )

              report = [
                  "# DREAM UTF-8 Binary Ones Counts Export",
                  "",
                  "This artifact converts APPLICATION CODE to UTF-8 binary, numbers every bit, separates the 1-bit positions, and counts them.",
                  "",
                  "Example:",
                  "",
                  "```text",
                  "positions: 12345678",
                  "bits:      00010011",
                  "ones:      4, 7, 8",
                  "counts:    4=1, 7=1, 8=1",
                  "```",
                  "",
                  "## Count outputs",
                  "",
                  "```text",
                  "Counts/_GLOBAL_COUNTS.json",
                  "Counts/_BYTE_SLOT_COUNTS.csv",
                  "Counts/_FILE_COUNTS.csv",
                  "Counts/_WINDOW_COUNTS.csv",
                  "```",
                  "",
                  "## Graph output",
                  "",
                  "Use:",
                  "",
                  "```text",
                  "Counts/_WINDOW_COUNTS.csv",
                  "```",
                  "",
                  "Graph:",
                  "",
                  "```text",
                  "x-axis = globalWindowIndex",
                  "y-axis = onesCount",
                  "```",
                  "",
                  "## Byte slot count",
                  "",
                  "Use:",
                  "",
                  "```text",
                  "Counts/_BYTE_SLOT_COUNTS.csv",
                  "```",
                  "",
                  "This counts how often bit-position 1 through 8 is `1` across every UTF-8 byte in the application codebase.",
                  "",
                  f"- Files transformed: `{len(files_index)}`",
                  f"- Total bits: `{total_bits}`",
                  f"- Total one-bits: `{total_ones}`",
              ]

              (OUT_DIR / "DREAM_UTF8_BINARY_ONES_COUNTS_EXPORT.md").write_text(
                  "\n".join(report),
                  encoding="utf-8",
              )

              zip_dir(OUT_DIR, ZIP_PATH)

              print(f"Created {ZIP_PATH}")
              print(f"Files transformed: {len(files_index)}")
              print(f"Total bits: {total_bits}")
              print(f"Total one-bits: {total_ones}")
              print("Counts: Counts/_GLOBAL_COUNTS.json")
              print("Byte slot counts: Counts/_BYTE_SLOT_COUNTS.csv")
              print("Window counts for graph: Counts/_WINDOW_COUNTS.csv")

              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 /tmp/dream_utf8_binary_ones_counts_export.py

      - name: Upload UTF-8 binary ones counts export
        uses: actions/upload-artifact@v4
        with:
          name: dream-utf8-binary-ones-counts-export
          path: dream-utf8-binary-ones-counts-export.zip
          if-no-files-found: error
