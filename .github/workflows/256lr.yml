name: SHA-256 36-Step Chain

on:
  workflow_dispatch:
    inputs:
      message:
        description: Input text to hash
        required: true
        default: abc
        type: string

jobs:
  hash-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Run SHA-256 chain
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import struct

          M = 0xFFFFFFFF

          K = [
              0x428A2F98, 0x71374491, 0xB5C0FBCF, 0xE9B5DBA5,
              0x3956C25B, 0x59F111F1, 0x923F82A4, 0xAB1C5ED5,
              0xD807AA98, 0x12835B01, 0x243185BE, 0x550C7DC3,
              0x72BE5D74, 0x80DEB1FE, 0x9BDC06A7, 0xC19BF174,
              0xE49B69C1, 0xEFBE4786, 0x0FC19DC6, 0x240CA1CC,
              0x2DE92C6F, 0x4A7484AA, 0x5CB0A9DC, 0x76F988DA,
              0x983E5152, 0xA831C66D, 0xB00327C8, 0xBF597FC7,
              0xC6E00BF3, 0xD5A79147, 0x06CA6351, 0x14292967,
              0x27B70A85, 0x2E1B2138, 0x4D2C6DFC, 0x53380D13,
              0x650A7354, 0x766A0ABB, 0x81C2C92E, 0x92722C85,
              0xA2BFE8A1, 0xA81A664B, 0xC24B8B70, 0xC76C51A3,
              0xD192E819, 0xD6990624, 0xF40E3585, 0x106AA070,
              0x19A4C116, 0x1E376C08, 0x2748774C, 0x34B0BCB5,
              0x391C0CB3, 0x4ED8AA4A, 0x5B9CCA4F, 0x682E6FF3,
              0x748F82EE, 0x78A5636F, 0x84C87814, 0x8CC70208,
              0x90BEFFFA, 0xA4506CEB, 0xBEF9A3F7, 0xC67178F2,
          ]

          H0 = [
              0x6A09E667,
              0xBB67AE85,
              0x3C6EF372,
              0xA54FF53A,
              0x510E527F,
              0x9B05688C,
              0x1F83D9AB,
              0x5BE0CD19,
          ]


          def rotl(x, n):
              return ((x << n) | (x >> (32 - n))) & M


          def add(*values):
              return sum(values) & M


          def pad(msg):
              bit_length = len(msg) * 8
              padded = bytearray(msg)
              padded.append(0x80)

              while len(padded) % 64 != 56:
                  padded.append(0)

              padded += struct.pack(">Q", bit_length)
              return bytes(padded)


          def sha256_left(msg):
              data = pad(msg)
              H = list(H0)

              for i in range(0, len(data), 64):
                  W = list(struct.unpack(">16I", data[i:i + 64]))

                  for t in range(16, 64):
                      s1 = (
                          rotl(W[t - 2], 17)
                          ^ rotl(W[t - 2], 19)
                          ^ ((W[t - 2] << 10) & M)
                      )

                      s0 = (
                          rotl(W[t - 15], 7)
                          ^ rotl(W[t - 15], 18)
                          ^ ((W[t - 15] << 3) & M)
                      )

                      W.append(
                          add(
                              s1,
                              W[t - 7],
                              s0,
                              W[t - 16],
                          )
                      )

                  a, b, c, d, e, f, g, h = H

                  for t in range(64):
                      S1 = (
                          rotl(e, 6)
                          ^ rotl(e, 11)
                          ^ rotl(e, 25)
                      )

                      S0 = (
                          rotl(a, 2)
                          ^ rotl(a, 13)
                          ^ rotl(a, 22)
                      )

                      ch = ((e & f) ^ ((~e) & g)) & M
                      maj = ((a & b) ^ (a & c) ^ (b & c)) & M

                      T1 = add(h, S1, ch, K[t], W[t])
                      T2 = add(S0, maj)

                      h = g
                      g = f
                      f = e
                      e = add(d, T1)
                      d = c
                      c = b
                      b = a
                      a = add(T1, T2)

                  H = [
                      add(H[j], value)
                      for j, value in enumerate(
                          [a, b, c, d, e, f, g, h]
                      )
                  ]

              return struct.pack(">8I", *H)


          def run_36_steps(data):
              value = data
              step = 0

              print(f"Initial input: {data!r}")
              print()

              for round_number in range(1, 13):
                  value = hashlib.sha256(value).digest()
                  step += 1
                  print(
                      f"Step {step:02d} | "
                      f"Round {round_number:02d} | "
                      f"SHA-256      | {value.hex()}"
                  )

                  value = sha256_left(value)
                  step += 1
                  print(
                      f"Step {step:02d} | "
                      f"Round {round_number:02d} | "
                      f"SHA-256-LEFT | {value.hex()}"
                  )

                  value = hashlib.sha256(value).digest()
                  step += 1
                  print(
                      f"Step {step:02d} | "
                      f"Round {round_number:02d} | "
                      f"SHA-256      | {value.hex()}"
                  )

              print()
              print(f"Final result: {value.hex()}")


          message = os.environ["INPUT_MESSAGE"].encode("utf-8")
          run_36_steps(message)
          PY
