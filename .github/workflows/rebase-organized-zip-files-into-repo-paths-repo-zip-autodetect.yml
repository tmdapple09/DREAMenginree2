name: Rebase Organized ZIP Files Into Repo Paths

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to organized ZIP in repo, or a folder containing the ZIP"
        required: true
        default: "_incoming/dreamengin-organized-repository.zip"
      commit_changes:
        description: "Commit rebased files back to this branch"
        required: true
        type: boolean
        default: true
      run_install:
        description: "Install dependencies before verification"
        required: true
        type: boolean
        default: true
      run_typecheck:
        description: "Run pnpm typecheck after rebasing"
        required: true
        type: boolean
        default: true
      run_build:
        description: "Run pnpm build after rebasing"
        required: true
        type: boolean
        default: false
      fail_on_unmapped_files:
        description: "Fail if any file in the ZIP cannot be mapped back to a repo path"
        required: true
        type: boolean
        default: true
      allow_png_files:
        description: "Allow PNG files from the organized ZIP to be rebased into the repo"
        required: true
        type: boolean
        default: false
      commit_message:
        description: "Commit message"
        required: true
        default: "chore(dreamengin): rebase organized zip files into repo paths"

permissions:
  contents: write

jobs:
  rebase-organized-zip:
    name: Strip organized wrapper and restore real repo paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve organized ZIP from repo
        shell: bash
        env:
          ZIP_PATH_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          mkdir -p _rebase_organized_zip_work
          RESOLVED_ZIP="_rebase_organized_zip_work/resolved-organized-repository.zip"
          rm -f "$RESOLVED_ZIP"

          choose_zip_from_dir() {
            local dir="$1"

            if [ ! -d "$dir" ]; then
              return 1
            fi

            local preferred=""
            preferred="$(find "$dir" -maxdepth 1 -type f -name "*organized*repository*.zip" -print0 \
              | xargs -0 -r ls -t 2>/dev/null \
              | head -n 1 || true)"

            if [ -n "$preferred" ]; then
              echo "$preferred"
              return 0
            fi

            local newest=""
            newest="$(find "$dir" -maxdepth 1 -type f -name "*.zip" -print0 \
              | xargs -0 -r ls -t 2>/dev/null \
              | head -n 1 || true)"

            if [ -n "$newest" ]; then
              echo "$newest"
              return 0
            fi

            return 1
          }

          if [ -f "$ZIP_PATH_INPUT" ]; then
            cp "$ZIP_PATH_INPUT" "$RESOLVED_ZIP"
            echo "Using organized ZIP from exact repo path: $ZIP_PATH_INPUT"
          else
            search_dir="$ZIP_PATH_INPUT"
            if [ ! -d "$search_dir" ]; then
              search_dir="$(dirname "$ZIP_PATH_INPUT")"
            fi

            candidate="$(choose_zip_from_dir "$search_dir" || true)"

            if [ -z "$candidate" ] && [ "$search_dir" != "_incoming" ]; then
              candidate="$(choose_zip_from_dir "_incoming" || true)"
            fi

            if [ -z "$candidate" ]; then
              echo "ZIP not found at exact path: $ZIP_PATH_INPUT"
              echo "No ZIP could be auto-selected from: $search_dir"
              echo "Also checked: _incoming"
              echo ""
              echo "Put any organized repository ZIP in _incoming/, for example:"
              echo "  _incoming/dreamengin-organized-repository-code-fixed-pass5-render-shared-runtime.zip"
              echo ""
              echo "ZIPs currently visible:"
              find _incoming -maxdepth 1 -type f -name "*.zip" -print 2>/dev/null || true
              exit 1
            fi

            cp "$candidate" "$RESOLVED_ZIP"
            echo "Exact zip_path was not found, so using newest matching repo ZIP:"
            echo "  $candidate"
          fi

          unzip -t "$RESOLVED_ZIP" >/dev/null
          echo "Resolved organized ZIP verified: $RESOLVED_ZIP"
          echo "RESOLVED_ZIP_PATH=$RESOLVED_ZIP" >> "$GITHUB_ENV"

      - name: Rebase organized ZIP files into real repository paths
        shell: bash
        env:
          ZIP_PATH_INPUT: ${{ env.RESOLVED_ZIP_PATH }}
          FAIL_ON_UNMAPPED_FILES: ${{ inputs.fail_on_unmapped_files }}
          ALLOW_PNG_FILES: ${{ inputs.allow_png_files }}
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_PATH_INPUT" ]; then
            echo "Resolved ZIP not found: $ZIP_PATH_INPUT"
            exit 1
          fi

          python <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Dict, Iterable, List, Optional, Tuple

          REPO = Path.cwd().resolve()
          ZIP_PATH = (REPO / os.environ["ZIP_PATH_INPUT"]).resolve()
          FAIL_ON_UNMAPPED = os.environ.get("FAIL_ON_UNMAPPED_FILES") == "true"
          ALLOW_PNG_FILES = os.environ.get("ALLOW_PNG_FILES") == "true"

          WORK = REPO / "_rebase_organized_zip_work"
          OUTER_EXTRACT = WORK / "outer_extract"
          NESTED_EXTRACT = WORK / "nested_extract"
          REPORT_MD = WORK / "rebase_report.md"
          REPORT_CSV = WORK / "rebase_manifest.csv"
          REPORT_JSON = WORK / "rebase_manifest.json"

          CATEGORY_NAMES = {
              "01_define_user_flow",
              "02_build_data_model",
              "03_build_backend",
              "04_build_api_layer",
              "05_build_runtime_state",
              "06_build_application_behavior",
              "07_build_pages_screens",
              "08_build_ui_components",
              "09_wire_interactions",
              "10_verify_build_deploy",
              "11_security",
              "12_performance",
              "13_accessibility",
              "14_observability",
              "15_dev_tooling",
              "16_product_operations",
              "17_compliance_policy",
              "18_content_assets",
              "19_release_management",
              "20_documentation",
          }

          GENERATED_FILE_NAMES = {
              "__DO_NOT_RETURN_BEHAVIOR_LOCATIONS.md",
              "organized_file_tree.txt",
              "organized_manifest.json",
              "organized_manifest.csv",
              "cross_linked_files.md",
              "category_counts.md",
              "rebase_report.md",
              "rebase_manifest.csv",
              "rebase_manifest.json",
          }

          SKIP_FILE_NAMES = {
              ".DS_Store",
              "Thumbs.db",
              *GENERATED_FILE_NAMES,
          }

          BLOCKED_DIR_NAMES = {
              "__MACOSX",
              ".git",
              ".svn",
              ".hg",
              "node_modules",
              ".next",
              "dist",
              "build",
              ".turbo",
              ".cache",
              "_organized_repo_artifact",
              "_rebase_organized_zip_work",
          }

          BLOCKED_ROOT_OUTPUTS = {
              "_incoming",
              "_organized_repo_artifact",
              "_rebase_organized_zip_work",
          }

          @dataclass
          class PlannedFile:
              extracted_path: Path
              source_inside_zip: str
              destination: Path
              category: str
              subfolder: str
              dreamengin_area: str

          @dataclass
          class RebaseRow:
              source_inside_zip: str
              destination: str
              action: str
              category: str
              subfolder: str
              dreamengin_area: str
              size: int
              sha256: str
              note: str

          @dataclass
          class UnmappedRow:
              source_inside_zip: str
              reason: str

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def normalize_zip_name(name: str) -> str:
              return name.replace("\\", "/")

          def safe_zip_member(name: str) -> bool:
              normalized = normalize_zip_name(name)
              if normalized.startswith("/"):
                  return False
              parts = [part for part in normalized.split("/") if part not in {"", "."}]
              if not parts:
                  return False
              if any(part == ".." for part in parts):
                  return False
              if any(part in BLOCKED_DIR_NAMES for part in parts):
                  return False
              return True

          def extract_zip(zip_path: Path, target_dir: Path) -> None:
              target_dir.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(zip_path, "r") as archive:
                  for member in archive.infolist():
                      name = normalize_zip_name(member.filename)
                      if not safe_zip_member(name):
                          raise SystemExit(f"Blocked unsafe ZIP member: {member.filename}")
                      if member.is_dir():
                          continue

                      parts = [part for part in name.split("/") if part not in {"", "."}]
                      if not parts:
                          continue

                      if parts[-1] in SKIP_FILE_NAMES:
                          continue

                      if not ALLOW_PNG_FILES and parts[-1].lower().endswith(".png"):
                          continue

                      target = target_dir.joinpath(*parts).resolve()
                      try:
                          target.relative_to(target_dir.resolve())
                      except ValueError:
                          raise SystemExit(f"Blocked ZIP extraction outside target dir: {member.filename}")

                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(member, "r") as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

          def iter_files(root: Path) -> Iterable[Path]:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue

                  relative_parts = path.relative_to(root).parts
                  if any(part in BLOCKED_DIR_NAMES for part in relative_parts):
                      continue

                  if path.name in SKIP_FILE_NAMES:
                      continue

                  if not ALLOW_PNG_FILES and path.name.lower().endswith(".png"):
                      continue

                  yield path

          def find_category_index(parts: Tuple[str, ...]) -> Optional[int]:
              for index, part in enumerate(parts):
                  if part in CATEGORY_NAMES:
                      return index
              return None

          def contains_organized_category(root: Path) -> bool:
              for file in iter_files(root):
                  if find_category_index(file.relative_to(root).parts) is not None:
                      return True
              return False

          def choose_extract_root() -> Path:
              if contains_organized_category(OUTER_EXTRACT):
                  return OUTER_EXTRACT

              nested_zips = [
                  path for path in iter_files(OUTER_EXTRACT)
                  if path.suffix.lower() == ".zip"
              ]

              if len(nested_zips) == 1:
                  extract_zip(nested_zips[0], NESTED_EXTRACT)
                  if contains_organized_category(NESTED_EXTRACT):
                      return NESTED_EXTRACT
                  raise SystemExit("Nested ZIP was found and extracted, but it does not contain the organized 20-folder structure.")

              if len(nested_zips) > 1:
                  found = "\n".join(str(path.relative_to(OUTER_EXTRACT)) for path in nested_zips)
                  raise SystemExit(
                      "Outer ZIP does not contain the organized 20-folder structure and has multiple nested ZIPs. "
                      "Upload the actual organized repository ZIP or leave only one nested ZIP.\n"
                      + found
                  )

              raise SystemExit(
                  "ZIP does not contain the organized 20-folder structure. Expected paths like:\n"
                  "organized-repository/05_build_runtime_state/active_engine/gameengin/engins/gameengin/index.ts"
              )

          def map_back_to_repo_path(extracted_file: Path, extract_root: Path) -> Tuple[Optional[PlannedFile], Optional[UnmappedRow]]:
              relative = extracted_file.relative_to(extract_root)
              parts = relative.parts
              category_index = find_category_index(parts)

              if category_index is None:
                  return None, UnmappedRow(str(relative).replace("\\", "/"), "No 20-category bucket found in file path")

              if len(parts) <= category_index + 3:
                  return None, UnmappedRow(
                      str(relative).replace("\\", "/"),
                      "Path has category bucket but is missing subfolder, DREAMengin area, or original repo path"
                  )

              category = parts[category_index]
              subfolder = parts[category_index + 1]
              dreamengin_area = parts[category_index + 2]
              original_repo_parts = parts[category_index + 3:]

              if not original_repo_parts:
                  return None, UnmappedRow(
                      str(relative).replace("\\", "/"),
                      "No original repo path after category/subfolder/DREAMengin-area wrapper"
                  )

              if original_repo_parts[0] in CATEGORY_NAMES:
                  return None, UnmappedRow(
                      str(relative).replace("\\", "/"),
                      "Original repo path starts with another category bucket; wrapper is ambiguous"
                  )

              if original_repo_parts[0] in BLOCKED_ROOT_OUTPUTS:
                  return None, UnmappedRow(
                      str(relative).replace("\\", "/"),
                      f"Original repo path targets generated/upload workspace: {original_repo_parts[0]}"
                  )

              if any(part in BLOCKED_DIR_NAMES for part in original_repo_parts):
                  return None, UnmappedRow(
                      str(relative).replace("\\", "/"),
                      "Original repo path contains a blocked generated/dependency directory"
                  )

              if any(part == ".." for part in original_repo_parts):
                  return None, UnmappedRow(
                      str(relative).replace("\\", "/"),
                      "Original repo path contains parent traversal"
                  )

              destination = REPO.joinpath(*original_repo_parts).resolve()
              try:
                  destination.relative_to(REPO)
              except ValueError:
                  return None, UnmappedRow(str(relative).replace("\\", "/"), "Mapped destination escapes repository root")

              return PlannedFile(
                  extracted_path=extracted_file,
                  source_inside_zip=str(relative).replace("\\", "/"),
                  destination=destination,
                  category=category,
                  subfolder=subfolder,
                  dreamengin_area=dreamengin_area,
              ), None

          def plan_files(extract_root: Path) -> Tuple[List[PlannedFile], List[UnmappedRow], List[RebaseRow]]:
              planned_by_destination: Dict[str, PlannedFile] = {}
              planned: List[PlannedFile] = []
              unmapped: List[UnmappedRow] = []
              duplicate_rows: List[RebaseRow] = []

              for file in iter_files(extract_root):
                  mapped, unmapped_row = map_back_to_repo_path(file, extract_root)

                  if unmapped_row is not None:
                      unmapped.append(unmapped_row)
                      continue

                  if mapped is None:
                      continue

                  destination_key = str(mapped.destination.relative_to(REPO)).replace("\\", "/")
                  if destination_key not in planned_by_destination:
                      planned_by_destination[destination_key] = mapped
                      planned.append(mapped)
                      continue

                  first = planned_by_destination[destination_key]
                  if sha256_file(first.extracted_path) != sha256_file(mapped.extracted_path):
                      raise SystemExit(
                          "Duplicate destination conflict. Two different files map back to the same repo path:\n"
                          f"destination: {destination_key}\n"
                          f"first: {first.source_inside_zip}\n"
                          f"second: {mapped.source_inside_zip}"
                      )

                  duplicate_rows.append(
                      RebaseRow(
                          source_inside_zip=mapped.source_inside_zip,
                          destination=destination_key,
                          action="duplicate_same_content_skipped",
                          category=mapped.category,
                          subfolder=mapped.subfolder,
                          dreamengin_area=mapped.dreamengin_area,
                          size=mapped.extracted_path.stat().st_size,
                          sha256=sha256_file(mapped.extracted_path),
                          note="Same destination and same content as another ZIP file; skipped to avoid duplicate writes.",
                      )
                  )

              return planned, unmapped, duplicate_rows

          def apply_planned_files(planned: List[PlannedFile]) -> List[RebaseRow]:
              rows: List[RebaseRow] = []

              for item in planned:
                  destination_relative = str(item.destination.relative_to(REPO)).replace("\\", "/")
                  source_hash = sha256_file(item.extracted_path)
                  source_size = item.extracted_path.stat().st_size

                  if item.destination.exists():
                      if item.destination.is_dir():
                          raise SystemExit(f"Destination is a directory, cannot overwrite with file: {destination_relative}")
                      existing_hash = sha256_file(item.destination)
                      if existing_hash == source_hash:
                          action = "unchanged"
                      else:
                          item.destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(item.extracted_path, item.destination)
                          action = "updated"
                  else:
                      item.destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item.extracted_path, item.destination)
                      action = "created"

                  rows.append(
                      RebaseRow(
                          source_inside_zip=item.source_inside_zip,
                          destination=destination_relative,
                          action=action,
                          category=item.category,
                          subfolder=item.subfolder,
                          dreamengin_area=item.dreamengin_area,
                          size=source_size,
                          sha256=source_hash,
                          note="Stripped organized wrapper and restored to real repo path.",
                      )
                  )

              return rows

          def write_reports(rows: List[RebaseRow], unmapped: List[UnmappedRow]) -> None:
              created = sum(1 for row in rows if row.action == "created")
              updated = sum(1 for row in rows if row.action == "updated")
              unchanged = sum(1 for row in rows if row.action == "unchanged")
              duplicate_skipped = sum(1 for row in rows if row.action == "duplicate_same_content_skipped")

              REPORT_JSON.write_text(
                  json.dumps(
                      {
                          "zip_path": str(ZIP_PATH.relative_to(REPO)),
                          "created": created,
                          "updated": updated,
                          "unchanged": unchanged,
                          "duplicate_same_content_skipped": duplicate_skipped,
                          "unmapped": len(unmapped),
                          "allow_png_files": ALLOW_PNG_FILES,
                          "rebased_files": [row.__dict__ for row in rows],
                          "unmapped_files": [row.__dict__ for row in unmapped],
                      },
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              with REPORT_CSV.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=[
                          "source_inside_zip",
                          "destination",
                          "action",
                          "category",
                          "subfolder",
                          "dreamengin_area",
                          "size",
                          "sha256",
                          "note",
                      ],
                  )
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(row.__dict__)

              lines: List[str] = []
              lines.append("# Rebase Organized ZIP Into Real Repo Paths")
              lines.append("")
              lines.append("This workflow does not copy the 20-folder organized structure into the repo.")
              lines.append("It strips the organized wrapper and writes each file back to its real repository path.")
              lines.append("")
              lines.append(f"ZIP: `{ZIP_PATH.relative_to(REPO)}`")
              lines.append(f"PNG rebasing allowed: `{ALLOW_PNG_FILES}`")
              lines.append("")
              lines.append("## Summary")
              lines.append("")
              lines.append(f"- created: {created}")
              lines.append(f"- updated: {updated}")
              lines.append(f"- unchanged: {unchanged}")
              lines.append(f"- duplicate same-content skipped: {duplicate_skipped}")
              lines.append(f"- unmapped: {len(unmapped)}")
              lines.append(f"- total processed rows: {len(rows)}")
              lines.append("")
              lines.append("## Rebased Files")
              lines.append("")

              for row in rows:
                  lines.append(f"- `{row.destination}`")
                  lines.append(f"  - action: `{row.action}`")
                  lines.append(f"  - source in ZIP: `{row.source_inside_zip}`")
                  lines.append(f"  - wrapper stripped: `{row.category}/{row.subfolder}/{row.dreamengin_area}`")

              if unmapped:
                  lines.append("")
                  lines.append("## Unmapped Files")
                  lines.append("")
                  for row in unmapped:
                      lines.append(f"- `{row.source_inside_zip}`")
                      lines.append(f"  - reason: {row.reason}")

              REPORT_MD.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def main() -> None:
              if OUTER_EXTRACT.exists():
                  shutil.rmtree(OUTER_EXTRACT)
              if NESTED_EXTRACT.exists():
                  shutil.rmtree(NESTED_EXTRACT)

              OUTER_EXTRACT.mkdir(parents=True, exist_ok=True)
              extract_zip(ZIP_PATH, OUTER_EXTRACT)
              extract_root = choose_extract_root()

              planned, unmapped, duplicate_rows = plan_files(extract_root)

              if unmapped and FAIL_ON_UNMAPPED:
                  write_reports(duplicate_rows, unmapped)
                  print(REPORT_MD.read_text(encoding="utf-8"))
                  raise SystemExit("Unmapped files found and fail_on_unmapped_files=true.")

              if not planned and not duplicate_rows:
                  write_reports([], unmapped)
                  print(REPORT_MD.read_text(encoding="utf-8"))
                  raise SystemExit("No files mapped back to repository paths.")

              applied_rows = apply_planned_files(planned)
              all_rows = applied_rows + duplicate_rows
              write_reports(all_rows, unmapped)
              print(REPORT_MD.read_text(encoding="utf-8"))

          main()
          PY

      - name: Show rebase result
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Rebase report"
          cat _rebase_organized_zip_work/rebase_report.md
          echo "::endgroup::"

          echo "::group::Git status"
          git status --short
          echo "::endgroup::"

      - name: Setup pnpm
        if: ${{ inputs.run_install && (inputs.run_typecheck || inputs.run_build) }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        if: ${{ inputs.run_install && (inputs.run_typecheck || inputs.run_build) }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ inputs.run_install && (inputs.run_typecheck || inputs.run_build) }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - name: Run typecheck
        if: ${{ inputs.run_typecheck }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck

      - name: Run build
        if: ${{ inputs.run_build }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm build

      - name: Commit rebased files
        if: ${{ inputs.commit_changes }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':!_rebase_organized_zip_work/**' \
            ':!_organized_repo_artifact/**' \
            ':!_incoming/**'

          if git diff --cached --quiet; then
            echo "No repository file changes to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push
