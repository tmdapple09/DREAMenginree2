name: Generate Application Code LaTeX Listing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate LaTeX code listing
        run: |
          mkdir -p latex_output

          cat > latex_output/application_code.tex << 'EOF'
          \documentclass{article}
          \usepackage[margin=1in]{geometry}
          \usepackage{listings}
          \usepackage[hidelinks]{hyperref}
          \lstset{
            basicstyle=\ttfamily\small,
            breaklines=true,
            columns=fullflexible,
            frame=single,
            showstringspaces=false
          }
          \title{Application Code Listing}
          \author{Generated by GitHub Actions}
          \date{\today}
          \begin{document}
          \maketitle
          \tableofcontents
          \newpage
          EOF

          while IFS= read -r file; do
            [ -f "$file" ] || continue

            ext="${file##*.}"

            # Allowed application code extensions including SQL
            case "$ext" in
              java|c|cpp|cc|h|hpp|cs|go|rs|swift|kt|scala|dart|js|jsx|ts|tsx|sql)
                ;;
              *)
                continue
                ;;
            esac

            # Exclude tests, docs, scripts, build, dependencies, etc.
            if echo "$file" | grep -Eq '/(test|tests|spec|docs|doc|scripts|script|build|dist|node_modules|vendor|\.git|\.github)/'; then
              continue
            fi

            tex_name=$(echo "$file" | sed 's|^\./||' | sed 's|_|\\_|g; s|&|\\&|g; s|%|\\%|g; s|#|\\#|g')

            echo "\section{File: \texttt{$tex_name}}" >> latex_output/application_code.tex
            echo "\lstinputlisting{$file}" >> latex_output/application_code.tex
            echo "" >> latex_output/application_code.tex
          done < <(find . -type f | sort)

          echo "\end{document}" >> latex_output/application_code.tex

      - name: Upload LaTeX file
        uses: actions/upload-artifact@v4
        with:
          name: application-code-latex
          path: latex_output/application_code.tex
