name: Generate Application Code LaTeX Listing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate LaTeX code listing
        run: |
          mkdir -p latex_output

          # LaTeX header
          cat > latex_output/application_code.tex << 'EOF'
          \documentclass{article}
          \usepackage{listings}
          \usepackage[margin=1in]{geometry}
          \usepackage{hyperref}
          \lstset{
            basicstyle=\ttfamily\small,
            breaklines=true,
            columns=fullflexible,
            frame=single,
            showstringspaces=false
          }
          \title{Application Code Listing}
          \author{Generated by GitHub Actions}
          \date{\today}
          \begin{document}
          \maketitle
          \tableofcontents
          \newpage
          EOF

          # Find code files, excluding non-code and repository meta directories/files
          while IFS= read -r file; do
            filename=$(basename "$file")
            ext="${filename##*.}"

            # Allowed code extensions
            case "$ext" in
              py|js|ts|tsx|jsx|java|c|cpp|cc|h|hpp|rb|go|php|cs|kt|swift|sh|bash|bat|ps1|sql|html|css|scss|less|vue|dart|rs|scala|pl|lua|r|m|mm|groovy|gradle|kts|tf|hcl|ex|exs|clj|fs|fsx|erl|hrl)
                ;;
              *)
                continue
                ;;
            esac

            # Exclude paths containing test, spec, or generated directories
            if echo "$file" | grep -qE '/(test|tests|spec|dist|build|node_modules|vendor|\.git|\.github)/'; then
              continue
            fi

            # Replace underscores for LaTeX section names
            tex_name=$(echo "$file" | sed 's|^\./||' | sed 's|_|\\_|g; s|&|\\&|g; s|%|\\%|g; s|#|\\#|g')

            echo "\section{File: \texttt{$tex_name}}" >> latex_output/application_code.tex
            echo "\lstinputlisting{$file}" >> latex_output/application_code.tex
            echo "" >> latex_output/application_code.tex
          done < <(find . -type f | sort)

          # Close document
          echo "\end{document}" >> latex_output/application_code.tex

      - name: Upload LaTeX file
        uses: actions/upload-artifact@v4
        with:
          name: application-code-latex
          path: latex_output/application_code.tex
