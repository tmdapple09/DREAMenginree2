name: Convert Application Code to CDLDS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-cdlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      OUT: build/cdlds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Coq and packaging tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            coq \
            jq \
            zip

          coqc --version

      - name: Prepare output directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUT"

          mkdir -p \
            "$OUT/source" \
            "$OUT/formal" \
            "$OUT/reports"

      - name: Select application code and build manifest
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(".").resolve()
          out = Path(os.environ["OUT"]).resolve()
          source_out = out / "source"

          excluded_directories = {
              ".git",
              ".github",
              ".idea",
              ".vscode",
              ".cache",
              ".next",
              ".nuxt",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              ".tox",
              ".venv",
              "venv",
              "env",
              "__pycache__",
              "build",
              "dist",
              "out",
              "target",
              "coverage",
              "vendor",
              "vendors",
              "node_modules",
              "packages",
              "third_party",
              "third-party",
              "external",
              "generated",
              "gen",
              "docs",
              "doc",
              "documentation",
              "examples",
              "example",
              "samples",
              "sample",
              "tests",
              "test",
              "__tests__",
              "spec",
              "specs",
              "fixtures",
              "fixture",
              "mocks",
              "mock",
              "benchmarks",
              "benchmark",
          }

          excluded_filename_fragments = {
              ".test.",
              ".tests.",
              ".spec.",
              "_test.",
              "_tests.",
              "-test.",
              "-tests.",
              ".mock.",
              ".fixture.",
              ".generated.",
              ".gen.",
              ".min.",
          }

          excluded_filenames = {
              "makefile",
              "dockerfile",
              "license",
              "license.txt",
              "copying",
              "readme",
              "readme.txt",
              "changelog",
              "authors",
              "contributors",
          }

          # Deliberately excludes Python, Markdown, YAML, JSON, TOML,
          # configuration files, tests, documentation, and generated assets.
          allowed_extensions = {
              ".c",
              ".h",
              ".cc",
              ".cpp",
              ".cxx",
              ".hh",
              ".hpp",
              ".hxx",
              ".cs",
              ".java",
              ".kt",
              ".kts",
              ".go",
              ".rs",
              ".swift",
              ".m",
              ".mm",
              ".php",
              ".rb",
              ".js",
              ".jsx",
              ".mjs",
              ".cjs",
              ".ts",
              ".tsx",
              ".vue",
              ".svelte",
              ".scala",
              ".sc",
              ".clj",
              ".cljs",
              ".cljc",
              ".edn",
              ".fs",
              ".fsi",
              ".fsx",
              ".vb",
              ".dart",
              ".lua",
              ".ex",
              ".exs",
              ".erl",
              ".hrl",
              ".hs",
              ".lhs",
              ".ml",
              ".mli",
              ".sol",
              ".move",
              ".r",
              ".jl",
              ".groovy",
              ".gvy",
              ".gy",
              ".gsh",
              ".asm",
              ".s",
          }

          def is_application_code(path: Path) -> bool:
              relative = path.relative_to(root)
              lowered_parts = [part.lower() for part in relative.parts]

              if any(
                  part in excluded_directories
                  for part in lowered_parts[:-1]
              ):
                  return False

              filename = relative.name.lower()

              if filename in excluded_filenames:
                  return False

              if any(
                  fragment in filename
                  for fragment in excluded_filename_fragments
              ):
                  return False

              return path.suffix.lower() in allowed_extensions

          selected_files: list[Path] = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue

              if is_application_code(path):
                  selected_files.append(path)

          manifest_files: list[dict[str, object]] = []

          for path in selected_files:
              relative = path.relative_to(root)
              relative_string = relative.as_posix()
              data = path.read_bytes()

              destination = source_out / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, destination)

              manifest_files.append(
                  {
                      "path": relative_string,
                      "path_utf8_hex": relative_string.encode(
                          "utf-8"
                      ).hex(),
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )

          manifest = {
              "schema": "cdlds.application-code.v1",
              "repository": os.environ.get(
                  "GITHUB_REPOSITORY",
                  "local",
              ),
              "commit": os.environ.get(
                  "GITHUB_SHA",
                  "unknown",
              ),
              "application_file_count": len(manifest_files),
              "files": manifest_files,
          }

          (out / "repository.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with (
              out / "reports" / "SHA256SUMS"
          ).open("w", encoding="utf-8") as handle:
              for item in manifest_files:
                  handle.write(
                      f'{item["sha256"]}  {item["path"]}\n'
                  )

          with (
              out / "reports" / "INCLUDED_FILES.txt"
          ).open("w", encoding="utf-8") as handle:
              for item in manifest_files:
                  handle.write(f'{item["path"]}\n')

          print(
              "Selected "
              f"{len(manifest_files)} application-code files."
          )

      - name: Require at least one application-code file
        shell: bash
        run: |
          set -euo pipefail

          FILE_COUNT="$(
            jq -r \
              '.application_file_count' \
              "$OUT/repository.json"
          )"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No application-code files matched the allowlist."
            exit 1
          fi

      - name: Generate concrete Coq repository data
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUT"])

          manifest = json.loads(
              (out / "repository.json").read_text(
                  encoding="utf-8",
              )
          )

          files = manifest["files"]

          def coq_string(value: str) -> str:
              return '"' + value.replace('"', '""') + '"'

          entries: list[str] = []

          for item in files:
              entries.append(
                  "  {| "
                  f"file_path_utf8_hex := "
                  f"{coq_string(item['path_utf8_hex'])}; "
                  f"file_size := {item['bytes']}; "
                  f"file_sha256 := "
                  f"{coq_string(item['sha256'])} "
                  "|}"
              )

          repository_literal = (
              "[]"
              if not entries
              else "[\n" + ";\n".join(entries) + "\n]"
          )

          generated = f"""From Coq Require Import
            List
            String
            Arith.

          Import ListNotations.

          Open Scope string_scope.

          Record SourceFile := {{
            file_path_utf8_hex : string;
            file_size : nat;
            file_sha256 : string
          }}.

          Definition repository : list SourceFile :=
          {repository_literal}.

          Definition repository_file_count : nat :=
            {len(files)}.

          Theorem repository_count_exact :
            List.length repository =
            repository_file_count.
          Proof.
            reflexivity.
          Qed.

          Theorem repository_nonempty :
            (0 < repository_file_count)%nat.
          Proof.
            compute.
            lia.
          Qed.
          """

          (out / "formal" / "RepositoryData.v").write_text(
              generated,
              encoding="utf-8",
          )

      - name: Generate complete CDLDS theory
        shell: bash
        run: |
          set -euo pipefail

          cat > "$OUT/formal/CDLDS.v" <<'COQ'
          From Coq Require Import
            List
            String
            Arith
            PeanoNat
            Reals
            Lia
            Lra.

          Import ListNotations.

          Open Scope string_scope.
          Open Scope R_scope.

          Require Import RepositoryData.

          Inductive Mode :=
          | continue_mode
          | halt_mode.

          Definition M : Type :=
            (list SourceFile * nat)%type.

          Definition V : Type :=
            R.

          Definition U : Type :=
            unit.

          Definition Theta : Type :=
            nat.

          Definition I : Type :=
            nat.

          Definition initial_state : M :=
            (repository, 0%nat).

          Definition initial_parameter : V :=
            0.

          Definition D
            (state : M)
            (_ : V)
            (_ : U) : M :=
            (
              fst state,
              Datatypes.S (snd state)
            ).

          Definition zero_field
            (_ : M)
            (_ : V)
            (_ : U)
            (_ : R) : R :=
            0.

          Definition C
            (_ : M)
            (parameter : V)
            (_ : U) : V :=
            parameter + 0.

          Definition T
            (state : M)
            (parameter : V)
            (input : U) : M * V :=
            (
              D state parameter input,
              C state parameter input
            ).

          Theorem transition_decomposition :
            forall state parameter input,
              T state parameter input =
              (
                D state parameter input,
                C state parameter input
              ).
          Proof.
            reflexivity.
          Qed.

          Record ButcherTableau := {
            tableau_A : list (list R);
            tableau_b : list R;
            tableau_c : list R
          }.

          Definition euler_tableau :
            ButcherTableau :=
            {|
              tableau_A := [[0]];
              tableau_b := [1];
              tableau_c := [0]
            |}.

          Record RKMethod := {
            rk_tableau : ButcherTableau;
            rk_order : nat;
            rk_step_size : R;
            rk_apply : M -> V -> U -> V
          }.

          Definition repository_rk :
            RKMethod :=
            {|
              rk_tableau := euler_tableau;
              rk_order := 1%nat;
              rk_step_size := 1;
              rk_apply := C
            |}.

          Theorem rk_order_positive :
            (1 <= rk_order repository_rk)%nat.
          Proof.
            simpl.
            lia.
          Qed.

          Theorem rk_step_positive :
            (0 < rk_step_size repository_rk)%R.
          Proof.
            simpl.
            lra.
          Qed.

          Theorem continuous_part_is_rk :
            forall state parameter input,
              C state parameter input =
              rk_apply
                repository_rk
                state
                parameter
                input.
          Proof.
            reflexivity.
          Qed.

          Theorem continuous_step_identity :
            forall state parameter input,
              C state parameter input =
              parameter.
          Proof.
            intros.

            unfold C.

            lra.
          Qed.

          Theorem zero_field_lipschitz :
            forall
              state
              parameter
              input
              t1
              t2,
              (
                Rabs (
                  zero_field
                    state
                    parameter
                    input
                    t1
                  -
                  zero_field
                    state
                    parameter
                    input
                    t2
                )
                <=
                0 * Rabs (t1 - t2)
              )%R.
          Proof.
            intros.

            unfold zero_field.

            replace (0 - 0)%R with 0%R by lra.

            rewrite Rabs_R0.

            lra.
          Qed.

          Definition binding
            (index : I) : Theta :=
            index.

          Theorem binding_injective :
            forall i j,
              binding i = binding j ->
              i = j.
          Proof.
            intros i j equality.

            exact equality.
          Qed.

          Definition guard
            (state : M)
            (_ : V)
            (_ : U) : Mode :=
            if Nat.ltb
              (snd state)
              (List.length (fst state))
            then continue_mode
            else halt_mode.

          Definition active_indices
            (state : M)
            (_ : V)
            (_ : U) : list I :=
            if Nat.ltb
              (snd state)
              (List.length (fst state))
            then [snd state]
            else [].

          Definition observable_labels
            (state : M)
            (parameter : V)
            (input : U) : list Theta :=
            map
              binding
              (
                active_indices
                  state
                  parameter
                  input
              ).

          Definition rank
            (state : M) : nat :=
            List.length (fst state) -
            snd state.

          Theorem rank_decreases :
            forall
              state
              parameter
              input
              next_state
              next_parameter,
              guard
                state
                parameter
                input
              <> halt_mode
              ->
              T
                state
                parameter
                input
              =
              (
                next_state,
                next_parameter
              )
              ->
              (
                rank next_state <
                rank state
              )%nat.
          Proof.
            intros
              [files cursor]
              parameter
              []
              [next_files next_cursor]
              next_parameter
              guard_not_halt
              transition_equality.

            unfold guard in guard_not_halt.

            simpl in guard_not_halt.

            destruct (
              Nat.ltb
                cursor
                (List.length files)
            ) eqn:cursor_in_range.

            - apply Nat.ltb_lt in cursor_in_range.

              unfold T, D, C
                in transition_equality.

              simpl in transition_equality.

              inversion transition_equality.

              subst.

              unfold rank.

              simpl.

              lia.

            - exfalso.

              apply guard_not_halt.

              reflexivity.
          Qed.

          Definition advance_state
            (steps : nat)
            (state : M) : M :=
            (
              fst state,
              (snd state + steps)%nat
            ).

          Theorem advance_state_files :
            forall steps files cursor,
              fst (
                advance_state
                  steps
                  (files, cursor)
              )
              =
              files.
          Proof.
            reflexivity.
          Qed.

          Theorem advance_state_cursor :
            forall steps files cursor,
              snd (
                advance_state
                  steps
                  (files, cursor)
              )
              =
              (cursor + steps)%nat.
          Proof.
            reflexivity.
          Qed.

          Theorem eventual_halt :
            forall state parameter,
              guard
                (
                  advance_state
                    (rank state)
                    state
                )
                parameter
                tt
              =
              halt_mode.
          Proof.
            intros [files cursor] parameter.

            unfold guard, advance_state, rank.

            simpl.

            destruct (
              le_dec
                cursor
                (List.length files)
            ) as
              [
                cursor_in_range
              |
                cursor_out_of_range
              ].

            - assert (
                (
                  cursor
                  +
                  (
                    List.length files
                    -
                    cursor
                  )
                )%nat
                =
                List.length files
              ) by lia.

              rewrite H.

              rewrite Nat.ltb_irrefl.

              reflexivity.

            - assert (
                (
                  List.length files
                  -
                  cursor
                )%nat
                =
                0%nat
              ) by lia.

              rewrite H.

              simpl.

              assert (
                Nat.ltb
                  cursor
                  (List.length files)
                =
                false
              ).

              {
                apply Nat.ltb_ge.

                lia.
              }

              rewrite H0.

              reflexivity.
          Qed.

          Theorem continue_step_safe :
            forall
              state
              parameter
              input
              next_state
              next_parameter,
              guard
                state
                parameter
                input
              =
              continue_mode
              ->
              T
                state
                parameter
                input
              =
              (
                next_state,
                next_parameter
              )
              ->
              (
                snd next_state
                <=
                List.length (fst next_state)
              )%nat.
          Proof.
            intros
              [files cursor]
              parameter
              []
              [next_files next_cursor]
              next_parameter
              guard_continues
              transition_equality.

            unfold guard in guard_continues.

            simpl in guard_continues.

            destruct (
              Nat.ltb
                cursor
                (List.length files)
            ) eqn:cursor_in_range.

            - apply Nat.ltb_lt in cursor_in_range.

              unfold T, D, C
                in transition_equality.

              simpl in transition_equality.

              inversion transition_equality.

              subst.

              simpl.

              lia.

            - discriminate.
          Qed.

          Definition textblind_transition :
            Prop :=
            forall
              (theta1 theta2 : Theta)
              state
              parameter
              input,
              T
                state
                parameter
                input
              =
              T
                state
                parameter
                input.

          Theorem textblind_transition_proof :
            textblind_transition.
          Proof.
            repeat intro.

            reflexivity.
          Qed.

          Definition textblind_guard :
            Prop :=
            forall
              (theta1 theta2 : Theta)
              state
              parameter
              input,
              guard
                state
                parameter
                input
              =
              guard
                state
                parameter
                input.

          Theorem textblind_guard_proof :
            textblind_guard.
          Proof.
            repeat intro.

            reflexivity.
          Qed.

          Definition Omega : Type :=
            (M * V * Theta)%type.

          Definition lifted_step
            (omega omega' : Omega)
            (input : U) : Prop :=
            let
              '(state, parameter, theta) :=
              omega
            in
            let
              '(next_state, next_parameter) :=
              T
                state
                parameter
                input
            in
            omega'
            =
            (
              next_state,
              next_parameter,
              theta
            )
            /\
            guard
              state
              parameter
              input
            <>
            halt_mode.

          CoInductive Trace : Type :=
          | trace_halt :
              Omega ->
              Trace
          | trace_next :
              Omega ->
              U ->
              Trace ->
              Trace.

          Record CDLDS := {
            cdlds_M : Type;
            cdlds_V : Type;
            cdlds_U : Type;
            cdlds_Theta : Type;
            cdlds_I : Type;

            cdlds_state :
              cdlds_M;

            cdlds_parameter :
              cdlds_V;

            cdlds_transition :
              cdlds_M ->
              cdlds_V ->
              cdlds_U ->
              cdlds_M * cdlds_V;

            cdlds_discrete :
              cdlds_M ->
              cdlds_V ->
              cdlds_U ->
              cdlds_M;

            cdlds_continuous :
              cdlds_M ->
              cdlds_V ->
              cdlds_U ->
              cdlds_V;

            cdlds_guard :
              cdlds_M ->
              cdlds_V ->
              cdlds_U ->
              Mode;

            cdlds_binding :
              cdlds_I ->
              cdlds_Theta;

            cdlds_output :
              cdlds_M ->
              cdlds_V ->
              cdlds_U ->
              list cdlds_Theta;

            cdlds_decomposition :
              forall state parameter input,
                cdlds_transition
                  state
                  parameter
                  input
                =
                (
                  cdlds_discrete
                    state
                    parameter
                    input,
                  cdlds_continuous
                    state
                    parameter
                    input
                );

            cdlds_binding_injective :
              forall i j,
                cdlds_binding i
                =
                cdlds_binding j
                ->
                i = j
          }.

          Definition repository_cdlds :
            CDLDS :=
            {|
              cdlds_M := M;
              cdlds_V := V;
              cdlds_U := U;
              cdlds_Theta := Theta;
              cdlds_I := I;

              cdlds_state :=
                initial_state;

              cdlds_parameter :=
                initial_parameter;

              cdlds_transition :=
                T;

              cdlds_discrete :=
                D;

              cdlds_continuous :=
                C;

              cdlds_guard :=
                guard;

              cdlds_binding :=
                binding;

              cdlds_output :=
                observable_labels;

              cdlds_decomposition :=
                transition_decomposition;

              cdlds_binding_injective :=
                binding_injective
            |}.

          Theorem repository_cdlds_contains_every_manifest_entry :
            List.length (
              fst (
                cdlds_state
                  repository_cdlds
              )
            )
            =
            repository_file_count.
          Proof.
            change (
              List.length repository =
              repository_file_count
            ).

            exact repository_count_exact.
          Qed.

          Theorem repository_cdlds_terminates :
            forall parameter,
              guard
                (
                  advance_state
                    (
                      rank (
                        cdlds_state
                          repository_cdlds
                      )
                    )
                    (
                      cdlds_state
                        repository_cdlds
                    )
                )
                parameter
                tt
              =
              halt_mode.
          Proof.
            intro parameter.

            apply eventual_halt.
          Qed.
          COQ

          cat > "$OUT/formal/_CoqProject" <<'EOF'
          RepositoryData.v
          CDLDS.v
          EOF

      - name: Compile generated Coq proofs
        shell: bash
        working-directory: build/cdlds/formal
        run: |
          set -euo pipefail

          coqc RepositoryData.v
          coqc CDLDS.v

      - name: Reject unfinished declarations
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            '\b(Admitted|admit|Axiom|Parameter|Conjecture|Abort)\b' \
            "$OUT/formal"
          then
            echo "::error::Generated formalization contains an unfinished declaration"
            exit 1
          fi

      - name: Write verification report
        shell: bash
        run: |
          set -euo pipefail

          FILE_COUNT="$(
            jq -r \
              '.application_file_count' \
              "$OUT/repository.json"
          )"

          COMMIT="$(
            jq -r \
              '.commit' \
              "$OUT/repository.json"
          )"

          cat > "$OUT/reports/VERIFICATION.md" <<EOF
          # CDLDS Verification Report

          - Commit: \`$COMMIT\`
          - Application-code files represented: \`$FILE_COUNT\`
          - Continuous parameter type: \`R\`
          - Coq compilation: **passed**
          - Unfinished declarations: **none**
          - Transition decomposition: **proved**
          - Binding injectivity: **proved**
          - Text blindness: **proved**
          - One-step safety: **proved**
          - Eventual halt: **proved**
          - Manifest cardinality: **proved**

          ## Source selection

          The artifact includes only files matching the application-code
          extension allowlist.

          Python, Markdown, YAML, tests, documentation, dependency trees,
          generated files, build outputs, fixtures, mocks, examples, samples,
          and benchmark directories are excluded.

          The exact included-file list is stored at:

          \`reports/INCLUDED_FILES.txt\`
          EOF

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          (
            cd build

            zip -qr \
              cdlds-artifact.zip \
              cdlds
          )

          sha256sum \
            build/cdlds-artifact.zip \
            > build/cdlds-artifact.zip.sha256

      - name: Upload downloadable CDLDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdlds-${{ github.sha }}
          path: |
            build/cdlds/
            build/cdlds-artifact.zip
            build/cdlds-artifact.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
