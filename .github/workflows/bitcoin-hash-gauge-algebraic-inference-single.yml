          MCMC_BURN = max(0, int(os.environ.get("MCMC_BURN", "128")))
          MCMC_THIN = max(1, int(os.environ.get("MCMC_THIN", "2")))
          MCMC_CHAINS = max(1, min(8, int(os.environ.get("MCMC_CHAINS", "4"))))
          MCMC_POINT_CAP = max(128, int(os.environ.get("MCMC_POINT_CAP", "2048")))
          PERSISTENCE_SAMPLE_CAP = max(16, min(256, int(os.environ.get("PERSISTENCE_SAMPLE_CAP", "96"))))
          STABILITY_REPEATS = max(2, min(64, int(os.environ.get("STABILITY_REPEATS", "8"))))
          STABILITY_POINT_CAP = max(128, int(os.environ.get("STABILITY_POINT_CAP", "2048")))
          TOLERANCE_RADII = [
              float(x) for x in os.environ.get(
                  "TOLERANCE_RADII", "0.0005,0.001,0.002,0.005,0.01,0.02,0.05"
              ).split(",") if x.strip()
          ]
          STABILITY_ETAS = [
              float(x) for x in os.environ.get(
                  "STABILITY_ETAS", "0.00025,0.0005,0.001,0.002,0.005"
              ).split(",") if x.strip()
          ]
          MAKE_PLOTS = os.environ.get("MAKE_PLOTS", "true").strip().lower() in {
              "1", "true", "yes", "on"
          }

          if EMBEDDING_MODE not in {"hash_chunks", "hilbert"}:
              raise ValueError("EMBEDDING_MODE must be hash_chunks or hilbert")
          if LATENT_SCALE <= 0:
              raise ValueError("LATENT_SCALE must be positive")
          if not TOLERANCE_RADII:
              raise ValueError("TOLERANCE_RADII cannot be empty")
          if not STABILITY_ETAS:
              raise ValueError("STABILITY_ETAS cannot be empty")

          RESULTS_PATH = Path("bitcoin_hash_transform_results.csv")
          OBSERVED_PATH = Path("bitcoin_puzzle_observed_shuffled.csv")
          RECONSTRUCTED_PATH = Path("bitcoin_puzzle_reconstructed_observed.csv")
          MISSING_PATH = Path("bitcoin_puzzle_missing_inference.csv")
          BASE_STATUS_PATH = Path("bitcoin_joint_inference_status.json")

