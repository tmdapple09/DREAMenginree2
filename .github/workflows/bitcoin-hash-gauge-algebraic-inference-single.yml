      - name: Apply algebraic hard constraints and declared state-space prior
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          python - <<'PY' 2>&1 | tee bitcoin_algebraic_inference_console.log
          import csv
          import hashlib
          import json
          import math
          import os
          import random
          import sys
          import traceback
          from fractions import Fraction
          from math import factorial, lgamma, log
          from pathlib import Path

          RESULTS_PATH = Path("bitcoin_hash_transform_results.csv")
          OBSERVED_PATH = Path("bitcoin_puzzle_observed_shuffled.csv")
          RECONSTRUCTED_PATH = Path("bitcoin_puzzle_reconstructed_observed.csv")
          MANIFEST_PATH = Path("bitcoin_full_inference_manifest.json")

          PIECES_PATH = Path("bitcoin_algebraic_piece_codes.csv")
          WINDOWS_PATH = Path("bitcoin_algebraic_windows.csv")
          INFERENCE_PATH = Path("bitcoin_algebraic_missing_inference.csv")
          CANDIDATES_PATH = Path("bitcoin_algebraic_order_candidates.csv")
          STATE_PATH = Path("bitcoin_algebraic_state_space.json")
          REPORT_PATH = Path("bitcoin_algebraic_inference_report.txt")
          STATUS_PATH = Path("bitcoin_algebraic_inference_status.json")

          WINDOW_SIZE = 16
          PARITY_CHANNELS = 4
          PARITY_ANCHOR_SLOTS = (0, 4, 8, 12)
          ORIENTATION_MODULUS = 3
          BINARY_LATENT_DEGREES = 45
          ORIENTATION_DEGREES = 15
          ALGEBRAIC_RANDOM_SEED = int(os.environ.get("MISSING_SEED", "314159")) ^ int(
              os.environ.get("SHUFFLE_SEED", "271828")
          )

          LAMBDA_LOCAL = 6.0
          BETA_GLOBAL = 1.0
          GAMMA_MISSING = 1.0
          SIGMA_OBSERVATION = 1.0


          def emit(text=""):
              print(text, flush=True)


          def read_dicts(path):
              with path.open(newline="", encoding="utf-8") as handle:
                  return list(csv.DictReader(handle))


          def write_dicts(path, rows, fieldnames=None):
              if fieldnames is None:
                  fieldnames = list(rows[0].keys()) if rows else []
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)


          def xor_bits(bits):
              value = 0
              for bit in bits:
                  value ^= int(bit) & 1
              return value


          def legal_parity_assignments():
              legal = []
              for p0 in (0, 1):
                  for p1 in (0, 1):
                      for p2 in (0, 1):
                          for p3 in (0, 1):
                              if (p0 ^ p1 ^ p2 ^ p3) == 0 and (p0 ^ p1) == 0:
                                  legal.append((p0, p1, p2, p3))
              return legal


          LEGAL_PARITY = legal_parity_assignments()


          def derive_window_codes(window_rows, window_index):
              hashes = [row["hash"] for row in window_rows]
              digest = hashlib.sha256(("|".join(hashes) + f"|{window_index}").encode()).digest()

              # Four parity labels carried by four anchor pieces. They are redundant code
              # variables, not claims about Bitcoin consensus.
              p0 = digest[0] & 1
              p1 = p0
              p2 = digest[1] & 1
              p3 = p2
              parity = (p0, p1, p2, p3)

              # C3 orientation code: first 15 are data-derived; the final symbol is the
              # unique closure symbol making product O_1 ... O_16 = Identity.
              orientations = [int(row["hash"], 16) % ORIENTATION_MODULUS for row in window_rows[:15]]
              orientations.append((-sum(orientations)) % ORIENTATION_MODULUS)

              # A declared 45-bit latent coordinate used as the 2^45 model component.
              latent_45 = int.from_bytes(digest[:6], "big") & ((1 << BINARY_LATENT_DEGREES) - 1)

              return parity, orientations, latent_45


          def state_space_record():
              numerator = (
                  factorial(16)
                  * factorial(64) ** 2
                  * factorial(96)
                  * 2**45
                  * 3**15
              )
              denominator = 1536 * factorial(8) ** 8
              declared = Fraction(numerator, denominator)

              log2_states = (
                  lgamma(17)
                  + 2 * lgamma(65)
                  + lgamma(97)
                  + 45 * log(2)
                  + 15 * log(3)
                  - log(1536)
                  - 8 * lgamma(9)
              ) / log(2)

              log10_states = log2_states * log10_of_2

              return {
                  "declared_formula": "(16! * (64!)^2 * 96! * 2^45 * 3^15) / (1536 * (8!)^8)",
                  "declared_state_count": str(declared.numerator)
                  if declared.denominator == 1
                  else f"{declared.numerator}/{declared.denominator}",
                  "declared_state_count_numerator": str(declared.numerator),
                  "declared_state_count_denominator": str(declared.denominator),
                  "declared_log2_states": log2_states,
                  "declared_log10_states": log10_states,
                  "distinguishing_information_bits": log2_states,
                  "binary_latent_degrees": BINARY_LATENT_DEGREES,
                  "orientation_modulus": ORIENTATION_MODULUS,
                  "orientation_free_degrees_after_closure": ORIENTATION_DEGREES,
                  "parity_constraints": [
                      "p0 XOR p1 XOR p2 XOR p3 = 0",
                      "p0 XOR p1 = 0",
                  ],
                  "orientation_constraint": "product_{i=1}^{16} O_i = Identity, implemented in C3 as sum(O_i) mod 3 = 0",
                  "use_in_workflow": "hard admissibility indicator plus declared prior-volume and information budget",
                  "formula_verification_requested": False,
              }


          def candidate_metrics(name, sequence, canonical_heights, piece_by_height):
              position_mismatch = sum(
                  int(row["height"]) != canonical_heights[index]
                  for index, row in enumerate(sequence)
              )

              broken_links = 0
              height_inversions = 0
              negative_time_steps = 0
              for left, right in zip(sequence, sequence[1:]):
                  if right.get("previousblockhash", "") != left.get("hash", ""):
                      broken_links += 1
                  if int(right["height"]) < int(left["height"]):
                      height_inversions += 1
                  if int(right.get("timestamp_unix", 0)) < int(left.get("timestamp_unix", 0)):
                      negative_time_steps += 1

              invalid_parity_windows = 0
              invalid_orientation_windows = 0
              invalid_channel_windows = 0
              valid_windows = 0

              usable = len(sequence) - (len(sequence) % WINDOW_SIZE)
              for start in range(0, usable, WINDOW_SIZE):
                  block = sequence[start : start + WINDOW_SIZE]
                  tags = []
                  for row in block:
                      code = piece_by_height[int(row["height"])]
                      if code["parity_channel"] != "":
                          tags.append((int(code["parity_channel"]), int(code["parity_value"])))

                  channel_map = {}
                  duplicate = False
                  for channel, value in tags:
                      if channel in channel_map:
                          duplicate = True
                      channel_map[channel] = value

                  if duplicate or set(channel_map) != {0, 1, 2, 3}:
                      invalid_channel_windows += 1
                      parity_ok = False
                  else:
                      p = tuple(channel_map[index] for index in range(4))
                      parity_ok = p in LEGAL_PARITY

                  if not parity_ok:
                      invalid_parity_windows += 1

                  orientation_sum = sum(
                      int(piece_by_height[int(row["height"])] ["orientation_code"])
                      for row in block
                  ) % ORIENTATION_MODULUS
                  orientation_ok = orientation_sum == 0
                  if not orientation_ok:
                      invalid_orientation_windows += 1

                  if parity_ok and orientation_ok:
                      valid_windows += 1

              total_windows = usable // WINDOW_SIZE
              hard_legal = (
                  total_windows > 0
                  and invalid_parity_windows == 0
                  and invalid_orientation_windows == 0
                  and invalid_channel_windows == 0
              )

              e_observation = position_mismatch / (2 * SIGMA_OBSERVATION**2)
              e_local = LAMBDA_LOCAL * broken_links
              e_global = BETA_GLOBAL * (height_inversions + negative_time_steps)
              c_missing = 0
              soft_energy = e_observation + e_local + e_global + GAMMA_MISSING * c_missing

              return {
                  "candidate": name,
                  "pieces": len(sequence),
                  "full_windows_scored": total_windows,
                  "position_mismatch": position_mismatch,
                  "broken_chain_links": broken_links,
                  "height_inversions": height_inversions,
                  "negative_time_steps": negative_time_steps,
                  "invalid_parity_windows": invalid_parity_windows,
                  "invalid_orientation_windows": invalid_orientation_windows,
                  "invalid_channel_windows": invalid_channel_windows,
                  "valid_algebraic_windows": valid_windows,
                  "E_observation": e_observation,
                  "lambda_E_local": e_local,
                  "beta_E_global": e_global,
                  "gamma_C_missing": GAMMA_MISSING * c_missing,
                  "hard_constraint_legal": hard_legal,
                  "hard_constraint_indicator": "0" if hard_legal else "+infinity",
                  "total_energy": soft_energy if hard_legal else "infinity",
                  "candidate_accepted": hard_legal,
              }


          log10_of_2 = math.log10(2.0)
          status = {
              "completed": False,
              "real_data": False,
              "fake_completion": False,
              "message": "",
          }

          try:
              if not RESULTS_PATH.exists():
                  raise FileNotFoundError(f"Required real-data file missing: {RESULTS_PATH}")
              if not OBSERVED_PATH.exists():
                  raise FileNotFoundError(f"Required observation file missing: {OBSERVED_PATH}")

              full_rows = read_dicts(RESULTS_PATH)
              full_rows.sort(key=lambda row: int(row["height"]))
              observed_rows = read_dicts(OBSERVED_PATH)
              observed_heights = {int(row["height"]) for row in observed_rows}

              usable_count = len(full_rows) - (len(full_rows) % WINDOW_SIZE)
              coded_rows = full_rows[:usable_count]
              canonical_heights = [int(row["height"]) for row in coded_rows]

              piece_rows = []
              piece_by_height = {}
              window_rows_out = []
              inference_rows = []

              for window_index, start in enumerate(range(0, usable_count, WINDOW_SIZE)):
                  window = coded_rows[start : start + WINDOW_SIZE]
                  parity_values, orientations, latent_45 = derive_window_codes(window, window_index)

                  observed_parity = {}
                  missing_slots = []
                  observed_orientation_sum = 0

                  for slot, row in enumerate(window):
                      height = int(row["height"])
                      survived = height in observed_heights
                      if not survived:
                          missing_slots.append(slot)

                      parity_channel = ""
                      parity_value = ""
                      if slot in PARITY_ANCHOR_SLOTS:
                          parity_channel = PARITY_ANCHOR_SLOTS.index(slot)
                          parity_value = parity_values[parity_channel]
                          if survived:
                              observed_parity[parity_channel] = parity_value

                      orientation_code = orientations[slot]
                      if survived:
                          observed_orientation_sum = (
                              observed_orientation_sum + orientation_code
                          ) % ORIENTATION_MODULUS

                      piece = {
                          "window_index": window_index,
                          "window_start_height": int(window[0]["height"]),
                          "window_end_height": int(window[-1]["height"]),
                          "slot": slot,
                          "height": height,
                          "hash": row["hash"],
                          "survived": survived,
                          "parity_channel": parity_channel,
                          "parity_value": parity_value,
                          "orientation_code": orientation_code,
                          "binary_latent_45": latent_45,
                          "binary_latent_45_hex": f"{latent_45:012x}",
                      }
                      piece_rows.append(piece)
                      piece_by_height[height] = piece

                  compatible_parity = [
                      p
                      for p in LEGAL_PARITY
                      if all(p[channel] == value for channel, value in observed_parity.items())
                  ]
                  parity_completion_count = len(compatible_parity)

                  missing_count = len(missing_slots)
                  if missing_count == 0:
                      orientation_completion_count = (
                          1
                          if sum(orientations) % ORIENTATION_MODULUS == 0
                          else 0
                      )
                  else:
                      orientation_completion_count = ORIENTATION_MODULUS ** (missing_count - 1)

                  combined_completion_count = (
                      parity_completion_count * orientation_completion_count
                  )
                  hard_legal = combined_completion_count > 0

                  legal_latent_prior_count = len(LEGAL_PARITY) * (
                      ORIENTATION_MODULUS ** ORIENTATION_DEGREES
                  )
                  resolved_bits = (
                      math.log2(legal_latent_prior_count / combined_completion_count)
                      if combined_completion_count > 0
                      else float("inf")
                  )

                  window_rows_out.append(
                      {
                          "window_index": window_index,
                          "start_height": int(window[0]["height"]),
                          "end_height": int(window[-1]["height"]),
                          "missing_piece_count": missing_count,
                          "observed_piece_count": WINDOW_SIZE - missing_count,
                          "p0": parity_values[0],
                          "p1": parity_values[1],
                          "p2": parity_values[2],
                          "p3": parity_values[3],
                          "xor_all_parity": xor_bits(parity_values),
                          "xor_p0_p1": parity_values[0] ^ parity_values[1],
                          "parity_hard_constraint_valid": parity_values in LEGAL_PARITY,
                          "orientation_product_c3": sum(orientations) % ORIENTATION_MODULUS,
                          "orientation_hard_constraint_valid": sum(orientations) % ORIENTATION_MODULUS == 0,
                          "observed_parity_channels": json.dumps(observed_parity, sort_keys=True),
                          "parity_completion_count": parity_completion_count,
                          "orientation_completion_count": orientation_completion_count,
                          "combined_latent_completion_count": combined_completion_count,
                          "hard_constraint_legal": hard_legal,
                          "hard_constraint_indicator": "0" if hard_legal else "+infinity",
                          "resolved_algebraic_information_bits": resolved_bits,
                          "binary_latent_45": latent_45,
                          "binary_latent_45_hex": f"{latent_45:012x}",
                      }
                  )

                  # Parity-tag inference: the paired equality constraints recover a missing
                  # tag exactly whenever its partner tag remains observed.
                  for channel in range(PARITY_CHANNELS):
                      anchor_slot = PARITY_ANCHOR_SLOTS[channel]
                      anchor_height = int(window[anchor_slot]["height"])
                      survived = anchor_height in observed_heights
                      partner = 1 - channel if channel < 2 else 5 - channel
                      inferred = ""
                      confidence = 0.0
                      method = "observed"
                      if survived:
                          inferred = parity_values[channel]
                          confidence = 1.0
                      elif partner in observed_parity:
                          inferred = observed_parity[partner]
                          confidence = 1.0
                          method = f"hard equality p{channel}=p{partner}"
                      elif compatible_parity:
                          values = {p[channel] for p in compatible_parity}
                          if len(values) == 1:
                              inferred = next(iter(values))
                              confidence = 1.0
                          else:
                              confidence = max(
                                  sum(p[channel] == value for p in compatible_parity)
                                  / len(compatible_parity)
                                  for value in values
                              )
                          method = "posterior over legal parity assignments"
                      else:
                          method = "no legal parity completion"

                      inference_rows.append(
                          {
                              "window_index": window_index,
                              "height": anchor_height,
                              "slot": anchor_slot,
                              "latent_type": "parity",
                              "latent_name": f"p{channel}",
                              "observed": survived,
                              "actual_value": parity_values[channel],
                              "inferred_value": inferred,
                              "confidence": confidence,
                              "candidate_count": parity_completion_count,
                              "method": method,
                              "inference_correct": str(inferred) == str(parity_values[channel])
                              if inferred != ""
                              else "",
                          }
                      )

                  missing_orientation_slots = [
                      slot
                      for slot in range(WINDOW_SIZE)
                      if int(window[slot]["height"]) not in observed_heights
                  ]
                  for slot in missing_orientation_slots:
                      height = int(window[slot]["height"])
                      if len(missing_orientation_slots) == 1:
                          inferred_orientation = (-observed_orientation_sum) % ORIENTATION_MODULUS
                          confidence = 1.0
                          method = "unique C3 closure completion"
                      else:
                          inferred_orientation = ""
                          confidence = 1.0 / ORIENTATION_MODULUS
                          method = "ambiguous C3 closure; joint assignments retained"

                      inference_rows.append(
                          {
                              "window_index": window_index,
                              "height": height,
                              "slot": slot,
                              "latent_type": "orientation",
                              "latent_name": f"O_{slot + 1}",
                              "observed": False,
                              "actual_value": orientations[slot],
                              "inferred_value": inferred_orientation,
                              "confidence": confidence,
                              "candidate_count": orientation_completion_count,
                              "method": method,
                              "inference_correct": inferred_orientation == orientations[slot]
                              if inferred_orientation != ""
                              else "",
                          }
                      )

              # Attach the code layer to the actual shuffled observation.
              observed_code_rows = []
              for row in observed_rows:
                  height = int(row["height"])
                  code = piece_by_height.get(height)
                  if code is None:
                      continue
                  merged = dict(row)
                  merged.update(
                      {
                          "algebra_window_index": code["window_index"],
                          "algebra_slot": code["slot"],
                          "parity_channel": code["parity_channel"],
                          "parity_value": code["parity_value"],
                          "orientation_code": code["orientation_code"],
                          "binary_latent_45_hex": code["binary_latent_45_hex"],
                      }
                  )
                  observed_code_rows.append(merged)
              write_dicts(Path("bitcoin_algebraic_observed_shuffled.csv"), observed_code_rows)

              # Hard-constraint candidate rejection. These are controls over the same real
              # coded pieces. Illegal candidates receive an infinite indicator energy.
              canonical = list(coded_rows)
              reverse = list(reversed(canonical))
              hash_order = sorted(canonical, key=lambda row: row["hash"])
              timestamp_order = sorted(canonical, key=lambda row: (int(row["timestamp_unix"]), int(row["height"])))
              random_order = list(canonical)
              random.Random(ALGEBRAIC_RANDOM_SEED).shuffle(random_order)

              candidate_rows = [
                  candidate_metrics("canonical_height_order", canonical, canonical_heights, piece_by_height),
                  candidate_metrics("timestamp_order", timestamp_order, canonical_heights, piece_by_height),
                  candidate_metrics("reverse_height_order", reverse, canonical_heights, piece_by_height),
                  candidate_metrics("hash_lexicographic_order", hash_order, canonical_heights, piece_by_height),
                  candidate_metrics("deterministic_random_order", random_order, canonical_heights, piece_by_height),
              ]

              state = state_space_record()
              STATE_PATH.write_text(json.dumps(state, indent=2, sort_keys=True), encoding="utf-8")
              write_dicts(PIECES_PATH, piece_rows)
              write_dicts(WINDOWS_PATH, window_rows_out)
              write_dicts(INFERENCE_PATH, inference_rows)
              write_dicts(CANDIDATES_PATH, candidate_rows)

              canonical_candidate = candidate_rows[0]
              parity_exact = sum(
                  row["latent_type"] == "parity"
                  and row["inferred_value"] != ""
                  and row["inference_correct"] is True
                  for row in inference_rows
              )
              orientation_exact = sum(
                  row["latent_type"] == "orientation"
                  and row["inferred_value"] != ""
                  and row["inference_correct"] is True
                  for row in inference_rows
              )

              report_lines = [
                  "BITCOIN HASH ALGEBRAIC CONSTRAINT LAYER",
                  "=" * 88,
                  "",
                  "Forward operator: x = D_m(P_pi(y)) + xi",
                  "Hard parity constraints:",
                  "  p0 XOR p1 XOR p2 XOR p3 = 0",
                  "  p0 XOR p1 = 0",
                  "Hard orientation closure:",
                  "  product_{i=1}^{16} O_i = Identity",
                  "  operational representation: C3, sum(O_i) mod 3 = 0",
                  "",
                  "Declared state-volume prior:",
                  f"  {state['declared_formula']}",
                  f"  log2 states = {state['declared_log2_states']:.12f}",
                  f"  log10 states = {state['declared_log10_states']:.12f}",
                  "  The formula is used as supplied; this stage does not run a formula-verification gate.",
                  "",
                  f"Real coded blocks: {len(coded_rows)}",
                  f"Complete 16-piece windows: {len(window_rows_out)}",
                  f"Observed surviving pieces: {len(observed_code_rows)}",
                  f"Parity values recovered exactly when determined: {parity_exact}",
                  f"Orientation values recovered exactly when uniquely determined: {orientation_exact}",
                  f"Canonical candidate hard-legal: {canonical_candidate['hard_constraint_legal']}",
                  "",
                  "Candidate energies:",
              ]
              for row in candidate_rows:
                  report_lines.append(
                      f"  {row['candidate']}: accepted={row['candidate_accepted']} "
                      f"hard={row['hard_constraint_indicator']} "
                      f"position_mismatch={row['position_mismatch']} "
                      f"broken_links={row['broken_chain_links']} "
                      f"invalid_parity_windows={row['invalid_parity_windows']} "
                      f"invalid_orientation_windows={row['invalid_orientation_windows']} "
                      f"total_energy={row['total_energy']}"
                  )

              report_lines.extend(
                  [
                      "",
                      "Operational interpretation:",
                      "  - D_m and P_pi are the existing controlled deletion and shuffle operators.",
                      "  - The parity and C3 variables are an explicit redundant code layer attached to real block pieces.",
                      "  - Candidate states violating either hard equation are excluded with +infinity energy.",
                      "  - The 45-bit variable and declared N_states provide the prior-volume/information budget.",
                      "  - These code variables are not asserted to be Bitcoin consensus fields or intrinsic SHA-256 laws.",
                      "",
                      "Authoritative files:",
                      f"  {STATUS_PATH}",
                      f"  {STATE_PATH}",
                      f"  {WINDOWS_PATH}",
                      f"  {INFERENCE_PATH}",
                      f"  {CANDIDATES_PATH}",
                  ]
              )

              REPORT_PATH.write_text("\n".join(report_lines) + "\n", encoding="utf-8")

              status.update(
                  {
                      "completed": True,
                      "real_data": True,
                      "fake_completion": False,
                      "coded_block_rows": len(coded_rows),
                      "windows": len(window_rows_out),
                      "observed_survivors": len(observed_code_rows),
                      "hard_constraints_enforced": True,
                      "canonical_candidate_hard_legal": canonical_candidate["hard_constraint_legal"],
                      "declared_log2_states": state["declared_log2_states"],
                      "declared_log10_states": state["declared_log10_states"],
                      "formula_verification_gate": False,
                      "parity_exact_recoveries": parity_exact,
                      "orientation_exact_recoveries": orientation_exact,
                      "message": "Algebraic hard-constraint layer completed over real Bitcoin block pieces.",
                  }
              )

          except Exception as exc:
              error_text = "".join(traceback.format_exception(type(exc), exc, exc.__traceback__))
              status.update(
                  {
                      "completed": False,
                      "real_data": RESULTS_PATH.exists(),
                      "fake_completion": False,
                      "message": str(exc),
                      "traceback": error_text,
                  }
              )
              REPORT_PATH.write_text(
                  "BITCOIN HASH ALGEBRAIC CONSTRAINT LAYER — INCOMPLETE\n"
                  + "=" * 72
                  + "\n"
                  + error_text,
                  encoding="utf-8",
              )

          finally:
              STATUS_PATH.write_text(json.dumps(status, indent=2, sort_keys=True), encoding="utf-8")

              manifest = {}
              if MANIFEST_PATH.exists():
                  try:
                      manifest = json.loads(MANIFEST_PATH.read_text(encoding="utf-8"))
                  except Exception:
                      manifest = {}

              manifest["algebraic_constraint_extension"] = status
              existing_overall = manifest.get("overall_completed", True)
              manifest["overall_completed"] = bool(existing_overall and status.get("completed"))
              manifest["fake_completion"] = False
              MANIFEST_PATH.write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")

              emit(REPORT_PATH.read_text(encoding="utf-8"))
              emit("ALGEBRAIC STATUS")
              emit("----------------")
              emit(STATUS_PATH.read_text(encoding="utf-8"))
              sys.exit(0)
          PY

          exit 0

      - name: Publish explicit status summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("bitcoin_full_inference_manifest.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              base = manifest.get("base_joint_inference", {})
              continuous = manifest.get("continuous_gauge_extension", {})
              algebraic = manifest.get("algebraic_constraint_extension", {})
              lines = [
                  "# Bitcoin hash joint + gauge + algebraic inference",
                  "",
                  f"- Overall completed: `{manifest.get('overall_completed')}`",
                  f"- Real block rows: `{base.get('rows')}`",
                  f"- Missing mask recovered: `{base.get('missing_mask_recovered_metadata')}`",
                  f"- Continuous extension completed: `{continuous.get('completed')}`",
                  f"- 95% quotient credible radius: `{continuous.get('credible_radius_95')}`",
                  f"- Exact point recovery claimed: `{continuous.get('exact_point_recovery_claimed')}`",
                  f"- Algebraic extension completed: `{algebraic.get('completed')}`",
                  f"- Hard constraints enforced: `{algebraic.get('hard_constraints_enforced')}`",
                  f"- Canonical candidate hard-legal: `{algebraic.get('canonical_candidate_hard_legal')}`",
                  f"- Declared state information: `{algebraic.get('declared_log2_states')}` bits",
                  f"- Formula verification gate: `{algebraic.get('formula_verification_gate')}`",
                  "",
                  "The JSON status files and text reports are authoritative. The job is intentionally",
                  "non-failing; incomplete stages remain explicitly marked incomplete.",
              ]
          else:
              lines = [
                  "# Bitcoin hash joint + gauge + algebraic inference",
                  "",
                  "The combined manifest was not produced. Inspect both console logs.",
              ]

          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
          exit 0

