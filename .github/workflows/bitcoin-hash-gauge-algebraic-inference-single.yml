          POSTERIOR_PATH = Path("bitcoin_continuous_posterior_samples.csv")
          TOLERANCE_PATH = Path("bitcoin_continuous_tolerance_confidence.csv")
          STABILITY_PATH = Path("bitcoin_continuous_stability.csv")
          PERSISTENCE_PATH = Path("bitcoin_continuous_persistence.csv")
          FUNCTIONAL_PATH = Path("bitcoin_continuous_functional_identifiability.csv")
          MEASURE_AUDIT_PATH = Path("bitcoin_continuous_measure_audit.csv")
          GAUGE_PATH = Path("bitcoin_continuous_gauge_diagnostics.csv")
          FREQUENCY_PATH = Path("bitcoin_continuous_frequency_split.csv")
          REPORT_PATH = Path("bitcoin_continuous_inference_report.txt")
          STATUS_PATH = Path("bitcoin_continuous_inference_status.json")
          MANIFEST_PATH = Path("bitcoin_full_inference_manifest.json")


          def emit(text=""):
              print(text, flush=True)


          def read_csv(path):
              with path.open(newline="", encoding="utf-8") as handle:
                  return list(csv.DictReader(handle))


          def write_csv(path, rows, fieldnames=None):
              rows = list(rows)
              if fieldnames is None:
                  fieldnames = list(rows[0].keys()) if rows else []
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames, extrasaction="ignore")
                  writer.writeheader()
                  writer.writerows(rows)


          def quantile(values, q):
              values = np.asarray(values, dtype=float)
              if values.size == 0:
                  return float("nan")
              return float(np.quantile(values, q))


          def safe_float(value, default=float("nan")):
              try:
                  return float(value)
              except Exception:
                  return default


          # -----------------------------------------------------------------------------
          # Deterministic embeddings of hash values
          # -----------------------------------------------------------------------------
          def hilbert_rot(n, x, y, rx, ry):
              if ry == 0:
                  if rx == 1:
                      x = n - 1 - x
                      y = n - 1 - y
                  x, y = y, x
              return x, y


          def hilbert_d2xy(order, d):
              n = 1 << order
              x = 0
              y = 0
              t = int(d)
              s = 1
              while s < n:
                  rx = 1 & (t // 2)
                  ry = 1 & (t ^ rx)
                  x, y = hilbert_rot(s, x, y, rx, ry)
                  x += s * rx
                  y += s * ry
                  t //= 4
                  s *= 2
              return x, y


          def hash_embedding(hash_hex):
              h = int(hash_hex, 16)
              if EMBEDDING_MODE == "hash_chunks":
                  mask = (1 << 64) - 1
                  u = ((h >> 64) & mask) / mask
                  v = (h & mask) / mask
                  return u, v

              bits = 2 * HILBERT_ORDER
              index = h & ((1 << bits) - 1)
              x, y = hilbert_d2xy(HILBERT_ORDER, index)
              denom = (1 << HILBERT_ORDER) - 1
              return x / denom, y / denom


          # -----------------------------------------------------------------------------
          # Gauge section and quotient-style metrics
          # -----------------------------------------------------------------------------
          def canonical_gauge(points):
              """
              Local gauge section:
                1. center at zero,
                2. RMS radius one,
                3. principal axis on +x,
                4. sign fixed by the farthest point.

              This is not a global section. Near-isotropic point clouds can have an
              unstable principal axis; diagnostics explicitly report that singularity.
              """
              p = np.asarray(points, dtype=float)
              center = p.mean(axis=0)
              centered = p - center
              rms = math.sqrt(float(np.mean(np.sum(centered * centered, axis=1))))
              if rms <= 1e-15:
                  raise ValueError("Gauge cannot be fixed for a collapsed point cloud")
              scaled = centered / rms
              cov = scaled.T @ scaled / len(scaled)
              eigenvalues, eigenvectors = np.linalg.eigh(cov)
              order = np.argsort(eigenvalues)[::-1]
              eigenvalues = eigenvalues[order]
              eigenvectors = eigenvectors[:, order]
              rotation = eigenvectors
              if np.linalg.det(rotation) < 0:
                  rotation[:, 1] *= -1
              gauged = scaled @ rotation
              farthest = int(np.argmax(np.sum(gauged * gauged, axis=1)))
              if gauged[farthest, 0] < 0:
                  gauged *= -1
                  rotation *= -1
              diagnostics = {
                  "center_x": float(center[0]),
                  "center_y": float(center[1]),
                  "rms_scale": rms,
                  "eigenvalue_1": float(eigenvalues[0]),
                  "eigenvalue_2": float(eigenvalues[1]),
                  "eigenvalue_ratio": float(eigenvalues[0] / max(eigenvalues[1], 1e-15)),
                  "orientation_degrees": float(math.degrees(math.atan2(rotation[1, 0], rotation[0, 0]))),
                  "farthest_anchor_index": farthest,
                  "local_section_warning": bool(eigenvalues[0] / max(eigenvalues[1], 1e-15) < 1.05),
              }
              return gauged, diagnostics


          def rms_shape_distance(a, b):
              a = np.asarray(a, dtype=float)
              b = np.asarray(b, dtype=float)
              return math.sqrt(float(np.mean(np.sum((a - b) ** 2, axis=1))))


          def quotient_distance(a, b):
              """RMS distance after optimal translation, positive scale, and SO(2) alignment."""
              a = np.asarray(a, dtype=float)
              b = np.asarray(b, dtype=float)
              ac = a - a.mean(axis=0)
              bc = b - b.mean(axis=0)
              ar = math.sqrt(float(np.mean(np.sum(ac * ac, axis=1))))
              br = math.sqrt(float(np.mean(np.sum(bc * bc, axis=1))))
              if ar <= 1e-15 or br <= 1e-15:
                  return float("inf")
              ac /= ar
              bc /= br
              u, _, vt = np.linalg.svd(ac.T @ bc)
              r = vt.T @ u.T
              if np.linalg.det(r) < 0:
                  vt[-1, :] *= -1
                  r = vt.T @ u.T
              aligned = ac @ r.T
              return math.sqrt(float(np.mean(np.sum((aligned - bc) ** 2, axis=1))))


          def procrustes_similarity(x, z):
              """Estimate z ~= scale * x @ R.T + translation, det(R)=+1."""
              x = np.asarray(x, dtype=float)
              z = np.asarray(z, dtype=float)
              mx = x.mean(axis=0)
              mz = z.mean(axis=0)
              xc = x - mx
              zc = z - mz
              u, singular, vt = np.linalg.svd(xc.T @ zc)
              r = vt.T @ u.T
              if np.linalg.det(r) < 0:
                  vt[-1, :] *= -1
                  r = vt.T @ u.T
              denom = float(np.sum(xc * xc))
              scale = float(np.sum(singular) / denom) if denom > 0 else 1.0
              translation = mz - scale * (mx @ r.T)
              theta = math.atan2(r[1, 0], r[0, 0])
              return theta, math.log(max(scale, 1e-15)), translation, r


          # -----------------------------------------------------------------------------
          # Smooth deformation basis and physical forward model
          # -----------------------------------------------------------------------------
          def normalized_domain(points):
              # Fixed, sample-independent chart from the gauge-normalized plane to (0,1)^2.
              # Using a fixed chart prevents the deformation basis from changing merely
              # because pieces are removed or a fitting subset is selected.
              p = np.asarray(points, dtype=float)
              q = 0.5 * (np.tanh(p) + 1.0)
              return q, np.array([-math.inf, -math.inf]), np.array([math.inf, math.inf])


          def warp_basis(points, max_frequency=WARP_MAX_FREQ):
              q, _, _ = normalized_domain(points)
              columns = []
              labels = []
              penalties = []
              for fx in range(1, max_frequency + 1):
                  for fy in range(1, max_frequency + 1):
                      # Smooth low-frequency basis. Cos/sin mixtures avoid a boundary-only zero basis.
                      column = np.sin(math.pi * fx * q[:, 0]) * np.sin(math.pi * fy * q[:, 1])
                      columns.append(column)
                      labels.append((fx, fy))
                      frequency_sq = fx * fx + fy * fy
                      penalty = frequency_sq + (frequency_sq ** 2) / (WARP_OMEGA0 ** 2)
                      penalties.append(penalty)
              return np.column_stack(columns), labels, np.asarray(penalties, dtype=float)


          def rotation_matrix(theta):
              c = math.cos(theta)
              s = math.sin(theta)
              return np.array([[c, -s], [s, c]], dtype=float)


          def model_points(x, basis, params):
              k = basis.shape[1]
              theta = params[0]
              log_scale = params[1]
              translation = params[2:4]
              coeff_x = params[4:4 + k]
              coeff_y = params[4 + k:4 + 2 * k]
              r = rotation_matrix(theta)
              similarity = math.exp(log_scale) * (x @ r.T) + translation
              warp = np.column_stack((basis @ coeff_x, basis @ coeff_y))
              return similarity + warp


          def fit_similarity_and_warp(x, z, basis, penalties):
              theta, log_scale, translation, _ = procrustes_similarity(x, z)
              base_params = np.zeros(4 + 2 * basis.shape[1], dtype=float)
              base_params[0] = theta
              base_params[1] = log_scale
              base_params[2:4] = translation
              similarity = model_points(x, basis, base_params)
              residual = z - similarity
              gram = basis.T @ basis
              ridge = WARP_RIDGE * np.diag(penalties)
              coeff_x = np.linalg.solve(gram + ridge, basis.T @ residual[:, 0])
              coeff_y = np.linalg.solve(gram + ridge, basis.T @ residual[:, 1])
              base_params[4:4 + basis.shape[1]] = coeff_x
              base_params[4 + basis.shape[1]:] = coeff_y
              fitted = model_points(x, basis, base_params)
              noise = z - fitted
              sigma = math.sqrt(float(np.mean(noise * noise)))
              return base_params, max(sigma, 1e-9), fitted, noise


          def inverse_model(z, params, max_frequency, iterations=8):
              """Approximate inversion of the smooth map by fixed-point iteration."""
              theta = params[0]
              log_scale = params[1]
              translation = params[2:4]
              scale = math.exp(log_scale)
              r = rotation_matrix(theta)
              x_est = (z - translation) @ r / scale
              k = max_frequency * max_frequency
              coeff_x = params[4:4 + k]
              coeff_y = params[4 + k:4 + 2 * k]
              for _ in range(iterations):
                  basis, _, _ = warp_basis(x_est, max_frequency)
                  warp = np.column_stack((basis @ coeff_x, basis @ coeff_y))
                  x_est = (z - translation - warp) @ r / scale
              return x_est


          # -----------------------------------------------------------------------------
          # Priors and posterior sampler
          # -----------------------------------------------------------------------------
          def wrap_angle(theta):
              return (theta + math.pi) % (2 * math.pi) - math.pi


          def log_prior(params, penalties):
              k = len(penalties)
              theta = params[0]
              log_scale = params[1]
              translation = params[2:4]
              coeff_x = params[4:4 + k]
              coeff_y = params[4 + k:4 + 2 * k]

              # SO(2): constant density with respect to normalized Haar measure dtheta/(2*pi).
              if not (-math.pi <= theta < math.pi):
                  return -math.inf

              # Similarity scale uses log-scale coordinates. In scale coordinates this
              # corresponds to the correct 1/s Jacobian factor.
              lp = -0.5 * (log_scale / 0.25) ** 2

              # Translation group is noncompact; no normalized uniform Haar probability
              # exists. A proper Gaussian prior is imposed in gauge-normalized units.
              lp += -0.5 * float(np.sum((translation / 0.35) ** 2))

              # Finite-dimensional Sobolev prior: higher-frequency warp coefficients are
              # penalized more strongly, separating smooth deformation from residual noise.
              warp_sd = max(WARP_AMPLITUDE, 0.005)
              lp += -0.5 * float(np.sum(penalties * (coeff_x / warp_sd) ** 2))
              lp += -0.5 * float(np.sum(penalties * (coeff_y / warp_sd) ** 2))
              return lp


          def log_posterior(params, x, z, basis, penalties, sigma):
              lp = log_prior(params, penalties)
              if not math.isfinite(lp):
                  return -math.inf
              residual = z - model_points(x, basis, params)
              ll = -0.5 * float(np.sum(residual * residual)) / (sigma * sigma)
              return lp + ll


          def proposal_scales(k, n_points, sigma):
              nroot = math.sqrt(max(n_points, 1))
              values = [
                  max(2e-5, sigma / nroot),          # theta
                  max(2e-5, sigma / nroot),          # log scale
                  max(2e-5, sigma / nroot),          # tx
                  max(2e-5, sigma / nroot),          # ty
              ]
              coeff_scale = max(2e-5, sigma / max(math.sqrt(n_points / max(k, 1)), 1.0))
              values.extend([coeff_scale] * (2 * k))
              return np.asarray(values, dtype=float)


          def run_mcmc_chains(initial, x, z, basis, penalties, sigma):
              rng_master = np.random.default_rng(DISTORTION_SEED + 9001)
              total_per_chain = MCMC_BURN + MCMC_SAMPLES * MCMC_THIN
              k = basis.shape[1]
              base_scales = proposal_scales(k, len(x), sigma)
              samples = []
              sample_rows = []
              chain_summaries = []

              for chain in range(MCMC_CHAINS):
                  rng = np.random.default_rng(int(rng_master.integers(0, 2**32 - 1)))
                  current = initial.copy()
                  current += rng.normal(0.0, base_scales * 10.0)
                  current[0] = wrap_angle(current[0])
                  current_lp = log_posterior(current, x, z, basis, penalties, sigma)
                  if not math.isfinite(current_lp):
                      current = initial.copy()
                      current_lp = log_posterior(current, x, z, basis, penalties, sigma)
                  scales = base_scales.copy()
                  accepted = 0
                  stored = 0

                  for step in range(total_per_chain):
                      proposal = current + rng.normal(0.0, scales)
                      proposal[0] = wrap_angle(proposal[0])
                      proposal_lp = log_posterior(proposal, x, z, basis, penalties, sigma)
                      if math.log(rng.random()) < proposal_lp - current_lp:
                          current = proposal
                          current_lp = proposal_lp
                          accepted += 1

                      # Simple adaptation during burn only. This is a practical random-walk
                      # Metropolis sampler, not RHMC; the report states that explicitly.
                      if step < MCMC_BURN and (step + 1) % 25 == 0:
                          rate = accepted / (step + 1)
                          if rate < 0.15:
                              scales *= 0.7
                          elif rate > 0.45:
                              scales *= 1.25

                      if step >= MCMC_BURN and (step - MCMC_BURN) % MCMC_THIN == 0:
                          samples.append(current.copy())
                          sample_rows.append(
                              {
                                  "chain": chain,
                                  "stored_index": stored,
                                  "log_posterior": current_lp,
                                  "theta_radians": current[0],
                                  "theta_degrees": math.degrees(current[0]),
                                  "log_scale": current[1],
                                  "scale": math.exp(current[1]),
                                  "translation_x": current[2],
                                  "translation_y": current[3],
                              }
                          )
                          stored += 1

                  chain_summaries.append(
                      {
                          "chain": chain,
                          "acceptance_rate": accepted / max(total_per_chain, 1),
                          "stored_samples": stored,
                          "final_log_posterior": current_lp,
                      }
                  )

              return np.asarray(samples), sample_rows, chain_summaries


          # -----------------------------------------------------------------------------
          # Posterior geometry and topology
          # -----------------------------------------------------------------------------
          def posterior_shapes(z_full, samples, sample_cap=None):
              if sample_cap and len(samples) > sample_cap:
                  indices = np.linspace(0, len(samples) - 1, sample_cap, dtype=int)
                  chosen = samples[indices]
              else:
                  chosen = samples
              shapes = []
              diagnostics = []
              for params in chosen:
                  recovered = inverse_model(z_full, params, WARP_MAX_FREQ)
                  gauged, diag = canonical_gauge(recovered)
                  shapes.append(gauged.astype(np.float32))
                  diagnostics.append(diag)
              return np.asarray(shapes), diagnostics


          def approximate_frechet_and_chebyshev(shapes):
              mean_shape, mean_diag = canonical_gauge(np.mean(shapes, axis=0))
              distances = np.asarray([quotient_distance(shape, mean_shape) for shape in shapes])

              cap = min(64, len(shapes))
              indices = np.linspace(0, len(shapes) - 1, cap, dtype=int)
              subset = shapes[indices]
              pairwise = np.zeros((cap, cap), dtype=float)
              for i in range(cap):
                  for j in range(i + 1, cap):
                      d = quotient_distance(subset[i], subset[j])
                      pairwise[i, j] = pairwise[j, i] = d
              max_distance = pairwise.max(axis=1)
              medoid_local = int(np.argmin(max_distance))
              chebyshev_center = subset[medoid_local]
              chebyshev_radius = float(max(quotient_distance(shape, chebyshev_center) for shape in shapes))
              return mean_shape, mean_diag, distances, chebyshev_center, chebyshev_radius


          def prim_mst_edge_lengths(shapes):
              n = len(shapes)
              if n < 2:
                  return []
              in_tree = np.zeros(n, dtype=bool)
              min_dist = np.full(n, np.inf)
              min_dist[0] = 0.0
              edges = []
              for _ in range(n):
                  masked = np.where(in_tree, np.inf, min_dist)
                  u = int(np.argmin(masked))
                  if not math.isfinite(masked[u]):
                      break
                  in_tree[u] = True
                  if masked[u] > 0:
                      edges.append(float(masked[u]))
                  for v in range(n):
                      if not in_tree[v]:
                          d = quotient_distance(shapes[u], shapes[v])
                          if d < min_dist[v]:
                              min_dist[v] = d
              return edges


          def component_count_at_radius(shapes, radius):
              n = len(shapes)
              parent = list(range(n))

              def find(a):
                  while parent[a] != a:
                      parent[a] = parent[parent[a]]
                      a = parent[a]
                  return a

              def union(a, b):
                  ra = find(a)
                  rb = find(b)
                  if ra != rb:
                      parent[rb] = ra

              for i in range(n):
                  for j in range(i + 1, n):
                      if quotient_distance(shapes[i], shapes[j]) <= radius:
                          union(i, j)
              return len({find(i) for i in range(n)})


          def two_mode_gap(shapes, distances_to_mean, radius):
              """
              A transparent two-basin approximation using the farthest sample as a second
              center. This is not a proof of all posterior modes; it only supplies an
              operational neighborhood-mass gap over sampled basins.
              """
              center1 = int(np.argmin(distances_to_mean))
              center2 = int(np.argmax(distances_to_mean))
              d1 = np.asarray([quotient_distance(s, shapes[center1]) for s in shapes])
              d2 = np.asarray([quotient_distance(s, shapes[center2]) for s in shapes])
              assign1 = d1 <= d2
              mass1 = float(np.mean(assign1 & (d1 <= radius)))
              mass2 = float(np.mean((~assign1) & (d2 <= radius)))
              eps = 1.0 / (10.0 * max(len(shapes), 1))
              gap = math.log(mass1 + eps) - math.log(mass2 + eps)
              return mass1, mass2, gap


          # -----------------------------------------------------------------------------
          # Stability and functional identifiability
          # -----------------------------------------------------------------------------
          def fit_and_recover(x, z, point_indices=None):
              if point_indices is None:
                  point_indices = np.arange(len(x))
              x_fit = x[point_indices]
              z_fit = z[point_indices]
              basis_fit, _, penalties = warp_basis(x_fit)
              params, sigma, _, _ = fit_similarity_and_warp(x_fit, z_fit, basis_fit, penalties)
              basis_all, _, _ = warp_basis(x)
              predicted_noiseless_observation = model_points(x, basis_all, params)
              gauged, _ = canonical_gauge(predicted_noiseless_observation)
              return params, sigma, gauged


          def temporal_path_length(points, order_indices):
              ordered = points[order_indices]
              if len(ordered) < 2:
                  return 0.0
              return float(np.sum(np.sqrt(np.sum(np.diff(ordered, axis=0) ** 2, axis=1))))


          def quadrant_counts(points):
              return (
                  int(np.sum((points[:, 0] >= 0) & (points[:, 1] >= 0))),
                  int(np.sum((points[:, 0] < 0) & (points[:, 1] >= 0))),
                  int(np.sum((points[:, 0] < 0) & (points[:, 1] < 0))),
                  int(np.sum((points[:, 0] >= 0) & (points[:, 1] < 0))),
              )


          def nearest_neighbor_consistency(reference, samples, point_cap=384):
              n = len(reference)
              cap = min(n, point_cap)
              indices = np.linspace(0, n - 1, cap, dtype=int)
              ref = reference[indices]
              distances = np.sum((ref[:, None, :] - ref[None, :, :]) ** 2, axis=2)
              np.fill_diagonal(distances, np.inf)
              ref_nn = np.argmin(distances, axis=1)
              scores = []
              for shape in samples:
                  sub = shape[indices]
                  d = np.sum((sub[:, None, :] - sub[None, :, :]) ** 2, axis=2)
                  np.fill_diagonal(d, np.inf)
                  scores.append(float(np.mean(np.argmin(d, axis=1) == ref_nn)))
              return scores


          # -----------------------------------------------------------------------------
          # Main execution
          # -----------------------------------------------------------------------------
          status = {
              "completed": False,
              "continuous_extension_completed": False,
              "exact_point_recovery_claimed": False,
              "message": "",
          }

          try:
              if np is None:
                  raise RuntimeError(f"NumPy is unavailable: {_numpy_import_error}")
              if not RESULTS_PATH.exists() or not OBSERVED_PATH.exists():
                  raise FileNotFoundError(
                      "Base joint-inference artifacts are missing; continuous extension cannot run."
                  )

              complete_rows = read_csv(RESULTS_PATH)
              observed_rows = read_csv(OBSERVED_PATH)
              reconstructed_rows = read_csv(RECONSTRUCTED_PATH) if RECONSTRUCTED_PATH.exists() else []
              missing_rows = read_csv(MISSING_PATH) if MISSING_PATH.exists() else []

              complete_rows.sort(key=lambda row: int(row["height"]))
              row_by_height = {int(row["height"]): row for row in complete_rows}
              observed_sorted = sorted(observed_rows, key=lambda row: int(row["height"]))
              observed_heights = [int(row["height"]) for row in observed_sorted]
              complete_heights = [int(row["height"]) for row in complete_rows]

              raw_points = np.asarray([hash_embedding(row["hash"]) for row in complete_rows], dtype=float)
              canonical_points, canonical_diag = canonical_gauge(raw_points)
              complete_index = {height: i for i, height in enumerate(complete_heights)}
              surviving_indices = np.asarray([complete_index[h] for h in observed_heights], dtype=int)
              x_survive = canonical_points[surviving_indices]

              # Create one controlled physical observation. The Bitcoin records remain real;
              # only the geometric sensor distortion is simulated so that its latent truth is
              # known and recovery can be scored.
              rng = np.random.default_rng(DISTORTION_SEED)
              basis_all, basis_labels, penalties = warp_basis(canonical_points)
              k = basis_all.shape[1]
              true_params = np.zeros(4 + 2 * k, dtype=float)
              true_params[0] = math.radians(LATENT_ROTATION_DEG)
              true_params[1] = math.log(LATENT_SCALE)
              true_params[2:4] = [LATENT_TRANSLATION_X, LATENT_TRANSLATION_Y]

              raw_coeffs = rng.normal(size=2 * k) / np.sqrt(np.tile(penalties, 2))
              raw_warp = np.column_stack(
                  (basis_all @ raw_coeffs[:k], basis_all @ raw_coeffs[k:])
              )
              raw_rms = math.sqrt(float(np.mean(raw_warp * raw_warp)))
              if WARP_AMPLITUDE > 0 and raw_rms > 0:
                  raw_coeffs *= WARP_AMPLITUDE / raw_rms
              else:
                  raw_coeffs[:] = 0.0
              true_params[4:] = raw_coeffs

              noiseless_all = model_points(canonical_points, basis_all, true_params)
              noisy_all = noiseless_all + rng.normal(0.0, NOISE_SIGMA, size=noiseless_all.shape)
              z_survive = noisy_all[surviving_indices]

              observation_rows = []
              observed_position_by_height = {
                  int(row["height"]): int(row.get("shuffled_position", 0))
                  for row in observed_rows
              }
              for local_index, (height, original, distorted) in enumerate(
                  zip(observed_heights, x_survive, z_survive)
              ):
                  observation_rows.append(
                      {
                          "height": height,
                          "hash": row_by_height[height]["hash"],
                          "shuffled_position": observed_position_by_height.get(height, ""),
                          "canonical_x": original[0],
                          "canonical_y": original[1],
                          "distorted_x": distorted[0],
                          "distorted_y": distorted[1],
                          "is_surviving_piece": True,
                      }
                  )
              write_csv(CONTINUOUS_OBSERVATION_PATH, observation_rows)

              # Fit with a bounded subset for MCMC cost, while final recovery uses every survivor.
              fit_cap = min(len(x_survive), MCMC_POINT_CAP)
              fit_indices = np.linspace(0, len(x_survive) - 1, fit_cap, dtype=int)
              x_fit = x_survive[fit_indices]
              z_fit = z_survive[fit_indices]
              basis_fit, _, penalties_fit = warp_basis(x_fit)
              initial, fitted_sigma, fitted_points, residual = fit_similarity_and_warp(
                  x_fit, z_fit, basis_fit, penalties_fit
              )
              likelihood_sigma = max(fitted_sigma, NOISE_SIGMA * 0.5)

              samples, posterior_rows, chain_summaries = run_mcmc_chains(
                  initial, x_fit, z_fit, basis_fit, penalties_fit, likelihood_sigma
              )

              # Add distance-to-truth and parameter error to posterior export.
              for row, params in zip(posterior_rows, samples):
                  row["rotation_error_degrees"] = math.degrees(wrap_angle(params[0] - true_params[0]))
                  row["log_scale_error"] = params[1] - true_params[1]
                  row["translation_error"] = float(np.linalg.norm(params[2:4] - true_params[2:4]))
                  row["warp_coefficient_rmse"] = math.sqrt(float(np.mean((params[4:] - true_params[4:]) ** 2)))
              write_csv(POSTERIOR_PATH, posterior_rows)

              # Use all observed points to produce posterior reconstructed shapes.
              posterior_shape_count = min(len(samples), max(PERSISTENCE_SAMPLE_CAP, 128))
              posterior_indices = np.linspace(0, len(samples) - 1, posterior_shape_count, dtype=int)
              chosen_samples = samples[posterior_indices]
              shapes = []
              shape_diags = []
              basis_survive, _, _ = warp_basis(x_survive)
              for params in chosen_samples:
                  predicted_noiseless_observation = model_points(x_survive, basis_survive, params)
                  gauged, diag = canonical_gauge(predicted_noiseless_observation)
                  shapes.append(gauged.astype(np.float32))
                  shape_diags.append(diag)
              shapes = np.asarray(shapes)
              true_survive_gauged, true_survive_diag = canonical_gauge(
                  noiseless_all[surviving_indices]
              )

              mean_shape, mean_shape_diag, distances_to_mean, cheb_center, cheb_radius = (
                  approximate_frechet_and_chebyshev(shapes)
              )
              truth_distances = np.asarray(
                  [quotient_distance(shape, true_survive_gauged) for shape in shapes]
              )

              # Tolerance topology and neighborhood confidence.
              tolerance_rows = []
              for radius in sorted(TOLERANCE_RADII):
                  mass_mean = float(np.mean(distances_to_mean <= radius))
                  mass_truth = float(np.mean(truth_distances <= radius))
                  basin1, basin2, gap = two_mode_gap(shapes, distances_to_mean, radius)
                  component_count = component_count_at_radius(
                      shapes[: min(len(shapes), PERSISTENCE_SAMPLE_CAP)], radius
                  )
                  tolerance_rows.append(
                      {
                          "tolerance_radius": radius,
                          "posterior_mass_around_frechet_mean": mass_mean,
                          "validation_mass_around_withheld_truth": mass_truth,
                          "sampled_basin_1_mass": basin1,
                          "sampled_basin_2_mass": basin2,
                          "sampled_neighborhood_log_mass_gap": gap,
                          "sample_graph_components": component_count,
                          "interpretation": (
                              "neighborhood concentration; not point probability and not exhaustive mode search"
                          ),
                      }
                  )
              write_csv(TOLERANCE_PATH, tolerance_rows)

              # Distance-filtration 0D persistence approximation from posterior samples.
              persistence_shapes = shapes[: min(len(shapes), PERSISTENCE_SAMPLE_CAP)]
              mst_edges = prim_mst_edge_lengths(persistence_shapes)
              persistence_rows = []
              for rank, death in enumerate(sorted(mst_edges, reverse=True), start=1):
                  persistence_rows.append(
                      {
                          "rank_by_lifetime": rank,
                          "birth_radius": 0.0,
                          "death_radius": death,
                          "lifetime": death,
                          "filtration": "0D Vietoris-Rips distance filtration on sampled posterior shapes",
                          "warning": "not a density upper-level-set persistence diagram",
                      }
                  )
              write_csv(PERSISTENCE_PATH, persistence_rows)

              # Stability modulus: perturb the continuous observation and refit.
              stability_rows = []
              base_params, base_sigma, base_recovered = fit_and_recover(x_survive, z_survive)
              stable_cap = min(len(x_survive), STABILITY_POINT_CAP)
              stable_indices = np.linspace(0, len(x_survive) - 1, stable_cap, dtype=int)
              stability_rng = np.random.default_rng(DISTORTION_SEED + 404)
              for eta in sorted(STABILITY_ETAS):
                  distances = []
                  for _ in range(STABILITY_REPEATS):
                      perturbed = z_survive + stability_rng.normal(0.0, eta, size=z_survive.shape)
                      _, _, recovered = fit_and_recover(
                          x_survive, perturbed, point_indices=stable_indices
                      )
                      distances.append(quotient_distance(base_recovered, recovered))
                  stability_rows.append(
                      {
                          "observation_perturbation_eta": eta,
                          "repeats": STABILITY_REPEATS,
                          "median_output_distance": quantile(distances, 0.5),
                          "p95_output_distance": quantile(distances, 0.95),
                          "maximum_output_distance": max(distances),
                          "empirical_lipschitz_p95": quantile(distances, 0.95) / eta,
                          "omega_hat_eta": quantile(distances, 0.95),
                      }
                  )
              write_csv(STABILITY_PATH, stability_rows)

              # Frequency split: smooth deformation versus high-frequency residual.
              fit_basis_all, fit_labels, fit_penalties = warp_basis(x_survive)
              all_initial, all_sigma, all_fitted, all_residual = fit_similarity_and_warp(
                  x_survive, z_survive, fit_basis_all, fit_penalties
              )
              fitted_coeff_x = all_initial[4:4 + len(fit_labels)]
              fitted_coeff_y = all_initial[4 + len(fit_labels):]
              frequency_rows = []
              total_warp_energy = 0.0
              for i, (fx, fy) in enumerate(fit_labels):
                  energy = float(fitted_coeff_x[i] ** 2 + fitted_coeff_y[i] ** 2)
                  total_warp_energy += energy
                  frequency_rows.append(
                      {
                          "frequency_x": fx,
                          "frequency_y": fy,
                          "frequency_norm": math.sqrt(fx * fx + fy * fy),
                          "sobolev_penalty": fit_penalties[i],
                          "coefficient_x": fitted_coeff_x[i],
                          "coefficient_y": fitted_coeff_y[i],
                          "coefficient_energy": energy,
                          "classified_as": "structured_low_frequency_warp",
                      }
                  )
              residual_energy = float(np.mean(all_residual * all_residual))
              frequency_rows.append(
                  {
                      "frequency_x": "residual",
                      "frequency_y": "residual",
                      "frequency_norm": "above_finite_basis_or_unstructured",
                      "sobolev_penalty": "",
                      "coefficient_x": "",
                      "coefficient_y": "",
                      "coefficient_energy": residual_energy,
                      "classified_as": "measurement_noise_or_unmodeled_damage",
                  }
              )
              write_csv(FREQUENCY_PATH, frequency_rows)

              # Measure and Jacobian audit. This corrects a common category error:
              # Jeffreys/Fisher volume is not generally identical to Haar measure.
              log_scale_checks = []
              for value in np.linspace(-0.3, 0.3, 13):
                  s = math.exp(value)
                  log_density_in_log_s = -0.5 * (value / 0.25) ** 2
                  log_density_in_s = log_density_in_log_s - math.log(s)
                  # p_log(log s) d(log s) == p_s(s) ds; d(log s)=ds/s.
                  log_scale_checks.append(abs(log_density_in_log_s - (log_density_in_s + math.log(s))))
              measure_rows = [
                  {
                      "component": "rotation",
                      "space": "SO(2)",
                      "coordinate": "theta_radians",
                      "base_measure": "normalized Haar dtheta/(2*pi)",
                      "proper_prior": "uniform on compact SO(2)",
                      "jacobian_handling": "angle wrapping; degrees are reporting only",
                  },
                  {
                      "component": "scale",
                      "space": "positive reals",
                      "coordinate": "log_scale",
                      "base_measure": "d(log s)=ds/s",
                      "proper_prior": "Gaussian in log_scale",
                      "jacobian_handling": "1/s factor when expressed in scale coordinates",
                  },
                  {
                      "component": "translation",
                      "space": "R^2 noncompact",
                      "coordinate": "gauge-normalized x,y",
                      "base_measure": "Lebesgue/Haar, not normalizable as uniform probability",
                      "proper_prior": "Gaussian in canonical units",
                      "jacobian_handling": "identity in selected coordinates",
                  },
                  {
                      "component": "nonrigid_warp",
                      "space": "finite Sobolev basis approximation to a deformation groupoid",
                      "coordinate": "frequency-basis coefficients",
                      "base_measure": "Lebesgue on coefficients",
                      "proper_prior": "Gaussian weighted by frequency and curvature penalty",
                      "jacobian_handling": "finite-dimensional approximation; no global group quotient claimed",
                  },
                  {
                      "component": "Fisher_vs_Haar",
                      "space": "measure audit",
                      "coordinate": "not applicable",
                      "base_measure": "distinct constructions in general",
                      "proper_prior": "no automatic sqrt(det(I^T I)) substitution",
                      "jacobian_handling": "Jeffreys volume is used only when explicitly justified",
                  },
                  {
                      "component": "numeric_reparameterization_check",
                      "space": "scale/log-scale",
                      "coordinate": "13 audit points",
                      "base_measure": "change-of-variables identity",
                      "proper_prior": "same prior under both coordinates",
                      "jacobian_handling": f"maximum log-density discrepancy={max(log_scale_checks):.3e}",
                  },
              ]
              write_csv(MEASURE_AUDIT_PATH, measure_rows)

              # Gauge diagnostics include explicit singular-section warning.
              gauge_rows = [
                  {"object": "complete_hash_embedding", **canonical_diag},
                  {"object": "surviving_true_embedding", **true_survive_diag},
                  {"object": "posterior_frechet_mean", **mean_shape_diag},
              ]
              write_csv(GAUGE_PATH, gauge_rows)

              # Functional identifiability: report properties rather than forcing pixel/point identity.
              path_lengths = []
              quadrants = []
              chronological_order = np.argsort(observed_heights)
              for shape in shapes:
                  path_lengths.append(temporal_path_length(shape, chronological_order))
                  quadrants.append(quadrant_counts(shape))
              quadrants = np.asarray(quadrants)
              nn_scores = nearest_neighbor_consistency(true_survive_gauged, shapes[: min(64, len(shapes))])

              permutation_exact = all(
                  row.get("permutation_recovered_exactly", "").lower() == "true"
                  for row in reconstructed_rows
              ) if reconstructed_rows else False
              missing_location_confidences = [safe_float(row.get("location_confidence", "nan")) for row in missing_rows]
              missing_location_confidences = [x for x in missing_location_confidences if math.isfinite(x)]

              functional_rows = [
                  {
                      "functional": "surviving_block_order",
                      "space": "discrete permutation",
                      "estimate": permutation_exact,
                      "posterior_or_validation": "metadata-assisted exact validation",
                      "diameter_or_interval": 0 if permutation_exact else 1,
                      "identifiable": permutation_exact,
                  },
                  {
                      "functional": "missing_height_mask",
                      "space": "discrete set of heights",
                      "estimate": f"{len(missing_rows)} missing heights",
                      "posterior_or_validation": "height-gap inference",
                      "diameter_or_interval": (
                          f"mean confidence={statistics.fmean(missing_location_confidences):.6f}"
                          if missing_location_confidences else "not available"
                      ),
                      "identifiable": bool(missing_rows),
                  },
                  {
                      "functional": "hash_rank_after_f",
                      "space": "ordering",
                      "estimate": "identical to rank of x=hash/target",
                      "posterior_or_validation": "analytic monotonicity",
                      "diameter_or_interval": 0,
                      "identifiable": True,
                  },
                  {
                      "functional": "continuous_temporal_path_length",
                      "space": "gauge-fixed embedding",
                      "estimate": statistics.fmean(path_lengths),
                      "posterior_or_validation": "posterior sample distribution",
                      "diameter_or_interval": f"95%=[{quantile(path_lengths,0.025):.6g},{quantile(path_lengths,0.975):.6g}]",
                      "identifiable": (quantile(path_lengths, 0.975) - quantile(path_lengths, 0.025)) <= 0.05 * max(statistics.fmean(path_lengths), 1e-12),
                  },
                  {
                      "functional": "nearest_neighbor_adjacency",
                      "space": "graph on gauge-fixed embedding",
                      "estimate": statistics.fmean(nn_scores),
                      "posterior_or_validation": "fraction matching undistorted reference",
                      "diameter_or_interval": f"95%=[{quantile(nn_scores,0.025):.6g},{quantile(nn_scores,0.975):.6g}]",
                      "identifiable": quantile(nn_scores, 0.025) >= 0.95,
                  },
                  {
                      "functional": "quadrant_occupancy",
                      "space": "four-count vector after gauge fixing",
                      "estimate": [float(x) for x in np.mean(quadrants, axis=0)],
                      "posterior_or_validation": "posterior sample distribution",
                      "diameter_or_interval": [int(x) for x in np.ptp(quadrants, axis=0)],
                      "identifiable": bool(np.max(np.ptp(quadrants, axis=0)) == 0),
                  },
                  {
                      "functional": "full_missing_block_headers",
                      "space": "SHA-256 header preimages",
                      "estimate": "not recovered",
                      "posterior_or_validation": "offline identifiability condition",
                      "diameter_or_interval": "vast equivalence class",
                      "identifiable": False,
                  },
              ]
              write_csv(FUNCTIONAL_PATH, functional_rows)

              # Optional plots.
              plot_files = []
              if MAKE_PLOTS:
                  try:
                      import matplotlib.pyplot as plt

                      plt.figure(figsize=(7, 7))
                      plt.scatter(x_survive[:, 0], x_survive[:, 1], s=4, label="canonical")
                      plt.scatter(z_survive[:, 0], z_survive[:, 1], s=4, label="distorted")
                      plt.xlabel("coordinate 1")
                      plt.ylabel("coordinate 2")
                      plt.title("Canonical and continuously distorted hash embedding")
                      plt.legend()
                      plt.tight_layout()
                      p = Path("bitcoin_continuous_observation.png")
                      plt.savefig(p, dpi=160)
                      plt.close()
                      plot_files.append(str(p))

                      plt.figure(figsize=(8, 5))
                      plt.hist(distances_to_mean, bins=24)
                      plt.xlabel("RMS quotient distance to posterior Fréchet mean")
                      plt.ylabel("sample count")
                      plt.title("Posterior neighborhood concentration")
                      plt.tight_layout()
                      p = Path("bitcoin_continuous_credible_radius.png")
                      plt.savefig(p, dpi=160)
                      plt.close()
                      plot_files.append(str(p))

                      plt.figure(figsize=(8, 5))
                      plt.plot(
                          [row["observation_perturbation_eta"] for row in stability_rows],
                          [row["p95_output_distance"] for row in stability_rows],
                          marker="o",
                      )
                      plt.xlabel("observation perturbation eta")
                      plt.ylabel("p95 quotient output distance")
                      plt.title("Empirical stability modulus")
                      plt.tight_layout()
                      p = Path("bitcoin_continuous_stability.png")
                      plt.savefig(p, dpi=160)
                      plt.close()
                      plot_files.append(str(p))

                      if mst_edges:
                          plt.figure(figsize=(8, 5))
                          plt.plot(sorted(mst_edges, reverse=True), marker="o", markersize=3)
                          plt.xlabel("ranked merge event")
                          plt.ylabel("death radius")
                          plt.title("0D posterior-sample persistence approximation")
                          plt.tight_layout()
                          p = Path("bitcoin_continuous_persistence.png")
                          plt.savefig(p, dpi=160)
                          plt.close()
                          plot_files.append(str(p))
                  except Exception as exc:
                      emit(f"[continuous plot warning] {exc}")

              # Summaries and enforceable claims.
              credible_r50 = quantile(distances_to_mean, 0.50)
              credible_r90 = quantile(distances_to_mean, 0.90)
              credible_r95 = quantile(distances_to_mean, 0.95)
              credible_r99 = quantile(distances_to_mean, 0.99)
              truth_r95 = quantile(truth_distances, 0.95)
              max_shape_distance = float(np.max(distances_to_mean))
              chain_acceptances = [row["acceptance_rate"] for row in chain_summaries]
              stability_monotone = all(
                  stability_rows[i]["p95_output_distance"] <= stability_rows[i + 1]["p95_output_distance"] + 1e-12
                  for i in range(len(stability_rows) - 1)
              )

              report_lines = [
                  "BITCOIN CONTINUOUS / GAUGE-INVARIANT INFERENCE EXTENSION",
                  "=" * 92,
                  "",
                  "SCOPE",
                  "The Bitcoin block records and hashes are real. Continuous rotation, scale, smooth warp,",
                  "and residual noise are controlled sensor distortions applied to a deterministic 2D hash",
                  "embedding so the latent transformation is known and can be validated.",
                  "This module does not claim that Bitcoin hashes are physically deformed or reversible.",
                  "",
                  "FORWARD MODEL",
                  "z = similarity(theta, scale, translation)(y) + phi_low_frequency(y) + xi_high_frequency",
                  "with deletion and shuffle inherited from the base joint-inference experiment.",
                  "",
                  "GAUGE AND MEASURE",
                  "- local gauge: zero center, unit RMS radius, principal axis alignment, sign anchor",
                  "- SO(2) angle prior: uniform with respect to Haar measure",
                  "- scale prior: Gaussian in log-scale, carrying the 1/s change-of-variables factor",
                  "- translation: proper Gaussian because noncompact Haar measure cannot be normalized",
                  "- nonrigid warp: finite Sobolev basis; no global groupoid quotient is claimed",
                  "- Fisher/Jeffreys volume is not treated as automatically equal to Haar measure",
                  f"- local gauge singularity warning: {canonical_diag['local_section_warning']}",
                  "",
                  "SAMPLING",
                  "- sampler: adaptive random-walk Metropolis over transformation and warp coefficients",
                  "- posterior geometry: predicted noiseless distorted embeddings modulo the local gauge",
                  "- RHMC is not falsely claimed; posterior geometry is approximated from sampled shapes",
                  f"- chains: {MCMC_CHAINS}",
                  f"- stored samples: {len(samples)}",
                  f"- acceptance rates: {', '.join(f'{x:.4f}' for x in chain_acceptances)}",
                  "",
                  "NEIGHBORHOOD IDENTIFIABILITY",
                  f"posterior_Frechet_radius_50: {credible_r50:.12g}",
                  f"posterior_Frechet_radius_90: {credible_r90:.12g}",
                  f"posterior_Frechet_radius_95: {credible_r95:.12g}",
                  f"posterior_Frechet_radius_99: {credible_r99:.12g}",
                  f"validation_truth_radius_95: {truth_r95:.12g}",
                  f"approx_Chebyshev_radius: {cheb_radius:.12g}",
                  f"maximum_sample_distance_from_Frechet_mean: {max_shape_distance:.12g}",
                  "Point probability is not used. Confidence is posterior mass inside explicit tolerance balls.",
                  "",
                  "TOPOLOGY",
                  "0D persistence is computed from a Vietoris-Rips distance filtration of sampled posterior",
                  "shapes. It is not mislabeled as persistence of posterior-density upper-level sets.",
                  f"largest_sample_merge_radius: {max(mst_edges) if mst_edges else float('nan'):.12g}",
                  "",
                  "DEFORMATION / NOISE SPLIT",
                  f"warp_basis_max_frequency: {WARP_MAX_FREQ}",
                  f"Sobolev_frequency_scale_omega0: {WARP_OMEGA0}",
                  f"fitted_low_frequency_coefficient_energy: {total_warp_energy:.12g}",
                  f"residual_mean_square_energy: {residual_energy:.12g}",
                  "",
                  "STABILITY",
                  f"empirical_omega_monotone_over_test_grid: {stability_monotone}",
                  "The stability CSV reports eta -> p95 quotient-space output displacement.",
                  "",
                  "FUNCTIONAL IDENTIFIABILITY",
              ]
              for row in functional_rows:
                  report_lines.append(
                      f"{row['functional']} | identifiable={row['identifiable']} | "
                      f"estimate={row['estimate']} | interval={row['diameter_or_interval']}"
                  )

              report_lines.extend(
                  [
                      "",
                      "LIMITATIONS",
                      "- The gauge is a local computational section and can be unstable on symmetric/isotropic clouds.",
                      "- The deformation groupoid is approximated by a finite smooth basis.",
                      "- The posterior is conditional on the chosen embedding, priors, basis, and candidate model.",
                      "- Sample persistence and two-basin gaps do not enumerate every possible posterior mode.",
                      "- Missing SHA-256 preimages remain non-identifiable unless external constraints make them unique.",
                  ]
              )
              REPORT_PATH.write_text("\n".join(report_lines) + "\n", encoding="utf-8")
              emit(REPORT_PATH.read_text(encoding="utf-8"))

              status.update(
                  {
                      "completed": True,
                      "continuous_extension_completed": True,
                      "message": "Gauge-aware continuous observation and tolerance-topology analysis completed.",
                      "embedding_mode": EMBEDDING_MODE,
                      "real_block_rows": len(complete_rows),
                      "surviving_rows": len(observed_rows),
                      "posterior_samples": len(samples),
                      "mcmc_chains": MCMC_CHAINS,
                      "mcmc_acceptance_rates": chain_acceptances,
                      "credible_radius_95": credible_r95,
                      "validation_truth_radius_95": truth_r95,
                      "approx_chebyshev_radius": cheb_radius,
                      "local_gauge_singularity_warning": canonical_diag["local_section_warning"],
                      "stability_monotone_over_test_grid": stability_monotone,
                      "exact_point_recovery_claimed": False,
                      "neighborhood_recovery_claim": {
                          "center": "posterior Frechet mean in local gauge",
                          "radius_95": credible_r95,
                          "mass": 0.95,
                          "metric": "RMS quotient distance after optimal translation, scale, and SO(2) alignment",
                      },
                      "plot_files": plot_files,
                  }
              )

          except Exception as exc:
              error_text = "".join(traceback.format_exception(type(exc), exc, exc.__traceback__))
              status.update(
                  {
                      "completed": False,
                      "continuous_extension_completed": False,
                      "message": str(exc),
                      "traceback": error_text,
                  }
              )
              REPORT_PATH.write_text(
                  "BITCOIN CONTINUOUS INFERENCE — INCOMPLETE\n"
                  + "=" * 60
