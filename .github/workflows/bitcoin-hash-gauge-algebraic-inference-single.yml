              candidates = build_order_candidates(
                  observed, fragments, RANDOM_CANDIDATES, SHUFFLE_SEED + 1
              )
              candidate_export = [
                  {key: value for key, value in c.items() if key != "sequence"}
                  for c in candidates
              ]
              candidate_export.sort(key=lambda c: c["energy_metadata"])
              write_csv(CANDIDATES_PATH, candidate_export)

              observed_by_height = {p["height"]: p for p in observed}
              missing_runs = infer_missing_runs(all_rows, observed_by_height)
              missing_rows, field_rows, run_rows = missing_inference_rows(
                  all_rows, observed, missing_runs, REVEAL_WITHHELD
              )
              write_csv(MISSING_PATH, missing_rows)
