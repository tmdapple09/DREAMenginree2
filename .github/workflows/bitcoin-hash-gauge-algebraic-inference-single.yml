          status = {
              "completed": False,
              "live_data": False,
              "rows": 0,
              "message": "",
          }

          try:
              if LOCAL_CSV:
                  raw_blocks, provider, tip_height = load_local_csv(LOCAL_CSV)
                  if len(raw_blocks) < BLOCK_COUNT:
                      emit(f"[local] requested {BLOCK_COUNT}; using available {len(raw_blocks)}")
