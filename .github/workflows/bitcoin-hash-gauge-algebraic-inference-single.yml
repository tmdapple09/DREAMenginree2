name: Bitcoin Hash Joint + Gauge + Algebraic Inference

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "Consecutive real main-chain blocks"
        required: false
        default: "5120"
        type: string
      end_height:
        description: "Last height; blank uses current tip"
        required: false
        default: ""
        type: string
      n:
        description: "Exponent n in f(x)"
        required: false
        default: "2.0"
        type: string
      a0:
        description: "Scale a0 in f(x)"
        required: false
        default: "1.2e-14"
        type: string
      max_lag:
        description: "Highest serial-correlation lag"
        required: false
        default: "512"
        type: string
      missing_count:
        description: "Real block records withheld from solver"
        required: false
        default: "64"
        type: string
      missing_mode:
        description: "Distribution of withheld pieces"
        required: false
        default: "mixed"
        type: choice
        options:
          - random
          - burst
          - mixed
      missing_seed:
        description: "Deterministic missing-mask seed"
        required: false
        default: "314159"
        type: string
      shuffle_seed:
        description: "Deterministic shuffle seed"
        required: false
        default: "271828"
        type: string
      random_candidates:
        description: "Alternative fragment orders to score"
        required: false
        default: "100"
        type: string
      reveal_withheld:
        description: "Reveal withheld real records after inference"
        required: false
        default: true
        type: boolean
      print_rows:
        description: "Rows printed in log; 0 prints all"
        required: false
        default: "200"
        type: string
      request_pause_ms:
        description: "Pause between API batches, milliseconds"
        required: false
        default: "100"
        type: string
      make_plots:
        description: "Create PNG analysis plots"
        required: false
        default: true
        type: boolean
      embedding_mode:
        description: "2D coordinate model for continuous analysis"
        required: false
        default: "hash_chunks"
        type: choice
        options:
          - hash_chunks
          - hilbert
      hilbert_order:
        description: "Hilbert order when embedding_mode=hilbert"
        required: false
        default: "16"
        type: string
      distortion_seed:
        description: "Known continuous-distortion holdout seed"
        required: false
        default: "1618033"
        type: string
      latent_rotation_deg:
        description: "Controlled latent rotation in degrees"
        required: false
        default: "17.5"
        type: string
      latent_scale:
        description: "Controlled latent positive scale"
        required: false
        default: "1.04"
        type: string
      warp_amplitude:
        description: "RMS low-frequency non-rigid warp"
        required: false
        default: "0.025"
        type: string
      warp_max_freq:
        description: "Maximum smooth-warp basis frequency"
        required: false
        default: "3"
        type: string
      noise_sigma:
        description: "High-frequency residual noise sigma"
        required: false
        default: "0.002"
        type: string
      mcmc_samples:
        description: "Stored posterior samples per chain"
        required: false
        default: "256"
        type: string
      tolerance_radii:
        description: "Comma-separated quotient-space radii"
        required: false
        default: "0.0005,0.001,0.002,0.005,0.01,0.02,0.05"
        type: string
      stability_etas:
        description: "Comma-separated observation perturbations"
        required: false
        default: "0.00025,0.0005,0.001,0.002,0.005"
        type: string
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: bitcoin-hash-gauge-inference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true

    env:
      # Base real-data and missing/shuffle inference.
      BLOCK_COUNT: ${{ inputs.blocks || '5120' }}
      END_HEIGHT: ${{ inputs.end_height || '' }}
      N_EXPONENT: ${{ inputs.n || '2.0' }}
      A0: ${{ inputs.a0 || '1.2e-14' }}
      MAX_LAG: ${{ inputs.max_lag || '512' }}
      MISSING_COUNT: ${{ inputs.missing_count || '64' }}
      MISSING_MODE: ${{ inputs.missing_mode || 'mixed' }}
      MISSING_SEED: ${{ inputs.missing_seed || '314159' }}
      SHUFFLE_SEED: ${{ inputs.shuffle_seed || '271828' }}
      RANDOM_CANDIDATES: ${{ inputs.random_candidates || '100' }}
      REVEAL_WITHHELD: ${{ inputs.reveal_withheld == false && 'false' || 'true' }}
      PRINT_ROWS: ${{ inputs.print_rows || '200' }}
      REQUEST_PAUSE_MS: ${{ inputs.request_pause_ms || '100' }}
      MAKE_PLOTS: ${{ inputs.make_plots == false && 'false' || 'true' }}

      # Continuous latent-transformation extension.
      EMBEDDING_MODE: ${{ inputs.embedding_mode || 'hash_chunks' }}
      HILBERT_ORDER: ${{ inputs.hilbert_order || '16' }}
      DISTORTION_SEED: ${{ inputs.distortion_seed || '1618033' }}
      LATENT_ROTATION_DEG: ${{ inputs.latent_rotation_deg || '17.5' }}
      LATENT_SCALE: ${{ inputs.latent_scale || '1.04' }}
      WARP_AMPLITUDE: ${{ inputs.warp_amplitude || '0.025' }}
      WARP_MAX_FREQ: ${{ inputs.warp_max_freq || '3' }}
      NOISE_SIGMA: ${{ inputs.noise_sigma || '0.002' }}
      MCMC_SAMPLES: ${{ inputs.mcmc_samples || '256' }}
      TOLERANCE_RADII: ${{ inputs.tolerance_radii || '0.0005,0.001,0.002,0.005,0.01,0.02,0.05' }}
      STABILITY_ETAS: ${{ inputs.stability_etas || '0.00025,0.0005,0.001,0.002,0.005' }}

      # Advanced parameters: edit these constants in the YAML when needed.
      LATENT_TRANSLATION_X: "0.07"
      LATENT_TRANSLATION_Y: "-0.04"
      WARP_RIDGE: "0.01"
      WARP_OMEGA0: "3.0"
      MCMC_BURN: "128"
      MCMC_THIN: "2"
      MCMC_CHAINS: "4"
      MCMC_POINT_CAP: "2048"
      PERSISTENCE_SAMPLE_CAP: "96"
      STABILITY_REPEATS: "8"
      STABILITY_POINT_CAP: "2048"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"

    steps:
      - name: Set up Python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install numerical and plotting dependencies
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check --no-input numpy matplotlib
          exit 0

      - name: Fetch real Bitcoin data and run discrete joint inference
        continue-on-error: true
        shell: bash
        run: |
          set +e

          python - <<'PY' 2>&1 | tee bitcoin_joint_inference_console.log
          import csv
          import hashlib
          import json
          import math
          import os
          import random
          import statistics
          import sys
          import time
          import traceback
          import urllib.request
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          # -----------------------------
          # Configuration
          # -----------------------------
          BLOCK_COUNT = max(10, int(os.environ.get("BLOCK_COUNT", "5120")))
          END_HEIGHT_TEXT = os.environ.get("END_HEIGHT", "").strip()
          END_HEIGHT = int(END_HEIGHT_TEXT) if END_HEIGHT_TEXT else None
          N_EXPONENT = float(os.environ.get("N_EXPONENT", "2.0"))
          A0 = float(os.environ.get("A0", "1.2e-14"))
          MAX_LAG = max(1, int(os.environ.get("MAX_LAG", "512")))
          PRINT_ROWS = max(0, int(os.environ.get("PRINT_ROWS", "200")))
          REQUEST_PAUSE_MS = max(0, int(os.environ.get("REQUEST_PAUSE_MS", "100")))
          MAKE_PLOTS = os.environ.get("MAKE_PLOTS", "true").strip().lower() in {
              "1", "true", "yes", "on"
          }
          MISSING_COUNT_INPUT = max(0, int(os.environ.get("MISSING_COUNT", "64")))
          MISSING_MODE = os.environ.get("MISSING_MODE", "mixed").strip().lower()
          MISSING_SEED = int(os.environ.get("MISSING_SEED", "314159"))
          SHUFFLE_SEED = int(os.environ.get("SHUFFLE_SEED", "271828"))
          RANDOM_CANDIDATES = max(0, int(os.environ.get("RANDOM_CANDIDATES", "100")))
          REVEAL_WITHHELD = os.environ.get("REVEAL_WITHHELD", "true").strip().lower() in {
              "1", "true", "yes", "on"
          }
          LOCAL_CSV = os.environ.get("LOCAL_CSV", "").strip()

          if N_EXPONENT <= 0:
              raise ValueError("N_EXPONENT must be positive")
          if MISSING_MODE not in {"random", "burst", "mixed"}:
              raise ValueError("MISSING_MODE must be random, burst, or mixed")

          API_BASES = [
              "https://blockstream.info/api",
              "https://mempool.space/api",
          ]
          UINT256_MAX = (1 << 256) - 1
          RETARGET_INTERVAL = 2016
          TARGET_SPACING = 600
          DIFF1_TARGET = 0x00000000FFFF0000000000000000000000000000000000000000000000000000

          RESULTS_PATH = Path("bitcoin_hash_transform_results.csv")
          LAGS_PATH = Path("bitcoin_hash_transform_lags.csv")
          OBSERVED_PATH = Path("bitcoin_puzzle_observed_shuffled.csv")
          RECONSTRUCTED_PATH = Path("bitcoin_puzzle_reconstructed_observed.csv")
          MISSING_PATH = Path("bitcoin_puzzle_missing_inference.csv")
          FRAGMENTS_PATH = Path("bitcoin_puzzle_chain_fragments.csv")
          CANDIDATES_PATH = Path("bitcoin_puzzle_order_candidates.csv")
          FIELD_CONFIDENCE_PATH = Path("bitcoin_puzzle_field_confidence.csv")
          WITHHELD_PATH = Path("bitcoin_puzzle_withheld_ground_truth.csv")
          REPORT_PATH = Path("bitcoin_joint_inference_report.txt")
          STATUS_PATH = Path("bitcoin_joint_inference_status.json")


          def emit(text=""):
              print(text, flush=True)


          def write_csv(path, rows, fieldnames=None):
              rows = list(rows)
              if fieldnames is None:
                  fieldnames = list(rows[0].keys()) if rows else []
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames, extrasaction="ignore")
                  writer.writeheader()
                  writer.writerows(rows)


          def finite_or_none(value):
              if isinstance(value, float) and not math.isfinite(value):
                  return None
              return value


          def http_get_text(path, attempts_per_provider=4):
              errors = []
              for base in API_BASES:
                  url = base.rstrip("/") + "/" + path.lstrip("/")
                  for attempt in range(1, attempts_per_provider + 1):
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-bitcoin-joint-inference/1.0",
                              "Accept": "application/json,text/plain",
                          },
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=35) as response:
                              return response.read().decode("utf-8"), base
                      except Exception as exc:
                          errors.append(f"{url}: {type(exc).__name__}: {exc}")
                          delay = min(10.0, 0.75 * (2 ** (attempt - 1)))
                          emit(
                              f"[retry] provider={base} attempt={attempt}/"
                              f"{attempts_per_provider} wait={delay:.2f}s error={exc}"
                          )
                          time.sleep(delay)
              raise RuntimeError("All live API providers were unavailable.\n" + "\n".join(errors))


          def http_get_json(path):
              text, provider = http_get_text(path)
              return json.loads(text), provider


          def fetch_recent_blocks(count, end_height=None):
              tip_text, provider = http_get_text("/blocks/tip/height")
              tip_height = int(tip_text.strip())
              requested_end = tip_height if end_height is None else min(end_height, tip_height)
              if requested_end < 1:
                  raise ValueError("end_height must be at least 1")

              emit(f"[live] initial_provider={provider}")
              emit(f"[live] reported_tip_height={tip_height}")
              emit(f"[live] requested_end_height={requested_end}")
              emit(f"[live] requested_blocks={count}")

              blocks_by_height = {}
              cursor = requested_end
              request_count = 0
              while len(blocks_by_height) < count and cursor >= 0:
                  batch, provider = http_get_json(f"/blocks/{cursor}")
                  request_count += 1
                  if not isinstance(batch, list) or not batch:
                      raise RuntimeError(f"Unexpected empty block response at height {cursor}")

                  for block in batch:
                      height = int(block["height"])
                      if height <= requested_end:
                          blocks_by_height[height] = block

                  lowest = min(int(block["height"]) for block in batch)
                  cursor = lowest - 1
                  if request_count == 1 or request_count % 10 == 0 or len(blocks_by_height) >= count:
                      emit(
                          f"[live] fetched={min(len(blocks_by_height), count)}/{count} "
                          f"requests={request_count} lowest_height={lowest}"
                      )
                  if REQUEST_PAUSE_MS:
                      time.sleep(REQUEST_PAUSE_MS / 1000.0)

              chosen_heights = sorted(blocks_by_height, reverse=True)[:count]
              blocks = [blocks_by_height[h] for h in chosen_heights]
              blocks.sort(key=lambda b: int(b["height"]))
              if len(blocks) != count:
                  raise RuntimeError(f"Requested {count} blocks but fetched {len(blocks)}")
              return blocks, provider, tip_height


          def load_local_csv(path):
              blocks = []
              with open(path, newline="", encoding="utf-8") as handle:
                  for row in csv.DictReader(handle):
                      ts = row.get("timestamp_utc", "")
                      if ts:
                          timestamp = int(datetime.fromisoformat(ts).timestamp())
                      else:
                          timestamp = int(row.get("timestamp", "0"))
                      blocks.append(
                          {
                              "id": row["hash"],
                              "height": int(row["height"]),
                              "version": int(row.get("version", "0") or 0),
                              "timestamp": timestamp,
                              "tx_count": int(row.get("tx_count", "0") or 0),
                              "size": int(row.get("size", "0") or 0),
                              "weight": int(row.get("weight", "0") or 0),
                              "merkle_root": row.get("merkle_root", ""),
                              "previousblockhash": row.get("previousblockhash", ""),
                              "mediantime": int(row.get("mediantime", "0") or 0),
                              "nonce": int(row.get("nonce", "0") or 0),
                              "bits": (
                                  int(row["bits_decimal"])
                                  if row.get("bits_decimal", "").strip()
                                  else int(row.get("bits_hex", "0"), 16)
                              ),
                              "difficulty": float(row.get("difficulty", "0") or 0),
                          }
                      )
              blocks.sort(key=lambda b: b["height"])
              return blocks, "local-real-csv", blocks[-1]["height"]


          def target_from_bits(bits):
              bits = int(bits)
              exponent = bits >> 24
              coefficient = bits & 0x007FFFFF
              if exponent <= 3:
                  return coefficient >> (8 * (3 - exponent))
              return coefficient << (8 * (exponent - 3))


          def transform(x):
              return A0 * x / ((1.0 + x ** N_EXPONENT) ** (1.0 / N_EXPONENT))


          def lag1_or_k_correlation(values, lag):
              if lag <= 0 or len(values) - lag < 3:
                  return float("nan")
              xs = values[:-lag]
              ys = values[lag:]
              mx = sum(xs) / len(xs)
              my = sum(ys) / len(ys)
              numerator = sum((x - mx) * (y - my) for x, y in zip(xs, ys))
              dx = sum((x - mx) ** 2 for x in xs)
              dy = sum((y - my) ** 2 for y in ys)
              denominator = math.sqrt(dx * dy)
              return numerator / denominator if denominator else float("nan")


          def uniform_ks_statistic(values):
              ordered = sorted(values)
              n = len(ordered)
              if not n:
                  return float("nan")
              d_plus = max((i + 1) / n - value for i, value in enumerate(ordered))
              d_minus = max(value - i / n for i, value in enumerate(ordered))
              return max(d_plus, d_minus)


          def hamming_distance_hex(a, b):
              return (int(a, 16) ^ int(b, 16)).bit_count()


          def block_to_analysis_rows(blocks):
              rows = []
              previous = None
              previous_target = None
              previous_x = None
              previous_timestamp = None
              for block in blocks:
                  height = int(block["height"])
                  block_hash = str(block["id"])
                  hash_integer = int(block_hash, 16)
                  bits = int(block["bits"])
                  target = target_from_bits(bits)
                  x_full = hash_integer / UINT256_MAX
                  x_target = hash_integer / target
                  fx = transform(x_target)
                  f2x = transform(fx)
                  f3x = transform(f2x)
                  timestamp = int(block["timestamp"])
                  row = {
                      "height": height,
                      "timestamp_unix": timestamp,
                      "timestamp_utc": datetime.fromtimestamp(timestamp, timezone.utc).isoformat(),
                      "hash": block_hash,
                      "previousblockhash": block.get("previousblockhash", ""),
                      "version": int(block.get("version", 0) or 0),
                      "merkle_root": block.get("merkle_root", ""),
                      "nonce": int(block.get("nonce", 0) or 0),
                      "bits_decimal": bits,
                      "bits_hex": f"{bits:08x}",
                      "difficulty": float(block.get("difficulty", 0) or (DIFF1_TARGET / target)),
                      "target_integer": target,
                      "hash_integer": hash_integer,
                      "pow_valid": hash_integer <= target,
                      "chain_link_valid": previous is None or block.get("previousblockhash", "") == previous["hash"],
                      "retarget_boundary": height % RETARGET_INTERVAL == 0,
                      "target_changed": previous_target is not None and target != previous_target,
                      "epoch_index": height // RETARGET_INTERVAL,
                      "height_in_epoch": height % RETARGET_INTERVAL,
                      "x_full_space": x_full,
                      "x_target_normalized": x_target,
                      "f_x_target": fx,
                      "f2_x_target": f2x,
                      "f3_x_target": f3x,
                      "delta_x": None if previous_x is None else x_target - previous_x,
                      "ratio_x": None if previous_x in (None, 0) else x_target / previous_x,
                      "xor_full_normalized": None if previous is None else (hash_integer ^ previous["hash_integer"]) / UINT256_MAX,
                      "hamming_to_previous_hash": None if previous is None else hamming_distance_hex(previous["hash"], block_hash),
                      "seconds_since_previous": None if previous_timestamp is None else timestamp - previous_timestamp,
                      "tx_count": int(block.get("tx_count", 0) or 0),
                      "size": int(block.get("size", 0) or 0),
                      "weight": int(block.get("weight", 0) or 0),
                      "mediantime": int(block.get("mediantime", 0) or 0),
                  }
                  rows.append(row)
                  previous = row
                  previous_target = target
                  previous_x = x_target
                  previous_timestamp = timestamp
              return rows


          def choose_missing_heights(rows, requested_count, mode, seed):
              # Keep first and last block observed so all missing runs are bracketed.
              interior = [row["height"] for row in rows[1:-1]]
              count = min(requested_count, len(interior))
              if count == 0:
                  return set()
              rng = random.Random(seed)
              if mode == "random":
                  return set(rng.sample(interior, count))

              available = set(interior)
              chosen = set()
              min_h, max_h = min(interior), max(interior)
              while len(chosen) < count and available:
                  if mode == "burst":
                      run_length = rng.randint(2, min(12, count - len(chosen))) if count - len(chosen) >= 2 else 1
                  else:  # mixed
                      run_length = 1 if rng.random() < 0.55 else rng.randint(2, min(8, count - len(chosen)))
                  start = rng.randint(min_h, max_h)
                  for height in range(start, start + run_length):
                      if height in available and len(chosen) < count:
                          chosen.add(height)
                          available.remove(height)
              if len(chosen) < count:
                  chosen.update(rng.sample(sorted(available), count - len(chosen)))
              return chosen


          def make_observation(rows, missing_heights, seed):
              observed = []
              for row in rows:
                  if row["height"] in missing_heights:
                      continue
                  piece = {
                      "observed_piece_id": hashlib.sha256(
                          f"{row['hash']}:{seed}".encode("utf-8")
                      ).hexdigest()[:16],
                      "height": row["height"],
                      "timestamp_unix": row["timestamp_unix"],
                      "timestamp_utc": row["timestamp_utc"],
                      "hash": row["hash"],
                      "previousblockhash": row["previousblockhash"],
                      "bits_hex": row["bits_hex"],
                      "difficulty": row["difficulty"],
                      "x_target_normalized": row["x_target_normalized"],
                      "f_x_target": row["f_x_target"],
                  }
                  observed.append(piece)
              rng = random.Random(seed)
              rng.shuffle(observed)
              for index, piece in enumerate(observed):
                  piece["shuffled_position"] = index
              return observed


          def build_chain_fragments(observed):
              by_hash = {piece["hash"]: piece for piece in observed}
              child_by_parent_hash = {}
              for piece in observed:
                  prev_hash = piece["previousblockhash"]
                  if prev_hash in by_hash:
                      child_by_parent_hash[prev_hash] = piece

              starts = [piece for piece in observed if piece["previousblockhash"] not in by_hash]
              visited = set()
              fragments = []
              for start in sorted(starts, key=lambda p: (p["timestamp_unix"], p["hash"])):
                  current = start
                  pieces = []
                  while current and current["hash"] not in visited:
                      pieces.append(current)
                      visited.add(current["hash"])
                      current = child_by_parent_hash.get(current["hash"])
                  fragments.append(pieces)

              # Defensive: any cycle/orphan not reached above becomes its own fragment.
              for piece in observed:
                  if piece["hash"] not in visited:
                      fragments.append([piece])
                      visited.add(piece["hash"])

              fragment_rows = []
              for fragment_id, pieces in enumerate(fragments):
                  heights = [p["height"] for p in pieces]
                  fragment_rows.append(
                      {
                          "fragment_id": fragment_id,
                          "piece_count": len(pieces),
                          "start_hash": pieces[0]["hash"],
                          "start_previousblockhash": pieces[0]["previousblockhash"],
                          "end_hash": pieces[-1]["hash"],
                          "start_timestamp_utc": pieces[0]["timestamp_utc"],
                          "end_timestamp_utc": pieces[-1]["timestamp_utc"],
                          "evaluation_start_height": min(heights),
                          "evaluation_end_height": max(heights),
                          "internal_links_exact": all(
                              pieces[i]["previousblockhash"] == pieces[i - 1]["hash"]
                              for i in range(1, len(pieces))
                          ),
                      }
                  )
              return fragments, fragment_rows


          def flatten_fragments(fragments, order):
              result = []
              for index in order:
                  result.extend(fragments[index])
              return result


          def order_metrics(sequence):
              heights = [p["height"] for p in sequence]
              if len(heights) < 2:
                  return {
                      "height_inversions_adjacent": 0,
                      "exact_observed_order": True,
                      "direct_hash_links": 0,
                      "broken_adjacencies": 0,
                      "negative_time_steps": 0,
                      "implied_missing_count": 0,
                      "energy_metadata": 0.0,
                      "energy_chain_only": 0.0,
                  }
              inversions_adjacent = sum(1 for a, b in zip(heights, heights[1:]) if b <= a)
              direct_links = 0
              broken = 0
              negative_time = 0
              implied_missing = 0
              link_penalty = 0.0
              time_penalty = 0.0
              metadata_penalty = 0.0
              for a, b in zip(sequence, sequence[1:]):
                  if b["previousblockhash"] == a["hash"]:
                      direct_links += 1
                  else:
                      broken += 1
                      link_penalty += 6.0
                  dt = b["timestamp_unix"] - a["timestamp_unix"]
                  if dt < 0:
                      negative_time += 1
                      time_penalty += 4.0 + min(20.0, abs(dt) / TARGET_SPACING)
                  else:
                      # Weak exponential-arrival prior. This is only a ranking term.
                      scaled = max((dt + 1) / TARGET_SPACING, 1e-12)
                      time_penalty += 0.05 * (scaled - math.log(scaled) - 1.0)
                  dh = b["height"] - a["height"]
                  if dh <= 0:
                      metadata_penalty += 1000.0 + 10.0 * abs(dh)
                  else:
                      implied_missing += max(0, dh - 1)
                      metadata_penalty += 0.25 * max(0, dh - 1)
                      if dh == 1 and b["previousblockhash"] != a["hash"]:
                          metadata_penalty += 1000.0
              exact = heights == sorted(heights)
              return {
                  "height_inversions_adjacent": inversions_adjacent,
                  "exact_observed_order": exact,
                  "direct_hash_links": direct_links,
                  "broken_adjacencies": broken,
                  "negative_time_steps": negative_time,
                  "implied_missing_count": implied_missing,
                  "E_observation": 0.0,
                  "E_local_links": link_penalty,
                  "E_global_time": time_penalty,
                  "E_global_height_and_order": metadata_penalty,
                  "C_missing": implied_missing,
                  "energy_metadata": metadata_penalty + 2.0 * link_penalty + time_penalty,
                  "energy_chain_only": link_penalty + time_penalty,
              }


          def build_order_candidates(observed, fragments, random_count, seed):
              candidates = []
              candidate_by_sequence = {}
              fragment_ids = list(range(len(fragments)))

              def add(name, sequence, scope):
                  fingerprint = tuple(piece["hash"] for piece in sequence)
                  if fingerprint in candidate_by_sequence:
                      existing = candidate_by_sequence[fingerprint]
                      existing["aliases"] = existing.get("aliases", "") + ("," if existing.get("aliases") else "") + name
                      return
                  metrics = order_metrics(sequence)
                  candidate = {
                      "candidate": name,
                      "aliases": "",
                      "scope": scope,
                      "sequence_fingerprint": hashlib.sha256("".join(fingerprint).encode("ascii")).hexdigest(),
                      **metrics,
                      "sequence": sequence,
                  }
                  candidates.append(candidate)
                  candidate_by_sequence[fingerprint] = candidate

              add("metadata_height_order", sorted(observed, key=lambda p: p["height"]), "metadata-assisted")
              add("timestamp_piece_order", sorted(observed, key=lambda p: (p["timestamp_unix"], p["hash"])), "chain-only")
              add("shuffled_observation_order", list(observed), "control")
              add("reverse_height_order", sorted(observed, key=lambda p: p["height"], reverse=True), "control")

              fragment_timestamp_order = sorted(
                  fragment_ids,
                  key=lambda i: (fragments[i][0]["timestamp_unix"], fragments[i][0]["hash"]),
              )
              add(
                  "exact_fragments_timestamp_order",
                  flatten_fragments(fragments, fragment_timestamp_order),
                  "chain-only",
              )

              rng = random.Random(seed)
              for idx in range(random_count):
                  order = fragment_ids[:]
                  rng.shuffle(order)
                  add(f"random_fragment_order_{idx + 1:04d}", flatten_fragments(fragments, order), "control")

              # Candidate-set posterior only; this is not the posterior over every permutation.
              for energy_name, posterior_name in [
                  ("energy_metadata", "candidate_set_posterior_metadata"),
                  ("energy_chain_only", "candidate_set_posterior_chain_only"),
              ]:
                  min_energy = min(c[energy_name] for c in candidates)
                  weights = [math.exp(-min(700.0, c[energy_name] - min_energy)) for c in candidates]
                  total = sum(weights) or 1.0
                  for candidate, weight in zip(candidates, weights):
                      candidate[posterior_name] = weight / total
              return candidates


          def infer_missing_runs(rows, observed_by_height):
              start_height = rows[0]["height"]
              end_height = rows[-1]["height"]
              missing = [h for h in range(start_height, end_height + 1) if h not in observed_by_height]
              runs = []
              if not missing:
                  return runs
              run_start = run_end = missing[0]
              for height in missing[1:]:
                  if height == run_end + 1:
                      run_end = height
                  else:
                      runs.append((run_start, run_end))
                      run_start = run_end = height
              runs.append((run_start, run_end))
              return runs


          def infer_epoch_bits(observed):
              by_epoch = defaultdict(set)
              for piece in observed:
                  by_epoch[piece["height"] // RETARGET_INTERVAL].add(piece["bits_hex"])
              return {
                  epoch: next(iter(values))
                  for epoch, values in by_epoch.items()
                  if len(values) == 1
              }


          def missing_inference_rows(all_rows, observed, missing_runs, reveal_withheld):
              truth_by_height = {row["height"]: row for row in all_rows}
              observed_by_height = {p["height"]: p for p in observed}
              epoch_bits = infer_epoch_bits(observed)
              rows = []
              field_rows = []
              run_rows = []

              for run_id, (start, end) in enumerate(missing_runs, 1):
                  left = observed_by_height.get(start - 1)
                  right = observed_by_height.get(end + 1)
                  committed_last_hash = right["previousblockhash"] if right else ""
                  actual_last_hash = truth_by_height[end]["hash"]
                  run_rows.append(
                      {
                          "run_id": run_id,
                          "missing_start_height": start,
                          "missing_end_height": end,
                          "missing_count": end - start + 1,
                          "left_observed_height": left["height"] if left else None,
                          "left_observed_hash": left["hash"] if left else "",
                          "right_observed_height": right["height"] if right else None,
                          "right_observed_hash": right["hash"] if right else "",
                          "successor_committed_last_missing_hash": committed_last_hash,
                          "commitment_matches_withheld_truth": committed_last_hash == actual_last_hash if right else None,
                          "offline_location_identifiable": True,
                          "offline_missing_count_identifiable": True,
                          "offline_all_hashes_identifiable": (start == end and bool(right)),
                          "offline_full_headers_identifiable": False,
                          "ambiguity_statement": (
                              "single missing hash fixed by successor; header fields remain non-identifiable"
                              if start == end and right
                              else "only final missing hash is fixed by successor; intermediate hashes and headers remain non-identifiable"
                          ),
                      }
                  )

                  for height in range(start, end + 1):
                      truth = truth_by_height[height]
                      is_first = height == start
                      is_last = height == end
                      inferred_hash = committed_last_hash if is_last and right else ""
                      inferred_prev = left["hash"] if is_first and left else ""
                      inferred_bits = epoch_bits.get(height // RETARGET_INTERVAL, "")
                      hash_conf = 1.0 if inferred_hash else 0.0
                      prev_conf = 1.0 if inferred_prev else 0.0
                      bits_conf = 1.0 if inferred_bits else 0.0
                      row = {
                          "run_id": run_id,
                          "height": height,
                          "location_confidence": 1.0,
                          "inferred_hash": inferred_hash,
                          "hash_confidence": hash_conf,
                          "inferred_previousblockhash": inferred_prev,
                          "previousblockhash_confidence": prev_conf,
                          "inferred_bits_hex": inferred_bits,
                          "bits_confidence": bits_conf,
                          "timestamp_lower_bound_utc": left["timestamp_utc"] if left else "",
                          "timestamp_upper_bound_utc": right["timestamp_utc"] if right else "",
                          "timestamp_exactly_identifiable": False,
                          "merkle_root_identifiable": False,
                          "nonce_identifiable": False,
                          "full_header_identifiable_offline": False,
                          "unknown_content_class": "many-to-one SHA-256 preimage class under header constraints",
                          "withheld_hash_for_validation": truth["hash"] if reveal_withheld else "",
                          "hash_inference_correct": (inferred_hash == truth["hash"]) if inferred_hash else None,
                          "withheld_previousblockhash": truth["previousblockhash"] if reveal_withheld else "",
                          "withheld_timestamp_utc": truth["timestamp_utc"] if reveal_withheld else "",
                          "withheld_merkle_root": truth["merkle_root"] if reveal_withheld else "",
                          "withheld_nonce": truth["nonce"] if reveal_withheld else "",
                      }
                      rows.append(row)
                      for field_name, confidence, identifiable, value in [
                          ("height/location", 1.0, True, str(height)),
                          ("hash", hash_conf, bool(inferred_hash), inferred_hash),
                          ("previousblockhash", prev_conf, bool(inferred_prev), inferred_prev),
                          ("bits", bits_conf, bool(inferred_bits), inferred_bits),
                          ("timestamp", 0.0, False, "bounded interval only"),
                          ("merkle_root", 0.0, False, ""),
                          ("nonce", 0.0, False, ""),
                      ]:
                          field_rows.append(
                              {
                                  "height": height,
                                  "field": field_name,
                                  "identifiable_from_observed_pieces": identifiable,
                                  "confidence": confidence,
                                  "inferred_value": value,
                              }
                          )
              return rows, field_rows, run_rows


          def create_reconstructed_rows(observed):
              ordered = sorted(observed, key=lambda p: p["height"])
              output = []
              for canonical_index, piece in enumerate(ordered):
                  output.append(
                      {
                          **piece,
                          "inferred_canonical_index": canonical_index,
                          "permutation_recovered_exactly": True,
                          "position_method": "height metadata; hash links verify direct adjacencies",
                      }
                  )
              return output


          def print_limited_table(title, rows, columns, limit):
              emit()
              emit(title)
              emit("=" * len(title))
              selected = rows if limit == 0 else rows[:limit]
              for row in selected:
