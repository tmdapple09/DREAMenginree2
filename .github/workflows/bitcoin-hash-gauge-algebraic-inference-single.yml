              x_values = [r["x_target_normalized"] for r in all_rows]
              ks_d = uniform_ks_statistic(x_values)
              ks_boundary = 1.36 / math.sqrt(len(x_values))

              max_usable_lag = min(MAX_LAG, len(x_values) - 3)
