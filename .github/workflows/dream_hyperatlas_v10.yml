                      draw.text((content[0]+20*scale, content[1]+20*scale), "Cauchy RS parity over GF(256)\nAny 12 of 16 vertices reconstruct the repository.\nThis image is an independently authenticated repair manifold.", font=mono, fill=(226, 214, 255))
                      if groups[cell]:
                          lower=(content[0]+10,(content[1]+content[3])//2,content[2]-10,content[3]-10)
