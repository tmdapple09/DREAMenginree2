name: DREAM HyperAtlas — Visual Repository Recovery

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "GitHub runner label"
        required: false
        default: "ubuntu-latest"
        type: string
      capsule_max_dimension:
        description: "Maximum square dimension for the single-image complete repository capsule"
        required: false
        default: "16000"
        type: string
      atlas_cell_max_dimension:
        description: "Maximum square dimension for each 4D atlas cell image"
        required: false
        default: "8000"
        type: string
      run_project_checks:
        description: "Install project dependencies and run available typecheck/lint/test/build scripts"
        required: false
        default: true
        type: boolean
      fail_on_project_checks:
        description: "Fail after artifact upload when a project check fails"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "dream-hyperatlas-output/**"

permissions:
  contents: read

concurrency:
  group: dream-hyperatlas-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HYPERATLAS_OUTPUT: dream-hyperatlas-output
  HYPERATLAS_SCRIPT: .dream-hyperatlas/dream_hyperatlas.py
  PYTHONUNBUFFERED: "1"

jobs:
  build-hyperatlas:
    name: Build and prove DREAM HyperAtlas
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Checkout complete project state
        uses: actions/checkout@v4
        with:
          fetch-depth: 64
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install deterministic HyperAtlas runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy>=2,<3" \
            "Pillow>=11,<13" \
            "zstandard>=0.23,<1"

      - name: Materialize the self-contained HyperAtlas encoder and decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$HYPERATLAS_SCRIPT")"
          cat > "$HYPERATLAS_SCRIPT" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          
          import argparse
          import base64
          import binascii
          import hashlib
          import json
          import math
          import mmap
          import os
          import re
          import shutil
          import stat
          import struct
          import subprocess
          import sys
          import time
          import zlib
          from collections import Counter, defaultdict, deque
          from dataclasses import dataclass
          from pathlib import Path, PurePosixPath
          from typing import Any, Iterable, Iterator, Sequence
          
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont
          
          try:
              import zstandard as zstd
          except Exception:
              zstd = None
          
          VERSION = 10
          MODEL_REVISION = "2026-07-20-hyperatlas-operational-geometry-r1"
          CONTAINER_MAGIC = b"DRHYPC10"
          CONTAINER_HEADER = struct.Struct(">8sIIQQQQ32s32s32s32s")
          CELL_MAGIC = b"DRHCEL10"
          CELL_HEADER_SIZE = 512
          CELL_HEADER = struct.Struct(">8sHBBIIQQ32s32s32sI")
          DATA_CELLS = (0, 1, 2, 4, 6, 7, 8, 9, 11, 13, 14, 15)
          PARITY_CELLS = (3, 5, 10, 12)
          K_DATA = len(DATA_CELLS)
          N_CELLS = 16
          CHUNK_MIN = 64 * 1024
          CHUNK_AVG = 256 * 1024
          CHUNK_MAX = 1024 * 1024
          EMBED_BITS = (3, 3, 2)
          
          SOURCE_EXTENSIONS = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".rs", ".go",
              ".java", ".kt", ".kts", ".swift", ".c", ".cc", ".cpp", ".h", ".hpp",
              ".cs", ".sh", ".bash", ".zsh", ".ps1", ".sql", ".css", ".scss", ".sass",
              ".less", ".html", ".vue", ".svelte", ".astro", ".graphql", ".gql",
          }
          CONFIG_EXTENSIONS = {
              ".json", ".jsonc", ".yaml", ".yml", ".toml", ".ini", ".cfg", ".conf",
              ".xml", ".properties", ".env", ".example", ".lock",
          }
          DOC_EXTENSIONS = {".md", ".mdx", ".txt", ".rst", ".tex", ".csv"}
          IMAGE_EXTENSIONS = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp", ".ico", ".svg"}
          AUDIO_EXTENSIONS = {".mp3", ".wav", ".ogg", ".flac", ".m4a", ".aac"}
          MODEL_EXTENSIONS = {".glb", ".gltf", ".obj", ".fbx", ".stl", ".dae"}
          FONT_EXTENSIONS = {".ttf", ".otf", ".woff", ".woff2"}
          BINARY_EXTENSIONS = {".wasm", ".bin", ".dat", ".db", ".sqlite", ".zip", ".gz", ".br"}
          ENTRY_BASENAMES = {
              "index.ts", "index.tsx", "index.js", "index.jsx", "main.ts", "main.tsx", "main.js",
              "app.ts", "app.tsx", "server.ts", "server.js", "page.tsx", "layout.tsx",
          }
          SECRET_PATTERNS = [
              ("private-key", re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("github-token", re.compile(rb"gh[pousr]_[A-Za-z0-9_]{30,}")),
              ("aws-access-key", re.compile(rb"AKIA[0-9A-Z]{16}")),
              ("generic-secret", re.compile(rb"(?i)(?:api[_-]?key|secret|token|password)\s*[:=]\s*[\"']?[A-Za-z0-9_./+=-]{20,}")),
          ]
          
          PALETTE = {
              "source": (38, 156, 255),
              "config": (190, 106, 255),
              "docs": (88, 211, 141),
              "image": (255, 111, 145),
              "audio": (255, 180, 72),
              "model": (72, 215, 214),
              "font": (250, 221, 92),
              "binary": (156, 163, 175),
              "other": (103, 125, 170),
              "background": (8, 12, 24),
              "panel": (15, 22, 39),
              "grid": (75, 92, 128),
              "text": (233, 240, 255),
              "muted": (153, 168, 198),
              "danger": (255, 76, 104),
              "warning": (255, 191, 71),
              "ok": (73, 219, 142),
          }
          
          GEAR = [int.from_bytes(hashlib.sha256(f"DREAM-GEAR-{i}".encode()).digest()[:8], "big") for i in range(256)]
          
          
          def canonical_json(value: Any) -> bytes:
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          
          
          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()
          
          
          def run_text(args: Sequence[str], cwd: Path, timeout: int = 120) -> str:
              try:
                  result = subprocess.run(args, cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=timeout, check=False)
                  return result.stdout
              except Exception:
                  return ""
          
          
          def safe_rel(path: str) -> str:
              p = PurePosixPath(path)
              if p.is_absolute() or ".." in p.parts or not p.parts:
                  raise ValueError(f"unsafe path: {path!r}")
              return p.as_posix()
          
          
          def category_for(path: str) -> str:
              p = PurePosixPath(path)
              ext = p.suffix.lower()
              if ext in SOURCE_EXTENSIONS:
                  return "source"
              if ext in CONFIG_EXTENSIONS or p.name in {"Dockerfile", "Makefile", "Procfile", "package.json", "tsconfig.json"}:
                  return "config"
              if ext in DOC_EXTENSIONS:
                  return "docs"
              if ext in IMAGE_EXTENSIONS:
                  return "image"
              if ext in AUDIO_EXTENSIONS:
                  return "audio"
              if ext in MODEL_EXTENSIONS:
                  return "model"
              if ext in FONT_EXTENSIONS:
                  return "font"
              if ext in BINARY_EXTENSIONS:
                  return "binary"
              return "other"
          
          
          def top_component(path: str) -> str:
              parts = PurePosixPath(path).parts
              return parts[0] if len(parts) > 1 else "<root>"
          
          
          def display_size(value: int) -> str:
              units = ["B", "KiB", "MiB", "GiB", "TiB"]
              x = float(value)
              for unit in units:
                  if x < 1024 or unit == units[-1]:
                      return f"{x:.2f} {unit}"
                  x /= 1024
              return f"{x:.2f} TiB"
          
          
          def load_font(size: int, mono: bool = False, bold: bool = False) -> ImageFont.ImageFont:
              candidates = []
              if mono:
                  candidates += [
                      "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf",
                      "/usr/share/fonts/truetype/liberation2/LiberationMono-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation2/LiberationMono-Regular.ttf",
                  ]
              else:
                  candidates += [
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                      "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
                  ]
              for candidate in candidates:
                  if Path(candidate).exists():
                      return ImageFont.truetype(candidate, size=size)
              return ImageFont.load_default()
          
          
          def tracked_paths(root: Path) -> list[str]:
              raw = b""
              try:
                  result = subprocess.run(
                      ["git", "ls-files", "-z", "--cached", "--recurse-submodules"],
                      cwd=root, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False, timeout=180,
                  )
                  raw = result.stdout if result.returncode == 0 else b""
              except Exception:
                  raw = b""
              if raw:
                  paths = [safe_rel(x.decode("utf-8", "surrogateescape")) for x in raw.split(b"\0") if x]
              else:
                  excluded = {".git", "node_modules", ".next", "dist", "build", "coverage", ".cache", ".turbo", "dream-hyperatlas-output"}
                  paths = []
                  for p in root.rglob("*"):
                      rel = p.relative_to(root)
                      if any(part in excluded for part in rel.parts):
                          continue
                      if p.is_file() or p.is_symlink():
                          paths.append(safe_rel(rel.as_posix()))
              return sorted(set(paths))
          
          
          def recent_churn(root: Path, limit: int = 64) -> Counter[str]:
              output = run_text(["git", "log", f"-{limit}", "--format=", "--name-only", "--no-renames"], root, timeout=180)
              counts: Counter[str] = Counter()
              for line in output.splitlines():
                  line = line.strip()
                  if line:
                      try:
                          counts[safe_rel(line)] += 1
                      except ValueError:
                          pass
              return counts
          
          
          def fastcdc_ranges(data: memoryview, minimum: int = CHUNK_MIN, average: int = CHUNK_AVG, maximum: int = CHUNK_MAX) -> Iterator[tuple[int, int]]:
              n = len(data)
              if n == 0:
                  return
              mask_small = average - 1
              mask_large = (average * 2) - 1
              start = 0
              while start < n:
                  remaining = n - start
                  if remaining <= maximum:
                      if remaining <= minimum:
                          yield start, n
                          break
                  cut = min(start + minimum, n)
                  normal = min(start + average, n)
                  end = min(start + maximum, n)
                  h = 0
                  while cut < normal:
                      h = ((h << 1) + GEAR[data[cut]]) & 0xFFFFFFFFFFFFFFFF
                      cut += 1
                      if (h & mask_small) == 0:
                          break
                  while cut < end and (h & mask_large) != 0:
                      h = ((h << 1) + GEAR[data[cut]]) & 0xFFFFFFFFFFFFFFFF
                      cut += 1
                  if cut <= start:
                      cut = min(start + maximum, n)
                  yield start, cut
                  start = cut
          
          
          def compress_chunk(raw: bytes) -> tuple[int, bytes]:
              candidates: list[tuple[int, bytes]] = [(0, raw), (1, zlib.compress(raw, 9))]
              if zstd is not None:
                  candidates.append((2, zstd.ZstdCompressor(level=12, threads=0).compress(raw)))
              codec, stored = min(candidates, key=lambda item: len(item[1]))
              return codec, stored
          
          
          def decompress_chunk(codec: int, stored: bytes, raw_len: int) -> bytes:
              if codec == 0:
                  raw = stored
              elif codec == 1:
                  raw = zlib.decompress(stored)
              elif codec == 2 and zstd is not None:
                  raw = zstd.ZstdDecompressor().decompress(stored, max_output_size=raw_len)
              else:
                  raise ValueError(f"unsupported chunk codec {codec}")
              if len(raw) != raw_len:
                  raise ValueError("chunk length mismatch")
              return raw
          
          
          @dataclass
          class Chunk:
              digest: str
              raw_len: int
              codec: int
              stored: bytes
          
          
          @dataclass
          class Entry:
              path: str
              kind: str
              mode: int
              size: int
              digest: str
              chunks: list[str]
              target: str | None
              category: str
          
          
          def capture_tree(root: Path, paths: Sequence[str]) -> tuple[list[Entry], dict[str, Chunk], list[dict[str, Any]]]:
              entries: list[Entry] = []
              chunks: dict[str, Chunk] = {}
              secrets: list[dict[str, Any]] = []
              for index, rel in enumerate(paths):
                  p = root / rel
                  try:
                      st = p.lstat()
                  except FileNotFoundError:
                      continue
                  mode = stat.S_IMODE(st.st_mode)
                  if stat.S_ISLNK(st.st_mode):
                      target = os.readlink(p)
                      raw = target.encode("utf-8", "surrogateescape")
                      entries.append(Entry(rel, "symlink", mode, len(raw), sha256(raw), [], target, "other"))
                      continue
                  if not stat.S_ISREG(st.st_mode):
                      continue
                  chunk_ids: list[str] = []
                  file_hasher = hashlib.sha256()
                  with p.open("rb") as fh:
                      if st.st_size == 0:
                          data_view = memoryview(b"")
                          ranges: Iterable[tuple[int, int]] = []
                      else:
                          mm = mmap.mmap(fh.fileno(), 0, access=mmap.ACCESS_READ)
                          data_view = memoryview(mm)
                          ranges = fastcdc_ranges(data_view)
                      try:
                          for start, end in ranges:
                              raw = bytes(data_view[start:end])
                              file_hasher.update(raw)
                              digest = sha256(raw)
                              chunk_ids.append(digest)
                              if digest not in chunks:
                                  codec, stored = compress_chunk(raw)
                                  chunks[digest] = Chunk(digest, len(raw), codec, stored)
                          if st.st_size == 0:
                              file_hasher.update(b"")
                          if st.st_size <= 4 * 1024 * 1024 and category_for(rel) in {"source", "config", "docs", "other"}:
                              pbytes = p.read_bytes()
                              for name, pattern in SECRET_PATTERNS:
                                  match = pattern.search(pbytes)
                                  if match:
                                      secrets.append({
                                          "path": rel,
                                          "pattern": name,
                                          "evidence_sha256_prefix": sha256(match.group(0))[:16],
                                      })
                      finally:
                          if st.st_size:
                              data_view.release()
                              mm.close()
                  entries.append(Entry(rel, "file", mode, st.st_size, file_hasher.hexdigest(), chunk_ids, None, category_for(rel)))
                  if index and index % 500 == 0:
                      print(f"captured {index}/{len(paths)} files", flush=True)
              return entries, chunks, secrets
          
          
          IMPORT_PATTERNS = [
              re.compile(r"(?:import|export)\s+(?:[^;]*?\s+from\s+)?[\"']([^\"']+)[\"']"),
              re.compile(r"(?:require|import)\s*\(\s*[\"']([^\"']+)[\"']\s*\)"),
          ]
          PY_IMPORT = re.compile(r"^\s*(?:from\s+([A-Za-z0-9_\.]+)\s+import|import\s+([A-Za-z0-9_\.]+))", re.MULTILINE)
          
          
          def parse_tsconfig_aliases(root: Path) -> dict[str, list[str]]:
              aliases: dict[str, list[str]] = {}
              for name in ("tsconfig.json", "jsconfig.json"):
                  p = root / name
                  if not p.exists():
                      continue
                  try:
                      text = re.sub(r"/\*.*?\*/|//[^\n]*", "", p.read_text(encoding="utf-8", errors="replace"), flags=re.S)
                      obj = json.loads(text)
                      compiler = obj.get("compilerOptions", {})
                      base = compiler.get("baseUrl", ".")
                      for key, values in compiler.get("paths", {}).items():
                          aliases[key] = [str(PurePosixPath(base) / value) for value in values]
                  except Exception:
                      continue
              return aliases
          
          
          def resolve_import(source: str, spec: str, existing: set[str], aliases: dict[str, list[str]]) -> str | None:
              candidates: list[str] = []
              src_dir = PurePosixPath(source).parent
              if spec.startswith("."):
                  candidates.append((src_dir / spec).as_posix())
              else:
                  for key, values in aliases.items():
                      if "*" in key:
                          prefix, suffix = key.split("*", 1)
                          if spec.startswith(prefix) and spec.endswith(suffix):
                              middle = spec[len(prefix): len(spec) - len(suffix) if suffix else None]
                              for value in values:
                                  candidates.append(value.replace("*", middle))
                      elif spec == key:
                          candidates.extend(values)
                  if spec.startswith("@/"):
                      candidates.append(spec[2:])
              extensions = ["", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".json", ".css", ".py"]
              indexes = ["/index.ts", "/index.tsx", "/index.js", "/index.jsx", "/index.py"]
              for base in candidates:
                  norm = PurePosixPath(base).as_posix().lstrip("./")
                  for ext in extensions:
                      candidate = norm + ext
                      if candidate in existing:
                          return candidate
                  for suffix in indexes:
                      candidate = norm.rstrip("/") + suffix
                      if candidate in existing:
                          return candidate
              return None
          
          
          def dependency_analysis(root: Path, entries: Sequence[Entry]) -> dict[str, Any]:
              existing = {e.path for e in entries if e.kind == "file"}
              aliases = parse_tsconfig_aliases(root)
              graph: dict[str, set[str]] = defaultdict(set)
              unresolved: list[dict[str, str]] = []
              todos: Counter[str] = Counter()
              for entry in entries:
                  if entry.kind != "file" or entry.category not in {"source", "config"} or entry.size > 4 * 1024 * 1024:
                      continue
                  p = root / entry.path
                  try:
                      text = p.read_text(encoding="utf-8", errors="replace")
                  except Exception:
                      continue
                  todos[entry.path] = len(re.findall(r"\b(?:TODO|FIXME|HACK|XXX)\b", text, flags=re.I))
                  specs: list[str] = []
                  if p.suffix.lower() == ".py":
                      for match in PY_IMPORT.finditer(text):
                          spec = match.group(1) or match.group(2)
                          if spec and spec.startswith("."):
                              specs.append(spec.replace(".", "/"))
                  else:
                      for pattern in IMPORT_PATTERNS:
                          specs.extend(pattern.findall(text))
                  for spec in specs:
                      if not (spec.startswith(".") or spec.startswith("@/") or any(spec.startswith(k.rstrip("*")) for k in aliases)):
                          continue
                      target = resolve_import(entry.path, spec, existing, aliases)
                      if target:
                          graph[entry.path].add(target)
                      else:
                          unresolved.append({"source": entry.path, "specifier": spec})
              indegree: Counter[str] = Counter()
              outdegree: Counter[str] = Counter()
              for source, targets in graph.items():
                  outdegree[source] = len(targets)
                  for target in targets:
                      indegree[target] += 1
          
              entries_set = set(existing)
              roots: set[str] = set()
              for path in existing:
                  p = PurePosixPath(path)
                  if p.name.lower() in ENTRY_BASENAMES or (p.parts and p.parts[0] == "app" and p.name in {"page.tsx", "layout.tsx", "route.ts"}):
                      roots.add(path)
              package = root / "package.json"
              if package.exists():
                  try:
                      obj = json.loads(package.read_text(encoding="utf-8"))
                      for field in ("main", "module", "types"):
                          value = obj.get(field)
                          if isinstance(value, str):
                              resolved = resolve_import("package.json", "./" + value.lstrip("./"), entries_set, aliases)
                              if resolved:
                                  roots.add(resolved)
                  except Exception:
                      pass
              reachable: set[str] = set()
              queue = deque(sorted(roots))
              while queue:
                  node = queue.popleft()
                  if node in reachable:
                      continue
                  reachable.add(node)
                  queue.extend(sorted(graph.get(node, ())))
          
              # Tarjan SCCs over actual source dependency graph.
              index_counter = 0
              stack: list[str] = []
              on_stack: set[str] = set()
              indices: dict[str, int] = {}
              low: dict[str, int] = {}
              sccs: list[list[str]] = []
          
              def strongconnect(v: str) -> None:
                  nonlocal index_counter
                  indices[v] = index_counter
                  low[v] = index_counter
                  index_counter += 1
                  stack.append(v)
                  on_stack.add(v)
                  for w in graph.get(v, ()):
                      if w not in indices:
                          strongconnect(w)
                          low[v] = min(low[v], low[w])
                      elif w in on_stack:
                          low[v] = min(low[v], indices[w])
                  if low[v] == indices[v]:
                      component: list[str] = []
                      while True:
                          w = stack.pop()
                          on_stack.remove(w)
                          component.append(w)
                          if w == v:
                              break
                      if len(component) > 1:
                          sccs.append(sorted(component))
          
              for node in sorted(set(graph) | {x for targets in graph.values() for x in targets}):
                  if node not in indices:
                      strongconnect(node)
          
              return {
                  "graph": {k: sorted(v) for k, v in sorted(graph.items())},
                  "unresolved": unresolved,
                  "todos": dict(todos),
                  "indegree": dict(indegree),
                  "outdegree": dict(outdegree),
                  "roots": sorted(roots),
                  "reachable": sorted(reachable),
                  "cycles": sorted(sccs, key=lambda x: (-len(x), x[0])),
                  "aliases": aliases,
              }
          
          
          def feature_metrics(entries: Sequence[Entry], dep: dict[str, Any], churn: Counter[str]) -> dict[str, dict[str, Any]]:
              indegree = dep["indegree"]
              outdegree = dep["outdegree"]
              reachable = set(dep["reachable"])
              unresolved_by_source = Counter(item["source"] for item in dep["unresolved"])
              todos = dep["todos"]
              degrees = [indegree.get(e.path, 0) + outdegree.get(e.path, 0) for e in entries if e.category == "source"]
              degree_threshold = float(np.median(degrees)) if degrees else 0.0
              churn_values = [churn.get(e.path, 0) for e in entries]
              churn_threshold = float(np.median([x for x in churn_values if x > 0])) if any(churn_values) else 0.0
              metrics: dict[str, dict[str, Any]] = {}
              for entry in entries:
                  degree = indegree.get(entry.path, 0) + outdegree.get(entry.path, 0)
                  risk_score = unresolved_by_source.get(entry.path, 0) * 3 + todos.get(entry.path, 0) + min(churn.get(entry.path, 0), 8)
                  runtime = entry.path in reachable
                  executable = entry.category in {"source", "config"}
                  central = degree > degree_threshold and degree > 0
                  mutable = risk_score > 0 or (churn_threshold > 0 and churn.get(entry.path, 0) >= churn_threshold)
                  semantic_vertex = (int(executable) << 3) | (int(runtime) << 2) | (int(central) << 1) | int(mutable)
                  metrics[entry.path] = {
                      "degree": degree,
                      "indegree": indegree.get(entry.path, 0),
                      "outdegree": outdegree.get(entry.path, 0),
                      "reachable": runtime,
                      "risk": risk_score,
                      "churn": churn.get(entry.path, 0),
                      "semantic_vertex": semantic_vertex,
                      "bits": [int(executable), int(runtime), int(central), int(mutable)],
                  }
              return metrics
          
          
          def fwht(values: Sequence[float]) -> list[float]:
              a = np.asarray(values, dtype=np.float64).copy()
              h = 1
              while h < len(a):
                  for i in range(0, len(a), h * 2):
                      x = a[i:i+h].copy()
                      y = a[i+h:i+2*h].copy()
                      a[i:i+h] = x + y
                      a[i+h:i+2*h] = x - y
                  h *= 2
              return (a / math.sqrt(len(a))).tolist()
          
          
          def tesseract_sections(entries: Sequence[Entry], metrics: dict[str, dict[str, Any]]) -> dict[str, Any]:
              cell_counts = [0] * 16
              cell_bytes = [0] * 16
              cell_risk = [0.0] * 16
              for e in entries:
                  v = metrics[e.path]["semantic_vertex"]
                  cell_counts[v] += 1
                  cell_bytes[v] += e.size
                  cell_risk[v] += metrics[e.path]["risk"]
              edges = []
              for a in range(16):
                  for b in range(a + 1, 16):
                      if (a ^ b).bit_count() == 1:
                          edges.append({"a": a, "b": b, "count_gradient": cell_counts[a] - cell_counts[b], "byte_gradient": cell_bytes[a] - cell_bytes[b]})
              faces = []
              for axis_a in range(4):
                  for axis_b in range(axis_a + 1, 4):
                      for va in (0, 1):
                          for vb in (0, 1):
                              cells = [v for v in range(16) if ((v >> (3-axis_a)) & 1) == va and ((v >> (3-axis_b)) & 1) == vb]
                              faces.append({"axes": [axis_a, axis_b], "values": [va, vb], "cells": cells, "files": sum(cell_counts[v] for v in cells), "bytes": sum(cell_bytes[v] for v in cells)})
              slices = []
              for axis in range(4):
                  for value in (0, 1):
                      cells = [v for v in range(16) if ((v >> (3-axis)) & 1) == value]
                      slices.append({"axis": axis, "value": value, "cells": cells, "files": sum(cell_counts[v] for v in cells), "bytes": sum(cell_bytes[v] for v in cells)})
              return {
                  "axis_names": ["executable", "runtime_reachable", "dependency_central", "mutable_or_risky"],
                  "data_cells": list(DATA_CELLS),
                  "parity_cells": list(PARITY_CELLS),
                  "cell_counts": cell_counts,
                  "cell_bytes": cell_bytes,
                  "cell_risk": cell_risk,
                  "edges": edges,
                  "faces": faces,
                  "slices": slices,
                  "walsh_counts": fwht(cell_counts),
                  "walsh_log_bytes": fwht([math.log2(x + 1) for x in cell_bytes]),
                  "walsh_risk": fwht(cell_risk),
              }
          
          
          def manifest_entry(e: Entry, metrics: dict[str, dict[str, Any]]) -> dict[str, Any]:
              return {
                  "path": e.path,
                  "kind": e.kind,
                  "mode": e.mode,
                  "size": e.size,
                  "sha256": e.digest,
                  "chunks": e.chunks,
                  "target": e.target,
                  "category": e.category,
                  "metrics": metrics[e.path],
              }
          
          
          def build_container(entries: Sequence[Entry], chunks: dict[str, Chunk], metadata: dict[str, Any], decoder_source: str) -> tuple[bytes, dict[str, Any]]:
              needed = sorted({digest for e in entries for digest in e.chunks})
              records = bytearray()
              chunk_index: dict[str, Any] = {}
              record_header = struct.Struct(">32sBQQ")
              for digest in needed:
                  chunk = chunks[digest]
                  offset = len(records)
                  records += record_header.pack(bytes.fromhex(digest), chunk.codec, chunk.raw_len, len(chunk.stored))
                  records += chunk.stored
                  chunk_index[digest] = {
                      "offset": offset,
                      "raw_len": chunk.raw_len,
                      "stored_len": len(chunk.stored),
                      "codec": chunk.codec,
                  }
              manifest = {
                  "format": "DREAM-HYPERATLAS-CONTAINER",
                  "version": VERSION,
                  "model_revision": MODEL_REVISION,
                  "created_unix": int(time.time()),
                  "entries": metadata["entry_records"],
                  "metadata": {k: v for k, v in metadata.items() if k != "entry_records"},
                  "decoder_source_utf8": decoder_source,
                  "format_contract": {
                      "container_header": ">8sIIQQQQ32s32s32s32s",
                      "chunk_record_header": ">32sBQQ",
                      "pixel_embedding": "one payload byte per RGB pixel: R[2:0]=b[7:5], G[2:0]=b[4:2], B[1:0]=b[1:0]",
                      "spatial_code": "systematic RS(16,12) over GF(256), physical vertices DATA_CELLS and PARITY_CELLS",
                  },
              }
              manifest_blob = canonical_json(manifest)
              index_blob = canonical_json(chunk_index)
              records_blob = bytes(records)
              root = hashlib.sha256(manifest_blob + index_blob + records_blob).digest()
              header = CONTAINER_HEADER.pack(
                  CONTAINER_MAGIC, VERSION, 0,
                  len(manifest_blob), len(index_blob), len(records_blob),
                  CONTAINER_HEADER.size + len(manifest_blob) + len(index_blob) + len(records_blob),
                  hashlib.sha256(manifest_blob).digest(),
                  hashlib.sha256(index_blob).digest(),
                  hashlib.sha256(records_blob).digest(),
                  root,
              )
              container = header + manifest_blob + index_blob + records_blob
              return container, {"root_sha256": root.hex(), "manifest": manifest, "chunk_index": chunk_index}
          
          
          def parse_container(container: bytes) -> tuple[dict[str, Any], dict[str, Any], memoryview]:
              if len(container) < CONTAINER_HEADER.size:
                  raise ValueError("container is truncated")
              unpacked = CONTAINER_HEADER.unpack(container[:CONTAINER_HEADER.size])
              magic, version, _flags, manifest_len, index_len, records_len, total_len, manifest_sha, index_sha, records_sha, root = unpacked
              if magic != CONTAINER_MAGIC or version != VERSION:
                  raise ValueError("unsupported DREAM HyperAtlas container")
              if total_len != len(container):
                  raise ValueError(f"container length mismatch: expected {total_len}, got {len(container)}")
              pos = CONTAINER_HEADER.size
              manifest_blob = container[pos:pos+manifest_len]; pos += manifest_len
              index_blob = container[pos:pos+index_len]; pos += index_len
              records = memoryview(container)[pos:pos+records_len]
              if hashlib.sha256(manifest_blob).digest() != manifest_sha:
                  raise ValueError("manifest digest mismatch")
              if hashlib.sha256(index_blob).digest() != index_sha:
                  raise ValueError("chunk index digest mismatch")
              if hashlib.sha256(records).digest() != records_sha:
                  raise ValueError("records digest mismatch")
              if hashlib.sha256(manifest_blob + index_blob + records).digest() != root:
                  raise ValueError("container root mismatch")
              return json.loads(manifest_blob), json.loads(index_blob), records
          
          
          def chunk_from_records(digest: str, index: dict[str, Any], records: memoryview) -> bytes:
              info = index[digest]
              offset = int(info["offset"])
              record_header = struct.Struct(">32sBQQ")
              digest_raw, codec, raw_len, stored_len = record_header.unpack(records[offset:offset+record_header.size])
              if digest_raw.hex() != digest:
                  raise ValueError(f"chunk record digest identity mismatch for {digest}")
              start = offset + record_header.size
              stored = bytes(records[start:start+stored_len])
              raw = decompress_chunk(codec, stored, raw_len)
              if sha256(raw) != digest:
                  raise ValueError(f"chunk content digest mismatch for {digest}")
              return raw
          
          
          def restore_container(container: bytes, output: Path, selected: set[str] | None = None) -> dict[str, Any]:
              manifest, index, records = parse_container(container)
              output.mkdir(parents=True, exist_ok=True)
              restored = 0
              for entry in manifest["entries"]:
                  rel = safe_rel(entry["path"])
                  if selected is not None and rel not in selected:
                      continue
                  dest = output / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  root_resolved = output.resolve()
                  if root_resolved not in dest.parent.resolve().parents and dest.parent.resolve() != root_resolved:
                      raise ValueError(f"path traversal rejected: {rel}")
                  if entry["kind"] == "symlink":
                      if dest.exists() or dest.is_symlink():
                          dest.unlink()
                      os.symlink(entry["target"], dest)
                  else:
                      with dest.open("wb") as fh:
                          for digest in entry["chunks"]:
                              fh.write(chunk_from_records(digest, index, records))
                      if dest.stat().st_size != entry["size"] or sha256(dest.read_bytes()) != entry["sha256"]:
                          raise ValueError(f"restored file mismatch: {rel}")
                      os.chmod(dest, int(entry["mode"]))
                  restored += 1
              return {"restored_entries": restored, "root_sha256": manifest["metadata"]["repository_root_sha256"]}
          
          
          # GF(256), primitive polynomial 0x11D.
          GF_EXP = np.zeros(512, dtype=np.uint8)
          GF_LOG = np.zeros(256, dtype=np.int16)
          x = 1
          for i in range(255):
              GF_EXP[i] = x
              GF_LOG[x] = i
              x <<= 1
              if x & 0x100:
                  x ^= 0x11D
          for i in range(255, 512):
              GF_EXP[i] = GF_EXP[i - 255]
          GF_MUL = np.zeros((256, 256), dtype=np.uint8)
          for a in range(1, 256):
              for b in range(1, 256):
                  GF_MUL[a, b] = GF_EXP[int(GF_LOG[a]) + int(GF_LOG[b])]
          
          
          def gf_inv(a: int) -> int:
              if a == 0:
                  raise ZeroDivisionError("GF inverse of zero")
              return int(GF_EXP[255 - int(GF_LOG[a])])
          
          
          def gf_matrix_inverse(matrix: np.ndarray) -> np.ndarray:
              n = matrix.shape[0]
              aug = np.concatenate([matrix.astype(np.uint8).copy(), np.eye(n, dtype=np.uint8)], axis=1)
              for col in range(n):
                  pivot = next((row for row in range(col, n) if aug[row, col] != 0), None)
                  if pivot is None:
                      raise ValueError("singular GF(256) matrix")
                  if pivot != col:
                      aug[[col, pivot]] = aug[[pivot, col]]
                  inv = gf_inv(int(aug[col, col]))
                  aug[col] = GF_MUL[inv, aug[col]]
                  for row in range(n):
                      if row == col:
                          continue
                      factor = int(aug[row, col])
                      if factor:
                          aug[row] ^= GF_MUL[factor, aug[col]]
              return aug[:, n:]
          
          
          def generator_matrix() -> np.ndarray:
              matrix = np.zeros((N_CELLS, K_DATA), dtype=np.uint8)
              for data_index, cell in enumerate(DATA_CELLS):
                  matrix[cell, data_index] = 1
              # Cauchy parity rows guarantee every 12-row submatrix is invertible.
              xs = [1, 2, 3, 4]
              ys = [32 + i for i in range(K_DATA)]
              for parity_index, cell in enumerate(PARITY_CELLS):
                  for j in range(K_DATA):
                      matrix[cell, j] = gf_inv(xs[parity_index] ^ ys[j])
              return matrix
          
          GENERATOR = generator_matrix()
          
          
          def rs_encode(payload: bytes) -> tuple[list[bytes], int]:
              stream_len = math.ceil(len(payload) / K_DATA)
              padded = payload + b"\0" * (stream_len * K_DATA - len(payload))
              data = [padded[i*stream_len:(i+1)*stream_len] for i in range(K_DATA)]
              streams: list[bytes] = [b""] * N_CELLS
              for data_index, cell in enumerate(DATA_CELLS):
                  streams[cell] = data[data_index]
              arrays = np.stack([np.frombuffer(s, dtype=np.uint8) for s in data])
              for cell in PARITY_CELLS:
                  row = GENERATOR[cell]
                  result = np.zeros(stream_len, dtype=np.uint8)
                  for j, coefficient in enumerate(row):
                      if coefficient:
                          result ^= GF_MUL[int(coefficient), arrays[j]]
                  streams[cell] = result.tobytes()
              return streams, stream_len
          
          
          def rs_decode(available: dict[int, bytes], payload_len: int, stream_len: int) -> bytes:
              if len(available) < K_DATA:
                  raise ValueError(f"need {K_DATA} valid cells, only {len(available)} available")
              selected = sorted(available)[:K_DATA]
              matrix = GENERATOR[selected]
              inverse = gf_matrix_inverse(matrix)
              observed = np.stack([np.frombuffer(available[cell], dtype=np.uint8, count=stream_len) for cell in selected])
              data_arrays = []
              for row in inverse:
                  result = np.zeros(stream_len, dtype=np.uint8)
                  for j, coefficient in enumerate(row):
                      if coefficient:
                          result ^= GF_MUL[int(coefficient), observed[j]]
                  data_arrays.append(result)
              payload = b"".join(arr.tobytes() for arr in data_arrays)
              return payload[:payload_len]
          
          
          def cell_bits(cell: int) -> str:
              return format(cell, "04b")
          
          
          def semantic_cell_groups(entries: Sequence[Entry], metrics: dict[str, dict[str, Any]]) -> dict[int, list[Entry]]:
              groups: dict[int, list[Entry]] = {i: [] for i in range(16)}
              for entry in entries:
                  groups[metrics[entry.path]["semantic_vertex"]].append(entry)
              for values in groups.values():
                  values.sort(key=lambda e: (-e.size, e.path))
              return groups
          
          
          def binary_treemap(items: Sequence[tuple[Any, float]], rect: tuple[int, int, int, int]) -> list[tuple[Any, tuple[int, int, int, int]]]:
              if not items:
                  return []
              x0, y0, x1, y1 = rect
              if len(items) == 1 or x1 - x0 <= 2 or y1 - y0 <= 2:
                  return [(items[0][0], rect)]
              total = sum(max(w, 1e-9) for _, w in items)
              acc = 0.0
              split = 1
              for i, (_, weight) in enumerate(items[:-1], 1):
                  acc += max(weight, 1e-9)
                  if acc >= total / 2:
                      split = i
                      break
              first, second = items[:split], items[split:]
              fraction = sum(max(w, 1e-9) for _, w in first) / total
              if (x1 - x0) >= (y1 - y0):
                  xm = max(x0 + 1, min(x1 - 1, round(x0 + (x1 - x0) * fraction)))
                  return binary_treemap(first, (x0, y0, xm, y1)) + binary_treemap(second, (xm, y0, x1, y1))
              ym = max(y0 + 1, min(y1 - 1, round(y0 + (y1 - y0) * fraction)))
              return binary_treemap(first, (x0, y0, x1, ym)) + binary_treemap(second, (x0, ym, x1, y1))
          
          
          def adjusted_color(category: str, risk: float, degree: float, parity: bool = False) -> tuple[int, int, int]:
              if parity:
                  base = (104, 84, 255)
              else:
                  base = PALETTE.get(category, PALETTE["other"])
              boost = min(35, int(math.log2(degree + 1) * 8))
              danger = min(90, int(math.log2(risk + 1) * 22))
              r = min(255, base[0] + danger + boost // 3)
              g = max(18, min(255, base[1] + boost - danger // 2))
              b = max(18, min(255, base[2] + boost - danger // 3))
              return r, g, b
          
          
          def draw_treemap(draw: ImageDraw.ImageDraw, rect: tuple[int, int, int, int], entries: Sequence[Entry], metrics: dict[str, dict[str, Any]], font_scale: float = 1.0) -> None:
              if not entries:
                  x0, y0, x1, y1 = rect
                  draw.rectangle(rect, fill=(20, 27, 45), outline=PALETTE["grid"], width=2)
                  draw.line((x0, y0, x1, y1), fill=(51, 61, 87), width=2)
                  draw.line((x1, y0, x0, y1), fill=(51, 61, 87), width=2)
                  return
              grouped: dict[str, list[Entry]] = defaultdict(list)
              for e in entries:
                  grouped[top_component(e.path)].append(e)
              group_items = [(name, sum(max(e.size, 64) for e in values)) for name, values in grouped.items()]
              group_items.sort(key=lambda x: (-x[1], x[0]))
              group_rects = binary_treemap(group_items, rect)
              group_font = load_font(max(9, int(13 * font_scale)), bold=True)
              file_font = load_font(max(8, int(10 * font_scale)), mono=True)
              for group_name, grect in group_rects:
                  gx0, gy0, gx1, gy1 = grect
                  if gx1 - gx0 < 2 or gy1 - gy0 < 2:
                      continue
                  draw.rectangle((gx0, gy0, gx1-1, gy1-1), outline=(118, 135, 174), width=max(1, int(font_scale)))
                  header_h = min(max(12, int(18 * font_scale)), max(0, gy1 - gy0 - 1))
                  if gx1 - gx0 > 45 and gy1 - gy0 > 18:
                      draw.rectangle((gx0+1, gy0+1, gx1-2, gy0+header_h), fill=(12, 18, 33))
                      draw.text((gx0+4, gy0+2), group_name[:36], font=group_font, fill=PALETTE["text"])
                  inner = (gx0+2, gy0+header_h+1, gx1-2, gy1-2)
                  if inner[2] <= inner[0] or inner[3] <= inner[1]:
                      continue
                  values = grouped[group_name]
                  file_items = [(e, max(e.size, 64)) for e in values]
                  for entry, frect in binary_treemap(file_items, inner):
                      x0, y0, x1, y1 = frect
                      m = metrics[entry.path]
                      color = adjusted_color(entry.category, m["risk"], m["degree"])
                      draw.rectangle((x0, y0, max(x0, x1-1), max(y0, y1-1)), fill=color, outline=(7, 10, 20), width=1)
                      area = max(0, x1-x0) * max(0, y1-y0)
                      if area > 6500 * font_scale * font_scale and x1-x0 > 70 and y1-y0 > 22:
                          label = PurePosixPath(entry.path).name
                          draw.text((x0+3, y0+2), label[:30], font=file_font, fill=(5, 8, 15))
                          if y1-y0 > 38:
                              draw.text((x0+3, y0+14*font_scale), display_size(entry.size), font=file_font, fill=(18, 25, 42))
          
          
          def render_hyperatlas_base(dimension: int, entries: Sequence[Entry], metrics: dict[str, dict[str, Any]], sections: dict[str, Any], title: str, root_hash: str) -> Image.Image:
              image = Image.new("RGB", (dimension, dimension), PALETTE["background"])
              draw = ImageDraw.Draw(image)
              scale = dimension / 4096.0
              title_font = load_font(max(18, int(32 * scale)), bold=True)
              meta_font = load_font(max(10, int(15 * scale)), mono=True)
              cell_font = load_font(max(10, int(16 * scale)), mono=True, bold=True)
              small_font = load_font(max(8, int(11 * scale)), mono=True)
              cell_w = dimension // 4
              cell_h = dimension // 4
              groups = semantic_cell_groups(entries, metrics)
              axis_names = sections["axis_names"]
              for cell in range(16):
                  col, row = cell % 4, cell // 4
                  x0, y0 = col * cell_w, row * cell_h
                  x1 = dimension if col == 3 else (col + 1) * cell_w
                  y1 = dimension if row == 3 else (row + 1) * cell_h
                  parity = cell in PARITY_CELLS
                  draw.rectangle((x0, y0, x1-1, y1-1), fill=PALETTE["panel"], outline=(111, 133, 184), width=max(2, int(3*scale)))
                  header_h = max(42, int(72 * scale))
                  role = "PARITY / WALSH" if parity else "SYSTEMATIC DATA"
                  draw.rectangle((x0+2, y0+2, x1-3, y0+header_h), fill=(21, 30, 52) if not parity else (42, 30, 80))
                  draw.text((x0+10*scale, y0+7*scale), f"v{cell_bits(cell)} · {role}", font=cell_font, fill=PALETTE["text"])
                  counts = sections["cell_counts"][cell]
                  bytes_ = sections["cell_bytes"][cell]
                  risk = sections["cell_risk"][cell]
                  draw.text((x0+10*scale, y0+30*scale), f"files={counts}  bytes={display_size(bytes_)}  risk={risk:.0f}", font=small_font, fill=PALETTE["muted"])
                  content = (int(x0+6*scale), int(y0+header_h+5*scale), int(x1-6*scale), int(y1-6*scale))
                  if parity:
                      draw.rectangle(content, fill=(23, 17, 47), outline=(124, 98, 232), width=max(1, int(2*scale)))
                      cx = (content[0] + content[2]) // 2
                      cy = (content[1] + content[3]) // 2
                      radius = min(content[2]-content[0], content[3]-content[1]) // 3
                      for ring in range(1, 6):
                          r = radius * ring / 5
                          draw.ellipse((cx-r, cy-r, cx+r, cy+r), outline=(70+ring*18, 50+ring*12, 140+ring*16), width=max(1, int(scale)))
                      walsh = sections["walsh_counts"]
                      for i, value in enumerate(walsh):
                          angle = 2*math.pi*i/16 - math.pi/2
                          magnitude = min(1.0, abs(value)/(max(abs(x) for x in walsh) or 1))
                          px = cx + math.cos(angle)*radius*magnitude
                          py = cy + math.sin(angle)*radius*magnitude
                          draw.line((cx, cy, px, py), fill=(185, 149, 255), width=max(1, int(3*scale)))
                      draw.text((content[0]+8*scale, content[1]+8*scale), "4D section parity\nedge/face/slice constraints\nRS(16,12) repair vertex", font=meta_font, fill=(221, 208, 255))
                      if groups[cell]:
                          lower = (content[0]+6, (content[1]+content[3])//2, content[2]-6, content[3]-6)
                          draw_treemap(draw, lower, groups[cell], metrics, max(0.55, scale*0.72))
                  else:
                      draw_treemap(draw, content, groups[cell], metrics, max(0.65, scale))
              # Draw global title over a quantized translucent-like opaque strip.
              banner_h = max(54, int(90*scale))
              draw.rectangle((0, 0, dimension, banner_h), fill=(5, 9, 18), outline=(131, 158, 220), width=max(2, int(3*scale)))
              draw.text((18*scale, 10*scale), title, font=title_font, fill=PALETTE["text"])
              draw.text((18*scale, 52*scale), f"root={root_hash[:32]}  files={len(entries)}  exact-byte recovery + 4-vertex spatial erasure tolerance", font=meta_font, fill=PALETTE["muted"])
              legend_y = dimension - max(34, int(54*scale))
              draw.rectangle((0, legend_y, dimension, dimension), fill=(5, 9, 18))
              x = int(15*scale)
              for key in ("source", "config", "docs", "image", "audio", "model", "font", "binary", "other"):
                  draw.rectangle((x, legend_y+12*scale, x+18*scale, legend_y+30*scale), fill=PALETTE[key])
                  draw.text((x+24*scale, legend_y+10*scale), key, font=small_font, fill=PALETTE["text"])
                  x += int((70 + len(key)*7)*scale)
              return image
          
          
          def make_cell_header(cell: int, width: int, height: int, stream: bytes, payload: bytes, root_hash: str, role: str) -> bytes:
              packed = CELL_HEADER.pack(
                  CELL_MAGIC, VERSION, cell, K_DATA, width, height,
                  len(stream), len(payload), hashlib.sha256(stream).digest(), hashlib.sha256(payload).digest(),
                  bytes.fromhex(root_hash), binascii.crc32(stream) & 0xFFFFFFFF,
              )
              role_blob = role.encode("utf-8")[:64]
              meta = canonical_json({"role": role, "model_revision": MODEL_REVISION, "bits": cell_bits(cell)})
              blob = packed + struct.pack(">H", len(role_blob)) + role_blob + struct.pack(">H", len(meta)) + meta
              if len(blob) > CELL_HEADER_SIZE:
                  raise ValueError("cell header overflow")
              return blob + b"\0" * (CELL_HEADER_SIZE - len(blob))
          
          
          def parse_cell_header(raw: bytes) -> dict[str, Any]:
              if len(raw) < CELL_HEADER_SIZE:
                  raise ValueError("cell header truncated")
              unpacked = CELL_HEADER.unpack(raw[:CELL_HEADER.size])
              magic, version, cell, k, width, height, stream_len, payload_len, stream_sha, payload_sha, root, crc = unpacked
              if magic != CELL_MAGIC or version != VERSION or k != K_DATA:
                  raise ValueError("invalid cell header")
              return {
                  "cell": cell, "width": width, "height": height, "stream_len": stream_len,
                  "payload_len": payload_len, "stream_sha": stream_sha, "payload_sha": payload_sha,
                  "root": root.hex(), "crc32": crc,
              }
          
          
          def embed_stream_in_array(array: np.ndarray, cell: int, stream_blob: bytes) -> None:
              h, w, _ = array.shape
              cell_w, cell_h = w // 4, h // 4
              col, row = cell % 4, cell // 4
              x0, y0 = col * cell_w, row * cell_h
              x1 = w if col == 3 else (col + 1) * cell_w
              y1 = h if row == 3 else (row + 1) * cell_h
              region_shape = (y1 - y0, x1 - x0, 3)
              region = array[y0:y1, x0:x1, :].copy().reshape(-1, 3)
              if len(stream_blob) > len(region):
                  raise ValueError(f"cell {cell} capacity {len(region)} is below stream {len(stream_blob)}")
              values = np.frombuffer(stream_blob, dtype=np.uint8)
              target = region[:len(values)]
              target[:, 0] = (target[:, 0] & 0xF8) | (values >> 5)
              target[:, 1] = (target[:, 1] & 0xF8) | ((values >> 2) & 0x07)
              target[:, 2] = (target[:, 2] & 0xFC) | (values & 0x03)
              array[y0:y1, x0:x1, :] = region.reshape(region_shape)
          
          
          def extract_stream_from_region(array: np.ndarray, cell: int) -> bytes:
              h, w, _ = array.shape
              cell_w, cell_h = w // 4, h // 4
              col, row = cell % 4, cell // 4
              x0, y0 = col * cell_w, row * cell_h
              x1 = w if col == 3 else (col + 1) * cell_w
              y1 = h if row == 3 else (row + 1) * cell_h
              region = array[y0:y1, x0:x1, :].reshape(-1, 3)
              values = ((region[:, 0] & 0x07) << 5) | ((region[:, 1] & 0x07) << 2) | (region[:, 2] & 0x03)
              return values.astype(np.uint8).tobytes()
          
          
          def choose_dimension(payload_len: int, maximum: int, minimum: int = 3072) -> int:
              stream_len = math.ceil(payload_len / K_DATA)
              per_cell = stream_len + CELL_HEADER_SIZE
              cell_side = math.ceil(math.sqrt(per_cell))
              dimension = max(minimum, cell_side * 4)
              dimension = math.ceil(dimension / 64) * 64
              if dimension > maximum:
                  needed = dimension
                  raise ValueError(f"payload requires approximately {needed}x{needed}; configured maximum is {maximum}")
              return dimension
          
          
          def write_capsule_image(container: bytes, output: Path, maximum: int, entries: Sequence[Entry], metrics: dict[str, dict[str, Any]], sections: dict[str, Any], title: str, root_hash: str) -> dict[str, Any]:
              streams, stream_len = rs_encode(container)
              dimension = choose_dimension(len(container), maximum)
              base = render_hyperatlas_base(dimension, entries, metrics, sections, title, root_hash)
              array = np.array(base, dtype=np.uint8)
              for cell in range(16):
                  role = "systematic" if cell in DATA_CELLS else "parity"
                  header = make_cell_header(cell, dimension, dimension, streams[cell], container, root_hash, role)
                  embed_stream_in_array(array, cell, header + streams[cell])
              Image.fromarray(array, mode="RGB").save(output, format="PNG", optimize=False, compress_level=6)
              return {"path": output.name, "dimension": dimension, "payload_bytes": len(container), "stream_bytes": stream_len, "sha256": sha256(output.read_bytes())}
          
          
          def read_capsule_image(path: Path, damaged_cells: set[int] | None = None) -> tuple[bytes, dict[str, Any]]:
              damaged_cells = damaged_cells or set()
              image = Image.open(path).convert("RGB")
              array = np.array(image, dtype=np.uint8)
              available: dict[int, bytes] = {}
              headers: dict[int, dict[str, Any]] = {}
              for cell in range(16):
                  if cell in damaged_cells:
                      continue
                  raw = extract_stream_from_region(array, cell)
                  try:
                      header = parse_cell_header(raw[:CELL_HEADER_SIZE])
                      if header["cell"] != cell or header["width"] != image.width or header["height"] != image.height:
                          continue
                      stream = raw[CELL_HEADER_SIZE:CELL_HEADER_SIZE+header["stream_len"]]
                      if hashlib.sha256(stream).digest() != header["stream_sha"]:
                          continue
                      if (binascii.crc32(stream) & 0xFFFFFFFF) != header["crc32"]:
                          continue
                      available[cell] = stream
                      headers[cell] = header
                  except Exception:
                      continue
              if len(available) < K_DATA:
                  raise ValueError(f"capsule has only {len(available)} valid spatial cells")
              reference = headers[sorted(headers)[0]]
              for header in headers.values():
                  if header["payload_len"] != reference["payload_len"] or header["payload_sha"] != reference["payload_sha"] or header["root"] != reference["root"]:
                      raise ValueError("mixed or inconsistent spatial cells")
              stream_len = len(next(iter(available.values())))
              payload = rs_decode(available, reference["payload_len"], stream_len)
              if hashlib.sha256(payload).digest() != reference["payload_sha"]:
                  raise ValueError("recovered payload digest mismatch")
              return payload, {"valid_cells": sorted(available), "recovered_cells": sorted(set(range(16)) - set(available)), "root": reference["root"]}
          
          
          def write_atlas_cell_images(container: bytes, output_dir: Path, maximum: int, entries: Sequence[Entry], metrics: dict[str, dict[str, Any]], sections: dict[str, Any], root_hash: str) -> list[dict[str, Any]]:
              output_dir.mkdir(parents=True, exist_ok=True)
              streams, stream_len = rs_encode(container)
              dimension = max(2048, math.ceil(math.sqrt(stream_len + CELL_HEADER_SIZE)))
              dimension = math.ceil(dimension / 64) * 64
              if dimension > maximum:
                  raise ValueError(f"atlas cell requires {dimension}x{dimension}; maximum is {maximum}")
              groups = semantic_cell_groups(entries, metrics)
