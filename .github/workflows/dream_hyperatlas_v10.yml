          def repository_root(entries: Sequence[Entry]) -> str:
              h=hashlib.sha256()
              for e in sorted(entries,key=lambda x:x.path):
                  h.update(canonical_json({"path":e.path,"kind":e.kind,"mode":e.mode,"size":e.size,"sha256":e.digest,"target":e.target}))
                  h.update(b"\n")
              return h.hexdigest()
          
          
          def compare_restored(entries: Sequence[Entry], root: Path, restored: Path) -> list[dict[str, Any]]:
              failures=[]
              for e in entries:
                  target=restored/e.path
                  if e.kind=="symlink":
                      if not target.is_symlink() or os.readlink(target)!=e.target:
                          failures.append({"path":e.path,"reason":"symlink mismatch"})
                  else:
                      if not target.is_file():
                          failures.append({"path":e.path,"reason":"missing"}); continue
                      if target.stat().st_size!=e.size or sha256(target.read_bytes())!=e.digest:
                          failures.append({"path":e.path,"reason":"content mismatch"})
                      if stat.S_IMODE(target.stat().st_mode)!=e.mode:
                          failures.append({"path":e.path,"reason":"mode mismatch"})
              return failures
          
          
          def build_command(args: argparse.Namespace) -> None:
              root=Path(args.root).resolve(); output=Path(args.output).resolve()
              if output.exists(): shutil.rmtree(output)
              (output/"Images"/"AtlasCells").mkdir(parents=True)
              (output/"Decoder").mkdir(parents=True)
              (output/"Manifests").mkdir(parents=True)
              (output/"Diagnostics").mkdir(parents=True)
              paths=tracked_paths(root)
              entries,chunks,secrets=capture_tree(root,paths)
              churn=recent_churn(root)
              dep=dependency_analysis(root,entries)
              metrics=feature_metrics(entries,dep,churn)
              sections=tesseract_sections(entries,metrics)
              root_hash=repository_root(entries)
              decoder_source=Path(__file__).read_text(encoding="utf-8")
              entry_records=[manifest_entry(e,metrics) for e in entries]
              duplicate_raw=sum(chunks[d].raw_len for e in entries for d in e.chunks)-sum(c.raw_len for c in chunks.values())
              metadata={
                  "repository_root_sha256":root_hash,
                  "entry_records":entry_records,
                  "captured_entries":len(entries),
                  "captured_bytes":sum(e.size for e in entries),
                  "unique_chunks":len(chunks),
                  "deduplicated_bytes":max(0,duplicate_raw),
                  "dependency_summary":{
                      "edges":sum(len(v) for v in dep["graph"].values()),"roots":dep["roots"],"reachable_count":len(dep["reachable"]),
                      "unresolved":dep["unresolved"],"cycles":dep["cycles"],"aliases":dep["aliases"],
                  },
                  "tesseract_sections":sections,
                  "secret_findings":secrets,
                  "exclusions":"gitignored files and standard generated/cache directories are excluded by git ls-files or fallback policy",
              }
              container,parsed=build_container(entries,chunks,metadata,decoder_source)
              capsule_info=write_capsule_image(container,output/"Images"/"DREAM_COMPLETE_REPOSITORY_CAPSULE.png",args.capsule_max,entries,metrics,sections,"DREAM COMPLETE REPOSITORY CAPSULE",root_hash)
              atlas_info=write_atlas_cell_images(container,output/"Images"/"AtlasCells",args.atlas_max,entries,metrics,sections,root_hash)
              dependency_info=render_dependency_field(output/"Images"/"DREAM_DEPENDENCY_NORMAL_FIELD.png",entries,dep,metrics,root_hash)
              tesseract_info=render_tesseract_sections(output/"Images"/"DREAM_TESSERACT_SECTION_OPERATOR.png",sections,root_hash)
              change_info=render_change_field(output/"Images"/"DREAM_CHANGE_RISK_FIELD.png",entries,metrics,root_hash)
              write_interactive_svg(output/"Images"/"DREAM_INTERACTIVE_REPOSITORY_MAP.svg",entries,metrics,root_hash)
              shutil.copy2(__file__,output/"Decoder"/"dream_hyperatlas.py")
              (output/"Manifests"/"HYPERATLAS_ANALYSIS.json").write_text(json.dumps({
                  "model_revision":MODEL_REVISION,"repository_root_sha256":root_hash,"files":entry_records,
                  "dependency":dep,"tesseract":sections,"secrets":secrets,
              },indent=2,sort_keys=True),encoding="utf-8")
              summary={
                  "model_revision":MODEL_REVISION,"repository_root_sha256":root_hash,"captured_entries":len(entries),
                  "captured_bytes":sum(e.size for e in entries),"unique_chunks":len(chunks),"container_bytes":len(container),
                  "capsule":capsule_info,"atlas_cells":atlas_info,"dependency_field":dependency_info,
                  "tesseract_field":tesseract_info,"change_field":change_info,
                  "recovery_contract":"DREAM_COMPLETE_REPOSITORY_CAPSULE.png alone reconstructs the complete captured tree; any 12 of 16 atlas cell PNGs also reconstruct it.",
              }
              (output/"Manifests"/"HYPERATLAS_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True),encoding="utf-8")
              spec=f"""# DREAM HyperAtlas v{VERSION} format contract
          
          The PNGs are simultaneously visual repository maps and authenticated recovery media.
          Each payload byte is embedded in the RGB low bit-planes while the high bit-planes remain a legible semantic visualization.
          The mandatory capsule divides its canvas into the 16 vertices of a 4D hypercube. Twelve vertices are systematic streams and four are Cauchy Reed-Solomon parity streams over GF(256). Any twelve valid spatial vertices recover the complete container.
          
          Repository root: `{root_hash}`
          Container magic: `{CONTAINER_MAGIC.decode()}`
          Cell magic: `{CELL_MAGIC.decode()}`
          Data vertices: `{DATA_CELLS}`
          Parity vertices: `{PARITY_CELLS}`
          Pixel mapping: `R[2:0]=byte[7:5], G[2:0]=byte[4:2], B[1:0]=byte[1:0]`
          
          Commands:
          
          ```bash
          python Decoder/dream_hyperatlas.py decode-capsule Images/DREAM_COMPLETE_REPOSITORY_CAPSULE.png restored
          python Decoder/dream_hyperatlas.py decode-atlas Images/AtlasCells restored
          python Decoder/dream_hyperatlas.py inspect Images/DREAM_COMPLETE_REPOSITORY_CAPSULE.png
          ```
          """
              (output/"Manifests"/"FORMAT_SPEC.md").write_text(spec,encoding="utf-8")
          
              # Mandatory exact validation from the image, then 4-vertex erasure validation.
              validation_root=output/".validation"
              decoded,proof=read_capsule_image(output/"Images"/"DREAM_COMPLETE_REPOSITORY_CAPSULE.png")
              restore_container(decoded,validation_root/"capsule")
              failures=compare_restored(entries,root,validation_root/"capsule")
              if failures: raise RuntimeError(f"capsule round-trip failures: {failures[:10]}")
              damaged=set(PARITY_CELLS)  # remove all four parity vertices: systematic path must remain exact
              decoded2,proof2=read_capsule_image(output/"Images"/"DREAM_COMPLETE_REPOSITORY_CAPSULE.png",damaged_cells=damaged)
              if decoded2!=container: raise RuntimeError("four-vertex capsule erasure recovery mismatch")
              # Remove four systematic vertices and force parity reconstruction.
              damaged_data=set(DATA_CELLS[:4])
              decoded3,proof3=read_capsule_image(output/"Images"/"DREAM_COMPLETE_REPOSITORY_CAPSULE.png",damaged_cells=damaged_data)
              if decoded3!=container: raise RuntimeError("four-data-vertex parity recovery mismatch")
              atlas_subset=output/".atlas_subset"; atlas_subset.mkdir()
              omitted=set(DATA_CELLS[-4:])
              for item in atlas_info:
                  if item["cell"] not in omitted:
                      shutil.copy2(output/"Images"/"AtlasCells"/item["path"],atlas_subset/item["path"])
              decoded4,proof4=read_atlas_directory(atlas_subset)
              if decoded4!=container: raise RuntimeError("four-image atlas erasure recovery mismatch")
              # Pixel mutation must be detected at cell level and repaired from remaining vertices.
              mutated=output/".mutated.png"; shutil.copy2(output/"Images"/"DREAM_COMPLETE_REPOSITORY_CAPSULE.png",mutated)
              img=Image.open(mutated).convert("RGB"); arr=np.array(img,dtype=np.uint8); arr[img.height//8,img.width//8,0]^=1; Image.fromarray(arr).save(mutated,format="PNG",compress_level=6)
              decoded5,proof5=read_capsule_image(mutated)
              if decoded5!=container: raise RuntimeError("pixel mutation repair mismatch")
              recovery={
                  "exact_tree_round_trip":True,"capsule_valid_cells":proof["valid_cells"],
                  "four_parity_vertices_removed":proof2,"four_systematic_vertices_recovered":proof3,
                  "four_atlas_images_recovered":proof4,"single_pixel_corruption_localised_and_repaired":proof5,
                  "file_failures":failures,
              }
              (output/"Diagnostics"/"RECOVERY_PROOF.json").write_text(json.dumps(recovery,indent=2,sort_keys=True),encoding="utf-8")
              shutil.rmtree(validation_root); shutil.rmtree(atlas_subset); mutated.unlink()
              print(json.dumps(summary,indent=2),flush=True)
          
          
          def decode_capsule_command(args: argparse.Namespace) -> None:
              payload,proof=read_capsule_image(Path(args.image),set(args.damaged_cell or []))
              result=restore_container(payload,Path(args.output))
              print(json.dumps({**result,**proof},indent=2))
          
          
          def decode_atlas_command(args: argparse.Namespace) -> None:
              payload,proof=read_atlas_directory(Path(args.directory))
              result=restore_container(payload,Path(args.output))
              print(json.dumps({**result,**proof},indent=2))
          
          
          def inspect_command(args: argparse.Namespace) -> None:
              p=Path(args.path)
              if p.is_dir(): payload,proof=read_atlas_directory(p)
              else: payload,proof=read_capsule_image(p)
              manifest,index,records=parse_container(payload)
              print(json.dumps({
                  "proof":proof,"format":manifest["format"],"version":manifest["version"],
                  "repository_root_sha256":manifest["metadata"]["repository_root_sha256"],
                  "entries":len(manifest["entries"]),"chunks":len(index),"container_bytes":len(payload),
                  "captured_bytes":manifest["metadata"]["captured_bytes"],
              },indent=2))
          
          
          def extract_command(args: argparse.Namespace) -> None:
              p=Path(args.path)
              payload,proof=(read_atlas_directory(p) if p.is_dir() else read_capsule_image(p))
              manifest,_,_=parse_container(payload)
              selected=set()
              requested=args.file
              for entry in manifest["entries"]:
                  if entry["path"]==requested or entry["path"].startswith(requested.rstrip("/")+"/"):
                      selected.add(entry["path"])
              if not selected: raise SystemExit(f"no path matched {requested!r}")
              result=restore_container(payload,Path(args.output),selected)
              print(json.dumps({**result,"selected":sorted(selected),**proof},indent=2))
          
          
          def parser() -> argparse.ArgumentParser:
              p=argparse.ArgumentParser(description="DREAM HyperAtlas visual repository recovery system")
              sub=p.add_subparsers(dest="command",required=True)
              b=sub.add_parser("build"); b.add_argument("--root",default="."); b.add_argument("--output",default="dream-hyperatlas-output"); b.add_argument("--capsule-max",type=int,default=16000); b.add_argument("--atlas-max",type=int,default=8000); b.set_defaults(func=build_command)
              d=sub.add_parser("decode-capsule"); d.add_argument("image"); d.add_argument("output"); d.add_argument("--damaged-cell",type=int,action="append"); d.set_defaults(func=decode_capsule_command)
              a=sub.add_parser("decode-atlas"); a.add_argument("directory"); a.add_argument("output"); a.set_defaults(func=decode_atlas_command)
              i=sub.add_parser("inspect"); i.add_argument("path"); i.set_defaults(func=inspect_command)
              e=sub.add_parser("extract"); e.add_argument("path"); e.add_argument("file"); e.add_argument("output"); e.set_defaults(func=extract_command)
              return p
          
          
          def main() -> None:
              args=parser().parse_args(); args.func(args)
          
          if __name__=="__main__":
              main()
          PY
          chmod +x "$HYPERATLAS_SCRIPT"
          python -m py_compile "$HYPERATLAS_SCRIPT"

      - name: Build visual recovery media and execute destructive recovery proofs
        id: hyperatlas
        shell: bash
        env:
          CAPSULE_MAX: ${{ inputs.capsule_max_dimension || '16000' }}
          ATLAS_MAX: ${{ inputs.atlas_cell_max_dimension || '8000' }}
        run: |
          set +e
          mkdir -p "$HYPERATLAS_OUTPUT/Diagnostics"
          started="$(date +%s)"
          python "$HYPERATLAS_SCRIPT" build \
            --root . \
            --output "$HYPERATLAS_OUTPUT" \
            --capsule-max "$CAPSULE_MAX" \
            --atlas-max "$ATLAS_MAX" \
            2>&1 | tee "$HYPERATLAS_OUTPUT/Diagnostics/HYPERATLAS_BUILD.log"
          status=${PIPESTATUS[0]}
          finished="$(date +%s)"
          printf '{"exit_code":%s,"elapsed_seconds":%s}\n' \
            "$status" "$((finished-started))" \
            > "$HYPERATLAS_OUTPUT/Diagnostics/HYPERATLAS_BUILD_STATUS.json"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Set up Node for repository-native checks
        if: ${{ always() && (inputs.run_project_checks == true || github.event_name == 'push') }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Execute repository-native checks with exact status capture
        if: ${{ always() && (inputs.run_project_checks == true || github.event_name == 'push') }}
        id: project_checks
        shell: bash
        run: |
          set +e
          mkdir -p "$HYPERATLAS_OUTPUT/Diagnostics/ProjectChecks"
          checks_dir="$HYPERATLAS_OUTPUT/Diagnostics/ProjectChecks"

          manager="none"
          install_command=""
          if [[ -f pnpm-lock.yaml ]]; then
            manager="pnpm"
            corepack enable
            install_command="pnpm install --frozen-lockfile"
          elif [[ -f yarn.lock ]]; then
            manager="yarn"
            corepack enable
            install_command="yarn install --immutable"
          elif [[ -f bun.lockb || -f bun.lock ]]; then
            manager="bun"
          elif [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            manager="npm"
            install_command="npm ci"
          elif [[ -f package.json ]]; then
            manager="npm"
            install_command="npm install --ignore-scripts"
          fi

          install_status=0
          if [[ "$manager" == "bun" ]]; then
            install_status=90
            printf '%s\n' 'Bun lockfile detected; Bun is not installed by this workflow.' \
              > "$checks_dir/install.stderr.log"
          elif [[ -n "$install_command" ]]; then
            bash -lc "$install_command" \
              > >(tee "$checks_dir/install.stdout.log") \
              2> >(tee "$checks_dir/install.stderr.log" >&2)
            install_status=$?
          else
            printf '%s\n' 'No JavaScript dependency manifest detected.' \
              > "$checks_dir/install.stdout.log"
          fi

          printf '{"manager":"%s","install_exit":%s}\n' \
            "$manager" "$install_status" > "$checks_dir/install.json"

          python - <<'PY'
          import json
          from pathlib import Path
          package = Path("package.json")
          scripts = {}
          if package.exists():
              try:
                  scripts = json.loads(package.read_text(encoding="utf-8")).get("scripts", {})
              except Exception:
                  scripts = {}
          Path("dream-hyperatlas-output/Diagnostics/ProjectChecks/scripts.json").write_text(
              json.dumps(scripts, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY

          run_script() {
            local script_name="$1"
            local status=0
            if ! python - "$script_name" <<'PY'
          import json, sys
          from pathlib import Path
          scripts = json.loads(Path("dream-hyperatlas-output/Diagnostics/ProjectChecks/scripts.json").read_text())
          raise SystemExit(0 if sys.argv[1] in scripts else 1)
          PY
            then
              printf '%s\n' "script '$script_name' is not defined" > "$checks_dir/${script_name}.stdout.log"
              printf '%s' "null" > "$checks_dir/${script_name}.exit"
              return 0
            fi
            case "$manager" in
              pnpm) pnpm run "$script_name" ;;
              yarn) yarn "$script_name" ;;
              npm) npm run "$script_name" ;;
              *) return 0 ;;
            esac \
              > >(tee "$checks_dir/${script_name}.stdout.log") \
              2> >(tee "$checks_dir/${script_name}.stderr.log" >&2)
            status=$?
            printf '%s' "$status" > "$checks_dir/${script_name}.exit"
            return 0
          }

          if [[ "$install_status" -eq 0 ]]; then
            run_script typecheck
            run_script lint
            run_script test
            run_script build
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("dream-hyperatlas-output/Diagnostics/ProjectChecks")
          install = json.loads((root / "install.json").read_text())
          result = {"manager": install["manager"], "install": install["install_exit"], "scripts": {}}
          for name in ("typecheck", "lint", "test", "build"):
              p = root / f"{name}.exit"
              result["scripts"][name] = None if not p.exists() or p.read_text() == "null" else int(p.read_text())
          critical = [x for x in [result["install"], *result["scripts"].values()] if isinstance(x, int) and x != 0]
          result["failed"] = bool(critical)
          (root / "SUMMARY.json").write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY
          failed="$(python -c 'import json; print(str(json.load(open("dream-hyperatlas-output/Diagnostics/ProjectChecks/SUMMARY.json"))["failed"]).lower())')"
          printf 'failed=%s\n' "$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve run identity and decoder source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HYPERATLAS_OUTPUT/Workflow"
          cp "$HYPERATLAS_SCRIPT" "$HYPERATLAS_OUTPUT/Workflow/dream_hyperatlas.py"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "workflow_ref=$GITHUB_WORKFLOW_REF" \
            "repository=$GITHUB_REPOSITORY" \
            "commit=$GITHUB_SHA" \
            "run_id=$GITHUB_RUN_ID" \
            > "$HYPERATLAS_OUTPUT/Workflow/RUN_IDENTITY.txt"

      - name: Publish HyperAtlas summary
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '# DREAM HyperAtlas'
            echo
            if [[ -f "$HYPERATLAS_OUTPUT/Manifests/HYPERATLAS_SUMMARY.json" ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dream-hyperatlas-output/Manifests/HYPERATLAS_SUMMARY.json").read_text())
          print(f"- Repository root: `{data['repository_root_sha256']}`")
          print(f"- Captured entries: **{data['captured_entries']:,}**")
          print(f"- Captured bytes: **{data['captured_bytes']:,}**")
          print(f"- Capsule: **{data['capsule']['dimension']}×{data['capsule']['dimension']} RGB PNG**")
          print(f"- Capsule payload: **{data['capsule']['payload_bytes']:,} bytes**")
          print("- Recovery: complete tree from one PNG; complete tree from any 12 of 16 atlas-cell PNGs")
          PY
            else
              echo '- HyperAtlas generation did not produce a summary.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the complete visual recovery system
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dream-hyperatlas-${{ github.run_number }}
          path: dream-hyperatlas-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Final integrity and policy gate
        if: always()
        shell: bash
        env:
          HYPERATLAS_EXIT: ${{ steps.hyperatlas.outputs.exit_code || '99' }}
          PROJECT_CHECKS_FAILED: ${{ steps.project_checks.outputs.failed || 'false' }}
          FAIL_ON_PROJECT_CHECKS: ${{ inputs.fail_on_project_checks || false }}
        run: |
          set -euo pipefail
          if [[ "$HYPERATLAS_EXIT" != "0" ]]; then
            echo "HyperAtlas generation or recovery proof failed with exit code $HYPERATLAS_EXIT" >&2
            exit "$HYPERATLAS_EXIT"
          fi
          test -s "$HYPERATLAS_OUTPUT/Images/DREAM_COMPLETE_REPOSITORY_CAPSULE.png"
          test -s "$HYPERATLAS_OUTPUT/Diagnostics/RECOVERY_PROOF.json"
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path("dream-hyperatlas-output/Diagnostics/RECOVERY_PROOF.json").read_text())
          required = [
              proof.get("exact_tree_round_trip") is True,
              bool(proof.get("four_systematic_vertices_recovered")),
              bool(proof.get("four_atlas_images_recovered")),
              bool(proof.get("single_pixel_corruption_localised_and_repaired")),
          ]
          if not all(required):
              raise SystemExit("recovery proof is incomplete")
          PY
          if [[ "$FAIL_ON_PROJECT_CHECKS" == "true" && "$PROJECT_CHECKS_FAILED" == "true" ]]; then
            echo "Repository-native checks failed; artifacts were uploaded before this gate." >&2
            exit 1
          fi
