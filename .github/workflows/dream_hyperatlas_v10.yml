                  values = np.frombuffer(blob, dtype=np.uint8)
                  target = flat[:len(values)]
                  target[:,0] = (target[:,0]&0xF8)|(values>>5)
                  target[:,1] = (target[:,1]&0xF8)|((values>>2)&7)
                  target[:,2] = (target[:,2]&0xFC)|(values&3)
                  path = output_dir / f"DREAM_CELL_{cell_bits(cell)}_{'PARITY' if cell in PARITY_CELLS else 'DATA'}.png"
                  Image.fromarray(array, mode="RGB").save(path, format="PNG", optimize=False, compress_level=6)
                  results.append({"cell": cell, "role": "parity" if cell in PARITY_CELLS else "data", "path": path.name, "sha256": sha256(path.read_bytes()), "dimension": dimension})
              return results
          
          
          def read_atlas_cell_image(path: Path) -> tuple[int, bytes, dict[str, Any]]:
              image = Image.open(path).convert("RGB")
              array = np.array(image, dtype=np.uint8).reshape(-1, 3)
              values = ((array[:,0]&7)<<5)|((array[:,1]&7)<<2)|(array[:,2]&3)
              raw = values.astype(np.uint8).tobytes()
              header = parse_cell_header(raw[:CELL_HEADER_SIZE])
              stream = raw[CELL_HEADER_SIZE:CELL_HEADER_SIZE+header["stream_len"]]
              if hashlib.sha256(stream).digest() != header["stream_sha"] or (binascii.crc32(stream)&0xffffffff) != header["crc32"]:
                  raise ValueError(f"invalid cell stream: {path}")
              return header["cell"], stream, header
          
          
          def read_atlas_directory(directory: Path) -> tuple[bytes, dict[str, Any]]:
              available: dict[int, bytes] = {}
              headers: dict[int, dict[str, Any]] = {}
              for path in sorted(directory.glob("*.png")):
                  try:
                      cell, stream, header = read_atlas_cell_image(path)
                      if cell in available:
                          raise ValueError(f"duplicate cell {cell}")
                      available[cell] = stream
                      headers[cell] = header
                  except Exception as exc:
                      print(f"ignored {path.name}: {exc}", file=sys.stderr)
              if len(available) < K_DATA:
                  raise ValueError(f"atlas has only {len(available)} valid cells")
              ref = headers[sorted(headers)[0]]
              for header in headers.values():
                  if header["payload_len"] != ref["payload_len"] or header["payload_sha"] != ref["payload_sha"] or header["root"] != ref["root"]:
                      raise ValueError("mixed atlas revisions")
              payload = rs_decode(available, ref["payload_len"], len(next(iter(available.values()))))
              if hashlib.sha256(payload).digest() != ref["payload_sha"]:
                  raise ValueError("atlas payload digest mismatch")
              return payload, {"valid_cells": sorted(available), "recovered_cells": sorted(set(range(16))-set(available)), "root": ref["root"]}
          
          
          def aggregate_components(entries: Sequence[Entry], dep: dict[str, Any], metrics: dict[str, dict[str, Any]]) -> tuple[list[str], np.ndarray, dict[str, Any]]:
              components = sorted({top_component(e.path) for e in entries})
              index = {name: i for i, name in enumerate(components)}
              weights = np.zeros((len(components), len(components)), dtype=np.float64)
              for source, targets in dep["graph"].items():
                  a = index[top_component(source)]
                  for target in targets:
                      b = index[top_component(target)]
                      if a != b:
                          weights[a,b] += 1
                          weights[b,a] += 1
              stats: dict[str, Any] = {}
              for name in components:
                  es = [e for e in entries if top_component(e.path) == name]
                  stats[name] = {
                      "files": len(es), "bytes": sum(e.size for e in es),
                      "risk": sum(metrics[e.path]["risk"] for e in es),
                      "reachable": sum(1 for e in es if metrics[e.path]["reachable"]),
                      "mean_vertex": sum(metrics[e.path]["semantic_vertex"] for e in es)/max(1,len(es)),
                  }
              return components, weights, stats
          
          
          def solve_component_positions(components: list[str], weights: np.ndarray, stats: dict[str, Any]) -> np.ndarray:
              n = len(components)
              if n == 0:
                  return np.zeros((0,2))
              degree = np.diag(weights.sum(axis=1))
              laplacian = degree - weights
              anchors = np.zeros((n,2), dtype=np.float64)
              for i,name in enumerate(components):
                  vertex = int(round(stats[name]["mean_vertex"])) & 15
                  b = [(vertex >> shift)&1 for shift in (3,2,1,0)]
                  anchors[i] = [0.12 + 0.76*(0.55*b[0]+0.25*b[2]+0.2*((hash(name)&255)/255)), 0.12 + 0.76*(0.55*b[1]+0.25*b[3]+0.2*(((hash(name)>>8)&255)/255))]
              regularization = 0.35
              normal = laplacian + regularization*np.eye(n)
              positions = np.column_stack([
                  np.linalg.solve(normal, regularization*anchors[:,0]),
                  np.linalg.solve(normal, regularization*anchors[:,1]),
              ])
              positions -= positions.min(axis=0)
              span = np.maximum(positions.max(axis=0), 1e-9)
              positions /= span
              return positions
          
          
