name: GRUT Bullet Cluster full resolution
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Previous workflow run ID to resume (blank for fresh run)'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label available in your repository'
        required: true
        type: string
        default: ubuntu-latest
permissions:
  contents: read
  actions: read
jobs:
  simulate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      GRUT_WALL_SECONDS: '16200'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<2.3' 'matplotlib>=3.8,<4'
      - name: Restore previous results
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: grut-bullet-results
          path: GRUT_Bullet_Full_results
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Create embedded simulation
        shell: bash
        run: |
          cat > GRUT_Bullet_Full.py <<'GRUT_EMBEDDED_PYTHON_EOF'
          """GRUT Bullet Cluster: cosmological formation and local merger (Carnets Plus).
          Uses NumPy; Matplotlib optional. %run GRUT_Bullet_Carnets_Full.py
          Paper 09 capture, geodesic phase transport and cosmic budget; Paper 03
          multistream moments; original GRUT signed polarization and C3 renewal;
          GRA 08 spectral splitting and GRA 09 leading weak-field optical diagnostics.
          Spherical growing-mode seeds and star handoff are explicit conditional inputs.
          No final phase halo multiplier, no fitted lensing amplitude, no nonlocal
          pressure-energy redistribution. Formation solves coupled spherical gas and
          collisionless phase evolution with cosmic expansion; merger evolves all
          retained carriers and gas self-gravitationally on a 3-D local periodic mesh.
          The finite nonspherical support stress/transport closure is not specified.
          Its full-capture endpoint and renewal are tested, not added as unconstrained
           gravity. This is a controlled reduced model, not full GRUT action.
          The same formed baryonic state is used for the phase-removal control.
          The thin-lens maps are weak-field Born projections, not full metric ray tracing.
          The raw mesh force imbalance is saved before COM-frame projection.
          Formation boundary and phase shell truncation, seed parameters, and numerical
          quality are in PASTE_BACK.json. No observational fit is claimed.
          """
          import json, csv, time, math, os, sys, signal, faulthandler
          from pathlib import Path
          import numpy as np
          
          # ==================== USER SETTINGS ====================
          # Fixed high-resolution run; no preliminary test modes or resolution overrides.
          # Full 9216 kpc cube: 255^3 cells, 36.141176 kpc spacing.
          # Large float64 working arrays require multiple GB of RAM. No automatic downshift.
          MODE = 'full_resolution'
          N = 255                     # fixed production grid; no automatic resolution reduction
          BOX_KPC = 9216.0            # periodic proper cube; vary box separately
          END_MYR = 2000.0
          OUTPUT_EVERY_MYR = 100.0
          CFL = 0.30
          GAS_TOTAL = 383.41          # archive extrapolated inventory; not measured initial ownership
          GAS_BULLET_FRACTION = 0.5   # explicit sensitivity input; NOT a fitted or derived ratio
          STAR_MASS = (11.96, 4.00)
          SCALE_KPC = (470., 245.)    # archived conditional profile scales, gas and stars
          START_SEPARATION = 4300.0
          IMPACT_KPC = 100.0
          RELATIVE_KMS = 2600.0       # illustrative initial relative speed, not shock speed measurement
          STAR_PARTICLES = 72000      # per galaxy population
          PHASE_SIGMA_KMS = 1.0       # conditional cold cosmic reservoir (Paper 09 capture section)
          PHASE_MODE = 'formed'       # 'formed', 'cosmic', 'none', or 'file'
          PHASE_FILE = 'phase_initial.npz' # optional x [kpc], v [km/s], mass [10^12 Msun], arrays
          RUN_BARYON_CONTROL = True
          MAKE_PLOTS = True
          STOP_AT_TARGET = False       # retain matched snapshot and evolve through END_MYR
          RESUME = True
          SEED = 8417
          OUT = Path('GRUT_Bullet_Full_results')
          # Wall-clock checkpoint interval only; does not change simulation settings.
          BUDGET_SECONDS = float(os.environ.get('GRUT_WALL_SECONDS', '0'))
          DEADLINE = time.monotonic()+BUDGET_SECONDS if BUDGET_SECONDS>0 else float('inf')
          class CheckpointPause(Exception): pass
          def pause_due(): return time.monotonic()>=DEADLINE
          # =======================================================
          KPC=3.085677581491367e19; MYR=31557600.e6; MS=1.98847e30
          MUNIT=1e12*MS; G=6.67430e-11*MUNIT*MYR**2/KPC**3
          C=299792458.*MYR/KPC; KM=1000.*MYR/KPC
          H0=67.35*1000*MYR/(1000*KPC); Z=.296; OL=27/(4*np.pi**2); OC=.26503; OM=.31599
          HZ=H0*np.sqrt(OM*(1+Z)**3+OL); AC=3*np.sqrt(3)/(4*np.pi**2)*C*HZ
          TAU=4*np.pi**2/(9*np.sqrt(3)*HZ) # Myr; source clock, approximately 31.4 Gyr
          RHO_PHASE=OC*3*H0**2/(8*np.pi*G)*(1+Z)**3
          DL=4.570*206264.80624709636; SIGCRIT=C*C/(4*np.pi*G*DL)
          GAMMA=5./3.; TARGET=880.07174; AP=150.; SMOOTH=80.
          
          
          def emit(*a): print(*a,flush=True)
          
          def stage(name):
              emit(f'[STAGE {time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}]',name)
          
          def install_failure_trace():
              # The C-level handler emits the Python stack even during native NumPy work,
              # then chains to the original SIGTERM disposition. Do not claim a clean exit.
              faulthandler.enable(file=sys.stderr,all_threads=True)
              if hasattr(faulthandler,'register'):
                  faulthandler.register(signal.SIGTERM,file=sys.stderr,all_threads=True,chain=True)
              stage('failure traceback installed')
          def rel(a,b): return float(np.linalg.norm(a-b)/max(np.linalg.norm(b),1e-30))
          def jsonsave(path,obj):
              tmp=path.with_suffix('.tmp'); tmp.write_text(json.dumps(obj,indent=2,allow_nan=False)); tmp.replace(path)
          
          class Grid:
              def __init__(self,n,L):
                  self.n=n; self.L=L; self.h=L/n; self.dv=self.h**3; self.shape=(n,)*3
                  self.x=(np.arange(n)+.5)*self.h-L/2
                  self.xyz=np.meshgrid(self.x,self.x,self.x,indexing='ij',sparse=True)
                  k=2*np.pi*np.fft.fftfreq(n,self.h); kd=k.copy()
                  if n%2==0: kd[n//2]=0. # real, antisymmetric derivative at Nyquist
                  self.k=np.meshgrid(kd,kd,kd,indexing='ij',sparse=True)
                  # Compatible spectral Poisson/gradient/divergence; Nyquist-only nulls removed.
                  self.k2=sum(q*q for q in self.k); self.inv=np.divide(1.,self.k2,out=np.zeros(self.shape),where=self.k2>0)
              def wrap(self,x): return (x+self.L/2)%self.L-self.L/2
              def geometry(self,x,derivative=False):
                  # Quadratic B-spline particle shape. A smooth discrete Hamiltonian
                  # force uses the derivative of exactly this same mass assignment.
                  q=(x+self.L/2)/self.h-.5; i=np.floor(q+.5).astype(np.int64);d=q-i
                  W=(.5*(.5-d)**2,.75-d*d,.5*(.5+d)**2)
                  D=(-( .5-d)/self.h,-2*d/self.h,(.5+d)/self.h)
                  for a in range(3):
                      for b in range(3):
                          for c in range(3):
                              j=(i+np.array([a-1,b-1,c-1]))%self.n
                              idx=(j[:,0]*self.n+j[:,1])*self.n+j[:,2]
                              wx,wy,wz=W[a][:,0],W[b][:,1],W[c][:,2]
                              w=wx*wy*wz
                              if derivative:
                                  dw=np.column_stack((D[a][:,0]*wy*wz,wx*D[b][:,1]*wz,wx*wy*D[c][:,2]))
                                  yield idx,w,dw
                              else:yield idx,w
              def deposit(self,x,w):
                  out=np.zeros(self.n**3)
                  if len(x):
                      for idx,frac in self.geometry(x):out+=np.bincount(idx,weights=w*frac,minlength=out.size)
                  return out.reshape(self.shape)/self.dv
              def sample(self,field,x):
                  out=np.zeros((len(x),)+field.shape[3:]);flat=field.reshape((self.n**3,)+field.shape[3:])
                  for i,w in self.geometry(x):out+=flat[i]*w.reshape((-1,)+(1,)*(out.ndim-1))
                  return out
              def particle_force(self,phi,x):
                  out=np.zeros_like(x);flat=phi.ravel()
                  for idx,w,dw in self.geometry(x,True):out-=flat[idx,None]*dw
                  return out
              def forces(self,U,x,m):
                  phi,a=self.solve(U[0]+self.deposit(x,m))
                  ap=self.particle_force(phi,x)
                  # Discrete grid does not have exact continuous translation symmetry.
                  # Work in the instantaneous COM inertial-coordinate projection; record
                  # the unprojected residual so conservation is not claimed by fiat.
                  gasforce=np.sum(U[0][...,None]*a,axis=(0,1,2))*self.dv
                  particleforce=np.sum(m[:,None]*ap,axis=0)
                  residual=gasforce+particleforce; total=U[0].sum()*self.dv+m.sum()
                  scale=np.sum(U[0]*np.linalg.norm(a,axis=-1))*self.dv+np.sum(m*np.linalg.norm(ap,axis=1))
                  shift=residual/total
                  return phi,a-shift,ap-shift,float(np.linalg.norm(residual)/max(scale,1e-30)),float(np.linalg.norm(residual))
              def solve(self,rho):
                  ph=np.fft.rfftn(rho,axes=(0,1,2)); ph*=(-4*np.pi*G)*self.inv[:,:,:self.n//2+1]
                  pot=np.fft.irfftn(ph,s=self.shape,axes=(0,1,2))
                  a=np.empty(self.shape+(3,))
                  for i,k in enumerate(self.k):
                      if i==2:k=k[:,:,:self.n//2+1]
                      a[...,i]=np.fft.irfftn(-1j*k*ph,s=self.shape,axes=(0,1,2))
                  return pot,a
              def div(self,v):
                  z=None
                  for i,k in enumerate(self.k):
                      if i==2:k=k[:,:,:self.n//2+1]
                      h=np.fft.rfftn(v[...,i],axes=(0,1,2));h*=1j*k
                      if z is None:z=h
                      else:z+=h
                  return np.fft.irfftn(z,s=self.shape,axes=(0,1,2))
              def supported(self,rho):
                  # Odd grid: only the spatially constant mode is in the kernel.
                  if self.n%2:return rho-rho.mean()
                  return np.fft.ifftn(np.fft.fftn(rho)*(self.k2>0)).real
          
          def primitive(U):
              r=U[0]; v=U[1:4]/r; p=(GAMMA-1)*(U[4]-.5*r*np.sum(v*v,axis=0))
              return r,v,p
          
          def valid(U):
              tol=1e-13*np.max(U[0])
              for lo in range(0,U.shape[1],HYDRO_SLAB):
                  B=U[:,lo:lo+HYDRO_SLAB]
                  if not np.isfinite(B).all() or np.min(B[0])<=0 or np.min(primitive(B)[2])<=0:return False
                  if len(B)>5 and (np.min(B[5]) < -tol or np.min(B[0]-B[5]) < -tol):return False
              return True
          
          def hydro_rhs_block(U,g,return_mass_flux=False,second_order=True):
              r,v,p=primitive(U); sound=np.sqrt(GAMMA*p/r); rhs=np.zeros_like(U); mf=[]
              for d in range(3):
                  ax=d+1
                  if second_order:
                      # Monotonized-central primitive reconstruction. Positivity is
                      # retained by the minmod-family limiter; tracer is a mass fraction.
                      Q=np.concatenate((r[None],v,p[None],U[5:6]/r if len(U)>5 else np.empty((0,)+r.shape)),axis=0)
                      left=Q-np.roll(Q,1,axis=ax);right=np.roll(Q,-1,axis=ax)-Q
                      same=left*right>0
                      slope=np.where(same,np.sign(left)*np.minimum(np.minimum(2*abs(left),2*abs(right)),.5*abs(left+right)),0.)
                      ql=Q+.5*slope;qr=np.roll(Q-.5*slope,-1,axis=ax)
                      def cons(Q):
                          r0=Q[0]; vv=Q[1:4];pp=Q[4]; result=np.empty_like(U)
                          result[0]=r0; result[1:4]=r0*vv;result[4]=pp/(GAMMA-1)+.5*r0*np.sum(vv*vv,axis=0)
                          if len(U)>5:result[5]=r0*np.clip(Q[5],0,1)
                          return result
                      L=cons(ql);R=cons(qr);rl=ql[0];rr=qr[0];pl0=ql[4];pr=qr[4];vl=ql[d+1];vr=qr[d+1]
                      cl=np.sqrt(GAMMA*pl0/rl);cr=np.sqrt(GAMMA*pr/rr)
                      del Q,left,right,same,slope,ql,qr
                  else:
                      L=U;R=np.roll(U,-1,axis=ax);rl=r;rr=np.roll(r,-1,axis=d);pl0=p;pr=np.roll(p,-1,axis=d);vl=v[d];vr=np.roll(vl,-1,axis=d);cl=sound;cr=np.roll(sound,-1,axis=d)
                  F=L*vl;F[d+1]+=pl0;F[4]+=pl0*vl
                  FR=R*vr;FR[d+1]+=pr;FR[4]+=pr*vr
                  sl=np.minimum(vl-cl,vr-cr);sr=np.maximum(vl+cl,vr+cr)
                  den=rl*(sl-vl)-rr*(sr-vr)
                  with np.errstate(divide='ignore',invalid='ignore',over='ignore'):
                      ss=(pr-pl0+rl*vl*(sl-vl)-rr*vr*(sr-vr))/den
                      def star(Q,r0,p0,v0,sw):
                          rat=(sw-v0)/(sw-ss); st=Q*rat
                          st[d+1]=st[0]*ss
                          st[4]=st[0]*(Q[4]/r0+(ss-v0)*(ss+p0/(r0*(sw-v0))))
                          return st
                      Ls=star(L,rl,pl0,vl,sl); Rs=star(R,rr,pr,vr,sr)
                      Fl=F+sl*(Ls-L); Fr=FR+sr*(Rs-R)
                      face=np.where(sl>=0,F,np.where(ss>=0,Fl,np.where(sr>0,Fr,FR)))
                      pl=(GAMMA-1)*(Ls[4]-.5*np.sum(Ls[1:4]**2,axis=0)/Ls[0]); ps=(GAMMA-1)*(Rs[4]-.5*np.sum(Rs[1:4]**2,axis=0)/Rs[0])
                  ok=np.isfinite(face).all(axis=0)&(Ls[0]>0)&(Rs[0]>0)&(pl>0)&(ps>0)&(ss>=sl)&(ss<=sr)
                  s=np.maximum(abs(vl)+cl,abs(vr)+cr); fallback=.5*(F+FR-s*(R-L))
                  ok &= (np.maximum(rl,rr)<30*np.minimum(rl,rr)) & (np.maximum(pl0,pr)<30*np.minimum(pl0,pr))
                  face=np.where(ok,face,fallback)
                  rhs-=(face-np.roll(face,1,axis=ax))/g.h
                  if return_mass_flux:mf.append(face[0].copy())
              return (rhs,mf) if return_mass_flux else rhs
          
          # Full-resolution finite-volume operator evaluated in slabs. No coarsening.
          HYDRO_SLAB = 8
          
          def hydro_rhs(U,g,return_mass_flux=False,second_order=True):
              n=U.shape[1]; rhs=np.empty_like(U)
              mf=[np.empty(U.shape[1:],dtype=U.dtype) for _ in range(3)] if return_mass_flux else None
              for lo in range(0,n,HYDRO_SLAB):
                  hi=min(lo+HYDRO_SLAB,n); ids=np.arange(lo-2,hi+2)%n
                  block=np.take(U,ids,axis=1)
                  result=hydro_rhs_block(block,g,return_mass_flux,second_order)
                  if return_mass_flux:
                      dr,flux=result;rhs[:,lo:hi]=dr[:,2:-2]
                      for d in range(3):mf[d][lo:hi]=flux[d][2:-2]
                  else:rhs[:,lo:hi]=result[:,2:-2]
              return (rhs,mf) if return_mass_flux else rhs
          
          def peak_rss_mb():
              import resource
              # Linux ru_maxrss is in KiB.
              return resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024
          
          def kick(U,a,h):
              for lo in range(0,U.shape[1],HYDRO_SLAB):
                  hi=min(lo+HYDRO_SLAB,U.shape[1]); B=U[:,lo:hi];old=B[1:4].copy(); delta=h*np.moveaxis(a[lo:hi],-1,0)
                  B[1:4]+=B[0]*delta
                  B[4]+=np.sum(old*delta,axis=0)+.5*B[0]*np.sum(delta*delta,axis=0)
          
          def positions(g,mode):
              rng=np.random.default_rng(SEED); gm=np.array([1-GAS_BULLET_FRACTION,GAS_BULLET_FRACTION])*GAS_TOTAL
              masses=gm+STAR_MASS; frac=masses[1]/masses.sum(); delta=np.array([START_SEPARATION,IMPACT_KPC,0.])
              centers=np.array([-frac*delta,(1-frac)*delta]); vel=np.array([[frac*RELATIVE_KMS*KM,0,0],[-(1-frac)*RELATIVE_KMS*KM,0,0]])
              U=np.zeros((6,)+g.shape); xp=[]; vp=[]; mp=[]; labels=[]
              for i,(m,star,a) in enumerate(zip(gm,STAR_MASS,SCALE_KPC)):
                  r2=sum(g.wrap(q-centers[i,j])**2 for j,q in enumerate(g.xyz)); radius=np.sqrt(r2+a*a)
                  rho=(1+r2/a**2)**(-2.5); rho*=m/(rho.sum()*g.dv)
                  # Isolated equal-scale Plummer hydrostatic pressure, approximate when overlapped.
                  p=rho*G*masses[i]/(6*radius)
                  U[0]+=rho; U[1:4]+=rho*vel[i,:,None,None,None]; U[4]+=p/(GAMMA-1)+.5*rho*np.dot(vel[i],vel[i]); U[5]+=rho if i==1 else 0
                  count=STAR_PARTICLES; cut=3.5*a; fmax=(cut/np.sqrt(cut**2+a*a))**3
                  u=rng.uniform(1e-10,fmax,count); r=a/np.sqrt(u**(-2/3)-1)
                  dirs=rng.normal(size=(count,3)); dirs/=np.linalg.norm(dirs,axis=1)[:,None]
                  pos=g.wrap(centers[i]+r[:,None]*dirs)
                  # Plummer isotropic DF p(q) proportional to q^2(1-q^2)^(7/2), q=v/v_escape.
                  q=np.empty(count); pending=np.arange(count)
                  while len(pending):
                      cand=rng.random(len(pending)); accept=rng.random(len(pending))*.1<cand**2*(1-cand*cand)**3.5
                      q[pending[accept]]=cand[accept]; pending=pending[~accept]
                  dirs=rng.normal(size=(count,3)); dirs/=np.linalg.norm(dirs,axis=1)[:,None]
                  vs=vel[i]+dirs*(q*np.sqrt(2*G*masses[i]/np.sqrt(r*r+a*a)))[:,None]
                  xp.append(pos);vp.append(vs);mp.append(np.full(count,star/count));labels.append(np.full(count,i,np.int8))
              if mode=='cosmic':
                  # One equal-weight phase tracer per cell; total budget follows Paper 09 cosmology.
                  pos=np.stack(np.meshgrid(g.x,g.x,g.x,indexing='ij'),axis=-1).reshape(-1,3)
                  v=rng.normal(0,PHASE_SIGMA_KMS*KM,pos.shape); v-=v.mean(0)
                  xp.append(pos);vp.append(v);mp.append(np.full(len(pos),RHO_PHASE*g.dv));labels.append(np.full(len(pos),2,np.int8))
              elif mode=='file':
                  with np.load(PHASE_FILE,allow_pickle=False) as f: pos=np.asarray(f['x'],float); v=np.asarray(f['v'],float)*KM; m=np.asarray(f['mass'],float)
                  if pos.ndim!=2 or pos.shape[1]!=3 or v.shape!=pos.shape or m.shape!=(len(pos),) or not np.isfinite(np.c_[pos,v,m]).all() or np.any(m<=0):raise ValueError('Invalid independent phase initial data')
                  xp.append(g.wrap(pos));vp.append(v);mp.append(m);labels.append(np.full(len(pos),2,np.int8))
              elif mode!='none':raise ValueError('Invalid PHASE_MODE')
              return U,np.concatenate(xp),np.concatenate(vp),np.concatenate(mp),np.concatenate(labels),centers
          
          # Source cascade: Paper 09 p09-law. Quadrature and monotone inversion tabulated once.
          def cascade():
              x=np.geomspace(1e-9,1e7,2200); j=np.arange(1,257.); n=1+1/(2*j); w=1/(2*(1-np.log(2))*j*(2*j+1)); n=np.r_[n,1.]; w=np.r_[w,1-w.sum()]
              u,q=np.polynomial.legendre.leggauss(48);u=(u+1)/2;q=q/2
              mu=np.empty_like(x); D=mu.copy()
              for i,xx in enumerate(x):
                  s=-n[:,None]*np.log1p(xx*u[None,:]/n[:,None]); coeff=w[:,None]*(3*q*u*u)[None,:]
                  mu[i]=np.sum(coeff*(-np.expm1(s)));D[i]=np.sum(coeff*np.exp(s))
              y=x*mu
              assert np.all(np.diff(y)>0) and abs(np.max(x*D)-.9286)<.001
              return x,y,x*D
          
          def support_flux(a,table):
              # Quasi-linear diagnostic, v=grad Phi_b=-a_b, S=(nu-1)v.
              x,y,boost=table; norm=np.linalg.norm(a,axis=-1); load=norm/AC
              b=np.zeros_like(load); good=load>0
              b[good]=np.exp(np.interp(np.log(load[good]),np.log(y),np.log(boost)))
              low=(load<y[0])&good; b[low]=np.sqrt(4*load[low]/3)-load[low]
              high=load>y[-1]; b[high]=boost[-1]*y[-1]/load[high] # diagnostic tail; flag range in output
              return -a*np.divide(AC*b,norm,out=np.zeros_like(norm),where=good)[...,None]
          
          def center(g,x,m,label,i,prior):
              pos=x[label==i]; w=m[label==i]; c=prior.copy()
              for rad in (700.,400.,max(180.,1.2*g.h)):
                  d=g.wrap(pos-c); r2=np.sum(d*d,axis=1); weight=w*np.exp(-.5*r2/rad**2)
                  if weight.sum()<1e-12*w.sum():break
                  c=g.wrap(c+(d*weight[:,None]).sum(0)/weight.sum())
              return c
          
          def smooth2(a,g,s=SMOOTH):
              k=2*np.pi*np.fft.fftfreq(g.n,g.h); k2=k[:,None]**2+k[None,:]**2
              return np.fft.ifft2(np.fft.fft2(a)*np.exp(-s*s*k2/2)).real
          
          def optical(a):
              # Born thin lens shear / Jacobi amplification, periodic sky, mass-sheet convention.
              n=a.shape[0]; k=2*np.pi*np.fft.fftfreq(n); kx=k[:,None];ky=k[None,:];den=kx*kx+ky*ky
              h=np.fft.fft2(a); inv=np.divide(1.,den,out=np.zeros_like(den),where=den>0)
              s1=np.fft.ifft2((kx*kx-ky*ky)*inv*h).real;s2=np.fft.ifft2(2*kx*ky*inv*h).real
              return s1,s2,(1-a)**2-s1*s1-s2*s2
          
          def bands(a,g):
              k=2*np.pi*np.fft.fftfreq(g.n,g.h); k2=k[:,None]**2+k[None,:]**2
              ell=np.divide(2*np.pi,np.sqrt(k2),out=np.full_like(k2,np.inf),where=k2>0)
              S=[1/(1+np.exp(-np.clip((np.log(ell)-np.log(t))/.25,-700,700))) for t in (80,160,320,640)]
              W=np.array([1-S[0],S[0]-S[1],S[1]-S[2],S[2]-S[3],S[3]])
