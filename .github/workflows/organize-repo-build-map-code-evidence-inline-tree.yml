          OUT_ROOT = REPO / "_organized_repo_artifact"
          ORGANIZED = OUT_ROOT / "organized-repository"

          ZIP_PATH = OUT_ROOT / "dreamengin-organized-repository.zip"
          TREE_FILE = OUT_ROOT / "organized_file_tree.txt"
          MANIFEST_JSON = OUT_ROOT / "organized_manifest.json"
