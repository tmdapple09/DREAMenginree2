              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".mp3", ".wav",
              ".mp4", ".mov", ".glb", ".gltf", ".wasm", ".zip", ".pdf",
              ".ttf", ".otf", ".woff", ".woff2",
          }

          SKIP_SCAN_DIRS = {
              ".git", "node_modules", ".next", "dist", "build", ".turbo", ".cache",
              "_organized_repo_artifact", "_rebase_organized_zip_work", "__MACOSX",
          }

          GENERATED_NAMES = {
              BEHAVIOR_HELPER_FILENAME,
              "organized_file_tree.txt",
              "organized_manifest.json",
              "organized_manifest.csv",
          }

          @dataclass
          class FileFacts:
              rel: str
              path_lower: str
              name_lower: str
              suffix: str
              text: str
              lower: str
              is_text: bool
              is_binary: bool
              is_typescript: bool
              is_tsx: bool
              is_jsx: bool
              is_markdown: bool
              is_sql: bool
              is_yaml: bool
              is_json: bool
              is_css: bool
              is_page_file: bool
              is_layout_file: bool
              is_route_file: bool
              is_test_file: bool
              is_workflow: bool
              is_component_like: bool
              line_count: int

          def safe_part(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"[^a-z0-9._-]+", "_", value)
              value = re.sub(r"_+", "_", value).strip("_")
              return value or "uncategorized"

          def git_files() -> List[str]:
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=REPO)
              files = [p for p in raw.decode("utf-8", errors="replace").split("\0") if p]
              return [
                  p for p in files
                  if Path(p).name not in GENERATED_NAMES
                  and not any(part in SKIP_SCAN_DIRS for part in Path(p).parts)
              ]

          def is_probably_text_path(path: Path) -> bool:
              suffix = path.suffix.lower()
              if suffix in BINARY_EXTENSIONS:
                  return False
              if suffix in TEXT_EXTENSIONS:
                  return True
              if path.name in {"Dockerfile", "LICENSE", "Makefile", ".gitignore", ".gitleaks.toml", ".cursorrules"}:
                  return True
              return False

          def read_text(path: Path, limit: int = 900_000) -> Tuple[str, bool]:
              if not path.exists() or not path.is_file():
                  return "", False
              if not is_probably_text_path(path):
                  return "", False
              try:
                  data = path.read_bytes()
              except Exception:
                  return "", False
              if len(data) > limit:
                  data = data[:limit]
              return data.decode("utf-8", errors="replace"), True

          def facts_for(rel: str) -> FileFacts:
              path = REPO / rel
              suffix = path.suffix.lower()
              text, is_text = read_text(path)
              path_lower = rel.lower()
              name_lower = path.name.lower()
              lower = text.lower()
              is_ts = suffix in {".ts", ".tsx", ".mts", ".cts"}
              is_tsx = suffix == ".tsx"
              is_jsx = suffix == ".jsx"
              is_route_file = name_lower == "route.ts" or name_lower == "route.js" or "/route." in path_lower
              is_page_file = name_lower in {"page.tsx", "page.ts", "page.jsx", "page.js"} or "/page." in path_lower
              is_layout_file = name_lower in {"layout.tsx", "layout.ts", "layout.jsx", "layout.js"} or "/layout." in path_lower
              is_test_file = (
                  "/tests/" in f"/{path_lower}" or
                  name_lower.endswith(".test.ts") or name_lower.endswith(".test.tsx") or
                  name_lower.endswith(".spec.ts") or name_lower.endswith(".spec.tsx") or
                  "describe(" in lower and "expect(" in lower
              )
              is_workflow = path_lower.startswith(".github/workflows/") or path_lower.startswith(".github/ruleset/")
              is_component_like = (
                  is_tsx or is_jsx or
                  "export default function" in lower and "return (" in lower or
                  "react" in lower and "jsx" in lower
              )
              return FileFacts(
                  rel=rel,
                  path_lower=path_lower,
                  name_lower=name_lower,
                  suffix=suffix,
                  text=text,
                  lower=lower,
                  is_text=is_text,
                  is_binary=not is_text,
                  is_typescript=is_ts,
                  is_tsx=is_tsx,
                  is_jsx=is_jsx,
                  is_markdown=suffix in {".md", ".mdx"},
                  is_sql=suffix == ".sql",
                  is_yaml=suffix in {".yml", ".yaml"},
                  is_json=suffix == ".json",
                  is_css=suffix in {".css", ".scss"},
                  is_page_file=is_page_file,
                  is_layout_file=is_layout_file,
                  is_route_file=is_route_file,
                  is_test_file=is_test_file,
                  is_workflow=is_workflow,
                  is_component_like=is_component_like,
                  line_count=text.count("\n") + (1 if text else 0),
              )

          def contains_any(haystack: str, needles: Iterable[str]) -> bool:
              return any(needle.lower() in haystack for needle in needles)

          def count_any(haystack: str, needles: Iterable[str]) -> int:
              return sum(haystack.count(needle.lower()) for needle in needles)

          def regex_any(patterns: Iterable[str], haystack: str) -> bool:
              return any(re.search(pattern, haystack, flags=re.IGNORECASE | re.MULTILINE) for pattern in patterns)

          def add_score(scores: Dict[Tuple[str, str], int], reasons: Dict[Tuple[str, str], List[str]], category: str, subfolder: str, weight: int, reason: str) -> None:
              if category not in CATEGORIES:
                  raise KeyError(f"Unknown category: {category}")
              if subfolder not in CATEGORIES[category]:
                  raise KeyError(f"Unknown subfolder: {category}/{subfolder}")
              key = (category, subfolder)
              scores[key] += weight
              reasons[key].append(reason)

