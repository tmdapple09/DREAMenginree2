name: Organize Repo Into Web App Build Map

on:
  workflow_dispatch:
    inputs:
      organized_repo_artifact_name:
        description: "Download name for the organized repository ZIP"
        required: true
        default: "dreamengin-organized-repository"
      file_tree_artifact_name:
        description: "Download name for the organized file tree plus code-evidence report"
        required: true
        default: "dreamengin-organized-file-tree"
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "14"

permissions:
  contents: read

jobs:
  organize-repository:
    name: Organize repository by file code evidence plus DREAMengin behavior
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build organized repository from code evidence
