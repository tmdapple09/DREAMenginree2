                  "19_release_management": 4,
                  "20_documentation": 3,
                  "18_content_assets": 2,
                  "01_define_user_flow": 1,
              }
              return priorities.get(category, 0)

          def dreamengin_area(f: FileFacts) -> str:
              p = f.path_lower
              h = f.lower
              area_rules = [
                  ("dreamdmbar", ["dreamdmbar", "dreamdm", "DreamSystemContext".lower()]),
                  ("dreamr", ["dreamr", "/feed", "feed/", "profile", "messages", "social"]),
                  ("gameengin", ["gameengin", "games", "cartridge", "madmaxi", "game remote"]),
                  ("contentengin", ["contentengin", "asset", "glb", "recipe", "rigging"]),
                  ("codeengin", ["codeengin", "workspace", "diagnostics", "notebook"]),
                  ("starmakerengin", ["starmaker", "music", "daw", "sequencer", "mixer"]),
                  ("labengin", ["labengin", "/lab", "lab/", "simulation", "quantum"]),
                  ("brandingengin", ["brandingengin", "brand", "campaign", "identity"]),
                  ("forgeengin", ["forgeengin", "forge", "assembly"]),
                  ("dualruntime", ["dualruntime", "dual runtime", "dualRuntimeBridge".lower()]),
                  ("runtime", ["engine/runtime", "engin-runtime", "runtime", "snapshot", "offlinequeue"]),
                  ("dreamspace", ["dreamspace", "dream space", "dreamsurface.dreamspace"]),
                  ("homedream", ["homedream", "home dream"]),
                  ("daydreams", ["daydream", "daydreams"]),
                  ("shared_dreams", ["shared-dream", "shared dream", "sharedDream".lower()]),
                  ("dreams", ["dreams", "dream-windows", "dream window", "dreamregistry"]),
                  ("supabase", ["supabase"]),
                  ("agents_dr_eams", ["agents", "dr-eams", "idari", "boogie", "humanai"]),
                  ("ui_shell", ["components", "styles", "ui-system", "ui/"]),
                  ("docs", ["docs", "readme", "architecture", ".md"]),
                  ("public_assets", ["public", "fonts", "images", "icons", "models", "audio"]),
              ]
              combined = p + "\n" + h[:200_000]
              best_area = None
              best_score = 0
              for area, terms in area_rules:
                  score = 0
                  for term in terms:
                      term_l = term.lower()
                      if term_l in p:
                          score += 12
                      elif term_l in combined:
                          score += 3
                  if score > best_score:
                      best_area = area
                      best_score = score
              if best_area:
                  return best_area
              return safe_part(p.split("/", 1)[0])

          def dreamengin_behavior(f: FileFacts) -> Tuple[str, str]:
              combined = f.path_lower + "\n" + f.lower[:500_000]
              best_name = "unclassified_dreamengin_behavior"
              best_score = 0
              best_hits: List[str] = []
              for behavior, terms in DREAMENGIN_BEHAVIORS.items():
                  score = 0
                  hits: List[str] = []
                  for term in terms:
                      term_l = term.lower()
                      if term_l in f.path_lower:
                          score += 12
                          hits.append(term)
                      elif term_l in combined:
                          score += 3
                          hits.append(term)
                  if score > best_score:
                      best_score = score
                      best_name = behavior
                      best_hits = hits[:8]
              if best_score <= 0:
                  area = dreamengin_area(f)
                  area_fallbacks = {
                      "dreamdmbar": "dreamdmbar",
                      "dreamr": "dreamr",
                      "gameengin": "gameengin_behavior",
                      "contentengin": "contentengin_behavior",
                      "codeengin": "codeengin_behavior",
                      "starmakerengin": "starmaker_music_behavior",
                      "labengin": "lab_sim_behavior",
                      "brandingengin": "forge_brand_agent_behavior",
                      "forgeengin": "forge_brand_agent_behavior",
                      "runtime": "runtime",
                      "dualruntime": "dualruntime",
                      "dreamspace": "dreamspace",
                      "homedream": "homedream",
                      "daydreams": "daydreams",
                      "shared_dreams": "shared_dreams",
                      "dreams": "dreams_lifecycle",
                      "agents_dr_eams": "admin_agent_dr_eams",
                      "public_assets": "render_webgpu_visual_runtime",
                  }
                  return area_fallbacks.get(area, "unclassified_dreamengin_behavior"), f"fallback from DREAMengin area `{area}`"
              return best_name, "matched code/path terms: " + ", ".join(best_hits)

          def line_is_meaningful(line: str) -> bool:
              stripped = line.strip()
              if not stripped:
                  return False
              if stripped in {"{", "}", "};", ");", "};"}:
                  return False
              return True

          def keyword_bundle(category: str, subfolder: str) -> List[str]:
              words = []
              words.extend(category.split("_")[1:])
              words.extend(subfolder.split("_"))
              words.extend(re.split(r"[_/-]+", category + " " + subfolder))
              return sorted({w.lower() for w in words if len(w) > 2 and w not in {"build", "define", "wire"}})

          def find_line_refs(terms: List[str], scan_files: List[str], max_results: int = 12) -> List[Tuple[str, int, str]]:
              results: List[Tuple[str, int, str]] = []
              seen: Set[Tuple[str, int]] = set()
              lowered_terms = [t.lower() for t in terms if len(t.strip()) >= 3]
              if not lowered_terms:
                  return results

              scored = []
              for rel in scan_files:
                  lower_rel = rel.lower()
                  score = sum(10 for term in lowered_terms if term in lower_rel)
                  scored.append((score, rel))
              scored.sort(reverse=True)
              ordered_files = [rel for score, rel in scored if score > 0] + [rel for score, rel in scored if score == 0]

              for rel in ordered_files[:500]:
                  text, ok = read_text(REPO / rel)
                  if not ok or not text:
                      continue
                  for index, line in enumerate(text.splitlines(), start=1):
                      lower_line = line.lower()
                      if not line_is_meaningful(line):
                          continue
                      if any(term in lower_line for term in lowered_terms):
                          key = (rel, index)
                          if key in seen:
                              continue
                          seen.add(key)
                          snippet = line.strip()
                          if len(snippet) > 180:
                              snippet = snippet[:177] + "..."
                          results.append((rel, index, snippet))
                          if len(results) >= max_results:
                              return results
              return results

          def inline_tree_evidence(row: Dict[str, object], prefix: str) -> List[str]:
              lines: List[str] = []
              lines.append(f"{prefix}• primary: {row['category']}/{row['subfolder']}")
              lines.append(f"{prefix}• dreamengin: {row['dreamengin_area']} / {row['dreamengin_behavior']}")
              lines.append(f"{prefix}• reason: {row['reason']}")

              secondary = row.get("secondary_tracks", [])
              if isinstance(secondary, list) and secondary:
                  lines.append(f"{prefix}• also_ties_to: {', '.join(str(item) for item in secondary)}")

              evidence_items = row.get("code_evidence", [])
              if isinstance(evidence_items, list):
                  for ev in evidence_items[:3]:
                      if not isinstance(ev, dict):
                          continue
                      ev_category = ev.get("category", "unknown_category")
                      ev_subfolder = ev.get("subfolder", "unknown_subfolder")
                      ev_score = ev.get("score", "unknown_score")
                      ev_reasons = ev.get("reasons", [])
                      if isinstance(ev_reasons, list):
                          reason_text = "; ".join(str(reason) for reason in ev_reasons[:3])
                      else:
                          reason_text = str(ev_reasons)
                      lines.append(f"{prefix}• evidence: {ev_category}/{ev_subfolder} score={ev_score} {reason_text}")

              return lines

          def tree_lines(root: Path, placement_by_destination: Dict[str, Dict[str, object]]) -> List[str]:
              lines = [root.name + "/"]

              def walk(directory: Path, prefix: str = "") -> None:
                  entries = sorted(directory.iterdir(), key=lambda x: (x.is_file(), x.name.lower()))
                  for index, entry in enumerate(entries):
                      connector = "└── " if index == len(entries) - 1 else "├── "
                      lines.append(prefix + connector + entry.name + ("/" if entry.is_dir() else ""))

                      extension = "    " if index == len(entries) - 1 else "│   "
                      next_prefix = prefix + extension

                      if entry.is_dir():
                          walk(entry, next_prefix)
                          continue

                      rel = entry.relative_to(root).as_posix()
                      row = placement_by_destination.get(rel)
                      if row is not None:
                          lines.extend(inline_tree_evidence(row, next_prefix))

              walk(root)
              return lines

          def zip_with_empty_dirs(source_root: Path, zip_path: Path) -> None:
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
                  for path in sorted(source_root.rglob("*")):
                      arcname = path.relative_to(source_root.parent).as_posix()
                      if path.is_dir():
                          z.writestr(arcname.rstrip("/") + "/", "")
                      elif path.is_symlink():
                          z.writestr(arcname, os.readlink(path))
                      else:
                          z.write(path, arcname)

          if OUT_ROOT.exists():
              shutil.rmtree(OUT_ROOT)
          OUT_ROOT.mkdir(parents=True, exist_ok=True)
          ORGANIZED.mkdir(parents=True, exist_ok=True)

          # Main buckets exist even if no files land there; subfolders are created only by code classification.
          for category in CATEGORIES:
              (ORGANIZED / category).mkdir(parents=True, exist_ok=True)

          files = git_files()
          scan_files = [rel for rel in files if is_probably_text_path(REPO / rel)]

          manifest: List[Dict[str, object]] = []
          counts = Counter()
          subfolder_counts = Counter()
          area_counts = Counter()
          dream_behavior_counts = Counter()
          copied: Set[str] = set()
          cross_links_by_category: Dict[str, List[Dict[str, object]]] = defaultdict(list)
          dream_behavior_files: Dict[str, List[str]] = defaultdict(list)
          populated_subfolders: Dict[str, Set[str]] = defaultdict(set)

          for rel in files:
              src = REPO / rel
              if not src.exists() or not src.is_file():
                  continue

              facts = facts_for(rel)
              category, subfolder, reason, evidence = classify_by_code(facts)
              area = dreamengin_area(facts)
              dream_behavior_name, dream_behavior_reason = dreamengin_behavior(facts)

              secondary_tracks = []
              for ev in evidence[1:]:
                  cat = str(ev["category"])
                  if cat != category and cat not in secondary_tracks:
                      secondary_tracks.append(cat)

              dest = ORGANIZED / category / subfolder / safe_part(area) / rel
              dest.parent.mkdir(parents=True, exist_ok=True)

              if src.is_symlink():
                  target = os.readlink(src)
                  if dest.exists() or dest.is_symlink():
                      dest.unlink()
                  os.symlink(target, dest)
              else:
                  shutil.copy2(src, dest)

              copied.add(rel)
              counts[category] += 1
              subfolder_counts[(category, subfolder)] += 1
              populated_subfolders[category].add(subfolder)
              area_counts[area] += 1
              dream_behavior_counts[dream_behavior_name] += 1
              dream_behavior_files[dream_behavior_name].append(rel)

              row: Dict[str, object] = {
                  "source_path": rel,
                  "category": category,
                  "subfolder": subfolder,
                  "dreamengin_area": area,
                  "dreamengin_behavior": dream_behavior_name,
                  "dreamengin_behavior_reason": dream_behavior_reason,
                  "destination_path": str(dest.relative_to(ORGANIZED)).replace("\\", "/"),
                  "secondary_tracks": secondary_tracks,
                  "reason": reason,
                  "code_evidence": evidence,
              }
              manifest.append(row)
              if secondary_tracks:
                  cross_links_by_category[category].append(row)

          missing = sorted(set(files) - copied)
          if missing:
              raise SystemExit("Some tracked files were not copied:\n" + "\n".join(missing[:100]))

          unused_subfolders: Dict[str, List[str]] = {
              category: [sub for sub in subfolders if sub not in populated_subfolders[category]]
              for category, subfolders in CATEGORIES.items()
          }

          empty_pointer_refs: Dict[str, List[Tuple[str, int, str]]] = {}
          for category, subs in unused_subfolders.items():
              for subfolder in subs[:40]:
                  key = f"{category}/{subfolder}"
                  empty_pointer_refs[key] = find_line_refs(keyword_bundle(category, subfolder), scan_files, max_results=6)

          tree_output: List[str] = []
          tree_output.append("DREAMENGIN ORGANIZED REPOSITORY FILE TREE")
          tree_output.append("")
          tree_output.append("This file is a separate download from the organized repository ZIP.")
          tree_output.append("The organized repository ZIP contains organized-repository/ with the 20 main build folders.")
          tree_output.append("")
          tree_output.append("This version organizes files by code evidence first. Paths are fallback evidence, not the main sorter.")
          tree_output.append("Subfolders are created only when real repo files land there.")
          tree_output.append("No generated helper Markdown files are placed inside the organized ZIP.")
          tree_output.append("")
          tree_output.append("DREAMengin law tracked by this workflow:")
          tree_output.append("Any user-facing visible object should be treated as Dream-owned behavior: hideable, removable, replaceable, movable, resizable, shareable, cloneable, attachable, fullscreenable, and customizable.")
          tree_output.append("")
          tree_output.append(f"Total tracked files copied: {len(copied)}")
          tree_output.append(f"Generated helper Markdown files inside ZIP: 0")
          tree_output.append("")
          tree_output.append("CATEGORY COUNTS")
          tree_output.append("")
          for category in CATEGORIES:
              tree_output.append(f"- {category}: {counts[category]} files")

          tree_output.append("")
          tree_output.append("SUBFOLDER COUNTS")
          tree_output.append("")
          for category in CATEGORIES:
              tree_output.append(category)
              for subfolder in CATEGORIES[category]:
                  count = subfolder_counts[(category, subfolder)]
                  if count:
                      tree_output.append(f"  - {subfolder}: {count} files")
              tree_output.append("")

          tree_output.append("")
          tree_output.append("UNUSED SUBFOLDERS FROM CHECKLIST")
          tree_output.append("")
          tree_output.append("These remain report-only labels. They are not empty folders in the organized ZIP.")
          tree_output.append("")
          for category, subs in unused_subfolders.items():
              if not subs:
                  continue
              tree_output.append(category)
              for sub in subs:
                  tree_output.append(f"  - {sub}")
              tree_output.append("")

          tree_output.append("")
          tree_output.append("DREAMENGIN AREA COUNTS")
          tree_output.append("")
          for area, count in sorted(area_counts.items()):
              tree_output.append(f"- {area}: {count} files")

          tree_output.append("")
          tree_output.append("DREAMENGIN BEHAVIOR COUNTS")
          tree_output.append("")
          for behavior in DREAMENGIN_BEHAVIORS:
              tree_output.append(f"- {behavior}: {dream_behavior_counts[behavior]} files")
          unclassified = dream_behavior_counts.get("unclassified_dreamengin_behavior", 0)
          if unclassified:
              tree_output.append(f"- unclassified_dreamengin_behavior: {unclassified} files")

          tree_output.append("")
          tree_output.append("DREAMENGIN BEHAVIOR MAP")
          tree_output.append("")
          for behavior in DREAMENGIN_BEHAVIORS:
              tree_output.append(behavior)
              for rel in sorted(dream_behavior_files.get(behavior, []))[:200]:
                  tree_output.append(f"  - {rel}")
              if len(dream_behavior_files.get(behavior, [])) > 200:
                  tree_output.append(f"  - ... {len(dream_behavior_files[behavior]) - 200} more files")
              tree_output.append("")

          tree_output.append("")
          tree_output.append("UNUSED SUBFOLDER CODE POINTERS")
          tree_output.append("")
          tree_output.append("Format: category/subfolder -> file:line. These are report pointers only, not generated repo files.")
          tree_output.append("")
          for key in sorted(empty_pointer_refs):
              refs = empty_pointer_refs[key]
              tree_output.append(key)
              if refs:
                  for rel, line, _snippet in refs:
                      tree_output.append(f"  - {rel}:{line}")
              else:
                  tree_output.append("  - no direct code evidence found")
              tree_output.append("")

          tree_output.append("")
          tree_output.append("ORGANIZED FILE TREE")
          tree_output.append("")
          tree_output.append("Each file line below carries its placement evidence inline inside the tree itself.")
          tree_output.append("")
          placement_by_destination: Dict[str, Dict[str, object]] = {
              str(row["destination_path"]): row
              for row in manifest
          }
          tree_output.extend(tree_lines(ORGANIZED, placement_by_destination))

          tree_output.append("")
          tree_output.append("CROSS-LINKED FILES")
          tree_output.append("")
          tree_output.append("Each file is copied once by strongest code evidence. Secondary category matches are listed here.")
          tree_output.append("")
          any_cross_links = False
          for category in CATEGORIES:
              rows = cross_links_by_category.get(category, [])
              if not rows:
                  continue
              any_cross_links = True
              tree_output.append(category)
              for row in rows:
                  tree_output.append(f"  - {row['source_path']}")
                  tree_output.append(f"    primary: {row['category']}/{row['subfolder']}")
                  tree_output.append(f"    dreamengin_area: {row['dreamengin_area']}")
                  tree_output.append(f"    dreamengin_behavior: {row['dreamengin_behavior']}")
                  tree_output.append(f"    also_ties_to: {', '.join(row['secondary_tracks'])}")
              tree_output.append("")
          if not any_cross_links:
              tree_output.append("No cross-linked files found.")

          TREE_FILE.write_text("\n".join(tree_output) + "\n", encoding="utf-8")

          MANIFEST_JSON.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          with MANIFEST_CSV.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "source_path",
                      "category",
                      "subfolder",
                      "dreamengin_area",
                      "dreamengin_behavior",
                      "dreamengin_behavior_reason",
                      "destination_path",
                      "secondary_tracks",
                      "reason",
                      "code_evidence",
                  ],
              )
              writer.writeheader()
              for row in manifest:
                  csv_row = dict(row)
                  csv_row["secondary_tracks"] = ";".join(row["secondary_tracks"])  # type: ignore[index]
                  csv_row["code_evidence"] = json.dumps(row["code_evidence"], ensure_ascii=False)
                  writer.writerow(csv_row)

          zip_with_empty_dirs(ORGANIZED, ZIP_PATH)

          top = sorted([p.name for p in ORGANIZED.iterdir() if p.is_dir()])
          if len(top) != 20:
              raise SystemExit(f"Expected 20 top-level folders in organized repository, found {len(top)}")

          helper_files = list(ORGANIZED.rglob(BEHAVIOR_HELPER_FILENAME))
          if helper_files:
              raise SystemExit("Generated helper Markdown files leaked into organized ZIP tree.")

          print("")
          print("ORGANIZED REPOSITORY CREATED FROM CODE EVIDENCE")
          print(f"Tracked files copied: {len(copied)}")
          print(f"Generated helper Markdown files inside ZIP: 0")
          print(f"Repository ZIP: {ZIP_PATH.relative_to(REPO)}")
          print(f"Separate file tree: {TREE_FILE.relative_to(REPO)}")
          print(f"Manifest JSON: {MANIFEST_JSON.relative_to(REPO)}")
          print("")
          print("20 TOP-LEVEL FOLDERS")
          for item in top:
              print(item)
          print("")
          print("CATEGORY COUNTS")
          for category in CATEGORIES:
              print(f"{category}: {counts[category]}")
          print("")
          print("DREAMENGIN BEHAVIOR COUNTS")
          for behavior in DREAMENGIN_BEHAVIORS:
              print(f"{behavior}: {dream_behavior_counts[behavior]}")
          PY

      - name: Print organized file tree in workflow log
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Organized file tree"
          cat _organized_repo_artifact/organized_file_tree.txt
          echo "::endgroup::"

      - name: Upload organized repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.organized_repo_artifact_name }}
          path: _organized_repo_artifact/dreamengin-organized-repository.zip
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Upload organized file tree and code-evidence report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.file_tree_artifact_name }}
          path: |
            _organized_repo_artifact/organized_file_tree.txt
            _organized_repo_artifact/organized_manifest.json
            _organized_repo_artifact/organized_manifest.csv
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
