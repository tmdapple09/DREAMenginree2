
name: Repair Qwen Annotation Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair existing Qwen workflow
        id: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys
          import tempfile

          WORKFLOW_NAME = "name: Annotate codebase with cascading Qwen models"
          WORKFLOW_DIR = Path(".github/workflows")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1), "updated"
              if count == 0 and new in text:
                  return text, "already fixed"
              raise RuntimeError(
                  f"{label}: expected one original match, found {count}"
              )

          def replace_step(text, old_name, next_name, replacement,
                           already_marker, report):
              old_marker = f"      - name: {old_name}\n"
              next_marker = f"      - name: {next_name}\n"

              start = text.find(old_marker)

              if start < 0:
                  if already_marker in text:
                      report.append(f"{old_name}: already fixed")
                      return text
                  raise RuntimeError(f"Cannot locate step: {old_name}")

              end = text.find(next_marker, start + len(old_marker))

              if end < 0:
                  raise RuntimeError(
                      f"Cannot locate step following: {old_name}"
                  )

              section = text[start:end]

              if already_marker in section:
                  report.append(f"{old_name}: already fixed")
                  return text

              updated = text[:start] + replacement + text[end:]
              report.append(f"{old_name}: updated")
              return updated

          def exact(text, old, new, label, report):
              text, status = replace_once(text, old, new, label)
              report.append(f"{label}: {status}")
              return text

          def main():
              if not WORKFLOW_DIR.is_dir():
                  raise RuntimeError("Missing .github/workflows directory")

              candidates = []

              for path in (
                  list(WORKFLOW_DIR.glob("*.yml"))
                  + list(WORKFLOW_DIR.glob("*.yaml"))
              ):
                  if path.name == "repair-qwen.yml":
                      continue

                  try:
                      content = path.read_text(encoding="utf-8")
                  except OSError:
                      continue

                  if WORKFLOW_NAME in content:
                      candidates.append(path)

              if len(candidates) != 1:
                  raise RuntimeError(
                      f"Expected one Qwen workflow, found {len(candidates)}"
                  )

              path = candidates[0]
              original = path.read_text(encoding="utf-8")
              updated = original
              report = []

              # 1. Replace impossible fixed runner requirements with
              #    a resource-aware model cascade.
              resource_step = '''      - name: Check runner resources and plan model cascade
                shell: bash
                run: |
                  set -euo pipefail
                  mkdir -p .qwen_annotation/state

                  RAM_MB="$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)"
                  DISK_MB="$(df -Pm . | awk 'NR==2 {print $4}')"

                  echo "Available RAM: ${RAM_MB} MB"
                  echo "Available disk: ${DISK_MB} MB"

                  MODELS=()

                  if [ "$RAM_MB" -ge 5000 ] && [ "$DISK_MB" -ge 2500 ]; then
                    MODELS+=("qwen2.5-coder:1.5b")
                  else
                    echo "::error::Insufficient resources for the smallest Qwen model."
                    exit 1
                  fi

                  if [ "$RAM_MB" -ge 7500 ] && [ "$DISK_MB" -ge 5000 ]; then
                    MODELS+=("qwen2.5-coder:3b")
                  fi

                  if [ "$RAM_MB" -ge 14000 ] && [ "$DISK_MB" -ge 10000 ]; then
                    MODELS+=("qwen2.5-coder:7b")
                  fi

                  if [ "$RAM_MB" -ge 28000 ] && [ "$DISK_MB" -ge 20000 ]; then
                    MODELS+=("qwen2.5-coder:14b")
                  fi

                  printf '%s\\n' "${MODELS[@]}" > .qwen_annotation/state/planned_models.txt

                  echo "Planned cascade:"
                  cat .qwen_annotation/state/planned_models.txt

          '''

              updated = replace_step(
                  updated,
                  "Check runner resources",
                  "Install Ollama",
                  resource_step,
                  "Check runner resources and plan model cascade",
                  report,
              )

              # 2. Pull only models selected by the resource planner.
              pull_step = '''      - name: Pull available Qwen cascade models
                shell: bash
                run: |
                  set -u
                  mkdir -p .qwen_annotation/state

                  : > .qwen_annotation/state/available_models.txt

                  if [ ! -s .qwen_annotation/state/planned_models.txt ]; then
                    echo "::error::Missing planned model list."
                    exit 1
                  fi

                  while IFS= read -r model; do
                    [ -z "$model" ] && continue

                    echo "Pulling ${model}..."

                    if ollama pull "${model}"; then
                      echo "${model}" >> .qwen_annotation/state/available_models.txt
                      echo "Downloaded: ${model}"
                    else
                      echo "::warning::Could not download ${model}; skipping."
                    fi
                  done < .qwen_annotation/state/planned_models.txt

                  if [ ! -s .qwen_annotation/state/available_models.txt ]; then
                    echo "::error::No Qwen coder model could be downloaded."
                    exit 1
                  fi

                  cat .qwen_annotation/state/available_models.txt

          '''

              updated = replace_step(
                  updated,
                  "Pull available Qwen cascade models",
                  "Warm available models",
                  pull_step,
                  "planned_models.txt",
                  report,
              )

              # 3. Fix Ollama HTTP URLs and verify that each model
              #    can actually load before adding it to the cascade.
              warmup_step = '''      - name: Warm and verify available models
                shell: bash
                run: |
                  set -u

                  INPUT=".qwen_annotation/state/available_models.txt"
                  VERIFIED=".qwen_annotation/state/verified_models.txt"

                  : > "$VERIFIED"

                  while IFS= read -r model; do
                    [ -z "$model" ] && continue

                    echo "Testing ${model}..."

                    if curl --max-time 600 -fsS \\
                      "http://${OLLAMA_HOST}/api/generate" \\
                      -H "Content-Type: application/json" \\
                      -d "{\"model\":\"${model}\",\"prompt\":\"Return only OK.\",\"stream\":false,\"keep_alive\":\"5m\"}" \\
                      >/tmp/qwen_warmup.json; then

                      echo "${model}" >> "$VERIFIED"
                      echo "Verified: ${model}"
                    else
                      echo "::warning::${model} downloaded but could not be loaded."
                    fi
                  done < "$INPUT"

                  if [ ! -s "$VERIFIED" ]; then
                    echo "::error::No Qwen model passed the loading test."
                    exit 1
                  fi

                  mv "$VERIFIED" "$INPUT"
                  echo "Verified cascade:"
                  cat "$INPUT"

          '''

              updated = replace_step(
                  updated,
                  "Warm available models",
                  "Install Python dependencies",
                  warmup_step,
                  "Warm and verify available models",
                  report,
              )

              # 4. Ollama's host environment variable does not include
              #    an HTTP scheme. curl requires one.
              updated = exact(
                  updated,
                  'curl -fsS "${OLLAMA_HOST}/api/tags"',
                  'curl -fsS "http://${OLLAMA_HOST}/api/tags"',
                  "Ollama readiness URL",
                  report,
              )

              # 5. Scheduled events do not supply workflow_dispatch inputs.
              updated = exact(
                  updated,
                  "          INPUT_FILES_PER_RUN: ${{ inputs.files_per_run }}\n"
                  "          INPUT_EXTENSIONS: ${{ inputs.extensions }}\n",
                  "          INPUT_FILES_PER_RUN: ${{ inputs.files_per_run || '10' }}\n"
                  "          INPUT_EXTENSIONS: ${{ inputs.extensions || '.ts,.tsx,.py' }}\n",
                  "Scheduled input defaults",
                  report,
              )

              # 6. An empty environment variable must also trigger
              #    the Python extension defaults.
              updated = exact(
                  updated,
                  '    raw = os.environ.get("INPUT_EXTENSIONS", ",".join(DEFAULT_EXTENSIONS))\n',
                  '    raw = os.environ.get("INPUT_EXTENSIONS") or ",".join(DEFAULT_EXTENSIONS)\n',
                  "Extension fallback",
                  report,
              )

              # 7. Old telemetry files may not contain all current counters.
              updated = exact(
                  updated,
                  '              data.setdefault("totals", {})\n\n'
                  '              return data\n',
                  '              if not isinstance(data.get("totals"), dict):\n'
                  '                  data["totals"] = {}\n'
                  '              for key in (\n'
                  '                  "requests",\n'
                  '                  "successful_requests",\n'
                  '                  "failed_requests",\n'
                  '                  "accepted_candidates",\n'
                  '                  "rejected_candidates",\n'
                  '              ):\n'
                  '                  data["totals"].setdefault(key, 0)\n'
                  '\n'
                  '              return data\n',
                  "Telemetry migration",
                  report,
              )

              # 8. Reset the retry counter if the actual source changes.
              updated = exact(
                  updated,
                  '              old_record = state["files"].get(relative)\n'
                  '              prior_attempts = old_record.get("attempts", 0) if old_record else 0\n',
                  '              old_record = state["files"].get(relative)\n'
                  '              if old_record and old_record.get("source_sha256") == source_hash:\n'
                  '                  prior_attempts = int(old_record.get("attempts", 0))\n'
                  '              else:\n'
                  '                  prior_attempts = 0\n',
                  "Retry budget reset",
                  report,
              )

              # 9. Also reset retry eligibility in the scheduling logic.
              updated = exact(
                  updated,
                  '                  attempts = record.get("attempts", 0) if record else 0\n\n'
                  '                  if attempts >= MAX_ATTEMPTS:\n',
                  '                  source_changed = (\n'
                  '                      record is not None\n'
                  '                      and record.get("source_sha256") != source_hash\n'
                  '                  )\n'
                  '                  attempts = (\n'
                  '                      int(record.get("attempts", 0))\n'
                  '                      if record and not source_changed\n'
                  '                      else 0\n'
                  '                  )\n\n'
                  '                  if attempts >= MAX_ATTEMPTS:\n',
                  "Changed-source retry scheduling",
                  report,
              )

              # 10. Ignore historical records for source files that
              #     have since been deleted.
              updated = exact(
                  updated,
                  '          for relative, record in files.items():\n'
                  '              if record.get("status") == "complete":\n'
                  '                  complete += 1\n'
                  '                  output = output_dir / relative\n'
                  '                  if not output.exists():\n'
                  '                      missing.append(relative)\n'
                  '              else:\n'
                  '                  partial += 1\n',
                  '          for relative, record in files.items():\n'
                  '              if not Path(relative).exists():\n'
                  '                  continue\n'
                  '              if record.get("status") == "complete":\n'
                  '                  complete += 1\n'
                  '                  output = output_dir / relative\n'
                  '                  if not output.exists():\n'
                  '                      missing.append(relative)\n'
                  '              else:\n'
                  '                  partial += 1\n',
                  "Deleted-source validation",
                  report,
              )

              if updated == original:
                  print("No changes needed.")
              else:
                  backup = path.with_suffix(path.suffix + ".bak")

                  if backup.exists():
                      raise RuntimeError(
                          f"Backup already exists: {backup}"
                      )

                  fd, temporary = tempfile.mkstemp(
                      dir=str(path.parent),
                      suffix=".tmp",
                  )

                  try:
                      with os.fdopen(fd, "w", encoding="utf-8") as handle:
                          handle.write(updated)

                      backup.write_text(original, encoding="utf-8")
                      os.replace(temporary, path)

                  except Exception:
                      try:
                          os.unlink(temporary)
                      except OSError:
                          pass
                      raise

                  print(f"Repaired: {path}")
                  print(f"Backup: {backup}")

              for item in report:
                  print("-", item)

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"path={path.as_posix()}\n")

          try:
              main()
          except Exception as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Commit repaired workflow
        shell: bash
        env:
          TARGET: ${{ steps.patch.outputs.path }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TARGET"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Qwen annotation workflow"
            git push
          fi
