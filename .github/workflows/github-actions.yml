name: DREAMengin CI/CD Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ci-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Advisory Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - name: Run Quality
        run: |
          mkdir -p build-logs
          { pnpm run typecheck && pnpm run lint; } > build-logs/quality.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-quality
          path: build-logs/

  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - name: Run Build
        run: |
          mkdir -p build-logs
          { pnpm run test && pnpm run build; } > build-logs/verify.txt 2>&1 || true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: log-verify
          path: build-logs/

  database:
    name: Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run DB Check
        run: |
          mkdir -p build-logs
          { find supabase/migrations -name "*.sql" -type f | sort; } > build-logs/database.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-database
          path: build-logs/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - name: Run Security
        run: |
          mkdir -p build-logs
          { pnpm audit && trivy fs .; } > build-logs/security.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-security
          path: build-logs/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/completedream'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build-logs
          docker build . > build-logs/docker.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-docker
          path: build-logs/

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          mkdir -p build-logs
          kubectl apply -f kubernetes/deployment.yaml > build-logs/deploy.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-deploy
          path: build-logs/

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/completedream'
    steps:
      - name: Run Tests
        run: |
          mkdir -p build-logs
          { curl -fsS https://dreamengin.com/api/dreamengin/os-status; } > build-logs/smoke.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-smoke
          path: build-logs/

  drift-check:
    name: Build Memory Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Drift
        run: |
          mkdir -p build-logs
          node scripts/check-build-memory-drift.mjs > build-logs/drift.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-drift
          path: build-logs/

  build-probe:
    name: Vercel Build Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p build-logs
          pnpm run vercel-build > build-logs/probe.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: log-probe
          path: build-logs/

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [verify, smoke-tests, docker]
    if: failure()
    steps:
      - name: Notify
        run: echo "Failed" > build-logs/notify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: log-notify
          path: build-logs/

  compile-everything:
    name: Compile JSON
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, verify, database, security, docker, deploy-k8s, smoke-tests, drift-check, build-probe, notify]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: logs-raw
          pattern: log-*
          merge-multiple: true
      - name: Create JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logs = {};
            fs.readdirSync('./logs-raw').forEach(file => {
              logs[file] = fs.readFileSync(path.join('./logs-raw', file), 'utf8');
            });
            fs.writeFileSync('pipeline-output.json', JSON.stringify({run_id: context.runId, logs}, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: final-pipeline-data
          path: pipeline-output.json
