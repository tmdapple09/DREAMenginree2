name: Export DREAMengin core files into one massive JSON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-core-massive-json:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build DREAMengin core JSON export
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / "dreamengin-core-json-export"

          FILE_EXTENSIONS = {
              ".ts",
              ".tsx",
              ".mjs",
              ".css",
              ".js",
              ".svg",
              ".wasm",
              ".html",
          }

          IGNORE_DIRS = {
              ".git",
              "node_modules",
              ".next",
              ".json",
              "out",
              "dist",
              "build",
              "coverage",
              ".vercel",
              ".turbo",
              ".cache",
              ".parcel-cache",
              ".pnpm-store",
              ".yarn",
              ".swc",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "dreamengin-core-json-export",
              "repo-massive-json-export",
              "test",
              "tests",
          }

          SAFE_ENV_FILES = {
              ".env.example",
              ".env.sample",
              ".env.template",
              ".env.local.example",
              ".env.development.example",
              ".env.production.example",
          }

          # Same core/system folders as the uploaded meaningful cut.
          # Future files added inside these folders will be included.
          INCLUDE_PREFIXES = {
              "app/actions/",
              "app/api/appeal/",
              "app/api/auth/providers/",
              "app/api/blocks/",
              "app/api/ci/run/",
              "app/api/codeengin/",
              "app/api/content/transcribe/",
              "app/api/drafts/",
              "app/api/dream-windows/",
              "app/api/dreamengin/os-status/",
              "app/api/dreamr/",
              "app/api/dreams/",
              "app/api/forge/build/",
              "app/api/gal/",
              "app/api/game-scores/",
              "app/api/gameengin/",
              "app/api/home-layout/",
              "app/api/journey/",
              "app/api/lab/",
              "app/api/music/",
              "app/api/projects/",
              "app/api/setup/google-oauth/",
              "app/api/shared-dream/",
              "app/api/shellhub/devices/",
              "app/api/upload/",
              "app/api/user/layout/",

              "app/daydream/",
              "app/discover/",
              "app/dream-effects/",
              "app/dreamdmbar/",
              "app/dreamr/",
              "app/engines/",
              "app/homedream/",
              "app/lab/",
              "app/notes/",

              "assembly/",

              "components/auth/",
              "components/branding/",
              "components/contentengin/",
              "components/core/",
              "components/customize/",
              "components/daydream/",
              "components/draggable/",
              "components/dreamengin/",
              "components/dreamnav/",
              "components/dreamr/",
              "components/dreams/",
              "components/engines/",
              "components/forge/",
              "components/gameengin/",
              "components/games/",
              "components/home/",
              "components/icons/",
              "components/menus/",
              "components/messaging/",
              "components/music/",
              "components/onboarding/",
              "components/optimizer/",
              "components/panels/",
              "components/providers/",
              "components/runtime/",
              "components/shaders/",
              "components/shared-dream/",
              "components/spatial/",
              "components/three/",
              "components/ui/",
              "components/ui-system/",
              "components/universal-editor/",
              "components/universe/",
              "components/warp/",
              "components/webgpu/",
              "components/widgets/",

              "coresurfaces/home/buttons/",

              "daydreams/code/",
              "daydreams/create/",
              "daydreams/games/",
              "daydreams/lab/",
              "daydreams/music/",
              "daydreams/shared/",

              "dreamdmbar/",
              "dreamr/",
              "dreamr/torridity/",

              "engine/animation/",
              "engine/api/",
              "engine/artifacts/",
              "engine/assets/",
              "engine/consent/",
              "engine/dream-window/",
              "engine/dreamnav/",
              "engine/dreams/",
              "engine/editor/",
              "engine/engin-runtime/",
              "engine/events/",
              "engine/feature-build/",
              "engine/gct/",
              "engine/gestures/",
              "engine/identity/",
              "engine/intelligence/",
              "engine/journey/",
              "engine/navigation/",
              "engine/offline/",
              "engine/os/",
              "engine/platform/",
              "engine/policy/",
              "engine/reality/",
              "engine/rendering/",
              "engine/runtime/",
              "engine/scene/",
              "engine/setup/",
              "engine/sharedDream/",
              "engine/user-sim/",
              "engine/vm/",
              "engine/widgets/",

              "engins/CodeEngin/",
              "engins/autoopen/",
              "engins/codeengin/",
              "engins/contentengin/",
              "engins/forgeengin/",
              "engins/gameengin/",
              "engins/labengin/",
              "engins/portfolio/",
              "engins/renderengin/",
              "engins/rulesets/",
              "engins/starmakerengin/",

              "hooks/",
              "optimizer/",
          }

          # Root-level files from the uploaded meaningful cut.
          # Future root-level files are NOT automatically included.
          INCLUDE_EXACT_FILES = {
              "app/global-error.tsx",
              "app/layout.tsx",

              "components/dream.AudioVisualizer3D.tsx",
              "components/dream.CreatePostModal.tsx",
              "components/dream.DragToAnchorClose.tsx",
              "components/dream.ForgeDreamCanvas.tsx",
              "components/dream.IconSelector.tsx",
              "components/dream.InnerDreamsButton.tsx",
              "components/dream.OSShellActivator.tsx",
              "components/dream.PhysicsLab.tsx",
              "components/dream.ShrunkMode.tsx",
              "components/dream.universal_asset_registry.tsx",
              "components/dream.widget.AnchorWidget.tsx",
              "components/dream.widget.WidgetBubble.tsx",

              "engine/activeModulesStore.ts",
              "engine/agentOS.ts",
              "engine/dev-bypass.ts",
              "engine/generationLaw.ts",
              "engine/sharedDream.ts",
              "engine/slog.ts",

              "engins/dream.ForgeEngin.tsx",
              "engins/dream.QuantumCircuitCanvas.tsx",
              "engins/engin.BrandingEngin.tsx",
              "engins/engin.CodeEngin.tsx",
              "engins/engin.GameEngin.tsx",
              "engins/engin.LabEngin.tsx",
              "engins/engin.StarMakerEngin.tsx",
              "engins/isosurfaceAssetPipeline.ts",
              "engins/isosurfaceDualContouring.ts",

              "export-force-english-csv-repo.mjs",
          }

          def rel(path: Path) -> str:
              return path.relative_to(ROOT).as_posix()

          def ignored(path: Path) -> bool:
              return any(part in IGNORE_DIRS for part in path.relative_to(ROOT).parts)

          def secret_env(path: Path) -> bool:
              name = path.name
              if name in SAFE_ENV_FILES:
                  return False
              return name == ".env" or name.startswith(".env.")

          def in_allowed_scope(source_path: str) -> bool:
              if source_path in INCLUDE_EXACT_FILES:
                  return True
              return any(source_path.startswith(prefix) for prefix in INCLUDE_PREFIXES)

          def included(path: Path) -> bool:
              if not path.is_file():
                  return False
              if ignored(path):
                  return False
              if secret_env(path):
                  return False
              if path.suffix.lower() not in FILE_EXTENSIONS:
                  return False
              return in_allowed_scope(rel(path))

          def binary_file(data: bytes, suffix: str) -> bool:
              return suffix == ".wasm" or b"\x00" in data[:4096]

          def read_record(path: Path) -> dict:
              data = path.read_bytes()
              source_path = rel(path)
              suffix = path.suffix.lower()
              is_binary = binary_file(data, suffix)

              if is_binary:
                  content_text = ""
                  content_base64 = base64.b64encode(data).decode("ascii")
                  encoding = "base64"
              else:
                  try:
                      content_text = data.decode("utf-8")
                      encoding = "utf-8"
                  except UnicodeDecodeError:
                      content_text = data.decode("utf-8", errors="replace")
                      encoding = "utf-8-replacement"
                  content_base64 = ""

              return {
                  "path": source_path,
                  "file_name": path.name,
                  "extension": suffix,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "is_binary": is_binary,
                  "encoding": encoding,
                  "content_text": content_text,
                  "content_base64": content_base64,
              }

          if OUT.exists():
              shutil.rmtree(OUT)

          OUT.mkdir(parents=True, exist_ok=True)

          files = sorted(
              [path for path in ROOT.rglob("*") if included(path)],
              key=lambda path: rel(path).lower(),
          )

          records = [read_record(path) for path in files]

          export = {
              "export_kind": "dreamengin_core_massive_json",
              "selection_rule": "Only files inside the uploaded DREAMengin core meaningful scope, plus future files added under the same allowed folders.",
              "included_extensions": sorted(FILE_EXTENSIONS),
              "total_files_in_all_files_json": len(records),
              "files": records,
          }

          (OUT / "all-files.json").write_text(
              json.dumps(export, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          manifest = {
              "artifact_name": "dreamengin-core-one-massive-json",
              "massive_json": "all-files.json",
              "total_files_in_all_files_json": len(records),
              "included_extensions": sorted(FILE_EXTENSIONS),
              "included_prefixes": sorted(INCLUDE_PREFIXES),
              "included_exact_files": sorted(INCLUDE_EXACT_FILES),
              "excluded_dirs": sorted(IGNORE_DIRS),
              "note": "This export is scope-allowlisted. It does not export every matching extension in the repo.",
          }

          (OUT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          summary = f"""# DREAMengin core JSON export complete

          Created:

          - `all-files.json`
          - `manifest.json`

          Files embedded in `all-files.json`: **{len(records)}**

          Scope: uploaded DREAMengin core meaningful files and future files added under the same allowed folders.
          """

          print(summary)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              Path(step_summary).write_text(summary, encoding="utf-8")
          PY

      - name: Upload DREAMengin core JSON artifact
        uses: actions/upload-artifact@v6
        with:
          name: dreamengin-core-one-massive-json
          path: dreamengin-core-json-export
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
