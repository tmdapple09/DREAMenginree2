name: Sync Engine Registry

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.9.0'

      - name: Run Registry Wire-Up
        run: node scripts/wire-orphans.mjs

      - name: Push Updates
        run: |
          git config user.name "DREAMengin-Bot"
          git config user.email "bot@dreamengin.com"
          
          # Adds everything in the generated folder and the registry file
          git add src/engin/generated/ build-memory/registry.json
          
          # Only commit/push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update engine registry [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
