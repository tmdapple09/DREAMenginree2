name: DREAM Binary Evidence Export

on:
  workflow_dispatch:
    inputs:
      include_all_files:
        description: "Include non-code files too"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dream-binary-export:
    name: Build binary/Pascal/CLT export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DREAM binary evidence zip
        env:
          INCLUDE_ALL_FILES: ${{ inputs.include_all_files || 'false' }}
        shell: bash
        run: |
          cat > /tmp/dream_binary_export.py <<'PY'
          from __future__ import annotations

          import gzip
          import hashlib
          import json
          import math
          import os
          import shutil
          import statistics
          import sys
          import zipfile
          from dataclasses import asdict, dataclass
          from pathlib import Path
          from typing import Dict, Iterable, List, Tuple

          CODE_EXTENSIONS = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs",
              ".json", ".jsonc", ".md", ".mdx", ".txt", ".yml", ".yaml",
              ".css", ".scss", ".sass", ".html", ".svg",
              ".py", ".sh", ".sql", ".toml", ".ini", ".env", ".example",
              ".rs", ".go", ".java", ".kt", ".swift", ".c", ".h", ".cpp",
              ".wasm", ".wat",
          }

          EXCLUDE_DIRS = {
              ".git", "node_modules", ".next", "out", "dist", "build",
              "coverage", ".turbo", ".vercel", ".cache", "__pycache__",
              ".pytest_cache", ".dream-binary-export",
          }

          EXCLUDE_FILES = {
              "dream-binary-evidence-export.zip",
          }

          MAX_RAW_FILE_BYTES = 3_000_000
          WINDOW_BITS = 8192

          PASCAL_ROW_8 = [1, 8, 28, 56, 70, 56, 28, 8, 1]
          PASCAL_TOTAL_8 = 256


          @dataclass
          class FileBinaryStats:
              sourcePath: str
              bytes: int
              bits: int
              zeros: int
              ones: int
              oneRatio: float
              expectedOnesFairBinary: float
              sigmaFairBinary: float
              zScoreFairBinary: float
              sha256: str
              byteEntropyBits: float
              hammingWeightCounts: List[int]
              pascalExpectedByteWeightCounts: List[float]
              pascalChiSquare: float
              cltWindowCount: int
              cltWindowMeanOneRatio: float | None
              cltWindowStdDevOneRatio: float | None
              maxAbsWindowZScore: float | None
              outputBitstreamGzipPath: str


          def should_skip(path: Path, root: Path, include_all: bool) -> bool:
              rel = path.relative_to(root)
              parts = set(rel.parts)

              if any(part in EXCLUDE_DIRS for part in parts):
                  return True

              if path.name in EXCLUDE_FILES:
                  return True

              if not path.is_file():
                  return True

              if include_all:
                  return False

              if path.suffix.lower() in CODE_EXTENSIONS:
                  return False

              if path.name in {"Dockerfile", "Makefile", "README", "LICENSE"}:
                  return False

              return True


          def iter_files(root: Path, include_all: bool) -> Iterable[Path]:
              for path in sorted(root.rglob("*")):
                  if not should_skip(path, root, include_all):
                      yield path


          def byte_entropy(data: bytes) -> float:
              if not data:
                  return 0.0

              counts = [0] * 256
              for b in data:
                  counts[b] += 1

              entropy = 0.0
              total = len(data)

              for count in counts:
                  if count:
                      p = count / total
                      entropy -= p * math.log2(p)

              return entropy


          def bits_from_bytes(data: bytes) -> str:
              return "".join(f"{byte:08b}" for byte in data)


          def hamming_weight_counts(data: bytes) -> List[int]:
              counts = [0] * 9
              for byte in data:
                  counts[byte.bit_count()] += 1
              return counts


          def chi_square(observed: List[int], expected: List[float]) -> float:
              total = 0.0
              for obs, exp in zip(observed, expected):
                  if exp > 0:
                      total += ((obs - exp) ** 2) / exp
              return total


          def clt_window_stats(bit_string: str) -> Tuple[int, float | None, float | None, float | None]:
              if not bit_string:
                  return 0, None, None, None

              ratios: List[float] = []
              zscores: List[float] = []

              for i in range(0, len(bit_string), WINDOW_BITS):
                  window = bit_string[i:i + WINDOW_BITS]
                  n = len(window)

                  if n < 128:
                      continue

                  ones = window.count("1")
                  ratio = ones / n
                  ratios.append(ratio)

                  expected = n / 2
                  sigma = math.sqrt(n / 4)
                  zscores.append((ones - expected) / sigma if sigma else 0.0)

              if not ratios:
                  return 0, None, None, None

              return (
                  len(ratios),
                  statistics.mean(ratios),
                  statistics.pstdev(ratios) if len(ratios) > 1 else 0.0,
                  max(abs(z) for z in zscores) if zscores else None,
              )


          def safe_output_name(source_path: str) -> str:
              return source_path.replace("/", "__").replace("\\", "__")


          def analyze_file(path: Path, root: Path, out_dir: Path) -> FileBinaryStats:
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()

              n_bits = len(data) * 8
              ones = sum(byte.bit_count() for byte in data)
              zeros = n_bits - ones
              one_ratio = ones / n_bits if n_bits else 0.0

              expected = n_bits / 2
              sigma = math.sqrt(n_bits / 4) if n_bits else 0.0
              z_score = (ones - expected) / sigma if sigma else 0.0

              hw_counts = hamming_weight_counts(data)
              pascal_expected = [(len(data) * coeff / PASCAL_TOTAL_8) for coeff in PASCAL_ROW_8]
              pascal_chi = chi_square(hw_counts, pascal_expected) if data else 0.0

              bit_string = bits_from_bytes(data)
              bitstream_rel = f"Binary Bitstreams/{safe_output_name(rel)}.bits.gz"
              bitstream_path = out_dir / bitstream_rel
              bitstream_path.parent.mkdir(parents=True, exist_ok=True)

              with gzip.open(bitstream_path, "wt", encoding="utf-8") as handle:
                  handle.write(bit_string)

              window_count, window_mean, window_std, max_abs_z = clt_window_stats(bit_string)

              return FileBinaryStats(
                  sourcePath=rel,
                  bytes=len(data),
                  bits=n_bits,
                  zeros=zeros,
                  ones=ones,
                  oneRatio=one_ratio,
                  expectedOnesFairBinary=expected,
                  sigmaFairBinary=sigma,
                  zScoreFairBinary=z_score,
                  sha256=hashlib.sha256(data).hexdigest(),
                  byteEntropyBits=byte_entropy(data),
                  hammingWeightCounts=hw_counts,
                  pascalExpectedByteWeightCounts=pascal_expected,
                  pascalChiSquare=pascal_chi,
                  cltWindowCount=window_count,
                  cltWindowMeanOneRatio=window_mean,
                  cltWindowStdDevOneRatio=window_std,
                  maxAbsWindowZScore=max_abs_z,
                  outputBitstreamGzipPath=bitstream_rel,
              )


          def aggregate(stats: List[FileBinaryStats]) -> Dict:
              total_bytes = sum(item.bytes for item in stats)
              total_bits = sum(item.bits for item in stats)
              total_ones = sum(item.ones for item in stats)
              total_zeros = total_bits - total_ones

              hw = [0] * 9
              for item in stats:
                  for idx, count in enumerate(item.hammingWeightCounts):
                      hw[idx] += count

              expected = total_bits / 2
              sigma = math.sqrt(total_bits / 4) if total_bits else 0.0
              z_score = (total_ones - expected) / sigma if sigma else 0.0
              pascal_expected = [(total_bytes * coeff / PASCAL_TOTAL_8) for coeff in PASCAL_ROW_8]

              return {
                  "files": len(stats),
                  "bytes": total_bytes,
                  "bits": total_bits,
                  "zeros": total_zeros,
                  "ones": total_ones,
                  "oneRatio": total_ones / total_bits if total_bits else 0.0,
                  "expectedOnesFairBinary": expected,
                  "sigmaFairBinary": sigma,
                  "zScoreFairBinary": z_score,
                  "hammingWeightCounts": hw,
                  "pascalRow8": PASCAL_ROW_8,
                  "pascalExpectedByteWeightCounts": pascal_expected,
                  "pascalChiSquare": chi_square(hw, pascal_expected) if total_bytes else 0.0,
                  "largestAbsoluteFileZScores": [
                      {
                          "sourcePath": item.sourcePath,
                          "zScoreFairBinary": item.zScoreFairBinary,
                          "oneRatio": item.oneRatio,
                          "bytes": item.bytes,
                          "outputBitstreamGzipPath": item.outputBitstreamGzipPath,
                      }
                      for item in sorted(stats, key=lambda x: abs(x.zScoreFairBinary), reverse=True)[:50]
                  ],
              }


          def write_report(out_dir: Path, summary: Dict) -> None:
              lines = [
                  "# DREAM Binary Evidence Export",
                  "",
                  "This export converts the codebase into binary evidence and applies Pascal/binomial and CLT-style measurements.",
                  "",
                  "## Global statistics",
                  "",
                  f"- Files analyzed: `{summary['files']}`",
                  f"- Bytes analyzed: `{summary['bytes']}`",
                  f"- Bits analyzed: `{summary['bits']}`",
                  f"- Ones: `{summary['ones']}`",
                  f"- Zeros: `{summary['zeros']}`",
                  f"- One ratio: `{summary['oneRatio']:.8f}`",
                  f"- Fair-binary CLT z-score: `{summary['zScoreFairBinary']:.4f}`",
                  "",
                  "## Pascal row 8 byte hamming-weight distribution",
                  "",
                  "For a fair random byte, the number of bytes with `k` one-bits follows Pascal row 8:",
                  "",
                  "```text",
                  "k:       0   1    2    3    4    5    6   7  8",
                  "C(8,k):  1   8   28   56   70   56   28   8  1",
                  "```",
                  "",
                  "| one-bits in byte | observed bytes | expected fair-binary bytes |",
                  "|---:|---:|---:|",
              ]

              for k, observed in enumerate(summary["hammingWeightCounts"]):
                  expected = summary["pascalExpectedByteWeightCounts"][k]
                  lines.append(f"| {k} | {observed} | {expected:.2f} |")

              lines.extend([
                  "",
                  f"Pascal chi-square distance: `{summary['pascalChiSquare']:.4f}`",
                  "",
                  "## Highest absolute file-level z-scores",
                  "",
                  "| sourcePath | bytes | one ratio | z-score |",
                  "|---|---:|---:|---:|",
              ])

              for row in summary["largestAbsoluteFileZScores"][:25]:
                  lines.append(
                      f"| `{row['sourcePath']}` | {row['bytes']} | {row['oneRatio']:.6f} | {row['zScoreFairBinary']:.4f} |"
                  )

              lines.extend([
                  "",
                  "## Output layout",
                  "",
                  "```text",
                  "DREAM_BINARY_EXPORT.md",
                  ".de/dream-binary-map.json",
                  ".de/file-binary-stats.json",
                  "Binary Bitstreams/*.bits.gz",
                  "```",
                  "",
                  "The `.bits.gz` files contain exact 0/1 bitstream views of the analyzed source files.",
              ])

              (out_dir / "DREAM_BINARY_EXPORT.md").write_text("\n".join(lines), encoding="utf-8")


          def zip_dir(out_dir: Path, zip_path: Path) -> None:
              if zip_path.exists():
                  zip_path.unlink()

              with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(out_dir.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(out_dir).as_posix())


          def main() -> int:
              root = Path(".").resolve()
              out_dir = Path(".dream-binary-export").resolve()
              zip_path = Path("dream-binary-evidence-export.zip").resolve()
              include_all = os.environ.get("INCLUDE_ALL_FILES", "false").lower() == "true"

              if out_dir.exists():
                  shutil.rmtree(out_dir)

              out_dir.mkdir(parents=True, exist_ok=True)
              (out_dir / ".de").mkdir(parents=True, exist_ok=True)

              stats: List[FileBinaryStats] = []
              errors: List[Dict] = []

              for path in iter_files(root, include_all):
                  try:
                      if path.stat().st_size > MAX_RAW_FILE_BYTES and not include_all:
                          continue
                      stats.append(analyze_file(path, root, out_dir))
                  except Exception as exc:
                      errors.append({
                          "sourcePath": path.relative_to(root).as_posix(),
                          "error": str(exc),
                      })

              summary = aggregate(stats)

              (out_dir / ".de" / "file-binary-stats.json").write_text(
                  json.dumps([asdict(item) for item in stats], indent=2),
                  encoding="utf-8",
              )

              binary_map = {
                  "format": "dreamengin.binary-codebase-evidence.v1",
                  "purpose": "Convert repo files into binary evidence, then apply Pascal/binomial and CLT measurements.",
                  "important": "This action does not mutate source files. It creates a downloadable zip artifact.",
                  "includeAllFiles": include_all,
                  "summary": summary,
                  "errors": errors,
              }

              (out_dir / ".de" / "dream-binary-map.json").write_text(
                  json.dumps(binary_map, indent=2),
                  encoding="utf-8",
              )

              write_report(out_dir, summary)
              zip_dir(out_dir, zip_path)

              print(f"DREAM binary evidence export created: {zip_path}")
              print(f"Files analyzed: {summary['files']}")
              print(f"Bits analyzed: {summary['bits']}")
              print(f"One ratio: {summary['oneRatio']:.8f}")
              print(f"Global fair-binary z-score: {summary['zScoreFairBinary']:.4f}")
              print(f"Pascal chi-square distance: {summary['pascalChiSquare']:.4f}")

              if errors:
                  print(f"Non-fatal read errors: {len(errors)}", file=sys.stderr)

              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 /tmp/dream_binary_export.py

      - name: Upload DREAM binary export zip
        uses: actions/upload-artifact@v4
        with:
          name: dream-binary-evidence-export
          path: dream-binary-evidence-export.zip
          if-no-files-found: error
