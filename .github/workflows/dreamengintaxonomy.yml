name: Build Repo Modelpack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-modelpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install modelpack tools
        run: |
          node -e "require('node:fs').mkdirSync('__modelpack_tools__',{recursive:true});require('node:fs').writeFileSync('__modelpack_tools__/package.json','{\"type\":\"commonjs\"}')"
          npm --prefix __modelpack_tools__ install esbuild@0.25.6 --no-package-lock --silent

      - name: Build modelpack
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { createRequire } = require("node:module");

          const ROOT = process.cwd();
          const OUT_DIR = path.join(ROOT, "__modelpack__");
          const OUT_FILE = path.join(OUT_DIR, "repo.modelpack.txt");

          const toolRequire = createRequire(path.join(ROOT, "__modelpack_tools__", "package.json"));
          const esbuild = toolRequire("esbuild");

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            ".ci",
            "ci",
            ".circleci",
            ".vscode",
            ".idea",
            "node_modules",
            ".next",
            "out",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".cache",
            "playwright-report",
            "test-results",
            "tests",
            "test",
            "__tests__",
            "__mocks__",
            "e2e",
            "cypress",
            ".storybook",
            "storybook-static",
            "scripts",
            "docs",
            "repo-visualizer",
            "optimizer",
            "public",
            "__modelpack__",
            "__modelpack_tools__"
          ]);

          const ALLOWED_TOP_DIRS = new Set([
            "app",
            "components",
            "engins",
            "engine",
            "dreamdmbar",
            "dreamr",
            "daydreams",
            "hooks",
            "coresurfaces",
            "src",
            "supabase",
            "styles",
            "types",
            "utils"
          ]);

          const CODE_LOADERS = new Map([
            [".js", "js"],
            [".jsx", "jsx"],
            [".mjs", "js"],
            [".cjs", "js"],
            [".ts", "ts"],
            [".tsx", "tsx"],
            [".mts", "ts"],
            [".cts", "ts"]
          ]);

          const CODE_EXTS = new Set([
            ".js",
            ".jsx",
            ".mjs",
            ".cjs",
            ".ts",
            ".tsx",
            ".mts",
            ".cts",
            ".css",
            ".scss",
            ".sass",
            ".sql"
          ]);

          const EXCLUDE_FILE = [
            /(^|\/).*\.md$/i,
            /(^|\/).*\.mdx$/i,
            /(^|\/).*\.txt$/i,

            /(^|\/).*\.test\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.spec\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.stories\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.story\.[cm]?[jt]sx?$/i,

            /(^|\/)index\.[cm]?[jt]sx?$/i,
            /(^|\/)index\.css$/i,
            /(^|\/)index\.scss$/i,
            /(^|\/)index\.sass$/i,

            /(^|\/)manifest\..*$/i,
            /(^|\/).*manifest.*\.[cm]?[jt]sx?$/i,
            /(^|\/).*\.manifest\..*$/i,

            /(^|\/)package\.json$/i,
            /(^|\/)package-lock\.json$/i,
            /(^|\/)pnpm-lock\.yaml$/i,
            /(^|\/)yarn\.lock$/i,
            /(^|\/)bun\.lockb$/i,

            /(^|\/)tsconfig.*\.json$/i,
            /(^|\/)jsconfig.*\.json$/i,
            /(^|\/)next\.config\..*$/i,
            /(^|\/)postcss\.config\..*$/i,
            /(^|\/)tailwind\.config\..*$/i,
            /(^|\/)eslint\.config\..*$/i,
            /(^|\/)vitest\.config\..*$/i,
            /(^|\/)playwright\.config\..*$/i,
            /(^|\/)jest\.config\..*$/i,

            /(^|\/)next-env\.d\.ts$/i,
            /(^|\/)fix-audit\.js$/i,
            /(^|\/)fix-repo\.cjs$/i,

            /(^|\/).*\.map$/i,
            /(^|\/).*\.snap$/i,
            /(^|\/).*\.log$/i,

            /(^|\/).*\.png$/i,
            /(^|\/).*\.jpg$/i,
            /(^|\/).*\.jpeg$/i,
            /(^|\/).*\.gif$/i,
            /(^|\/).*\.svg$/i,
            /(^|\/).*\.webp$/i,
            /(^|\/).*\.ico$/i,
            /(^|\/).*\.woff2?$/i,
            /(^|\/).*\.ttf$/i,
            /(^|\/).*\.otf$/i
          ];

          const IMPORT_FROM_RE = /import(?:\s+type)?(?:[\s\S]*?)\s+from\s+["']([^"']+)["']/g;
          const SIDE_EFFECT_IMPORT_RE = /import\s+["']([^"']+)["']/g;
          const DYNAMIC_IMPORT_RE = /import\s*\(\s*["']([^"']+)["']\s*\)/g;
          const EXPORT_NAMED_RE = /export\s+(?:type\s+)?(?:const|let|var|function|class|interface|type|enum)\s+([A-Za-z_$][\w$]*)/g;
          const EXPORT_DEFAULT_RE = /export\s+default(?:\s+function\s+([A-Za-z_$][\w$]*)|\s+class\s+([A-Za-z_$][\w$]*)|)/g;
          const ROUTE_METHOD_RE = /export\s+async\s+function\s+(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\b|export\s+function\s+(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\b/g;

          const SIGNALS = {
            NEXT: /from\s+['"]next\/|from\s+['"]next['"]|NextResponse|NextRequest/i,
            REACT: /from\s+['"]react['"]|useState|useEffect|useMemo|useCallback|useRef/i,
            SUPA: /supabase|serverClient|createClient/i,
            SQLDB: /\bCREATE\s+TABLE\b|\bALTER\s+TABLE\b|\bCREATE\s+POLICY\b|\bINSERT\s+INTO\b|\bCREATE\s+FUNCTION\b/i,
            AUTH: /\bauth\b|user_id|session|signIn|signOut/i,
            FETCH: /\bfetch\(|axios|NextResponse\.json/i,
            THREE_D: /@babylonjs|Scene|Vector3|Mesh/i,
            CTX: /createContext|useContext|Provider/i,
            FORM: /<form\b|<input\b|<textarea\b|<button\b|onSubmit|onClick/i,
            STYLE: /className=|style=/i,
            ENGINE: /runtime|engine|Engine|DreamSystem|DreamR/i,
            MSG: /message|conversation|chat|dm|inbox/i,
            MARKET: /stripe|checkout|ad|ads|marketplace|shop/i,
            AI: /agent|AI|model|prompt|llm|openai/i
          };

          function toPosix(value) {
            return value.split(path.sep).join("/");
          }

          function extOf(file) {
            const base = path.basename(file);
            const index = base.lastIndexOf(".");
            return index === -1 ? "" : base.slice(index).toLowerCase();
          }

          function unique(values) {
            const seen = new Set();
            const out = [];

            for (const value of values) {
              if (!seen.has(value)) {
                seen.add(value);
                out.push(value);
              }
            }

            return out;
          }

          function readMatches(regex, text) {
            regex.lastIndex = 0;

            const out = [];
            let match;

            while ((match = regex.exec(text))) {
              const value = match.slice(1).find(Boolean);
              if (value) out.push(value);
            }

            return out;
          }

          function importsFor(text) {
            return unique([
              ...readMatches(IMPORT_FROM_RE, text),
              ...readMatches(SIDE_EFFECT_IMPORT_RE, text),
              ...readMatches(DYNAMIC_IMPORT_RE, text)
            ]);
          }

          function exportsFor(text) {
            EXPORT_NAMED_RE.lastIndex = 0;
            EXPORT_DEFAULT_RE.lastIndex = 0;

            const out = [];
            let match;

            while ((match = EXPORT_NAMED_RE.exec(text))) {
              out.push(match[1]);
            }

            while ((match = EXPORT_DEFAULT_RE.exec(text))) {
              out.push(match[1] || match[2] || "default");
            }

            return unique(out);
          }

          function methodsFor(text) {
            ROUTE_METHOD_RE.lastIndex = 0;

            const out = [];
            let match;

            while ((match = ROUTE_METHOD_RE.exec(text))) {
              out.push(match[1] || match[2]);
            }

            return unique(out).sort();
          }

          function signalsFor(text) {
            return Object.entries(SIGNALS)
              .filter(([, regex]) => regex.test(text))
              .map(([name]) => name);
          }

          function lineCount(text) {
            if (text === "") return 0;
            return text.split(/\r\n|\r|\n/).length;
          }

          function roleFor(rel) {
            const file = path.posix.basename(rel);
            const ext = extOf(rel);

            if (rel.startsWith("app/") && file === "page.tsx") return "PAGE";
            if (rel.startsWith("app/") && ["layout.tsx", "template.tsx", "default.tsx"].includes(file)) return "LAYOUT";
            if (rel.startsWith("app/") && file === "loading.tsx") return "LOADING";
            if (rel.startsWith("app/") && ["error.tsx", "global-error.tsx"].includes(file)) return "ERROR";
            if (rel.startsWith("app/") && file === "not-found.tsx") return "NOT_FOUND";
            if (rel.startsWith("app/api/") && ["route.ts", "route.tsx", "route.js", "route.jsx"].includes(file)) return "API_ROUTE";
            if (["route.ts", "route.tsx", "route.js", "route.jsx"].includes(file)) return "ROUTE_HANDLER";
            if (ext === ".sql") return "SQL";
            if ([".css", ".scss", ".sass"].includes(ext)) return "STYLE";
            if (file.endsWith(".d.ts")) return "TYPE_DECLARATION";
            if ([".tsx", ".jsx"].includes(ext)) return "COMPONENT_OR_TSX";
            if (rel.includes("/hooks/") || file.startsWith("use")) return "HOOK_OR_REACT_LOGIC";
            if (rel.includes("/types/") || rel.startsWith("types/")) return "TYPE_OR_MODEL";

            return "LOGIC";
          }

          function shouldIncludeFile(full) {
            const rel = toPosix(path.relative(ROOT, full));
            const parts = rel.split("/");
            const top = parts[0];
            const ext = extOf(rel);

            if (!ALLOWED_TOP_DIRS.has(top)) return false;
            if (!CODE_EXTS.has(ext)) return false;
            if (parts.some((part) => SKIP_DIRS.has(part))) return false;
            if (parts.some((part) => part.startsWith("."))) return false;
            if (EXCLUDE_FILE.some((pattern) => pattern.test(rel))) return false;

            return true;
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (SKIP_DIRS.has(entry.name)) continue;
                walk(full, out);
              } else if (entry.isFile()) {
                if (shouldIncludeFile(full)) out.push(full);
              }
            }

            return out;
          }

          function stripSlashComments(text) {
            return text
              .split(/\r?\n/)
              .filter((line) => !line.trim().startsWith("//"))
              .join("\n");
          }

          function stripBlockComments(text) {
            return text.replace(/\/\*[\s\S]*?\*\//g, "");
          }

          function compactDts(text) {
            return stripSlashComments(stripBlockComments(text))
              .replace(/\s+/g, " ")
              .replace(/\s*([{}()[\];,:<>|&=])\s*/g, "$1")
              .trim();
          }

          function minifyCode(rel, text) {
            const ext = extOf(rel);

            if (rel.endsWith(".d.ts")) {
              return compactDts(text);
            }

            if (CODE_LOADERS.has(ext)) {
              return esbuild.transformSync(text, {
                loader: CODE_LOADERS.get(ext),
                minify: true,
                legalComments: "none",
                jsx: "preserve",
                target: "es2020",
                sourcefile: path.posix.basename(rel)
              }).code.trim();
            }

            if ([".css", ".scss", ".sass"].includes(ext)) {
              return esbuild.transformSync(text, {
                loader: "css",
                minify: true,
                legalComments: "none"
              }).code.trim();
            }

            if (ext === ".sql") {
              return stripBlockComments(text)
                .split(/\r?\n/)
                .map((line) => line.replace(/--.*$/g, "").trim())
                .filter(Boolean)
                .join(" ");
            }

            return text.trim();
          }

          function sha16(value) {
            return crypto.createHash("sha256").update(value).digest("hex").slice(0, 16);
          }

          function byteLength(value) {
            return Buffer.byteLength(value, "utf8");
          }

          fs.rmSync(OUT_DIR, { recursive: true, force: true });
          fs.mkdirSync(OUT_DIR, { recursive: true });

          const files = walk(ROOT).sort((a, b) => {
            const left = toPosix(path.relative(ROOT, a));
            const right = toPosix(path.relative(ROOT, b));
            return left.localeCompare(right);
          });

          const rows = [];

          for (const file of files) {
            const rel = toPosix(path.relative(ROOT, file));
            const raw = fs.readFileSync(file, "utf8");
            const source = minifyCode(rel, raw);

            rows.push([
              rel,
              roleFor(rel),
              byteLength(source),
              lineCount(source),
              sha16(source),
              importsFor(source),
              exportsFor(source),
              methodsFor(source),
              signalsFor(source),
              source
            ]);
          }

          fs.writeFileSync(
            OUT_FILE,
            rows.map((row) => JSON.stringify(row)).join("\n") + "\n"
          );
          NODE

      - name: Upload modelpack
        uses: actions/upload-artifact@v6
        with:
          name: repo-modelpack
          path: __modelpack__/repo.modelpack.txt
          include-hidden-files: false
          compression-level: 9
