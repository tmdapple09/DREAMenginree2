name: DREAMengin Exports JSON

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  dreamengin-exports:
    name: Generate Dreamengin.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Dreamengin.json
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const ROOT = process.cwd();
          const OUT_FILE = path.join(ROOT, "artifact", "Dreamengin.json");

          const SOURCE_EXTS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs"
          ]);

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            "node_modules",
            ".next",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".vercel",
            "public"
          ]);

          function normalize(value) {
            return String(value || "").replace(/\\/g, "/");
          }

          function relativeFile(file) {
            return normalize(path.relative(ROOT, file));
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) {
                  walk(full, out);
                }
                continue;
              }

              if (SOURCE_EXTS.has(path.extname(entry.name))) {
                out.push(full);
              }
            }

            return out;
          }

          function lineNumberAt(text, index) {
            return String(text || "").slice(0, index).split(/\r?\n/).length;
          }

          function splitTopLevelComma(value) {
            const input = String(value || "");
            const parts = [];
            let current = "";
            let depth = 0;
            let quote = null;

            for (let i = 0; i < input.length; i += 1) {
              const char = input[i];
              const next = input[i + 1];

              if (quote) {
                current += char;

                if (char === "\\" && next) {
                  current += next;
                  i += 1;
                  continue;
                }

                if (char === quote) {
                  quote = null;
                }

                continue;
              }

              if (char === "'" || char === '"' || char === "`") {
                quote = char;
                current += char;
                continue;
              }

              if (char === "{" || char === "(" || char === "[") {
                depth += 1;
              }

              if (char === "}" || char === ")" || char === "]") {
                depth = Math.max(0, depth - 1);
              }

              if (char === "," && depth === 0) {
                if (current.trim()) {
                  parts.push(current.trim());
                }

                current = "";
                continue;
              }

              current += char;
            }

            if (current.trim()) {
              parts.push(current.trim());
            }

            return parts;
          }

          function cleanExportName(value) {
            return String(value || "")
              .replace(/^type\s+/, "")
              .trim();
          }

          function parseNamedExportBlock(block) {
            return splitTopLevelComma(block)
              .map((part) => cleanExportName(part))
              .filter(Boolean)
              .map((part) => {
                const pieces = part.split(/\s+as\s+/);
                return (pieces[1] || pieces[0] || "").trim();
              })
              .filter(Boolean);
          }

          function addExport(exports, name, file, line) {
            if (!name) return;

            exports.push({
              export: name,
              file,
              line
            });
          }

          function parseExports(filePath) {
            const text = fs.readFileSync(filePath, "utf8");
            const file = relativeFile(filePath);
            const exports = [];
            let match;

            const exportNamespaceRegex =
              /^\s*export\s+\*\s+as\s+([A-Za-z_$][A-Za-z0-9_$]*)\s+from\s+["']([^"']+)["']\s*;?/gm;

            while ((match = exportNamespaceRegex.exec(text))) {
              addExport(exports, match[1], file, lineNumberAt(text, match.index));
            }

            const namedExportRegex =
              /^\s*export\s+(type\s+)?\{([\s\S]*?)\}\s*(?:from\s+["']([^"']+)["'])?\s*;?/gm;

            while ((match = namedExportRegex.exec(text))) {
              for (const name of parseNamedExportBlock(match[2])) {
                addExport(exports, name, file, lineNumberAt(text, match.index));
              }
            }

            const functionRegex =
              /^\s*export\s+(?:declare\s+)?(?:async\s+)?function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/gm;

            while ((match = functionRegex.exec(text))) {
              addExport(exports, match[1], file, lineNumberAt(text, match.index));
            }

            const classRegex =
              /^\s*export\s+(?:declare\s+)?(?:abstract\s+)?class\s+([A-Za-z_$][A-Za-z0-9_$]*)\b/gm;

            while ((match = classRegex.exec(text))) {
              addExport(exports, match[1], file, lineNumberAt(text, match.index));
            }

            const typeRegex =
              /^\s*export\s+type\s+([A-Za-z_$][A-Za-z0-9_$]*)\b/gm;

            while ((match = typeRegex.exec(text))) {
              addExport(exports, match[1], file, lineNumberAt(text, match.index));
            }

            const interfaceRegex =
              /^\s*export\s+(?:declare\s+)?interface\s+([A-Za-z_$][A-Za-z0-9_$]*)\b/gm;

            while ((match = interfaceRegex.exec(text))) {
              addExport(exports, match[1], file, lineNumberAt(text, match.index));
            }

            const enumRegex =
              /^\s*export\s+(?:declare\s+)?(?:const\s+)?enum\s+([A-Za-z_$][A-Za-z0-9_$]*)\b/gm;

            while ((match = enumRegex.exec(text))) {
              addExport(exports, match[1], file, lineNumberAt(text, match.index));
            }

            const variableRegex =
              /^\s*export\s+(?:declare\s+)?(?:const|let|var)\s+([\s\S]*?)(?:;|\n)/gm;

            while ((match = variableRegex.exec(text))) {
              const block = match[1];

              for (const part of splitTopLevelComma(block)) {
                const nameMatch = part.match(/^\s*([A-Za-z_$][A-Za-z0-9_$]*)\b/);

                if (!nameMatch) continue;

                addExport(exports, nameMatch[1], file, lineNumberAt(text, match.index));
              }
            }

            const defaultFunctionRegex =
              /^\s*export\s+default\s+(?:async\s+)?function(?:\s+[A-Za-z_$][A-Za-z0-9_$]*)?\s*\(/gm;

            while ((match = defaultFunctionRegex.exec(text))) {
              addExport(exports, "default", file, lineNumberAt(text, match.index));
            }

            const defaultClassRegex =
              /^\s*export\s+default\s+(?:abstract\s+)?class(?:\s+[A-Za-z_$][A-Za-z0-9_$]*)?/gm;

            while ((match = defaultClassRegex.exec(text))) {
              addExport(exports, "default", file, lineNumberAt(text, match.index));
            }

            const defaultExpressionRegex =
              /^\s*export\s+default\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*;?/gm;

            while ((match = defaultExpressionRegex.exec(text))) {
              const local = match[1];

              if (local === "function" || local === "class") continue;

              addExport(exports, "default", file, lineNumberAt(text, match.index));
            }

            return exports;
          }

          function uniqueLocations(locations) {
            const seen = new Set();
            const out = [];

            for (const location of locations) {
              const key = `${location.file}:${location.line}`;

              if (seen.has(key)) continue;

              seen.add(key);

              out.push({
                file: location.file,
                line: location.line
              });
            }

            return out.sort((a, b) =>
              a.file.localeCompare(b.file) || a.line - b.line
            );
          }

          function exportNameOrder(a, b) {
            return (
              Array.from(a).length - Array.from(b).length ||
              a.toLowerCase().localeCompare(b.toLowerCase()) ||
              a.localeCompare(b)
            );
          }

          const files = walk(ROOT).sort();
          const found = [];

          for (const file of files) {
            found.push(...parseExports(file));
          }

          const grouped = new Map();

          for (const item of found) {
            if (!grouped.has(item.export)) {
              grouped.set(item.export, []);
            }

            grouped.get(item.export).push({
              file: item.file,
              line: item.line
            });
          }

          const output = {};
          let index = 1;

          for (const [exportName, locations] of [...grouped.entries()].sort(([a], [b]) => exportNameOrder(a, b))) {
            output[`D${index}`] = {
              export: exportName,
              locations: uniqueLocations(locations)
            };

            index += 1;
          }

          fs.writeFileSync(OUT_FILE, JSON.stringify(output, null, 2));
          console.log(`Wrote ${OUT_FILE}`);
          NODE

      - name: Upload Dreamengin.json
        uses: actions/upload-artifact@v6
        with:
          name: Dreamengin-json
          path: artifact/Dreamengin.json
          if-no-files-found: error
