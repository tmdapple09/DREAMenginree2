name: DREAMengin Vocabulary JSON

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  dreamengin-vocabulary:
    name: Generate canonical DREAMengin vocabulary map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Dreamengin.json
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const ROOT = process.cwd();
          const OUT_FILE = path.join(ROOT, "artifact", "Dreamengin.json");

          const SOURCE_FILE_EXTENSIONS = new Set([
            ".ts",
            ".tsx",
            ".js",
            ".jsx",
            ".mjs",
            ".cjs"
          ]);

          const NON_CODE_IMPORT_EXTENSIONS = new Set([
            ".css",
            ".scss",
            ".sass",
            ".less",
            ".png",
            ".jpg",
            ".jpeg",
            ".gif",
            ".svg",
            ".webp",
            ".ico",
            ".json",
            ".md",
            ".txt",
            ".wasm",
            ".woff",
            ".woff2",
            ".ttf",
            ".otf"
          ]);

          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            "node_modules",
            ".next",
            "dist",
            "build",
            "coverage",
            ".turbo",
            ".vercel",
            "public"
          ]);

          const EXTERNAL_PROGRAMMING_IMPORTS = new Set([
            "typescript",
            "tslib",

            "react",
            "react-dom",

            "next",
            "next/link",
            "next/navigation",
            "next/image",
            "next/dynamic",
            "next/server",

            "zod",
            "lucide-react",
            "clsx",
            "tailwind-merge",
            "zustand",
            "framer-motion",
            "three",
            "@react-three/fiber",
            "@react-three/drei",
            "@supabase/supabase-js",

            "fs",
            "node:fs",
            "path",
            "node:path",
            "crypto",
            "node:crypto",
            "url",
            "node:url",
            "util",
            "node:util",
            "stream",
            "node:stream",
            "buffer",
            "node:buffer",
            "events",
            "node:events",
            "os",
            "node:os",
            "process",
            "node:process"
          ]);

          const DREAMENGIN_ROOTS = [
            "@/app/",
            "@/components/",
            "@/engine/",
            "@/engins/",
            "@/lib/",
            "@/hooks/",
            "@/dreamr/",
            "@/dreamdmbar/",
            "@/daydreams/",
            "@/coresurfaces/",
            "@/assembly/",
            "@/types/",
            "@/utils/",
            "@/styles/",

            "app/",
            "components/",
            "engine/",
            "engins/",
            "lib/",
            "hooks/",
            "dreamr/",
            "dreamdmbar/",
            "daydreams/",
            "coresurfaces/",
            "assembly/",
            "types/",
            "utils/",
            "styles/"
          ];

          function normalizePath(value) {
            return String(value || "").replace(/\\/g, "/");
          }

          function characterCount(value) {
            return Array.from(String(value || "")).length;
          }

          function isValidIdentifier(value) {
            return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(String(value || ""));
          }

          function quoteSource(source) {
            return `"${source}"`;
          }

          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) {
                  walk(full, files);
                }
                continue;
              }

              if (SOURCE_FILE_EXTENSIONS.has(path.extname(entry.name))) {
                files.push(full);
              }
            }

            return files;
          }

          function hasNonCodeImportExtension(source) {
            const cleanSource = source.split("?")[0].split("#")[0];
            const ext = path.extname(cleanSource);
            return NON_CODE_IMPORT_EXTENSIONS.has(ext);
          }

          function isExternalPackage(source) {
            if (!source) return false;
            if (source.startsWith(".") || source.startsWith("@/")) return false;
            if (DREAMENGIN_ROOTS.some((root) => source.startsWith(root))) return false;
            return true;
          }

          function isDreamenginImport(source) {
            if (!source) return false;
            if (hasNonCodeImportExtension(source)) return false;
            if (EXTERNAL_PROGRAMMING_IMPORTS.has(source)) return false;

            const lower = source.toLowerCase();

            if (source.startsWith("./") || source.startsWith("../")) return true;
            if (DREAMENGIN_ROOTS.some((root) => source.startsWith(root))) return true;
            if (lower.includes("dream")) return true;
            if (lower.includes("engin")) return true;

            return false;
          }

          function cleanImportedName(name) {
            return String(name || "")
              .replace(/^type\s+/, "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function splitNamedImports(namedBlock) {
            return String(namedBlock || "")
              .split(",")
              .map((raw) => raw.trim())
              .filter(Boolean)
              .map((raw) => {
                const isTypeSpecifier = raw.startsWith("type ");
                const item = cleanImportedName(raw);
                const parts = item.split(/\s+as\s+/);

                return {
                  importShape: "named",
                  imported: parts[0].trim(),
                  local: (parts[1] || parts[0]).trim(),
                  specifierKind: isTypeSpecifier ? "type" : "value"
                };
              })
              .filter((item) => item.imported && item.local);
          }

          function extractImportNames(rawImport) {
            const names = [];
            const cleaned = String(rawImport || "").trim();

            if (!cleaned) return names;

            if (cleaned.startsWith("{")) {
              const named = cleaned.replace(/^\{/, "").replace(/\}$/, "");
              return splitNamedImports(named);
            }

            if (cleaned.startsWith("* as ")) {
              const local = cleaned.replace("* as ", "").trim();

              return [
                {
                  importShape: "namespace",
                  imported: "*",
                  local,
                  specifierKind: "value"
                }
              ];
            }

            if (cleaned.includes("{")) {
              const defaultPart = cleaned.split(",")[0].trim();

              if (defaultPart) {
                names.push({
                  importShape: "default",
                  imported: "default",
                  local: cleanImportedName(defaultPart),
                  specifierKind: "value"
                });
              }

              const namedMatch = cleaned.match(/\{([\s\S]*?)\}/);

              if (namedMatch) {
                names.push(...splitNamedImports(namedMatch[1]));
              }

              return names;
            }

            return [
              {
                importShape: "default",
                imported: "default",
                local: cleanImportedName(cleaned),
                specifierKind: "value"
              }
            ];
          }

          function canonicalVocabularyText(localName, importedName, source) {
            const local = String(localName || "").trim();
            const imported = String(importedName || "").trim();

            if (imported && imported !== "default" && imported !== "*") {
              return imported;
            }

            if (local) {
              return local;
            }

            return source;
          }

          function classifySymbol(vocabularyText, localName, importedName, source) {
            const text = String(vocabularyText || "");
            const local = String(localName || "");
            const imported = String(importedName || "");
            const value = `${text} ${local} ${imported} ${source}`.toLowerCase();

            if (/^(d\d+|op\d+|opcode|opcodes)$/.test(text.toLowerCase())) {
              return "opCode";
            }

            if (
              value.includes("opcode") ||
              value.includes("operationcode") ||
              value.includes("commandcode")
            ) {
              return "opCode";
            }

            if (
              value.includes("mountengine") ||
              value.includes("applyruleset") ||
              value.includes("dispatch") ||
              value.includes("routeintent") ||
              value.includes("authorize") ||
              value.includes("validate") ||
              value.includes("negotiate") ||
              value.includes("syncframe") ||
              value.includes("snapshot") ||
              value.includes("hydrate") ||
              value.includes("persist") ||
              value.includes("registerengin") ||
              value.includes("runtimemount") ||
              value.includes("engincall")
            ) {
              return "systemCall";
            }

            if (
              value.includes("primitive") ||
              value.includes("ruleset") ||
              value.includes("rule-set") ||
              value.includes("constraint") ||
              value.includes("domainobject") ||
              value.includes("basestate") ||
              value.includes("manifest") ||
              value.includes("packet") ||
              value.includes("frame")
            ) {
              return "primitive";
            }

            if (
              value.includes("lifecycle") ||
              value.includes("onmount") ||
              value.includes("oncreate") ||
              value.includes("ondestroy") ||
              value.includes("onupdate") ||
              value.includes("before") ||
              value.includes("after")
            ) {
              return "lifecycleHook";
            }

            if (
              value.includes("entry") ||
              value.includes("page") ||
              value.includes("surface") ||
              value.includes("shell") ||
              value.includes("container") ||
              value.includes("registry") ||
              value.includes("route")
            ) {
              return "entryPoint";
            }

            if (text.startsWith("use") || value.includes("hook")) {
              return "hook";
            }

            if (
              value.includes("runtime") ||
              value.includes("engine") ||
              value.includes("engin") ||
              value.includes("dispatcher") ||
              value.includes("bridge") ||
              value.includes("bus")
            ) {
              return "engineRuntime";
            }

            if (
              value.includes("store") ||
              value.includes("state") ||
              value.includes("memory") ||
              value.includes("queue") ||
              value.includes("cache")
            ) {
              return "stateMemory";
            }

            if (
              /^[A-Z]/.test(text) ||
              value.includes("component") ||
              value.includes("panel") ||
              value.includes("view") ||
              value.includes("viewport") ||
              value.includes("card") ||
              value.includes("bar")
            ) {
              return "component";
            }

            return "dreamenginSpecific";
          }

          function parseImports(filePath, text) {
            const imports = [];

            const importFromRegex =
              /import\s+(type\s+)?([\s\S]*?)\s+from\s+["']([^"']+)["'];?/g;

            const sideEffectImportRegex =
              /import\s+["']([^"']+)["'];?/g;

            let match;

            while ((match = importFromRegex.exec(text))) {
              const isWholeImportTypeOnly = Boolean(match[1]);
              const rawImport = match[2].trim();
              const source = normalizePath(match[3].trim());

              if (!isDreamenginImport(source)) continue;

              if (
                isExternalPackage(source) &&
                !source.toLowerCase().includes("dream") &&
                !source.toLowerCase().includes("engin")
              ) {
                continue;
              }

              const importedNames = extractImportNames(rawImport).map((item) => ({
                ...item,
                importKind: isWholeImportTypeOnly || item.specifierKind === "type" ? "type" : "value"
              }));

              imports.push({
                file: normalizePath(path.relative(ROOT, filePath)),
                source,
                rawImport,
                importKind: isWholeImportTypeOnly ? "type" : "value",
                importedNames
              });
            }

            while ((match = sideEffectImportRegex.exec(text))) {
              const source = normalizePath(match[1].trim());

              if (!isDreamenginImport(source)) continue;

              if (
                isExternalPackage(source) &&
                !source.toLowerCase().includes("dream") &&
                !source.toLowerCase().includes("engin")
              ) {
                continue;
              }

              imports.push({
                file: normalizePath(path.relative(ROOT, filePath)),
                source,
                rawImport: null,
                importKind: "sideEffect",
                importedNames: []
              });
            }

            return imports;
          }

          function makeAliasImportLine({ code, source, importShape, importedName, importKind }) {
            const prefix = importKind === "type" ? "import type" : "import";

            if (importShape === "named") {
              if (importedName === code) {
                return `${prefix} { ${importedName} } from ${quoteSource(source)};`;
              }

              return `${prefix} { ${importedName} as ${code} } from ${quoteSource(source)};`;
            }

            if (importShape === "default") {
              return `${prefix} ${code} from ${quoteSource(source)};`;
            }

            if (importShape === "namespace") {
              return `${prefix} * as ${code} from ${quoteSource(source)};`;
            }

            return null;
          }

          function makeOriginalImportLine({ source, importShape, importedName, localName, importKind }) {
            const prefix = importKind === "type" ? "import type" : "import";

            if (importShape === "named") {
              if (importedName === localName) {
                return `${prefix} { ${importedName} } from ${quoteSource(source)};`;
              }

              return `${prefix} { ${importedName} as ${localName} } from ${quoteSource(source)};`;
            }

            if (importShape === "default") {
              return `${prefix} ${localName} from ${quoteSource(source)};`;
            }

            if (importShape === "namespace") {
              return `${prefix} * as ${localName} from ${quoteSource(source)};`;
            }

            return `import ${quoteSource(source)};`;
          }

          function uniqueSortedArray(values) {
            return [...new Set(values)].sort();
          }

          function compareCode(a, b) {
            return String(a).localeCompare(String(b), undefined, { numeric: true });
          }

          function compareVocabularyEntry(a, b) {
            return (
              a.characterCount - b.characterCount ||
              a.vocabularyText.toLowerCase().localeCompare(b.vocabularyText.toLowerCase()) ||
              a.vocabularyText.localeCompare(b.vocabularyText)
            );
          }

          function compareUsage(a, b) {
            return (
              a.file.localeCompare(b.file) ||
              a.source.localeCompare(b.source) ||
              a.importShape.localeCompare(b.importShape) ||
              String(a.importedName || "").localeCompare(String(b.importedName || "")) ||
              String(a.localName || "").localeCompare(String(b.localName || "")) ||
              a.importKind.localeCompare(b.importKind)
            );
          }

          const files = walk(ROOT).sort();
          const importRecords = [];

          for (const file of files) {
            const text = fs.readFileSync(file, "utf8");
            importRecords.push(...parseImports(file, text));
          }

          const vocabularyMap = new Map();
          let rawDreamenginSymbolOccurrences = 0;

          for (const record of importRecords) {
            if (record.importedNames.length === 0) {
              rawDreamenginSymbolOccurrences += 1;

              const vocabularyText = record.source;
              const category = "sideEffectImport";
              const key = vocabularyText;

              if (!vocabularyMap.has(key)) {
                vocabularyMap.set(key, {
                  vocabularyText,
                  characterCount: characterCount(vocabularyText),
                  categories: new Set(),
                  sources: new Set(),
                  importedNames: new Set(),
                  localNames: new Set(),
                  importKinds: new Set(),
                  importShapes: new Set(),
                  usedBy: new Set(),
                  usages: [],
                  usageCount: 0
                });
              }

              const item = vocabularyMap.get(key);

              item.categories.add(category);
              item.sources.add(record.source);
              item.importKinds.add("sideEffect");
              item.importShapes.add("sideEffect");
              item.usedBy.add(record.file);
              item.usageCount += 1;

              item.usages.push({
                file: record.file,
                source: record.source,
                importKind: "sideEffect",
                importShape: "sideEffect",
                category,
                importedName: null,
                localName: null,
                originalImportLine: `import ${quoteSource(record.source)};`,
                aliasImportLine: null,
                replacement: {
                  canAlias: false,
                  reason: "Side-effect imports do not create a local binding."
                }
              });

              continue;
            }

            for (const importedName of record.importedNames) {
              rawDreamenginSymbolOccurrences += 1;

              const vocabularyText = canonicalVocabularyText(
                importedName.local,
                importedName.imported,
                record.source
              );

              const category = classifySymbol(
                vocabularyText,
                importedName.local,
                importedName.imported,
                record.source
              );

              const key = vocabularyText;

              if (!vocabularyMap.has(key)) {
                vocabularyMap.set(key, {
                  vocabularyText,
                  characterCount: characterCount(vocabularyText),
                  categories: new Set(),
                  sources: new Set(),
                  importedNames: new Set(),
                  localNames: new Set(),
                  importKinds: new Set(),
                  importShapes: new Set(),
                  usedBy: new Set(),
                  usages: [],
                  usageCount: 0
                });
              }

              const item = vocabularyMap.get(key);

              item.categories.add(category);
              item.sources.add(record.source);
              item.importedNames.add(importedName.imported);
              item.localNames.add(importedName.local);
              item.importKinds.add(importedName.importKind);
              item.importShapes.add(importedName.importShape);
              item.usedBy.add(record.file);
              item.usageCount += 1;

              item.usages.push({
                file: record.file,
                source: record.source,
                importKind: importedName.importKind,
                importShape: importedName.importShape,
                category,
                importedName: importedName.imported,
                localName: importedName.local,
                originalImportLine: makeOriginalImportLine({
                  source: record.source,
                  importShape: importedName.importShape,
                  importedName: importedName.imported,
                  localName: importedName.local,
                  importKind: importedName.importKind
                }),
                replacement: {
                  canAlias: true,
                  replaceIdentifier: importedName.local,
                  withIdentifier: null,
                  requires: [
                    "Alias the import binding to the D-code.",
                    "Replace references to the old local identifier inside that file."
                  ]
                }
              });
            }
          }

          const sortedVocabulary = [...vocabularyMap.values()]
            .map((item) => ({
              vocabularyText: item.vocabularyText,
              characterCount: item.characterCount,
              categories: uniqueSortedArray([...item.categories]),
              sources: uniqueSortedArray([...item.sources]),
              importedNames: uniqueSortedArray([...item.importedNames]),
              localNames: uniqueSortedArray([...item.localNames]),
              importKinds: uniqueSortedArray([...item.importKinds]),
              importShapes: uniqueSortedArray([...item.importShapes]),
              usedBy: uniqueSortedArray([...item.usedBy]),
              usageCount: item.usageCount,
              usages: item.usages.sort(compareUsage)
            }))
            .sort(compareVocabularyEntry);

          const dreamCodeList = sortedVocabulary.map((item, index) => {
            const code = `D${index + 1}`;
            const codeCharacterCount = characterCount(code);
            const textCharacterCount = item.characterCount;
            const compressionGain = textCharacterCount - codeCharacterCount;

            const usages = item.usages.map((usage) => {
              if (!usage.replacement.canAlias) {
                return {
                  ...usage,
                  aliasImportLine: null,
                  replacement: {
                    ...usage.replacement,
                    withIdentifier: null
                  }
                };
              }

              return {
                ...usage,
                aliasImportLine: makeAliasImportLine({
                  code,
                  source: usage.source,
                  importShape: usage.importShape,
                  importedName: usage.importedName,
                  importKind: usage.importKind
                }),
                replacement: {
                  ...usage.replacement,
                  withIdentifier: code
                }
              };
            });

            const aliasMap = new Map();

            for (const usage of usages) {
              if (!usage.aliasImportLine) continue;

              const aliasKey = [
                usage.source,
                usage.importKind,
                usage.importShape,
                usage.importedName,
                usage.aliasImportLine
              ].join("::");

              if (!aliasMap.has(aliasKey)) {
                aliasMap.set(aliasKey, {
                  source: usage.source,
                  importKind: usage.importKind,
                  importShape: usage.importShape,
                  importedName: usage.importedName,
                  code,
                  aliasImportLine: usage.aliasImportLine,
                  originalLocalNames: new Set(),
                  usedBy: new Set()
                });
              }

              const alias = aliasMap.get(aliasKey);

              if (usage.localName) {
                alias.originalLocalNames.add(usage.localName);
              }

              alias.usedBy.add(usage.file);
            }

            const aliases = [...aliasMap.values()]
              .map((alias) => ({
                source: alias.source,
                importKind: alias.importKind,
                importShape: alias.importShape,
                importedName: alias.importedName,
                code: alias.code,
                aliasImportLine: alias.aliasImportLine,
                originalLocalNames: uniqueSortedArray([...alias.originalLocalNames]),
                usedBy: uniqueSortedArray([...alias.usedBy])
              }))
              .sort((a, b) =>
                a.source.localeCompare(b.source) ||
                a.importKind.localeCompare(b.importKind) ||
                a.importShape.localeCompare(b.importShape) ||
                String(a.importedName || "").localeCompare(String(b.importedName || ""))
              );

            return {
              code,
              identifier: code,
              vocabularyText: item.vocabularyText,
              characterCount: item.characterCount,
              codeCharacterCount,
              textCharacterCount,
              compressionGain,
              codeIsShorter: compressionGain > 0,
              validCodeIdentifier: isValidIdentifier(code),
              categories: item.categories,
              sources: item.sources,
              importedNames: item.importedNames,
              localNames: item.localNames,
              importKinds: item.importKinds,
              importShapes: item.importShapes,
              usedBy: item.usedBy,
              usageCount: item.usageCount,
              aliasReady: aliases.length > 0,
              aliases,
              usages
            };
          });

          const dreamCodes = Object.fromEntries(
            dreamCodeList.map((item) => [item.code, item])
          );

          const dreamCodeText = Object.fromEntries(
            dreamCodeList.map((item) => [item.code, item.vocabularyText])
          );

          const vocabularyTextToCode = Object.fromEntries(
            dreamCodeList.map((item) => [item.vocabularyText, item.code])
          );

          const importAliases = Object.fromEntries(
            dreamCodeList.map((item) => [item.code, item.aliases])
          );

          const byCharacterCount = {};
          const byCategory = {};
          const bySource = {};
          const byFile = {};
          const byImportKind = {};
          const byImportShape = {};
          const replacementReadyCodes = [];
          const notShorterCodes = [];

          for (const item of dreamCodeList) {
            const lengthKey = String(item.characterCount);

            byCharacterCount[lengthKey] ||= [];
            byCharacterCount[lengthKey].push(item.code);

            for (const category of item.categories) {
              byCategory[category] ||= [];
              byCategory[category].push(item.code);
            }

            for (const source of item.sources) {
              bySource[source] ||= [];
              bySource[source].push(item.code);
            }

            for (const file of item.usedBy) {
              byFile[file] ||= [];
              byFile[file].push(item.code);
            }

            for (const importKind of item.importKinds) {
              byImportKind[importKind] ||= [];
              byImportKind[importKind].push(item.code);
            }

            for (const importShape of item.importShapes) {
              byImportShape[importShape] ||= [];
              byImportShape[importShape].push(item.code);
            }

            if (item.aliasReady) {
              replacementReadyCodes.push(item.code);
            }

            if (!item.codeIsShorter) {
              notShorterCodes.push(item.code);
            }
          }

          const finalByCharacterCount = Object.fromEntries(
            Object.entries(byCharacterCount)
              .sort(([a], [b]) => Number(a) - Number(b))
              .map(([count, codes]) => [count, codes.sort(compareCode)])
          );

          const finalByCategory = Object.fromEntries(
            Object.entries(byCategory)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([category, codes]) => [category, codes.sort(compareCode)])
          );

          const finalBySource = Object.fromEntries(
            Object.entries(bySource)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([source, codes]) => [source, codes.sort(compareCode)])
          );

          const finalByFile = Object.fromEntries(
            Object.entries(byFile)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([file, codes]) => [file, codes.sort(compareCode)])
          );

          const finalByImportKind = Object.fromEntries(
            Object.entries(byImportKind)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([kind, codes]) => [kind, codes.sort(compareCode)])
          );

          const finalByImportShape = Object.fromEntries(
            Object.entries(byImportShape)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([shape, codes]) => [shape, codes.sort(compareCode)])
          );

          const output = {
            schema: "dreamengin.vocabulary.codebook.v1",
            generatedAt: new Date().toISOString(),

            purpose:
