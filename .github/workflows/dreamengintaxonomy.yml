name: DREAMengin Exports JSON

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  dreamengin-exports:
    name: Generate Dreamengin.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate DREAMengin export JSON files
